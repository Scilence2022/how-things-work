<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : (v !== '0' && v !== 'false'); };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);
  // ghost 机架底板/刻度：浅色背景下需加深才能看清（小改动，非语义色）
  M.ghost.color.set(THEME === 'light' ? 0x46536a : 0x93a1b5);
  M.ghost.opacity = THEME === 'light' ? 0.16 : 0.13;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('棘轮与棘爪 —— 单向离合为什么会“只进不退”',
                     'Ratchet & Pawl — Why a One-Way Clutch Never Slips Back');
  buildSteps();
  syncRev();
  setPlayLabel();
  for (const it of labelTexts) it.o.element.textContent = L(it.zh, it.en);
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：机构几何与时序 ---------------- */
const CYCLE_SECONDS = 5.0;                 // 一个周期（1× 速度）
const D2R = Math.PI / 180;
const N_TEETH = 16, PITCH = 360 / N_TEETH; // 22.5° 齿距角
const R_TIP = 1.5, R_ROOT = 1.26;          // 齿顶 / 齿根半径
const WHEEL_T = 0.25;                      // 轮厚
const RAMP_DEG = 18.6, WALL_DEG = PITCH - RAMP_DEG;  // 缓坡 ~19°（爪滑过）/ 陡面 ~3.9° 弦（≈70° 陡坡，顶住）
const ARM_PIV = { x: 0, y: 2.66 };         // 摆臂铰点
const ARM_LEN = 1.4, ARM_AMP = 24;         // 臂长 / 半摆幅（度）
const T_BACK = 0.08;                       // 推程起步 8%：消除间隙
const REST_ROOT = 5 * PITCH;               // 112.5°：爪尖止动位所在齿槽（轮系坐标，s=0 时该齿根在世界 112.5°）
const U_REST = 0.45;                       // 静止时爪尖在陡面上的位置（0=齿尖角，1=齿根角）
const PHI0 = -(1 - U_REST) * WALL_DEG;     // 爪尖相对齿根的相位（负=在上一枚陡面上）
const Z_TIP = 0.30, Z_ARM = 0.31;          // 爪尖/摆臂所在前层
const HOLD_PIV = { x: 1.86, y: -1.07 };    // 止回爪铰点（机架，右下）
const HOLD_LEN = 0.783;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const dirD = (deg) => ({ x: Math.cos(deg * D2R), y: Math.sin(deg * D2R) });
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 运动学：纯函数状态机（t, 周期数, 反向? → 全部状态） ----------------
   摆臂角  a(t)  = ±24°·cos(2πt)          （推程 [0,.5) 左推，回程 [.5,1) 右摆）
   轮转角  Θ    = 22.5°·(周期数 + s(t))    s: 0（间隙段）→ 随臂线性映射到 1（锁定）→ 保持 1（回程被止回爪锁死）
   驱动爪  推程：爪尖贴着轮齿轮廓爬坡→顶陡面（接触点=轮廓上的纯函数点）
           回程：爪绕销轴张开 ψ→180°，爪尖抬离齿顶滑回，92% 后落座回弹
   反向模式：摆臂镜像摆动，爪全程张开 175° 掠过齿顶，轮完全不动                          */
function armAngleDeg(t, rev) { const a = ARM_AMP * Math.cos(2 * Math.PI * t); return rev ? -a : a; }
function armEnd(aDeg) { const a = aDeg * D2R;
  return { x: ARM_PIV.x + ARM_LEN * Math.sin(a), y: ARM_PIV.y - ARM_LEN * Math.cos(a) }; }
function wheelAdvance(t, rev) {                    // 一个周期内轮前进的齿距角比例 0→1
  if (rev) return 0;
  if (t < T_BACK) return 0;
  if (t < 0.5) { const a0 = ARM_AMP * Math.cos(2 * Math.PI * T_BACK);
    return (a0 - ARM_AMP * Math.cos(2 * Math.PI * t)) / (a0 + ARM_AMP); }
  return 1;
}
function profileR(phi) {                           // 轮齿轮廓半径（phi: 相对某齿根的角度，度）
  let p = ((phi % PITCH) + PITCH) % PITCH;
  return p < RAMP_DEG ? R_ROOT + (R_TIP - R_ROOT) * p / RAMP_DEG
                      : R_TIP - (R_TIP - R_ROOT) * (p - RAMP_DEG) / WALL_DEG;
}
function profilePoint(phiFrame, thetaDeg, z) {     // 轮系角 phiFrame + 轮转角 → 世界点
  const r = profileR(phiFrame), a = (phiFrame + thetaDeg) * D2R;
  return V3(r * Math.cos(a), r * Math.sin(a), z);
}
const psiFromTip = (tip, C) => Math.atan2(tip.y - C.y, tip.x - C.x) / D2R;
function tipFromPsi(C, psiDeg, len) { const d = dirD(psiDeg);
  return V3(C.x + len * d.x, C.y + len * d.y, Z_TIP); }
function psiReturnDeg(t, psiRest, psiEnd) {
  if (t < 0.565) return lerp(psiEnd, 180, ss(0.5, 0.565, t));   // 张开脱钩
  if (t < 0.90)  return 180;                                    // 抬着滑回
  if (t < 0.955) return lerp(180, psiRest, ss(0.90, 0.955, t)); // 落入齿槽
  const u = t - 0.955;                                          // “嗒”回弹
  return psiRest + 1.7 * Math.sin(u * 62) * Math.exp(-u * 17);
}
function stateAt(t, cyc, rev, psiRest, psiEnd, Lp) {
  const aDeg = armAngleDeg(t, rev);
  const C = armEnd(aDeg);
  const adv = wheelAdvance(t, rev);
  const thetaDeg = PITCH * (cyc + adv);
  let tip, psi, mode;
  if (rev) { psi = 175; tip = tipFromPsi(C, psi, Lp); mode = 'slide'; }
  else if (t < 0.5) {
    tip = profilePoint(REST_ROOT + PHI0 + PITCH * adv, thetaDeg, Z_TIP);
    psi = psiFromTip(tip, C);
    mode = t < T_BACK ? 'rest' : 'drive';
  } else {
    psi = psiReturnDeg(t, psiRest, psiEnd);
    tip = tipFromPsi(C, psi, Lp);
    mode = t < 0.90 ? 'slide' : 'seat';
  }
  return { aDeg, C, thetaDeg, adv, tip, psi, mode };
}
// 止回爪：弹簧压向轮 → 爪尖在可达圆上寻找与齿轮廓的接触点（二分求解，纯函数）
function holdState(thetaDeg) {
  const g = psi => { const d = dirD(psi);
    const x = HOLD_PIV.x + HOLD_LEN * d.x, y = HOLD_PIV.y + HOLD_LEN * d.y;
    return Math.hypot(x, y) - profileR(Math.atan2(y, x) / D2R - thetaDeg); };
  let lo = 104, hi = 170;
  if (g(lo) <= 0) { const d = dirD(lo);
    return { psi: lo, tip: V3(HOLD_PIV.x + HOLD_LEN * d.x, HOLD_PIV.y + HOLD_LEN * d.y, Z_TIP) }; }
  let hit = false;
  for (let p = 105; p <= 170; p++) { if (g(p) <= 0) { lo = p - 1; hi = p; hit = true; break; } }
  if (!hit) { const d = dirD(140);
    return { psi: 140, tip: V3(HOLD_PIV.x + HOLD_LEN * d.x, HOLD_PIV.y + HOLD_LEN * d.y, Z_TIP) }; }
  for (let i = 0; i < 26; i++) { const m = 0.5 * (lo + hi); if (g(m) <= 0) hi = m; else lo = m; }
  const psi = 0.5 * (lo + hi), d = dirD(psi);
  return { psi, tip: V3(HOLD_PIV.x + HOLD_LEN * d.x, HOLD_PIV.y + HOLD_LEN * d.y, Z_TIP) };
}

/* 静止/推程末端关键位形（由状态机反解，保证周期无缝衔接）。
   注意把 atan2 的负角归一化到 (0°, 360°]，否则回程插值会绕错方向 */
const norm360 = (d) => ((d % 360) + 360) % 360;
const T_REST = profilePoint(REST_ROOT + PHI0, 0, Z_TIP);
const C_TOP  = armEnd(ARM_AMP), C_BOT = armEnd(-ARM_AMP);
const L_PAWL  = Math.hypot(T_REST.x - C_TOP.x, T_REST.y - C_TOP.y);
const PSI_REST = norm360(psiFromTip(T_REST, C_TOP));
const T_END  = profilePoint(REST_ROOT + PHI0 + PITCH, PITCH, Z_TIP);
const PSI_END  = norm360(psiFromTip(T_END, C_BOT));

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();

function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...(opts.pos ?? [0, 0, 0]));
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.parent) opts.parent.add(m); else scene.add(m);
  m.castShadow = !!opts.cast;
  m.receiveShadow = !!opts.recv;
  if (opts.order) m.renderOrder = opts.order;
  return m;
}

function setTube(m, pts, radius, seg = 64) {
  const old = m.geometry;
  m.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, radius, 6, false);
  old.dispose();
}
function helixPts(p0, p1, radius, coils, n = 56) {
  const axis = new THREE.Vector3().subVectors(p1, p0);
  const u = axis.clone().normalize();
  let ref = new THREE.Vector3(0, 0, 1);
  if (Math.abs(u.z) > 0.9) ref.set(1, 0, 0);
  const v1 = new THREE.Vector3().crossVectors(u, ref).normalize();
  const v2 = new THREE.Vector3().crossVectors(u, v1);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, ang = f * coils * 2 * Math.PI;
    pts.push(new THREE.Vector3().copy(p0).addScaledVector(axis, f)
      .addScaledVector(v1, radius * Math.cos(ang)).addScaledVector(v2, radius * Math.sin(ang)));
  }
  return pts;
}

/* ---------------- 每帧更新 ---------------- */
function updateWorld(t, cyc) {
  const st = stateAt(t, cyc, rev, PSI_REST, PSI_END, L_PAWL);
  wheelGrp.rotation.z = st.thetaDeg * D2R;

  armGrp.position.set(ARM_PIV.x, ARM_PIV.y, Z_ARM);
  armGrp.rotation.z = (st.aDeg - 90) * D2R;

  pawlGrp.position.set(st.C.x, st.C.y, Z_ARM);
  pawlGrp.rotation.z = st.psi * D2R;
  const dC = Math.hypot(st.tip.x - st.C.x, st.tip.y - st.C.y);
  pawlGrp.scale.set(dC, 1, 1);

  sphereDrv.position.copy(st.tip);
  const seatK = t > 0.955 ? Math.max(0, Math.sin((t - 0.955) * 42)) * Math.exp(-(t - 0.955) * 11) : 0;
  sphereDrv.scale.setScalar(1 + 1.1 * seatK);
  if (rev || st.mode === 'slide') sphereDrv.material = matGlowY;
  else if (st.mode === 'drive') sphereDrv.material = matGlowR;
  else if (st.mode === 'seat') sphereDrv.material = matGlowO;
  else sphereDrv.material = matDimO;

  const hh = holdState(st.thetaDeg);
  holdGrp.position.set(HOLD_PIV.x, HOLD_PIV.y, 0.28);
  holdGrp.rotation.z = hh.psi * D2R;
  sphereHold.position.copy(hh.tip);
  sphereHold.material = (rev || t >= 0.5) ? matGlowO : matDimO;

  // 扭转弹簧丝（铰点 Tab ↔ 爪尾），随相对转角缠绕
  const tabA = (st.aDeg + 152) * D2R;
  const tab = V3(st.C.x + 0.17 * Math.cos(tabA), st.C.y + 0.17 * Math.sin(tabA), Z_ARM);
  const heelA = (st.psi + 187) * D2R;
  const heel = V3(st.C.x + 0.16 * Math.cos(heelA), st.C.y + 0.16 * Math.sin(heelA), Z_ARM);
  const h0 = V3(st.C.x, st.C.y, Z_ARM - 0.07), h1 = V3(st.C.x, st.C.y, Z_ARM + 0.07);
  setTube(torsionTube, [tab, ...helixPts(h0, h1, 0.06, 3.2), heel], 0.011);

  // 止回爪压簧（立柱 ↔ 爪尾）
  const q = V3(HOLD_PIV.x + 0.3, HOLD_PIV.y - 0.22, 0.28);
  const tailA = (hh.psi + 196) * D2R;
  const tail = V3(HOLD_PIV.x + 0.19 * Math.cos(tailA), HOLD_PIV.y + 0.19 * Math.sin(tailA), 0.28);
  setTube(holdTube, helixPts(q, tail, 0.032, 5), 0.012);

  return st;
}

/* ---------------- 循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
applyTheme();
applyLang();
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const cyc = Math.floor(cycles), t = cycles - cyc;

  updateWorld(t, cyc);

  const si = stepIndex(t, rev);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateWorld(cycles - Math.floor(cycles), Math.floor(cycles));
requestAnimationFrame(frame);
</script>
