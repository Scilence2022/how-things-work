<!DOCTYPE html>

<style>

  }
  :root[data-theme="light"]{

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-1,8.5,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=35;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,12,6);scene.add(key);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.4;scene.add(ground);

/* 数据平面(特征 x1,x2)与数据点 */
const planeM=new THREE.MeshStandardMaterial({color:0x232a36,roughness:0.85});
const plane=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.12,6.4),planeM);
plane.position.set(0,0,0);scene.add(plane);
const NDATA=120;
const dataD=[];
function genData(noise){
  dataD.length=0;
  for(let i=0;i<NDATA;i++){
    /* 真实规律:x1+x2>0 → 类1, 否则类0 */
    const x1=(Math.random()*2-1);
    const x2=(Math.random()*2-1);
    let label=x1+x2>0?1:0;
    if(Math.random()<noise)label=1-label;
    dataD.push({x1,x2,label});
  }
}
/* 数据点(InstancedMesh,双色) */
const ptsM=new THREE.MeshStandardMaterial({roughness:0.4});
const pts=new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,10,8),ptsM,NDATA);
pts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(pts);
const m4=new THREE.Matrix4();
const C0=new THREE.Color(0xff6b6b),C1=new THREE.Color(0x74c0fc);

/* 决策边界(矩形划分,用半透明块显叶子区域) */
const boundG=new THREE.Group();scene.add(boundG);
/* 树结构(右侧 3D 树) */
const treeG=new THREE.Group();treeG.position.set(5.4,2.2,0);scene.add(treeG);
const nodeM=new THREE.MeshStandardMaterial({color:0xe8b04a,roughness:0.4,emissive:0xb07d2e,emissiveIntensity:0.2});
const linkM=new THREE.LineBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.7});
let treeNodes=[];
function drawTree(depth){
  /* 清旧 */
  for(const c of [...treeG.children])treeG.remove(c);
  treeNodes=[];
  const layout=[];
  function rec(d,x,w){
    const y=-d*0.95;
    const node=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10),nodeM);
    node.position.set(x,y,0);
    treeG.add(node);
    layout.push({x,y,d});
    if(d<depth){
      const lw=w/2;
      rec(d+1,x-lw,lw);
      rec(d+1,x+lw,lw);
    }
  }
  rec(0,0,2.2);
  /* 连线 */
  const lp=[];
  for(let i=1;i<layout.length;i++){
    const n=layout[i];
    /* 找父节点:同深度的上一个奇偶配对 */
    const same=layout.filter(m=>m.d===n.d-1);
    const parent=same[Math.floor((layout.filter(m=>m.d===n.d).indexOf(n))/2)];
    if(parent){lp.push(parent.x,parent.y,0,n.x,n.y,0);}
  }
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lp),3));
  treeG.add(new THREE.LineSegments(lg,linkM));
}

/* 状态 */
let maxDepth=4,noise=8,grown=0,playing=true,labelsOn=true,slowMo=false,boundOn=true;
let simT=0,trainAcc=0,testAcc=0,bestGain=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function entropy(p){
  if(p<=0||p>=1)return 0;
  return -(p*Math.log2(p)+(1-p)*Math.log2(1-p));}
function rootEntropy(){
  const p=dataD.filter(d=>d.label===1).length/NDATA;
  return entropy(p);}
/* 模拟一次贪心分割的真实增益(在真实数据上取最优轴) */
function bestSplit(){
  let best=0;
  const h0=rootEntropy();
  for(const axis of [0,1]){
    for(const th of [-0.5,0,0.5]){
      const L=dataD.filter(d=>(axis===0?d.x1:d.x2)<th);
      const R=dataD.filter(d=>(axis===0?d.x1:d.x2)>=th);
      if(L.length<5||R.length<5)continue;
      const pL=L.filter(d=>d.label===1).length/L.length;
      const pR=R.filter(d=>d.label===1).length/R.length;
      const g=h0-(L.length/NDATA)*entropy(pL)-(R.length/NDATA)*entropy(pR);
      best=Math.max(best,g);
    }
  }
  return best;}
function predict(x1,x2,d){
  /* 真实规则+噪声下的树近似:按 maxDepth 逼近真实边界 */
  const truth=x1+x2>0?1:0;
  if(d>=4)return truth;
  /* 深度不足→在边界带里出错 */
  const dist=Math.abs(x1+x2);
  const band=(4-d)*0.22;
  if(dist<band)return Math.random()<0.5?1-truth:truth;
  return truth;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('根节点:两类混在一起,熵最高','Root: both classes tangled — entropy at its peak'),
  new THREE.Vector3(0,2.0,0),'y');
addLabel(()=>L('每一刀挑「熵降最多」的特征与阈值','Each split takes the feature-threshold pair that drops entropy most'),
  new THREE.Vector3(-4.4,3.4,0),'g',()=>grown>0.2);
addLabel(()=>L('深了过拟合:把噪声也当规律背下来','Too deep: the tree memorizes noise as law',
  ),new THREE.Vector3(4.4,-0.6,0),'r',()=>maxDepth>=5&&noise>10);
addLabel(()=>L('剪枝与森林:把偶然抹平','Pruning and forests: sanding off the accidents'),
  new THREE.Vector3(-4.2,-1.2,0),'b',()=>grown>0.8);

function setDepth(v){maxDepth=clamp(v,1,6);
  document.getElementById('sDepth').value=maxDepth;
  document.getElementById('sDepthVal').textContent=maxDepth;
  drawTree(maxDepth);updateStats();}
function setNoise(v){noise=clamp(v,0,30);
  document.getElementById('sNoise').value=noise;
  document.getElementById('sNoiseVal').textContent=noise.toFixed(0)+' %';
  genData(noise/100);refreshPts();updateStats();}

const STEPS=[
 {zh:'混在一张桌上的两类点:熵 1.0',en:'Two classes on one table: entropy 1.0',
  act(){grown=0;setNoise(4);setDepth(1);}},
 {zh:'第一刀:挑熵降最大的切法',en:'First cut: pick the biggest entropy drop',
  act(){grown=0.4;setDepth(2);}},
 {zh:'递归:每片叶子继续问',en:'Recurse: every leaf keeps asking',
  act(){grown=0.7;setDepth(3);}},
 {zh:'叶子纯了:熵归零,边界折出阶梯',en:'Pure leaves: entropy zero, stair-step boundaries',
  act(){grown=1;setDepth(4);}},
 {zh:'加深过拟合:噪声被背成规律',en:'Deeper → overfit: noise memorized as law',
  act(){grown=1;setNoise(18);setDepth(6);}},
 {zh:'剪枝/森林:牺牲训练集换泛化',en:'Prune / vote: trade training fit for generalization',
  act(){grown=1;setNoise(18);setDepth(3);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function refreshPts(){
  for(let i=0;i<NDATA;i++){
    const d=dataD[i];
    m4.makeScale(1,1,1);
    m4.setPosition(d.x1*3.0,0.25,d.x2*3.0);
    pts.setMatrixAt(i,m4);
    pts.setColorAt(i,d.label?C1:C0);
  }
  pts.instanceMatrix.needsUpdate=true;
  pts.instanceColor.needsUpdate=true;
  /* 决策边界(阶梯块) */
  for(const c of [...boundG.children])boundG.remove(c);
  if(!boundOn)return;
  const N=8;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x1=-3+6*(i+0.5)/N,z=-3+6*(j+0.5)/N;
    const pred=predict(x1/3,x2r(z)/3,maxDepth);
    const cell=new THREE.Mesh(new THREE.BoxGeometry(6/N,0.05,6/N),
      new THREE.MeshBasicMaterial({color:pred?0x74c0fc:0xff6b6b,transparent:true,opacity:0.14}));
    cell.position.set(x1,0.1,z);
    boundG.add(cell);
  }
  function x2r(z){return z;}
}

function updateStats(){
  document.getElementById('stH0').innerHTML=rootEntropy().toFixed(2)+'<small> bit</small>';
  bestGain=bestSplit();
  document.getElementById('stGain').innerHTML=bestGain.toFixed(2)+'<small> bit</small>';
  document.getElementById('stDepth').textContent=maxDepth;
  /* 测试准确率 */
  let ok=0;const NT=200;
  for(let i=0;i<NT;i++){
    const x1=Math.random()*2-1,x2=Math.random()*2-1;
    const truth=x1+x2>0?1:0;
    let pr=predict(x1,x2,maxDepth);
    if(Math.random()<noise/100)pr=1-pr;/* 测试数据也带噪声 */
    if(pr===truth)ok++;
  }
  testAcc=ok/NT;
  const av=document.getElementById('stAcc');
  av.innerHTML=(100*testAcc).toFixed(0)+'<small> %</small>';
  av.className='v '+(testAcc>0.85?'ok':'warn');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bGrow').addEventListener('click',()=>{grown=1;setDepth(maxDepth);});
document.getElementById('bPrune').addEventListener('click',()=>setDepth(Math.max(2,maxDepth-2)));
document.getElementById('bForest').addEventListener('click',()=>{setNoise(Math.max(noise,12));setDepth(3);grown=1;});
document.getElementById('sDepth').addEventListener('input',e=>setDepth(+e.target.value));
document.getElementById('sNoise').addEventListener('input',e=>setNoise(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglBound').addEventListener('change',e=>{boundOn=e.target.checked;refreshPts();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  planeM.color.setHex(dark?0x232a36:0xb8b4ac);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 生长动画:节点按 grown 点亮 */
  treeNodes.forEach((n,i)=>{
    const need=i/Math.max(treeNodes.length-1,1)<=grown;
    nodeM.emissiveIntensity=need?0.35+0.15*Math.sin(simT*3+i):0.02;
  });
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.3){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
genData(noise/100);
refreshPts();
drawTree(maxDepth);
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
