<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>地衣共生 · 真菌出房,藻类交租,合用一名</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#a9b646;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#7a851f;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(169,182,70,.6);background:rgba(169,182,70,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(122,133,31,.55);background:rgba(122,133,31,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(169,182,70,.10);border-color:rgba(169,182,70,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(122,133,31,.08);border-color:rgba(122,133,31,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#e9edc2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="地衣共生" data-en="Lichen Symbiosis">地衣共生</h1>
  <div class="sub" data-zh="真菌提供房子与水分,藻类或蓝菌上交光合糖:两个物种焊成一个「物种」——地衣能在裸岩上开荒、在太空舱外活着;共生紧到连名字都是一体的 · 拖动旋转 / 空格运行/暂停" data-en="The fungus builds the house and holds the water; the alga or cyanobacterium pays photosynthetic sugar: two species welded into one named organism — lichens pioneer bare rock and survive outside a spacecraft; the symbiosis is tight enough to share a name · drag to orbit / Space = run/pause">真菌提供房子与水分,藻类或蓝菌上交光合糖:两个物种焊成一个「物种」——地衣能在裸岩上开荒、在太空舱外活着;共生紧到连名字都是一体的 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="光合产糖率" data-en="Sugar output">光合产糖率</span><span class="v" id="stSugar">—</span>
  <span class="k" data-zh="持水量" data-en="Water held">持水量</span><span class="v" id="stWater">—</span>
  <span class="k" data-zh="地衣增长率" data-en="Growth">地衣增长率</span><span class="v" id="stGrowth">—</span>
  <span class="k" data-zh="结合状态" data-en="Binding">结合状态</span><span class="v" id="stBond">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bTogether" data-zh="共生整体" data-en="Together">共生整体</button>
    <button class="abtn" id="bSplit" data-zh="拆开对照" data-en="Split">拆开对照</button>
    <button class="abtn" id="bSpace" data-zh="太空暴露实验" data-en="Space test">太空暴露实验</button>
  </div>
  <div class="row">
    <label data-zh="干旱强度" data-en="Drought">干旱强度</label>
    <input id="sDry" type="range" min="0" max="100" step="5" value="40">
    <span class="val" id="sDryVal">40 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖面分层" data-en="Cutaway">剖面分层</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../mycorrhiza/" data-zh="菌根网络" data-en="Mycorrhizal Network">菌根网络</a>
    <a href="../gut-microbiome/" data-zh="肠道菌群与宿主共生" data-en="The Gut Microbiome">肠道菌群与宿主共生</a>
    <a href="../endosymbiosis/" data-zh="内共生与细胞器起源" data-en="Endosymbiosis & the Origin of Organelles">内共生与细胞器起源</a>
    <a href="../ecological-succession/" data-zh="生态演替" data-en="Ecological Succession">生态演替</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-2.6,3.4,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 裸岩基座 */
const rockM=new THREE.MeshStandardMaterial({color:0x5a554c,roughness:0.95});
const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2.2,1),rockM);
rock.position.y=0.6;rock.scale.y=0.55;scene.add(rock);

/* 地衣横切(放大体):分层结构 */
const thallus=new THREE.Group();thallus.position.set(0,1.9,0);scene.add(thallus);
/* 上皮层(致密菌丝) */
const upperM=new THREE.MeshStandardMaterial({color:0x8a9450,roughness:0.7});
const upper=new THREE.Mesh(new THREE.CapsuleGeometry(1.5,0.5,4,16),upperM);
upper.scale.set(1,0.18,0.85);thallus.add(upper);
/* 藻层(绿色光合金主细胞) */
const algaeM=new THREE.MeshStandardMaterial({color:0x63e67a,roughness:0.45,emissive:0x2b8a3e,emissiveIntensity:0.25});
const algae=new THREE.Mesh(new THREE.CapsuleGeometry(1.45,0.4,4,16),algaeM);
algae.scale.set(1,0.16,0.8);algae.position.y=-0.12;thallus.add(algae);
/* 藻细胞(绿球) */
const NCELL=40;
const cellM=new THREE.MeshStandardMaterial({color:0x8ce99a,roughness:0.4,emissive:0x2b8a3e,emissiveIntensity:0.3});
const cells=new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,10,8),cellM,NCELL);
thallus.add(cells);
const cellD=[];for(let i=0;i<NCELL;i++)cellD.push({x:(Math.random()-0.5)*2.5,z:(Math.random()-0.5)*2.2,y:-0.12+(Math.random()-0.5)*0.06});
/* 髓层(疏松菌丝网) */
const medullaM=new THREE.MeshStandardMaterial({color:0xd8d2c0,roughness:0.9});
const medulla=new THREE.Mesh(new THREE.CapsuleGeometry(1.42,0.4,4,16),medullaM);
medulla.scale.set(1,0.14,0.78);medulla.position.y=-0.24;thallus.add(medulla);
/* 下皮层+假根 */
const lowerM=new THREE.MeshStandardMaterial({color:0x7a7058,roughness:0.8});
const lower=new THREE.Mesh(new THREE.CapsuleGeometry(1.4,0.3,4,16),lowerM);
lower.scale.set(1,0.15,0.8);lower.position.y=-0.38;thallus.add(lower);
const rhizM=new THREE.MeshStandardMaterial({color:0x7a7058,roughness:0.8});
for(let i=0;i<5;i++){
  const r=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.01,0.5,6),rhizM);
  r.position.set((i-2)*0.55,-0.68,0);r.rotation.z=(i-2)*0.15;thallus.add(r);
}
/* 菌丝(剖面内的半透明丝网) */
const hyphaM=new THREE.MeshStandardMaterial({color:0xe8e2d0,roughness:0.6,transparent:true,opacity:0.5});
for(let i=0;i<16;i++){
  const pts=[];
  for(let k=0;k<=8;k++){
    pts.push(new THREE.Vector3(-1.3+k*0.33,(Math.random()-0.5)*0.5,(Math.random()-0.5)*1.2));
  }
  const t=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),20,0.014,5),hyphaM);
  thallus.add(t);
}
/* 独立对照:游离真菌丝与裸藻(右侧) */
const sepG=new THREE.Group();sepG.position.set(4.6,1.2,0);sepG.visible=false;scene.add(sepG);
const sepFungusM=new THREE.MeshStandardMaterial({color:0xd8d2c0,roughness:0.7});
const sepMats=[];
for(let i=0;i<8;i++){
  const pts=[];for(let k=0;k<=6;k++)pts.push(new THREE.Vector3((Math.random()-0.5)*1.2,0.4+k*0.18,(Math.random()-0.5)*1.0));
  const t=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),16,0.02,5),sepFungusM);
  sepG.add(t);sepMats.push(t);
}
const sepAlgae=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,10,8),cellM,14);
sepG.add(sepAlgae);
const sepAlgaeD=[];for(let i=0;i<14;i++)sepAlgaeD.push({x:(Math.random()-0.5)*1.2,y:0.3+Math.random()*1.4,z:(Math.random()-0.5)*0.9});
/* 糖粒子(藻层→髓层下行) */
const NSG=12;
const sgM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.95});
const sugar=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),sgM,NSG);
thallus.add(sugar);
const sgD=[];for(let i=0;i<NSG;i++)sgD.push({t:Math.random()});
/* 水粒子(髓层→藻层上行) */
const NWT=10;
const wtM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.9});
const waterP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),wtM,NWT);
thallus.add(waterP);
const wtD=[];for(let i=0;i<NWT;i++)wtD.push({t:Math.random()});
const m4=new THREE.Matrix4();

/* 状态 */
let dry=40,split=false,spaceTest=false,playing=true,labelsOn=true,slowMo=false,cut=true;
let sugarRate=0,waterHold=0,growth=0,simT=0,thaw=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function calcSugar(){return split?0:clamp(1-dry/300,0.05,1);}
function calcWater(){return split?clamp(0.5-dry/400,0,0.5):clamp(1.6-dry/80,0.1,1.6);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('上皮层:致密菌丝当屋顶,挡紫外线保水分','Upper cortex: dense hyphae — a roof against UV and drought'),
  new THREE.Vector3(0,2.9,0),'y');
addLabel(()=>L('藻层:光合金主上交光合糖','Algal layer: the photobiont pays photosynthetic sugar'),
  new THREE.Vector3(-3.1,1.9,0),'g');
addLabel(()=>L('髓层:疏松菌丝储水,像海绵一样','Medulla: loose hyphae hold water like a sponge'),
  new THREE.Vector3(3.1,1.2,0),'b');
addLabel(()=>L('糖下行:藻的租金,真菌的口粮','Sugar flows down: the alga\u0027s rent, the fungus\u0027s bread'),
  new THREE.Vector3(0,-0.4,0),'o',()=>!split);
addLabel(()=>L('拆开对照:两边都活不好','Split control: neither half thrives'),
  new THREE.Vector3(4.6,3.0,0),'r',()=>split);
addLabel(()=>L('太空暴露:真空+宇宙线,地衣照活','Space exposure: vacuum and cosmic rays — still alive'),
  new THREE.Vector3(-3.4,-0.9,0),'p',()=>spaceTest);

function setDry(v){dry=clamp(v,0,100);
  document.getElementById('sDry').value=dry;
  document.getElementById('sDryVal').textContent=dry.toFixed(0)+' %';updateStats();}

const STEPS=[
 {zh:'两个陌生人:真菌只会长,藻只会光合',en:'Two strangers: the fungus only builds, the alga only photosynthesizes',
  act(){split=true;sepG.visible=true;setDry(40);}},
 {zh:'相遇焊接:菌丝裹住藻细胞',en:'First contact: hyphae wrap the algal cells',
  act(){split=false;sepG.visible=false;setDry(20);}},
 {zh:'分层分工:屋顶-车间-海绵-锚',en:'Division of labor: roof, workshop, sponge, anchor',
  act(){split=false;setDry(30);}},
 {zh:'糖下行,水上行:共生内部的贸易线',en:'Sugar down, water up: the internal trade routes',
  act(){split=false;setDry(25);}},
 {zh:'干旱考验:抱紧水分,休眠等待',en:'The drought test: hold water, sleep it out',
  act(){split=false;setDry(95);}},
 {zh:'裸岩开荒与太空暴露:极限玩家',en:'Pioneer and astronaut: bare rock and open space',
  act(){split=false;spaceTest=true;setDry(60);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  sugarRate=calcSugar();
  waterHold=calcWater();
  document.getElementById('stSugar').innerHTML=(100*sugarRate*(split?0.15:1)).toFixed(0)+'<small> %</small>';
  const wv=document.getElementById('stWater');
  wv.innerHTML=(100*waterHold).toFixed(0)+'<small> %</small>';
  wv.className='v '+(waterHold<0.3?'warn':'ok');
  growth=clamp((sugarRate*waterHold)*2.2,0,1);
  document.getElementById('stGrowth').innerHTML=growth>0?(growth*10).toFixed(1)+'<small> mm/y</small>':'—';
  const bv=document.getElementById('stBond');
  bv.textContent=split?L('已拆开','split'):(spaceTest?L('休眠待机','dormant'):L('紧密结合','fused'));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bTogether').addEventListener('click',()=>{split=false;sepG.visible=false;spaceTest=false;});
document.getElementById('bSplit').addEventListener('click',()=>{split=true;sepG.visible=true;spaceTest=false;});
document.getElementById('bSpace').addEventListener('click',()=>{spaceTest=true;split=false;sepG.visible=false;});
document.getElementById('sDry').addEventListener('input',e=>setDry(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;
  upper.visible=cut;algae.visible=cut;medulla.visible=cut;lower.visible=cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  rockM.color.setHex(dark?0x5a554c:0x8a857a);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  updateStats();
  /* 藻细胞呼吸式发亮 */
  for(let i=0;i<NCELL;i++){
    const c=cellD[i];
    const s=(0.85+0.2*Math.sin(simT*2+i*1.3))*(split?0.4:1);
    m4.makeScale(s,s,s);
    m4.setPosition(c.x,c.y,c.z);
    cells.setMatrixAt(i,m4);
  }
  cells.instanceMatrix.needsUpdate=true;
  /* 干旱:整体缩水变色 */
  const shrink=1-clamp(dry/200,0,0.35);
  thallus.scale.set(shrink,1,shrink);
  algaeM.emissiveIntensity=split?0.05:(spaceTest?0.08:0.25*sugarRate+0.05);
  upperM.color.lerp(new THREE.Color(spaceTest?0x6a7050:0x8a9450).lerp(new THREE.Color(0x9a9a8a),dry/130),0.05);
  /* 糖粒子下行 */
  const sgOn=!split&&sugarRate>0.1;
  for(let i=0;i<NSG;i++){
    const g=sgD[i];
    g.t+=dts*(sgOn?0.6:0);
    if(g.t>1)g.t-=1;
    const s=sgOn?1:0.001;
    m4.makeScale(s,s,s);
    m4.setPosition((i%5-2)*0.4,-0.12-g.t*0.16,((i/5|0)-1)*0.3);
    sugar.setMatrixAt(i,m4);
  }
  sugar.instanceMatrix.needsUpdate=true;
  /* 水粒子上行 */
  const wtOn=!split&&waterHold>0.25;
  for(let i=0;i<NWT;i++){
    const w=wtD[i];
    w.t+=dts*(wtOn?0.7:0);
    if(w.t>1)w.t-=1;
    const s=wtOn?1:0.001;
    m4.makeScale(s,s,s);
    m4.setPosition((i%4-1.5)*0.5,-0.24+w.t*0.12,((i/4|0)-1)*0.3);
    waterP.setMatrixAt(i,m4);
  }
  waterP.instanceMatrix.needsUpdate=true;
  /* 分离对照摆动 */
  if(split){
    sepG.rotation.y+=dts*0.15;
    for(let i=0;i<14;i++){
      const a=sepAlgaeD[i];
      m4.makeScale(0.6,0.6,0.6);
      m4.setPosition(a.x+0.2*Math.sin(simT+i),a.y,a.z);
      sepAlgae.setMatrixAt(i,m4);
    }
    sepAlgae.instanceMatrix.needsUpdate=true;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(1);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
