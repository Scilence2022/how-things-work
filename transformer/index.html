<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变压器与高压输电 · 匝数比就是电压比</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.hot { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.hot { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.b { color: #4dabf7; }
  #stats .v.hot { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(255,209,102,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(176,118,31,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="变压器与高压输电：匝数比就是电压比" data-en="Transformers & The Grid: turns ratio = voltage ratio">变压器与高压输电：匝数比就是电压比</h1>
  <div class="sub" data-zh="交流在原边生磁通,磁通在副边生电压,V₂ = (N₂/N₁)·V₁;升压⇄降压同一台机器;电压抬 10 倍,线损降 100 倍 · 空格播放/暂停" data-en="AC makes flux, flux makes voltage: V₂ = (N₂/N₁)·V₁; step-up ⇄ step-down is the same machine; ×10 voltage, ÷100 line loss · Space = play/pause">交流在原边生磁通,磁通在副边生电压,V₂ = (N₂/N₁)·V₁;升压⇄降压同一台机器;电压抬 10 倍,线损降 100 倍 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k1" data-zh="原边电压" data-en="primary V">原边电压</span><span class="v b" id="stV1">—</span>
  <span class="k" id="k2" data-zh="副边电压" data-en="secondary V">副边电压</span><span class="v g" id="stV2">—</span>
  <span class="k" id="k3" data-zh="线电流" data-en="line current">线电流</span><span class="v" id="stI">—</span>
  <span class="k" id="k4" data-zh="线损占比" data-en="line loss">线损占比</span><span class="v hot" id="stLoss">—</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button id="btnBench" class="bon on"><b data-zh="变压器本体" data-en="The transformer">变压器本体</b><i data-zh="铁芯磁通 + 匝数比" data-en="core flux + turns ratio">铁芯磁通 + 匝数比</i></button>
    <button id="btnGrid" class="bon"><b data-zh="高压输电" data-en="The grid">高压输电</b><i data-zh="电压抬 10 倍,线损降 100 倍" data-en="×10 voltage, ÷100 loss">电压抬 10 倍,线损降 100 倍</i></button>
  </div>
  <div class="row" id="rowRatio"><label data-zh="匝数比 N₂/N₁" data-en="turns ratio N₂/N₁">匝数比 N₂/N₁</label><input id="ratio" type="range" min="20" max="400" step="5" value="100"><span class="val" id="ratioVal">1.00</span></div>
  <div class="row" id="rowKv" style="display:none"><label data-zh="输电电压" data-en="line voltage">输电电压</label><input id="kv" type="range" min="0" max="100" step="1" value="55"><span class="val" id="kvVal">—</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlux" type="checkbox" checked> <span data-zh="磁通流动" data-en="flux flow">磁通流动</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../electromagnetic-induction/" data-zh="法拉第定律:变压器的根" data-en="Faraday's law: the root">法拉第定律:变压器的根</a>
    <a href="../induction-motor/" data-zh="感应电机:会转的「变压器」" data-en="induction motor: a rotating transformer">感应电机:会转的「变压器」</a>
    <a href="../wireless-charging/" data-zh="无线充电:空气芯变压器" data-en="wireless charging: an air-core transformer">无线充电:空气芯变压器</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'grid' ? 'grid' : 'bench';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('变压器与高压输电', 'Transformers & The Grid');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  refreshStaticLabels();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(4.4, 3.8, 8.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  core: mat(0x8a93a3, { metalness: 0.55, roughness: 0.45 }),
  cuP: mat(0xc98b5f, { metalness: 0.65, roughness: 0.35 }),
  cuS: mat(0x6fc2d8, { metalness: 0.65, roughness: 0.35 }),
  steel: mat(0x9aa4b2, { metalness: 0.5, roughness: 0.5 }),
  lamp: mat(0xfff2cc, { emissive: 0xffd166, emissiveIntensity: 0.05, roughness: 0.3 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0, depthWrite: false }),
  flux: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.85 }),
  lineWire: mat(0x8fa3b8, { metalness: 0.6, roughness: 0.4 }),
  hotWire: new THREE.MeshBasicMaterial({ color: 0xff5d3b, transparent: true, opacity: 0.0, depthWrite: false }),
  tower: mat(0x5b6675, { roughness: 0.7 }),
  house: mat(0xd8b26a, { roughness: 0.6 }),
  dotP: new THREE.MeshBasicMaterial({ color: 0xffe08a }),
  dotS: new THREE.MeshBasicMaterial({ color: 0x9fd8ff }),
};

/* ================= 变压器本体(两模式共用) ================= */
const TX = -4.2;                       // 变压器摆放 x
const txGrp = new THREE.Group();
scene.add(txGrp);
/* 铁芯:方框(四段矩形梁) */
const CORE_W = 1.9, CORE_H = 2.3, CORE_T = 0.42, CORE_D = 0.62;
function coreBeam(w, h, x, y) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, CORE_D), M.core);
  b.position.set(x, y, 0);
  txGrp.add(b);
}
coreBeam(CORE_W + CORE_T, CORE_T, 0, CORE_H / 2);
coreBeam(CORE_W + CORE_T, CORE_T, 0, -CORE_H / 2);
coreBeam(CORE_T, CORE_H, -(CORE_W / 2), 0);
coreBeam(CORE_T, CORE_H, CORE_W / 2, 0);
/* 线圈:左原边(6 匝铜色),右副边(匝数随滑块变) */
function buildCoil(x, turns, m, radius = 0.5) {
  const g = new THREE.Group();
  const coilGrp = new THREE.Group();
  g.add(coilGrp);
  g.position.set(x, 0, 0);
  txGrp.add(g);
  const rings = [];
  for (let i = 0; i < 14; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.055, 8, 28), m);
    ring.rotation.y = Math.PI / 2;
    ring.position.y = -0.75 + i * 0.115;
    coilGrp.add(ring);
    rings.push(ring);
  }
  return { grp: g, coilGrp, rings };
}
const coilP = buildCoil(-(CORE_W / 2), 6, M.cuP);
const coilS = buildCoil(CORE_W / 2, 6, M.cuS);
/* 交流源(原边)与灯(副边) */
const acBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.7), mat(0x90be6d, { roughness: 0.4 }));
acBox.position.set(-3.6, -1.7, 0);
txGrp.add(acBox);
const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 22, 16), M.lamp);
lamp.position.set(2.55, -1.35, 0);
txGrp.add(lamp);
const halo = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14), M.lampGlow);
halo.position.copy(lamp.position);
txGrp.add(halo);
txGrp.position.set(TX, 3.0, 0);
txGrp.scale.setScalar(0.85);

/* 导线 */
function tube(points, m, r = 0.04, parent = scene) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 8, false), m);
  parent.add(mesh);
  return curve;
}
/* 磁通(沿铁芯回路跑的亮点) */
const fluxDots = [];
for (let i = 0; i < 10; i++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), M.flux);
  txGrp.add(d);
  fluxDots.push(d);
}
/* 铁芯回路参数(局部坐标) */
const FLUX_PATH = [
  new THREE.Vector3(-(CORE_W / 2), CORE_H / 2, 0), new THREE.Vector3(CORE_W / 2, CORE_H / 2, 0),
  new THREE.Vector3(CORE_W / 2, -CORE_H / 2, 0), new THREE.Vector3(-(CORE_W / 2), -CORE_H / 2, 0),
];
const fluxCurve = new THREE.CatmullRomCurve3(FLUX_PATH, true);

/* ================= 高压输电(仅 grid 模式) ================= */
const gridGrp = new THREE.Group();
scene.add(gridGrp);
/* 电厂(左)与镇(右),中间两座塔 + 导线(带发热壳) */
const plant = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 1.2), mat(0x90be6d, { roughness: 0.4 }));
plant.position.set(-7.2, 0.6, 0);
gridGrp.add(plant);

const V1 = 220;

function coilTurns() { return Math.min(14, Math.max(2, Math.round(6 * ratio))); }
function acKV() { return V1 * ratio; }
function kvOf() { return Math.round(10 * Math.pow(50, kvIdx / 100)); }   // 10..500 kV
const P_PLANT = 100;                   // MW
const R_LINE = 8;                      // Ω(三线合计,示意)
function lineCurrent() { return P_PLANT * 1e6 / (kvOf() * 1e3); }         // A
function lossPct() { return clamp(lineCurrent() ** 2 * R_LINE / (P_PLANT * 1e6), 0, 1); }

}

const STEPS = () => mode === 'bench' ? STEPS_BENCH : STEPS_GRID;
function stepIndex() {
  if (mode === 'bench') {
    if (Math.abs(ratio - 1) > 0.25) return 3;
    if (ratio > 1.6) return 2;
    return 1;
  }
  return kvIdx > 75 ? 2 : kvIdx > 40 ? 1 : 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';

    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elRatio = document.getElementById('ratio');
const elRatioVal = document.getElementById('ratioVal');
const elKv = document.getElementById('kv');
const elKvVal = document.getElementById('kvVal');
const tglLabels = document.getElementById('tglLabels');
const tglFlux = document.getElementById('tglFlux');
const tglRotate = document.getElementById('tglRotate');
const btnBench = document.getElementById('btnBench');
const btnGrid = document.getElementById('btnGrid');
const stV1 = document.getElementById('stV1'), stV2 = document.getElementById('stV2'),
  stI = document.getElementById('stI'), stLoss = document.getElementById('stLoss');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setRatio(r) {
  ratio = clamp(r, 0.2, 4);

function syncCoilTurns() {
  const n2 = coilTurns();

}
elRatio.addEventListener('input', () => setRatio(parseInt(elRatio.value, 10) / 100));
elKv.addEventListener('input', () => { kvIdx = parseInt(elKv.value, 10); elKvVal.textContent = kvOf() + ' kV'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
function setMode(m) {
  mode = m;
  btnBench.classList.toggle('on', m === 'bench');
  btnGrid.classList.toggle('on', m === 'grid');
  document.getElementById('rowRatio').style.display = m === 'bench' ? '' : 'none';
  document.getElementById('rowKv').style.display = m === 'grid' ? '' : 'none';
  const benchVisible = m === 'bench';

  miniTx.visible = !benchVisible;
  gridGrp.visible = !benchVisible;
  camera.position.set(...(m === 'bench' ? [2.6, 3.6, 6.6] : [1.5, 6.5, 15.5]));
  controls.target.set(...(m === 'bench' ? [TX * 0.6, 2.6, 0] : [0, 2.2, 0]));

    ? [L('原边电压', 'primary V'), L('副边电压', 'secondary V'), L('副边电流比', 'secondary I ratio'), L('功率比(=1)', 'power ratio (=1)')]
    : [L('电厂功率', 'plant power'), L('线电流', 'line current'), L('到镇功率', 'delivered power'), L('线损占比', 'line loss')];
  const kids = document.querySelectorAll('#stats .k');
  kids.forEach((k, i) => { k.dataset.zh = ks[i]; k.dataset.en = ks[i]; k.textContent = ks[i]; });

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let tAC = 0;
const m4 = new THREE.Matrix4();
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tAC += dts;
  const ac = Math.sin(tAC * 2 * Math.PI * 0.9);          // 慢速可视交流
  const mag = Math.abs(ac);

  /* 磁通亮点沿铁芯跑,方向随半周期翻转 */
  const dir = ac >= 0 ? 1 : -1;
  const speedK = 0.12 + 0.25 * mag;
  fluxDots.forEach((d, i) => {
    const p = (tAC * speedK * dir + i / fluxDots.length + 1) % 1;
    d.position.copy(fluxCurve.getPoint(p));
    d.material.opacity = 0.25 + 0.65 * mag;
  });
  M.flux.opacity = 0.25 + 0.65 * mag;
  coilP.rings.forEach((r, i) => { r.material.emissiveIntensity = 0.1 + 0.5 * mag * (1 - i / 14); });

  const isBench = mode === 'bench';
  /* 灯:副边电压平方比例(亮度示意) */
  const v2 = isBench ? V1 * ratio : 1;
  const bright = isBench ? clamp((v2 / 660), 0.04, 1) : (1 - lossPct());
  M.lamp.emissiveIntensity = 0.05 + bright * 1.8;
  M.lampGlow.opacity = bright * 0.4;
  townLamp.material.emissiveIntensity = 0.05 + (1 - lossPct()) * 1.6;
  townHalo.material.opacity = (1 - lossPct()) * 0.35;

  /* grid 模式:线电流点 + 发热壳 */
  const cur = lineCurrent();
  const heat = clamp(cur ** 2 * R_LINE / (P_PLANT * 1e6), 0, 1);
  const heatVis = Math.pow(heat, 0.35);
  M.hotWire.opacity = heatVis * 0.75;
  lineDots.forEach((d, i) => {
    if (!isBench) {
      d.visible = true;
      const wire = lineWires[i % 3];
      const p = (tAC * 0.11 + i / lineDots.length) % 1;
      d.position.copy(wire.getPoint(p));
    } else d.visible = false;
  });

  /* 统计与状态 */
  if (isBench) {
    stV1.textContent = V1 + ' V';
    stV2.textContent = (V1 * ratio).toFixed(0) + ' V';
    stI.innerHTML = '1/' + ratio.toFixed(2) + '<small> ×</small>';
    stLoss.textContent = '≈ 1.00';
  } else {
    stV1.textContent = '100 MW';
    stV2.textContent = cur.toFixed(0) + ' A';
    stI.textContent = ((1 - lossPct()) * 100).toFixed(1) + ' MW';
    stLoss.innerHTML = (lossPct() * 100).toFixed(1) + '<small> %</small>';
  }

  for (const r of labelRegistry) r.o.element.textContent = r.text();

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function refreshStaticLabels() { void 0; }

setRatio(ratio);
setMode(mode);
elKv.value = kvIdx; elKvVal.textContent = kvOf() + ' kV';
