<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗碗机 · 热水、射流与时间的合奏</title>
<style>
:root, :root[data-theme="dark"] {
color-scheme: dark; --acc:#66d9e8; --accDim:rgba(102,217,232,.5); --accBg:rgba(102,217,232,.11); --accText:#c9f6fc; --bg:#0e1418; --panel:rgba(14,18,22,.86); --panel-border:rgba(255,255,255,.09); --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de; --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45); --tool:rgba(14,18,22,.78); --tool-border:rgba(255,255,255,.12); --cv-pill:rgba(14,18,22,.8); }
:root[data-theme="light"] {
color-scheme: light; --acc:#0c8599; --accDim:rgba(12,133,153,.45); --accBg:rgba(12,133,153,.09); --accText:#0b7285; --bg:#e8eff4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10); --text:#16202c; --text2:#5b6b7d; --text3:#33414f; --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15); --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14); --cv-pill:rgba(255,255,255,.85); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; transition: background .25s; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.lbl { background: var(--cv-pill); border: 1px solid var(--tool-border); color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
:root[data-theme="light"] .lbl { text-shadow: none; }
.lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
.lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
.lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
.lbl.b { border-color: rgba(102,217,232,.9); color: #bde9ff; }
:root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
:root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#0b7285; }

#tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
.tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool); color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600; min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; backdrop-filter: blur(6px); transition: border-color .15s, color .15s, transform .15s; }
.tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

#title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; max-width: calc(100vw - 320px); }
#title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
#title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

#plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; backdrop-filter: blur(6px); padding: 8px 10px 6px; }
#plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
#plotCv { width: 100%; height: calc(100% - 20px); display: block; }

#stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
#stats .k { font-size: 12px; color: var(--text2); align-self: center; }
#stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
#stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
#stats .v.ok { color: #7bd88f; }
#stats .v.warn { color: #ffa94d; }
#stats .v.bad { color: #ff6b6b; }

#panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px); box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
#legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
.chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
.chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
.chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
.chip.b { color: #bde9ff; border-color: rgba(102,217,232,.7); }
:root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
:root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#0b7285; }
#actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%; background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border); border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; transition: border-color .15s, color .15s, background .15s; }
.abtn:hover { border-color: var(--acc); color: var(--text); }
.abtn.on { border-color: var(--accDim); background: var(--accBg); color: var(--text); }
:root[data-theme="light"] .abtn.on { border-color: var(--accDim); background: var(--accBg); }
.row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
.row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
#formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2); border-top: 1px dashed var(--panel-border); padding-top: 7px; }
#formula b { color: var(--text3); font-weight: 600; }
#steps { list-style: none; margin-top: 8px; }
#steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; align-items: flex-start; }
#steps li:hover { background: var(--hover); }
#steps li.on { background: var(--accBg); border-color: var(--accDim); }
#steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px; display: flex; align-items: center; justify-content: center; margin-top: 1px; background: rgba(255,255,255,.12); color: var(--text3); }
:root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
#steps li.on .n { background: var(--acc); color: #fff; }
#steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
#steps .t b { color: var(--text); font-size: 12px; }
#steps li.on .t b { color: var(--accText); }
#ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
#play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--acc); color: #06333a; border: 0; border-radius: 10px; cursor: pointer; }
:root[data-theme="light"] #play { color: #fff; }
#play:hover { filter: brightness(1.12); }
#toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
#toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center; cursor: pointer; }
#toggles input { accent-color: var(--acc); }
#rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#rel span { font-size: 11.5px; color: var(--text2); }
#rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border); border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
#rel a:hover { color: var(--acc); border-color: var(--acc); }
@media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
@media (max-width: 900px) { #stats { display: none; } }
@media (max-width: 760px) {
#panel { width: calc(100vw - 36px); max-height: 55vh; }
#title { max-width: calc(100vw - 200px); }
#title h1 { font-size: 16px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="洗碗机 · 热水、射流与时间的合奏" data-en="The Dishwasher · Hot Water, Jets & Time">洗碗机 · 热水、射流与时间的合奏</h1>
  <div class="sub" data-zh="洗碗机不是「用水冲」,而是用 60–70 °C 的定向射流反复轰击:进水阀放入 2–4 L 水,底部 2.2 kW 加热管把它烧到设定温度;循环泵以约 25 L/min 把水压进喷臂,斜置喷口的反冲力矩 τ≈ṁ·v·r·sinθ 让喷臂不用电机、自转数百转/分;酶在 50–65 °C 剪碎蛋白与淀粉,表面活性剂把油脂卷成胶束;整池脏水排净、两道漂洗,亮碟剂把表面张力从 72 压到 ~25 mN/m,水铺膜流走不留斑;余热冷凝烘干,全程 9–12 L 水约 1 kWh 电,手洗要 60–100 L · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A dishwasher does not rinse — it bombards with aimed jets of 60–70 °C water: the valve lets in 2–4 L, a 2.2 kW element heats it to setpoint; the circulation pump pushes ~25 L/min into spray arms whose angled nozzles give a recoil torque τ≈ṁ·v·r·sinθ that spins them at hundreds of rpm with no motor; enzymes cut protein and starch at 50–65 °C while surfactants roll grease into micelles; the tub drains fully, two rinses follow, rinse aid drops surface tension 72→~25 mN/m so water sheets off spotless; residual-heat drying: 9–12 L and ~1 kWh per cycle vs 60–100 L by hand · 3D interactive demo · drag to orbit · Space = run/pause">洗碗机 · 热水、射流与时间的合奏</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats"> <span class="k" data-zh="水温" data-en="Water temp">水温</span><span class="v" id="stTemp">—</span> <span class="k" data-zh="当前阶段" data-en="Phase">当前阶段</span><span class="v" id="stPhase">—</span> <span class="k" data-zh="已去除污渍" data-en="Stains removed">已去除污渍</span><span class="v" id="stStain">—</span> <span class="k" data-zh="耗水" data-en="Water used">耗水</span><span class="v" id="stWater">—</span> <span class="k" data-zh="耗电" data-en="Energy">耗电</span><span class="v" id="stEnergy">—</span> <span class="k" data-zh="剩余程序" data-en="Remaining">剩余程序</span><span class="v" id="stRemain">—</span>
</div>

<div id="plot">
  <h3 data-zh="周期时间线:温度曲线与阶段色带(预洗/主洗/排水/漂洗×2/烘干),红点为当前水温" data-en="Cycle timeline: temperature curve with phase bands (pre-wash / main / drain / rinses / dry); the dot is the current water temperature">周期时间线:温度曲线与阶段色带(预洗/主洗/排水/漂洗×2/烘干),红点为当前水温</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend"> <span class="chip.b" data-zh="青蓝:60–70 °C 射流与水位" data-en="cyan: 60–70 °C jets & water level">青蓝:60–70 °C 射流与水位</span> <span class="chip.r" data-zh="红点:污渍,被射流击中即消失" data-en="red dots: stains, removed on jet hits">红点:污渍,被射流击中即消失</span> <span class="chip.g" data-zh="绿色:酶活性窗口 50–65 °C" data-en="green: enzyme window 50–65 °C">绿色:酶活性窗口 50–65 °C</span> <span class="chip.o" data-zh="橙黄:加热管与洗涤剂投放" data-en="orange: heater & detergent dosing">橙黄:加热管与洗涤剂投放</span>
  </div>
  <div id="actions"> <button class="abtn" id="btnDry" data-zh="立即烘干(跳到烘干段)" data-en="Dry now (skip to drying)">立即烘干(跳到烘干段)</button> <button class="abtn" id="btnDeterg" data-zh="投放洗涤剂(酶/表面活性剂/碱)" data-en="Add detergent (enzyme / surfactant / alkali)">投放洗涤剂(酶/表面活性剂/碱)</button>
  </div>
  <div class="row"><label data-zh="洗涤温度" data-en="Wash temp">洗涤温度</label><input id="sTemp" type="range" min="45" max="75" step="5" value="65"><span class="val" id="sTempVal">65 °C</span></div>
  <div class="row"><label data-zh="喷淋压力" data-en="Spray pressure">喷淋压力</label><input id="sPress" type="range" min="0.5" max="1.5" step="0.05" value="1"><span class="val" id="sPressVal">1.00 ×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles"> <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label> <label><input id="tglFlow" type="checkbox" checked> <span data-zh="水流粒子" data-en="Water jets">水流粒子</span></label> <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span> <a href="../washing-machine/" data-zh="洗衣机:滚筒与织物" data-en="washing-machine: drum & fabric">洗衣机:滚筒与织物</a> <a href="../surfactant-micelle/" data-zh="表面活性剂与胶束" data-en="surfactant-micelle">表面活性剂与胶束</a> <a href="../heat-pump/" data-zh="热泵:搬热的机器" data-en="heat-pump: moving heat">热泵:搬热的机器</a> <a href="../thermostat/" data-zh="温控器:反馈恒温" data-en="thermostat: feedback control">温控器:反馈恒温</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e1418, 20, 58);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0e1418 : 0xdde6ec);
  scene.fog.color = new THREE.Color(dark ? 0x0e1418 : 0xdde6ec);
  groundM.color.setHex(dark ? 0x14181d : 0xb6c1cb);
  baseM.color.setHex(dark ? 0x1c2127 : 0xc3ccd5);
  shellM.color.setHex(dark ? 0x2b313a : 0x93a0ad);
  linerM.color.setHex(dark ? 0x78838e : 0xaeb9c4);
  doorM.color.setHex(dark ? 0x31373f : 0xa7b3bf);
  panelM.color.setHex(dark ? 0x22262d : 0x8f9ba7);
  rackM.color.setHex(dark ? 0x9aa4ae : 0x7c8894);
  armM.color.setHex(dark ? 0x8f99a3 : 0x76828e);
  pumpM.color.setHex(dark ? 0x3a4049 : 0x98a4b0);
  pipeM.color.setHex(dark ? 0x4a525c : 0x8b98a5);
  valveM.color.setHex(dark ? 0x46525e : 0x93a0ac);
  dispM.color.setHex(dark ? 0x3a4148 : 0x9fabb7);
  plateM.color.setHex(dark ? 0xe8e4dc : 0xf4f1ea);
  potM.color.setHex(dark ? 0x9aa2ab : 0xb9c2cb);
  glassM.color.setHex(dark ? 0xbfe9f2 : 0x9fd6e4);
  waterM.color.setHex(dark ? 0x2fb8cc : 0x189aab);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('洗碗机 · 热水、射流与时间的合奏', 'The Dishwasher · Hot Water, Jets & Time');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160); camera.position.set(7.2, 4.8, 9.4);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xe8f4f8, 0x1a1e24, 0.55); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(8, 12, 9); scene.add(key);
const fillL = new THREE.DirectionalLight(0xa8dcf0, 0.3); fillL.position.set(-9, 6, -7); scene.add(fillL);

/* ================= 运行状态(真实数值) ================= */
let washT = 65, press = 1.0;                 // 主洗设定温度 °C / 喷淋压力倍数

function buildArm(y, nSpokes, len, down) {
  const g = new THREE.Group();
  g.position.y = y;

  g.add(hub);

    const sp = new THREE.Group();
    sp.rotation.y = s * Math.PI * 2 / nSpokes;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.045, 0.085), armM);
    sp.add(bar);
    for (let k = 1; k <= 2; k++) {
      const r = len / 2 - 0.14 * k;
      for (const sgn of [-1, 1]) {
        const nz = new THREE.Mesh(nozGeo, armM);
        nz.position.set(sgn * r, 0.02, 0);
        nz.rotation.z = down ? sgn * 0.55 : -sgn * 0.45;
        sp.add(nz);
      }
    }
    g.add(sp);
  }
  scene.add(g);
  return g;
}

/* ---------------- 射流粒子(Points + vertexColors,≤2000) ---------------- */
const P_MAX = 760;
const parts = [];
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_MAX * 3), pCol = new Float32Array(P_MAX * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false }));
pPoints.frustumCulled = false; scene.add(pPoints);
const C_SPRAY = new THREE.Color(0x66d9e8), C_SPRAY2 = new THREE.Color(0x99e9f2), C_IN = new THREE.Color(0x4dabf7), C_DR = new THREE.Color(0xb197fc), C_ENZ = new THREE.Color(0x8ce99a), C_SUR = new THREE.Color(0x74c0fc), C_ALK = new THREE.Color(0xffd43b), C_STEAM = new THREE.Color(0xc4ced6), C_SPARK = new THREE.Color(0xffe066);
let sprayAcc = 0, sprayAccU = 0, inletAcc = 0, drainAcc = 0, detAcc = 0, steamAcc = 0;
function spawnSpray(upper) {
  if (parts.length >= P_MAX) return;
  let a = Math.random() * Math.PI * 2;
  if (Math.sin(a) > 0.2 && Math.random() < 0.75) return;      // 偏向剖开的半边,便于观察
  const r = upper ? rand(0.35, 0.78) : rand(0.4, 0.88);
  const pitch = upper ? -rand(0.7, 0.95) : rand(0.55, 0.8);
  const sp = 4.0 + 2.8 * press;
  const cosp = Math.cos(pitch), om = upper ? -armOmega * 0.8 : armOmega;
  parts.push({ x: Math.cos(a) * r, y: upper ? 2.98 : 0.7, z: Math.sin(a) * r, vx: Math.cos(a) * cosp * sp - Math.sin(a) * om * r, vy: Math.sin(pitch) * sp, vz: Math.sin(a) * cosp * sp + Math.cos(a) * om * r, tp: upper ? 1 : 0, k: 0, age: 0 });
}
function spawnInlet() {
  if (parts.length >= P_MAX) return;
  parts.push({ x: 2.05, y: 0.8, z: -0.55, vx: -0.3, vy: -1.6, vz: 0, tp: 2, k: 0, age: 0 });
}
function spawnDrain() {
  if (parts.length >= P_MAX) return;
  const x = rand(-1.6, 1.0), y = rand(0.35, 0.55), z = rand(-1.2, 0.6);
  const d = new THREE.Vector3(-2.2 - x, 0.45 - y, -0.6 - z).normalize().multiplyScalar(rand(2.4, 3.2));
  parts.push({ x, y, z, vx: d.x, vy: d.y, vz: d.z, tp: 3, k: 0, age: 0 });
}
function spawnFleck() {
  if (parts.length >= P_MAX) return;
  parts.push({ x: 1.15 + rand(-0.12, 0.12), y: 2.62, z: -1.42, vx: rand(-0.25, 0.25), vy: -0.4, vz: rand(-0.15, 0.15), tp: 4, k: Math.floor(Math.random() * 3), age: 0 });
}
function spawnSteam() {
  if (parts.length >= P_MAX) return;
  parts.push({ x: rand(-1.4, 1.4), y: 0.6, z: rand(-1, 1), vx: rand(-0.08, 0.08), vy: rand(0.45, 0.95), vz: rand(-0.08, 0.08), tp: 5, k: 0, age: 0 });
}
function spawnSpark(x, y, z) {
  if (parts.length >= P_MAX) return;
  parts.push({ x, y, z, vx: rand(-1.2, 1.2), vy: rand(0.3, 1.4), vz: rand(-1.2, 1.2), tp: 6, k: 0, age: 0 });
}
function stepParticles(dt) {
  const p = PHASES[phaseI];
  const pumpAct = p.pump && fillK > 0.4 && flowOn;
  if (flowOn) {
    if (pumpAct) {
      sprayAcc += dt * 150 * press;
      while (sprayAcc > 1) { sprayAcc -= 1; spawnSpray(false); }
      sprayAccU += dt * 110 * press;
      while (sprayAccU > 1) { sprayAccU -= 1; spawnSpray(true); }
    }
    if (p.pump && fillK < 0.95) { inletAcc += dt * 40; while (inletAcc > 1) { inletAcc -= 1; spawnInlet(); } }
    if (p.drain && fillK > 0.05) { drainAcc += dt * 65; while (drainAcc > 1) { drainAcc -= 1; spawnDrain(); } }
    if (detergOpenT > 0) { detAcc += dt * 32; while (detAcc > 1) { detAcc -= 1; spawnFleck(); } }
    if (p.dry) { steamAcc += dt * 16; while (steamAcc > 1) { steamAcc -= 1; spawnSteam(); } }
  }
  const enzF = (waterTemp >= 50 && waterTemp <= 65) ? 1 : ((waterTemp >= 45 && waterTemp <= 70) ? 0.55 : 0.12);
  const dmg = 0.14 * (0.35 + enzF * 0.85 + (detergActive ? 0.55 : 0)) * (0.7 + 0.5 * press);
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.age += dt;
    if (q.tp <= 1) q.vy -= 5 * dt;
    else if (q.tp === 4) q.vy -= 2.2 * dt;
    else if (q.tp === 6) q.vy -= 4 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    let kill = false;
    if (q.tp <= 1) {
      if (q.y < 0.52 && q.vy < 0) kill = true;
      if (Math.abs(q.x) > 2.28 || Math.abs(q.z) > 1.82 || q.y > 3.35 || q.age > 1.9) kill = true;
      if (!kill && pumpAct) {
        for (const s of stains) {
          if (s.done || (s.sh && !crowdG.visible) || s.cd > 0) continue;
          const dx = q.x - s.x, dy = q.y - s.y, dz = q.z - s.z;
          if (dx * dx + dy * dy + dz * dz < 0.0144) {
            s.hp -= dmg; s.cd = 0.22; kill = true;
            if (s.hp <= 0 && !s.done) {
              s.done = true; s.m.visible = false; removed++;
              for (let k = 0; k < 6; k++) spawnSpark(s.x, s.y, s.z);
            }
            break;
          }
        }
      }
    } else if (q.tp === 2) { if (q.y < 0.52) kill = true; }
    else if (q.tp === 3) { if (Math.hypot(q.x + 2.2, q.z + 0.6) < 0.25 || q.age > 2.2) kill = true; }
    else if (q.tp === 4) { if (q.y < 0.52) kill = true; }
    else if (q.tp === 5) { if (q.y > 3.2 || q.age > 3) kill = true; }
    else if (q.tp === 6) { if (q.age > 0.35) kill = true; }
    if (kill) parts.splice(i, 1);
  }
  for (const s of stains) if (s.cd > 0) s.cd -= dt;
}
function drawParticles() {
  for (let i = 0; i < P_MAX; i++) {
    if (i < parts.length) {
      const q = parts[i];
      let c;
      if (q.tp === 0) c = C_SPRAY; else if (q.tp === 1) c = C_SPRAY2; else if (q.tp === 2) c = C_IN;
      else if (q.tp === 3) c = C_DR; else if (q.tp === 5) c = C_STEAM; else if (q.tp === 6) c = C_SPARK;
      else c = [C_ENZ, C_SUR, C_ALK][q.k];
      pPos[i * 3] = q.x; pPos[i * 3 + 1] = q.y; pPos[i * 3 + 2] = q.z;
      pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
    } else pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* ---------------- 周期状态机 ---------------- */
function onPhaseEnter(p) {
  if (p.det && !detergActive) {
    detergActive = true; detergOpenT = 1.3;
    notify('主洗开始:洗涤剂仓自动弹开,酶+表面活性剂+碱随水进舱', 'main wash: the dispenser flips open — enzymes, surfactants and alkali join the water');
  }
  if (p.aid && !aidUsed) {
    aidUsed = true;
    notify('漂洗 2 加亮碟剂:表面张力 72→~25 mN/m,水铺膜流走不结斑', 'rinse aid in the final rinse: surface tension 72→~25 mN/m, water sheets off with no spots');
  }
  if (p.dry) notify('烘干:不锈钢内胆的余热+冷凝,蒸汽凝在较冷的壁与门上排走', 'drying: residual heat of the hot liner condenses steam on the cooler walls and door');
}
function resetCycle() {
  for (const s of stains) { s.hp = 1; s.done = false; s.cd = 0; s.m.visible = true; }
  removed = 0; waterUsed = 0; energy = 0;
  detergActive = false; aidUsed = false; fillK = 0;
}
function stepSim(dt) {
  simT += dt; cycleT += dt;
  if (cycleT >= TOTAL) { cycleT -= TOTAL; resetCycle(); }
  let acc = 0, ni = PHASES.length - 1;
  for (let i = 0; i < PHASES.length; i++) { if (cycleT < acc + PHASES[i].dur) { ni = i; break; } acc += PHASES[i].dur; }
  if (ni !== phaseI) { phaseI = ni; onPhaseEnter(PHASES[phaseI]); }
  const p = PHASES[phaseI];
  const target = p.T ? p.T() : 22;
  if (p.pump) {
    if (fillK < 1) { fillK = clamp(fillK + dt / 2.2, 0, 1); waterUsed += p.water * dt / 2.2; }
    if (waterTemp < target - 0.3) {
      const dT = clamp((target - waterTemp) * 1.1, 0, 3.0) * dt;
      waterTemp += dT;
      energy += p.water * 4.18 * dT / 3600;        // W = c·m·ΔT,按实际升温精确累计
    } else if (waterTemp > target + 0.3) waterTemp += (target - waterTemp) * 0.30 * dt;
    energy += dt * 0.38 * 118 / 3600;              // 循环泵 ~0.38 kW × 时间压缩系数
  } else if (p.drain) {
    fillK = clamp(fillK - dt / 3.2, 0, 1);
    waterTemp += (22 - waterTemp) * 0.03 * dt;
  } else {
    fillK = clamp(fillK - dt / 3.2, 0, 1);
    waterTemp += (22 - waterTemp) * 0.05 * dt;
    energy += dt * 0.5 * 118 / 3600;               // 烘干风机+辅热 ~0.5 kW
  }
  if (detergOpenT > 0) detergOpenT -= dt;
  const armTgt = (p.pump && fillK > 0.35) ? 6.2 * press : 0;
  armOmega += (armTgt - armOmega) * Math.min(1, 3 * dt);
  armAngL += armOmega * dt;
  armAngU -= armOmega * 0.8 * dt;
  const hOn = p.pump && waterTemp < target - 0.5;
  heaterGlow += ((hOn ? 1 : 0) - heaterGlow) * Math.min(1, 4 * dt);
}

const plotCv = document.getElementById('plotCv');
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 38, padR = 12, padT = 28, padB = 24;
  const xOf = t => padL + t / TOTAL * (W - padL - padR);
  const yOf = T => (H - padB) - clamp(T, 0, 85) / 85 * (H - padT - padB);
  ctx.font = '12px system-ui';
  /* 阶段色带 */
  let a0 = 0;
  for (const p of PHASES) {
    ctx.fillStyle = hexA(p.col, 0.22);
    ctx.fillRect(xOf(a0), padT, xOf(a0 + p.dur) - xOf(a0), H - padT - padB);
    ctx.fillStyle = cTxt;
    ctx.fillText(L(p.szh, p.se), xOf(a0 + p.dur / 2) - 9, padT + 14);
    a0 += p.dur;
  }
  /* 坐标 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('80°C', 4, yOf(80) + 4);
  ctx.fillText('40°C', 4, yOf(40) + 4);
  ctx.fillText('0°C', 4, yOf(0) + 4);
  ctx.fillText(L('程序进度', 'program'), W - 78, H - padB + 16);
  /* 目标温度曲线:湿段平台 + 烘干衰减 */
  ctx.strokeStyle = '#66d9e8'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  a0 = 0;
  let prevT = PHASES[0].T ? PHASES[0].T() : 22;
  ctx.moveTo(xOf(0), yOf(prevT));
  for (const p of PHASES) {
    const t1 = p.dry ? 30 : (p.T ? p.T() : 22);
    ctx.lineTo(xOf(a0), yOf(t1));
    ctx.lineTo(xOf(a0 + p.dur), yOf(t1));
    prevT = t1; a0 += p.dur;
  }
  ctx.stroke();
  /* 当前水温动点 */
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(xOf(cycleT), yOf(waterTemp), 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('当前', 'now'), xOf(cycleT) + 7, yOf(waterTemp) - 6);
}

const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    stepSim(dt);
    stepParticles(dt);
  }
  /* 场景同步 */
  armL.rotation.y = armAngL;
  armU.rotation.y = armAngU;
  poolMesh.scale.y = Math.max(0.001, fillK);
  poolMesh.visible = fillK > 0.02;
  heaterM.emissiveIntensity = heaterGlow * (1.1 + 0.25 * Math.sin(simT * 9));
  lid.rotation.x = lerp(lid.rotation.x, detergOpenT > 0 ? -1.15 : 0, 0.15);
  crowdG.visible = phaseIdx === 6;
  drawParticles();
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.18) { acc = 0; updateStats(); updateFormula(); }
