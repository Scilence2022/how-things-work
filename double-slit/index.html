<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双缝干涉 · 光程差决定明暗</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#69db7c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2f9e44;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(105,219,124,.9); color: #c9f3da; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(47,158,68,.9); color: #2f9e44; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #69db7c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: var(--acc); background: rgba(105,219,124,.12); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(105,219,124,.10); border-color: rgba(105,219,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(47,158,68,.08); border-color: rgba(47,158,68,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c9f3da; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="双缝干涉：光程差决定明暗" data-en="Double-Slit: path difference makes fringes">双缝干涉：光程差决定明暗</h1>
  <div class="sub" data-zh="两缝波前同相出发,屏上明暗相间:光程差 = 整数波长 → 相长;半整数 → 相消;一颗一颗发射也照样长出条纹 · 空格播放/暂停" data-en="Two in-phase wavefronts weave fringes: integer path difference = bright, half-integer = dark; fire photons one by one and the fringes still grow · Space = play/pause">两缝波前同相出发,屏上明暗相间:光程差 = 整数波长 → 相长;半整数 → 相消;一颗一颗发射也照样长出条纹 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="波长 λ" data-en="wavelength λ">波长 λ</span><span class="v g" id="stL">—</span>
  <span class="k" data-zh="条纹间距 Δy" data-en="fringe spacing Δy">条纹间距 Δy</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="已落光子" data-en="photons landed">已落光子</span><span class="v" id="stN">0</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnPhoton" data-zh="一颗一颗发射(量子模式)" data-en="fire one by one (quantum mode)">一颗一颗发射(量子模式)</button>
    <button class="abtn" id="btnClear" data-zh="清屏重攒" data-en="clear screen">清屏重攒</button>
  </div>
  <div class="row"><label data-zh="波长 λ" data-en="wavelength λ">波长 λ</label><input id="wl" type="range" min="40" max="120" step="2" value="64"><span class="val" id="wlVal">480 nm</span></div>
  <div class="row"><label data-zh="缝距 d" data-en="slit gap d">缝距 d</label><input id="d" type="range" min="20" max="80" step="2" value="40"><span class="val" id="dVal">2.0</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglWave" type="checkbox" checked> <span data-zh="波前" data-en="wavefronts">波前</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../standing-waves/" data-zh="驻波:另一种相消" data-en="standing waves: another cancellation">驻波:另一种相消</a>
    <a href="../polarization/" data-zh="偏振:光的另一副面孔" data-en="polarization: another face of light">偏振:光的另一副面孔</a>
    <a href="../doppler-effect/" data-zh="多普勒:波长的另一场戏" data-en="doppler: wavelength on stage">多普勒:波长的另一场戏</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.wall.color.set(THEME === 'light' ? 0x8a93a3 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('双缝干涉 · 光程差决定明暗', 'Double Slit · path difference');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(-1.6, 2.6, 8.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.6, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  wall: mat(0x39424f, { roughness: 0.7 }),
  frame: mat(0x1b212c, { roughness: 0.7 }),
  laser: mat(0xff6b6b, { roughness: 0.4 }),
  screen: mat(0x0e1420, { roughness: 0.4 }),
  band: new THREE.MeshBasicMaterial({ color: 0x69db7c, transparent: true, opacity: 0.9, depthWrite: false }),
  wave: new THREE.MeshBasicMaterial({ color: 0x69db7c, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
};

/* ================= 布局:x 向右=传播方向;缝障 x=2.2;屏 x=6.4 ================= */
const X_SRC = -1.4, X_SLIT = 2.2, X_SCR = 6.4, H = 1.2;
const SLIT_HALF = 0.22;         // 缝在 z=±0.22(缝距可调)
const floor = new THREE.Mesh(new THREE.BoxGeometry(11, 0.16, 4), M.frame);
floor.position.set(2.5, -0.9, 0);
scene.add(floor);
/* 光源(激光器) */
const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.7, 18), M.laser);
laser.rotation.z = Math.PI / 2;
laser.position.set(X_SRC, H, 0);
scene.add(laser);
/* 双缝屏障(竖直板,两缝缺口) */
const wallGrp = new THREE.Group();
wallGrp.position.set(X_SLIT, H, 0);
scene.add(wallGrp);
{
  const segH = 1.6, gap = 0.24;
  const parts = [
    [segH, -SLIT_HALF - gap / 2 - segH / 2],
    [gap, -SLIT_HALF - gap / 2],
    [gap, SLIT_HALF + gap / 2],
    [segH, SLIT_HALF + gap / 2 + segH / 2],
  ];
  for (const [h, z] of parts) {
    const seg = new THREE.Mesh(new THREE.BoxGeometry(0.08, segH * 0 + 1.3, h), M.wall);
    seg.scale.y = 1;
    seg.position.set(0, 0, z - (Math.abs(z) > 0.5 ? 0 : 0));
    seg.geometry = new THREE.BoxGeometry(0.08, 1.35, h);
    wallGrp.add(seg);
  }
}
/* 屏幕(右,竖直接收板) */
const screen = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.9, 2.0), M.screen);
screen.position.set(X_SCR, H, 0);
scene.add(screen);
/* 屏上亮纹(竖条,亮度=干涉强度) */
const bands = [];
const NB = 9;
for (let i = 0; i < NB; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.14), M.band.clone());
  screen.add(b);
  bands.push(b);
}
/* 干涉场点云(波传播区域网格亮度) */
const fieldN = 46;
const fieldGeo = new THREE.BufferGeometry();
{
  const positions = new Float32Array(fieldN * (fieldN - 4) * 3);
  fieldGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
}
const fieldPts = new THREE.Points(fieldGeo, new THREE.PointsMaterial({
  size: 0.07, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
scene.add(fieldPts);
const fColor = new Float32Array(fieldN * (fieldN - 4) * 3);
fieldGeo.setAttribute('color', new THREE.BufferAttribute(fColor, 3));
/* 波前弧(两缝出发的同心圆环,动态) */
const arcs = [];
for (let s = 0; s < 2; s++) for (let i = 0; i < 7; i++) {
  const arc = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 40, Math.PI * 0.85), M.wave.clone());
  arc.rotation.x = Math.PI / 2;         // 竖直平面内(x-y)
  arc.rotation.z = 0;
  arc.position.set(X_SLIT, H, s === 0 ? -SLIT_HALF : SLIT_HALF);
  scene.add(arc);
  arcs.push(arc);
}
/* 量子模式:逐个落屏的光子点 */
const photons = [];
const phGeo = new THREE.BufferGeometry();
phGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(400 * 3), 3));
const phPts = new THREE.Points(phGeo, new THREE.PointsMaterial({ size: 0.045, color: 0xc9f3da, transparent: true, opacity: 0.95 }));
phPts.visible = false;
scene.add(phPts);
let phCount = 0;

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let lambdaNM = 480;            // 显示用
let lam = 0.64;                // 视觉波长(世界单位)
let slitGap = 0.44;            // 视觉缝距
let quantumMode = false;
let tSim = 0;
function fringeSpacing() { return lam * 4.2 / slitGap; }   // Δy = λL/d

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblSlit = addLabel(() => L(`双缝 d = ${(slitGap * 10 / 2).toFixed(1)}`, `slits d = ${(slitGap * 10 / 2).toFixed(1)}`),
  new THREE.Vector3(X_SLIT, H + 1.15, 0), 'g', wallGrp);
const lblScr = addLabel(() => quantumMode ? L(`量子模式:随机落点长出条纹`, 'quantum: random hits weave fringes')
  : L(`屏:Δy = λL/d = ${(fringeSpacing() * 10 / 2).toFixed(1)}`, `screen: Δy = λL/d = ${(fringeSpacing() * 10 / 2).toFixed(1)}`),
  new THREE.Vector3(X_SCR, H + 1.35, 0), 'st');
const lblStatus = addLabel(() => L('绿色亮带 = 相长(整数波长);暗隙 = 相消(半整数)', 'green bands = constructive (integer λ); gaps = destructive'),
  new THREE.Vector3(2.5, -0.55, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '一条缝是扇形波前', be: 'One slit: a fan of wavefronts',
    d: '波前到达缝,缝上每点都成了新的波源(惠更斯)——每条缝向右发出一组同心弧。',
    de: 'Each slit becomes a fresh source (Huygens): a fan of circular wavefronts spreading right.',
    act: () => { quantumMode = false; document.getElementById('btnPhoton').classList.remove('on'); phPts.visible = false; } },
  { b: '两缝相遇:干涉', be: 'Two slits: interference',
    d: '两列波同相出发,屏上每点的亮度取决于光程差——差整整数个波长则同相相加,差半个则互相抵消。',
    de: 'Brightness at each point reads the path difference: whole wavelengths add up, half wavelengths cancel.',
    act: () => { quantumMode = false; phPts.visible = false; document.getElementById('btnPhoton').classList.remove('on'); } },
  { b: '条纹间距:Δy = λL/d', be: 'Fringe spacing: Δy = λL/d',
    d: '波长越长、屏越远,条纹越疏;缝距越大,条纹越密。拖两个滑块现场验证公式。',
    de: 'Longer λ or farther screen widens the fringes; wider slit gap tightens them. Verify live with the sliders.',
    act: () => { quantumMode = false; phPts.visible = false; document.getElementById('btnPhoton').classList.remove('on'); } },
  { b: '量子模式:一颗一颗也行', be: 'Quantum mode: one photon at a time',
    d: '把光源调到一次只放一颗光子:每颗落点随机,但攒上几百颗,条纹自己浮现——概率波穿过两缝。',
    de: 'Fire one photon at a time: each lands randomly, yet a few hundred later the fringes emerge — probability waves through both slits.',
    act: () => { quantumMode = !quantumMode; phPts.visible = quantumMode; document.getElementById('btnPhoton').classList.toggle('on', quantumMode); } },
];
function stepIndex() {
  if (quantumMode) return 3;
  if (Math.abs(lambdaNM - 480) > 100) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elWl = document.getElementById('wl');
const elWlVal = document.getElementById('wlVal');
const elD = document.getElementById('d');
const elDVal = document.getElementById('dVal');
const tglLabels = document.getElementById('tglLabels');
const tglWave = document.getElementById('tglWave');
const tglRotate = document.getElementById('tglRotate');
const stL = document.getElementById('stL'), stF = document.getElementById('stF'),
  stN = document.getElementById('stN');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSlits() {
  /* 重摆两段缝与波前弧位置 */
  wallGrp.children.forEach((seg, i) => {
    const zs = [-slitGap / 2 - 0.24 - 0.8, -slitGap / 2 - 0.12, slitGap / 2 + 0.12, slitGap / 2 + 0.24 + 0.8];
    seg.position.z = zs[i] || 0;
  });
  arcs.forEach((a, i) => {
    const s = i < 7 ? 0 : 1;
    a.position.z = s === 0 ? -slitGap / 2 : slitGap / 2;
  });
}
elWl.addEventListener('input', () => { lambdaNM = parseInt(elWl.value, 10) * 8; lam = parseInt(elWl.value, 10) / 100; elWlVal.textContent = lambdaNM + ' nm'; });
elD.addEventListener('input', () => { slitGap = parseInt(elD.value, 10) / 100 * 1.1; elDVal.textContent = (slitGap * 10 / 2).toFixed(1); syncSlits(); });
document.getElementById('btnPhoton').addEventListener('click', () => {
  quantumMode = !quantumMode;
  document.getElementById('btnPhoton').classList.toggle('on', quantumMode);
  phPts.visible = quantumMode;
});
document.getElementById('btnClear').addEventListener('click', () => { phCount = 0; phGeo.setDrawRange(0, 0); });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglWave.addEventListener('change', () => { arcs.forEach(a => a.visible = tglWave.checked); fieldPts.visible = tglWave.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const cTmp = new THREE.Color();
function intensity(z, y) {
  /* 两缝到屏上点 (X_SCR, y, z) 的光程差 → 强度 0..1 */
  const dz1 = z + slitGap / 2, dz2 = z - slitGap / 2;
  const r1 = Math.hypot(X_SCR - X_SLIT, y - H, dz1);
  const r2 = Math.hypot(X_SCR - X_SLIT, y - H, dz2);
  const dphi = (r1 - r2) / lam * Math.PI * 2;
  const env = Math.exp(-Math.pow((z) / 0.85, 2));       // 包络
  return Math.max(Math.cos(dphi), 0) ** 2 * env;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  /* 波场点云:位置固定,颜色随强度脉动 */
  const pos = fieldGeo.attributes.position;
  const col = fieldGeo.attributes.color;
  let k = 0;
  for (let ix = 0; ix < fieldN; ix++) {
    const x = X_SLIT + 0.15 + (X_SCR - X_SLIT - 0.3) * ix / (fieldN - 1);
    for (let iz = 2; iz < fieldN - 2; iz++) {
      const z = -1.0 + 2.0 * (iz - 2) / (fieldN - 5);
      pos.setXYZ(k, x, H, z);
      const I = intensity(z, H);
      const pulse = 0.55 + 0.45 * Math.sin(x * 7 - tSim * 6);
      cTmp.setRGB(0.2 * I * pulse + 0.02, 0.95 * I * pulse, 0.45 * I * pulse);
      col.setXYZ(k, cTmp.r, cTmp.g, cTmp.b);
      k++;
    }
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;

  /* 波前弧扩散 */
  arcs.forEach((a, i) => {
    const s = i < 7 ? 0 : 1;
    const idx = i % 7;
    const r = ((tSim * 1.6 + idx / 7) % 1) * (X_SCR - X_SLIT - 0.1) + 0.15;
    a.scale.setScalar(r);
    a.material.opacity = 0.32 * (1 - r / (X_SCR - X_SLIT));
    a.visible = tglWave.checked;
  });

  /* 屏上亮纹:按强度摆亮度 */
  bands.forEach((b, i) => {
    const z = -0.8 + i / (NB - 1) * 1.6;
    const I = intensity(z, H);
    b.material.opacity = 0.08 + I * 0.9;
    b.scale.y = 0.5 + I * 1.1;
    b.position.z = z;
  });

  /* 量子模式:随机落点 */
  if (quantumMode && playing) {
    for (let n = 0; n < 2; n++) {
      if (phCount >= 400) break;
      /* 按强度分布采样(拒绝法) */
      let z;
      for (let tries = 0; tries < 40; tries++) {
        z = (Math.random() * 2 - 1) * 0.85;
        if (Math.random() < intensity(z, H)) break;
      }
      const y = H + (Math.random() - 0.5) * 1.4;
      phGeo.attributes.position.setXYZ(phCount, X_SCR + 0.05, y, z);
      phCount++;
      phGeo.setDrawRange(0, phCount);
      phGeo.attributes.position.needsUpdate = true;
    }
  }
  stN.textContent = quantumMode ? phCount : '—';
  stL.textContent = lambdaNM + ' nm';
  stF.innerHTML = (fringeSpacing() * 10 / 2).toFixed(1) + '<small> cm(示意)</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncSlits();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
