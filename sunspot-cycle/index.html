<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳黑子 · 11 年磁周期</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0f0e13; --panel:rgba(15,14,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,14,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,14,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#ece7de; --panel:rgba(255,255,255,.88); --panel-border:rgba(40,30,20,.10);
    --text:#1c2027; --text2:#5f6b7d; --text3:#33414f;
    --hover:rgba(40,30,20,.05); --shadow:0 8px 26px rgba(50,40,25,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(40,30,20,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(40,30,20,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="太阳黑子 · 11 年磁周期" data-en="Sunspots · The 11-Year Magnetic Cycle">太阳黑子 · 11 年磁周期</h1>
  <div class="sub" data-zh="太阳不是固体球:赤道 25 天自转一圈,极区却要 30 天以上;磁力线冻结在等离子体里,只能被这种差速越缠越紧——极向场被 Ω 效应拧成环向场,磁浮力把缠得最紧的磁流管顶破光球,成对黑子便在 ±30° 纬度带冒出,前导与后随极性相反、因 Joy 定律微微倾斜;黑子带一边涌现一边向赤道行军,11 年在纬度-时间图上画成一只蝴蝶;周期尾声,超额黑子的后随极性被经向环流搬去极区,磁场整个翻面,22 年才转回原样 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The Sun is not a solid ball: the equator spins around in 25 days while the poles take 30+; field lines are frozen into the plasma and get wound ever tighter by this differential rotation — the poloidal field is twisted by the Ω-effect into a toroidal one, magnetic buoyancy punches the tightest flux tubes through the photosphere, and sunspot pairs pop up in the ±30° belts, leading and trailing of opposite polarity, slightly tilted by Joy's law; the belts march toward the equator, drawing a butterfly over 11 years; at cycle's end meridional flow carries trailing polarity poleward, the field flips, and 22 years restore the start · 3D interactive demo · drag to orbit · Space = run/pause">太阳黑子 · 11 年磁周期</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="模拟日期" data-en="Sim date">模拟日期</span><span class="v" id="stDate">—</span>
  <span class="k" data-zh="自转周期" data-en="Rotation period">自转周期</span><span class="v" id="stRot">—</span>
  <span class="k" data-zh="环向场强度" data-en="Toroidal field">环向场强度</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="黑子数(平滑)" data-en="Sunspot number">黑子数(平滑)</span><span class="v" id="stSSN">—</span>
  <span class="k" data-zh="周期相位" data-en="Cycle phase">周期相位</span><span class="v" id="stPh">—</span>
  <span class="k" data-zh="极性" data-en="Polarity">极性</span><span class="v" id="stPole">—</span>
</div>

<div id="plot">
  <h3 data-zh="蒙德蝴蝶图(黑子纬度随时间向赤道迁移,上)+ 黑子数 11 年锯齿(下),实时累积" data-en="Maunder butterfly (spot latitude migrating equatorward, top) + the 11-year sunspot sawtooth (bottom), accumulating live">蒙德蝴蝶图(黑子纬度随时间向赤道迁移,上)+ 黑子数 11 年锯齿(下),实时累积</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="米黄光球:约 6000 K 表面" data-en="beige photosphere: ~6000 K surface">米黄光球:约 6000 K 表面</span>
    <span class="chip.b" data-zh="青色大环:极向场 B_p" data-en="cyan loops: poloidal field B_p">青色大环:极向场 B_p</span>
    <span class="chip.r" data-zh="橙红绳圈:环向场 B_φ(张力大)" data-en="orange bands: toroidal B_φ (high tension)">橙红绳圈:环向场 B_φ(张力大)</span>
    <span class="chip.g" data-zh="经度标记:差速自转的见证" data-en="longitude marks: witnesses of differential spin">经度标记:差速自转的见证</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnNew" data-zh="重置新周期" data-en="Reset new cycle">重置新周期</button>
    <button class="abtn" id="btnMin" data-zh="跳到极小期" data-en="Jump to minimum">跳到极小期</button>
  </div>
  <div class="row"><label data-zh="时间加速" data-en="Time speed">时间加速</label><input id="sSpd" type="range" min="0" max="100" step="2" value="78"><span class="val" id="sSpdVal">100 天/s</span></div>
  <div class="row"><label data-zh="差速强度" data-en="Shear boost">差速强度</label><input id="sDiff" type="range" min="1" max="5" step="0.5" value="1"><span class="val" id="sDiffVal">×1.0</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="磁力线" data-en="Field lines">磁力线</span></label>
      <label><input id="tglButterfly" type="checkbox" checked> <span data-zh="蝴蝶图" data-en="Butterfly">蝴蝶图</span></label>
      <label><input id="tglCore" type="checkbox"> <span data-zh="核心剖切" data-en="Core cutaway">核心剖切</span></label>
      <label><input id="tglSpotLbl" type="checkbox" checked> <span data-zh="黑子对标签" data-en="Pair labels">黑子对标签</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ferromagnetism/" data-zh="铁磁体:另一种磁秩序" data-en="ferromagnetism: a different magnetic order">铁磁体:另一种磁秩序</a>
    <a href="../aurora/" data-zh="极光:太阳活动的下游表演" data-en="aurora: downstream of solar activity">极光:太阳活动的下游表演</a>
    <a href="../electromagnetic-induction/" data-zh="电磁感应:磁场怎么发电" data-en="electromagnetic induction: fields make currents">电磁感应:磁场怎么发电</a>
    <a href="../stellar-lifecycle/" data-zh="恒星一生:太阳的位置" data-en="stellar lifecycle: where the Sun sits">恒星一生:太阳的位置</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0f0e13, 10, 30);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f0e13 : 0xece7de);
  scene.fog.color = new THREE.Color(dark ? 0x0f0e13 : 0xece7de);
  mkMat.color.setHex(dark ? 0xffffff : 0x55504a);
  eqMat.opacity = dark ? 0.3 : 0.42;
  glowMat.opacity = dark ? 0.55 : 0.4;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('太阳黑子 · 11 年磁周期', 'Sunspots · The 11-Year Magnetic Cycle');
  buildSteps();
  setPlayLabel();
  syncSliders();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0.4, 1.5, 7.4);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.85);
key.position.set(6, 9, 7);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a8, 0.25);
fillL.position.set(-7, 5, -6);
scene.add(fillL);

/* ================= 太阳周期状态(真实单位) ================= */
const SUN_R = 2.2, CYC_D = 4015, A_REAL = 0.19, ROT_VIS = 0.08;
let tDays = 0, spdRaw = 78, diffK = 1, WIND = 0, spawnAcc = 0, lastSSNDay = -1e9;
let fieldOn = true, cutOn = false, spotLblOn = true, chartOn = true;
const aEff = () => A_REAL * diffK;
const daysPerSec = () => Math.pow(10, spdRaw * 0.0256);
const cycleFrac = () => (tDays % CYC_D) / CYC_D;
const cycIdx = () => Math.floor(tDays / CYC_D);
const polarity = () => cycIdx() % 2 === 0 ? 1 : -1;

/* 磁力线:极向场大环(被差速拧转)+ 环向场绳圈 */
const loopMat = new THREE.MeshBasicMaterial({ color: 0x3bc0d8, transparent: true, opacity: 0.85, depthWrite: false });
const loops = [{ phi0: 0, mesh: null }, { phi0: Math.PI / 2, mesh: null }];
function rebuildLoops() {
  if (!webglOK) return;
  const base = polarity() > 0 ? new THREE.Color(0x3bc0d8) : new THREE.Color(0xd86fe0);
  loopMat.color.copy(base).lerp(new THREE.Color(0xff5a2e), Math.min(1, WIND / 5));
  for (const lp of loops) {
    const pts = [];
    for (let k = 0; k < 72; k++) {
      const s = k / 72, half = s < 0.5 ? 0 : 1;
      const th = half ? Math.PI * (2 - 2 * s) : Math.PI * 2 * s;
      const lam = Math.PI / 2 - th;
      const drag = -WIND * Math.sin(lam) * Math.sin(lam);
      const phi = lp.phi0 + half * Math.PI + drag;
      const rr = SUN_R * (1.03 + 0.42 * Math.sin(th) * Math.sin(th));
      pts.push(new THREE.Vector3(rr * Math.cos(lam) * Math.cos(phi), rr * Math.sin(lam), rr * Math.cos(lam) * Math.sin(phi)));
    }
    const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 96, 0.035, 6, true);
    if (lp.mesh) { lp.mesh.geometry.dispose(); lp.mesh.geometry = g; }
    else { lp.mesh = new THREE.Mesh(g, loopMat); lp.mesh.visible = fieldOn; scene.add(lp.mesh); }
  }
  for (const lp of loops) if (lp.mesh) lp.mesh.visible = fieldOn;
}
const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6b3d, transparent: true, opacity: 0, depthWrite: false });
const rings = [{ la: 24, ph: 0 }, { la: 24, ph: Math.PI }, { la: 13, ph: 1.2 }, { la: 13, ph: 4.3 }].map(d => {
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), ringMat);
  mesh.visible = false;
  scene.add(mesh);
  return { def: d, mesh, lat: 999 };
});
function rebuildRings() {
  if (!webglOK) return;
  const p = cycleFrac();
  const op = Math.min(1, Math.max(0, (WIND - 1.1) / 1.8)) * 0.75;
  ringMat.opacity = op;
  ringMat.color.copy(new THREE.Color(0x38b6c8).lerp(new THREE.Color(0xff5a2e), Math.min(1, WIND / 5)));
  for (const rg of rings) {
    if (op <= 0.03 || !fieldOn) { rg.mesh.visible = false; continue; }
    rg.mesh.visible = true;
    const la = rg.def.la * (1 - 0.55 * p) + 1.5 * Math.sin(tDays * 0.021 + rg.def.ph);
    if (Math.abs(la - rg.lat) < 0.4) continue;
    rg.lat = la;
    const lr = la * Math.PI / 180;
    const bump = 1.012 + 0.05 * Math.max(0, WIND - 3) / 5 * (0.6 + 0.4 * Math.sin(tDays * 0.5 + rg.def.ph * 7));
    const g = new THREE.TorusGeometry(SUN_R * bump * Math.cos(lr), 0.02, 8, 88);
    g.rotateX(Math.PI / 2);
    rg.mesh.geometry.dispose();
    rg.mesh.geometry = g;
    rg.mesh.position.y = SUN_R * Math.sin(lr);
  }
}

const P_MAX = 30;
const spGeo = new THREE.BufferGeometry();

function spawnPair() {
  const p = cycleFrac();
  const latC = clamp((5 + 30 * (1 - p)) * (0.7 + 0.6 * Math.random()), 4, 38);
  const hemis = Math.random() < 0.72 ? [1, -1] : [Math.random() < 0.5 ? 1 : -1];
  for (const hs of hemis) {
    if (pairs.length >= P_MAX) pairs.shift();
    const lon = Math.random() * 360;
    const tilt = 0.35 * latC * (0.6 + 0.8 * Math.random());
    pairs.push({ laL: hs * (latC - tilt / 2), laT: hs * (latC + tilt / 2), lonL: lon + 3, lonT: lon - 3, born: tDays, life: 5 + Math.random() * 11, tilt, bLat: hs * latC });
    bfly.push({ d: tDays, lat: hs * latC });
  }
  if (bfly.length > 640) bfly.splice(0, 80);
}
function clearPairs() { pairs.length = 0; }
function updateSpots(dRot) {
  for (let i = pairs.length - 1; i >= 0; i--) if (tDays - pairs[i].born > pairs[i].life) pairs.splice(i, 1);
  for (const pr of pairs) {
    const lrL = pr.laL * Math.PI / 180, lrT = pr.laT * Math.PI / 180;
    pr.lonL += 360 / 25.4 * (1 - aEff() * Math.sin(lrL) * Math.sin(lrL)) * dRot;
    pr.lonT += 360 / 25.4 * (1 - aEff() * Math.sin(lrT) * Math.sin(lrT)) * dRot;
  }
  for (let i = 0; i < P_MAX * 2; i++) {
    const pi = i >> 1;
    if (pi >= pairs.length) { spPos[i * 3 + 1] = -9999; continue; }
    const pr = pairs[pi], la = (i & 1) === 0 ? pr.laL : pr.laT, lon = (i & 1) === 0 ? pr.lonL : pr.lonT;
    const lr = la * Math.PI / 180, nl = lon * Math.PI / 180, rr = SUN_R * 1.004, cl = Math.cos(lr);
    spPos[i * 3] = rr * cl * Math.cos(nl); spPos[i * 3 + 1] = rr * Math.sin(lr); spPos[i * 3 + 2] = rr * cl * Math.sin(nl);
  }
  spGeo.attributes.position.needsUpdate = true;
  if (pairs.length) {
    const pr = pairs[pairs.length - 1], lr = pr.laL * Math.PI / 180, nl = pr.lonL * Math.PI / 180;
    const rr = SUN_R * 1.06, cl = Math.cos(lr);
    lblSpot.o.position.set(rr * cl * Math.cos(nl), rr * Math.sin(lr) + 0.18, rr * cl * Math.sin(nl));
  }
}

/* ================= 绘图:蝴蝶图 + 黑子数 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const CW = plotCv.width = plotCv.clientWidth * 2;
  const CH = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, CW, CH);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const d1 = tDays - 2 * CYC_D, d2 = tDays;
  const padL = 34, padR = 10;
  const bh = CH * 0.55;
  const XB = d => padL + (d - d1) / (d2 - d1) * (CW - padL - padR);
  const YB = la => 4 + (1 - (clamp(la, -42, 42) + 42) / 84) * (bh - 10);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(150,160,180,.25)';
  ctx.beginPath(); ctx.moveTo(padL, YB(0)); ctx.lineTo(CW - padR, YB(0)); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('+40°', 2, YB(40) + 4);
  ctx.fillText('−40°', 2, YB(-40) + 4);
  for (const b of bfly) {
    if (b.d < d1) continue;
    ctx.fillStyle = b.lat >= 0 ? '#ffa94d' : '#4dd8e6';
    ctx.fillRect(XB(b.d) - 1.5, YB(b.lat) - 1.5, 3, 3);
  }
  ctx.fillStyle = 'rgba(150,160,175,.8)';
  ctx.fillText(L('蝴蝶图:黑子纬度-时间', 'Butterfly: spot lat vs time'), padL + 6, 14);
  const sy = bh + 8, top = sy + 8, bot = CH - 16;
  ctx.strokeStyle = 'rgba(150,160,180,.2)';
  ctx.beginPath(); ctx.moveTo(padL, sy); ctx.lineTo(CW - padR, sy); ctx.stroke();
  const YS = s => bot - clamp(s, 0, 200) / 200 * (bot - top);
  ctx.fillStyle = cTxt;
  ctx.fillText('200', 2, top + 4);
  ctx.fillText('0', 2, bot);
  ctx.strokeStyle = 'rgba(150,160,180,.25)';
  ctx.beginPath(); ctx.moveTo(padL, YS(100)); ctx.lineTo(CW - padR, YS(100)); ctx.stroke();
  ctx.strokeStyle = '#ff8787';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  for (const h of ssnHist) {
    if (h.d < d1) continue;
    const px = XB(h.d), py = YS(h.s);
    started ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    started = true;
  }
  ctx.lineTo(XB(tDays), YS(ssn()));
  ctx.stroke();
  ctx.fillStyle = '#ff8787';
  ctx.beginPath(); ctx.arc(XB(tDays), YS(ssn()), 3.5, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(150,160,175,.8)';
  ctx.fillText(L('黑子数 SSN', 'Sunspot number'), padL + 6, top + 12);
}

  stB = document.getElementById('stB'), stSSN = document.getElementById('stSSN'),
  stPh = document.getElementById('stPh'), stPole = document.getElementById('stPole');
const formulaEl = document.getElementById('formula');
const btnNew = document.getElementById('btnNew'), btnMin = document.getElementById('btnMin');
const fmtD = () => { const d = daysPerSec(); return (d < 10 ? d.toFixed(1) : String(Math.round(d))) + L(' 天/s', ' d/s'); };
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elSpd.value = spdRaw;
  elSpdVal.textContent = fmtD();
  elDiff.value = diffK;
  elDiffVal.textContent = '×' + diffK.toFixed(1);
}
function phaseName() {
  const p = cycleFrac();
  if (p < 0.04 || p > 0.96) return L('极小期', 'minimum');
  if (p < 0.38) return L('升相', 'rising');
  if (p < 0.5) return L('峰年', 'maximum');
  return L('降相', 'declining');
}
function updateStats() {
  const yr = 2019.92 + tDays / 365.25;
  stDate.textContent = `${Math.floor(yr)}.${String(1 + Math.floor((yr - Math.floor(yr)) * 12)).padStart(2, '0')}`;
  stRot.innerHTML = L(`赤 25.4 · 极 ${(25.4 / (1 - aEff())).toFixed(1)}<small> d</small>`, `Eq 25.4 · Pole ${(25.4 / (1 - aEff())).toFixed(1)}<small> d</small>`);
  stB.innerHTML = `${(WIND * 65).toFixed(0)}<small> G 示意</small>`;
  stB.className = 'v ' + (WIND > 4 ? 'bad' : WIND > 1.5 ? 'warn' : '');
  stSSN.textContent = ssn();
  stSSN.className = 'v ' + (ssn() > 120 ? 'warn' : ssn() > 40 ? 'ok' : '');
  stPh.textContent = phaseName();
  stPole.innerHTML = L(`第 ${25 + cycIdx()} 周 · 极区 ${polarity() > 0 ? 'N+' : 'N−'}`, `Cycle ${25 + cycIdx()} · polar ${polarity() > 0 ? 'N+' : 'N−'}`);
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>差速自转:Ω(θ)=Ω_eq(1−a·sin²θ)</b>,Ω_eq≈14.7°/d(25.4 d),a≈0.19 ⇒ 极区≈${(25.4 / (1 - A_REAL)).toFixed(1)} d;当前放大 ×${diffK.toFixed(1)},a_eff=${aEff().toFixed(2)}<br>` +
    `<b>磁冻结:磁雷诺数 Rm≫10⁶</b>,磁力线冻结在等离子体里被差速一起拧(经度标记可视化)<br>` +
    `<b>Ω 效应:B_φ∝ΔΩ·t·B_p</b>:缠绕度 W=${WIND.toFixed(1)},环向场≈<b>${(WIND * 65).toFixed(0)} G(示意)</b>;磁浮力∝B_φ²/8π 顶出磁流管=黑子对<br>` +
    `<b>Babcock-Leighton:后随极性经向环流输运→极区反转</b>;SSN=${ssn()},活动周 ~11 年,磁周期 22 年<br>` +
    `<b>日历加速 ${fmtD()},自转画面另按 8% 速率显示</b>以便肉眼分辨 25 vs 31 天;注:1645-1715 蒙德极小期`,
    `<b>Differential rotation: Ω(θ)=Ω_eq(1−a·sin²θ)</b>, Ω_eq≈14.7°/d (25.4 d), a≈0.19 ⇒ poles≈${(25.4 / (1 - A_REAL)).toFixed(1)} d; boost ×${diffK.toFixed(1)}, a_eff=${aEff().toFixed(2)}<br>` +
    `<b>Flux freezing: Rm≫10⁶</b> — field lines are frozen into the plasma and wound along with it (see the longitude marks)<br>` +
    `<b>Ω-effect: B_φ∝ΔΩ·t·B_p</b>: twist W=${WIND.toFixed(1)}, toroidal ≈<b>${(WIND * 65).toFixed(0)} G (schematic)</b>; buoyancy ∝B_φ²/8π lifts the tubes = spot pairs<br>` +
    `<b>Babcock-Leighton: trailing polarity drifts poleward → reversal</b>; SSN=${ssn()}, cycle ~11 yr, magnetic 22 yr<br>` +
    `<b>Calendar speed ${fmtD()}; rotation drawn at 8% rate</b> to keep 25 vs 31 days legible; note the 1645-1715 Maunder Minimum`);
}
function syncAll() {
  syncSliders(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elSpd.addEventListener('input', () => { spdRaw = +elSpd.value; syncSliders(); updateFormula(); });
elDiff.addEventListener('input', () => { diffK = +elDiff.value; syncSliders(); updateFormula(); updateStats(); });
btnNew.addEventListener('click', () => {
  tDays = 0; clearPairs(); bfly.length = 0; ssnHist.length = 0; lastSSNDay = -1e9; spawnAcc = 0;
  notifyT = 3.5; notifyZ = '已重置:第 25 周极小期起步'; notifyE = 'Reset: cycle 25 begins at minimum';
  syncAll();
});
btnMin.addEventListener('click', () => {
  tDays = (Math.floor(tDays / CYC_D) + 1) * CYC_D;
  clearPairs(); spawnAcc = 0;
  notifyT = 3.5; notifyZ = '跳到极小期:黑子清零,极区场已换新极性';
  notifyE = 'Jumped to minimum: spots gone, polar field re-armed';
  syncAll();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglField').addEventListener('change', e => { fieldOn = e.target.checked; rebuildLoops(); rebuildRings(); });
document.getElementById('tglButterfly').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglCore').addEventListener('change', e => { cutOn = e.target.checked; applyCut(); });
document.getElementById('tglSpotLbl').addEventListener('change', e => { spotLblOn = e.target.checked; refreshLabels(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, rebuildT = 0;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  WIND = Math.min(8, 7 * cycleFrac() * diffK);
  if (dt > 0) {
    const dDays = dt * daysPerSec();
    const prevCyc = cycIdx();
    tDays += dDays;
    if (cycIdx() !== prevCyc) {
      notifyT = 3.5;
      notifyZ = '极区磁场反转!磁周期 22 年';
      notifyE = 'Polar field reversal! 22-year magnetic cycle';
      clearPairs();
    }
    const dRot = dDays * ROT_VIS;
    spawnAcc += dDays * (ssn() / 160) * 0.09;
    while (spawnAcc > 1) { spawnAcc -= 1; spawnPair(); }
    updateMarkers(dRot);
    updateSpots(dRot);
    if (tDays - lastSSNDay > 20) {
      ssnHist.push({ d: tDays, s: ssn() });
      lastSSNDay = tDays;
      if (ssnHist.length > 460) ssnHist.splice(0, 60);
    }
  }
  rebuildT -= dt0;
  if (rebuildT <= 0) { rebuildT = 0.12; rebuildLoops(); rebuildRings(); }
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.12) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.15) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
updateMarkers(0);
updateSpots(0);
rebuildLoops();
rebuildRings();
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
