<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米兰科维奇旋回 · 三支笔画的冰期时钟</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 340px; height: 220px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.t { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.p { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="米兰科维奇旋回:三支笔画的冰期时钟" data-en="Milankovitch Cycles: a clock drawn by three pens">米兰科维奇旋回：三支笔画的冰期时钟</h1>
  <div class="sub" data-zh="偏心率 10 万年 + 轴倾 4.1 万年 + 岁差 2.6 万年,三条曲线叠加决定高纬夏日日照——冰盖随之进退 · 空格播放/暂停" data-en="Eccentricity 100 kyr + tilt 41 kyr + precession 26 kyr stack into summer insolation at high latitudes — and the ice advances or retreats · Space = play/pause">偏心率 10 万年 + 轴倾 4.1 万年 + 岁差 2.6 万年，三条曲线叠加决定高纬夏日日照——冰盖随之进退 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="三旋回叠加:高纬夏日日照(冰期计)" data-en="Stacked cycles: summer insolation (ice gauge)">三旋回叠加:高纬夏日日照(冰期计)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="stats">
  <span class="k" data-zh="模拟时间" data-en="sim time">模拟时间</span><span class="v g" id="stT">0<small> kyr</small></span>
  <span class="k" data-zh="偏心率 / 轴倾 / 岁差相位" data-en="ecc / tilt / prec">偏心率 / 轴倾 / 岁差相位</span><span class="v" id="st3" style="font-size:13px">—</span>
  <span class="k" data-zh="高纬夏日日照" data-en="summer insolation">高纬夏日日照</span><span class="v" id="stIns">—</span>
  <span class="k" data-zh="冰盖状态" data-en="ice state">冰盖状态</span><span class="v" id="stIce" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.e" data-zh="偏心率(10 万年)" data-en="eccentricity (100 kyr)">偏心率(10 万年)</span>
    <span class="chip.t" data-zh="轴倾角(4.1 万年)" data-en="obliquity (41 kyr)">轴倾角(4.1 万年)</span>
    <span class="chip.p" data-zh="岁差(2.6 万年晃动)" data-en="precession (26 kyr wobble)">岁差(2.6 万年晃动)</span>
  </div>
  <div class="row"><label data-zh="时间轴(千年)" data-en="time (kyr)">时间轴(千年)</label><input id="time" type="range" min="0" max="1000" step="2" value="0"><span class="val" id="timeVal">0</span></div>
  <div class="row"><label data-zh="播放速度" data-en="play speed">播放速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../orbital-mechanics/" data-zh="轨道的几何:开普勒" data-en="the orbit geometry: Kepler">轨道的几何:开普勒</a>
    <a href="../greenhouse-effect/" data-zh="另一只手:温室气体" data-en="the other hand: greenhouse gases">另一只手:温室气体</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe9eef5 : 0x070b12);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('米兰科维奇旋回', 'Milankovitch Cycles');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 3.4, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.25;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 5, 4);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  earth: mat(0x3a7ec0, { opacity: 1 }),
  ice: mat(0xd0e8ff, { opacity: 0.92 }),
  orbit: new THREE.MeshBasicMaterial({ color: 0x5a6a7a, transparent: true, opacity: 0.4 }),
};

/* 太阳 */
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 18), M.sun);
scene.add(sun);
/* 轨道线 */
const orbit = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.008, 6, 90), M.orbit);
orbit.rotation.x = Math.PI / 2;
scene.add(orbit);
/* 地球组:自转轴可倾斜(轴倾)+ 进动绕锥晃 */
const earthSys = new THREE.Group();     // 轨道位置
scene.add(earthSys);
const tiltGrp = new THREE.Group();      // 岁差相位(绕轴锥)
earthSys.add(tiltGrp);
const earth = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 24), M.earth);
tiltGrp.add(earth);
/* 北极冰帽(大小随冰期) */
const iceCap = new THREE.Mesh(new THREE.SphereGeometry(0.335, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2), M.ice);
iceCap.position.y = 0.01;
tiltGrp.add(iceCap);
/* 自转轴杆 */
const axisRod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.0, 8),
  new THREE.MeshBasicMaterial({ color: 0x8a93a3 }));
axisRod.position.y = 0.0;
tiltGrp.add(axisRod);
/* 日照箭(指向地球的连线) */
const rayLine = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 6),
  new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.5 }));
scene.add(rayLine);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let timeKyr = 0;            // 0..1000 千年
let tSim = 0;
const ECC = 100, TILT = 41, PREC = 26;    // kyr 周期
function eccOf(t) { return 0.0167 + 0.035 * Math.sin(t / ECC * Math.PI * 2 + 1.2); }
function tiltOf(t) { return 23.44 + 1.3 * Math.sin(t / TILT * Math.PI * 2); }
function insolationOf(t) {
  /* 三旋回叠加(演示):归一 0..1 */
  const e = (eccOf(t) - 0.0167) / 0.035;
  const tl = (tiltOf(t) - 22.14) / 2.6;
  const pr = Math.sin(t / PREC * Math.PI * 2 + 0.8);
  return clamp(0.5 + 0.22 * tl + 0.16 * pr * (0.5 + e) , 0, 1);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblE = addLabel(() => L('偏心率:轨道在圆与椭圆间变形(10 万年)——近日点距离跟着变', 
  'eccentricity: the orbit breathes between circle and ellipse (100 kyr) — perihelion distance rides along'),
  new THREE.Vector3(0, 2.0, -2.2), 'g');
const lblTilt = addLabel(() => L('轴倾角:22.1°~24.5° 摇摆(4.1 万年)——倾得越狠,高纬夏天越晒', 
  'obliquity: rocks between 22.1° and 24.5° (41 kyr) — the harder the lean, the sunnier the polar summer'),
  new THREE.Vector3(0, 2.0, 2.2), 'g');
const lblIce = addLabel(() => L('冰期计:高纬「夏天凉到融不完去年冬雪」连续数千年,冰盖就一年年长起来——冰期开启', 
  'the ice gauge: if high-latitude summers stay too cool to melt last winter\'s snow for millennia, the ice grows — an ice age begins'),
  new THREE.Vector3(0, -2.0, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '偏心率(10 万年)', be: 'Eccentricity (100 kyr)',
    d: '轨道从近圆(e≈0.01)到椭圆(e≈0.05)之间呼吸:椭圆时近日点比远日点近 18%,日照总量差千分之几——微妙但持续。',
    de: 'The orbit breathes from near-circle (e≈0.01) to ellipse (e≈0.05): perihelion sits 18% closer, total sunlight shifts by fractions of a percent — subtle but relentless.',
    act: () => {} },
  { b: '轴倾角(4.1 万年)', be: 'Obliquity (41 kyr)',
    d: '地轴在 22.1° 与 24.5° 间摇摆:倾角越大,高纬夏天越晒、冬天越黑——季节被放大。',
    de: 'The axis rocks between 22.1° and 24.5°: a bigger lean means sunnier polar summers and darker winters — seasons amplified.',
    act: () => {} },
  { b: '岁差(2.6 万年)', be: 'Precession (26 kyr)',
    d: '自转轴像陀螺一样绕锥晃动:近日点出现在夏天的年份,季节对比被推到极端——哪个半球拿「极端版夏天」轮流坐庄。',
    de: 'The axis wobbles like a top: years when perihelion lands in summer push seasons to extremes — each hemisphere takes turns holding the extreme summer.',
    act: () => {} },
  { b: '叠加:冰期时钟', be: 'Stacking: the ice clock',
    d: '三条周期相加,高纬夏天日照时强时弱。关键阈值:夏天凉到去年的雪融不完,雪一年年压实成冰盖——冰期开张;反之间冰期。',
    de: 'The three periods stack into a high-summer insolation gauge. The threshold: if summers stay too cool to melt last winter\'s snow for millennia, it packs into ice sheets — glacial; otherwise interglacial.',
    act: () => {} },
  { b: '证据在海底', be: 'Evidence in the seabed',
    d: '深海岩芯的氧同位素、乃至石笋,都精确记录着 10 万/4.1 万/2.6 万年的节拍——米兰科维奇 1920 年的算术,被埋在泥里验证了。',
    de: 'Deep-sea cores\' oxygen isotopes, even stalagmites, keep the 100/41/26 kyr beat — Milankovitch\'s 1920 arithmetic, verified in mud.',
    act: () => {} },
];
function stepIndex() {
  if (timeKyr > 10) return 3;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
document.getElementById('time').addEventListener('input', e => {
  timeKyr = parseInt(e.target.value);
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 出峰图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 30, padR = 12;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - padR, H - pad); ctx.stroke();
  /* 三条分曲线(细) */
  const draw = (fn, color, alpha) => {
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const t = i / 200 * 1000;
      const x = pad + (W - pad - padR) * t / 1000;
      const y = pad + (H - pad - pad) * (1 - fn(t));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  draw(t => (eccOf(t) - 0.0167) / 0.035 * 0.5 + 0.5, '#74c0fc', 0.5);
  draw(t => (tiltOf(t) - 22.14) / 2.6 * 0.5 + 0.5, '#63e6be', 0.5);
  /* 合成日照(粗金线) */
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200 * 1000;
    const x = pad + (W - pad - padR) * t / 1000;
    const y = pad + (H - pad - pad) * (1 - insolationOf(t));
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 当前时间游标 */
  const xc = pad + (W - pad - padR) * timeKyr / 1000;
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xc, pad); ctx.lineTo(xc, H - pad); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '18px system-ui';
  ctx.fillText('0', pad - 6, H - pad + 22);
  ctx.fillText('1000 kyr', W - padR - 70, H - pad + 22);
}

/* ================= UI 应用 ================= */
function apply() {
  const e = eccOf(timeKyr);
  const tilt = tiltOf(timeKyr) * Math.PI / 180;
  const prec = timeKyr / PREC * Math.PI * 2 + 0.8;
  /* 轨道变形:椭圆化 */
  earthSys.position.set(Math.cos(prec * 0) * 0, 0, 0);
  earthSys.position.x = Math.cos(timeKyr / 1000 * Math.PI * 2) * 0;
  /* 椭圆:轨道半径随相位(简单可视化) */
  const orbitR = 2.6 * (1 - e * Math.cos(timeKyr / 1000 * Math.PI * 2 * 0.5));
  orbit.scale.set(1 + e * 3, 1, 1 - e * 1.5);
  /* 地球放在轨道上 */
  const a = timeKyr / 1000 * Math.PI * 2;
  earthSys.position.set(Math.cos(a) * orbitR, 0, Math.sin(a) * orbitR);
  /* 轴倾 + 岁差 */
  tiltGrp.rotation.z = tilt;
  tiltGrp.rotation.y = prec;
  earth.rotation.y += 0;
  /* 冰帽随日照 */
  const ins = insolationOf(timeKyr);
  const iceAng = lerp(Math.PI / 2.2, Math.PI / 5.5, 1 - ins);
  iceCap.rotation.x = 0;
  iceCap.geometry.dispose();
  iceCap.geometry = new THREE.SphereGeometry(0.335, 32, 24, 0, Math.PI * 2, 0, iceAng);
  iceCap.position.y = 0.005;
  /* 日照连线 */
  rayLine.position.copy(earthSys.position).multiplyScalar(0.5);
  rayLine.position.y = 0;
  const d = new THREE.Vector3().subVectors(earthSys.position, sun.position);
  rayLine.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  rayLine.scale.y = d.length();

  document.getElementById('stT').innerHTML = timeKyr.toFixed(0) + '<small> kyr</small>';
  document.getElementById('st3').textContent = `e=${e.toFixed(3)} / ${tiltOf(timeKyr).toFixed(1)}° / ${((prec / Math.PI * 180) % 360).toFixed(0)}°`;
  document.getElementById('stIns').innerHTML = (ins * 100).toFixed(0) + '<small>%(归一)</small>';
  const ice = document.getElementById('stIce');
  if (ins < 0.35) { ice.textContent = L('冰盖推进:冰期', 'ice advancing: glacial'); ice.style.color = '#bcd8ff'; }
  else if (ins > 0.65) { ice.textContent = L('冰盖消退:间冰期', 'ice retreating: interglacial'); ice.style.color = '#63e6be'; }
  else { ice.textContent = L('临界拉锯', 'borderline'); ice.style.color = '#ffd166'; }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let plotTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  if (playing) {
    timeKyr = (timeKyr + dts * 12) % 1000;
    document.getElementById('time').value = timeKyr;
  }
  apply();
  earth.rotation.y += dts * 2;

  plotTick += dt;
  if (plotTick > 0.25) { plotTick = 0; drawPlot(); }
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
