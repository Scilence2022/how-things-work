<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>辐射雾与逆温 · 晴夜地面直灌太空,雾自己把自己盖住</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#5fa8d3;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1f6f9c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(95,168,211,.6);background:rgba(95,168,211,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(31,111,156,.55);background:rgba(31,111,156,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(95,168,211,.10);border-color:rgba(95,168,211,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(31,111,156,.08);border-color:rgba(31,111,156,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#d3ecff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="辐射雾与逆温" data-en="Radiation Fog &amp; Inversions">辐射雾与逆温</h1>
  <div class="sub" data-zh="晴夜地面长波辐射直灌太空、温度骤降,贴地空气被传导冷却到露点以下,水汽在凝结核上析出雾滴;雾顶继续向上空辐射冷却、雾自上而下加厚,逆温层像盖子封住雾与污染物;轻微湍流(风速 1~3 m/s)最助雾,有云的夜空像毯子挡住辐射,日出后地面加热、雾底蒸发抬升成层云 · 拖动旋转 / 空格运行/暂停" data-en="On a clear night the ground radiates straight to space and cools fast; the air in contact chills below its dew point and vapour condenses onto nuclei into droplets; the fog top keeps radiating upward so the fog thickens downward, capped by an inversion that seals in fog and pollutants; light turbulence (1–3 m/s) helps most, cloud works as a blanket, and after sunrise the fog lifts into stratus · drag to orbit / Space = run/pause">晴夜地面长波辐射直灌太空、温度骤降,贴地空气被传导冷却到露点以下,水汽在凝结核上析出雾滴;雾顶继续向上空辐射冷却、雾自上而下加厚,逆温层像盖子封住雾与污染物;轻微湍流(风速 1~3 m/s)最助雾,有云的夜空像毯子挡住辐射,日出后地面加热、雾底蒸发抬升成层云 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="地面温度" data-en="Ground temp">地面温度</span><span class="v" id="stTg">—</span>
  <span class="k" data-zh="露点差" data-en="Dew deficit">露点差</span><span class="v" id="stDep">—</span>
  <span class="k" data-zh="雾厚" data-en="Fog depth">雾厚</span><span class="v" id="stFog">—</span>
  <span class="k" data-zh="逆温强度" data-en="Inversion">逆温强度</span><span class="v" id="stInv">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bClear" data-zh="晴夜" data-en="Clear night">晴夜</button>
    <button class="abtn" id="bCloud" data-zh="有云夜" data-en="Cloudy night">有云夜</button>
  </div>
  <div class="row">
    <label data-zh="初始相对湿度" data-en="Initial RH">初始相对湿度</label>
    <input id="sRH" type="range" min="70" max="100" step="1" value="92">
    <span class="val" id="sRHVal">92 %</span>
  </div>
  <div class="row">
    <label data-zh="夜间冷却率" data-en="Cooling rate">夜间冷却率</label>
    <input id="sCR" type="range" min="0.5" max="3.5" step="0.1" value="2.4">

  <div class="row">
    <label data-zh="风速" data-en="Wind speed">风速</label>
    <input id="sW" type="range" min="0" max="6" step="0.2" value="2">
    <span class="val" id="sWVal">2.0 m/s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglSound" type="checkbox" checked> <span data-zh="探空曲线" data-en="Sounding">探空曲线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cloud-formation/" data-zh="云的形成" data-en="Cloud Formation">云的形成</a>
    <a href="../atmospheric-circulation/" data-zh="大气环流" data-en="Atmospheric Circulation">大气环流</a>
    <a href="../sea-breeze/" data-zh="海陆风" data-en="Sea Breeze">海陆风</a>
  </div>
</div>
<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0x8fa8c8,0x14161c,0.5));
const key=new THREE.DirectionalLight(0xbdd2ee,0.55);key.position.set(-6,10,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.25);fill.position.set(8,5,-6);scene.add(fill);
/* 高度比例:1 单位 = 50 m,显示到 400 m = 8 单位 */
const HSC=50;

/* ── 场景:山谷夜景 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1d2a22,roughness:0.95});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(64,30),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const ridgeM=new THREE.MeshStandardMaterial({color:0x16221c,roughness:0.95});
for(const s of [-1,1]){
  const r=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),ridgeM);
  r.scale.set(7,4.6,5);r.position.set(s*16.5,-0.6,-1);scene.add(r);
}
const treeM=new THREE.MeshStandardMaterial({color:0x1c3325,roughness:0.9});
[[-11.5,2.5],[-10.2,4.2],[12.6,3.2],[13.8,1.6],[9.8,4.6],[-12.8,-2.5]].forEach(([x,z])=>{
  const t=new THREE.Mesh(new THREE.ConeGeometry(0.34,0.95,7),treeM);
  t.position.set(x,0.45,z);scene.add(t);
});
const houseM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8});
const house=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.95,1.15),houseM);
house.position.set(5.6,0.48,4.2);scene.add(house);
const roof=new THREE.Mesh(new THREE.ConeGeometry(1.25,0.75,4),ridgeM);
roof.position.set(5.6,1.32,4.2);roof.rotation.y=Math.PI/4;scene.add(roof);
const winM=new THREE.MeshStandardMaterial({color:0xffc078,emissive:0xffa94d,
  emissiveIntensity:0.9,roughness:0.5});
const win=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.32,0.03),winM);
win.position.set(5.25,0.55,4.79);scene.add(win);
/* 温度计 */
const thermG=new THREE.Group();thermG.position.set(-9.5,0,1.2);scene.add(thermG);
const postM=new THREE.MeshStandardMaterial({color:0x6b7280,roughness:0.5,metalness:0.5});
const post=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1.6,10),postM);
post.position.y=0.8;thermG.add(post);
const tube=new THREE.Mesh(new THREE.BoxGeometry(0.17,1.1,0.07),
  new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3,transparent:true,opacity:0.35}));
tube.position.y=1.25;thermG.add(tube);
const merM=new THREE.MeshStandardMaterial({color:0xd64545,emissive:0xd64545,
  emissiveIntensity:0.35,roughness:0.4});
const mer=new THREE.Mesh(new THREE.BoxGeometry(0.09,1.0,0.045),merM);
mer.position.y=0.75;thermG.add(mer);
/* 气温色层:蓝冷-红暖 */
const NS=14,slabs=[];
for(let i=0;i<NS;i++){
  const m=new THREE.MeshBasicMaterial({transparent:true,opacity:0.20,depthWrite:false});
  const s=new THREE.Mesh(new THREE.BoxGeometry(27,8/NS,9),m);
  s.position.set(1,(i+0.5)*8/NS,0);scene.add(s);slabs.push(m);
}
const rampStops=[[-8,0x2f5f9e],[1,0x5f8fb8],[8,0xa8c0cc],[13,0xe0c9a8],[19,0xd97a4a]];
const rampCols=rampStops.map(([t,c])=>[t,new THREE.Color(c)]);
const tmpC=new THREE.Color();
function tempColor(T){
  if(T<=rampCols[0][0])return tmpC.copy(rampCols[0][1]);
  for(let i=0;i<rampCols.length-1;i++){
    const [t0,c0]=rampCols[i],[t1,c1]=rampCols[i+1];
    if(T<=t1){tmpC.copy(c0).lerp(c1,(T-t0)/(t1-t0));return tmpC;}
  }
  return tmpC.copy(rampCols[rampCols.length-1][1]);
}
/* 雾滴粒子 */
const NP=420;
const fogM=new THREE.MeshStandardMaterial({color:0xe8f2f8,roughness:0.6,transparent:true,
  opacity:0.75,emissive:0x9db8cc,emissiveIntensity:0.12});
const fogP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,7,7),fogM,NP);
fogP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(fogP);
const pp=[];for(let i=0;i<NP;i++)pp.push({x:Math.random()*22-11,z:Math.random()*8-4,
  yf:Math.pow(Math.random(),0.8),ph:Math.random()*Math.PI*2});
let drift=0;
/* 云毯与月亮/太阳 */
const cloudM=new THREE.MeshStandardMaterial({color:0x6f7885,transparent:true,opacity:0.55,depthWrite:false});
const cloudSlab=new THREE.Mesh(new THREE.BoxGeometry(34,1.0,14),cloudM);
cloudSlab.position.set(1,9.3,0);cloudSlab.visible=false;scene.add(cloudSlab);
const moonM=new THREE.MeshBasicMaterial({color:0xf5f2e6,transparent:true,opacity:0.95});
const moon=new THREE.Mesh(new THREE.CircleGeometry(0.75,32),moonM);
moon.position.set(-8,9.8,-10);scene.add(moon);
const sunM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0});
const sun=new THREE.Mesh(new THREE.CircleGeometry(0.95,32),sunM);
sun.position.set(15,3.4,-10);scene.add(sun);
/* 探空曲线组 */
const sounding=new THREE.Group();sounding.position.set(0,0,0);scene.add(sounding);
const axisM=new THREE.LineBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.5});
{
  const a=new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(8.6,0,0),new THREE.Vector3(8.6,8,0)]);
  sounding.add(new THREE.Line(a,axisM));
  for(let k=0;k<=4;k++){
    const t=new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(8.6,k*2,0),new THREE.Vector3(8.78,k*2,0)]);
    sounding.add(new THREE.Line(t,axisM));
  }
}
const NZ=27;
const sndGeo=new THREE.BufferGeometry();
sndGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(NZ*3),3));
const sndM=new THREE.LineBasicMaterial({color:0xf1f3f5});
sounding.add(new THREE.Line(sndGeo,sndM));
const invGeo=new THREE.BufferGeometry();
invGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array((NZ-1)*6),3));
const invM=new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.95});
const invLine=new THREE.LineSegments(invGeo,invM);
invLine.renderOrder=5;sounding.add(invLine);

/* 状态:T0=14 °C,1 单位 = 50 m */
let cloudy=false,day=false,soundOn=true,playing=true,labelsOn=true,slowMo=false;
let RH=92,CR=2.4,wind=2;
let T0=14,Td0=14-(100-RH)/5,Ts=14,nightH=0;
let TsN=14,delN=20,dayStartH=0,dp=0;
let fogTop=0,fogBottom=0,invStr=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const maxDrop=w=>5.5*Math.exp(-w/2.6)+Math.max(0,w-2.8)*1.0;
function delNow(){return 8+wind*14;}
function Tnight(z){const d=day?delN:delNow(),Ts0=day?TsN:Ts,frac=Math.max(0,T0-Ts0);
  if(z<d)return Ts0+frac*Math.pow(Math.max(0,z/d),1.35);
  return T0-0.0065*(z-d);}
function TdayProf(z){return T0-0.0065*z;}
function Tz(z){return (1-dp)*Tnight(z)+dp*TdayProf(z);}
function TdZ(z){return Td0-0.004*z;}
function solveFog(){
  fogTop=0;fogBottom=0;let sat=false;
  for(let z=0;z<=395;z+=5){
    if(Tz(z)<=TdZ(z)+0.05){if(!sat){fogBottom=z;sat=true;}fogTop=z;}
  }
}
function invStrength(){return Tz(150)-Tz(2);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblGround=addLabel(()=>L('地面长波辐射:热量直灌太空','Longwave radiation: heat straight to space'),
  new THREE.Vector3(-4.2,0.55,2.6),'y');
const lblTherm=addLabel(()=>L(`地面 ${Ts.toFixed(1)} °C`,`Ground ${Ts.toFixed(1)} °C`),
  new THREE.Vector3(-9.5,2.15,1.2),'o');
const lblDew=addLabel(()=>L(`露点 ${Td0.toFixed(1)} °C:降到露点即成雾`,
    `Dew point ${Td0.toFixed(1)} °C: reach it and fog forms`),
  new THREE.Vector3(-3.5,1.15,-1.5),'b',()=>fogTop>3);
const lblTop=addLabel(()=>L(`雾顶 ${fogTop.toFixed(0)} m:继续向上辐射冷却`,
    `Fog top ${fogTop.toFixed(0)} m: still radiating, thickening down`),
  new THREE.Vector3(2.5,1.5,0),'g',()=>fogTop>5);
const lblInv=addLabel(()=>L('逆温盖子:冷在下暖在上,雾与污染物被封住',
    'Inversion lid: cold below, warm above — fog and smog sealed in'),
  new THREE.Vector3(4.5,3.6,-2.2),'r',()=>invStr>1.5);
const lblCloud=addLabel(()=>L('云毯:挡住地面向上辐射,雾不成','Cloud blanket: blocks the radiation, no fog'),
  new THREE.Vector3(1,10.2,0),'b',()=>cloudy);
const lblBreeze=addLabel(()=>L('微风 1~3 m/s 最助雾:静风太浅、大风混合暖空气',
    'A 1–3 m/s breeze helps most: calm is too shallow, strong wind mixes warm air down'),
  new THREE.Vector3(-10.5,2.8,3.5),'o',()=>wind>0.8&&wind<3.4);
const lblDay=addLabel(()=>L('日出加热:雾底蒸发、抬升成层云','Sunrise heating: fog lifts into stratus'),
  new THREE.Vector3(3.2,5.4,3),'y',()=>day&&fogBottom>8);
const lblSound=addLabel(()=>L('温度探空 T–z','Sounding T–z'),
  new THREE.Vector3(8.6,8.5,0),'b',()=>soundOn);

function setMode(m){cloudy=(m==='cloud');
  document.getElementById('bClear').classList.toggle('on',m==='clear');
  document.getElementById('bCloud').classList.toggle('on',m==='cloud');
  cloudSlab.visible=cloudy;}
function setRH(v){RH=clamp(v,70,100);Td0=14-(100-RH)/5;
  document.getElementById('sRH').value=RH;
  document.getElementById('sRHVal').textContent=RH.toFixed(0)+' %';updateStats();}
function setCR(v){CR=clamp(v,0.5,3.5);
  document.getElementById('sCR').value=CR;
  document.getElementById('sCRVal').textContent=CR.toFixed(1)+' K/h';updateStats();}
function setW(v){wind=clamp(v,0,6);
  document.getElementById('sW').value=wind;
  document.getElementById('sWVal').textContent=wind.toFixed(1)+' m/s';updateStats();}
function setTs(v){Ts=clamp(v,-12,14);}
function resetNight(){day=false;dp=0;Ts=14;nightH=0;}
function setDay(v){if(v&&!day){TsN=Ts;delN=delNow();dayStartH=nightH;}
  day=v;if(v)nightH=Math.max(nightH,dayStartH);}

const STEPS=[
 {zh:'<b>晴夜辐射</b>:无云夜地面长波辐射直灌太空,温度骤降',en:'<b>Clear-night radiation</b>: unblocked longwave loss, the ground plummets',
  act(){setMode('clear');resetNight();setRH(85);setCR(2.8);setW(1.8);}},
 {zh:'<b>降到露点</b>:贴地空气被传导冷却,逼近露点温度',en:'<b>Chilled to dew point</b>: conduction pulls the surface air to saturation',
  act(){setMode('clear');resetNight();setRH(96);setCR(3.0);setW(2);setTs(13.1);nightH=2.5;}},
 {zh:'<b>析出雾滴</b>:过饱和水汽在凝结核上凝结,雾从地面长起',en:'<b>Droplets form</b>: supersaturated vapour condenses on nuclei, fog grows from the ground',
  act(){setMode('clear');setRH(96);setCR(3.2);setW(1.8);setTs(12.6);nightH=3.5;}},
 {zh:'<b>雾顶加厚</b>:雾顶继续向上空辐射冷却,雾自上而下加厚',en:'<b>Thickening down</b>: the fog top keeps radiating, the layer deepens',
  act(){setMode('clear');setRH(96);setCR(3.4);setW(2.2);setTs(11.2);nightH=5.5;}},
 {zh:'<b>逆温盖子</b>:冷在下暖在上,雾与污染物被封在盖子下',en:'<b>The inversion lid</b>: cold under warm — fog and smog sealed beneath',
  act(){setMode('clear');setRH(96);setCR(3.4);setW(0.4);setTs(9.2);nightH=6.5;}},
 {zh:'<b>有云夜=毯子</b>:云把地面的辐射挡回去,降温乏力,雾不成',en:'<b>Cloud = blanket</b>: radiation returned, cooling stalls, no fog',
  act(){setMode('cloud');resetNight();setRH(96);setCR(3.2);setW(2);}},
 {zh:'<b>日出加热</b>:地面升温,雾底先蒸发,雾整体抬升成层云',en:'<b>Sunrise</b>: the ground warms, the base evaporates, the fog lifts into stratus',
  act(){setMode('clear');setRH(96);setCR(3.2);setW(1.8);resetNight();setTs(11.2);nightH=6;setDay(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const tg=document.getElementById('stTg');
  tg.innerHTML=Ts.toFixed(1)+'<small> °C</small>';
  const dep=document.getElementById('stDep');
  const d=Ts-Td0;
  dep.innerHTML=d.toFixed(1)+'<small> K</small>';
  dep.className='v '+(d<=0.3?'ok':(d>3?'warn':''));
  const fv=document.getElementById('stFog');
  const th=fogTop-fogBottom;
  fv.innerHTML=th.toFixed(0)+'<small> m</small>';
  fv.className='v '+(th>25?'ok':'');
  const iv=document.getElementById('stInv');
  invStr=invStrength();
  iv.innerHTML=invStr.toFixed(1)+'<small> K</small>';
  iv.className='v '+(invStr>3?'warn':'');
}

document.getElementById('bClear').addEventListener('click',()=>setMode('clear'));
document.getElementById('bCloud').addEventListener('click',()=>setMode('cloud'));
document.getElementById('sRH').addEventListener('input',e=>setRH(+e.target.value));
document.getElementById('sCR').addEventListener('input',e=>setCR(+e.target.value));
document.getElementById('sW').addEventListener('input',e=>setW(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSound').addEventListener('change',e=>{soundOn=e.target.checked;sounding.visible=soundOn;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1d2a22:0xb9c4ae);
  ridgeM.color.setHex(dark?0x16221c:0x9cb096);
  treeM.color.setHex(dark?0x1c3325:0x7ea183);
  houseM.color.setHex(dark?0x3a3f4b:0x8d99ad);
  cloudM.color.setHex(dark?0x6f7885:0xb6bcc4);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

camera.position.set(2,5.6,17.5);
controls.target.set(0.5,3.1,0);

const clock=new THREE.Clock();
let raf=null,simT=0;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 夜晚推进与地面冷却(或日出加热) */
  nightH+=dts*0.9;
  if(!day){
    const g=0.45+0.75*Math.exp(-((wind-1.8)*(wind-1.8))/4.0);
    Ts-=CR*g*dts*0.9*(cloudy?0.22:1);
    const floor=Td0-maxDrop(wind);
    if(Ts<floor)Ts=floor;
    if(Ts<-12)Ts=-12;
    dp=0;
  }else{
    dp=clamp((nightH-dayStartH)/4,0,1);
    Ts+=(T0-Ts)*0.45*dts*0.9+0.8*dts*0.9;
  }
  solveFog();
  invStr=invStrength();
  /* 气温色层 */
  for(let i=0;i<NS;i++){
    const zc=(i+0.5)*400/NS;
    tempColor(Tz(zc));
    slabs[i].color.copy(tmpC);
  }
  /* 雾滴粒子 */
  drift+=wind*0.045*dts;
  const bU=fogBottom/HSC,thU=(fogTop-fogBottom)/HSC;
  const activeN=fogTop>2?Math.round(NP*clamp(thU/1.4,0.12,1)):0;
  for(let i=0;i<NP;i++){
    const p=pp[i];
    if(i<activeN){
      const y=bU+clamp(p.yf,0,1)*Math.max(0.06,thU)+0.04*Math.sin(simT*0.7+p.ph);
      m4.makeScale(1,1,1);
      m4.setPosition((((p.x+drift+p.ph*2)%22)+33)%22-11,y,p.z);
    }else{
      m4.makeScale(0,0,0);m4.setPosition(0,-99,0);
    }
    fogP.setMatrixAt(i,m4);
  }
  fogP.instanceMatrix.needsUpdate=true;
  fogM.opacity=fogTop>2?0.75:0;
  /* 探空曲线与逆温段 */
  const sp=sndGeo.attributes.position,ip=invGeo.attributes.position;
  let ni=0;
  let prevT=null;
  for(let k=0;k<NZ;k++){
    const z=k*395/(NZ-1),T=Tz(z);
    const x=8.6+(T-5)*0.26,y=z/HSC;
    sp.setXYZ(k,x,y,0);
    if(prevT!==null&&T>prevT){
      ip.setXYZ(ni,8.615+(prevT-5)*0.26,(z-395/(NZ-1))/HSC,0);
      ip.setXYZ(ni+1,8.615+(T-5)*0.26,y,0);
      ni+=2;
    }
    prevT=T;
  }
  sp.needsUpdate=true;
  invGeo.setDrawRange(0,ni);
  ip.needsUpdate=true;
  invM.opacity=clamp((invStr-0.3)/1.2,0,1);
  /* 天体与光照 */
  moonM.opacity=cloudy?0.18:0.95;
  moon.visible=!day;
  moon.lookAt(camera.position);
  sunM.opacity=day?0.95:0;
  sun.lookAt(camera.position);
  key.intensity=day?0.5+dp*0.75:0.55;
  key.color.setHex(day?0xffdfa8:0xbdd2ee);
  winM.emissiveIntensity=day?0.15:0.9;
  /* 温度计水银柱 */
  const mh=clamp((Ts+12)/28,0.05,1);
  mer.scale.y=mh;mer.position.y=0.72+0.5*mh;
  merM.color.setHex(Ts<4?0x4d7fd6:0xd64545);
  /* 标签动态位置 */
  lblTop.position.set(2.5,fogTop/HSC+0.45,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
