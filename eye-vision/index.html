<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼与视觉 · 两段变焦的光学仪器</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.r { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.l { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,209,102,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="眼与视觉:一台会自己变焦的相机" data-en="The Eye: a camera that focuses itself">眼与视觉:一台会自己变焦的相机</h1>
  <div class="sub" data-zh="角膜定焦、晶状体微调;睫状肌拉橡皮筋改变曲率,把焦点钉在视网膜上——拉不动了就是老花 · 空格播放/暂停" data-en="The cornea sets the base focus, the lens fine-tunes; ciliary muscles squeeze the elastic lens to pin the focus on the retina — when squeezing fails, that's presbyopia · Space = play/pause">角膜定焦、晶状体微调；睫状肌拉橡皮筋改变曲率，把焦点钉在视网膜上——拉不动了就是老花 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="物距" data-en="object distance">物距</span><span class="v g" id="stD">∞<small>(远处)</small></span>
  <span class="k" data-zh="晶状体曲率" data-en="lens power">晶状体曲率</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="焦点落点" data-en="focus lands">焦点落点</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="成像状态" data-en="image">成像状态</span><span class="v" id="stImg" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.l" data-zh="光线(三根特殊光线)" data-en="rays (three special ones)">光线(三根特殊光线)</span>
    <span class="chip.r" data-zh="视网膜(感光层)" data-en="retina (sensor)">视网膜(感光层)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnNear" data-zh="看近处(30 cm)" data-en="look near (30 cm)">看近处(30 cm)</button>
    <button class="abtn" id="btnFar" data-zh="看远处(∞)" data-en="look far (∞)">看远处(∞)</button>
  </div>
  <div class="row"><label data-zh="物距(0.2m~∞)" data-en="object distance">物距(0.2m~∞)</label><input id="dist" type="range" min="0" max="100" step="1" value="100"><span class="val" id="distVal">∞</span></div>
  <div class="row"><label data-zh="睫状肌调节" data-en="accommodation">睫状肌调节</label><input id="acc" type="range" min="0" max="100" step="1" value="0"><span class="val" id="accVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lens-imaging/" data-zh="物理版:透镜成像" data-en="the physics: lens imaging">物理版:透镜成像</a>
    <a href="../cochlea/" data-zh="耳朵:把频率写成位置" data-en="the ear: place = pitch">耳朵:把频率写成位置</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('眼与视觉', 'The Eye & Vision');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.8, 2.0, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  sclera: mat(0xe9ecef, { opacity: 0.22, roughness: 0.25 }),
  cornea: mat(0xbfd8e8, { opacity: 0.35, roughness: 0.1 }),
  lens: mat(0xb197fc, { opacity: 0.75, roughness: 0.2 }),
  retina: new THREE.MeshBasicMaterial({ color: 0x2b3040, transparent: true, opacity: 0.85, side: THREE.BackSide }),
  ray: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  disk: mat(0xff8787, { opacity: 0.8 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.7;
scene.add(base);

/* ================= 眼球(剖面) ================= */
/* 光轴:z 轴,左(-)=物体侧,右(+)=视网膜。尺度 1 单位≈10mm */
const ZC = 0;            // 角膜前缘
const Z_LENS = 0.55;     // 晶状体
const Z_RET = 2.45;      // 视网膜
const eye = new THREE.Group();
scene.add(eye);
/* 巩膜(后半球壳) */
const shell = new THREE.Mesh(new THREE.SphereGeometry(1.15, 32, 24, -Math.PI / 2, Math.PI, 0, Math.PI), M.sclera);
shell.position.set(0, 0.8, Z_RET - 1.15);
shell.rotation.y = -Math.PI / 2;
eye.add(shell);
/* 视网膜面(内壁,BackSide 球) */
const retina = new THREE.Mesh(new THREE.SphereGeometry(1.12, 32, 24, -Math.PI / 2, Math.PI, 0, Math.PI), M.retina);
retina.position.copy(shell.position);
retina.rotation.y = -Math.PI / 2;
eye.add(retina);
/* 角膜(前凸) */
const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.78, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2.6), M.cornea);
cornea.rotation.x = -Math.PI / 2;
cornea.rotation.z = Math.PI;
cornea.position.set(0, 0.8, ZC);
cornea.scale.set(1, 1, 0.5);
eye.add(cornea);
/* 晶状体(弹性的双凸透镜:scale z 变曲率) */
const lensM = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 18), M.lens);
lensM.position.set(0, 0.8, Z_LENS);
lensM.scale.set(1, 1, 0.45);
eye.add(lensM);
/* 视盘(盲点) */
const disk = new THREE.Mesh(new THREE.CircleGeometry(0.13, 16), M.disk);
disk.position.set(-0.35, 0.8 + 0.62, Z_RET - 0.01);
disk.rotation.y = -Math.PI / 2;
disk.rotation.x = 0.45;
eye.add(disk);
/* 中央凹标记 */
const foveaRing = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.014, 8, 24),
  new THREE.MeshBasicMaterial({ color: 0xffd166 }));
foveaRing.position.set(0, 0.8 + 0.2, Z_RET - 0.02);
foveaRing.rotation.y = Math.PI / 2;
eye.add(foveaRing);
/* 睫状肌环(连接晶状体) */
const ciliary = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.05, 10, 32),
  mat(0xff8787, { opacity: 0.6 }));
ciliary.position.set(0, 0.8, Z_LENS);
ciliary.rotation.y = Math.PI / 2;
eye.add(ciliary);

/* 物体(箭头) */
const objArrow = new THREE.Group();
{
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 10),
    new THREE.MeshBasicMaterial({ color: 0x74c0fc }));
  shaft.rotation.z = Math.PI / 2;
  objArrow.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 12),
    new THREE.MeshBasicMaterial({ color: 0x74c0fc }));
  tip.rotation.z = -Math.PI / 2;
  tip.position.x = 0.34;
  objArrow.add(tip);
}
objArrow.position.set(-3.6, 0.8, 0.25);
scene.add(objArrow);

/* 三根特殊光线(细长 box,动态重建) */
const rayGeo = new THREE.BoxGeometry(1, 0.012, 0.012);
const rays = [];
for (let i = 0; i < 3; i++) {
  const r = new THREE.Mesh(rayGeo, M.ray);
  scene.add(r);
  rays.push(r);
}
/* 焦点标记 */
const focusDot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xff6b6b, blending: THREE.AdditiveBlending, transparent: true }));
scene.add(focusDot);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let distM = Infinity;        // 物距
let acc = 0;                 // 调节 0..1
let tSim = 0;

/* 光学模型:眼总焦距 f ≈ 1.7 单位(远处平行光刚好聚焦在视网膜 2.45? 
   薄透镜:1/f = 1/u + 1/v;v=Z_RET-Z_LENS=1.9 固定(眼轴不变!)
   远处 u=∞ → f=v=1.9(松弛);看近需要更短 f:1/f = 1/u + 1/1.9 → f = u*1.9/(u+1.9)
   睫状肌调节改变 f:f 松弛=1.9,最大调节 f≈1.62(约 +15D 的 20%) */
function fOf(a) { return lerp(1.9, 1.10, a); }
function focusZ(u, a) {
  /* u 用场景单位:distM(m)→单位 (m*10) */
  const U = u === Infinity ? Infinity : u * 10;
  const f = fOf(a);
  if (!Number.isFinite(U)) return Z_LENS + f;
  const v = U * f / (U - f);
  return Z_LENS + v;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = eye) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblLens = addLabel(() => L('晶状体:橡皮质地的双凸镜,曲率由睫状肌调节', 'the lens: an elastic double-convex, squeezed by ciliary muscles'),
  new THREE.Vector3(0, 1.45, Z_LENS), 'g');
const lblRet = addLabel(() => L('视网膜:感光屏;中央凹最锐,视盘是「盲点」(神经出口没有感光细胞)', 
  'retina: the sensor; sharpest at the fovea, and the optic disk is the blind spot (no photoreceptors where the nerve exits)'),
  new THREE.Vector3(0, 0.05, Z_RET + 0.2), 'st');
const lblFocus = addLabel(() => {
  const fz = focusZ(distM, acc);
  if (Math.abs(fz - Z_RET) < 0.1) return L('焦点钉在视网膜上——清晰 ✓', 'focus pinned on the retina — sharp ✓');
  if (fz > Z_RET) return L('焦点落在视网膜后面——看近不清,需要调节(或老花)', 'focus falls behind the retina — near vision blur; accommodate (or presbyopia)');
  return L('焦点落在视网膜前面——近视眼的世界(或调节过头)', 'focus lands in front — a myope\'s world (or over-accommodated)');
}, new THREE.Vector3(0, 2.2, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '两段变焦', be: 'A two-lens zoom',
    d: '角膜贡献约 2/3 屈光度(固定),晶状体补剩下的 1/3(可调)——相机要靠伸缩镜头,眼睛只捏橡皮镜。',
    de: 'The cornea supplies ~2/3 of the power (fixed); the lens adds the adjustable third. A camera racks its lens; the eye squishes an elastic one.',
    act: () => setDist(100) },
  { b: '看远:全部放松', be: 'Far: everything slack',
    d: '睫状肌放松→悬韧带拉紧→晶状体被拉扁。平行光(∞)刚好聚焦在视网膜上——这就是默认状态。',
    de: 'Ciliary muscles relax → zonules pull taut → the lens flattens. Parallel rays (∞) focus right on the retina — the resting state.',
    act: () => setDist(100) },
  { b: '看近:捏镜子', be: 'Near: squeeze the glass',
    d: '睫状肌收缩→悬韧带松开→晶状体靠弹性回弹变凸。30cm 阅读需要约 +3D 的额外曲率。',
    de: 'Ciliary muscles contract → zonules slacken → the lens rounds up by elastic rebound. Reading at 30 cm costs about +3 diopters.',
    act: () => setDist(15) },
  { b: '老花:橡皮筋老化', be: 'Presbyopia: the rubber ages',
    d: '晶状体随年龄变硬,最大曲率逐年缩水——46 岁左右近点退到一臂远,得把手机拿远看(或戴老花镜补曲率)。',
    de: 'The lens stiffens with age; max curvature shrinks until ~46, when near point retreats past arm\'s length — hold the phone farther, or add reading glasses.',
    act: () => { setDist(15); acc = 0.55; document.getElementById('acc').value = 55; } },
  { b: '盲点:出厂瑕疵', be: 'The blind spot: a factory flaw',
    d: '视神经必须穿出视网膜,那个位置没有感光细胞——每只眼都有一块盲区,大脑用另一只眼和脑补把它填上。',
    de: 'The optic nerve must punch through the retina; that spot has no photoreceptors. Each eye is blind there — the brain fills it in.',
    act: () => {} },
];
function stepIndex() {
  if (distM <= 0.5) return acc < 0.3 ? 3 : 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elDist = document.getElementById('dist');
const elAcc = document.getElementById('acc');
const btnNear = document.getElementById('btnNear');
const btnFar = document.getElementById('btnFar');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setDist(sliderV) {
  if (sliderV >= 100) distM = Infinity;
  else distM = lerp(0.2, 3.0, sliderV / 100);
  elDist.value = sliderV;
  document.getElementById('stD').innerHTML = distM === Infinity ? '∞<small>(远处)</small>' : (distM * 100).toFixed(0) + '<small> cm</small>';
}
function autoAcc() {
  /* 自动调节:把焦点拉回视网膜所需 */
  if (distM === Infinity) return 0;
  const need = (distM * 10 - fOf(1)) / 0;
  void need;
  /* f_needed = U*1.9/(U+1.9);求 a 使 fOf(a)≈f_needed */
  const U = distM * 10;
  const fNeed = U * 1.9 / (U + 1.9);
  return clamp((1.9 - fNeed) / (1.9 - 1.10), 0, 1);
}
function refreshStats() {
  const fz = focusZ(distM, acc);
  const power = (1 / fOf(acc) * 0.526).toFixed(1);
  document.getElementById('stP').innerHTML = power + '<small> kD(演示)</small>';
  document.getElementById('stF').innerHTML = ((fz - Z_LENS) * 10).toFixed(1) + '<small> mm(镜后)</small>';
  const el = document.getElementById('stImg');
  if (Math.abs(fz - Z_RET) < 0.1) { el.textContent = L('清晰 ✓', 'sharp ✓'); el.style.color = '#ffd166'; }
  else if (fz > Z_RET) { el.textContent = L('后焦:模糊', 'behind: blur'); el.style.color = '#ff8787'; }
  else { el.textContent = L('前焦:模糊', 'in front: blur'); el.style.color = '#ff8787'; }
}
elDist.addEventListener('input', e => setDist(parseInt(e.target.value)));
elAcc.addEventListener('input', e => { acc = parseInt(e.target.value) / 100; });
btnNear.addEventListener('click', () => { setDist(10); acc = autoAcc(); elAcc.value = acc * 100; });
btnFar.addEventListener('click', () => { setDist(100); acc = 0; elAcc.value = 0; });
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 光线绘制 ================= */
function raySeg(from, to, mesh) {
  const d = new THREE.Vector3().subVectors(to, from);
  mesh.position.copy(from).addScaledVector(d, 0.5);
  mesh.scale.x = Math.max(0.01, d.length());
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), d.clone().normalize());
}
function updateRays() {
  /* 三根光线:顶部平行线(过晶状体折向焦点)、轴上线、底部斜线 */
  const objZ = distM === Infinity ? -8 : objArrow.position.z + 0;
  const objX = distM === Infinity ? -8 : objArrow.position.x;
  const objY = 0.8 + 0.25;
  const fz = focusZ(distM, acc);
  const fAbs = Math.abs(fz);
  void fAbs;
  /* 顶部平行光线:从物体顶(或无穷远平行)→ 镜 → 焦点 */
  const inX = distM === Infinity ? objZ : objX;
  const p0 = new THREE.Vector3(inX, objY, 0.25);
  const pLens = new THREE.Vector3(0, objY, Z_LENS);
  const pFocus = new THREE.Vector3(0, 0.8, fz);
  raySeg(p0, pLens, rays[0]);
  raySeg(pLens, pFocus, rays[1]);
  /* 底部光线:过镜心不折 */
  raySeg(new THREE.Vector3(inX, objY - 0.5, 0.25), new THREE.Vector3(0, 0.8, Z_LENS), rays[2]);
  focusDot.position.copy(pFocus);
  focusDot.material.opacity = 0.5 + 0.3 * Math.sin(tSim * 5);
  /* 物体位置 */
  if (distM !== Infinity) {
    objArrow.position.x = distM * 10 * -1;
    objArrow.visible = true;
  } else {
    objArrow.position.x = -6.5;
    objArrow.visible = false;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  /* 晶状体形变:acc 越大越凸 */
  const zScale = lerp(0.42, 0.72, acc);
  lensM.scale.z = lerp(lensM.scale.z, zScale, clamp(dts * 4, 0, 1));
  lensM.scale.y = lerp(lensM.scale.y, lerp(1.0, 0.88, acc), clamp(dts * 4, 0, 1));
  /* 睫状肌环径:收缩变小 */
  const cr = lerp(0.56, 0.46, acc);
  ciliary.scale.set(cr / 0.52, 1, cr / 0.52);
  ciliary.material.opacity = 0.35 + acc * 0.45;

  updateRays();
  refreshStats();

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setDist(100);
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
