<style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,300);
camera.position.set(0,7,24);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=100;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.9));
const keyL=new THREE.DirectionalLight(0xffffff,0.85);keyL.position.set(5,10,7);scene.add(keyL);
const grid=new THREE.GridHelper(60,60,0x2a3340,0x1c232c);
grid.position.y=-0.6;scene.add(grid);

/* ============ 坐标映射：数据 x∈[0,20], y∈[0,13] → 世界 ============ */
const PW=10.4;                                   // 每个面板宽
const WX=(x,off=0)=>(x/20-0.5)*PW+off;
const WY=y=>y/13*8.0;

/* ============ 最小二乘：斜率/截距/r/RSS ============ */
function fitOf(pts){
  const n=pts.length;if(n<2)return{slope:0,intercept:0,r:0,rss:0};
  let sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(const p of pts){sx+=p.x;sy+=p.y;sxx+=p.x*p.x;syy+=p.y*p.y;sxy+=p.x*p.y;}
  const mx=sx/n,my=sy/n;
  const Sxx=sxx-n*mx*mx,Syy=syy-n*my*my,Sxy=sxy-n*mx*my;
  const slope=Math.abs(Sxx)>1e-12?Sxy/Sxx:0;
  const intercept=my-slope*mx;
  const r=(Math.abs(Sxx)>1e-12&&Math.abs(Syy)>1e-12)?Sxy/Math.sqrt(Sxx*Syy):0;
  let rss=0;for(const p of pts){const d=p.y-(intercept+slope*p.x);rss+=d*d;}
  return{slope,intercept,r,rss};
}

/* ============ Anscombe 四重奏（标准数据） ============ */
const AX=[10,8,13,9,11,14,6,4,12,7,5];
const AY=[[8.04,6.95,7.58,8.81,8.33,9.96,7.24,4.26,10.84,4.82,5.68],
          [9.14,8.14,8.74,8.77,9.26,8.10,6.13,3.10,9.13,7.26,4.74],
          [7.46,6.77,12.74,7.11,7.81,8.84,6.08,5.39,8.15,6.42,5.73]];
const BX=[8,8,8,8,8,8,8,19,8,8,8];
const BY=[6.58,5.76,7.71,8.84,8.47,7.04,5.25,12.50,5.56,7.91,6.89];
const Q_ZH=['① 直线团','② 完美曲线','③ 离群点灾难','④ 竖直条纹'];
const Q_EN=['(1) a blob','(2) a perfect curve','(3) outlier disaster','(4) a vertical stripe'];

/* ============ 场景构建 ============ */
const plotG=new THREE.Group();scene.add(plotG);
let pts=[],lineMesh=null,resSegs=null,squares=[],bandLines=[];
let mode='edit',quartetFocus=0,revealed=false,showSquares=false,labelsOn=true;
const sphereGeo=new THREE.SphereGeometry(0.17,14,12);
const lineGeoCyl=new THREE.CylinderGeometry(0.045,0.045,1,10);
const C_PT=new THREE.Color(0xffa94d),C_HIDDEN=new THREE.Color(0x4a90c2);
const labelReg=[];
function addLabel(textFn,pos,cls=''){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn});div.textContent=textFn();return o;
}
function clearPlot(){
  while(plotG.children.length){
    const o=plotG.children[0];plotG.remove(o);
    if(o.geometry&&o.geometry!==sphereGeo&&o.geometry!==lineGeoCyl)o.geometry.dispose();
    if(o.material)o.material.dispose();
  }
  for(const r of labelReg){r.o.element.remove();scene.remove(r.o);}
  labelReg.length=0;
  pts=[];squares=[];bandLines=[];lineMesh=null;resSegs=null;
}
function makePoint(x,y,off=0,color){
  const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:color||C_PT.clone()}));
  m.position.set(WX(x,off),WY(y),0);
  m.userData={x,y,off};
  plotG.add(m);pts.push(m);
  return m;
}
function makeLine(off){
  const m=new THREE.Mesh(lineGeoCyl,new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.95}));
  m.userData.off=off;plotG.add(m);return m;
}
function placeLine(mesh,f){
  const off=mesh.userData.off;
  const x0=0,x1=20;
  const y0=f.intercept,x1v=f.intercept+f.slope*x1;
  const a=new THREE.Vector3(WX(x0,off),WY(y0),0);
  const b=new THREE.Vector3(WX(x1,off),WY(clamp(x1v,0,13)),0);
  const mid=a.clone().add(b).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.scale.y=Math.max(a.distanceTo(b),0.01);
  mesh.rotation.z=Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2;
}
function updateResiduals(f){
  /* 残差线段 + 残差方块（面积=残差²）；旧资源及时释放 */
  if(resSegs){plotG.remove(resSegs);resSegs.geometry.dispose();resSegs.material.dispose();}
  for(const s of squares){plotG.remove(s);s.geometry.dispose();s.material.dispose();}
  squares=[];
  const posArr=new Float32Array(pts.length*6);
  pts.forEach((m,i)=>{
    const {x,y,off}=m.userData;
    const yh=clamp(f.intercept+f.slope*x,0,13);
    posArr[i*6]=WX(x,off);posArr[i*6+1]=WY(y);posArr[i*6+2]=0;
    posArr[i*6+3]=WX(x,off);posArr[i*6+4]=WY(yh);posArr[i*6+5]=0;
    const res=y-yh;
    const sq=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
    const size=Math.min(Math.abs(res)/13*8.0,3.5);
    sq.scale.set(Math.max(size,0.02),Math.max(size,0.02),1);
    sq.position.set(WX(x,off)+Math.sign(res||1)*size/2+0.12,WY(yh)+Math.sign(res||1)*size/2,0.01);
    sq.visible=showSquares;
    plotG.add(sq);squares.push(sq);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(posArr,3).setUsage(THREE.DynamicDrawUsage));
  resSegs=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.75}));
  plotG.add(resSegs);
}

/* ============ 数据集生成 ============ */
let noiseK=0.8,nPts=26;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
function genRandom(){
  clearPlot();
  for(let i=0;i<nPts;i++){
    const x=1+18*Math.random();
    const y=clamp(2.5+0.42*x+gauss()*noiseK,0.2,12.8);
    makePoint(x,y);
  }
  lineMesh=makeLine(0);
  refresh();
}
function genGalton(){
  clearPlot();
  /* 高尔顿父子身高：子≈0.55·(父−均值)+均值 → 斜率<1，极端父代的孩子退回均值 */
  for(let i=0;i<nPts;i++){
    const x=clamp(gauss()*2.6+10,1.5,18.5);
    const y=clamp(5.65+0.55*(x-10)+gauss()*noiseK*1.1,0.2,12.8);
    makePoint(x,y);
  }
  lineMesh=makeLine(0);
  refresh();
  curText=L('斜率 0.55<1：高个子父亲的孩子平均矮一点、矮个子的高一点——「回归」由此得名',
    'slope 0.55<1: tall fathers have shorter sons on average — "regression" got its name here');
}
function genQuartet(){
  clearPlot();
  const sets=[AX.map((x,i)=>({x,y:AY[0][i]})),AX.map((x,i)=>({x,y:AY[1][i]})),
              AX.map((x,i)=>({x,y:AY[2][i]})),BX.map((x,i)=>({x,y:BY[i]}))];
  sets.forEach((set,k)=>{
    const off=(k-1.5)*PW*1.12;
    set.forEach(p=>makePoint(p.x,p.y,off,C_HIDDEN.clone()));
    const f=fitOf(set);
    const lm=makeLine(off);placeLine(lm,f);
    addLabel(()=>L(Q_ZH[k],Q_EN[k]),new THREE.Vector3(off,9.3,0),'b');
  });
  lineMesh=null;resSegs=null;
  curText=L('四组数据 r 全部 ≈0.816，回归线全是 y=3+0.5x——统计摘要说谎的方式',
    'all four: r≈0.816 and line y=3+0.5x — how a summary can lie');
  refresh();
}
let confData=[];
function genConfound(){
  clearPlot();
  confData=[];
  for(let i=0;i<60;i++){
    const T=12+20*Math.random();
    const ice=clamp(15+2.0*(T-12)+gauss()*3,2,45);
    const drown=clamp(5+0.8*(T-12)+gauss()*2,0.5,25);
    confData.push({T,ice,drown});
  }
  confData.forEach(d=>makePoint(d.ice,d.drown,0,C_PT.clone()));
  lineMesh=makeLine(0);
  revealed=false;
  refresh();
  curText=L('冰激凌销量 vs 溺水人数：r≈0.85——难道吃冰激凌会溺水？','ice cream vs drowning: r≈0.85 — does ice cream drown people?');
}
function revealConfound(){
  if(mode!=='confound'||!confData.length)return;
  revealed=!revealed;
  document.getElementById('btnReveal').classList.toggle('on',revealed);
  /* 沿 z 拉出气温维度，颜色随温度 */
  confData.forEach((d,i)=>{
    const m=pts[i];
    const z=revealed?(d.T-12)/20*8-4:0;
    m.position.z=z;
    if(revealed)m.material.color.setHSL(0.63-0.6*(d.T-12)/20,0.72,0.55);
    else m.material.color.copy(C_PT);
  });
  /* 分温度带拟合：带内斜率≈0 */
  for(const bl of bandLines)plotG.remove(bl);
  bandLines=[];
  if(revealed){
    const sorted=confData.map((d,i)=>i).sort((a,b)=>confData[a].T-confData[b].T);
    for(let b=0;b<3;b++){
      const idxs=sorted.slice(b*20,(b+1)*20);
      const slice=idxs.map(i=>pts[i].userData);
      const bl=makeLine(0);
      const zc=(12+20*(b+0.5)-12)/20*8-4;   // 该带中位气温对应的 z
      bl.userData.pts=slice;
      bl.userData.x0=slice[0].x;bl.userData.x1=slice[slice.length-1].x;
      bl.userData.zc=zc;
      plotG.add(bl);bandLines.push(bl);
      placeBandLine(bl,fitOf(slice));
    }
  }
  curText=revealed?L('拉出气温：每个温度带内，冰激凌与溺水几乎无关——是气温同时推高两者',
      'temperature revealed: within each band, ice cream and drowning are unrelated — heat drives both')
    :L('把气温压回去：伪相关又出现了','press temperature back: the spurious correlation returns');
  refresh();
}
function placeBandLine(bl,f){
  const x0=bl.userData.x0,x1=bl.userData.x1,zc=bl.userData.zc;
  const y0=f.intercept,y1=f.intercept+f.slope*x1;
  const a=new THREE.Vector3(WX(x0),WY(y0),zc),b=new THREE.Vector3(WX(x1),WY(clamp(y1,0,13)),zc);
  bl.position.copy(a.clone().add(b).multiplyScalar(0.5));
  bl.scale.y=Math.max(a.distanceTo(b),0.01);
  bl.rotation.z=Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2;
  bl.material.color.setHex(0x74d896);
}

/* ============ 刷新统计与拟合 ============ */
let curText='';
const elN=document.getElementById('stN'),elR=document.getElementById('stR'),
      elB=document.getElementById('stB'),elRss=document.getElementById('stRss');
const formulaEl=document.getElementById('formula');
function refresh(){
  if(mode==='quartet'){
    /* 四重奏：四个面板数字全部一样——这正是要点 */
    const f=fitOf(AX.map((x,i)=>({x,y:AY[0][i]})));
    elN.textContent=11;elR.textContent=f.r.toFixed(3);
    elB.innerHTML=f.slope.toFixed(2)+' · '+f.intercept.toFixed(2);
    elRss.innerHTML=f.rss.toFixed(1)+'<small> ×4</small>';
    updateFormulaQuartet();return;
  }
  const raw=pts.map(m=>m.userData);
  const f=fitOf(raw);
  elN.textContent=raw.length;
  elR.textContent=f.r.toFixed(3);
  elB.innerHTML=f.slope.toFixed(2)+' · '+f.intercept.toFixed(2);
  elRss.innerHTML=f.rss.toFixed(2);
  if(lineMesh)placeLine(lineMesh,f);
  updateResiduals(f);
  if(mode==='confound'&&revealed){
    const fs=[];
    for(const bl of bandLines){
      const bf=fitOf(bl.userData.pts);
      placeBandLine(bl,bf);fs.push(bf);
    }
    if(fs.length)updateFormulaConfound(f,fs);else updateFormula(f);
  }else updateFormula(f);
}
function updateFormula(f){
  formulaEl.innerHTML=L(
    `ŷ = <b>${f.intercept.toFixed(2)} + ${f.slope.toFixed(2)}·x</b>（最小二乘）· r=<b>${f.r.toFixed(3)}</b> · RSS=Σ(y−ŷ)²=<b>${f.rss.toFixed(2)}</b>`+
    `　·　拖动点：线朝大残差方向「让」`,
    `ŷ = <b>${f.intercept.toFixed(2)} + ${f.slope.toFixed(2)}·x</b> (least squares) · r=<b>${f.r.toFixed(3)}</b> · RSS=<b>${f.rss.toFixed(2)}</b>`+
    `　·　drag points: the line yields toward big residuals`);
}
function updateFormulaQuartet(){
  formulaEl.innerHTML=L(
    `四组数据的 r=<b>0.816</b>、回归线全是 <b>y = 3.00 + 0.50x</b>、均值方差全部相同——`+
    `但一个是直线团、一个是完美曲线、一个被离群点拽歪、一个是竖直条纹。先画图，再看摘要。`,
    `All four sets: r=<b>0.816</b>, line <b>y = 3.00 + 0.50x</b>, identical means and variances — `+
    `yet a blob, a perfect curve, an outlier disaster, and a vertical stripe. Plot first, summarize later.`);
}
function updateFormulaConfound(f,fs){
  const rs=fs.map(x=>x.r.toFixed(2)).join(' / ');
  formulaEl.innerHTML=L(
    `总体 r=<b>${f.r.toFixed(2)}</b>（斜率 ${f.slope.toFixed(2)}）；分温度带内 r=<b>${rs}</b>（斜率≈0）——`+
    `是「气温」同时推高冰激凌与溺水：相关≠因果`,
    `overall r=<b>${f.r.toFixed(2)}</b> (slope ${f.slope.toFixed(2)}); within temperature bands r=<b>${rs}</b> (slope≈0) — `+
    `heat drives both: correlation ≠ causation`);
}

/* ============ 模式切换 ============ */
function setMode(m){
  mode=m;
  document.getElementById('mEdit').classList.toggle('on',m==='edit');
  document.getElementById('mQuartet').classList.toggle('on',m==='quartet');
  document.getElementById('mConfound').classList.toggle('on',m==='confound');
  document.getElementById('btnReveal').style.display=m==='confound'?'':'none';
  document.getElementById('btnOutlier').style.display=m==='edit'?'':'none';
  document.getElementById('btnGalton').style.display=m==='edit'?'':'none';
  document.getElementById('btnClear').style.display=m==='edit'?'':'none';
  document.getElementById('btnSquares').style.display=m==='edit'?'':'none';
  document.getElementById('sN').parentElement.style.display=m==='edit'?'':'none';
  document.getElementById('sNoise').parentElement.style.display=m==='edit'?'':'none';
  controls.target.set(0,3,0);
  if(m==='edit')genRandom();
  else if(m==='quartet')genQuartet();
  else genConfound();
}
document.getElementById('mEdit').addEventListener('click',()=>setMode('edit'));
document.getElementById('mQuartet').addEventListener('click',()=>setMode('quartet'));
document.getElementById('mConfound').addEventListener('click',()=>setMode('confound'));
document.getElementById('btnOutlier').addEventListener('click',()=>{
  if(mode!=='edit')return;
  const m=makePoint(19.2,0.6);
  m.material.color.setHex(0xff6b6b);
  refresh();
  curText=L('一个远点进队：整条线被拽过去——杠杆效应','one far point in: the whole line gets yanked — leverage');
});
document.getElementById('btnSquares').addEventListener('click',e=>{
  showSquares=!showSquares;
  e.currentTarget.classList.toggle('on',showSquares);
  for(const s of squares)s.visible=showSquares;
  curText=showSquares?L('每个红方块面积=该点残差²：回归线让总面积最小','each red square area = residual²: the line minimizes total area')
    :L('方块已隐藏','squares hidden');
});
document.getElementById('btnGalton').addEventListener('click',()=>{if(mode!=='edit')return;genGalton();});
document.getElementById('btnReveal').addEventListener('click',()=>revealConfound());
document.getElementById('btnClear').addEventListener('click',()=>{
  if(mode!=='edit')return;
  clearPlot();lineMesh=makeLine(0);refresh();
  curText=L('空白画布：双击空白处加点，拖动调整','blank canvas: double-click empty space to add, drag to adjust');
});
document.getElementById('sN').addEventListener('input',e=>{
  nPts=+e.target.value;document.getElementById('sNVal').textContent=nPts;
  if(mode==='edit')genRandom();
});
document.getElementById('sNoise').addEventListener('input',e=>{
  noiseK=+e.target.value/100;document.getElementById('sNoiseVal').textContent=noiseK.toFixed(2);
  if(mode==='edit')genRandom();
});

/* ============ 拖拽点（编辑模式） ============ */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
let dragging=null,downX=0,downY=0,moved=false;
renderer.domElement.addEventListener('pointerdown',e=>{
  downX=e.clientX;downY=e.clientY;moved=false;
  if(mode!=='edit')return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pts)[0];
  if(hit){dragging=hit.object;controls.enabled=false;}
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)moved=true;
  if(!dragging)return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(dragPlane,p)){
    dragging.userData.x=clamp((p.x/PW+0.5)*20,0,20);
    dragging.userData.y=clamp(p.y/8.0*13,0,13);
    dragging.position.set(WX(dragging.userData.x),WY(dragging.userData.y),0);
    refresh();
  }
});
addEventListener('pointerup',()=>{
  if(dragging){dragging=null;controls.enabled=true;}
});
/* 双击空白加点 */
renderer.domElement.addEventListener('dblclick',e=>{
  if(mode!=='edit')return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pts)[0];
  if(hit)return;
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(dragPlane,p)){
    const x=clamp((p.x/PW+0.5)*20,0,20),y=clamp(p.y/8.0*13,0,13);
    makePoint(x,y);refresh();
  }
});

/* ============ 步骤 ============ */
const STEPS=[
  {zh:'最小二乘：回归线是让残差平方和 Σ(y−ŷ)² 最小的那条线',en:'Least squares: the line minimizing Σ(y−ŷ)²',
   act:()=>{setMode('edit');document.getElementById('btnSquares').click();
     curText=L('红方块面积=残差²，线在让总面积最小','red squares = residual²; the line minimizes total area');}},
  {zh:'相关系数 r：度量线性关联强度，±1 之间；r=0 不代表没关系',en:'r measures linear association in [−1, 1]; r=0 is not "no relation"',
   act:()=>{setMode('edit');document.getElementById('sNoise').value=0;
     document.getElementById('sNoise').dispatchEvent(new Event('input'));}},
  {zh:'拖动任意点：回归线实时重算，朝大残差方向「让」',en:'Drag any point: the line recomputes and yields toward big residuals',
   act:()=>{setMode('edit');curText=L('按住任意球拖动试试','grab any sphere and drag');}},
  {zh:'离群点杠杆：一个远点就能把线拽歪——先查数据再信斜率',en:'Outlier leverage: one far point tilts everything — check data before trusting slope',
   act:()=>{setMode('edit');document.getElementById('btnOutlier').click();}},
  {zh:'Anscombe 四重奏：同样的 r≈0.82，四种完全不同的数据',en:'Anscombe quartet: same r≈0.82, four utterly different datasets',
   act:()=>{setMode('quartet');}},
  {zh:'回归均值：父代极端，子代平庸——高尔顿由此发明「回归」一词',en:'Regression to the mean: extreme parents, average kids — Galton coined the term',
   act:()=>{setMode('edit');genGalton();}},
  {zh:'相关≠因果：拉出隐藏的「气温」，冰激凌-溺水的伪相关消失',en:'Correlation ≠ causation: reveal hidden temperature, the spurious link melts',
   act:()=>{setMode('confound');document.getElementById('btnReveal').click();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ 其余 UI ============ */
const playBtn=document.getElementById('play');
let playing=false;
playBtn.addEventListener('click',()=>{playing=!playing;playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();
  setMode(mode);   // 重建以刷新双语标签
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  acc+=dt;
  if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg)r.o.visible=labelsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 统计 ============ */
function updateStats(){
  if(mode==='quartet'){
    const f=fitOf(AX.map((x,i)=>({x,y:AY[0][i]})));
    elN.textContent=11;elR.textContent=f.r.toFixed(3);
    elB.innerHTML=f.slope.toFixed(2)+' · '+f.intercept.toFixed(2);
    elRss.innerHTML=f.rss.toFixed(1)+'<small> ×4 相同</small>';
  }else{
    const f=fitOf(pts.map(m=>m.userData));
    elN.textContent=pts.length;
    elR.textContent=f.r.toFixed(3);
    elB.innerHTML=f.slope.toFixed(2)+' · '+f.intercept.toFixed(2);
    elRss.innerHTML=f.rss.toFixed(2);
  }
}
/* ============ 初始化 ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
applyTheme();buildSteps();setMode('edit');applyLang();start();
</script>
