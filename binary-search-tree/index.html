<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树</title>
<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;
    --acc:#74c0fc;--bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
    --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);}
  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);
    color:var(--text3);font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;
    white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s;}
  :root[data-theme="light"] .lbl{text-shadow:none;}
  .lbl.o{border-color:rgba(240,192,64,.9);color:#ffe9b0;}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0;}
  .lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2;}
  .lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff;}
  .lbl.st{border-color:rgba(154,167,184,.9);font-size:13px;padding:6px 11px;}
  .lbl.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12.5px;padding:4px 7px;}
  :root[data-theme="light"] .lbl.o{color:#8a6100;}:root[data-theme="light"] .lbl.g{color:#2b8a3e;}
  :root[data-theme="light"] .lbl.r{color:#c92a2a;}:root[data-theme="light"] .lbl.b{color:#1864ab;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
    font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
    border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11.5px;color:var(--text2);font-weight:400;}#stats .v.g{color:var(--acc);}
  #seq{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:8px 14px;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(6px);}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #legend{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;}
  .chip.o{color:#ffe9b0;border-color:rgba(240,192,64,.7);}
  .chip.g{color:#c8f5d0;border-color:rgba(116,220,132,.7);}
  .chip.r{color:#ffc2c2;border-color:rgba(255,107,107,.7);}
  .chip.b{color:#bde9ff;border-color:rgba(116,192,252,.7);}
  :root[data-theme="light"] .chip.o{color:#8a6100;border-color:rgba(160,112,0,.7);}
  :root[data-theme="light"] .chip.g{color:#2b8a3e;border-color:rgba(43,138,62,.7);}
  :root[data-theme="light"] .chip.r{color:#c92a2a;border-color:rgba(201,42,42,.7);}
  :root[data-theme="light"] .chip.b{color:#1864ab;border-color:rgba(24,100,171,.7);}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(116,192,252,.10);border-color:rgba(116,192,252,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}#steps .t b{color:var(--text);}
  #steps li.on .t b{color:#bde9ff;}:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  .abtn{appearance:none;font:inherit;cursor:pointer;width:100%;background:var(--hover);
    color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;
    padding:6px 10px;text-align:left;font-size:12.5px;margin-top:6px;
    transition:border-color .15s,color .15s,background .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--text);}
  .abtn.on{border-color:var(--acc);color:var(--text);background:rgba(116,192,252,.10);}
  :root[data-theme="light"] .abtn.on{background:rgba(25,113,194,.08);}
  #btns{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 96px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  #toggles{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer;}
  #toggles input{accent-color:var(--acc);}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- BST 数据结构(与源 2D 页一致) ---------------- */
class BSTNode {
  constructor(key) { this.key = key; this.left = null; this.right = null; this.state = 'default'; }
}
class BST {
  constructor() { this.root = null; }
  insert(key) {
    const node = new BSTNode(key);
    if (!this.root) { this.root = node; return []; }
    const path = [];
    let cur = this.root;
    while (true) {
      path.push(cur);
      if (key < cur.key) { if (!cur.left) { cur.left = node; break; } cur = cur.left; }
      else if (key > cur.key) { if (!cur.right) { cur.right = node; break; } cur = cur.right; }
      else break;
    }
    return path;
  }
  search(key) {
    const path = []; let cur = this.root;
    while (cur) { path.push({ node: cur, found: cur.key === key }); if (cur.key === key) break; cur = key < cur.key ? cur.left : cur.right; }
    return path;
  }
  height(node = this.root) {
    if (!node) return 0;
    return 1 + Math.max(this.height(node.left), this.height(node.right));
  }
  count(node = this.root) {
    if (!node) return 0; return 1 + this.count(node.left) + this.count(node.right);
  }
  inorder(node = this.root, result = []) {
    if (!node) return result;
    this.inorder(node.left, result); result.push(node); this.inorder(node.right, result); return result;
  }
  _min(node) { while (node.left) node = node.left; return node; }
  // 删除一个键;返回 {path, successorKey, removed} 供动画使用
  deleteKey(key) {
    const searchPath = [];
    let parent = null, cur = this.root, dir = null;
    while (cur) {
      searchPath.push(cur);
      if (key === cur.key) break;
      parent = cur; dir = key < cur.key ? 'left' : 'right'; cur = cur[dir];
    }
    if (!cur) return { path: searchPath, successorKey: null, removed: null };
    let successorKey = null, removed = null;
    if (cur.left && cur.right) {
      // 双子节点:找中序后继(右子树最小)替换,再删后继
      const succ = this._min(cur.right);
      successorKey = succ.key;
      cur.key = succ.key;
      let sp = cur, sc = cur.right, sd = 'right';
      while (sc.left) { sp = sc; sd = 'left'; sc = sc.left; }
      sp[sd] = sc.right;
      removed = sc;
    } else {
      const child = cur.left || cur.right;
      if (!parent) this.root = child;
      else parent[dir] = child;
      removed = cur;
    }
    return { path: searchPath, successorKey, removed };
  }
}
const bst = new BST();

/* ---------------- 渲染器 / 场景 ---------------- */
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(5.5, 3.2, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 70;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ================= 布局常量 ================= */
const ROOT_Y = 2.6;        // 根节点悬浮高度
const FLOOR_Y = -4.95;     // 地面网格(最深链 ~-4.1)
const MAXN = 56;           // 视觉节点上限

scene.fog = new THREE.Fog(0x10141b, 26, 80);
const grid = new THREE.GridHelper(64, 32, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.material.toneMapped = false;
grid.position.y = FLOOR_Y;
scene.add(grid);

/* ================= 节点球 / 管道边 ================= */
const sphereGeo = new THREE.SphereGeometry(0.34, 28, 20);
const edgeGeo = new THREE.CylinderGeometry(0.045, 0.045, 1, 10);
edgeGeo.translate(0, 0.5, 0);   // 底端在原点、指向 +y,便于 scale.y=长度
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x7d93a8, roughness: 0.45, metalness: 0.3 });

/* 状态色 = 源页配色(填充/描边),深浅两套主题 */
const NODE_COLORS = {
  dark: {
    default: { fill: 0x3a4a5a, stroke: 0x5a7a9a },
    gold:    { fill: 0x8b6a00, stroke: 0xf0c040 },
    green:   { fill: 0x1a5c28, stroke: 0x4ec96a },
    red:     { fill: 0x6b1010, stroke: 0xe05050 },
    cyan:    { fill: 0x0d4a5a, stroke: 0x40c0d8 },
  },
  light: {
    default: { fill: 0xc8d8e8, stroke: 0x6080a0 },
    gold:    { fill: 0xf0d050, stroke: 0xa07000 },
    green:   { fill: 0x80e090, stroke: 0x1a8030 },
    red:     { fill: 0xf09090, stroke: 0x902020 },
    cyan:    { fill: 0x80d8e8, stroke: 0x1080a0 },
  },
};
const PILL_CLS = { default: '', gold: 'o', green: 'g', red: 'r', cyan: 'b' };

const visuals = new Map();   // BSTNode -> 可视化对象
let deepestVis = null;
let snapAll = false;         // 建树瞬间落位(无飞行动画)

function applyStateColor(v, snap) {
  const sc = NODE_COLORS[THEME][v.node.state] || NODE_COLORS[THEME].default;
  v.colT.setHex(sc.fill);
  v.emiT.setHex(sc.stroke);
  v.mesh.material.emissiveIntensity = THEME === 'dark' ? 0.5 : 0.35;
  if (snap) { v.mesh.material.color.copy(v.colT); v.mesh.material.emissive.copy(v.emiT); }
}
function setState(node, s) {
  node.state = s;
  const v = visuals.get(node);
  if (v) applyStateColor(v, false);
}
function resetStates() {
  (function w(n) { if (!n) return; setState(n, 'default'); w(n.left); w(n.right); })(bst.root);
}

function createVis(node) {
  const material = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.38, metalness: 0.12 });
  const mesh = new THREE.Mesh(sphereGeo, material);
  scene.add(mesh);
  const div = document.createElement('div');
  div.className = 'lbl key';
  div.textContent = String(node.key);
  const pill = new CSS2DObject(div);
  scene.add(pill);
  const v = { node, mesh, pill, edge: null, parentVis: null,
    cur: new THREE.Vector3(0, 6.5, 0), tgt: new THREE.Vector3(), dp: new THREE.Vector3(),
    s: 0, sT: 1, dead: false, colT: new THREE.Color(), emiT: new THREE.Color(),
    bobT: 0, phase: (node.key % 17) * 0.7, shownKey: node.key, shownCls: '' };
  applyStateColor(v, true);
  return v;
}

/* 布局:中序序号 → x(x 方向天然按键序排开,中序遍历 = 从左扫到右);
   层号 → y(根在上,逐层下沉);x² 小抛物线 → z,让树墙微微向观者弯曲 */
function syncTree() {
  const n = bst.count();
  const h = bst.height();
  const gap = clamp(15.5 / Math.max(n, 1), 0.6, 1.6);
  const lh = clamp(7.4 / Math.max(h - 1, 1), 0.55, 1.12);
  const present = new Set();
  let idx = 0, maxLevel = -1;
  deepestVis = null;
  (function walk(node, parent, level) {
    if (!node) return;
    walk(node.left, node, level + 1);
    const x = (idx - (n - 1) / 2) * gap; idx++;
    present.add(node);
    let v = visuals.get(node);
    if (!v) {
      v = createVis(node);
      const pv = parent ? visuals.get(parent) : null;
      if (pv) v.cur.copy(pv.dp);            // 新叶从父节点位置“长”出来
      if (snapAll) { v.cur.set(x, ROOT_Y - level * lh, -0.012 * x * x); v.s = 1; }
      visuals.set(node, v);
    }
    v.parentVis = parent;
    v.tgt.set(x, ROOT_Y - level * lh, -0.012 * x * x);
    if (level > maxLevel) { maxLevel = level; deepestVis = v; }
    walk(node.right, node, level + 1);
  })(bst.root, null, 0);
  for (const v of visuals.values()) {
    if (!present.has(v.node) && !v.dead) { v.dead = true; v.sT = 0; }
  }
  updateStats();
}

/* 节点到地面的虚线“铅垂线”:深度参照 */
const plumbPos = new Float32Array(MAXN * 2 * 3);
const plumbGeo = new THREE.BufferGeometry();
plumbGeo.setAttribute('position', new THREE.BufferAttribute(plumbPos, 3));
const plumbMat = new THREE.LineDashedMaterial({ color: 0x55636f, transparent: true, opacity: 0.4, dashSize: 0.12, gapSize: 0.1, toneMapped: false });
const plumb = new THREE.LineSegments(plumbGeo, plumbMat);
plumb.frustumCulled = false;
scene.add(plumb);

/* ================= 场景标签 ================= */
const labelReg = [];
let labelsOn = qsBool('labels', true);
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis() && r.text() !== '';
}
addLabel(() => L('左子树 < 根 < 右子树 · 递归成立', 'left < root < right · recursively'),
  new THREE.Vector3(0, ROOT_Y + 1.7, 0), 'b', () => !!bst.root);
const rootLbl = addLabel(() => L('根 root', 'root'), new THREE.Vector3(0, ROOT_Y + 0.9, 0), 'st', () => !!bst.root);
const deepLbl = addLabel(() => {
  const h = bst.height(), opt = bst.count() > 0 ? Math.floor(Math.log2(bst.count())) : 0;
  return L(`树高 h=${h},最优 ${opt}——正在退化`, `h=${h} vs optimal ${opt} — degenerating`);
}, new THREE.Vector3(), 'o', () => { const n = bst.count(); return n >= 4 && bst.height() >= Math.floor(Math.log2(n)) + 2; });
addLabel(() => L('点击左侧按钮,把节点挂进树里', 'use the panel buttons to grow the tree'),
  new THREE.Vector3(0, 1.8, 0), 'st', () => !bst.root);

/* ================= 状态 / 动画节拍 ================= */
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.3, 2.5);
let animRunning = false;
let animNow = 0;                     // 动画时钟:暂停即冻结,速度滑杆缩放
const waiters = [];
function sleep(ms) { return new Promise(res => waiters.push({ until: animNow + ms, res })); }
async function exclusive(fn) {       // 同一时刻只跑一个演示序列
  if (animRunning) return;
  animRunning = true;
  try { await fn(); } finally { animRunning = false; }
}

const elN = document.getElementById('stN'), elH = document.getElementById('stH'),
  elOpt = document.getElementById('stOpt'), elCmp = document.getElementById('stCmp'),
  seqBar = document.getElementById('seq');
function updateStats() {
  const n = bst.count(); const h = bst.height();
  elN.textContent = n;
  elH.textContent = h;
  elOpt.textContent = n > 0 ? Math.floor(Math.log2(n)) : 0;
}

async function animatePath(pathNodes, finalColor = 'green') {
  resetStates();
  for (let i = 0; i < pathNodes.length; i++) {
    const info = pathNodes[i];
    const node = info.node || info;
    const isLast = i === pathNodes.length - 1;
    if (info.found !== undefined) {
      setState(node, info.found ? 'green' : (isLast ? 'red' : 'gold'));
    } else {
      setState(node, isLast ? finalColor : 'gold');
    }
    await sleep(420);
  }
  elCmp.textContent = pathNodes.length;
}

async function animateInorder() {
  resetStates();
  const nodes = bst.inorder();
  const sortedKeys = nodes.map(nd => nd.key);
  seqBar.style.opacity = '1';
  for (let i = 0; i < nodes.length; i++) {
    if (i > 0) setState(nodes[i - 1], 'default');
    setState(nodes[i], 'cyan');
    seqBar.textContent = sortedKeys.slice(0, i + 1).join(' < ');
    await sleep(300);
  }
  await sleep(900);
  seqBar.style.opacity = '0';
  resetStates();
}

async function animateDelete(key) {
  if (!bst.root) return;
  // 先走查找路径
  const searchPath = bst.search(key);
  resetStates();
  for (let i = 0; i < searchPath.length; i++) {
    const info = searchPath[i];
    setState(info.node, info.found ? 'red' : 'gold');
    await sleep(380);
  }
  await sleep(300);
  // 执行删除
  const { successorKey } = bst.deleteKey(key);
  syncTree();
  if (successorKey !== null) {
    // 短暂高亮中序后继
    const succPath = bst.search(successorKey);
    if (succPath.length > 0) {
      setState(succPath[succPath.length - 1].node, 'cyan');
      await sleep(500);
    }
  }
  resetStates();
  elCmp.textContent = searchPath.length;
}

/* ---- 初始树 ---- */
function buildInitial() {
  snapAll = true;
  [50, 30, 70, 20, 40, 60, 80].forEach(k => bst.insert(k));
  syncTree();
  snapAll = false;
}

/* ================= 讲解步骤(与源页一致) ================= */
const STEPS = [
  { b:'BST 不变量', be:'BST Invariant',
    d:'左子树所有键 < 根键 < 右子树所有键，递归成立',
    de:'All left-subtree keys < root < all right-subtree keys, recursively' },
  { b:'查找 O(log n)', be:'Search O(log n)',
    d:'每次比较排除一半子树，平衡树中深度 ≈ log₂n',
    de:'Each comparison eliminates half the tree — depth ≈ log₂n in a balanced tree' },
  { b:'插入', be:'Insert',
    d:'沿查找路径走到空位，新建叶节点',
    de:'Walk to null following the search path, create a leaf' },
  { b:'删除（双子节点）', be:'Delete (two children)',
    d:'找中序后继替换，再删后继',
    de:'Find in-order successor, replace, delete it' },
  { b:'退化', be:'Degeneration',
    d:'有序插入使树退化为链表，O(n) 查找',
    de:'Sorted inserts 1–7 make a linear chain — O(n) search' },
  { b:'中序遍历', be:'In-order Traversal',
    d:'左→根→右 输出有序序列',
    de:'Left→root→right outputs sorted sequence' },
];
function lightStep(i) {
  document.querySelectorAll('#steps li').forEach((li, j) => li.classList.toggle('on', j === i));
}
function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => {
      document.querySelectorAll('#steps li').forEach((x, j) => x.classList.toggle('on', j === i));
      if (i === 5) exclusive(animateInorder);
    });
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });

document.getElementById('btnRand').addEventListener('click', () => exclusive(async () => {
  resetStates();
  const keys = Array.from({ length: 15 }, () => Math.floor(Math.random() * 99) + 1);
  for (const k of keys) {
    if (bst.count() >= MAXN - 6) break;
    const path = bst.insert(k);
    syncTree();
    if (path.length > 0) await animatePath(path, 'green');
    else await sleep(160);
    await sleep(80);
  }
  resetStates();
}));
document.getElementById('btnSorted').addEventListener('click', () => exclusive(async () => {
  bst.root = null; syncTree();
  for (let k = 1; k <= 7; k++) {
    bst.insert(k);
    syncTree();
    await sleep(350);
  }
  lightStep(4);
}));
document.getElementById('btnSearch').addEventListener('click', () => exclusive(async () => {
  const path = bst.search(45);
  await animatePath(path);
}));
document.getElementById('btnDelete').addEventListener('click', () => exclusive(async () => {
  // 删除 30(初始树中它有 20 和 40 两个子节点)——演示双子节点删除与中序后继
  await animateDelete(30);
  lightStep(3);
}));
document.getElementById('btnInorder').addEventListener('click', () => exclusive(async () => {
  await animateInorder();
  lightStep(5);
}));
document.getElementById('btnClear').addEventListener('click', () => {
  if (animRunning) return;
  bst.root = null; syncTree();
  elCmp.textContent = '0';
  seqBar.style.opacity = '0';
});

/* ================= 主题 / 语言 ================= */
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  if (scene.fog) scene.fog.color.set(bg);
  grid.material.color.set(THEME === 'light' ? 0xa8b4c4 : 0x3a4656);
  grid.material.opacity = THEME === 'light' ? 0.6 : 0.35;
  edgeMat.color.set(THEME === 'light' ? 0x46627e : 0x7d93a8);
  plumbMat.color.set(THEME === 'light' ? 0x8a99ab : 0x55636f);
  for (const v of visuals.values()) applyStateColor(v, false);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('二叉搜索树', 'Binary Search Tree');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => { THEME = THEME === 'dark' ? 'light' : 'dark'; localStorage.setItem('htw-theme', THEME); applyTheme(); });
document.getElementById('langBtn').addEventListener('click', () => { LANG = LANG === 'zh' ? 'en' : 'zh'; localStorage.setItem('htw-lang', LANG); applyLang(); });

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null;
const UP = new THREE.Vector3(0, 1, 0);
const _d = new THREE.Vector3();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    animNow += dt * 1000 * speed;
    for (let i = waiters.length - 1; i >= 0; i--) {
      if (animNow >= waiters[i].until) { const w = waiters[i]; waiters.splice(i, 1); w.res(); }
    }
  }
  const kPos = 1 - Math.exp(-7 * dt);
  const kScl = 1 - Math.exp(-9 * dt);
  const kCol = 1 - Math.exp(-10 * dt);
  const dying = [];
  for (const v of visuals.values()) {
    v.cur.lerp(v.tgt, kPos);
    v.s += (v.sT - v.s) * kScl;
    if (playing) v.bobT += dt;
    v.dp.copy(v.cur); v.dp.y += Math.sin(v.bobT * 1.15 + v.phase) * 0.035 * v.s;
    v.mesh.position.copy(v.dp);
    v.mesh.scale.setScalar(Math.max(v.s, 1e-4));
    v.mesh.material.color.lerp(v.colT, kCol);
    v.mesh.material.emissive.lerp(v.emiT, kCol);
    v.pill.position.copy(v.dp);
    v.pill.visible = labelsOn && !v.dead;
    if (v.shownKey !== v.node.key) { v.shownKey = v.node.key; v.pill.element.textContent = String(v.shownKey); }
    const cls = PILL_CLS[v.node.state] || '';
    if (v.shownCls !== cls) { v.shownCls = cls; v.pill.element.className = 'lbl key' + (cls ? ' ' + cls : ''); }
    if (v.dead && v.s < 0.02) dying.push(v);
  }
  for (const v of dying) {
    scene.remove(v.mesh); scene.remove(v.pill);
    if (v.edge) scene.remove(v.edge);
    v.mesh.material.dispose();
    visuals.delete(v.node);
  }
  /* 管道边:父 dp → 子 dp */
  for (const v of visuals.values()) {
    const pv = v.parentVis ? visuals.get(v.parentVis) : null;
    if (pv && v.s > 0.001) {
      if (!v.edge) { v.edge = new THREE.Mesh(edgeGeo, edgeMat); v.edge.frustumCulled = false; scene.add(v.edge); }
      _d.subVectors(v.dp, pv.dp);
      const len = Math.max(_d.length(), 1e-4);
      v.edge.position.copy(pv.dp);
      v.edge.quaternion.setFromUnitVectors(UP, _d.normalize());
      const r = Math.max(v.s, 0.02);
      v.edge.scale.set(r, len, r);
    } else if (v.edge) { scene.remove(v.edge); v.edge = null; }
  }
  /* 铅垂线 */
  let pi = 0;
  for (const v of visuals.values()) {
    if (v.dead || pi >= MAXN) continue;
    plumbPos[pi * 6] = v.dp.x; plumbPos[pi * 6 + 1] = FLOOR_Y; plumbPos[pi * 6 + 2] = v.dp.z;
    plumbPos[pi * 6 + 3] = v.dp.x; plumbPos[pi * 6 + 4] = v.dp.y - 0.34 * v.s; plumbPos[pi * 6 + 5] = v.dp.z;
    pi++;
  }
  plumbGeo.attributes.position.needsUpdate = true;
  plumbGeo.setDrawRange(0, pi * 2);
  plumb.computeLineDistances();
  /* 跟随标签 */
  const rv = bst.root ? visuals.get(bst.root) : null;
  if (rv) rootLbl.position.set(rv.dp.x, rv.dp.y + 0.85, rv.dp.z);
  if (deepestVis && !deepestVis.dead) deepLbl.position.set(deepestVis.dp.x, deepestVis.dp.y - 0.85, deepestVis.dp.z);
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
buildInitial();
applyTheme();
applyLang();
setPlayLabel();
tglLabels.checked = labelsOn;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
