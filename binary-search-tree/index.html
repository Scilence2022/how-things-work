<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树</title>
<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;
    --acc:#74c0fc;--bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
    --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);
    --node-default:#3a4a5a;--node-gold:#c8960c;--node-green:#2d7a3a;--node-red:#8b2020;--node-cyan:#1a6a7a;}
  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
    --node-default:#8099b0;--node-gold:#c8960c;--node-green:#2d7a3a;--node-red:#8b2020;--node-cyan:#1a6a7a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
  #app{position:fixed;inset:0;}
  #bstCanvas{display:block;width:100%;height:100%;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
    font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
    border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11.5px;color:var(--text2);font-weight:400;}#stats .v.g{color:var(--acc);}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(116,192,252,.10);border-color:rgba(116,192,252,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}#steps .t b{color:var(--text);}
  #steps li.on .t b{color:#bde9ff;}:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  .abtn{appearance:none;font:inherit;cursor:pointer;width:100%;background:var(--hover);
    color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;
    padding:6px 10px;text-align:left;font-size:12.5px;margin-top:6px;
    transition:border-color .15s,color .15s,background .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--text);}
  .abtn.on{border-color:var(--acc);color:var(--text);background:rgba(116,192,252,.10);}
  :root[data-theme="light"] .abtn.on{background:rgba(25,113,194,.08);}
  #btns{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"><canvas id="bstCanvas"></canvas></div>
<div id="title">
  <h1 data-zh="二叉搜索树" data-en="Binary Search Tree">二叉搜索树</h1>
  <div class="sub"
    data-zh="左小右大让查找在 O(log n) 完成——直到退化成链表"
    data-en="Left-smaller right-larger keeps search O(log n) — until degeneration">
    左小右大让查找在 O(log n) 完成——直到退化成链表</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="节点数 n" data-en="Nodes n">节点数 n</span><span class="v g" id="stN">0</span>
  <span class="k" data-zh="树高 h" data-en="Height h">树高 h</span><span class="v" id="stH">0</span>
  <span class="k" data-zh="最优高度 ⌊log₂n⌋" data-en="Optimal ⌊log₂n⌋">最优高度 ⌊log₂n⌋</span><span class="v g" id="stOpt">0</span>
  <span class="k" data-zh="最近比较次数" data-en="Last comparisons">最近比较次数</span><span class="v" id="stCmp">0</span>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="btns">
    <button class="abtn" id="btnRand" data-zh="随机插入15/Random 15" data-en="随机插入15/Random 15">随机插入15/Random 15</button>
    <button class="abtn" id="btnSorted" data-zh="有序插入(退化)/Sorted" data-en="有序插入(退化)/Sorted">有序插入(退化)/Sorted</button>
    <button class="abtn" id="btnSearch" data-zh="搜索/Search 45" data-en="搜索/Search 45">搜索/Search 45</button>
    <button class="abtn" id="btnDelete" data-zh="删除节点/Delete 30" data-en="删除节点/Delete 30">删除节点/Delete 30</button>
    <button class="abtn" id="btnInorder" data-zh="中序遍历/In-order" data-en="中序遍历/In-order">中序遍历/In-order</button>
    <button class="abtn" id="btnClear" data-zh="清空/Clear" data-en="清空/Clear">清空/Clear</button>
  </div>
</div>
<script>
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let LANG  = localStorage.getItem('htw-lang')||'zh';
const L = (zh,en) => LANG==='en'?en:zh;

// ---- BST data structure ----
class BSTNode {
  constructor(key) { this.key=key; this.left=null; this.right=null; this.x=0; this.y=0; this.color='default'; }
}

class BST {
  constructor() { this.root=null; }
  insert(key) {
    const node=new BSTNode(key);
    if(!this.root){ this.root=node; return []; }
    const path=[];
    let cur=this.root;
    while(true){
      path.push(cur);
      if(key<cur.key){ if(!cur.left){ cur.left=node; break; } cur=cur.left; }
      else if(key>cur.key){ if(!cur.right){ cur.right=node; break; } cur=cur.right; }
      else break;
    }
    return path;
  }
  search(key) {
    const path=[]; let cur=this.root;
    while(cur){ path.push({node:cur,found:cur.key===key}); if(cur.key===key) break; cur=key<cur.key?cur.left:cur.right; }
    return path;
  }
  height(node=this.root) {
    if(!node) return 0;
    return 1+Math.max(this.height(node.left),this.height(node.right));
  }
  count(node=this.root) {
    if(!node) return 0; return 1+this.count(node.left)+this.count(node.right);
  }
  inorder(node=this.root, result=[]) {
    if(!node) return result;
    this.inorder(node.left,result); result.push(node); this.inorder(node.right,result); return result;
  }
  // Find minimum node in a subtree (leftmost node)
  _min(node) { while(node.left) node=node.left; return node; }
  // Delete a key; returns {path, successorKey} for animation
  deleteKey(key) {
    const searchPath=[];
    let parent=null, cur=this.root, dir=null;
    while(cur){
      searchPath.push(cur);
      if(key===cur.key) break;
      parent=cur; dir=key<cur.key?'left':'right'; cur=cur[dir];
    }
    if(!cur) return {path:searchPath, successorKey:null};
    let successorKey=null;
    if(cur.left && cur.right){
      // two children: find in-order successor (min of right subtree)
      const succ=this._min(cur.right);
      successorKey=succ.key;
      cur.key=succ.key;
      // delete successor from right subtree
      let sp=cur, sc=cur.right, sd='right';
      while(sc.left){ sp=sc; sd='left'; sc=sc.left; }
      sp[sd]=sc.right;
    } else {
      const child=cur.left||cur.right;
      if(!parent) this.root=child;
      else parent[dir]=child;
    }
    return {path:searchPath, successorKey};
  }
  // Layout: assign x/y positions level by level
  layout(node=this.root, xMin=0, xMax=1, level=0) {
    if(!node) return;
    node.x=(xMin+xMax)/2; node.y=level;
    this.layout(node.left,xMin,(xMin+xMax)/2,level+1);
    this.layout(node.right,(xMin+xMax)/2,xMax,level+1);
  }
}

const bst = new BST();

// ---- canvas setup ----
const canvas = document.getElementById('bstCanvas');
const ctx = canvas.getContext('2d');
const NR = 22; // node radius px

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  bst.layout();
  draw();
}

// ---- drawing ----
const NODE_COLORS = {
  default: { fill:'#3a4a5a', stroke:'#5a7a9a', text:'#e0eaf5' },
  gold:    { fill:'#8b6a00', stroke:'#f0c040', text:'#fff8e0' },
  green:   { fill:'#1a5c28', stroke:'#4ec96a', text:'#d0ffe0' },
  red:     { fill:'#6b1010', stroke:'#e05050', text:'#ffe0e0' },
  cyan:    { fill:'#0d4a5a', stroke:'#40c0d8', text:'#d0f8ff' },
};

function getColors() {
  if(THEME==='light') return {
    default:{ fill:'#c8d8e8', stroke:'#6080a0', text:'#1a2a3a' },
    gold:   { fill:'#f0d050', stroke:'#a07000', text:'#3a2a00' },
    green:  { fill:'#80e090', stroke:'#1a8030', text:'#0a2010' },
    red:    { fill:'#f09090', stroke:'#902020', text:'#300000' },
    cyan:   { fill:'#80d8e8', stroke:'#1080a0', text:'#002030' },
  };
  return NODE_COLORS;
}

function drawEdges(node) {
  if(!node) return;
  const W=canvas.width, H=canvas.height;
  const ox=node.x*W, oy=node.y*80+70;
  ctx.strokeStyle=THEME==='dark'?'rgba(180,200,220,0.3)':'rgba(60,90,120,0.35)';
  ctx.lineWidth=1.5;
  if(node.left){ ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(node.left.x*W,node.left.y*80+70); ctx.stroke(); }
  if(node.right){ ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(node.right.x*W,node.right.y*80+70); ctx.stroke(); }
  drawEdges(node.left); drawEdges(node.right);
}

function drawNodes(node) {
  if(!node) return;
  const W=canvas.width;
  const cx=node.x*W, cy=node.y*80+70;
  const colors=getColors();
  const c=colors[node.color||'default'];
  ctx.beginPath(); ctx.arc(cx,cy,NR,0,Math.PI*2);
  ctx.fillStyle=c.fill; ctx.fill();
  ctx.strokeStyle=c.stroke; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=c.text; ctx.font='bold 13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(node.key,cx,cy);
  drawNodes(node.left); drawNodes(node.right);
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const bg = THEME==='dark'?'#10141b':'#eef1f6';
  ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!bst.root) {
    ctx.fillStyle=THEME==='dark'?'rgba(150,180,210,0.3)':'rgba(60,90,120,0.4)';
    ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(L('点击按钮插入节点','Click a button to insert nodes'), canvas.width/2, canvas.height/2);
    return;
  }
  drawEdges(bst.root);
  drawNodes(bst.root);
  updateStats();
}

function resetColors(node=bst.root) {
  if(!node) return; node.color='default'; resetColors(node.left); resetColors(node.right);
}

function updateStats() {
  const n=bst.count(); const h=bst.height();
  document.getElementById('stN').textContent=n;
  document.getElementById('stH').textContent=h;
  document.getElementById('stOpt').textContent=n>0?Math.floor(Math.log2(n)):0;
}
// ---- animation queue ----
let animQueue = [];
let animRunning = false;
let lastCmpCount = 0;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function animatePath(pathNodes, finalColor='green') {
  animRunning = true;
  resetColors();
  for(let i=0; i<pathNodes.length; i++){
    const info = pathNodes[i];
    const node = info.node || info;
    const isLast = i === pathNodes.length - 1;
    if(info.found !== undefined) {
      node.color = info.found ? 'green' : (isLast ? 'red' : 'gold');
    } else {
      node.color = isLast ? finalColor : 'gold';
    }
    bst.layout(); draw();
    await sleep(420);
  }
  animRunning = false;
  document.getElementById('stCmp').textContent = pathNodes.length;
}

async function animateInorder() {
  animRunning = true;
  resetColors(); draw();
  const nodes = bst.inorder();
  // Show the sorted sequence in an overlay label as we traverse
  const sortedKeys = nodes.map(n=>n.key);
  for(let i=0; i<nodes.length; i++){
    if(i>0) nodes[i-1].color = 'default';
    nodes[i].color = 'cyan';
    bst.layout(); draw();
    // draw partial sorted sequence label
    ctx.save();
    ctx.fillStyle = THEME==='dark'?'rgba(13,17,24,0.82)':'rgba(240,244,248,0.82)';
    ctx.strokeStyle = THEME==='dark'?'rgba(116,192,252,0.4)':'rgba(25,113,194,0.4)';
    ctx.lineWidth=1;
    const label = sortedKeys.slice(0,i+1).join(' < ');
    ctx.font='13px monospace';
    const tw = ctx.measureText(label).width;
    const rx=canvas.width/2-tw/2-10, ry=canvas.height-52, rw=tw+20, rh=26;
    ctx.beginPath(); ctx.roundRect(rx,ry,rw,rh,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle=THEME==='dark'?'#88ccff':'#1a5a8a';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(label, rx+10, ry+13);
    ctx.restore();
    await sleep(300);
  }
  await sleep(700);
  resetColors(); draw();
  animRunning = false;
}

async function animateDelete(key) {
  if(!bst.root) return;
  animRunning = true;
  // first show the search path
  const searchPath = bst.search(key);
  resetColors();
  for(let i=0; i<searchPath.length; i++){
    const info = searchPath[i];
    info.node.color = info.found ? 'red' : 'gold';
    bst.layout(); draw();
    await sleep(380);
  }
  await sleep(300);
  // perform the deletion
  const {successorKey} = bst.deleteKey(key);
  if(successorKey !== null){
    // highlight the successor node briefly
    const succPath = bst.search(successorKey);
    if(succPath.length > 0){
      const last = succPath[succPath.length-1];
      last.node.color = 'cyan';
      bst.layout(); draw();
      await sleep(500);
    }
  }
  resetColors(); bst.layout(); draw();
  animRunning = false;
  document.getElementById('stCmp').textContent = searchPath.length;
}

// ---- single insert with animation ----
async function insertKey(key) {
  if(animRunning) return;
  const path = bst.insert(key);
  bst.layout();
  if(path.length > 0) await animatePath(path, 'green');
  else draw();
  resetColors(); bst.layout(); draw();
}

// ---- initial tree ----
function buildInitial() {
  [50,30,70,20,40,60,80].forEach(k => bst.insert(k));
  bst.layout(); draw();
}

// ---- button handlers ----
document.getElementById('btnRand').addEventListener('click', async () => {
  if(animRunning) return;
  resetColors();
  const keys = Array.from({length:15}, ()=>Math.floor(Math.random()*99)+1);
  for(const k of keys){
    const path = bst.insert(k);
    bst.layout();
    if(path.length>0) await animatePath(path, 'green');
    else draw();
    await sleep(80);
  }
  resetColors(); bst.layout(); draw();
});

document.getElementById('btnSorted').addEventListener('click', async () => {
  if(animRunning) return;
  bst.root = null; resetColors();
  for(let k=1; k<=7; k++){
    bst.insert(k);
    bst.layout(); draw();
    await sleep(350);
  }
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===4));
});

document.getElementById('btnSearch').addEventListener('click', async () => {
  if(animRunning) return;
  const path = bst.search(45);
  lastCmpCount = path.length;
  await animatePath(path);
  document.getElementById('stCmp').textContent = lastCmpCount;
});

document.getElementById('btnDelete').addEventListener('click', async () => {
  if(animRunning) return;
  // Delete key 30 (which has two children in the initial tree: 20 and 40)
  // This demonstrates the two-child deletion with in-order successor
  await animateDelete(30);
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===3));
});

document.getElementById('btnInorder').addEventListener('click', async () => {
  if(animRunning) return;
  await animateInorder();
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===5));
});

document.getElementById('btnClear').addEventListener('click', () => {
  if(animRunning) return;
  bst.root = null; draw();
  document.getElementById('stN').textContent='0';
  document.getElementById('stH').textContent='0';
  document.getElementById('stOpt').textContent='0';
  document.getElementById('stCmp').textContent='0';
});

// ---- steps ----
const STEPS = [
  { b:'BST 不变量', be:'BST Invariant',
    d:'左子树所有键 < 根键 < 右子树所有键，递归成立',
    de:'All left-subtree keys < root < all right-subtree keys, recursively' },
  { b:'查找 O(log n)', be:'Search O(log n)',
    d:'每次比较排除一半子树，平衡树中深度 ≈ log₂n',
    de:'Each comparison eliminates half the tree — depth ≈ log₂n in a balanced tree' },
  { b:'插入', be:'Insert',
    d:'沿查找路径走到空位，新建叶节点',
    de:'Walk to null following the search path, create a leaf' },
  { b:'删除（双子节点）', be:'Delete (two children)',
    d:'找中序后继替换，再删后继',
    de:'Find in-order successor, replace, delete it' },
  { b:'退化', be:'Degeneration',
    d:'有序插入使树退化为链表，O(n) 查找',
    de:'Sorted inserts 1–7 make a linear chain — O(n) search' },
  { b:'中序遍历', be:'In-order Traversal',
    d:'左→根→右 输出有序序列',
    de:'Left→root→right outputs sorted sequence' },
];

function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{
      document.querySelectorAll('#steps li').forEach((x,j)=>x.classList.toggle('on',j===i));
      if(i===5 && !animRunning) animateInorder();
    });
    el.appendChild(li);
  });
}

function applyTheme() {
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  draw();
}
function applyLang() {
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{ el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh; });
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('二叉搜索树','Binary Search Tree');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click',()=>{ THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme(); });
document.getElementById('langBtn').addEventListener('click',()=>{ LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang(); });

window.addEventListener('resize', resize);
applyTheme(); applyLang(); resize(); buildInitial();
</script>
</body></html>
