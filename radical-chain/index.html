<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由基链式反应 · 一个光子引发千次转化</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.g { border-color: rgba(255,224,102,.9); color: #fff3bf; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(224,49,49,.9); color: #e03131; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.o { color: #ffa94d; }
  #stats .v.g { color: #69db7c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.r { color: #ffc9c9; border-color: rgba(255,107,107,.7); }
  .chip.g { color: #fff3bf; border-color: rgba(255,224,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,169,77,.12); color: var(--text); border: 1px solid rgba(255,169,77,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,169,77,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="自由基链式反应：一个光子引发千次转化" data-en="Radical Chains: one photon, thousands of products">自由基链式反应：一个光子引发千次转化</h1>
  <div class="sub" data-zh="紫外光劈开 Cl₂ 生成自由基;它抽氢、递棒、再抽氢——链式放大;两自由基相遇则终止 · 空格播放/暂停" data-en="UV splits Cl₂ into radicals; each abstracts H, passes the baton, abstracts again — chain amplification; two radicals meeting ends it · Space = play/pause">紫外光劈开 Cl₂ 生成自由基;它抽氢、递棒、再抽氢——链式放大;两自由基相遇则终止 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="Cl· 自由基" data-en="Cl· radicals">Cl· 自由基</span><span class="v o" id="stR">0</span>
  <span class="k" data-zh="链循环次数" data-en="chain cycles">链循环次数</span><span class="v" id="stC">0</span>
  <span class="k" data-zh="CH₃Cl 产物" data-en="CH₃Cl formed">CH₃Cl 产物</span><span class="v g" id="stP">0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="Cl·(自由基:单电子高亮)" data-en="Cl· (unpaired electron glows)">Cl·(自由基:单电子高亮)</span>
    <span class="chip.g" data-zh="·CH₃(甲基自由基)" data-en="·CH₃ (methyl radical)">·CH₃(甲基自由基)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnUV" data-zh="打开紫外灯(引发)" data-en="UV lamp on (initiate)">打开紫外灯(引发)</button>
    <button class="abtn" id="btnStop" data-zh="自由基互相撞(终止)" data-en="crash radicals (terminate)">自由基互相撞(终止)</button>
  </div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ozone-depletion/" data-zh="同款机制:臭氧层空洞" data-en="same mechanism: ozone hole">同款机制:臭氧层空洞</a>
    <a href="../polymerization/" data-zh="应用:塑料聚合" data-en="application: polymerization">应用:塑料聚合</a>
    <a href="../electrophilic-addition/" data-zh="对照:亲电进攻" data-en="contrast: electrophilic attack">对照:亲电进攻</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('自由基链式反应', 'Radical Chain Reaction');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 1.8, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  cl: mat(0x63e6be, { roughness: 0.4 }),
  c: mat(0x8a93a3, { metalness: 0.4, roughness: 0.4 }),
  h: mat(0xe9ecef, { roughness: 0.4 }),
  radical: new THREE.MeshBasicMaterial({ color: 0xff6b6b }),
  glow: new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.35, depthWrite: false }),
  uv: new THREE.MeshBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.0, depthWrite: false }),
  bond: mat(0x8a93a3, { metalness: 0.4, roughness: 0.4 }),
};

/* ================= 分子工厂 ================= */
function atom(r, m, glow = false) {
  const a = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), m);
  if (glow) {
    const h = new THREE.Mesh(new THREE.SphereGeometry(r * 1.7, 14, 10), M.glow);
    a.add(h);
  }
  return a;
}
function bond(a, b, r = 0.04) {
  const d = new THREE.Vector3().subVectors(b.position, a.position);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), M.bond);
  m.position.copy(a.position).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  scene.add(m);
  return m;
}

/* 反应池:CH₄ ×4(左),Cl₂ ×4(右),自由移动 */
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 4.4), M.floor);
floor.position.y = -0.1;
scene.add(floor);
/* 紫外灯(顶) */
const uvLamp = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.18, 0.5), M.uv);
uvLamp.position.set(0, 3.3, 0);
scene.add(uvLamp);
const uvBeam = new THREE.Mesh(new THREE.ConeGeometry(1.9, 2.6, 24, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false }));
uvBeam.position.set(0, 2.0, 0);
scene.add(uvBeam);

/* 分子池 */
const species = [];   // {grp, kind:'cl2'|'ch4'|'cl'|'ch3'|'hcl'|'ch3cl', v:Vector3}
function mkCl2(x, y, z) {
  const g = new THREE.Group();
  const a = atom(0.18, M.cl);
  a.position.set(-0.13, 0, 0);
  const b = atom(0.18, M.cl);
  b.position.set(0.13, 0, 0);
  g.add(a); g.add(b);
  bond(a, b, 0.045);
  g.position.set(x, y, z);
  scene.add(g);
  species.push({ grp: g, kind: 'cl2', v: new THREE.Vector3(rand(-0.15, 0.15), rand(-0.05, 0.15), rand(-0.1, 0.1)) });
}
function mkCH4(x, y, z) {
  const g = new THREE.Group();
  const c = atom(0.2, M.c);
  g.add(c);
  const dirs = [[0.3, 0.2, 0.15], [-0.3, 0.15, -0.2], [0.1, -0.32, -0.1], [-0.1, -0.2, 0.3]];
  for (const d of dirs) {
    const h = atom(0.11, M.h);
    h.position.set(d[0], d[1], d[2]);
    g.add(h);
    bond(c, h, 0.032);
  }
  g.position.set(x, y, z);
  scene.add(g);
  species.push({ grp: g, kind: 'ch4', v: new THREE.Vector3(rand(-0.12, 0.12), rand(-0.04, 0.12), rand(-0.1, 0.1)) });
}
function mkCl(x, y, z) {
  const g = new THREE.Group();
  g.add(atom(0.16, M.cl, true));      // 自由基发光
  g.position.set(x, y, z);
  scene.add(g);
  species.push({ grp: g, kind: 'cl', v: new THREE.Vector3(rand(-0.5, 0.5), rand(-0.2, 0.35), rand(-0.3, 0.3)) });
}
function mkCH3(x, y, z) {
  const g = new THREE.Group();
  g.add(atom(0.18, M.c, true));
  for (const d of [[0.24, 0.18, 0.1], [-0.24, 0.12, -0.16], [0.06, -0.26, -0.12]]) {
    const h = atom(0.1, M.h);
    h.position.set(d[0], d[1], d[2]);
    g.add(h);
  }
  g.position.set(x, y, z);
  scene.add(g);
  species.push({ grp: g, kind: 'ch3', v: new THREE.Vector3(rand(-0.4, 0.4), rand(-0.15, 0.3), rand(-0.3, 0.3)) });
}
for (let i = 0; i < 4; i++) mkCH4(rand(-2.8, -0.6), rand(0.8, 2.0), rand(-0.8, 0.8));
for (let i = 0; i < 4; i++) mkCl2(rand(0.8, 2.8), rand(0.8, 2.0), rand(-0.8, 0.8));

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let uvOn = false;
let cycles = 0;
let products = 0;
let tSim = 0;
let uvFeedT = 1.2;
function count(kind) { let k = 0; for (const s of species) k += s.kind === kind; return k; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblUV = addLabel(() => L('紫外灯:hν 光子劈开 Cl–Cl', 'UV lamp: hν splits Cl–Cl'), new THREE.Vector3(0, 3.75, 0), 'g');
const lblStatus = addLabel(() => {
  if (!uvOn && count('cl') === 0) return L('待机:打开紫外灯引发反应', 'idle: switch on the UV lamp to initiate');
  if (count('ch3') > 0 || count('cl') > 0) return L('链式增长中:自由基递棒,循环放大', 'propagating: radicals pass the baton, the chain amplifies');
  return L('已终止:自由基耗尽,反应结束', 'terminated: radicals exhausted');
}, new THREE.Vector3(0.4, -0.5, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '引发:光劈开 Cl₂', be: 'Initiation: light splits Cl₂',
    d: '紫外光子把 Cl–Cl 的共用电子对一劈为二——生成两个氯自由基(带单电子,红色高亮)。这是全链唯一要花「门票」的一步。',
    de: 'UV photons homolyze Cl–Cl into two chlorine radicals (unpaired electron glows red) — the only step that costs a ticket.',
    act: () => { uvOn = true; document.getElementById('btnUV').classList.add('on'); } },
  { b: '增长 I:抽氢', be: 'Propagation I: abstract H',
    d: 'Cl· 撞上 CH₄,抢走一个 H 生成 HCl,自己变成 ·CH₃——一个自由基换另一个自由基,棒交出去了。',
    de: 'Cl· hits CH₄, grabs an H into HCl, and becomes ·CH₃ — one radical trades for another. The baton passes.',
    act: () => { uvOn = true; document.getElementById('btnUV').classList.add('on'); } },
  { b: '增长 II:递棒回 Cl', be: 'Propagation II: baton returns',
    d: '·CH₃ 从 Cl₂ 上抢一个 Cl,生成 CH₃Cl,同时放出新的 Cl·——循环回到开头。一进一出,链无限继续。',
    de: '·CH₃ grabs Cl from Cl₂, forming CH₃Cl and a fresh Cl· — the loop restarts. The chain never has to end.',
    act: () => { uvOn = true; document.getElementById('btnUV').classList.add('on'); } },
  { b: '终止:自由基互撞', be: 'Termination: radicals collide',
    d: '两个自由基相遇,单电子配对——链条戛然而止。按「终止」按钮看自由基对撞湮灭。',
    de: 'Two radicals meet, unpaired electrons pair — the chain stops dead. Press terminate and watch collisions.',
    act: () => { document.getElementById('btnStop').click(); } },
  { b: '一传千:链式放大的账', be: 'One photon, a thousand products',
    d: '引发一次,增长循环可以转上千圈:一个光子的能量撬动上千次转化。臭氧层空洞是同款机制的灾难版。',
    de: 'One initiation, up to a thousand cycles: a single photon leverages a thousand conversions. The ozone hole is this mechanism gone rogue.',
    act: () => { uvOn = true; document.getElementById('btnUV').classList.add('on'); } },
];
function stepIndex() {
  if (count('cl') === 0 && count('ch3') === 0 && cycles > 0) return 3;
  if (cycles > 2) return 4;
  if (count('ch3') > 0) return 2;
  if (count('cl') > 0) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnUV = document.getElementById('btnUV');
const btnStop = document.getElementById('btnStop');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stR = document.getElementById('stR'), stC = document.getElementById('stC'),
  stP = document.getElementById('stP');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnUV.addEventListener('click', () => {
  uvOn = !uvOn;
  btnUV.classList.toggle('on', uvOn);
  if (uvOn) {
    /* 引发:只劈开 2 个 Cl₂,链传递要留 Cl₂ 抢 */
    let split = 0;
    for (const s of species) {
      if (s.kind === 'cl2' && split < 2) {
        s.kind = 'dead';
        scene.remove(s.grp);
        mkCl(s.grp.position.x - 0.1, s.grp.position.y, s.grp.position.z);
        mkCl(s.grp.position.x + 0.1, s.grp.position.y, s.grp.position.z);
        split++;
      }
    }
  }
});
btnStop.addEventListener('click', () => {
  /* 自由基两两湮灭 */
  let removed = 0;
  for (const s of species) {
    if ((s.kind === 'cl' || s.kind === 'ch3') && removed < 2) {
      s.kind = 'dead';
      scene.remove(s.grp);
      removed++;
    }
  }
  uvOn = false;
  btnUV.classList.remove('on');
});
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function swapKind(s, kind) {
  s.kind = 'dead';
  scene.remove(s.grp);
  if (kind === 'cl') mkCl(s.grp.position.x, s.grp.position.y, s.grp.position.z);
  else if (kind === 'ch3') mkCH3(s.grp.position.x, s.grp.position.y, s.grp.position.z);
  else if (kind === 'hcl') { /* 简化:直接消失并计入产物 */ products++; }
  else if (kind === 'ch3cl') { products++; }
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  M.uv.opacity = uvOn ? 0.28 + 0.1 * Math.sin(tSim * 9) : 0.0;

  if (playing) {
    /* 灯开着:低频继续光解 Cl₂(每 ~1.2 s 一个)+ 补充 CH₄,维持链式循环 */
    if (uvOn) {
      uvFeedT -= dts;
      if (uvFeedT <= 0) {
        uvFeedT = 0.9;
        /* Cl₂ 至少留一个当链传递原料;够 2 个才光解,少了就补货 */
        if (count('cl2') >= 2) {
          const cl2 = species.find(s => s.kind === 'cl2');
          if (cl2) {
            cl2.kind = 'dead';
            scene.remove(cl2.grp);
            mkCl(cl2.grp.position.x - 0.1, cl2.grp.position.y, cl2.grp.position.z);
            mkCl(cl2.grp.position.x + 0.1, cl2.grp.position.y, cl2.grp.position.z);
          }
        } else if (count('cl2') < 4) {
          mkCl2(rand(0.8, 2.8), rand(0.8, 2.0), rand(-0.8, 0.8));
        }
        const nCh4 = count('ch4');
        if (nCh4 < 5) mkCH4(rand(-2.8, -0.6), rand(0.8, 2.0), rand(-0.8, 0.8));
      }
    }
    /* Cl· 与 ·CH₃ 朝各自反应对象引导,保证链传递在几秒内可见 */
    const ch4s = species.filter(s => s.kind === 'ch4');
    const cl2s = species.filter(s => s.kind === 'cl2');
    for (const s of species) {
      if (s.kind === 'cl' && ch4s.length) {
        let best = ch4s[0], bd = 1e9;
        for (const m of ch4s) { const d = m.grp.position.distanceTo(s.grp.position); if (d < bd) { bd = d; best = m; } }
        s.v.lerp(new THREE.Vector3().subVectors(best.grp.position, s.grp.position).normalize().multiplyScalar(0.55), 0.06);
      } else if (s.kind === 'ch3' && cl2s.length) {
        let best = cl2s[0], bd = 1e9;
        for (const m of cl2s) { const d = m.grp.position.distanceTo(s.grp.position); if (d < bd) { bd = d; best = m; } }
        s.v.lerp(new THREE.Vector3().subVectors(best.grp.position, s.grp.position).normalize().multiplyScalar(0.85), 0.1);
      }
    }
    for (const s of species) {
      if (s.kind === 'dead') continue;
      s.grp.position.addScaledVector(s.v, dts);
      /* 池壁反弹 */
      const p = s.grp.position;
      if (p.x < -3.2) { p.x = -3.2; s.v.x = Math.abs(s.v.x); }
      if (p.x > 3.2) { p.x = 3.2; s.v.x = -Math.abs(s.v.x); }
      if (p.y < 0.4) { p.y = 0.4; s.v.y = Math.abs(s.v.y); }
      if (p.y > 2.9) { p.y = 2.9; s.v.y = -Math.abs(s.v.y); }
      if (p.z < -1.2) { p.z = -1.2; s.v.z = Math.abs(s.v.z); }
      if (p.z > 1.2) { p.z = 1.2; s.v.z = -Math.abs(s.v.z); }
    }
    /* 链式反应判定:自由基相遇 */
    const cls = species.filter(s => s.kind === 'cl');
    const ch3s = species.filter(s => s.kind === 'ch3');
    for (const c of cls) {
      for (const m of species) {
        if (m.kind !== 'ch4') continue;
        if (c.grp.position.distanceTo(m.grp.position) < 0.45) {
          c.kind = 'dead'; m.kind = 'dead';
          scene.remove(c.grp); scene.remove(m.grp);
          mkHCl(c.grp.position.x, c.grp.position.y);
          mkCH3(m.grp.position.x, m.grp.position.y, m.grp.position.z);
          break;
        }
      }
    }
    for (const m of species) {
      if (m.kind !== 'ch3') continue;
      for (const c of species) {
        if (c.kind !== 'cl2') continue;
        if (m.grp.position.distanceTo(c.grp.position) < 0.5) {
          m.kind = 'dead'; c.kind = 'dead';
          scene.remove(m.grp); scene.remove(c.grp);
          mkCH3Cl(m.grp.position.x, m.grp.position.y, m.grp.position.z);
          mkCl(c.grp.position.x + 0.2, c.grp.position.y, c.grp.position.z);
          cycles++;
          products++;
          break;
        }
      }
    }
  }

  stR.textContent = count('cl');
  stC.textContent = cycles;
  stP.textContent = products;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function mkHCl(x, y) {
  const g = new THREE.Group();
  const h = atom(0.1, M.h);
  h.position.set(-0.1, 0, 0);
  const cl = atom(0.17, M.cl);
  cl.position.set(0.12, 0, 0);
  g.add(h); g.add(cl);
  bond(h, cl, 0.035);
  g.position.set(x, clamp(y, 0.5, 2.8), 0);
  scene.add(g);
  species.push({ grp: g, kind: 'hcl', v: new THREE.Vector3(rand(-0.1, 0.1), rand(-0.02, 0.08), rand(-0.08, 0.08)) });
}
function mkCH3Cl(x, y, z) {
  const g = new THREE.Group();
  const c = atom(0.2, M.c);
  g.add(c);
  const cl = atom(0.17, M.cl);
  cl.position.set(0.32, 0.05, 0);
  g.add(cl);
  for (const d of [[-0.12, 0.24, 0.1], [-0.22, -0.18, -0.1], [0.1, -0.14, 0.24]]) {
    const h = atom(0.1, M.h);
    h.position.set(d[0], d[1], d[2]);
    g.add(h);
  }
  g.position.set(x, clamp(y, 0.5, 2.8), z);
  scene.add(g);
  species.push({ grp: g, kind: 'ch3cl', v: new THREE.Vector3(rand(-0.08, 0.08), rand(-0.02, 0.06), rand(-0.06, 0.06)) });
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
