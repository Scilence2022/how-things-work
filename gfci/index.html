<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>接地与漏电保护 · 30mA 差额,25 毫秒跳闸</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#fcc419;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e67700;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(252,196,25,.6);background:rgba(252,196,25,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(230,119,0,.55);background:rgba(230,119,0,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(252,196,25,.10);border-color:rgba(252,196,25,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(230,119,0,.08);border-color:rgba(230,119,0,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe9a8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="接地与漏电保护" data-en="Grounding & the GFCI">接地与漏电保护</h1>
  <div class="sub" data-zh="正常回路火线电流必须等于零线电流;一旦有人成了「另一条路」,差动线圈立刻察觉 30mA 的差额,25 毫秒内跳闸——地线则是提前铺好的逃生道,让保护器在你之前先动 · 拖动旋转 / 空格运行/暂停" data-en="In a healthy loop the live current must equal the neutral current; the moment you become \"another way home\", the differential coil smells the 30 mA mismatch and trips within 25 milliseconds — and the ground wire is the escape lane pre-built so the protector acts before you do · drag to orbit / Space = run/pause">正常回路火线电流必须等于零线电流;一旦有人成了「另一条路」,差动线圈立刻察觉 30mA 的差额,25 毫秒内跳闸——地线则是提前铺好的逃生道,让保护器在你之前先动 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

  <span class="k" data-zh="火线电流" data-en="Live current">火线电流</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="零线电流" data-en="Neutral current">零线电流</span><span class="v" id="stN">—</span>

</div>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bNormal" data-zh="正常回路" data-en="Normal">正常回路</button>
    <button class="abtn" id="bTouch" data-zh="触摸火线!" data-en="Touch live!">触摸火线!</button>
    <button class="abtn" id="bGround" data-zh="地线先行" data-en="Ground wins">地线先行</button>
  </div>
  <div class="row">
    <label data-zh="人体电阻" data-en="Body resistance">人体电阻</label>
    <input id="sR" type="range" min="500" max="5000" step="100" value="1500">
    <span class="val" id="sRVal">1500 Ω</span>
  </div>
  <div class="row">
    <label data-zh="GFCI 开关" data-en="GFCI fitted">GFCI 开关</label>
    <input id="sG" type="range" min="0" max="1" step="1" value="1">

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglE" type="checkbox" checked> <span data-zh="电子流动画" data-en="Electrons">电子流动画</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../circuit-breaker/" data-zh="断路器" data-en="Circuit Breaker">断路器</a>
    <a href="../relay/" data-zh="电磁继电器" data-en="Electromagnetic Relay">电磁继电器</a>
    <a href="../transformer/" data-zh="变压器与高压输电" data-en="Transformer & The Grid">变压器与高压输电</a>
    <a href="../lightning/" data-zh="闪电" data-en="Lightning">闪电</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-2,3.4,9);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.2;scene.add(ground);
/* 大地(下半) */
const earthM=new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:1});
const earth=new THREE.Mesh(new THREE.BoxGeometry(14,1.4,7),earthM);
earth.position.y=-1.95;scene.add(earth);

/* 配电箱(GFCI) */
const panelM=new THREE.MeshStandardMaterial({color:0x495057,roughness:0.5,metalness:0.4});
const box=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.9,0.5),panelM);
box.position.set(-3.2,2.0,0);scene.add(box);
/* 差动线圈(环形铁芯) */
const coreM=new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.6});
const core=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.09,10,28),coreM);
core.position.set(-3.2,2.0,0.3);scene.add(core);
/* 跳闸开关 */
const switchM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.4});
const sw=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.4,0.1),switchM);
sw.position.set(-3.2,1.25,0.28);scene.add(sw);
/* 断开指示 */
const tripM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0});
const tripL=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),tripM);
tripL.position.set(-2.6,2.6,0.3);scene.add(tripL);

/* 负载(电器) */
const loadM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.3});
const appliance=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.0,1.0),loadM);
appliance.position.set(2.6,1.7,0);scene.add(appliance);
/* 人(简化小人) */
const personM=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.6});
const person=new THREE.Group();person.position.set(1.2,0.1,1.4);scene.add(person);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.22,14,10),personM);
head.position.y=1.5;person.add(head);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.18,0.7,4,10),personM);
torso.position.y=0.9;person.add(torso);
/* 火线/零线/地线(管道) */
const liveM=new THREE.MeshStandardMaterial({color:0xc92a2a,roughness:0.4});
const neutralM=new THREE.MeshStandardMaterial({color:0x1864ab,roughness:0.4});
const ground2M=new THREE.MeshStandardMaterial({color:0x2b8a3e,roughness:0.4});
function wire(mat,pts,r){
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,r,8),mat);
}
const live=wire(liveM,[new THREE.Vector3(-3.2,2.35,0.25),new THREE.Vector3(0,2.35,0.6),new THREE.Vector3(2.6,2.2,0.4)],0.045);
scene.add(live);
const neutral=wire(neutralM,[new THREE.Vector3(-3.2,1.7,0.25),new THREE.Vector3(0,1.7,0.6),new THREE.Vector3(2.6,1.6,0.4)],0.045);
scene.add(neutral);
const groundWire=wire(ground2M,[new THREE.Vector3(-3.2,1.1,0.25),new THREE.Vector3(-1.5,0.3,0.9),new THREE.Vector3(-0.5,-1.2,0.8)],0.04);
scene.add(groundWire);
/* 漏电路径(人→地) */
const leakM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0});
const leak=wire(leakM,[new THREE.Vector3(2.6,2.0,0.4),new THREE.Vector3(1.6,1.7,0.9),new THREE.Vector3(1.2,1.0,1.4),new THREE.Vector3(1.0,-1.4,1.2)],0.03);
scene.add(leak);
/* 电子粒子(回路) */
const NE=36;
const eM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.9});
const electrons=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,6),eM,NE);
electrons.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(electrons);
const loopCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3.2,2.35,0.25),new THREE.Vector3(0,2.35,0.6),new THREE.Vector3(2.6,2.2,0.4),
  new THREE.Vector3(2.6,1.6,0.4),new THREE.Vector3(0,1.7,0.6),new THREE.Vector3(-3.2,1.7,0.25)],true);
const eD=[];for(let i=0;i<NE;i++)eD.push({t:i/NE,path:0});
const leakCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(2.6,2.0,0.4),new THREE.Vector3(1.6,1.7,0.9),new THREE.Vector3(1.2,1.0,1.4),
  new THREE.Vector3(1.0,-1.4,1.2),new THREE.Vector3(-1.0,-1.6,0.6)],false);
const m4=new THREE.Matrix4();

/* 状态 */
let bodyR=1500,gfciOn=true,scene2='normal',playing=true,labelsOn=true,slowMo=false,eOn=true;
let iLive=0,iNeutral=0,mismatch=0,tripped=false,tripT=0,touchT=99,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function leakCurrent(){/* mA */
  if(scene2==='touch')return 230000/bodyR;
  if(scene2==='ground')return 230000/800;
  return 0;}
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('差动线圈:火线与零线一起穿过,磁通平时抵消',
    'The differential coil: live and neutral thread it — flux cancels at rest'),
  new THREE.Vector3(-3.2,3.6,0),'y');
addLabel(()=>L('有人成了「另一条路」:差值一出现就被嗅到',
    'Someone becomes "another way home": the mismatch is smelled at once'),
  new THREE.Vector3(1.2,2.9,1.4),'r',()=>scene2==='touch');
addLabel(()=>L('地线=预铺的逃生道:保护器先于你动手',
    'The ground wire: a pre-built escape lane — the protector moves first'),
  new THREE.Vector3(-1.5,0.6,0.9),'g',()=>scene2==='ground');
addLabel(()=>L('25 毫秒:心跳一次都没走完','25 milliseconds: not even one heartbeat'),
  new THREE.Vector3(-2.4,0.6,0),'o',()=>tripped);
addLabel(()=>L('没有 GFCI:漏电持续,危险直到断开',
    'No GFCI: the leak persists until someone unplugs it',
  ),new THREE.Vector3(3.6,3.0,0),'r',()=>!gfciOn&&scene2!=='normal');

function setBody(v){bodyR=clamp(v,500,5000);
  document.getElementById('sR').value=bodyR;
  document.getElementById('sRVal').textContent=bodyR.toFixed(0)+' Ω';updateStats();}
function setScene(s){
  scene2=s;
  if(s==='normal'){tripped=false;tripT=0;}
  if(s==='touch'&&gfciOn){tripped=false;tripT=0;}
  if(s==='ground'&&gfciOn){tripped=false;tripT=0;}
  document.getElementById('bNormal').classList.toggle('on',s==='normal');
  document.getElementById('bTouch').classList.toggle('on',s==='touch');
  document.getElementById('bGround').classList.toggle('on',s==='ground');
  person.visible=s!=='normal';}

const STEPS=[
 {zh:'正常回路:火=零,磁通抵消',en:'Normal loop: live = neutral, flux cancels',
  act(){setScene('normal');setBody(1500);gfciOn=true;}},
 {zh:'触摸火线:电流多出一条人肉支路',en:'Touch the live wire: a body branches the current',
  act(){setScene('touch');setBody(1500);gfciOn=true;}},
 {zh:'差动线圈察觉:30mA 就报警',en:'The coil notices: 30 mA is already an alarm',
  act(){setScene('touch');setBody(4000);}},
 {zh:'25ms 跳闸:心脏还没反应过来',en:'Trip in 25 ms: the heart never notices',
  act(){setScene('touch');gfciOn=true;}},
 {zh:'地线先行:漏流走铜线不走人',en:'Ground first: the leak takes copper, not flesh',
  act(){setScene('ground');gfciOn=true;}},
 {zh:'无 GFCI 对照:差值再大也无人理会',en:'No GFCI: a huge mismatch and nobody cares',
  act(){setScene('touch');gfciOn=false;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const imax=10;
  iLive=scene2==='normal'?imax:(imax+(leakCurrent()/1000)*(gfciOn&&!tripped?1:1));
  iNeutral=scene2==='normal'?imax:(imax-(leakCurrent()/1000));
  mismatch=Math.abs(iLive-iNeutral)*1000;
  document.getElementById('stL').innerHTML=iLive.toFixed(2)+'<small> A</small>';
  document.getElementById('stN').innerHTML=iNeutral.toFixed(2)+'<small> A</small>';
  const dv=document.getElementById('stD');
  dv.innerHTML=mismatch.toFixed(0)+'<small> mA</small>';
  dv.className='v '+(mismatch>30?'warn':'ok');
  const sv=document.getElementById('stS');
  if(tripped){sv.textContent=L('已跳闸','TRIPPED');sv.className='v ok';}
  else if(mismatch>30){sv.textContent=L('危险!','DANGER!');sv.className='v warn';}
  else{sv.textContent=L('值守中','armed');sv.className='v ok';}
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bNormal').addEventListener('click',()=>setScene('normal'));
document.getElementById('bTouch').addEventListener('click',()=>setScene('touch'));
document.getElementById('bGround').addEventListener('click',()=>setScene('ground'));
document.getElementById('sR').addEventListener('input',e=>setBody(+e.target.value));
document.getElementById('sG').addEventListener('input',e=>{gfciOn=+e.target.value===1;
  document.getElementById('sGVal').textContent=gfciOn?L('已装','fitted'):L('未装','none');});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglE').addEventListener('change',e=>{eOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const lk=leakCurrent();
  /* 跳闸逻辑 */
  if(gfciOn&&lk>30&&!tripped&&scene2!=='normal'){
    tripT+=dts*1000;
    if(tripT>=25){tripped=true;tripT=25;}
  }else if(scene2==='normal'){tripT=0;}
  sw.position.y=tripped?1.35:1.25;
  tripM.opacity=tripped?0.6+0.3*Math.sin(simT*8):0;
  /* 泄漏路径可见性 */
  leakM.opacity=(scene2!=='normal'&&!tripped)?0.75:0;
  leak.visible=scene2!=='normal';
  person.visible=scene2!=='normal';
  /* 电子流动:正常走主回路;跳闸后主回路断流;泄漏走人 */
  for(let i=0;i<NE;i++){
    const e=eD[i];
    let pos;
    if(!tripped&&lk>0&&i<NE*0.35){
      /* 走泄漏支路 */
      e.t+=dts*1.4;
      if(e.t>1)e.t-=1;
      pos=leakCurve.getPointAt(clamp(e.t,0,1));
    }else{
      e.t+=dts*(tripped?0:1.2);
      if(e.t>1)e.t-=1;
      pos=loopCurve.getPointAt(e.t);
    }
    const s=eOn?(tripped&&i>=NE*0.35?0.001:1):1;
    m4.makeScale(s,s,s);
    m4.setPosition(pos);
    electrons.setMatrixAt(i,m4);
  }
  electrons.instanceMatrix.needsUpdate=true;
  electrons.visible=eOn;
  /* 差动线圈:泄漏时磁通失衡,微微发亮 */
  coreM.emissive=new THREE.Color(0xffd43b);
  coreM.emissiveIntensity=(scene2!=='normal'&&!tripped)?0.3+0.2*Math.sin(simT*10):0.05;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.1){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
person.visible=false;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
