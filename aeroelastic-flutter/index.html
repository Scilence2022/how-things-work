<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #cvRoot{width:100%;height:132px;margin:6px 0 2px;border:1px solid var(--tool-border);border-radius:8px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2);

/* ============ 典型段两自由度颤振模型（真实量纲，数值调参验证） =
   [m mh; mh I][ḧ;θ̈] + 阻尼/刚度 = [L;M]
   L = q·S·CLα·αf ， αf 是有效迎角 θ − ḣ/U − 0.8b·θ̇/U 的一阶滞后
   （τ=klag·b/U，模拟 Theodorsen 相位滞后——颤振的根源）
   M = L·e − q·S·b²·0.6·(b/U)·θ̇ （e=四分之一弦到弹性轴力臂 0.15 m）
   标定：默认 U_f≈35 m/s；kθ×1.5→U_f≈45+，×0.6→≈25（∝√kθ）；
   配重前移 mh 11.25→4 → U_f≈50。桥模式：沉浮锁定，
   气动俯仰阻尼反号（单自由度扭转颤振），U_f≈17 m/s ≈ 塔科马 1940 */
const RHO=1.225,B=0.75,SPAN=6,S=9,CLA=5.5;
let kS=1,cgFwd=false,bridge=false;
const I0=60*0.30;
function params(){
  const kth=I0*(2*Math.PI*4)**2*kS;
  if(bridge)return {m:60,mh:0,I:I0,kh:0,kth2:I0*(2*Math.PI*4)**2*kS,
    ch:0,cth:38.3,klag:6,arm:0,cd:0,kd:0.97};  // 桥：沉浮锁定，负气动阻尼
  return {m:60,mh:cgFwd?4:11.25,I:I0,kh:60*(2*Math.PI*2)**2,kth:kth,
    ch:20,cth:0.5,klag:6,arm:0.15,cd:1.2,kd:0};
}
/* 状态 */
let h=0.005,hd=0,th=0,thd=0,af=0;
let broken=false,slowMo=0,simT=0,U=30;
let phH=[],phT=[];      // 相位测量：上穿时刻
let phaseDeg=0,phaseOk=false;

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10161c,20,52);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
camera.position.set(3.2,1.8,8.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
scene.add(new THREE.HemisphereLight(0xcfe0f2,0x14181e,0.9));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(4,6,7);scene.add(key);

/* ============ 风洞与支座 ============ */
const tunnel=new THREE.Group();scene.add(tunnel);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,8),new THREE.MeshStandardMaterial({color:0x161e26,roughness:0.95}));
floor.rotation.x=-Math.PI/2;floor.position.set(1,-1.7,0);tunnel.add(floor);
const pylM=new THREE.MeshStandardMaterial({color:0x55606c,roughness:0.5,metalness:0.5});
const pylon=new THREE.Mesh(new THREE.BoxGeometry(0.5,2.6,0.5),pylM);
pylon.position.set(0,-0.4,-3);tunnel.add(pylon);

/* ============ 翼面（4 段，弯曲振型 ζ²）与桥面 ============ */
const C=1.5;
function ytHalf(xi){return 0.9*(0.2969*Math.sqrt(xi)-0.1260*xi-0.3516*xi*xi+0.2843*xi**3-0.1015*xi**4);}
const surfY=xx=>{const xi=clamp(xx/C,0,1);return ytHalf(xi);};
const segs=[],SEG=4;
const wingM=new THREE.MeshStandardMaterial({color:0xb8c4ce,roughness:0.35,metalness:0.55});
const accM=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.4});
(function buildWing(){
  const N=24,pts=[];
  for(let i=N;i>=0;i--){const xi=Math.cos(i/N*Math.PI/2)*C;pts.push(new THREE.Vector2(xi,surfY(xi)));}
  for(let i=1;i<=N;i++){const xi=(1-Math.cos(i/N*Math.PI/2))*C;pts.push(new THREE.Vector2(xi,-surfY(xi)));}
  const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y));
  sh.closePath();
  for(let k=0;k<SEG;k++){
    const g=new THREE.Group();
    const geo=new THREE.ExtrudeGeometry(sh,{depth:SPAN/SEG,bevelEnabled:false});
    geo.translate(-0.5,0,-SPAN/SEG/2);            // 绕弹性轴(0.5/1.5弦)扭转
    g.add(new THREE.Mesh(geo,wingM));
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,SPAN/SEG*0.96,8),accM);
    tube.rotation.x=Math.PI/2;g.add(tube);
    g.position.z=-SPAN/2+SPAN/SEG*(k+0.5);
    scene.add(g);segs.push(g);
  }
})();
/* 桥面（塔科马模式） */
const deck=new THREE.Group();deck.visible=false;scene.add(deck);
const deckM=new THREE.MeshStandardMaterial({color:0x8a939e,roughness:0.6,metalness:0.4});
const deckBody=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.1,SPAN),deckM);
deck.add(deckBody);
for(const s of[-0.34,0.34]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,SPAN),deckM);
  rail.position.set(0,0.12,0);rail.position.x=s;deck.add(rail);
}
/* 断裂碎片 */
const debris=[];
for(let i=0;i<2;i++){
  const d=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.1,SPAN/2),bridge?deckM:wingM);
  d.add(m);d.visible=false;scene.add(d);debris.push({g:d,v:new THREE.Vector3(),w:new THREE.Vector3()});
}

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
addLabel(()=>L('弹性轴 · 扭转 θ','Elastic axis · torsion θ'),new THREE.Vector3(0,1.7,-2.6),'b');
addLabel(()=>L('弯曲 h（翼尖最大）','Bending h (max at tip)'),new THREE.Vector3(0,2.6,2.2),'g');
addLabel(()=>L('结构撕裂！','STRUCTURAL FAILURE!'),new THREE.Vector3(0,2.6,0),'r',()=>broken);
addLabel(()=>L('慢放回看','slow-motion replay'),new THREE.Vector3(0,-0.6,3),'o',()=>slowMo>0);

/* ============ 步骤 ============ */
const STEPS=[
 {zh:'两个振型：弯曲(扑)与扭转(拧)各有固有频率，扭转通常更快',en:'Two modes: bending and torsion, each with its own natural frequency'},
 {zh:'气动力慢半拍：升力对迎角的响应带滞后 τ≈b/U（Theodorsen）',en:'Aero forces lag: lift responds to AoA with delay τ≈b/U (Theodorsen)'},
 {zh:'相位差→90°：弯扭耦合使每个循环从气流净抽能量',en:'Phase → 90°: the coupling extracts net energy from the flow each cycle'},
 {zh:'越过临界风速 U_f：特征值实部由负转正，振幅 e^{σt} 指数增长',en:'Past U_f the eigenvalue crosses zero: amplitude grows like e^{σt}'},
 {zh:'结构崩溃：扭角瞬间放大，翼面撕裂（慢放回看）',en:'Failure: torsion explodes and the structure tears apart (slow-mo)'},
 {zh:'对策：提高扭转刚度 / 配重前移 / 风洞扫频——把 U_f 推到包线外',en:'Fixes: stiffer torsion, CG forward, wind-tunnel sweep — raise U_f'},
 {zh:'塔科马桥 1940：单自由度扭转颤振，18 m/s 就够（不是涡街共振）',en:'Tacoma 1940: single-DOF torsional flutter at 18 m/s — not vortex resonance'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i===0){setBridge(false);U=12;resetStruct();}
  if(i===1||i===2){setBridge(false);U=34;resetStruct();}
  if(i===3){setBridge(false);U=UfEst()+4;resetStruct();}
  if(i===4){setBridge(false);U=UfEst()+10;resetStruct();}
  if(i===5){setBridge(false);U=45;resetStruct();}
  if(i===6){setBridge(true);U=21;}
  syncSliders();
}
function syncSliders(){
  el('sU').value=U;el('sUVal').textContent=U.toFixed(0)+' m/s';
  el('sK').value=Math.round(kS*100);el('sKVal').textContent=Math.round(kS*100)+' %';
}

/* ============ 交互 ============ */
el('btnCG').addEventListener('click',()=>{cgFwd=!cgFwd;el('btnCG').classList.toggle('on',cgFwd);computeRoot();resetStruct();});
el('btnBrg').addEventListener('click',()=>{setBridge(!bridge);});
el('btnRst').addEventListener('click',()=>resetStruct());
el('sU').addEventListener('input',e=>{U=+e.target.value;el('sUVal').textContent=U.toFixed(0)+' m/s';});
el('sK').addEventListener('input',e=>{kS=+e.target.value/100;el('sKVal').textContent=e.target.value+' %';computeRoot();});
el('sSpd').addEventListener('input',e=>{timeScale=+e.target.value/100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';});
el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function setBridge(b){
  bridge=b;
  el('btnBrg').classList.toggle('on',b);
  deck.visible=b;segs.forEach(s=>s.visible=!b);
  computeRoot();resetStruct();
}

/* ============ 积分器（真实单位） ============ */
function deriv(st,P,Uv){
  const q=0.5*RHO*Uv*Uv;
  const [h0,hd0,th0,thd0,af0]=st;
  const aInst=th0-hd0/Uv-0.8*B*thd0/Uv;
  const daf=(aInst-af0)/(P.klag*B/Uv);
  const Lf=q*S*CLA*af0;
  let M=Lf*P.arm-q*S*B*B*P.cd*0.5*B/Uv*thd0;
  if(P.kd)M+=P.kd*q*S*B*B*B/Uv*thd0;      // 桥：反号→负气动阻尼
  const F1=Lf-P.ch*hd0-P.kh*h0;
  const F2=M-P.cth*thd0-(P.kd?P.kth2:P.kth)*th0;
  const det=P.m*P.I-P.mh*P.mh;
  const hdd=( P.I*F1-P.mh*F2)/det;
  const thdd=(-P.mh*F1+P.m*F2)/det;
  return [hd0,hdd,thd0,thdd,daf];
}
function stepODE(dt){
  const P=params();
  const n=Math.max(1,Math.ceil(dt/0.0012));
  const dts=dt/n;
  for(let k=0;k<n;k++){
    const d=deriv([h,hd,th,thd,af],P,U);
    hd+=d[1]*dts;thd+=d[3]*dts;af+=d[4]*dts;
    h+=hd*dts;th+=thd*dts;                   // 半隐式欧拉（位置用新速度）
    if(P.kd){h=0;hd=0;}                      // 桥模式：沉浮锁定，纯扭转
    // 大气紊流小激励（亚临界时维持微振，超临界时被指数放大）
    hd+=(Math.random()-0.5)*0.02*dts*40;
    thd+=(Math.random()-0.5)*0.02*dts*40;
  }
}
/* 增长率 σ(U)：短仿真测包络（窗口要长，避开初始瞬态污染） */
function simSigma(Uv,P,T=14){
  let hh=0.01,hdd=0,tt=0,tdd=0,aff=0;
  let a1=0,a2=0;
  const n=Math.round(T/0.002);
  for(let i=0;i<n;i++){
    const t=i*0.002;
    const d=deriv([hh,hdd,tt,tdd,aff],P,Uv);
    hdd+=d[1]*0.002;tdd+=d[3]*0.002;aff+=d[4]*0.002;
    hh+=hdd*0.002;tt+=tdd*0.002;             // 半隐式欧拉
    if(!isFinite(hh)||Math.abs(hh)>50)return 3;
    if(t>=6&&t<10)a1=Math.max(a1,Math.abs(hh));
    if(t>=10)a2=Math.max(a2,Math.abs(hh));
  }
  return Math.log((a2+1e-12)/(a1+1e-12))/4;
}
let rootCurve=[],UfNow=38;
function computeRoot(){
  const P=params();
  rootCurve=[];
  for(let Uv=4;Uv<=64;Uv+=2)rootCurve.push([Uv,simSigma(Uv,P)]);
  // 找 U_f（σ 由负转正）
  UfNow=NaN;
  for(let i=1;i<rootCurve.length;i++){
    const [u0,s0]=rootCurve[i-1],[u1,s1]=rootCurve[i];
    if(s0<=0&&s1>0){UfNow=u0+(u1-u0)*(-s0)/(s1-s0);break;}
  }
  if(isNaN(UfNow))UfNow=simSigma(4,P)>0?0:99;
}
function UfEst(){return UfNow;}

/* ============ 相位测量（上穿零点时刻差） ============ */
let lastHup=0,lastTup=0,periodH=1;
function phaseUpdate(t,prevH,prevTh){
  if(prevH<=0&&h>0){
    if(lastHup>0){periodH=t-lastHup;}
    lastHup=t;
  }
  if(prevTh<=0&&th>0&&lastHup>0){
    let dph=t-lastHup;
    if(periodH>0){
      let f=(dph%periodH)/periodH;
      const target=f*360;
      phaseDeg+=(target-phaseDeg)*0.12;
    }
  }
}

/* ============ 结构崩溃与重置 ============ */
function resetStruct(){
  broken=false;slowMo=0;
  h=0.005;hd=0;th=0;thd=0;af=0;
  phH=[];phT=[];phaseDeg=0;
  debris.forEach(d=>d.g.visible=false);
  segs.forEach(s=>s.visible=!bridge);
  deck.visible=bridge;
}
function doBreak(){
  broken=true;slowMo=2.8;
  segs.forEach(s=>s.visible=false);deck.visible=false;
  debris.forEach((d,i)=>{
    d.g.visible=true;
    d.g.position.set(0,0,SPAN/4*(i?1:-1));
    d.v.set((Math.random()-0.5)*2,2.5+i,(Math.random()-0.5)*2);
    d.w.set(Math.random()*6-3,Math.random()*6-3,Math.random()*6-3);
  });
}

/* ============ 主题 / 语言 ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x10161c:0xdde7ee);
  scene.fog.color.setHex(dark?0x10161c:0xdde7ee);
  floor.material.color.setHex(dark?0x161e26:0xb4c4d0);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();
}

/* ============ 统计与根轨迹图 ============ */
function updateStats(){
  el('sv0').innerHTML=U.toFixed(0)+'<small> m/s</small>';
  el('sv1').innerHTML=Math.abs(h).toFixed(2)+'<small> m</small>';
  el('sv2').innerHTML=(Math.abs(th)*57.3).toFixed(1)+'<small> °</small>';
  el('sv3').innerHTML=phaseOk?phaseDeg.toFixed(0)+'<small> °</small>':'—';
  el('sv0').style.color=(!broken&&U>UfNow)?'#ff8787':'';
  drawRoot();
}
const cv=el('cvRoot'),cx=cv.getContext('2d');
function drawRoot(){
  const W=cv.width,H=cv.height,dark=THEME==='dark';
  cx.clearRect(0,0,W,H);
  cx.fillStyle=dark?'rgba(255,255,255,.04)':'rgba(15,25,40,.05)';
  cx.fillRect(0,0,W,H);
  /* 上半：σ(U) 根轨迹 */
  const hH=(H-24)/2;
  const X=u=>(u-4)/(64-4)*(W-56)+42;
  const Ys=s=>6+hH/2-s* hH/2/1.2;
  cx.strokeStyle=dark?'#5b6b7d':'#8a99a9';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(42,Ys(0));cx.lineTo(W-8,Ys(0));cx.stroke();
  cx.fillStyle=dark?'#9fb0c3':'#5b6b7d';cx.font='9.5px sans-serif';
  cx.fillText(L('增长率 σ(U)：>0 即颤振','growth σ(U): >0 = flutter'),46,14);
  if(rootCurve.length){
    cx.strokeStyle='#74c0fc';cx.lineWidth=2;cx.beginPath();
    rootCurve.forEach(([u,s],i)=>{const y=Ys(clamp(s,-1.2,1.2));i?cx.lineTo(X(u),y):cx.moveTo(X(u),y);});
    cx.stroke();
    if(UfNow>4&&UfNow<64){
      cx.fillStyle='#ffa94d';cx.beginPath();cx.arc(X(UfNow),Ys(0),3.5,0,7);cx.fill();
      cx.fillText('U_f='+UfNow.toFixed(0),X(UfNow)+5,Ys(0)-5);
    }
    cx.fillStyle='#ff6b6b';cx.beginPath();cx.arc(X(clamp(U,4,64)),Ys(clamp(sigmaNow,-1.2,1.2)),4,0,7);cx.fill();
  }
  /* 下半：h(t) 与 θ(t) 时程 */
  const y0=H-14,amp=0.9;
  const Yh=v=>(H-24)+10-(v/amp)*(hH/2-4);
  cx.strokeStyle=dark?'rgba(255,255,255,.25)':'rgba(15,25,40,.25)';
  cx.beginPath();cx.moveTo(42,H-24+10);cx.lineTo(W-8,H-24+10);cx.stroke();
  const plot=(buf,col)=>{
    cx.strokeStyle=col;cx.lineWidth=1.6;cx.beginPath();
    buf.forEach((v,i)=>{const x=42+i/(240-1)*(W-56);i?cx.lineTo(x,Yh(v)):cx.moveTo(x,Yh(v));});
    cx.stroke();
  };
  plot(ampBufH,dark?'#74c0fc':'#1864ab');
  plot(ampBufT,'#ffa94d');
  cx.fillStyle=dark?'#9fb0c3':'#5b6b7d';
  cx.fillText(L('时程：蓝=h 弯曲 橙=θ 扭转','trace: blue=h bend, orange=θ torsion'),46,H-4);
}
const ampBufH=new Float32Array(240),ampBufT=new Float32Array(240);
let ampIdx=0,ampT=0,sigmaNow=0;
function pushAmp(){
  ampBufH.copyWithin(0,1);ampBufT.copyWithin(0,1);
  ampBufH[239]=h;ampBufT[239]=th*2;
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  let eff=timeScale;
  if(slowMo>0){slowMo-=dt0;eff=Math.min(eff,0.15);}
  if(playing&&!broken){
    simT+=dt0*eff;
    const prevH=h,prevTh=th;
    stepODE(dt0*eff);
    phaseUpdate(simT,prevH,prevTh);
    phaseOk=simT>2;
    ampT+=dt0;if(ampT>0.05){ampT=0;pushAmp();}
    sigmaNow=simSigma(U,params(),6);
    // 崩溃判定
    if(Math.abs(h)>1.3||Math.abs(th)>0.55)doBreak();
  }else if(broken){
    // 碎片抛体（慢放）
    debris.forEach(d=>{
      d.v.y-=4.5*dt0*eff*10;
      d.g.position.addScaledVector(d.v,dt0*eff);
      d.g.rotation.x+=d.w.x*dt0*eff;d.g.rotation.y+=d.w.y*dt0*eff;d.g.rotation.z+=d.w.z*dt0*eff;
    });
    if(slowMo<=0&&debris[0].g.position.y<-6)resetStruct();
  }
  // 结构姿态：弯曲振型 ζ² + 刚性扭转
  if(!bridge){
    segs.forEach((s,k)=>{
      const zt=(k+0.5)/SEG;
      s.position.y=h*zt*zt;
      s.rotation.z=th;
    });
  }else{
    deck.rotation.z=th;   // 桥面纯扭转
  }
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
el('sSpd').value=timeScale*100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';
computeRoot();
updateStats();start();
</script>
