<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙膨胀与红移 · 空间自己在伸长</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#7fb8ff;
    --bg:#0a0e16; --panel:rgba(11,16,26,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(11,16,26,.8);
    --hot:#ff7a5c; --ok:#7bd88f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1b6cb3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#c73a1d; --ok:#1e7d46;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(123,216,143,.9); color: #bfeecb; }
  .lbl.b { border-color: rgba(127,184,255,.9); color: #c9e2ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.p { border-color: rgba(197,159,255,.95); color: #e8dcff; font-weight: 700; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { color: #1e7d46; }
  :root[data-theme="light"] .lbl.b { color: #1b6cb3; }
  :root[data-theme="light"] .lbl.r { color: #c73a1d; }
  :root[data-theme="light"] .lbl.p { color: #6d3fb0; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: var(--ok); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 8px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(127,184,255,.6); background: rgba(127,184,255,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(27,108,179,.55); background: rgba(27,108,179,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 74px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(127,184,255,.10); border-color: rgba(127,184,255,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(27,108,179,.08); border-color: rgba(27,108,179,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #c9e2ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="宇宙膨胀与红移:空间自己在伸长" data-en="Cosmic Expansion & Redshift: space itself stretches">宇宙膨胀与红移:空间自己在伸长</h1>
  <div class="sub" data-zh="星系钉在网格上不动,是网格在拉伸——所有距离同乘 a(t);光子飞行途中波长被同样拉长 → 红移;倒放:万物收拢于一点 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Galaxies stay pinned to the grid — the grid stretches, so every distance scales by a(t); a photon's wavelength is stretched in flight → redshift; rewind: everything converges to a point · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">星系钉在网格上不动,是网格在拉伸——所有距离同乘 a(t);光子飞行途中波长被同样拉长 → 红移;倒放:万物收拢于一点 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="尺度因子 a" data-en="scale factor a">尺度因子 a</span><span class="v ok" id="stA">—</span>

  <span class="k" data-zh="退行速度 v=H·d" data-en="recession v=H·d">退行速度 v=H·d</span><span class="v" id="stV">—</span>

  <div class="row"><label data-zh="哈勃常数 H" data-en="Hubble H">哈勃常数 H</label><input id="hub" type="range" min="2" max="20" step="1" value="8"><span class="val" id="hubVal">H = 0.08 /s</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>

    <span data-zh="相关:" data-en="Related:">相关:</span>

    <a href="../doppler-effect/" data-zh="另一种红移:运动穿过空间" data-en="the other redshift: motion through space">另一种红移:运动穿过空间</a>
    <a href="../em-wave/" data-zh="被拉长的是电磁波" data-en="what stretches is the EM wave">被拉长的是电磁波</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e16, 48, 170);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x0a0e16;
  scene.background = new THREE.Color(bg);
  scene.fog.color.set(bg);
  M.grid.color.set(THEME === 'light' ? 0x5d7290 : 0x3f5f8f);
  M.grid.opacity = THEME === 'light' ? .62 : .5;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('宇宙膨胀与红移 · 空间自己在伸长', 'Cosmic Expansion & Redshift · space itself stretches');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(8.5, 8.5, 12.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 9, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ================= 物理常量与状态 ================= */
const C = 1.35;                 // 光速(视觉单位/s,固有时)
const E = 3.2, SP = 0.4, NG = Math.round(E * 2 / SP);   // 共动网格
const LAM0 = 0.26;              // 发射波长(共动单位,不随 a 变——这正是要点)
const NM0 = 450;                // 发射波长 nm
const VDOP = 0.5;               // 多普勒对照:源穿空间速度 u/s
const TRMAX = 130;
let H = 0.08;                   // 哈勃常数 /s
let mode = 'cosmic', obsI = 0, dir = 1;
let tCos = 0, tSch = 0, tDop = 0;   // 宇宙时 / 排程钟 / 多普勒时
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let labelsOn = true, noPhoton = false, scrubbing = false;
let nextEmit = 0.6, nextRing = 0.35, vMeas = 0, lastD = -1, lastZ = null;
let obsPulse = 0, postArr = 0, raf = null, lastStep = -1, formulaAcc = 0;
const clock = new THREE.Clock();
const dummy = new THREE.Object3D(), tmpC = new THREE.Color(), tmpV = new THREE.Vector3();
const aNow = () => mode === 'cosmic' ? Math.exp(H * tCos) : 1;

/* ---------------- 材质 ---------------- */
const M = {
  grid: new THREE.LineBasicMaterial({ color: 0x3f5f8f, transparent: true, opacity: 0.5 }),
};

/* ================= 共动网格:世界坐标 = (χ−χ_obs)·a ================= */
const gCom = new Float32Array((NG + 1) * NG * 2 * 2 * 3);
{
  let gi = 0;
  for (let i = 0; i <= NG; i++) {
    const c = -E + i * SP;
    for (let j = 0; j < NG; j++) {
      const d = -E + j * SP;
      gCom[gi++] = c; gCom[gi++] = 0; gCom[gi++] = d;
      gCom[gi++] = c; gCom[gi++] = 0; gCom[gi++] = d + SP;
      gCom[gi++] = d; gCom[gi++] = 0; gCom[gi++] = c;
      gCom[gi++] = d + SP; gCom[gi++] = 0; gCom[gi++] = c;
    }
  }
}
const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(gCom.length), 3));
const gridLines = new THREE.LineSegments(gridGeo, M.grid);
gridLines.frustumCulled = false;
scene.add(gridLines);
function updateGrid(a) {
  const p = gridGeo.attributes.position.array;
  const ox = OBSV[obsI].x, oz = OBSV[obsI].z;
  for (let i = 0; i < gCom.length; i += 3) {
    p[i] = (gCom[i] - ox) * a;
    p[i + 2] = (gCom[i + 2] - oz) * a;
  }
  gridGeo.attributes.position.needsUpdate = true;
}

/* ================= 星系:钉在共动格点(InstancedMesh) ================= */
const GA = new THREE.Vector3(-1.2, 0, 0.8);    // 观察者 A
const GB = new THREE.Vector3(1.6, 0, -0.4);    // 观察者 B
const GSRC = new THREE.Vector3(-0.4, 0, -2.8); // 远方光源星系
const OBSV = [GA, GB];
const GXY = [GA.clone(), GB.clone(), GSRC.clone()];
for (let gx = 0; gx <= NG && GXY.length < 40; gx++) for (let gz = 0; gz <= NG && GXY.length < 40; gz++) {
  if ((gx * 7 + gz * 13) % 5) continue;
  const x = -E + gx * SP, z = -E + gz * SP;
  if (GXY.every(q => Math.hypot(q.x - x, q.z - z) > 0.62)) GXY.push(new THREE.Vector3(x, 0, z));
}
const gxy = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 12, 10),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.08, emissive: 0xffffff, emissiveIntensity: 0.07 }),
  GXY.length);
gxy.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
{
  const col = new THREE.Color();
  for (let i = 0; i < GXY.length; i++) {
    col.setHSL((i * 0.618) % 1, 0.5, 0.6);
    gxy.setColorAt(i, col);
  }
  gxy.instanceColor.needsUpdate = true;
}
scene.add(gxy);
function updateGalaxies(a) {
  const ox = OBSV[obsI].x, oz = OBSV[obsI].z;
  for (let i = 0; i < GXY.length; i++) {
    const p = (mode === 'doppler' && i === 2) ? sPos : GXY[i];
    dummy.position.set((p.x - ox) * a, 0.02, (p.z - oz) * a);
    dummy.scale.setScalar(1);            // 星系自身不随空间膨胀
    dummy.updateMatrix();
    gxy.setMatrixAt(i, dummy.matrix);
  }

}

/* 观察者 / 光源标记 */
function marker(rIn, rOut, color) {

    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
  m.position.y = 0.03;
  scene.add(m);
  return m;
}
const mkA = marker(0.3, 0.4, 0x7fb8ff), mkB = marker(0.3, 0.4, 0x7fb8ff), mkS = marker(0.2, 0.27, 0xffd166);

/* ================= 光子:波列存在共动坐标里 → 随 a 自动拉长 ================= */
const ph = { active: false, aE: 1, pos: new THREE.Vector3(), last: new THREE.Vector3(),
  trail: [], perp: new THREE.Vector3(), s: 0, zArr: 0 };
const phHead = new THREE.Group();
phHead.visible = false;
scene.add(phHead);
const headMat = new THREE.MeshBasicMaterial({ color: 0x9ad0ff });
phHead.add(new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 12), headMat));
const haloMat = new THREE.MeshBasicMaterial({ color: 0x9ad0ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false });
phHead.add(new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 12), haloMat));
const tArr = new Float32Array(TRMAX * 3);
const tGeo = new THREE.BufferGeometry();
tGeo.setAttribute('position', new THREE.BufferAttribute(tArr, 3));
const trailMat = new THREE.LineBasicMaterial({ color: 0x9ad0ff, transparent: true, opacity: 0.95 });
const trailLine = new THREE.Line(tGeo, trailMat);

function wl2rgb(w, out) {
  w = clamp(w, 380, 700);
  let r = 0, g = 0, b = 0;
  if (w < 440) { r = (440 - w) / 60; b = 1; }
  else if (w < 490) { g = (w - 440) / 50; b = 1; }
  else if (w < 510) { g = 1; b = (510 - w) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; }
  else if (w < 645) { r = 1; g = (645 - w) / 65; }
  else r = 1;
  return out.setRGB(r, g, b);
}
function phLam() {
  if (ph.active) return mode === 'cosmic' ? NM0 * aNow() / ph.aE : NM0;
  return NM0 * (1 + (lastZ || 0));
}
function phZ() {
  if (ph.active) return mode === 'cosmic' ? aNow() / ph.aE - 1 : 0;
  return lastZ || 0;
}
const srcPos = () => mode === 'doppler' ? sPos : GSRC;
function dNow() {
  return mode === 'cosmic' ? aNow() * srcPos().distanceTo(OBSV[obsI]) : sPos.distanceTo(OBSV[obsI]);
}
function emitPhoton() {
  ph.active = true; ph.aE = aNow(); ph.zArr = 0; ph.s = 0;
  const s = srcPos();
  ph.pos.set(s.x, 0, s.z); ph.last.copy(ph.pos);
  ph.trail.length = 0; ph.trail.push({ x: s.x, z: s.z, s: 0 });
  const o = OBSV[obsI], dx = o.x - s.x, dz = o.z - s.z, dl = Math.hypot(dx, dz) || 1;
  ph.perp.set(-dz / dl, 0, dx / dl);
  phHead.visible = true;
  postArr = 0;
}
function advPhoton(h) {
  const sp = mode === 'cosmic' ? C / aNow() : C;   // 共动速度 c/a;静态空间即 c
  const o = OBSV[obsI];
  const dx = o.x - ph.pos.x, dz = o.z - ph.pos.z, dl = Math.hypot(dx, dz);
  const step = sp * h;
  if (h > 0 && dl <= Math.abs(step) + 0.02) {       // 到达观察者
    ph.zArr = mode === 'cosmic' ? aNow() / ph.aE - 1 : VDOP / C;
    lastZ = ph.zArr;
    ph.active = false; postArr = 1.5; obsPulse = 1;
    nextEmit = tSch + 1.1;
    return;
  }
  if (dl > 1e-6) { ph.pos.x += dx / dl * step; ph.pos.z += dz / dl * step; }
  ph.s += Math.abs(step);
  if (Math.hypot(ph.pos.x - ph.last.x, ph.pos.z - ph.last.z) > 0.075) {
    ph.last.set(ph.pos.x, 0, ph.pos.z);
    ph.trail.push({ x: ph.pos.x, z: ph.pos.z, s: ph.s });
    if (ph.trail.length > TRMAX - 2) ph.trail.shift();
  }
}

/* ================= 波前环:共动半径 rC,绘出半径 rC·a(途中被拉长) ================= */
const RINGS = 12, rings = [];
const ringGeo = new THREE.RingGeometry(0.93, 1, 48).rotateX(-Math.PI / 2);
for (let i = 0; i < RINGS; i++) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  m.position.y = 0.02; m.visible = false;
  scene.add(m);
  rings.push({ m, on: false, rC: 0, aE: 1, cE: new THREE.Vector3() });
}
function emitRing() {
  const r = rings.find(r => !r.on);
  if (!r) return;
  r.on = true; r.aE = aNow(); r.rC = 0; r.cE.copy(srcPos()); r.m.visible = true;
}

/* ================= 状态迁移 ================= */
function killTransient() {
  ph.active = false; phHead.visible = false; trailLine.visible = false;
  postArr = 0; obsPulse = 0; lastD = -1; vMeas = 0;
  for (const r of rings) { r.on = false; r.m.visible = false; }
  nextEmit = tSch + 0.5; nextRing = tSch + 0.35;
}
function setA(x) {
  x = clamp(x, 0.2, 3.2);
  if (mode === 'cosmic') tCos = Math.log(x) / H;
  killTransient();
  elSca.value = Math.round(x * 100);
  elScaVal.textContent = 'a = ' + x.toFixed(2);
}
function setObs(i) {
  obsI = i;
  killTransient();
  btnOA.classList.toggle('on', i === 0);
  btnOB.classList.toggle('on', i === 1);
}
function toCosmic() { mode = 'cosmic'; killTransient(); btnDop.classList.remove('on'); }
function toDoppler() {
  mode = 'doppler'; tDop = 0; sPos.copy(GSRC);
  killTransient(); btnDop.classList.add('on');
}
function uDop() {
  const o = OBSV[obsI], dx = GSRC.x - o.x, dz = GSRC.z - o.z, l = Math.hypot(dx, dz) || 1;
  return tmpV.set(dx / l, 0, dz / l);
}
const sPos = GSRC.clone();

/* ================= 推进(纯函数,h 可为负=倒放) ================= */
function advanceSim(h) {
  tSch += h;
  if (mode === 'cosmic') {
    const lo = Math.log(0.2) / H, hi = Math.log(3.2) / H;
    tCos = clamp(tCos + h, lo, hi);
    if (tCos <= lo + 1e-9 && dir < 0 && playing) { playing = false; setPlayLabel(); }
  } else {
    tDop = clamp(tDop + h, 0, 120);
    sPos.addScaledVector(uDop(), VDOP * h);   // 源穿过静态空间
  }
  if (tglRings.checked && tSch >= nextRing) { emitRing(); nextRing = tSch + 0.9; }
  if (!ph.active && !noPhoton && tSch >= nextEmit) emitPhoton();
  if (ph.active) advPhoton(h);
  for (const r of rings) if (r.on) {
    r.rC += C / aNow() * h;
    if (r.rC * aNow() > 15) { r.on = false; r.m.visible = false; }
  }
  const d = dNow();
  if (h > 0 && lastD > 0) vMeas = (d - lastD) / h;   // 从模拟实测 Δd/Δt
  lastD = d;
}

/* ================= 图形更新 ================= */
function updateMarkers(a) {
  const ox = OBSV[obsI].x, oz = OBSV[obsI].z;
  [[mkA, GA, 0], [mkB, GB, 1]].forEach(([mk, p, i]) => {
    mk.position.set((p.x - ox) * a, 0.03, (p.z - oz) * a);
    const on = obsI === i;
    mk.material.color.set(on ? 0x7fb8ff : 0x8a97a8);
    mk.material.opacity = on ? 0.9 : 0.22;
    mk.scale.setScalar(1 + (on ? obsPulse * 0.8 : 0));
  });
  mkS.position.set((srcPos().x - ox) * a, 0.03, (srcPos().z - oz) * a);
  mkS.material.opacity = 0.55 + 0.3 * Math.sin(tSch * 3);
}
function updateRings(a) {
  const ox = OBSV[obsI].x, oz = OBSV[obsI].z;
  for (const r of rings) {
    if (!r.on) continue;
    const R = Math.max(r.rC * a, 0.001);
    r.m.scale.setScalar(R);
    r.m.position.set((r.cE.x - ox) * a, 0.02, (r.cE.z - oz) * a);
    wl2rgb(mode === 'cosmic' ? NM0 * a / r.aE : NM0, tmpC);
    r.m.material.color.copy(tmpC);
    r.m.material.opacity = 0.55 * clamp(1 - R / 15, 0, 1) + 0.04;
  }
}
function updatePhoton(a) {
  const vis = ph.active || postArr > 0;
  phHead.visible = ph.active;
  trailLine.visible = vis;
  if (!vis) return;
  wl2rgb(phLam(), tmpC);
  headMat.color.copy(tmpC); haloMat.color.copy(tmpC); trailMat.color.copy(tmpC);
  const ox = OBSV[obsI].x, oz = OBSV[obsI].z;
  const amp = 0.07 * Math.min(a, 2.6);
  const n = ph.trail.length;
  for (let i = 0; i < n; i++) {
    const t = ph.trail[i], off = Math.sin(t.s / LAM0 * Math.PI * 2) * amp;
    tArr[i * 3] = (t.x - ox) * a - ph.perp.x * off;
    tArr[i * 3 + 1] = 0.34;
    tArr[i * 3 + 2] = (t.z - oz) * a - ph.perp.z * off;
  }
  tGeo.setDrawRange(0, n);
  tGeo.attributes.position.needsUpdate = true;
  trailMat.opacity = ph.active ? 0.95 : postArr / 1.5 * 0.95;
  if (ph.active) {
    phHead.position.set((ph.pos.x - ox) * a, 0.34, (ph.pos.z - oz) * a);
    phHead.scale.setScalar(1 + 0.12 * Math.sin(tSch * 6));
  }
}
function updateVisuals(dt) {
  const a = aNow();
  updateGrid(a);
  updateGalaxies(a);
  updateMarkers(a);
  updateRings(a);
  updatePhoton(a);
  obsPulse = Math.max(0, obsPulse - dt * 1.4);
  postArr = Math.max(0, postArr - dt);
  lblGrid.o.position.set((-E - OBSV[obsI].x) * a, 0.3, (E - OBSV[obsI].z) * a);
  lblSrc.o.position.set((srcPos().x - OBSV[obsI].x) * a, 0.8, (srcPos().z - OBSV[obsI].z) * a);
  for (const r of labelReg) if (labelsOn && r.vis()) r.o.element.textContent = r.text();
  if (!scrubbing) elSca.value = Math.round(a * 100);
  elScaVal.textContent = 'a = ' + a.toFixed(2);

  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}

/* ================= 主循环 ================= */
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) advanceSim(dt * speed * dir);
  updateVisuals(dt);
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateStats(); updateFormula(); }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
