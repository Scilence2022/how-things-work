<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡门涡街 · Re 定流态,St 定音调</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="卡门涡街" data-en="The Kármán Vortex Street">卡门涡街</h1>
  <div class="sub" data-zh="圆柱后面的尾流不甘心对称:一侧先失稳,旋涡就左右交替脱落,排成两列交错的街道,f=St·U/d,St≈0.2——电线风鸣、烟囱晃动、塔科马大桥,都是这列涡一下一下侧推的结果;Re 定流态,St 定音调 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The wake behind a cylinder refuses to stay symmetric: one side destabilizes first and vortices peel off alternately, lining up into two staggered rows — a street. f = St·U/d with St≈0.2; singing wires, swaying chimneys and the Tacoma bridge are all pushed sideways by these vortices, one shed at a time · Re sets the regime, St sets the pitch · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">卡门涡街</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="雷诺数 Re" data-en="Reynolds Re">雷诺数 Re</span><span class="v" id="stRe">—</span>
  <span class="k" data-zh="斯特劳哈尔数 St" data-en="Strouhal St">斯特劳哈尔数 St</span><span class="v" id="stSt">—</span>
  <span class="k" data-zh="涡脱频率 f" data-en="Shedding freq. f">涡脱频率 f</span><span class="v warn" id="stF">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v ok" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="圆柱侧向力 F_y(12 s 轨迹)· 每次涡脱推一下" data-en="Cylinder side force F_y (12 s trace) · one push per shed vortex">圆柱侧向力 F_y</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="粒子色=当地流速(慢蓝快红)" data-en="particle color = local speed (slow blue, fast red)">粒子色=当地流速(慢蓝快红)</span>
    <span class="chip.g" data-zh="圆柱=绕流体(d=1)" data-en="cylinder = bluff body (d=1)">圆柱=绕流体(d=1)</span>
    <span class="chip.o" data-zh="曲线=侧向力 F_y" data-en="curve = side force F_y">曲线=侧向力 F_y</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnWire" data-zh="电线风鸣" data-en="Singing wire">电线风鸣</button>
    <button class="abtn brk" id="btnTacoma" data-zh="塔科马共振" data-en="Tacoma resonance">塔科马共振</button>
    <button class="abtn" id="btnSpoiler" data-zh="烟囱扰流板" data-en="Chimney spoilers">烟囱扰流板</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="Reset">复位</button>
  </div>
  <div class="row"><label data-zh="雷诺数 Re(对数)" data-en="Reynolds Re (log)">雷诺数 Re(对数)</label><input id="re" type="range" min="0" max="1000" step="1" value="419"><span class="val" id="reVal">120</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../reynolds-number/" data-zh="总纲:风洞与雷诺数" data-en="the master dial: Reynolds number">总纲:风洞与雷诺数</a>
    <a href="../resonance-beats/" data-zh="惹祸的方式:共振与拍" data-en="how it wrecks things: resonance">惹祸的方式:共振与拍</a>
    <a href="../tornado/" data-zh="涡的另一个极端:龙卷风" data-en="the other vortex extreme: tornadoes">涡的另一个极端:龙卷风</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 45, 170);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('卡门涡街 · Re 定流态,St 定音调', 'The Kármán Vortex Street · Re Sets the Regime, St Sets the Pitch');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(4.5, 16.5, 13);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 12, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理常数 / 状态 ================= */
const U0 = 2.2;             // 来流(单位/s),流向 +x
const CYL_X = -2, CYL_R = 0.5, D = 1;
const GAMMA = 2.2 * U0 * D; // 涡环流 Γ
const NU_AIR = 1.5e-5;      // 空气运动黏度 m²/s
let tSim = 0;
let logRe = Math.log10(clamp(qsFloat('re', 120), 40, 1e6));
let Re = 10 ** logRe;
let spoiler = false, lockIn = false, lockAmp = 1, note = '', presetMode = '';
let shedPhase = 0, shedSide = 1, lastReg = -1, fy = 0, lastFyT = -9;
const fyHist = [];          // {t, v}
/* regime: 0 双驻涡 | 1 层流涡街 | 2 湍流街 | 3 超临界 */
const regime = () => Re < 47 ? 0 : Re < 190 ? 1 : Re < 3.5e5 ? 2 : 3;
const stOf = () => { const r = regime(); return r === 1 ? 0.20 : r === 2 ? 0.24 : r === 3 ? 0.28 : 0; };
const fDemo = () => { const st = stOf(); return st ? st * U0 / D : 0; };      // 演示 Hz
const fReal = () => { const st = stOf(); return st ? st * 1.5 / 0.2 : 0; };   // 实尺:d=0.2 m, U=1.5 m/s
function ampA() {
  const r = regime();
  let a = r === 0 ? 0 : r === 1 ? 0.32 : r === 2 ? 0.55 : 0.22;
  if (spoiler) a *= 0.06;
  if (lockIn) a *= lockAmp;
  return a;
}
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function fmtRe(r) {
  if (r < 1e4) return '' + Math.round(r);
  const e = Math.floor(Math.log10(r));
  const m = (r / 10 ** e).toFixed(1);
  let s = '';
  for (const ch of '' + e) s += SUP[+ch];
  return m + '×10' + s;
}

/* ================= 几何布置 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(34, 0.4, 16),
  mat(0x2e3946, { opacity: 1, roughness: 0.85, metalness: 0.05 }));
floor.position.y = -1.8;
scene.add(floor);
for (const zs of [-8.05, 8.05]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(34, 2.6, 0.16),
    mat(0xa8c6e8, { opacity: 0.14, roughness: 0.1, metalness: 0.05 }));
  wall.position.set(0, -0.3, zs);
  scene.add(wall);
}
const cylG = new THREE.Group();
const cyl = new THREE.Mesh(new THREE.CylinderGeometry(CYL_R, CYL_R, 3.2, 36),
  mat(0x9aa7b8, { opacity: 1, roughness: 0.3, metalness: 0.7 }));
cylG.add(cyl);
cylG.position.set(CYL_X, 0, 0);
scene.add(cylG);

/* 粒子:560 颗,中层平面被流场平流 */
const P_N = 560;
const parIM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 8, 8),
  new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.05 }), P_N);
parIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(parIM);
const dummy = new THREE.Object3D();
const _c = new THREE.Color();
const parts = [];
for (let i = 0; i < P_N; i++) {
  parts.push({ x: -17 + Math.random() * 34, z: (Math.random() - 0.5) * 15,
    y: (Math.random() - 0.5) * 0.6, ph: Math.random() * Math.PI * 2 });
}

/* ================= 涡模型 ================= */
const vorts = [];           // {x, z, g, tau, side, fixed}
function spawnVortex(side) {
  const reg = regime();
  let z = side * 0.62, jit = 0;
  if (reg === 2) jit = (Math.random() - 0.5) * 0.3;
  if (reg === 3) { z = side * 0.45; jit = (Math.random() - 0.5) * 0.1; }
  let g = (side > 0 ? -1 : 1) * GAMMA;         // 上排顺旋(Γ<0)、下排反旋
  if (reg === 3) g *= 0.6;
  if (reg === 2) g *= 1 + (Math.random() - 0.5) * 0.36;
  if (spoiler) g *= 0.5;
  vorts.push({ x: CYL_X + 0.5, z: z + jit, g, tau: 0, side, fixed: false });
  if (vorts.length > 26) vorts.shift();
}
function updateVortices(dt) {
  const reg = regime();
  if (reg === 0) {
    if (!vorts.length) {
      const g = 0.9 * GAMMA * (spoiler ? 0.5 : 1);
      vorts.push({ x: CYL_X - 0.62, z: 0.32, g: -g, tau: 0, side: 1, fixed: true });
      vorts.push({ x: CYL_X - 0.62, z: -0.32, g: g, tau: 0, side: -1, fixed: true });
    }
    return;
  }
  const drift = reg === 2 ? 0.16 : 0.09;
  for (let i = vorts.length - 1; i >= 0; i--) {
    const v = vorts[i];
    v.tau += dt;
    v.x += 0.85 * U0 * dt;
    v.z += v.side * drift * dt;                // 向外侧缓漂
    if (v.x > 17.5 || v.tau > 22) vorts.splice(i, 1);
  }
}
/* 高斯核脱奇涡感应:u_θ = Γ/(2πr)·(1−e^(−r²/rc²)) */
let UX = U0, UZ = 0;
function velAt(px, pz) {
  UX = U0; UZ = 0;
  for (const v of vorts) {
    const dx = px - v.x, dz = pz - v.z;
    const r2 = dx * dx + dz * dz + 1e-4;
    const rc = 0.25 + 0.04 * v.tau;
    const dec = v.fixed ? 1 : Math.exp(-v.tau / 10);
    const k = v.g * dec / (2 * Math.PI * r2) * (1 - Math.exp(-r2 / (rc * rc)));
    UX += -dz * k;
    UZ += dx * k;
  }
}
function updateParticles(dt, turb) {
  const n = Math.max(1, Math.min(4, Math.ceil(dt / 0.045)));
  const h = dt / n;
  for (let s = 0; s < n; s++) {
    for (const p of parts) {
      velAt(p.x, p.z);
      let ux = UX, uz = UZ;
      if (turb > 0) {
        ux += Math.cos(tSim * 2.1 + p.ph) * 0.22 * turb;
        uz += Math.sin(tSim * 3.3 + p.ph) * 0.3 * turb;
      }
      p.x += ux * h;
      p.z += uz * h;
      const dx = p.x - CYL_X, dz = p.z;
      const r = Math.hypot(dx, dz);
      if (r < CYL_R + 0.08) {                  // 推出圆柱
        const inv = (CYL_R + 0.08) / Math.max(r, 1e-3);
        p.x = CYL_X + dx * inv;
        p.z = dz * inv;
      }
      if (p.x > 17 || p.x < -17.5 || Math.abs(p.z) > 7.5) {   // 出界 → 入口重播种
        p.x = -17 + Math.random() * 0.4;
        p.z = (Math.random() - 0.5) * 14.6;
      }
    }
  }
  for (let i = 0; i < P_N; i++) {
    const p = parts[i];
    dummy.position.set(p.x, p.y, p.z);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    parIM.setMatrixAt(i, dummy.matrix);
    velAt(p.x, p.z);
    /* 自由流=中性灰蓝,亏速=蓝,超速=红:尾流结构一眼可读 */
    const dev = clamp((UX - U0) / U0, -0.7, 0.7);
    if (dev < -0.02) _c.setHSL(0.6, 0.75, lerp(0.62, 0.34, Math.min(1, -dev / 0.7)));
    else if (dev > 0.02) _c.setHSL(0.02, 0.85, lerp(0.6, 0.45, Math.min(1, dev / 0.7)));
    else _c.setHSL(0.56, 0.18, 0.62);
    parIM.setColorAt(i, _c);
  }
  parIM.instanceMatrix.needsUpdate = true;
  parIM.instanceColor.needsUpdate = true;
}

let stepOverride = -1;
function stepIndex() {
  if (stepOverride >= 0) return stepOverride;
  if (spoiler) return 5;
  if (lockIn) return 3;
  const r = regime();
  if (r === 3) return 4;
  if (r === 2) return 2;
  if (r === 1) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');

  STEPS.forEach((s, i) => {

    li.addEventListener('click', () => { s.act(); stepOverride = i; syncSliders(); updateFormula(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图:侧向力轨迹 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 16, W2 = W - pad * 2;
  const xOf = t => pad + (1 - (tSim - t) / 12) * W2;
  let vmax = 0.15;
  for (const q of fyHist) vmax = Math.max(vmax, Math.abs(q.v));
  vmax *= 1.18;
  const y0 = H * 0.55;
  const yOf = v => y0 - v / vmax * (H * 0.36);
  ctx.strokeStyle = 'rgba(128,150,170,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, y0); ctx.lineTo(W - pad, y0); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  ctx.fillText('+' + vmax.toFixed(1), pad + 2, 14);
  ctx.fillText('−' + vmax.toFixed(1), pad + 2, H - 26);
  for (const [tt, lab] of [[tSim, L('现在', 'now')], [tSim - 6, '−6 s'], [tSim - 12, '−12 s']]) {
    ctx.fillText(lab, clamp(xOf(tt) - 14, pad, W - pad - 44), H - 6);
  }
  if (fyHist.length > 1) {
    ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 3;
    ctx.beginPath();
    let started = false;
    for (const q of fyHist) {
      if (q.t < tSim - 12) continue;
      const x = xOf(q.t), y = yOf(q.v);
      started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      started = true;
    }
    ctx.stroke();
  }
  const st = stOf();
  ctx.font = '14px system-ui';
  if (st > 0) {
    ctx.fillStyle = cTxt;
    ctx.fillText(`f = St·U/d = ${st.toFixed(2)}×${U0.toFixed(1)}/1 = ${fDemo().toFixed(2)} Hz`, pad + 6, H * 0.22);
    if (lockIn) {
      ctx.fillStyle = '#ff8787';
      ctx.fillText(L(`共振放大 ×${lockAmp.toFixed(1)}`, `resonance ×${lockAmp.toFixed(1)}`), pad + 6, H * 0.38);
    }
  } else {
    ctx.fillStyle = cTxt;
    ctx.fillText(L('Re<47:无脱落,F_y ≈ 0', 'Re<47: no shedding, F_y ≈ 0'), pad + 6, H * 0.22);
  }
}

/* ================= 状态 / 动作 ================= */
function applyRe(r) {
  Re = clamp(r, 40, 1e6);
  syncSliders();
}
function markPreset() {
  document.getElementById('btnWire').classList.toggle('on', presetMode === 'wire');
  document.getElementById('btnTacoma').classList.toggle('on', presetMode === 'tacoma');
  document.getElementById('btnSpoiler').classList.toggle('on', presetMode === 'spoiler');
}
function clearTuning() {
  lockIn = false; lockAmp = 1; spoiler = false; note = ''; presetMode = '';
  stepOverride = -1;
  markPreset();
}
function doWire() {
  clearTuning();
  applyRe(9300);
  presetMode = 'wire';
  note = L('d=2 cm 电线、风 7 m/s:Re≈9.3×10³ → f=St·U/d≈0.2×7/0.02≈70 Hz,听到的就是 Aeolian 音',
    'd=2 cm wire, 7 m/s wind: Re≈9.3×10³ → f=St·U/d≈0.2×7/0.02≈70 Hz — the Aeolian tone you hear');
  markPreset();
}
function doTacoma() {
  clearTuning();
  applyRe(2e5);
  presetMode = 'tacoma';
  lockIn = true;
  lockAmp = 1;
  note = L('1940 塔科马海峡桥:风约 19 m/s,涡脱频率咬住结构固有频率,振幅被一周期一周期推大',
    '1940 Tacoma Narrows Bridge: in ~19 m/s wind the shedding frequency locked onto the deck\'s natural frequency, pumping the amplitude up cycle by cycle');
  markPreset();
}
function doSpoiler() {
  clearTuning();
  presetMode = 'spoiler';
  spoiler = true;
  note = L('烟囱螺旋扰流板:打乱展向涡的相位,涡强度减半、侧力≈0',
    'chimney spiral spoilers: scramble the spanwise phase of the vortices — strength halved, side force ≈ 0');
  markPreset();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elRe = document.getElementById('re'), elReVal = document.getElementById('reVal');
const stRe = document.getElementById('stRe'), stSt = document.getElementById('stSt'),
  stF = document.getElementById('stF'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elRe.value = Math.round((Math.log10(Re) - Math.log10(40)) / (6 - Math.log10(40)) * 1000);
  elReVal.textContent = fmtRe(Re);
}
function stateText() {
  if (spoiler) return L('已抑制', 'suppressed');
  const r = regime();
  if (r === 0) return L('双驻涡', 'twin eddies');
  if (r === 1) return L('层流涡街', 'laminar street');
  if (r === 2) return lockIn ? L('湍流街 · 共振 ⚠', 'turb. street · resonance ⚠') : L('湍流街', 'turbulent street');
  return L('超临界', 'supercritical');
}
function updateFormula() {
  const st = stOf(), fd = fDemo(), fr = fReal();
  const line1 = st > 0
    ? L(`f = St·U/d = ${st.toFixed(2)}×2.2/1 = <b>${fd.toFixed(2)} Hz</b>(演示尺度)`,
        `f = St·U/d = ${st.toFixed(2)}×2.2/1 = <b>${fd.toFixed(2)} Hz</b> (demo scale)`)
    : L('Re<47:无脱落,f 不存在 · St = <b>—</b>', 'Re<47: no shedding, no f · St = <b>—</b>');
  const line2 = st > 0
    ? L(`实尺换算(d=0.2 m、U=1.5 m/s):f = <b>${fr.toFixed(2)} Hz</b> · Re = U·d/ν(空气 ν≈1.5×10⁻⁵ m²/s)`,
        `real scale (d=0.2 m, U=1.5 m/s): f = <b>${fr.toFixed(2)} Hz</b> · Re = U·d/ν (air ν≈1.5×10⁻⁵ m²/s)`)
    : L(`Re = U·d/ν(空气 ν≈1.5×10⁻⁵ m²/s)`, `Re = U·d/ν (air ν≈1.5×10⁻⁵ m²/s)`);
  const line3 = note ? '<br>' + note : '';
  formulaEl.innerHTML = line1 + '<br>' + line2 + line3;
}
document.getElementById('btnWire').addEventListener('click', () => { doWire(); syncSliders(); updateFormula(); });
document.getElementById('btnTacoma').addEventListener('click', () => { doTacoma(); syncSliders(); updateFormula(); });
document.getElementById('btnSpoiler').addEventListener('click', () => { doSpoiler(); syncSliders(); updateFormula(); });
document.getElementById('btnReset').addEventListener('click', () => {
  clearTuning();

});
elRe.addEventListener('input', () => {
  const s = +elRe.value / 1000;

  Re = 10 ** logRe;
  clearTuning();
  syncSliders();
  updateFormula();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);

});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  if (dt > 0) {
    tSim += dt;
    const reg = regime();
    if (reg !== lastReg) { lastReg = reg; vorts.length = 0; shedPhase = 0; shedSide = 1; }
    updateVortices(dt);
    const fd = fDemo();
    if (reg > 0 && fd > 0) {
      shedPhase += dt * fd;
      while (shedPhase >= 0.5) { shedPhase -= 0.5; spawnVortex(shedSide); shedSide *= -1; }
    }
    if (lockIn && fd > 0) lockAmp = Math.min(4, lockAmp + dt * 0.3);
    fy = fd > 0 ? ampA() * Math.sin(2 * Math.PI * fd * tSim) : 0;
    cylG.position.z = fy * 0.55;               // 侧向力 → 圆柱可见摆动
    if (tSim - lastFyT > 0.035) {
      lastFyT = tSim;
      fyHist.push({ t: tSim, v: fy });
      while (fyHist.length && fyHist[0].t < tSim - 12.5) fyHist.shift();
    }
    const turb = reg === 2 ? 1 : reg === 3 ? 0.45 : 0;
    updateParticles(dt, turb);
  }
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stRe.textContent = fmtRe(Re);
    const st = stOf();
    stSt.textContent = st > 0 ? st.toFixed(2) : '—';
    stF.innerHTML = st > 0
      ? fReal().toFixed(2) + ' Hz <small>' + L('演示 ', 'demo ') + fDemo().toFixed(2) + ' Hz</small>'
      : '—';
    stS.textContent = stateText();
    stS.className = 'v ' + (spoiler ? 'ok' : lockIn ? 'bad' : 'warn');
    syncSliders();
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
{
  const pre = qs.get('preset');
  if (pre === 'wire') doWire();
  else if (pre === 'tacoma') doTacoma();
  else if (pre === 'spoiler') doSpoiler();
}
syncSliders();
setPlayLabel();
buildSteps();
applyTheme();
applyLang();
start();
