<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>心脏起搏器 · 该出手时才出手</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:340px;height:196px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:11.5px;color:var(--text2);font-weight:600;margin-bottom:2px;line-height:1.35}
  #plotCv{width:100%;height:calc(100% - 30px);display:block}
  #stats{position:fixed;right:18px;bottom:226px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

  <h1 data-zh="心脏起搏器 · 该出手时才出手" data-en="The Pacemaker · Fire Only When Needed">心脏起搏器 · 该出手时才出手</h1>
  <div class="sub" data-zh="窦房结停摆或房室传导阻滞时心室没人点火→晕厥；起搏电极以 2–5 V、0.4–1.5 ms 脉冲「夺获」心肌；按需模式感知到自身心跳就抑制；DDD 双腔心房感知-心室跟踪，恢复房室同步。看 3 秒停搏里那记「钉」· 拖动旋转 / 空格运行/暂停" data-en="When the SA node stalls or AV conduction blocks, nobody fires the ventricle → syncope. The lead captures myocardium with 2–5 V, 0.4–1.5 ms pulses; demand mode inhibits on every sensed beat; DDD tracks the atrium to restore AV synchrony. Watch the spike land inside the 3-second pause · drag to orbit / Space = run/pause">窦房结停摆或房室传导阻滞时心室没人点火→晕厥；起搏电极以 2–5 V、0.4–1.5 ms 脉冲「夺获」心肌；按需模式感知到自身心跳就抑制；DDD 双腔心房感知-心室跟踪，恢复房室同步。看 3 秒停搏里那记「钉」· 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const el=id=>document.getElementById(id);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ============ 渲染器 / 场景 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,120);
camera.position.set(3.2,2.6,9.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,9,7);scene.add(key);

/* ============ 起搏时序模型 ============
   VVI：感知自身 QRS 就重置计时并抑制；计时满 LRI（60/下限频率）才发放
   DDD：感知 P → 等 AV 间期 0.20 s → 仍无 QRS 则心室跟踪起搏；窦停时心房起搏
   夺获：2–5 V、0.4–1.5 ms 脉冲，阈值以上必然起搏 → 钉后立刻宽 QRS
   关掉按需=固定频率 → 竞争心律，钉落在 T 波上=R-on-T 危险 */
let caseId='sastop',mode='VVI',demandOn=true,playing=!qs.get('pause');
let lowerRate=60,ownRate=75;
let simT=0;
let nextSA=0.9,nextA=0.5,aPend=null,vPend=null;
let inArrest=false,phaseEnd=4.0,tLastA=-9,tLastV=-0.4,tLastPace=-9,lastSense=-9;
let events=[],vTimes=[],nPaced=0,nSensed=0,ronT=0,ronTmsg=0;
function resetSim(){
  simT=0;nextSA=0.9;nextA=0.5;aPend=null;vPend=null;
  inArrest=false;phaseEnd=4.0;tLastA=-9;tLastV=-0.4;tLastPace=-9;lastSense=-9;
  events=[];vTimes=[];nPaced=0;nSensed=0;ronT=0;ronTmsg=0;
}
const G=(x,mu,sig)=>Math.exp(-(x-mu)*(x-mu)/(2*sig*sig));
function emitP(){
  events.push({t:simT,k:'P'});tLastA=simT;aEnv=1;
  if(caseId!=='avb')aPend=simT+0.18;                 // 房室传导:PR 间期 0.18 s
  if(mode==='DDD'&&caseId!=='af')vPend=simT+0.20;    // DDD 感知 P → 跟踪等待
}
function emitQRS(paced){
  events.push({t:simT,k:paced?'Qw':'Qn'});
  tLastV=simT;vEnv=1;vTimes.push(simT);if(vTimes.length>8)vTimes.shift();
  if(paced)nPaced++;else{nSensed++;lastSense=simT;}
}
function paceA(){ /* 心房起搏：钉 → 夺获出 P */
  events.push({t:simT,k:'Sa'});tLastA=simT;aEnv=1;aFlash=1;
  events.push({t:simT+0.04,k:'P'});
  if(caseId!=='avb'){aPend=simT+0.22;vPend=simT+0.32;}   // 传导完好:等 intrinsic QRS 抑制心室钉
  else vPend=simT+0.20;                                  // 阻滞:AV 间期后心室跟踪起搏
}
function paceV(){ /* 心室起搏：钉 → 宽 QRS */
  events.push({t:simT,k:'S'});emitQRS(true);vFlash=1;
  if(!demandOn&&lastSense>0&&simT-lastSense>0.18&&simT-lastSense<0.5){ronT=1;ronTmsg=3;}
}
function tick(dt){
  simT+=dt;
  const LRI=60/lowerRate;
  /* --- 心房活动 --- */  if(caseId==='af'){
    if(simT>=nextA){                                   // 房颤: 无序房波,无 P 波
      aEnv=1;
      if(Math.random()<0.55)aPend=simT+0.14+Math.random()*0.1;   // 不定比例下传
      nextA=simT+0.35+Math.random()*0.75;
    }
  }else if(caseId==='sastop'){
    if(inArrest){ /* 窦性停搏：无人点火 */ }
    else if(simT>=nextSA)emitP(),nextSA=simT+(60/ownRate)*(0.96+Math.random()*0.08);
    if(simT>=phaseEnd){
      if(inArrest){inArrest=false;phaseEnd=simT+6;nextSA=simT+0.05;}
      else{inArrest=true;phaseEnd=simT+3;}             // 停 3 秒
    }
  }else{
    if(simT>=nextSA)emitP(),nextSA=simT+(60/ownRate)*(0.96+Math.random()*0.08);
  }
  /* --- 房室传导 --- */
  if(aPend!==null&&simT>=aPend){aPend=null;emitQRS(false);}
  /* --- 起搏器决策 --- */
  if(mode==='VVI'||caseId==='af'){
    if(demandOn){if(simT-tLastV>=LRI)paceV();}
    else{if(simT-tLastPace>=LRI)paceV();}              // 固定频率:竞争心律
  }else{ /* DDD */
    if(simT-tLastA>=LRI)paceA();                       // 窦停→心房起搏
    if(vPend!==null&&simT>=vPend){vPend=null;if(simT-tLastV>=0.15)paceV();}
  }
  ronTmsg=Math.max(0,ronTmsg-dt);
  if(events.length>500)events.splice(0,events.length-500);   // 只保留近 8 s 事件
}

/* ============ 3D 心脏 ============ */
const heartM=new THREE.MeshPhysicalMaterial({color:0x8c2f39,roughness:0.45,transmission:0,transparent:true,opacity:0.92});
const heartM2=new THREE.MeshPhysicalMaterial({color:0xa63a46,roughness:0.5,transparent:true,opacity:0.9});
const atrium=new THREE.Mesh(new THREE.SphereGeometry(0.95,32,24),heartM2);
atrium.position.set(0,1.75,-0.2);atrium.scale.set(1.15,0.9,1);scene.add(atrium);
const ventricle=new THREE.Mesh(new THREE.SphereGeometry(1.35,36,28),heartM);
ventricle.position.set(0,-0.35,0);ventricle.scale.set(1,1.18,0.95);scene.add(ventricle);
const aorta=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.38,1.4,16),
  new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.4,metalness:0.3}));
aorta.position.set(-0.6,2.9,-0.2);aorta.rotation.z=0.3;scene.add(aorta);

/* 起搏器壳体 + 双腔电极 */
const devG=new THREE.Group();devG.position.set(3.1,3.3,0.8);scene.add(devG);
devG.add(new THREE.Mesh(new THREE.BoxGeometry(1.0,0.72,0.3),
  new THREE.MeshStandardMaterial({color:0x2b3138,roughness:0.35,metalness:0.55})));
const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),
  new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:0.4}));
lamp.position.set(0.28,0.18,0.17);devG.add(lamp);
function leadCurve(tg){
  const s=new THREE.Vector3(3.1,3.3,0.8);
  const t=new THREE.Vector3(tg[0],tg[1],tg[2]);   // tg 是数组,先转 Vector3
  return new THREE.CatmullRomCurve3([s,
    new THREE.Vector3(s.x*0.7,(s.y+t.y)/2+0.9,(s.z+t.z)/2),
    new THREE.Vector3(t.x*0.6+0.8,t.y+0.7,t.z*0.7),
    t]);
}
const atrTgt=[-0.3,2.5,-0.2],venTgt=[0,-1.5,0.3];
const leadA=new THREE.Mesh(new THREE.TubeGeometry(leadCurve(atrTgt),40,0.035,8),
  new THREE.MeshStandardMaterial({color:0xc9a227,roughness:0.4,metalness:0.6}));
const leadV=new THREE.Mesh(new THREE.TubeGeometry(leadCurve(venTgt),40,0.04,8),
  new THREE.MeshStandardMaterial({color:0xc9a227,roughness:0.4,metalness:0.6}));
scene.add(leadA,leadV);
const elecA=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),
  new THREE.MeshStandardMaterial({color:0xffe08a,emissive:0xf5b942,emissiveIntensity:0.3}));
elecA.position.set(...atrTgt);scene.add(elecA);
const elecV=elecA.clone();elecV.position.set(...venTgt);scene.add(elecV);

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('窦房结：总指挥(房颤时人人乱发)','SA node: the conductor (chaos in AF)'),new THREE.Vector3(0.9,2.8,-0.2),'b');
addLabel(()=>L('起搏器：锂碘电池 · 脉冲 2.5 V / 0.5 ms','pulse generator: Li-I battery · 2.5 V / 0.5 ms'),new THREE.Vector3(0,0.75,0),'o',()=>true,devG);
addLabel(()=>L('心室电极：钉一下,夺获,立刻收缩','ventricular lead: spike, capture, contract at once'),new THREE.Vector3(0,-1.9,0.3),'r');
let condText='';
const statLbl=addLabel(()=>condText,new THREE.Vector3(0,4.6,0),'r');

/* ============ ECG 绘制 ============ */
const plotCv=el('plotCv');
function drawECG(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const T=6,t1=simT,t0=t1-T,y0=H*0.62,sc=H*0.3;
  /* 网格 */
  ctx.strokeStyle='rgba(128,150,170,.18)';
  for(let i=0;i<=T;i++){const x=i/T*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
  ctx.fillStyle=cTxt;ctx.font='18px system-ui';
  ctx.fillText(L('1 格 = 1 s','1 div = 1 s'),8,20);
  /* 波形 */
  const evs=events.filter(e=>e.t>t0-0.8&&e.t<=t1);
  ctx.strokeStyle=acc;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=0;x<=W;x+=2){
    const t=t0+x/W*T;let v=0;
    if(caseId==='af')v+=0.045*Math.sin(t*40)+0.03*Math.sin(t*63+1.7);   // 房颤基线
    for(const e of evs){
      const d=t-e.t;
      if(e.k==='P')v+=0.16*G(d,0,0.025);
      else if(e.k==='Qn')v+=1.0*G(d,0,0.012)-0.24*G(d,0.032,0.016)-0.1*G(d,-0.02,0.009)+0.3*G(d,0.26,0.05);
      else if(e.k==='Qw')v+=0.85*G(d,0.01,0.035)-0.22*G(d,0.3,0.06);
    }
    const y=y0-v*sc;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();ctx.lineWidth=1;
  /* 起搏钉(竖线) + 感知/起搏标记 */
  for(const e of evs){
    const x=(e.t-t0)/T*W;
    if(e.k==='S'||e.k==='Sa'){
      const h=e.k==='S'?1.15:0.7;
      ctx.strokeStyle=acc;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0-h*sc);ctx.stroke();ctx.lineWidth=1;
    }else if(e.k==='Qn'){
      ctx.fillStyle='#51cf66';ctx.beginPath();ctx.arc(x,14,4.5,0,Math.PI*2);ctx.fill();
    }else if(e.k==='Qw'){
      ctx.fillStyle=acc;ctx.fillRect(x-4,9,8,10);
    }
  }
  /* R-on-T 红闪 */
  if(ronTmsg>0&&Math.floor(ronTmsg*6)%2===0){
    ctx.fillStyle='rgba(255,80,70,.16)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff6b6b';ctx.font='bold 20px system-ui';
    ctx.fillText(L('R-on-T! 钉落在 T 波上(易诱发室颤)','R-on-T! spike lands on the T wave'),12,H-14);
  }
}

/* ============ 步骤 ============ */
let camTween=null;
function flyTo(p,t){camTween={p0:camera.position.clone(),p1:new THREE.Vector3(...p),t0:controls.target.clone(),t1:new THREE.Vector3(...t),k:0};}
function setCase(c){caseId=c;resetSim();
  el('cSastop').classList.toggle('on',c==='sastop');
  el('cAvb').classList.toggle('on',c==='avb');
  el('cAf').classList.toggle('on',c==='af');}
function setMode(m){mode=m;
  el('mVVI').classList.toggle('on',m==='VVI');
  el('mDDD').classList.toggle('on',m==='DDD');}
const STEPS=[
  {zh:'正常点火：窦房结→心房(P 波)→房室结延迟 0.18 s→心室(QRS)——房室同步',
   en:'Normal firing: SA node → atrium (P) → AV delay 0.18 s → ventricle (QRS)',
   act:()=>{setCase('sinus');setMode('VVI');flyTo([3.2,2.6,9.5],[0,1.1,0]);}},
  {zh:'故障：三度房室阻滞——P 波齐发却不下传,心室没人点火(起搏器接管)',
   en:'Failure: 3rd-degree AVB — P waves march on but never reach the ventricle',
   act:()=>{setCase('avb');flyTo([2,3,7.5],[0,1.4,0]);}},
  {zh:'夺获：2–5 V、0.4–1.5 ms 脉冲,阈值以上必然起搏——钉一下,心室立刻收缩(宽 QRS)',
   en:'Capture: 2–5 V, 0.4–1.5 ms above threshold always fires — spike, then instant wide QRS',
   act:()=>{setCase('sastop');lowerRate=50;el('sLower').value=50;syncUI();flyTo([2.5,2,6.5],[0.5,0.8,0]);}},
  {zh:'按需模式：自身窦率调到 95 > 起搏下限 60 → 每跳都被感知,全程抑制不发',
   en:'Demand mode: sinus 95 > lower rate 60 → every beat sensed, fully inhibited',
   act:()=>{setCase('sinus');ownRate=95;el('sOwn').value=95;lowerRate=60;el('sLower').value=60;syncUI();}},
  {zh:'DDD 双腔：心房感知-心室跟踪——每个 P 后固定 AV 间期补一钉,房室同步恢复',
   en:'DDD dual chamber: atrial sense, ventricular track — a paced QRS after every P at fixed AV delay',
   act:()=>{setCase('avb');setMode('DDD');}},
  {zh:'注脚：关掉按需=固定频率竞争心律,钉落在 T 波=R-on-T 危险;房颤时 DDD 自动模式转换;磁铁模式转固定频率,电池约 8–12 年',
   en:'Footnotes: demand off = competition, R-on-T risk; AF triggers mode switch; magnet mode = fixed rate; battery 8–12 yr',
   act:()=>{setCase('af');setMode('VVI');demandOn=false;el('tglDemand').checked=false;}},
];
let activeStep=0;
function buildSteps(){
  const ol=el('steps');ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const zh2=s.zh.split('：'),en2=s.en.split(':');
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(zh2[0],en2[0])}</b>　${L(zh2.slice(1).join('：'),en2.slice(1).join(':'))}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    ol.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ 主题 / 语言 / UI ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncUI();setPlayLabel();
}
function syncUI(){
  el('sLowerVal').textContent=lowerRate+' ppm';
  el('sOwnVal').textContent=ownRate+' bpm';
}
function setPlayLabel(){el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function updateStats(){
  let hr=0;
  if(vTimes.length>=3){
    let s=0;for(let i=1;i<vTimes.length;i++)s+=vTimes[i]-vTimes[i-1];
    hr=60/(s/(vTimes.length-1));
  }
  el('stHR').innerHTML=hr?hr.toFixed(0)+'<small> bpm</small>':'—';
  const tot=nPaced+nSensed;
  const frac=tot?nPaced/tot*100:0;
  el('stPace').innerHTML=frac.toFixed(0)+'<small> %</small>';
  el('stPace').className='v '+(frac>90?'warn':'ok');
  el('stSense').textContent=nSensed;
  el('stBat').innerHTML=(11-6*frac/100).toFixed(1)+'<small> 年</small>';
  drawECG();
  /* 状态条 */
  condText=ronTmsg>0?L('R-on-T 竞争心律！','R-on-T competition!')
    :caseId==='sastop'&&inArrest?L('窦性停搏！起搏脉冲夺获心室','SA arrest! paced capture')
    :caseId==='avb'?L('三度 AVB：P 波不下传','3rd-degree AVB: P waves blocked')
    :caseId==='af'?L('房颤：无序房波,模式转换','AF: chaotic atria, mode switched')
    :simT-tLastV<1&&nPaced===0?L('按需抑制:自身心跳足够','demand inhibited: own rhythm suffices')
    :L('窦性心律','sinus rhythm');
}
el('cSastop').addEventListener('click',()=>setCase('sastop'));
el('cAvb').addEventListener('click',()=>setCase('avb'));
el('cAf').addEventListener('click',()=>setCase('af'));
el('mVVI').addEventListener('click',()=>setMode('VVI'));
el('mDDD').addEventListener('click',()=>setMode('DDD'));
el('sLower').addEventListener('input',e=>{lowerRate=+e.target.value;syncUI();});
el('sOwn').addEventListener('input',e=>{ownRate=+e.target.value;syncUI();});
el('tglDemand').addEventListener('change',e=>{demandOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
let labelsOn=qs.get('labels')!=='0';
if(!labelsOn)el('tglLabels').checked=false;

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,accT=0,aEnv=0,vEnv=0,aFlash=0,vFlash=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*speedMul*(playing?1:0);
  if(dt>0){
    tick(dt);
    /* 收缩包络衰减 */
    aEnv=Math.max(0,aEnv-dt*4);vEnv=Math.max(0,vEnv-dt*3.2);
    aFlash=Math.max(0,aFlash-dt*8);vFlash=Math.max(0,vFlash-dt*8);
    /* 房颤:心房颤动 */
    const quiver=caseId==='af'?0.03*Math.sin(simT*42):0;
    atrium.scale.set(1.15*(1-0.06*aEnv+quiver),0.9*(1-0.06*aEnv),1);
    ventricle.scale.set(1-0.15*vEnv,1.18*(1-0.15*vEnv),0.95*(1-0.13*vEnv));
    lamp.material.emissiveIntensity=0.4+aFlash*3+vFlash*3;
    lamp.material.color.setHex(vFlash>0.3?0xffa94d:0x51cf66);
    elecA.material.emissiveIntensity=0.3+aFlash*4;
    elecV.material.emissiveIntensity=0.3+vFlash*4;
  }
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.4);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(camTween.k>=1)camTween=null;
  }
  accT+=dt0;if(accT>0.1){accT=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
applyTheme();
applyLang();
setCase('sastop');
setMode('VVI');
syncUI();
setPlayLabel();
start();
</script>
