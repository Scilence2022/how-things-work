<head>

<title>快速傅里叶变换 · 蝶形电路</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.01,500);
camera.position.set(0,8,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=200;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.9));
const keyL=new THREE.DirectionalLight(0xffffff,0.8);keyL.position.set(4,8,6);scene.add(keyL);

/* 蝶形图尺寸：列=级，行=下标。MAXN=1024 时共 11 列 × 1024 节点，预分配一次 */
const MAXN=1024,MAXC=11;
const H=13;                 // 行方向总高
let N=8,S=3,dx=2.1,dy=H/N,nodeR=0.14;
let stageRe=[],stageIm=[],colMax=[],sigRe=null;
let sig='sine',playing=true,p=0,speedK=1,bitrevOn=false,spectrumFocus=false,labelsOn=true;

/* ============ 信号与逐级 FFT 快照（真实 radix-2 运算） ============ */
function genSignal(){
  const re=new Float64Array(N);
  for(let i=0;i<N;i++){
    const t=i/N;
    if(sig==='sine') re[i]=Math.sin(2*Math.PI*5.2*t)+0.5*Math.sin(2*Math.PI*13.7*t+0.7);
    else if(sig==='square'){for(let k=1;k<=9;k+=2)re[i]+=4/Math.PI/k*Math.sin(2*Math.PI*k*3*t);}
    else if(sig==='impulse') re[i]=(i===(N>>2))?1:0;
    else re[i]=Math.sin(2*Math.PI*(2*t+(N/16-2)/2*t*t)); // 线性啁啾 f0=2 → N/16
  }
  return re;
}
function runFFT(re){
  /* 位倒位序置换 + 每跑完一级快照一次，得到 0..S 列的真实中间值 */
  const a=Float64Array.from(re),b=new Float64Array(N);
  for(let i=1,j=0;i<N;i++){
    let bit=N>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){const t=a[i];a[i]=a[j];a[j]=t;}
  }
  stageRe=[];stageIm=[];colMax=[];
  const snap=()=>{
    stageRe.push(Float32Array.from(a));stageIm.push(Float32Array.from(b));
    let m=1e-9;for(let i=0;i<N;i++)m=Math.max(m,Math.abs(a[i]),Math.abs(b[i]));
    colMax.push(m);
  };
  snap();
  for(let len=2;len<=N;len<<=1){
    const half=len>>1,ang=-2*Math.PI/len;
    for(let i=0;i<N;i+=len)for(let k=0;k<half;k++){
      const wr=Math.cos(ang*k),wi=Math.sin(ang*k);
      const j=i+k,j2=j+half;
      const xr=a[j2]*wr-b[j2]*wi,xi=a[j2]*wi+b[j2]*wr;
      a[j2]=a[j]-xr;b[j2]=b[j]-xi;a[j]=a[j]+xr;b[j]=b[j]+xi;
    }
    snap();
  }
}
const bitRev=i=>{let r=0,x=i;for(let b=1;b<N;b<<=1){r=(r<<1)|(x&1);x>>=1;}return r;};

/* ============ 3D：节点 / 连线 / 高亮 / 倒位序透视 ============ */
const sphereGeo=new THREE.SphereGeometry(1,8,6);
const nodeIM=new THREE.InstancedMesh(sphereGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0.96}),MAXN*MAXC);
nodeIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
nodeIM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAXN*MAXC*3),3);
nodeIM.frustumCulled=false;
{const zm=new THREE.Matrix4().makeScale(0,0,0);for(let i=0;i<MAXN*MAXC;i++)nodeIM.setMatrixAt(i,zm);nodeIM.instanceMatrix.needsUpdate=true;}
scene.add(nodeIM);

/* 连线：每级最多 N 条段（N/2 蝶形 × 2），S 级共 ≤ 10N */
const maxSegs=(MAXC-1)*MAXN;
const linePos=new Float32Array(maxSegs*6),lineCol=new Float32Array(maxSegs*6);
const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3).setUsage(THREE.DynamicDrawUsage));
lineGeo.setAttribute('color',new THREE.BufferAttribute(lineCol,3).setUsage(THREE.DynamicDrawUsage));
const lines=new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.5}));
lines.frustumCulled=false;scene.add(lines);

/* 当前正在流动的一级：亮黄色高亮 */
const hlPos=new Float32Array(MAXN*6);
const hlGeo=new THREE.BufferGeometry();
hlGeo.setAttribute('position',new THREE.BufferAttribute(hlPos,3).setUsage(THREE.DynamicDrawUsage));
const hlLines=new THREE.LineSegments(hlGeo,new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.95}));
hlLines.frustumCulled=false;scene.add(hlLines);

/* 倒位序透视：自然顺序桩列 → 倒位序输入列 */
const stubIM=new THREE.InstancedMesh(sphereGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0.9}),MAXN);
stubIM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAXN*3),3);
stubIM.frustumCulled=false;stubIM.visible=false;
{const zm=new THREE.Matrix4().makeScale(0,0,0);for(let i=0;i<MAXN;i++)stubIM.setMatrixAt(i,zm);}
scene.add(stubIM);
const brPos=new Float32Array(MAXN*6),brCol=new Float32Array(MAXN*6);
const brGeo=new THREE.BufferGeometry();
brGeo.setAttribute('position',new THREE.BufferAttribute(brPos,3));
brGeo.setAttribute('color',new THREE.BufferAttribute(brCol,3));
const brLines=new THREE.LineSegments(brGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.6}));
brLines.frustumCulled=false;brLines.visible=false;scene.add(brLines);

const grid=new THREE.GridHelper(40,40,0x2a3340,0x1c232c);
grid.position.y=-H/2-1.5;scene.add(grid);

/* ============ 坐标与标签 ============ */
const xOf=c=>(c-S/2)*dx;
const yOf=i=>(i-(N-1)/2)*dy;
const labelReg=[];
let colLbls=[];
function addLabel(textFn,pos,cls='',vis=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis});div.textContent=textFn();return o;
}
function clearColLbls(){for(const o of colLbls){o.element.remove();scene.remove(o);}colLbls=[];}
function rebuildColLbls(){
  clearColLbls();
  for(let c=0;c<=S;c++){
    const t=c===0?L('输入 · 倒位序','input · bit-reversed'):c===S?L('输出 |X[k]| · 频谱','output |X[k]| · spectrum'):L(`第 ${c} 级 · ${1<<c} 点块`,`stage ${c} · ${1<<c}-blocks`);
    colLbls.push(addLabel(()=>t,new THREE.Vector3(xOf(c),H/2+1.3,0),'b'));
  }
  colLbls.push(addLabel(()=>bitrevOn?L('左列=自然顺序 0…N-1，线连到倒位序的进站位置','left = natural order, wires go to bit-reversed slots'):L('',''),
    new THREE.Vector3(xOf(0)-dx*1.4,H/2+2.6,0),'o',()=>bitrevOn));
  colLbls.push(addLabel(()=>spectrumFocus?L('脉冲的谱是平的——所有频率等量（白色谱）','an impulse has a flat spectrum'):L('',''),
    new THREE.Vector3(xOf(S),-H/2-0.8,0),'g',()=>spectrumFocus));
}

/* ============ 重建（N 或信号变化） ============ */
function rebuild(){
  N=1<<+document.getElementById('sN').value;
  S=Math.log2(N);dx=N<=32?2.2:N<=128?2.1:2.0;dy=H/N;
  nodeR=clamp(dy*0.42,0.0045,0.15);
  sigRe=genSignal();runFFT(sigRe);
  fillAllLines();rebuildStub();rebuildColLbls();
  p=0;spectrumFocus=false;lastC0=-1;
  document.getElementById('sNVal').textContent=String(N);
}
function fillAllLines(){
  let off=0;
  for(let t=1;t<=S;t++){
    const half=1<<(t-1),x0=xOf(t-1),x1=xOf(t);
    for(let i=0;i<N;i+=1<<t)for(let k=0;k<half;k++){
      const a=i+k,b=a+half,y0=yOf(a),y1=yOf(b);
      const cr=new THREE.Color().setHSL(0.05+0.55*(k/half),0.72,0.55);
      const carr=[cr.r,cr.g,cr.b];
      const g=[0.20,0.25,0.31];
      /* 两条交叉线：蝶形的 X */
      const seg=(ya,yb)=>{
        linePos[off*6]=x0;linePos[off*6+1]=ya;linePos[off*6+2]=0;
        linePos[off*6+3]=x1;linePos[off*6+4]=yb;linePos[off*6+5]=0;
        for(let v=0;v<3;v++){lineCol[off*6+v]=g[v];lineCol[off*6+3+v]=carr[v];}
        off++;
      };
      seg(y0,y1);seg(y1,y0);
    }
  }
  lineGeo.setDrawRange(0,off*2);
  lineGeo.attributes.position.needsUpdate=true;
  lineGeo.attributes.color.needsUpdate=true;
  segTotal=off;
}
let segTotal=0;
function updateHL(){
  const t=Math.floor(p)+1;
  if(t<1||t>S){hlLines.visible=false;return;}
  hlLines.visible=true;
  const half=1<<(t-1),x0=xOf(t-1),x1=xOf(t);let n=0;
  for(let i=0;i<N;i+=1<<t)for(let k=0;k<half;k++){
    const a=i+k,b=a+half,y0=yOf(a),y1=yOf(b);
    hlPos[n*6]=x0;hlPos[n*6+1]=y0;hlPos[n*6+2]=0;hlPos[n*6+3]=x1;hlPos[n*6+4]=y1;hlPos[n*6+5]=0;
    hlPos[n*6+6]=x0;hlPos[n*6+7]=y1;hlPos[n*6+8]=0;hlPos[n*6+9]=x1;hlPos[n*6+10]=y0;hlPos[n*6+11]=0;
    n+=2;
  }
  hlGeo.setDrawRange(0,n);
  hlGeo.attributes.position.needsUpdate=true;
}
function rebuildStub(){
  const xs=xOf(0)-dx*1.35;
  const dummy=new THREE.Object3D();
  for(let j=0;j<MAXN;j++){
    if(j<N&&sigRe){
      const v=sigRe[j],t=Math.min(1,Math.abs(v)/colMax[0]);
      dummy.position.set(xs,yOf(j),0);dummy.scale.setScalar(nodeR*(0.2+0.8*t));
      const c=v>=0?new THREE.Color(1,0.65,0.3):new THREE.Color(0.45,0.75,0.99);
      stubIM.setColorAt(j,c);
    }else{dummy.position.set(0,-999,0);dummy.scale.setScalar(0.0001);stubIM.setColorAt(j,new THREE.Color(0,0,0));}
    dummy.updateMatrix();stubIM.setMatrixAt(j,dummy.matrix);
  }
  stubIM.instanceMatrix.needsUpdate=true;stubIM.instanceColor.needsUpdate=true;
  let n=0;
  for(let j=0;j<N;j++){
    const br=bitRev(j);
    brPos[n*6]=xs;brPos[n*6+1]=yOf(j);brPos[n*6+2]=0;
    brPos[n*6+3]=xOf(0);brPos[n*6+4]=yOf(br);brPos[n*6+5]=0;
    for(let v=0;v<6;v++)brCol[n*6+v]=0.9;
    n++;
  }
  brGeo.setDrawRange(0,n*2);
  brGeo.attributes.position.needsUpdate=true;brGeo.attributes.color.needsUpdate=true;
}

/* ============ 每帧重绘节点列（≤11264 实例，直接全刷） ============ */
const dummy=new THREE.Object3D(),colC=new THREE.Color();
const C_POS=new THREE.Color(1,0.65,0.30),C_NEG=new THREE.Color(0.45,0.75,0.99);
const C_LO=new THREE.Color(0.35,0.55,0.95),C_HI=new THREE.Color(1.0,0.66,0.30);
const C_EMPTY=new THREE.Color(0.22,0.26,0.31);
function drawColumns(){
  const c0=Math.min(Math.floor(p+1e-9),S),f=clamp(p-c0,0,1);
  for(let c=0;c<=S;c++){
    let ar,ai,m,settled=true;
    if(c<=c0){ar=stageRe[c];ai=stageIm[c];m=colMax[c];}
    else if(c===c0+1&&c<=S){
      /* 正在流动的一列：在上一级快照与本级快照之间插值 */
      ar=new Float32Array(N);ai=new Float32Array(N);settled=false;
      const a0=stageRe[c0],b0=stageIm[c0],a1=stageRe[c],b1=stageIm[c];
      for(let i=0;i<N;i++){ar[i]=a0[i]+(a1[i]-a0[i])*f;ai[i]=b0[i]+(b1[i]-b0[i])*f;}
      m=Math.max(colMax[c0],colMax[c]);
    }else{ar=null;ai=null;m=1;}
    const x=xOf(c);
    for(let i=0;i<N;i++){
      const idx=c*MAXN+i;
      if(ar){
        const mag=Math.hypot(ar[i],ai[i]);
        const tt=Math.min(1,mag/m);
        dummy.position.set(x,yOf(i),0);
        dummy.scale.setScalar(nodeR*(0.18+0.82*Math.sqrt(tt)));
        dummy.updateMatrix();nodeIM.setMatrixAt(idx,dummy.matrix);
        if(c===0||c===S)colC.copy(ar[i]>=0?C_POS:C_NEG);
        else colC.copy(C_LO).lerp(C_HI,tt);
      }else{
        dummy.position.set(x,yOf(i),0);
        dummy.scale.setScalar(nodeR*0.18);
        dummy.updateMatrix();nodeIM.setMatrixAt(idx,dummy.matrix);
        colC.copy(C_EMPTY);
      }
      nodeIM.setColorAt(idx,colC);
    }
  }
  nodeIM.instanceMatrix.needsUpdate=true;
  nodeIM.instanceColor.needsUpdate=true;
}

/* ============ 统计 / 公式 / 步骤 ============ */
const fftOps=()=>N*Math.log2(N);        // 教科书口径：每蝶形按 1 乘 2 加共 N·log₂N 次运算，乘法严格为 (N/2)·log₂N
const elN=document.getElementById('stN'),elB=document.getElementById('stB'),
      elD=document.getElementById('stDft'),elF=document.getElementById('stFft');
function updateStats(){
  const pc=Math.round(clamp(p/S,0,1)*100);
  elN.innerHTML=N+'<small> · '+pc+'%</small>';
  elB.innerHTML=fmt(N/2*S)+'<small> 只</small>';
  elD.innerHTML=fmt(clamp(p/S,0,1)*N*N);
  elF.innerHTML=fmt(clamp(p/S,0,1)*fftOps());
}
const formulaEl=document.getElementById('formula');
function updateFormula(){
  let h=`DFT 复数乘法 N² = <b>${fmt(N*N)}</b> · FFT N·log₂N = <b>${fmt(fftOps())}</b>（蝶形 ${fmt(N/2*S)} 只，乘法严格为 (N/2)·log₂N）<br>`;
  if(Math.abs(p-S)<1e-6){
    let e=0;for(let i=0;i<N;i++)e+=stageRe[S][i]*stageRe[S][i]+stageIm[S][i]*stageIm[S][i];
    const mags=Array.from(stageRe[S],(v,i)=>Math.hypot(v,stageIm[S][i])).sort((a,b)=>b-a);
    let e3=0;for(let i=0;i<3&&i<N;i++)e3+=mags[i]*mags[i];
    h+=sig==='impulse'
      ?L('脉冲谱平坦：能量摊在所有频点','impulse spectrum is flat: energy spread over all bins')
      :L(`前 3 个频点占能量 <b>${(100*e3/e).toFixed(1)}%</b> —— 信号就藏在这几个频率里`,`top 3 bins hold <b>${(100*e3/e).toFixed(1)}%</b> of the energy`);
  }else h+=L('拖「规模 N」到 1024，看两个计数器的终局比分 1,048,576 vs 10,240','slide N to 1024 for the final score 1,048,576 vs 10,240');
  formulaEl.innerHTML=h;
}
const STEPS=[
  {zh:'直接算 DFT：每个输出点都要与全部 N 个样本做复数乘法，共 N² 次',en:'Naive DFT: every output needs N complex multiplies — N² in total',
   act:()=>{p=0;playing=false;}},
  {zh:'偶奇劈半：把序列按下标奇偶劈成两半递归，劈到底输入顺序就是二进制倒序',en:'Even/odd split recursively; the shuffled entry order is bit-reversal',
   act:()=>{p=0;playing=false;bitrevOn=true;syncBitrev();}},
  {zh:'蝶形第一级：相邻两两合并，W⁰=1，只是加减',en:'First stage: adjacent pairs merge, W⁰=1 — just add/subtract',
   act:()=>{p=1;playing=false;bitrevOn=false;syncBitrev();}},
  {zh:'逐级合并：旋转因子 W_N^k 把两半拼回去，每级 N/2 只蝴蝶',en:'Stages merge with twiddle W_N^k: N/2 butterflies per stage',
   act:()=>{p=2.5;playing=false;}},
  {zh:'走完全程：log₂N 级 × 每级 N 次运算 → O(N log N)',en:'Full sweep: log₂N stages × N ops → O(N log N)',
   act:()=>{p=0;playing=true;}},
  {zh:'频谱出炉：输出 |X[k]| 就是信号的频率成分',en:'Spectrum out: |X[k]| are the frequency ingredients',
   act:()=>{p=S;playing=false;spectrumFocus=true;}},
  {zh:'计数器赛跑：N=1024 时 1,048,576 vs 10,240',en:'The race at N=1024: 1,048,576 vs 10,240',
   act:()=>{document.getElementById('sN').value=10;rebuild();speedK=2;
     document.getElementById('sSpd').value=200;document.getElementById('sSpdVal').textContent='2.0×';
     p=0;playing=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;STEPS[i].act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ UI ============ */
function syncBitrev(){stubIM.visible=bitrevOn;brLines.visible=bitrevOn;}
const sigBtns={sigSine:'sine',sigSquare:'square',sigImpulse:'impulse',sigChirp:'chirp'};
for(const [id,s] of Object.entries(sigBtns)){
  document.getElementById(id).addEventListener('click',()=>{
    sig=s;Object.keys(sigBtns).forEach(k=>document.getElementById(k).classList.toggle('on',k===id));
    rebuild();updateFormula();
  });
}
document.getElementById('sN').addEventListener('input',()=>{rebuild();updateFormula();});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('btnStep').addEventListener('click',()=>{p=Math.min(S,Math.floor(p)+1);playing=false;});
document.getElementById('btnRerun').addEventListener('click',()=>{p=0;playing=true;spectrumFocus=false;});
document.getElementById('btnBitrev').addEventListener('click',()=>{
  bitrevOn=!bitrevOn;syncBitrev();
  document.getElementById('btnBitrev').classList.toggle('on',bitrevOn);
  if(bitrevOn){playing=false;p=0;}
});
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{playing=!playing;playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  rebuildColLbls();buildSteps();updateFormula();
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0,lastC0=-1;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    p+=dt*speedK/1.1;
    if(p>=S+0.8)p=0;
  }
  drawColumns();updateHL();
  acc+=dt;if(acc>0.1){acc=0;updateStats();updateFormula();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化（URL 参数） ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')){document.getElementById('sSpd').value=qs.get('speed');speedK=+qs.get('speed')/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}
applyTheme();applyLang();rebuild();updateFormula();start();
</script>
