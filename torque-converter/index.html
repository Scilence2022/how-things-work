<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液力变矩器 · 用油把扭矩软接过去</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(25,113,194,.55); background: rgba(25,113,194,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #cde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="液力变矩器 · 用油把扭矩软接过去" data-en="Torque Converter · Passing Torque Through Oil">液力变矩器 · 用油把扭矩软接过去</h1>
  <div class="sub" data-zh="泵轮随发动机旋转,把 ATF 油甩向外缘、沿循环圆推动涡轮——软连接让 700 rpm 怠速蠕行、不熄火;失速时涡轮刹停,回流被导轮重新导向,反作用扭矩叠加输出,变矩比 K₀≈2.1、效率 0% 全变热;涡轮加速后油流角变缓,e≈0.9 耦合点导轮单向离合器空转、K=1;锁止离合器吸合后滑差归零,变回 ~99% 效率的硬连接 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The pump spins with the engine and flings ATF oil around the torus into the turbine — a soft link that idles and creeps without stalling; at stall the turbine is held, the stator redirects the return flow and its reaction torque multiplies output, K₀≈2.1 at 0% efficiency (all heat); as the turbine spools up the flow angle softens — at e≈0.9 the stator freewheels and K=1; engage the lockup clutch and slip drops to zero, a ~99%-efficient hard link · 3D interactive demo · drag to orbit · Space = run/pause">液力变矩器 · 用油把扭矩软接过去</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="泵轮转速" data-en="Pump speed">泵轮转速</span><span class="v" id="stPump">—</span>
  <span class="k" data-zh="涡轮转速" data-en="Turbine speed">涡轮转速</span><span class="v" id="stTurb">—</span>
  <span class="k" data-zh="变矩比 K" data-en="Torque ratio K">变矩比 K</span><span class="v" id="stK">—</span>
  <span class="k" data-zh="效率 η" data-en="Efficiency η">效率 η</span><span class="v" id="stEff">—</span>
  <span class="k" data-zh="导轮" data-en="Stator">导轮</span><span class="v" id="stStator">—</span>
  <span class="k" data-zh="锁止离合器" data-en="Lockup">锁止离合器</span><span class="v" id="stLock">—</span>
</div>

<div id="plot">
  <h3 data-zh="变矩器性能曲线:变矩比 K 从 2.1 斜降至 1(左轴),效率 η=K·e 抛物线爬升(右轴),虚线为耦合点;动点=当前工况" data-en="Converter map: torque ratio K falls 2.1→1 (left axis), efficiency η=K·e climbs a parabola (right); dashed line marks the coupling point; the dot is the current operating point">变矩器性能曲线:变矩比 K 从 2.1 斜降至 1(左轴),效率 η=K·e 抛物线爬升(右轴),虚线为耦合点;动点=当前工况</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="橙:泵轮加速油流" data-en="orange: pump accelerates oil">橙:泵轮加速油流</span>
    <span class="chip.r" data-zh="红:高速射流(失速冲击)" data-en="red: high-speed jet (stall impact)">红:高速射流(失速冲击)</span>
    <span class="chip.g" data-zh="绿:导轮回流助推" data-en="green: stator return-boost">绿:导轮回流助推</span>
    <span class="chip.b" data-zh="蓝:涡轮与平顺耦合" data-en="blue: turbine & smooth coupling">蓝:涡轮与平顺耦合</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnLock" data-zh="锁止离合器(吸合/放开)" data-en="Lockup clutch (engage/release)">锁止离合器(吸合/放开)</button>
    <button class="abtn brk" id="btnStall" data-zh="失速测试(刹住涡轮)" data-en="Stall test (hold turbine)">失速测试(刹住涡轮)</button>
  </div>
  <div class="row"><label data-zh="发动机转速" data-en="Engine speed">发动机转速</label><input id="sEng" type="range" min="600" max="6000" step="100" value="2200"><span class="val" id="sEngVal">2200 rpm</span></div>
  <div class="row"><label data-zh="输出负载" data-en="Output load">输出负载</label><input id="sLoad" type="range" min="0" max="100" step="1" value="35"><span class="val" id="sLoadVal">35 %</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglFlow" type="checkbox" checked> <span data-zh="油流粒子" data-en="Oil flow">油流粒子</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../clutch-gearbox/" data-zh="离合器与变速箱:摩擦片的渐接" data-en="clutch & gearbox: friction eases the join">离合器与变速箱:摩擦片的渐接</a>
    <a href="../differential/" data-zh="差速器:转弯时各走各路" data-en="differential: each wheel its own path">差速器:转弯时各走各路</a>
    <a href="../planetary-gears/" data-zh="行星齿轮:AT 的换挡本体" data-en="planetary gears: the automatic's gearset">行星齿轮:AT 的换挡本体</a>
    <a href="../four-stroke-engine/" data-zh="四冲程发动机:扭矩的源头" data-en="four-stroke engine: where the torque comes from">四冲程发动机:扭矩的源头</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const TAU = Math.PI * 2;
const norm2pi = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 16, 56);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x191c22 : 0xb2bec9);
  pedM.color.setHex(dark ? 0x272b31 : 0x8d99a6);
  housingM.color.setHex(dark ? 0x4a525c : 0x9aa7b4);
  bellM.color.setHex(dark ? 0x3d444d : 0x8b98a5);
  coverM.color.setHex(dark ? 0x54606c : 0xa5b1bd);
  fluidM.color.setHex(dark ? 0x8c2420 : 0xc0392b);
  engM.color.setHex(dark ? 0x394049 : 0x98a4b0);
  gbxM.color.setHex(dark ? 0x2e343b : 0x8592a0);
  shaftM.color.setHex(dark ? 0x8a939d : 0x6b7683);
  flyM.color.setHex(dark ? 0x5b636d : 0x9aa7b4);
  pumpM.color.setHex(dark ? 0x3f8fd0 : 0x1971c2);
  turbM.color.setHex(dark ? 0xb8c4cf : 0x7d8a97);
  statM.color.setHex(dark ? 0xcf9a52 : 0xa87b3f);
  ringM.color.setHex(dark ? 0x23272d : 0x6b7683);
  lockM.color.setHex(dark ? 0x6c7680 : 0x53606c);
  ocM.color.setHex(dark ? 0x53442e : 0x6b5a3a);
  const blend = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
  if (pPoints) {
    pPoints.material.blending = blend;
    pPoints.material.opacity = dark ? 0.95 : 0.8;
    pPoints.material.needsUpdate = true;
  }
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('液力变矩器 · 用油把扭矩软接过去', 'Torque Converter · Passing Torque Through Oil');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

/* ================= 工况状态(真实数值) ================= */
const K0 = 2.1;                 // 失速变矩比(真实 1.8-2.5)
const EC = 0.9;                 // 耦合点转速比(真实 ~0.9)
const IT = 1.6;                 // 涡轮系折算惯量 kg·m²
let engRPM = 2200, loadFrac = 35;         // 发动机转速 rpm / 输出负载 %
let Nt = 1200;                            // 涡轮转速 rpm
let curE = 0.5, curK = 1.4, curEff = 0.7; // 转速比 / 变矩比 / 效率
let stallT = 0, lockWanted = false, lockActive = false, statorBoost = true;
let labelsOn = true, flowOn = true, cutOn = true;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let phaseIdx = 0, notifyT = 0, notifyZ = '', notifyE = '', simT = 0, Toil = 82, Ccirc = 0.5;
const pumpTorque = n => clamp(24 * Math.pow(n / 1000, 1.6), 6, 300);   // 泵轮扭矩 N·m
const torqueK = e => e < EC ? 1 + (K0 - 1) * Math.pow(1 - e / EC, 1.15) : 1; // K(e) 特性曲线
const loadTorque = () => 20 + loadFrac * 2.8;                          // 负载扭矩 N·m
const heatKW = () => pumpTorque(engRPM) * engRPM * Math.PI / 30 / 1000; // 失速发热 T·ω

function physics(dt) {
  const Tp = pumpTorque(engRPM);
  const eNat = clamp(Nt / Math.max(engRPM, 1), 0, 1);
  lockActive = lockWanted && stallT <= 0 && eNat > 0.55;
  if (lockActive) {                        // 锁止:硬连接
    Nt = engRPM; curE = 1; curK = 1; curEff = 0.99;
  } else if (stallT > 0) {                 // 失速:涡轮刹停
    Nt = 0; curE = 0; curK = K0; curEff = 0;
  } else {
    const K = torqueK(eNat);
    const Tt = K * Tp * (eNat >= EC ? clamp(1 - (eNat - EC) * 1.5, 0.5, 1) : 1);
    Nt += (Tt - loadTorque()) * 9.5493 / IT * dt;   // dω/dt = (Tt-Tl)/I
    Nt = clamp(Nt, 0, engRPM * 0.985);
    curE = Nt / Math.max(engRPM, 1);
    curK = torqueK(curE);
    curEff = curE < EC ? curK * curE : Math.min(curE, 0.985);
  }
  statorBoost = curK > 1.02;               // 导轮单向离合器是否锁死助推
  stallT = Math.max(0, stallT - dt);
  Ccirc = Math.pow(clamp(1 - curE / EC, 0, 1), 1.15);  // 循环圆内涡流强度
  const tgt = lockActive ? 85 : 80 + 58 * clamp((1 - curE) * (engRPM / 3000), 0, 1.5);
  Toil += (tgt - Toil) * Math.min(1, dt * 0.6);        // ATF 油温
}

/* 叶片:沿管截面弯曲的薄带(带后掠角),真实叶栅的示意化 */
function makeBlade(thetaC, sweep, mat) {
  const uN = 22, pos = [], idx = [];
  for (let v = 0; v <= 1; v++) for (let i = 0; i <= uN; i++) {
    const u = i / uN, ph = lerp(-1.32, 1.32, u);
    const th = thetaC + sweep * (u - 0.5) + (v - 0.5) * 0.05;
    const rq = R + RT * 0.96 * Math.cos(ph);
    pos.push(rq * Math.cos(th), rq * Math.sin(th), RT * 0.96 * Math.sin(ph));
  }
  for (let i = 0; i < uN; i++) { const a = i, b = i + uN + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
function makeBladeRing(th0, th1, n, sweep, mat) {
  const g = new THREE.Group();
  for (let k = 0; k < n; k++) g.add(makeBlade(lerp(th0 + 0.12, th1 - 0.12, k / (n - 1)), sweep, mat));
  return g;
}

/* ---------------- ATF 油粒子(循环圆涡流) ---------------- */
const P_MAX = 900;
const parts = [];
for (let i = 0; i < P_MAX; i++) parts.push({ th: Math.random() * TAU, sd: 0.75 + Math.random() * 0.5, wob: Math.random() * TAU });
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_MAX * 3), pCol = new Float32Array(P_MAX * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({ size: 0.09, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false;
toriGroup.add(pPoints);
const cJet = new THREE.Color(0xff5a4a), cPump = new THREE.Color(0xffa94d), cTurb = new THREE.Color(0x74c0fc), cStat = new THREE.Color(0x8ce99a);
const _pc = new THREE.Color();
/* 涡流路线:泵轮段内圈→外圈,涡轮段外圈→内圈,导轮段贴内圈——与真机循环圆一致 */
function phiOf(th) {
  if (th < 2.094) return (th / 2.094) * Math.PI;          // 涡轮:外→内
  if (th < 4.188) return Math.PI;                          // 导轮:内圈
  return (1 - (th - 4.188) / 2.094) * Math.PI;             // 泵轮:内→外
}
function drawParticles(dt) {
  if (!flowOn) { pPoints.visible = false; return; }
  pPoints.visible = true;
  const vc = 0.35 + 2.9 * Ccirc;
  const wPv = clamp((engRPM / 3000) * 5, 0.5, 11);
  const wTv = wPv * clamp(Nt / Math.max(engRPM, 1), 0, 1);
  const stW = statorBoost ? 0.05 : 0.3 + 0.6 * (1 - Ccirc);
  const pExit = wPv * 1.08 + vc, tExit = wTv * 0.92 + vc, sExit = stW + vc * 1.15;
  for (let i = 0; i < P_MAX; i++) {
    const p = parts[i];
    let th = norm2pi(p.th), v;
    if (th < 2.094) v = lerp(pExit, tExit, Math.min(1, (th / 2.094) * 1.35));        // 涡轮内减速
    else if (th < 4.188) v = lerp(tExit, sExit, Math.min(1, ((th - 2.094) / 2.094) * 1.35));
    else v = lerp(sExit, pExit, (th - 4.188) / 2.094);                                // 泵轮内加速
    p.th = norm2pi(p.th + v * p.sd * dt);
    th = p.th;
    const ph = phiOf(th) + 0.13 * Math.sin(th * 3 + p.wob);
    const rq = R + 0.66 * Math.cos(ph);
    pPos[i * 3] = rq * Math.cos(th);
    pPos[i * 3 + 1] = rq * Math.sin(th);
    pPos[i * 3 + 2] = 0.66 * Math.sin(ph);
    const j = clamp((v - 4.2) / 3.2, 0, 1);                                           // 速度→射流色
    if (th < 2.094) _pc.copy(cTurb).lerp(cJet, j);
    else if (th < 4.188) _pc.copy(cStat);
    else _pc.copy(cPump).lerp(cJet, j);
    pCol[i * 3] = _pc.r; pCol[i * 3 + 1] = _pc.g; pCol[i * 3 + 2] = _pc.b;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

  { b: '泵轮如何泵油:离心甩出建压', be: 'How the pump pumps: centrifugal fling',

    de: 'The pump spins with the engine; blades fling the ATF outward and centrifugal head drives it along the outer leg of the circuit. At 0.18 m radius and 2200 rpm the rim speed is ~41 m/s — oil jets into the turbine with that kinetic energy and returns via the stator along the inner leg.',
    act: () => { flyTo([4.0, -1.4, -5.4], [0, -1.5, -0.9]); } },
  { b: '失速:导轮反咬一口,扭矩放大 2 倍', be: 'Stall: the stator bites back, torque ~2x',
    d: '刹车踩死、涡轮停转(e=0),泵轮全速把油砸向静止叶片,出口油流几乎反向打回;导轮叶片正迎着这股回流,把它捋顺导向泵轮入口,油给导轮反冲力,单向离合器把导轮锁死在壳体上——反作用扭矩直接叠加:T_tur = T_pump + T_stator,失速变矩比 K₀ = 1.8–2.5(本例 2.1),效率 0%,泵轮功率全部变热。',
    de: 'Brakes on, turbine held (e=0): the pump flings oil at frozen blades and the flow rebounds nearly reversed. The stator vanes face this return flow head-on, straighten it toward the pump inlet, and the oil pushes back on the stator — whose one-way clutch anchors it to the case. Reaction torque adds directly: T_tur = T_pump + T_stator; stall ratio K₀ = 1.8-2.5 (2.1 here), efficiency 0%, all pump power becomes heat.',
    act: () => { flyTo([-4.6, 2.6, -5.2], [0.2, 1.3, -1.2]); startStall(); } },
  { b: '涡轮加速:油流角变缓,K 滑向 1', be: 'Turbine spools up: flow softens, K slides to 1',
    d: '涡轮一转起来,出口油流就不再逆向:转速比 e 从 0 升向 0.9,导轮受到的反作用扭矩一路衰减,变矩比沿性能曲线从 2.1 滑向 1;效率 η=K·e 沿抛物线爬升,在 e≈0.7 达到 ~90% 峰值——放大扭矩的代价是转速损失,两者的乘积才是真实效率。',
    de: 'Once the turbine turns, its exit flow no longer opposes the stator: as speed ratio e climbs toward 0.9 the stator reaction decays and K slides down the map from 2.1 to 1. Efficiency η=K·e rides a parabola to ~90% near e≈0.7 — multiplication trades speed for torque, and only the product is real efficiency.',
    act: () => { stallT = 0; loadFrac = 45; flyTo([0.6, 8.0, 6.6], [0, 0, 0]); } },
  { b: '耦合点:导轮空转,变矩器变耦合器', be: 'Coupling point: the stator freewheels',
    d: 'e≈0.9 时油流恰好不再推导轮叶片背面,单向离合器脱开,导轮随油空转;此后 K≡1,变矩器退化为液力耦合器,效率≈e(约 97%),仍有 ~3% 滑差持续发热——这正是长途巡航需要锁止离合器的原因。',
    de: 'At e≈0.9 the flow no longer pushes the stator blades; the one-way clutch releases and the stator freewheels with the oil. Now K≡1: the converter is a fluid coupling, efficiency ≈ e (~97%), with ~3% slip still making heat — exactly why cruising wants a lockup clutch.',
    act: () => { stallT = 0; loadFrac = 12; flyTo([2.4, 1.2, 6.8], [0, -0.2, 1.8]); } },
  { b: '锁止离合器:高速换回硬连接', be: 'Lockup clutch: back to a hard link',
    d: '巡航时 ECU 给涡轮前的湿式多片离合器加压,把泵轮与涡轮直接粘住:滑差归零、效率升到 ~99%、油温下降;起步、大负荷或低速时再自动脱开回到液力工况。软起步、硬巡航——一台变矩器两种性格。',
    de: 'At cruise the ECU presses a wet multi-plate clutch in front of the turbine, bonding pump to turbine: slip drops to zero, efficiency rises to ~99%, oil cools; at launch, heavy load or low speed it releases back to hydraulic drive. Soft launch, hard cruise — two personalities in one unit.',
    act: () => { lockWanted = true; loadFrac = 25; flyTo([-4.8, 1.6, 4.2], [-1.3, 0, 0]); } },
  { b: '与手动离合器对照:两种渐接', be: 'Vs the manual clutch: two ways to ease in',
    d: '手动离合器靠摩擦片半联动打滑缓冲,磨损在固体表面,传递扭矩永远 ≤1 倍;变矩器用油做同样的缓冲、永不因起步磨损,还能在失速区把扭矩放大 2 倍——代价是液力区 3–10% 的滑差损耗。现代 AT 的答案:液力起步 + 行星齿轮换挡 + 锁止巡航。',
    de: 'A manual clutch cushions with a slipping friction disc — wear on solid surfaces, torque transfer never above 1x. A converter cushions with oil, never wears from launches, and multiplies torque ~2x at stall — the price is 3-10% slip loss while hydraulic. The modern automatic: converter launch + planetary gearsets + lockup cruise.',
    act: () => { lockWanted = false; loadFrac = 35; flyTo([8.8, 2.6, 3.0], [0, -0.2, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:K(e) 与 η(e) 特性曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const accC = css.getPropertyValue('--acc').trim() || '#4dabf7';
  const padL = 36, padR = 36, padT = 14, padB = 24;
  const xOf = e => padL + clamp(e, 0, 1) * (W - padL - padR);
  const yOfK = k => (H - padB) - (clamp(k, 1, 2.4) - 1) / 1.4 * (H - padT - padB);
  const yOfE = h => (H - padB) - clamp(h, 0, 1) * (H - padT - padB);
  ctx.font = '12px system-ui';
  /* 网格与坐标 */
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.lineWidth = 1;
  for (const k of [1, 1.7, 2.4]) { ctx.beginPath(); ctx.moveTo(padL, yOfK(k)); ctx.lineTo(W - padR, yOfK(k)); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - padR, padT); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('2.4x', 6, yOfK(2.4) + 4);
  ctx.fillText('1.0x', 6, yOfK(1) + 4);
  ctx.fillText('100%', W - padR + 4, yOfE(1) + 4);
  ctx.fillText('50%', W - padR + 4, yOfE(0.5) + 4);
  ctx.fillText(L('转速比 e →', 'speed ratio e →'), padL + 60, H - padB + 17);
  /* 耦合点虚线 */
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(xOf(EC), padT); ctx.lineTo(xOf(EC), H - padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText(L('耦合点', 'coupling'), xOf(EC) - 18, padT + 12);
  /* K(e) 曲线:失速 2.1 → 耦合点 1.0 → 保持 1 */
  ctx.strokeStyle = accC; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let e = 0; e <= 1.0001; e += 0.02) {
    const px = xOf(e), py = yOfK(torqueK(e));
    e <= 0.001 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* η(e) 曲线:0 → ~90% 峰值 → ~97% */
  ctx.strokeStyle = '#7bd88f'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let e = 0; e <= 1.0001; e += 0.02) {
    const eff = e < EC ? torqueK(e) * e : Math.min(e, 0.985);
    const px = xOf(e), py = yOfE(eff);
    e <= 0.001 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* 当前工况动点 */
  ctx.fillStyle = accC;
  ctx.beginPath(); ctx.arc(xOf(curE), yOfK(curK), 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7bd88f';
  ctx.beginPath(); ctx.arc(xOf(curE), yOfE(curEff), 6, 0, TAU); ctx.fill();
  ctx.fillStyle = cTxt;
  ctx.fillText(L('K 变矩比', 'K torque ratio'), padL + 6, padT + 12);
  ctx.fillStyle = '#7bd88f';
  ctx.fillText(L('η 效率', 'η efficiency'), padL + 110, padT + 12);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elEng = document.getElementById('sEng'), elEngVal = document.getElementById('sEngVal');
const elLoad = document.getElementById('sLoad'), elLoadVal = document.getElementById('sLoadVal');
const stPump = document.getElementById('stPump'), stTurb = document.getElementById('stTurb'),
  stK = document.getElementById('stK'), stEff = document.getElementById('stEff'),
  stStator = document.getElementById('stStator'), stLock = document.getElementById('stLock');
const formulaEl = document.getElementById('formula');
const btnLock = document.getElementById('btnLock'), btnStall = document.getElementById('btnStall');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elEng.value = engRPM; elEngVal.textContent = `${engRPM.toFixed(0)} rpm`;
  elLoad.value = loadFrac; elLoadVal.textContent = `${loadFrac.toFixed(0)} %`;
}
function syncBtns() { btnLock.classList.toggle('on', lockWanted); }
function updateStats() {
  stPump.innerHTML = `${engRPM.toFixed(0)}<small> rpm</small>`;
  stTurb.innerHTML = `${Nt.toFixed(0)}<small> rpm</small>`;
  stK.innerHTML = `× ${curK.toFixed(2)}`;
  stK.className = 'v' + (curK > 1.05 ? ' warn' : '');
  stEff.innerHTML = `${(curEff * 100).toFixed(0)}<small> %</small>`;
  stEff.className = 'v ' + (curEff > 0.9 ? 'ok' : (curEff < 0.05 ? 'bad' : ''));
  stStator.textContent = statorBoost ? L('助推(锁死)', 'boosting (held)') : L('空转(脱开)', 'freewheeling');
  stStator.className = 'v ' + (statorBoost ? 'warn' : 'ok');
  stLock.textContent = lockActive ? L('已锁止', 'locked') : (lockWanted ? L('待转速同步', 'waiting for sync') : L('开放', 'open'));
  stLock.className = 'v ' + (lockActive ? 'ok' : '');
  ocM.emissive.setHex(statorBoost ? 0x8a4a08 : 0x15181c);
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>K = T_tur / T_pump = ${curK.toFixed(2)}</b>(失速 K₀=2.1 · 耦合点后 K≡1)<br>` +
    `<b>e = N_tur / N_pump = ${curE.toFixed(2)}</b>(泵轮 ${engRPM.toFixed(0)} rpm · 涡轮 ${Nt.toFixed(0)} rpm)<br>` +
    `<b>η = K·e = ${(curEff * 100).toFixed(0)}%</b>${lockActive ? '(锁止硬连接 ≈99%)' : '(失速 0% → 峰值 ~90% → 耦合 ~97%)'}<br>` +
    `<b>失速放大:T_tur = T_pump + T_stator</b>,导轮反作用扭矩;失速时泵轮 ${heatKW().toFixed(0)} kW 全部变热<br>` +
    `<b>导轮:${statorBoost ? '助推' : '空转'} · 锁止:${lockActive ? '吸合' : '开放'} · ATF 油温 ≈ ${Toil.toFixed(0)} °C</b>`,
    `<b>K = T_tur / T_pump = ${curK.toFixed(2)}</b> (stall K₀=2.1 · K≡1 past the coupling point)<br>` +
    `<b>e = N_tur / N_pump = ${curE.toFixed(2)}</b> (pump ${engRPM.toFixed(0)} rpm · turbine ${Nt.toFixed(0)} rpm)<br>` +
    `<b>η = K·e = ${(curEff * 100).toFixed(0)}%</b>${lockActive ? ' (locked hard link ≈99%)' : ' (stall 0% → peak ~90% → coupling ~97%)'}<br>` +
    `<b>Stall boost: T_tur = T_pump + T_stator</b> (stator reaction); at stall ${heatKW().toFixed(0)} kW of pump power becomes heat<br>` +
    `<b>Stator: ${statorBoost ? 'boosting' : 'freewheeling'} · lockup: ${lockActive ? 'engaged' : 'open'} · ATF ≈ ${Toil.toFixed(0)} °C`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); applyView();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elEng.addEventListener('input', () => { engRPM = +elEng.value; syncSliders(); updateFormula(); });
elLoad.addEventListener('input', () => { loadFrac = +elLoad.value; syncSliders(); });
btnLock.addEventListener('click', () => {
  lockWanted = !lockWanted;
  if (lockWanted && Nt / Math.max(engRPM, 1) < 0.55)
    notify('转速差过大:真实变速箱要等 e>0.55 才允许锁止,否则锁止片打滑发热', 'too much speed difference: real transmissions wait for e>0.55 before lockup, or the plates slip and overheat');
  else if (lockWanted)
    notify('锁止离合器吸合:泵轮-涡轮硬连接,滑差归零,效率 ~99%', 'lockup engaged: pump-turbine hard link, zero slip, ~99% efficiency');
  else
    notify('锁止释放:回到液力软连接,油膜重新缓冲', 'lockup released: back to the hydraulic soft link');
  syncBtns();
});
btnStall.addEventListener('click', startStall);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglFlow').addEventListener('change', e => { flowOn = e.target.checked; });
document.getElementById('tglCut').addEventListener('change', e => { cutOn = e.target.checked; applyView(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    physics(dt);
    const wPv = clamp((engRPM / 3000) * 5, 0.5, 11);
    const wTv = wPv * clamp(Nt / Math.max(engRPM, 1), 0, 1);
    pumpG.rotation.z += wPv * dt;
    turbG.rotation.z += wTv * dt;
    statG.rotation.z += (statorBoost ? 0 : 0.3 + 0.6 * (1 - Ccirc)) * dt;
    lockG.rotation.z += (lockActive ? wPv : wTv) * dt;
    flyG.rotation.x += wPv * dt;
    outG.rotation.x += wTv * dt;
    drawParticles(dt);
  }
  /* 锁止片压紧动画与吸合辉光 */
  lockDisc.position.z = lerp(lockDisc.position.z, lockActive ? -1.12 : -1.52, Math.min(1, dt0 * 5));
  lockM.emissiveIntensity = lockActive ? 0.65 : 0;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); updateFormula(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
applyView();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
