<style>
  :root,:root[data-theme="dark"]{

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2);

/* ============ 物理模型（垂直剖面，1 垂直格=500 m，山顶 3 km） =
   抬升：未饱和干绝热 Γd=9.8 °C/km；云底以上湿绝热 Γm≈5.5 °C/km；
   凝结高度 zLCL≈0.125·(T−Td) km，Td 由 Magnus 公式从湿度求；
   焚风增温 ΔT=(Γd−Γm)·(山顶−云底)：默认湿度 60% → ΔT≈8.2 °C；
   背风湿度：混合比守恒 + p=1013·exp(−z/8.4) hPa 换算 */
const Gd=9.8,Gm=5.5,ZTOP=2.9,ZREF=0.15,T0=18,T0B=-5,HM=6,HW=5.2,HRS=1.25;
let mode='foehn',RH=60,windMS=14,dayH=14,snowLee=0.4,snowShown=0.4,simT=0,cFac=0;
const hTerr=x=>HM*Math.exp(-(x/HW)*(x/HW));
const dhTerr=x=>-2*HM*x/(HW*HW)*Math.exp(-(x/HW)*(x/HW));
const isDay=()=>dayH>6.5&&dayH<19.5;
const tDew=(T,rh)=>{const g=Math.log(rh/100)+17.62*T/(243.12+T);return 243.12*g/(17.62-g);};
const zLCL=()=>mode==='bora'?99:clamp(0.125*(T0-tDew(T0,RH)),0,4.2);
const cond=()=>mode==='foehn'?Math.max(0,ZTOP-zLCL()):0;
const dTf=()=>(Gd-Gm)*cond();
const esat=T=>6.112*Math.exp(17.62*T/(243.12+T));
const pres=z=>1013*Math.exp(-z/8.4);
const tWindZ=z=>T0-Gd*z;
function tLeeZ(z){const zl=zLCL();return T0-Gd*zl-Gm*(ZTOP-zl)+Gd*(ZTOP-z);}
function leeRH(){
  if(mode==='bora')return 45;
  const zl=zLCL();if(zl>=ZTOP)return RH;
  const eL=esat(T0-Gd*zl),r=0.622*eL/(pres(zl)-eL);
  return clamp(100*r*pres(ZREF)/(0.622+r)/esat(tLeeZ(ZREF)),1,100);
}
function stationTemps(){
  if(mode==='valley')return isDay()?[T0+9,T0+2,42]:[T0-7,T0-1,86];
  if(mode==='bora')return [T0B,T0B,45];
  return [tWindZ(ZREF),tLeeZ(ZREF),leeRH()];
}
function parcelT(x,z,y0){        // 单个气团温度（x<0 迎风 / x>0 背风），z 单位 km
  if(mode==='bora')return T0B-Gd*z;
  const zl=zLCL(),zm=y0+3*Math.exp(-y0/1.5);
  if(zm<=zl)return T0-Gd*z;
  if(x<0)return z<=zl?T0-Gd*z:T0-Gd*zl-Gm*(Math.min(z,zm)-zl);
  return T0-Gd*zl-Gm*(zm-zl)+Gd*(zm-z);
}
const cCold=new THREE.Color(0x3f74c9),cMid=new THREE.Color(0xdde4d4),cHot=new THREE.Color(0xe2591e),cTmp=new THREE.Color();
function tempColor(T,out){const t=clamp((T+15)/45,0,1);
  if(t<0.5)out.lerpColors(cCold,cMid,t*2);else out.lerpColors(cMid,cHot,(t-0.5)*2);}

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x93bdd9,60,180);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,300);
camera.position.set(-24,9.5,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=8;controls.maxDistance=90;
scene.add(new THREE.HemisphereLight(0xdfeaf4,0x3a4232,0.85));
const sun=new THREE.DirectionalLight(0xfff0d0,1.05);scene.add(sun);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),new THREE.MeshBasicMaterial({color:0xffd98a}));
scene.add(sunDisc);

/* ============ 地形：山体剖面 + 谷底平原（顶点色画积雪） ============ */
const TNX=73,TNZ=11;
const terrGeo=new THREE.BufferGeometry();
{
  const pos=new Float32Array(TNX*TNZ*3),idx=[];
  for(let j=0;j<TNZ;j++)for(let i=0;i<TNX;i++){
    const k=(j*TNX+i)*3,x=-17+i*34/(TNX-1);
    pos[k]=x;pos[k+1]=hTerr(x);pos[k+2]=-8+j*16/(TNZ-1);
  }
  for(let j=0;j<TNZ-1;j++)for(let i=0;i<TNX-1;i++){
    const a=j*TNX+i,b=a+1,c=a+TNX,d=c+1;idx.push(a,c,b,b,c,d);
  }
  terrGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  terrGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(TNX*TNZ*3),3));
  terrGeo.setIndex(idx);terrGeo.computeVertexNormals();
}
const cValley=new THREE.Color(0x55703f),cRock=new THREE.Color(0x7d7057),cSnow=new THREE.Color(0xe9eef3),cTmp2=new THREE.Color();
function paintTerrain(){
  const P=terrGeo.attributes.position.array,C=terrGeo.attributes.color.array;
  for(let k=0;k<TNX*TNZ;k++){
    const k3=k*3,x=P[k3],y=P[k3+1];
    cTmp.lerpColors(cValley,cRock,clamp((y-1.0)/3.2,0,1));
    const sn=smooth((y-4.3)/0.9)*(x>1?snowLee:1);
    if(sn>0){cTmp2.lerpColors(cTmp,cSnow,sn);cTmp.copy(cTmp2);}
    C[k3]=cTmp.r;C[k3+1]=cTmp.g;C[k3+2]=cTmp.b;
  }
  terrGeo.attributes.color.needsUpdate=true;
}
scene.add(new THREE.Mesh(terrGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
const plain=new THREE.Mesh(new THREE.PlaneGeometry(130,40),new THREE.MeshStandardMaterial({color:0x4d663a,roughness:1}));
plain.rotation.x=-Math.PI/2;plain.position.y=-0.05;scene.add(plain);

/* ============ 云：迎风帽状云墙 + 背风荚状云链 + 布拉风冷密度流 ============ */
const cloudGeo=new THREE.SphereGeometry(1,12,9);
const cloudM=new THREE.MeshStandardMaterial({color:0xf6f9fc,roughness:1,transparent:true,opacity:0.9});
const capCloud=new THREE.Mesh(cloudGeo,cloudM);
capCloud.scale.set(2.7,0.85,1.7);capCloud.position.set(-5.0,3.0,0);scene.add(capCloud);
const lensGrp=new THREE.Group();scene.add(lensGrp);
[3.2,7.4,11.6].forEach(x=>{const m=new THREE.Mesh(cloudGeo,cloudM);
  m.scale.set(1.7,0.42,1.0);m.position.set(x,6.4,0);lensGrp.add(m);});
const wedge=new THREE.Mesh(new THREE.BoxGeometry(15,1.2,8),
  new THREE.MeshStandardMaterial({color:0x7fb0e8,transparent:true,opacity:0.2,roughness:1,depthWrite:false}));
wedge.position.set(7.2,2.6,0);wedge.rotation.z=-0.58;wedge.visible=false;scene.add(wedge);

/* ============ 气团粒子（InstancedMesh，按温度着色） ============ */
const dummy=new THREE.Object3D(),zeroM=new THREE.Matrix4().makeScale(0,0,0);
const PN=150;
const pk=new THREE.InstancedMesh(new THREE.SphereGeometry(0.13,8,6),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0.92}),PN);
pk.frustumCulled=false;scene.add(pk);
const pxA=new Float32Array(PN),y0A=new Float32Array(PN),bA=new Float32Array(PN),zA=new Float32Array(PN);
function seedFlow(i){pxA[i]=-17+Math.random()*34;y0A[i]=0.4+Math.pow(Math.random(),1.4)*8.4;
  zA[i]=(Math.random()-0.5)*11;bA[i]=0.12+Math.random()*0.7;}
function seedValley(i){pxA[i]=(Math.random()<0.5?-1:1)*(0.9+Math.random()*14.5);
  bA[i]=0.25+Math.random()*1.1;zA[i]=(Math.random()-0.5)*11;}

/* ============ 迎风坡降雨（InstancedMesh） ============ */
const RN=110;
const rain=new THREE.InstancedMesh(new THREE.BoxGeometry(0.05,0.42,0.05),
  new THREE.MeshBasicMaterial({color:0xaecfee,transparent:true,opacity:0.5}),RN);
rain.frustumCulled=false;rain.visible=false;scene.add(rain);
const rDat=[];for(let i=0;i<RN;i++)rDat.push({x:-1.2-Math.random()*6.6,y:2.4+Math.random()*3.4,
  z:(Math.random()-0.5)*8,v:6+Math.random()*3});
function updRain(dt,cF){
  const n=Math.floor(RN*cF);rain.count=n;if(!n)return;
  for(let i=0;i<n;i++){const r=rDat[i];r.y-=r.v*dt;
    if(r.y<hTerr(r.x)+0.15){r.y=5.4+Math.random()*0.9;r.x=-1.2-Math.random()*6.6;}
    dummy.position.set(r.x,r.y,r.z);dummy.rotation.set(0,0,0.12);dummy.scale.setScalar(1);
    dummy.updateMatrix();rain.setMatrixAt(i,dummy.matrix);}
  rain.instanceMatrix.needsUpdate=true;
}

/* ============ 背风坡雪粒（InstancedMesh，焚风卷雪） ============ */
const SN=80;
const snow=new THREE.InstancedMesh(new THREE.TetrahedronGeometry(0.1,0),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95}),SN);
snow.frustumCulled=false;snow.visible=false;scene.add(snow);
const sDat=[];for(let i=0;i<SN;i++)sDat.push({on:false,x:0,y:0,z:0,vx:0,vy:0,life:0});
function updSnow(dt,dth){
  const can=mode==='foehn'&&dTf()>2.5&&snowLee>0.04;
  for(let i=0;i<SN;i++){const s=sDat[i];
    if(!s.on){
      if(can&&dt>0&&Math.random()<dt*2.5){s.on=true;s.x=1.6+Math.random()*8.6;
        s.y=hTerr(s.x)+0.2+Math.random()*0.5;s.z=(Math.random()-0.5)*9;
        s.vx=2.2+Math.random()*3.4;s.vy=0.5+Math.random()*0.9;s.life=1.1+Math.random()*1.3;}
      else{snow.setMatrixAt(i,zeroM);continue;}
    }
    s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.life<=0){s.on=false;snow.setMatrixAt(i,zeroM);continue;}
    dummy.position.set(s.x,s.y,s.z);dummy.rotation.set(s.life*2,s.life*3,0);
    dummy.scale.setScalar(clamp(s.life/0.9,0.05,1));dummy.updateMatrix();
    snow.setMatrixAt(i,dummy.matrix);
  }
  snow.instanceMatrix.needsUpdate=true;snow.visible=mode==='foehn';
  if(dth>0)snowLee=clamp(snowLee+(dTf()>2?-0.045:0.012)*dth,0,1);
  if(Math.abs(snowLee-snowShown)>0.04){snowShown=snowLee;paintTerrain();}
}

/* ============ 坡面风矢 ============ */
const arrows=[];
const arrMatW=new THREE.MeshBasicMaterial({color:0x7ab3e8}),arrMatL=new THREE.MeshBasicMaterial({color:0xe8934f});
function mkArrow(mat,x){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1,6),mat);
  shaft.rotation.z=-Math.PI/2;shaft.position.x=0.5;g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.17,0.44,8),mat);
  head.rotation.z=-Math.PI/2;head.position.x=1.12;g.add(head);
  g.position.set(x,hTerr(x)+0.95,4.6);scene.add(g);arrows.push(g);
}
[-11.5,-8,-4.6].forEach(x=>mkArrow(arrMatW,x));
[4.6,8,11.5].forEach(x=>mkArrow(arrMatL,x));
function updArrows(){
  const mag=clamp(windMS/18,0.55,1.4)*(mode==='bora'?1.3:1);
  for(const g of arrows){
    const x=g.position.x,th=Math.atan(Math.abs(dhTerr(x)));
    g.scale.setScalar(mode==='valley'?mag*0.8:mag);
    if(mode==='valley')g.rotation.z=isDay()?(x<0?th:Math.PI-th):(x<0?Math.PI+th:-th);
    else g.rotation.z=Math.atan(dhTerr(x));
  }
}

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
addLabel(()=>L('湿气流爬坡 · 干绝热 −9.8 °C/km','Upslope: dry adiabat −9.8 °C/km'),V(-9.5,3.4,0),'o',()=>mode==='foehn');
const pLCL=addLabel(()=>L('云底凝结：潜热托底，降温放缓','Cloud base: latent heat cushions the cooling'),V(-4.9,4.6,0),'b',()=>mode==='foehn'&&cFac>0.15);
addLabel(()=>L('背风下沉 · 干绝热 +9.8 °C/km 回温','Leeward descent: dry warming +9.8 °C/km'),V(7.2,4.6,0),'r',()=>mode==='foehn');
addLabel(()=>L(`焚风：同高度暖 ${dTf().toFixed(1)} °C · 干 ${(RH-leeRH()).toFixed(0)} 个百分点`,`Foehn: +${dTf().toFixed(1)} °C, ${(RH-leeRH()).toFixed(0)} pp drier`),V(12.4,3.1,0),'o',()=>mode==='foehn'&&dTf()>2.5);
addLabel(()=>L('荚状云链 · 焚风墙','Lenticular chain: the foehn wall'),V(7.4,7.6,0),'b',()=>mode==='foehn'&&cFac>0.2);
addLabel(()=>L(`迎风侧 ${tWindZ(ZREF).toFixed(1)} °C · 湿度 ${RH.toFixed(0)}%`,`Windward ${tWindZ(ZREF).toFixed(1)} °C · RH ${RH.toFixed(0)}%`),V(-13.8,1.5,0),'g',()=>mode!=='valley');
addLabel(()=>L(`背风侧 ${tLeeZ(ZREF).toFixed(1)} °C · 湿度 ${leeRH().toFixed(0)}%`,`Leeward ${tLeeZ(ZREF).toFixed(1)} °C · RH ${leeRH().toFixed(0)}%`),V(13.8,1.5,0),'r',()=>mode!=='valley');
addLabel(()=>L('吃雪者：背风积雪当场消融','Snow-eater: lee snowpack vanishing'),V(6.2,1.9,0),'o',()=>mode==='foehn'&&dTf()>2.5&&snowLee>0.05);
addLabel(()=>L('布拉风：无潜热补贴，寒冷密度流倾泻','Bora: no latent subsidy — a cold density current'),V(8.5,3.8,0),'b',()=>mode==='bora');
addLabel(()=>L('谷风：白昼坡面受热，气流沿坡爬升','Valley wind: sun-heated slopes draw air uphill'),V(-6.5,5.2,0),'o',()=>mode==='valley'&&isDay());
addLabel(()=>L('山风：夜间坡面冷却，冷气滑落谷底','Mountain wind: cooled slope air drains down at night'),V(-6.5,5.2,0),'b',()=>mode==='valley'&&!isDay());

/* ============ 步骤 ============ */
const STEPS=[
 {zh:'强迫抬升：湿气流撞山爬坡，未饱和段按干绝热 9.8 °C/km 降温',en:'Forced lift: air ramps the slope, cooling 9.8 °C/km while unsaturated'},
 {zh:'凝结高度：到云底水汽凝结放潜热，降温放缓到湿绝热 ~5.5 °C/km',en:'Cloud base: vapour condenses, latent heat slows cooling to ~5.5 °C/km'},
 {zh:'越顶下沉：背风侧已无水可凝，一路干绝热 9.8 °C/km 回温',en:'Over the crest: nothing left to condense, descent warms at the full 9.8 °C/km'},
 {zh:'焚风现场：同一高度背风侧暖 5-10 °C、干 20%+——拖湿度滑块看读数当场变',en:'Foehn live: same altitude, +5-10 °C and 20%+ drier — drag the RH slider'},
 {zh:'吃雪者：钦诺克一夜化雪 30 cm，暖干风把火险拉到红色预警',en:'Snow-eater: a Chinook melts 30 cm of snow overnight; fire danger goes red'},
 {zh:'布拉风对照：冷气团翻山没有潜热补贴，落地仍是寒冷密度流',en:'Bora contrast: cold air crosses with no latent subsidy and lands cold'},
 {zh:'山谷风：白天坡面受热抽风上山、夜间冷坡泄流——昼夜翻转',en:'Valley winds: heated slopes draw air up by day, cold air drains down at night'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i<=3){setMode('foehn');if(i===1)setRH(78);if(i===0)setRH(60);}
  else if(i===4){setMode('foehn');setRH(88);snowLee=Math.max(snowLee,0.6);snowShown=-1;}
  else if(i===5)setMode('bora');
  else{setMode('valley');setDay(14);}
}

/* ============ 模式与滑块 ============ */
const SK_F=[['迎风侧温度','Windward °C'],['背风侧温度','Leeward °C'],['背风湿度','Lee humidity'],['风速','Wind']];
const SK_V=[['坡面温度','Slope °C'],['谷底温度','Valley floor °C'],['相对湿度','Humidity'],['坡面风速','Slope wind']];
function setStatKeys(){
  const ks=mode==='valley'?SK_V:SK_F;
  document.querySelectorAll('#stats .k').forEach((e,i)=>{
    e.dataset.zh=ks[i][0];e.dataset.en=ks[i][1];
    e.textContent=LANG==='en'?ks[i][1]:ks[i][0];
  });
}
function setMode(m){
  mode=m;
  el('btnFoehn').classList.toggle('on',m==='foehn');
  el('btnBora').classList.toggle('on',m==='bora');
  el('btnValley').classList.toggle('on',m==='valley');
  if(m==='bora'){snowLee=1;snowShown=-1;for(let i=0;i<PN;i++)seedFlow(i);}
  else if(m==='valley'){for(let i=0;i<PN;i++)seedValley(i);}
  else for(let i=0;i<PN;i++)seedFlow(i);
  paintTerrain();setStatKeys();
}
function setRH(v){RH=clamp(v,20,100);el('sRH').value=RH;el('sRHVal').textContent=Math.round(RH)+'%';}
function setWind(v){windMS=clamp(v,5,30);el('sWind').value=windMS;el('sWindVal').textContent=Math.round(windMS)+' m/s';}
function setDay(v){dayH=clamp(v,0,24);el('sDay').value=dayH;el('sDayVal').textContent=fmtDay(dayH);}
const fmtDay=h=>{const hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');};
el('sRH').addEventListener('input',e=>setRH(+e.target.value));
el('sWind').addEventListener('input',e=>setWind(+e.target.value));
el('sDay').addEventListener('input',e=>setDay(+e.target.value));
el('sSpd').addEventListener('input',e=>{timeScale=+e.target.value/100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';});
el('btnFoehn').addEventListener('click',()=>setMode('foehn'));
el('btnBora').addEventListener('click',()=>setMode('bora'));
el('btnValley').addEventListener('click',()=>setMode('valley'));
el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ============ 天空 / 光照 / 主题 ============ */
const cDay=new THREE.Color(0x8fc3e8),cDawn=new THREE.Color(0xcf8a5a),cNight=new THREE.Color(0x10141f);
const cFoehnSky=new THREE.Color(0x93bdd9),cBoraSky=new THREE.Color(0x5f7c94),cSky=new THREE.Color();
function updateSky(){
  if(mode==='valley'){
    const elev=Math.sin(Math.PI*(dayH-6)/13);
    if(elev>0.25)cSky.lerpColors(cDawn,cDay,clamp((elev-0.25)/0.6,0,1));
    else if(elev>-0.15)cSky.lerpColors(cNight,cDawn,clamp((elev+0.15)/0.4,0,1));
    else cSky.copy(cNight);
    sun.intensity=clamp(elev,0,1)*1.1+0.08;
  }else if(mode==='bora'){cSky.copy(cBoraSky);sun.intensity=0.55;}
  else{cSky.copy(cFoehnSky);sun.intensity=1.05;}
  scene.background=cSky;scene.fog.color.copy(cSky);
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  updateSky();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  setStatKeys();buildSteps();
}

/* ============ 统计 ============ */
function updateStats(){
  const [tw,tl,rl]=stationTemps();
  el('sv0').innerHTML=tw.toFixed(1)+'<small> °C</small>';
  el('sv1').innerHTML=tl.toFixed(1)+'<small> °C</small>';
  el('sv1').style.color=tl>tw+1?'#ff9b6b':tl<tw-1?'#8fc0ff':'';
  el('sv2').innerHTML=rl.toFixed(0)+'<small> %</small>';
  const w=mode==='valley'?(isDay()?1:-1)*windMS*0.32:windMS*(mode==='bora'?1.7:1);
  el('sv3').innerHTML=(w>=0?'+':'')+w.toFixed(1)+'<small> m/s</small>';
}

/* ============ 每帧更新 ============ */
function updParcels(dt){
  const wv=windMS*0.12;
  for(let i=0;i<PN;i++){
    let x=pxA[i],y;
    if(mode==='valley'){
      const day=isDay(),side=x<0?-1:1,s=dhTerr(x),k=1/Math.hypot(1,s),
        sp=(day?windMS*0.11:windMS*0.09)*dt;
      if(day){x+=-side*k*sp;bA[i]+=Math.abs(s)*k*sp*0.9+0.03*dt;}
      else{x+=side*k*sp;bA[i]-=Math.abs(s)*k*sp*0.5+0.05*dt;}
      bA[i]=clamp(bA[i],0.18,2.4);
      if(day&&Math.abs(x)<0.9){x=side*(6+Math.random()*9);bA[i]=0.25+Math.random()*0.5;}
      if(!day&&Math.abs(x)>16.4){x=side*(1+Math.random()*2.4);bA[i]=0.55+Math.random()*0.7;}
      y=hTerr(x)+bA[i];
      tempColor(day?26-bA[i]*4:9-bA[i]*2,cTmp);
    }else{
      const d=Math.exp(-y0A[i]/3);
      let u=wv*(1+0.45*hTerr(x)/HM*d);if(mode==='bora')u*=1.45;
      x+=u*dt;
      if(x>17){x=-17;y0A[i]=0.4+Math.pow(Math.random(),1.4)*8.4;zA[i]=(Math.random()-0.5)*11;}
      y=mode==='bora'?hTerr(x)+bA[i]*(x<0?1:Math.max(0.5,1-x*0.1)):y0A[i]+hTerr(x)*d+0.12;
      tempColor(parcelT(x,y*0.5,y0A[i]*0.5),cTmp);
    }
    pxA[i]=x;
    dummy.position.set(x,y,zA[i]);dummy.rotation.set(0,0,0);dummy.scale.setScalar(1);
    dummy.updateMatrix();pk.setMatrixAt(i,dummy.matrix);pk.setColorAt(i,cTmp);
  }
  pk.instanceMatrix.needsUpdate=true;
  if(pk.instanceColor)pk.instanceColor.needsUpdate=true;
}
function updateWorld(dtA,dth){
  let elev,az;
  if(mode==='valley'){elev=Math.sin(Math.PI*(dayH-6)/13);az=Math.PI*(1-(dayH-6)/13);}
  else{elev=0.62;az=2.25;}
  const sx=Math.cos(az)*26,sy=clamp(elev,0.03,1)*16+1;
  sunDisc.position.set(sx,sy,-16);sun.position.set(sx*0.8,sy+4,8);
  sunDisc.material.color.setHex(elev>0.1?0xffd98a:0xd8dee9);
  updateSky();
  cFac=mode==='foehn'?smooth(cond()/2.0):0;
  cloudM.opacity=0.9*cFac;
  capCloud.visible=mode==='foehn'&&cFac>0.04;
  capCloud.position.y=clamp(zLCL()*2+0.7,2.4,5.6);
  lensGrp.visible=mode==='foehn'&&cFac>0.06;
  for(let i=0;i<3;i++)lensGrp.children[i].position.y=6.4+Math.sin(simT*0.7+i*2)*0.08;
  wedge.visible=mode==='bora';
  wedge.material.opacity=0.17+0.05*Math.sin(simT*2);
  rain.visible=mode==='foehn'&&cFac>0.03;
  updParcels(dtA);updRain(dtA,cFac);updSnow(dtA,dth);updArrows();
  pLCL.position.set(-4.9,capCloud.position.y+1.6,0);
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  let dth=0;
  if(playing){
    dth=dt0*timeScale*HRS;
    if(mode==='valley'){dayH=(dayH+dth)%24;el('sDay').value=dayH;el('sDayVal').textContent=fmtDay(dayH);}
    updateWorld(dt0*timeScale,dth);
  }else updateWorld(0,0);            // 暂停也响应滑块拖动
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 启动 ============ */
applyTheme();setStatKeys();applyLang();
for(let i=0;i<PN;i++)seedFlow(i);
el('tglLabels').checked=labelsOn;
el('sSpd').value=timeScale*100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';
const ti=parseInt(QS.get('t'));
if(ti>=1&&ti<=STEPS.length){activeStep=ti-1;syncSteps();gotoStep(activeStep);}
if(QS.has('pause')){playing=false;el('play').textContent=L('运行','Run');}
updateWorld(0.05,0.1);updateStats();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
