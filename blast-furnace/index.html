<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高炉炼铁 · 碳的还原阶梯</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="高炉炼铁 · 碳的还原阶梯" data-en="The Blast Furnace · Carbon's Reduction Ladder">高炉炼铁 · 碳的还原阶梯</h1>
  <div class="sub" data-zh="1300 °C 热风从风口鼓入,把焦炭烧成 CO₂ 并放出全炉最集中的热量;CO₂ 在 1000 °C 以上被更热的焦炭夺回氧、变成 CO;CO 沿料柱缝隙继续上升,在炉身把铁矿逐级卸氧:Fe₂O₃→Fe₃O₄→FeO→Fe;石灰石在约 900 °C 分解成 CaO,把脉石收聚成渣;炉缸里渣浮铁沉、各走各门。固体下行、气体上行——一座逆流热交换塔与化学反应塔的叠合,日产铁水万吨级 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="1300 °C hot blast enters at the tuyeres, burning coke into CO₂ and releasing the furnace's most concentrated heat; above 1000 °C, hotter coke takes the oxygen back: CO₂+C→2CO; CO climbs through the burden gaps and strips iron ore step by step — Fe₂O₃→Fe₃O₄→FeO→Fe; limestone decomposes near 900 °C into CaO that gathers gangue into slag; in the hearth slag floats on iron, each leaving by its own door. Solids descend, gas ascends — a counter-current heat exchanger stacked on a chemical reactor, 10,000+ t of hot metal per day · 3D interactive demo · drag to orbit · Space = run/pause">高炉炼铁 · 碳的还原阶梯</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="炉顶温度" data-en="Top temp">炉顶温度</span><span class="v" id="stTop">—</span>
  <span class="k" data-zh="风口区温度" data-en="Tuyere temp">风口区温度</span><span class="v" id="stTuy">—</span>
  <span class="k" data-zh="铁水温度" data-en="Hot metal">铁水温度</span><span class="v" id="stFe">—</span>
  <span class="k" data-zh="渣温" data-en="Slag temp">渣温</span><span class="v" id="stSlg">—</span>
  <span class="k" data-zh="顶气 CO(示意)" data-en="Top-gas CO">顶气 CO(示意)</span><span class="v" id="stCO">—</span>
  <span class="k" data-zh="阶段" data-en="Phase">阶段</span><span class="v" id="stPhase">—</span>
</div>

<div id="plot">
  <h3 data-zh="炉身高度–温度曲线:三条还原区带(Fe₂O₃/Fe₃O₄/FeO)随风温移动,动点为当前还原前沿" data-en="Shaft height vs temperature: three reduction bands (Fe₂O₃/Fe₃O₄/FeO) shift with blast temp; the dot is the current reduction front">炉身高度–温度曲线:三条还原区带(Fe₂O₃/Fe₃O₄/FeO)随风温移动,动点为当前还原前沿</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="橙流:热风与燃烧带" data-en="orange: hot blast & raceway">橙流:热风与燃烧带</span>
    <span class="chip.r" data-zh="红流:CO · 间接还原剂" data-en="red: CO, the indirect reducer">红流:CO · 间接还原剂</span>
    <span class="chip.g" data-zh="黄绿:炉渣(渣浮铁上)" data-en="yellow-green: slag floats on iron">黄绿:炉渣(渣浮铁上)</span>
    <span class="chip.b" data-zh="银白:铁水与还原铁" data-en="silver: hot metal & metallic Fe">银白:铁水与还原铁</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnTapFe" data-zh="出铁(打开出铁口)" data-en="Tap iron (open taphole)">出铁(打开出铁口)</button>
    <button class="abtn" id="btnTapSlg" data-zh="出渣(打开出渣口)" data-en="Tap slag (open slag notch)">出渣(打开出渣口)</button>
  </div>
  <div class="row"><label data-zh="热风温度" data-en="Blast temp">热风温度</label><input id="sBlast" type="range" min="900" max="1300" step="10" value="1150"><span class="val" id="sBlastVal">1150 °C</span></div>
  <div class="row"><label data-zh="料速" data-en="Burden rate">料速</label><input id="sBurden" type="range" min="0.2" max="2" step="0.1" value="1"><span class="val" id="sBurdenVal">1.0 ×</span></div>
  <div class="row"><label data-zh="焦比" data-en="Coke ratio">焦比</label><input id="sCoke" type="range" min="300" max="600" step="10" value="450"><span class="val" id="sCokeVal">450 kg/t</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglHeat" type="checkbox" checked> <span data-zh="温度热图" data-en="Heat map">温度热图</span></label>
      <label><input id="tglFlow" type="checkbox" checked> <span data-zh="粒子流" data-en="Gas flow">粒子流</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../thermite/" data-zh="铝热:夺氧的极速版" data-en="thermite: oxygen theft at extreme speed">铝热:夺氧的极速版</a>
    <a href="../corrosion/" data-zh="腐蚀:自发的反方向" data-en="corrosion: the spontaneous reverse">腐蚀:自发的反方向</a>
    <a href="../oxyhydrogen-combustion/" data-zh="氢氧燃烧:燃烧三角与放热" data-en="oxyhydrogen: the fire triangle & heat">氢氧燃烧:燃烧三角与放热</a>
    <a href="../activation-energy/" data-zh="活化能:点火与能垒" data-en="activation energy: ignition & the barrier">活化能:点火与能垒</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 22, 64);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x191c22 : 0xb2bec9);
  shellM.color.setHex(dark ? 0x394049 : 0x9aa7b4);
  pipeM.color.setHex(dark ? 0x4a525c : 0x8b98a5);
  ladleM.color.setHex(dark ? 0x272b31 : 0x8d99a6);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('高炉炼铁 · 碳的还原阶梯', "The Blast Furnace · Carbon's Reduction Ladder");
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(6.4, 6.8, 10.4);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 4.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.95);
key.position.set(8, 12, 9);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a8, 0.3);
fillL.position.set(-9, 6, -7);
scene.add(fillL);

/* ================= 冶炼状态(真实数值) ================= */
let blastT = 1150, burdenRate = 1.0, cokeRatio = 450;   // 风温 °C / 料速倍数 / 焦比 kg/t
let ironLvl = 0.34, slagLvl = 0.18;                     // 炉缸铁水/渣层高度(场景单位)

const tuyereT = () => blastT * 1.5 + 350;               // 理论火焰温度
const ironT = () => 1490 + (blastT - 1100) * 0.06;      // 铁水温度 ~1500 °C
const slagTv = () => ironT() + 45;                      // 渣温 1500-1600 °C
const coPct = () => clamp(20 + cokeRatio / 90 + (1150 - blastT) / 150, 18, 30);
const indPct = () => clamp(36 + cokeRatio * 0.055 + (blastT - 900) * 0.012, 35, 72); // 间接还原占比
function Tof(y) {                                       // 高度→温度 °C(风口 2000 → 炉顶 ~200)
  if (y < 1.85) return 1500 + (tuyereT() - 1500) * clamp((y - 1.2) / 0.65, 0, 1);
  return clamp(200 + (tuyereT() - 200) * Math.pow(Math.max(0, 10 - y) / 8.15, 2.2), 200, tuyereT());
}
function solveT(thr) {                                  // 温度阈值→高度(还原区带边界)
  for (let y = 9.6; y > 1.9; y -= 0.02) if (Tof(y) >= thr) return y;
  return 2;
}
function radiusAt(y) {                                  // 高炉剖面轮廓:炉缸/炉腹/炉腰/炉身/炉喉
  if (y < 1.5) return 1.9;
  if (y < 3.3) return lerp(1.9, 1.25, (y - 1.5) / 1.8);
  if (y < 4.1) return 1.25;
  if (y < 9.2) return lerp(1.25, 1.7, (y - 4.1) / 5.1);
  return lerp(1.7, 1.5, clamp((y - 9.2) / 0.8, 0, 1));
}

/* ---------------- 炉料(InstancedMesh,真实还原色变) ---------------- */
const B_N = 150;
const burden = [];
const im = new THREE.InstancedMesh(new THREE.BoxGeometry(0.21, 0.17, 0.21), burdenM, B_N);
im.frustumCulled = false;
scene.add(im);
const CH_SEQ = [0, 1, 0, 2];                            // 交替料层序列:矿-焦-矿-灰石
let chargeIdx = 0, chargeT = 0;
const bCol = new THREE.Color();
function spawnPiece(p, top) {
  p.ang = Math.random() * Math.PI * 2;
  p.rr = Math.sqrt(Math.random()) * 1.02;
  p.sc = 0.8 + Math.random() * 0.45;
  p.rx = Math.random() * 3; p.ry = Math.random() * 3;
  p.alive = true;
  p.type = top ? CH_SEQ[chargeIdx] : (Math.floor(Math.random() * 8) === 0 ? 2 : (Math.floor(Math.random() * 2) ? 0 : 1));
  if (top) { p.y = 9.35 + Math.random() * 0.5; p.drop = true; }
  else { p.y = 3.1 + Math.random() * 5.4; p.drop = false; }
}
for (let i = 0; i < B_N; i++) { const p = {}; spawnPiece(p, false); im.setColorAt(i, bCol.setHex(0xffffff)); burden.push(p); }
const dummy = new THREE.Object3D();
function burdenColor(p) {
  if (p.type === 1) {
    const g = p.y < 2.7 ? clamp(2.7 - p.y, 0, 1) : 0;
    return bCol.setHex(0x26282e).lerp(new THREE.Color(0xff5a1e), g * 0.8);
  }
  if (p.type === 2) return bCol.setHex(p.y < 4.7 ? 0xb9c25a : 0xd9d5c6);
  const t = Tof(p.y);
  if (t >= 1000) return bCol.setHex(0xd8dee8);        // Fe 银亮
  if (t >= 780) return bCol.setHex(0x8b929a);         // FeO 灰
  if (t >= 520) return bCol.setHex(0x33343c);         // Fe₃O₄ 黑
  return bCol.setHex(0x9a4a2e);                       // Fe₂O₃ 红褐
}
function stepBurden(dt) {
  chargeT -= dt;
  if (chargeT <= 0) { chargeIdx = (chargeIdx + 1) % CH_SEQ.length; chargeT = CH_SEQ[chargeIdx] === 2 ? 1.2 : 2.4; }
  for (let i = 0; i < B_N; i++) {
    const p = burden[i];
    if (!p.alive) continue;
    if (p.drop) { p.y -= 2.4 * dt; if (p.y <= 8.6) p.drop = false; }
    else p.y -= 0.11 * burdenRate * dt;
    if (p.type === 1 && p.y < 2.4) {                  // 风口前焦炭燃烧消耗
      p.sc -= 1.0 * dt;
      if (p.sc < 0.3) { spawnPiece(p, true); continue; }
    } else if (p.y < 3.55) {                          // 熔滴:矿→铁水,灰石→渣
      if (p.type !== 1) {
        if (p.type === 0) { ironLvl += 0.006; if (Math.random() < 0.5) spawnDrip(p); }
        else { slagLvl += 0.005; if (Math.random() < 0.4) spawnDrip(p, true); }
      }
      spawnPiece(p, true);
      continue;
    }
  }
  ironLvl = clamp(ironLvl + dt * 0.008 * burdenRate, 0.06, 0.85);
  slagLvl = clamp(slagLvl + dt * 0.0035 * burdenRate, 0.05, 0.55);
}
function syncBurden() {
  for (let i = 0; i < B_N; i++) {
    const p = burden[i];
    dummy.position.set(Math.cos(p.ang) * p.rr, p.alive ? p.y : -50, Math.sin(p.ang) * p.rr);
    dummy.rotation.set(p.rx, p.ry, 0);
    dummy.scale.setScalar(p.alive ? p.sc : 0.001);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    im.setColorAt(i, p.alive ? burdenColor(p) : bCol.setHex(0));
  }
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
}

/* ---------------- 气相粒子(热风→CO₂→CO,Points+vertexColors) ---------------- */
const G_MAX = 240;
const gases = [];
const gGeo = new THREE.BufferGeometry();
const gPos = new Float32Array(G_MAX * 3), gCol = new Float32Array(G_MAX * 3);
gGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
gGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
const gPoints = new THREE.Points(gGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
gPoints.frustumCulled = false;
scene.add(gPoints);
const C_BLAST = new THREE.Color(0xff8c2a), C_CO2 = new THREE.Color(0xd8dde2), C_CO = new THREE.Color(0xff5a4a), C_DRIP = new THREE.Color(0xffc46a), C_DRIPS = new THREE.Color(0xc9d45e);
let spawnAcc = 0;
function spawnBlast() {
  const a = tuyA[Math.floor(Math.random() * 3)];
  gases.push({ x: Math.cos(a) * 2.0, y: 1.85, z: Math.sin(a) * 2.0, vx: 0, vy: 0, vz: 0, tp: 0, age: 0 });
}
function spawnDrip(p, slg) {
  if (gases.length >= G_MAX) return;
  gases.push({ x: Math.cos(p.ang) * p.rr, y: 3.5, z: Math.sin(p.ang) * p.rr, vx: 0, vy: -0.5, vz: 0, tp: slg ? 4 : 3, age: 0 });
}
function stepGas(dt, burnI) {
  if (flowOn) {
    spawnAcc += dt * 22 * burnI;
    while (spawnAcc > 1 && gases.length < G_MAX) { spawnBlast(); spawnAcc -= 1; }
  }
  const V = new THREE.Vector3();
  for (let i = gases.length - 1; i >= 0; i--) {
    const p = gases[i];
    p.age += dt;
    if (p.tp === 0) {                                  // 热风射入回旋区
      if (p.vx === 0 && p.vz === 0) {
        V.set(-p.x, 1.9 + (Math.random() - 0.5) * 0.5 - p.y, -p.z).normalize().multiplyScalar(2.2 + burnI);
        p.vx = V.x; p.vy = V.y; p.vz = V.z;
      }
      if (Math.hypot(p.x, p.z) < 0.7 || p.age > 0.5) { p.tp = 1; p.vx = 0; p.vz = 0; p.vy = 0.7; }
    } else if (p.tp === 1) {                           // CO₂ 上行,遇炽焦变 CO
      p.vy = 0.75 + 0.25 * Math.sin(p.age * 3 + i);
      if (p.y > 2.7 && p.y < 5.5 && Math.random() < dt * 1.5) { p.tp = 2; }
      if (p.y > 9.6) { gases.splice(i, 1); continue; }
    } else if (p.tp === 2) {                           // CO 继续上升,沿途夺氧还原矿石
      p.vy = 0.85 + 0.25 * Math.sin(p.age * 3 + i);
      if (p.y > 4.3 && p.y < 8.7 && Math.random() < dt * 0.3) { gases.splice(i, 1); continue; }
      if (p.y > 9.6) { gases.splice(i, 1); continue; }
    } else {                                           // 熔滴下落
      p.vy -= 6 * dt;
      const meltTop = ironLvl + slagLvl + 0.12;
      if (p.y < meltTop) { gases.splice(i, 1); continue; }
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.tp === 1 || p.tp === 2) {                    // 限制在炉墙内并带旋流
      const r = Math.hypot(p.x, p.z), rmax = Math.max(0.3, radiusAt(p.y) - 0.4);
      if (r > rmax) { p.x *= rmax / r; p.z *= rmax / r; }
      const sw = 0.25 * dt;
      const nx = p.x * Math.cos(sw) - p.z * Math.sin(sw), nz = p.x * Math.sin(sw) + p.z * Math.cos(sw);
      p.x = nx; p.z = nz;
    }
  }
}
function drawGas() {
  for (let i = 0; i < G_MAX; i++) {
    if (i < gases.length) {
      const p = gases[i];
      let c;
      if (p.tp === 0) c = C_BLAST; else if (p.tp === 1) c = C_CO2; else if (p.tp === 2) c = C_CO;
      else if (p.tp === 3) c = C_DRIP; else c = C_DRIPS;
      gPos[i * 3] = p.x; gPos[i * 3 + 1] = p.y; gPos[i * 3 + 2] = p.z;
      gCol[i * 3] = c.r; gCol[i * 3 + 1] = c.g; gCol[i * 3 + 2] = c.b;
    } else gPos[i * 3 + 1] = -999;
  }
  gGeo.attributes.position.needsUpdate = true;
  gGeo.attributes.color.needsUpdate = true;
}
/* 出料流(铁水/渣)粒子 */
const S_MAX = 80;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(S_MAX * 3), sCol = new Float32Array(S_MAX * 3);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
const sPoints = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.09, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
sPoints.frustumCulled = false;
scene.add(sPoints);
const streams = [];
function stepStreams(dt) {
  if (tapFeT > 0) for (let k = 0; k < 3; k++) if (streams.length < S_MAX)
    streams.push({ x: plugFe.position.x, y: 0.36, z: plugFe.position.z, vx: feDir.x * 1.8, vy: 0.3, vz: feDir.z * 1.8, slg: false });
  if (tapSlgT > 0) for (let k = 0; k < 2; k++) if (streams.length < S_MAX)
    streams.push({ x: plugSlg.position.x, y: 1.26, z: plugSlg.position.z, vx: slgDir.x * 1.4, vy: 0.25, vz: slgDir.z * 1.4, slg: true });
  for (let i = streams.length - 1; i >= 0; i--) {
    const p = streams[i];
    p.vy -= 7 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0.1) streams.splice(i, 1);
  }
  for (let i = 0; i < S_MAX; i++) {
    if (i < streams.length) {
      const p = streams[i], c = p.slg ? C_DRIPS : C_DRIP;
      sPos[i * 3] = p.x; sPos[i * 3 + 1] = p.y; sPos[i * 3 + 2] = p.z;
      sCol[i * 3] = c.r; sCol[i * 3 + 1] = c.g; sCol[i * 3 + 2] = c.b;
    } else sPos[i * 3 + 1] = -999;
  }
  sGeo.attributes.position.needsUpdate = true;
  sGeo.attributes.color.needsUpdate = true;
  plugFe.visible = tapFeT <= 0;
  plugSlg.visible = tapSlgT <= 0;
  if (tapFeT > 0) { tapFeT -= dt; ironLvl = clamp(ironLvl - dt * 0.1, 0.06, 0.85); }
  if (tapSlgT > 0) { tapSlgT -= dt; slagLvl = clamp(slagLvl - dt * 0.1, 0.05, 0.55); }
}

const lblRace = addLabel(() => L(`风口燃烧带 C+O₂→CO₂ · ~${tuyereT().toFixed(0)} °C`, `raceway C+O₂→CO₂ · ~${tuyereT().toFixed(0)} °C`), new THREE.Vector3(-2.5, 2.5, 1.0), 'o');
const lblBoud = addLabel(() => L('CO₂+C→2CO:>1000 °C 炽焦夺氧', 'CO₂+C→2CO: hot coke strips O above 1000 °C'), new THREE.Vector3(-1.9, 4.0, 0.9), 'r');
const lblRed = addLabel(() => L('还原前沿:FeO+CO→Fe+CO₂', 'reduction front: FeO+CO→Fe+CO₂'), new THREE.Vector3(1.8, hFe, 1.0), 'b');
const lblFlux = addLabel(() => L('石灰石→CaO+CO₂,收聚脉石成渣', 'limestone→CaO+CO₂, gathering gangue into slag'), new THREE.Vector3(1.9, 4.15, 0.4), 'g');
const lblHearth = addLabel(() => L(`铁水 ${ironT().toFixed(0)} °C 沉底 · 渣 ${slagTv().toFixed(0)} °C 浮顶`, `hot metal ${ironT().toFixed(0)} °C sinks · slag ${slagTv().toFixed(0)} °C floats`), new THREE.Vector3(1.9, 1.0, 1.5), 'o');
const lblTap = addLabel(() => L('出铁口(下)与出渣口(上):分层各走各门', 'taphole (low) & slag notch (high): each leaves by its own door'), new THREE.Vector3(2.4, 0.9, 1.6), 'g');
const lblNotify = addLabel(() => {
  if (notifyT > 0) return L(notifyZ, notifyE);
  return '';
}, new THREE.Vector3(0, 11.4, 0), 'r');

/* ================= 讲解步骤 ================= */
function flyTo(p, t) {
  camTween = { p0: camera.position.clone(), p1: new THREE.Vector3(p[0], p[1], p[2]), t0: controls.target.clone(), t1: new THREE.Vector3(t[0], t[1], t[2]), k: 0 };
}
function notify(z, e, t = 3.2) { notifyT = t; notifyZ = z; notifyE = e; }
const STEPS = [
  { b: '逆流反应器:料下行、气上行', be: 'A counter-current reactor: burden down, gas up',
    d: '炉料从炉喉分批装入,料柱以数米每小时的速度整体下移;热风自风口鼓入,煤气自下而上穿过料缝——固气逆流把热量与化学活性都用到极致,炉身同时是热交换塔与反应塔,炉顶逸出的煤气仍带 200 °C 与可回用的 CO。',
    de: 'Burden is charged in batches at the throat and the column sinks meters per hour; hot blast enters at the tuyeres and gas climbs through the burden — counter-current flow squeezes value from every degree, making the shaft a heat exchanger and a reactor at once, with the top gas still warm and CO-rich.',
    act: () => { flyTo([6.4, 6.8, 10.4], [0, 4.6, 0]); } },
  { b: '风口燃烧带:焦炭烧出 CO₂ 与 2000 °C', be: 'The raceway: coke burns to CO₂ at ~2000 °C',
    d: '热风从风口喷入回旋区,焦炭被氧化:C+O₂→CO₂,放出全炉最集中的热量,理论火焰温度约 1.5×风温+350,风温 1150 °C 时约 2000 °C——炉内一切温度梯度从这里向外衰减,调风温就是调全炉的能源总闸。',
    de: 'Hot blast hits the raceway and coke oxidizes: C+O₂→CO₂, the furnace\'s most concentrated heat release; theoretical flame temperature ≈ 1.5×blast+350 — about 2000 °C at 1150 °C blast. Every temperature gradient in the furnace decays outward from here; blast temperature is the master energy valve.',
    act: () => { flyTo([-5.0, 3.2, 6.0], [-1.4, 1.95, 0]); } },
  { b: 'CO₂ 被炽炭夺氧变 CO:间接还原的搬运工', be: 'Coke strips CO₂ back to CO: the indirect-reduction ferry',
    d: '上升气流里的 CO₂ 一进入 1000 °C 以上的炽焦区就被夺走氧:CO₂+C→2CO(伯特瓦尔反应,吸热);CO 于是成为间接还原的载体——它把矿石里的氧接力带走变回 CO₂,CO₂ 又被送回焦炭处重新装氧,循环往复。',
    de: 'CO₂ rising into coke hotter than 1000 °C has its oxygen taken: CO₂+C→2CO (the Boudouard reaction, endothermic); CO then ferries oxygen out of the ore, turning back into CO₂ — which returns to the coke to reload, over and over.',
    act: () => { flyTo([-3.6, 5.2, 5.2], [-0.8, 4.4, 0]); } },
  { b: '逐级卸氧:Fe₂O₃→Fe₃O₄→FeO→Fe', be: 'Stepwise deoxidation: Fe₂O₃→Fe₃O₄→FeO→Fe',
    d: '矿石下行中按温度逐级脱氧:约 500 °C 起 3Fe₂O₃+CO→2Fe₃O₄+CO₂,约 800 °C Fe₃O₄+CO→3FeO+CO₂,约 1000 °C FeO+CO→Fe+CO₂;料块颜色由红褐到黑、灰再到银白,还原前沿随风温升高而下移、随料速加快而上抬。',
    de: 'Descending ore gives up oxygen in stages: from ~500 °C, 3Fe₂O₃+CO→2Fe₃O₄+CO₂; ~800 °C, Fe₃O₄+CO→3FeO+CO₂; ~1000 °C, FeO+CO→Fe+CO₂. Chunks shift red-brown → black → gray → silver; hotter blast pushes the front down, faster burden lifts it.',
    act: () => { flyTo([4.6, 6.2, 6.8], [0, 5.8, 0]); } },
  { b: '石灰石造渣:脉石入渣、渣浮铁上', be: 'Limestone makes slag: gangue captured, slag floats',
    d: '约 900 °C 石灰石分解释出 CO₂、留下 CaO;CaO 与矿石里的脉石(SiO₂、Al₂O₃)结合成低熔点硅酸盐炉渣,滴入炉缸;渣比铁水轻,浮在铁水面上,既隔绝空气又收容硫等杂质——没有造渣,脉石会把高炉堵死。',
    de: 'Near 900 °C limestone decomposes, leaving CaO; CaO binds the ore\'s gangue (SiO₂, Al₂O₃) into low-melting silicate slag that drips into the hearth; lighter than iron, it floats — sealing the metal from air and absorbing sulfur. Without slagging, gangue would choke the furnace.',
    act: () => { flyTo([3.8, 4.6, 6.0], [0.5, 4.1, 0]); } },
  { b: '出铁出渣:分层各走各门', be: 'Tapping iron and slag: each leaves by its own door',
    d: '炉缸里渣浮于铁、界限分明:低位的出铁口放出 1500 °C 铁水,经铁沟流入铁水罐;高位的出渣口先出渣。大型高炉每天数万吨铁水、十余次周期性开堵出铁口——碳沿着「焦炭→CO₂→CO→铁」的阶梯,一路把氧交给了铁。',
    de: 'In the hearth slag floats cleanly on iron: the low taphole releases 1500 °C hot metal down the runner to the ladle, the higher slag notch drains slag first. A big furnace makes tens of thousands of tonnes a day through a dozen taphole cycles — carbon hands its oxygen to the iron, rung by rung.',
    act: () => { flyTo([3.4, 2.2, 6.8], [0.5, 0.8, 0]); tapSlgT = 2.6; tapFeT = 4.2; } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:高度–温度曲线 + 还原区带 ================= */
const plotCv = document.getElementById('plotCv');
function updateZones() {
  if (hCacheKey !== blastT) { hFe = solveT(1000); hFeO = solveT(780); hFe3 = solveT(520); hCacheKey = blastT; }
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 42, padR = 14, padT = 14, padB = 26;
  const xOf = y => padL + y / 10 * (W - padL - padR);
  const yOf = t => (H - padB) - clamp(t, 0, 2400) / 2400 * (H - padT - padB);
  ctx.font = '12px system-ui';
  /* 三条还原区带(高度方向) */
  const band = (y0, y1, col, lab) => {
    ctx.fillStyle = col;
    ctx.fillRect(xOf(y1), padT, xOf(y0) - xOf(y1), H - padT - padB);
    ctx.fillStyle = cTxt;
    ctx.fillText(lab, xOf((y0 + y1) / 2) - 22, padT + 14);
  };
  updateZones();
  band(10, hFe3, 'rgba(154,74,46,.28)', 'Fe₂O₃');
  band(hFe3, hFeO, 'rgba(51,52,60,.45)', 'Fe₃O₄');
  band(hFeO, hFe, 'rgba(139,146,154,.4)', 'FeO');
  band(hFe, 1.85, 'rgba(216,222,232,.30)', 'Fe');
  /* 坐标 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('2000°C', 4, yOf(2000) + 4);
  ctx.fillText('1000°C', 4, yOf(1000) + 4);
  ctx.fillText('200°C', 4, yOf(200) + 4);
  ctx.fillText(L('炉顶', 'top'), xOf(9.4) - 10, H - padB + 16);
  ctx.fillText(L('炉缸', 'hearth'), xOf(0.7) - 12, H - padB + 16);
  /* 温度曲线 */
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let y = 1.2; y <= 9.7; y += 0.08) {
    const px = xOf(y), py = yOf(Tof(y));
    y <= 1.21 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* 还原前沿动点 */
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(xOf(hFe), yOf(Tof(hFe)), 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('还原前沿', 'front'), xOf(hFe) + 8, yOf(Tof(hFe)) - 6);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elBlast = document.getElementById('sBlast'), elBlastVal = document.getElementById('sBlastVal');
const elBurden = document.getElementById('sBurden'), elBurdenVal = document.getElementById('sBurdenVal');
const elCoke = document.getElementById('sCoke'), elCokeVal = document.getElementById('sCokeVal');
const stTop = document.getElementById('stTop'), stTuy = document.getElementById('stTuy'),
  stFe = document.getElementById('stFe'), stSlg = document.getElementById('stSlg'),
  stCO = document.getElementById('stCO'), stPhase = document.getElementById('stPhase');
const formulaEl = document.getElementById('formula');
const btnTapFe = document.getElementById('btnTapFe'), btnTapSlg = document.getElementById('btnTapSlg');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elBlast.value = blastT; elBlastVal.textContent = `${blastT.toFixed(0)} °C`;
  elBurden.value = burdenRate; elBurdenVal.textContent = `${burdenRate.toFixed(1)} ×`;
  elCoke.value = cokeRatio; elCokeVal.textContent = `${cokeRatio.toFixed(0)} kg/t`;
}
function syncBtns() {}
function phaseName() {
  if (tapFeT > 0) return L('出铁中', 'tapping iron');
  if (tapSlgT > 0) return L('出渣中', 'tapping slag');
  return L(`正常冶炼 · 间接还原 ${indPct().toFixed(0)}%`, `smelting · ${indPct().toFixed(0)}% indirect`);
}
function updateStats() {
  stTop.innerHTML = `${Tof(9.5).toFixed(0)}<small> °C</small>`;
  stTuy.innerHTML = `${tuyereT().toFixed(0)}<small> °C</small>`;
  stTuy.className = 'v warn';
  stFe.innerHTML = `${ironT().toFixed(0)}<small> °C</small>`;
  stFe.className = 'v ok';
  stSlg.innerHTML = `${slagTv().toFixed(0)}<small> °C</small>`;
  stCO.innerHTML = `${coPct().toFixed(0)}<small> %</small>`;
  stPhase.textContent = phaseName();
}
function updateFormula() {
  const ip = indPct().toFixed(0);
  formulaEl.innerHTML = L(
    `<b>风口:C + O₂ → CO₂</b>(放热),理论火焰温度 ≈ 1.5×风温+350 = <b>${tuyereT().toFixed(0)} °C</b>(风温 ${blastT.toFixed(0)} °C)<br>` +
    `<b>伯特瓦尔:CO₂ + C → 2CO</b>,1000 °C 以上才自发;CO 携氧上行,顶气 CO ≈ ${coPct().toFixed(0)}%<br>` +
    `<b>逐级卸氧:3Fe₂O₃+CO→2Fe₃O₄+CO₂(≈500 °C)→ Fe₃O₄+CO→3FeO+CO₂(≈800 °C)→ FeO+CO→Fe+CO₂(≈1000 °C)</b><br>` +
    `<b>熔剂:CaCO₃→CaO+CO₂</b>(>900 °C),CaO+SiO₂→渣;渣 ${slagTv().toFixed(0)} °C 浮于铁水 ${ironT().toFixed(0)} °C 之上<br>` +
    `<b>间接还原 ≈ ${ip}%,直接还原(FeO+C)≈ ${(100 - ip).toFixed(0)}%</b>;焦比 ${cokeRatio.toFixed(0)} kg/t,顶温 ≈ ${Tof(9.5).toFixed(0)} °C,单炉日产 ≈ 1.2 万 t`,
    `<b>Tuyere: C + O₂ → CO₂</b> (exothermic), flame temp ≈ 1.5×blast+350 = <b>${tuyereT().toFixed(0)} °C</b> (blast ${blastT.toFixed(0)} °C)<br>` +
    `<b>Boudouard: CO₂ + C → 2CO</b> — spontaneous only above 1000 °C; CO ferries O upward, top-gas CO ≈ ${coPct().toFixed(0)}%<br>` +
    `<b>Stepwise: 3Fe₂O₃+CO→2Fe₃O₄+CO₂ (~500 °C); Fe₃O₄+CO→3FeO+CO₂ (~800 °C); FeO+CO→Fe+CO₂ (~1000 °C)</b><br>` +
    `<b>Flux: CaCO₃→CaO+CO₂</b> (>900 °C); CaO+SiO₂→slag at ${slagTv().toFixed(0)} °C floating on ${ironT().toFixed(0)} °C metal<br>` +
    `<b>Indirect ≈ ${ip}%, direct (FeO+C) ≈ ${(100 - ip).toFixed(0)}%</b>; coke ${cokeRatio.toFixed(0)} kg/t, top ≈ ${Tof(9.5).toFixed(0)} °C, ~12,000 t/day`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); applyView();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elBlast.addEventListener('input', () => { blastT = +elBlast.value; syncSliders(); updateFormula(); updateHeat(); });
elBurden.addEventListener('input', () => { burdenRate = +elBurden.value; syncSliders(); });
elCoke.addEventListener('input', () => { cokeRatio = +elCoke.value; syncSliders(); updateFormula(); });
btnTapFe.addEventListener('click', () => {
  tapFeT = 4.2;
  notify('出铁:1500 °C 铁水经铁沟流入铁水罐', 'tapping: 1500 °C hot metal runs the runner into the ladle');
});
btnTapSlg.addEventListener('click', () => {
  tapSlgT = 3;
  notify('出渣:更轻的炉渣从高位渣口流出', 'tapping slag: the lighter slag leaves from the higher notch');
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglHeat').addEventListener('change', e => { heatOn = e.target.checked; applyView(); });
document.getElementById('tglFlow').addEventListener('change', e => { flowOn = e.target.checked; });
document.getElementById('tglCut').addEventListener('change', e => { cutOn = e.target.checked; applyView(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  const burnI = clamp((tuyereT() - 1500) / 800, 0.25, 1.2);
  if (dt > 0) {
    simT += dt;
    stepBurden(dt);
    stepGas(dt, burnI);
    stepStreams(dt);
  }
  drawGas();
  syncBurden();
  /* 炉缸分层:铁水沉底、渣浮其上 */
  ironBody.scale.y = ironLvl;
  ironBody.position.y = ironLvl / 2;
  slagBody.scale.y = slagLvl;
  slagBody.position.y = ironLvl + slagLvl / 2;
  /* 风口区辉光随燃烧强度脉动 */
  for (let i = 0; i < raceways.length; i++) {
    const rw = raceways[i];
    const pulse = 1 + 0.16 * Math.sin(simT * 7 + i * 2.1);
    rw.rw.scale.setScalar(burnI * pulse);
    rw.rw.material.opacity = 0.5 + 0.35 * burnI * pulse;
    rw.rl.intensity = 2.4 * burnI * pulse;
  }
  hearthLight.intensity = 1.1 + 0.3 * Math.sin(simT * 3);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; updateZones(); drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  lblRed.position.y = hFe;
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
updateHeat();
buildSteps();
applyLang();
applyView();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
