<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微波炉 · 驻波里的冷与热</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,169,77,.9); color: #ffe3c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.hot { border-color: rgba(255,107,74,.95); color: #ffc9b8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(230,89,12,.9); color: #e8590c; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(25,113,194,.9); color: #1971c2; }
  :root[data-theme="light"] .lbl.hot { border-color: rgba(217,72,15,.9); color: #d9480f; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffa94d; }
  #stats .v.hot { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,93,93,.7); background: rgba(255,93,93,.10); color: #ffc2c2; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .prog { margin-top: 8px; }
  .prog .cap { font-size: 11.5px; color: var(--text2); margin-bottom: 4px; }
  .prog .bar { height: 12px; border-radius: 5px; background: rgba(128,140,155,.16); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0%; background: rgba(255,169,77,.85); transition: width .2s; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(230,89,12,.08); border-color: rgba(230,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd8a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="微波炉:驻波里的冷与热" data-en="Microwave Oven: hot & cold in a standing wave">微波炉:驻波里的冷与热</h1>
  <div class="sub" data-zh="磁控管发出 2.45 GHz 微波,金属腔壁反射叠成驻波;水分子偶极每秒调头 24.5 亿次、摩擦生热——波腹滚烫、波节冰凉,转盘负责把冷热搅匀(电场振荡为慢放示意) · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A 2.45 GHz magnetron plus reflecting metal walls make a standing wave; water dipoles flip 2.45 billion times a second and jostle into heat — antinodes scorch, nodes stay cold, and the turntable evens it out (field oscillation slowed for view) · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">磁控管发出 2.45 GHz 微波,金属腔壁反射叠成驻波;水分子偶极每秒调头 24.5 亿次、摩擦生热——波腹滚烫、波节冰凉,转盘负责把冷热搅匀(电场振荡为慢放示意) · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="微波频率 f" data-en="frequency f">微波频率 f</span><span class="v g">2.45<small data-zh=" GHz(ISM 频段)" data-en=" GHz (ISM band)"> GHz(ISM 频段)</small></span>
  <span class="k" data-zh="波长 λ = c/f" data-en="wavelength λ = c/f">波长 λ = c/f</span><span class="v">12.2<small> cm</small></span>
  <span class="k" data-zh="食物均温" data-en="food avg temp">食物均温</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="冷点(未达 32°C)" data-en="cold spots (below 32°C)">冷点(未达 32°C)</span><span class="v g" id="stD">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnTurn">转盘</button>
    <button class="abtn" id="btnReset" data-zh="换一块黄油(重置)" data-en="fresh butter (reset)">换一块黄油(重置)</button>
  </div>
  <div class="row"><label data-zh="功率" data-en="Power">功率</label><input id="power" type="range" min="200" max="1000" step="50" value="800"><span class="val" id="powerVal">800 W</span></div>
  <div class="prog">
    <div class="cap"><span data-zh="加热进度" data-en="heating progress">加热进度</span> · <span id="heatPct">0%</span></div>
    <div class="bar"><i id="heatFill"></i></div>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="进度" data-en="Phase">进度</label><input id="prog" type="range" min="0" max="4.99" step="0.01" value="0"><span class="val" id="progVal">1/5</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglField" type="checkbox" checked> <span data-zh="驻波场" data-en="wave field">驻波场</span></label>
    <label><input id="tglDip" type="checkbox" checked> <span data-zh="偶极箭头" data-en="dipoles">偶极箭头</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../em-wave/" data-zh="电磁波:2.45 GHz 是家族一员" data-en="EM waves: 2.45 GHz is family">电磁波:2.45 GHz 是家族一员</a>
    <a href="../standing-waves/" data-zh="驻波:波节与波腹的来历" data-en="standing waves: nodes & antinodes">驻波:波节与波腹的来历</a>
    <a href="../induction-cooktop/" data-zh="电磁炉:加热的另一条路" data-en="induction cooktop: another road to heat">电磁炉:加热的另一条路</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const li = THEME === 'light';
  scene.background = new THREE.Color(li ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(li ? 0xd6dce6 : 0x1b212c);
  M.body.color.set(li ? 0xb9c3cf : 0x39424f);
  M.wall.color.set(li ? 0xc3ccd8 : 0x424c5a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('微波炉 · 驻波里的冷与热', 'Microwave Oven · hot & cold in a standing wave');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  setTurnLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.8, 3.1, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.95, emissive: 0x000000 }),
  body: mat(0x39424f, { metalness: 0.7, roughness: 0.35 }),
  wall: mat(0x424c5a, { metalness: 0.85, roughness: 0.28, opacity: 0.4, side: THREE.DoubleSide }),
  glass: mat(0xdfe8f2, { opacity: 0.3, roughness: 0.15, metalness: 0.2 }),
  plate: mat(0xe8ecef, { roughness: 0.4, opacity: 0.92 }),
  waveguide: mat(0x59636f, { metalness: 0.8, roughness: 0.3 }),
};

/* ================= 物理尺度(1 单位 = 10 cm) ================= */
const LAM = 1.2237;                 // λ = c/2.45GHz ≈ 12.2 cm
const HALF = LAM / 2;               // 波节间距 6.1 cm
const K = 2 * Math.PI / LAM;
const W = 5 * HALF, H = 2.0, D = 3.0, X0 = -W / 2;   // 腔体 ≈ 30.6 × 20 × 30 cm,两端壁为波节
const sgnAt = x => Math.sin(K * (x - X0));
const envAt = x => Math.abs(sgnAt(x));
const BX = 0.52, BZ = 0.12;         // 黄油相对转盘中心的偏移

/* ---------------- 场景:炉腔 ---------------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), M.floor);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
function wall(w, h, d, x, y, z, m = M.wall) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z);
  scene.add(b);
  return b;
}
wall(W + 0.2, 0.1, D + 0.2, 0, 0.05, 0);                  // 底
wall(W + 0.2, 0.1, D + 0.2, 0, 2.15, 0, M.body);          // 顶
wall(0.1, H + 0.2, D + 0.2, -W / 2 - 0.05, 1.1, 0);       // 左
wall(0.1, H + 0.2, D + 0.2, W / 2 + 0.05, 1.1, 0);        // 右
wall(W + 0.2, H + 0.2, 0.1, 0, 1.1, -D / 2 - 0.05);       // 后
wall(W + 0.2, 0.08, 0.06, 0, 2.14, D / 2 + 0.03, M.body); // 门框
wall(W + 0.2, 0.08, 0.06, 0, 0.06, D / 2 + 0.03, M.body);
wall(0.08, H + 0.2, 0.06, -W / 2 - 0.06, 1.1, D / 2 + 0.03, M.body);
wall(0.08, H + 0.2, 0.06, W / 2 + 0.06, 1.1, D / 2 + 0.03, M.body);

/* 波导 + 磁控管(右壁外) */
wall(0.55, 0.24, 0.34, W / 2 + 0.35, 1.5, 0, M.waveguide);
wall(0.34, 0.34, 0.34, W / 2 + 0.85, 1.5, 0, M.body);
for (let i = 0; i < 4; i++) wall(0.42, 0.04, 0.42, W / 2 + 0.85, 1.34 + i * 0.11, 0, M.waveguide);
wall(0.06, 0.22, 0.3, W / 2 - 0.03, 1.5, 0, M.body);      // 波导口
const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xff9d45, transparent: true, opacity: 0.8, depthWrite: false }));
mouth.position.set(W / 2 - 0.06, 1.5, 0);
scene.add(mouth);

/* 转盘 + 盘 + 黄油(随转盘公转) */
const turnGrp = new THREE.Group();
scene.add(turnGrp);
const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 0.05, 48), M.glass);
disc.position.y = 0.145;
turnGrp.add(disc);
const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.08, 16), M.waveguide);
spindle.position.y = 0.09;
turnGrp.add(spindle);
const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.03, 36), M.plate);
plate.position.set(BX, 0.185, BZ);
turnGrp.add(plate);

/* 黄油:7×5 独立加热单元 */
const NX = 7, NZ = 5, SP = 0.19, NCELL = NX * NZ;
const cells = new THREE.InstancedMesh(new THREE.BoxGeometry(0.17, 0.18, 0.17),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.05 }), NCELL);
cells.position.set(BX, 0.20, BZ);
turnGrp.add(cells);
const cellPos = [];
const cellT = new Float32Array(NCELL).fill(20);
{
  let i = 0;
  for (let ix = 0; ix < NX; ix++) for (let iz = 0; iz < NZ; iz++) {
    cellPos.push([(ix - (NX - 1) / 2) * SP, (iz - (NZ - 1) / 2) * SP]);
    cells.setColorAt(i, new THREE.Color(0xf4d97b));
    i++;
  }
}
/* 邻接表:黄油内部导热(冷热斑被逐渐匀化的原因之一) */
const cellNbr = [];
for (let i = 0; i < NCELL; i++) cellNbr.push([]);
for (let ix = 0; ix < NX; ix++) for (let iz = 0; iz < NZ; iz++) {
  const i = ix * NZ + iz;
  if (ix > 0) cellNbr[i].push(i - NZ);
  if (ix < NX - 1) cellNbr[i].push(i + NZ);
  if (iz > 0) cellNbr[i].push(i - 1);
  if (iz < NZ - 1) cellNbr[i].push(i + 1);
}
const cellD = new Float32Array(NCELL);

/* 水分子偶极箭头(悬在黄油上方的放大示意层) */
const arrowGrp = new THREE.Group();
arrowGrp.position.set(BX, 0.62, BZ);
turnGrp.add(arrowGrp);
const arrows = [];
const shaftGeo = new THREE.CylinderGeometry(0.013, 0.013, 0.13, 6);
shaftGeo.translate(0, -0.025, 0);
const headGeo = new THREE.ConeGeometry(0.042, 0.085, 10);
headGeo.translate(0, 0.0825, 0);
for (let ix = 0; ix < 8; ix++) for (let iz = 0; iz < 3; iz++) {
  const m = new THREE.MeshStandardMaterial({ color: 0x6cb8ff, roughness: 0.4, emissive: 0x2b6cb0, emissiveIntensity: 0.4 });
  const g = new THREE.Group();
  g.add(new THREE.Mesh(shaftGeo, m), new THREE.Mesh(headGeo, m));
  const lx = (ix - 3.5) * 0.165, lz = (iz - 1) * 0.26;
  g.position.set(lx, 0, lz);
  arrowGrp.add(g);
  arrows.push({ g, m, a: Math.random() < 0.5 ? 0 : Math.PI, act: 0, lx, lz });
}

/* ---------------- 驻波场可视化 ---------------- */
function fieldMat() {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uT: { value: 1 }, uPow: { value: 1 }, uEm: { value: 0.4 }, uK: { value: K }, uW: { value: W } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `varying vec2 vUv; uniform float uT,uPow,uEm,uK,uW;
      void main(){
        float e = abs(sin(uK*vUv.x*uW));
        float inst = e*abs(uT);
        vec3 col = mix(vec3(0.18,0.45,1.0), vec3(1.0,0.32,0.10), pow(e,1.5));
        float edge = smoothstep(0.0,0.05,vUv.y)*smoothstep(1.0,0.95,vUv.y);
        float a = uEm*uPow*(0.06+0.5*e)*(0.3+0.7*inst)*edge;
        gl_FragColor = vec4(col, a);
      }`
  });
}
const curtain = new THREE.Mesh(new THREE.PlaneGeometry(W, 1.92), fieldMat());
curtain.position.set(0, 1.1, 0);
scene.add(curtain);
const carpet = new THREE.Mesh(new THREE.PlaneGeometry(W, D), fieldMat());
carpet.rotation.x = -Math.PI / 2;
carpet.position.set(0, 0.115, 0);
scene.add(carpet);
/* 瞬态波形线 */
const RSEG = 96;
const ribGeo = new THREE.BufferGeometry();
ribGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((RSEG + 1) * 3), 3));
const ribbon = new THREE.Line(ribGeo, new THREE.LineBasicMaterial({ color: 0xff6b4a, transparent: true, opacity: 0.9 }));
scene.add(ribbon);
/* 波节(蓝)/波腹(红)标记 */
const nodeDots = [], antiDots = [];
for (let m = 1; m <= 4; m++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0x74c0fc }));
  s.position.set(X0 + m * HALF, 1.1, 0);
  scene.add(s); nodeDots.push(s);
}
for (let m = 0; m < 5; m++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff6b4a }));
  s.position.set(X0 + (m + 0.5) * HALF, 1.1, 0);
  scene.add(s); antiDots.push(s);
}
/* 入射/反射的「光子」点 */
const beamDots = [];
const bdGeo = new THREE.SphereGeometry(0.04, 8, 6);
for (let i = 0; i < 12; i++) {
  const d = new THREE.Mesh(bdGeo, new THREE.MeshBasicMaterial({ color: 0xffd8a8, transparent: true, opacity: 0.7, depthWrite: false }));
  d.userData = { off: i / 12, y: 1.5 + Math.sin(i * 2.7) * 0.3, z: Math.sin(i * 1.9) * 0.45 };
  scene.add(d);
  beamDots.push(d);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
addLabel(() => L('磁控管 · 2.45 GHz 微波源', 'magnetron · 2.45 GHz source'), new THREE.Vector3(W / 2 + 0.85, 1.95, 0), 'g');
addLabel(() => L('波导', 'waveguide'), new THREE.Vector3(W / 2 + 0.35, 1.15, 0), 'g');
addLabel(() => L('金属腔壁 · 全反射', 'metal walls · total reflection'), new THREE.Vector3(0, 1.85, -D / 2), '');
addLabel(() => L('波节:电场≈0 → 冷', 'node: E≈0 → cold'), new THREE.Vector3(X0 + 2 * HALF, 1.45, 0), 'b');
addLabel(() => L('波腹:电场最强 → 热', 'antinode: max E → hot'), new THREE.Vector3(X0 + 3.5 * HALF, 0.76, 0), 'hot');
const lblDip = addLabel(() => L('水分子偶极(放大示意)', 'water dipoles (magnified)'), new THREE.Vector3(0, 0.55, 0), 'b', arrowGrp);
addLabel(() => L('转盘(约 6 rpm)', 'turntable (~6 rpm)'), new THREE.Vector3(-0.75, 0.34, 0.75), '');
const lblStatus = addLabel(() => '…', new THREE.Vector3(0, 2.62, 0), 'st');

/* ================= 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let watts = clamp(qsFloat('power', 800), 200, 1000);
let turn = qsBool('turn', true);
let tSim = 0;
let tNar = clamp(qsFloat('t', 0), 0, 39.9);
let theta = 0;
let curPhase = -1;
const DUR = 8;
const em = { b: 1, f: 0.4, d: 0.6 }, emT = { b: 1, f: 0.4, d: 0.6 };
function resetButter() { cellT.fill(20); }

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '磁控管:2.45 GHz 微波源', be: 'Magnetron: the 2.45 GHz source',
    d: '电子在磁场里绕圈共振,把高压直流变成微波,经波导灌进炉腔——频率被划在免许可的 ISM 频段。',
    de: 'Electrons spiral in a magnetron, turning high-voltage DC into microwaves that a waveguide pours into the cavity — parked in the license-free ISM band.' },
  { b: '金属壁反射:叠成驻波', be: 'Metal walls build a standing wave',
    d: '微波在腔壁间来回全反射,入射波与反射波叠加成驻波:波节间距恒为 λ/2 = 6.1 cm,位置纹丝不动。',
    de: 'Microwaves bounce wall to wall; incident and reflected waves lock into a standing wave — nodes pinned every λ/2 = 6.1 cm.' },
  { b: '偶极翻转:摩擦生热', be: 'Dipoles flip → friction heats',
    d: '水分子是电偶极子:电场每秒调头 24.5 亿次,它们狂转追随、与邻居磕磕碰碰,转动动能化作热;瓷盘几乎不含水、不吸收微波,所以一直是凉的。',
    de: 'Water molecules are dipoles: the field reverses 2.45 billion times a second; they whip around chasing it and the jostling becomes heat. The dry ceramic plate absorbs almost nothing — it stays cool.' },
  { b: '停掉转盘:冷热点现身', be: 'Stop the table: hot & cold spots',
    d: '波腹处偶极翻得最凶→熔成几条热斑;波节处电场≈0→保持生冷,条纹间距 = λ/2 ≈ 6.1 cm。彩蛋:量出间距 d,λ=2d,c=fλ≈3×10⁸ m/s——黄油量出了光速!',
    de: 'Antinode bands melt; node columns stay raw — spacing = λ/2 ≈ 6.1 cm. Bonus: measure the spacing d, then λ=2d and c=fλ≈3×10⁸ m/s — light speed, measured with butter.' },
  { b: '打开转盘:把冷热搅匀', be: 'Spin the table: even heat',
    d: '食物随转盘扫过整张驻波图,每块都轮流做客波腹——没有固定位置独占热量,冷点逐渐清零(看右下读数):这就是转盘存在的理由。',
    de: 'The food sweeps the whole pattern; every chunk takes a turn at the antinodes — no spot hogs the dose and the cold spots clear out (watch the readout): that is why the turntable exists.' },
];
function applyPhase(p) {
  const t = [
    { b: 1, f: 0.35, d: 0.6 },
    { b: 0.45, f: 1, d: 0.6 },
    { b: 0.35, f: 0.85, d: 1 },
    { b: 0.35, f: 0.9, d: 0.9 },
    { b: 0.35, f: 0.9, d: 0.9 },
  ][p];
  emT.b = t.b; emT.f = t.f; emT.d = t.d;
  if (p === 0) { setTurn(true); resetButter(); }
  if (p === 3) { setTurn(false); resetButter(); }
  if (p === 4) setTurn(true);
}
const PHASE_TXT = [
  ['磁控管工作中:微波经波导注入炉腔', 'magnetron on: microwaves pour through the waveguide'],
  ['入射波 + 反射波 → 驻波,波节间距 6.1 cm', 'incident + reflected waves → standing wave, nodes every 6.1 cm'],
  ['偶极每秒调头 24.5 亿次,碰撞生热', 'dipoles flip 2.45 billion times a second — friction heats'],
  ['转盘停:热斑只出现在波腹,间距 λ/2 ≈ 6.1 cm', 'table off: melt bands only at antinodes, λ/2 ≈ 6.1 cm apart'],
  ['转盘转:轮流做客波腹,冷点清零', 'table on: everyone takes a turn at the antinodes — cold spots clear'],
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { tNar = i * DUR; });
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elPower = document.getElementById('power');
const elPowerVal = document.getElementById('powerVal');
const btnTurn = document.getElementById('btnTurn');
const tglLabels = document.getElementById('tglLabels');
const tglField = document.getElementById('tglField');
const tglDip = document.getElementById('tglDip');
const tglRotate = document.getElementById('tglRotate');
const stT = document.getElementById('stT'), stD = document.getElementById('stD');
const heatFill = document.getElementById('heatFill'), heatPct = document.getElementById('heatPct');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setTurnLabel() {
  btnTurn.classList.toggle('on', !turn);
  btnTurn.textContent = turn ? L('转盘:转(点击停止)', 'table: on (click to stop)') : L('转盘:停(点击启动)', 'table: off (click to spin)');
}
function setTurn(v) { turn = v; setTurnLabel(); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elPower.value = watts;
elPowerVal.textContent = watts.toFixed(0) + ' W';
elPower.addEventListener('input', () => { watts = parseFloat(elPower.value); elPowerVal.textContent = watts.toFixed(0) + ' W'; });
const elProg = document.getElementById('prog'), elProgVal = document.getElementById('progVal');
let scrub = false;
elProg.addEventListener('pointerdown', () => { scrub = true; });
addEventListener('pointerup', () => { scrub = false; });
elProg.addEventListener('input', () => { tNar = parseFloat(elProg.value) * DUR; curPhase = -1; });
btnTurn.addEventListener('click', () => setTurn(!turn));
document.getElementById('btnReset').addEventListener('click', resetButter);
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglField.addEventListener('change', () => {
  const v = tglField.checked;
  curtain.visible = carpet.visible = ribbon.visible = v;
  nodeDots.forEach(s => s.visible = v);
  antiDots.forEach(s => s.visible = v);
});
tglDip.addEventListener('change', () => { arrowGrp.visible = tglDip.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
const cCold = new THREE.Color(0xf4d97b), cWarm = new THREE.Color(0xffb14e), cHot = new THREE.Color(0xff7a1f);
const cACold = new THREE.Color(0x6cb8ff), cAHot = new THREE.Color(0xffb35c);
const tmpC = new THREE.Color();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) { tSim += dts; tNar += dts; }
  const pow01 = watts / 1000;
  const cosPhi = Math.cos(tSim * 2 * Math.PI * 1.1);

  /* 相位推进 */
  const p = Math.floor(tNar / DUR) % 5;
  if (p !== curPhase) { curPhase = p; applyPhase(p); }
  if (!scrub) elProg.value = ((tNar / DUR) % 5).toFixed(2);
  em.b = lerp(em.b, emT.b, Math.min(1, dt * 2.5));
  em.f = lerp(em.f, emT.f, Math.min(1, dt * 2.5));
  em.d = lerp(em.d, emT.d, Math.min(1, dt * 2.5));
  const uPow = 0.25 + 0.75 * pow01;

  /* 转盘(约 6 rpm) */
  if (turn && playing) theta += 0.63 * dts;
  turnGrp.rotation.y = theta;
  const cth = Math.cos(theta), sth = Math.sin(theta);

  /* 驻波场 */
  for (const m of [curtain, carpet]) {
    m.material.uniforms.uT.value = cosPhi;
    m.material.uniforms.uPow.value = uPow;
    m.material.uniforms.uEm.value = em.f;
  }
  const rp = ribGeo.attributes.position;
  for (let i = 0; i <= RSEG; i++) {
    const x = X0 + W * i / RSEG;
    rp.setXYZ(i, x, 1.1 + 0.42 * sgnAt(x) * cosPhi * uPow, 0);
  }
  rp.needsUpdate = true;
  antiDots.forEach(s => s.scale.setScalar((0.65 + 0.55 * Math.abs(cosPhi)) * uPow));

  /* 光子点:在两壁间往返 */
  beamDots.forEach(d => {
    const pr = (tSim * 0.32 + d.userData.off) % 2;
    const tri = pr < 1 ? pr : 2 - pr;
    d.position.set(X0 + tri * W, d.userData.y, d.userData.z);
    d.material.opacity = em.b * uPow * (0.2 + 0.6 * Math.abs(cosPhi));
    d.visible = em.b > 0.05;
  });
  mouth.material.opacity = em.b * uPow * (0.4 + 0.6 * Math.abs(cosPhi));

  /* 偶极箭头:场强处追随翻转,波节处冻结 */
  arrows.forEach((a, i) => {
    const xw = (BX + a.lx) * cth + (BZ + a.lz) * sth;
    const E = sgnAt(xw) * cosPhi;
    const env = envAt(xw);
    if (Math.abs(E) > 0.3) {
      const target = E > 0 ? 0 : Math.PI;
      a.a += (target - a.a) * Math.min(1, dts * (3 + 16 * env * pow01));
    }
    a.a += Math.sin(tSim * 13 + i * 3.7) * 0.0016;
    a.g.rotation.z = a.a;
    a.act = lerp(a.act, env * uPow, Math.min(1, dt * 3));
    tmpC.copy(cACold).lerp(cAHot, a.act);
    a.m.color.copy(tmpC);
    a.m.emissive.copy(tmpC).multiplyScalar(0.35);
  });
  arrowGrp.scale.setScalar(0.85 + 0.3 * em.d);
  lblDip.element.style.display = tglDip.checked && tglLabels.checked ? '' : 'none';

  /* 黄油加热:P ∝ E²(波腹强、波节零),内部导热缓慢匀化;熔点≈32°C */
  if (playing) {
    for (let i = 0; i < NCELL; i++) {
      const xw = (BX + cellPos[i][0]) * cth + (BZ + cellPos[i][1]) * sth;
      const env = envAt(xw);
      cellD[i] = 4.2 * pow01 * env * env - 0.015 * (cellT[i] - 20);
    }
    for (let i = 0; i < NCELL; i++) {
      let s = 0;
      for (const j of cellNbr[i]) s += cellT[j];
      cellT[i] += (cellD[i] + 0.08 * (s / cellNbr[i].length - cellT[i])) * dts;
    }
  }
  let sum = 0, cold = 0;
  for (let i = 0; i < NCELL; i++) {
    const T = cellT[i];
    sum += T; if (T < 32) cold++;
    const melt = clamp((T - 32) / 8, 0, 1);
    const sy = 1 - 0.45 * melt;
    dummy.position.set(cellPos[i][0], 0.09 * sy, cellPos[i][1]);
    dummy.scale.set(1, sy, 1);
    dummy.updateMatrix();
    cells.setMatrixAt(i, dummy.matrix);
    const h = clamp((T - 20) / 35, 0, 1);
    tmpC.copy(cCold).lerp(cWarm, Math.min(1, h * 1.6));
    if (h > 0.6) tmpC.lerp(cHot, (h - 0.6) / 0.4);
    cells.setColorAt(i, tmpC);
  }
  cells.instanceMatrix.needsUpdate = true;
  if (cells.instanceColor) cells.instanceColor.needsUpdate = true;
  const avg = sum / NCELL;

  /* 状态与读数 */
  lblStatus.element.textContent = L(...PHASE_TXT[curPhase < 0 ? 0 : curPhase]);
  stT.innerHTML = avg.toFixed(0) + '<small> °C</small>';
  stD.innerHTML = cold + '<small> 块</small>';
  stD.className = 'v ' + (cold > 8 ? 'hot' : 'g');
  const prog = clamp((avg - 20) / 50, 0, 1);
  heatFill.style.width = (prog * 100).toFixed(0) + '%';
  heatPct.textContent = (prog * 100).toFixed(0) + '%';

  if (curPhase !== lastStep) {
    lastStep = curPhase;
    elProgVal.textContent = (curPhase + 1) + '/5';
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === curPhase));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
setTurnLabel();
requestAnimationFrame(frame);
</script>
