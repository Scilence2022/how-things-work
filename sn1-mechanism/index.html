<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN1 反应 · 碳正离子中间体与外消旋化 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#29a3c9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0e7fa8;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--panel-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  .lbl.nu    { border-color: rgba(76,201,240,.9);  color: #bde9ff; }
  .lbl.x     { border-color: rgba(255,159,28,.9);  color: #ffd9a3; }
  .lbl.r     { border-color: rgba(255,255,255,.3); }
  .lbl.ts    { border-color: rgba(255,93,93,.9);   color: #ffc2c2; font-size: 12.5px; }
  .lbl.delta { background: rgba(60,20,20,.7); border-color: rgba(255,93,93,.7); color: #ff9d9d; }
  .lbl.inv   { border-color: rgba(144,190,109,.9); color: #d8f3c0; font-size: 13px; padding: 6px 11px; }
  .lbl.cat   { border-color: rgba(255,209,102,.9); color: #ffe9b8; font-size: 13px; padding: 6px 11px; }
  .lbl.rate  { border-color: rgba(144,190,109,.9); color: #d8f3c0; }
  .lbl.porb  { border-color: rgba(159,216,255,.85); color: #d6efff; font-size: 11.5px; }
  .lbl.fifty { border-color: rgba(255,255,255,.4); color: #eef3f8; font-size: 11px; padding: 2px 7px; }
  .lbl.ent   { border-color: rgba(199,125,255,.9); color: #ecd9ff; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.nu    { color: #0c6d92; }
  :root[data-theme="light"] .lbl.x     { color: #9a5205; }
  :root[data-theme="light"] .lbl.r     { color: #3e7a1f; border-color: rgba(110,160,80,.9); }
  :root[data-theme="light"] .lbl.ts    { color: #b32d2d; }
  :root[data-theme="light"] .lbl.delta { background: rgba(255,233,233,.88); color: #b32d2d; }
  :root[data-theme="light"] .lbl.inv   { color: #3e7a1f; }
  :root[data-theme="light"] .lbl.cat   { color: #8a6100; }
  :root[data-theme="light"] .lbl.rate  { color: #3e7a1f; }
  :root[data-theme="light"] .lbl.porb  { color: #0c6d92; }
  :root[data-theme="light"] .lbl.fifty { color: #33414f; border-color: rgba(15,25,40,.35); }
  :root[data-theme="light"] .lbl.ent   { color: #6d28c9; }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 250px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    max-height: calc(100vh - 110px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.nu  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.x   { color: #ffd9a3; border-color: rgba(255,159,28,.7); }
  .chip.r   { color: #d8f3c0; border-color: rgba(144,190,109,.7); }
  .chip.dim { color: #b9c4d0; border-color: rgba(255,255,255,.22); }
  :root[data-theme="light"] .chip.nu  { color: #0c6d92; }
  :root[data-theme="light"] .chip.x   { color: #9a5205; }
  :root[data-theme="light"] .chip.r   { color: #3e7a1f; }
  :root[data-theme="light"] .chip.dim { color: #5b6b7d; border-color: rgba(15,25,40,.25); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c9efff; }
  :root[data-theme="light"] #steps li.on { background: rgba(14,127,168,.10); border-color: rgba(14,127,168,.45); }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }

  #vs { margin-top: 10px; }
  #vs .vs-t { font-size: 11.5px; color: var(--text2); margin-bottom: 5px; }
  #vs table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #vs th, #vs td { border: 1px solid var(--panel-border); padding: 3px 4px;
    text-align: center; color: var(--text2); }
  #vs th { background: var(--hover); color: var(--text3); font-weight: 600; }
  #vs td:first-child { color: var(--text2); }
  #vs td:nth-child(2) { color: #bde9ff; }
  #vs td:nth-child(3) { color: #ffd9a3; }
  :root[data-theme="light"] #vs td:nth-child(2) { color: #0c6d92; }
  :root[data-theme="light"] #vs td:nth-child(3) { color: #9a5205; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }

  /* 能量曲线（2D 覆盖层） */
  #energy { position: fixed; right: 20px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 10px 4px;
    backdrop-filter: blur(6px); }
  #energy text { font-family: inherit; }
  @media (max-width: 900px) { #energy { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="title">
  <h1 data-zh="SN1 反应为什么会外消旋化？—— 碳正离子中间体" data-en="Why does an SN1 reaction racemize? — The carbocation intermediate">SN1 反应为什么会外消旋化？—— 碳正离子中间体</h1>
  <div class="sub" data-zh="3D 交互演示 · 两步机理：C–Br 异裂 → 平面碳正离子（空 p 轨道）→ H₂O 两面等概率进攻" data-en="Interactive 3D · two-step mechanism: C–Br heterolysis → planar carbocation (empty p orbital) → H₂O attacks either face, 50 : 50">3D 交互演示 · 两步机理：C–Br 异裂 → 平面碳正离子（空 p 轨道）→ H₂O 两面等概率进攻</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip nu" data-zh="H₂O 亲核试剂" data-en="H₂O nucleophile">H₂O 亲核试剂</span>
    <span class="chip x" data-zh="Br 离去基团" data-en="Br leaving group">Br 离去基团</span>
    <span class="chip r" data-zh="Me·Et·Pr 三种烷基 → 手性碳" data-en="Me·Et·Pr alkyls → chiral C">Me·Et·Pr 三种烷基 → 手性碳</span>
    <span class="chip dim" data-zh="两步 · 经碳正离子中间体" data-en="Two steps · via carbocation">两步 · 经碳正离子中间体</span>
  </div>
  <ol id="steps"></ol>
  <div id="vs">
    <div class="vs-t" data-zh="SN2 ⇄ SN1 一图对比" data-en="SN2 ⇄ SN1 at a glance">SN2 ⇄ SN1 一图对比</div>
    <table>
      <tr><th></th><th>SN2</th><th>SN1</th></tr>
      <tr><td data-zh="机理" data-en="Mechanism">机理</td><td data-zh="一步协同" data-en="One concerted step">一步协同</td><td data-zh="两步 · 经 C⁺" data-en="Two steps · via C⁺">两步 · 经 C⁺</td></tr>
      <tr><td data-zh="进攻" data-en="Attack">进攻</td><td data-zh="背面 180°" data-en="Backside 180°">背面 180°</td><td data-zh="两面各 50%" data-en="Either face, 50%">两面各 50%</td></tr>
      <tr><td data-zh="立体" data-en="Stereo">立体</td><td data-zh="构型翻转" data-en="Inversion">构型翻转</td><td data-zh="外消旋化" data-en="Racemization">外消旋化</td></tr>
      <tr><td data-zh="速率" data-en="Rate">速率</td><td>v = k[RX][Nu⁻]</td><td>v = k[RX]</td></tr>
    </table>
  </div>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>

  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglOrb" type="checkbox" checked> <span data-zh="空 p 轨道" data-en="Empty p orbital">空 p 轨道</span></label>
    <label><input id="tglArrows" type="checkbox" checked> <span data-zh="电子流箭头" data-en="Electron-flow arrows">电子流箭头</span></label>
    <label><input id="tglSn2" type="checkbox" checked> <span data-zh="SN2 对比曲线" data-en="SN2 curve">SN2 对比曲线</span></label>

</div>

<div id="energy">
  <svg id="energySvg" width="292" height="182" viewBox="0 0 292 182"></svg>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);
  tweakMaterials();
  applySvgTheme();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(n => {
    n.textContent = LANG === 'en' ? n.dataset.en : n.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('SN1 反应 · 碳正离子中间体与外消旋化 3D 动画',
                     'SN1 Reaction · Carbocation Intermediate & Racemization 3D');
  buildSteps();
  setPlayLabel();
  applyStaticLabelLangs();
  applySvgLang();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：反应几何与时序 ---------------- */
// 时间窗口（tt ∈ [-0.04, 0.96)，一个周期在 0.96 处打点复位）
const CYCLE_SECONDS = 11.5;
const T_ION = [0.09, 0.30];   // ① C–Br 异裂 · Br⁻ 离去（RDS，翻越 TS1）
const T_CAT = [0.30, 0.50];   // ② 平面碳正离子中间体（空 p 轨道）
const T_ATK = [0.50, 0.68];   // ③ H₂O 两面进攻（TS2）
const T_DEP = [0.68, 0.78];   // ④ 去质子化（快）
const T_RAC = 0.78;           // ⑤ 外消旋产物展示（0.78 → 0.90 后淡出）

const D2R = Math.PI / 180;
const THETA_SP3 = Math.acos(-1 / 3);   // 109.47°（sp³ 底物 / 产物）
const THETA_SP2 = Math.PI / 2;         // 90°（碳正离子：三基团共平面）
const THETA_INV = Math.acos(1 / 3);    // 70.53°（三基团翻离进攻面）
const AZ = [90, 210, 330].map(d => d * D2R);  // 三种烷基的方位角：甲基(+z) 乙基 丙基
const L_R = 0.95;       // C–R 键长
const L_BR0 = 1.15;     // C–Br 初键长
const L_CO0 = 0.98;     // 产物 C–O 键长
const NU_FAR = 3.6;     // H₂O 起始距离

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();   // 背景色由 applyTheme() 依 PAL.bg 设置
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.3, 2.3, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.55);
fill.position.set(-5, 2, -4);
scene.add(fill);

/* ---------------- 材质（全部独立实例，供整周期淡入淡出） ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.05,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const fadeMats = [];   // 参与整周期淡入淡出的材质
function fade(m, baseOp = 1) { m.transparent = true; m.userData.baseOp = baseOp; fadeMats.push(m); return m; }

const M = {
  C:   fade(mat(0x5b6270, { roughness: 0.35, metalness: 0.3 })),
  Br:  fade(mat(0xff9f1c, { emissiveIntensity: 0.3 })),
  haloBr: fade(new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.0,
          depthWrite: false }), 0.0),
  R1:  fade(mat(0x90be6d)),   // 甲基（小）
  R2:  fade(mat(0xc77dff)),   // 乙基（中）
  R3:  fade(mat(0xff70a6)),   // 丙基（大）
  bondC:  fade(mat(0xcfd4dc, { roughness: 0.3, metalness: 0.6 })),
  bondCBr: fade(mat(0xd8b48a, { roughness: 0.3, metalness: 0.6 })),

const lblRacem = addLabel(L('外消旋混合物 (±) · R : S = 50 : 50', 'Racemic mixture (±) · R : S = 50 : 50'), V3(0, 2.1, 0), 'inv', scene);
const lblMirror = addLabel(L('互为镜像 · 以三基团平面为镜', 'Mirror images · across the three-alkyl plane'), V3(0, 0.05, 1.55), 'r', scene);
const lblProdA = addLabel(L('R 产物 · 50%（来自下面进攻）', 'R product · 50% (attack from below)'), V3(0, -1.95, 0), 'inv');
const lblProdB = addLabel(L('S 产物 · 50%（来自上面进攻）', 'S product · 50% (attack from above)'), V3(0, 1.8, 0), 'ent', prodB);
const lblSolvent = addLabel(L('极性溶剂分子', 'Polar solvent molecule'), V3(0.28, 0.22, 0), 'r', solv[0]);

// 静态 3D 标签：语言切换时重设文本（动态标签 lblBr/lblC/lblNu 每帧用 L() 重写，无需在此处理）
function applyStaticLabelLangs() {
  lblR.forEach((o, i) => { o.element.textContent = L(R_NAMES[i][0], R_NAMES[i][1]); });
  lblGh.element.textContent = L('H₂O · 另一面', 'H₂O · other face');
  lblTS1.element.textContent = L('TS1 ‡ 决速过渡态（C–Br 异裂中）', 'TS1 ‡ rate-determining TS (C–Br breaking)');
  lblRate.element.textContent = L('决速步 → v = k[RX]（一级反应）', 'RDS → v = k[RX] (first order)');
  lblCation.element.textContent = L('平面碳正离子 · 上下两面等价', 'Planar carbocation · both faces equivalent');
  lblPOrb.element.textContent = L('空 p 轨道（上下两瓣 · 无电子）', 'Empty p orbital (two lobes · no electrons)');
  lblFaces.element.textContent = L('两面进攻 · 机会均等', 'Both faces attacked · equal chance');
  lblDep.element.textContent = L('去质子化（快）· H⁺ 交给溶剂', 'Deprotonation (fast) · H⁺ handed to solvent');
  lblRacem.element.textContent = L('外消旋混合物 (±) · R : S = 50 : 50', 'Racemic mixture (±) · R : S = 50 : 50');
  lblMirror.element.textContent = L('互为镜像 · 以三基团平面为镜', 'Mirror images · across the three-alkyl plane');
  lblProdA.element.textContent = L('R 产物 · 50%（来自下面进攻）', 'R product · 50% (attack from below)');
  lblProdB.element.textContent = L('S 产物 · 50%（来自上面进攻）', 'S product · 50% (attack from above)');
  lblSolvent.element.textContent = L('极性溶剂分子', 'Polar solvent molecule');
}

/* ---------------- 每帧更新 ---------------- */
function opOf(tt) {   // 整体淡入淡出（tt<0 表示新周期开头）
  return ss(-0.045, 0, tt) * (1 - ss(0.90, 0.945, tt));
}

function updateWorld(tt, time) {
  const op = opOf(tt);
  for (const m of fadeMats) m.opacity = m.userData.baseOp * op;

  const cationK = ss(0.26, 0.34, tt) * (1 - ss(0.54, 0.62, tt));
  M.C.emissiveIntensity = 0.12 + 0.55 * cationK;   // 碳正离子阶段中心碳微微发亮

  /* --- Br：异裂离去（RDS）--- */
  let bx, by, bz;
  if (tt < 0.09) { bx = 0; by = L_BR0; bz = 0; }
  else if (tt < 0.24) { bx = 0; by = lerp(L_BR0, 2.1, ss(0.09, 0.24, tt)); bz = 0; }
  else if (tt < 0.33) { bx = 0; by = lerp(2.1, 3.1, ss(0.24, 0.33, tt)); bz = 0; }
  else {
    const k = ss(0.33, 0.55, tt);
    bx = lerp(0, -1.9, k); by = lerp(3.1, 3.0, k); bz = lerp(0, -0.8, k);
  }
  Br.position.set(bx, by, bz);
  haloBr.position.copy(Br.position);
  const brIonOp = ss(0.20, 0.32, tt);               // 变成 Br⁻ 后出现电子云光晕
  M.haloBr.opacity = 0.22 * op * brIonOp;

  /* --- 三个烷基：sp³ → sp² 共平面 → 重新 sp³（伞面翻离进攻面）--- */
  let theta;
  if (tt < 0.11) theta = THETA_SP3;
  else if (tt < 0.28) theta = lerp(THETA_SP3, THETA_SP2, ss(0.11, 0.28, tt));
  else if (tt < 0.60) theta = THETA_SP2;
  else theta = lerp(THETA_SP2, THETA_INV, ss(0.60, 0.74, tt));
  Rs.forEach((r, i) => {
    r.position.set(L_R * Math.sin(theta) * Math.cos(AZ[i]),
                   L_R * Math.cos(theta),
                   L_R * Math.sin(theta) * Math.sin(AZ[i]));
  });

  /* --- 空 p 轨道（中间体阶段出现，进攻时被占用而消退）--- */
  const lobeOp = ss(0.24, 0.32, tt) * (1 - ss(0.54, 0.64, tt));
  const lobesOn = tglOrb.checked && lobeOp > 0.02;
  lobeT.visible = lobeB.visible = pAxis.visible = lobesOn;
  M.lobe.opacity = 0.30 * op * lobeOp;
  M.axis.opacity = 0.55 * op * lobeOp;

  /* --- C–Br 键：拉长、变淡 → 异裂 --- */
  const cbrOp = tt < 0.24 ? 1 : clamp(1 - ss(0.24, 0.32, tt), 0, 1);
  M.bondCBr.opacity = M.bondCBr.userData.baseOp * op * cbrOp;
  stickCBr.visible = cbrOp > 0.02;
  if (stickCBr.visible) placeStick(stickCBr, C.position, Br.position);
  const dBrOp = ss(0.09, 0.13, tt) * (1 - ss(0.24, 0.29, tt)) * op;   // 异裂中的部分键
  M.dot.opacity = dBrOp * 0.9;
  placeDots(dotsBr, C.position, Br.position, dBrOp);

  /* --- H₂O 两面进攻：主水（下）成键，幽灵水（上）表明另一半机会 --- */
  const watIn = ss(0.38, 0.48, tt);
  let dy;   // 主水 O 的 y
  if (tt < 0.50) dy = -NU_FAR;
  else if (tt < 0.60) dy = -lerp(NU_FAR, 1.55, ss(0.50, 0.60, tt));
  else dy = -lerp(1.55, L_CO0, ss(0.60, 0.70, tt));
  wat.g.position.set(0, dy, 0.45);
  const ghostOp = watIn * (1 - ss(0.58, 0.68, tt));
  let gy;
  if (tt < 0.50) gy = NU_FAR;
  else if (tt < 0.60) gy = lerp(NU_FAR, 1.7, ss(0.50, 0.60, tt));
  else gy = lerp(1.7, 2.5, ss(0.60, 0.70, tt));
  gh.g.position.set(0, gy, -0.45);
  gh.g.visible = ghostOp > 0.02;
  for (const m of watMats) m.opacity = op * watIn;
  M.depH.opacity = op * watIn * (1 - ss(0.78, 0.84, tt));
  for (const m of ghostMats) m.opacity = op * ghostOp;

  /* --- C–O 成键：TS2 部分键 → 实体键 --- */
  const dOOp = ss(0.54, 0.60, tt) * (1 - ss(0.66, 0.72, tt)) * op;
  if (dOOp > dBrOp) M.dot.opacity = dOOp * 0.9;
  placeDots(dotsO, C.position, wat.O.position, dOOp);
  const coOp = ss(0.62, 0.70, tt);
  M.bondCO.opacity = M.bondCO.userData.baseOp * op * coOp;
  stickCO.visible = coOp > 0.02;
  if (stickCO.visible) placeStick(stickCO, C.position, wat.O.position);

  /* --- 去质子化：一个 H 带着电子对离开氧 --- */
  const depK = ss(0.70, 0.80, tt);
  wat.H1.position.lerpVectors(V3(0.21, 0.11, 0.05),
    V3(1.5, 1.6 - dy, 0.35 - 0.45), depK);

  /* --- 外消旋展示：产物 A 左移，镜像产物 B 淡入 --- */
  const pBk = ss(0.80, 0.86, tt);
  mol.position.x = -1.75 * ss(0.78, 0.86, tt);
  prodB.visible = pBk > 0.02;
  if (prodB.visible) for (const m of pbMats) m.opacity = op * pBk;
  M.plane.opacity = 0.06 * op * pBk;
  mirrorPlane.visible = pBk > 0.02;

  /* --- 溶剂分子微弱漂浮 --- */
  solv.forEach((s, i) => {
    s.position.y = s.userData.baseY + Math.sin(time * 1.3 + i * 1.7) * 0.06;
  });

  /* --- 电子流向箭头 --- */
  clearDyn();
  const ionA = ss(0.10, 0.15, tt) * (1 - ss(0.22, 0.27, tt));
  const atkA = ss(0.52, 0.58, tt) * (1 - ss(0.62, 0.68, tt));
  const depA = ss(0.72, 0.76, tt) * (1 - ss(0.78, 0.82, tt));
  let arrowK = 0;
  if (tglArrows.checked) {
    if (ionA > 0.02) {   // σ(C–Br) 电子对整体流向 Br（异裂）
      arrowK = ionA;
      curvedArrow(V3(0.10, by * 0.40, 0.06), V3(0.46, by * 0.72, 0.18), V3(0.14, by * 1.04, 0.10));
    }
    if (atkA > 0.02) {   // 两面水分子的孤对电子 → 空 p 轨道
      arrowK = Math.max(arrowK, atkA);
      const wO = wat.O.position, gO = gh.O.position;
      curvedArrow(wO.clone().add(V3(0.15, 0.30, 0.08)), V3(0.45, wO.y * 0.45, 0.30), V3(0.12, -0.36, -0.06));
      curvedArrow(gO.clone().add(V3(-0.15, -0.30, 0.08)), V3(-0.45, gO.y * 0.45, 0.30), V3(-0.12, 0.36, -0.06));
    }
    if (depA > 0.02) {   // O–H 键电子对回到 O（去质子化）
      arrowK = Math.max(arrowK, depA);
      const oW = wat.g.position;
      const h1W = V3().addVectors(oW, wat.H1.position);
      curvedArrow(h1W.clone().add(V3(0.05, 0.15, 0.02)),
                  V3(oW.x + 0.42, (h1W.y + oW.y) / 2, oW.z + 0.18),
                  oW.clone().add(V3(0.17, 0.12, 0.05)));
    }
  }
  M.arrow.opacity = 0.95 * op * arrowK;

  /* --- 标签内容 / 显隐 --- */
  const lblOp = op;
  for (const o of labelObjs) o.element.style.opacity = lblOp;
  const opac = (o, k) => { o.element.style.opacity = lblOp * clamp(k, 0, 1); };

  lblBr.element.innerHTML = tt < 0.28 ? L('Br 离去基团', 'Br leaving group')
    : L('Br⁻（已带走电子对）', 'Br⁻ (electron pair gone)');
  lblC.element.textContent = tt < 0.26 ? L('中心碳（手性）', 'Central C (chiral)')
    : (tt < 0.60 ? L('C⁺ 碳正离子（sp² 平面）', 'C⁺ carbocation (sp², planar)')
                 : L('中心碳（重新 sp³）', 'Central C (sp³ again)'));
  opac(lblC, 1 - ss(0.68, 0.72, tt));
  lblNu.element.textContent = tt < 0.68 ? L('H₂O 亲核试剂', 'H₂O nucleophile')
    : (tt < 0.80 ? L('–OH₂⁺ 氧鎓离子', '–OH₂⁺ oxonium ion') : L('–OH（醇）', '–OH (alcohol)'));
  lblNu.position.set(tt < 0.62 ? 0 : 0.62, tt < 0.62 ? 0.5 : -0.12, 0);
  opac(lblNu, watIn);
  opac(lblGh, ghostOp);
  opac(lblBr, 1);
  opac(lblTS1, ss(0.09, 0.12, tt) * (1 - ss(0.26, 0.30, tt)));
  opac(lblRate, ss(0.10, 0.14, tt) * (1 - ss(0.26, 0.30, tt)));
  opac(lblDeltaBr, ss(0.10, 0.13, tt) * (1 - ss(0.22, 0.26, tt)));
  opac(lblDeltaC, ss(0.10, 0.13, tt) * (1 - ss(0.22, 0.26, tt)));
  opac(lblCation, ss(0.26, 0.32, tt) * (1 - ss(0.50, 0.56, tt)));
  opac(lblPOrb, lobeOp);
  const fiftyK = ss(0.40, 0.46, tt) * (1 - ss(0.58, 0.64, tt));
  opac(lbl50a, fiftyK);
  opac(lbl50b, fiftyK);
  opac(lblFaces, ss(0.50, 0.55, tt) * (1 - ss(0.62, 0.68, tt)));
  opac(lblDeltaO, ss(0.56, 0.60, tt) * (1 - ss(0.70, 0.74, tt)));
  opac(lblDep, ss(0.70, 0.74, tt) * (1 - ss(0.80, 0.84, tt)));
  opac(lblRacem, ss(0.80, 0.86, tt));
  opac(lblMirror, ss(0.82, 0.88, tt));
  opac(lblProdA, ss(0.80, 0.86, tt));
  opac(lblProdB, ss(0.80, 0.86, tt));
  opac(lblSolvent, tt < 0.09 ? 1 : 1 - ss(0.09, 0.14, tt));

  /* --- 能量游标 --- */
  const p = progOf(tt);
  const ex = svg._px(p), ey = svg._py(energyOf(p));
  markerDot.setAttribute('cx', ex); markerDot.setAttribute('cy', ey);
  markerLine.setAttribute('x1', ex); markerLine.setAttribute('x2', ex);
  markerLine.setAttribute('y1', svg._py(0.12) + 8); markerLine.setAttribute('y2', ey);
  markerDot.setAttribute('opacity', op);
  markerLine.setAttribute('opacity', 0.5 * op);

  return op;
}

/* ---------------- UI 接线 ---------------- */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglOrb = document.getElementById('tglOrb');
const tglArrows = document.getElementById('tglArrows');
const tglSn2 = document.getElementById('tglSn2');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglSn2.addEventListener('change', () => { sn2G.style.display = tglSn2.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('top') === '1') {   // 俯视机位：检验三基团共平面 + 两面对称
  camera.position.set(0.01, 9.5, 0.01);
  controls.target.set(0, 0, 0);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
// tt ∈ [-0.04, 0.96)：把 cycles 的相位映射到带复位窗口的时间轴
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const tt = phase(cycles);

  updateWorld(tt, cycles * CYCLE_SECONDS);

  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
applyTheme();
applyLang();
updateWorld(phase(cycles));
requestAnimationFrame(frame);
</script>
</body>
