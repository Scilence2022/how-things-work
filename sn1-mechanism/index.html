<!DOCTYPE html>

<title>SN1 反应 · 碳正离子中间体与外消旋化 3D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: rgba(12,16,23,.78); border: 1px solid rgba(255,255,255,.16);
    color: #e6ecf3; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;

  .lbl.nu    { border-color: rgba(76,201,240,.9);  color: #bde9ff; }
  .lbl.x     { border-color: rgba(255,159,28,.9);  color: #ffd9a3; }
  .lbl.r     { border-color: rgba(255,255,255,.3); }
  .lbl.ts    { border-color: rgba(255,93,93,.9);   color: #ffc2c2; font-size: 12.5px; }
  .lbl.delta { background: rgba(60,20,20,.7); border-color: rgba(255,93,93,.7); color: #ff9d9d; }
  .lbl.inv   { border-color: rgba(144,190,109,.9); color: #d8f3c0; font-size: 13px; padding: 6px 11px; }
  .lbl.cat   { border-color: rgba(255,209,102,.9); color: #ffe9b8; font-size: 13px; padding: 6px 11px; }
  .lbl.rate  { border-color: rgba(144,190,109,.9); color: #d8f3c0; }
  .lbl.porb  { border-color: rgba(159,216,255,.85); color: #d6efff; font-size: 11.5px; }
  .lbl.fifty { border-color: rgba(255,255,255,.4); color: #eef3f8; font-size: 11px; padding: 2px 7px; }
  .lbl.ent   { border-color: rgba(199,125,255,.9); color: #ecd9ff; font-size: 13px; padding: 6px 11px; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;

  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;

  #steps li.on .n { background: #29a3c9; color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }

  #vs { margin-top: 10px; }
  #vs .vs-t { font-size: 11.5px; color: #9fb0c3; margin-bottom: 5px; }
  #vs table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #vs th, #vs td { border: 1px solid rgba(255,255,255,.09); padding: 3px 4px;
    text-align: center; color: #b9c4d0; }
  #vs th { background: rgba(255,255,255,.04); color: #dfe6ee; font-weight: 600; }
  #vs td:first-child { color: #8a96a6; }
  #vs td:nth-child(2) { color: #bde9ff; }
  #vs td:nth-child(3) { color: #ffd9a3; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px;
    background: #29a3c9; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { background: #35b5dc; }
  input[type=range] { width: 100%; accent-color: #29a3c9; height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: #b9c4d0; display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: #29a3c9; }

  /* 能量曲线（2D 覆盖层） */
  #energy { position: fixed; right: 20px; bottom: 18px; z-index: 4; background: rgba(13,17,24,.82);
    border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 8px 10px 4px;
    backdrop-filter: blur(6px); }
  #energy text { font-family: inherit; }
  @media (max-width: 900px) { #energy { display: none; } }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); max-height: 55vh; } }

<body>
<div id="app"></div>

<div id="title">
  <h1>SN1 反应为什么会外消旋化？—— 碳正离子中间体</h1>
  <div class="sub">3D 交互演示 · 两步机理：C–Br 异裂 → 平面碳正离子（空 p 轨道）→ H₂O 两面等概率进攻</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip nu">H₂O 亲核试剂</span>
    <span class="chip x">Br 离去基团</span>
    <span class="chip r">Me·Et·Pr 三种烷基 → 手性碳</span>

  </div>

  <div id="vs">
    <div class="vs-t">SN2 ⇄ SN1 一图对比</div>
    <table>
      <tr><th></th><th>SN2</th><th>SN1</th></tr>
      <tr><td>机理</td><td>一步协同</td><td>两步 · 经 C⁺</td></tr>
      <tr><td>进攻</td><td>背面 180°</td><td>两面各 50%</td></tr>
      <tr><td>立体</td><td>构型翻转</td><td>外消旋化</td></tr>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 常量：反应几何与时序 ---------------- */
// 时间窗口（tt ∈ [-0.04, 0.96)，一个周期在 0.96 处打点复位）
const CYCLE_SECONDS = 11.5;
const T_ION = [0.09, 0.30];   // ① C–Br 异裂 · Br⁻ 离去（RDS，翻越 TS1）
const T_CAT = [0.30, 0.50];   // ② 平面碳正离子中间体（空 p 轨道）
const T_ATK = [0.50, 0.68];   // ③ H₂O 两面进攻（TS2）
const T_DEP = [0.68, 0.78];   // ④ 去质子化（快）
const T_RAC = 0.78;           // ⑤ 外消旋产物展示（0.78 → 0.90 后淡出）

const D2R = Math.PI / 180;
const THETA_SP3 = Math.acos(-1 / 3);   // 109.47°（sp³ 底物 / 产物）
const THETA_SP2 = Math.PI / 2;         // 90°（碳正离子：三基团共平面）
const THETA_INV = Math.acos(1 / 3);    // 70.53°（三基团翻离进攻面）
const AZ = [90, 210, 330].map(d => d * D2R);  // 三种烷基的方位角：甲基(+z) 乙基 丙基
const L_R = 0.95;       // C–R 键长
const L_BR0 = 1.15;     // C–Br 初键长
const L_CO0 = 0.98;     // 产物 C–O 键长
const NU_FAR = 3.6;     // H₂O 起始距离

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.3, 2.3, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.55);
fill.position.set(-5, 2, -4);
scene.add(fill);

/* ---------------- 材质（全部独立实例，供整周期淡入淡出） ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.05,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const fadeMats = [];   // 参与整周期淡入淡出的材质
function fade(m, baseOp = 1) { m.transparent = true; m.userData.baseOp = baseOp; fadeMats.push(m); return m; }

const M = {
  C:   fade(mat(0x5b6270, { roughness: 0.35, metalness: 0.3 })),
  Br:  fade(mat(0xff9f1c, { emissiveIntensity: 0.3 })),
  haloBr: fade(new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.0,
          depthWrite: false }), 0.0),
  R1:  fade(mat(0x90be6d)),   // 甲基（小）
  R2:  fade(mat(0xc77dff)),   // 乙基（中）
  R3:  fade(mat(0xff70a6)),   // 丙基（大）
  bondC:  fade(mat(0xcfd4dc, { roughness: 0.3, metalness: 0.6 })),
  bondCBr: fade(mat(0xd8b48a, { roughness: 0.3, metalness: 0.6 })),
  bondCO:  fade(mat(0x9adcf2, { roughness: 0.3, metalness: 0.6 })),
  dot:  fade(new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 })),
  arrow: fade(new THREE.MeshBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0.95 })),
  axis: fade(new THREE.LineDashedMaterial({ color: 0x8899aa, dashSize: 0.14, gapSize: 0.1,
          transparent: true, opacity: 0.55 })),
  lobe: new THREE.MeshStandardMaterial({ color: 0x9fd8ff, emissive: 0x9fd8ff,
          emissiveIntensity: 0.3, transparent: true, opacity: 0, depthWrite: false }),
  solvent: fade(new THREE.MeshStandardMaterial({ color: 0x7f92ad, roughness: 0.6,
          transparent: true }), 0.38),
  plane: new THREE.MeshBasicMaterial({ color: 0x9fc4ff, transparent: true, opacity: 0,
          depthWrite: false, side: THREE.DoubleSide }),
  // 亲核试剂 H₂O（O 青 + 2 个白 H），离去 H 单独材质便于单独淡出
  O:    mat(0x4cc9f0, { emissiveIntensity: 0.4 }),
  H:    mat(0xe8eef5, { roughness: 0.5 }),
  depH: mat(0xe8eef5, { roughness: 0.5 }),
  Og:   mat(0x4cc9f0, { emissiveIntensity: 0.4 }),   // 幽灵水（另一面）
  Hg:   mat(0xe8eef5, { roughness: 0.5 }),
};
const watMats = [M.O, M.H, M.depH];
const ghostMats = [M.Og, M.Hg];

/* ---------------- 分子对象 ---------------- */
const mol = new THREE.Group();
scene.add(mol);

function sphere(r, m, parent) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m);
  parent.add(s); return s;
}
const C = sphere(0.30, M.C, mol);
// 三种烷基：大小各不相同，强化“互不相同 → 中心碳有手性”
const Rs = [sphere(0.17, M.R1, mol), sphere(0.21, M.R2, mol), sphere(0.25, M.R3, mol)];

// 离去基团放在独立组（不随产物平移），带 Br⁻ 电子云光晕
const leaving = new THREE.Group();
scene.add(leaving);
const Br = sphere(0.34, M.Br, leaving);
const haloBr = sphere(0.5, M.haloBr, leaving);

// 实体键：单位圆柱（高 1，原点在中点），每帧摆位
function stick(m, r, parent) {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 14), m);
  parent.add(s); return s;
}
const stickCBr = stick(M.bondCBr, 0.062, mol);
const stickCO = stick(M.bondCO, 0.062, mol);
const stickCR = [0, 1, 2].map(() => stick(M.bondC, 0.055, mol));

function placeStick(s, a, b) {
  const d = V3().subVectors(b, a);
  const len = d.length();
  if (len < 1e-4) { s.visible = false; return; }
  s.visible = true;
  s.position.copy(a).addScaledVector(d, 0.5);
  s.scale.set(1, len, 1);
  s.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
}
// 点状部分键（过渡态）
const dotGeo = new THREE.SphereGeometry(0.038, 10, 8);
function dottedBond(n = 4, parent) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) g.add(new THREE.Mesh(dotGeo, M.dot));
  parent.add(g); return g;
}
const dotsBr = dottedBond(4, mol), dotsO = dottedBond(4, mol);
function placeDots(g, a, b, op) {
  g.visible = op > 0.02;
  if (!g.visible) return;
  g.children.forEach((d, i) => {
    const k = (i + 1) / (g.children.length + 1);
    d.position.lerpVectors(a, b, k);
  });
}

/* ---- 空 p 轨道：上下两瓣哑铃（SN1 招牌视觉）---- */
const lobeGeo = new THREE.SphereGeometry(0.15, 20, 14);
const lobeT = new THREE.Mesh(lobeGeo, M.lobe);
lobeT.scale.set(1, 2.0, 1); lobeT.position.y = 0.56; mol.add(lobeT);
const lobeB = new THREE.Mesh(lobeGeo, M.lobe);
lobeB.scale.set(1, 2.0, 1); lobeB.position.y = -0.56; mol.add(lobeB);
const pAxis = (() => {   // 轨道中轴虚线
  const g = new THREE.BufferGeometry().setFromPoints([V3(0, -0.98, 0), V3(0, 0.98, 0)]);
  const l = new THREE.Line(g, M.axis);
  l.computeLineDistances();
  mol.add(l); return l;
})();

/* ---- 亲核试剂：H₂O（O + 2H）---- */
function makeWater(oM, h1M, h2M, parent) {
  const g = new THREE.Group();
  const O = sphere(0.26, oM, g);
  const H1 = sphere(0.115, h1M, g); H1.position.set(0.21, 0.11, 0.05);
  const H2 = sphere(0.115, h2M, g); H2.position.set(-0.17, 0.16, -0.07);
  parent.add(g);
  return { g, O, H1, H2 };
}
const wat = makeWater(M.O, M.depH, M.H, mol);   // 主水：从下面进攻 → 成键
const gh  = makeWater(M.Og, M.Hg, M.Hg, mol);   // 幽灵水：从上面进攻（另一半机会）

/* ---- 外消旋展示：镜像产物 B（OH 朝上，互为对映异构体）---- */
const prodB = new THREE.Group();
prodB.position.set(1.75, 0, 0);
scene.add(prodB);
const pbMats = [];
function pbMat(color, opts = {}) { const m = mat(color, opts); pbMats.push(m); return m; }
const pC = sphere(0.30, pbMat(0x5b6270, { roughness: 0.35, metalness: 0.3 }), prodB);
const pRs = [sphere(0.17, pbMat(0x90be6d), prodB),
             sphere(0.21, pbMat(0xc77dff), prodB),
             sphere(0.25, pbMat(0xff70a6), prodB)];
const pO = sphere(0.26, pbMat(0x4cc9f0, { emissiveIntensity: 0.4 }), prodB);
const pH = sphere(0.115, pbMat(0xe8eef5, { roughness: 0.5 }), prodB);
pO.position.set(0, L_CO0, 0);
pH.position.set(-0.17, L_CO0 + 0.16, -0.07);
pRs.forEach((r, i) => r.position.set(
  L_R * Math.sin(THETA_SP3) * Math.cos(AZ[i]),
  L_R * Math.cos(THETA_SP3),
  L_R * Math.sin(THETA_SP3) * Math.sin(AZ[i])));
const pSticks = [0, 1, 2].map(() => stick(pbMat(0xcfd4dc, { roughness: 0.3, metalness: 0.6 }), 0.055, prodB));
const pStickCO = stick(pbMat(0x9adcf2, { roughness: 0.3, metalness: 0.6 }), 0.062, prodB);
pRs.forEach((r, i) => placeStick(pSticks[i], pC.position, r.position));
placeStick(pStickCO, pC.position, pO.position);

/* ---- 极性溶剂分子（氛围，微弱漂浮）---- */
const SOLV = [[1.9, 0.6, 1.2], [-1.7, 0.9, -1.3], [0.8, -1.5, -1.9],
              [-2.1, -0.7, 0.9], [1.4, -1.1, 1.8], [-1.2, 1.7, 1.5]];
const solv = SOLV.map(p => {
  const s = sphere(0.085, M.solvent, scene);
  s.position.set(p[0], p[1], p[2]);
  s.userData.baseY = p[1];
  return s;
});

/* ---- 外消旋“镜面”：三基团所在平面（半透明）---- */
const mirrorPlane = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.6), M.plane);
mirrorPlane.rotation.x = -Math.PI / 2;
scene.add(mirrorPlane);

/* ---------------- 电子流向箭头（弯箭头，逐帧重建） ---------------- */
const dynGeoms = [], dynMeshes = [];
function clearDyn() {
  for (const g of dynGeoms) g.dispose();
  dynGeoms.length = 0;
  for (const m of dynMeshes) mol.remove(m);
  dynMeshes.length = 0;
}
function curvedArrow(p0, p1, p2, r = 0.028) {
  const curve = new THREE.QuadraticBezierCurve3(p0, p1, p2);
  const g = new THREE.TubeGeometry(curve, 24, r, 6, false);
  dynGeoms.push(g);
  const m = new THREE.Mesh(g, M.arrow);
  mol.add(m); dynMeshes.push(m);
  // 箭头锥
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.2, 12), M.arrow);
  tip.position.copy(p2);
  tip.quaternion.setFromUnitVectors(V3(0, 1, 0), V3().subVectors(p2, p1).normalize());
  dynGeoms.push(tip.geometry);
  mol.add(tip); dynMeshes.push(tip);
}

const EKEYS = [[0, 0.30], [0.20, 0.95], [0.40, 0.47], [0.62, 0.70], [0.80, 0.12], [1, 0.12]];
function energyOf(p) {
  p = clamp(p, 0, 1);

  if (tt < 0.78) return lerp(0.82, 0.90, ss(0.68, 0.78, tt));

}

/* ---------------- 每帧更新 ---------------- */
function opOf(tt) {   // 整体淡入淡出（tt<0 表示新周期开头）
  return ss(-0.045, 0, tt) * (1 - ss(0.90, 0.945, tt));
}

function updateWorld(tt, time) {
  const op = opOf(tt);
  for (const m of fadeMats) m.opacity = m.userData.baseOp * op;

  const cationK = ss(0.26, 0.34, tt) * (1 - ss(0.54, 0.62, tt));
  M.C.emissiveIntensity = 0.12 + 0.55 * cationK;   // 碳正离子阶段中心碳微微发亮

  /* --- Br：异裂离去（RDS）--- */
  let bx, by, bz;
  if (tt < 0.09) { bx = 0; by = L_BR0; bz = 0; }
  else if (tt < 0.24) { bx = 0; by = lerp(L_BR0, 2.1, ss(0.09, 0.24, tt)); bz = 0; }
  else if (tt < 0.33) { bx = 0; by = lerp(2.1, 3.1, ss(0.24, 0.33, tt)); bz = 0; }
  else {
    const k = ss(0.33, 0.55, tt);
    bx = lerp(0, -1.9, k); by = lerp(3.1, 3.0, k); bz = lerp(0, -0.8, k);
  }
  Br.position.set(bx, by, bz);
  haloBr.position.copy(Br.position);
  const brIonOp = ss(0.20, 0.32, tt);               // 变成 Br⁻ 后出现电子云光晕
  M.haloBr.opacity = 0.22 * op * brIonOp;

  /* --- 三个烷基：sp³ → sp² 共平面 → 重新 sp³（伞面翻离进攻面）--- */
  let theta;
  if (tt < 0.11) theta = THETA_SP3;
  else if (tt < 0.28) theta = lerp(THETA_SP3, THETA_SP2, ss(0.11, 0.28, tt));
  else if (tt < 0.60) theta = THETA_SP2;
  else theta = lerp(THETA_SP2, THETA_INV, ss(0.60, 0.74, tt));
  Rs.forEach((r, i) => {
    r.position.set(L_R * Math.sin(theta) * Math.cos(AZ[i]),
                   L_R * Math.cos(theta),
                   L_R * Math.sin(theta) * Math.sin(AZ[i]));
  });

  /* --- 空 p 轨道（中间体阶段出现，进攻时被占用而消退）--- */
  const lobeOp = ss(0.24, 0.32, tt) * (1 - ss(0.54, 0.64, tt));
  const lobesOn = tglOrb.checked && lobeOp > 0.02;
  lobeT.visible = lobeB.visible = pAxis.visible = lobesOn;
  M.lobe.opacity = 0.30 * op * lobeOp;
  M.axis.opacity = 0.55 * op * lobeOp;

  /* --- C–Br 键：拉长、变淡 → 异裂 --- */
  const cbrOp = tt < 0.24 ? 1 : clamp(1 - ss(0.24, 0.32, tt), 0, 1);
  M.bondCBr.opacity = M.bondCBr.userData.baseOp * op * cbrOp;
  stickCBr.visible = cbrOp > 0.02;
  if (stickCBr.visible) placeStick(stickCBr, C.position, Br.position);
  const dBrOp = ss(0.09, 0.13, tt) * (1 - ss(0.24, 0.29, tt)) * op;   // 异裂中的部分键
  M.dot.opacity = dBrOp * 0.9;
  placeDots(dotsBr, C.position, Br.position, dBrOp);

  /* --- H₂O 两面进攻：主水（下）成键，幽灵水（上）表明另一半机会 --- */
  const watIn = ss(0.38, 0.48, tt);
  let dy;   // 主水 O 的 y
  if (tt < 0.50) dy = -NU_FAR;
  else if (tt < 0.60) dy = -lerp(NU_FAR, 1.55, ss(0.50, 0.60, tt));
  else dy = -lerp(1.55, L_CO0, ss(0.60, 0.70, tt));
  wat.g.position.set(0, dy, 0.45);
  const ghostOp = watIn * (1 - ss(0.58, 0.68, tt));
  let gy;
  if (tt < 0.50) gy = NU_FAR;
  else if (tt < 0.60) gy = lerp(NU_FAR, 1.7, ss(0.50, 0.60, tt));
  else gy = lerp(1.7, 2.5, ss(0.60, 0.70, tt));
  gh.g.position.set(0, gy, -0.45);
  gh.g.visible = ghostOp > 0.02;
  for (const m of watMats) m.opacity = op * watIn;
  M.depH.opacity = op * watIn * (1 - ss(0.78, 0.84, tt));
  for (const m of ghostMats) m.opacity = op * ghostOp;

  /* --- C–O 成键：TS2 部分键 → 实体键 --- */
  const dOOp = ss(0.54, 0.60, tt) * (1 - ss(0.66, 0.72, tt)) * op;
  if (dOOp > dBrOp) M.dot.opacity = dOOp * 0.9;
  placeDots(dotsO, C.position, wat.O.position, dOOp);
  const coOp = ss(0.62, 0.70, tt);
  M.bondCO.opacity = M.bondCO.userData.baseOp * op * coOp;
  stickCO.visible = coOp > 0.02;
  if (stickCO.visible) placeStick(stickCO, C.position, wat.O.position);

  /* --- 去质子化：一个 H 带着电子对离开氧 --- */
  const depK = ss(0.70, 0.80, tt);
  wat.H1.position.lerpVectors(V3(0.21, 0.11, 0.05),
    V3(1.5, 1.6 - dy, 0.35 - 0.45), depK);

  /* --- 外消旋展示：产物 A 左移，镜像产物 B 淡入 --- */
  const pBk = ss(0.80, 0.86, tt);
  mol.position.x = -1.75 * ss(0.78, 0.86, tt);
  prodB.visible = pBk > 0.02;
  if (prodB.visible) for (const m of pbMats) m.opacity = op * pBk;
  M.plane.opacity = 0.06 * op * pBk;
  mirrorPlane.visible = pBk > 0.02;

  /* --- 溶剂分子微弱漂浮 --- */
  solv.forEach((s, i) => {
    s.position.y = s.userData.baseY + Math.sin(time * 1.3 + i * 1.7) * 0.06;
  });

  /* --- 电子流向箭头 --- */
  clearDyn();
  const ionA = ss(0.10, 0.15, tt) * (1 - ss(0.22, 0.27, tt));
  const atkA = ss(0.52, 0.58, tt) * (1 - ss(0.62, 0.68, tt));
  const depA = ss(0.72, 0.76, tt) * (1 - ss(0.78, 0.82, tt));
  let arrowK = 0;
  if (tglArrows.checked) {
    if (ionA > 0.02) {   // σ(C–Br) 电子对整体流向 Br（异裂）
      arrowK = ionA;
      curvedArrow(V3(0.10, by * 0.40, 0.06), V3(0.46, by * 0.72, 0.18), V3(0.14, by * 1.04, 0.10));
    }
    if (atkA > 0.02) {   // 两面水分子的孤对电子 → 空 p 轨道
      arrowK = Math.max(arrowK, atkA);
      const wO = wat.O.position, gO = gh.O.position;
      curvedArrow(wO.clone().add(V3(0.15, 0.30, 0.08)), V3(0.45, wO.y * 0.45, 0.30), V3(0.12, -0.36, -0.06));
      curvedArrow(gO.clone().add(V3(-0.15, -0.30, 0.08)), V3(-0.45, gO.y * 0.45, 0.30), V3(-0.12, 0.36, -0.06));
    }
    if (depA > 0.02) {   // O–H 键电子对回到 O（去质子化）
      arrowK = Math.max(arrowK, depA);
      const oW = wat.g.position;
      const h1W = V3().addVectors(oW, wat.H1.position);
      curvedArrow(h1W.clone().add(V3(0.05, 0.15, 0.02)),
                  V3(oW.x + 0.42, (h1W.y + oW.y) / 2, oW.z + 0.18),
                  oW.clone().add(V3(0.17, 0.12, 0.05)));
    }
  }
  M.arrow.opacity = 0.95 * op * arrowK;

  /* --- 标签内容 / 显隐 --- */
  const lblOp = op;
  for (const o of labelObjs) o.element.style.opacity = lblOp;
  const L = (o, k) => { o.element.style.opacity = lblOp * clamp(k, 0, 1); };

  lblBr.element.innerHTML = tt < 0.28 ? 'Br 离去基团' : 'Br⁻（已带走电子对）';
  lblC.element.textContent = tt < 0.26 ? '中心碳（手性）'
    : (tt < 0.60 ? 'C⁺ 碳正离子（sp² 平面）' : '中心碳（重新 sp³）');
  L(lblC, 1 - ss(0.68, 0.72, tt));
  lblNu.element.textContent = tt < 0.68 ? 'H₂O 亲核试剂'
    : (tt < 0.80 ? '–OH₂⁺ 氧鎓离子' : '–OH（醇）');
  lblNu.position.set(tt < 0.62 ? 0 : 0.62, tt < 0.62 ? 0.5 : -0.12, 0);
  L(lblNu, watIn);
  L(lblGh, ghostOp);
  L(lblBr, 1);
  L(lblTS1, ss(0.09, 0.12, tt) * (1 - ss(0.26, 0.30, tt)));
  L(lblRate, ss(0.10, 0.14, tt) * (1 - ss(0.26, 0.30, tt)));
  L(lblDeltaBr, ss(0.10, 0.13, tt) * (1 - ss(0.22, 0.26, tt)));
  L(lblDeltaC, ss(0.10, 0.13, tt) * (1 - ss(0.22, 0.26, tt)));
  L(lblCation, ss(0.26, 0.32, tt) * (1 - ss(0.50, 0.56, tt)));
  L(lblPOrb, lobeOp);
  const fiftyK = ss(0.40, 0.46, tt) * (1 - ss(0.58, 0.64, tt));
  L(lbl50a, fiftyK);
  L(lbl50b, fiftyK);
  L(lblFaces, ss(0.50, 0.55, tt) * (1 - ss(0.62, 0.68, tt)));
  L(lblDeltaO, ss(0.56, 0.60, tt) * (1 - ss(0.70, 0.74, tt)));
  L(lblDep, ss(0.70, 0.74, tt) * (1 - ss(0.80, 0.84, tt)));
  L(lblRacem, ss(0.80, 0.86, tt));
  L(lblMirror, ss(0.82, 0.88, tt));
  L(lblProdA, ss(0.80, 0.86, tt));
  L(lblProdB, ss(0.80, 0.86, tt));
  L(lblSolvent, tt < 0.09 ? 1 : 1 - ss(0.09, 0.14, tt));

  /* --- 能量游标 --- */
  const p = progOf(tt);
  const ex = svg._px(p), ey = svg._py(energyOf(p));
  markerDot.setAttribute('cx', ex); markerDot.setAttribute('cy', ey);
  markerLine.setAttribute('x1', ex); markerLine.setAttribute('x2', ex);
  markerLine.setAttribute('y1', svg._py(0.12) + 8); markerLine.setAttribute('y2', ey);
  markerDot.setAttribute('opacity', op);
  markerLine.setAttribute('opacity', 0.5 * op);

  return op;
}

  li.innerHTML = `<span class="n">${STEPS.indexOf(s) + 1}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
  elSteps.appendChild(li);
}

elPlay.textContent = playing ? '暂停' : '播放';
elPlay.addEventListener('click', () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglSn2.addEventListener('change', () => { sn2G.style.display = tglSn2.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('top') === '1') {   // 俯视机位：检验三基团共平面 + 两面对称
  camera.position.set(0.01, 9.5, 0.01);
  controls.target.set(0, 0, 0);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
// tt ∈ [-0.04, 0.96)：把 cycles 的相位映射到带复位窗口的时间轴
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const tt = phase(cycles);

  updateWorld(tt, cycles * CYCLE_SECONDS);

  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateWorld(phase(cycles));
frame();
</script>
</body>
</html>
