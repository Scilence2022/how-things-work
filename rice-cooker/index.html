<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  :root[data-theme="light"]{

    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;

  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="电饭煲 · 跳闸本身就是「饭熟」传感器" data-en="Rice Cooker · The Trip IS the Doneness Sensor">电饭煲 · 跳闸本身就是「饭熟」传感器</h1>
  <div class="sub" data-zh="看温度曲线爬上 ~98 °C 沸腾平台、水烧干的一瞬陡冲跨过 105 °C——感温磁钢当场失磁跳闸断电；水多煮粥不跳闸、水少提前跳闸夹生 · 拖动旋转 / 空格运行/暂停" data-en="Watch the temperature curve climb to the ~98 °C boil plateau, then surge past 105 °C the instant water runs dry — the Curie-point magnet trips and cuts power · drag to orbit / Space = run/pause">看温度曲线爬上 ~98 °C 沸腾平台、水烧干的一瞬陡冲跨过 105 °C——感温磁钢当场失磁跳闸断电；水多煮粥不跳闸、水少提前跳闸夹生 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   热学模型（工程简化，量级真实）：
   - 升温段   dT = P/C·dt，C = 4186·m水 + 1700·m米 + 320（内胆）
   - 糊化     60–70 °C 开始；淀粉结晶瓦解速率 ∝ 1/τ_gel（τ≈750 s）
   - 沸腾平台 T 钉在 ~98 °C，P 全部走汽化潜热 L=2.26e6 J/kg：
     dm/dt = -P/L ≈ -0.31 g/s（700 W）；米持续吸水→自由水减少
   - 水尽冲温 自由水烧干，C 骤降到 ~660 J/K，dT ≈ 1 K/s 飞冲
   - 磁钢跳闸 感温磁钢（镍锌铁氧体）居里点 ~103–105 °C 失磁，
     弹簧拉开杠杆断电——「跳闸」= 水干 = 饭熟的物理传感器
   - 焖饭/保温 余热回匀水分；保温 60–75 °C 温差带回通断
   ============================================================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsBool=(k,d)=>{const v=qs.get(k);return v===null?d:(v!=='0'&&v!=='false');};

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(7.5,5.5,11);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.8));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.0);keyL.position.set(6,9,7);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-7,5,-5);scene.add(fillL);

/* ---- 材质（随主题换色） ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const shellM=new THREE.MeshStandardMaterial({color:0x7a4a2a,roughness:0.4,metalness:0.5,side:THREE.DoubleSide});
const potM=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.25,metalness:0.85,side:THREE.DoubleSide});
const heatM=new THREE.MeshStandardMaterial({color:0x3a2a28,roughness:0.5,metalness:0.6,emissive:0xff3300,emissiveIntensity:0});
const waterM=new THREE.MeshStandardMaterial({color:0x3b7dd8,roughness:0.15,metalness:0.1,transparent:true,opacity:0.5});
const lidM=new THREE.MeshStandardMaterial({color:0x5f6b78,roughness:0.35,metalness:0.7});
const magM=new THREE.MeshStandardMaterial({color:0x37424e,roughness:0.4,metalness:0.6});
const ferM=new THREE.MeshStandardMaterial({color:0x8a5a3a,roughness:0.5,metalness:0.4});
const riceM=new THREE.MeshStandardMaterial({color:0xf3ead8,roughness:0.55,metalness:0.05});

/* ---- 电饭煲结构 ---- */
const cooker=new THREE.Group();scene.add(cooker);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(11,12,0.3,48),groundM);
ground.position.y=-0.15;scene.add(ground);
/* 外壳（切口朝 +z 便于看内部） */
const shell=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,4.4,48,1,true,0.55,Math.PI*2-1.1),shellM);
shell.position.y=2.2;cooker.add(shell);
/* 底座 */
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.8,2.9,0.5,48),lidM);
base.position.y=0.25;cooker.add(base);
/* 发热盘 */
const heatPlate=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,0.18,40),heatM);
heatPlate.position.y=0.62;cooker.add(heatPlate);
/* 内胆（切口同向） */
const pot=new THREE.Mesh(new THREE.CylinderGeometry(2.0,1.8,3.0,48,1,true,0.55,Math.PI*2-1.1),potM);
pot.position.y=2.2;cooker.add(pot);
const potBottom=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.6,0.12,48),potM);
potBottom.position.y=0.78;cooker.add(potBottom);
/* 锅盖 */
const lid=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,0.25,48),lidM);
lid.position.y=4.5;cooker.add(lid);
const knob=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,12),magM);
knob.position.y=4.78;cooker.add(knob);
/* 水（高度随水量） */
const water=new THREE.Mesh(new THREE.CylinderGeometry(1.78,1.62,1,40),waterM);
water.position.y=1.4;cooker.add(water);
/* 米粒（InstancedMesh，未用实例矩阵置零） */
const NGRAIN=120;
const grainGeo=new THREE.SphereGeometry(0.09,8,6);
const grains=new THREE.InstancedMesh(grainGeo,riceM,NGRAIN);
const M4=new THREE.Matrix4(),QT=new THREE.Quaternion(),V3=new THREE.Vector3(),SC=new THREE.Vector3();
const gPos=[];
for(let i=0;i<NGRAIN;i++){
  const r=Math.sqrt(((i*37)%100)/100)*1.5,th=((i*61)%360)/180*Math.PI;
  gPos.push({x:Math.cos(th)*r,z:Math.sin(th)*r,h:((i*13)%97)/97});
  M4.makeScale(0,0,0);grains.setMatrixAt(i,M4);
}
cooker.add(grains);
/* 磁钢限温器（底座切口处，面向 +z） */
const magG=new THREE.Group();magG.position.set(0,0.55,2.15);cooker.add(magG);
const perm=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.16,20),magM);
perm.position.y=0.1;magG.add(perm);
const ferrite=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.12,20),ferM);
ferrite.position.y=-0.14;magG.add(ferrite);
const springM=new THREE.MeshStandardMaterial({color:0xb0b8c2,roughness:0.4,metalness:0.8});
const spring=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.3,10),springM);
spring.position.y=-0.4;magG.add(spring);
const lever=new THREE.Group();lever.position.set(0,-0.1,0);magG.add(lever);
const arm=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.07,0.12),ferM);
arm.position.x=0.35;lever.add(arm);
const contact1=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.12,0.1),springM);
contact1.position.set(0.85,0.12,0);lever.add(contact1);
const contact2=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.12,0.1),springM);
contact2.position.set(0.85,0.3,0.16);magG.add(contact2);
const wire=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.4,8),springM);
wire.rotation.z=Math.PI/2.4;wire.position.set(1.3,-0.15,0.05);magG.add(wire);

/* ---- 状态（先声明，供标签闭包引用） ---- */
const S={
  mRice:0.2,ratio:1.3,trip:105,P:700,speed:45,gelAtTrip:0,
  T:25,mFree:0,mAbs:0,evap:0,gel:0,phase:'idle',heatOn:false,
  t:0,simmerT:0,tripT:0,hist:[],
};

/* ---- 温度曲线图（左后方） ---- */
const chartG=new THREE.Group();chartG.position.set(-8.2,3.4,-3.5);chartG.rotation.y=0.42;scene.add(chartG);
const CW=7.2,CH=4.6;
const chartBoard=new THREE.Mesh(new THREE.PlaneGeometry(CW+0.8,CH+0.8),
  new THREE.MeshStandardMaterial({color:0x11151a,roughness:0.9,transparent:true,opacity:0.82}));
chartG.add(chartBoard);
function gridLine(x1,y1,x2,y2,mat){
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,0.01),new THREE.Vector3(x2,y2,0.01)]);
  const l=new THREE.Line(g,mat);chartG.add(l);return l; /* 返回 Line 本体，虚线才能 computeLineDistances */
}
const gridM=new THREE.LineBasicMaterial({color:0x2c3742});
const axisM=new THREE.LineBasicMaterial({color:0x5b6b7d});
gridLine(-CW/2,-CH/2,CW/2,-CH/2,axisM);gridLine(-CW/2,-CH/2,-CW/2,CH/2,axisM);

/* ---- 模型 ---- */
function reset(){
  S.T=25;S.mFree=S.ratio*S.mRice;S.mAbs=0;S.evap=0;S.gel=0;
  S.phase='heat';S.heatOn=true;S.t=0;S.simmerT=0;S.tripT=0;S.hist=[];
  drawRefLines();syncVisual();
}
/* 单步 0.5 s 模拟：返回是否跳闸瞬间 */
function stepModel(){
  const dt=0.5;
  const Pk=S.phase==='keep'?120:S.P; /* 保温 120 W */
  const mWater=S.mFree+S.mAbs;
  const absTarget=1.35*S.mRice*(0.25+0.75*S.gel); /* 吸水目标 */
  if(S.heatOn){
    if(S.T<98&&S.mFree>0.004){
      const C=4186*mWater+1700*S.mRice+320;
      S.T+=Pk/C*dt;
    }else if(S.mFree>0.004){ /* 沸腾平台 */
      S.T=98+Math.min(2,(S.t%7)*0.3); /* 沸腾微起伏 */
      /* 米没吸饱时只少量排汽；吸饱后 700 W 全力蒸发 */
      const evFrac=(absTarget-S.mAbs)>0.005?0.08:1;
      const e=Pk/2.26e6*evFrac*dt;
      S.mFree=Math.max(0,S.mFree-e);
      S.evap+=e;
    }else{ /* 水尽冲温：C 骤降 */
      const C=1700*S.mRice+320;
      S.T+=Pk/C*dt;
    }
  }else{
    /* 断电：热损失降温 tau≈400 s */
    S.T+=(25-S.T)/400*dt;
  }
  /* 吸水：向目标收敛，时间常数 150 s */
  if(S.mAbs<absTarget&&S.mFree>0){
    const a=Math.min(S.mFree,(absTarget-S.mAbs)/150*dt);
    S.mAbs+=a;S.mFree-=a;
  }
  /* 糊化：60 °C 以上推进，速率随水量打折——水太少救不回来（夹生） */
  if(S.T>60&&S.gel<1){
    const wf=clamp((mWater/S.mRice-0.6)/0.7,0.15,1);
    S.gel=Math.min(1,S.gel+dt/750*wf);
  }
  /* 跳闸判定 */
  if(S.heatOn&&S.T>=S.trip){
    S.heatOn=false;S.tripT=0.001;S.phase='simmer';S.simmerT=0;
    S.gelAtTrip=S.gel;
    return true;
  }
  if(S.phase==='simmer'){
    S.simmerT+=dt;S.tripT+=dt;
    if(S.simmerT>480){S.phase='keep';}
  }else if(S.phase==='keep'){
    S.tripT+=dt;
    /* 保温温差带 66–72 °C（P_keep=120 W） */
    if(!S.heatOn&&S.T<66){S.heatOn=true;}
    else if(S.heatOn&&S.T>72){S.heatOn=false;}
  }
  S.t+=dt;
  return false;
}
/* 快进到条件满足 */
function ff(pred,maxS=80000){
  let i=0;
  while(i<maxS&&!pred()){stepModel();i++;pushHist();}
  pushHist();syncVisual();
}
function pushHist(){
  if(S.hist.length===0||S.t-S.hist[S.hist.length-1][0]>=2||S.hist.length===0)
    S.hist.push([S.t,S.T]);
  if(S.hist.length>1500)S.hist.shift();
}

/* ---- 视觉同步 ---- */
function syncVisual(){
  /* 水位：总水量（自由+吸收）映射高度 */
  const mWater=S.mFree+S.mAbs;
  const h=clamp(mWater/(S.ratio*S.mRice+0.05),0,1)*1.9+0.06;
  water.scale.y=h;water.position.y=0.85+h/2;
  water.visible=mWater>0.008;
  /* 米粒：糊化后胀大、变透亮 */
  const swell=1+0.65*S.gel;
  const bedH=0.5+0.35*S.gel;
  riceM.roughness=0.55-0.25*S.gel;
  riceM.opacity=1;
  for(let i=0;i<NGRAIN;i++){
    const g=gPos[i];
    M4.compose(V3.set(g.x,0.9+g.h*bedH,g.z),QT,SC.set(swell,swell*0.62,swell));
    grains.setMatrixAt(i,M4);
  }
  grains.instanceMatrix.needsUpdate=true;
  /* 发热盘发光 */
  heatM.emissiveIntensity=S.heatOn?(S.phase==='keep'?0.35:0.9):0;
  /* 磁钢杠杆：跳闸后弹开 */
  const tripped=S.tripT>0;
  lever.rotation.z=tripped?-0.5:0;
  perm.position.y=tripped?0.22:0.1;
  ferrite.position.y=tripped?-0.2:-0.14;
  contact2.position.z=tripped?0.3:0.16;
  /* 温度曲线 */
  drawCurve();
}
function drawCurve(){
  const pos=curveLine.geometry.getAttribute('position');
  const n=S.hist.length;
  if(n<2){pos.needsUpdate=true;return;}
  const tCap=1800;
  const t1=S.hist[n-1][0];
  const t0=Math.max(0,t1-tCap);
  const count=Math.min(1000,n);
  for(let i=0;i<count;i++){
    const idx=Math.floor(i*(n-1)/Math.max(1,count-1));
    const tt=S.hist[idx][0],TT=S.hist[idx][1];
    const x=-CW/2+(tt-t0)/tCap*CW;
    pos.setXY(i,x,tY(TT));
  }
  for(let i=count;i<1001;i++)pos.setXY(i,CW/2,tY(25));
  pos.needsUpdate=true;
  curveLine.geometry.setDrawRange(0,count);
}

/* ---- 统计 ---- */
const PH={heat:L('加热升温','heating'),boil:L('沸腾平台','boiling'),surge:L('水尽冲温','dry surge'),
  simmer:L('焖饭','simmering'),keep:L('保温','keep-warm')};
function phaseName(){
  if(S.phase==='keep')return PH.keep;
  if(S.phase==='simmer')return PH.simmer;
  if(S.T>=98&&S.mFree>0.004)return PH.boil;
  if(S.mFree<=0.004&&S.heatOn)return PH.surge;
  return PH.heat;
}
function updateStats(){
  document.getElementById('stT').innerHTML=S.T.toFixed(1)+'<small> °C</small>';
  document.getElementById('stPh').textContent=phaseName();
  document.getElementById('stW').innerHTML=(100*(S.mFree)/(Math.max(1e-6,S.ratio*S.mRice))).toFixed(0)+'<small> %</small>';
  document.getElementById('stG').innerHTML=(S.gel*100).toFixed(0)+'<small> %</small>';
}

   act(){reset();ff(()=>S.T>=66);playing=false;setPlayText();}},
  {zh:'~98 °C 沸腾平台：温度钉住，700 W 全部变成汽化潜热，米边吸水边熟',en:'~98 °C plateau: all 700 W goes to latent heat while rice absorbs',
   act(){reset();ff(()=>S.T>=98&&S.mFree>0.05);playing=true;setPlayText();}},

   act(){reset();ff(()=>S.mFree<=0.004&&S.T>=98);playing=true;setPlayText();}},
  {zh:'103–105 °C 磁钢跳闸：感温磁钢失磁、杠杆弹开断电——「咔」= 饭熟',en:'103–105 °C: ferrite loses magnetism, lever snaps, power cuts',
   act(){reset();ff(()=>S.T>=S.trip-1.5);playing=true;setPlayText();}},
  {zh:'焖饭与保温：余热把水分回匀、糊化补满；保温在 66–72 °C 温差带',en:'Simmer & keep-warm: residual heat evens moisture; band 66–72 °C',
   act(){reset();ff(()=>S.tripT>0);S.simmerT=470;playing=true;setPlayText();}},
  {zh:'加水对照：1:2.6+ 永远烧不干→长时间沸腾不跳闸=煮粥；1:0.9 提前跳闸=夹生',en:'Water test: 1:2.6+ never dries (porridge, no trip); 1:0.9 trips early (undercooked)',
   act(){S.mRice=0.2;S.ratio=4.5;syncSliders();reset();playing=true;setPlayText();}},
];
let activeStep=0,playing=true,labelsOn=true,simT=0;
function syncSliders(){
  document.getElementById('sRice').value=Math.round(S.mRice*100);
  document.getElementById('sRiceVal').textContent=S.mRice.toFixed(2);
  document.getElementById('sRatio').value=Math.round(S.ratio*10);
  document.getElementById('sRatioVal').textContent=S.ratio.toFixed(1);
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ---- 主题 / 语言 ---- */

  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  shellM.color.setHex(dark?0x7a4a2a:0xa8663a);
  chartBoard.material.color.setHex(dark?0x11151a:0xf8f5ef);
  gridM.color.setHex(dark?0x2c3742:0xd5d0c6);
  waterM.color.setHex(dark?0x3b7dd8:0x2b6ec8);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,acc2=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 模拟时间 = 墙钟 × 速度；子步 0.5 s，限 300 子步防卡 */
    let budget=dt*S.speed;
    let steps=Math.min(300,Math.ceil(budget/0.5));
    for(let i=0;i<steps;i++){
      const tripped=stepModel();
      pushHist();
      if(tripped){/* 跳闸瞬间：硬切断（已在 stepModel 内） */}
    }
    syncVisual();
  }
  tripLbl.visible=labelsOn&&S.tripT>0&&S.tripT<2.5;
  if(tripLbl.visible)tripLbl.element.style.transform='scale('+(1+0.5*Math.max(0,1-S.tripT))+')';
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){if(r===undefined)continue;r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 启动 ---- */
applyTheme();applyLang();
reset();syncVisual();
if(qs.get('pause')==='1'){playing=false;setPlayText();}
if(!qsBool('labels',true)){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')!==null){const v=clamp(parseFloat(qs.get('speed'))||30,5,90);
  S.speed=v;document.getElementById('sSpd').value=v;
  document.getElementById('sSpdVal').textContent=v+'×';}
updateStats();start();
