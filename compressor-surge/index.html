<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>压气机喘振 · Compressor Stall &amp; Surge</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="压气机喘振" data-en="Compressor Stall & Surge">压气机喘振</h1>
  <div class="sub" data-zh="轴流压气机是一架多级楼梯,每排叶片给空气添一点压力;流量太小或攻角太陡,叶片背面当场分离——失速团绕着环转圈,再进一步,整台机器的流量以秒级振荡、气流倒灌,叶片在正反双向风载里被打断;防喘三招:放气阀、可调静子、把工作点留在喘振线右侧 · 拖动旋转 / 空格运行/暂停" data-en="An axial compressor is a staircase of blade rows, each adding a little pressure; starve the flow or steepen the incidence and the blade backs separate on the spot — a stall cell patrols the annulus, then one step further the whole machine's flow oscillates per second and air floods backward, beating blades in both directions; three counters: bleed valves, variable stators, and keeping the operating point right of the surge line · drag to orbit / Space = run/pause">轴流压气机是一架多级楼梯,每排叶片给空气添一点压力;流量太小或攻角太陡,叶片背面当场分离——失速团绕着环转圈,再进一步,整台机器的流量以秒级振荡、气流倒灌,叶片在正反双向风载里被打断;防喘三招:放气阀、可调静子、把工作点留在喘振线右侧 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="流量" data-en="Mass flow">流量</span><span class="v" id="stFlow">—</span>
  <span class="k" data-zh="压比" data-en="Pressure ratio">压比</span><span class="v" id="stPi">—</span>
  <span class="k" data-zh="攻角" data-en="Incidence">攻角</span><span class="v" id="stAoA">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stSt">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bBleed" data-zh="防喘放气" data-en="Anti-surge bleed">防喘放气</button>
    <button class="abtn" id="bReset" data-zh="复位" data-en="Reset">复位</button>
  </div>
  <div class="row">
    <label data-zh="节流阀开度" data-en="Throttle">节流阀开度</label>
    <input id="sThr" type="range" min="5" max="100" step="1" value="82">
    <span class="val" id="sThrVal">82 %</span>
  </div>
  <div class="row">
    <label data-zh="转速" data-en="Shaft speed">转速</label>
    <input id="sSpd" type="range" min="60" max="105" step="1" value="100">
    <span class="val" id="sSpdVal">100 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCase" type="checkbox" checked> <span data-zh="机匣透明" data-en="See-through case">机匣透明</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../jet-engine/" data-zh="喷气发动机" data-en="The Jet Engine">喷气发动机</a>
    <a href="../ramjet/" data-zh="冲压发动机" data-en="The Ramjet">冲压发动机</a>
    <a href="../turbocharger/" data-zh="涡轮增压器" data-en="The Turbocharger">涡轮增压器</a>
    <a href="../laval-nozzle/" data-zh="拉瓦尔喷管" data-en="The Laval Nozzle">拉瓦尔喷管</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-6.5,3.8,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ===== 压气机剖视:转轴沿 X,4 排转子 + 3 排静子,气流从进口流向出口 ===== */
const XM=-6.6,XP=6.6,TAU=Math.PI*2,NPAR=520,m4=new THREE.Matrix4();
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 机匣:半透明圆筒,喘振时闪红抖振 */
const caseM=new THREE.MeshStandardMaterial({color:0x5a6577,metalness:0.55,roughness:0.45,side:THREE.DoubleSide,transparent:true,opacity:0.34,emissive:0xff6b6b,emissiveIntensity:0});
const casing=new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.25,13.2,40,1,true),caseM);
casing.rotation.z=Math.PI/2;scene.add(casing);
const ductM=new THREE.MeshStandardMaterial({color:0x49525f,metalness:0.5,roughness:0.5,side:THREE.DoubleSide});
const duct=new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.25,1.6,32,1,true),ductM);
duct.rotation.z=Math.PI/2;duct.position.x=-7.2;scene.add(duct);
/* 节流阀:进口蝶阀碟片,开度越小越立起来挡流 */
const thrDisk=new THREE.Mesh(new THREE.CircleGeometry(1.95,36),new THREE.MeshStandardMaterial({color:0x8a94a4,metalness:0.6,roughness:0.4,side:THREE.DoubleSide}));
thrDisk.position.set(-6.9,0,0);scene.add(thrDisk);
/* 主轴 + 进口整流锥 */
const shaftM=new THREE.MeshStandardMaterial({color:0xd8dee8,metalness:0.85,roughness:0.25});
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,13.4,24),shaftM);
shaft.rotation.z=Math.PI/2;scene.add(shaft);
const cone=new THREE.Mesh(new THREE.ConeGeometry(0.5,1.2,20),shaftM);
cone.rotation.z=-Math.PI/2;cone.position.x=-6.6;scene.add(cone);
/* 叶片排:转子转,静子固定;失速扇区叶片染红 */
const rotorM=new THREE.MeshStandardMaterial({color:0xd8dee8,metalness:0.8,roughness:0.3});
const statM=new THREE.MeshStandardMaterial({color:0x6f9fd0,metalness:0.6,roughness:0.4});
const stallM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff2b2b,emissiveIntensity:0.45,metalness:0.4,roughness:0.4});
const rotG=[],rotBlades=[];
function bladeRow(x,n,mat,chord,stg,isRotor){
  const g=new THREE.Group();g.position.x=x;scene.add(g);
  for(let i=0;i<n;i++){
    const h=new THREE.Group();h.rotation.x=i*2*Math.PI/n;g.add(h);
    const b=new THREE.Mesh(new THREE.BoxGeometry(chord,1.45,0.07),mat);
    b.position.y=1.33;b.rotation.y=stg;h.add(b);
    if(isRotor)rotBlades.push({m:b,g,off:i*2*Math.PI/n});
  }
  return g;
}
rotG.push(bladeRow(-3.8,12,rotorM,0.56,0.55,true));
rotG.push(bladeRow(-1.8,12,rotorM,0.56,0.55,true));
rotG.push(bladeRow(0.2,12,rotorM,0.56,0.55,true));
rotG.push(bladeRow(2.2,12,rotorM,0.52,0.55,true));
bladeRow(-2.8,14,statM,0.4,-0.5,false);
bladeRow(-0.8,14,statM,0.4,-0.5,false);
bladeRow(1.2,14,statM,0.4,-0.5,false);
/* 气流粒子(InstancedMesh):失速扇区染红减速,喘振整体振荡倒灌 */
const par=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,6,5),new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.85}),NPAR);
par.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(par);
const parD=[];for(let i=0;i<NPAR;i++)parD.push({x:XM+Math.random()*13.2,r:0.7+Math.random()*1.3,th:Math.random()*TAU,bl:false});
const colCool=new THREE.Color(1,1,1),colHot=new THREE.Color(1,0.45,0.45);
for(let i=0;i<NPAR;i++)par.setColorAt(i,colCool);
/* 防喘放气阀:中匣下方的绿色泄气支管 */
const bleedM=new THREE.MeshStandardMaterial({color:0x3f6b4a,roughness:0.5,metalness:0.3,emissive:0x8ce99a,emissiveIntensity:0});
const bleedDuct=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.6,1.0,14),bleedM);
bleedDuct.position.set(0.7,-2.65,0);scene.add(bleedDuct);
const bleedRing=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.07,10,24),bleedM);
bleedRing.rotation.x=Math.PI/2;bleedRing.position.set(0.7,-2.2,0);scene.add(bleedRing);
/* 出口压力表:喘振时指针大幅摆动 */
const gaugeGrp=new THREE.Group();gaugeGrp.position.set(7.3,3.1,0);scene.add(gaugeGrp);
gaugeGrp.add(new THREE.Mesh(new THREE.CircleGeometry(0.62,28),new THREE.MeshStandardMaterial({color:0xe9edf2,roughness:0.6})));
gaugeGrp.add(new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,10,30),new THREE.MeshStandardMaterial({color:0x8a94a4,metalness:0.5,roughness:0.4})));
const needleGeo=new THREE.BoxGeometry(0.055,0.5,0.02);needleGeo.translate(0,0.24,0);
const needle=new THREE.Mesh(needleGeo,new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff2b2b,emissiveIntensity:0.3}));
needle.position.z=0.03;gaugeGrp.add(needle);

/* 状态 */
let thr=82,spd=100,bleed=false,state='normal',phi=0,surgePh=0,needleAng=2.1;
let playing=true,labelsOn=true,slowMo=false,caseOn=true,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function effT(){return thr/100+(bleed?0.24:0);}   /* 放气相当于把工作点向右推 */
function pressRatio(){
  const spN=spd/100;
  let pi=1+2.8*spN*spN*(0.25+0.75*Math.min(effT(),1))*(state==='stall'?0.6:1);
  if(state==='surge')pi=1+(pi-1)*clamp(0.45+0.55*Math.sin(surgePh*TAU),0.06,1.05);
  return clamp(pi,1,4.2);
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=null){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);
  (parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('转子叶片:旋转加压','Rotor blades: spinning adds pressure'),new THREE.Vector3(-3.0,2.95,0),'y');
addLabel(()=>L('静子:整流、承接压升','Stators: straighten flow, keep the rise'),new THREE.Vector3(-0.4,2.95,0),'b');
const lblStall=addLabel(()=>L('失速团:低速区绕环巡逻','Stall cell: a slow pocket on patrol'),new THREE.Vector3(-1.4,2.05,0),'r',()=>state==='stall');
addLabel(()=>L('放气阀:泄流降攻角','Bleed valve: dump flow, cut incidence'),new THREE.Vector3(0.7,-3.45,0),'g',()=>bleed);

function setThr(v){thr=clamp(v,5,100);document.getElementById('sThr').value=thr;
  document.getElementById('sThrVal').textContent=thr.toFixed(0)+' %';updateStats();}
function setSpd(v){spd=clamp(v,60,105);document.getElementById('sSpd').value=spd;
  document.getElementById('sSpdVal').textContent=spd.toFixed(0)+' %';updateStats();}
function setBleed(v){bleed=v;document.getElementById('bBleed').classList.toggle('on',v);
  bleedM.emissiveIntensity=v?0.55:0;updateStats();}
function resetAll(){setThr(82);setSpd(100);setBleed(false);}

const STEPS=[
 {zh:'多级楼梯:一排一排加压',en:'A staircase of rows: pressure step by step',act(){resetAll();}},
 {zh:'攻角与分离:失速的起点',en:'Incidence and separation: where stall begins',act(){setThr(58);}},
 {zh:'旋转失速:失速团绕环巡逻',en:'Rotating stall: the cell patrols the annulus',act(){setThr(45);}},
 {zh:'喘振:整机流量大振荡',en:'Surge: the whole machine breathes in bursts',act(){setThr(20);}},
 {zh:'倒灌:叶片的两头受气',en:'Backflow: blades beaten from both sides',act(){setThr(8);setSpd(88);}},
 {zh:'防喘三招:放气、可调静子、留裕度',en:'Counters: bleed, variable stators, keep margin',act(){setThr(45);setSpd(100);setBleed(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const sOsc=state==='surge'?Math.sin(surgePh*TAU):0;
  let fl=46*(0.18+0.82*thr/100)*spd/100*(bleed?0.85:1);
  if(state==='stall')fl*=0.55;
  if(state==='surge')fl*=0.42+0.5*sOsc;
  const fv=document.getElementById('stFlow');
  fv.innerHTML=fl.toFixed(1)+'<small> kg/s</small>';fv.className='v '+(state==='normal'?'ok':'warn');
  document.getElementById('stPi').innerHTML=pressRatio().toFixed(2)+'<small> ×</small>';
  const al=clamp(6+48*Math.pow(1-thr/100,1.5)-(bleed?8:0)+(state==='stall'?4:0),0,58);
  const av=document.getElementById('stAoA');
  av.innerHTML=al.toFixed(1)+'<small> °</small>';av.className='v '+(al>20?'warn':'');
  const sv=document.getElementById('stSt');
  if(state==='normal'){sv.textContent=L('正常','normal');sv.className='v ok';}
  else{sv.textContent=state==='stall'?L('旋转失速','rotating stall'):L('喘振!','SURGE!');sv.className='v warn';}
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bBleed').addEventListener('click',()=>setBleed(!bleed));
document.getElementById('bReset').addEventListener('click',resetAll);
document.getElementById('sThr').addEventListener('input',e=>setThr(+e.target.value));
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCase').addEventListener('change',e=>{caseOn=e.target.checked;caseM.opacity=caseOn?0.34:0.92;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const Tn=thr/100,spN=spd/100,eT=effT();
  state=eT<0.28?'surge':eT<0.56?'stall':'normal';
  const sev=state==='stall'?clamp((0.56-eT)/0.28,0,1):0;
  const q=state==='surge'?clamp((0.28-eT)/0.28,0,1):0;
  /* 转子旋转 + 失速团绕环巡逻 + 扇区叶片染红 */
  for(const g of rotG)g.rotation.x+=spN*7*dts;
  if(state==='stall')phi+=dts*(0.8+2.2*sev)*spN;
  for(const rb of rotBlades){
    const d=Math.abs(angDiff(rb.g.rotation.x+rb.off,phi));
    rb.m.material=(state==='stall'&&d<0.95)?stallM:rotorM;
  }
  if(state==='surge')surgePh+=dts*1.5*(0.6+spN);
  const sOsc=state==='surge'?Math.sin(surgePh*TAU):0;
  /* 气流粒子:失速扇区减速,喘振整机振荡倒灌,放气口分走一路 */
  let vf=3.2*(0.25+0.75*Tn)*spN;
  if(state==='stall')vf*=0.62;
  if(state==='surge')vf*=0.5+0.85*sOsc;
  const stallNow=state==='stall';
  for(let i=0;i<NPAR;i++){
    const p=parD[i];
    let lvf=vf;
    if(stallNow&&Math.abs(angDiff(p.th,phi))<1.0)lvf=vf*0.22;
    if(p.bl){lvf=0.4;
      p.th+=clamp(angDiff(-Math.PI/2,p.th),-1,1)*dts*7;p.r+=2.4*dts;
      if(p.r>2.72){p.x=XM+0.2;p.r=0.7+Math.random()*1.3;p.th=Math.random()*TAU;p.bl=false;}
    }else if(bleed&&p.x>0.3&&p.x<1.1)p.bl=true;
    p.x+=lvf*dts;p.th+=(0.5+0.9*spN)*dts;
    if(p.x>XP){p.x=XM+0.2;p.bl=false;}
    if(p.x<-6.7)p.x=-6.7;
    m4.makeScale(1,1,1);m4.setPosition(p.x,p.r*Math.cos(p.th),p.r*Math.sin(p.th));
    par.setMatrixAt(i,m4);
    par.setColorAt(i,(stallNow&&Math.abs(angDiff(p.th,phi))<1.0)?colHot:colCool);
  }
  par.instanceMatrix.needsUpdate=true;
  if(par.instanceColor)par.instanceColor.needsUpdate=true;
  /* 出口压力表:喘振时大幅摆动 */
  needleAng+=(2.35-(pressRatio()-1)/3.2*3.0-needleAng)*Math.min(1,dts*9+0.02);
  needle.rotation.z=needleAng;
  /* 机匣闪红 + 抖振,节流阀碟片随开度立起 */
  caseM.emissiveIntensity=state==='surge'?0.14+0.13*Math.max(0,sOsc):(state==='stall'?0.035*sev:0);
  casing.position.y=state==='surge'?(Math.random()-0.5)*0.04*q:0;
  thrDisk.rotation.y=(1-Tn)*1.45;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  lblStall.position.set(-1.4,2.05*Math.cos(phi),2.05*Math.sin(phi));
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
