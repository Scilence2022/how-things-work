<!DOCTYPE html>

<title>次氯酸与漂白消毒 · 杀菌的是 HClO,闯祸的也是它</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#9fce3e;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#5c8a1e;

    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(159,206,62,.6);background:rgba(159,206,62,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(92,138,30,.55);background:rgba(92,138,30,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#eaf7c8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}

    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

    display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;

    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="app"></div>

<div id="title">
  <h1 data-zh="次氯酸与漂白消毒" data-en="Hypochlorous Acid &amp; Bleaching">次氯酸与漂白消毒</h1>
  <div class="sub" data-zh="Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO:真正杀菌的是中性小分子 HClO——穿过细菌膜、氧化 –SH 巯基与 NADH 使酶失活;HClO ⇌ H⁺ + ClO⁻(pKa≈7.5)是分水岭,pH 低 HClO 占多、杀菌力强,碱里只剩 ClO⁻、效力跌 1~2 个量级;同一氧化力打断染料共轭发色链=漂白;84 液(NaClO)遇酸(洁厕灵)则平衡反噬、放出有毒 Cl₂ · 拖动旋转 / 空格运行/暂停" data-en="Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO: the real germ-killer is the small neutral HClO — it crosses the bacterial membrane and oxidizes –SH thiols and NADH, killing enzymes; HClO ⇌ H⁺ + ClO⁻ (pKa≈7.5) is the watershed — acid keeps HClO dominant and potent, alkali leaves only ClO⁻, 1–2 orders weaker; the same oxidizing power breaks a dye's conjugated chromophore = bleaching; NaClO bleach plus acid (toilet cleaner) backfires the equilibrium into toxic Cl₂ · drag to orbit / Space = run/pause">Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO:真正杀菌的是中性小分子 HClO——穿过细菌膜、氧化 –SH 巯基与 NADH 使酶失活;HClO ⇌ H⁺ + ClO⁻(pKa≈7.5)是分水岭,pH 低 HClO 占多、杀菌力强,碱里只剩 ClO⁻、效力跌 1~2 个量级;同一氧化力打断染料共轭发色链=漂白;84 液(NaClO)遇酸(洁厕灵)则平衡反噬、放出有毒 Cl₂ · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const $=id=>document.getElementById(id);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,12,34);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(2.4,3.7,9.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=24;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 地面与烧杯 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const glassM=new THREE.MeshStandardMaterial({color:0xcfe4ea,transparent:true,opacity:0.16,
  roughness:0.15,metalness:0.05,side:THREE.DoubleSide,depthWrite:false});
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.95,1.78,3.1,40,1,true),glassM);
glass.position.y=1.67;glass.renderOrder=2;scene.add(glass);
const bottom=new THREE.Mesh(new THREE.CylinderGeometry(1.79,1.79,0.14,40),glassM);
bottom.position.y=0.19;scene.add(bottom);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.95,0.045,10,48),glassM);
rim.rotation.x=Math.PI/2;rim.position.y=3.22;scene.add(rim);
const waterM=new THREE.MeshStandardMaterial({color:0x3f8fd2,transparent:true,opacity:0.32,roughness:0.3});
const water=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,2.4,36),waterM);
water.position.y=1.44;water.renderOrder=1;scene.add(water);
const surfM=new THREE.MeshStandardMaterial({color:0x9fd0f0,transparent:true,opacity:0.28,roughness:0.2});
const surf=new THREE.Mesh(new THREE.CircleGeometry(1.79,36),surfM);
surf.rotation.x=-Math.PI/2;surf.position.y=2.64;surf.renderOrder=1;scene.add(surf);

/* ── 细菌:胶囊 + 3 个酶点 ── */
const capAliveM=new THREE.MeshStandardMaterial({color:0x6fc8a8,roughness:0.5,emissive:0x0a3020,emissiveIntensity:0.5});
const capDeadM=new THREE.MeshStandardMaterial({color:0x9aa0a6,roughness:0.75});
const dotAliveM=new THREE.MeshStandardMaterial({color:0xff8866,emissive:0xff5533,emissiveIntensity:0.7,roughness:0.4});
const dotDeadM=new THREE.MeshStandardMaterial({color:0x8a8f96,roughness:0.8});
const bact=[];
for(const [bx,by,bz] of [[-0.85,1.05,0.45],[0.8,1.55,-0.5],[-0.25,2.0,-0.85],[1.05,0.95,0.7],[-1.15,1.6,-0.1]]){
  const grp=new THREE.Group();grp.position.set(bx,by,bz);scene.add(grp);
  const cap=new THREE.Mesh(new THREE.CapsuleGeometry(0.24,0.55,6,14),capAliveM);grp.add(cap);
  const dots=[];
  for(let d=0;d<3;d++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),dotAliveM);
    m.position.set((Math.random()-0.5)*0.16,(d-1)*0.2+(Math.random()-0.5)*0.06,(Math.random()-0.5)*0.16);
    grp.add(m);dots.push({off:m.position.clone(),m,dead:false});
  }
  bact.push({grp,cap,dots,base:new THREE.Vector3(bx,by,bz),ph:Math.random()*6.28,dead:false});
}
function revive(){
  for(const b of bact){b.dead=false;b.cap.material=capAliveM;
    for(const d of b.dots){d.dead=false;d.m.material=dotAliveM;}}
  deadDots=0;killFrac=0;holdT=0;
}
function dotWorld(b,d,out){
  const c=Math.cos(b.grp.rotation.y),s=Math.sin(b.grp.rotation.y);
  out.set(d.off.x*c-d.off.z*s,d.off.y,d.off.x*s+d.off.z*s).add(b.grp.position);
  return out;
}

/* ── 染料共轭链:12 珠 11 键 ── */
const NB=12;
const beadA=new THREE.MeshStandardMaterial({color:0xe05aa0,roughness:0.4});
const beadB=new THREE.MeshStandardMaterial({color:0xe09a40,roughness:0.4});
const bondM=new THREE.MeshStandardMaterial({color:0xd857a8,roughness:0.5,transparent:true,opacity:0.85});
const chainG=new THREE.Group();scene.add(chainG);
const beads=[],bonds=[];
for(let i=0;i<NB;i++){
  const home=new THREE.Vector3(-0.85+1.7*i/(NB-1),1.9+0.16*Math.sin(i*0.85),0.55);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.1,14,10),i%2?beadB:beadA);
  m.position.copy(home);chainG.add(m);
  beads.push({m,home,vel:new THREE.Vector3()});
}
for(let i=0;i<NB-1;i++){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,1,8),bondM);
  chainG.add(m);bonds.push(m);
}
const chain={intact:NB-1,fading:false,fadeT:0};
const cDyeA=new THREE.Color(0xe05aa0),cDyeB=new THREE.Color(0xe09a40),cGray=new THREE.Color(0xd8d8d8);
function bondOrient(i){
  const pa=beads[i].m.position,pb=beads[i+1].m.position;
  const len=Math.max(0.02,pa.distanceTo(pb)-0.14);
  const dir=new THREE.Vector3().subVectors(pb,pa).normalize();
  bonds[i].position.addVectors(pa,pb).multiplyScalar(0.5);
  bonds[i].quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  bonds[i].scale.set(1,len,1);
}
function rebuildChain(){
  chain.intact=NB-1;chain.fading=false;chain.fadeT=0;
  beadA.color.copy(cDyeA);beadB.color.copy(cDyeB);beadA.roughness=0.4;beadB.roughness=0.4;
  bonds.forEach(b=>b.visible=true);
  beads.forEach(b=>{b.m.position.copy(b.home);b.vel.set(0,0,0);});
  for(let i=0;i<NB-1;i++)bondOrient(i);
}
function breakBond(bi){
  if(bi<0||bi>=NB-1||!bonds[bi].visible)return;
  bonds[bi].visible=false;chain.intact--;
  if(!chain.fading){chain.fading=true;chain.fadeT=0;}
  const side=new THREE.Vector3(Math.random()-0.5,0.3*(Math.random()-0.5),Math.random()-0.5).normalize();
  for(let i=0;i<NB;i++)beads[i].vel.addScaledVector(side,(i<=bi?-1:1)*0.16);
}

let mode='disinfect',pHs=7.2,pH=7.2,conc=500,concNow=500;
let playing=true,labelsOn=true,slowMo=false;
let simT=0,dwell=0,f=0.5,killFrac=0,deadDots=0,holdT=0,bubAcc=0;

const STEPS=[
 {zh:'<b>氯入水歧化</b>:Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO,游离氯就此诞生',en:'<b>Chlorine hydrolysis</b>: Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO — free chlorine is born',

 {zh:'<b>pH 7.5 分水岭</b>:HClO ⇌ H⁺ + ClO⁻,此处恰好一半对一半',en:'<b>The pH 7.5 watershed</b>: HClO ⇌ H⁺ + ClO⁻ — exactly half and half here',

 {zh:'<b>漂白同一招</b>:氧化力打断染料的共轭发色链,颜色消失',en:'<b>Bleaching, same trick</b>: the oxidizing power breaks the conjugated chromophore of a dye — color gone',

 {zh:'<b>碱性失效</b>:pH 10.5 只剩 ClO⁻,消毒力跌 1~2 个量级',en:'<b>Alkaline futility</b>: at pH 10.5 only ClO⁻ remains — 1–2 orders of magnitude weaker',
  act(){setMode('disinfect');setPH(10.5);setConc(500);}},
 {zh:'<b>84 液遇洁厕灵</b>:pH 暴跌,平衡反噬放出黄绿色 Cl₂——严禁混用',en:'<b>Bleach + toilet cleaner</b>: pH crashes and the equilibrium backfires, releasing toxic green Cl₂ — never mix',

    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;dwell=0;STEPS[i].act();syncSteps();}

const clock=new THREE.Clock();let raf=null;
const DWELL=7;                                          /* 分步播放:每步停留 7s 自动推进 */
const m4=new THREE.Matrix4();
function randPos(out){
  const a=Math.random()*6.28,rr=Math.sqrt(Math.random())*1.45;
  out.set(Math.cos(a)*rr,0.5+Math.random()*1.9,Math.sin(a)*rr);
}
function respawn(pt){randPos(pt.p);pt.v.set(0,0,0);pt.st=0;pt.tgtB=-1;pt.tgtD=-1;pt.tgtBe=-1;}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 分步播放:高亮同步推进 */
  if(playing){dwell+=dts;if(dwell>DWELL)applyPhase((activeStep+1)%STEPS.length);}
  /* pH 与浓度:危险模式里 pH 暴跌、游离氯以 Cl₂ 逃逸 */
  if(mode==='danger'){
    pH+= (3.0-pH)*(1-Math.exp(-1.2*dts));
    concNow=Math.max(25,concNow-40*dts);
  }else{
    pH+=(pHs-pH)*(1-Math.exp(-4*dts));
    concNow+=(conc-concNow)*(1-Math.exp(-2*dts));
  }
  f=fHOCl(pH);
  /* 细菌摆动 */
  for(const b of bact){
    const amp=b.dead?0:0.06;
    b.grp.position.set(b.base.x+amp*Math.sin(simT*1.3+b.ph),b.base.y,
      b.base.z+amp*Math.cos(simT*1.1+b.ph));
    b.grp.rotation.y=Math.sin(simT*0.4+b.ph)*0.4;
  }
  /* 粒子:形态按 pH 分配;HClO 穿膜,ClO⁻ 被挡 */
  for(let i=0;i<NP;i++){
    const pt=parts[i];
    pt.ho=pt.u<f;
    if(pt.st===0){
      pt.v.x=clamp(pt.v.x+(Math.random()-0.5)*3*dt,-0.7,0.7);
      pt.v.y=clamp(pt.v.y+(Math.random()-0.5)*3*dt,-0.7,0.7);
      pt.v.z=clamp(pt.v.z+(Math.random()-0.5)*3*dt,-0.7,0.7);
      /* 目标:消毒→活细菌;漂白→染料链(部分粒子) */
      let tx=0,ty=0,tz=0,has=false;
      const wantChain=mode==='bleach'&&chain.intact>0&&(i%5<3);
      if(pt.ho&&wantChain){
        let bd=1e9;
        for(let k=0;k<NB;k++){
          const bp=beads[k].m.position,d2=pt.p.distanceToSquared(bp);
          if(d2<bd){bd=d2;tx=bp.x;ty=bp.y;tz=bp.z;has=true;}
        }
        pt.tgtBe=has?1:-1;pt.tgtB=-1;
      }else if(pt.ho){
        let bd=1e9,bi=-1;
        for(let k=0;k<bact.length;k++){
          if(bact[k].dead)continue;
          const d2=pt.p.distanceToSquared(bact[k].grp.position);
          if(d2<bd){bd=d2;bi=k;}
        }
        if(bi>=0){pt.tgtB=bi;const c=bact[bi].grp.position;
          tx=c.x;ty=c.y;tz=c.z;has=true;}
        pt.tgtBe=-1;
      }else{pt.tgtB=-1;pt.tgtBe=-1;}
      if(has&&pt.ho){
        const dl=Math.hypot(tx-pt.p.x,ty-pt.p.y,tz-pt.p.z)||1;
        const bias=0.9*(0.4+concNow/1500);
        pt.v.x+=((tx-pt.p.x)/dl)*bias*dts*2.2;
        pt.v.y+=((ty-pt.p.y)/dl)*bias*dts*2.2;
        pt.v.z+=((tz-pt.p.z)/dl)*bias*dts*2.2;
      }
      pt.p.addScaledVector(pt.v,dts);
      /* 边界:水面/杯壁反弹 */
      const rad=Math.hypot(pt.p.x,pt.p.z);
      if(rad>1.55){pt.p.x*=1.55/rad;pt.p.z*=1.55/rad;pt.v.x*=-0.8;pt.v.z*=-0.8;}
      if(pt.p.y>2.5){pt.p.y=2.5;pt.v.y*=-0.8;}
      if(pt.p.y<0.45){pt.p.y=0.45;pt.v.y*=-0.8;}
      /* 碰撞:HClO 进入,ClO⁻ 被弹开 */
      if(pt.ho&&pt.tgtB>=0){
        const b=bact[pt.tgtB];
        if(pt.p.distanceTo(b.grp.position)<0.44){
          let di=-1;for(let k=0;k<3;k++)if(!b.dots[k].dead){di=k;break;}
          if(di>=0){pt.st=1;pt.tgtD=di;}else respawn(pt);
        }
      }else if(!pt.ho){
        for(const b of bact){
          const d=pt.p.distanceTo(b.grp.position);
          if(d<0.52){R.subVectors(pt.p,b.grp.position).normalize();
            pt.v.addScaledVector(R,1.4*dts*10);pt.p.addScaledVector(R,(0.52-d));}
        }
      }
      if(pt.ho&&pt.tgtBe>=0&&chain.intact>0){
        let bd=1e9,bi=-1;
        for(let k=0;k<NB;k++){
          const d2=pt.p.distanceToSquared(beads[k].m.position);
          if(d2<bd){bd=d2;bi=k;}
        }
        if(bi>=0&&pt.p.distanceTo(beads[bi].m.position)<0.24){
          const cands=[bi-1,bi].filter(k=>k>=0&&k<NB-1&&bonds[k].visible);
          const pick=cands.length?cands[Math.floor(Math.random()*cands.length)]:-1;
          if(pick>=0){breakBond(pick);respawn(pt);}
          else pt.tgtBe=-1;
        }
      }
    }else if(pt.st===1){
      const b=bact[pt.tgtB],d=b.dots[pt.tgtD];
      dotWorld(b,d,R);
      R.sub(pt.p);const dl=R.length();
      if(dl<0.1||!d){
        if(d&&!d.dead){d.dead=true;d.m.material=dotDeadM;deadDots++;}
        if(b.dots.every(x=>x.dead)&&!b.dead){b.dead=true;b.cap.material=capDeadM;}
        killFrac=deadDots/15;
        pt.gt=0.35+400/concNow;pt.st=2;
      }else{R.normalize();pt.p.addScaledVector(R,Math.min(dl,1.0*dts));}
    }else{
      pt.gt-=dts;if(pt.gt<=0)respawn(pt);
    }
    partIM.setColorAt(i,pt.ho?cHO:cOCl);
    m4.makeTranslation(pt.p.x,pt.p.y,pt.p.z);
    partIM.setMatrixAt(i,m4);
  }
  partIM.instanceMatrix.needsUpdate=true;
  if(partIM.instanceColor)partIM.instanceColor.needsUpdate=true;
  /* 全灭后停留重开 */
  if(killFrac>=0.999&&playing){holdT+=dts;
    if(holdT>2.5){holdT=0;deadDots=0;killFrac=0;revive();}}
  else holdT=0;
  /* 染料链:断裂、褪色、漂移 */
  if(chainG.visible){
    if(chain.fading){
      chain.fadeT+=dts;
      const g=1-Math.exp(-1.1*dts);
      beadA.color.lerp(cGray,g);beadB.color.lerp(cGray,g);
      beadA.roughness+= (0.9-beadA.roughness)*g;beadB.roughness+=(0.9-beadB.roughness)*g;
      for(const bd of beads){
        bd.m.position.addScaledVector(bd.vel,dts);
        bd.vel.multiplyScalar(1-1.2*dts);
      }
    }
    for(let i=0;i<NB-1;i++)if(bonds[i].visible)bondOrient(i);
    if(chain.intact===0&&chain.fadeT>2.6&&playing)rebuildChain();
  }
  /* 危险模式:黄绿色 Cl₂ 气泡逸出 */
  if(mode==='danger'){
    bubAcc+=dts*14;
    for(const b of bubs){
      if(!b.alive&&bubAcc>=1){bubAcc-=1;
        randPos(b.p);b.p.y=0.5+Math.random()*1.8;b.p.multiplyScalar(0.85);
        b.vy=0.7+Math.random()*0.5;b.s=0.05+Math.random()*0.07;b.ph=Math.random()*6.28;b.alive=true;}
    }
  }else bubAcc=0;
  let nb=0;
  for(const b of bubs){
    if(b.alive){
      b.p.y+=b.vy*dts;b.p.x+=Math.sin(simT*3+b.ph)*0.12*dts;
      if(b.p.y>3.55)b.alive=false;
    }
    if(b.alive){
      const sc=b.s*clamp((3.55-b.p.y)/0.5,0.15,1);
      m4.makeScale(sc,sc*1.3,sc);m4.setPosition(b.p.x,b.p.y,b.p.z);
    }else{
      m4.makeScale(0.0001,0.0001,0.0001);m4.setPosition(0,-5,0);
    }
    bubIM.setMatrixAt(nb,m4);nb++;
  }
  bubIM.instanceMatrix.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
$('tglLabels').checked=labelsOn;
applyTheme();buildSteps();rebuildChain();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
