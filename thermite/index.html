<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<style>
  :root, :root[data-theme="dark"] {

    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);

    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,146,43,.6); background: rgba(255,146,43,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(217,72,15,.55); background: rgba(217,72,15,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,146,43,.10); border-color: rgba(255,146,43,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(217,72,15,.08); border-color: rgba(217,72,15,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc078; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="铝热反应 · 势垒锁住 850 kJ,镁条点火开闸" data-en="Thermite · 850 kJ Locked Behind a Barrier, One Magnesium Fuse Opens It">铝热反应 · 势垒锁住 850 kJ,镁条点火开闸</h1>
  <div class="sub" data-zh="铝对氧的执念远深于铁:ΔG°(Al₂O₃)=−1582 kJ/mol,压过 Fe₂O₃ 的 −742——2Al+Fe₂O₃→Al₂O₃+2Fe 放出 ≈850 kJ/mol,锋面冲到 2500 °C,铁自己熔成水;但常温铝表面那层致密 Al₂O₃ 钝化膜把这笔驱动力整个锁在活化能势垒后面,必须用镁条明火(>2000 °C)推过山顶;一旦开闸,放出的热就是邻区粉末的点火源,锋面自持蔓延如雪崩,铁水沉底从坩埚孔流进钢轨砂模,Al₂O₃ 熔渣浮在上面 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Aluminum wants oxygen far more than iron does: ΔG°(Al2O3) = −1582 kJ/mol crushes Fe2O3's −742 — so 2Al + Fe2O3 → Al2O3 + 2Fe releases ≈850 kJ/mol and the front hits 2500 °C, melting the iron it makes; yet at room temperature aluminum's own dense Al2O3 passivation film locks all that driving force behind an activation barrier — a magnesium flare (>2000 °C) must shove it over the summit; once open, the released heat ignites neighboring powder, the front runs like an avalanche, molten iron sinks and pours through the crucible hole into the rail mold, Al2O3 slag floating on top · 3D interactive demo · drag to orbit · Space = run/pause">铝热反应 · 势垒锁住 850 kJ,镁条点火开闸</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stState">—</span>
  <span class="k" data-zh="反应进度" data-en="Progress">反应进度</span><span class="v" id="stProg">—</span>
  <span class="k" data-zh="锋面温度" data-en="Front temperature">锋面温度</span><span class="v warn" id="stTemp">—</span>
  <span class="k" data-zh="已释放热量" data-en="Heat released">已释放热量</span><span class="v bad" id="stHeat">—</span>
  <span class="k" data-zh="铁水产量" data-en="Molten iron">铁水产量</span><span class="v ok" id="stFe">—</span>
</div>

<div id="plot">
  <h3 data-zh="焓-反应进程曲线:反应物被 ΔH ≈ −850 kJ 的深谷吸引,却要先翻过活化能势垒——镁条供给点火能量,之后放热自持,小球滚下山坡" data-en="Enthalpy along the reaction coordinate: the −850 kJ valley pulls, but the activation barrier must be crossed first — the magnesium flare buys the climb, then released heat keeps the ball rolling downhill">焓-反应进程曲线:反应物被 ΔH ≈ −850 kJ 的深谷吸引,却要先翻过活化能势垒——镁条供给点火能量,之后放热自持,小球滚下山坡</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="铝粉:亲氧却自我钝化,等待点燃" data-en="Al powder: oxygen-hungry yet self-passivated">铝粉:亲氧却自我钝化,等待点燃</span>
    <span class="chip.r" data-zh="Fe₂O₃ 粉:氧的当前主人,将被夺走" data-en="Fe2O3: oxygen's current holder, about to be robbed">Fe₂O₃ 粉:氧的当前主人,将被夺走</span>
    <span class="chip.o" data-zh="镁条:>2000 °C,唯一的钥匙" data-en="Mg ribbon: >2000 °C, the only key">镁条:>2000 °C,唯一的钥匙</span>
    <span class="chip.g" data-zh="铁水:2500 °C,沉底流出" data-en="molten iron: 2500 °C, sinks and pours">铁水:2500 °C,沉底流出</span>
  </div>
  <div id="actions">
    <button class="abtn brk" id="btnIgnite" data-zh="点燃镁条" data-en="Light the fuse">点燃镁条</button>
    <button class="abtn" id="btnReload" data-zh="重装填" data-en="Reload">重装填</button>
    <button class="abtn" id="btnC" data-zh="看坩埚" data-en="Crucible view">看坩埚</button>
    <button class="abtn" id="btnM" data-zh="看浇铸" data-en="Weld view">看浇铸</button>
  </div>
  <div class="row"><label data-zh="混合物质量" data-en="Mixture mass">混合物质量</label><input id="sM" type="range" min="200" max="1000" step="50" value="500"><span class="val" id="sMVal">500 g</span></div>

  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Plot">曲线</span></label>
      <label><input id="tglSpark" type="checkbox" checked> <span data-zh="火花" data-en="Sparks">火花</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../activation-energy/" data-zh="活化能:势垒的一般理论" data-en="activation energy: the general theory of barriers">活化能:势垒的一般理论</a>
    <a href="../oxyhydrogen-combustion/" data-zh="氢氧焰:另一种高温火焰" data-en="oxyhydrogen flame: another kind of heat">氢氧焰:另一种高温火焰</a>
    <a href="../fireworks/" data-zh="烟花:金属粉末的发光化学" data-en="fireworks: glowing metal powder chemistry">烟花:金属粉末的发光化学</a>
    <a href="../water-electrolysis/" data-zh="电解水:把氧还回去要花电" data-en="water electrolysis: paying electricity to give oxygen back">电解水:把氧还回去要花电</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 22, 75);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  frameM.color.setHex(dark ? 0x3d4654 : 0x8b98a8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('铝热反应 · 势垒锁住 850 kJ,镁条点火开闸', 'Thermite · 850 kJ Locked Behind a Barrier, One Magnesium Fuse Opens It');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(7.8, 4.4, 9.0);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 2.2, 1.4);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);
fill.position.set(-7, 5, -6);
scene.add(fill);
const fireLight = new THREE.PointLight(0xff8c3a, 0, 14, 1.6);
fireLight.position.set(0, 2.6, 3.0);
scene.add(fireLight);

/* ================= 状态 ================= */
let mass = clamp(qsFloat('m', 500), 200, 1000);   // g
let state = 'idle';                                // idle / ignite / react / done
let ignT = 0, prog = 0, coolT = 0, tempCur = 25;
let playing = !qsBool('pause', false);

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function bond(a, b, mat) {
  const d = new THREE.Vector3().subVectors(b, a);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, d.length(), 6), mat);
  c.position.copy(a).addScaledVector(d, 0.5);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return c;
}
const stickM = new THREE.MeshStandardMaterial({ color: 0x77828c, roughness: 0.5 });

function cluster(cx, centerMat, centerR, freeMat, tag) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.SphereGeometry(centerR, 16, 12), centerMat);
  g.add(c);
  const oPos = [V3(0.5, 0.28, 0.1), V3(-0.34, -0.4, 0.34), V3(-0.12, 0.12, -0.52)];
  for (const p of oPos) {
    const o = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), oM);
    o.position.copy(p);
    g.add(o, bond(V3(0, 0, 0), p, stickM));
  }
  for (const dx of [-1.15, 1.15]) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.2, 14, 12), freeMat);
    f.position.set(dx, -0.15, 0.45);
    g.add(f);
  }
  g.position.set(cx, 1.15, -1.6);
  scene.add(g);
  return g;
}

/* ================= 绘图:焓-反应进程 ================= */
const plotCv = document.getElementById('plotCv');
function enthalpyAt(u) {
  if (u <= 0.12) return -DH * 0 + (150) * Math.pow(u / 0.12, 2);
  return -DH + (DH + 150) * Math.exp(-(u - 0.12) * 5.5);
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const dark = THEME === 'dark';
  const padL = 50, padR = 16, padT = 14, padB = 28;
  const xOf = u => padL + clamp(u, 0, 1) * (W - padL - padR);
  const yOf = e => (H - padB) - clamp(e, -950, 250) / 1200 * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const e of [0, -500, -850]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(e)); ctx.lineTo(W - padR, yOf(e)); ctx.stroke();
    ctx.fillText(String(e), padL - 38, yOf(e) + 4);
  }
  ctx.fillText('kJ/mol', padL - 44, padT + 8);
  ctx.fillText(L('反应进程 →', 'reaction progress →'), W - padR - 96, H - padB + 18);
  /* 零线加粗 */
  ctx.strokeStyle = 'rgba(128,150,170,.4)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  /* 曲线 */
  ctx.strokeStyle = '#ff922b';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i <= 100; i++) {
    const u = i / 100, x = xOf(u), y = yOf(enthalpyAt(u));
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* ΔH 标注 */
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(123,216,143,.7)';
  ctx.beginPath(); ctx.moveTo(xOf(0.97), yOf(0)); ctx.lineTo(xOf(0.97), yOf(-DH)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#7bd88f';
  ctx.fillText(L('ΔH = −850 kJ/mol Fe₂O₃', 'ΔH = −850 kJ/mol Fe2O3'), padL + 96, yOf(-DH) + 18);
  ctx.fillStyle = cTxt;
  ctx.fillText(L('势垒顶:点火 >1000 °C', 'barrier top: ignition >1000 °C'), xOf(0.05), yOf(170));
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('放热自持:反应热给邻区点火', 'self-sustaining: heat ignites neighbors'), xOf(0.3), yOf(-380));
  /* 小球 */
  let uB = 0;
  if (state === 'ignite') uB = 0.12 * (ignT / IGNITE_T);
  else if (state === 'react') uB = 0.12 + 0.88 * prog;
  else if (state === 'done') uB = 1;
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(xOf(uB), yOf(enthalpyAt(Math.max(uB, 0.0001))), 7, 0, 7); ctx.fill();
}

}
function syncBtns() {
  btnIgnite.classList.toggle('on', state !== 'idle');
  btnReload.classList.toggle('on', false);
}
function updateStats() {
  stState.textContent = stateText();
  stState.className = 'v ' + (state === 'react' ? 'bad' : state === 'done' ? 'ok' : '');
  stProg.textContent = (prog * 100).toFixed(0) + ' %';
  stTemp.textContent = tempCur.toFixed(0) + ' °C';
  stHeat.textContent = (mass * KJ_PER_G * prog).toFixed(0) + ' kJ';
  stFe.textContent = (mass * FE_FRAC * prog).toFixed(0) + ' g';
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>2Al + Fe₂O₃ → Al₂O₃ + 2Fe</b>,ΔH = [−1675.7] − [−824.2] = <b>−851.5 kJ/mol Fe₂O₃</b><br>` +
    `<b>每克混合物 851.5/213.7 ≈ 3.98 kJ</b>,铁产率 111.7/213.7 ≈ <b>52.3%</b>;当前 ${mass} g 最多放 ${(mass * KJ_PER_G).toFixed(0)} kJ<br>` +
    `<b>ΔG°(Al₂O₃) = −1582 vs ΔG°(Fe₂O₃) = −742 kJ/mol</b>:Ellingham 线更低者夺氧<br>` +
    `<b>钝化膜锁势垒:点火需 >1000 °C</b>,镁条明火 >2000 °C;锋面 ≈2500 °C > 铁熔点 1538 °C`,
    `<b>2Al + Fe2O3 → Al2O3 + 2Fe</b>, ΔH = [−1675.7] − [−824.2] = <b>−851.5 kJ/mol Fe2O3</b><br>` +
    `<b>851.5/213.7 ≈ 3.98 kJ per gram of mix</b>, iron yield 111.7/213.7 ≈ <b>52.3%</b>; ${mass} g releases at most ${(mass * KJ_PER_G).toFixed(0)} kJ<br>` +
    `<b>ΔG°(Al2O3) = −1582 vs ΔG°(Fe2O3) = −742 kJ/mol</b>: the lower Ellingham line takes the oxygen<br>` +
    `<b>Passivation locks the barrier: ignition >1000 °C</b>, Mg flare >2000 °C; front ≈2500 °C > iron mp 1538 °C`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elM.addEventListener('input', () => { mass = +elM.value; syncSliders(); updateStats(); updateFormula(); });
btnIgnite.addEventListener('click', () => { igniteNow(); });
btnReload.addEventListener('click', () => { reload(); });
btnC.addEventListener('click', () => flyTo([5.4, 4.0, 8.2], [0, 2.8, 3.0]));
btnM.addEventListener('click', () => flyTo([4.2, 2.4, 7.6], [0, 0.7, 3.0]));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglSpark').addEventListener('change', e => { sparkOn = e.target.checked; sparks.visible = sparkOn && (state === 'react' || state === 'done'); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
function igniteNow() {
  if (state !== 'idle') return;
  state = 'ignite'; ignT = 0;
  flame.visible = true;
  notifyT = 2.6; notifyZ = '镁条点燃:>2000 °C 的明火把局部粉末推过势垒顶端'; notifyE = 'magnesium lit: >2000 °C shoves local powder over the barrier top';
  updateStats(); drawPlot();
}
function reload() {
  state = 'idle'; prog = 0; ignT = 0; coolT = 0; tempCur = 25;
  flame.visible = false; frontRing.visible = false; slag.visible = false;
  stream.visible = false; weldBar.visible = false;
  weldM.emissiveIntensity = 2.0;
  for (const g of grains) { g.molten = false; g.m.material = g.m.material === moltM ? alM : feoM; g.m.position.copy(g.base); }
  for (let i = 0; i < SPARK_N; i++) sPos[i * 3 + 1] = -999;
  sparkGeo.attributes.position.needsUpdate = true;
  sparks.visible = false;
  fireLight.intensity = 0;
  updateStats(); updateFormula(); drawPlot();
}

/* ================= 反应仿真 ================= */
const GRAIN_TOP = 3.4, GRAIN_SPAN = 1.25;
function stepReact(dt) {
  if (state === 'ignite') {
    ignT += dt;
    flame.scale.setScalar(0.8 + 0.3 * Math.sin(ignT * 30));
    flame.position.y = ribbon.position.y + 0.35 + 0.03 * Math.sin(ignT * 24);
    fireLight.intensity = 2.4;
    fireLight.position.set(ribbon.position.x, ribbon.position.y, ribbon.position.z);
    if (Math.random() < 0.5) spawnSpark(ribbon.position.x, ribbon.position.y + 0.3, ribbon.position.z, 1.4, 1.2);
    if (ignT >= IGNITE_T) {
      state = 'react'; prog = 0;
      frontRing.visible = true;
      if (sparkOn) sparks.visible = true;
      notifyT = 2.4; notifyZ = '越过势垒:反应热开始给邻区点火,锋面自持蔓延'; notifyE = 'past the barrier: released heat ignites neighbors, the front runs itself';
    }
  } else if (state === 'react') {
    prog = Math.min(1, prog + dt / REACT_T);
    ignT += dt;
    const frontY = GRAIN_TOP - prog * GRAIN_SPAN;
    frontRing.position.y = frontY;
    fireLight.intensity = 5 + Math.sin(performance.now() * 0.02) * 0.8;
    fireLight.position.set(MOLD.x, frontY, MOLD.z);
    flame.visible = ignT < IGNITE_T + 0.8;
    for (const g of grains) {
      if (!g.molten && g.base.y > frontY) {
        g.molten = true;
        g.m.material = moltM;
      }
      if (g.molten) {
        g.m.position.y = g.base.y + Math.sin(performance.now() * 0.004 + g.ph) * 0.015;
        g.m.position.x = g.base.x + Math.cos(performance.now() * 0.003 + g.ph) * 0.012;
      }
    }
    /* 火花从锋面喷出 */
    let emit = 3;
    while (emit-- > 0) spawnSpark(MOLD.x + (Math.random() - 0.5) * 2.0, frontY, MOLD.z + (Math.random() - 0.5) * 2.0, 3.2, 2.4);
    /* 底孔放铁水 */
    if (prog > 0.72) {
      const f = (prog - 0.72) / 0.28;
      stream.visible = true;
      const top = 2.08, bot = 0.62;
      const len = Math.max(0.05, f * (top - bot));
      stream.scale.set(1, len, 1);
      stream.position.set(MOLD.x, top - len / 2, MOLD.z);
      weldBar.visible = true;
      weldBar.scale.y = clamp(f, 0.05, 1);
      spawnSpark(MOLD.x + (Math.random() - 0.5) * 0.5, 0.62, MOLD.z + (Math.random() - 0.5) * 0.5, 2.4, 1.8);
      fireLight.position.set(MOLD.x, 0.8, MOLD.z);
    }
    tempCur = 25 + 2475 * (0.92 + 0.08 * Math.sin(performance.now() * 0.01));
    if (prog >= 1) {
      state = 'done'; coolT = 0;
      slag.visible = true;
      frontRing.visible = false;
      flame.visible = false;
      for (const g of grains) { g.molten = false; g.m.material = slagM; }
      tempCur = 2500;
    }
  } else if (state === 'done') {
    coolT += dt;
    const k = Math.exp(-coolT / 30);
    tempCur = 25 + 2475 * k;
    weldM.emissiveIntensity = 2.0 * k;
    slagM.emissiveIntensity = 0.8 * k;
    fireLight.intensity = 4 * k;
    if (coolT > 90) fireLight.intensity = 0;
  }
  /* 火花粒子更新 */
  if (sparks.visible) {
    for (let i = 0; i < SPARK_N; i++) {
      if (sLife[i] <= 0) continue;
      sLife[i] -= dt;
      sVel[i * 3 + 1] -= 4.5 * dt;
      sPos[i * 3] += sVel[i * 3] * dt;
      sPos[i * 3 + 1] += sVel[i * 3 + 1] * dt;
      sPos[i * 3 + 2] += sVel[i * 3 + 2] * dt;
      if (sLife[i] <= 0) sPos[i * 3 + 1] = -999;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;
  }
  /* 氧转移珠 */
  for (const b of oBeads) {
    const on = state === 'react' && prog > 0.08;
    b.m.visible = on;
    if (on) {
      const t = clamp(((prog - 0.08) / 0.8 + b.off) % 1, 0, 1);
      const a = V3(-6.4 + 0.6, 1.5, -1.6), c = V3(0, 4.4, -1.6), d = V3(6.4 - 0.6, 1.5, -1.6);
      const p1 = V3(0, 0, 0).lerpVectors(a, c, t), p2 = V3(0, 0, 0).lerpVectors(c, d, t);
      b.m.position.copy(p1.lerpVectors(p1, p2, t));
    }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) stepReact(dt);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.08) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
