<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>斯特恩–盖拉赫实验 · 自旋的上下之分</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="斯特恩–盖拉赫实验" data-en="The Stern–Gerlach Experiment">斯特恩–盖拉赫实验</h1>
  <div class="sub" data-zh="看银原子束在磁极间当场劈成两束、屏上从「经典连续带」跳成两个斑点；再串 z→x→z 三台，看被抹掉的记忆重演 · 拖动旋转 / 空格运行/暂停" data-en="Watch a silver beam split in two between the pole pieces: the screen jumps from a classical band to two dots; chain z→x→z to see memory erased and rewritten · drag to orbit / Space = run/pause">看银原子束在磁极间当场劈成两束、屏上从「经典连续带」跳成两个斑点；再串 z→x→z 三台，看被抹掉的记忆重演 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="累积计数" data-en="Atoms landed">累积计数</span><span class="v" id="stCount">—</span>
  <span class="k" data-zh="＋束占比" data-en="+ beam share">＋束占比</span><span class="v" id="stUp">—</span>
  <span class="k" data-zh="磁场梯度" data-en="Field gradient">磁场梯度</span><span class="v" id="stGrad">—</span>
  <span class="k" data-zh="模式" data-en="Mode">模式</span><span class="v" id="stMode">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn lay" data-i="0" data-zh="单台 z" data-en="One z">单台 z</button>
    <button class="abtn lay" data-i="1" data-zh="z→z 过滤" data-en="z→z filter">z→z 过滤</button>
    <button class="abtn lay" data-i="2" data-zh="z→x 重置" data-en="z→x reset">z→x 重置</button>
    <button class="abtn lay" data-i="3" data-zh="z→x→z" data-en="z→x→z">z→x→z</button>
    <button class="abtn" id="btnKeep" data-zh="挡板：保留上束" data-en="Blocker: keep +">挡板：保留上束</button>
    <button class="abtn" id="btnMode" data-zh="模式：量子" data-en="Mode: quantum">模式：量子</button>
    <button class="abtn" id="btnClear" data-zh="清屏" data-en="Clear screen">清屏</button>
  </div>
  <div class="row">
    <label data-zh="磁场梯度" data-en="Gradient">磁场梯度</label>
    <input id="sGrad" type="range" min="40" max="160" step="5" value="100">
    <span class="val" id="sGradVal">1.00</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
      <label><input id="tglBurst" type="checkbox"> <span data-zh="单原子连发" data-en="Single-atom burst">单原子连发</span></label>
    </div>

    <span data-zh="相关:" data-en="Related:">相关:</span>

    <a href="../quantum-entanglement/" data-zh="量子纠缠：关联测量" data-en="Quantum entanglement">量子纠缠</a>
    <a href="../quantum-tunneling/" data-zh="量子隧穿" data-en="Quantum tunneling">量子隧穿</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,f)=>a+(b-a)*f;
const rnd=(a,b)=>a+Math.random()*(b-a);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,46);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,150);
camera.position.set(0.4,3.4,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.3,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=60;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

/* 光学台 */
const bench=new THREE.Mesh(new THREE.BoxGeometry(15,0.2,5),
  new THREE.MeshStandardMaterial({color:0x1c2027,roughness:.95}));
bench.position.set(-0.4,-2.75,0); scene.add(bench);

/* ---- 原子炉 ---- */
const oven=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.0,1.0),
  new THREE.MeshStandardMaterial({color:0x5c4a3a,roughness:.6,metalness:.4,emissive:0xff6b00,emissiveIntensity:.25}));
oven.position.set(-6.6,0,0); scene.add(oven);

/* ---- 三台 SG 磁铁（楔形磁极对；x 取向整体绕束轴转 90°） ---- */
function wedge(sign){ // 三角棱柱：sign=+1 尖朝下（上磁极），-1 尖朝上
  const sh=new THREE.Shape();
  sh.moveTo(-0.42,0); sh.lineTo(0.42,0); sh.lineTo(0,sign*0.78); sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:1.9,bevelEnabled:false});
  g.translate(0,0,-0.95); return g;
}
const poleMat=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:.35,metalness:.75});
const SGX=[-2.5,1.7,3.9], SG_ON=[true,false,false], SG_AXIS=['z',null,null];
const sgs=[];
for(let i=0;i<3;i++){
  const g=new THREE.Group();
  const top=new THREE.Mesh(wedge(1),poleMat); top.position.y=0.62;
  const bot=new THREE.Mesh(wedge(-1),poleMat); bot.position.y=-0.62;
  g.add(top,bot);
  g.position.set(SGX[i],0,0);
  g.visible=i===0;
  scene.add(g); sgs.push(g);
}

/* ---- 挡板（SG1 后：保留一束，挡掉另一束） ---- */
const blockBar=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.7,4.2),
  new THREE.MeshStandardMaterial({color:0x10141a,roughness:.9}));
blockBar.position.set(0.15,0,0); blockBar.visible=false; scene.add(blockBar);

/* ---- 观察屏 ---- */
const screen=new THREE.Mesh(new THREE.BoxGeometry(0.16,5.6,4.6),
  new THREE.MeshStandardMaterial({color:0x243040,roughness:.85}));
screen.position.set(5.6,0,0); scene.add(screen);
/* 经典预言幽灵带 */
const ghost=new THREE.Mesh(new THREE.BoxGeometry(0.04,5.0,0.9),
  new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:.10}));
ghost.position.set(5.48,0,0); scene.add(ghost);

/* ---- 原子（实例化）与斑点（实例化，未用缩放置零） ---- */
const AN=72;
const aMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,10,8),
  new THREE.MeshStandardMaterial({color:0xe9ecef,emissive:0xbde9ff,emissiveIntensity:.5,metalness:.6,roughness:.3}),AN);
aMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(aMesh);
const zeroM=new THREE.Matrix4().makeScale(0,0,0), tmpM=new THREE.Matrix4();
const atoms=[];
for(let i=0;i<AN;i++){ aMesh.setMatrixAt(i,zeroM); atoms.push(null); }

const SN=320;
const spotMesh=new THREE.InstancedMesh(new THREE.CircleGeometry(0.055,10),
  new THREE.MeshStandardMaterial({color:0xfff4e6,emissive:0xffc078,emissiveIntensity:.7,side:THREE.DoubleSide}),SN);
spotMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(spotMesh);
for(let i=0;i<SN;i++) spotMesh.setMatrixAt(i,zeroM);
let spotIdx=0, nPlus=0, nMinus=0, landed=0;

function addSpot(y,z){
  tmpM.makeRotationY(-Math.PI/2);
  tmpM.setPosition(5.5,y+rnd(-0.04,0.04),z+rnd(-0.04,0.04));
  spotMesh.setMatrixAt(spotIdx,tmpM);
  spotIdx=(spotIdx+1)%SN; spotMesh.instanceMatrix.needsUpdate=true;
}

/* ---- 状态 ---- */
let playing=true, labelsOn=true, quantum=true, keepUp=true, layout=0;
let grad=1.0, emitAcc=0;
const KDEF=0.9; // 偏转系数：Δ ≈ 2.4·grad·μ（配合 v=3.4 保证两斑分离 ~2.4 个场景单位）

function applyLayout(i){
  layout=i;
  const cfg=[
    {axes:['z',null,null],block:false},
    {axes:['z','z',null],block:true},
    {axes:['z','x',null],block:true},
    {axes:['z','x','z'],block:true},
  ][i];
  for(let k=0;k<3;k++){
    SG_ON[k]=cfg.axes[k]!==null;
    SG_AXIS[k]=cfg.axes[k];
    sgs[k].visible=SG_ON[k];
    sgs[k].rotation.x=cfg.axes[k]==='x'?Math.PI/2:0;
  }
  blockBar.visible=cfg.block;
  placeBlocker();
  document.querySelectorAll('.abtn.lay').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  clearScreen();
}
function placeBlocker(){
  // 挡掉被舍弃的一束：保留上束 → 挡板在下束通道
  blockBar.position.y=keepUp?-1.0:1.0;
}
function clearScreen(){
  for(let i=0;i<SN;i++) spotMesh.setMatrixAt(i,zeroM);
  spotMesh.instanceMatrix.needsUpdate=true; spotIdx=0; nPlus=0; nMinus=0; landed=0;
}
function spawnAtom(){
  for(let i=0;i<AN;i++){
    if(!atoms[i]){
      atoms[i]={x:-6.2,y:rnd(-0.1,0.1),z:rnd(-0.08,0.08),vx:3.4,vy:0,vz:0,
        state:'mix',sign:0,mz:0,lastAxis:null,mu:0};
      return;
    }
  }
}
/* 预热：加载即铺几颗在途原子，束流立刻可见 */
function prewarm(){
  for(let n=0;n<4;n++){
    const x=-6.0+n*0.8;
    for(let i=0;i<AN;i++) if(!atoms[i]){
      atoms[i]={x,y:rnd(-0.08,0.08),z:rnd(-0.06,0.06),vx:3.4,vy:0,vz:0,
        state:'mix',sign:0,mz:rnd(-1,1),lastAxis:null,mu:0};
      break;
    }
  }
}
function measure(a,axis){ // 进入磁体即测量（量子）；经典模式用连续 μ
  if(!quantum){ a.mz=rnd(-1,1); a.lastAxis=axis; return; }
  const cur=axis==='z'?a.state:null;
  if(cur==='z+'||cur==='z-'){ a.sign=cur==='z+'?1:-1; }
  else if(a.lastAxis===axis&&a.sign!==0){ /* 同轴重复：保持 */ }
  else a.sign=Math.random()<0.5?1:-1;
  if(axis==='z') a.state=a.sign>0?'z+':'z-';
  else a.state=a.sign>0?'x+':'x-';
  a.lastAxis=axis;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('银原子炉 ~1300 K','Ag oven ~1300 K'),new THREE.Vector3(-6.6,0.95,0),'o',()=>true);
addLabel(()=>`SG① (${SG_AXIS[0]||'z'})`,new THREE.Vector3(SGX[0],-1.75,0),'b',
  ()=>SG_ON[0]);
addLabel(()=>`SG② (${SG_AXIS[1]||'-'})`,new THREE.Vector3(SGX[1],-1.75,0),'b',()=>SG_ON[1]);
addLabel(()=>`SG③ (${SG_AXIS[2]||'-'})`,new THREE.Vector3(SGX[2],-1.75,0),'b',()=>SG_ON[2]);
addLabel(()=>L('挡板：只放行一束','Blocker: one beam passes'),new THREE.Vector3(0.15,2.2,0),'r',
  ()=>blockBar.visible);
addLabel(()=>L('观察屏','Screen'),new THREE.Vector3(5.6,3.15,0),'g',()=>true);
addLabel(()=>L('经典预言：连续带','Classical prediction: band'),new THREE.Vector3(5.6,-2.95,0.8),'o',()=>true);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'炉中蒸发出银原子束，磁矩方向原本随机分布',en:'A silver beam evaporates out; magnetic moments point every which way'},
 {zh:'非均匀磁场施加力 F=∇(μ·B)，磁矩被梯度拽偏',en:'A field gradient pushes each moment with F=∇(μ·B)'},
 {zh:'经典预言：连续取向 → 屏上一条连续带',en:'Classically: continuous orientations → one continuous band'},
 {zh:'实测：只有上下两个斑点——自旋只取两个取向（角动量量子化）',en:'Observed: exactly two dots — spin has only two orientations'},
 {zh:'z→z 串联：过滤后的纯态再过同轴磁铁不再分裂（测量制备了态）',en:'z→z: the filtered pure state no longer splits — measurement prepared it'},
 {zh:'z→x→z：x 测量抹掉 z 记忆，末台两斑重现（不可克隆）',en:'z→x→z: the x measurement erases z memory; two spots reappear'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stCount').innerHTML=landed+'<small> 颗</small>';
  const tot=nPlus+nMinus;
  document.getElementById('stUp').innerHTML=(tot?Math.round(nPlus/tot*100):50)+'<small> %</small>';
  document.getElementById('stGrad').innerHTML=grad.toFixed(2)+'<small> T/cm</small>';
  document.getElementById('stMode').textContent=quantum?L('量子','Quantum'):L('经典','Classical');
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  bench.material.color.setHex(dark?0x1c2027:0xcfc8bc); // 光学台随主题
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('btnMode').textContent=quantum?L('模式：量子','Mode: quantum'):L('模式：经典','Mode: classical');
  document.getElementById('btnKeep').textContent=keepUp?L('挡板：保留上束','Blocker: keep +'):L('挡板：保留下束','Blocker: keep −');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
document.querySelectorAll('.abtn.lay').forEach(b=>b.addEventListener('click',()=>applyLayout(+b.dataset.i)));
document.getElementById('btnKeep').addEventListener('click',e=>{
  keepUp=!keepUp; placeBlocker();
  e.currentTarget.textContent=keepUp?L('挡板：保留上束','Blocker: keep +'):L('挡板：保留下束','Blocker: keep −');
});
document.getElementById('btnMode').addEventListener('click',e=>{
  quantum=!quantum;
  e.currentTarget.classList.toggle('on',!quantum);
  e.currentTarget.textContent=quantum?L('模式：量子','Mode: quantum'):L('模式：经典','Mode: classical');
  clearScreen();
});
document.getElementById('btnClear').addEventListener('click',clearScreen);
document.getElementById('sGrad').addEventListener('input',e=>{
  grad=+e.target.value/100; document.getElementById('sGradVal').textContent=grad.toFixed(2);
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 原子推进 ---- */
function stepAtoms(dt){
  for(let i=0;i<AN;i++){
    const a=atoms[i]; if(!a) continue;
    const px=a.x; a.x+=a.vx*dt;
    // 进磁体：测量 + 重新准直
    for(let k=0;k<3;k++){
      const x0=SGX[k]-0.95;
      if(SG_ON[k]&&px<x0&&a.x>=x0){
        measure(a,SG_AXIS[k]);
        a.vy=0; a.vz=0;
        if(quantum){ a.mu=(a.state==='z+'||a.state==='x+')?1:-1; }
      }
    }
    // 磁体内匀加速偏转
    for(let k=0;k<3;k++){
      if(SG_ON[k]&&a.x>=SGX[k]-0.95&&a.x<=SGX[k]+0.95){
        const mu=quantum?a.mu:a.mz;
        const acc=KDEF*grad*mu;
        if(SG_AXIS[k]==='z') a.vy+=acc*dt; else a.vz+=acc*dt;
      }
    }
    // 挡板
    if(blockBar.visible&&px<0.15&&a.x>=0.15){
      if((keepUp&&a.y<-0.3)||(!keepUp&&a.y>0.3)){ atoms[i]=null; aMesh.setMatrixAt(i,zeroM); continue; }
    }
    a.y+=a.vy*dt; a.z+=a.vz*dt;
    // 落屏 / 出界
    if(a.x>=5.5){
      if(Math.abs(a.y)<2.7&&Math.abs(a.z)<2.2){
        addSpot(a.y,a.z); landed++;
        if(a.sign>0)nPlus++; else if(a.sign<0)nMinus++;
      }
      atoms[i]=null; aMesh.setMatrixAt(i,zeroM); continue;
    }
    if(Math.abs(a.y)>4||Math.abs(a.z)>4){ atoms[i]=null; aMesh.setMatrixAt(i,zeroM); continue; }
    tmpM.makeScale(1,1,1).setPosition(a.x,a.y,a.z);
    aMesh.setMatrixAt(i,tmpM);
  }
  aMesh.instanceMatrix.needsUpdate=true;
}

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    const burst=document.getElementById('tglBurst').checked;
    emitAcc+=dt*(burst?2.2:14);
    while(emitAcc>=1){ emitAcc-=1; spawnAtom(); }
    stepAtoms(dt);
  }
  acc+=dt; if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsGrad=parseFloat(qs.get('speed'));
if(Number.isFinite(qsGrad)){grad=clamp(qsGrad,0.4,1.6);document.getElementById('sGrad').value=grad*100;document.getElementById('sGradVal').textContent=grad.toFixed(2);}
const qsLay=parseInt(qs.get('layout'));
applyLayout(Number.isInteger(qsLay)&&qsLay>=0&&qsLay<=3?qsLay:0);
if(!qs.get('pause')) prewarm(); // 运行态加载即有束流；?pause=1 保持全静
applyTheme(); applyLang();
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
