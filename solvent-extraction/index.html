<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 萃取分配演示（Nernst 分配定律）
   - 每次萃取达平衡后：留在水相的分数 = V水/(V水 + D·V有) = 1/(1+D·r)，
     n 次分批(每次新鲜有机相 r·V水) → 剩余 (1/(1+D·r))ⁿ；
     一次用掉全部(n·r) → 剩余 1/(1+D·n·r)。少量多次完胜。
   - 可解离溶质（苯甲酸 pKa≈4.2）：D_eff = D/(1+10^(pH-pKa))，
     碱性去质子化把它拽回水相；碘在 CCl₄ 中 D 很大（真实 ≈85，此处取滑块值）。
   - CCl₄ 密度大于水 → 有机相在下层，从下口放出，水相留在漏斗里反复萃取。
   - 粒子按当前 f有 = D·r/(1+D·r) 概率随机归属两相，实测计数与理论对照。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
camera.position.set(2.9,0.7,4.9);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.15,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=20;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.75));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(3,5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-4,2,-4);scene.add(fill);

/* ---- 漏斗几何 ---- */
const Y0=-0.85,YTOP=0.55,RMAX=1.05;      // 内部液体的下限/上限/最大半径
function radAt(y){
  if(y<-0.9)return 0.06;                  // 下管
  if(y<-0.05)return 0.06+(RMAX-0.06)*(y+0.9)/0.85;  // 锥段
  return RMAX;                            // 筒段
}
const vTable=[];                          // V(y) 累积表
{
  let v=0,py=Y0;
  for(let y=Y0;y<=YTOP+0.001;y+=0.01){
    v+=Math.PI*Math.pow((radAt(y)+radAt(py))/2,2)*(y-py);
    vTable.push(v);py=y;
  }
}
const vOf=y=>vTable[clamp(Math.round((y-Y0)/0.01),0,vTable.length-1)];
function levelFor(frac){                  // 求 V(y)=frac·V总 的液面
  const vt=vOf(YTOP);
  let lo=Y0,hi=YTOP;
  for(let i=0;i<28;i++){const m=(lo+hi)/2;(vOf(m)<frac*vt)?lo=m:hi=m;}
  return (lo+hi)/2;
}
const funnelG=new THREE.Group();scene.add(funnelG);
/* 玻璃壳 */
(function(){
  const pts=[];
  [[0.06,-1.5],[0.06,-0.9],[RMAX,-0.05],[RMAX,0.95],[0.93,1.28],[0.99,1.28],[0.99,0.95]].forEach(p=>pts.push(new THREE.Vector2(p[0],p[1])));
  const geo=new THREE.LatheGeometry(pts,40);
  funnelG.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xdfe7ee,roughness:0.08,metalness:0,transparent:true,opacity:0.22,side:THREE.DoubleSide})));
})();
/* 两相液体（按液面重建） */
const orgMat=new THREE.MeshStandardMaterial({color:0xc9b6e8,transparent:true,opacity:0.55,roughness:0.15});
const aqMat=new THREE.MeshStandardMaterial({color:0xd8ecf5,transparent:true,opacity:0.5,roughness:0.15});
let orgMesh=null,aqMesh=null;
function liquidGeo(yLo,yHi){
  const pts=[];
  for(let y=yLo;y<=yHi+0.001;y+=0.02)pts.push(new THREE.Vector2(Math.max(0.015,radAt(y)-0.015),y));
  const geo=new THREE.LatheGeometry(pts,36);
  geo.computeVertexNormals();
  return geo;
}
function rebuildLiquids(yInt){
  if(orgMesh){funnelG.remove(orgMesh);orgMesh.geometry.dispose();}
  if(aqMesh){funnelG.remove(aqMesh);aqMesh.geometry.dispose();}
  if(yInt>Y0+0.02){
    orgMesh=new THREE.Mesh(liquidGeo(Y0,yInt),orgMat);
    funnelG.add(orgMesh);
  }else orgMesh=null;
  if(yInt<YTOP-0.02){
    aqMesh=new THREE.Mesh(liquidGeo(Math.max(Y0,yInt),YTOP),aqMat);
    funnelG.add(aqMesh);
  }else aqMesh=null;
}
/* 旋塞与支架 */
const cock=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.12,0.12),new THREE.MeshStandardMaterial({color:0xc44b2a,roughness:0.4}));
cock.position.set(0,-1.44,0);funnelG.add(cock);
const stand=new THREE.Mesh(new THREE.BoxGeometry(0.14,3.4,0.14),new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.5,metalness:0.5}));
stand.position.set(-1.7,0.6,-0.7);scene.add(stand);
const clampM=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.035,8,24),new THREE.MeshStandardMaterial({color:0x788795,metalness:0.6,roughness:0.4}));
clampM.position.set(-0.75,0.5,-0.35);clampM.rotation.y=Math.PI/4;scene.add(clampM);
const bench=new THREE.Mesh(new THREE.BoxGeometry(6,0.12,4),new THREE.MeshStandardMaterial({color:0x2b2f36,roughness:0.85}));
bench.position.set(0,-1.62,0);scene.add(bench);
/* 收集瓶 */
const flask=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.28,0.6,20),new THREE.MeshStandardMaterial({color:0xdfe7ee,transparent:true,opacity:0.22,roughness:0.1,side:THREE.DoubleSide}));
flask.position.set(0.05,-1.32,0);scene.add(flask);
const flaskFill=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.23,0.4,18),orgMat);
flaskFill.position.set(0.05,-1.5,0);flaskFill.scale.y=0.01;scene.add(flaskFill);

/* ---- 溶质粒子 ---- */
const NP=240;
const COLS=[
  {org:new THREE.Color(0x7b3fd4),aq:new THREE.Color(0xb5763a),orgName:L('碘→CCl₄ 紫色','iodine→violet in CCl4'),aqName:L('水相棕黄','pale brown in water')},
  {org:new THREE.Color(0xe8590c),aq:new THREE.Color(0xf2c94c),orgName:L('染料→橙红','dye→orange-red'),aqName:L('水相黄色','yellow in water')},
];
let solute=0;
const pMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3}),NP);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const zeroM=new THREE.Matrix4().makeScale(0,0,0),tmpM=new THREE.Matrix4(),tmpC=new THREE.Color();
const parts=[];
for(let i=0;i<NP;i++){
  parts.push({active:false,ph:0,x:0,y:0,z:0,tx:0,ty:0,tz:0});
  pMesh.setMatrixAt(i,zeroM);pMesh.setColorAt(i,tmpC.setHex(0xffffff));
}
funnelG.add(pMesh);
pMesh.frustumCulled=false;
function spawnAll(){
  const yInt=levelFor(rVol/(1+rVol));
  for(const p of parts){
    p.active=true;p.ph=1;               // 初始全部在水相(上层)
    p.y=Y0+ (YTOP-yInt-0.06)*Math.random()+yInt+0.03;
    const rr=radAt(p.y)*0.7,an=Math.random()*TAU;
    p.x=rr*Math.cos(an);p.z=rr*Math.sin(an);
    p.tx=p.x;p.ty=p.y;p.tz=p.z;
    pMesh.setColorAt(parts.indexOf(p),COLS[solute].aq);
  }
  pMesh.instanceColor.needsUpdate=true;
  rebuildLiquids(yInt);
}

/* ---- 状态 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let Dv=8,rVol=0.5,pH=2,rounds=0,collected=0,simT=0;
let state='idle',stateT=0,yInt=0,autoT=0.9;
let shakePhase=0;
function Deff(){
  if(solute===0)return Dv;
  return Dv/(1+Math.pow(10,pH-4.2));
}
function equilibrium(){
  const fOrg=Deff()*rVol/(1+Deff()*rVol);   // 每个粒子进有机相的概率
  let nOrg=0;
  for(const p of parts){
    if(!p.active)continue;
    p.ph=Math.random()<fOrg?0:1;
    if(p.ph===0)nOrg++;
  }
  rounds++;
  /* 重排后的层内目标位置 */
  for(const p of parts){
    if(!p.active)continue;
    if(p.ph===0){p.ty=Y0+0.06+Math.random()*Math.max(0.05,yInt-Y0-0.1);}
    else{p.ty=yInt+0.05+Math.random()*Math.max(0.05,YTOP-yInt-0.1);}
    const rr=radAt(p.ty)*0.7,an=Math.random()*TAU;
    p.tx=rr*Math.cos(an);p.tz=rr*Math.sin(an);
  }
  for(let i=0;i<NP;i++){
    const p=parts[i];
    pMesh.setColorAt(i,p.active?(p.ph===0?COLS[solute].org:COLS[solute].aq):tmpC.setHex(0xffffff));
  }
  pMesh.instanceColor.needsUpdate=true;
  /* 两相液体颜色随浓度变化 */
  const fracOrg=nOrg/Math.max(1,parts.filter(p=>p.active).length);
  orgMat.color.copy(COLS[solute].org).lerp(tmpC.setHex(0xdfe7ee),0.75-0.45*fracOrg);
  aqMat.color.copy(COLS[solute].aq).lerp(tmpC.setHex(0xdfe7ee),0.8-0.35*(1-fracOrg));
  return nOrg;
}
function drainDone(){
  /* 放出下层有机相：该相粒子计入收集 */
  for(const p of parts){
    if(p.active&&p.ph===0){p.active=false;collected++;}
  }
}
function resetAll(){
  rounds=0;collected=0;state='idle';stateT=0;autoT=1.0;
  yInt=levelFor(rVol/(1+rVol));
  spawnAll();
  flaskFill.scale.y=0.01;
  activeStep=0;syncSteps();
}
const STEPS=[
 {zh:'相似相溶：溶质在两相的分配由 Nernst 定律 D=c有/c水 决定',en:'Like dissolves like: Nernst partition law D = c_org/c_aq sets the split'},
 {zh:'振荡：两相充分接触，溶质跨界面重新「分家」——看粒子乱成一锅',en:'Shake: phases intimately mix; solute re-partitions across the interface'},
 {zh:'静置分层：CCl₄ 沉在下层 —— 颜色比例当场重排',en:'Settle: CCl4 sinks below — the color ratio visibly rearranges'},
 {zh:'放下层、注新液：一次萃取结束，水相留下 1/(1+D·r)',en:'Drain, refill: one round leaves 1/(1+D·r) in the water'},
 {zh:'少量多次：等量萃取剂分 n 次 → 剩余 (1/(1+D·r))ⁿ 指数下降',en:'Many small portions: after n rounds only (1/(1+D·r))^n remains — exponential'},
 {zh:'pH 把可解离溶质拽回水相；应用：咖啡因/青霉素/PUREX；乳化是敌人',en:'pH drags ionizable solute back; used for caffeine, penicillin, PUREX; emulsion is the enemy'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
const stepOfState={idle:0,shake:1,settle:2,hold:3,drain:3,inject:3,done:4};

/* ---- 标签 ---- */

/* ---- 对比图 ---- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const De=Deff();
  const fN=Math.pow(1/(1+De*rVol),rounds)*100;         // n 次分批
  const f1=1/(1+De*rounds*rVol)*100;                    // 一次全部
  const act=parts.filter(p=>p.active&&p.ph===1).length/NP*100;
  const rows=[
    [`${rounds} ${L('次分批(理论)','portions (theory)')}`,fN,'#74d69c'],
    [L('一次全部(理论)','one big portion (theory)'),f1,'#ffa94d'],
    [L('实测水相剩余','measured in water'),act,'#74b0fc'],
  ];
  ctx.font='14px system-ui';
  rows.forEach((r,i)=>{
    const y=22+i*(H-40)/3;
    ctx.fillStyle=t2;ctx.fillText(r[0],6,y+14);
    const bw=W-130;
    ctx.fillStyle='rgba(128,150,170,.18)';ctx.fillRect(120,y+2,bw,16);
    ctx.fillStyle=r[2];ctx.fillRect(120,y+2,clamp(r[1],0,100)/100*bw,16);
    ctx.fillStyle=t2;ctx.fillText(r[1].toFixed(1)+'%',124+bw*0.42,y+15);
  });
  ctx.fillStyle=acc;
  ctx.fillText(`D=${De.toFixed(1)}  r=${rVol.toFixed(2)}  n=${rounds}`,6,H-8);
}

/* ---- 统计 ---- */
let statAcc=0;
function updateStats(){
  const rem=parts.filter(p=>p.active&&p.ph===1).length;
  document.getElementById('stRem').innerHTML=(rem/NP*100).toFixed(1)+'<small> %</small>';
  document.getElementById('stCol').innerHTML=(collected/NP*100).toFixed(1)+'<small> %</small>';
  document.getElementById('stRd').innerHTML=rounds;
  document.getElementById('stD').innerHTML=Deff().toFixed(1);
}

/* ---- 状态机 ---- */
function startShake(){
  if(state==='shake'||state==='settle')return;
  state='shake';stateT=0;
  activeStep=1;syncSteps();
  /* 摇匀：粒子乱窜 */
  for(const p of parts){
    if(!p.active)continue;
    p.tx=(Math.random()-0.5)*1.4;
    p.ty=clamp(Y0+0.1+Math.random()*(YTOP-Y0-0.2),Y0+0.1,YTOP-0.08);
    p.tz=(Math.random()-0.5)*1.0;
  }
}
function startDrain(){
  if(!orgMesh||state==='drain'||state==='inject')return;
  state='drain';stateT=0;
  activeStep=3;syncSteps();
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    stateT+=dt;
    if(state==='idle'){
      autoT-=dt;
      if(autoT<=0)startShake();
    }else if(state==='shake'){
      shakePhase=stateT;
      funnelG.rotation.z=Math.sin(stateT*9)*0.3;
      /* 粒子在体内乱滚 */
      for(const p of parts){
        if(!p.active)continue;
        p.x+=(p.tx-p.x)*clamp(dt*6,0,1)+(Math.random()-0.5)*0.05;
        p.y+=(p.ty-p.y)*clamp(dt*6,0,1)+(Math.random()-0.5)*0.05;
        p.z+=(p.tz-p.z)*clamp(dt*6,0,1)+(Math.random()-0.5)*0.05;
        const rr=radAt(p.y)*0.78,d=Math.hypot(p.x,p.z);
        if(d>rr){p.x*=rr/d;p.z*=rr/d;}
        p.y=clamp(p.y,Y0+0.05,YTOP-0.04);
      }
      if(stateT>1.8){
        state='settle';stateT=0;
        funnelG.rotation.z=0;shakePhase=0;
        equilibrium();
        activeStep=2;syncSteps();
      }
    }else if(state==='settle'){
      for(const p of parts){
        if(!p.active)continue;
        p.x+=(p.tx-p.x)*clamp(dt*4,0,1);
        p.y+=(p.ty-p.y)*clamp(dt*4,0,1)+(Math.random()-0.5)*0.008;
        p.z+=(p.tz-p.z)*clamp(dt*4,0,1);
      }
      if(stateT>1.6){
        state=rounds>=4?'done':'hold';stateT=0;
        if(state==='done'){activeStep=4;syncSteps();}
      }
    }else if(state==='hold'){
      for(const p of parts){
        if(!p.active)continue;
        p.y+=(p.ty-p.y)*clamp(dt*2,0,1);
      }
      if(stateT>2.0){state='drain';stateT=0;activeStep=3;syncSteps();}
    }else if(state==='drain'){
      const lo=levelFor(rVol/(1+rVol));
      yInt=Math.max(Y0,yInt-dt*0.9);
      if(yInt<=Y0+0.02){
        drainDone();
        rebuildLiquids(Y0);
        state='inject';stateT=0;
      }else rebuildLiquids(yInt);
      /* 有机相粒子跟随液面下沉，到底即被收集 */
      for(const p of parts){
        if(!p.active||p.ph!==0)continue;
        if(p.y>yInt-0.03)p.y=Math.max(Y0+0.03,p.y-dt*1.1);
        if(p.y<=Y0+0.05){p.active=false;collected++;}
      }
    }else if(state==='inject'){
      const tgt=levelFor(rVol/(1+rVol));
      yInt=Math.min(tgt,yInt+dt*0.8);
      rebuildLiquids(yInt);
      if(yInt>=tgt-0.005){
        state='idle';stateT=0;autoT=1.2;
        activeStep=3;syncSteps();
      }
    }else if(state==='done'){
      /* 完成：等待用户 */
    }
    flaskFill.scale.y=clamp(collected/NP,0.01,1);
    flaskFill.position.y=-1.32-0.2+0.2*flaskFill.scale.y;
  }
  /* 粒子矩阵 */
  parts.forEach((p,i)=>{
    if(!p.active){pMesh.setMatrixAt(i,zeroM);return;}
    tmpM.makeTranslation(p.x,p.y,p.z);
    pMesh.setMatrixAt(i,tmpM);
  });
  pMesh.instanceMatrix.needsUpdate=true;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
