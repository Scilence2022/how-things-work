<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>支持向量机与最大间隔 · 只有贴边的点说了算</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e64980;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c2255c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .arow{display:flex;gap:8px;margin-bottom:8px}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(230,73,128,.6);background:rgba(230,73,128,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(194,37,92,.55);background:rgba(194,37,92,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(230,73,128,.10);border-color:rgba(230,73,128,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(194,37,92,.08);border-color:rgba(194,37,92,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc2d9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="支持向量机与最大间隔" data-en="SVM &amp; the Max-Margin Classifier">支持向量机与最大间隔</h1>
  <div class="sub" data-zh="分类不只求分对,还要离两边最远:决策面到最近样本的距离=间隔 → 最大化间隔的边界由贴边的少数点唯一决定——支持向量,删掉其余样本边界纹丝不动 → 软间隔用松弛变量+C 容忍穿插、防过拟合:C 越小间隔越宽、越钝 → 核技巧把线性不可分的数据抬进高维:RBF 核把同心圆环摊开、多项式核弯出曲线边界 → γ 控制弯曲度,过大会孤岛化 · 拖动旋转 / 空格运行/暂停" data-en="Classification wants more than 'separated': the boundary must be farthest from both sides — distance to the nearest samples IS the margin → the max-margin boundary is pinned down by the few points touching it, the support vectors; delete the rest and nothing moves → soft margin slack + C tolerates intrusions to fight overfitting: smaller C, wider and blunter → kernels lift non-separable data into higher dimensions: RBF unrolls concentric rings, polynomial bends the boundary → γ sets the bend; too high fragments into islands · drag to orbit / Space = run/pause">分类不只求分对,还要离两边最远:决策面到最近样本的距离=间隔 → 最大化间隔的边界由贴边的少数点唯一决定——支持向量,删掉其余样本边界纹丝不动 → 软间隔用松弛变量+C 容忍穿插、防过拟合:C 越小间隔越宽、越钝 → 核技巧把线性不可分的数据抬进高维:RBF 核把同心圆环摊开、多项式核弯出曲线边界 → γ 控制弯曲度,过大会孤岛化 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="间隔宽度" data-en="Margin width">间隔宽度</span><span class="v" id="stMar">—</span>

  <div id="actions">

    <button class="abtn" id="bPoly" data-zh="多项式核" data-en="Polynomial">多项式核</button>
    <button class="abtn" id="bRBF" data-zh="RBF 核" data-en="RBF">RBF 核</button>
  </div>
  <div class="arow">
    <button class="abtn on" id="bSep" data-zh="数据:线性可分" data-en="Data: separable">数据:线性可分</button>

    <label data-zh="惩罚 C(软间隔)" data-en="Penalty C">惩罚 C(软间隔)</label>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglHeat" type="checkbox" checked> <span data-zh="置信度场" data-en="Confidence">置信度场</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../overfitting/" data-zh="过拟合与正则化" data-en="Overfitting">过拟合与正则化</a>
    <a href="../k-means/" data-zh="K-均值聚类" data-en="K-Means">K-均值聚类</a>
    <a href="../decision-tree/" data-zh="决策树" data-en="Decision Tree">决策树</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(5.4,5.8,8.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.5;scene.add(ground);

/* ── 数据平台:数据坐标 (x,y)∈[-1,1] → 世界 (3.4x, 0, 3.4y) ── */
const S=3.4;
const colM=new THREE.MeshStandardMaterial({color:0x272d38,roughness:0.8});
const platform=new THREE.Mesh(new THREE.BoxGeometry(7.6,0.16,7.6),colM);
platform.position.y=-0.08;scene.add(platform);
const grid=new THREE.GridHelper(7.6,16,0x54607a,0x3a414d);
grid.position.y=0.005;grid.material.transparent=true;grid.material.opacity=0.25;scene.add(grid);
/* 置信度场:逐顶点染色平面 */
const GN=84,GNP=GN+1;
const heatGeo=new THREE.PlaneGeometry(7.6,7.6,GN,GN);
heatGeo.rotateX(-Math.PI/2);
const heatCol=new Float32Array(GNP*GNP*3);
heatGeo.setAttribute('color',new THREE.BufferAttribute(heatCol,3));
const heatM=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.62,
  depthWrite:false});
const heat=new THREE.Mesh(heatGeo,heatM);heat.position.y=0.012;scene.add(heat);
const clsP=new THREE.Color(0x51cf66),clsN=new THREE.Color(0x74c0fc),dimC=new THREE.Color(0x22262e);
/* 决策边界与间隔带轮廓 */
const bndGeo=new THREE.BufferGeometry();
const bndLine=new THREE.LineSegments(bndGeo,
  new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.95}));
bndLine.position.y=0.028;scene.add(bndLine);
const marGeo=new THREE.BufferGeometry();
const marLine=new THREE.LineSegments(marGeo,
  new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.5}));
marLine.position.y=0.022;scene.add(marLine);
/* 扫描小球:沿决策边界巡游 */
const scan=new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),
  new THREE.MeshBasicMaterial({color:0xffe066}));
scene.add(scan);
/* 法向量箭头(线性核) */
const wArr=new THREE.Group();
{
  const m=new THREE.MeshBasicMaterial({color:0xff8787});
  const c=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1,8),m);
  c.rotation.x=Math.PI/2;c.position.z=0.5;wArr.add(c);
  const t=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,10),m);
  t.rotation.x=Math.PI/2;t.position.z=1.0;wArr.add(t);
}
wArr.position.y=0.10;scene.add(wArr);

/* ── 数据与 LSSVM(最小二乘 SVM):(K+diag(1/C),1;1ᵀ,0)[α;b]=[y;0] ── */
let kernel='linear',dataset='sep',Cv=20,g=0.4,playing=true,labelsOn=true,slowMo=false,heatOn=true,dimNonSV=false;
let pts=[],alpha=[],b0=0,marginW=0,svCount=0,accP=0,wN=null,dirty=true,retrainT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const K=(a,b)=>kernel==='linear'?a.x*b.x+a.y*b.y
  :kernel==='poly'?Math.pow(1+g*(a.x*b.x+a.y*b.y),3)
  :Math.exp(-g*((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)));
function gauss(A,m){                 /* 高斯消元解 m×m */
  for(let c=0;c<m;c++){
    let p=c;
    for(let r=c+1;r<m;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    if(Math.abs(A[p][c])<1e-12)return false;
    const t=A[c];A[c]=A[p];A[p]=t;
    for(let r=0;r<m;r++){
      if(r===c)continue;
      const f=A[r][c]/A[c][c];
      if(f===0)continue;
      for(let k=c;k<=m;k++)A[r][k]-=f*A[c][k];
    }
  }
  return true;
}
function makeData(){
  pts=[];
  if(dataset==='sep'){
    for(let i=0;i<20;i++)pts.push({x:-0.30+(Math.random()-0.5)*0.42,y:-0.22+(Math.random()-0.5)*0.42,v:1});
    for(let i=0;i<20;i++)pts.push({x:0.30+(Math.random()-0.5)*0.42,y:0.24+(Math.random()-0.5)*0.42,v:-1});
  }else{
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=0.16+Math.random()*0.1;
      pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r,v:1});}
    for(let i=0;i<32;i++){const a=i/32*Math.PI*2,r=0.62+Math.random()*0.16;
      pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r,v:-1});}
  }
}
function trainSVM(){
  const n=pts.length,m=n+1;
  /* KKT 线性系统:[[0,1ᵀ],[1,K+diag(1/C)]]·[b;α]=[0;y],高斯-约当消元 */
  const A=[];
  const r0=new Array(m+1).fill(0);
  for(let j=0;j<n;j++)r0[j+1]=1;
  A.push(r0);
  for(let i=0;i<n;i++){
    const r=new Array(m+1).fill(0);
    r[0]=1;
    for(let j=0;j<n;j++)r[j+1]=K(pts[i],pts[j])+(i===j?1/Math.max(0.05,Cv):0);
    r[m]=pts[i].v;
    A.push(r);
  }
  if(!gauss(A,m)){alpha=new Array(n).fill(0);b0=0;}
  else{
    b0=A[0][m]/A[0][0];
    alpha=[];for(let i=0;i<n;i++)alpha.push(A[i+1][m]/A[i+1][i+1]);
  }
  /* 支持向量:|α| 显著 */
  const mx=Math.max(1e-9,...alpha.map(Math.abs));
  svCount=0;
  pts.forEach((p,i)=>{p.sv=Math.abs(alpha[i])>0.30*mx;if(p.sv)svCount++;});
  /* 训练精度 */
  let ok=0;pts.forEach(p=>{if(Math.sign(fData(p.x,p.y))===p.v)ok++;});
  accP=100*ok/n;
  /* 法向(线性核)与间隔 */
  if(kernel==='linear'){
    let wx=0,wy=0;
    pts.forEach((p,i)=>{wx+=alpha[i]*p.v*p.x;wy+=alpha[i]*p.v*p.y;});
    const nw=Math.hypot(wx,wy);
    wN=nw>1e-8?{x:wx/nw,y:wy/nw,mag:nw}:null;
    marginW=nw>1e-8?2/nw:0;
  }else{
    wN=null;
    marginW=0;
  }
}
function fData(x,y){let s=b0;
  for(let i=0;i<pts.length;i++)s+=alpha[i]*K({x,y},pts[i]);
  return s;}
/* 数值间隔:从若干边界点沿梯度走到 |f|=1 的平均距离 */
function numMargin(){
  const segs=march(0);
  if(!segs.length)return 0;
  const hh=0.02;let tot=0,cnt=0;
  for(let s=0;s<segs.length&&cnt<26;s+=Math.max(1,Math.floor(segs.length/26))){
    const px=(segs[s][0]+segs[s][2])/2,py=(segs[s][1]+segs[s][3])/2;
    const f0=fData(px,py);
    const gx=(fData(px+hh,py)-f0)/hh,gy=(fData(px,py+hh)-f0)/hh;
    const gl=Math.hypot(gx,gy);
    if(gl<1e-6)continue;
    const ux=gx/gl,uy=gy/gl;
    let lo=0,hi=2.5;
    for(let it=0;it<18;it++){
      const mid=(lo+hi)/2;
      if(Math.abs(fData(px+ux*mid,py+uy*mid))<1)lo=mid;else hi=mid;
    }
    tot+=(lo+hi)/2;cnt++;
  }
  return cnt?2*tot/cnt:0;
}
/* marching squares:返回 [x1,y1,x2,y2] 段列表(数据坐标),基于目标场 */
function march(level){
  const segs=[];
  const f=(i,j)=>target[j*GNP+i];
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){
    const x0=-1.118+2.236*i/GN,x1=-1.118+2.236*(i+1)/GN;
    const y0=-1.118+2.236*j/GN,y1=-1.118+2.236*(j+1)/GN;
    const a=f(i,j),b=f(i+1,j),c=f(i+1,j+1),d=f(i,j+1);
    const ptsE=[];
    const edge=(va,vb,xa,ya,xb,yb)=>{
      if((va<level)!==(vb<level)){
        const t=(level-va)/(vb-va);
        ptsE.push([xa+(xb-xa)*t,ya+(yb-ya)*t]);
      }
    };
    edge(a,b,x0,y0,x1,y0);edge(b,c,x1,y0,x1,y1);
    edge(c,d,x1,y1,x0,y1);edge(d,a,x0,y1,x0,y0);
    if(ptsE.length>=2){
      segs.push([ptsE[0][0],ptsE[0][1],ptsE[1][0],ptsE[1][1]]);
      if(ptsE.length===4)segs.push([ptsE[2][0],ptsE[2][1],ptsE[3][0],ptsE[3][1]]);
    }
  }
  return segs;
}
const W2X=x=>S*x,W2Z=y=>S*y;
function rebuildContours(){
  const toArr=(segs)=>{
    const arr=new Float32Array(segs.length*6);
    segs.forEach((s,i)=>{
      arr[i*6]=W2X(s[0]);arr[i*6+1]=0;arr[i*6+2]=W2Z(s[1]);
      arr[i*6+3]=W2X(s[2]);arr[i*6+4]=0;arr[i*6+5]=W2Z(s[3]);
    });
    return arr;
  };
  const sb=march(0),sm=[...march(1),...march(-1)];
  bndGeo.setAttribute('position',new THREE.BufferAttribute(toArr(sb),3));
  marGeo.setAttribute('position',new THREE.BufferAttribute(toArr(sm),3));
  scanSegs=sb;
  scanU=0;
}
let scanSegs=[],scanU=0;
/* 目标场与显示场(缓动) */
const target=new Float32Array(GNP*GNP),disp=new Float32Array(GNP*GNP);
function computeTarget(){
  for(let j=0;j<GNP;j++){
    const y=-1.118+2.236*j/GN;
    for(let i=0;i<GNP;i++){
      const x=-1.118+2.236*i/GN;
      target[j*GNP+i]=fData(x,y);
    }
  }
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){

}
const lblBnd=addLabel(()=>L('决策边界 f(x)=0','decision boundary f(x)=0'),
  new THREE.Vector3(0.4,0.5,1.9),'g');
const lblMar=addLabel(()=>L(`间隔带 |f|≤1 · 宽 ${marginW.toFixed(2)}`,`margin band |f|≤1 · width ${marginW.toFixed(2)}`),

const lblSV=addLabel(()=>L(`支持向量 ×${svCount}:删掉其余点,边界不动`,

const lblK=addLabel(()=>kernel==='linear'
    ?L('线性核:边界是直线,w 决定一切','linear kernel: straight boundary, w rules')
    :kernel==='poly'
    ?L(`多项式核 (1+γ⟨x,x′⟩)³ → 弯曲边界`,`polynomial (1+γ⟨x,x′⟩)³ → curved boundary`)
    :L('RBF 核:把圆环摊到高维 → 线性可分','RBF kernel: unrolls the rings into a higher dimension'),
  new THREE.Vector3(0,0.7,-2.9),'b');
const lblDS=addLabel(()=>dataset==='sep'
    ?L('数据集:两团可分高斯','dataset: two separable clusters')

/* 数据点与支持向量描边 */
const sphGeo=new THREE.SphereGeometry(0.085,14,12);
const ringGeo=new THREE.TorusGeometry(0.17,0.022,8,26);
const pointM=new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.4});
const pointN=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4});
const ringM=new THREE.MeshBasicMaterial({color:0xff6b81});
const meshes=[],rings=[];
function buildPoints(){
  meshes.forEach(m=>scene.remove(m));rings.forEach(r=>scene.remove(r));
  meshes.length=0;rings.length=0;
  pts.forEach(p=>{
    const mat=(p.v>0?pointM:pointN).clone();
    const m=new THREE.Mesh(sphGeo,mat);
    m.position.set(W2X(p.x),0.12,W2Z(p.y));scene.add(m);meshes.push(m);
    const r=new THREE.Mesh(ringGeo,ringM);
    r.rotation.x=Math.PI/2;r.position.set(W2X(p.x),0.12,W2Z(p.y));r.visible=false;
    scene.add(r);rings.push(r);
  });
}
function syncPoints(){
  pts.forEach((p,i)=>{
    const m=meshes[i],r=rings[i];
    r.visible=p.sv;
    const fade=dimNonSV&&!p.sv;
    m.material.transparent=true;
    m.material.opacity=fade?0.18:1;
  });
}

function setC(vv){Cv=Math.pow(10,clamp(vv,-1,2));
  document.getElementById('sC').value=vv;
  document.getElementById('sCVal').textContent='C='+(Cv>=10?Cv.toFixed(0):Cv.toFixed(1));}
function setG(vv){g=Math.pow(10,clamp(vv,-1,1));
  document.getElementById('sG').value=vv;
  document.getElementById('sGVal').textContent='γ='+g.toFixed(2);}
function setKernel(k){kernel=k;dirty=true;
  document.getElementById('bLin').classList.toggle('on',k==='linear');
  document.getElementById('bPoly').classList.toggle('on',k==='poly');
  document.getElementById('bRBF').classList.toggle('on',k==='rbf');
  wArr.visible=(k==='linear');}
function setDataset(ds){dataset=ds;dimNonSV=false;
  makeData();buildPoints();dirty=true;
  document.getElementById('bSep').classList.toggle('on',ds==='sep');
  document.getElementById('bRing').classList.toggle('on',ds==='rings');}
function retrainNow(){
  trainSVM();computeTarget();
  if(kernel!=='linear')marginW=numMargin();
  rebuildContours();syncPoints();
  document.getElementById('stMar').innerHTML=marginW.toFixed(2);
  const sv=document.getElementById('stSV');
  sv.innerHTML=svCount+'<small> / '+pts.length+'</small>';
  sv.className='v '+(svCount>pts.length*0.6?'warn':'');
  const ac=document.getElementById('stAcc');
  ac.innerHTML=accP.toFixed(0)+'<small> %</small>';
  ac.className='v '+(accP>99?'ok':accP<90?'warn':'');
  document.getElementById('stW').textContent=wN?`(${wN.x.toFixed(2)}, ${wN.y.toFixed(2)})`:'—';
}

const STEPS=[
 {b:'先求「分对」:可行解无穷多',be:'First, just separate: infinitely many lines',
  d:'两团数据之间任意一条直线都能 100% 分对训练样本——但随手一画的边界离样本太近,新数据稍微一抖就分错。分对只是及格线。',
  de:'Any line between the two clusters classifies the training set perfectly — but a casually drawn boundary hugs the data, and the slightest jitter in new inputs flips a label. Separating is only the passing grade.',
  act(){setDataset('sep');setKernel('linear');setC(1.3);}},
 {b:'最大间隔:离两边都最远',be:'Max margin: farthest from both sides',
  d:'在所有能分对的边界里,挑「到最近正样本与最近负样本距离之和」最大的那条:间隔=2/‖w‖。间隔越宽,对新数据的容错越大——这是 SVM 的全部灵魂。',
  de:'Among all separating boundaries pick the one maximizing the sum of distances to the nearest positive and nearest negative sample: margin = 2/‖w‖. Wider margins forgive more noise — the entire soul of SVM.',
  act(){setDataset('sep');setKernel('linear');setC(2);}},
 {b:'支持向量:贴边的点说了算',be:'Support vectors: the edge points rule',
  d:'最优边界只由恰好落在间隔边上的少数点决定——支持向量。其余样本删掉多少条边界都不动:决策函数 f(x)=Σαᵢyᵢ⟨xᵢ,x⟩+b 里大部分 αᵢ≈0。本页把它们描红圈,并调暗其余点验证。',
  de:'The optimal boundary is pinned by the few points exactly on the margin edges — the support vectors. Delete any of the others and nothing moves: in f(x)=Σαᵢyᵢ⟨xᵢ,x⟩+b most αᵢ≈0. Here they get red rings and the rest fade to prove it.',
  act(){dimNonSV=true;syncPoints();setC(2);}},
 {b:'软间隔:C 换取钝感',be:'Soft margin: C buys blindness',
  d:'现实数据总有穿插:松弛变量 ξ 允许个别点越线,惩罚 C 决定忍多忍大。C 调小→间隔变宽、边界变钝、偶尔分错训练点;C 调大→死磕每个点、边界扭曲。C 是「正确率 vs 泛化」的旋钮。',
  de:'Real data always overlaps: slack ξ lets a few points cross, and penalty C sets the tolerance. Small C → wider, blunter margin, some training errors forgiven; large C → fights for every point, boundary contorts. C is the accuracy-vs-generalization knob.',
  act(){dimNonSV=false;syncPoints();setDataset('sep');setKernel('linear');setC(-0.3);}},
 {b:'线性不可分:同心圆环',be:'Not linearly separable: rings',
  d:'换成同心圆环:任何直线都会同时切进两类——一维直线怎么画都分不开。这不是数据没救,而是「直线」这个假设太穷。',
  de:'Switch to concentric rings: every straight line cuts through both classes — no line can work. The data is not hopeless; the hypothesis "straight line" is simply too poor.',
  act(){dimNonSV=false;syncPoints();setDataset('rings');setKernel('linear');setC(1.3);}},
 {b:'核技巧:抬进高维再切',be:'The kernel trick: lift, then slice',
  d:'核函数 K(x,x′) 等价于把数据映射到高维空间后做内积——RBF 核把「离圆心近/远」摊成一个新维度,圆环在那里被压成左右两团,一刀切开。切回原空间,边界就是圆环。γ 是抬升的「聚焦」宽度。',
  de:'K(x,x′) is equivalent to mapping data into a higher dimension and taking inner products there — RBF spreads "near vs far from center" into a new axis where the rings collapse into two separable blobs; mapped back, the cut is the ring. γ sets the focus width.',
  act(){setKernel('rbf');setG(-0.4);setC(1.3);}},
 {b:'γ 过大:孤岛化过拟合',be:'γ too high: island overfitting',
  d:'γ 拉满,RBF 核视野收窄到每颗样本自己:决策面碎成一个个孤岛,把每个点都圈成领地——训练精度 100%,泛化能力崩盘。把 γ 往回调,让边界重新连成平滑的一圈。',
  de:'Crank γ up and the RBF view shrinks to each point alone: the boundary shatters into islands enclosing every sample — 100% training accuracy, ruined generalization. Pull γ back and the boundary rejoins into one smooth loop.',

];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');

    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });

}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  /* 重训(节流) */
  if(dirty){retrainT-=dt;
    if(retrainT<=0){dirty=false;retrainT=0.09;retrainNow();}}
  /* 场缓动 + 染色 */
  const kk=1-Math.exp(-4.5*dt);
  let fmax=0;
  for(let k=0;k<GNP*GNP;k++){
    disp[k]+=(target[k]-disp[k])*kk;
    const f=disp[k],af=Math.abs(f);
    if(af>fmax)fmax=af;
    const c=af/(af+1.4);
    colTmp.copy(af>1e-4?(f>0?clsP:clsN):dimC);
    colTmp.lerp(dimC,1-c*0.85);
    heatCol[k*3]=colTmp.r;heatCol[k*3+1]=colTmp.g;heatCol[k*3+2]=colTmp.b;
  }
  heatGeo.attributes.color.needsUpdate=true;
  /* 扫描球沿边界巡游 */
  if(scanSegs.length){
    let total=0;const lens=[];
    for(const s of scanSegs){const l=Math.hypot(W2X(s[2])-W2X(s[0]),W2Z(s[3])-W2Z(s[1]));lens.push(l);total+=l;}
    scanU=(scanU+dts*0.10)%1;
    let want=scanU*total,i=0;
    while(i<lens.length&&want>lens[i]){want-=lens[i];i++;}
    if(i<lens.length){
      const s=scanSegs[i],t=lens[i]>1e-6?want/lens[i]:0;
      scan.position.set(W2X(s[0])+(W2X(s[2])-W2X(s[0]))*t,0.14,W2Z(s[1])+(W2Z(s[3])-W2Z(s[1]))*t);
      scan.visible=true;
    }
  }else scan.visible=false;
  /* 法向箭头 */
  if(wN&&wArr.visible){
    const len=clamp(marginW,0.4,3)*0.8;
    wArr.scale.set(1,1,len);
    wArr.rotation.z=0;
    wArr.rotation.y=Math.atan2(wN.x,wN.y);
    wArr.position.set(0,0.10,0);
  }
  /* 支持向量脉动 */
  const pulse=1+0.08*Math.sin(performance.now()*0.004);
  rings.forEach(r=>{if(r.visible)r.scale.setScalar(pulse);});
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on;
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setC(1.3);setG(-0.4);setDataset('sep');setKernel('linear');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
retrainNow();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
