<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转录 · RNA 聚合酶与解链泡动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#8b5cf6;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#6d3fd6;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.r { color: #ff9f43; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.t  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  .chip.c  { color: #7fd0f7; border-color: rgba(127,208,247,.6); }
  .chip.r  { color: #ffc188; border-color: rgba(255,159,67,.6); }
  :root[data-theme="light"] .chip.t  { color: #148a5c; border-color: rgba(20,138,92,.55); }
  :root[data-theme="light"] .chip.c  { color: #0c7ba6; border-color: rgba(12,123,166,.55); }
  :root[data-theme="light"] .chip.r  { color: #b26214; border-color: rgba(178,98,20,.55); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(139,92,246,.12); border-color: rgba(139,92,246,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(109,63,214,.10); border-color: rgba(109,63,214,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #d6c7ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="转录：RNA 聚合酶怎么读 DNA——解链泡与延伸" data-en="Transcription: how RNA polymerase reads DNA — the bubble & elongation">转录：RNA 聚合酶怎么读 DNA——解链泡与延伸</h1>
  <div class="sub" data-zh="σ 认启动子 → 解链泡张开 → 碱基逐个配对(A=U/G≡C) → 终止发夹收工——不需要引物 · 空格播放/暂停" data-en="σ finds the promoter → bubble opens → bases pair one by one (A=U/G≡C) → hairpin stops the show — no primer needed · Space = play/pause">σ 认启动子 → 解链泡张开 → 碱基逐个配对(A=U/G≡C) → 终止发夹收工——不需要引物 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已转录" data-en="Transcribed">已转录</span><span class="v r" id="stN">0<small>/16 nt</small></span>
  <span class="k" data-zh="当前配对" data-en="Current pair">当前配对</span><span class="v" id="stP">—<small> 模板→RNA</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip t" data-zh="模板链(3′→5′ 被读)" data-en="Template (read 3′→5′)">模板链(3′→5′ 被读)</span>
    <span class="chip c" data-zh="编码链" data-en="Coding strand">编码链</span>
    <span class="chip r" data-zh="RNA 产物(含 U)" data-en="RNA product (has U)">RNA 产物(含 U)</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCodT" type="checkbox" checked> <span data-zh="模板链字母" data-en="Template letters">模板链字母</span></label>
    <label><input id="tglCodC" type="checkbox" checked> <span data-zh="编码链字母" data-en="Coding letters">编码链字母</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('转录 · RNA 聚合酶与解链泡动画', 'Transcription · RNA Polymerase & the Bubble');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 序列与时序 ================= */
const CYCLE = 18;
const TPL = 'TACGGGCCATATCGCG';        // 模板链被转录段(3′→5′,左→右)
const RNA_COMP = b => ({ A: 'U', T: 'A', G: 'C', C: 'G' }[b]);
const RNA_SEQ = [...TPL].map(RNA_COMP).join('');   // AUGCCCGGUAUAGCGC
const N = TPL.length;                    // 16 nt
const ADD_T = i => 0.26 + i * 0.03;      // 第 i 个碱基的加入时刻
const SPD = 26 / 0.03;                   // DNA 滑动速度(虚拟像素/单位 t)
const READ_X = 800;                      // 读码点(RNAP 中心)
const STRAND_T_Y = 500, STRAND_C_Y = 440;
const COL_T = '#43d17c', COL_C = '#7fd0f7', COL_R = '#ff9f43', COL_RNAP = '#cbaee8';
const COL_SIG = '#ffd166', COL_AT = '#4dd0e1';
const BASE_COL = { A: '#7ee2a0', T: '#ff8a80', G: '#ffd166', C: '#7fd0f7', U: '#ff9f43' };
let showLabels = true, showTpl = true, showCod = true;
let t01 = 0;

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.14, n: 1, b: 'σ 因子认启动子', d: 'RNA 聚合酶全酶沿着 DNA 扫描,σ 因子认出 −35 / −10 两个启动子框——全酶锁定在起点。',
    be: 'σ finds the promoter', de: 'The RNA polymerase holoenzyme scans the DNA; σ recognizes the −35 / −10 promoter boxes — the holoenzyme locks onto the start.' },
  { t0: 0.14, t1: 0.26, n: 2, b: '解链泡张开', d: '聚合酶把约 14 bp 的双链撬开成「解链泡」,模板链裸露进 active site——转录不需要引物,直接开写。',
    be: 'The bubble opens', de: 'The enzyme pries ~14 bp of duplex open into a transcription bubble, exposing the template strand. No primer needed — transcription starts writing directly.' },
  { t0: 0.26, t1: 0.74, n: 3, b: '延伸:逐个配对', d: 'DNA 左行,读码点逐个吃进模板碱基:配对的 NTP(A=U / G≡C)被收进 3′ 端,RNA 链从泡里挤出去,越拉越长。',
    be: 'Elongation: pair by pair', de: 'The DNA slides left through the reading point; the matching NTP (A=U / G≡C) is added to the 3′ end and the RNA chain squeezes out of the bubble, growing longer.' },
  { t0: 0.74, t1: 0.86, n: 4, b: '终止发夹', d: 'RNA 末端折出 GCGC 发夹,把整条链从泡里「拽」出来;泡重新合拢,聚合酶脱落。σ 早在延伸开始时就已脱落。',
    be: 'Terminator hairpin', de: 'The RNA end folds a GCGC hairpin that yanks the transcript out of the bubble; the bubble re-zips and the polymerase falls off. (σ left long ago, at elongation.)' },
  { t0: 0.86, t1: 1.00, n: 5, b: '产物与对照', d: 'mRNA 出厂,以 AUG 开头。与复制对照:不需要引物;只读一条模板链;产物是 RNA(U 换 T);碱基错配率更高也无所谓。',
    be: 'Product & contrast', de: 'The mRNA ships out starting with AUG. vs replication: no primer; only one strand is read; the product is RNA (U instead of T); higher error rate is tolerated.' },
];
function stepIndex(t) {
  if (t < 0.14) return 0;
  if (t < 0.26) return 1;
  if (t < 0.74) return 2;
  if (t < 0.86) return 3;
  return 4;
}

/* ================= 绘制 ================= */
function drawBg() {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
}
function drawDna(t) {
  const slide = -Math.min(t, 0.86) * SPD;      // DNA 左移(0.86 后冻结)
  const cY = STRAND_C_Y, tY = STRAND_T_Y;
  // 骨架
  line(60, cY, W - 60, cY, 'rgba(127,208,247,.5)', 3);
  line(60, tY, W - 60, tY, 'rgba(67,209,124,.5)', 3);
  // 启动子框(−35 / −10,位于基因左侧)
  const promX1 = READ_X + (-6 * 26) + slide, promX2 = READ_X + (-1 * 26) + slide;
  rrect(promX1 - 60, cY - 34, 96, 22, 6, 'rgba(255,209,102,.14)', 'rgba(255,209,102,.7)', 1.2);
  rrect(promX2 - 60, cY - 34, 62, 22, 6, 'rgba(255,209,102,.14)', 'rgba(255,209,102,.7)', 1.2);
  if (showLabels && t < 0.3) {
    text('−35', promX1 - 12, cY - 19, 11, COL_SIG, 'center', 700);
    text('−10', promX2 - 30, cY - 19, 11, COL_SIG, 'center', 700);
    text(L('启动子', 'promoter'), promX1 - 20, cY - 44, 11.5, COL_SIG, 'center');
  }
  // 两条链上的字母(骨架全长铺满,配对刻度)
  // 碱基字母:被转录段显示真实序列,前后只画配对刻度
  for (let i = -6; i < N + 8; i++) {
    const x = READ_X + i * 26 + slide;
    if (x < 70 || x > W - 70) continue;
    const inGene = i >= 0 && i < N;
    if (inGene && showCod) {
      const cb = RNA_COMP(TPL[i]) === 'U' ? 'A' : RNA_COMP(TPL[i]) === 'A' ? 'T' : RNA_COMP(TPL[i]) === 'G' ? 'C' : 'G';
      text(cb, x, cY - 10, 15, BASE_COL[cb], 'center', 700);
    } else if (showCod) {
      line(x, cY - 8, x, cY + 8, 'rgba(127,208,247,.25)', 2);
    }
    if (inGene && showTpl) {
      text(TPL[i], x, tY + 22, 15, BASE_COL[TPL[i]], 'center', 700);
    } else if (showTpl) {
      line(x, tY - 8, x, tY + 8, 'rgba(67,209,124,.25)', 2);
    }
  }
  if (showLabels) {
    text(L('编码链 5′→3′(与 RNA 同序,把 U 换成 T)', 'Coding 5′→3′ (same as RNA, T for U)'), 90, cY - 52, 12, PAL.dim2);
    text(L('模板链 3′→5′(被读)', 'Template 3′→5′ (being read)'), 90, tY + 44, 12, PAL.dim2);
  }
}
function drawRnap(t) {
  const lift = ss(0.80, 0.88, t);            // 终止后聚合酶脱落
  const x = 800, y = 465 - lift * 60;
  ctx.globalAlpha = 1 - lift * 0.75;
  rrect(x - 115, y - 115, 230, 230, 40, COL_RNAP + '20', COL_RNAP, 2.2);
  // 解链泡(张开窗口内画)
  const openK = ss(0.14, 0.24, t) * (1 - ss(0.74, 0.82, t));
  if (openK > 0.02) {
    ctx.globalAlpha *= openK;
    // 泡内两条分开的单链
    line(x - 55, STRAND_C_Y - openK * 16, x + 55, STRAND_C_Y - openK * 10, 'rgba(127,208,247,.6)', 2.5);
    line(x - 55, STRAND_T_Y + openK * 16, x + 55, STRAND_T_Y + openK * 10, 'rgba(67,209,124,.6)', 2.5);
    text(L('解链泡 ~14 bp', 'bubble ~14 bp'), x + 70, STRAND_C_Y - 22, 11.5, PAL.dim2);
    ctx.globalAlpha = 1 - lift * 0.75;
  }
  // σ 因子(启动后脱落)
  if (t < 0.26) {
    circle(x - 105, y + 60, 30, COL_SIG + '2e', COL_SIG, 2);
    text('σ', x - 105, y + 68, 22, COL_SIG, 'center', 700);
    if (showLabels) text(L('σ 因子', 'σ factor'), x - 105, y + 112, 12, COL_SIG, 'center');
  } else if (t < 0.34) {
    const k = ss(0.26, 0.34, t);
    ctx.globalAlpha *= (1 - k);
    circle(x - 105 - 60 * k, y + 60 + 60 * k, 30, COL_SIG + '2e', COL_SIG, 2);
    text('σ', x - 105 - 60 * k, y + 68 + 60 * k, 22, COL_SIG, 'center', 700);
    ctx.globalAlpha = 1 - lift * 0.75;
    if (showLabels && k > 0.3 && k < 0.9) text(L('σ 完成使命,脱落', 'σ detaches'), x - 130, y + 150, 12, COL_SIG, 'center');
  }
  if (showLabels) text(L('RNA 聚合酶', 'RNA polymerase'), x, y + 148, 13, COL_RNAP, 'center', 700);
  ctx.globalAlpha = 1;
}
function drawRna(t) {
  const count = [...Array(N)].map((_, i) => ADD_T(i)).filter(f => t >= f).length;
  if (count === 0) return;
  const xR = 800 - 90;                        // RNA 右端(露在 RNAP 左上)
  const yR = 360;
  const wobble = 4 * Math.sin(t * Math.PI * 2 * 2);
  // 已合成的链(从右往左排列,5′ 在最左)
  ctx.strokeStyle = COL_R; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let j = 0; j < count; j++) {
    const x = xR - (count - 1 - j) * 26, y = yR + (j % 2 ? 10 : -10) * 0.5 + (j === 0 ? 18 : 0);
    j ? ctx.lineTo(x, y + wobble * (j / count)) : ctx.moveTo(x, y + wobble);
  }
  ctx.stroke();
  for (let j = 0; j < count; j++) {
    const x = xR - (count - 1 - j) * 26, y = yR + (j % 2 ? 10 : -10) * 0.5 + (j === 0 ? 18 : 0);
    text(RNA_SEQ[j], x, y - 12, 15, BASE_COL[RNA_SEQ[j]], 'center', 700);
  }
  // 加入瞬间:高亮新碱基 + NTP 飞入
  const lastIdx = count - 1;
  const tf = ADD_T(lastIdx);
  const k = ss(tf, tf + 0.02, t);
  if (k < 1) {
    const lx = xR, ly = yR;
    circle(lx, ly, 16 + 14 * k, null, COL_R, 2);
    const nx = lerp(760, lx, k), ny = lerp(700, ly, k);
    dot(nx, ny, 8, BASE_COL[RNA_SEQ[lastIdx]], 10);
    text(RNA_SEQ[lastIdx] + 'TP', nx, ny - 16, 11.5, BASE_COL[RNA_SEQ[lastIdx]], 'center', 700);
  }
  // 终止发夹(延伸末段折出)
  if (t >= 0.74) {
    const fk = ss(0.74, 0.82, t);
    const hx = xR - (count - 1 - 13) * 26, hy = yR - 10;
    ctx.globalAlpha = fk;
    circle(hx - 24, hy - 34, 20 * fk, null, COL_R, 2.5);
    line(hx - 14, hy - 20, hx - 6, hy - 4, COL_R, 2.5);
    line(hx - 34, hy - 20, hx - 42, hy - 4, COL_R, 2.5);
    text(L('GCGC 终止发夹', 'GCGC hairpin'), hx - 24, hy - 64, 11.5, COL_R, 'center', 700);
    ctx.globalAlpha = 1;
    // 拽出
    if (t >= 0.80) {
      const yank = ss(0.80, 0.86, t) * 70;
      text(L('发夹把 RNA 拽出,泡合拢', 'hairpin yanks RNA out, bubble zips shut'), xR - 120, yR + 66, 12, COL_R, 'center', 700);
      void yank;
    }
  }
  // NTP 库
  const ntps = [['ATP', '#7ee2a0'], ['UTP', '#ff9f43'], ['GTP', '#ffd166'], ['CTP', '#7fd0f7']];
  ntps.forEach(([s, c], i) => {
    const nx = 640 + i * 110;
    rrect(nx - 34, 690, 68, 30, 15, c + '20', c + 'aa', 1.2);
    text(s, nx, 710, 12.5, c, 'center', 700);
  });
  if (showLabels) text(L('NTP 库(没有 TTP,只有 UTP)', 'NTP pool (UTP, no TTP)'), 800, 746, 11.5, PAL.dim2, 'center');
}
function drawPairFlash(t) {
  const done = [...Array(N)].map((_, i) => ADD_T(i)).filter(f => t >= f).length;
  const idx = done - 1;
  if (idx < 0 || idx >= N) return;
  const tf = ADD_T(idx);
  const k = ss(tf, tf + 0.025, t);
  if (k >= 1) return;
  const x = READ_X + idx * 26 - Math.min(t, 0.86) * SPD;
  ctx.globalAlpha = 1 - k;
  circle(x, STRAND_T_Y + 6, 12 + 8 * k, null, '#ffd166', 2);
  ctx.globalAlpha = 1;
}
function drawProduct(t) {
  if (t < 0.86) return;
  const k = ss(0.86, 0.95, t);
  const x = lerp(560, 700, k), y = lerp(360, 250, k);
  ctx.globalAlpha = k;
  rrect(x - 70, y - 24, 140, 48, 24, COL_R + '2b', COL_R, 2);
  text('mRNA', x, y + 6, 16, COL_R, 'center', 700);
  text(L('以 AUG 开头 → 送去翻译', 'starts with AUG → off to translation'), x, y + 52, 12, PAL.dim2, 'center');
  ctx.globalAlpha = 1;
}
function updateStats(t) {
  const n = [...Array(N)].map((_, i) => ADD_T(i)).filter(f => t >= f).length;
  stN.innerHTML = n + '<small>/16 nt</small>';
  const cur = n > 0 && n < N + 1 ? TPL[Math.min(n, N) - 0] : null;
  const idx = Math.min(n, N - 1);
  stP.innerHTML = (n === 0 ? '—' : TPL[idx] + ' → ' + RNA_SEQ[idx]) + '<small> 模板→RNA</small>';
  void cur;
}

/* ================= 主绘制 ================= */
function draw(t) {
  drawBg();
  drawDna(t);
  drawRnap(t);
  drawPairFlash(t);
  drawRna(t);
  drawProduct(t);
}

/* ================= UI / 主循环 ================= */
let cycles = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : 0; })();
let playing = !qsBool('pause', false);
let speed = (() => { const v = parseFloat(qs.get('speed')); return Number.isFinite(v) ? v : 1; })();

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const stN = document.getElementById('stN'), stP = document.getElementById('stP');
const tglLabels = document.getElementById('tglLabels');
const tglCodT = document.getElementById('tglCodT');
const tglCodC = document.getElementById('tglCodC');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCodT.addEventListener('change', () => { showTpl = tglCodT.checked; });
tglCodC.addEventListener('change', () => { showCod = tglCodC.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);
  updateStats(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
}
requestAnimationFrame(frame);
</script>
