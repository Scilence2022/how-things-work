<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病毒生命周期 · 工厂变装配线</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.r { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.v { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.c { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="病毒生命周期:细胞工厂变装配线" data-en="The Viral Lifecycle: factory turned assembly line">病毒生命周期：细胞工厂变装配线</h1>
  <div class="sub" data-zh="结合受体 → 内吞 → 脱壳 → 劫持核糖体 → 组装 → 出芽/裂解——病毒没有代谢,它只是把细胞的说明书换掉 · 空格播放/暂停" data-en="Bind receptor → endocytose → uncoat → hijack ribosomes → assemble → bud/lyse — a virus has no metabolism; it just swaps the cell's manual · Space = play/pause">结合受体 → 内吞 → 脱壳 → 劫持核糖体 → 组装 → 出芽/裂解——病毒没有代谢，它只是把细胞的说明书换掉 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="阶段" data-en="phase">阶段</span><span class="v" id="stPh" style="font-size:14px">—</span>
  <span class="k" data-zh="核糖体产出" data-en="ribosome output">核糖体产出</span><span class="v" id="stRibo" style="font-size:14px">细胞蛋白</span>
  <span class="k" data-zh="新病毒组装" data-en="virions assembled">新病毒组装</span><span class="v g" id="stNew">0</span>
  <span class="k" data-zh="细胞状态" data-en="cell state">细胞状态</span><span class="v" id="stCell" style="font-size:14px">健康</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.v" data-zh="病毒(刺突球)" data-en="virion (spiked ball)">病毒(刺突球)</span>
    <span class="chip.c" data-zh="细胞器(核/核糖体)" data-en="organelles (nucleus, ribosomes)">细胞器(核/核糖体)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnInfect" data-zh="放一个病毒进来" data-en="release a virion">放一个病毒进来</button>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../translation-ribosome/" data-zh="被劫持的机器:翻译" data-en="the hijacked machine: translation">被劫持的机器:翻译</a>
    <a href="../immune-response/" data-zh="反制:免疫应答" data-en="the counterattack: immunity">反制:免疫应答</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('病毒生命周期', 'The Viral Lifecycle');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 1.8, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  cell: new THREE.MeshPhysicalMaterial({ color: 0x63e6be, transparent: true, opacity: 0.14,
    roughness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  nucleus: mat(0x74c0fc, { opacity: 0.35 }),
  ribo: mat(0xffd166, { emissiveIntensity: 0.3 }),
  virus: mat(0xff6b6b, { emissiveIntensity: 0.3 }),
  spike: mat(0xff8787, { emissiveIntensity: 0.35 }),
  vproteins: mat(0xd0bfff, { emissiveIntensity: 0.3 }),
  vrna: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.8, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.1;
scene.add(base);

/* ================= 细胞 ================= */
const cell = new THREE.Mesh(new THREE.SphereGeometry(2.3, 36, 28), M.cell);
cell.position.y = 0.8;
scene.add(cell);
/* 细胞膜受击变红 */
const cellMat = cell.material;
/* 细胞核 */
const nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), M.nucleus);
nucleus.position.set(-0.5, 1.1, 0);
scene.add(nucleus);
/* 核糖体(散布) */
const ribos = [];
for (let i = 0; i < 14; i++) {
  const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1);
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), M.ribo);
  m.position.set(Math.sin(b) * Math.cos(a) * 1.7, 0.8 + Math.cos(b) * 1.6, Math.sin(b) * Math.sin(a) * 1.7);
  scene.add(m);
  ribos.push(m);
}
/* 细胞产物(健康蛋白,小蓝点流出) */
const cellProducts = [];
function spawnCellProduct() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.85 }));
  m.position.copy(ribos[Math.floor(Math.random() * ribos.length)].position);
  scene.add(m);
  cellProducts.push({ mesh: m, t: 0 });
}

/* 病毒工厂(刺突球) */
function mkVirion() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.virus);
  g.add(body);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    const s = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.1, 6), M.spike);
    s.position.set(Math.cos(a) * 0.18, Math.sin(a) * 0.18, 0);
    s.rotation.z = -a + Math.PI / 2;
    g.add(s);
  }
  return g;
}
/* 自由病毒(场景外) */
const virions = [];   // {g, state, t}
let assembled = 0;

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let ph = 0;               // 0..1 六阶段
let tSim = 0;
let infecting = false;
let prodSwitch = 0;       // 0=细胞蛋白 1=病毒蛋白
const PH_NAMES = ['结合', '内吞', '脱壳', '劫持', '组装', '出芽/裂解'];

function releaseVirion() {
  const g = mkVirion();
  const a = Math.random() * Math.PI * 2;
  g.position.set(Math.cos(a) * 4.2, 0.8 + (Math.random() - 0.5), Math.sin(a) * 4.2);
  scene.add(g);
  virions.push({ g, state: 'approach', t: 0 });
  infecting = true;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblNucleus = addLabel(() => L('细胞核:细胞自己的说明书(DNA)锁在这里', 'the nucleus: the cell\'s own manual (DNA) locked inside'),
  new THREE.Vector3(-0.5, 1.95, 0), 'e', nucleus);
const lblRibo = addLabel(() => prodSwitch < 0.5
  ? L('核糖体:照细胞 mRNA 生产细胞蛋白', 'ribosomes: making cell proteins from cell mRNA')
  : L('核糖体:被劫持!现在照病毒 mRNA 全力生产病毒零件', 'ribosomes: hijacked! Now mass-producing virus parts from viral mRNA'),
  new THREE.Vector3(1.4, 2.35, 0), prodSwitch < 0.5 ? 'st' : 'g');
const lblCell = addLabel(() => ph < 0.5
  ? L('细胞:还是自己的主人', 'the cell: still its own master')
  : ph < 0.9
    ? L('细胞:工厂已易主——所有资源被改写为装配病毒', 'the cell: ownership transferred — all resources rewritten to assemble virus')
    : L('裂解:细胞破裂,成百新病毒倾巢而出——去感染下一个', 'lysis: the cell bursts; hundreds of new virions pour out — next victim'),
  new THREE.Vector3(0, -0.85, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '结合:钥匙配锁', be: 'Binding: key fits lock',
    d: '病毒刺突蛋白与细胞表面受体特异性结合——COVID 的 Spike 配 ACE2。锁不配,病毒进不去(物种屏障的由来)。',
    de: 'Viral spike binds a specific receptor — COVID\'s Spike fits ACE2. No matching lock, no entry: that is the species barrier.',
    act: () => releaseVirion() },
  { b: '内吞+脱壳', be: 'Endocytosis + uncoating',
    d: '细胞把病毒「吞」进去(以为是货物),酸性的吞噬泡把衣壳溶开——病毒 RNA/RNA 释放。说明书入室。',
    de: 'The cell swallows the virion (thinking it cargo); the acidic vesicle dissolves the capsid and releases the genome. The manual is inside.',
    act: () => releaseVirion() },
  { b: '劫持:换说明书', be: 'Hijack: swap the manual',
    d: '病毒基因进入核/胞浆,抢走核糖体——细胞的翻译机器从「生产细胞蛋白」改行「生产病毒零件」。观察右上角产线翻转。',
    de: 'Viral genes reach the nucleus/cytosol and seize the ribosomes — the translation lines switch from cell proteins to virus parts. Watch the factory banner flip.',
    act: () => releaseVirion() },
  { b: '组装:零件到成品', be: 'Assembly: parts to product',
    d: '病毒蛋白+基因拷贝自动自组装成新病毒——不需要任何工人,几何形状就是装配图。',
    de: 'Viral proteins plus genome copies self-assemble into new virions — no workers needed, the geometry is the blueprint.',
    act: () => releaseVirion() },
  { b: '出芽/裂解', be: 'Budding / lysis',
    d: '有包膜病毒「出芽」借走细胞膜(温和);多数噬菌体直接胀破细胞(裂解)。一个细胞能产出成千上万——指数开始了。',
    de: 'Enveloped viruses bud out borrowing membrane (gentle); most phages burst the cell (lysis). One cell yields thousands — the exponential begins.',
    act: () => releaseVirion() },
];
function stepIndex() {
  return Math.min(5, Math.floor(ph * 6));
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnInfect = document.getElementById('btnInfect');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnInfect.addEventListener('click', releaseVirion);
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 病毒行为 ================= */
const rnats = [];    // 释放的病毒 RNA
const vparts = [];   // 病毒零件
const newVirions = [];
function virionTick(dts) {
  for (let i = virions.length - 1; i >= 0; i--) {
    const v = virions[i];
    v.t += dts;
    if (v.state === 'approach') {
      v.g.position.lerp(new THREE.Vector3(1.2, 0.8, 0), clamp(dts * 1.1, 0, 1));
      v.g.rotation.y += dts * 2;
      if (v.g.position.distanceTo(new THREE.Vector3(1.2, 0.8, 0)) < 0.15) {
        v.state = 'endocytose'; v.t = 0;
        ph = Math.max(ph, 1 / 6);
      }
    } else if (v.state === 'endocytose') {
      v.g.position.lerp(new THREE.Vector3(0.2, 0.8, 0), clamp(dts * 0.8, 0, 1));
      if (v.t > 1.8) { v.state = 'uncoat'; v.t = 0; ph = Math.max(ph, 2 / 6); }
    } else if (v.state === 'uncoat') {
      v.g.scale.multiplyScalar(1 - dts * 1.4);
      if (v.g.scale.x < 0.15) {
        scene.remove(v.g);
        virions.splice(i, 1);
        /* RNA 释放,飞向核 */
        for (let k = 0; k < 5; k++) {
          const r = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), M.vrna);
          r.position.set(0.25, 0.8, 0);
          scene.add(r);
          rnats.push({ mesh: r, t: 0 });
        }
        ph = Math.max(ph, 3 / 6);
      }
    }
  }
  /* RNA 飞核 → 劫持 */
  for (let i = rnats.length - 1; i >= 0; i--) {
    const r = rnats[i];
    r.t += dts;
    r.mesh.position.lerp(nucleus.position, clamp(dts * 1.2, 0, 1));
    if (r.t > 1.4) {
      scene.remove(r.mesh);
      rnats.splice(i, 1);
      prodSwitch = 1;
      ph = Math.max(ph, 3.5 / 6);
      cellMat.color.set(0xc0392b);
      cellMat.opacity = 0.2;
    }
  }
  /* 劫持:核糖体吐病毒零件 */
  if (prodSwitch > 0.5 && Math.random() < dts * 4) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), M.vproteins);
    m.position.copy(ribos[Math.floor(Math.random() * ribos.length)].position);
    scene.add(m);
    vparts.push({ mesh: m, t: 0, to: new THREE.Vector3(1.4, 1.7, 0).add(new THREE.Vector3((Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, 0)) });
  }
  for (let i = vparts.length - 1; i >= 0; i--) {
    const p = vparts[i];
    p.t += dts;
    p.mesh.position.lerp(p.to, clamp(dts * 0.8, 0, 1));
    if (p.mesh.position.distanceTo(p.to) < 0.12 || p.t > 6) {
      scene.remove(p.mesh);
      vparts.splice(i, 1);
      if (p.t <= 4) {
        /* 组装 */
        assembled++;
        ph = Math.max(ph, 4.5 / 6);
        const g = mkVirion();
        g.position.set(1.4, 1.7, 0);
        scene.add(g);
        newVirions.push({ g, t: 0 });
      }
    }
  }
  /* 新病毒出芽/裂解 */
  for (const nv of newVirions) {
    nv.t += dts;
    if (nv.t > 1.2) {
      const dir = nv.g.position.clone().sub(new THREE.Vector3(0.8, 0.8, 0)).normalize();
      nv.g.position.addScaledVector(dir, dts * 1.4);
    }
  }
  if (assembled > 12) {
    /* 裂解 */
    ph = 1;
    cellMat.opacity = Math.max(0.02, cellMat.opacity - dts * 0.3);
    cell.scale.multiplyScalar(1 - dts * 0.05);
  }
  /* 健康产物 */
  if (prodSwitch < 0.5 && Math.random() < dts * 2.5 && cellMat.opacity > 0.05) spawnCellProduct();
  for (let i = cellProducts.length - 1; i >= 0; i--) {
    const c = cellProducts[i];
    c.t += dts;
    c.mesh.position.y += dts * 0.35;
    c.mesh.material.opacity = Math.max(0, 0.85 - c.t * 0.4);
    if (c.t > 2) { scene.remove(c.mesh); cellProducts.splice(i, 1); }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  virionTick(dts);
  nucleus.rotation.y += dts * 0.2;
  cell.rotation.y += dts * 0.05;

  document.getElementById('stPh').textContent = infecting ? PH_NAMES[Math.min(5, Math.floor(ph * 6))] : L('待感染', 'awaiting');
  const rb = document.getElementById('stRibo');
  rb.textContent = prodSwitch < 0.5 ? L('细胞蛋白', 'cell proteins') : L('病毒零件!', 'virus parts!');
  rb.className = 'v ' + (prodSwitch < 0.5 ? '' : 'r');
  document.getElementById('stNew').textContent = assembled;
  const cs = document.getElementById('stCell');
  if (assembled > 12) cs.textContent = L('裂解!', 'LYSED!');
  else if (prodSwitch > 0.5) cs.textContent = L('被劫持', 'hijacked');
  else cs.textContent = L('健康', 'healthy');
  cs.style.color = assembled > 12 ? '#ff8787' : prodSwitch > 0.5 ? '#ffd166' : '#63e6be';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
