<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形与递归 · 简单规则 × 无限递归 = 无限复杂</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.25);
    --cv-dim:#77828f; --cv-dim2:#8b97a8; --cv-text:#c7d2de; --cv-fill:rgba(76,201,240,.10);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.40);
    --cv-dim:#8593a3; --cv-dim2:#6b7a8a; --cv-text:#33414f; --cv-fill:rgba(21,128,163,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ca { color: var(--acc); border-color: var(--acc); }
  .chip.cg { color: #e89b3c; border-color: rgba(255,159,67,.7); }
  :root[data-theme="light"] .chip.cg { color: #b26214; }
  .chip.cd { color: var(--text2); border-color: var(--tool-border); }
  #modeRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 6px; text-align: center; line-height: 1.25;
    font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="分形与递归：简单规则 × 无限递归 = 无限复杂" data-en="Fractals & Recursion: simple rules × infinite recursion = infinite complexity">分形与递归：简单规则 × 无限递归 = 无限复杂</h1>
  <div class="sub" data-zh="科赫雪花:每级周长 ×4/3 发散,面积却收敛于 8/5;谢尔宾斯基:面积指数消亡;曼德博:点击边界放大一级,细节永不重复 · 空格播放/暂停" data-en="Koch: perimeter ×4/3 diverges while area converges to 8/5; Sierpinski: area decays to zero; Mandelbrot: click the boundary to zoom one level — detail never repeats · Space = play/pause">科赫雪花:每级周长 ×4/3 发散,面积却收敛于 8/5;谢尔宾斯基:面积指数消亡;曼德博:点击边界放大一级,细节永不重复 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k0">递归深度</span><span class="v" id="v0">0</span>
  <span class="k" id="k1">线段数</span><span class="v" id="v1">3</span>
  <span class="k" id="k2">周长比</span><span class="v" id="v2">×1.000</span>
  <span class="k" id="k3">面积比</span><span class="v" id="v3">×1.000</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ca" data-zh="蓝:分形边界" data-en="blue: fractal boundary">蓝:分形边界</span>
    <span class="chip cg" data-zh="金:最新一级新增/挖去" data-en="gold: newest generation">金:最新一级新增/挖去</span>
    <span class="chip cd" data-zh="虚线:初始形状" data-en="dashed: initial shape">虚线:初始形状</span>
  </div>
  <div id="modeRow">
    <button id="mKoch" class="bon on" data-zh="① 科赫雪花" data-en="① Koch">① 科赫雪花</button>
    <button id="mSierp" class="bon" data-zh="② 谢尔宾斯基" data-en="② Sierpinski">② 谢尔宾斯基</button>
    <button id="mMandel" class="bon" data-zh="③ 曼德博" data-en="③ Mandelbrot">③ 曼德博</button>
  </div>
  <div class="row" id="depthRow">
    <label data-zh="递归深度" data-en="Depth">递归深度</label>
    <input id="depth" type="range" min="0" max="6" step="1" value="0"><span class="val" id="depthVal">0</span>
  </div>
  <div class="row" id="iterRow" style="display:none">
    <label data-zh="基础迭代" data-en="Base iter">基础迭代</label>
    <input id="iter" type="range" min="48" max="640" step="16" value="224"><span class="val" id="iterVal">224</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label id="progLabel">进度</label><input id="prog" type="range" min="0" max="6" step="0.01" value="0"><span class="val" id="progVal">0.00</span></div>
    <button id="reset" data-zh="重置" data-en="Reset">重置</button>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFill" type="checkbox" checked> <span data-zh="填充面积" data-en="Fill area">填充面积</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lightning/" data-zh="同族:闪电的分支也是分形" data-en="same family: lightning branches">同族:闪电的分支也是分形</a>
    <a href="../crystal-growth/" data-zh="延伸:枝晶生长,自然界的分形" data-en="related: dendritic growth in nature">延伸:枝晶生长,自然界的分形</a>
    <a href="../random-walk/" data-zh="同族:布朗轨迹处处曲折" data-en="same family: Brownian paths">同族:布朗轨迹处处曲折</a>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', axis:'--cv-axis', dim:'--cv-dim',
      dim2:'--cv-dim2', text:'--cv-text', acc:'--acc', fill:'--cv-fill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('分形与递归 · 简单规则 × 无限递归 = 无限复杂',
    'Fractals & Recursion · Simple Rules × Infinite Recursion = Infinite Complexity');
  progLabel.textContent = mode === 'mandel' ? L('放大级数', 'Zoom level') : L('进度', 'Phase');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（2D 按 dpr 缩放；科赫/谢尔宾斯基用 1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 1600, VH = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / VW, innerHeight / VH);
  vox = (innerWidth - VW * vs) / 2; voy = (innerHeight - VH * vs) / 2;
  if (mode === 'mandel') restartJob();
}
addEventListener('resize', resize);

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = n => n.toLocaleString('en-US');
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => SUPS[+c] !== undefined ? SUPS[+c] : c).join('');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}

/* ================= URL 参数 ================= */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ================= 状态 ================= */
let mode = 'koch';
const qm = qs.get('mode');
if (qm === 'sierp' || qm === 'mandel') mode = qm;
let u = clamp(qsFloat('t', 0), 0, 6);            // 科赫/谢尔宾斯基:连续递归深度 0→6
let zoomExp = clamp(qsFloat('t', 0), 0, 22);     // 曼德博:放大级数(×2^n)
const ZMAX = 22, HOME = [-0.6, 0], DIVE = [-0.7436439, 0.13186];
let zx = qs.get('re') !== null ? qsFloat('re', HOME[0]) : HOME[0];
let zy = qs.get('im') !== null ? qsFloat('im', 0) : 0;
let baseIter = clamp(qsFloat('iter', 224), 48, 640);
let speed = 1, playing = true, showLabels = true, diveT = 0, lastStep = -1;

/* ================= 几何：初始三角形（三种模式共用） ================= */
const KCX = 640, KCY = 455, KR = 300;
const KV = [0, 1, 2].map(i => {
  const a = (-90 + 120 * i) * Math.PI / 180;
  return [KCX + KR * Math.cos(a), KCY + KR * Math.sin(a)];
});
const KS = KV.map((v, i) => {
  const a = KV[i], b = KV[(i + 1) % 3];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const mx = (a[0] + b[0]) / 2 - KCX, my = (a[1] + b[1]) / 2 - KCY;
  return (-dy * mx + dx * my) > 0 ? 1 : -1;      // 外向法线符号
});

/* ---- 科赫:递归细分,D 层完整曲线有 3·4^D 段;仅最新一级凸起高度 ×k ---- */
function kochEdge(ax, ay, bx, by, d, k, s, out, tris) {
  if (d === 0) { out.push(bx, by); return; }
  const dx = (bx - ax) / 3, dy = (by - ay) / 3, pl = Math.hypot(dx, dy);
  const x1 = ax + dx, y1 = ay + dy, x2 = ax + 2 * dx, y2 = ay + 2 * dy;
  const hh = pl * 0.8660254037844386 * (d === 1 ? k : 1);
  const tx = (x1 + x2) / 2 - dy / pl * hh * s, ty = (y1 + y2) / 2 + dx / pl * hh * s;
  if (d === 1 && tris) tris.push(x1, y1, tx, ty, x2, y2);
  kochEdge(ax, ay, x1, y1, d - 1, k, s, out, tris);
  kochEdge(x1, y1, tx, ty, d - 1, k, s, out, tris);
  kochEdge(tx, ty, x2, y2, d - 1, k, s, out, tris);
  kochEdge(x2, y2, bx, by, d - 1, k, s, out, tris);
}
const kochPerim = (d, k) => Math.pow(4 / 3, d) * (2 / 3 + 2 * Math.sqrt(1 / 36 + k * k / 12));
function kochArea(d, k) {
  let A = 1;
  for (let n = 1; n <= d; n++) A += (1 / 3) * Math.pow(4 / 9, n - 1);
  return A + k * (1 / 3) * Math.pow(4 / 9, d);
}

/* ---- 谢尔宾斯基:每层留下 3 个角三角;生长中挖去的中点三角按 k 长大 ---- */
function sierpRec(ax, ay, bx, by, cx, cy, d, out) {
  if (d === 0) { out.push(ax, ay, bx, by, cx, cy); return; }
  const m1x = (ax + bx) / 2, m1y = (ay + by) / 2;
  const m2x = (bx + cx) / 2, m2y = (by + cy) / 2;
  const m3x = (cx + ax) / 2, m3y = (cy + ay) / 2;
  sierpRec(ax, ay, m1x, m1y, m3x, m3y, d - 1, out);
  sierpRec(m1x, m1y, bx, by, m2x, m2y, d - 1, out);
  sierpRec(m3x, m3y, m2x, m2y, cx, cy, d - 1, out);
}

/* ================= 步骤（可点击跳转模式/进度） ================= */
const STEPS = [
  { m: 'koch', u: 0, b: '一条规则', d: '等边三角形 + 一条规则:每条边三等分,中段隆起一个等边小三角。没有公式,只有规则。',
    be: 'One simple rule', de: 'An equilateral triangle plus one rule: trisect each side, raise an equilateral bump on the middle third. No formula — a rule.' },
  { m: 'koch', u: 2, b: '规则调用自己', d: '对每条新边再施同一条规则——这就是递归。盯住读数:线段 ×4,周长 ×4/3。',
    be: 'The rule calls itself', de: 'Apply the same rule to every new edge — that is recursion. Watch the counters: ×4 segments, ×4/3 perimeter.' },
  { m: 'koch', u: 6, b: '周长发散,面积有限', d: '6 级后周长 = 5.62·P₀,无限递归下 → ∞;但每级新增面积只有上一级的 1/9,总面积收敛于 8/5·A₀——无限长的边,围住有限的地。',
    be: 'Perimeter diverges, area converges', de: 'After 6 levels the perimeter is 5.62·P₀, heading to ∞; yet each level adds only 1/9 of the previous added area, so the total converges to 8/5·A₀ — an infinite boundary around finite land.' },
  { m: 'sierp', u: 6, b: '谢尔宾斯基:面积被吃光', d: '换一条规则:挖掉中间 1/4。剩余面积按 (3/4)ⁿ 指数衰减 → 0;维数 ln3/ln2 ≈ 1.585,介于线与面之间。',
    be: 'Sierpinski: area eaten away', de: 'Another rule: remove the middle quarter. Remaining area decays like (3/4)ⁿ → 0; dimension ln3/ln2 ≈ 1.585 — between a line and a plane.' },
  { m: 'mandel', u: 0, b: '曼德博:另一种无限', d: 'z → z² + c 无限自我平方。点击边界任意处放大一级:规则没变,细节永不重复。',
    be: 'Mandelbrot: another infinity', de: 'z → z² + c squares itself forever. Click anywhere on the boundary to zoom one level: same rule, endless new detail.' },
];
function stepIndex() {
  if (mode === 'sierp') return 3;
  if (mode === 'mandel') return 4;
  return u < 1.5 ? 0 : u < 4.5 ? 1 : 2;
}

/* ================= UI 元素 ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elDepth = document.getElementById('depth'), elDepthVal = document.getElementById('depthVal');
const elIter = document.getElementById('iter'), elIterVal = document.getElementById('iterVal');
const elProg = document.getElementById('prog'), elProgVal = document.getElementById('progVal');
const progLabel = document.getElementById('progLabel');
const elSteps = document.getElementById('steps');
const mK = document.getElementById('mKoch'), mS = document.getElementById('mSierp'), mM = document.getElementById('mMandel');
const tglLabels = document.getElementById('tglLabels'), tglFill = document.getElementById('tglFill');
const depthRow = document.getElementById('depthRow'), iterRow = document.getElementById('iterRow');
const kEls = [0, 1, 2, 3].map(i => document.getElementById('k' + i));
const vEls = [0, 1, 2, 3].map(i => document.getElementById('v' + i));

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => gotoStep(i));
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function gotoStep(i) {
  const s = STEPS[i];
  if (s.m !== mode) setMode(s.m);
  if (s.m === 'mandel') homeView();
  else setU(s.u);
}
function setU(v) { u = clamp(v, 0, 6); }
function homeView() { zoomExp = 0; zx = HOME[0]; zy = HOME[1]; diveT = 0; restartJob(); }
function setMode(m) {
  mode = m;
  [mK, mS, mM].forEach(b => b.classList.remove('on'));
  (m === 'koch' ? mK : m === 'sierp' ? mS : mM).classList.add('on');
  depthRow.style.display = m === 'mandel' ? 'none' : 'flex';
  iterRow.style.display = m === 'mandel' ? 'flex' : 'none';
  progLabel.textContent = m === 'mandel' ? L('放大级数', 'Zoom level') : L('进度', 'Phase');
  elProg.min = 0; elProg.max = m === 'mandel' ? ZMAX : 6; elProg.step = m === 'mandel' ? 1 : 0.01;
  if (m === 'mandel') restartJob();
  lastStep = -1;
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncProg() {
  if (mode === 'mandel') {
    elProg.value = zoomExp; elProgVal.textContent = '2^' + zoomExp;
  } else {
    elDepth.value = Math.round(u); elDepthVal.textContent = Math.round(u);
    elProg.value = u; elProgVal.textContent = u.toFixed(2);
  }
}
function updateStats() {
  let kv;
  if (mode === 'koch') {
    const d = Math.floor(u), k = u - d, D = Math.ceil(u);
    kv = [
      [L('递归深度', 'Depth'), `${D} / 6`],
      [L('线段数 3·4ⁿ', 'Segments 3·4ⁿ'), fmt(3 * 4 ** D)],
      [L('周长比 P/P₀', 'Perimeter P/P₀'), `×${kochPerim(d, k).toFixed(3)} → ∞`],
      [L('面积比 A/A₀', 'Area A/A₀'), `×${kochArea(d, k).toFixed(3)} → 1.6`],
    ];
  } else if (mode === 'sierp') {
    const d = Math.floor(u), k = u - d;
    const rem = Math.pow(3 / 4, d) * (1 - k / 4);
    kv = [
      [L('递归深度', 'Depth'), `${d} / 6`],
      [L('三角形数 3ⁿ', 'Triangles 3ⁿ'), fmt(3 ** d)],
      [L('剩余面积 (3/4)ⁿ', 'Area left (3/4)ⁿ'), `${rem.toFixed(4)} → 0`],
      [L('已挖去', 'Removed'), `${((1 - rem) * 100).toFixed(1)}%`],
    ];
  } else {
    const dec = Math.min(12, 5 + zoomExp);
    kv = [
      [L('放大倍数', 'Magnification'), `×${fmt(2 ** zoomExp)}`],
      [L('中心 Re', 'Center Re'), zx.toFixed(dec)],
      [L('中心 Im', 'Center Im'), zy.toFixed(dec)],
      [L('有效迭代', 'Eff. iterations'), effIter() + (job ? ' …' : '')],
    ];
  }
  for (let i = 0; i < 4; i++) { kEls[i].textContent = kv[i][0]; vEls[i].textContent = kv[i][1]; }
}

/* ================= 绘制:科赫 / 谢尔宾斯基 ================= */
function drawFS() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * vs, 0, 0, dpr * vs, vox * dpr, voy * dpr);
  if (mode === 'koch') drawKoch(); else drawSierp();
}
function drawKoch() {
  const d = Math.floor(u), k = u - d, D = Math.ceil(u);
  const ks = k > 0 ? k : 1;                      // 整数深度 = 该层已完整
  const pts = [KV[0][0], KV[0][1]], tris = [];
  for (let e = 0; e < 3; e++) {
    const a = KV[e], b = KV[(e + 1) % 3];
    kochEdge(a[0], a[1], b[0], b[1], D, ks, KS[e], pts, tris);
  }
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (tglFill.checked) { ctx.fillStyle = PAL.fill; ctx.fill(); }
  ctx.strokeStyle = PAL.acc; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  if (k > 0 && tris.length) {
    ctx.fillStyle = 'rgba(255,170,60,.35)'; ctx.beginPath();
    for (let i = 0; i < tris.length; i += 6) {
      ctx.moveTo(tris[i], tris[i + 1]); ctx.lineTo(tris[i + 2], tris[i + 3]);
      ctx.lineTo(tris[i + 4], tris[i + 5]); ctx.closePath();
    }
    ctx.fill();
  }
  ctx.setLineDash([7, 7]); ctx.strokeStyle = PAL.axis; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(KV[0][0], KV[0][1]);
  for (let e = 1; e < 3; e++) ctx.lineTo(KV[e][0], KV[e][1]);
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  if (showLabels) {
    const P = kochPerim(d, k), A = kochArea(d, k), X = 1110;
    text(`n = ${D}`, X, 240, 16, PAL.text, 'left', 700);
    text(`N = 3·4${sup(D)} = ${fmt(3 * 4 ** D)} ${L('条线段', 'segments')}`, X, 274, 13.5, PAL.dim);
    text(`P = (4/3)${sup(D)}·P₀ = ${P.toFixed(3)}·P₀ ${L('→ 发散 ∞', '→ diverges ∞')}`, X, 304, 13.5, '#e89b3c', 'left', 700);
    text(`A = ${A.toFixed(3)}·A₀ ${L('→ 收敛于 8/5·A₀', '→ converges to 8/5·A₀')}`, X, 334, 13.5, PAL.text);
    text(L('金色 = 本级新增的面积(每级只有上一级的 1/9)', 'gold = area added this level (1/9 of the last)'), X, 368, 12, PAL.dim2);
    text(L('虚线 = 初始三角形 P₀·A₀', 'dashed = initial triangle P₀·A₀'), X, 390, 12, PAL.dim2);
  }
}
function drawSierp() {
  const d = Math.floor(u), k = u - d;
  const leaves = [];
  sierpRec(KV[0][0], KV[0][1], KV[1][0], KV[1][1], KV[2][0], KV[2][1], d, leaves);
  ctx.globalAlpha = 0.5; ctx.fillStyle = PAL.acc; ctx.beginPath();
  for (let i = 0; i < leaves.length; i += 6) {
    ctx.moveTo(leaves[i], leaves[i + 1]); ctx.lineTo(leaves[i + 2], leaves[i + 3]);
    ctx.lineTo(leaves[i + 4], leaves[i + 5]); ctx.closePath();
  }
  ctx.fill(); ctx.globalAlpha = 1;
  if (k > 0) {
    ctx.fillStyle = PAL.bg; ctx.beginPath();
    for (let i = 0; i < leaves.length; i += 6) {
      const ax = leaves[i], ay = leaves[i + 1], bx = leaves[i + 2], by = leaves[i + 3];
      const cx = leaves[i + 4], cy = leaves[i + 5];
      const gx = (ax + bx + cx) / 3, gy = (ay + by + cy) / 3;
      const m = [[(ax + bx) / 2, (ay + by) / 2], [(bx + cx) / 2, (by + cy) / 2], [(cx + ax) / 2, (cy + ay) / 2]];
      ctx.moveTo(gx + (m[0][0] - gx) * k, gy + (m[0][1] - gy) * k);
      ctx.lineTo(gx + (m[1][0] - gx) * k, gy + (m[1][1] - gy) * k);
      ctx.lineTo(gx + (m[2][0] - gx) * k, gy + (m[2][1] - gy) * k);
      ctx.closePath();
    }
    ctx.fill();
  }
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(KV[0][0], KV[0][1]);
  for (let e = 1; e < 3; e++) ctx.lineTo(KV[e][0], KV[e][1]);
  ctx.closePath(); ctx.stroke();
  if (showLabels) {
    const rem = Math.pow(3 / 4, d) * (1 - k / 4), X = 1110;
    text(`n = ${d}`, X, 240, 16, PAL.text, 'left', 700);
    text(`N = 3${sup(d)} = ${fmt(3 ** d)} ${L('个自相似三角形', 'self-similar triangles')}`, X, 274, 13.5, PAL.dim);
    text(`${L('剩余面积', 'Area left')} = (3/4)${sup(d)} = ${rem.toFixed(4)} → 0`, X, 304, 13.5, '#e89b3c', 'left', 700);
    text(`${L('已挖去', 'Removed')} = ${(1 - rem).toFixed(4)}`, X, 334, 13.5, PAL.text);
    text(L('维数 = ln3/ln2 ≈ 1.585(介于线与面之间)', 'dimension = ln3/ln2 ≈ 1.585 (between line and plane)'), X, 368, 12, PAL.dim2);
    text(L('挖掉的部分按 1/4、1/16、1/64… 指数缩小', 'removed pieces shrink 1/4, 1/16, 1/64 …'), X, 390, 12, PAL.dim2);
  }
}

/* ================= 曼德博:逃逸时间 + 分块渐进渲染 ================= */
const oc = document.createElement('canvas'), md = oc.getContext('2d');
const BLOCKS = [24, 8, 3, 1], BANDS = 36, ESC = 256;
let job = null;
const STOPS = [[5, 8, 22], [18, 44, 98], [36, 100, 170], [96, 190, 235], [222, 242, 252],
  [255, 208, 120], [228, 112, 56], [70, 22, 44], [5, 8, 22]];
const pal = new Uint8ClampedArray(1024 * 3);
for (let i = 0; i < 1024; i++) {
  const t = i / 1024 * (STOPS.length - 1), j = Math.floor(t), f = t - j;
  const a = STOPS[j], b = STOPS[Math.min(j + 1, STOPS.length - 1)];
  for (let c = 0; c < 3; c++) pal[i * 3 + c] = a[c] + (b[c] - a[c]) * f;
}
function restartJob() { job = { pass: 0, row: 0, ow: -1 }; }
function effIter() { return Math.min(1500, Math.round(baseIter + 40 * zoomExp)); }
function pixSize() { return 2.8 * Math.pow(2, -zoomExp) / cv.height; }
function mandelChunk(budget) {
  if (!job || !cv.width) return;
  const w = cv.width, h = cv.height, B = BLOCKS[job.pass];
  const ow = Math.ceil(w / B), oh = Math.ceil(h / B);
  if (job.ow !== ow) {
    oc.width = ow; oc.height = oh;
    job.img = md.createImageData(ow, oh); job.ow = ow; job.oh = oh; job.row = 0;
    job.cr = new Float64Array(ow);
    const ps = pixSize();
    for (let c = 0; c < ow; c++) job.cr[c] = zx + (c * B - w / 2) * ps;
  }
  const ps = pixSize(), maxI = effIter(), data = job.img.data, cr = job.cr;
  const t0 = performance.now(), rowStart = job.row;
  while (job.row < oh && performance.now() - t0 < budget) {
    const row = job.row++, cim = zy - (row * B - h / 2) * ps;
    let o = row * ow * 4;
    for (let c = 0; c < ow; c++) {
      let zr = 0, zi = 0, zr2 = 0, zi2 = 0, n = 0;
      const crv = cr[c];
      while (n < maxI && zr2 + zi2 <= ESC) {
        zi = 2 * zr * zi + cim; zr = zr2 - zi2 + crv; zr2 = zr * zr; zi2 = zi * zi; n++;
      }
      if (n >= maxI) { data[o] = 8; data[o + 1] = 10; data[o + 2] = 16; }
      else {
        const mu = n + 1 - Math.log2(Math.log(Math.sqrt(zr2 + zi2)) * 1.4426950408889634);
        let t = mu / maxI * BANDS; t -= Math.floor(t);
        const p3 = ((t * 1023) | 0) * 3;
        data[o] = pal[p3]; data[o + 1] = pal[p3 + 1]; data[o + 2] = pal[p3 + 2];
      }
      data[o + 3] = 255; o += 4;
    }
  }
  md.putImageData(job.img, 0, 0, 0, rowStart, ow, job.row - rowStart);
  if (job.row >= oh) { job.pass++; job.ow = -1; if (job.pass >= BLOCKS.length) job = null; }
}
function blit() {
  if (!oc.width) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(oc, 0, 0, oc.width, oc.height, 0, 0, cv.width, cv.height);
}
function overlayMandel() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!showLabels) return;
  text('z → z² + c（z₀ = 0，|c| ≤ 2）', 22, 122, 14, PAL.text, 'left', 700);
  text(L('点击：放大一级　·　Shift+点击 / 右键：缩小', 'Click: zoom in one level · Shift+click / right-click: zoom out'),
    22, 144, 12.5, PAL.dim2);
}
function mandelZoomAt(xCss, yCss, dir) {
  const r = cv.getBoundingClientRect();
  const ps = pixSize();
  const offX = (xCss - r.left) * (cv.width / r.width) - cv.width / 2;
  const offY = (yCss - r.top) * (cv.height / r.height) - cv.height / 2;
  zoomExp = clamp(zoomExp + dir, 0, ZMAX);
  if (dir > 0) { zx += offX * ps; zy -= offY * ps; }
  restartJob();
}
cv.addEventListener('click', e => {
  if (mode !== 'mandel') return;
  mandelZoomAt(e.clientX, e.clientY, e.shiftKey ? -1 : 1);
});
cv.addEventListener('contextmenu', e => {
  if (mode !== 'mandel') return;
  e.preventDefault();
  mandelZoomAt(e.clientX, e.clientY, -1);
});
function advanceDive(dt) {
  diveT += dt * speed;
  if (diveT >= 1.4) {
    diveT = 0;
    if (zoomExp >= ZMAX) { zoomExp = 0; zx = HOME[0]; zy = HOME[1]; }
    else { zoomExp++; zx += (DIVE[0] - zx) * 0.5; zy += (DIVE[1] - zy) * 0.5; }
    restartJob();
  }
}

/* ================= 事件 ================= */
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elDepth.addEventListener('input', () => { setU(parseInt(elDepth.value, 10)); elProg.value = u; });
elProg.addEventListener('input', () => {
  if (mode === 'mandel') { zoomExp = parseInt(elProg.value, 10) || 0; restartJob(); }
  else setU(parseFloat(elProg.value));
});
elIter.addEventListener('input', () => { baseIter = parseInt(elIter.value, 10); elIterVal.textContent = baseIter; if (mode === 'mandel') restartJob(); });
document.getElementById('reset').addEventListener('click', () => {
  if (mode === 'mandel') homeView(); else setU(0);
});
mK.addEventListener('click', () => setMode('koch'));
mS.addEventListener('click', () => setMode('sierp'));
mM.addEventListener('click', () => setMode('mandel'));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

/* ================= 主循环（document.hidden 停 rAF） ================= */
let last = performance.now(), raf = null;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) { if (mode === 'mandel') advanceDive(dt); else { u += dt * 1.05 * speed; if (u > 6) u -= 6; } }
  if (mode === 'mandel') { mandelChunk(7); blit(); overlayMandel(); }
  else drawFS();
  syncProg(); updateStats();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}
function start() { if (raf === null && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elIter.value = baseIter; elIterVal.textContent = baseIter;
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
if (!qsBool('fill', true)) tglFill.checked = false;
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
applyTheme();
applyLang();
setMode(mode);
resize();
start();
</script>
</body>
</html>
