<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形与递归 · 简单规则 × 无限递归 = 无限复杂</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.25);
    --cv-dim:#77828f; --cv-dim2:#8b97a8; --cv-text:#c7d2de; --cv-fill:rgba(76,201,240,.10);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.40);
    --cv-dim:#8593a3; --cv-dim2:#6b7a8a; --cv-text:#33414f; --cv-fill:rgba(21,128,163,.10);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; }
  :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ca { color: var(--acc); border-color: var(--acc); }
  .chip.cg { color: #e89b3c; border-color: rgba(255,159,67,.7); }
  :root[data-theme="light"] .chip.cg { color: #b26214; }
  .chip.cd { color: var(--text2); border-color: var(--tool-border); }
  #modeRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 6px; text-align: center; line-height: 1.25;
    font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="分形与递归：简单规则 × 无限递归 = 无限复杂" data-en="Fractals & Recursion: simple rules × infinite recursion = infinite complexity">分形与递归：简单规则 × 无限递归 = 无限复杂</h1>
  <div class="sub" data-zh="科赫雪花:每级周长 ×4/3 发散,面积却收敛于 8/5;谢尔宾斯基:面积指数消亡;曼德博:点击边界放大一级,细节永不重复 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Koch: perimeter ×4/3 diverges while area converges to 8/5; Sierpinski: area decays to zero; Mandelbrot: click the boundary to zoom one level — detail never repeats · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">科赫雪花:每级周长 ×4/3 发散,面积却收敛于 8/5;谢尔宾斯基:面积指数消亡;曼德博:点击边界放大一级,细节永不重复 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k0">递归深度</span><span class="v" id="v0">0</span>
  <span class="k" id="k1">线段数</span><span class="v" id="v1">3</span>
  <span class="k" id="k2">周长比</span><span class="v" id="v2">×1.000</span>
  <span class="k" id="k3">面积比</span><span class="v" id="v3">×1.000</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip ca" data-zh="蓝:分形边界" data-en="blue: fractal boundary">蓝:分形边界</span>
    <span class="chip cg" data-zh="金:最新一级新增/挖去" data-en="gold: newest generation">金:最新一级新增/挖去</span>
    <span class="chip cd" data-zh="虚线:初始形状" data-en="dashed: initial shape">虚线:初始形状</span>
  </div>
  <div id="modeRow">
    <button id="mKoch" class="bon on" data-zh="① 科赫雪花" data-en="① Koch">① 科赫雪花</button>
    <button id="mSierp" class="bon" data-zh="② 谢尔宾斯基" data-en="② Sierpinski">② 谢尔宾斯基</button>
    <button id="mMandel" class="bon" data-zh="③ 曼德博" data-en="③ Mandelbrot">③ 曼德博</button>
  </div>
  <div class="row" id="depthRow">
    <label data-zh="递归深度" data-en="Depth">递归深度</label>
    <input id="depth" type="range" min="0" max="6" step="1" value="0"><span class="val" id="depthVal">0</span>
  </div>
  <div class="row" id="iterRow" style="display:none">
    <label data-zh="基础迭代" data-en="Base iter">基础迭代</label>
    <input id="iter" type="range" min="48" max="640" step="16" value="224"><span class="val" id="iterVal">224</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label id="progLabel">进度</label><input id="prog" type="range" min="0" max="6" step="0.01" value="0"><span class="val" id="progVal">0.00</span></div>
    <button id="reset" data-zh="重置" data-en="Reset">重置</button>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFill" type="checkbox" checked> <span data-zh="填充面积" data-en="Fill area">填充面积</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lightning/" data-zh="同族:闪电的分支也是分形" data-en="same family: lightning branches">同族:闪电的分支也是分形</a>
    <a href="../crystal-growth/" data-zh="延伸:枝晶生长,自然界的分形" data-en="related: dendritic growth in nature">延伸:枝晶生长,自然界的分形</a>
    <a href="../random-walk/" data-zh="同族:布朗轨迹处处曲折" data-en="same family: Brownian paths">同族:布朗轨迹处处曲折</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = n => n.toLocaleString('en-US');
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => SUPS[+c] !== undefined ? SUPS[+c] : c).join('');

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
let grid = null;
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const light = THEME === 'light';
  scene.background = new THREE.Color(light ? 0xeef1f6 : 0x10141b);
  scene.fog = new THREE.Fog(light ? 0xeef1f6 : 0x10141b, 13, 32);
  if (grid) {
    grid.material.color.set(light ? 0x9aa7b8 : 0x3a4656);
    grid.material.opacity = light ? 0.55 : 0.35;
  }
  const acc = light ? 0x1580a3 : 0x4cc9f0, gold = light ? 0xb26214 : 0xe89b3c,
    dim = light ? 0x5b6b7d : 0x8b97a8;
  kochLine.material.color.set(acc);
  fillMesh.material.color.set(acc);
  fillMesh.material.opacity = light ? 0.13 : 0.10;
  goldMesh.material.color.set(gold);
  sierpMesh.material.color.set(acc);
  holeMesh.material.color.set(gold);
  dashK.material.color.set(dim);
  dashS.material.color.set(dim);
  marker.material.color.set(gold);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('分形与递归 · 简单规则 × 无限递归 = 无限复杂',
    'Fractals & Recursion · Simple Rules × Infinite Recursion = Infinite Complexity');
  progLabel.textContent = mode === 'mandel' ? L('放大级数', 'Zoom level') : L('进度', 'Phase');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(1.2, 3.2, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

grid = new THREE.GridHelper(30, 30, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.y = -0.42;
scene.add(grid);

/* ================= 几何：初始三角形（科赫/谢尔宾斯基共用 1600×900 虚拟坐标 → 场景坐标） ================= */
const KCX = 640, KCY = 455, KR = 300;
const KV = [0, 1, 2].map(i => {
  const a = (-90 + 120 * i) * Math.PI / 180;
  return [KCX + KR * Math.cos(a), KCY + KR * Math.sin(a)];
});
const KS = KV.map((v, i) => {
  const a = KV[i], b = KV[(i + 1) % 3];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const mx = (a[0] + b[0]) / 2 - KCX, my = (a[1] + b[1]) / 2 - KCY;
  return (-dy * mx + dx * my) > 0 ? 1 : -1;      // 外向法线符号
});

const tglLabels = document.getElementById('tglLabels'), tglFill = document.getElementById('tglFill');
const tglRotate = document.getElementById('tglRotate');
const depthRow = document.getElementById('depthRow'), iterRow = document.getElementById('iterRow');
const kEls = [0, 1, 2, 3].map(i => document.getElementById('k' + i));
const vEls = [0, 1, 2, 3].map(i => document.getElementById('v' + i));

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => gotoStep(i));
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function gotoStep(i) {
  const s = STEPS[i];
  if (s.m !== mode) setMode(s.m);
  if (s.m === 'mandel') homeView();
  else setU(s.u);
}
function setU(v) { u = clamp(v, 0, 6); }
function homeView() { zoomExp = 0; zx = HOME[0]; zy = HOME[1]; diveT = 0; restartJob(); }
function setMode(m) {
  mode = m;
  [mK, mS, mM].forEach(b => b.classList.remove('on'));
  (m === 'koch' ? mK : m === 'sierp' ? mS : mM).classList.add('on');
  depthRow.style.display = m === 'mandel' ? 'none' : 'flex';
  iterRow.style.display = m === 'mandel' ? 'flex' : 'none';
  progLabel.textContent = m === 'mandel' ? L('放大级数', 'Zoom level') : L('进度', 'Phase');
  elProg.min = 0; elProg.max = m === 'mandel' ? ZMAX : 6; elProg.step = m === 'mandel' ? 1 : 0.01;
  kochG.visible = m === 'koch';
  sierpG.visible = m === 'sierp';
  mandelG.visible = m === 'mandel';
  controls.target.set(0, m === 'mandel' ? 0.4 : 1.85, 0);
  if (m === 'mandel') restartJob();
  lastStep = -1;
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncProg() {
  if (mode === 'mandel') {
    elProg.value = zoomExp; elProgVal.textContent = '2^' + zoomExp;
  } else {
    elDepth.value = Math.round(u); elDepthVal.textContent = Math.round(u);
    elProg.value = u; elProgVal.textContent = u.toFixed(2);
  }
}
function updateStats() {
  let kv;
  if (mode === 'koch') {
    const d = Math.floor(u), k = u - d, D = Math.ceil(u);
    kv = [
      [L('递归深度', 'Depth'), `${D} / 6`],
      [L('线段数 3·4ⁿ', 'Segments 3·4ⁿ'), fmt(3 * 4 ** D)],
      [L('周长比 P/P₀', 'Perimeter P/P₀'), `×${kochPerim(d, k).toFixed(3)} → ∞`],
      [L('面积比 A/A₀', 'Area A/A₀'), `×${kochArea(d, k).toFixed(3)} → 1.6`],
    ];
  } else if (mode === 'sierp') {
    const d = Math.floor(u), k = u - d;
    const rem = Math.pow(3 / 4, d) * (1 - k / 4);
    kv = [
      [L('递归深度', 'Depth'), `${d} / 6`],
      [L('三角形数 3ⁿ', 'Triangles 3ⁿ'), fmt(3 ** d)],
      [L('剩余面积 (3/4)ⁿ', 'Area left (3/4)ⁿ'), `${rem.toFixed(4)} → 0`],
      [L('已挖去', 'Removed'), `${((1 - rem) * 100).toFixed(1)}%`],
    ];
  } else {
    const dec = Math.min(12, 5 + zoomExp);
    kv = [
      [L('放大倍数', 'Magnification'), `×${fmt(2 ** zoomExp)}`],
      [L('中心 Re', 'Center Re'), zx.toFixed(dec)],
      [L('中心 Im', 'Center Im'), zy.toFixed(dec)],
      [L('有效迭代', 'Eff. iterations'), effIter() + (job ? ' …' : '')],
    ];
  }
  for (let i = 0; i < 4; i++) { kEls[i].textContent = kv[i][0]; vEls[i].textContent = kv[i][1]; }
}

/* ================= 事件 ================= */
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elDepth.addEventListener('input', () => { setU(parseInt(elDepth.value, 10)); elProg.value = u; });
elProg.addEventListener('input', () => {
  if (mode === 'mandel') { zoomExp = parseInt(elProg.value, 10) || 0; restartJob(); }
  else setU(parseFloat(elProg.value));
});
elIter.addEventListener('input', () => { baseIter = parseInt(elIter.value, 10); elIterVal.textContent = baseIter; if (mode === 'mandel') restartJob(); });
document.getElementById('reset').addEventListener('click', () => {
  if (mode === 'mandel') homeView(); else setU(0);
});
mK.addEventListener('click', () => setMode('koch'));
mS.addEventListener('click', () => setMode('sierp'));
mM.addEventListener('click', () => setMode('mandel'));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; });
tglFill.addEventListener('change', () => { fillMesh.visible = tglFill.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环（document.hidden 停 rAF） ================= */
const clock = new THREE.Clock();
let raf = null;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) { if (mode === 'mandel') advanceDive(dt); else { u += dt * 1.05 * speed; if (u > 6) u -= 6; } }
  if (mode === 'mandel') {
    mandelChunk(7);
    if (marker.visible) {
      markerT += dt;
      marker.material.opacity = Math.max(0, 0.9 - markerT * 1.1);
      if (markerT > 0.85) marker.visible = false;
    }
  }
  else if (mode === 'koch') buildKoch();
  else buildSierp();
  syncProg(); updateStats();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elIter.value = baseIter; elIterVal.textContent = baseIter;
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; labelsOn = false; }
if (!qsBool('fill', true)) { tglFill.checked = false; fillMesh.visible = false; }
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
applyTheme();
applyLang();
setMode(mode);
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
