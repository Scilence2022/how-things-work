<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>螺栓预紧与防松 · Junker 振动台</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(255,255,255,.85);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="螺栓预紧与防松 · Junker 振动台" data-en="Bolt Preload &amp; Loosening · Junker test">螺栓预紧与防松 · Junker 振动台</h1>
  <div class="sub" data-zh="扭矩只有 ~10% 变成预紧力，其余耗在摩擦；扛横向载荷的是夹紧面摩擦，螺栓只受拉 · 开振动看预紧力几秒被抖光、螺母倒转，再换楔形垫圈看纹丝不动 · 拖动旋转 / 空格运行/暂停" data-en="Only ~10% of torque becomes preload; transverse load is carried by clamp friction while the bolt is pure tension · run the shaker and watch preload drain away in seconds, then swap in wedge washers and watch nothing move · drag to orbit / Space = run/pause">螺栓预紧与防松 · Junker 振动台</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="预紧力" data-en="Preload">预紧力</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="剩余比例" data-en="Remaining">剩余比例</span><span class="v" id="stRem">—</span>
  <span class="k" data-zh="振动频率" data-en="Shaker freq">振动频率</span><span class="v" id="stHz">—</span>
  <span class="k" data-zh="螺母倒转角" data-en="Nut back-rotation">螺母倒转角</span><span class="v" id="stRot">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnVib" data-zh="振动：关" data-en="Shaker: off">振动：关</button>
    <button class="abtn" id="btnTight" data-zh="重新拧紧" data-en="Re-tighten">重新拧紧</button>
  </div>
  <div class="row">
    <label data-zh="防松方式" data-en="Locking mode">防松方式</label>
  </div>
  <div id="modes" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="abtn on" id="mNone" data-zh="无（普通螺母）" data-en="None (plain nut)">无（普通螺母）</button>
    <button class="abtn" id="mJam" data-zh="对顶螺母" data-en="Jam nut">对顶螺母</button>
    <button class="abtn" id="mNylon" data-zh="尼龙嵌入圈" data-en="Nylon insert">尼龙嵌入圈</button>
    <button class="abtn" id="mWedge" data-zh="楔形防松垫圈" data-en="Wedge washers">楔形防松垫圈</button>
  </div>
  <div class="row">
    <label data-zh="拧紧扭矩" data-en="Torque">拧紧扭矩</label>
    <input id="sT" type="range" min="5" max="80" step="1" value="60">
    <span class="val" id="sTVal">60 N·m</span>
  </div>
  <div class="row">
    <label data-zh="振动频率" data-en="Frequency">振动频率</label>
    <input id="sHz" type="range" min="2" max="10" step="1" value="6">
    <span class="val" id="sHzVal">6 Hz</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pin-tumbler-lock/" data-zh="弹子锁" data-en="Pin tumbler lock">弹子锁</a>
    <a href="../ratchet-pawl/" data-zh="棘轮与棘爪" data-en="Ratchet &amp; pawl">棘轮棘爪</a>
    <a href="../zipper/" data-zh="拉链：斜楔互锁" data-en="Zipper: wedge interlock">拉链</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 模型（M10，被夹件摩擦扛横向载荷）：
   预紧力 F = T/(0.2·d)（d=10mm → F[kN] ≈ 0.5·T[N·m]），扭矩的 ~90% 耗于螺纹+支承面摩擦
   Junker 松脱：每振动周期螺纹面滑移一次，dF/F = −k_mode·(0.055+0.5·(1−Fn)²)·2π·? → 按指数衰减
   楔形垫圈把横向滑移变成垫圈爬斜面而非螺纹回转 → k≈0 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,14,40);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(1.2,0.3,7.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-0.1,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(5,7,8); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,3,-5); scene.add(fill);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const plateM=new THREE.MeshStandardMaterial({color:0x5f6f80,roughness:0.45,metalness:0.55,side:THREE.DoubleSide});
const boltM =new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.3,metalness:0.85,side:THREE.DoubleSide});
const nutM  =new THREE.MeshStandardMaterial({color:0xd9730d,roughness:0.35,metalness:0.7,side:THREE.DoubleSide});
const jamM  =new THREE.MeshStandardMaterial({color:0xb085f5,roughness:0.35,metalness:0.65,side:THREE.DoubleSide});
const cutM  =new THREE.MeshStandardMaterial({color:0x39434e,roughness:0.55,metalness:0.3});
const nylonM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.6,metalness:0.1});
const wedgeM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,metalness:0.8,side:THREE.DoubleSide});
const camM  =new THREE.MeshStandardMaterial({color:0x3a4552,roughness:0.5,metalness:0.5});
const tensionM=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.85});
const gapM  =new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.0});

/* ---- 场景 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,8),groundM);
ground.position.set(0,-2.6,0); scene.add(ground);

/* 半剖几何：所有实体取 z<0 半边，剖切面在 z=0 */
function halfCyl(rTop,rBot,h,seg,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBot,h,seg,1,false,Math.PI/2,Math.PI),mat);
  return m;
}
function cutFace(w,h,y,x=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),cutM);
  m.position.set(x,y,0.002); scene.add(m); return m;
}
/* 螺栓（固定）：六角头 + 光杆 + 螺纹环（半剖，z<0 半边） */
const boltG=new THREE.Group(); scene.add(boltG);
const head=halfCyl(0.46,0.46,0.34,6,boltM); head.position.y=0.77; boltG.add(head);
const shank=halfCyl(0.15,0.15,2.02,20,boltM); shank.position.y=-0.24; boltG.add(shank);
cutFace(0.8,0.34,0.77); cutFace(0.3,2.02,-0.24);
const shankCore=new THREE.Mesh(new THREE.PlaneGeometry(0.3,1.1),tensionM); // 预紧发光条（拉伸区）
shankCore.position.set(0,0,0.004); scene.add(shankCore);
/* 螺纹环（半圆环，z<0 半边）：螺母旋合段 + 外露段 */
for(let i=0;i<6;i++){
  const t=new THREE.Mesh(new THREE.TorusGeometry(0.185,0.028,8,20,Math.PI),boltM);
  t.rotation.x=-Math.PI/2; t.position.y=-0.63-i*0.095; boltG.add(t);
}
/* 被夹件 + 螺母组件（振动时一起横移） */
const movingG=new THREE.Group(); scene.add(movingG);
const plateB=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.55,0.7),plateM);
plateB.position.set(0,-0.275,-0.35); movingG.add(plateB);
const plateT=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.55,0.7),plateM);
plateT.position.set(0,0.275,-0.35); movingG.add(plateT);
/* 界面间隙指示条（松脱时张开） */
const gapBarL=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.5),gapM);
gapBarL.position.set(-1.2,0,-0.35); movingG.add(gapBarL);
const gapBarR=gapBarL.clone(); gapBarR.position.x=1.2; movingG.add(gapBarR);
/* 凸轮随动滚轮（贴在下板底面） */
const follower=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.09,14),camM);
follower.position.set(0,-0.595,0); movingG.add(follower);
/* 螺母组（原点=螺母中心；正常 y=-0.75，楔形垫圈模式整体下移） */
const nutG=new THREE.Group(); nutG.position.y=-0.75; movingG.add(nutG);
const nutBody=halfCyl(0.4,0.4,0.3,6,nutM); nutG.add(nutBody);
const nutFace=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.3),cutM);
nutFace.position.set(0,0,0.002); nutG.add(nutFace);
const nutInner=new THREE.Mesh(new THREE.TorusGeometry(0.165,0.03,8,20,Math.PI),nutM);
nutInner.rotation.x=-Math.PI/2; nutInner.position.y=0.03; nutG.add(nutInner);
const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.32,0.06),nylonM);
stripe.position.set(0.28,0,-0.28); nutG.add(stripe);         // 红条纹：倒转可见
const jamNut=halfCyl(0.4,0.4,0.22,6,jamM); jamNut.position.y=-0.27; jamNut.visible=false; nutG.add(jamNut);
const nylonRing=new THREE.Mesh(new THREE.TorusGeometry(0.405,0.045,8,20,Math.PI),nylonM);
nylonRing.rotation.x=-Math.PI/2; nylonRing.position.y=0.13; nylonRing.visible=false; nutG.add(nylonRing);
const wedgeA=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.42,0.07,20,1,false,Math.PI/2,Math.PI),wedgeM);
wedgeA.position.y=0.185; wedgeA.visible=false; nutG.add(wedgeA);
const wedgeB=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.52,0.07,20,1,false,Math.PI/2,Math.PI),wedgeM);
wedgeB.position.y=0.255; wedgeB.visible=false; nutG.add(wedgeB);
/* 头侧/螺母侧垫片 */
const washerT=halfCyl(0.3,0.3,0.05,20,boltM); washerT.position.y=0.575; boltG.add(washerT);
const washerB=halfCyl(0.3,0.3,0.05,20,boltM); washerB.position.y=-0.575; boltG.add(washerB);
/* Junker 偏心轮 + 轨道 */
const railL=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.4,3.4),camM);
railL.position.set(-2.1,-0.35,-0.55); scene.add(railL);
const railR=railL.clone(); railR.position.x=2.1; scene.add(railR);
const camG=new THREE.Group(); camG.position.set(0,-1.04,0); scene.add(camG);
const camDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.16,28),camM);
camDisc.rotation.x=Math.PI/2; camG.add(camDisc);
const camPin=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.3,14),camM);
camPin.position.set(0.22,0,0); camG.add(camPin);
const motorBox=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),camM);
motorBox.position.set(0,-1.75,0); scene.add(motorBox);
/* 预紧力标尺 */
const meterBG=new THREE.Mesh(new THREE.BoxGeometry(0.16,2.2,0.1),camM);
meterBG.position.set(-2.7,0,0); scene.add(meterBG);
const meterFill=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.1,0.12),tensionM);
meterFill.position.set(-2.7,0,0.0); scene.add(meterFill);

/* ---- 标签 ---- */
const labelReg=[];
let labelsOn=true;
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('螺栓头（固定，只受拉）','Bolt head (fixed, pure tension)'),new THREE.Vector3(1.5,0.77,0),'b');
addLabel(()=>L('被夹件：横向载荷靠摩擦面扛','Clamped parts: friction carries shear'),new THREE.Vector3(2.6,0.275,0),'g');
addLabel(()=>L('螺纹面反复滑移 → 泄预紧','Thread faces slip → preload leaks'),new THREE.Vector3(1.8,-0.75,0),'o',
  ()=>vibOn);
addLabel(()=>L('Junker 偏心振动台','Junker eccentric shaker'),new THREE.Vector3(1.7,-1.45,0),'');
addLabel(()=>L('✕ 松脱：预紧力归零，连接失效','✕ LOOSE: preload gone, joint failed'),new THREE.Vector3(0,1.85,0),'r',
  ()=>F<1.0);
addLabel(()=>L('预紧力标尺','Preload gauge'),new THREE.Vector3(-2.7,1.35,0),'o');

/* ---- 状态 ---- */
let playing=true, simT=0, vibOn=false;
let F=30, F0=30, backA=0;            // kN；F0=开始振动时的预紧
let mode='none', camA=0;
const TQ=()=>+document.getElementById('sT').value;         // N·m
const FofT=t=>t*0.5;                 // F[kN] = 0.5·T[N·m]（M10：F=T/0.2d）
const HZ=()=>+document.getElementById('sHz').value;
const MODE_K={none:1.0, jam:0.09, nylon:0.035, wedge:0.001};
const MODE_BACK={none:1.0, jam:0.3, nylon:0.1, wedge:0.0};

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'拧紧扭矩：~50% 耗在螺纹摩擦、~40% 耗在支承面摩擦，只有 ~10% 拉伸螺栓',
   en:'Torque budget: ~50% thread friction + ~40% bearing friction; only ~10% stretches the bolt', do:()=>{setVib(false); retighten();}},
  {zh:'预紧力 F ≈ T/(0.2d)：把被夹件压死，M10 加 60 N·m 得 ~30 kN',
   en:'Preload F ≈ T/(0.2d): M10 at 60 N·m gives ~30 kN of clamp', do:()=>{setVib(false); document.getElementById('sT').value=60; retighten();}},
  {zh:'螺栓本身只受拉：横向载荷全靠夹紧面摩擦扛，螺栓不被剪',
   en:'The bolt sees pure tension; transverse load rides on clamp-face friction', do:()=>{setVib(false);}},
  {zh:'Junker 振动：横向滑移让螺纹面反复滑动，预紧力一格格泄掉',
   en:'Junker vibration: transverse slip walks the threads, preload bleeds away step by step', do:()=>{setMode('none'); setVib(true);}},
  {zh:'预紧归零 → 螺母倒转（看红条纹）、连接松脱失效',
   en:'At zero preload the nut backs off (watch the red stripe) and the joint fails', do:()=>{setMode('none'); F=6; setVib(true);}},
  {zh:'对策：对顶螺母 / 尼龙嵌入圈 / 楔形垫圈（爬斜面不回转）/ 超预紧',
   en:'Fixes: jam nut / nylon insert / wedge washers (climb, never spin back) / higher preload', do:()=>{setMode('wedge'); retighten(); setVib(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((stp,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?stp.en:stp.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps(); STEPS[i].do();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 动力学 ---- */
function stepPhysics(dt){
  camA+=2*Math.PI*HZ()*dt;
  if(vibOn&&playing){
    const Fn=clamp(F/40,0,1);
    const k=MODE_K[mode]*HZ()*2*(0.055+0.5*(1-Fn)*(1-Fn));
    F*=Math.exp(-k*dt);
  }
  const target=(F0>0.5)?clamp((F0-F)/Math.max(F0,1e-6),0,1)*2.2*MODE_BACK[mode]:0;
  backA+=(target-backA)*Math.min(1,dt*6);
}
function retighten(){
  F=FofT(TQ()); F0=F; backA=0;
  document.getElementById('sTVal').textContent=TQ()+' N·m';
}
function setVib(v){
  vibOn=v;
  if(v) F0=Math.max(F,0.5);
  document.getElementById('btnVib').classList.toggle('on',v);
  document.getElementById('btnVib').textContent=v?L('振动：开','Shaker: on'):L('振动：关','Shaker: off');
}
function setMode(m){
  mode=m;
  jamNut.visible=(m==='jam');
  nylonRing.visible=(m==='nylon');
  wedgeA.visible=wedgeB.visible=(m==='wedge');
  ['mNone','mJam','mNylon','mWedge'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(m==='none'?'mNone':m==='jam'?'mJam':m==='nylon'?'mNylon':'mWedge').classList.add('on');
}

/* ---- 统计 ---- */
function updateStats(){
  const loose=F<1.0;
  const fEl=document.getElementById('stF');
  fEl.innerHTML=Math.max(0,F).toFixed(1)+'<small> kN</small>';
  fEl.style.color=loose?'#ff8787':'';
  document.getElementById('stRem').innerHTML=(clamp(F/FofT(80),0,1)*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stHz').innerHTML=(vibOn?HZ():0).toFixed(0)+'<small> Hz</small>';
  document.getElementById('stRot').innerHTML=(backA*R2D).toFixed(0)+'<small> °</small>';
}

/* ---- UI ---- */
document.getElementById('btnVib').addEventListener('click',()=>setVib(!vibOn));
document.getElementById('btnTight').addEventListener('click',retighten);
document.getElementById('mNone').addEventListener('click',()=>setMode('none'));
document.getElementById('mJam').addEventListener('click',()=>setMode('jam'));
document.getElementById('mNylon').addEventListener('click',()=>setMode('nylon'));
document.getElementById('mWedge').addEventListener('click',()=>setMode('wedge'));
document.getElementById('sT').addEventListener('input',()=>{retighten();});
document.getElementById('sHz').addEventListener('input',e=>{
  document.getElementById('sHzVal').textContent=e.target.value+' Hz'; updateStats();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing) stepPhysics(dt);
  const Fmax=FofT(80);
  /* 偏心轮驱动横移（Junker）：销的横向分量推随动滚轮 */
  const xoff=vibOn?0.22*Math.cos(camA):0;
  movingG.position.x=xoff;
  camG.rotation.z=camA;
  /* 松脱表现：界面间隙张开 + 螺母倒转（楔形模式下移让出垫圈空间） */
  const loosen=clamp(1-F/Fmax,0,1);
  gapM.opacity=loosen*0.9;
  gapBarL.scale.y=1+loosen*8; gapBarR.scale.y=1+loosen*8;
  nutG.rotation.y=backA;
  nutG.position.y=(mode==='wedge')?-0.89:-0.75;
  /* 预紧发光条与标尺 */
  const fr=clamp(F/Fmax,0,1);
  tensionM.color.setHex(fr>0.35?0xffa94d:0xff6b6b);
  tensionM.opacity=0.25+fr*0.65;
  shankCore.scale.y=Math.max(0.1,fr);
  shankCore.position.y=0.55-0.55*Math.max(0.1,fr);
  meterFill.scale.y=Math.max(0.02,fr);
  meterFill.position.y=-1.05+fr*1.05;
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数与初始化 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
retighten();
applyTheme(); applyLang(); buildSteps(); start();
</script>
</body>
</html>
