<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<title>摩擦与黏滑 · 从冷焊到地震</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
  /* 应力锯齿波示波器 */
  #plot{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:4;
    border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);backdrop-filter:blur(6px)}
  @media(max-width:900px){#plot{display:none}}
</style>

  <h1 data-zh="摩擦与黏滑 · 从冷焊到地震" data-en="Friction & Stick-Slip · From Cold Welding to Quakes">摩擦与黏滑 · 从冷焊到地震</h1>
  <div class="sub" data-zh="真实接触面积≈名义面积万分之一→压强巨大发生冷焊；静摩擦＞动摩擦→弹簧攒力到峰值瞬间跳滑、拉力骤降、再攒再跳；看应力条爬红、锯齿波画线，切「地震类比」看断层版 · 拖动旋转 / 空格运行/暂停" data-en="Real contact is ~1/10000 of nominal area → huge pressure cold-welds asperities; static friction > kinetic → force builds, block jumps, force drops, repeat; watch the stress bar hit red and the sawtooth trace; try the quake analogy · drag to orbit / Space = run/pause">真实接触面积≈名义面积万分之一→压强巨大发生冷焊；静摩擦＞动摩擦→弹簧攒力到峰值瞬间跳滑、拉力骤降、再攒再跳；看应力条爬红、锯齿波画线，切「地震类比」看断层版 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 物理模型（SI 单位，渲染 1 单位 = 0.1 m） =================
   弹簧-滑块-皮带：皮带以 v₀ 匀速前进，滑块被弹簧拽在墙边。
   黏着：滑块随皮带走，F=k·Δx 攒升；F ≥ μs·N 瞬间跳滑。
   滑动：动摩擦 μk·N(＜μs·N) 顶不住弹簧，滑块回缩、F 骤降，v 降回 v₀ 重新黏住。
   静摩擦愈合(Dieterich 型)：μs = μs0 + Δμ·log10(1+t黏/0.3s) —— 黏得越久峰值越高，
   所以慢拉（黏着时间长）每次应力降更大。润滑把 μs0 0.65→0.13、μk 0.45→0.11，
   剪切从固-固界面移到液层内部，黏滑被抑制。全部为标准黏滑实验模型。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const SC=10;                        // 米 → 世界单位
const M=2, K=150, XW=-0.70, L0=0.5; // 质量 kg、劲度 N/m、墙位、自然长
let v0=0.18, Nload=100;             // 拉速 m/s、法向载荷 N
let lub=false, fault=false;
const muS0=()=>lub?0.13:0.75, muK=()=>lub?0.11:0.35;
/* 静摩擦愈合(Dieterich 型)：黏得越久峰值越高 → 慢拉每次应力降更大 */
const heal=t=>Math.min(lub?0.24:1.0, muS0()+(lub?0.04:0.18)*Math.log10(1+t/0.3));
let xb=0.05, vb=0, stuck=true, tStick=0, F=0, events=0, lastDrop=0, Fpeak=0;
let playing=true, labelsOn=true, simT=0, beltOff=0;

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(2.5,5.2,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.5,1.0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=50;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(5,9,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,5,-5); scene.add(fill);

const world=new THREE.Group(); scene.add(world); // 震动时整体抖这一组
/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const beltM=new THREE.MeshStandardMaterial({color:0x2b323c,roughness:0.9});
const chevM=new THREE.MeshStandardMaterial({color:0x4a5560,roughness:0.8});
const blockM=new THREE.MeshStandardMaterial({color:0xc0662f,roughness:0.55,metalness:0.25});
const wallM=new THREE.MeshStandardMaterial({color:0x3a424d,roughness:0.7,metalness:0.4});
const springM=new THREE.LineBasicMaterial({color:0xffd43b});
const barFrameM=new THREE.MeshStandardMaterial({color:0x39424d,roughness:0.6});
const fillM=new THREE.MeshBasicMaterial({color:0x74c0fc});
const enerM=new THREE.MeshBasicMaterial({color:0xffa94d});
const filmM=new THREE.MeshStandardMaterial({color:0x339af0,transparent:true,opacity:0.55,roughness:0.15});
const pegM=new THREE.MeshStandardMaterial({color:0x8f9aa6,roughness:0.7});
const spotM=new THREE.MeshBasicMaterial({color:0xffe066});
const ringM=new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.85,side:THREE.DoubleSide});
const tickM=new THREE.MeshBasicMaterial({color:0xff6b6b});
const tick2M=new THREE.MeshBasicMaterial({color:0x74c0fc});

/* ---- 场景搭建 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(46,0.3,9),groundM);
ground.position.set(2,-0.55,0); world.add(ground);
const belt=new THREE.Mesh(new THREE.BoxGeometry(32,0.3,2.6),beltM);
belt.position.set(2,-0.25,0); world.add(belt);
const beltWall=new THREE.Mesh(new THREE.BoxGeometry(0.35,1.6,2.6),wallM);
beltWall.position.set(XW*SC,0.25,0); world.add(beltWall); // 左墙(弹簧锚)
const chevs=[];
for(let i=0;i<32;i++){ // 皮带表面花纹，随 v₀ 移动以显示输送方向
  const c=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.03,2.2),chevM);
  c.userData.o=i*0.92; c.position.y=-0.07; chevs.push(c); world.add(c);
}
const block=new THREE.Mesh(new THREE.BoxGeometry(2.0,1.2,1.6),blockM);
block.position.set(xb*SC,0.6,0); world.add(block);
const film=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.08,1.6),filmM);
film.position.set(0,0.04,0); film.visible=false; world.add(film); // 润滑油膜
/* 微凸体接触点（第 1 步特写）：底面散点 */
const spots=new THREE.Group();
for(let i=0;i<9;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),spotM);
  s.position.set(-0.7+1.4*Math.random(),-0.5, -0.55+1.1*((i*37)%10)/9);
  spots.add(s);
}
spots.visible=false; block.add(spots);
/* 断层模式的剪切销钉排 */
const pegs=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.05,0.05,0.7,6),pegM,14);
pegs.visible=false; world.add(pegs);
const dummy=new THREE.Object3D();
for(let i=0;i<14;i++){dummy.position.set(-6.5+i*1.0,0.35,-1.9);dummy.updateMatrix();pegs.setMatrixAt(i,dummy.matrix);}
/* 弹簧：折线，逐帧改顶点 */
const SPN=44, spPos=new Float32Array(SPN*3);
const springGeo=new THREE.BufferGeometry();
springGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
const spring=new THREE.Line(springGeo,springM); world.add(spring);
/* 应力条 + 能量条 */
function makeBar(x){
  const g=new THREE.Group();
  const fr=new THREE.Mesh(new THREE.BoxGeometry(0.5,3.4,0.12),barFrameM); fr.position.y=1.7; g.add(fr);
  const fi=new THREE.Mesh(new THREE.BoxGeometry(0.36,3.2,0.14),fillM.clone());
  fi.position.y=0.02; fi.geometry.translate(0,1.6,0); g.add(fi);
  g.position.set(x,0.2,-1.2); world.add(g);
  return {g,fi};
}
const stressBar=makeBar(11.5), energyBar=makeBar(12.9);
energyBar.fi.material=enerM;
const tickS=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.05,0.2),tickM); world.add(tickS);   // 静摩擦峰值线
const tickK=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.05,0.2),tick2M); world.add(tickK);  // 动摩擦线
/* 跳滑波纹（复用池） */
const ripples=[];
for(let i=0;i<4;i++){
  const r=new THREE.Mesh(new THREE.RingGeometry(0.8,1.0,40),ringM.clone());
  r.rotation.x=-Math.PI/2; r.position.y=0.03; r.visible=false; world.add(r);
  ripples.push({m:r,t:1});
}

/* ---- CSS2D 标签 ---- */
const labelReg=[];
function addLabel(fn,pos,cls='',vis=()=>true,parent=world){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,fn,vis});div.textContent=fn();return o;
}
addLabel(()=>L(fault?'断层上盘（锁死的岩块）':'滑块 m=2 kg',fault?'Hanging wall (locked)':'Block m=2 kg'),new THREE.Vector3(0,1.5,0),'o');
addLabel(()=>L(fault?'皮带＝被拖曳的下盘板块':'皮带 v₀＝驱动端',fault?'Belt = dragged footwall':'Belt v₀ = driver'),new THREE.Vector3(0,-0.35,3.1),'b');
addLabel(()=>L('弹簧攒力 → 骤滑','Spring builds → sudden slip'),new THREE.Vector3(-3.2,1.3,0),'g');
addLabel(()=>L('微凸体冷焊接触点','Cold-welded asperity contacts'),new THREE.Vector3(0,-0.9,1.2),'r',()=>spots.visible);
addLabel(()=>L('应力条：红线=静摩擦峰值 μs·N','Stress: red tick = static peak μs·N'),new THREE.Vector3(11.5,3.9,-1.2),'r',()=>!fault);
addLabel(()=>L('断层剪应力','Fault shear stress'),new THREE.Vector3(11.5,3.9,-1.2),'r',()=>fault);

/* ---- 状态与 UI ---- */
function resetSim(){
  stuck=true; vb=v0; tStick=0; lastDrop=0;
  xb=XW+L0+0.15*muS0()*Nload/K; // 从约 15% 峰值应力起攒
  F=K*(xb-XW-L0); hist.length=0;
  ripples.forEach(r=>{r.t=1;r.m.visible=false;});
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  beltM.color.setHex(dark?(fault?0x4a3a30:0x2b323c):(fault?0xb8a294:0x9fb0c3));
  blockM.color.setHex(dark?0xc0662f:0xb3541e);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'真实接触只有微凸体：接触点总面积≈名义面积万分之一，压强巨大→冷焊',en:'Real contact: asperity spots total ~1/10000 of nominal area → huge pressure cold-welds'},
 {zh:'静摩擦锁死：弹簧拉力攒到峰值 μs·N 之前，滑块纹丝不动',en:'Static lock: block frozen while spring force builds toward the μs·N peak'},
 {zh:'黏滑振荡：越过峰值瞬间跳滑、拉力骤降、再攒再跳——锯齿应力波',en:'Stick-slip: break away, force drops, rebuild, repeat — the sawtooth'},
 {zh:'润滑剂：剪切面移进液层内部，μ 骤降、黏滑被抑制',en:'Lubricant: shear moves inside the fluid film, μ collapses, stick-slip damped'},
 {zh:'拉得越慢跳得越猛：黏着久→静摩擦愈合→每次应力降更大',en:'Slower pull = longer stick = friction healing = bigger stress drops'},
 {zh:'地震同构：断层＝巨大滑块，攒应变-突错动就是黏滑放大十万倍',en:'Quake analogy: a fault is this block scaled 100000× — strain, then rupture'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function gotoStep(i){
  activeStep=i;syncSteps();
  setFault(i===5);
  setLub(i===3);
  if(i===0){playing=false;resetSim();spots.visible=true;}
  else{
    spots.visible=(i===0);
    resetSim();
    if(i===1){ // 预置到峰值前 96%，暂停观察攒力
      xb=XW+L0+0.96*heal(1.0)*Nload/K;F=K*(xb-XW-L0);playing=false;
    }else{
      if(i===4){v0=0.03;document.getElementById('sV0').value=0.03;}
      playing=true;
    }
  }
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  updateStats();
}
function updateStats(){
  document.getElementById('stF').innerHTML=F.toFixed(1)+'<small> N</small>';
  document.getElementById('stState').textContent=fault?(stuck?L('锁死','LOCKED'):L('错动!','SLIP!')):(stuck?L('静黏','STICK'):L('滑动','SLIP'));
  document.getElementById('stDrop').innerHTML=lastDrop.toFixed(1)+'<small> N</small>';
  document.getElementById('stN').textContent=events;
}

/* ---- 物理步进 ---- */
let shake=0;
function physics(dt){
  simT+=dt;
  if(stuck){
    vb=v0; xb+=vb*dt; tStick+=dt;
    F=K*(xb-XW-L0);
    if(F>=heal(tStick)*Nload){ // 越过静摩擦峰值 → 跳滑
      stuck=false; events++; Fpeak=F; shake=fault?1:0.3;
      spawnRipple(0.35+(fault?0.9:0));
    }
  }else{
    F=K*(xb-XW-L0);
    const a=(muK()*Nload-F)/M;  // 皮带比滑块快 → 动摩擦向前
    vb+=a*dt; xb+=vb*dt;
    if(F<lastDrop||lastDrop===0)lastDrop=F; // 记录谷值
    if(vb>=v0){vb=v0;stuck=true;tStick=0;lastDrop=Math.max(0,Fpeak-lastDrop);}
  }
}
function spawnRipple(s){
  const r=ripples.find(r=>r.t>=1)||ripples[0];
  r.t=0;r.m.visible=true;r.m.scale.set(s,s,1);
  r.m.position.x=block.position.x;
}

/* ---- 应力锯齿波示波器 ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
const hist=[];
let PC={};
function refreshPlotColors(){
  const cs=getComputedStyle(htmlEl);
  PC={txt:cs.getPropertyValue('--text2'),acc:THEME==='dark'?'#ffa94d':'#e8590c',
      grid:THEME==='dark'?'rgba(255,255,255,.08)':'rgba(15,25,40,.12)',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',blue:THEME==='dark'?'#74c0fc':'#1864ab'};
}
function drawPlot(){
  const W=plot.width,H=plot.height,fs=1.05*Nload; // 满量程
  pctx.clearRect(0,0,W,H);
  pctx.fillStyle=THEME==='dark'?'rgba(15,17,19,.6)':'rgba(255,255,255,.6)';
  pctx.fillRect(0,0,W,H);
  pctx.strokeStyle=PC.grid;pctx.lineWidth=1;
  for(let i=1;i<4;i++){pctx.beginPath();pctx.moveTo(0,H*i/4);pctx.lineTo(W,H*i/4);pctx.stroke();}
  const y=v=>H-6-(H-18)*clamp(v/fs,0,1);
  // 动摩擦(蓝虚线)与静摩擦峰值(红虚线)
  pctx.setLineDash([4,4]);
  pctx.strokeStyle=PC.blue;pctx.beginPath();pctx.moveTo(0,y(muK()*Nload));pctx.lineTo(W,y(muK()*Nload));pctx.stroke();
  pctx.strokeStyle=PC.red;pctx.beginPath();pctx.moveTo(0,y(heal(tStick)*Nload));pctx.lineTo(W,y(heal(tStick)*Nload));pctx.stroke();
  pctx.setLineDash([]);
  // F(t) 锯齿
  pctx.strokeStyle=PC.acc;pctx.lineWidth=2;pctx.beginPath();
  hist.forEach((p,i)=>{const x=i/(hist.length-1||1)*W;i?pctx.lineTo(x,y(p)):pctx.moveTo(x,y(p));});
  pctx.stroke();pctx.lineWidth=1;
  pctx.fillStyle=PC.txt;pctx.font='11px sans-serif';
  pctx.fillText(L('弹簧拉力 F (N) — 锯齿=黏滑','Spring force F (N) — sawtooth = stick-slip'),8,14);
  pctx.fillStyle=PC.red;pctx.fillText('μs·N',W-40,y(heal(tStick)*Nload)-3);
  pctx.fillStyle=PC.blue;pctx.fillText('μk·N',W-40,y(muK()*Nload)+12);
}

/* ---- 交互 ---- */
document.getElementById('btnLub').addEventListener('click',()=>setLub(!lub));
document.getElementById('btnFault').addEventListener('click',()=>setFault(!fault));
document.getElementById('btnSlip').addEventListener('click',()=>{ // 直接顶到峰值
  if(stuck){xb=XW+L0+(heal(tStick)*Nload+1)/K;F=K*(xb-XW-L0);}
});
document.getElementById('btnReset').addEventListener('click',resetSim);
function setLub(v){
  lub=v;film.visible=v;
  document.getElementById('btnLub').classList.toggle('on',v);
  document.getElementById('btnLub').textContent=L(v?'润滑剂 开':'润滑剂 关',v?'Lubricant ON':'Lubricant OFF');
}
function setFault(v){
  fault=v;pegs.visible=v;
  document.getElementById('btnFault').classList.toggle('on',v);
  document.getElementById('btnFault').textContent=L(v?'地震类比 开':'地震类比 关',v?'Quake analogy ON':'Quake analogy OFF');
  applyTheme();
}
document.getElementById('sV0').addEventListener('input',e=>{
  v0=+e.target.value;document.getElementById('sV0Val').textContent=v0.toFixed(2)+' m/s';});
document.getElementById('sN').addEventListener('input',e=>{
  Nload=+e.target.value;document.getElementById('sNVal').textContent=Nload+' N';});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* URL 参数：?pause=1 ?labels=0 ?speed=拉速 */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){v0=clamp(parseFloat(qp.get('speed')),0.02,0.6);
  document.getElementById('sV0').value=v0;document.getElementById('sV0Val').textContent=v0.toFixed(2)+' m/s';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    physics(dt);
    hist.push(F);if(hist.length>380)hist.shift();
  }
  /* 皮带花纹流动 */
  beltOff=(beltOff+v0*dt*SC*(playing?1:0))%0.92;
  chevs.forEach(c=>{c.position.x=2-15.3+((c.userData.o+beltOff)%29.9);});
  /* 滑块与弹簧 */
  block.position.x=xb*SC;
  film.position.x=xb*SC;
  const x0=XW*SC+0.2,x1=xb*SC-1.0,yc=0.62,dx=x1-x0;
  const amp=0.07+0.14*clamp(F/(Nload*0.95),0,1.4);
  for(let i=0;i<SPN;i++){
    const t=i/(SPN-1);
    spPos[i*3]=x0+dx*t;
    spPos[i*3+1]=yc+(i>0&&i<SPN-1?Math.sin(t*Math.PI*18)*amp*(0.35+0.65*Math.sin(Math.PI*t)):0);
    spPos[i*3+2]=0;
  }
  springGeo.attributes.position.needsUpdate=true;
  /* 应力条/能量条 */
  const fs=Nload,fF=clamp(F/fs,0,1.05),H=3.2;
  stressBar.fi.scale.y=Math.max(0.02,fF);
  stressBar.fi.position.y=0.02;
  const c=fF>0.85?0xff6b6b:(fF>0.6?0xffa94d:0x74c0fc);
  stressBar.fi.material.color.setHex(c);
  energyBar.fi.scale.y=Math.max(0.02,clamp(F*F/(2*K)/(fs*fs/(2*K)),0,1));
  tickS.position.set(11.5,0.2+heal(tStick)*Nload/fs*H,-1.2);
  tickK.position.set(12.9,0.2+muK()*Nload/fs*H,-1.2);
  /* 销钉剪切角随应力 */
  if(pegs.visible){
    const th=0.4*clamp(F/fs,0,1.2);
    for(let i=0;i<14;i++){
      dummy.position.set(-6.5+i*1.0,0.35,-1.9);
      dummy.rotation.z=-th*(0.7+0.3*Math.sin(i*1.7));
      dummy.updateMatrix();pegs.setMatrixAt(i,dummy.matrix);
    }
    pegs.instanceMatrix.needsUpdate=true;
  }
  /* 波纹扩散 */
  for(const r of ripples){
    if(r.t<1){r.t=Math.min(1,r.t+dt*(fault?1.1:1.8));
      const s=(0.35+(fault?0.9:0))+r.t*5*(fault?2.2:1);
      r.m.scale.set(s,s,1);r.m.material.opacity=0.85*(1-r.t);
      r.m.visible=r.t<1;}
  }
  /* 跳滑震动 */
  if(shake>0.01){world.position.set((Math.random()-0.5)*shake*0.5,0,(Math.random()-0.5)*shake*0.3);shake*=Math.pow(0.001,dt);}
  else world.position.set(0,0,0);
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();resetSim();
activeStep=2;syncSteps();drawPlot();start();
</script>
