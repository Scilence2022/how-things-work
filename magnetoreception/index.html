<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>候鸟磁导航 · 眼里的量子罗盘</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1864ab;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

  <h1 data-zh="候鸟磁导航" data-en="Magnetoreception in Migrating Birds">候鸟磁导航</h1>
  <div class="sub" data-zh="候鸟眼里装着一台量子传感器:隐花色素吸一枚蓝光光子,击出的电子对在磁场里以不同速率自旋转换,反应产率的差被视网膜读成明暗图案——倾角罗盘只看磁力线的俯角,不看南北极 · 拖动旋转 / 空格运行/暂停" data-en="A migrating bird carries a quantum sensor in its eye: cryptochrome absorbs a blue photon, the ejected radical pair interconverts between spin states at field-dependent rates, and the yield difference is painted onto the retina as a light-dark pattern — an inclination compass reads only the dip of the field lines, never the poles · drag to orbit / Space = run/pause">候鸟眼里装着一台量子传感器:隐花色素吸一枚蓝光光子,击出的电子对在磁场里以不同速率自旋转换,反应产率的差被视网膜读成明暗图案——倾角罗盘只看磁力线的俯角,不看南北极 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0f18,30,95);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-7.2,5.4,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0x8fb0e0,0x0b0f16,0.5));
const key=new THREE.DirectionalLight(0xcfe0ff,0.9);key.position.set(6,12,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x44639c,0.35);fill.position.set(-8,5,-7);scene.add(fill);

/* ---- 夜色地面与海岸 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x10161f,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const seaM=new THREE.MeshStandardMaterial({color:0x0c2438,roughness:0.18,metalness:0.2});
const sea=new THREE.Mesh(new THREE.CircleGeometry(17,40),seaM);
sea.rotation.x=-Math.PI/2;sea.position.set(13,0.02,4);scene.add(sea);
const hillM=new THREE.MeshStandardMaterial({color:0x17202c,roughness:0.9,flatShading:true});
[[-13,-5,2.6,2.4],[-9,4.5,2,1.8],[-16.5,1,3.2,3]].forEach(([x,z,r,h])=>{
  const hill=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),hillM);
  hill.position.set(x,h/2,z);scene.add(hill);
});
{
  const starGeo=new THREE.BufferGeometry(),sp=new Float32Array(240*3);
  for(let i=0;i<240;i++){
    const a=Math.random()*Math.PI*2,el=0.15+Math.random()*1.35,r=55+Math.random()*20;
    sp[i*3]=Math.cos(a)*Math.cos(el)*r;sp[i*3+1]=Math.sin(el)*r;sp[i*3+2]=Math.sin(a)*Math.cos(el)*r;
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
  var stars=new THREE.Points(starGeo,
    new THREE.PointsMaterial({color:0xcfe0ff,size:0.5,transparent:true,opacity:0.85,fog:false}));
  scene.add(stars);
}

/* ---- 候鸟(简单几何体拼装,朝 +z 飞)---- */
const birdG=new THREE.Group();scene.add(birdG);
const birdM=new THREE.MeshStandardMaterial({color:0x39435a,roughness:0.5,metalness:0.1});
const wingM=new THREE.MeshStandardMaterial({color:0x323c52,roughness:0.55});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.62,6,12),birdM);
body.rotation.x=Math.PI/2;birdG.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),birdM);head.position.set(0,0.09,0.5);birdG.add(head);
const beak=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.2,8),
  new THREE.MeshStandardMaterial({color:0xe8890c,roughness:0.5}));
beak.rotation.x=Math.PI/2;beak.position.set(0,0.06,0.67);birdG.add(beak);
const tail=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.02,0.2),wingM);
tail.position.set(0,0.03,-0.52);tail.rotation.x=-0.18;birdG.add(tail);
const wingL=new THREE.Group();wingL.position.set(0.1,0.06,0.05);
const wl=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.025,0.45),wingM);wl.position.x=0.55;wingL.add(wl);birdG.add(wingL);
const wingR=new THREE.Group();wingR.position.set(-0.1,0.06,0.05);
const wr=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.025,0.45),wingM);wr.position.x=-0.55;wingR.add(wr);birdG.add(wingR);

/* ---- 地球磁力线束(倾角可调)---- */
const fieldG=new THREE.Group();fieldG.position.set(0,2.6,0);scene.add(fieldG);
const fLineM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.45});
for(let i=0;i<9;i++){
  const z=(i-4)*1.15,y0=0.4+Math.abs(i-4)*0.42;
  const geo=new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-17,y0,z),new THREE.Vector3(17,y0,z)]);
  fieldG.add(new THREE.Line(geo,fLineM));
}
/* 场向箭头锥已删除:旋转后仅一枚可见,悬在半空被误读为孤立碎片;倾角含义由磁力线束+罗盘标签承担 */

/* 视网膜上的一对明暗扇形 */
const retG=new THREE.Group();retG.position.set(0.55,0,0);retG.rotation.y=-Math.PI/2;eyeG.add(retG);
const retBase=new THREE.Mesh(new THREE.CircleGeometry(1.5,32),
  new THREE.MeshBasicMaterial({color:0x14304f,transparent:true,opacity:0.35,side:THREE.DoubleSide,depthWrite:false}));
retBase.position.z=-0.02;retG.add(retBase);
const sectorB=new THREE.Mesh(new THREE.CircleGeometry(1.32,24,-0.55,1.1),
  new THREE.MeshBasicMaterial({color:0xaad4ff,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false}));
retG.add(sectorB);
const sectorD=new THREE.Mesh(new THREE.CircleGeometry(1.32,24,Math.PI-0.55,1.1),
  new THREE.MeshBasicMaterial({color:0x04080e,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false}));
retG.add(sectorD);
/* 隐花色素:小棒束 + 黄素发色团 + 自由基对自旋箭头 */
const crG=new THREE.Group();crG.position.set(0.25,0,0);eyeG.add(crG);
const rodM=new THREE.MeshStandardMaterial({color:0x40c99e,roughness:0.4,emissive:0x0a2e24,emissiveIntensity:0.7});
for(let i=0;i<6;i++){
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.024,0.024,0.5,6),rodM);
  rod.rotation.set(Math.sin(i*12.9)*1.4,i*1.05,Math.cos(i*7.7)*1.4);
  rod.position.set(Math.sin(i*2.4)*0.12,Math.cos(i*1.7)*0.12,Math.sin(i*5.1)*0.12);
  crG.add(rod);
}
const fadM=new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xffe066,emissiveIntensity:1});
const fad=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,10),fadM);crG.add(fad);
const UP=new THREE.Vector3(0,1,0);
const preG=new THREE.Group();crG.add(preG);
const spin1=new THREE.Group(),spin2=new THREE.Group();preG.add(spin1,spin2);
const cone1=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.2,8),
  new THREE.MeshStandardMaterial({color:0xb197fc,emissive:0xb197fc,emissiveIntensity:0.9}));
cone1.rotation.z=1.15;cone1.position.set(0.1,0.06,0);spin1.add(cone1);
const cone2=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.2,8),
  new THREE.MeshStandardMaterial({color:0xe599f7,emissive:0xe599f7,emissiveIntensity:0.9}));
cone2.rotation.z=-1.15;cone2.position.set(-0.1,-0.06,0);spin2.add(cone2);
const crWorld=eyeG.position.clone().add(new THREE.Vector3(0.25,0,0));
/* 蓝光光子 */
const NP=7;
const photonMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),
  new THREE.MeshBasicMaterial({color:0xbfe0ff}),NP);
scene.add(photonMesh);
const photons=[];for(let i=0;i<NP;i++)photons.push({t:-1,from:new THREE.Vector3()});

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let dip=65,dipSign=1,lightV=70,B=48,jamT=0,yieldS=10;
let thE=0.6,thJ=0,dir=1,jamW=0,fieldRot=dipSign*65*Math.PI/180;
let prevX=null,prevZ=null,headingDeg=90;
let spawnT=0.6,flashT=0,ph1=0,ph2=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('隐花色素:吸蓝光的感光蛋白','Cryptochrome: the blue-light sensor'),new THREE.Vector3(8.6,6.1,1.6),'g');
addLabel(()=>L('自由基对:两枚自旋箭头','Radical pair: two spin arrows'),new THREE.Vector3(7.8,2.3,1.6),'r',()=>lightV>4);/* 锚点左移靠向眼球,避免被右缘截断 */
const fieldLbl=addLabel(()=>L('磁力线:倾角 = 俯角','Field lines: dip = inclination'),new THREE.Vector3(2.5,7.4,0),'b',()=>fieldG.visible);/* 半径收短、基准降低,避免贴屏幕上缘 */
const compLbl=addLabel(()=>L('倾角罗盘读数','Inclination-compass readout'),new THREE.Vector3(0,5,0),'y');

function setDip(v){dip=v;document.getElementById('sDip').value=v;
  document.getElementById('sDipVal').textContent=v+'°';}
function setLight(v){lightV=v;document.getElementById('sLight').value=v;
  document.getElementById('sLightVal').textContent=v+'%';}
function onBtn(id){['bNorm','bFlip','bJam'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'地磁只有 25–65 μT:靠什么感知',en:'Earth\'s field is a mere 25–65 μT: what could possibly sense it',
  act(){onBtn('bNorm');dipSign=1;jamT=0;B=48;setDip(65);setLight(70);}},
 {zh:'隐花色素吸收蓝光,电子对进入纠缠态',en:'Cryptochrome absorbs a blue photon; the radical pair goes entangled',
  act(){setLight(95);}},
 {zh:'磁场改变两个自旋态间的转换速率',en:'The field shifts the interconversion rate between the two spin states',
  act(){setDip(50);setLight(80);}},
 {zh:'产率差→视网膜上的明暗图案',en:'Yield gap → a light-and-dark pattern painted on the retina',
  act(){setDip(65);setLight(100);}},
 {zh:'倾角罗盘:只读俯角、不辨极性',en:'Inclination compass: it reads the dip angle, never the polarity',
  act(){setDip(75);document.getElementById('bFlip').click();}},
 {zh:'夜航校准:磁暴会带走一整队的航线',en:'Night-flight calibration: a magnetic storm sweeps whole flocks off course',
  act(){onBtn('bJam');jamT=8;B=320;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stDip').innerHTML=dip.toFixed(0)+'<small> °</small>';
  document.getElementById('stYield').innerHTML=yieldS.toFixed(1)+'<small> %</small>';
  document.getElementById('stHead').innerHTML=headingDeg.toFixed(0)+'<small> °</small>';
  const bEl=document.getElementById('stB');
  bEl.innerHTML=B.toFixed(0)+'<small> μT</small>';
  bEl.className='v '+(jamT>0?'warn':'ok');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bNorm').addEventListener('click',()=>{dipSign=1;jamT=0;B=48;dir=dipSign;onBtn('bNorm');});
document.getElementById('bFlip').addEventListener('click',()=>{dipSign*=-1;dir=dipSign;onBtn('bFlip');});
document.getElementById('bJam').addEventListener('click',()=>{jamT=6;B=320;onBtn('bJam');});
document.getElementById('sDip').addEventListener('input',e=>setDip(+e.target.value));
document.getElementById('sLight').addEventListener('input',e=>setLight(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglField').addEventListener('change',e=>{fieldG.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0a0f18:0xdde4ed);
  scene.fog.color.setHex(dark?0x0a0f18:0xdde4ed);
  groundM.color.setHex(dark?0x10161f:0xc2cbd8);
  seaM.color.setHex(dark?0x0c2438:0x9db9d6);
  stars.visible=dark;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpV=new THREE.Vector3(),tmpT=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 强磁干扰计时 */
  const jam=jamT>0;
  if(jam){jamT-=dts;B+=(320-B)*Math.min(1,dts*8);
    if(jamT<=0){jamT=0;B=48;onBtn('bNorm');}}
  /* 磁力线随倾角倾斜 */
  const dipRad=dip*Math.PI/180;
  fieldRot+=(dipSign*dipRad-fieldRot)*Math.min(1,dts*3);
  fieldG.rotation.z=fieldRot+(jam?(Math.random()-0.5)*0.05:0);
  fLineM.opacity=jam?0.15+Math.random()*0.3:0.45;
  fieldLbl.position.set(Math.cos(fieldRot)*5,2.4+Math.sin(fieldRot)*5,0);/* 半径 6.5→5、基准 2.6→2.4:标签不再顶到屏幕上缘 */
  /* 产率差模型:场强 × 蓝光 × 俯角 */
  let y=30*(B/48)*(0.30+0.70*lightV/100)*(0.25+0.75*Math.sin(dipRad));
  if(jam)y=3.5+Math.random()*4.5;
  y=clamp(y,0,45);yieldS+=(y-yieldS)*Math.min(1,dts*4);
  /* 鸟的航线:椭圆巡航;受扰时原地盘旋 */
  jamW+=((jam?1:0)-jamW)*Math.min(1,dts*2);
  thE+=0.22*dts*dir;thJ+=1.2*dts;
  const ex=7.5*Math.cos(thE),ez=4.2*Math.sin(thE);
  const cx=3+2.1*Math.cos(thJ),cz=1+2.1*Math.sin(thJ);
  const bx=ex+(cx-ex)*jamW,bz=ez+(cz-ez)*jamW,by=3.6+0.25*Math.sin(thE*2);
  if(prevX!==null){
    const dx=bx-prevX,dz=bz-prevZ;
    if(dx*dx+dz*dz>1e-8){
      headingDeg=((Math.atan2(dz,dx)*180/Math.PI)%360+360)%360;
      birdG.lookAt(bx+dx*8,by,bz+dz*8);
    }
  }else birdG.lookAt(bx,by,bz+0.1);
  prevX=bx;prevZ=bz;
  birdG.position.set(bx,by,bz);
  const flap=Math.sin(simT*(jam?15:9))*0.55;
  wingL.rotation.z=flap;wingR.rotation.z=-flap;
  /* 自旋进动:绕磁场方向,两电子速率不同 */
  tmpT.set(Math.cos(fieldRot),Math.sin(fieldRot),0).normalize();
  preG.quaternion.setFromUnitVectors(UP,tmpT);
  let r1=0.8+2.4*(B/48)*(0.35+0.65*lightV/100);
  if(jam)r1*=2.5+Math.random()*2;
  ph1+=r1*dts;ph2+=r1*(1.15+0.012*yieldS)*dts;
  spin1.rotation.y=ph1;spin2.rotation.y=ph2;
  /* 蓝光光子飞入隐花色素 */
  spawnT-=dts*(0.25+1.5*lightV/100);
  if(spawnT<=0){spawnT=0.8+Math.random()*0.6;
    const p=photons.find(p=>p.t<0);
    if(p){p.t=0;p.from.set(crWorld.x+(Math.random()-0.5)*2.4,crWorld.y+3.2,crWorld.z+(Math.random()-0.5)*2.4);}}
  let n=0;
  for(const p of photons){
    if(p.t>=0){p.t+=dts/0.75;
      if(p.t>=1){p.t=-1;flashT=0.35;m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
      else{tmpV.lerpVectors(p.from,crWorld,p.t*p.t*(3-2*p.t));
        m4.makeScale(1,1,1);m4.setPosition(tmpV.x,tmpV.y,tmpV.z);}}
    else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    photonMesh.setMatrixAt(n++,m4);
  }
  photonMesh.instanceMatrix.needsUpdate=true;
  flashT=Math.max(0,flashT-dts);
  fadM.emissiveIntensity=1+flashT*7;
  /* 视网膜明暗扇形:产率差 = 对比度 */
  const sig=clamp(yieldS/45,0,1);
  sectorB.material.opacity=(0.16+0.72*sig)*(jam?0.45+Math.random()*0.4:1);
  sectorD.material.opacity=(0.95-0.5*sig)*(jam?0.5+Math.random()*0.35:1);
  retG.rotation.z+=dts*(jam?2.4:0.12)*dipSign;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  compLbl.position.set(bx,by+1.05,bz);
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
applyTheme();buildSteps();
setDip(65);setLight(70);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
