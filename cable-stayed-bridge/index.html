<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斜拉桥 · 直线张拉的弹性吊点</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0e1420; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#e7edf4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="斜拉桥 · 直线张拉的弹性吊点" data-en="Cable-Stayed Bridge · Straight-Tensioned Elastic Supports">斜拉桥 · 直线张拉的弹性吊点</h1>
  <div class="sub" data-zh="斜拉索不走抛物线——每根索都是直线张拉的弹性支点,直接把梁的重量拉上塔;塔吃压力(全部竖直分量沿塔叠到塔底约数十万吨),梁吃轴压(水平分量往塔挤),主梁因此可以做薄;不用锚碇,山地与软土都能建——苏通大桥 1088 m 主跨、306 m 塔、最长索 580 m · 3D 交互演示 · 拖动旋转 / 空格运行/暂停(画面为示意缩比、索数简化,数值面板给真实量级)" data-en="Cable stays don't hang in a parabola — every stay is a straight, tensioned elastic support hauling the deck's weight straight up the pylon; the pylon takes compression (all vertical components stack at the base into hundreds of thousands of tons-force), the girder takes axial compression (horizontal components squeeze it toward the pylons), so the girder can stay thin; no anchorage needed — buildable in mountains and on soft soil. Sutong Bridge: 1,088 m main span, 306 m pylons, longest stay 580 m · 3D interactive demo · drag to orbit / Space = run/pause (scene is schematic with fewer stays; the panel shows true magnitudes)">斜拉桥 · 直线张拉的弹性吊点</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="单索最大张力" data-en="Max stay tension">单索最大张力</span><span class="v" id="stTmax">—</span>
  <span class="k" data-zh="塔底轴力(每塔)" data-en="Tower-base axial">塔底轴力(每塔)</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="梁内轴压力" data-en="Girder axial force">梁内轴压力</span><span class="v" id="stAx">—</span>
  <span class="k" data-zh="跨中挠度" data-en="Midspan deflection">跨中挠度</span><span class="v" id="stDefl">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v" id="stStat">—</span>
</div>

<div id="plot">
  <h3 data-zh="索力账本(塔→跨中):柱=单索张力,橙线=梁内轴压累计,虚线=塔底轴力" data-en="Force ledger (pylon→midspan): bars = stay tension, orange = girder axial build-up, dashed = tower-base axial">索力账本(塔→跨中):柱=单索张力,橙线=梁内轴压累计,虚线=塔底轴力</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝:斜拉索(直线张拉,受拉;亮/红=索力大)" data-en="blue: stays (straight & tensioned; bright/red = high force)">蓝:斜拉索(直线张拉,受拉;亮/红=索力大)</span>
    <span class="chip.o" data-zh="橙:桥塔与基础(纯受压,轴力逐层叠加)" data-en="orange: pylons & foundation (pure compression, stacking)">橙:桥塔与基础(纯受压,轴力逐层叠加)</span>
    <span class="chip.g" data-zh="绿:薄主梁(弹性支承上的梁,纵向吃轴压)" data-en="green: thin girder (beam on elastic supports, axially squeezed)">绿:薄主梁(弹性支承上的梁,纵向吃轴压)</span>
    <span class="chip.r" data-zh="箭头:荷载路径 桥面→索→塔→基础" data-en="arrows: load path deck→stay→pylon→foundation">箭头:荷载路径 桥面→索→塔→基础</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnTruck" data-zh="货车过桥(播放)" data-en="Truck crossing (play)">货车过桥(播放)</button>
    <button class="abtn" id="btnCut" data-zh="拆掉背索" data-en="Remove back-stays">拆掉背索</button>
    <button class="abtn" id="btnHeat" data-zh="索力热图" data-en="Force heatmap">索力热图</button>
  </div>
  <div class="row"><label data-zh="货车位置" data-en="Truck position">货车位置</label><input id="sPos" type="range" min="0" max="1688" step="4" value="1240"><span class="val" id="sPosVal">1240 m</span></div>
  <div class="row"><label data-zh="货车重量" data-en="Truck weight">货车重量</label><input id="sLoad" type="range" min="5" max="60" step="1" value="30"><span class="val" id="sLoadVal">30 t</span></div>
  <div class="row"><label data-zh="拉索对数" data-en="Stay pairs">拉索对数</label><input id="sPair" type="range" min="6" max="14" step="1" value="10"><span class="val" id="sPairVal">10 对</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglPath" type="checkbox" checked> <span data-zh="载荷路径" data-en="Load path">载荷路径</span></label>
      <label><input id="tglExag" type="checkbox" checked> <span data-zh="挠度放大×150" data-en="Deflection ×150">挠度放大×150</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../suspension-bridge/" data-zh="悬索桥:主缆抛物线的姐妹方案" data-en="suspension-bridge: the parabolic sister">悬索桥:主缆抛物线的姐妹方案</a>
    <a href="../tower-crane/" data-zh="塔吊:同一台力矩天平" data-en="tower-crane: the same moment balance, vertical">塔吊:同一台力矩天平</a>
    <a href="../concrete/" data-zh="混凝土:桥面与桥塔的材料" data-en="concrete: the material of deck and pylon">混凝土:桥面与桥塔的材料</a>
    <a href="../vortex-street/" data-zh="卡门涡街:风雨激振的祸源" data-en="vortex-street: where wind-rain vibration begins">卡门涡街:风雨激振的祸源</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1420);
scene.fog = new THREE.Fog(0x0e1420, 60, 230);
const waterM = new THREE.MeshStandardMaterial({ color: 0x0c1626, roughness: 0.25, metalness: 0.1 });
const landM = new THREE.MeshStandardMaterial({ color: 0x1a2129, roughness: 0.95 });
const towerM = new THREE.MeshStandardMaterial({ color: 0x8a5a44, roughness: 0.6, metalness: 0.15 });
const abutM = new THREE.MeshStandardMaterial({ color: 0x4a515c, roughness: 0.92 });
const deckM = new THREE.MeshStandardMaterial({ color: 0x39414c, roughness: 0.8 });
const edgeM = new THREE.MeshStandardMaterial({ color: 0x2a313a, roughness: 0.75, metalness: 0.3 });
const railM = new THREE.MeshStandardMaterial({ color: 0x55606d, roughness: 0.6 });
const postM = new THREE.MeshStandardMaterial({ color: 0x4c5763, roughness: 0.7 });
const truckM = new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.5, metalness: 0.2 });
const cargoM = new THREE.MeshStandardMaterial({ color: 0xd8b13c, roughness: 0.6 });
const wheelM = new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.9 });
const arrowA = new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
const arrowB = new THREE.MeshBasicMaterial({ color: 0xff8787, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
const stayMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95 });
const stayBase = new THREE.Color(0x5d7fa6), stayHot = new THREE.Color(0xcfe9ff);
const heatLo = new THREE.Color(0x35597e), heatMid = new THREE.Color(0xffa94d), heatHi = new THREE.Color(0xff5f52);
const cTmp = new THREE.Color();

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  const bgc = dark ? 0x0e1420 : 0xd8e2ec;
  scene.background.setHex(bgc);
  scene.fog.color.setHex(bgc);
  scene.fog.near = dark ? 60 : 85; scene.fog.far = dark ? 230 : 280;
  waterM.color.setHex(dark ? 0x0c1626 : 0x8fb9d8);
  landM.color.setHex(dark ? 0x1a2129 : 0xcabd9e);
  towerM.color.setHex(dark ? 0x8a5a44 : 0xbb8c72);
  abutM.color.setHex(dark ? 0x4a515c : 0xb3bcc6);
  deckM.color.setHex(dark ? 0x39414c : 0x93a0ac);
  edgeM.color.setHex(dark ? 0x2a313a : 0x77828e);
  railM.color.setHex(dark ? 0x55606d : 0xa5aeb8);
  postM.color.setHex(dark ? 0x4c5763 : 0x98a3ae);
  truckM.color.setHex(dark ? 0xd8dee6 : 0x3a4250);
  cargoM.color.setHex(dark ? 0xd8b13c : 0xc79a2e);
  arrowA.color.setHex(dark ? 0xffa94d : 0xe8590c);
  arrowB.color.setHex(dark ? 0xff8787 : 0xc92a2a);
  stayBase.setHex(dark ? 0x5d7fa6 : 0x3f6288);
  stayHot.setHex(dark ? 0xcfe9ff : 0x1a6db3);
  heatLo.setHex(dark ? 0x35597e : 0x1864ab);
  heatMid.setHex(dark ? 0xffa94d : 0xe8590c);
  heatHi.setHex(dark ? 0xff5f52 : 0xc92a2a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('斜拉桥 · 直线张拉的弹性吊点', 'Cable-Stayed Bridge · Straight-Tensioned Elastic Supports');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);

  { b: '塔的轴力账本:竖直分量逐层叠加', be: 'The pylon ledger: vertical forces stack',
    d: '每根索的 T_v 都压进塔身,从锚固点向下逐层累加:塔底轴力 N=ΣT_v+塔自重。斜拉桥的「锚」就是塔自己——悬索桥要把水平拉力引进两岸锚碇,斜拉桥则把全部竖直分量在塔内结清,塔底达数百 MN,再由基础传给地基。右下小图就是这本账。',
    de: "Every stay's T_v stacks down the pylon: at the base N=ΣT_v plus the pylon's self-weight. The cable-stayed bridge anchors itself — where a suspension bridge drags its horizontal pull into shore anchorages, the pylon settles all vertical components internally, hundreds of MN at the base, handed on to the foundation. The small chart is this ledger.",
    act: () => { flyTo([-24, 6.5, 14], [-16.8, 3.6, 0]); notify('竖直分量沿塔逐层叠加,塔底 = ΣT_v + 塔自重', 'vertical components stack down the pylon: base = ΣT_v + self-weight'); } },
  { b: '扇形布置:近塔陡、远塔平', be: 'Fan arrangement: steep inside, flat outside',
    d: '索在塔上散开成扇:近塔索陡(α 大、索短省力、刚度好),远塔索平(α 小、索力大、刚度低)。所有索都是直线构件,工厂制索、现场一次张拉成型;也正因为不需要锚碇,斜拉桥在山地峡谷和软土平原都能落地,成为 200~1200 m 跨度最主流的桥型。',
    de: 'The stays fan out from the pylon: stays near it are steep (large α, short, efficient, stiff), the outer ones flat (small α, high force, low stiffness). Every stay is a straight member fabricated off-site and tensioned once on site. With no anchorage required, cable-stayed bridges suit mountain gorges and soft soil alike — the dominant type for 200–1,200 m spans.',
    act: () => { flyTo([0, 13, 34], [0, 4.5, 0]); notify('近塔索陡、远塔索平:全部直线一次张拉,无需锚碇', 'steep near the pylon, flat far away: all straight, tensioned once, no anchorage'); } },
  { b: '施工:悬臂拼装,塔梁对称生长', be: 'Erection: balanced cantilever from the pylon',
    d: '斜拉桥常用悬臂法施工:先修塔,再从塔两侧对称悬臂拼装梁段,每拼一节就挂一束索、张拉一次;斜拉索在施工期兼作「脚手架」,悬臂越长索力越大,最后在跨中合龙。苏通大桥正是这样把 1088 m 的主跨从两座塔上「长」出来的。',
    de: 'Most cable-stayed bridges are built by balanced cantilever: build the pylon first, then extend the girder symmetrically on both sides, hanging and tensioning one stay per segment — the stays double as scaffolding, their forces growing with the cantilever, until the halves close at midspan. That is how Sutong grew its 1,088 m main span out of two pylons.',
    act: () => { flyTo([20, 12, 26], [8, 4.2, 0]); notify('悬臂拼装:塔梁对称生长,索兼作脚手架,跨中合龙', 'balanced cantilever: pylon and girder grow symmetrically and close at midspan'); } },
  { b: '注脚:风雨激振与阻尼器', be: 'Footnote: rain-wind vibration & dampers',
    d: '斜拉索又长又轻、阻尼极小:风雨天雨水沿索形成下洗水线,改变截面气动外形,涡激振动被放大,索面会出现肉眼可见的大幅晃动——风雨激振。对策有两手:表面螺旋线或凹坑破坏水线的气动措施,以及索端阻尼器;这也是大跨桥风工程研究的活教材。',
    de: 'Stays are long, light and barely damped: in rain, water rivulets run down the cable and reshape its cross-section, amplifying vortex shedding — the notorious rain-wind vibration, visible as large slow swings. The countermeasures are aerodynamic (helical ribs or dimples that break the water lines) and mechanical (dampers at the cable ends) — a live textbook of bridge wind engineering.',
    act: () => { flyTo([9, 4.2, 10], [0, 2.8, 0]); notify('长索轻柔易振:气动措施 + 索端阻尼器压制风雨激振', 'long stays are lively: aerodynamic shaping + dampers tame rain-wind vibration'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:索力账本 ================= */
const plotCv = document.getElementById('plotCv');
const c8 = c => `${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)}`;
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 34, padR = 52, padT = 12, padB = 20;
  const N = pairs;
  const X = i => padL + (i - 0.5) / N * (W - padL - padR);
  const YT = t => (H - padB) - clamp(t, 0, 26) / 26 * (H - padT - padB);
  const YN = v => (H - padB) - clamp(v, 0, 1050) / 1050 * (H - padT - padB);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  for (const g of [8, 16, 24]) {
    ctx.beginPath(); ctx.moveTo(padL, YT(g)); ctx.lineTo(W - padR, YT(g)); ctx.stroke();
    ctx.fillStyle = cTxt; ctx.fillText(String(g), 6, YT(g) + 4);
  }
  /* 柱:单索张力(右塔,塔旁→跨中) */
  const bw = (W - padL - padR) / N * 0.62;
  const ms = stays.filter(q => q.s === 1 && q.dir === 1);
  ms.forEach((q, idx) => {
    const i = idx + 1;
    let fill;
    if (heatOn) {
      const t = clamp(q.Tv / (DL.Tmax + 1e-9), 0, 1);
      t < 0.55 ? cTmp.copy(heatLo).lerp(heatMid, t / 0.55) : cTmp.copy(heatMid).lerp(heatHi, (t - 0.55) / 0.45);
      fill = `rgb(${c8(cTmp)})`;
    } else {
      const glow = clamp((q.Tv - q.T0) / (DL.dTv + 1e-9), 0, 1);
      fill = glow > 0.02 ? `rgb(${c8(cTmp.copy(stayBase).lerp(stayHot, 0.3 + 0.7 * glow))})` : `rgba(${c8(stayBase)},0.8)`;
    }
    ctx.fillStyle = fill;
    const y1 = YT(q.Tv);
    ctx.fillRect(X(i) - bw / 2, y1, bw, YT(0) - y1);
  });
  /* 橙线:梁内轴压累计(自跨中向塔) */
  ctx.strokeStyle = `rgb(${c8(heatMid)})`;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  let acc = 0, first = true;
  for (let idx = ms.length - 1; idx >= 0; idx--) {
    const q = ms[idx], i = idx + 1;
    acc += 2 * q.Tv * q.cosA / q.sinA;
    const x = X(i), y = YN(acc);
    first ? (ctx.moveTo(x, y), first = false) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.lineWidth = 1;
  /* 虚线:塔底轴力 */
  const yn = YN(DL.Nbase);
  ctx.strokeStyle = 'rgba(255,107,107,.65)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(padL, yn); ctx.lineTo(W - padR, yn); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,107,107,.9)';
  ctx.fillText(`${Math.round(DL.Nbase)} MN`, W - padR + 6, yn + 4);
  ctx.fillStyle = cTxt;
  ctx.fillText('0', W - padR + 6, YN(0) + 4);
  ctx.fillText(L('轴力', 'axial'), W - padR + 6, YN(500) + 4);
  ctx.fillText(L('塔旁', 'pylon'), padL + 2, H - 6);
  ctx.fillText(L('跨中', 'midspan'), W - padR - 40, H - 6);
  ctx.fillText('MN', 6, YT(0) + 4);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elPos = document.getElementById('sPos'), elPosVal = document.getElementById('sPosVal');
const elLoad = document.getElementById('sLoad'), elLoadVal = document.getElementById('sLoadVal');
const elPair = document.getElementById('sPair'), elPairVal = document.getElementById('sPairVal');
const stTmax = document.getElementById('stTmax'), stN = document.getElementById('stN'),
  stAx = document.getElementById('stAx'), stDefl = document.getElementById('stDefl'),
  stStat = document.getElementById('stStat');
const formulaEl = document.getElementById('formula');
const btnTruck = document.getElementById('btnTruck'), btnCut = document.getElementById('btnCut'), btnHeat = document.getElementById('btnHeat');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elPos.value = Math.round(clamp(truckXm + TOT / 2, 0, TOT));
  elPosVal.textContent = `${Math.round(clamp(truckXm + TOT / 2, 0, TOT))} m`;
  elLoad.value = Wt;
  elLoadVal.textContent = `${Wt} t`;
  elPair.value = pairs;
  elPairVal.textContent = L(`${pairs} 对`, `${pairs} pairs`);
}
function syncBtns() {
  btnTruck.classList.toggle('on', truckAuto);
  btnTruck.textContent = truckAuto ? L('循环行驶中…', 'Looping…') : L('货车过桥(播放)', 'Truck crossing (play)');
  btnCut.classList.toggle('on', cutOn);
  btnCut.textContent = cutOn ? L('恢复背索', 'Restore back-stays') : L('拆掉背索', 'Remove back-stays');
  btnHeat.classList.toggle('on', heatOn);
}
function updateStats() {
  stTmax.innerHTML = `${DL.Tmax.toFixed(1)}<small> MN</small>`;
  stTmax.className = 'v';
  stN.innerHTML = `${Math.round(DL.Nbase)}<small> MN</small>`;
  stN.className = 'v' + (cutOn ? ' warn' : '');
  stAx.innerHTML = `${Math.round(DL.Fax)}<small> MN</small>`;
  stDefl.innerHTML = `${(DL.dMid * 100).toFixed(1)}<small> cm</small>`;
  stDefl.className = 'v' + (DL.dMid > 0.6 ? ' bad' : DL.dMid > 0.08 ? ' warn' : '');
  stStat.textContent = cutOn ? L('背索缺失!', 'back-stays missing!') : L('正常', 'normal');
  stStat.className = 'v ' + (cutOn ? 'bad' : 'ok');
  if (truckAuto) elPos.value = Math.round(clamp(truckXm + TOT / 2, 0, TOT));
  elPosVal.textContent = `${Math.round(clamp(truckXm + TOT / 2, 0, TOT))} m`;
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>索力分解:T_v=T·sinα 托梁,T_h=T·cosα 压梁</b>;最平索 α≈${(Math.asin(DL.minA) * R2D).toFixed(0)}°,单索最大张力 ≈ ${DL.Tmax.toFixed(1)} MN<br>` +
    `<b>塔底轴力:N=ΣT_v+G_塔</b> = ${Math.round(DL.Nbase - G_TOWER)}+620 ≈ ${Math.round(DL.Nbase)} MN ≈ ${(DL.Nbase * 102 / 10000).toFixed(1)} 万吨${cutOn ? '(背索缺失,仅中跨索压塔!)' : ''}<br>` +
    `<b>梁内轴压:塔附近 ≈ ΣT_h ≈ ${Math.round(DL.Fax)} MN</b> —— 主梁是被两头顶住的压杆,越靠塔越大<br>` +
    `<b>索刚度 k=EA·sin²α/L</b>:最长索 L≈580 m(苏通),货车 ${Wt} t → 跨中 δ≈${(DL.dMid * 100).toFixed(1)} cm(画面放大 ${EXAG}×)<br>` +
    `<b>苏通大桥:主跨 1088 m · 塔 306 m · 最长索 580 m · 全桥 528 根索</b>;画面为示意缩比(索数简化),面板为真实量级`,
    `<b>Stay force: T_v=T·sinα lifts, T_h=T·cosα squeezes</b>; flattest stay α≈${(Math.asin(DL.minA) * R2D).toFixed(0)}°, max tension ≈ ${DL.Tmax.toFixed(1)} MN<br>` +
    `<b>Tower-base axial: N=ΣT_v+G</b> = ${Math.round(DL.Nbase - G_TOWER)}+620 ≈ ${Math.round(DL.Nbase)} MN ≈ ${(DL.Nbase * 102 / 10000).toFixed(1)}×10⁴ t${cutOn ? ' (back-stays gone: main-span stays only!)' : ''}<br>` +
    `<b>Girder axial near pylon ≈ ΣT_h ≈ ${Math.round(DL.Fax)} MN</b> — a strut pressed from both ends, largest at the pylon<br>` +
    `<b>Stiffness k=EA·sin²α/L</b>: longest stay L≈580 m (Sutong), truck ${Wt} t → midspan δ≈${(DL.dMid * 100).toFixed(1)} cm (shown ${EXAG}×)<br>` +
    `<b>Sutong: 1,088 m span · 306 m pylons · 580 m longest stay · 528 stays total</b>; schematic scene, true magnitudes in the panel`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elPos.addEventListener('input', () => { truckAuto = false; truckXm = +elPos.value - TOT / 2; syncSliders(); syncBtns(); updateFormula(); });
elLoad.addEventListener('input', () => { Wt = +elLoad.value; syncSliders(); updateFormula(); });
elPair.addEventListener('input', () => { pairs = +elPair.value; buildStays(); syncSliders(); updateFormula(); });
btnTruck.addEventListener('click', () => {
  truckAuto = !truckAuto;
  notify(truckAuto ? '货车开始循环过桥:看附近索被逐根拉亮、力沿索→塔→基础回家' : '货车停在手动位置:拖动「货车位置」滑块观察',
    truckAuto ? 'the truck loops across: nearby stays light up, the load walks stay→pylon→foundation' : 'truck parked: drag the position slider to probe');
  syncBtns();
});
btnCut.addEventListener('click', () => {
  cutOn = !cutOn;
  notify(cutOn ? '背索已拆!中跨索的水平拉无人平衡,塔顶内倾、跨中大幅下挠——塔就是斜拉桥自己的锚' : '背索恢复:塔重新被锚住,桥回到平衡',
    cutOn ? 'back-stays cut! nothing balances the main stays: the pylon leans in and the span sags — the pylon IS the anchorage' : 'back-stays restored: the pylon is anchored again, the bridge is in balance');
  syncBtns(); updateFormula(); drawPlot();
});
btnHeat.addEventListener('click', () => { heatOn = !heatOn; syncBtns(); drawPlot(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglPath').addEventListener('change', e => { pathOn = e.target.checked; });
document.getElementById('tglExag').addEventListener('change', e => { exagOn = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    if (truckAuto) { truckXm += TRUCK_V * dt; if (truckXm > TOT / 2) truckXm = -TOT / 2; }
    phiT += ((cutOn ? PHI_MAX : 0) - phiT) * Math.min(1, dt * 1.2);
    deltaCut = 1.35 * (phiT / PHI_MAX);
  }
  computeLoads();
  for (const rb of ribbons) updateRibbon(rb);
  updatePosts();
  updateStays();
  towers[1].rotation.z = phiT;
  towers[-1].rotation.z = -phiT;
  truckGrp.position.set(truckXm * m2u, DECK_Y + 0.1 + deflVis(truckXm), 0.6);
  cargo.scale.setScalar(0.75 + 0.5 * (Wt - 5) / 55);
  lblTruck.position.set(clamp(truckXm, -TOT / 2 + 2, TOT / 2 - 2) * m2u, DECK_Y + 1.2 + deflVis(truckXm), 0);
  updateArrows();
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildStays();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
computeLoads();
syncAll();
start();
</script>
