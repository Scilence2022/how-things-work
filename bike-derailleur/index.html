<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车拨链器 · 手指拉出十档变速</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="自行车拨链器:手指拉出十档变速" data-en="Bike Derailleur: Ten Gears from a Fingertip">自行车拨链器:手指拉出十档变速</h1>
  <div class="sub" data-zh="手指拉动几毫米的变速线 → 平行四边形平移 → 导轮把链条顶上更大/更小的飞轮片 → 齿比改变:同一双腿,要么爬得动坡、要么飚得出速度;张紧轮吃掉链条长度差,棘轮让你滑行时脚不动 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A few millimetres of cable → a parallelogram slides → the cage pushes the chain onto a bigger/smaller cog → the ratio changes: same legs, climb hills or sprint; a tension pulley swallows the slack, a ratchet lets you coast · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">手指拉动几毫米的变速线 → 平行四边形平移 → 导轮把链条顶上更大/更小的飞轮片 → 齿比改变:同一双腿,要么爬得动坡、要么飚得出速度;张紧轮吃掉链条长度差,棘轮让你滑行时脚不动 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="档位(齿数)" data-en="Gear (teeth)">档位(齿数)</span><span class="v" id="stG">—</span>
  <span class="k" data-zh="齿比 48/T" data-en="Ratio 48/T">齿比 48/T</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="踏频" data-en="Cadence">踏频</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="车速@踏频" data-en="Speed">车速@踏频</span><span class="v ok" id="stV">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="五个飞轮片:速度(km/h@80rpm,绿)与相对爬坡力(橙)——此消彼长" data-en="Five cogs: speed (km/h@80rpm, green) vs relative climbing force (orange) — one trades against the other">五个飞轮片:速度(km/h@80rpm,绿)与相对爬坡力(橙)——此消彼长</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="链条" data-en="chain">链条</span>
    <span class="chip.g" data-zh="导轮/张紧轮" data-en="jockey / tension pulley">导轮/张紧轮</span>
    <span class="chip.o" data-zh="飞轮片×5" data-en="cogs ×5">飞轮片×5</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnUp" data-zh="▲ 升档:顶上小飞轮(快)" data-en="▲ shift up: onto a smaller cog (faster)">▲ 升档:顶上小飞轮(快)</button>
    <button class="abtn" id="btnDn" data-zh="▼ 降档:放大飞轮(省力)" data-en="▼ shift down: onto a bigger cog (easier)">▼ 降档:放大飞轮(省力)</button>
    <button class="abtn" id="btnCoast" data-zh="滑行(停止踩踏)" data-en="coast (stop pedaling)">滑行(停止踩踏)</button>
    <button class="abtn" id="btnSlow" data-zh="慢放换挡 ×0.25" data-en="slow-mo shift ×0.25">慢放换挡 ×0.25</button>
  </div>
  <div class="row"><label data-zh="踏频" data-en="Cadence">踏频</label><input id="cad" type="range" min="0" max="120" step="2" value="80"><span class="val" id="cadVal">80 rpm</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../four-bar-linkage/" data-zh="平行四边形本尊" data-en="the parallelogram itself">平行四边形本尊</a>
    <a href="../ratchet-pawl/" data-zh="飞轮棘轮" data-en="the freehub ratchet">飞轮棘轮</a>
    <a href="../clutch-gearbox/" data-zh="汽车的换挡" data-en="shifting, car edition">汽车的换挡</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('自行车拨链器 · 手指拉出十档变速', 'Bike Derailleur · Ten Gears from a Fingertip');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.0, 0.3, 5.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.95, -0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(3, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 2, -4);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
/* 地面 */
const ground = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 7, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -1.45;
scene.add(ground);
/* 车架尾钩示意(右下角一块) */
const frameG = new THREE.Group();
scene.add(frameG);
const chainstay = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.09, 0.09), mat(0xb0413e, { roughness: 0.5, opacity: 1 }));
chainstay.position.set(1.55, 0.02, 0.12);
frameG.add(chainstay);
const seatstay = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 2.4, 10), mat(0xb0413e, { opacity: 1 }));
seatstay.position.set(1.9, 1.05, -0.28);
seatstay.rotation.z = -0.9;
frameG.add(seatstay);

/* ================= 车轮 ================= */
const WHEEL_R = 1.0, HUB_Z = -0.06;
const wheelG = new THREE.Group();
wheelG.position.set(0, 0, HUB_Z);
scene.add(wheelG);
const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.035, 0.045, 12, 64), mat(0x1d1f23, { roughness: 0.9, opacity: 1 }));
wheelG.add(tire);
const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.105, 0.022, 10, 56), mat(0xc3ced9, { roughness: 0.3, metalness: 0.85, opacity: 1 }));
wheelG.add(rim);
for (let i = 0; i < 14; i++) {
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 1.82, 6), mat(0xd8dee5, { roughness: 0.3, metalness: 0.9, opacity: 1 }));
  sp.rotation.z = i / 14 * Math.PI * 2 + 0.11;
  sp.position.set(Math.cos(i / 14 * Math.PI * 2 + 0.11) * 0.45, Math.sin(i / 14 * Math.PI * 2 + 0.11) * 0.45, 0);
  wheelG.add(sp);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.3, 16), mat(0x8a95a1, { roughness: 0.35, metalness: 0.85, opacity: 1 }));
hub.rotation.x = Math.PI / 2;
wheelG.add(hub);

/* ================= 飞轮塔(5 片,与车轮同转) ================= */
const TEETH = [28, 24, 20, 16, 13];        // 1=最大(爬坡) … 5=最小(巡航)
const RADII = TEETH.map(t => t * 0.0107);

/* 链条路径:由当前等效半径 r 构造(前齿盘→飞轮片→导轮→张紧轮→返回) */
const pathPts = [];
function Jof(r) { return { x: J_X, y: -(r + 0.115) }; }
function Tof(J, beta) { return { x: J.x + CAGE_LEN * Math.sin(beta), y: J.y - CAGE_LEN * Math.cos(beta) }; }
function buildPath(r, beta, out) {
  out.length = 0;
  const J = Jof(r), T = Tof(J, beta);
  const th1 = Math.atan2(0.40, CR_X) + Math.acos(clamp(r / Math.hypot(CR_X, 0.40), -1, 1));
  const th2 = 3.35;                        // 飞轮片出链角(后方偏下)
  const pt = (x, y, z) => out.push(new THREE.Vector3(x, y, z));
  pt(CR_X - 0.15, 0.40, CR_Z);             // 上链:来自前齿盘顶
  for (let i = 0; i <= 12; i++) {          // 绕飞轮片
    const a = lerp(th1, th2, i / 12);
    pt(Math.cos(a) * r, Math.sin(a) * r, lerp(CR_Z, CAGE_Z, i / 12));
  }
  const jIn = 2.97, jOut = 6.11;           // 导轮入角/出角(弧度)
  for (let i = 0; i <= 10; i++) {
    const a = lerp(jIn, jOut, i / 10);
    pt(J.x + Math.cos(a) * PJ_R, J.y + Math.sin(a) * PJ_R, CAGE_Z);
  }
  const tIn = 1.40, tOut = -0.79;          // 张紧轮 S 绕(前上→前下)
  for (let i = 0; i <= 10; i++) {
    const a = lerp(tIn, tOut, i / 10);
    pt(T.x + Math.cos(a) * PJ_R, T.y + Math.sin(a) * PJ_R, CAGE_Z);
  }
  pt(CR_X - 0.15, -0.40, CR_Z);            // 下链回前齿盘底
  return out;
}
function pathLen(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += pts[i].distanceTo(pts[i - 1]);
  return s;
}
/* 笼角:二分求 β 使总链长 = 基准(中档 β=0) */
const L0 = pathLen(buildPath(RADII[2], 0, []));
function solveBeta(r) {
  let lo = -0.5, hi = 0.5;
  for (let i = 0; i < 22; i++) {
    const mid = (lo + hi) / 2;
    (pathLen(buildPath(r, mid, [])) > L0) ? lo = mid : hi = mid;
  }
  return (lo + hi) / 2;
}
const tmpPts = [];
function samplePath(pts, cum, total, s, out) {
  let t = s % total; if (t < 0) t += total;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; cum[mid] < t ? lo = mid + 1 : hi = mid; }
  const i = Math.max(1, lo);
  const seg = cum[i] - cum[i - 1];
  const f = seg > 0 ? (t - cum[i - 1]) / seg : 0;
  out.lerpVectors(pts[i - 1], pts[i], f);
}
const cumArr = [];
function refreshCum(pts, cum) {
  cum.length = 0; cum.push(0);
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
  return cum[cum.length - 1];
}

const plotCv = document.getElementById('plotCv');
const speedOf = i => 48 / TEETH[i] * WHEEL_C * 80 * 60 / 1000;   // km/h @80rpm
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 14, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const bw = (W - 2 * pad) / 5;
  const yV = v => pad + (H - pad - padB) * (1 - clamp(v, 0, 40) / 40);
  const yF = f => pad + (H - pad - padB) * (1 - clamp(f, 0, 2.2) / 2.2);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const x = pad + bw * i + bw * 0.18, w = bw * 0.28;
    const on = i === gearIdx;
    ctx.fillStyle = on ? 'rgba(105,219,124,.95)' : 'rgba(105,219,124,.35)';
    ctx.fillRect(x, yV(speedOf(i)), w, H - padB - yV(speedOf(i)));
    ctx.fillStyle = on ? 'rgba(255,169,77,.95)' : 'rgba(255,169,77,.35)';
    const f = 48 / TEETH[i] / 3.7;
    ctx.fillRect(x + w + 2, yF(f), w, H - padB - yF(f));
    ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
    ctx.fillText(TEETH[i] + 'T', x + w / 2 - 8, H - 4);
    if (on) { ctx.fillStyle = '#69db7c'; ctx.fillText('●', x + w / 2 - 5, yV(speedOf(i)) - 6); }
  }
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  ctx.fillText('km/h', pad + 2, pad + 14);
  ctx.fillText('爬坡力→', W - pad - 62, pad + 14);
}

function updateChain(dt) {
  /* 换挡动画:等效半径从旧片滑到新片,带一点过冲的「跳」感 */
  if (shiftT >= 0) {
    shiftT += dt / shiftDur;
    if (shiftT >= 1) { shiftT = -1; gearCur = gearIdx; }
    else gearCur = lerp(shiftFrom, gearIdx, easeIO(shiftT));
  } else gearCur = gearIdx;
  const rFrom = RADII[clamp(Math.round(shiftFrom), 0, 4)], rTo = RADII[gearIdx];
  const hop = shiftT >= 0 ? 0.006 * Math.sin(Math.PI * clamp(shiftT, 0, 1)) * Math.sign(rTo - rFrom) : 0;
  const r = clamp(lerp(RADII[clamp(Math.round(gearCur), 0, 4)], rTo, clamp(Math.abs(gearCur - Math.round(gearCur)) * 2, 0, 1)) + hop, RADII[4], RADII[0]);
  const beta = solveBeta(r);
  const J = Jof(r), T = Tof(J, beta);
  /* 布置笼与导轮 */
  bodyG.position.x = (r - RADII[2]) * 0.4;
  bodyG.position.y = (r - RADII[2]) * 0.55;
  cageG.rotation.z = beta;
  lblJockey.position.set(J.x, J.y + 0.22, CAGE_Z);
  /* 链条路径(仅当几何变化时重建) */
  const key = r.toFixed(4) + '|' + beta.toFixed(4);
  if (key !== lastPathKey) {
    buildPath(r, beta, curPts);
    curTotal = refreshCum(curPts, curCum);
    lastPathKey = key;
  }
  /* 链速与轮速:踩踏时链条驱动,滑行时棘轮打滑 */
  const cadRad = coasting ? 0 : cadence / 60 * Math.PI * 2;
  const chainV = cadRad * CR_R;
  wheelW = coasting ? wheelW * (1 - 0.25 * dt) : chainV / WHEEL_R;
  chainPhase += chainV * dt;
  wheelAng += wheelW * dt;
  crankPhase += cadRad * dt;
  wheelG.rotation.z = -wheelAng;
  cogG.rotation.z = -wheelAng;
  crG.rotation.z = -crankPhase;
  crankArm.rotation.z = -crankPhase;
  /* 链条滚子 */
  for (let i = 0; i < CHAIN_N; i++) {
    samplePath(curPts, curCum, curTotal, i / CHAIN_N * curTotal + chainPhase, dummy.position);
    dummy.scale.setScalar(flash > 0 && i % 3 === 0 ? 1.5 : 1);
    dummy.updateMatrix();
    chainIM.setMatrixAt(i, dummy.matrix);
  }
  chainIM.instanceMatrix.needsUpdate = true;
  /* 变速线 */
  const bodyAnchor = new THREE.Vector3(bodyG.position.x - 0.2, bodyG.position.y - 0.06, CAGE_Z - 0.055);
  const mid = new THREE.Vector3((cableAnchor.x + bodyAnchor.x) / 2, Math.max(cableAnchor.y, bodyAnchor.y) + 0.1, 0.26);
  cableGeo.setFromPoints([cableAnchor, mid, bodyAnchor]);
}
let crankPhase = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05) * (playing ? speed : 0);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  updateChain(dt);
  statsAcc += dt;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stG.textContent = TEETH[gearIdx] + ' T';
    stR.textContent = (48 / TEETH[gearIdx]).toFixed(2);
    stC.textContent = cadence.toFixed(0) + ' rpm';
    stV.textContent = (48 / TEETH[gearIdx] * WHEEL_C * cadence * 60 / 1000).toFixed(1) + ' km/h';
    stS.textContent = coasting ? L('滑行', 'coasting') : L('骑行', 'riding');
    stS.className = 'v ' + (coasting ? 'warn' : 'ok');
    updateFormula();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
cadence = clamp(qsFloat('cad', 80), 0, 120);
gearIdx = clamp(Math.round(qsFloat('gear', 2)), 0, 4);
gearCur = gearIdx;
coasting = qsBool('coast', false);
controls.autoRotate = qsBool('spin', true);
syncSliders();
setToggleBtns();
applyTheme();
applyLang();
syncAll();
setPlayLabel();
/* 预构建链条路径 */
buildPath(RADII[gearIdx], solveBeta(RADII[gearIdx]), curPts);
curTotal = refreshCum(curPts, curCum);
lastPathKey = RADII[gearIdx].toFixed(4) + '|' + solveBeta(RADII[gearIdx]).toFixed(4);
start();
</script>
