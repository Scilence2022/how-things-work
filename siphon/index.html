<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虹吸 · 大气压把水推过山头</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="虹吸:大气压把水推过山头" data-en="The Siphon: Air Pressure Pushes Water Over the Hill">虹吸:大气压把水推过山头</h1>
  <div class="sub" data-zh="管子里没有「吸力」——上游液面上的大气压把水推进管口、推上高坡;越过顶点后重力接管往下拽,落差 Δh 就是唯一的发动机(v=√2gΔh 打折);顶点压强最低 p=p₀−ρg·h_c−损失,拉过 10.3 m 水柱自己汽化断流;两池抽到齐平,流动自动停下 · 竖向比例 ×2.4 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="There is no suction in the tube — the atmosphere pressing on the upper surface pushes water up and over; past the crest gravity takes over and the height difference Δh is the only engine (v = √2gΔh, with friction discount); pressure is lowest at the crest, p = p₀ − ρg·h_c − losses, and above 10.3 m the column boils apart; level the pools and the flow stops by itself · vertical scale ×2.4 · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">虹吸:大气压把水推过山头</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="流速 v" data-en="Flow speed">流速 v</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="流量 Q" data-en="Discharge">流量 Q</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="顶点绝压" data-en="Crest abs. p">顶点绝压</span><span class="v warn" id="stP">—</span>
  <span class="k" data-zh="顶点高度 h_c" data-en="Crest height">顶点高度 h_c</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="顶点绝压 vs 顶点高度 h_c · 红虚线=汽化压力 2.3 kPa" data-en="Crest absolute pressure vs h_c · dashed red = vapor pressure 2.3 kPa">顶点绝压 vs 顶点高度 h_c · 红虚线=汽化压力 2.3 kPa</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝粒子=管内水(色随压强)" data-en="blue particles = water, colored by pressure">蓝粒子=管内水(色随压强)</span>
    <span class="chip.r" data-zh="红标尺线=10.3 m 汽化极限" data-en="red ruler line = 10.3 m limit">红标尺线=10.3 m 汽化极限</span>
    <span class="chip.g" data-zh="顶点真空表(绝压)" data-en="crest vacuum gauge (absolute)">顶点真空表(绝压)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnPrime" data-zh="灌水启动" data-en="prime it">灌水启动</button>
    <button class="abtn brk" id="btnSnap" data-zh="顶点拉到 11.5 m" data-en="hoist crest to 11.5 m">顶点拉到 11.5 m</button>
    <button class="abtn" id="btnLevel" data-zh="两池齐平" data-en="level the pools">两池齐平</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="顶点高度 h_c" data-en="Crest height h_c">顶点高度 h_c</label><input id="hc" type="range" min="0.5" max="12" step="0.1" value="2"><span class="val" id="hcVal">2.0 m</span></div>
  <div class="row"><label data-zh="两池落差 Δh" data-en="Pool drop Δh">两池落差 Δh</label><input id="dh" type="range" min="0" max="3" step="0.05" value="1.2"><span class="val" id="dhVal">1.20 m</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../venturi-flow/" data-zh="同一根管里的伯努利:文丘里" data-en="Bernoulli in the same pipe: Venturi">同一根管里的伯努利:文丘里</a>
    <a href="../water-hammer/" data-zh="管流家族:水锤" data-en="pipe-flow family: water hammer">管流家族:水锤</a>
    <a href="../pascal-press/" data-zh="压强传递:帕斯卡" data-en="pressure at work: Pascal">压强传递:帕斯卡</a>
    <a href="../osmosis/" data-zh="另一种液体引擎:渗透" data-en="another water engine: osmosis">另一种液体引擎:渗透</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 22, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('虹吸 · 大气压把水推过山头', 'The Siphon · Air Pressure Pushes Water Over the Hill');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPrimeBtn();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(8.5, 4.6, 13.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理常数 / 状态 ================= */
const P_ATM = 101325, P_VAP = 2339, RHO = 1000, G = 9.81;
const C_V = 0.55;                       // 流速系数(含沿程+局部损失折减)
const ZETA = 0.35;                      // 顶点局部损失系数
const D_TUBE = 0.02;                    // 内径 20 mm
const A_TUBE = Math.PI * (D_TUBE / 2) ** 2;
const H_LIM = (P_ATM - P_VAP) / (RHO * G);   // 10.07 m(含汽化压)
const K_Y = 0.42;                       // 竖向比例:1 m → 0.42 单位

let hc = 2.0, dh = 1.2;                 // 顶点高、两池落差(m)
let vNow = 0;                           // 当前流速 m/s
let primed = false, fillT = 0;          // 灌水动画 0..1
let broken = false, drainT = 0;         // 断流排水动画
let levelA = 0, levelB = -dh;           // 液位(m,以上游初始液面为 0)
const vTarget = () => dh > 0.01 ? C_V * Math.sqrt(2 * G * Math.max(dh, 0)) : 0;
const pCrest = () => Math.max(0, P_ATM - RHO * G * hc - 0.5 * RHO * vNow * vNow * (1 + ZETA));

/* ================= 几何布置 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(26, 0.5, 9), mat(0x39414d, { opacity: 1 }));
ground.position.y = -3.2;
scene.add(ground);

/* 两只玻璃水槽 + 中间隔坝 */
const xA = -4.4, xB = 4.4;
function glassTank(cx) {
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.4, 2.3),
    mat(0xa8c6e8, { opacity: 0.18, roughness: 0.1, metalness: 0.05 }));
  glass.position.y = -0.1;
  g.add(glass);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.56, 0.1, 2.36), mat(0x4a5568, { opacity: 0.9 }));
  frame.position.y = 1.62;
  g.add(frame);
  g.position.x = cx;
  scene.add(g);
  return g;
}
glassTank(xA); glassTank(xB);
/* 中间隔坝:高度跟随顶点,管子搭在坝顶上 */
const dam = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 2.6), mat(0x556070, { opacity: 1 }));
scene.add(dam);
function setDamTop(topY) {

/* 管道路径:进水口(槽 A)→ 爬坝 → 顶点 → 下冲 → 出水口(槽 B) */
const TUBE_R = 0.16;
let curve = null, pathPts = null, crestParam = 0.5;
const tubeGlass = new THREE.Mesh(new THREE.BufferGeometry(), mat(0xcfe4f7, { opacity: 0.22, roughness: 0.08, metalness: 0 }));
const waterTube = new THREE.Mesh(new THREE.BufferGeometry(), mat(0x2f7fc4, { opacity: 0.55, roughness: 0.25, metalness: 0.1 }));

function rebuildPath() {
  const crestY = hc * K_Y;
  const yB = levelB * K_Y;
  const yIn = Math.max(levelA * K_Y - 0.85, -2.5);
  const yOut = Math.max(yB - 0.6, -2.6);
  const pts = [
    new THREE.Vector3(xA - 0.4, yIn, 0),
    new THREE.Vector3(xA + 0.55, yIn, 0),
    new THREE.Vector3(-1.15, yIn + 0.25, 0),
    new THREE.Vector3(-0.85, crestY - Math.max(0.75, (crestY - yIn) * 0.45), 0),
    new THREE.Vector3(-0.4, crestY, 0),
    new THREE.Vector3(0, crestY + 0.04, 0),
    new THREE.Vector3(0.4, crestY, 0),
    new THREE.Vector3(0.85, crestY - Math.max(0.75, (crestY - yOut) * 0.45), 0),
    new THREE.Vector3(1.15, yOut + 0.25, 0),
    new THREE.Vector3(xB - 0.55, yOut, 0),
    new THREE.Vector3(xB + 0.4, yOut, 0),
  ];
  curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
  pathPts = curve.getSpacedPoints(360);
  /* 顶点参数 = 最高点 */
  let top = 0;
  for (let i = 0; i < pathPts.length; i++) if (pathPts[i].y > pathPts[top].y) top = i;
  crestParam = top / (pathPts.length - 1);
  tubeGlass.geometry.dispose();
  tubeGlass.geometry = new THREE.TubeGeometry(curve, 90, TUBE_R, 12, false);
  waterTube.geometry.dispose();
  waterTube.geometry = new THREE.TubeGeometry(curve, 90, TUBE_R * 0.78, 10, false);
  /* 坝顶贴着管底,标尺/表计随顶点走 */
  setDamTop(crestY - 0.22);
  gauge.position.set(0, crestY + 0.75, 0.45);
}

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 20, padB = 24;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = hcM => pad + hcM / 12 * (W - pad - 12);
  const yOf = p => 8 + (1 - clamp(p / 105e3, 0, 1)) * (H - padB - 10);
  /* 汽化压力红线以下危险区 */
  ctx.fillStyle = 'rgba(255,107,107,.10)';
  ctx.fillRect(pad, yOf(P_VAP), W - pad - 12, H - padB - yOf(P_VAP));
  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(128,150,170,.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, 8); ctx.lineTo(pad, H - padB); ctx.lineTo(W - 12, H - padB);
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '17px system-ui';
  for (const [m, txt] of [[0, '0'], [4, '4'], [8, '8'], [12, '12 m']]) {
    ctx.fillText(txt, xOf(m) - 10, H - 6);
  }
  ctx.save(); ctx.translate(14, H / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText(L('kPa(绝压)', 'kPa abs'), -30, 0); ctx.restore();
  /* p_crest(hc) 直线(当前 Δh) */
  const vT = vTarget();
  ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let m = 0; m <= 12.001; m += 0.25) {
    const p = Math.max(0, P_ATM - RHO * G * m - 0.5 * RHO * vT * vT * (1 + ZETA));
    const x = xOf(m), y = yOf(p);
    m === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 汽化压力虚线 */
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
  ctx.beginPath(); ctx.moveTo(pad, yOf(P_VAP)); ctx.lineTo(W - 12, yOf(P_VAP)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff8787'; ctx.font = '16px system-ui';
  ctx.fillText(L('汽化 2.3', 'vapor 2.3'), W - 96, yOf(P_VAP) - 6);
  /* 当前工作点 */
  const px = xOf(clamp(hc, 0, 12)), py = yOf(pCrest());
  const danger = pCrest() < P_VAP + 5e3;
  ctx.fillStyle = danger ? '#ff6b6b' : '#ffd43b';
  ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = danger ? '#ffb3b3' : '#fff3bf'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText(L('当前', 'now'), px + 16, py - 8);
}

let hoist = null;                                        // 抬管动画:{from,to,k}
const easeIO = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function doPrime() {
  if (primed && !broken) return;
  primed = true; fillT = 0; drainT = 0; broken = false;

function hoistTo(target) {
  doPrime();

  primed = false; broken = false; fillT = 0; drainT = 0; hoist = null;
  vNow = 0; levelA = 0; levelB = -dh;
  bubbleG.visible = false;
  hc = clamp(hc, 0.5, 12);
  rebuildPath();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
const vScene = () => vNow * K_Y;                        // m/s → 场景单位/s
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    /* 抬管动画:顶点被缓缓拉高,跨过极限线的一刻断流 */
    if (hoist && primed && !broken) {
      hoist.k = clamp(hoist.k + dt / 2.4, 0, 1);
      hc = lerp(hoist.from, hoist.to, easeIO(hoist.k));
      rebuildPath();
      if (hoist.k >= 1) hoist = null;
    }
    if (primed && !broken) {
      if (fillT < 1) fillT = clamp(fillT + dt / 1.1, 0, 1);
      vNow = lerp(vNow, vTarget(), clamp(dt * 1.6, 0, 1));
      /* 水位漂移(演示加速 ×8):上游降、下游升,落差被自己吃掉 */
      const q = vNow * A_TUBE;
      levelA -= q / 0.35 * dt * 8;
      levelB += q / 0.35 * dt * 8;
      dh = Math.max(0, levelA - levelB);
      if (dh <= 0.005) { dh = 0; vNow = lerp(vNow, 0, 0.1); }
      /* 顶点跌破汽化压 → 拉断 */
      if (pCrest() <= P_VAP) {
        broken = true; drainT = 0;
        bubbleG.visible = true;
        hoist = null;
        setPrimeBtn();
      }
      rebuildIfMoved();
    } else if (broken && drainT < 1) {
      drainT = clamp(drainT + dt / 1.5, 0, 1);
      vNow = lerp(vNow, 0, clamp(dt * 2.2, 0, 1));
    }
  }
  /* 水面/水体跟随液位 */
  const yA = levelA * K_Y, yB = levelB * K_Y;
  surfA.position.set(xA, yA, 0);
  surfB.position.set(xB, yB, 0);
  setWaterBody(bodyA, yA);
  setWaterBody(bodyB, yB);
  /* 真空表指针:绝压 0–105 kPa 映射 −225°…+45° */
  const pv = primed || broken ? pCrest() : P_ATM;
  const ang = Math.PI * 0.75 - clamp(pv / 105e3, 0, 1) * Math.PI * 1.5;
  needle.rotation.z = lerp(needle.rotation.z, ang - Math.PI / 2, dt0 > 0 ? 0.2 : 0);
  /* 断流气泡:沿顶点段漂浮 */
  if (bubbleG.visible) {
    const cp = pathPts[Math.round(crestParam * (pathPts.length - 1))];
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      const ph = tGlob * 0.7 + i;
      b.position.set(
        cp.x + Math.cos(ph * 1.3 + i) * 0.32,
        cp.y + Math.sin(ph + i * 2.1) * 0.18 + 0.05,
        Math.sin(ph * 0.8 + i) * 0.18);
      b.material.opacity = 0.5 * (1 - drainT * 0.7);
    }
    if (drainT >= 1 && vNow < 0.02) { /* 留一点气泡余韵,重灌时消失 */ }
  }
  /* 水管显隐:断流后随排水淡出 */
  waterTube.visible = primed && (!broken || drainT < 1);
  waterTube.material.opacity = 0.55 * (broken ? 1 - drainT : 1) * (primed ? 1 : 0);
  updateWaterParticles(dt);
  updatePoolParticles(dt0);
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stV.textContent = primed && !broken ? vNow.toFixed(2) + ' m/s' : '0.00 m/s';
    stQ.textContent = primed && !broken ? (vNow * A_TUBE * 1000).toFixed(2) + ' L/s' : '0 L/s';
    const pk = Math.round(pCrest() / 1000);
    stP.textContent = pk + ' kPa';
    stP.className = 'v ' + (broken || pCrest() < P_VAP + 5e3 ? 'bad' : pCrest() < 40e3 ? 'warn' : 'ok');
    stH.textContent = hc.toFixed(1) + ' m';
    const s = broken ? L('断流:水柱拉断 ⚠', 'broken: column snapped ⚠')
      : !primed ? L('未灌水', 'not primed')
      : dh < 0.05 ? L('两池齐平:停流', 'level pools: stopped')
      : fillT < 1 ? L('灌水中…', 'priming…')
      : L('虹吸流动', 'siphoning');
    stS.textContent = s;
    stS.className = 'v ' + (broken ? 'bad' : primed && dh >= 0.05 ? 'ok' : 'warn');
    syncSliders();
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
let tGlob = 0;
const _lastLv = { a: 0, b: 0 };
function rebuildIfMoved() {
  if (Math.abs(levelA - _lastLv.a) > 0.04 || Math.abs(levelB - _lastLv.b) > 0.04) {
    _lastLv.a = levelA; _lastLv.b = levelB;
    rebuildPath();
  }
}
function updateWaterParticles(dtReal) {
  const len = 14.5;                       // 近似管长(场景单位),用于归一化步进
  for (let i = 0; i < W_N; i++) {
    const w = waters[i];
    let visHere = false;
    if (primed && !broken) {
      const mv = vScene() * dtReal / len;
      if (fillT < 1) {
        /* 灌水:两股从两端向顶点填 */
        const half = w.s <= 0.5 ? w.s * 2 : (1 - w.s) * 2;
        visHere = half <= fillT;
        w.s += 0;
      } else {
        visHere = true;
        w.s += mv;
        if (w.s > 1) w.s -= 1;
      }
    } else if (broken && drainT < 1) {
      /* 断流:顶点前段倒退回 A,后段继续冲出 B */
      const mv = vScene() * dtReal / len + 0.4 * dtReal / len;
      if (w.s < crestParam) { w.s -= mv; visHere = w.s > 0.02; }
      else { w.s += mv; visHere = w.s < 0.98; }
    }
    const idx = clamp(Math.round(w.s * (pathPts.length - 1)), 0, pathPts.length - 1);
    const p = pathPts[idx];
    if (!p || !visHere) {
      dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.001);
    } else {
      dummy.scale.setScalar(1);
      dummy.position.set(p.x, p.y + Math.sin(w.th) * 0.05, Math.cos(w.th) * 0.05);
    }
    dummy.updateMatrix();
    waterIM.setMatrixAt(i, dummy.matrix);
    /* 颜色:随当地压强 蓝(高)→红(低) */
    const pLocal = Math.max(5e3, P_ATM - RHO * G * Math.max(0, p ? p.y / K_Y : 0));
    const frac = clamp((pLocal - 5e3) / 96e3, 0, 1);
    _c.setHSL(lerp(0.02, 0.58, frac), 0.8, 0.55);
    waterIM.setColorAt(i, _c);
  }
  waterIM.instanceMatrix.needsUpdate = true;
  waterIM.instanceColor.needsUpdate = true;
}
function updatePoolParticles(dtReal) {
  tGlob += dtReal;
  for (let i = 0; i < POOL_N; i++) {
    const pl = pools[i];
    const ySurf = (pl.side === xA ? levelA : levelB) * K_Y;
    dummy.scale.setScalar(1);
    dummy.position.set(pl.x, ySurf - 0.08 - Math.abs(Math.sin(tGlob * 1.5 + pl.ph)) * 0.14, pl.z);
    dummy.updateMatrix();
    poolIM.setMatrixAt(i, dummy.matrix);
    _c.setHSL(0.56, 0.6, 0.6);
    poolIM.setColorAt(i, _c);
  }
  poolIM.instanceMatrix.needsUpdate = true;
  poolIM.instanceColor.needsUpdate = true;
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
hc = clamp(qsFloat('hc', 2), 0.5, 12);
dh = clamp(qsFloat('dh', 1.2), 0, 3);
levelA = 0; levelB = -dh;
rebuildPath();
if (qsBool('prime', true)) doPrime();
syncSliders();
setPrimeBtn();
setPlayLabel();
buildSteps();
applyTheme();
applyLang();
syncAll();
start();
</script>
