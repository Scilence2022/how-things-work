<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电子对产生与湮灭 · 光子变物质,物质变光子</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e599f7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#862e9c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电子对产生与湮灭 · 光子变物质,物质变光子" data-en="Pair Production & Annihilation · light into matter, matter into light">电子对产生与湮灭 · 光子变物质,物质变光子</h1>
  <div class="sub" data-zh="γ 光子能量过 1.022 MeV(=2mₑc²)才能在原子核旁变成正负电子对,多余能量成为动能;磁场里两者电荷相反、旋向相反;正负电子相遇即湮灭,两个 511 keV 光子背靠背飞出——PET 正是用符合探测把这对光子连成响应线,重建出体内示踪剂的位置 · 拖动旋转 / 空格运行/暂停" data-en="A γ photon needs ≥ 1.022 MeV (2mₑc²) to become an e⁻e⁺ pair beside a nucleus; the surplus becomes kinetic energy; in a magnetic field the two wind in opposite directions; when they meet they annihilate into two back-to-back 511 keV photons — PET's coincidence detection draws their line-of-response to locate tracers inside you · drag to orbit / Space = run/pause">γ 光子能量过 1.022 MeV(=2mₑc²)才能在原子核旁变成正负电子对,多余能量成为动能;磁场里两者电荷相反、旋向相反;正负电子相遇即湮灭,两个 511 keV 光子背靠背飞出——PET 正是用符合探测把这对光子连成响应线,重建出体内示踪剂的位置 · 拖动旋转 / 空格运行/暂停</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="光子能量" data-en="Photon E">光子能量</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="产生动能" data-en="Pair KE">产生动能</span><span class="v" id="stKE">—</span>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglField" type="checkbox"> <span data-zh="磁场 B" data-en="Field B">磁场 B</span></label>
      <label><input id="tglAnnih" type="checkbox"> <span data-zh="湮灭场景" data-en="Annihilation">湮灭场景</span></label>
    </div>
    <div class="row" style="margin-top:0">
      <label data-zh="速度" data-en="Speed">速度</label>
      <input id="sSpeed" type="range" min="0.3" max="2.5" step="0.1" value="1">
      <span class="val" id="sSpeedVal">1.0×</span>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pet-scan/" data-zh="PET 成像" data-en="PET scan">PET 成像</a>
    <a href="../photoelectric-effect/" data-zh="光电效应" data-en="Photoelectric effect">光电效应</a>
    <a href="../compton-scattering/" data-zh="康普顿散射" data-en="Compton scattering">康普顿散射</a>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const qf=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,4.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.1);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);

/* ---- 场景:台面 + γ 源 + 原子核 + 磁场线圈 + PET 探测器环 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const table=new THREE.Mesh(new THREE.BoxGeometry(14,0.4,9),groundM);
table.position.set(0,-0.2,0);scene.add(table);
const gun=new THREE.Group();gun.position.set(-5.6,1.5,0);scene.add(gun);
const gunBody=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,1.4,16),
  new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.7}));
gunBody.rotation.z=Math.PI/2;gun.add(gunBody);
const gunWin=new THREE.Mesh(new THREE.CircleGeometry(0.16,16),
  new THREE.MeshBasicMaterial({color:0xe5dbff}));
gunWin.rotation.y=Math.PI/2;gunWin.position.x=0.72;gun.add(gunWin);
const nucM=new THREE.MeshStandardMaterial({color:0x495057,roughness:0.4,metalness:0.5,emissive:0x15aabf,emissiveIntensity:0.15});
const nuc=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),nucM);
nuc.position.set(0,1.5,0);scene.add(nuc);
const coilM=new THREE.MeshStandardMaterial({color:0xffc078,metalness:0.7,roughness:0.35,emissive:0xe8590c,emissiveIntensity:0.08});
for(const dy of[-1.15,1.15]){
  const c=new THREE.Mesh(new THREE.TorusGeometry(2.7,0.055,8,48),coilM);
  c.rotation.x=Math.PI/2;c.position.set(0,1.5+dy,0);scene.add(c);
}
/* PET 探测器环(InstancedMesh,闪烁用 instanceColor) */
const ND=24,DR=4.6;
const detMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.55,0.8,0.26),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,metalness:0.3}),ND);
detMesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(ND*3),3);
scene.add(detMesh);
const detPos=[],flash=new Float32Array(ND);
const m4=new THREE.Matrix4();
for(let i=0;i<ND;i++){
  const a=i/ND*Math.PI*2;
  detPos.push(new THREE.Vector3(Math.cos(a)*DR,1.5,Math.sin(a)*DR));
  m4.makeRotationY(Math.atan2(-Math.cos(a),-Math.sin(a)));
  m4.setPosition(detPos[i]);
  detMesh.setMatrixAt(i,m4);
}
const cDetBase=new THREE.Color(0x6b7480),cDetHot=new THREE.Color(0xffe066),cDetTmp=new THREE.Color();
for(let i=0;i<ND;i++)detMesh.setColorAt(i,cDetBase);
/* 符合响应线 LOR */
const lorGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
const lor=new THREE.Line(lorGeo,new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.85}));
lor.visible=false;scene.add(lor);
let lorT=1e9;
/* 核闪光环 */
const fxRing=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.03,8,32),
  new THREE.MeshBasicMaterial({color:0x99e9f2,transparent:true,opacity:0}));
fxRing.position.set(0,1.5,0);scene.add(fxRing);
let fxT=1e9;
function fireFx(color){fxT=0;fxRing.material.color.setHex(color);}
/* γ 光子池 */
const photons=[];
for(let i=0;i<8;i++){
  const g=new THREE.Group();
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),
    new THREE.MeshStandardMaterial({color:0xd0bfff,emissive:0x7048e8,emissiveIntensity:1.3}));
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,8),
    new THREE.MeshBasicMaterial({color:0xe5dbff,transparent:true,opacity:0.25}));
  g.add(core);g.add(halo);g.visible=false;scene.add(g);
  photons.push({g,state:'idle',x:0});
}
/* 正负电子轨迹 */
const tracks=[];
function addTrack(pts,color){
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:0.85}));
  scene.add(ln);tracks.push({ln,life:2.4});
  if(tracks.length>12){const o=tracks.shift();scene.remove(o.ln);}
}
/* 湮灭事件槽:e⁺/e⁻ 相向飞行 → 湮灭 → 两个 511 keV 光子背靠背 */
const annSlots=[];
function mkDot(color,emis){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),
    new THREE.MeshStandardMaterial({color,emissive:emis,emissiveIntensity:1.0}));
  m.visible=false;scene.add(m);return m;
}
for(let i=0;i<3;i++){
  annSlots.push({ep:mkDot(0xff8787,0xc92a2a),em:mkDot(0x74c0fc,0x1864ab),
    p1:mkDot(0xffe066,0xf08c00),p2:mkDot(0xffe066,0xf08c00),active:false,t:0,phi:0,psi:0});
}
let annAcc=0;
function fireAnn(){
  const s=annSlots.find(x=>!x.active);if(!s)return;
  s.active=true;s.t=0;
  s.phi=Math.random()*Math.PI*2;s.psi=Math.random()*Math.PI*2;
  s.ep.visible=s.em.visible=true;s.p1.visible=s.p2.visible=false;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('γ 源:打出单能光子束','γ source: fires monoenergetic photons'),new THREE.Vector3(-5.6,2.7,0),'o',()=>!annih);
addLabel(()=>L('原子核:反冲分走动量——没有它,对产生不发生','Nucleus: recoil takes momentum — without it, no pair'),new THREE.Vector3(0.2,2.45,0),'y',()=>!annih);
addLabel(()=>L('e⁻(蓝)/ e⁺(红):磁场中旋向相反','e⁻ (blue) / e⁺ (red): opposite winds in a field'),new THREE.Vector3(2.7,2.9,0),'b',()=>!annih);
addLabel(()=>L('门槛:E_γ ≥ 2mₑc² = 1.022 MeV','Threshold: E_γ ≥ 2mₑc² = 1.022 MeV'),new THREE.Vector3(0,4.35,0),'o');
addLabel(()=>L('湮灭:两个 511 keV 光子背靠背','Annihilation: two 511 keV photons back-to-back'),new THREE.Vector3(-2.8,0.5,0),'g',()=>annih);
addLabel(()=>L('PET 符合:两点同时亮 → 连成响应线 LOR','PET coincidence: two flashes → one line of response'),new THREE.Vector3(3.6,3.3,0),'r',()=>annih);

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let speed=clamp(qf('speed',1),0.3,2.5);
if(qs.get('pause')==='1')playing=false;
let E=2.5,rate=3,field=false,annih=false,coinc=0,fireAcc=0;
const THR=1.022;                                  // 2 mₑ c²

/* ---- UI 元素 ---- */
const elE=document.getElementById('sE'),elEVal=document.getElementById('sEVal');
const elRate=document.getElementById('sRate'),elRateVal=document.getElementById('sRateVal');
const elSpeed=document.getElementById('sSpeed'),elSpeedVal=document.getElementById('sSpeedVal');
const tglLabelsEl=document.getElementById('tglLabels');
const tglFieldEl=document.getElementById('tglField');
const tglAnnihEl=document.getElementById('tglAnnih');
const bBelow=document.getElementById('bBelow'),bProd=document.getElementById('bProd'),bPet=document.getElementById('bPet');
const stE=document.getElementById('stE'),stKE=document.getElementById('stKE'),
  stAnn=document.getElementById('stAnn'),stC=document.getElementById('stC');
function setE(v){E=v;elE.value=v;elEVal.textContent=v.toFixed(2)+' MeV';}
function setRate(v){rate=v;elRate.value=v;elRateVal.textContent=v.toFixed(0)+' /s';}
function setSpeed(v){speed=v;elSpeed.value=v;elSpeedVal.textContent=v.toFixed(1)+'×';}
function setField(b){field=b;tglFieldEl.checked=b;}
function setAnnih(b){annih=b;tglAnnihEl.checked=b;gun.visible=!b;}
function mark(btn){[bBelow,bProd,bPet].forEach(b=>b.classList.toggle('on',b===btn));}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'光子要"变出"一对有质量的电子,能量必须 ≥ 2mₑc² = 1.022 MeV',en:'To create a pair with mass, the photon needs ≥ 2mₑc² = 1.022 MeV',
  act:()=>{setAnnih(false);setField(false);setE(0.8);}},
 {zh:'能量过阈:多余部分变成正负电子的动能(E−1.022 MeV)',en:'Above threshold: the surplus becomes kinetic energy (E − 1.022 MeV)',
  act:()=>{setAnnih(false);setE(2.2);}},
 {zh:'必须在原子核旁发生:核反冲分走动量,否则动量不守恒',en:'It must happen beside a nucleus: the recoil takes momentum, else momentum fails',
  act:()=>{setAnnih(false);setE(2.5);}},
 {zh:'加磁场:正负电子电荷相反,旋向立刻相反',en:'Add a magnetic field: opposite charges wind in opposite directions',
  act:()=>{setAnnih(false);setE(2.5);setField(true);}},
 {zh:'正电子遇到电子:湮灭,质量全部变成光子',en:'Positron meets electron: annihilation — mass becomes photons',
  act:()=>{setAnnih(true);setE(2.5);}},
 {zh:'两个 511 keV 光子背靠背;PET 用符合探测画出响应线',en:'Two 511 keV photons back-to-back; PET coincidence draws the LOR',
  act:()=>{setAnnih(true);setE(2.5);}}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  stE.innerHTML=E.toFixed(2)+'<small> MeV</small>';
  const ke=Math.max(E-THR,0);
  stKE.innerHTML=ke.toFixed(2)+'<small> MeV</small>';
  stKE.className='v'+(E>=THR?' ok':' warn');
  stAnn.innerHTML='511<small> keV</small>';
  stC.textContent=coinc;
}

/* ---- 对产生:在核旁分身 ---- */
function spawnPair(ke){
  const th0=Math.random()*0.5-0.25,R=0.34+ke*0.16;
  for(const s of[-1,1]){
    const pts=[];
    if(field){
      const turn=(1.1+ke*0.4)*s;
      for(let i=0;i<=44;i++){
        const t=i/44,a=th0+t*turn*2.6,r=R*(0.3+t*1.5);
        pts.push(new THREE.Vector3(Math.cos(a)*r,1.5+(s*t-0.5)*0.5,Math.sin(a)*r*0.9));
      }
    }else{
      const a2=th0+s*0.35,dx=Math.cos(a2),dz=Math.sin(a2);
      for(let i=0;i<=10;i++){const t=i/10;
        pts.push(new THREE.Vector3(dx*t*3.2,1.5+(s*t-0.5)*0.22,dz*t*3.2));}
    }
    addTrack(pts,s<0?0x74c0fc:0xff8787);
  }
}

/* ---- 事件 ---- */
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
bBelow.addEventListener('click',()=>{setAnnih(false);setField(false);setE(0.6);mark(bBelow);});
bProd.addEventListener('click',()=>{setAnnih(false);setE(2.5);mark(bProd);});
bPet.addEventListener('click',()=>{setAnnih(true);setE(2.5);mark(bPet);});
elE.addEventListener('input',e=>setE(+e.target.value));
elRate.addEventListener('input',e=>setRate(+e.target.value));
elSpeed.addEventListener('input',e=>setSpeed(+e.target.value));
tglFieldEl.addEventListener('change',e=>setField(e.target.checked));
tglAnnihEl.addEventListener('change',e=>setAnnih(e.target.checked));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
tglLabelsEl.addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=LANG==='en'?'Pair Production & Annihilation':'电子对产生与湮灭 · 光子变物质,物质变光子';
  buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speed;
  const sdt=playing?dts:0;
  simT+=sdt;
  /* 磁场线圈亮度 */
  coilM.emissiveIntensity+=((field?0.85:0.08)-coilM.emissiveIntensity)*Math.min(1,dt*4);
  /* 发射 γ 光子(对产生场景) */
  if(!annih&&sdt>0){
    fireAcc+=dts*rate;
    if(fireAcc>=1){
      fireAcc-=1;
      const ph=photons.find(p=>p.state==='idle');
      if(ph){ph.state='fly';ph.x=-4.8;ph.g.visible=true;}
    }
  }
  for(const ph of photons){
    if(ph.state==='idle')continue;
    ph.x+=3.0*sdt;
    ph.g.position.set(ph.x,1.5,0);
    if(ph.state==='fly'&&ph.x>=-0.15){
      if(E>=THR){
        ph.state='idle';ph.g.visible=false;
        fireFx(0x99e9f2);nucM.emissiveIntensity=2.2;
        spawnPair(E-THR);
      }else ph.state='pass';
    }else if(ph.state==='pass'&&ph.x>7){
      ph.state='idle';ph.g.visible=false;
    }
  }
  /* 湮灭事件 */
  if(annih&&sdt>0){
    annAcc+=dts*rate*0.3;
    if(annAcc>=1){annAcc-=1;fireAnn();}
  }
  for(const s of annSlots){
    if(!s.active)continue;
    s.t+=sdt;
    const dx=Math.cos(s.phi),dz=Math.sin(s.phi);
    if(s.t<0.9){
      const k=1-s.t/0.9;
      s.ep.position.set(dx*3.4*k,1.5,dz*3.4*k);
      s.em.position.set(-dx*3.4*k,1.5,-dz*3.4*k);
    }else if(s.t<1.12){
      s.ep.visible=s.em.visible=false;
      if(!s.p1.visible)fireFx(0xffe066);
    }else if(s.t<2.45){
      s.p1.visible=s.p2.visible=true;
      const p=(s.t-1.12)/1.33*(DR+0.1);
      s.p1.position.set(Math.cos(s.psi)*p,1.5,Math.sin(s.psi)*p);
      s.p2.position.set(-Math.cos(s.psi)*p,1.5,-Math.sin(s.psi)*p);
    }else{
      const idx=((Math.round(s.psi/(Math.PI*2)*ND)%ND)+ND)%ND,opp=(idx+ND/2)%ND;
      flash[idx]=1;flash[opp]=1;coinc++;
      lorGeo.setFromPoints([detPos[idx],detPos[opp]]);lorT=0;
      s.active=false;s.p1.visible=s.p2.visible=false;
    }
  }
  /* 探测器闪烁衰减 */
  for(let i=0;i<ND;i++){
    if(flash[i]>0)flash[i]=Math.max(0,flash[i]-dt*1.3);
    cDetTmp.lerpColors(cDetBase,cDetHot,clamp(flash[i],0,1));
    detMesh.setColorAt(i,cDetTmp);
  }
  detMesh.instanceColor.needsUpdate=true;
  /* LOR 与闪光衰减 */
  lorT+=dt;
  lor.visible=lorT<1.6;
  if(lor.visible)lor.material.opacity=(1-lorT/1.6)*0.85;
  fxT+=dt;
  fxRing.visible=fxT<0.5;
  if(fxRing.visible){
    const fq=fxT/0.5;
    fxRing.material.opacity=(1-fq)*0.9;
    fxRing.scale.setScalar(0.6+fq*2.4);
  }
  nucM.emissiveIntensity+=(0.15-nucM.emissiveIntensity)*Math.min(1,dt*3);
  /* 轨迹淡出 */
  for(let i=tracks.length-1;i>=0;i--){
    const t=tracks[i];
    t.life-=dt;
    if(t.life<=0){scene.remove(t.ln);tracks.splice(i,1);}
    else t.ln.material.opacity=clamp(t.life/2.4,0,1)*0.85;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
let phaseIdx=1;
{const t0=parseInt(qs.get('t'),10);if(Number.isFinite(t0)&&t0>=0&&t0<STEPS.length)phaseIdx=t0;}
labelsOn=!(qs.get('labels')==='0');
tglLabelsEl.checked=labelsOn;
setSpeed(speed);
applyTheme();applyLang();
setE(2.5);setRate(3);
applyPhase(phaseIdx);
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
