<style>

  }

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  #panel::-webkit-scrollbar-track { background: transparent; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const m4=new THREE.Matrix4();
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);
camera.position.set(-7,6,12);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=120;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyLight=new THREE.DirectionalLight(0xfff2dd,1.05);keyLight.position.set(6,10,8);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9ab8ff,0.3);fillLight.position.set(-8,5,-6);scene.add(fillLight);

/* ---- 页面独特代码(定义 BG_DARK/BG_LIGHT/applyPageTheme/STEPS/updateStats/tick/pageInit) ---- */
const BG_DARK=0x101418,BG_LIGHT=0xe9e4dc;
const NS=512;
const signal=new Float32Array(NS);
let sigKind='chirp',wavelet='morlet',nBands=16,sweep=1,autoSweep=true;
function genSignal(){
  for(let i=0;i<NS;i++){
    const t=i/NS;
    if(sigKind==='chirp'){
      const f=2+t*60;
      signal[i]=Math.sin(2*Math.PI*f*t)*0.8;
    }else if(sigKind==='break'){
      const f=t<0.5?6:14;
      signal[i]=(Math.sin(2*Math.PI*f*t)+(t>0.5?0.9:0))*0.7;
    }else{
      const on=t<0.33?[8]:t<0.66?[8,20]:[8,20,44];
      let v=0;on.forEach(f=>v+=Math.sin(2*Math.PI*f*t)/on.length);
      signal[i]=v*0.9;
    }
  }
}
/* 母波 */
function psi(x){
  if(wavelet==='morlet')return Math.cos(5.5*x)*Math.exp(-x*x/2);
  return Math.abs(x)<0.5?(Math.abs(x)<0.25?1:-1):0;
}
/* ---- 信号曲线(左) ---- */
const sigG=new THREE.Group();sigG.position.set(-5.2,1.8,-1);scene.add(sigG);
const sigBg=new THREE.Mesh(new THREE.PlaneGeometry(8.4,3.6),
  new THREE.MeshStandardMaterial({color:0x151b25,roughness:0.9,transparent:true,opacity:0.85}));
sigG.add(sigBg);
const sigGeo=new THREE.BufferGeometry();
sigGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NS*3),3));
const sigLine=new THREE.Line(sigGeo,new THREE.LineBasicMaterial({color:0x3bc9db}));
sigG.add(sigLine);
function drawSignal(){
  const arr=sigGeo.attributes.position.array;
  for(let i=0;i<NS;i++){
    arr[i*3]=i/NS*8-4;arr[i*3+1]=signal[i]*1.4;arr[i*3+2]=0.05;
  }
  sigGeo.attributes.position.needsUpdate=true;
}
/* ---- 母波小图 ---- */
const mwGeo=new THREE.BufferGeometry();
mwGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(160*3),3));
const mother=new THREE.Line(mwGeo,new THREE.LineBasicMaterial({color:0xffd43b}));
scene.add(mother);
/* ---- 时频图(右) ---- */
const NCOL=40;
const tfG=new THREE.Group();tfG.position.set(4.6,1.8,-1);scene.add(tfG);
const tfBg=new THREE.Mesh(new THREE.PlaneGeometry(7.6,3.6),
  new THREE.MeshStandardMaterial({color:0x151b25,roughness:0.9,transparent:true,opacity:0.85}));
tfG.add(tfBg);
const NT=NCOL;
const cells=new THREE.InstancedMesh(new THREE.BoxGeometry(0.16,0.18,0.04),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,emissiveIntensity:0.5,emissive:0xffffff}),NT*nBands);
cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
cells.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NT*nBands*3),3);
scene.add(cells);
const energy=new Float32Array(NT*nBands);
let builtBands=0;
function rebuildCells(){
  scene.remove(cells);
  const nm=new THREE.InstancedMesh(new THREE.BoxGeometry(7.4/NT*0.92,3.4/nBands*0.86,0.04),
    new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,emissiveIntensity:0.6,emissive:0xffffff}),NT*nBands);
  nm.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  nm.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NT*nBands*3),3);
  tfG.add(nm);
  cellsArr.push(nm);
  if(cellsArr.length>1){const old=cellsArr.shift();tfG.remove(old);}
  cellsMesh=nm;
}
let cellsMesh=null;const cellsArr=[];
function computeCol(col){
  /* 对第 col 列算所有频带能量 */
  const tau=col/NT;
  for(let b=0;b<nBands;b++){
    const scale=1/(b+1);          /* 高频=窄窗 */
    let sumRe=0,sumIm=0;
    for(let i=0;i<NS;i++){
      const t=i/NS;
      const x=(t-tau)/scale*4;
      if(Math.abs(x)>3)continue;
      const w=psi(x);
      sumRe+=signal[i]*w;sumIm+=signal[i]*psi(x+0.4)*0.3;
    }
    const e=Math.sqrt(sumRe*sumRe+sumIm*sumIm)/40;
    energy[col*nBands+b]=e;
  }
}
function drawTF(){
  const cIn=new THREE.Color();
  for(let col=0;col<NT;col++){
    for(let b=0;b<nBands;b++){
      const idx=col*nBands+b;
      const e=col<=sweepCol?energy[idx]:0;
      cIn.setHSL(0.55-e*0.55,0.9,clamp(0.08+e*1.5,0.06,0.95));
      cellsMesh.setColorAt(idx,cIn);
      const x=-3.5+col/NT*7.0;
      const y=-1.55+b/nBands*3.2;
      m4.makeTranslation(x,y,0.06);
      cellsMesh.setMatrixAt(idx,m4);
    }
  }
  cellsMesh.instanceMatrix.needsUpdate=true;
  if(cellsMesh.instanceColor)cellsMesh.instanceColor.needsUpdate=true;
}
let sweepCol=0;
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'傅里叶困境:知道频率,丢了何时',en:'Fourier\'s blindness: frequencies without time',
  act(){sweep=1;sweepCol=NT;genSignal();drawSignal();computeAll();drawTF();}},
 {zh:'STFT 两难:窗窄时间准、频率糊',en:'STFT tradeoff: narrow in time, blurry in frequency',
  act(){nBands=8;document.getElementById('sRes').value=8;rebuildAll();}},
 {zh:'母波伸缩:高频窄窗、低频宽窗',en:'One mother, many widths: narrow high, wide low',
  act(){nBands=16;document.getElementById('sRes').value=16;rebuildAll();}},
 {zh:'chirp 画斜线:频率随时间爬升',en:'The chirp draws its ramp',
  act(){sigKind='chirp';sigBtn('bChirp');genSignal();drawSignal();recompute();}},
 {zh:'断点亮成竖线:精确定位突变',en:'The breakpoint lights a vertical line',
  act(){sigKind='break';sigBtn('bBreak');genSignal();drawSignal();recompute();}},
 {zh:'时变和弦:音符在时频图成块',en:'Gated chords: notes become blocks',
  act(){sigKind='chord';sigBtn('bChord');genSignal();drawSignal();recompute();}},
];
function sigBtn(id){['bChirp','bBreak','bChord'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
function computeAll(){for(let c=0;c<NT;c++)computeCol(c);sweepCol=NT-1;}
function recompute(){energy.fill(0);computeAll();drawTF();}
function rebuildAll(){
  rebuildCells();recompute();
  document.getElementById('sResVal').textContent=nBands.toFixed(0);
}
/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stBand').textContent=nBands;
  document.getElementById('stScale').textContent=(sweepCol/NT).toFixed(2);
  let err=0;
  if(sigKind==='break'){
    let bestC=0,be=0;
    for(let c=0;c<NT;c++){const e=energy[c*nBands+nBands-1];if(e>be){be=e;bestC=c;}}
    err=Math.abs(bestC/NT-0.5)*2;
  }
  document.getElementById('stLoc').innerHTML=(err*100).toFixed(1)+' <small>%</small>';
  let tot=0,mx=0;
  for(let i=0;i<NT*nBands;i++){tot+=energy[i];mx=Math.max(mx,energy[i]);}
  document.getElementById('stE').innerHTML=mx?(mx/tot*100).toFixed(0)+'<small>%</small>':'—';
}
function applyPageTheme(dark){
  sigBg.material.color.setHex(dark?0x151b25:0xded7cb);
  tfBg.material.color.setHex(dark?0x151b25:0xded7cb);
}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  $('sRes').addEventListener('input',e=>{nBands=+e.target.value;rebuildAll();});
  $('sSweep').addEventListener('input',e=>{autoSweep=false;sweepCol=clamp(+e.target.value/100*NT,0,NT-1)|0;drawTF();});
  $('bChirp').addEventListener('click',()=>{sigKind='chirp';sigBtn('bChirp');genSignal();drawSignal();recompute();});
  $('bBreak').addEventListener('click',()=>{sigKind='break';sigBtn('bBreak');genSignal();drawSignal();recompute();});
  $('bChord').addEventListener('click',()=>{sigKind='chord';sigBtn('bChord');genSignal();drawSignal();recompute();});
  $('tglAnim').addEventListener('change',e=>{autoSweep=e.target.checked;});
  $('tglWave').addEventListener('change',e=>{mother.visible=e.target.checked;});
  genSignal();drawSignal();rebuildAll();
  addLabel(()=>L('全局正弦:时刻全盲','Global sine: blind to time'),new THREE.Vector3(-5.2,4.0,-0.9),'r');
  addLabel(()=>L('可缩母波:一把尺量所有频','One scalable mother for every band'),new THREE.Vector3(-0.4,0.5,-0.8),'y',()=>mother.visible);
  addLabel(()=>L('高频细看:断点成竖线','High band: the transient lights up'),new THREE.Vector3(4.6,4.0,-0.9),'b');
  addLabel(()=>L('chirp 斜线','Chirp ramp'),new THREE.Vector3(4.6,-0.7,-0.8),'g',()=>sigKind==='chirp');
}
/* ---- 主循环 ---- */
let mwT=0;
function tick(dt,dts){
  if(autoSweep&&sweepCol<NT-1){
    sweepCol=Math.min(NT-1,sweepCol+dts*14);
    computeCol(sweepCol);
    drawTF();
  }
  /* 母波小图随扫描移动/伸缩 */
  mwT+=dts;
  const b=Math.floor((sweepCol/NT)*nBands);
  const scale=1/(b+1);
  const cx=-4.9+ (sweepCol/NT)*3.0;
  const arr=mwGeo.attributes.position.array;
  for(let i=0;i<160;i++){
    const x=(i/159-0.5)*1.6;
    arr[i*3]=cx+x;
    arr[i*3+1]=0.2+psi(x/(scale*4*2.2))*0.7;
    arr[i*3+2]=-0.85;
  }
  mwGeo.attributes.position.needsUpdate=true;
}

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
