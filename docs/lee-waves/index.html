<style>

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;

  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }

  #panel.collapsed > #panelToggle { margin: 0; position: static; }

  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const m4=new THREE.Matrix4();
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);
camera.position.set(-7,6,12);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=120;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyLight=new THREE.DirectionalLight(0xfff2dd,1.05);keyLight.position.set(6,10,8);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9ab8ff,0.3);fillLight.position.set(-8,5,-6);scene.add(fillLight);

/* ---- 页面独特代码(定义 BG_DARK/BG_LIGHT/applyPageTheme/STEPS/updateStats/tick/pageInit) ---- */
const BG_DARK=0x101418,BG_LIGHT=0xe9e4dc;
const S=0.004;            /* 米→场景 缩放 */
const X0=-14,X1=14;
/* ---- 山形 ---- */
const mGeo=new THREE.BufferGeometry();
function ridgeY(x,h){
  const xr=x/6;
  return xr*xr<1?h*Math.exp(-xr*xr*2.2):0;
}
{const pos=[];
 for(let i=0;i<=120;i++){
   const x=X0+i/120*(X1-X0);
   pos.push(x,0,2.4);pos.push(x,ridgeY(x,800)*S,2.4);pos.push(x,ridgeY(x,800)*S,-2.4);pos.push(x,0,-2.4);
 }
 mGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 const idx=[];for(let i=0;i<120;i++){const b=i*4;idx.push(b,b+1,b+2,b,b+2,b+3);}
 mGeo.setIndex(idx);mGeo.computeVertexNormals();}
const mountain=new THREE.Mesh(mGeo,new THREE.MeshStandardMaterial({color:0x8a6a45,roughness:0.9,side:THREE.DoubleSide}));
scene.add(mountain);
/* ---- 流线粒子 ---- */
const NP=300;
const pM=new THREE.MeshStandardMaterial({color:0xa5d8ff,roughness:0.4});
const flowP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,5),pM,NP);
flowP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
flowP.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NP*3),3);
scene.add(flowP);
const parts=[];
for(let i=0;i<NP;i++)parts.push({x:X0+Math.random()*(X1-X0),y0:100+Math.random()*2400,ph:Math.random()*100});
/* ---- 荚状云 ---- */
function lenticular(){
  const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:0xf8f9fa,roughness:0.9,transparent:true,opacity:0.85});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),m);
  body.scale.set(1.6,0.32,0.9);g.add(body);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.75,20,14),m.clone());
  cap.scale.set(1.5,0.3,0.85);cap.position.y=0.28;g.add(cap);
  scene.add(g);return g;
}
const clouds=[];
for(let i=0;i<4;i++)clouds.push(lenticular());
/* ---- 滑翔机 ---- */
const glider=new THREE.Group();
const wing=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.03,0.18),
  new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.4}));
const fusel=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.02,0.5,8),
  new THREE.MeshStandardMaterial({color:0xf8f9fa,roughness:0.4}));
fusel.rotation.z=Math.PI/2;
glider.add(wing,fusel);scene.add(glider);
let gliderOn=false,gliderX=2.0,gliderAlt=0.8;
/* ---- 流场:解析背风波 ---- */
let windV=10,ridgeH=800,stab=1.6;
const Lz=2200;                       /* 垂直波长(米) */
function waveLambda(){return 2*Math.PI*windV/(0.01*stab)*1.4;}   /* 示意标度 */
function wField(x,y){
  /* 水平 u + 垂直 w(山后驻波) */
  const u=windV;
  const h=ridgeY(x,ridgeH);
  if(h<1)return {u,w:0};
  const L=waveLambda();
  const k=2*Math.PI/L;
  const env=x>0?Math.exp(-x/9000):Math.exp(x/3000)*1.0;
  const ph=k*x;
  const w=windV*0.5*env*Math.sin(ph)*Math.exp(-y/5000)* (ridgeH/800);
  const du=windV*0.35*env*Math.cos(ph)*Math.exp(-y/5000)*(ridgeH/800)*Math.sin(ph*0);
  return {u:u+du*0.3,w};
}
function cloudY(i){return (2600+i*700)*S;}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'层结像弹簧:过冲被浮力弹回',en:'The layer is a spring: overshoot rebounds',
  act(){windV=10;ridgeH=800;stab=1.6;syncUI();}},
 {zh:'翻山抬升:迎风湿冷、背风下沉',en:'Windward lift, lee sink',
  act(){windV=6;syncUI();}},
 {zh:'驻波锁定:波列原地站立',en:'Locked standing waves',
  act(){windV=12;stab=2.2;syncUI();}},
 {zh:'荚状云:波峰凝出、狂风不动',en:'Lenticulars: born at crests, still in gales',
  act(){windV=18;tglOn('tglCloud',true);syncUI();}},
 {zh:'滑翔机沿无形的坡爬升',en:'The glider climbs the invisible slope',
  act(){gliderOn=true;windV=14;syncUI();}},
 {zh:'强风:滚轴与下坡风狂飙',en:'Gale: rotors and downslope wind',
  act(){windV=26;ridgeH=1400;syncUI();}},
];
function tglOn(id,v){const el=document.getElementById(id);el.checked=v;el.dispatchEvent(new Event('change'));}
function syncUI(){
  document.getElementById('sWind').value=windV;document.getElementById('sWindVal').textContent=windV.toFixed(0);
  document.getElementById('sMount').value=ridgeH;document.getElementById('sMountVal').textContent=ridgeH.toFixed(0);
  document.getElementById('sStab').value=stab;document.getElementById('sStabVal').textContent=stab.toFixed(1);
}
/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stLam2').innerHTML=(waveLambda()/1000).toFixed(1)+' <small>km</small>';
  const wmax=windV*0.5*(ridgeH/800);
  document.getElementById('stW').innerHTML=wmax.toFixed(1)+' <small>m/s</small>';
  document.getElementById('stCloud').innerHTML=(cloudY(0)/S).toFixed(0)+' <small>m</small>';
  document.getElementById('stGlider').innerHTML=(gliderAlt/S).toFixed(0)+' <small>m</small>';
}
function applyPageTheme(dark){}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  const bind=(id,dec,fn)=>{const el=$(id);const f=()=>{fn(+el.value);$(id+'Val').textContent=(+el.value).toFixed(dec);};el.addEventListener('input',f);f();};
  bind('sWind',0,v=>{windV=v;});
  bind('sMount',0,v=>{ridgeH=v;});
  bind('sStab',1,v=>{stab=v;});
  $('bCalm').addEventListener('click',()=>{windV=4;syncUI();});
  $('bGale').addEventListener('click',()=>{windV=26;syncUI();});
  $('bGlider').addEventListener('click',()=>{gliderOn=!gliderOn;$('bGlider').classList.toggle('on',gliderOn);});
  $('tglStream').addEventListener('change',e=>{flowP.visible=e.target.checked;});
  $('tglCloud').addEventListener('change',e=>{clouds.forEach(c=>c.visible=e.target.checked);});
  syncUI();
  addLabel(()=>L('迎风抬升:绝热冷却','Windward: lifted, cooling'),new THREE.Vector3(-3.4,3.6,0),'b');
  addLabel(()=>L('过冲回摆:浮力的弹簧','Overshoot: buoyancy springs back'),new THREE.Vector3(3.0,3.2,0),'g');
  addLabel(()=>L('荚状云:狂风中纹丝不动','Lenticular: still in the gale'),new THREE.Vector3(5.4,4.6,0),'y',()=>clouds[0].visible);
  addLabel(()=>L('滑翔爬升:无形波坡','Climbing the invisible slope'),new THREE.Vector3(6.4,1.6,0.8),'r',()=>gliderOn);
}
/* ---- 主循环 ---- */
function tick(dt,dts){
  for(let i=0;i<NP;i++){
    const p=parts[i];
    const ym=p.y0*S;
    const f=wField(p.x,ym/S);
    p.x+=f.u*dts*0.32;
    if(p.x>X1)p.x=X0,p.y0=100+Math.random()*2400;
    const wPix=f.w*S*1.6;
    p.disp=clamp(ym+wPix*6,0.05,7.5);
    m4.makeTranslation(p.x,p.disp,(i%3-1)*0.7);
    flowP.setMatrixAt(i,m4);
    const c=new THREE.Color().setHSL(0.58-clamp(f.w,0,8)*0.04,0.7,0.55+clamp(f.w,-3,8)*0.03);
    flowP.setColorAt(i,c);
  }
  flowP.instanceMatrix.needsUpdate=true;
  flowP.instanceColor.needsUpdate=true;
  /* 荚状云驻波峰位 */
  const L=waveLambda();
  clouds.forEach((c,i)=>{
    const x=1.5+i*L*0.0035*3.2;
    c.position.set(Math.min(x,13),cloudY(i)+Math.sin(perfT*0.3+i)*0.03,0);
    c.visible=c.visible!==false;
    const windup=windV>20?1:0.8;
    c.scale.setScalar(0.55+0.1*i+0.12*(ridgeH/800)*windup);
  });
  /* 滑翔机 */
  if(gliderOn&&dts>0){
    gliderX+=windV*dts*0.02;
    if(gliderX>12)gliderX=1.0;
    const f=wField(gliderX,gliderAlt/S);
    gliderAlt=Math.max(0.6,gliderAlt+f.w*dts*0.09);
    if(gliderAlt>6.4)gliderAlt=6.4;
    glider.position.set(gliderX,gliderAlt,0.6);
    glider.rotation.z=clamp(-f.w*0.05,-0.35,0.35);
  }
  glider.visible=gliderOn;
  mountain.scale.y=ridgeH/800;
  perfT+=dt;
}
let perfT=0;

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
