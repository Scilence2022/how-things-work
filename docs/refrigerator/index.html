<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电冰箱 · 用压缩循环把热量从冷处搬到热处</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电冰箱 · 用压缩循环把热量从冷处搬到热处" data-en="The Refrigerator · pumping heat uphill with a compression cycle">电冰箱 · 用压缩循环把热量从冷处搬到热处</h1>
  <div class="sub" data-zh="热量自己只从热到冷,所以要请压缩机做功把它搬上去:高温高压气体在冷凝器放热变液,毛细管一节流压强骤降,蒸发器里吸热汽化——那才是冷的地方;COP=T_c/(T_h−T_c),温差越大越费电 · 拖动旋转 / 空格运行/暂停" data-en="Heat only flows hot→cold on its own, so a compressor is paid to pump it uphill: hot gas sheds heat in the condenser, the capillary slashes the pressure, the evaporator boils and absorbs heat — that's where the cold is; COP=T_c/(T_h−T_c), bigger gaps cost more watts · drag to orbit / Space = run/pause">热量自己只从热到冷,所以要请压缩机做功把它搬上去:高温高压气体在冷凝器放热变液,毛细管一节流压强骤降,蒸发器里吸热汽化——那才是冷的地方;COP=T_c/(T_h−T_c),温差越大越费电 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="冷藏室温度" data-en="Cabinet temp">冷藏室温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="蒸发温度" data-en="Evap temp">蒸发温度</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="COP(卡诺)" data-en="COP (Carnot)">COP(卡诺)</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="压缩机占空比" data-en="Duty">压缩机占空比</span><span class="v" id="stD">—</span>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSteady" data-zh="稳态运行" data-en="Steady run">稳态运行</button>
    <button class="abtn" id="bSoup" data-zh="放入热汤" data-en="Hot soup in">放入热汤</button>
    <button class="abtn" id="bPower" data-zh="断电升温" data-en="Power cut">断电升温</button>
  </div>
  <div class="row">
    <label data-zh="室温 °C" data-en="Room °C">室温 °C</label>
    <input id="sRoom" type="range" min="16" max="36" step="1" value="25">
    <span class="val" id="sRoomVal">25</span>
  </div>
  <div class="row">
    <label data-zh="设定温度 °C" data-en="Setpoint °C">设定温度 °C</label>
    <input id="sSet" type="range" min="0" max="8" step="1" value="4">

  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRef" type="checkbox" checked> <span data-zh="制冷剂" data-en="Refrigerant">制冷剂</span></label>
      <label><input id="tglHeat" type="checkbox" checked> <span data-zh="热粒子" data-en="Heat dots">热粒子</span></label>
    </div>

    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../heat-pump/" data-zh="热泵⇄制冷" data-en="Heat pump">热泵</a>

    <a href="../joule-thomson/" data-zh="焦耳–汤姆逊效应" data-en="Joule–Thomson">焦耳–汤姆逊</a>
    <a href="../entropy/" data-zh="熵" data-en="Entropy">熵</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,28,80);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-5.5,4.2,11);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.4,2.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(28,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 箱体(剖开正面) ---- */
const fridgeG=new THREE.Group();fridgeG.position.set(-0.9,0,0);scene.add(fridgeG);
const shellM=new THREE.MeshStandardMaterial({color:0xb9c2cc,roughness:0.35,metalness:0.25});
const back=new THREE.Mesh(new THREE.BoxGeometry(1.7,3.1,0.08),shellM);
back.position.set(0,1.55,-0.42);fridgeG.add(back);
for(const s of [-0.85,0.85]){
  const side=new THREE.Mesh(new THREE.BoxGeometry(0.08,3.1,0.9),shellM);
  side.position.set(s,1.55,-0.02);fridgeG.add(side);
}
const topP=new THREE.Mesh(new THREE.BoxGeometry(1.78,0.08,0.95),shellM);
topP.position.set(0,3.12,-0.02);fridgeG.add(topP);
const botP=topP.clone();botP.position.y=0.04;fridgeG.add(botP);
/* 内胆(浅色) */
const innerM=new THREE.MeshStandardMaterial({color:0xe8eef4,roughness:0.6,side:THREE.BackSide});
const inner=new THREE.Mesh(new THREE.BoxGeometry(1.55,2.95,0.8),innerM);
inner.position.set(0,1.57,0);fridgeG.add(inner);
/* 隔板:冷冻室(上)/冷藏室(下) */
const shelf=new THREE.Mesh(new THREE.BoxGeometry(1.55,0.06,0.8),
  new THREE.MeshStandardMaterial({color:0xdfe6ee,roughness:0.6}));
shelf.position.set(0,1.95,0);fridgeG.add(shelf);
/* 门(半开,可开关) */
const doorPivot=new THREE.Group();doorPivot.position.set(-0.85,1.55,0.43);fridgeG.add(doorPivot);
const doorM=new THREE.MeshStandardMaterial({color:0xc4cdd6,roughness:0.35,metalness:0.3});
const door=new THREE.Mesh(new THREE.BoxGeometry(0.09,3.05,0.88),doorM);
door.position.set(0,0,0.05);doorPivot.add(door);
doorPivot.rotation.y=0.55;

/* ---- 四大件 ---- */
const pipeM=new THREE.MeshStandardMaterial({color:0x8a5a44,metalness:0.5,roughness:0.4});
/* 压缩机(底部黑罐) */
const compM=new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.4,metalness:0.5});
const comp=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.42,20),compM);
comp.position.set(0.45,0.32,0.1);fridgeG.add(comp);
/* 冷凝器:背板蛇形管 */
const condPts=[];
for(let i=0;i<7;i++){
  condPts.push(new THREE.Vector3(0.72,0.75+i*0.33,-0.52));
  condPts.push(new THREE.Vector3(-0.55,0.75+i*0.33+0.16,-0.52));
}
const condCurve=new THREE.CatmullRomCurve3(condPts);
const condenser=new THREE.Mesh(new THREE.TubeGeometry(condCurve,120,0.035,8),pipeM);
fridgeG.add(condenser);
/* 蒸发器:两室各一盘蛇管 */
function evapCoil(y){
  const pts=[];
  for(let i=0;i<6;i++)pts.push(new THREE.Vector3(-0.55+ (i%2)*1.0, y+i*0.09, 0.05-(i%2)*0.12));
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,0.035,8),
    new THREE.MeshStandardMaterial({color:0x9fb8cc,metalness:0.6,roughness:0.3}));
}
const evapF=evapCoil(2.25);fridgeG.add(evapF);   // 冷冻
const evapC=evapCoil(1.15);fridgeG.add(evapC);   // 冷藏
/* 毛细管(细) */
const capCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.72,3.0,-0.5),new THREE.Vector3(0.6,2.9,-0.1),
  new THREE.Vector3(0.62,2.55,0.0)]);
const capillary=new THREE.Mesh(new THREE.TubeGeometry(capCurve,40,0.016,6),pipeM);
fridgeG.add(capillary);

/* ---- 制冷剂回路曲线(参数 t:0 排气→0.22 冷凝完→0.3 毛细→0.38-0.75 蒸发→0.9 回气) ---- */
const loopPts=[
  new THREE.Vector3(0.45,0.55,0.1),     // 0 排气口
  new THREE.Vector3(0.72,0.9,-0.52),    // 冷凝器
  new THREE.Vector3(-0.4,1.7,-0.52),
  new THREE.Vector3(0.72,2.5,-0.52),
  new THREE.Vector3(0.72,3.0,-0.5),     // 冷凝完
  new THREE.Vector3(0.62,2.55,0.0),     // 毛细完
  new THREE.Vector3(0.45,2.3,0.05),     // 进冷冻蒸发器
  new THREE.Vector3(0.45,2.6,0.05),
  new THREE.Vector3(0.45,1.5,0.05),     // 冷藏蒸发器
  new THREE.Vector3(-0.55,1.15,0.05),
  new THREE.Vector3(0.1,0.7,0.08),
  new THREE.Vector3(0.45,0.45,0.1)      // 回压缩机
];
const loopCurve=new THREE.CatmullRomCurve3(loopPts,true);
const loopLine=new THREE.Mesh(new THREE.TubeGeometry(loopCurve,140,0.012,6),
  new THREE.MeshBasicMaterial({color:0x55637a,transparent:true,opacity:0.5}));
fridgeG.add(loopLine);
/* 关键节点位置(回路参数) */
const T_COND_S=0.05,T_COND_E=0.26,T_CAP=0.34,T_EVAP_S=0.38,T_EVAP_E=0.78;

/* ---- 制冷剂粒子 ---- */
const NREF=44;
const refM=new THREE.MeshBasicMaterial({});
const refr=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,8),refM,NREF);
refr.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NREF*3),3);
scene.add(refr);
const refT=new Float32Array(NREF).map((_,i)=>i/NREF);
const cHot=new THREE.Color(0xff6b6b),cWarm=new THREE.Color(0xffa94d),
      cCold=new THREE.Color(0x74c0fc),cMist=new THREE.Color(0xa5d8ff);
const tmpC=new THREE.Color();
function refColor(t){
  if(t<T_COND_S)return cHot;                    // 排气:高温高压气体
  if(t<T_COND_E)return cHot.clone().lerp(cWarm,(t-T_COND_S)/(T_COND_E-T_COND_S)); // 冷凝渐冷液化
  if(t<T_CAP)return cWarm;
  if(t<T_EVAP_S)return cWarm.clone().lerp(cCold,0.7);  // 节流闪蒸
  if(t<T_EVAP_E)return cCold;                   // 蒸发:低温吸热
  return cCold.clone().lerp(cHot,(t-T_EVAP_E)/(1-T_EVAP_E)*0.5);
}
/* 热粒子:箱内向蒸发器漂 / 背板向外散 */
const NHOT=48;
const hotM=new THREE.MeshBasicMaterial({transparent:true,opacity:0.7});
const hotDots=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,6,6),hotM,NHOT);
hotDots.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NHOT*3),3);
scene.add(hotDots);
const hotP=[];
for(let i=0;i<NHOT;i++)hotP.push({x:(Math.random()-0.5)*1.3,y:0.4+Math.random()*2.4,
  z:(Math.random()-0.5)*0.6,back:i%3===0,vx:0,vy:0});

/* ---- 温度曲线板 ---- */
const curveG=new THREE.Group();curveG.position.set(3.6,4.1,-2.4);curveG.rotation.y=-0.55;scene.add(curveG);
const cBoard=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
curveG.add(cBoard);
const tempLine=new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0x74c0fc}));
tempLine.position.z=0.05;curveG.add(tempLine);
const CN=140,tempVals=new Float32Array(CN);let tempHead=0,tempCount=0;
function pushTemp(v){tempVals[tempHead]=v;tempHead=(tempHead+1)%CN;tempCount=Math.min(CN,tempCount+1);}
function drawTemp(){
  const pts=[];
  for(let j=0;j<tempCount;j++){
    const idx=((tempHead-tempCount+j)%CN+CN)%CN;
    const y=clamp((tempVals[idx]+24)/60,0,1);
    pts.push(new THREE.Vector3(-2.0+j/(CN-1)*4.0,(y-0.5)*1.9,0.06));
  }
  tempLine.geometry.setFromPoints(pts);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('压缩机:做功,把冷蒸气压成高温高压','Compressor: the work input — cold vapor squeezed hot'),new THREE.Vector3(0.45,0.02,0.6),'o');
addLabel(()=>L('冷凝器:对室温放热,气变液','Condenser: sheds heat to the room, gas → liquid'),new THREE.Vector3(-1.4,2.6,-0.6),'r');
addLabel(()=>L('毛细管:一节流,压强骤降部分闪蒸','Capillary: the throttling drop — pressure collapses, flash vapor'),new THREE.Vector3(1.5,2.8,0),'y');
addLabel(()=>L('蒸发器:吸热汽化——这才是冷的地方','Evaporator: boils and absorbs heat — where the cold is'),new THREE.Vector3(-2.6,2.2,0.4),'b');
addLabel(()=>L('温度曲线:开门/热汤都会顶起它','The trace: doors and hot soup bump it up'),new THREE.Vector3(3.6,5.4,-2.4),'g',()=>tglCurveOn);

/* ---- 状态与热学 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let roomT=25,setT=4,cabT=4,duty=0,power=true,doorOpen=false,doorAngle=0.55,doorTarget=0.55;
let soupHeat=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
let tglCurveOn=true;
function evapT(){return setT-9-Math.min(4,duty*3);}   // 蒸发温度比设定低一截
function condT(){return roomT+14+duty*6;}             // 冷凝温度
function copCarnot(){
  const Tc=evapT()+273.15,Th=condT()+273.15;
  return Tc/(Th-Tc);
}
function setRoom(v){roomT=v;document.getElementById('sRoom').value=v;
  document.getElementById('sRoomVal').textContent=v.toFixed(0);}
function setSet(v){setT=v;document.getElementById('sSet').value=v;
  document.getElementById('sSetVal').textContent=v.toFixed(0);}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'热量自己只从热到冷:必须做功才能逆着搬',en:'Heat flows hot→cold alone: work is the price of pumping it back',
  act(){power=true;doorOpen=false;doorTarget=0.55;soupHeat=0;document.getElementById('bSteady').classList.add('on');}},
 {zh:'压缩机做功:冷蒸气被压成 60 °C 的高压气体',en:'Compression: cold vapor squeezed into hot high-pressure gas',
  act(){power=true;}},
 {zh:'冷凝器放热:对室温散热,气体液化(背板热的就是它)',en:'Condensation: heat dumped to the room, gas condenses — the warm back panel',
  act(){power=true;setRoom(28);}},
 {zh:'毛细管节流:压强骤降,一部分瞬间闪蒸降温',en:'Throttling: pressure collapses, part of the liquid flashes cold',
  act(){power=true;}},
 {zh:'蒸发器吸热:箱里的热钻进冷管,这才是冷的地方',en:'Evaporation: cabinet heat soaks into the cold coil — this is the cold',
  act(){power=true;setSet(2);}},
 {zh:'COP=T_c/(T_h−T_c):温差拉大,同样的搬运更费电',en:'COP=T_c/(T_h−T_c): wider gaps cost more work per joule moved',
  act(){setRoom(34);setSet(0);power=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const t=document.getElementById('stT');
  t.innerHTML=cabT.toFixed(1)+'<small> °C</small>';
  t.className='v'+(cabT>setT+3?' warn':' ok');
  document.getElementById('stE').innerHTML=evapT().toFixed(1)+'<small> °C</small>';
  const c=document.getElementById('stC');
  c.innerHTML=power?copCarnot().toFixed(1):'—';
  const d=document.getElementById('stD');
  d.innerHTML=(duty*100).toFixed(0)+'<small> %</small>';
  d.className='v'+(duty>0.85?' warn':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSteady').addEventListener('click',()=>{
  power=true;doorTarget=0.55;soupHeat=0;
  document.getElementById('bSteady').classList.add('on');
  document.getElementById('bSoup').classList.remove('on');
  document.getElementById('bPower').classList.remove('on');
});
document.getElementById('bSoup').addEventListener('click',()=>{
  soupHeat=9;power=true;doorTarget=1.5;
  document.getElementById('bSoup').classList.add('on');
  document.getElementById('bSteady').classList.remove('on');
  document.getElementById('bPower').classList.remove('on');
});
document.getElementById('bPower').addEventListener('click',()=>{
  power=false;
  document.getElementById('bPower').classList.add('on');
  document.getElementById('bSteady').classList.remove('on');
  document.getElementById('bSoup').classList.remove('on');
});
document.getElementById('sRoom').addEventListener('input',e=>setRoom(+e.target.value));
document.getElementById('sSet').addEventListener('input',e=>setSet(+e.target.value));
document.getElementById('tglHeat').addEventListener('change',e=>{hotDots.visible=e.target.checked;});
document.getElementById('tglRef').addEventListener('change',e=>{refr.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpV=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0);
  simT+=dts;
  /* 门动画 */
  doorAngle+=(doorTarget-doorAngle)*Math.min(1,dts*2.5);
  doorPivot.rotation.y=doorAngle;
  doorOpen=doorAngle>0.9;
  /* 恒温器与热学 */
  if(power){
    duty=clamp((cabT-setT)*0.45+0.08,0,1);
  }else duty=0;
  const leak=(roomT-cabT)*0.010+(doorOpen?0.055:0)+soupHeat*0.012;
  cabT+=(leak-duty*0.30*(setT+9)/13)*dts*4;
  cabT=clamp(cabT,-24,roomT+2);
  soupHeat=Math.max(0,soupHeat-dts*0.5);
  /* 制冷剂粒子 */
  if(refr.visible){
    const speed=power?(0.028+duty*0.035):0.004;
    for(let i=0;i<NREF;i++){
      refT[i]=(refT[i]+dts*speed)%1;
      loopCurve.getPointAt(refT[i],tmpV);
      const sc=0.8+0.5*Math.sin(simT*8+i)*power;
      m4.makeScale(sc,sc,sc);m4.setPosition(tmpV.x-0.9,tmpV.y,tmpV.z);
      refr.setMatrixAt(i,m4);
      tmpC.copy(refColor(refT[i]));
      refr.setColorAt(i,tmpC);
    }
    refr.instanceMatrix.needsUpdate=true;
    if(refr.instanceColor)refr.instanceColor.needsUpdate=true;
  }
  /* 热粒子:箱内向外漂向蒸发器,背板向外飘 */
  if(hotDots.visible){
    const on=power&&duty>0.05;
    for(let i=0;i<NHOT;i++){
      const h=hotP[i];
      if(h.back){
        h.x+=Math.sin(simT*1.3+i)*0.002-dts*0.05;
        h.y+=dts*(power?0.10:0.03);
        if(h.y>3.4){h.y=0.7;h.x=0.72+(Math.random()-0.5)*0.2;}
        if(h.x<0.2)h.x=0.9;
      }else{
        /* 箱内:向本室蒸发器漂 */
        const ey=h.y>1.95?2.3:1.25;
        h.y+=(ey-h.y)*dts*0.35;
        h.x+=((Math.random()-0.5)-h.x*0.2)*dts*0.2;
        h.z+=((0.05-h.z))*dts*0.3;
        if(cabT<setT+0.5&&Math.random()<dts*0.4){h.y=0.5+Math.random()*2.2;h.x=(Math.random()-0.5)*1.3;h.z=(Math.random()-0.5)*0.6;}
      }
      tmpC.setHex(h.back?0xffa94d:0xff8787);
      const vis=power||!h.back?1:0.4;
      m4.makeScale(vis,vis,vis);
      m4.setPosition(h.x-0.9,h.y,h.z);
      hotDots.setMatrixAt(i,m4);
      hotDots.setColorAt(i,tmpC);
    }
    hotDots.instanceMatrix.needsUpdate=true;
    if(hotDots.instanceColor)hotDots.instanceColor.needsUpdate=true;
  }
  /* 压缩机嗡嗡(压缩罐微缩放) */
  const hum=power?1+0.02*Math.sin(simT*40)*duty:1;
  comp.scale.set(hum,1,hum);
  compM.emissive=new THREE.Color(0x000000);
  /* 温度曲线 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;pushTemp(cabT);drawTemp();updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
tglCurveOn=true;
applyTheme();buildSteps();
setRoom(25);setSet(4);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
