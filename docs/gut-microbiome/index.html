<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>肠道菌群与宿主共生 · 一公斤房客</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#69db7c;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#2f9e44;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d1310,26,80);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(6,6.5,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xe4f2e0,0x131a14,0.55));
const key=new THREE.DirectionalLight(0xfff6e8,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x121813,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(28,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 肠管:半透明圆管 + 截面端口 ---- */
const AX=3.3;
const UP3=new THREE.Vector3(0,1,0);
const tubeM=new THREE.MeshPhysicalMaterial({color:0xd98a7a,transparent:true,opacity:0.13,roughness:0.45,side:THREE.DoubleSide,depthWrite:false});
const tube=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.1,21,48,1,true),tubeM);
tube.rotation.z=Math.PI/2;tube.position.y=AX;scene.add(tube);
const ringM=new THREE.MeshStandardMaterial({color:0xc97a66,roughness:0.5});
[-10.5,10.5].forEach(x=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3.1,0.09,10,48),ringM);
  ring.rotation.y=Math.PI/2;ring.position.set(x,AX,0);scene.add(ring);
  const cap=new THREE.Mesh(new THREE.CircleGeometry(3.05,32),
    new THREE.MeshBasicMaterial({color:0x150f12,transparent:true,opacity:0.6,side:THREE.DoubleSide,depthWrite:false}));
  cap.rotation.y=Math.PI/2;cap.position.set(x*1.01,AX,0);scene.add(cap);
});
/* 内壁绒毛:小圆锥阵列 */
const villi=new THREE.InstancedMesh(new THREE.ConeGeometry(0.09,0.34,6),
  new THREE.MeshStandardMaterial({color:0xdb8f96,roughness:0.6}),38*14);
{
  const q=new THREE.Quaternion(),inn=new THREE.Vector3(),vm4=new THREE.Matrix4();
  let vi=0;
  for(let ix=0;ix<38;ix++)for(let k=0;k<14;k++){
    const a=(k+(ix%2)*0.5)/14*Math.PI*2;
    inn.set(0,-Math.cos(a),-Math.sin(a));
    q.setFromUnitVectors(UP3,inn);
    vm4.makeRotationFromQuaternion(q);
    vm4.setPosition(-9.9+ix*(19.8/37),AX+2.88*Math.cos(a),2.88*Math.sin(a));
    villi.setMatrixAt(vi++,vm4);
  }
  villi.instanceMatrix.needsUpdate=true;
}
scene.add(villi);
/* 黏液层(厚度可变) */
const mucusM=new THREE.MeshPhysicalMaterial({color:0xf7f3b8,transparent:true,opacity:0.12,roughness:0.3,side:THREE.DoubleSide,depthWrite:false});
const mucus=new THREE.Mesh(new THREE.CylinderGeometry(2.78,2.78,20.6,48,1,true),mucusM);
mucus.rotation.z=Math.PI/2;mucus.position.y=AX;scene.add(mucus);

/* ---- 菌群:6 种细菌(杆/球,InstancedMesh)---- */
const MAXN=40,K=115;
const rodGeo=new THREE.CapsuleGeometry(0.075,0.24,4,8);
const ballGeo=new THREE.SphereGeometry(0.13,10,8);
const SPECIES=[
  {shape:'rod', color:0x69db7c,res:false,rate:0.9 },
  {shape:'ball',color:0x38d9a9,res:false,rate:0.8 },
  {shape:'rod', color:0xb197fc,res:false,rate:0.7 },
  {shape:'ball',color:0xffd43b,res:false,rate:0.6 },
  {shape:'rod', color:0x74c0fc,res:false,rate:0.65},
  {shape:'rod', color:0xff6b6b,res:true, rate:0.5 },
];
for(const S of SPECIES){
  S.mesh=new THREE.InstancedMesh(S.shape==='rod'?rodGeo:ballGeo,
    new THREE.MeshStandardMaterial({color:S.color,roughness:0.4,emissive:S.color,emissiveIntensity:0.25}),MAXN);
  S.px=new Float32Array(MAXN);S.py=new Float32Array(MAXN);S.pz=new Float32Array(MAXN);
  S.vx=new Float32Array(MAXN);S.vy=new Float32Array(MAXN);S.vz=new Float32Array(MAXN);
  S.ph=new Float32Array(MAXN);
  for(let k=0;k<MAXN;k++){
    const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*2.3;
    S.px[k]=Math.random()*16-8;S.py[k]=AX+Math.cos(a)*r;S.pz[k]=Math.sin(a)*r;
    S.vx[k]=(Math.random()-0.5)*0.4;S.vy[k]=(Math.random()-0.5)*0.4;S.vz[k]=(Math.random()-0.5)*0.4;
    S.ph[k]=Math.random()*10;
    const hm=new THREE.Matrix4().makeScale(0.001,0.001,0.001);hm.setPosition(0,-99,0);
    S.mesh.setMatrixAt(k,hm);
  }
  scene.add(S.mesh);
}

/* ---- 膳食纤维颗粒(棕色小块)---- */
const NFIB=26;
const fiberMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.13,0.1,0.14),
  new THREE.MeshStandardMaterial({color:0x8d6238,roughness:0.85}),NFIB);
scene.add(fiberMesh);
const fibers=[];for(let i=0;i<NFIB;i++)fibers.push({st:0,x:0,y:0,z:0,vy:0,dig:0,ph:Math.random()*10});
function spawnFiber(n){
  for(const f of fibers){
    if(n<=0)break;
    if(f.st===0){n--;f.st=1;f.dig=0;
      f.x=Math.random()*14-7;f.y=7.4+Math.random()*1.6;f.z=Math.random()*2-1;f.vy=0;}
  }
}
/* ---- SCFA 小分子(青绿发光)---- */
const NSC=48;
const scfaMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,8,6),
  new THREE.MeshStandardMaterial({color:0x38d9a9,emissive:0x38d9a9,emissiveIntensity:1.1}),NSC);
scene.add(scfaMesh);
const scfas=[];for(let i=0;i<NSC;i++)scfas.push({t:-1,x:0,y:0,z:0,dx:0,dy:0,dz:0});
function spawnSCFA(n,x,y,z){
  for(const q of scfas){
    if(n<=0)break;
    if(q.t<0){n--;q.t=0;q.x=x;q.y=y;q.z=z;
      let dy=y-AX,dz=z,l=Math.hypot(dy,dz);
      if(l<0.05){dy=1;dz=0;l=1;}
      q.dx=(Math.random()-0.5)*0.3;q.dy=dy/l;q.dz=dz/l;}
  }
}
/* ---- 免疫细胞(白色小球,壁面巡样)---- */
const immune=[];
for(let i=0;i<5;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.17,14,12),
    new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.35,emissive:0x555555,emissiveIntensity:0.15}));

  immune.push({m,a0:Math.random()*Math.PI*2,sg:i%2?1:-1,x0:-6+i*3,ph:Math.random()*10,cx:0,pulse:0});
}
/* ---- 多样性历史条带(3D 条块)---- */
const HISTN=44;
const barMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.3,1,0.3),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5}),HISTN);
{
  const hm=new THREE.Matrix4().makeScale(0.001,0.001,0.001);hm.setPosition(0,-99,0);
  for(let i=0;i<HISTN;i++){barMesh.setMatrixAt(i,hm);barMesh.setColorAt(i,new THREE.Color(0x69db7c));}

  if(barMesh.instanceColor)barMesh.instanceColor.needsUpdate=true;

scene.add(barMesh);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let fiberV=55,abxDose=70;
let killT=0,damaged=false,boostT=0,mucusT=0.55,scfaRate=0,divNow=0;
let fiberAutoT=3,histAcc=0;
const pop=[30,24,17,13,11,4];
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];

  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('发酵菌群:纤维加工厂','Fermenters: the fiber refinery'),new THREE.Vector3(-6,4.9,1.5),'g');
addLabel(()=>L('膳食纤维:宿主啃不动','Dietary fiber: indigestible to you'),new THREE.Vector3(0,7.85,0.3),'o');
addLabel(()=>L('SCFA:喂上皮、促 Treg','SCFAs: fuel for the lining, Treg boost'),new THREE.Vector3(5.5,6.3,-1.2),'b',
  ()=>scfaMesh.visible);
addLabel(()=>L('耐药幸存者:先占坑','Resistant survivors: first to claim space'),new THREE.Vector3(-3,1.1,2.4),'r',
  ()=>pop[5]>6);
addLabel(()=>L('免疫巡样:一次次采样','Immune patrol: constant sampling'),new THREE.Vector3(2.5,6.9,1),'');

function setFiber(v){fiberV=v;document.getElementById('sFiber').value=v;
  document.getElementById('sFiberVal').textContent=v+'%';}
function setAbxDose(v){abxDose=v;document.getElementById('sAbx').value=v;
  document.getElementById('sAbxVal').textContent=v+'%';}
function onBtn(id){['bFiber','bAbx','bPro'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
function diversity(){
  let tot=0;const ps=[];
  for(const p of pop)if(p>0.6){ps.push(p);tot+=p;}
  if(ps.length<2)return 0;
  let H=0;for(const p of ps){const q=p/tot;H-=q*Math.log(q);}
  return H/Math.log(ps.length)*100;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'食物残渣进结肠:自身酶已缴械',en:'Leftover food reaches the colon: your own enzymes have given up',
  act(){setFiber(55);spawnFiber(7);}},
 {zh:'菌群发酵纤维:产短链脂肪酸',en:'The microbiota ferments fiber into short-chain fatty acids',
  act(){setFiber(75);spawnFiber(9);}},
 {zh:'SCFA 喂结肠上皮、促 Treg:免疫在学乖',en:'SCFAs feed the colon lining and boost Tregs: the immune system learns calm',
  act(){setFiber(75);spawnFiber(6);}},
 {zh:'多样性=稳定性:菌种互补占位',en:'Diversity = stability: species cover each other\'s niches',
  act(){setFiber(65);boostT=6;}},
 {zh:'广谱抗生素:一场无差别大扫除',en:'Broad-spectrum antibiotics: an indiscriminate sweep',
  act(){setAbxDose(85);killT=2.5;damaged=true;onBtn('bAbx');}},
 {zh:'重建:梯队恢复、耐药库与益生菌的限位',en:'Rebuilding: tiered recovery, the resistance reservoir, and probiotics\' limits',
  act(){setFiber(80);pop[1]=Math.min(44,pop[1]+9);pop[4]=Math.min(44,pop[4]+7);boostT=8;onBtn('bPro');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const dEl=document.getElementById('stDiv');
  dEl.innerHTML=divNow.toFixed(0)+'<small> /100</small>';
  dEl.className='v '+(divNow>55?'ok':divNow<25?'warn':'');
  document.getElementById('stScfa').innerHTML=scfaRate.toFixed(1)+'<small> mM</small>';
  let total=0;for(const p of pop)total+=p;
  document.getElementById('stTotal').innerHTML=(total*0.09).toFixed(1)+'<small> ×10¹⁰</small>';
  const mEl=document.getElementById('stMuc');
  mEl.innerHTML=(110+mucusT*190).toFixed(0)+'<small> μm</small>';
  mEl.className='v '+(mucusT<0.3?'warn':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bFiber').addEventListener('click',()=>{setFiber(85);boostT=8;onBtn('bFiber');});
document.getElementById('bAbx').addEventListener('click',()=>{killT=2.5;damaged=true;onBtn('bAbx');});
document.getElementById('bPro').addEventListener('click',()=>{
  pop[1]=Math.min(44,pop[1]+9);pop[4]=Math.min(44,pop[4]+7);boostT=6;onBtn('bPro');});
document.getElementById('sFiber').addEventListener('input',e=>setFiber(+e.target.value));
document.getElementById('sAbx').addEventListener('input',e=>setAbxDose(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglScfa').addEventListener('change',e=>{scfaMesh.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d1310:0xe9ece6);
  scene.fog.color.setHex(dark?0x0d1310:0xe9ece6);
  groundM.color.setHex(dark?0x121813:0xc8d1c4);
  tubeM.color.setHex(dark?0xd98a7a:0xb96a58);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),eu=new THREE.Euler();
const cTmp=new THREE.Color(),cGreen=new THREE.Color(0x69db7c);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 种群动态:杀伤期 / 恢复期 */
  let total=0;for(const p of pop)total+=p;
  if(killT>0){killT-=dts;
    for(let i=0;i<6;i++)pop[i]*=Math.exp(-(SPECIES[i].res?0.05:0.35+abxDose*0.008)*dts);
  }else{
    const boost=boostT>0?1.6:1;
    for(let i=0;i<6;i++){
      let rate=SPECIES[i].rate*(0.35+0.95*fiberV/100)*(damaged?0.35:1)*boost;
      if(SPECIES[i].res&&damaged)rate*=3;
      pop[i]=clamp(pop[i]+rate*pop[i]*(1-total/K)*dts,0.2,44);
    }
  }
  boostT=Math.max(0,boostT-dts);
  if(damaged&&total>72)damaged=false;
  const div=diversity();divNow+=(div-divNow)*Math.min(1,dts*3);
  scfaRate+=(16*fiberV/100*(0.3+0.7*divNow/100)*(0.4+0.6*clamp(total/K,0,1))-scfaRate)*Math.min(1,dts*1.5);
  /* 细菌游动 */
  for(let s=0;s<6;s++){
    const S=SPECIES[s],visN=clamp(Math.round(pop[s]),0,MAXN);
    for(let k=0;k<MAXN;k++){
      if(k<visN){
        S.vx[k]+=(Math.random()-0.5)*0.9*dts;S.vy[k]+=(Math.random()-0.5)*0.9*dts;S.vz[k]+=(Math.random()-0.5)*0.9*dts;
        const sp=Math.hypot(S.vx[k],S.vy[k],S.vz[k]);
        if(sp>0.5){const f=0.5/sp;S.vx[k]*=f;S.vy[k]*=f;S.vz[k]*=f;}
        let px=S.px[k]+S.vx[k]*dts*2,py=S.py[k]+S.vy[k]*dts*2,pz=S.pz[k]+S.vz[k]*dts*2;
        px=clamp(px,-9.8,9.8);
        const ry=py-AX,rz=pz,rr=Math.hypot(ry,rz);
        if(rr>2.45){const f=2.4/rr;py=AX+ry*f;pz=rz*f;
          const dot=S.vy[k]*ry/rr+S.vz[k]*rz/rr;
          S.vy[k]-=2*dot*ry/rr;S.vz[k]-=2*dot*rz/rr;}
        S.px[k]=px;S.py[k]=py;S.pz[k]=pz;
        eu.set(S.ph[k]+simT*0.9,S.ph[k]*1.7,S.ph[k]*0.6+simT*0.5);
        m4.makeRotationFromEuler(eu);m4.setPosition(px,py,pz);
      }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
      S.mesh.setMatrixAt(k,m4);
    }
    S.mesh.instanceMatrix.needsUpdate=true;
  }
  /* 纤维:落下 → 被分解 */
  fiberAutoT-=dts;
  if(fiberAutoT<=0){fiberAutoT=4.5-fiberV/100*3;
    if(Math.random()<fiberV/100+0.25)spawnFiber(1+Math.round(fiberV/50));}
  let nf=0;
  for(const f of fibers){
    if(f.st>0){
      if(f.st===1){f.vy-=2.6*dts;f.y+=f.vy*dts;
        if(f.y<4.1){f.st=2;f.vy=0;}}
      else{f.y=Math.max(2.9,f.y-0.1*dts);f.x+=Math.sin(simT*1.3+f.ph)*0.15*dts;
        f.dig+=dts*(0.10+0.22*fiberV/100+0.10*total/K);
        if(f.dig>=1){f.st=0;spawnSCFA(3,f.x,Math.max(2.9,f.y),f.z);}}
      const sc=f.st===2?Math.max(0.001,1-f.dig*0.9):1;
      m4.makeScale(sc,sc,sc);m4.setPosition(f.x,f.y,f.z);
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    fiberMesh.setMatrixAt(nf++,m4);
  }
  fiberMesh.instanceMatrix.needsUpdate=true;
  /* SCFA:飞向肠壁被吸收 */
  let nq=0;
  for(const q of scfas){
    if(q.t>=0){
      q.t+=dts;
      q.x+=q.dx*1.5*dts;q.y+=q.dy*1.5*dts;q.z+=q.dz*1.5*dts;
      if(Math.hypot(q.y-AX,q.z)>2.62){q.t=-1;
        mucusT=Math.min(1,mucusT+0.014);
        for(const im of immune)if(Math.abs(im.cx-q.x)<1.6)im.pulse=1;
        m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
      else{m4.makeScale(1,1,1);m4.setPosition(q.x,q.y,q.z);}
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    scfaMesh.setMatrixAt(nq++,m4);
  }
  scfaMesh.instanceMatrix.needsUpdate=true;
  /* 免疫细胞巡样 */
  for(const im of immune){
    im.ph+=dts*0.05*im.sg;
    im.cx=im.x0+Math.sin(simT*0.12+im.ph)*3.2;
    const a=im.a0+im.ph*2.2;
    im.m.position.set(im.cx,AX+2.72*Math.cos(a),2.72*Math.sin(a));
    im.pulse=Math.max(0,im.pulse-dts*1.4);
    im.m.scale.setScalar(1+im.pulse*0.7);
  }
  /* 黏液层厚度 */
  mucusT=Math.max(0,mucusT-dts*0.005);
  const ms=1+0.12*mucusT;
  mucus.scale.set(ms,1,ms);
  mucusM.opacity=0.05+0.11*mucusT;
  /* 多样性历史条带 */
  histAcc+=dts;
  if(histAcc>1.2){histAcc=0;
    histVals.push(divNow);if(histVals.length>HISTN)histVals.shift();
    for(let i=0;i<HISTN;i++){
      const v=histVals[i];
      if(v===undefined){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
      else{const h=0.12+v/100*1.7;
        m4.makeScale(1,h,1);m4.setPosition(-8.8+i*0.41,0.12+h/2,6.1);
        barMesh.setColorAt(i,cTmp.setHex(0xff6b6b).lerp(cGreen,clamp(v/100,0,1)));}
    }
    barMesh.instanceMatrix.needsUpdate=true;
    if(barMesh.instanceColor)barMesh.instanceColor.needsUpdate=true;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
const histVals=[];
applyTheme();buildSteps();
setFiber(55);setAbxDose(70);spawnFiber(6);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
