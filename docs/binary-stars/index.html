<html lang="zh-CN" data-theme="dark">
<head>

<title>双星与食变星 · 用光变曲线给恒星称重</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c2255c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}

    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}

    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d1016,30,90);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(0,1.3,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x0a0c12,0.4));
const key=new THREE.DirectionalLight(0xfff2dd,0.9);key.position.set(6,10,10);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.25);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面(暗色参照盘)+ 轨道面 + 星野 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x12161d,roughness:1});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-4.6;scene.add(ground);
const planeDisc=new THREE.Mesh(new THREE.CircleGeometry(8.6,64),
  new THREE.MeshBasicMaterial({color:0x5a708c,transparent:true,opacity:0.05,
    side:THREE.DoubleSide,depthWrite:false}));
planeDisc.rotation.x=-Math.PI/2;scene.add(planeDisc);
const m4=new THREE.Matrix4();
const NSG=350;
const starM=new THREE.MeshBasicMaterial({color:0xcfd8ea,transparent:true,opacity:0.85,fog:false});
const starfield=new THREE.InstancedMesh(new THREE.SphereGeometry(0.16,6,6),starM,NSG);
for(let i=0;i<NSG;i++){
  const d=new THREE.Vector3().randomDirection().multiplyScalar(70+Math.random()*40);
  const s=0.5+Math.random()*1.3;
  m4.makeScale(s,s,s);m4.setPosition(d.x,d.y,d.z);
  starfield.setMatrixAt(i,m4);
}
scene.add(starfield);
function glowTexture(r,g,b){
  const c=document.createElement('canvas');c.width=c.height=128;
  const ctx=c.getContext('2d');
  const gr=ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.85)`);
  gr.addColorStop(0.35,`rgba(${r},${g},${b},0.26)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ---- 双星:主星(亮蓝白)+ 伴星(暗红橙)+ 轨道环 + 质心 ---- */
const star1=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),
  new THREE.MeshStandardMaterial({color:0x1a2438,emissive:0x9fc5ff,emissiveIntensity:1.6,roughness:0.35}));
scene.add(star1);
const star2=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),
  new THREE.MeshStandardMaterial({color:0x301410,emissive:0xff7a4d,emissiveIntensity:1.3,roughness:0.4}));
scene.add(star2);
const glow1=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(170,200,255),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.75,fog:false}));
scene.add(glow1);
const glow2=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(255,150,100),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.65,fog:false}));
scene.add(glow2);
function ringLine(){
  const pts=[];
  for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
  return new THREE.BufferGeometry().setFromPoints(pts);
}
const ring1=new THREE.Line(ringLine(),new THREE.LineBasicMaterial({color:0x8a97b8,transparent:true,opacity:0.35}));
scene.add(ring1);
const ring2=new THREE.Line(ringLine(),new THREE.LineBasicMaterial({color:0x8a97b8,transparent:true,opacity:0.22}));
scene.add(ring2);
const crossM=new THREE.MeshBasicMaterial({color:0xffd873});
const cross1=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.02),crossM);scene.add(cross1);
const cross2=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.5),crossM);scene.add(cross2);

/* ---- 3D 光变曲线:一排小方块实时记录流量 ---- */
const NB=200;
const fluxHist=new Float32Array(NB).fill(1);
const bars=new THREE.InstancedMesh(new THREE.BoxGeometry(0.055,1,0.055),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95}),NB);
scene.add(bars);
const baseline=new THREE.Mesh(new THREE.BoxGeometry(14.4,0.03,0.2),
  new THREE.MeshBasicMaterial({color:0x55607a}));
baseline.position.set(0,2.35,-7.5);scene.add(baseline);
const colDim=new THREE.Color(0x3a4354),colHot=new THREE.Color(0xf783ac),colTmp=new THREE.Color();
function flushBars(){
  fluxHist.copyWithin(0,1);fluxHist[NB-1]=fluxNorm;
  for(let i=0;i<NB;i++){
    const f=fluxHist[i];
    const h=0.1+f*3.3;
    m4.makeScale(1,h,1);
    m4.setPosition(-7+i*(14/(NB-1)),2.35+h/2,-7.5);
    bars.setMatrixAt(i,m4);
    colTmp.copy(colDim).lerp(colHot,clamp((f-0.55)/0.45,0,1));
    bars.setColorAt(i,colTmp);
  }
  bars.instanceMatrix.needsUpdate=true;
  if(bars.instanceColor)bars.instanceColor.needsUpdate=true;
}

/* ---- 浮动光谱面板:双吸收线随视向速度摆动 ---- */
const specGroup=new THREE.Group();
specGroup.position.set(0,-2.7,4.6);specGroup.rotation.x=-0.15;scene.add(specGroup);
const specBackM=new THREE.MeshStandardMaterial({color:0x10141b,roughness:0.6});
specGroup.add(new THREE.Mesh(new THREE.BoxGeometry(4.6,1.05,0.06),specBackM));
const continuum=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.8,0.02),
  new THREE.MeshBasicMaterial({color:0x18202c}));
continuum.position.z=0.04;specGroup.add(continuum);
const line1=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.72,0.03),
  new THREE.MeshBasicMaterial({color:0x74c0fc,blending:THREE.AdditiveBlending,transparent:true,
    opacity:0.95,depthWrite:false,fog:false}));
line1.position.z=0.06;specGroup.add(line1);
const line2=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.72,0.03),
  new THREE.MeshBasicMaterial({color:0xffa94d,blending:THREE.AdditiveBlending,transparent:true,
    opacity:0.95,depthWrite:false,fog:false}));
line2.position.z=0.06;specGroup.add(line2);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
const M1=1.6;
let sep=4.2,qr=0.7;
let M2=1.12,Mtot=2.72,R1=0.76,R2=0.59,L1=5.2,L2=1.4,a1=1.7,a2=2.5,Pyr=5,omega=1.3,K1=0,K2=0;
let phase=0,sinI=1,fluxNorm=1,eclipseFrac=0,sampleAcc=0,slowMo=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function overlapArea(d,r1,r2){
  if(d>=r1+r2)return 0;
  if(d<=Math.abs(r1-r2))return Math.PI*Math.min(r1,r2)*Math.min(r1,r2);
  const t1=clamp((d*d+r1*r1-r2*r2)/(2*d*r1),-1,1);
  const t2=clamp((d*d+r2*r2-r1*r1)/(2*d*r2),-1,1);
  const s=0.5*Math.sqrt(Math.max(0,(-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2)));
  return r1*r1*Math.acos(t1)+r2*r2*Math.acos(t2)-s;
}
function derive(){
  M2=M1*qr;Mtot=M1+M2;
  R1=0.55*Math.pow(M1,0.75);R2=0.55*Math.pow(M2,0.75);
  L1=Math.pow(M1,3.5);L2=Math.pow(M2,3.5);
  a1=sep*M2/Mtot;a2=sep*M1/Mtot;
  Pyr=Math.sqrt(sep*sep*sep/Mtot);
  omega=2*Math.PI/(0.9*Pyr);
  ring1.scale.set(a1,1,a1);ring2.scale.set(a2,1,a2);
  star1.scale.setScalar(R1);star2.scale.setScalar(R2);
  glow1.scale.set(R1*6.5,R1*6.5,1);glow2.scale.set(R2*6.5,R2*6.5,1);
}
function setA(v){sep=v;document.getElementById('sA').value=v;
  document.getElementById('sAVal').textContent=v.toFixed(1)+' AU';derive();}
function setQ(v){qr=v;document.getElementById('sQ').value=v;
  document.getElementById('sQVal').textContent=v.toFixed(2);derive();}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblP1=addLabel(()=>L('主星','Primary'),new THREE.Vector3(0,2,0),'b');
const lblP2=addLabel(()=>L('伴星','Secondary'),new THREE.Vector3(0,2,0),'r');
addLabel(()=>L('质心:引力跷跷板的支点','Barycenter: the gravitational seesaw\'s pivot'),
  new THREE.Vector3(0,0.95,0),'y');
addLabel(()=>L('光变曲线','Light curve'),new THREE.Vector3(7.7,6.3,-7.5),'g');
addLabel(()=>L('掩食','Eclipse'),new THREE.Vector3(0,2.3,0),'',()=>eclipseFrac>0.03);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'半数恒星是双星:引力双舞',en:'Half of Sun-like stars are binaries: a gravitational duet',
  act(){setA(4.2);setQ(0.7);flyTo(0,1.1,13.8);
    document.getElementById('bEcl').classList.add('on');document.getElementById('bTop').classList.remove('on');}},
 {zh:'侧视时一颗遮住另一颗:亮度缺口',en:'Edge-on, one star hides the other: notches in the light curve',
  act(){setA(3.6);setQ(0.7);flyTo(0,0.8,12.5);}},
 {zh:'深谷=主食:温度差的账',en:'The deep valley is the primary eclipse: an account of the temperature difference',
  act(){setA(3.0);setQ(0.4);flyTo(0,0.9,12.8);}},
 {zh:'周期+间距:开普勒第三定律出总质量',en:'Period + separation: Kepler\'s third law yields the total mass',
  act(){setA(6.4);setQ(0.8);}},
 {zh:'多普勒摆动:谱线一蓝一红',en:'Doppler sway: spectral lines swing blue and red',
  act(){setA(4.2);setQ(0.7);document.getElementById('tglSpec').checked=true;specGroup.visible=true;
    document.getElementById('bSpec').classList.add('on');flyTo(5.5,5.5,11.5);}},
 {zh:'从食变星到测距:双星是天体物理的标尺',en:'From eclipsing binaries to cosmic distances: binaries are astrophysics\' yardstick',
  act(){setA(4.2);setQ(0.7);document.getElementById('tglSpec').checked=true;specGroup.visible=true;
    flyTo(0,1.0,13.5);
    document.getElementById('bEcl').classList.add('on');document.getElementById('bTop').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stP').innerHTML=Math.round(365.25*Pyr)+'<small> d</small>';
  const k=29.78*(M2/Math.pow(Mtot,2/3))/Math.cbrt(Pyr)*sinI;
  document.getElementById('stK').innerHTML=k.toFixed(1)+'<small> km/s</small>';
  let minF=1;
  for(let i=0;i<NB;i++)if(fluxHist[i]<minF)minF=fluxHist[i];
  document.getElementById('stD').innerHTML=(100*(1-minF)).toFixed(1)+'<small> %</small>';
  document.getElementById('stM').innerHTML=Mtot.toFixed(2)+'<small> M☉</small>';
}

/* ---- 控件 ---- */
const camGoal=new THREE.Vector3();let camMoving=false;
function flyTo(x,y,z){camGoal.set(x,y,z);camMoving=true;}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bEcl').addEventListener('click',()=>{
  flyTo(0,1.1,13.8);
  document.getElementById('bEcl').classList.add('on');
  document.getElementById('bTop').classList.remove('on');
});
document.getElementById('bTop').addEventListener('click',()=>{
  flyTo(0.01,15.5,0.6);
  document.getElementById('bTop').classList.add('on');
  document.getElementById('bEcl').classList.remove('on');
});
document.getElementById('bSpec').addEventListener('click',()=>{
  document.getElementById('tglSpec').checked=true;specGroup.visible=true;
  document.getElementById('bSpec').classList.add('on');
  flyTo(5.5,5.5,11.5);
});
document.getElementById('sA').addEventListener('input',e=>setA(+e.target.value));
document.getElementById('sQ').addEventListener('input',e=>setQ(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglSpec').addEventListener('change',e=>{specGroup.visible=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d1016:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0d1016:0xe9e4dc);
  groundM.color.setHex(dark?0x12161d:0xd8d2c6);
  specBackM.color.setHex(dark?0x10141b:0xf5f0e6);
  starM.opacity=dark?0.85:0.35;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const p1=new THREE.Vector3(),p2=new THREE.Vector3(),
  vd=new THREE.Vector3(),c1=new THREE.Vector3(),c2=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 两星绕公共质心(永远反相) */
  phase+=omega*dts;
  p1.set(a1*Math.cos(phase),0,a1*Math.sin(phase));
  p2.set(-a2*Math.cos(phase),0,-a2*Math.sin(phase));
  star1.position.copy(p1);star2.position.copy(p2);
  glow1.position.copy(p1);glow2.position.copy(p2);
  star1.rotation.y+=dts*0.4;star2.rotation.y-=dts*0.3;
  /* 由真实视线方向算倾角:拖到俯视,掩食自然消失 */
  vd.copy(camera.position).sub(controls.target).normalize();
  sinI=Math.sqrt(Math.max(0,1-vd.y*vd.y));
  c1.copy(p1).addScaledVector(vd,-p1.dot(vd));
  c2.copy(p2).addScaledVector(vd,-p2.dot(vd));
  const d=Math.max(0.001,c1.distanceTo(c2));
  const s1=p1.dot(vd),s2=p2.dot(vd);
  const ov=overlapArea(d,R1,R2);
  const f1=ov/(Math.PI*R1*R1),f2=ov/(Math.PI*R2*R2);
  fluxNorm=(s1>s2?L1+L2*(1-f2):L1*(1-f1)+L2)/(L1+L2);
  eclipseFrac=Math.max(0,s1>s2?f2:f1);
  /* 视向速度 → 光谱双线摆动 */
  K1=29.78*(M2/Math.pow(Mtot,2/3))/Math.cbrt(Pyr)*sinI;
  K2=29.78*(M1/Math.pow(Mtot,2/3))/Math.cbrt(Pyr)*sinI;
  const wob=Math.sin(phase);
  line1.position.x=clamp(-0.055*K1*wob,-2.0,2.0);
  line2.position.x=clamp(0.055*K2*wob,-2.0,2.0);
  /* 光变曲线历史条带采样 */
  if(dts>0){
    sampleAcc+=dts;
    if(sampleAcc>=0.06){sampleAcc=0;flushBars();}
  }
  /* 相机飞行(按钮切换视角) */
  if(camMoving){
    camera.position.lerp(camGoal,Math.min(1,dt*2.2));
    if(camera.position.distanceTo(camGoal)<0.05)camMoving=false;
  }
  lblP1.position.set(p1.x,p1.y+R1+0.75,p1.z);
  lblP2.position.set(p2.x,p2.y+R2+0.75,p2.z);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setA(4.2);setQ(0.7);flushBars();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
