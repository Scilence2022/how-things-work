<style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,80,320);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,800);
camera.position.set(0,18,26);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=240;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(9,14,7);scene.add(key);

/* ---- 环境几何 ---- */
const S=9;   /* 显示单位 / AU */
const gridMat=new THREE.LineBasicMaterial({color:0x2b3242,transparent:true,opacity:0.35});
const grid=new THREE.GridHelper(180,20,0x2b3242,0x2b3242);
grid.material=gridMat;grid.position.y=-1.4;scene.add(grid);
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.15,32,24),new THREE.MeshBasicMaterial({color:0xffc04d}));
scene.add(sun);
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({color:0xff922b,transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false}));
sunGlow.scale.setScalar(5.4);scene.add(sunGlow);
const ringMat=new THREE.MeshBasicMaterial({color:0x4d5f7a,transparent:true,opacity:0.5,side:THREE.DoubleSide});
const orbitRing=new THREE.Mesh(new THREE.RingGeometry(0.985,1.015,180),ringMat);
orbitRing.rotation.x=-Math.PI/2;orbitRing.scale.setScalar(S);scene.add(orbitRing);

/* ---- 物理状态(单位:AU、年) ----
   GM☉=4π²;辐射压 P=2I/c=9.08 μN/m² @1AU(I=1361 W/m²);
   β=光压/引力=(2I/c)·A/(m·g₁AU)=1.53e-3·A/m,与日距无关;β>1 逃逸。 */
const GM=4*TAU*TAU;
const YPS=0.12;
const SIG=1.5317e-3;
let areaA=200,massKg=50,sailDeg=0,contrast=false,photOn=true;
let speedMul=clamp(qsFloat('speed',1),0.3,2.5);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const beta=()=>SIG*areaA/massKg;
const CAP=1600;
const tbA=new Float32Array(CAP*3),tbB=new Float32Array(CAP*3);
const ships=[
 {x:1,z:0,vx:0,vz:TAU,dead:false,gone:false,esc:false,ang:0,n:0,trail:tbA},
 {x:1,z:0,vx:0,vz:TAU,dead:false,gone:false,esc:false,ang:0,n:0,trail:tbB}
];
const _a={x:0,z:0};
function accel(s,out){
  const r=Math.hypot(s.x,s.z)||1e-9,sx=s.x/r,sz=s.z/r;
  const g=GM/(r*r);
  const cA=Math.cos(s.ang),sn=Math.sin(s.ang);
  let nx=sx,nz=sz;
  if(Math.abs(sn)>1e-6){
    const vr=s.vx*sx+s.vz*sz;
    let tx=s.vx-vr*sx,tz=s.vz-vr*sz;
    const tm=Math.hypot(tx,tz);
    if(tm<1e-6){tx=-sz;tz=sx;}else{tx/=tm;tz/=tm;}
    nx=cA*sx+sn*tx;nz=cA*sz+sn*tz;
  }
  const f=g*beta()*cA*cA;
  out.x=-g*sx+f*nx;out.z=-g*sz+f*nz;
}
function stepSim(dtY){
  for(const s of ships){
    if(s.dead||s.gone)continue;
    let rem=dtY,guard=0;
    while(rem>1e-9&&guard++<3000){
      const r=Math.hypot(s.x,s.z)||1e-9;
      const h=Math.min(rem,Math.max(2e-5,0.01*Math.sqrt(r*r*r/GM)));
      accel(s,_a);
      s.vx+=_a.x*h;s.vz+=_a.z*h;
      s.x+=s.vx*h;s.z+=s.vz*h;
      rem-=h;
    }
    const r=Math.hypot(s.x,s.z);
    s.esc=0.5*(s.vx*s.vx+s.vz*s.vz)-GM/r>0;
    if(r<0.08)s.dead=true;
    if(r>14)s.gone=true;
  }
}
function resetShips(ang){
  for(const s of ships){s.x=1;s.z=0;s.vx=0;s.vz=TAU;s.dead=false;s.gone=false;s.esc=false;s.n=0;}
  ships[0].ang=ang*Math.PI/180;ships[1].ang=-ships[0].ang;
  trailA.geometry.setDrawRange(0,0);trailB.geometry.setDrawRange(0,0);
}

/* ---- 轨迹线 ---- */
function mkTrail(arr,col){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  g.setDrawRange(0,0);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.9}));
  l.frustumCulled=false;scene.add(l);return l;
}
const trailA=mkTrail(tbA,0xffd43b),trailB=mkTrail(tbB,0xff6b6b);
function pushTrail(s,line){
  if(s.n>=CAP)return;
  s.trail[s.n*3]=s.x*S;s.trail[s.n*3+1]=0;s.trail[s.n*3+2]=s.z*S;
  s.n++;
  line.geometry.attributes.position.needsUpdate=true;
  line.geometry.setDrawRange(0,s.n);
}

/* ---- 飞船(帆+箭头) ---- */
const _M4=new THREE.Matrix4(),_Q=new THREE.Quaternion(),_Q2=new THREE.Quaternion(),
  _V=new THREE.Vector3(),_S=new THREE.Vector3(),_Y=new THREE.Vector3(0,1,0),_Z=new THREE.Vector3(0,0,1);
function mkCraft(){
  const g=new THREE.Group();
  const bus=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.42),
    new THREE.MeshStandardMaterial({color:0x3a4048,metalness:0.5,roughness:0.5}));
  g.add(bus);
  const sail=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.7),
    new THREE.MeshStandardMaterial({color:0xcfd8e2,metalness:0.95,roughness:0.18,side:THREE.DoubleSide}));
  g.add(sail);
  const arr=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(0,0.45,0),2.2,0xffd43b,0.75,0.4);
  g.add(arr);
  scene.add(g);
  return {g,sail,arr};
}
const craftA=mkCraft(),craftB=mkCraft();
craftB.sail.material=craftB.sail.material.clone();craftB.sail.material.color.setHex(0xe8c9c9);
craftB.arr.setColor(new THREE.Color(0xff6b6b));
function syncCraft(c,s,on){
  c.g.visible=on;
  if(!on)return;
  c.g.position.set(s.x*S,0,s.z*S);
  const r=Math.hypot(s.x,s.z)||1e-9,sx=s.x/r,sz=s.z/r;
  const cA=Math.cos(s.ang),sn=Math.sin(s.ang);
  const vr=s.vx*sx+s.vz*sz;
  let tx=s.vx-vr*sx,tz=s.vz-vr*sz;
  const tm=Math.hypot(tx,tz);
  if(tm<1e-6){tx=-sz;tz=sx;}else{tx/=tm;tz/=tm;}
  const nx=cA*sx+sn*tx,nz=cA*sz+sn*tz;
  _Q.setFromUnitVectors(_Z,_V.set(nx,0,nz));
  _Q.multiply(_Q2.setFromAxisAngle(_Z,0.55));
  c.sail.quaternion.copy(_Q);
  const f=GM/(r*r)*beta()*cA*cA;
  const ln=clamp(0.5+f*S*0.9,0.35,4.5);
  c.arr.setDirection(_V.set(nx,0,nz));
  c.arr.setLength(ln,ln*0.32,ln*0.18);
}

function setA(v){areaA=clamp(v,10,6000);elA.value=areaA;elAVal.textContent=Math.round(areaA)+' m²';}
function setAng(v){sailDeg=clamp(v,-80,80);elAng.value=sailDeg;elAngVal.textContent=Math.round(sailDeg)+'°';

function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dtY=dt0*speedMul*YPS*(playing?1:0);
  if(dtY>0){
    stepSim(dtY);
    pushTrail(ships[0],trailA);
    if(contrast)pushTrail(ships[1],trailB);
  }
  syncCraft(craftA,ships[0],true);
  syncCraft(craftB,ships[1],contrast);
  phot.visible=photOn;
  if(photOn){
    for(let i=0;i<NP;i++){
      const p=phP[i];
      p.r+=dt0*20;
      if(p.r>27)p.r=1.4;
      _V.set(Math.cos(p.a)*p.r,0,Math.sin(p.a)*p.r);
      _Q.setFromAxisAngle(_Y,Math.PI/2-p.a);
      _M4.compose(_V,_Q,_S.set(0.7,0.5,2.4));
      phot.setMatrixAt(i,_M4);
    }
    phot.instanceMatrix.needsUpdate=true;
  }
  acc+=dt0;
  if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

 if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(0);}
updateStats();
start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
