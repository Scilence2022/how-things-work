<div id="title">
  <h1 data-zh="纹影成像" data-en="Schlieren Imaging">纹影成像</h1>
  <div class="sub" data-zh="透明的空气其实一直在「拐弯」光线:空气的折射率只比真空大万分之三(n≈1.000293,20 °C、1 atm),但按格拉斯顿-戴尔关系 n−1=Kρ(K≈0.226 cm³/g),折射率正比于密度——哪里有密度梯度,光就朝更冷、更密的一侧偏多少微弧度。蜡烛羽流边缘约 100 µrad 的偏折,肉眼和普通相机都无能为力;纹影法(Schlieren,德语「条纹」)的办法不是放大偏折,而是把它变成明暗:点光源放在准直透镜焦点上打出平行光穿过测试区,第二片透镜把光聚回焦点,刀口在焦点处挡掉一半狭缝像——屏幕均匀灰。任何被偏折 ε 的光线在焦面上横移 Δ=f·ε(f≈1 m 时 Δ≈70 µm),移进刀口变暗、移出变亮,ΔI/I₀=−f·ε/h₀:密度梯度就此变成屏幕上的明暗梯度。蜡烛热羽流、人的呼气流、超音速喷流(M1.5 正激波密度比 ρ₂/ρ₁≈2.2,梯度挤在 ~1 µm 厚的激波面里)全部显形;Hooke 1672 最早看到烛上热气,Toepler 1864 把它做成完整方法,Ernst Mach 1887 拍下超音速子弹的激波,公共卫生课上的喷嚏纹影也是它的作品。灰度还能标定回密度(定量纹影),优质系统灵敏到 ~1 µrad。拖「刀口切入量」看对比度涨落,拖「羽流温差」和「喷流马赫数」改流场;按「蜡烛/呼气/超音速喷流」换对象,按「无刀口对照」看流场随刀口一起消失——看不见 ≠ 不存在。3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停
- 场景要点: 光学导轨上从左到右排开:点光源狭缝(焦点上)→ 准直透镜 L1 → 测试区(蜡烛热羽流 / 呼气喷嘴 / 超音速喷管)→ 成像透镜 L2 → 刀口(可切入)→ 成像屏。金色光线从狭缝扇出、被 L1 拉平、在羽流边缘被掰弯一个微小的角度、被 L2 聚向焦点,偏折多少就在刀口处被吃掉多少:变暗的光线直接在屏上留出影子;右侧成像屏实时渲染整幅纹影图——蜡烛呈黑色剪影,羽流一侧亮一侧暗地扭动;「无刀口对照」里刀口退出,偏折仍在发生,屏幕却退回均匀一片,流场凭空消失。" data-en="Transparent air bends light all the time: the refractive index of air exceeds vacuum by only about 3 parts in 10,000 (n≈1.000293 at 20 °C, 1 atm), but by the Gladstone-Dale relation n-1=K rho (K≈0.226 cm3/g) index is proportional to density - wherever there is a density gradient, light tips by a few microradians toward the cooler, denser side. A candle plume edge deflects light by roughly 100 microradians, far beyond eye or camera. Schlieren (German for streaks) does not magnify the deflection - it converts it into brightness: a point source at the focus of a collimating lens sends parallel light through the test zone; a second lens refocuses it; a knife edge at the focus cuts half of the source image, leaving a uniform gray screen. Any ray deflected by epsilon shifts at the focal plane by delta=f·epsilon (about 70 µm for f≈1 m): into the edge it darkens, away it brightens, delta-I/I0 = -f·epsilon/h0, and a density gradient becomes a brightness gradient. Candle plumes, human breath, supersonic jets (a M1.5 normal shock doubles the density inside a ~1 µm sheet) all become visible; Hooke saw candle thermals in 1672, Toepler built the method in 1864, Mach photographed supersonic bullets in 1887, and the famous schlieren sneeze belongs to the same family. Gray levels can be calibrated back to density (quantitative schlieren) with sensitivity near 1 µrad. Drag the knife cut to watch contrast swing, drag plume temperature and jet Mach to reshape the flow; switch between candle, breath and supersonic jet, and try the no-knife mode where the flow vanishes with the edge - invisible does not mean absent. 3D interactive demo - drag to orbit / scroll to zoom - Space = play/pause
- Scene notes: An optical rail carries, left to right: a point-source slit (at the focus), collimator lens L1, the test zone (candle plume / breath nozzle / supersonic nozzle), imaging lens L2, an adjustable knife edge and the image screen. Golden rays fan out of the slit, are straightened by L1, tipped by a micro-angle at the plume edge, and focused by L2 - whatever the deflection is, the knife eats exactly that much: darkened rays cast shadows on the screen, which renders the full schlieren picture live - the candle as a black silhouette with the plume wobbling bright on one side and dark on the other; in no-knife mode the edge retracts, deflection still happens, but the screen returns to uniform gray and the flow disappears."></div>

/* ---------------- 状态标签(包装对象,勿把返回值当 CSS2DObject 用) ---------------- */
const labelReg = [];
function addLabel(textFn, clsFn, pos, parent) {
  const div = document.createElement('div');
  div.className = 'lbl ' + (clsFn ? clsFn() : '');

  o.position.copy(pos);
  (parent || scene).add(o);

/* ---------------- 讲解步骤 ---------------- */
let scenario = 0;
const tgtVec = new THREE.Vector3(0.3, 1.4, 0);
const camV = new THREE.Vector3();
function markStep() {
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === scenario));
}
function syncPhase() {
  elPhase.value = Math.round(scenario / (STEPS.length - 1) * 1000);
  elPhaseVal.textContent = L(`第 ${scenario + 1}/${STEPS.length} 步`, `step ${scenario + 1}/${STEPS.length}`);
}
function activateStep(i) {
  scenario = clamp(i, 0, STEPS.length - 1);
  tgtVec.fromArray(STEPS[scenario].tgt);
  markStep(); syncPhase(); updateFormula();
}
function buildSteps() {
  const el2 = document.getElementById('steps');
  el2.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => activateStep(i));
    el2.appendChild(li);
  });
}

  rayLines.push(line);
}

/* ---------------- 折射场(测试区坐标系 zt∈[-0.95,0.95], yt∈[0.75,2.5]) ----------------
   返回无量纲梯度场强度;显示换算:ε_display ≈ field·750 µrad;几何换算:ε_scene = ESC·field */
function candleCenter(yt, t) {
  return (0.10 + 0.06 * candleAmp()) * Math.sin(1.1 * t + 2.2 * yt)
       + 0.05 * Math.sin(2.6 * t + 3.3 * yt + 1.3);
}
function candleAmp() { return 0.30 * (0.25 + 0.75 * dT / 150); }
function breathPhase(t) { const c = (t * 0.28) % 1; return c < 0.9 ? c / 0.9 : 1; }
function epsField(md, zt, yt, t) {
  if (md === 'candle') {
    if (yt < 1.35) return 0;
    const zc = candleCenter(yt, t);
    const w = 0.15 + 0.03 * Math.sin(t * 1.7);
    const u = (zt - zc) / w;
    return candleAmp() * u * Math.exp(-u * u) * Math.exp(-(yt - 1.35) / 0.85) * (1 + 0.08 * Math.sin(t * 13 + yt * 9));
  }
  if (md === 'breath') {
    const ph = breathPhase(t);
    const zp = -0.78 + 1.72 * ph;
    const r = 0.15 + 0.24 * ph;
    const fade = ph < 0.82 ? 1 : 1 - (ph - 0.82) / 0.18;
    const u = (zt - zp) / r;
    const turb = 0.85 + 0.3 * Math.sin(6.1 * zt + 5.3 * yt + 4.7 * t) + 0.15 * Math.sin(11 * zt + 9 * yt + 7 * t);
    return 0.42 * u * Math.exp(-u * u) * Math.exp(-Math.pow((yt - BEAM_Y) / 0.34, 2)) * turb * fade;
  }
  /* jet:激波胞条纹 + 剪切层抖动 */
  const zs = zt + 0.7;
  if (zs < 0) return 0;
  const lam = 0.3 + 0.09 * mach;
  const amp = 0.34 * (0.3 + 0.7 * (mach - 0.9) / 1.5);
  const stripes = Math.sin(TAU * zs / lam) * Math.exp(-zs / 1.05);
  const rad = 0.15 + 0.1 * zs;
  const hf = Math.exp(-Math.pow((yt - BEAM_Y) / rad, 2));
  const shear = 1 + 0.3 * Math.sin(9 * zs + 7.3 * yt + 5 * t);
  return amp * stripes * hf * shear;
}
const GSCR = FLEN * ESC / (2 * H0); /* 屏幕亮度系数:I = p0 - GSCR·field */
function transmit() { return knifeC < 0.02 ? 1 : clamp(1 - knifeC, 0, 1); }
function brightness(fieldVal) {
  if (knifeC < 0.02) return 0.93;
  return clamp(transmit() - GSCR * fieldVal, 0, 1);
}

/* ---------------- 成像屏纹理(128×80 → 256×176) ---------------- */
const SW = 128, SH = 80;
const scrImg = scrCtx.createImageData(SW, SH);
function drawScreen(t) {
  const d = scrImg.data;
  let p = 0;
  for (let py = 0; py < SH; py++) {
    const yt = 2.5 - (py + 0.5) / SH * 1.75;
    for (let px = 0; px < SW; px++) {
      const zt = 0.95 - (px + 0.5) / SW * 1.9;
      let I = brightness(epsField(mode, zt, yt, t));
      if (mode === 'candle') {
        if (Math.abs(zt) < 0.1 && yt > 0.3 && yt < 0.56) I = 0.16;
        else if (Math.abs(zt) < 0.075 && yt >= 0.56 && yt < 1.3) I = 0.08;
        else if (Math.abs(zt) < 0.055 && yt >= 1.3 && yt < 1.56) I = 0.94;
      } else if (mode === 'breath') {
        if (zt < -0.66 && Math.abs(yt - BEAM_Y) < 0.15) I = 0.12;
      } else {
        if (zt < -0.6 && Math.abs(yt - BEAM_Y) < 0.13) I = 0.12;
      }
      const v = I * 255;
      d[p] = v; d[p + 1] = v; d[p + 2] = Math.min(255, v * 1.04 + 4); d[p + 3] = 255;
      p += 4;
    }
  }
  scrCtx.putImageData(scrImg, 0, 0);
  scrCtx.imageSmoothingEnabled = true;
  scrTex.needsUpdate = true;
}

/* ---------------- 示波器:屏幕中线亮度剖面 I(z) ---------------- */
const SCOPE_N = 96;
const profI = new Float32Array(SCOPE_N);
function sampleProfile(t) {
  for (let i = 0; i < SCOPE_N; i++) {
    const zt = 0.95 - (i + 0.5) / SCOPE_N * 1.9;
    profI[i] = brightness(epsField(mode, zt, BEAM_Y, t));
  }
}
function drawScope() {
  const w = scope.width, h = scope.height, dpr = Math.min(devicePixelRatio, 2);
  scopeCtx.clearRect(0, 0, w, h);
  scopeCtx.strokeStyle = 'rgba(127,140,160,.4)';
  scopeCtx.lineWidth = 1;
  scopeCtx.strokeRect(4, 4, w - 8, h - 8);
  const base = h * 0.92, amp = h * 0.78;
  /* 透过率基准线 p0(虚线) */
  const p0 = knifeC < 0.02 ? 0.93 : transmit();
  scopeCtx.setLineDash([4 * dpr, 3 * dpr]);
  scopeCtx.strokeStyle = 'rgba(160,170,190,.55)';
  scopeCtx.lineWidth = 1;
  scopeCtx.beginPath(); scopeCtx.moveTo(4, base - p0 * amp); scopeCtx.lineTo(w - 4, base - p0 * amp); scopeCtx.stroke();
  scopeCtx.setLineDash([]);
  /* I(z) 剖面(青) */
  scopeCtx.strokeStyle = '#59c8d6';
  scopeCtx.lineWidth = Math.max(1.3, 1.3 * dpr);
  scopeCtx.beginPath();
  for (let i = 0; i < SCOPE_N; i++) {
    const x = 4 + (i / (SCOPE_N - 1)) * (w - 8);
    const y = base - profI[i] * amp;
    i === 0 ? scopeCtx.moveTo(x, y) : scopeCtx.lineTo(x, y);
  }
  scopeCtx.stroke();
  /* 剖面下淡填充 */
  scopeCtx.lineTo(w - 4, base); scopeCtx.lineTo(4, base);
  scopeCtx.closePath();
  scopeCtx.fillStyle = scopeDark ? 'rgba(89,200,214,.14)' : 'rgba(14,124,147,.12)';
  scopeCtx.fill();
  scopeCtx.fillStyle = scopeDark ? 'rgba(242,245,249,.85)' : 'rgba(22,32,44,.85)';
  scopeCtx.font = `${10 * dpr}px sans-serif`;
  scopeCtx.fillText(L('成像屏中线亮度剖面 I(z):虚线=刀口透过率 p₀', 'screen midline profile I(z): dashed = knife transmission p0'), 8, 14 * dpr);
}

function epsMaxURad(t) {

  if (scenario !== lastScenario) {
    lastScenario = scenario;
    autoKnife = true; autoTour = true; tourIdx = 0; tourT = sT; tourLock = false;
  }
  /* ---- 第 5 步(经典对象)自动轮播 ---- */
  if (scenario === 4 && autoTour && !preset && !tourLock) {
    if (sT - tourT > 6) { tourT = sT; tourIdx = (tourIdx + 1) % 3; mode = ['candle', 'breath', 'jet'][tourIdx]; applyModeVis(); }
  }
  /* ---- 刀口:noknife 预设 → 0;第 6 步脚本 → 振荡;否则滑杆 ---- */
  if (preset === 'noknife') knifeC = 0;
  else if (scenario === 5 && autoKnife && !preset) {
    const c6 = (sT * 0.16) % 1;
    knifeC = c6 < 0.55 ? 0.5 : 0.02;
    syncKnob();
  }
  /* ---- 粒子更新(只在播放时推进) ---- */
  if (simDt > 0) updateParticles(sT);
  /* ---- 火焰摇曳 ---- */
  const fk = mode === 'candle' ? 1 : 0;
  flameInner.visible = flameCore.visible = flameOuter.visible = !!fk;
  if (fk) {
    flameInner.scale.y = 0.26 + 0.03 * Math.sin(sT * 21);
    flameCore.scale.y = 0.18 + 0.02 * Math.sin(sT * 17.3);
    flameOuter.scale.y = 0.4 + 0.05 * Math.sin(sT * 13.7 + 1.3);
    flameOuter.scale.x = flameOuter.scale.z = 0.9 + 0.06 * Math.sin(sT * 17.3);
  }
  flameLight.intensity = fk ? 1.4 : 0;
  /* ---- 激波胞环(喷流) ---- */
  if (mode === 'jet') {
    const lam = 0.3 + 0.09 * mach;
    for (let k = 0; k < rings.length; k++) {
      const zr = -0.5 + k * lam;
      rings[k].position.set(0, BEAM_Y, zr);
      const rr = 0.07 + 0.035 * k + 0.02 * (mach - 1.5);
      rings[k].scale.set(rr / 0.1, rr / 0.1, 1);
      rings[k].visible = zr < 1.1;
      M.ring.opacity = 0.16 + 0.08 * Math.sin(sT * 9 - k);
    }
  }
  /* ---- 刀口几何跟随滑杆:刀口挡掉 z > zk 的一侧,像宽 2·H0 ---- */
  const zk = knifeC < 0.02 ? H0 * 1.15 : H0 * (1 - 2 * clamp(knifeC, 0, 1.3));
  knifeG.position.z = zk;
  arm.position.z = (zk + 0.62) / 2;
  arm.scale.z = clamp(Math.abs(0.62 - zk) / 0.5, 0.08, 2);
  /* ---- 光线扇 ---- */
  updateRays(sT);
  /* ---- 成像屏(隔帧渲染) ---- */
  scrFrame++;
  if (scrFrame % 2 === 0) { sampleProfile(sT); drawScreen(sT); }
  /* ---- 标签可见性 ---- */
  srcLbl.o.visible = labelsOn;
  l1Lbl.o.visible = labelsOn && (scenario === 1 || scenario === 0);
  l2Lbl.o.visible = labelsOn && scenario >= 3;
  knifeLbl.o.visible = labelsOn;
  scrLbl.o.visible = labelsOn;
  testLbl.o.visible = labelsOn;
  failLbl.o.visible = labelsOn && knifeC < 0.02;
}

/* ---- 光线扇几何与透光率 ---- */
const RV = [
  [SRC_X + 0.16, BEAM_Y, 0],
  [L1_X, BEAM_Y, 0],
  [-0.45, BEAM_Y, 0],
  [0.45, BEAM_Y, 0],
  [L2_X, BEAM_Y, 0],
  [FOC_X, BEAM_Y, 0],
  [SCR_X, BEAM_Y, 0],
];
const zsArr = new Float32Array(RSEG);
function updateRays(t) {
  const p0 = transmit();
  for (let i = 0; i < NR; i++) {
    const zi = -0.8 + 1.6 * i / (NR - 1);
    const f = epsField(mode, zi, BEAM_Y, t);
    const es = ESC * f;
    let I = 1;
    if (knifeC >= 0.02) I = clamp(p0 - FLEN * es / (2 * H0), 0, 1);
    rayI[i] = I;
    zsArr[0] = 0;
    zsArr[1] = zi;
    zsArr[2] = zi;
    zsArr[3] = zi + es * 0.45;
    zsArr[4] = zi + es * 3.0;
    zsArr[5] = FLEN * es;
    zsArr[6] = -1.15 * zi;
    const pa = rayLines[i].geometry.attributes.position;
    for (let k = 0; k < RSEG; k++) {
      pa.setXYZ(k, RV[k][0], RV[k][1], zsArr[k]);
    }
    pa.needsUpdate = true;
    rayLines[i].material.opacity = 0.08 + 0.66 * I;
  }
}

/* ---- 粒子 ---- */
function updateParticles(t) {
  if (mode === 'candle') {
    for (let i = 0; i < NPlume; i++) {
      const yph = (t * 0.09 * plumeSpd[i] + plumePh[i]) % 1;
      const y = 1.62 + yph * 0.95;
      const zc = candleCenter(y, t);
      const r = (0.02 + 0.09 * plumeR[i]) * (0.4 + 1.4 * yph);
      plumePos[i * 3] = Math.sin(t * 7 + i * 2.1) * 0.012;
      plumePos[i * 3 + 1] = y;
      plumePos[i * 3 + 2] = zc + Math.sin(t * 5 + i * 1.7) * 0.02 + (plumeR[i] - 0.5) * r;
    }
    plumeGeo.attributes.position.needsUpdate = true;
    M.plume.opacity = 0.32;
  }
  if (mode === 'breath') {
    const ph = breathPhase(t);
    for (let i = 0; i < NPuff; i++) {
      const a = (ph + puffPh[i] * 0.25) % 1;
      const zp = -0.72 + 1.66 * a;
      const spread = 0.05 + 0.28 * a;
      puffPos[i * 3] = puffJx[i] * spread * 2 + Math.sin(t * 6 + i * 1.3) * 0.02;
      puffPos[i * 3 + 1] = BEAM_Y + puffJy[i] * spread + Math.cos(t * 5.1 + i) * 0.02;
      puffPos[i * 3 + 2] = zp;
    }
    puffGeo.attributes.position.needsUpdate = true;
    M.puff.opacity = 0.3 * (ph < 0.82 ? 1 : 1 - (ph - 0.82) / 0.18);
  }
  if (mode === 'jet') {
    for (let i = 0; i < NJet; i++) {
      const a = (t * 0.14 * jetSpd[i] * (0.8 + 0.25 * mach) + jetPh[i]) % 1;
      jetPos[i * 3] = Math.sin(t * 9 + i * 1.9) * 0.008;
      jetPos[i * 3 + 1] = BEAM_Y + jetJy[i] * (0.05 + 0.13 * a);
      jetPos[i * 3 + 2] = -0.68 + a * 1.75;
    }
    jetGeo.attributes.position.needsUpdate = true;
    M.jetP.opacity = 0.38;
  }
}

/* ---------------- 装配 ---------------- */
applyModeVis();
updateSliderLabels();
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
/* URL 参数:test=candle|breath|jet · knife=0~130 */
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
const qTest = qs.get('test');
if (qTest === 'candle' || qTest === 'breath' || qTest === 'jet') { mode = qTest; applyModeVis(); tourLock = true; }
const qKnife = qsFloat('knife', NaN);
if (Number.isFinite(qKnife)) { knifeC = clamp(qKnife, 0, 130) / 100; autoKnife = false; syncKnob(); }
setPlayLabel();
tglCurve.dispatchEvent(new Event('change'));

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0, et = 0, simT = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const simDt = playing ? dt * speed : 0;
  simT += simDt;
  curSimT = simT;
  etG = et;
  pageFrame(simT, simDt, dt);
  const hlm = HL[STEPS[scenario].hl];
  if (hlm && hlm.e) hlm.m.emissiveIntensity = 1.2 + 1.6 * (0.45 + 0.25 * Math.sin(et * 5));
  else if (hlm) hlm.m.opacity = clamp(0.35 + 0.3 * (0.45 + 0.25 * Math.sin(et * 5)), 0.05, 0.85);
  camV.copy(tgtVec);
  controls.target.lerp(camV, 0.04);
  for (const r of labelReg) {
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked) drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats(simT);
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
