<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>意式咖啡机与萃取 · 9 bar 穿过粉饼的 25 秒</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d19a3c;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#9a6a10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(209,154,60,.6);background:rgba(209,154,60,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(154,106,16,.55);background:rgba(154,106,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(209,154,60,.10);border-color:rgba(209,154,60,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(154,106,16,.08);border-color:rgba(154,106,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe9c4}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="意式咖啡机与萃取" data-en="The Espresso Machine">意式咖啡机与萃取</h1>
  <div class="sub" data-zh="振动泵把水压到 9 bar,热交换器稳在 92~96 °C;约 25 s 内过热水穿过 18 g 压实粉饼、只出 36 g 浓缩液——粉饼是一座阻力床,水永远找最松的路,布粉压粉不均就冲开一条通道,一半过萃(苦)一半欠萃(酸);预浸先以 2~3 bar 润床数秒再全压,Crema 则是 CO₂ 与油在高压下乳化成的金色泡沫 · 拖动旋转 / 空格运行/暂停" data-en="The vibratory pump drives water to 9 bar and the heat exchanger holds it at 92–96 °C; in about 25 s the hot water crosses an 18 g tamped puck and yields just 36 g of espresso — the puck is a resistance bed and water always takes the loosest path, so uneven distribution opens a channel: half over-extracted (bitter), half under (sour); pre-infusion wets the bed at 2–3 bar before full pressure, and crema is the golden emulsion of CO₂ and oils · drag to orbit / Space = run/pause">振动泵把水压到 9 bar,热交换器稳在 92~96 °C;约 25 s 内过热水穿过 18 g 压实粉饼、只出 36 g 浓缩液——粉饼是一座阻力床,水永远找最松的路,布粉压粉不均就冲开一条通道,一半过萃(苦)一半欠萃(酸);预浸先以 2~3 bar 润床数秒再全压,Crema 则是 CO₂ 与油在高压下乳化成的金色泡沫 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="萃取压力" data-en="Brew pressure">萃取压力</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="流量" data-en="Flow">流量</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="出液" data-en="Yield">出液</span><span class="v" id="stY">—</span>
  <span class="k" data-zh="压粉均匀度" data-en="Uniformity">压粉均匀度</span><span class="v" id="stU">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bPre" data-zh="预浸开" data-en="Pre-infuse ON">预浸开</button>
    <button class="abtn" id="bNoPre" data-zh="直压 9 bar" data-en="Straight 9 bar">直压 9 bar</button>
  </div>
  <div class="row">
    <label data-zh="泵压" data-en="Pump pressure">泵压</label>
    <input id="sPress" type="range" min="4" max="12" step="0.5" value="9">
    <span class="val" id="sPressVal">9.0 bar</span>
  </div>
  <div class="row">
    <label data-zh="研磨粗细" data-en="Grind size">研磨粗细</label>
    <input id="sGrind" type="range" min="0.2" max="1.2" step="0.05" value="0.4">
    <span class="val" id="sGrindVal">0.40 mm</span>
  </div>
  <div class="row">
    <label data-zh="压粉均匀度" data-en="Tamp uniformity">压粉均匀度</label>
    <input id="sUni" type="range" min="0" max="100" step="5" value="85">
    <span class="val" id="sUniVal">85 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="粉饼剖面" data-en="Puck cutaway">粉饼剖面</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pressure-cooker/" data-zh="压力锅" data-en="Pressure Cooker">压力锅</a>
    <a href="../atomization/" data-zh="雾化与喷雾" data-en="Atomization">雾化与喷雾</a>
    <a href="../venturi-flow/" data-zh="文丘里流" data-en="Venturi Flow">文丘里流</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

/* ── 场景:意式咖啡机剖面——泵、锅炉/热交换、冲煮头+手柄(粉饼剖面)、杯 ── */
renderer.localClippingEnabled=true;
const cutPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),0.02);
const GX=0.35;
const frameM=new THREE.MeshStandardMaterial({color:0x2c313b,roughness:0.65});
const steelM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.75});
const chromeM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.22,metalness:0.85});
const base=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.14,2.4),frameM);
base.position.set(-0.1,0.07,0);scene.add(base);
for(const sx of [-2.05,2.05])for(const sz of [-1.05,1.05]){
  const pil=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.05,0.12),frameM);
  pil.position.set(sx,1.16,sz);scene.add(pil);
}
const housing=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.55,2.4),frameM);
housing.position.set(-0.1,2.52,0);scene.add(housing);
/* 振动泵:横向圆柱 + 内部振动活塞 */
const pumpM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.45});
const pump=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.5,24),pumpM);
pump.rotation.z=Math.PI/2;pump.position.set(-2.1,0.5,0.35);scene.add(pump);
const plungerM=new THREE.MeshStandardMaterial({color:0xd9a23c,roughness:0.4,metalness:0.6});
const plunger=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.06,16),plungerM);
plunger.rotation.z=Math.PI/2;plunger.position.set(-2.1,0.5,0.35);scene.add(plunger);
/* 锅炉/热交换器 + 加热带 */
const boilerM=new THREE.MeshStandardMaterial({color:0x76829a,roughness:0.4,metalness:0.6});
const boiler=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,1.1,28),boilerM);
boiler.position.set(-1.25,1.25,-0.45);scene.add(boiler);
const bandM=new THREE.MeshStandardMaterial({color:0xff5a2a,roughness:0.5,emissive:0xff4400,emissiveIntensity:0.5});
const band=new THREE.Mesh(new THREE.CylinderGeometry(0.375,0.375,0.22,28),bandM);
band.position.set(-1.25,0.82,-0.45);scene.add(band);
/* 管路:泵 → 锅炉 → 冲煮头 */
const pipeCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.1,0.6,0.35),new THREE.Vector3(-2.0,1.05,0.15),
  new THREE.Vector3(-1.62,0.9,-0.32),new THREE.Vector3(-1.25,1.02,-0.45),
  new THREE.Vector3(-1.25,1.72,-0.45),new THREE.Vector3(-1.18,2.0,-0.4),
  new THREE.Vector3(-0.55,2.14,-0.18),new THREE.Vector3(0.05,2.02,0.0),
  new THREE.Vector3(GX,1.92,0.0)]);
const pipe=new THREE.Mesh(new THREE.TubeGeometry(pipeCurve,48,0.04,8),steelM);
scene.add(pipe);
/* 冲煮头 + 分水网 */
const groupM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.6,metalness:0.3});
const gHead=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.4,0.9),groupM);
gHead.position.set(GX,1.75,0);scene.add(gHead);
const screen=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.02,28),chromeM);
screen.position.set(GX,1.535,0);scene.add(screen);
/* 手柄 + 粉碗(可剖) + 粉饼 */
const basketM=new THREE.MeshStandardMaterial({color:0x9aa6b8,roughness:0.35,metalness:0.7,
  transparent:true,opacity:0.38,side:THREE.DoubleSide,clippingPlanes:[cutPlane]});
const basket=new THREE.Mesh(new THREE.CylinderGeometry(0.40,0.38,0.34,32,1,true),basketM);
basket.position.set(GX,1.30,0);scene.add(basket);
const filter=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.02,32),steelM);
filter.position.set(GX,1.135,0);scene.add(filter);
const collar=new THREE.Mesh(new THREE.TorusGeometry(0.40,0.045,10,36),steelM);
collar.rotation.x=Math.PI/2;collar.position.set(GX,1.47,0);scene.add(collar);
const handleM=new THREE.MeshStandardMaterial({color:0x1e2126,roughness:0.55});
const pfHandle=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.09,0.82),handleM);
pfHandle.position.set(GX,1.40,0.75);scene.add(pfHandle);
const puckM=new THREE.MeshStandardMaterial({color:0x4a3220,roughness:1,clippingPlanes:[cutPlane]});
const puck=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.15,28),puckM);
puck.position.set(GX,1.375,0);scene.add(puck);
const chanM=new THREE.MeshStandardMaterial({color:0xffc04a,emissive:0xffb030,emissiveIntensity:0.9,
  roughness:0.6,clippingPlanes:[cutPlane]});
const channel=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.155,12),chanM);
channel.position.set(GX+0.13,1.375,0.05);scene.add(channel);
/* 出液口 + 咖啡滴 */
for(const sx of [-0.11,0.11]){
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,0.16,12),chromeM);
  sp.position.set(GX+sx,1.06,0);scene.add(sp);
}
/* 杯 + 咖啡液 + Crema */
const cupM=new THREE.MeshStandardMaterial({color:0xe8e2d8,roughness:0.3,
  transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false});
const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.24,0.5,32,1,true),cupM);
cup.position.set(GX,0.45,0);scene.add(cup);
const cupBot=new THREE.Mesh(new THREE.CircleGeometry(0.24,32),cupM);
cupBot.rotation.x=-Math.PI/2;cupBot.position.set(GX,0.205,0);scene.add(cupBot);
const liqM=new THREE.MeshStandardMaterial({color:0x3a2416,roughness:0.25});
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,1,28),liqM);
liquid.position.set(GX,0.25,0);liquid.scale.y=0.05;scene.add(liquid);
const cremaM=new THREE.MeshStandardMaterial({color:0xd9a04f,roughness:0.5,transparent:true,opacity:0.5});
const crema=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.045,28),cremaM);
crema.position.set(GX,0.3,0);scene.add(crema);
const tray=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.07,1.1),steelM);
tray.position.set(GX,0.115,0);scene.add(tray);
/* 压力表 */
const gaugeG=new THREE.Group();gaugeG.position.set(1.0,1.82,0.52);scene.add(gaugeG);
const gFaceM=new THREE.MeshStandardMaterial({color:0xe8e2d8,roughness:0.4});
const gFace=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.03,24),gFaceM);
gFace.rotation.x=Math.PI/2;gaugeG.add(gFace);
const needleM=new THREE.MeshBasicMaterial({color:0xd9452c});
const nGeo=new THREE.BoxGeometry(0.14,0.02,0.012);nGeo.translate(0.055,0,0);
const needle=new THREE.Mesh(nGeo,needleM);needle.position.z=0.025;gaugeG.add(needle);
/* 粒子:管路水流 / 粉饼渗流 / 通道射流 / 咖啡滴 */
const m4=new THREE.Matrix4();
const NP=20,NPK=16,NCH=4,NDP=14;
const pipeWM=new THREE.MeshStandardMaterial({color:0x6fb1e8,roughness:0.2,transparent:true,opacity:0.9});
const pipes=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,8),pipeWM,NP);
pipes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(pipes);
const pu=[];for(let i=0;i<NP;i++)pu.push(i/NP);
const puckPM=new THREE.MeshStandardMaterial({color:0x7a4a26,roughness:0.4,transparent:true,opacity:0.95});
const puckP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.026,8,8),puckPM,NPK);
puckP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(puckP);
const pk=[];for(let i=0;i<NPK;i++){
  const a=i/NPK*Math.PI*2,rr=0.06+((i*37)%20)/20*0.22;
  pk.push({dx:Math.cos(a)*rr,dz:Math.sin(a)*rr*0.9,off:Math.random()});}
const chanPM=new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffb030,emissiveIntensity:0.7});
const chanP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.03,8,8),chanPM,NCH);
chanP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(chanP);
const dripM=new THREE.MeshStandardMaterial({color:0x6b3d1f,roughness:0.3});
const drips=new THREE.InstancedMesh(new THREE.SphereGeometry(0.026,8,8),dripM,NDP);
drips.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(drips);
const dp=[];for(let i=0;i<NDP;i++)dp.push({on:false,x:0,y:0,v:1.5});

/* 状态 */
let pPump=9,grind=0.4,uni=85,preOn=true;
let shotT=0,yieldG=0,doneT=0,done=false,lastQ=0,curPEff=9;
let playing=true,labelsOn=true,slowMo=false,cutOn=true;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const ACC=6;/* 时间加速 ×6:25 s 萃取约 4 s 演完 */

/* 粉饼阻力模型:Darcy 型 Q≈k·P/R;R 随研磨变细而增大,随均匀度下降而失稳 */
function resistance(){return Math.pow(0.4/grind,2)*(1.4-0.6*uni/100);}
function flowAt(p){return p>0.35?0.148*p/resistance():0;}

/* 标签(≤12) */
addLabel(()=>L('振动泵:脉动供压 → 9 bar','Vibratory pump: pulsed supply → 9 bar'),
  new THREE.Vector3(-2.1,1.02,0.4),'o');
addLabel(()=>L('热交换锅炉:稳在 92~96 °C','Heat-exchanger boiler: steady 92–96 °C'),
  new THREE.Vector3(-1.25,2.18,-0.45),'r');
addLabel(()=>L('分水网:把水摊成均匀帘','Dispersion screen: an even shower'),
  new THREE.Vector3(GX+0.85,1.95,0.2),'b');
addLabel(()=>L('粉饼 18 g · 阻力床','Puck 18 g · resistance bed'),
  new THREE.Vector3(GX+0.9,1.35,0.35),'y');
const lblChan=addLabel(()=>L('通道效应:一半过萃·一半欠萃','Channeling: half over-, half under-extracted'),
  new THREE.Vector3(GX+0.2,1.66,0.45),'r',()=>uni<60);
addLabel(()=>L('Crema:CO₂+油乳化成金沫','Crema: CO₂ + oils emulsify into gold'),
  new THREE.Vector3(GX+0.8,0.88,0.3),'g');
addLabel(()=>L('黄金杯:36 g / 25 s','The golden cup: 36 g / 25 s'),
  new THREE.Vector3(GX-0.9,0.6,0.25),'b');

function setPress(v){pPump=clamp(v,4,12);
  document.getElementById('sPress').value=pPump;
  document.getElementById('sPressVal').textContent=pPump.toFixed(1)+' bar';updateStats();}
function setGrind(v){grind=clamp(v,0.2,1.2);
  document.getElementById('sGrind').value=grind;
  document.getElementById('sGrindVal').textContent=grind.toFixed(2)+' mm';updateStats();}
function setUni(v){uni=clamp(v,0,100);
  document.getElementById('sUni').value=uni;
  document.getElementById('sUniVal').textContent=uni.toFixed(0)+' %';updateStats();}
function setPre(on){preOn=on;
  document.getElementById('bPre').classList.toggle('on',on);
  document.getElementById('bNoPre').classList.toggle('on',!on);
  shotT=on?0:99;updateStats();}

const STEPS=[
 {zh:'<b>振动泵供水</b>:把水压到 9 bar,泵的脉动由锅炉容积缓冲',en:'<b>Vibratory pump</b>: drives water to 9 bar, its pulsation buffered by the boiler',
  act(){setPre(true);setPress(9);setGrind(0.4);setUni(85);}},
 {zh:'<b>热交换稳温</b>:过水在 92~96 °C,偏烫发苦、偏凉发酸',en:'<b>Steady 92–96 °C</b>: hotter drifts bitter, cooler drifts sour',
  act(){setPress(9);}},
 {zh:'<b>粉饼=阻力床</b>:流量 Q≈k·P/R,研磨越细阻力 R 越大、流量越小',en:'<b>Puck = resistance bed</b>: Q≈k·P/R — finer grind, larger R, slower flow',
  act(){setGrind(0.4);setUni(90);}},
 {zh:'<b>通道效应</b>:均匀度低时水冲开亮道,一半过萃一半欠萃',en:'<b>Channeling</b>: low uniformity opens a bright channel — half over, half under',
  act(){setUni(35);}},
 {zh:'<b>预浸润床</b>:先以 2~3 bar 润床数秒,床均质后再全压',en:'<b>Pre-infusion</b>: wet the bed at 2–3 bar for seconds, then full pressure',
  act(){setUni(85);setPre(true);}},
 {zh:'<b>黄金萃取带</b>:25 s 出 36 g,流量 0.9~2.0 g/s 才平衡',en:'<b>Golden band</b>: 36 g in 25 s, flow 0.9–2.0 g/s stays balanced',
  act(){setPress(9);setGrind(0.4);setUni(85);setPre(true);}},
 {zh:'<b>Crema 的由来</b>:CO₂ 与油在高压下乳化,浮成金色泡沫',en:'<b>Where crema comes from</b>: CO₂ and oils emulsify under pressure into gold',
  act(){setPress(9.5);setUni(85);}},
];
let activeStep=0,stepClock=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);stepClock=0;});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

function updateStats(){
  const pv=document.getElementById('stP');
  pv.innerHTML=curPEff.toFixed(1)+'<small> bar</small>';
  const qv=document.getElementById('stQ');
  qv.innerHTML=lastQ.toFixed(2)+'<small> g/s</small>';
  qv.className='v '+((!done&&curPEff>6&&(lastQ<0.9||lastQ>2.0))?'warn':'');
  const yv=document.getElementById('stY');
  yv.innerHTML=yieldG.toFixed(1)+'<small> /36 g</small>';
  yv.className='v '+(yieldG>=35.5?'ok':'');
  const uv=document.getElementById('stU');
  uv.innerHTML=uni.toFixed(0)+'<small> %</small>';
  uv.className='v '+(uni<60?'warn':'ok');
}
document.getElementById('bPre').addEventListener('click',()=>setPre(true));
document.getElementById('bNoPre').addEventListener('click',()=>setPre(false));
document.getElementById('sPress').addEventListener('input',e=>setPress(+e.target.value));
document.getElementById('sGrind').addEventListener('input',e=>setGrind(+e.target.value));
document.getElementById('sUni').addEventListener('input',e=>setUni(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{cutOn=e.target.checked;
  cutPlane.constant=cutOn?0.02:10;});

camera.position.set(4.4,2.7,5.5);
controls.target.set(0.1,1.2,0);

function liqTop(){return 0.225+(0.05+0.32*yieldG/36)+0.03;}
function tick(dts,dt){
  const ds=dts*ACC;
  const pre=preOn&&shotT<3.5&&!done;
  const pEff=done?0:(pre?2.5:pPump);
  curPEff=pEff;
  lastQ=done?0:flowAt(pEff);
  if(!done){
    yieldG=Math.min(36,yieldG+lastQ*ds);shotT+=ds;
    if(yieldG>=36){done=true;doneT=0;}
  }else{
    doneT+=ds;
    if(doneT>2.6){done=false;shotT=0;yieldG=0;}
  }
  /* 泵振动与锅炉加热带 */
  plunger.position.x=-2.1+(pEff>0.35?0.09*Math.sin(simT*55):0);
  bandM.emissiveIntensity=0.5+0.2*Math.sin(simT*3);
  /* 压力表指针 */
  needle.rotation.z=-2.1+clamp(pEff,0,12)/12*4.2;
  /* 杯中液面与 crema 生长 */
  const frac=yieldG/36,liqH=0.05+0.32*frac;
  liquid.scale.y=Math.max(liqH,0.001);liquid.position.y=0.225+liqH/2;
  crema.position.y=0.225+liqH+0.02;
  cremaM.opacity=clamp(0.2+frac*0.75,0,0.92);
  /* 管路水流:速度正比流量 */
  const spd=clamp(0.04+lastQ*0.055,0,0.2);
  for(let i=0;i<NP;i++){
    pu[i]=(pu[i]+dts*spd)%1;
    const p=pipeCurve.getPointAt(pu[i]);
    m4.makeScale(1,1,1);m4.setPosition(p.x,p.y,p.z);pipes.setMatrixAt(i,m4);
  }
  pipes.instanceMatrix.needsUpdate=true;
  /* 粉饼内渗流:均匀=细密慢速;通道=一条亮线狂奔 */
  const on=lastQ>0.02?1:0;
  const vs=clamp(lastQ*0.05,0.012,0.09);
  for(let i=0;i<NPK;i++){const q=pk[i];
    const ph=(simT*vs+q.off)%1;
    m4.makeScale(on,on,on);
    m4.setPosition(GX+q.dx,1.44-ph*0.30,q.dz);puckP.setMatrixAt(i,m4);
  }
  puckP.instanceMatrix.needsUpdate=true;
  const ch=(uni<60&&lastQ>0.05)?1:0;
  channel.visible=!!ch;
  for(let i=0;i<NCH;i++){
    const ph=(simT*vs*5+i*0.27)%1;
    m4.makeScale(ch,ch,ch);
    m4.setPosition(GX+0.13,1.44-ph*0.30,0.05);chanP.setMatrixAt(i,m4);
  }
  chanP.instanceMatrix.needsUpdate=true;
  /* 出液口咖啡滴 */
  for(let i=0;i<NDP;i++){const d=dp[i];
    if(!d.on){
      if(lastQ>0.05&&Math.random()<clamp(lastQ,0,2)*dts*4){
        d.on=true;d.x=GX+(i%2?0.11:-0.11);d.y=1.0;d.v=1.5+Math.random()*0.4;}
    }else{
      d.y-=d.v*dts;
      if(d.y<liqTop())d.on=false;
    }
    const s=d.on?1:0;
    m4.makeScale(s,s,s);m4.setPosition(d.x,d.on?d.y:-9,0);drips.setMatrixAt(i,m4);
  }
  drips.instanceMatrix.needsUpdate=true;
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  tick(dts,dt);
  /* 播放时步骤高亮同步推进(不改动滑杆参数) */
  if(playing){stepClock+=dt;
    if(stepClock>5.5){stepClock=0;activeStep=(activeStep+1)%STEPS.length;syncSteps();}}
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
