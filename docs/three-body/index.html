<script type="module">
import * as THREE from 'three';

/* 三体问题:G=1 归一化单位,速度 Verlet 定步长积分
   8 字解(Chenciner–Montgomery 2000,等质量);拉格朗日等边三角(任意质量比);
   混沌双跑:同一初值与初值+ε 两套系统同屏,分离度按 e^{λt} 指数放大 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;

let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();

labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,36,95);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,300);
camera.position.set(0,8.2,12.0);

controls.target.set(0,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:运动平面 y=0,星轨尾迹渐隐 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});

ground.rotation.x=-Math.PI/2;ground.position.y=-4.6;scene.add(ground);
/* 星空背景 */
{
  const n=420,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=55+Math.random()*35;

}
/* 参考虚线圆 r=2 / r=4(平面内) */
const refCircles=[];
for(const r of [2,4]){
  const pts=[];for(let k=0;k<=96;k++){const a=k/96*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));}

/* 发光贴图 */
function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');
  const g=c.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,0.85)');g.addColorStop(0.25,'rgba(255,255,255,0.28)');g.addColorStop(1,'rgba(255,255,255,0)');

const glowT=glowTex();

}
function makeStar(rad,hex,pale){
  const m=new THREE.Mesh(new THREE.SphereGeometry(rad,24,18),
    new THREE.MeshStandardMaterial({color:hex,emissive:hex,emissiveIntensity:pale?0.4:0.6,roughness:0.4}));

/* A 系统:饱和色三星;B 系统:浅色小三星(初值+ε) */
const starA=[makeStar(0.22,0xff6b6b,false),makeStar(0.22,0xffd43b,false),makeStar(0.22,0x74c0fc,false)];

starB.forEach(s=>s.visible=false);
/* 尾迹:环形缓冲 + 顶点色向背景渐隐 */
const MAXPT=800;
const BG=new THREE.Color(0x101418);
function makeTrail(baseHex){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAXPT*3),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(MAXPT*3),3));

const tmpC=new THREE.Color();
function trailClear(t){t.n=0;t.g.setDrawRange(0,0);}
function trailPush(t,x,y,z){
  if(Math.abs(x)>35||Math.abs(z)>35)return;
  const pos=t.g.attributes.position.array;

  const col=t.g.attributes.color.array,n=t.n;
  for(let i=0;i<n;i++){

  }
  t.g.setDrawRange(0,n);
  t.g.attributes.position.needsUpdate=true;
  t.g.attributes.color.needsUpdate=true;
}
function trailRepaint(){
  for(const t of [...trailA,...trailB]){
    const col=t.g.attributes.color.array,n=Math.max(t.n,1);
    for(let i=0;i<n;i++){
      const f=n>1?i/(n-1):1;
      tmpC.copy(t.base).lerp(BG,1-f);
      col[i*3]=tmpC.r;col[i*3+1]=tmpC.g;col[i*3+2]=tmpC.b;
    }
    t.g.attributes.color.needsUpdate=true;
  }
}

/* ── 物理状态 ── */
let mode='chaos',epsExp=-4,eps=1e-4,dtStep=0.004,massRatio=1;
let playing=true,labelsOn=true,slowMo=false,trailsOn=true;
let simT=0,accDt=0,E0=0;
const G=1,SC=2.0,RATE=0.6,T8=6.324449;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 8 字周期解初值(等质量,G=1) */
const FIG8={
  x:[[0.97000436,-0.24308753],[-0.97000436,0.24308753],[0,0]],
  v:[[0.46620368,0.43236573],[0.46620368,0.43236573],[-0.93240737,-0.86473146]]
};
function lagIC(m){
  const M=m[0]+m[1]+m[2],a=Math.sqrt(3);
  const V=[[0,1],[Math.cos(210*Math.PI/180),Math.sin(210*Math.PI/180)],[Math.cos(330*Math.PI/180),Math.sin(330*Math.PI/180)]];
  const cm=[0,0];for(let i=0;i<3;i++){cm[0]+=m[i]*V[i][0]/M;cm[1]+=m[i]*V[i][1]/M;}
  const w=Math.sqrt(M/Math.pow(a,3));
  const x=V.map(p=>[p[0]-cm[0],p[1]-cm[1]]);
  const v=x.map(p=>[w*(-p[1]),w*p[0]]);
  return {x,v};
}
let sysA=null,sysB=null;
function accel(s){
  const a=s.a;
  for(let i=0;i<3;i++){a[i][0]=0;a[i][1]=0;}
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){
    const dx=s.x[j][0]-s.x[i][0],dy=s.x[j][1]-s.x[i][1];
    const r2=dx*dx+dy*dy+1e-9,inv=1/(r2*Math.sqrt(r2));
    a[i][0]+=G*s.m[j]*dx*inv;a[i][1]+=G*s.m[j]*dy*inv;
    a[j][0]-=G*s.m[i]*dx*inv;a[j][1]-=G*s.m[i]*dy*inv;
  }
}
function stepSys(s,dt){
  const a0=[[s.a[0][0],s.a[0][1]],[s.a[1][0],s.a[1][1]],[s.a[2][0],s.a[2][1]]];
  for(let i=0;i<3;i++){
    s.x[i][0]+=s.v[i][0]*dt+0.5*a0[i][0]*dt*dt;
    s.x[i][1]+=s.v[i][1]*dt+0.5*a0[i][1]*dt*dt;
  }
  accel(s);
  for(let i=0;i<3;i++){
    s.v[i][0]+=0.5*(a0[i][0]+s.a[i][0])*dt;
    s.v[i][1]+=0.5*(a0[i][1]+s.a[i][1])*dt;
  }
}
function energy(s){
  let E=0;
  for(let i=0;i<3;i++)E+=0.5*s.m[i]*(s.v[i][0]*s.v[i][0]+s.v[i][1]*s.v[i][1]);
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){
    const dx=s.x[j][0]-s.x[i][0],dy=s.x[j][1]-s.x[i][1];
    E-=G*s.m[i]*s.m[j]/Math.sqrt(dx*dx+dy*dy+1e-9);
  }
  return E;
}
function omegaNow(){
  const M=1+massRatio+1,a=Math.sqrt(3);
  return Math.sqrt(M/Math.pow(a,3));
}
function reset(){
  const m=[1,massRatio,1];
  if(mode==='fig'){
    sysA={m,x:FIG8.x.map(p=>p.slice()),v:FIG8.v.map(p=>p.slice()),a:[[0,0],[0,0],[0,0]]};
  }else{
    const ic=lagIC(m);
    sysA={m,x:ic.x.map(p=>p.slice()),v:ic.v.map(p=>p.slice()),a:[[0,0],[0,0],[0,0]]};
  }
  accel(sysA);
  if(mode==='chaos'){
    sysB={m,x:sysA.x.map(p=>p.slice()),v:sysA.v.map(p=>p.slice()),a:[[0,0],[0,0],[0,0]]};
    sysB.x[0][0]+=eps;
    accel(sysB);
  }else sysB=null;
  simT=0;accDt=0;E0=energy(sysA);
  for(const t of trailA)trailClear(t);
  for(const t of trailB)trailClear(t);
  syncVis();
}
function syncVis(){
  const chaos=mode==='chaos';
  for(let i=0;i<3;i++){
    starB[i].visible=chaos;
    trailB[i].line.visible=chaos&&trailsOn;
    trailA[i].line.visible=trailsOn;
  }
}

/* ── 标签 ── */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const SUP={'-3':'⁻³','-4':'⁻⁴','-5':'⁻⁵','-6':'⁻⁶'};
const lblCap=addLabel(()=>{
  if(mode==='fig')return L('8 字周期解 · 等质量三体(Chenciner–Montgomery 2000)','Figure-8 periodic orbit · equal masses (Chenciner–Montgomery 2000)');
  if(mode==='lag')return L('拉格朗日等边三角 · 刚性整体旋转,任意质量比都成立','Lagrange equilateral triangle · rigid rotation, valid for any mass ratio');
  return L(`混沌双跑:同一初值 vs 初值+ε=10${SUP[epsExp]}`,`Chaos dual-run: same initial data vs data + ε=10${SUP[epsExp]}`);
},new THREE.Vector3(0,4.5,0),'o');
const lblS1=addLabel(()=>L('恒星 1','Star 1'),new THREE.Vector3(0,0.55,0),'r',()=>mode!=='chaos');
const lblS2=addLabel(()=>L('恒星 2','Star 2'),new THREE.Vector3(0,0.55,0),'y',()=>mode!=='chaos');
const lblS3=addLabel(()=>L('恒星 3','Star 3'),new THREE.Vector3(0,0.55,0),'b',()=>mode!=='chaos');
const lblBase=addLabel(()=>L('系统 A · 原初值','System A · original data'),new THREE.Vector3(0,0.8,0),'g',()=>mode==='chaos');
const lblCopy=addLabel(()=>L('系统 B · 初值+ε','System B · data + ε'),new THREE.Vector3(0,0.8,0),'y',()=>mode==='chaos');

/* ── 控件 ── */
function setEpsExp(v){epsExp=clamp(Math.round(v),-6,-3);eps=Math.pow(10,epsExp);
  document.getElementById('sEps').value=epsExp;
  document.getElementById('sEpsVal').textContent='10'+SUP[epsExp];
  reset();}
function setDt(v){dtStep=clamp(v,0.002,0.02);
  document.getElementById('sDt').value=dtStep;
  document.getElementById('sDtVal').textContent=dtStep.toFixed(4);
  reset();}
function setMass(v){massRatio=clamp(v,0.4,2.5);
  document.getElementById('sMass').value=massRatio;
  document.getElementById('sMassVal').textContent=massRatio.toFixed(2);
  reset();}
function setMode(m){mode=m;
  document.getElementById('bFig').classList.toggle('on',m==='fig');
  document.getElementById('bLag').classList.toggle('on',m==='lag');
  document.getElementById('bChaos').classList.toggle('on',m==='chaos');
  reset();}

const STEPS=[
 {zh:'<b>两体:开普勒精确解</b>:两个天体沿圆锥曲线永久循环,位置可解析预言——拉格朗日三角就是这种“规整”的特例',
  en:'<b>Two bodies: Kepler\u2019s exact answer</b>: two bodies loop forever on conic sections, predictable in closed form — the Lagrange triangle is one such regular case',
  act(){setMode('lag');setMass(1);}},
 {zh:'<b>三体:无闭式解</b>:庞加莱证明一般三体不可解析,只能数值积分一步步推进',
  en:'<b>Three bodies: no closed form</b>: Poincar\u00e9 proved the general problem cannot be solved analytically — only stepped forward numerically',
  act(){setMode('chaos');setEpsExp(-3);}},
 {zh:'<b>特殊解:8 字与等边三角</b>:等质量 8 字(2000 年发现)与拉格朗日三角是罕见的周期解',
  en:'<b>Special solutions: figure-8 & triangle</b>: the equal-mass figure-8 (found 2000) and Lagrange\u2019s equilateral triangle are rare periodic orbits',
  act(){setMode('fig');setMass(1);}},
 {zh:'<b>微扰初值 ε</b>:复制一套三体,初值只挪动 10⁻⁶——起初两条轨迹几乎重叠',
  en:'<b>A nudged twin</b>: clone the system and shift the initial data by 10\u207b\u2076 — at first the two trajectories lie on top of each other',
  act(){setMode('chaos');setEpsExp(-6);}},
 {zh:'<b>数圈之后分道扬镳</b>:偏差按 e^{λt} 指数增长,几圈后两套轨迹完全不同',
  en:'<b>A few orbits later: parted ways</b>: the offset grows like e^{λt}, and after a few loops the trajectories are nothing alike',
  act(){setMode('chaos');setEpsExp(-4);}},
 {zh:'<b>确定性 ≠ 可预测:混沌</b>:方程完全确定,长期却不可预测——观测误差与初值误差同罪',
  en:'<b>Deterministic ≠ predictable: chaos</b>: the equations are exact, yet long-term prediction fails — measurement and initial errors are equally damning',
  act(){setMode('chaos');setEpsExp(-3);}},
 {zh:'<b>数值误差同样被放大</b>:调大步长 Δt,能量漂移与轨迹偏差同样被指数放大',
  en:'<b>Numerical error is amplified too</b>: enlarge the step Δt and energy drift and trajectory error blow up the same way',
  act(){setMode('chaos');setEpsExp(-6);setDt(0.02);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const Tref=mode==='fig'?T8:2*Math.PI/omegaNow();
  document.getElementById('stOrb').innerHTML=(simT/Tref).toFixed(2)+'<small> 周</small>';
  const sepEl=document.getElementById('stSep'),ampEl=document.getElementById('stAmp');
  if(mode==='chaos'&&sysB){
    let d=0;
    for(let i=0;i<3;i++){
      const dx=sysA.x[i][0]-sysB.x[i][0],dy=sysA.x[i][1]-sysB.x[i][1];
      const dd=Math.sqrt(dx*dx+dy*dy);if(dd>d)d=dd;
    }
    const lg=Math.log10(Math.max(d,1e-12)),la=lg-Math.log10(eps);
    sepEl.innerHTML='10<sup>'+lg.toFixed(1)+'</sup>';
    ampEl.innerHTML='10<sup>'+la.toFixed(1)+'</sup>';
    sepEl.className='v '+(lg>-0.5?'warn':(lg<-3.5?'ok':''));
    ampEl.className='v '+(la>3?'warn':'ok');
  }else{
    sepEl.innerHTML='<small>—</small>';sepEl.className='v';
    ampEl.innerHTML='<small>—</small>';ampEl.className='v';
  }
  const drift=Math.abs(energy(sysA)-E0)/Math.max(Math.abs(E0),1e-9)*100;
  const en=document.getElementById('stEn');
  en.innerHTML=drift.toFixed(3)+'<small> %</small>';
  en.className='v '+(drift>0.5?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bFig').addEventListener('click',()=>setMode('fig'));
document.getElementById('bLag').addEventListener('click',()=>setMode('lag'));
document.getElementById('bChaos').addEventListener('click',()=>setMode('chaos'));
document.getElementById('sEps').addEventListener('input',e=>setEpsExp(+e.target.value));
document.getElementById('sDt').addEventListener('input',e=>setDt(+e.target.value));
document.getElementById('sMass').addEventListener('input',e=>setMass(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{trailsOn=e.target.checked;syncVis();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  BG.setHex(dark?0x101418:0xe9e4dc);
  for(const c of refCircles)c.material.color.setHex(dark?0x3a4a63:0x9a8f80);
  trailRepaint();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  const dSim=dts*RATE;
  simT+=dSim;accDt+=dSim;
  let guard=0;
  while(accDt>=dtStep&&guard<900){
    stepSys(sysA,dtStep);
    if(sysB)stepSys(sysB,dtStep);
    accDt-=dtStep;guard++;
  }
  if(guard>=900)accDt=0;
  for(let i=0;i<3;i++){
    starA[i].position.set(sysA.x[i][0]*SC,0,-sysA.x[i][1]*SC);
    if(sysB)starB[i].position.set(sysB.x[i][0]*SC,0,-sysB.x[i][1]*SC);
  }
  if(playing&&trailsOn){
    for(let i=0;i<3;i++){
      trailPush(trailA[i],starA[i].position.x,0,starA[i].position.z);
      if(sysB)trailPush(trailB[i],starB[i].position.x,0,starB[i].position.z);
    }
  }
  lblS1.position.set(starA[0].position.x,0.55,starA[0].position.z);
  lblS2.position.set(starA[1].position.x,0.55,starA[1].position.z);
  lblS3.position.set(starA[2].position.x,0.55,starA[2].position.z);
  lblBase.position.set(starA[0].position.x,0.85,starA[0].position.z);
  if(sysB)lblCopy.position.set(starB[0].position.x,0.85,starB[0].position.z);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setEpsExp(-4);setDt(0.004);setMass(1);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(4);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
