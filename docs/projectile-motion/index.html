<style>

{

{

{

/* 小球 + 虚线轨迹 */
const ballM=new THREE.MeshStandardMaterial({color:0xe8eef6,roughness:0.3,metalness:0.5,emissive:0x3a4552,emissiveIntensity:0.4});

  arr.position.copy(pos);
  const l=Math.max(len,0.02);
  arr.scale.set(1,l,1);
  tmpV.set(dx,dy,0).normalize();
  arr.quaternion.setFromUnitVectors(UP,tmpV);
}
/* 幽灵投影:地面匀速影子(绿)+ 侧墙匀加速影子(橙),每 0.1 s 打一个点 */
const ghostG=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,14),
  new THREE.MeshBasicMaterial({color:0x74dc84,transparent:true,opacity:0.55}));
ghostG.scale.y=0.4;scene.add(ghostG);
const ghostW=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,14),
  new THREE.MeshBasicMaterial({color:0xffb35c,transparent:true,opacity:0.6}));
scene.add(ghostW);
function dotPool(color,n){
  const m=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,8),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.8}),n);
  m.count=0;scene.add(m);return m;
}
const gDots=dotPool(0x74dc84,90),wDots=dotPool(0xffb35c,90);
const dum=new THREE.Object3D();
function dropDot(pool,x,y,z){if(pool.count>=90)return;
  dum.position.set(x,y,z);dum.updateMatrix();pool.setMatrixAt(pool.count,dum.matrix);pool.count++;}
/* 落点环:θ 与 90°−θ 同色对 + 45° 最远标记 */
const pairM=new THREE.MeshBasicMaterial({color:0x5fb8d9,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false});
const ringT=new THREE.Mesh(new THREE.RingGeometry(0.26,0.34,40),pairM);
ringT.rotation.x=-Math.PI/2;ringT.position.y=0.03;ringT.visible=false;scene.add(ringT);
const ringC=new THREE.Mesh(new THREE.RingGeometry(0.4,0.46,40),pairM);
ringC.rotation.x=-Math.PI/2;ringC.position.y=0.03;ringC.visible=false;scene.add(ringC);
const mark45M=new THREE.MeshStandardMaterial({color:0x9aa8b8,roughness:0.5,metalness:0.4});
const mark45=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.34,10),mark45M);
mark45.position.y=0.17;mark45.visible=false;scene.add(mark45);
/* 参考弹道:90°−θ(青,同射程)与 45°(灰,最远) */
function ghostLine(color,op){
  const m=new THREE.LineDashedMaterial({color,transparent:true,opacity:op,dashSize:0.18,gapSize:0.12});
  const l=new THREE.Line(new THREE.BufferGeometry(),m);
  l.frustumCulled=false;scene.add(l);return l;
}
const ghostC=ghostLine(0x5fb8d9,0.8),ghost45=ghostLine(0x8a94a4,0.55);
const apexMk=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10),vO);
apexMk.visible=false;scene.add(apexMk);

/* 状态与物理(真实量纲:m、s;m/s²;阻力 ∝ v² 的教学化强度) */
const G={earth:9.8,moon:1.6,jupiter:24.8};
let mode='earth',v0=20,ang=45,drag=false,vecOn=true,playing=true,labelsOn=true,slowMo=false;
let gNow=G.earth,K=0.006;
let phase='idle',idleT=0,bx=0,by=0,bvx=0,bvy=0,ft=0,apex=0,apexX=0,lastR=0,lastH=0,dropAcc=0;
let predR=40,predH=10,vacNum=40;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const muzY=th=>(PIVY+MUZ*Math.cos(th*Math.PI/180))*SC, muzX=th=>MUZ*Math.sin(th*Math.PI/180)*SC;
/* 数值弹道:与主模拟同款积分,射程/最高点/参考线全用它,量纲诚实 */
function trace(v,th,withDrag){
  const a=th*Math.PI/180;
  let x=muzX(th),y=muzY(th),vx=v*Math.cos(a),vy=v*Math.sin(a),ap=y;
  const pts=[new THREE.Vector3(X0+x/SC,y/SC,0)],dt=0.02;
  while(y>0&&pts.length<900){
    const sp=Math.hypot(vx,vy);
    const ax=withDrag?-K*sp*vx:0,ay=-gNow+(withDrag?-K*sp*vy:0);
    vx+=ax*dt;vy+=ay*dt;x+=vx*dt;y+=vy*dt;ap=Math.max(ap,y);
    pts.push(new THREE.Vector3(X0+x/SC,Math.max(y/SC,0),0));
  }
  return{pts,range:x,apex:ap};
}
function stepBall(dt){
  const sp=Math.hypot(bvx,bvy);
  const ax=drag?-K*sp*bvx:0,ay=-gNow+(drag?-K*sp*bvy:0);
  bvx+=ax*dt;bvy+=ay*dt;bx+=bvx*dt;by+=bvy*dt;ft+=dt;
  if(by>=apex){apex=by;apexX=bx;}
  dropAcc+=dt;
  if(dropAcc>0.1){dropAcc=0;
    dropDot(gDots,X0+bx/SC,0.14,0);
    dropDot(wDots,X0+0.4,0.14+by/SC,-3.15);}
}
function resetLaunch(frac=0){
  const a=ang*Math.PI/180;
  bx=muzX(ang);by=muzY(ang);
  bvx=v0*Math.cos(a);bvy=v0*Math.sin(a);
  ft=0;apex=by;apexX=bx;dropAcc=0;trailPts=[];lastR=0;lastH=0;
  gDots.count=0;wDots.count=0;
  ringT.visible=true;ringT.position.set(X0+predR/SC,0.03,0);
  phase='idle';idleT=0;
  if(frac>0){                    /* 初始直接呈现飞行中段 */
    const s=Math.sin(a),T=(v0*s+Math.sqrt(v0*v0*s*s+2*gNow*by))/gNow,tT=frac*T;
    while(ft<tT&&by>0){stepBall(0.016);pushTrail(false);}
    phase='fly';placeBall();
  }else placeBall();
}
function pushTrail(force){
  const p=new THREE.Vector3(X0+bx/SC,by/SC,0);
  if(force||!trailPts.length||p.distanceTo(trailPts[trailPts.length-1])>0.07){
    trailPts.push(p);
    if(trailPts.length>600)trailPts.shift();
  }
  const flat=[];
  for(const q of trailPts)flat.push(q.x,q.y,q.z);
  trail.geometry.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
  trail.computeLineDistances();
}
function placeBall(){
  ball.position.set(X0+bx/SC,Math.max(by/SC,0.18),0);
}
/* 参考弹道与落点标记:90°−θ(青,同射程同色环)与 45°(灰,最远),真空才严格成立 */
function setLinePts(line,pts){
  const flat=[];
  for(const q of pts)flat.push(q.x,q.y,q.z);
  line.geometry.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
  line.computeLineDistances();
}
function rebuildRefs(){
  const cur=trace(v0,ang,drag);
  predR=cur.range;predH=cur.apex;
  vacNum=trace(v0,ang,false).range;
  const show=!drag&&Math.abs(ang-45)>0.5,a2=90-ang;
  const comp=show?trace(v0,a2,false):null,g45=show?trace(v0,45,false):null;
  ghostC.visible=show;
  if(show)setLinePts(ghostC,comp.pts);
  ghost45.visible=show;
  if(show)setLinePts(ghost45,g45.pts);
  mark45.visible=show;
  if(show)mark45.position.set(X0+g45.range/SC,0.17,0);
  ringC.visible=show;
  if(show)ringC.position.set(X0+comp.range/SC,0.03,0);
  if(!drag||lastR===0)ringT.position.set(X0+predR/SC,0.03,0);
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblGun=addLabel(()=>L(`θ = ${ang}° · v₀ = ${v0} m/s`,`θ = ${ang}° · v₀ = ${v0} m/s`),new THREE.Vector3(X0+0.3,1.9,0.3),'o');
const lblG=addLabel(()=>L(`g = ${gNow.toFixed(1)} m/s² · ${{earth:'地球',moon:'月球',jupiter:'木星'}[mode]}`,
  `g = ${gNow.toFixed(1)} m/s² · ${{earth:'Earth',moon:'Moon',jupiter:'Jupiter'}[mode]}`),new THREE.Vector3(X0+1.9,0.4,0.9),'b');
const lblR=addLabel(()=>L(`射程 R = ${((drag&&lastR)?lastR:predR).toFixed(1)} m`,
  `Range R = ${((drag&&lastR)?lastR:predR).toFixed(1)} m`),new THREE.Vector3(0,0.75,0),'r',
  ()=>ringT.visible);
const lbl45=addLabel(()=>L('45° 最远 · θ 与 90°−θ 同射程','45° is farthest · θ and 90°−θ share R'),
  new THREE.Vector3(0,0.62,0),'y',()=>mark45.visible);
const lblGhost=addLabel(()=>L('幽灵投影:地面匀速 / 侧墙匀加速','Ghosts: ground uniform / wall uniform-accel'),
  new THREE.Vector3(X0+2.8,0.55,-3.1),'g',()=>vecOn);
function setLblPos(l,x,y,z){l.position.set(x,y,z);}
/* 步骤切换时把跟随类标签挂到正确锚点 */

function setV(v){v0=clamp(v,5,40);
  document.getElementById('sV').value=v0;
  document.getElementById('sVVal').textContent=v0.toFixed(0)+' m/s';
  resetLaunch();rebuildRefs();updateStats();}
function setAng(v){ang=clamp(v,5,85);
  document.getElementById('sAng').value=ang;
  document.getElementById('sAngVal').textContent=ang.toFixed(0)+'°';
  pivot.rotation.z=-ang*Math.PI/180;
  resetLaunch();rebuildRefs();updateStats();}
function setMode(m){mode=m;gNow=G[m];
  document.getElementById('bEarth').classList.toggle('on',m==='earth');
  document.getElementById('bMoon').classList.toggle('on',m==='moon');
  document.getElementById('bJupiter').classList.toggle('on',m==='jupiter');
  resetLaunch();rebuildRefs();updateStats();}
function setDrag(v){drag=v;
  document.getElementById('tglDrag').checked=v;
  lastR=0;lastH=0;
  resetLaunch();rebuildRefs();updateStats();}
function setVec(v){vecOn=v;
  document.getElementById('tglVec').checked=v;
  arrV.visible=arrVx.visible=arrVy.visible=v;
  ghostG.visible=ghostW.visible=v;
  if(!v){gDots.count=0;wDots.count=0;}}

const STEPS=[
 {zh:'<b>分解独立</b>:水平方向无力、匀速直线;竖直方向只有重力、匀加速——合运动才是抛物线',
  en:'<b>Independence</b>: no force horizontally (uniform), only gravity vertically (uniform accel) — the sum is the parabola',
  act(){setMode('earth');setDrag(false);setV(20);setAng(45);setVec(true);}},
 {zh:'<b>竖直上抛对称</b>:近竖直发射,上升到最高点与落回时间相同,同一高度速度等大',
  en:'<b>Vertical symmetry</b>: near-vertical shot — rise time equals fall time, speeds equal at equal heights',
  act(){setAng(85);setV(16);}},
 {zh:'<b>45° 最大射程</b>:sin2θ 在 45° 取 1,R=v₀²sin2θ/g 冲到最远',
  en:'<b>45° maximizes range</b>: sin2θ peaks at 1 when θ=45°, R=v₀²sin2θ/g',
  act(){setAng(45);setV(28);}},
 {zh:'<b>互补角同射程</b>:30° 与 60° 的 sin2θ 相等,两发落点重合(同色环)',
  en:'<b>Complementary angles</b>: 30° and 60° share sin2θ — both land on the same ring',
  act(){setAng(30);setV(28);}},
 {zh:'<b>月球上发射</b>:g 只有 1.6 m/s²,同一发弹道拉长 6 倍',
  en:'<b>Shooting on the Moon</b>: g is only 1.6 m/s² — the same shot stretches 6× farther',
  act(){setMode('moon');setAng(45);setV(12);}},
 {zh:'<b>空气阻力的真实弹道</b>:阻力吃掉水平动能,下落段更陡、弹道不再对称',
  en:'<b>Real drag trajectory</b>: drag eats horizontal momentum — steeper descent, broken symmetry',
  act(){setMode('earth');setAng(35);setV(38);setDrag(true);setVec(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stV').innerHTML=v0.toFixed(0)+'<small> m/s</small>';
  document.getElementById('stAng').innerHTML=ang.toFixed(0)+'<small> °</small>';
  const R=(drag&&lastR)?lastR:predR;
  const rE=document.getElementById('stR');
  rE.innerHTML=R.toFixed(1)+'<small> m</small>';
  rE.className='v '+((drag&&lastR&&lastR<vacNum*0.85)?'warn':(!drag&&Math.abs(ang-45)<0.5?'ok':''));
  const H=(drag&&lastH)?lastH:predH;
  const hE=document.getElementById('stH');
  hE.innerHTML=H.toFixed(1)+'<small> m</small>';
  hE.className='v '+(H>55?'warn':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bEarth').addEventListener('click',()=>setMode('earth'));
document.getElementById('bMoon').addEventListener('click',()=>setMode('moon'));
document.getElementById('bJupiter').addEventListener('click',()=>setMode('jupiter'));
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sAng').addEventListener('input',e=>setAng(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  wallM.color.setHex(dark?0x8fa2b8:0x5b6b7d);
  wallGridM.color.setHex(dark?0x4a5563:0xb0a89a);
  trailM.color.setHex(dark?0xe8eef6:0x4a5563);
  buildGrid(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  /* 飞行状态机:待发 → 飞行 → 落地打点 → 重新装填 */
  if(phase==='idle'){idleT+=dts;if(idleT>0.6)phase='fly';}
  else if(phase==='fly'){
    let n=Math.max(1,Math.ceil(dts/0.008));
    for(let i=0;i<n;i++)stepBall(dts/n);
    pushTrail(false);placeBall();
    if(by<=0&&bvy<0&&ft>0.05){
      by=0;lastR=bx;lastH=apex;
      ringT.visible=true;ringT.position.set(X0+bx/SC,0.03,0);
      phase='landed';idleT=0;
    }
  }else{idleT+=dts;if(idleT>1.1)resetLaunch(0);}
  ball.rotation.z-=dts*v0*0.4;
  ball.visible=phase!=='idle';
  trail.visible=trailPts.length>1;
  /* 速度矢量与幽灵投影 */
  const fly=phase==='fly';
  const bp=ball.position;
  arrV.visible=arrVx.visible=arrVy.visible=vecOn&&fly;
  ghostG.visible=ghostW.visible=vecOn;
  if(vecOn){
    ghostG.position.set(fly?X0+bx/SC:ghostG.position.x,0.14,0);
    ghostW.position.set(X0+0.4,0.14+(fly?by/SC:0.02),-3.15);
    if(fly){
      aimArrow(arrV,bp,bvx,bvy,clamp(Math.hypot(bvx,bvy)*0.055,0.35,2.6));
      aimArrow(arrVx,bp,Math.sign(bvx)||1,0,clamp(Math.abs(bvx)*0.055,0.3,2.4));
      aimArrow(arrVy,bp,0,bvy>=0?1:-1,clamp(Math.abs(bvy)*0.055,0.3,2.4));
    }
  }
  apexMk.visible=fly&&apex>by+0.5;
  if(apexMk.visible)apexMk.position.set(X0+apexX/SC,apex/SC,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  setLblPos(lblR,ringT.visible?ringT.position.x:0,0.75,0);
  setLblPos(lbl45,mark45.visible?mark45.position.x:0,0.62,0);
  lblDecomp.visible=labelsOn&&vecOn&&fly;
  if(lblDecomp.visible){lblDecomp.position.set(bp.x,bp.y+0.85,0);
    lblDecomp.element.textContent=L('水平匀速 · 竖直匀加速','uniform x · uniform-accel y');}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
const lblDecomp=addLabel(()=>L('水平匀速 · 竖直匀加速','uniform × · uniform-accel y'),
  new THREE.Vector3(0,3,0),'b',()=>false);
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
resetLaunch([0.55,0.5,0.5,0.5,0.45,0.55][activeStep]||0.55);   /* 初始停在飞行中段 */
rebuildRefs();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
