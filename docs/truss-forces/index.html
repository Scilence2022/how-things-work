<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-8.5,4.8,11.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与桥墩 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.35;scene.add(ground);
const pierM=new THREE.MeshStandardMaterial({color:0x4a5261,roughness:0.85});
for(const px of [-4,4]){
  const pier=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.35,2.3),pierM);
  pier.position.set(px,-0.675,0);scene.add(pier);
}

/* ---- 桥面(下承式)+ 桥面板(实例化) ---- */
const deckM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.55,metalness:0.3});
const deck=new THREE.Mesh(new THREE.BoxGeometry(8.7,0.12,2.3),deckM);
deck.position.set(0,0.02,0);scene.add(deck);
const plankM=new THREE.MeshStandardMaterial({color:0x6e7d94,roughness:0.7});
const planks=new THREE.InstancedMesh(new THREE.BoxGeometry(0.52,0.035,2.05),plankM,12);
const m4=new THREE.Matrix4();
for(let i=0;i<12;i++){m4.makeTranslation(-3.75+i*0.682,0.097,0);planks.setMatrixAt(i,m4);}
scene.add(planks);
const beamM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.5});
for(let i=0;i<5;i++){
  const fb=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.1,2.1),beamM);
  fb.position.set(-4+i*2,0.16,0);scene.add(fb);
}
const braces=[];
for(let i=0;i<3;i++){
  const tb=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.08,2.1),beamM);
  scene.add(tb);braces.push(tb);
}

/* ---- 桁架几何:4节间 Pratt,8节点13杆(m=2j−3) ---- */
/* 节点: B0..B4 下弦(0..4), T1..T3 上弦(5..7);世界坐标 x−4 居中 */
const MEM=[[0,1],[1,2],[2,3],[3,4],[5,6],[6,7],[0,5],[4,7],[1,5],[2,6],[3,7],[5,2],[7,2]];
const ZS=[1.05,-1.05];
let hR=0.15;
const nodePos=()=>{const h=hR*8,b=0.16;
  return [[0,b],[2,b],[4,b],[6,b],[8,b],[2,b+h],[4,b+h],[6,b+h]];};
let loadK=40, mode='mid', jointMode=false, cartX=-3.2, simT=0;
let forces=new Array(13).fill(0), rB0y=0, maxT=0, maxC=0;

/* ---- 平面桁架有限元:刚度法一次求解(拉为正) ---- */
const EA=4e5,NJ=8,NDOF=16;
function solveTruss(P,fv){
  const K=new Float64Array(NDOF*NDOF),f=Float64Array.from(fv);
  const Lm=[],dxs=[],dys=[];
  MEM.forEach(m=>{
    const [i,j]=m,L=Math.hypot(P[j][0]-P[i][0],P[j][1]-P[i][1]);
    Lm.push(L);const dx=(P[j][0]-P[i][0])/L,dy=(P[j][1]-P[i][1])/L;dxs.push(dx);dys.push(dy);
    const k=EA/L,ix=i*2,jx=j*2,add=(r,c,v)=>{K[r*NDOF+c]+=v;};
    add(ix,ix,k*dx*dx);add(ix,ix+1,k*dx*dy);add(ix+1,ix,k*dx*dy);add(ix+1,ix+1,k*dy*dy);
    add(jx,jx,k*dx*dx);add(jx,jx+1,k*dx*dy);add(jx+1,jx,k*dx*dy);add(jx+1,jx+1,k*dy*dy);
    add(ix,jx,-k*dx*dx);add(ix,jx+1,-k*dx*dy);add(ix+1,jx,-k*dx*dy);add(ix+1,jx+1,-k*dy*dy);
    add(jx,ix,-k*dx*dx);add(jx,ix+1,-k*dx*dy);add(jx+1,ix,-k*dx*dy);add(jx+1,ix+1,-k*dy*dy);
  });
  const K0=K.slice(),bc=[0,1,9]; /* B0 铰支,B4 滚轴 */
  const fext=Float64Array.from(f); /* 支座节点上的外载要计入反力 */
  for(const c of bc){for(let j=0;j<NDOF;j++){K[c*NDOF+j]=0;K[j*NDOF+c]=0;}K[c*NDOF+c]=1;f[c]=0;}
  const A=new Float64Array(NDOF*(NDOF+1));
  for(let r=0;r<NDOF;r++){for(let c=0;c<NDOF;c++)A[r*(NDOF+1)+c]=K[r*NDOF+c];A[r*(NDOF+1)+NDOF]=f[r];}
  for(let col=0;col<NDOF;col++){
    let piv=col;for(let r=col+1;r<NDOF;r++)if(Math.abs(A[r*(NDOF+1)+col])>Math.abs(A[piv*(NDOF+1)+col]))piv=r;
    if(piv!==col)for(let c=col;c<=NDOF;c++){const t=A[col*(NDOF+1)+c];A[col*(NDOF+1)+c]=A[piv*(NDOF+1)+c];A[piv*(NDOF+1)+c]=t;}
    const d=A[col*(NDOF+1)+col]||1e-12;
    for(let r=col+1;r<NDOF;r++){const fa=A[r*(NDOF+1)+col]/d;if(fa===0)continue;
      for(let c=col;c<=NDOF;c++)A[r*(NDOF+1)+c]-=fa*A[col*(NDOF+1)+c];}
  }
  const u=new Float64Array(NDOF);
  for(let r=NDOF-1;r>=0;r--){let s=A[r*(NDOF+1)+NDOF];
    for(let c=r+1;c<NDOF;c++)s-=A[r*(NDOF+1)+c]*u[c];u[r]=s/(A[r*(NDOF+1)+r]||1e-12);}
  const N=MEM.map((m,mi)=>EA/Lm[mi]*((u[m[1]*2]-u[m[0]*2])*dxs[mi]+(u[m[1]*2+1]-u[m[0]*2+1])*dys[mi]));
  const R=bc.map(c=>{let s=0;for(let j=0;j<NDOF;j++)s+=K0[c*NDOF+j]*u[j];return s-fext[c];});
  return {N,R};
}
function buildLoadVec(){
  const f=new Float64Array(NDOF);
  if(mode==='mid')f[6*2+1]-=loadK;
  else{
    const xc=clamp(cartX+4,0.3,7.7),seg=clamp(Math.floor(xc/2),0,3),fr=clamp((xc-2*seg)/2,0,1);
    f[seg*2+1]-=loadK*(1-fr);f[(seg+1)*2+1]-=loadK*fr;
  }
  return f;
}

const v3=new THREE.Vector3(),q=new THREE.Quaternion(),vY=new THREE.Vector3(0,1,0);
function orientMesh(mesh,x1,y1,z1,x2,y2,z2){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length());v3.normalize();
  mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  mesh.quaternion.setFromUnitVectors(vY,v3);mesh.scale.set(1,len,1);
}

  const mesh=new THREE.Mesh(memGeo,new THREE.MeshStandardMaterial({color:0x7d8794,roughness:0.45,metalness:0.5}));
  scene.add(mesh);members.push({mesh,mi,z});
}
const C_T0=new THREE.Color(0x713c3c),C_T1=new THREE.Color(0xff6b6b);
const C_C0=new THREE.Color(0x3c4a72),C_C1=new THREE.Color(0x7aa2ff);
const C_Z=new THREE.Color(0x7d8794),cTmp=new THREE.Color();
function placeMembers(){
  const P=nodePos();
  for(const it of members){
    const [i,j]=MEM[it.mi];
    orientMesh(it.mesh,P[i][0]-4,P[i][1],it.z,P[j][0]-4,P[j][1],it.z);
  }
  braces.forEach((tb,i)=>tb.position.set(-2+i*2,0.16+hR*8,0));
}
function updateForces(){
  const {N,R}=solveTruss(nodePos(),buildLoadVec());
  forces=N;rB0y=R[1];
  maxT=Math.max(0,...N);maxC=Math.max(0,...N.map(v=>-v));
  const maxA=Math.max(1e-6,maxT,maxC);
  for(const it of members){
    const Nf=forces[it.mi],rel=Math.abs(Nf)/maxA;
    if(Math.abs(Nf)<maxA*0.05)cTmp.copy(C_Z);
    else if(Nf>0)cTmp.lerpColors(C_T0,C_T1,Math.min(1,rel));
    else cTmp.lerpColors(C_C0,C_C1,Math.min(1,rel));
    it.mesh.material.color.copy(cTmp);
    const rf=0.55+1.5*Math.min(1,rel);
    it.mesh.scale.x=rf;it.mesh.scale.z=rf;
  }
  updateArrows();
}

/* ---- 节点特写:B0 三力汇交 + 闭合力三角形 ---- */
function makeArrow(hex){
  const g=new THREE.Group(),m=new THREE.MeshBasicMaterial({color:hex});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,0.8,10),m);
  shaft.position.y=0.4;
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.095,0.2,12),m);
  head.position.y=0.9;
  g.add(shaft);g.add(head);return g;
}
const closeG=new THREE.Group();closeG.visible=false;scene.add(closeG);
const NXa=-7.2,NYa=2.6,NZa=0.8,TXa=-5.6,TYa=0.55;
const jointDot=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,12),
  new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa94d,emissiveIntensity:0.35}));
jointDot.position.set(NXa,NYa,NZa);closeG.add(jointDot);
const aR=makeArrow(0x8ce99a),aC=makeArrow(0xff6b6b),aP=makeArrow(0x7aa2ff);
const tR=makeArrow(0x8ce99a),tC=makeArrow(0xff6b6b),tP=makeArrow(0x7aa2ff);
closeG.add(aR,aC,aP,tR,tC,tP);
const triBase=new THREE.Mesh(new THREE.CircleGeometry(0.09,20),
  new THREE.MeshBasicMaterial({color:0xffa94d}));
triBase.position.set(TXa,TYa,0.79);closeG.add(triBase);

  s.position.set(-4,0.16,z);s.visible=false;scene.add(s);jointHi.push(s);
}
function setArrow(g,x,y,z,dx,dy,dz,len){
  g.position.set(x,y,z);
  v3.set(dx,dy,dz);if(v3.lengthSq()<1e-9)v3.set(0,1,0);v3.normalize();
  g.quaternion.setFromUnitVectors(vY,v3);
  len=Math.max(0.12,len);
  g.scale.set(clamp(0.6+len*0.4,0.6,1.3),len,clamp(0.6+len*0.4,0.6,1.3));
}
function updateArrows(){
  if(!closeG.visible)return;
  const h=hR*8,L06=Math.hypot(2,h);
  const k=1.5/Math.max(Math.abs(rB0y),Math.abs(forces[0]),Math.abs(forces[6]),1e-6);
  setArrow(aR,NXa,NYa,NZa,0,1,0,rB0y*k);
  setArrow(aC,NXa,NYa,NZa,Math.sign(forces[0])||1,0,0,Math.abs(forces[0])*k);
  setArrow(aP,NXa,NYa,NZa,forces[6]*2/L06,forces[6]*h/L06,0,Math.abs(forces[6])*k);
  const v1y=rB0y*k,v2x=forces[0]*k,v3x=forces[6]*2/L06*k,v3y=forces[6]*h/L06*k;
  setArrow(tR,TXa,TYa,NZa,0,1,0,Math.abs(v1y));
  setArrow(tC,TXa,TYa+v1y,NZa,Math.sign(v2x)||1,0,0,Math.abs(v2x));
  setArrow(tP,TXa+v2x,TYa+v1y,NZa,v3x,v3y,0,Math.hypot(v3x,v3y));
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;

}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ---- 读数(唯一数值来源:statVals,面板与 3D 读数板共用,保证两处永远一致) ---- */

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(mode==='cart'&&playing){
    const tx=3.6*Math.sin(simT*0.45);
    cartX+=(tx-cartX)*Math.min(1,dts*2.5);
  }
  cartG.position.x=cartX;
  /* 吊块摆动 */
  const sway=(mode==='mid'&&playing&&loadK>0)?0.16*Math.sin(simT*1.6):0;
  const h=hR*8,by=hungY();
  hungG.position.set(sway,by,0);
  hungG.rotation.z=-sway*0.3;
  orientMesh(hc1,0,0.16+h,1.05,sway,by+0.22,0.1);
  orientMesh(hc2,0,0.16+h,-1.05,sway,by+0.22,-0.1);
  updateForces();
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */

placeMembers();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateForces();updateStats();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
