  new THREE.MeshBasicMaterial({map:spTex,transparent:true,opacity:0.96})));
spG.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(4.9,3.32)),
  new THREE.LineBasicMaterial({color:0x35c4a0,transparent:true,opacity:0.5})));

/* ── 状态与光谱模型 ── */
let comp='h2',Hkm=430,cloudH=600,RpRJ=1.0;
let playing=true,labelsOn=true,slowMo=false,specOn=true;
let phase=0.06,inT=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const G2=(l,c,w)=>{const d=(l-c)/w;return Math.exp(-d*d);};
function opacityOf(l){
  if(comp==='co2')
    return Math.min(1,0.18*Math.pow(0.5/l,4)+0.25*G2(l,0.589,0.014)+0.3*G2(l,1.4,0.17)
      +0.95*G2(l,4.3,0.30)+0.6*G2(l,2.7,0.2)+0.05*G2(l,3.3,0.35));
  return Math.min(1,0.5*Math.pow(0.5/l,4)+0.55*G2(l,0.589,0.014)+0.85*G2(l,1.4,0.16)
    +0.4*G2(l,0.95,0.07)+0.04*G2(l,3.3,0.35)+0.04*G2(l,4.3,0.35));
}
const kappaVis=l=>comp==='cloud'?0.95:opacityOf(l);
let model=null;
const N=220,LOGA=Math.log10(0.4),LOGB=Math.log10(5);
function computeModel(){
  const RpKm=71492*RpRJ,Rst=696000,base=(RpKm/Rst)**2;
  const lams=[],dRs=[],ppms=[];
  for(let i=0;i<N;i++){
    const l=Math.pow(10,LOGA+(i/(N-1))*(LOGB-LOGA));
    let dR=5*Hkm*Math.min(1,opacityOf(l));
    if(comp==='cloud')dR=Math.max(dR,cloudH);
    lams.push(l);dRs.push(dR);
    ppms.push(2*RpKm*dR/(Rst*Rst)*1e6);
  }
  const iRef=Math.round((Math.log10(2.2)-LOGA)/(LOGB-LOGA)*(N-1));
  const refPPM=ppms[iRef];
  let maxPPM=0;for(const p of ppms)if(p>maxPPM)maxPPM=p;
  const maxFeat=Math.max(0,maxPPM-refPPM);
  const wins={Na:[0.56,0.62],H2O:[1.15,1.7],CH4:[3.0,3.6],CO2:[4.0,4.6]};
  const det={};let nMol=0;
  for(const m in wins){
    let peak=0;
    for(let i=0;i<N;i++)if(lams[i]>=wins[m][0]&&lams[i]<=wins[m][1])peak=Math.max(peak,ppms[i]);
    det[m]=Math.max(0,peak-refPPM);
    if(det[m]>30)nMol++;
  }
  const floorPPM=comp==='cloud'?2*RpKm*cloudH/(Rst*Rst)*1e6:0;
  model={lams,ppms,refPPM,maxFeat,nMol,base,floorPPM};
  updateRayT();updateStats();drawSpec();
}
function updateRayT(){
  const lams=[0.45,0.55,0.65];
  for(let i=0;i<3;i++){
    const k=Math.min(1,kappaVis(lams[i]));
    inPost[i].material.opacity=0.10+0.85*(1-0.85*k);
  }
}
function planetDims(){
  const Rpl=0.20+0.10*RpRJ;
  return {Rpl,Ratm:Rpl*1.5};
}
function updateStats(){
  document.getElementById('stFeat').innerHTML=model.maxFeat.toFixed(0)+'<small> ppm</small>';
  const f=document.getElementById('stFeat');
  f.className='v '+(model.maxFeat>=30?'ok':'warn');
  document.getElementById('stH').innerHTML=Hkm.toFixed(0)+'<small> km</small>';
  const m=document.getElementById('stMol');
  m.innerHTML=model.nMol+'<small> / 4</small>';
  m.className='v '+(model.nMol>=2?'ok':'warn');
  const d=document.getElementById('stDepth');
  d.innerHTML=(model.base*100).toFixed(2)+'<small> %</small>';
}

/* ── 光谱面板绘制 ── */
function wlColor(l){
  if(l<0.44)return [115,77,242];
  if(l<0.49)return [64,115,242];
  if(l<0.52)return [38,191,217];
  if(l<0.57)return [51,217,115];
  if(l<0.60)return [140,229,64];
  if(l<0.64)return [242,191,38];
  if(l<0.70)return [250,115,31];
  if(l<0.80)return [217,56,26];
  const f=Math.max(0,1-(l-0.8)/4.2);
  return [Math.round(90+140*f),Math.round(30*f),Math.round(25*f)];
}
const colStr=(c,f)=>`rgb(${Math.round(c[0]*f)},${Math.round(c[1]*f)},${Math.round(c[2]*f)})`;
function drawSpec(){
  const c=spCtx,W=560,H=380,ml=46,mr=10,mb=30;
  const pw=W-ml-mr,X=l=>ml+(Math.log10(l)-LOGA)/(LOGB-LOGA)*pw;
  c.clearRect(0,0,W,H);
  c.fillStyle='rgba(8,13,22,0.94)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(53,196,160,0.45)';c.strokeRect(0.5,0.5,W-1,H-1);
  c.fillStyle='#c7d2de';c.font='11px sans-serif';c.textAlign='left';
  c.fillText(L('凌内 − 凌外 = 透射谱(附加深度 ppm)','In − out = transmission spectrum (extra depth, ppm)'),ml,16);
  /* 凌外 / 凌内 光谱条 */
  const strip=(y0,h,fac,label)=>{
    c.fillStyle='#9fb0c3';c.font='10px sans-serif';c.textAlign='left';
    c.fillText(label,ml,y0-3);
    for(let px=0;px<pw;px++){
      const l=Math.pow(10,LOGA+px/pw*(LOGB-LOGA));
      c.fillStyle=colStr(wlColor(l),fac(l));
      c.fillRect(ml+px,y0,1,h);
    }
  };
  strip(40,38,()=>1,L('凌外 · 纯恒星','Out of transit · pure star'));
  strip(96,38,l=>1-0.6*Math.min(1,kappaVis(l)),L('凌内 · 穿过大气(指纹加深)','In transit · through the atmosphere'));
  /* 透射谱曲线 */
  const top=152,bot=H-mb,chH=bot-top;
  const yMax=Math.max(200,Math.ceil(model.ppms.reduce((a,b)=>Math.max(a,b),0)/100)*100+100);
  const Y=p=>bot-clamp(p/yMax,0,1.04)*chH;
  c.strokeStyle='rgba(120,140,170,0.22)';c.lineWidth=1;
  for(let f=0;f<=1;f+=0.25){c.beginPath();c.moveTo(ml,top+chH*f);c.lineTo(ml+pw,top+chH*f);c.stroke();}
  /* 噪声带 */
  c.fillStyle='rgba(140,150,170,0.22)';
  c.fillRect(ml,Y(model.refPPM+16),pw,Y(model.refPPM-16)-Y(model.refPPM+16));
  /* 云霾底 */
  if(comp==='cloud'&&cloudH>0){
    c.strokeStyle='rgba(255,196,25,0.85)';c.setLineDash([5,4]);
    c.beginPath();c.moveTo(ml,Y(model.floorPPM));c.lineTo(ml+pw,Y(model.floorPPM));c.stroke();c.setLineDash([]);
    c.fillStyle='#ffe9a8';c.font='10px sans-serif';c.textAlign='left';
    c.fillText(L('云霾底:云下不可见','cloud deck: nothing below'),ml+6,Y(model.floorPPM)-4);
  }
  /* 曲线 */
  c.strokeStyle='#35c4a0';c.lineWidth=2;c.beginPath();
  for(let i=0;i<N;i++){
    const x=X(model.lams[i]),y=Y(model.ppms[i]);
    i?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.stroke();
  /* 分子标记 */
  c.font='10px sans-serif';
  for(const [nm,l,col] of [['Na',0.589,'#ffe9a8'],['H₂O',1.4,'#74c0fc'],['CH₄',3.3,'#69db7c'],['CO₂',4.3,'#c0a0ff']]){
    c.strokeStyle=col;c.setLineDash([3,3]);c.lineWidth=1;
    c.beginPath();c.moveTo(X(l),top);c.lineTo(X(l),bot);c.stroke();c.setLineDash([]);
    c.fillStyle=col;c.textAlign='center';
    c.fillText(nm+' '+l+' µm',X(l),top+10);
  }
  /* 坐标刻度 */
  c.fillStyle='#9fb0c3';c.textAlign='center';
  for(const [tv,sv] of [[0.5,'0.5'],[1,'1'],[2,'2'],[5,'5 µm']])c.fillText(sv,X(tv),H-12);
  c.textAlign='left';c.fillText('0',ml-14,bot+4);
  c.fillText(yMax.toFixed(0),ml-30,top+8);
  spTex.needsUpdate=true;
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblStar=addLabel(()=>L('恒星 R★','Star R★'),new THREE.Vector3(0,3.1,0),'y');
const lblPl=addLabel(()=>inT
    ?L('凌内:星光穿过大气边缘','In transit: light grazes the rim')
    :L('凌外:纯恒星光谱','Out of transit: pure stellar spectrum'),
  new THREE.Vector3(0,0.6,0),'o');
const lblShell=addLabel(()=>L('大气边缘 · 按波长变暗','Atmospheric rim · dimmed by wavelength'),new THREE.Vector3(0,1.2,0),'b',
  ()=>inT);
const lblSpec=addLabel(()=>L('透射光谱 · 凌内 − 凌外','Transmission spectrum · in − out'),new THREE.Vector3(0,1.95,0),'o',
  ()=>true,spG);

/* ── 控件 ── */
function setComp(m){comp=m;
  document.getElementById('bH2').classList.toggle('on',m==='h2');
  document.getElementById('bCO2').classList.toggle('on',m==='co2');
  document.getElementById('bCloud').classList.toggle('on',m==='cloud');
  const sc=document.getElementById('sCloud');
  sc.disabled=(m!=='cloud');
  if(m!=='cloud'){cloudH=0;sc.value=0;document.getElementById('sCloudVal').textContent='0 km';}
  else if(cloudH===0){setCloud(600);}
  shellMat.color.setHex(m==='h2'?0x86c8ff:(m==='co2'?0xe8d9a8:0xb9c4cc));
  computeModel();}
function setH(v){Hkm=clamp(v,80,800);
  document.getElementById('sH').value=Hkm;
  document.getElementById('sHVal').textContent=Hkm.toFixed(0)+' km';
  computeModel();}
function setCloud(v){cloudH=clamp(v,0,2000);
  document.getElementById('sCloud').value=cloudH;
  document.getElementById('sCloudVal').textContent=cloudH.toFixed(0)+' km';
  computeModel();}
function setRp(v){RpRJ=clamp(v,0.15,1.6);
  document.getElementById('sRp').value=RpRJ;
  document.getElementById('sRpVal').textContent=RpRJ.toFixed(2)+' R_J';
  const {Rpl,Ratm}=planetDims();
  planet.scale.setScalar(Rpl);shell.scale.setScalar(Ratm);
  computeModel();}
function setSpec(v){specOn=v;spG.visible=v;}

const STEPS=[
 {zh:'<b>凌星:星光擦过大气边缘</b>:行星过境时,一圈薄薄的大气把星光滤成“带指纹的光”',
  en:'<b>Transit: starlight grazes the rim</b>: as the planet crosses, a thin ring of atmosphere filters the starlight into a fingerprinted beam',
  act(){setComp('h2');setH(430);setRp(1.0);}},
 {zh:'<b>分子按波长吸收</b>:Na 589 nm、H₂O 1.4 µm 各吞一段——蓝图径变得最大,蓝光最先变暗',
  en:'<b>Molecules absorb by wavelength</b>: Na 589 nm, H₂O 1.4 µm each swallow a slice — the blue transit radius grows largest, blue dims first',
  act(){setComp('h2');setSpec(true);}},
 {zh:'<b>凌内减凌外 = 透射谱</b>:两次光谱相减,恒星平庸的连续谱抵消,只剩大气的指纹',
  en:'<b>In − out = transmission spectrum</b>: subtract the two spectra; the star\u2019s bland continuum cancels, the atmosphere\u2019s fingerprint remains',
  act(){setComp('h2');setSpec(true);}},
 {zh:'<b>H₂O/CH₄/CO₂ 各自的坑</b>:1.4 / 3.3 / 4.3 µm 处的吸收坑直接指认分子',
  en:'<b>Pits of H₂O / CH₄ / CO₂</b>: absorption pits at 1.4 / 3.3 / 4.3 µm name the molecules outright',
  act(){setComp('co2');setH(430);}},
 {zh:'<b>特征大小 ∝ H=kT/μg</b>:越热、越轻(H₂)的大气标高越大,坑也越深',
  en:'<b>Signal size ∝ H=kT/μg</b>: hotter, lighter (H₂) atmospheres have a larger scale height — deeper pits',
  act(){setComp('h2');setH(800);}},
 {zh:'<b>高层云把特征抹平</b>:云/霾在高处截断视线,谱线只剩一道平的灰色底',
  en:'<b>High clouds flatten the features</b>: haze cuts off the view high up, leaving a flat gray floor',
  act(){setComp('cloud');setCloud(2000);}},
 {zh:'<b>JWST 的终极目标</b>:在岩质行星大气里找 O₂ 与 CH₄ 同现——生物活动的印迹',
  en:'<b>JWST\u2019s endgame</b>: hunt O₂ together with CH₄ in rocky-planet air — the imprint of biology',
  act(){setComp('h2');setRp(0.15);setH(430);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bH2').addEventListener('click',()=>setComp('h2'));
document.getElementById('bCO2').addEventListener('click',()=>setComp('co2'));
document.getElementById('bCloud').addEventListener('click',()=>setComp('cloud'));
document.getElementById('sH').addEventListener('input',e=>setH(+e.target.value));
document.getElementById('sCloud').addEventListener('input',e=>setCloud(+e.target.value));
document.getElementById('sRp').addEventListener('input',e=>setRp(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpec').addEventListener('change',e=>{setSpec(e.target.checked);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();drawSpec();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  if(playing)phase=(phase+dts/CYCLE)%1;
  const xp=(phase*2-1)*SPAN;
  plG.position.set(xp,0,ZP);
  inT=Math.abs(xp)<RSTAR*0.92;
  /* 大气边缘光线 */
  const {Ratm}=planetDims();
  const bIn=0.85*Ratm,bOut=1.35*Ratm;
  raysG.visible=inT;
  if(inT){
    const zEnt=ZP-Math.sqrt(Math.max(Ratm*Ratm-bIn*bIn,0.001));
    const zIn0=Math.sqrt(Math.max(RSTAR*RSTAR-bIn*bIn,0.15));
    const zOut0=Math.sqrt(Math.max(RSTAR*RSTAR-bOut*bOut,0.15));
    for(let i=0;i<3;i++){
      setSeg(inPre[i],xp,bIn,zIn0,zEnt);
      setSeg(inPost[i],xp,bIn,zEnt,6.2);
      setSeg(outLine[i],xp,bOut,zOut0,6.2);
    }
  }
  lblPl.position.set(xp,0.6,ZP);
  lblShell.position.set(xp,1.25,ZP);
  spG.lookAt(camera.position);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  lblPl.element.className='lbl '+(inT?'o':'b');
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setRp(1.0);setH(430);setComp('h2');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
