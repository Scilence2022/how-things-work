<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花 · 升空与爆开的化学</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);

    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  .tbtn.on { border-color: var(--acc); color: var(--acc); }

    max-width: calc(100vw - 320px); }

    text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  :root[data-theme="light"] #title .sub { color: #b6c3d6; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);

  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums;
    transition: color .3s; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;

  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;

  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;

  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }

  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);

  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);

  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

  <div class="sub" data-zh="一枚烟花是三段设计的串联:发射药黑火药(KNO₃ 75% + 木炭 15% + 硫 10%)在筒内爆燃,把弹体推上 100–300 m→延时引信一段慢燃药线,精确到顶点点燃爆药→爆药把数十至数百颗星体向四面八方同速抛出——动量均匀分布,壳就是球形;星体=金属盐+燃料+氧化剂+粘合剂的小丸,焰色来自电子跃迁:锶红 ~650 nm、钡绿 ~524 nm、铜蓝 ~430–460 nm、钠黄 589 nm、钙橙 ~620 nm;形状由星体在弹内的排布几何决定,铁粉/钛粉拖出火星穗,长余辉大颗粒缓降成柳树;冲击波以 343 m/s 传播,3 s/km——先看到光,3 秒后才听到 1 km 外的响 · 3D 交互演示 · 拖动旋转 / 点击夜空在该处燃放 / 空格运行/暂停" data-en="A firework is three stages in series: black-powder lift charge (KNO₃ 75% + charcoal 15% + sulfur 10%) deflagrates in the tube, throwing the shell 100–300 m up → a time-delay fuse burns slowly and lights the burst charge exactly at apex → the burst hurls dozens to hundreds of stars outward at equal speed — uniform momentum makes the shell spherical; each star is a pellet of metal salt + fuel + oxidizer + binder, and the flame color is electron jumps: Sr red ~650 nm, Ba green ~524 nm, Cu blue ~430–460 nm, Na yellow 589 nm, Ca orange ~620 nm; shape comes from the geometry of star packing, iron/titanium powder drags comet tails, long-persistence large grains sink slowly into a willow; the shockwave runs at 343 m/s, 3 s per km — you see the flash 3 seconds before the sound from 1 km away · 3D interactive demo · drag to orbit · click the sky to launch there · Space = run/pause">烟花 · 升空与爆开的化学</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 26, 85);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  /* 浅色主题下场景仍用暮光天色:加色辉光在亮天上不可见 */
  scene.background = new THREE.Color(dark ? 0x05070d : 0x2b3850);
  scene.fog.color.set(dark ? 0x05070d : 0x2b3850);
  skyM.opacity = dark ? 0.9 : 0.55;
  cityM.color.set(dark ? 0x0a0e15 : 0x161e2c);
  groundM.color.set(dark ? 0x11161d : 0x1d2736);
  glowCityM.opacity = dark ? 0.14 : 0.1;
  moonM.opacity = dark ? 0.95 : 0.8;
}

function wl2rgb(wl) {
  let r = 0, g = 0, b = 0;
  if (wl >= 380 && wl < 440) { r = -(wl - 440) / 60; b = 1; }
  else if (wl < 490) { g = (wl - 440) / 50; b = 1; }
  else if (wl < 510) { g = 1; b = -(wl - 510) / 20; }
  else if (wl < 580) { r = (wl - 510) / 70; g = 1; }
  else if (wl < 645) { r = 1; g = -(wl - 645) / 65; }
  else if (wl <= 780) r = 1;
  return [r, g, b];
}

function pointsMaterial() {

    uniforms: { uPx: { value: Math.min(devicePixelRatio, 2) } },
    vertexShader: `
      uniform float uPx;
      attribute vec3 aColor;
      attribute float aSize;
      varying vec3 vC;
      void main() {
        vC = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPx * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `

        vec2 q = gl_PointCoord - 0.5;
        float d = length(q) * 2.0;
        float a = smoothstep(1.0, 0.0, d);
        a = a * a;
        gl_FragColor = vec4(vC, a);
      }`,
    blending: THREE.AdditiveBlending,
    depthWrite: false,

}

function gauss() {
  const u = 1 - Math.random(), v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);

const _n = new THREE.Vector3(0.18, 0.35, 1).normalize(), _u = new THREE.Vector3(), _w = new THREE.Vector3();

/* ================= 音效(WebAudio 合成,无素材) ================= */
const AudioFX = {
  on: qsBool('snd', false),
  ctx: null, master: null, _nb: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  noiseBuf() {
    if (this._nb) return this._nb;
    const len = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._nb = buf;
    return buf;
  },
  whistle(dur) {
    if (!this.on || !this.ensure()) return;
    const t0 = this.ctx.currentTime + 0.03;
    dur = Math.max(0.4, dur);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(640, t0);
    o.frequency.exponentialRampToValueAtTime(1500, t0 + dur * 0.85);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.18);
    g.gain.setValueAtTime(0.05, t0 + Math.max(0.2, dur - 0.12));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  bang(delay, distM) {
    if (!this.on || !this.ensure()) return;
    const t0 = this.ctx.currentTime + Math.max(0, delay);
    const vol = clamp(1.6 / (1 + distM / 250), 0.25, 1);
    /* 低频闷响 */
    const o = this.ctx.createOscillator(), og = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(70, t0);
    o.frequency.exponentialRampToValueAtTime(38, t0 + 0.35);
    og.gain.setValueAtTime(0.9 * vol, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    o.connect(og); og.connect(this.master);
    o.start(t0); o.stop(t0 + 0.7);
    /* 爆裂噪声 */
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t0);
    lp.frequency.exponentialRampToValueAtTime(120, t0 + 0.5);
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(0.75 * vol, t0);
    ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
    src.connect(lp); lp.connect(ng); ng.connect(this.master);
    src.start(t0); src.stop(t0 + 0.8);
    /* 噼啪碎响 */
    for (let i = 0; i < 26; i++) {
      const tt = t0 + 0.15 + Math.random() * 1.4;
      const s = this.ctx.createBufferSource();
      s.buffer = this.noiseBuf();
      s.playbackRate.value = 1.5 + Math.random();
      const hp = this.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 2500;
      const gg = this.ctx.createGain();
      const pv = (0.02 + Math.random() * 0.05) * vol;
      gg.gain.setValueAtTime(pv, tt);
      gg.gain.exponentialRampToValueAtTime(0.0008, tt + 0.03 + Math.random() * 0.04);
      s.connect(hp); hp.connect(gg); gg.connect(this.master);
      s.start(tt, Math.random() * 0.4, 0.09);
    }
  }
};

const shells = [];        /* 飞行中的弹体 */
let lastBurst = null;     /* 最近一次爆开 {x,y,z,el,age,apogeeM,delay,sndT,arrived} */
const pendQ = [];         /* 连发待发队列 */
function launch(tx = 0, tz = 0, th = targetH, el = elIdx) {
  const slot = shellPool.find(s => !s.busy);
  if (!slot) return;
  slot.busy = true;
  const hU = Math.max(2, th * M2U);
  const v0 = Math.sqrt(2 * G * (hU - 0.4)) + 0.35;
  const sh = { x: tx, z: tz, y: GY + 0.85, vy: v0 * 0.2, v0, st: 'boost', t: 0, jet: 0, el, apexM: th, slot };
  shells.push(sh);
  slot.grp.position.set(tx, sh.y, tz);
  slot.grp.visible = true;
  slot.fl.position.set(tx, sh.y - 0.45, tz);
  slot.fl.visible = true;
  AudioFX.whistle(0.38 + v0 / G);
}
function doBurst(si) {
  const sh = shells.splice(si, 1)[0];
  sh.slot.busy = false;
  sh.slot.grp.visible = false;
  sh.slot.fl.visible = false;
  const slice = spawnStars(sh.x, sh.y, sh.z, sh.el);
  const apogeeM = Math.max(0, (sh.y - GY) * 20);
  const distM = camera.position.distanceTo(_V3.set(sh.x, sh.y, sh.z)) * 20;
  const delay = distM / 343;
  lastBurst = { x: sh.x, y: sh.y, z: sh.z, el: sh.el, age: 0, apogeeM, delay, sndT: delay, arrived: false, slice };
  flash.position.set(sh.x, sh.y, sh.z);
  flash.scale.setScalar(0.6);
  flash.visible = true;
  flashM.opacity = 0.95;
  const c = elementRGB(sh.el);
  flashM.color.copy(_C2.setRGB(c[0], c[1], c[2]));
  burstLight.color.copy(_C2);
  burstLight.position.set(sh.x, sh.y, sh.z);
  burstLight.intensity = 14;
  shock.position.set(sh.x, sh.y, sh.z);
  shock.scale.setScalar(0.2);
  shock.visible = true;
  shockM.opacity = 0.5;
  lblBurst.position.set(sh.x, sh.y + 1.6, sh.z);
  lblShock.position.set(sh.x, sh.y + 2.6, sh.z);
  AudioFX.bang(delay, distM);
}
function finale() {
  const offs = [[-1.7, 0.3], [0.2, -0.3], [1.8, 0.5]];
  for (let k = 0; k < 3; k++) {
    pendQ.push({ wait: k * 0.55, x: offs[k][0], z: offs[k][1], h: targetH * (0.85 + Math.random() * 0.2), el: (elIdx + k) % ELEMENTS.length });

}

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 14, padR = 12, padB = 24, padT = 14;
  const wl0 = 380, wl1 = 780;
  const xOf = wl => padL + (wl - wl0) / (wl1 - wl0) * (W - padL - padR);
  /* 可见光带 */
  const bandY = H - padB;
  for (let px = padL; px <= W - padR; px += 2) {
    const wl = wl0 + (px - padL) / (W - padL - padR) * (wl1 - wl0);
    const c = wl2rgb(wl);
    ctx.fillStyle = `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
    ctx.fillRect(px, bandY, 2, 7);
  }
  ctx.font = '13px system-ui';
  ctx.fillStyle = cTxt;
  for (const wl of [400, 500, 600, 700]) ctx.fillText(wl, xOf(wl) - 10, bandY + 20);
  ctx.fillText('nm', W - padR - 22, bandY + 20);
  /* 发射线(高度 = 相对强度) */
  const els = ELEMENTS[elIdx];
  ctx.lineWidth = 2.4;
  for (let e = 0; e < ELEMENTS.length; e++) {
    const cc = wl2rgb(ELEMENTS[e].lines[0].wl);
    ctx.strokeStyle = `rgba(${cc[0] * 255 | 0},${cc[1] * 255 | 0},${cc[2] * 255 | 0},1)`;
    ctx.globalAlpha = elIdx === e ? 1 : 0.28;
    let lastLab = -99;
    for (const ln of ELEMENTS[e].lines) {
      const x = xOf(ln.wl);
      const hgt = (elIdx === e ? 0.45 + 0.55 * ln.i : 0.3) * (H - padB - padT - 18);
      ctx.beginPath();
      ctx.moveTo(x, bandY);
      ctx.lineTo(x, bandY - hgt);
      ctx.stroke();
      if (elIdx === e && ln.wl - lastLab > 15) {
        lastLab = ln.wl;
        ctx.fillStyle = cTxt;
        ctx.fillText(String(ln.wl), x - 14, bandY - hgt - 6);
      }
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = cTxt;
  ctx.fillText(L(`当前:${els.zhN} ${els.wl} nm`, `current: ${L(els.zhN, els.enN)} ${els.wl} nm`), padL + 6, 13);
}

  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ---------------- 点击夜空燃放 ---------------- */
const _ray = new THREE.Raycaster(), _plane = new THREE.Plane(), _ndc = new THREE.Vector2();
let pdown = null;
if (renderer) {
  renderer.domElement.addEventListener('pointerdown', e => { pdown = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!pdown) return;
    const moved = Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y);
    const held = performance.now() - pdown.t;
    pdown = null;
    if (moved > 6 || held > 450) return;   /* 拖动视角不算点击 */
    _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    _ray.setFromCamera(_ndc, camera);
    camera.getWorldDirection(_V2);
    _plane.setFromNormalAndCoplanarPoint(_V2.negate(), controls ? controls.target : _V3.set(0, 1.8, 0));
    const p = _ray.ray.intersectPlane(_plane, _V3);
    if (!p) return;
    const hr = Math.hypot(p.x, p.z);
    if (hr > 6) { p.x *= 6 / hr; p.z *= 6 / hr; }
    p.y = clamp(p.y, GY + 2, GY + 15);
    launch(p.x, p.z, (p.y - GY) * 20, elIdx);
    notifyT = 2.2;
    notifyZ = `在点击处燃放:顶点约 ${Math.round((p.y - GY) * 20)} m`;
    notifyE = `launched at click: apex ~${Math.round((p.y - GY) * 20)} m`;
  });
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, idleT = 0, shakeT = 0;
if (controls) controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0) * (slowOn ? 0.15 : 1);
  if (notifyT > 0) notifyT -= dt0;
  /* 连发待发队列(真实时延,暂停时不走) */
  if (playing && pendQ.length) {
    for (let i = pendQ.length - 1; i >= 0; i--) {
      pendQ[i].wait -= dt0;
      if (pendQ[i].wait <= 0) {
        const q = pendQ.splice(i, 1)[0];
        launch(q.x, q.z, q.h, q.el);
      }
    }
  }
  /* 声波到达(真实时间):数值变绿 + 画面轻震 */
  if (lastBurst && !lastBurst.arrived) {
    lastBurst.sndT -= dt0;
    if (lastBurst.sndT <= 0) { lastBurst.arrived = true; shakeT = 0.35; updateStats(); }
  }
  if (dt > 0) {
    /* 弹体状态机:boost → coast → burst */
    for (let si = shells.length - 1; si >= 0; si--) {
      const sh = shells[si];
      sh.t += dt;
      if (sh.st === 'boost') {
        sh.vy = sh.v0 * clamp(sh.t / 0.38, 0.2, 1);
        sh.y += sh.vy * dt;
        sh.slot.grp.position.set(sh.x, sh.y, sh.z);
        sh.slot.fl.position.set(sh.x, sh.y - 0.45, sh.z);
        sh.slot.fl.scale.setScalar(0.7 + Math.random() * 0.5);
        sh.jet += dt;
        while (sh.jet > 0.016) {
          sh.jet -= 0.016;
          spawnEmber(sh.x + (Math.random() - 0.5) * 0.14, sh.y - 0.4, sh.z + (Math.random() - 0.5) * 0.14,
            (Math.random() - 0.5) * 0.5, -2.2 - Math.random() * 1.4, (Math.random() - 0.5) * 0.5, 0.4 + Math.random() * 0.25, JET_RGB);
        }
        if (sh.t > 0.38) { sh.st = 'coast'; sh.slot.fl.visible = false; }
      } else {
        sh.vy -= G * dt;
        sh.y += sh.vy * dt;
        sh.slot.grp.position.set(sh.x, sh.y, sh.z);
        sh.jet += dt;
        while (sh.jet > 0.05) {
          sh.jet -= 0.05;
          spawnEmber(sh.x + 0.17, sh.y + 0.1, sh.z, (Math.random() - 0.5) * 0.2, -0.3, (Math.random() - 0.5) * 0.2, 0.5, FUSE_RGB);
        }
        if (sh.vy <= 0.12 || sh.y >= GY + sh.apexM * M2U + 0.2) doBurst(si);
      }
    }
    if (shells.length) {
      const sh = shells[shells.length - 1];
      lblShell.position.set(sh.x + 1.5, sh.y + 0.4, sh.z);
    }
    /* 爆开闪光 / 冲击波 / 光衰减 */
    if (lastBurst && lastBurst.age < 7) {
      lastBurst.age += dt;
      flashM.opacity = Math.max(0, 0.95 - lastBurst.age * 2.4);
      flash.scale.setScalar(0.6 + lastBurst.age * 3.2);
      burstLight.intensity = Math.max(0, 14 * (1 - lastBurst.age * 1.6));
      shock.scale.setScalar(0.2 + lastBurst.age * 4.5);
      shockM.opacity = Math.max(0, 0.5 - lastBurst.age * 0.55);
      flash.visible = flashM.opacity > 0;
      shock.visible = shockM.opacity > 0;
    }
    /* 星体运动:同速抛出 + 重力 + 空气阻力 + 闪烁 */
    const now = performance.now() / 1000;
    starsAlive = 0;
    for (let i = 0; i < N_STAR_ALL; i++) {
      const i3 = i * 3, i6 = i * 6;
      if (sLife[i] <= 0) {
        if (sSizeA[i] !== 0) { sSizeA[i] = 0; sPosA[i3 + 1] = -999; tPosA[i6 + 1] = -999; tPosA[i6 + 4] = -999; }
        continue;
      }
      sLife[i] -= dt;
      if (sLife[i] <= 0) { sSizeA[i] = 0; sPosA[i3 + 1] = -999; tPosA[i6 + 1] = -999; tPosA[i6 + 4] = -999; continue; }
      sVel[i3 + 1] -= G * dt;
      const drag = 1 - 0.32 * dt;
      sVel[i3] *= drag; sVel[i3 + 1] *= drag; sVel[i3 + 2] *= drag;
      sPos[i3] += sVel[i3] * dt; sPos[i3 + 1] += sVel[i3 + 1] * dt; sPos[i3 + 2] += sVel[i3 + 2] * dt;
      if (sPos[i3 + 1] < GY + 0.05) { sPos[i3 + 1] = GY + 0.05; sVel[i3] = sVel[i3 + 1] = sVel[i3 + 2] = 0; }
      /* 拖尾余烬 */
      if (Math.random() < dt * 22) {
        const el = metalOn ? 1.7 : 0.55;
        const rgb = metalOn ? METAL_RGB : _V.set(sBase[i3] * 0.85, sBase[i3 + 1] * 0.85, sBase[i3 + 2] * 0.85);
        spawnEmber(sPos[i3], sPos[i3 + 1], sPos[i3 + 2],
          sVel[i3] * 0.12 + (Math.random() - 0.5) * 0.25, sVel[i3 + 1] * 0.12, sVel[i3 + 2] * 0.12 + (Math.random() - 0.5) * 0.25,
          el * (0.7 + Math.random() * 0.6), [rgb.x, rgb.y, rgb.z]);
      }
      const fade = clamp(sLife[i] / 1.2, 0, 1);
      const tw = metalOn
        ? 0.45 + 0.55 * Math.max(0, Math.sin(now * sTwF[i] + sTw[i]))
        : 0.85 + 0.15 * Math.sin(now * sTwF[i] + sTw[i]);
      const b = fade * tw;
      sPosA[i3] = sPos[i3]; sPosA[i3 + 1] = sPos[i3 + 1]; sPosA[i3 + 2] = sPos[i3 + 2];
      sColA[i3] = sBase[i3] * b; sColA[i3 + 1] = sBase[i3 + 1] * b; sColA[i3 + 2] = sBase[i3 + 2] * b;
      sSizeA[i] = (metalOn ? 1.15 : 1.0) * (0.5 + 0.6 * fade);
      /* 拖尾线段:头亮尾暗 */
      tPosA[i6] = sPos[i3]; tPosA[i6 + 1] = sPos[i3 + 1]; tPosA[i6 + 2] = sPos[i3 + 2];
      tPosA[i6 + 3] = sPos[i3] - sVel[i3] * 0.075; tPosA[i6 + 4] = sPos[i3 + 1] - sVel[i3 + 1] * 0.075; tPosA[i6 + 5] = sPos[i3 + 2] - sVel[i3 + 2] * 0.075;
      tColA[i6] = sBase[i3] * b * 0.7; tColA[i6 + 1] = sBase[i3 + 1] * b * 0.7; tColA[i6 + 2] = sBase[i3 + 2] * b * 0.7;
      tColA[i6 + 3] = 0; tColA[i6 + 4] = 0; tColA[i6 + 5] = 0;
      starsAlive++;
    }
    starGeo.attributes.position.needsUpdate = true;
    starGeo.attributes.aColor.needsUpdate = true;
    starGeo.attributes.aSize.needsUpdate = true;
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.attributes.color.needsUpdate = true;
    /* 余烬 */
    for (let i = 0; i < N_EMB; i++) {
      const i3 = i * 3;
      if (eLife[i] <= 0) {
        if (eSizeA[i] !== 0) { eSizeA[i] = 0; ePosA[i3 + 1] = -999; }
        continue;
      }
      eLife[i] -= dt;
      if (eLife[i] <= 0) { eSizeA[i] = 0; ePosA[i3 + 1] = -999; continue; }
      eVel[i3 + 1] -= G * 0.7 * dt;
      const d2 = 1 - 0.8 * dt;
      eVel[i3] *= d2; eVel[i3 + 1] *= d2; eVel[i3 + 2] *= d2;
      ePos[i3] += eVel[i3] * dt; ePos[i3 + 1] += eVel[i3 + 1] * dt; ePos[i3 + 2] += eVel[i3 + 2] * dt;
      if (ePos[i3 + 1] < GY + 0.03) { ePos[i3 + 1] = GY + 0.03; eVel[i3] = eVel[i3 + 1] = eVel[i3 + 2] = 0; }
      const fade = clamp(eLife[i] / eLife0[i], 0, 1);
      ePosA[i3] = ePos[i3]; ePosA[i3 + 1] = ePos[i3 + 1]; ePosA[i3 + 2] = ePos[i3 + 2];
      eColA[i3] = eBase[i3] * fade; eColA[i3 + 1] = eBase[i3 + 1] * fade; eColA[i3 + 2] = eBase[i3 + 2] * fade;
      eSizeA[i] = eSz[i] * (0.35 + 0.65 * fade);
    }
    embGeo.attributes.position.needsUpdate = true;
    embGeo.attributes.aColor.needsUpdate = true;
    embGeo.attributes.aSize.needsUpdate = true;
    /* 空闲自动续发 */
    if (!shells.length && starsAlive === 0 && (!lastBurst || lastBurst.age > 6.5)) {
      idleT += dt;
      if (idleT > 1.4) { idleT = 0; launch(); }
    } else idleT = 0;
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    if (controls) controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.066) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  if (controls) controls.update();
  if (!glFail) {
    if (shakeT > 0) {
      shakeT -= dt0;
      const a = 0.06 * clamp(shakeT / 0.35, 0, 1);
      _V3.set((Math.random() - 0.5) * a, (Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
      camera.position.add(_V3);
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      camera.position.sub(_V3);
    } else {
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
  }
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
recolor();
syncSnd();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
launch();
notifyT = 6;
notifyZ = '点击夜空任意位置 = 在该处燃放;右上角 🔊 开音效,亲耳听 3 s/km 的声延迟';
notifyE = 'click anywhere in the sky to launch there; toggle 🔊 (top right) to hear the 3 s/km sound delay';
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
