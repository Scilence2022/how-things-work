<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>光圈与景深 · 弥散圆决定清晰</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#f59f00;
    --bg:#12100b;--panel:rgba(18,16,11,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(18,16,11,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(18,16,11,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e67700;
    --bg:#f1eee8;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(245,159,0,.6);background:rgba(245,159,0,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(230,119,0,.55);background:rgba(230,119,0,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(245,159,0,.10);border-color:rgba(245,159,0,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(230,119,0,.08);border-color:rgba(230,119,0,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe9c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="光圈与景深" data-en="Aperture &amp; Depth of Field">光圈与景深</h1>
  <div class="sub" data-zh="光圈缩小→每点发出的光锥变细→焦外弥散圆变小→可接受清晰范围(景深)拉长;f 值 N=f/D,每小一档进光 ×2(f/2.8→f/4 减半)→景深 ~∝ N·s²/f²;超焦距 H=f²/Nc 对焦把远处背景也拉进景深;大光圈+长焦把背景化成奶油虚化,虚化圆直径 ∝ 光圈口径 · 拖动旋转 / 空格运行/暂停" data-en="Stop the aperture down → each point's light cone narrows → the out-of-focus blur disc shrinks → the acceptably sharp range (depth of field) stretches; f-number N=f/D, one stop halves the light (f/2.8→f/4) → DOF ≈ ∝ N·s²/f²; focus at the hyperfocal distance H=f²/Nc and the far background joins the sharp zone; wide aperture + long focal length melt the background to creamy bokeh, with blur-disc diameter ∝ aperture bore · drag to orbit / Space = run/pause">光圈缩小→每点发出的光锥变细→焦外弥散圆变小→可接受清晰范围(景深)拉长;f 值 N=f/D,每小一档进光 ×2(f/2.8→f/4 减半)→景深 ~∝ N·s²/f²;超焦距 H=f²/Nc 对焦把远处背景也拉进景深;大光圈+长焦把背景化成奶油虚化,虚化圆直径 ∝ 光圈口径 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="景深范围" data-en="DOF range">景深范围</span><span class="v" id="stDof" style="font-size:14px">—</span>
  <span class="k" data-zh="背景弥散圆" data-en="Blur disc">背景弥散圆</span><span class="v" id="stCoc">—</span>
  <span class="k" data-zh="相对进光" data-en="Relative light">相对进光</span><span class="v" id="stLight">—</span>
  <span class="k" data-zh="虚化占画幅" data-en="Bokeh of frame">虚化占画幅</span><span class="v" id="stBokeh">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="b50" data-zh="50 mm 标头" data-en="50 mm standard">50 mm 标头</button>
    <button class="abtn" id="b85" data-zh="85 mm 人像" data-en="85 mm portrait">85 mm 人像</button>
  </div>
  <div class="row">
    <label data-zh="光圈 f 值" data-en="Aperture f-stop">光圈 f 值</label>
    <input id="sAp" type="range" min="0" max="7" step="1" value="2">
    <span class="val" id="sApVal">f/2.8</span>
  </div>
  <div class="row">
    <label data-zh="对焦距离" data-en="Focus distance">对焦距离</label>
    <input id="sFoc" type="range" min="0" max="100" step="1" value="40">
    <span class="val" id="sFocVal">2.0 m</span>
  </div>
  <div class="row">
    <label data-zh="背景距离" data-en="Background dist">背景距离</label>
    <input id="sBack" type="range" min="0" max="100" step="1" value="55">
    <span class="val" id="sBackVal">10 m</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglRays" type="checkbox" checked> <span data-zh="光线锥" data-en="Light cones">光线锥</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lens-imaging/" data-zh="透镜成像" data-en="Lens Imaging">透镜成像</a>
    <a href="../camera-sensor/" data-zh="相机传感器" data-en="Camera Sensor">相机传感器</a>
    <a href="../autofocus/" data-zh="自动对焦" data-en="Autofocus">自动对焦</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x12100b,16,42);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(2.6,2.8,13.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.5,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xf0e2c8,0x141008,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:相机+主体+背景三段纵深,光线锥穿光圈到传感器 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1a1710,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 相机机身+镜筒(镜筒随对焦伸出,光圈=虹膜) */
const bodyM=new THREE.MeshStandardMaterial({color:0x2e323c,roughness:0.55});
const body=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.9,1.05),bodyM);
body.position.set(-4.05,0.65,0);scene.add(body);
const prism=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.5),bodyM);
prism.position.set(-4.0,1.22,0);scene.add(prism);
const barrelM=new THREE.MeshStandardMaterial({color:0x1d2026,roughness:0.5,metalness:0.3});
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,1,20),barrelM);
barrel.rotation.z=Math.PI/2;scene.add(barrel);
const barrel2=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,1,20),barrelM);
barrel2.rotation.z=Math.PI/2;scene.add(barrel2);
const frontRing=new THREE.Mesh(new THREE.TorusGeometry(0.345,0.035,10,28),
  new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3,metalness:0.8}));
frontRing.rotation.y=Math.PI/2;scene.add(frontRing);
/* 传感器(绿色发光面) */
const sensorM=new THREE.MeshStandardMaterial({color:0x2b8a3e,roughness:0.4,
  emissive:0x37b24d,emissiveIntensity:0.5});
const sensor=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.72,0.95),sensorM);
sensor.position.set(-2.25,0.65,0);scene.add(sensor);
const sensorFrame=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.82,1.05),
  new THREE.MeshStandardMaterial({color:0x14171c,roughness:0.6}));
sensorFrame.position.set(-2.27,0.65,0);scene.add(sensorFrame);
/* 光圈:环形遮光 + 6 叶片 */
const irisM=new THREE.MeshBasicMaterial({color:0x080a0d,side:THREE.DoubleSide});
const iris=new THREE.Mesh(new THREE.RingGeometry(0.5,0.55,36),irisM);
iris.rotation.y=Math.PI/2;scene.add(iris);
const iris2=new THREE.Mesh(new THREE.RingGeometry(0.5,0.55,36),irisM);
iris2.rotation.y=Math.PI/2;iris2.position.x=0.02;scene.add(iris2);
const blades=[];
const bladeM=new THREE.MeshStandardMaterial({color:0x30343c,roughness:0.5,metalness:0.4});
for(let i=0;i<6;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.14,0.34),bladeM);
  scene.add(b);blades.push(b);
}
/* 主体:一个棋子形摆件 */
const subject=new THREE.Group();
const pawnM=new THREE.MeshStandardMaterial({color:0xd8b44a,roughness:0.4,metalness:0.2});
const pBase=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.16,20),pawnM);
pBase.position.y=0.08;subject.add(pBase);
const pBody=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.85,20),pawnM);
pBody.position.y=0.58;subject.add(pBody);
const pHead=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),pawnM);
pHead.position.y=1.12;subject.add(pHead);
scene.add(subject);
/* 背景:一棵树 + 远处一栋楼 */
const bgTree=new THREE.Group();
const trunkM=new THREE.MeshStandardMaterial({color:0x6a4a30,roughness:0.8});
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,0.9,10),trunkM);
trunk.position.y=0.45;bgTree.add(trunk);
const leafM=new THREE.MeshStandardMaterial({color:0x2f7a4a,roughness:0.7});
const crown=new THREE.Mesh(new THREE.ConeGeometry(0.62,1.5,12),leafM);
crown.position.y=1.55;bgTree.add(crown);
scene.add(bgTree);
const bldg=new THREE.Mesh(new THREE.BoxGeometry(1.3,2.6,1.2),
  new THREE.MeshStandardMaterial({color:0x4a5568,roughness:0.7}));
bldg.position.set(10.6,1.3,-0.6);scene.add(bldg);
/* 焦平面绿带 + 景深绿板 */
const focusBand=new THREE.Mesh(new THREE.BoxGeometry(0.04,1.9,1.5),
  new THREE.MeshStandardMaterial({color:0x37b24d,transparent:true,opacity:0.3,
    emissive:0x37b24d,emissiveIntensity:0.5}));
scene.add(focusBand);
const dofSlabM=new THREE.MeshStandardMaterial({color:0x37b24d,transparent:true,opacity:0.10,
  emissive:0x2b8a3e,emissiveIntensity:0.4});
const dofSlab=new THREE.Mesh(new THREE.BoxGeometry(1,0.03,1.35),dofSlabM);
scene.add(dofSlab);
/* 光线:主体(绿)与背景(蓝/红)的光锥,三段式 */
const segMGreen=new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0.5});
const segMBlue=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.5});
const segMRed=new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.5});
const segGeo=new THREE.CylinderGeometry(1,1,1,6);
function rayPool(n){
  const arr=[];
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(segGeo,segMGreen);m.visible=false;scene.add(m);arr.push(m);
  }
  return arr;
}
const raysS=rayPool(6),raysB=rayPool(6);
function setSeg(m,a,b,mat,rad){
  const dir=new THREE.Vector3().subVectors(b,a);const len=Math.max(dir.length(),0.001);
  m.material=mat;m.scale.set(rad,len,rad);
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  m.visible=true;
}
/* 传感器上的弥散圆(背景) + 主体处虚化光晕 */
const discB=new THREE.Mesh(new THREE.CircleGeometry(1,28),
  new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.55,side:THREE.DoubleSide}));
scene.add(discB);
const haloB=new THREE.Mesh(new THREE.CircleGeometry(1,28),
  new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,
    depthWrite:false,side:THREE.DoubleSide}));
haloB.position.z=-0.75;scene.add(haloB);

/* 状态与物理:c=0.03 mm(全画幅弥散圆容限),光圈 8 档 */
const STOPS=[1.4,2,2.8,4,5.6,8,11,16];
const COC=0.03;
let fLen=50,stopIdx=2,sM=2.0,dM=10;
let playing=true,labelsOn=true,slowMo=false,raysOn=true;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 光学:像距 v=f·u/(u−f);近/远景深限;背景弥散圆 b=f²|d−s|/(N·d·(s−f)) */
const N=()=>STOPS[stopIdx];
const vOf=dmm=>fLen*dmm/(dmm-fLen);                      /* mm */
const nearFar=()=>{
  const s=sM*1000,f=fLen,Nn=N();
  const den=f*f-Nn*COC*(s-f);
  const near=s*f*f/(f*f+Nn*COC*(s-f))/1000;
  const far=den<=0?Infinity:s*f*f/den/1000;
  return {near,far};
};
const blurBg=()=>{
  const s=sM*1000,d=dM*1000;
  return fLen*fLen*Math.abs(d-s)/(N()*d*(s-fLen));       /* mm */
};
/* 视觉映射:光轴沿 X。传感器固定,镜筒按对焦距离伸缩 */
const xSens=-2.25,K=0.02;
const xOf=m=>1.2+3.1*Math.log10(m/0.5);                  /* 距离→场景 X */
const xBgOf=m=>5.6+2.6*Math.log10(m/2);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblAp=addLabel(()=>L(`光圈 f/${N()} · 通光口径 ${fLen/N()}`,'aperture f/'+N()+' · bore '+fLen/N()+' mm'),
  new THREE.Vector3(-3.0,2.15,0),'o');
const lblSensor=addLabel(()=>L('传感器 · 焦外=弥散圆','sensor · defocus = blur disc'),
  new THREE.Vector3(-2.25,-0.35,0.8),'g');
const lblSubject=addLabel(()=>L(`主体 · 对焦 ${sM.toFixed(1)} m`,'subject · focus '+sM.toFixed(1)+' m'),
  new THREE.Vector3(0,2.3,0),'g');
const lblTree=addLabel(()=>L(`背景树 ${dM.toFixed(0)} m`,'background tree '+dM.toFixed(0)+' m'),
  new THREE.Vector3(0,2.6,0),'b');
const lblDof=addLabel(()=>{
  const {near,far}=nearFar();
  return L(`清晰区间 ${near.toFixed(2)} m ~ ${far===Infinity?'∞':far.toFixed(far>100?0:1)+' m'}`,
    `sharp zone ${near.toFixed(2)} m ~ ${far===Infinity?'∞':far.toFixed(far>100?0:1)+' m'}`);},
  new THREE.Vector3(0,-0.45,1.2),'y');
const lblBlur=addLabel(()=>L(`背景弥散圆 ${blurBg().toFixed(2)} mm`,'background blur disc '+blurBg().toFixed(2)+' mm'),
  new THREE.Vector3(-2.25,1.7,0),'r',()=>blurBg()>0.05);
const lblCone=addLabel(()=>L('收小光圈=光锥变细=弥散圆变小','stopping down = slimmer cones = smaller blur discs'),
  new THREE.Vector3(-1.4,0.4,1.6),'o',()=>raysOn);

function setStop(i){stopIdx=clamp(Math.round(i),0,7);
  document.getElementById('sAp').value=stopIdx;
  document.getElementById('sApVal').textContent='f/'+STOPS[stopIdx];updateStats();}
function setFoc(sv){const s=0.5*Math.pow(10,clamp(sv,0,100)/100*1.301);
  sM=clamp(s,0.5,10);
  document.getElementById('sFoc').value=clamp(sv,0,100);
  document.getElementById('sFocVal').textContent=sM.toFixed(1)+' m';updateStats();}
function setBack(sv){const d=2*Math.pow(10,clamp(sv,0,100)/100*1.301);
  dM=clamp(d,2,40);
  document.getElementById('sBack').value=clamp(sv,0,100);
  document.getElementById('sBackVal').textContent=dM.toFixed(0)+' m';updateStats();}
function setF(mm){fLen=mm;
  document.getElementById('b50').classList.toggle('on',mm===50);
  document.getElementById('b85').classList.toggle('on',mm===85);
  updateStats();}

const STEPS=[
 {b:'光圈=可变虹膜',be:'Aperture: an iris',
  d:'镜筒内 6~9 枚叶片围出可变孔;f 值 N=f/D 是焦距除以口径:f/2.8 收到 f/4,口径 ×1/√2,进光恰好减半——一档一档的 √2 序列。',
  de:'Six to nine blades inside the barrel form a variable bore; the f-number N=f/D divides focal length by bore: f/2.8→f/4 shrinks the bore by 1/√2 and exactly halves the light — the √2 stop sequence.',
  act(){setStop(2);setF(50);}},
 {b:'光锥变细',be:'Cones slim down',
  d:'场景里每一点都向镜头张开一束光锥:收到 f/16,锥体瘦成针,穿过光圈抵达传感器的光少了 64 倍——画质换景深的第一笔账。',
  de:'Every scene point opens a light cone toward the lens: at f/16 the cone is a needle and 64× less light reaches the sensor — the first installment of trading light for depth.',
  act(){setStop(7);}},
 {b:'弥散圆决定清晰',be:'Blur discs decide sharpness',
  d:'焦平面上的点聚成一个点;焦外的点在传感器上摊成圆盘(弥散圆)。盘小于 ~0.03 mm 人眼就当它清晰——景深其实是一张容差表。',
  de:'In-focus points collapse to points; out-of-focus points smear into discs on the sensor. Below ~0.03 mm your eye calls the disc a point — depth of field is really a tolerance table.',
  act(){setStop(2);setBack(6);}},
 {b:'收光圈=拉景深',be:'Stop down = stretch DOF',
  d:'景深近似 ∝ N·s²/f²:光圈每收一档,清晰区间几乎翻倍——风光照 f/8-f/11、微距 f/16 都是同一句话的不同音量。',
  de:'DOF ≈ ∝ N·s²/f²: each stop down nearly doubles the sharp zone — landscape f/8–f/11 and macro f/16 are the same sentence at different volumes.',
  act(){setStop(5);setFoc(80);}},
 {b:'超焦距:远景免费入场',be:'Hyperfocal: the far distance rides free',
  d:'把对焦环设到超焦距 H=f²/(N·c),远界限直接跑到无穷远:f/11、50 mm 时 H≈7.6 m——从 3.8 m 到∞全部清晰,街拍风光的万能设置。',
  de:'Set focus to the hyperfocal distance H=f²/(N·c) and the far limit jumps to infinity: at f/11, 50 mm, H≈7.6 m — everything from ~3.8 m to ∞ is sharp, the street photographer\'s default.',
  act(){setStop(6);setFoc(100);setBack(90);}},
 {b:'大光圈奶油虚化',be:'Wide open, creamy bokeh',
  d:'开回 f/1.4 并换 85 mm:背景弥散圆按口径放大,树冠化成奶油——虚化不是错误,是被有意买下的注意力隔离。',
  de:'Back to f/1.4 on the 85 mm: the background blur disc scales with the bore and the tree melts to cream — bokeh is not an error, it is attention isolation, deliberately purchased.',
  act(){setStop(0);setF(85);setFoc(35);setBack(90);}},
 {b:'焦距也是景深旋钮',be:'Focal length turns DOF too',
  d:'同一构图下焦距越长景深越浅:50 mm 与 85 mm 同拍一张半身像,背景虚化差出一倍——「人像头」的特权来自焦距与口径的乘积。',
  de:'At the same framing, longer focal length means shallower DOF: a head-and-shoulders portrait on 50 mm vs 85 mm doubles the background blur — the "portrait lens" privilege is focal length times bore.',
  act(){setF(50);setStop(2);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const {near,far}=nearFar();
  const dEl=document.getElementById('stDof');
  dEl.innerHTML=near.toFixed(2)+' ~ '+(far===Infinity?'∞':far.toFixed(far>100?0:1))+'<small> m</small>';
  dEl.className='v'+(far===Infinity?' ok':'');
  const b=blurBg();
  const cEl=document.getElementById('stCoc');
  cEl.innerHTML=b.toFixed(2)+'<small> mm</small>';
  cEl.className='v '+(b>1?'warn':'');
  const light=Math.pow(1.4/N(),2)*100;
  document.getElementById('stLight').innerHTML=light.toFixed(0)+'<small> %</small>';
  const pct=b/36*100;
  const pEl=document.getElementById('stBokeh');
  pEl.innerHTML=pct.toFixed(1)+'<small> %</small>';
  pEl.className='v '+(pct>5?'warn':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('b50').addEventListener('click',()=>setF(50));
document.getElementById('b85').addEventListener('click',()=>setF(85));
document.getElementById('sAp').addEventListener('input',e=>setStop(+e.target.value));
document.getElementById('sFoc').addEventListener('input',e=>setFoc(+e.target.value));
document.getElementById('sBack').addEventListener('input',e=>setBack(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglRays').addEventListener('change',e=>{raysOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x12100b:0xece8e0);
  scene.fog.color.setHex(dark?0x12100b:0xece8e0);
  groundM.color.setHex(dark?0x1a1710:0xd6cfbe);
  bodyM.color.setHex(dark?0x2e323c:0x5a6270);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 光学布局:镜筒伸缩,光圈孔径,f/N ── */
  const s=sM*1000,d=dM*1000,Nn=N();
  const xL=xSens-K*vOf(s);                /* 镜(光圈)面:对焦越近伸得越长 */
  const A=clamp(0.055+fLen/Nn()*0.0035,0.07,0.3); /* 通光口径可视化 */
  const xO=xOf(sM),xB=xBgOf(dM);
  const bx0=-4.1;
  barrel.scale.y=Math.max(0.2,xL-bx0);
  barrel.position.x=(xL+bx0)/2;
  barrel2.scale.y=Math.max(0.2,(xL+0.1)-bx0);
  barrel2.position.x=((xL+0.1)+bx0)/2;
  frontRing.position.x=xL+0.1;
  iris.position.x=xL;iris2.position.x=xL+0.02;
  iris.scale.set(A/0.5,A/0.5,1);iris2.scale.set(A/0.5,A/0.5,1);
  blades.forEach((b,i)=>{
    const th=i/6*Math.PI*2;
    const rB=0.27;
    b.position.set(xL+0.01,Math.sin(th)*rB,Math.cos(th)*rB);
    b.rotation.x=th+stopIdx*0.22;
    b.rotation.y=Math.PI/2;
  });
  /* 主体/背景/辅助线 */
  subject.position.set(xO,0,0);
  subject.scale.setScalar(1+0.02*Math.sin(simT*2));
  bgTree.position.set(xB,0,0.2);
  focusBand.position.x=xO;
  const {near,far}=nearFar();
  const xNear=Math.max(0.9,xOf(near)),xFar=far===Infinity?10.4:xOf(Math.min(far,60));
  dofSlab.scale.x=Math.max(0.05,xFar-xNear);
  dofSlab.position.set((xNear+xFar)/2,0.02,0);
  /* ── 光锥:对象顶点 P → 光圈上下缘 → 焦点 → 传感器 ── */
  const yO=1.28;
  function cone(xp,yP,mm,rays,mat){
    const P=new THREE.Vector3(xp,yP,0);
    const vmm=vOf(mm);
    const xC=xL+K*vmm;
    const yImg=-yP*(xC-xL)/(xp-xL);
    const E1=new THREE.Vector3(xL,A,0),E2=new THREE.Vector3(xL,-A,0);
    const Cr=new THREE.Vector3(xC,yImg,0);
    const t=(xSens-xL)/Math.max(xC-xL,0.001);
    const y1=A+(yImg-A)*t,y2=-A+(yImg+A)*t;
    const S1=new THREE.Vector3(xSens,y1,0),S2=new THREE.Vector3(xSens,y2,0);
    setSeg(rays[0],P,E1,mat,0.011);setSeg(rays[1],E1,Cr,mat,0.011);
    setSeg(rays[2],P,E2,mat,0.011);setSeg(rays[3],E2,Cr,mat,0.011);
    setSeg(rays[4],Cr,S1,mat,0.011);setSeg(rays[5],Cr,S2,mat,0.011);
    return {r:Math.abs(y1-y2)/2,yc:(y1+y2)/2,xC};
  }
  raysS.forEach(m=>m.visible=false);raysB.forEach(m=>m.visible=false);
  if(raysOn){
    cone(xO,yO,s,raysS,segMGreen);
    const mat=dM>=sM?segMBlue:segMRed;
    cone(xB,1.5,dM,raysB,mat);
  }
  /* 弥散圆与虚化晕 */
  const vB=vOf(d);
  const xCB=xL+K*vB;
  const rBlur=clamp(A*Math.abs(xSens-xCB)/Math.max(xCB-xL,0.02)*14,0.02,0.65);
  const yc=1.5*(xSens-xL)/(xB-xL);
  discB.scale.setScalar(rBlur);
  discB.material.color.setHex(dM>=sM?0x74c0fc:0xff8787);
  discB.position.set(xSens+0.05,clamp(yc,-0.5,0.5),0.3);
  discB.visible=raysOn;
  haloB.scale.setScalar(Math.max(rBlur*5,0.3));
  haloB.material.color.setHex(dM>=sM?0x74c0fc:0xff8787);
  haloB.position.set(xB,1.1,0.2-0.75);
  haloB.visible=dM!==sM;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setStop(2);setFoc(40);setBack(55);setF(50);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
