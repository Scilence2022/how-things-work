<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>木星与大红斑 · 没有地面的行星,最长寿的风暴</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="labels"></div>

  <h1 data-zh="木星与大红斑" data-en="Jupiter & the Great Red Spot">木星与大红斑</h1>
  <div class="sub" data-zh="木星没有地面,只有风:几千条纬向急流把云梳成平行条纹,自转 9.9 小时把一切拧成横向;大红斑是一场比地球还宽的反气旋,吹了至少 350 年——没有陆地摩擦、没有昼夜温差,风暴就没有散场的理由;它如今在缩小,却依旧是最长寿的天气 · 拖动旋转 / 空格运行/暂停" data-en="Jupiter has no ground, only wind: zonal jet streams comb the clouds into parallel bands, and a 9.9-hour spin flattens everything sideways; the Great Red Spot is an anticyclone wider than Earth that has raged for at least 350 years — no land to rub against, no day-night swing, no reason for the storm to close; it is shrinking now, yet still the longest-running weather there is · drag to orbit / Space = run/pause">木星没有地面,只有风:几千条纬向急流把云梳成平行条纹,自转 9.9 小时把一切拧成横向;大红斑是一场比地球还宽的反气旋,吹了至少 350 年——没有陆地摩擦、没有昼夜温差,风暴就没有散场的理由;它如今在缩小,却依旧是最长寿的天气 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x070a12,40,160);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.4,3.1,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=1.5;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.3));
const key=new THREE.DirectionalLight(0xfff2dd,1.4);key.position.set(9,5,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.22);fill.position.set(-8,4,-6);scene.add(fill);

/* 星空:随机点云(非贴图) */
const NSTAR=900;
const starPos=new Float32Array(NSTAR*3);
for(let i=0;i<NSTAR;i++){
  const r=70+Math.random()*40,a=Math.random()*Math.PI*2,c=2*Math.random()-1,s=Math.sqrt(1-c*c);
  starPos[i*3]=r*s*Math.cos(a);starPos[i*3+1]=r*c;starPos[i*3+2]=r*s*Math.sin(a);
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const starMat=new THREE.PointsMaterial({color:0xcfd8ea,size:0.9,transparent:true,opacity:0.9,fog:false});
scene.add(new THREE.Points(starGeo,starMat));

/* 木星:程序生成云带 CanvasTexture(横向条带+带缘湍流,米白/棕橙) */
const RJ=2.2;
function bandTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
  const cols=['#efe3cd','#dcc19b','#c49a6b','#e9dcc4','#a97a4e','#e5d5ba','#cfa87a','#d9c19c','#b98d5f','#e9dcc4','#c49a6b','#e0cdaa','#a97a4e','#efe3cd'];
  const n=cols.length,h=512/n;
  for(let i=0;i<n;i++){g.fillStyle=cols[i];g.fillRect(0,i*h-1,1024,h+2);}
  for(let k=0;k<320;k++){ /* 带缘湍流细丝 */
    const y0=Math.random()*512,amp=2+Math.random()*7,ph=Math.random()*9,dk=Math.random()<0.5;
    g.strokeStyle=dk?'rgba(115,78,40,'+(0.05+Math.random()*0.12).toFixed(3)+')':'rgba(255,250,235,'+(0.05+Math.random()*0.12).toFixed(3)+')';
    g.lineWidth=0.8+Math.random()*2.2;g.beginPath();
    for(let x=0;x<=1024;x+=16){
      const y=y0+Math.sin(x*0.015+ph)*amp+Math.sin(x*0.043+ph*2)*amp*0.4;
      x===0?g.moveTo(x,y):g.lineTo(x,y);
    }
    g.stroke();
  }
  const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
function streakTexture(){ /* 差速层:贴在稍大球壳上,以略慢速度漂移,演示纬向剪切 */
  const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
  for(let k=0;k<170;k++){
    const y0=(Math.floor(Math.random()*14)+0.5)*512/14,amp=1.5+Math.random()*4,ph=Math.random()*9;
    const x0=Math.random()*1024,len=120+Math.random()*380,dk=Math.random()<0.5;
    g.strokeStyle=dk?'rgba(70,45,25,'+(0.05+Math.random()*0.10).toFixed(3)+')':'rgba(255,252,240,'+(0.05+Math.random()*0.10).toFixed(3)+')';
    g.lineWidth=0.6+Math.random()*1.6;g.beginPath();
    for(let x=x0;x<=x0+len;x+=14){const y=y0+Math.sin(x*0.02+ph)*amp;x===x0?g.moveTo(x,y):g.lineTo(x,y);}
    g.stroke();
  }
  const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;return tex;
}
const jup=new THREE.Group();scene.add(jup);
const baseTex=bandTexture();
const jupM=new THREE.MeshStandardMaterial({map:baseTex,roughness:0.85,metalness:0,emissive:0x8a6a44,emissiveIntensity:0.16,emissiveMap:baseTex});
jup.add(new THREE.Mesh(new THREE.SphereGeometry(RJ,64,48),jupM));
const strM=new THREE.MeshStandardMaterial({map:streakTexture(),transparent:true,opacity:0.9,roughness:0.9,depthWrite:false});
const strS=new THREE.Mesh(new THREE.SphereGeometry(RJ*1.006,64,48),strM);jup.add(strS);
/* 纬线网格(可开关,强调平行条纹的纬度结构) */
const gridM=new THREE.MeshBasicMaterial({color:0x74c0fc,wireframe:true,transparent:true,opacity:0.10,fog:false});
const grid=new THREE.Mesh(new THREE.SphereGeometry(RJ*1.012,36,18),gridM);grid.visible=false;scene.add(grid);

/* 大红斑:贴在球面南纬 22° 的旋转扁椭圆漩涡 */
function spotTexture(){
  const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');
  const rg=g.createRadialGradient(128,128,10,128,128,120);
  rg.addColorStop(0,'rgba(190,70,40,0.95)');rg.addColorStop(0.55,'rgba(212,106,62,0.85)');
  rg.addColorStop(0.8,'rgba(226,160,110,0.4)');rg.addColorStop(1,'rgba(226,178,130,0)');
  g.fillStyle=rg;g.beginPath();g.arc(128,128,120,0,7);g.fill();
  for(let k=0;k<26;k++){ /* 反气旋涡臂 */
    const a0=Math.random()*7,r0=18+Math.random()*70;
    g.strokeStyle='rgba(238,'+(150-Math.random()*50|0)+','+(110-Math.random()*40|0)+','+(0.1+Math.random()*0.18).toFixed(3)+')';
    g.lineWidth=2+Math.random()*4;g.beginPath();
    for(let t=0;t<1;t+=0.05){
      const a=a0+t*1.9,r=r0*(1-t*0.55);
      const x=128+r*Math.cos(a),y=128+r*Math.sin(a)*0.92;
      t===0?g.moveTo(x,y):g.lineTo(x,y);
    }
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const latGRS=-22*Math.PI/180,lonGRS=2.4;
const grsAnchor=new THREE.Group();
grsAnchor.position.set(RJ*Math.cos(latGRS)*Math.cos(lonGRS),RJ*Math.sin(latGRS),RJ*Math.cos(latGRS)*Math.sin(lonGRS));
grsAnchor.lookAt(grsAnchor.position.clone().multiplyScalar(2)); /* +z 指向球面外侧 */
jup.add(grsAnchor);
const grs=new THREE.Group();grs.position.z=0.05;grsAnchor.add(grs);
const grsCoreM=new THREE.MeshStandardMaterial({color:0xc04a2a,roughness:0.8,emissive:0x8a2f16,emissiveIntensity:0.55});
const grsCore=new THREE.Mesh(new THREE.SphereGeometry(0.34,28,20),grsCoreM);
grsCore.scale.set(1.35,0.78,0.16);grs.add(grsCore);
const grsDiscM=new THREE.MeshBasicMaterial({map:spotTexture(),transparent:true,depthWrite:false});
const grsDisc=new THREE.Mesh(new THREE.CircleGeometry(0.5,40),grsDiscM);
grsDisc.scale.set(1.4,0.85,1);grs.add(grsDisc);

/* 状态 */
let timeScale=1,jet=120,w0=1.3,playing=true,labelsOn=true,slowMo=false;
let ang=0,simT=0,simY=0,closeup=false,followGRS=false,prevReady=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function curW(){return Math.max(1.0,w0-0.0021*simY);} /* 宽度账单:每年缩一点,1.3 → 1.0 */

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`纬向急流:${jet.toFixed(0)} m/s`,`Zonal jet: ${jet.toFixed(0)} m/s`),
  new THREE.Vector3(0,0.9,RJ+0.5),'b');
addLabel(()=>L('西风带:几千 km 宽的顺行急流','Prograde jets: thousands of km wide'),
  new THREE.Vector3(-1.6,1.7,1.2),'y');
addLabel(()=>L('带缘湍流剪切:速度差撕出漩涡','Shear at band edges: velocity rip tears eddies'),
  new THREE.Vector3(-1.9,-0.7,1.3),'o');
/* 大红斑标签挂到锚点上,只在特写时出现 */
const grsDiv=document.createElement('div');grsDiv.className='lbl r';
const grsLbl=new CSS2DObject(grsDiv);grsLbl.position.set(0,1.0,0);grsAnchor.add(grsLbl);
labelReg.push({o:grsLbl,vis:()=>closeup,
  text:()=>L(`大红斑:反气旋,宽 ${curW().toFixed(2)} ⊕`,`Great Red Spot: anticyclone, ${curW().toFixed(2)} Earth-wide`)});

/* 相机 tween:全球视角 ↔ 红斑特写(端点跟随移动的红斑) */
const HOME_P=new THREE.Vector3(-6.4,3.1,7.6);
let tw=null;const V1=new THREE.Vector3(),V2=new THREE.Vector3(),prevG=new THREE.Vector3();
const easeK=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function flyTo(p1,q1,dur){tw={p0:camera.position.clone(),q0:controls.target.clone(),p1:p1.clone(),q1:q1.clone(),t:0,dur:dur||1.4};}
function setView(cl){
  closeup=cl;followGRS=cl;
  document.getElementById('bGlobal').classList.toggle('on',!cl);
  document.getElementById('bClose').classList.toggle('on',cl);
  grsAnchor.getWorldPosition(V1);
  if(cl){
    const off=camera.position.clone().sub(V1).normalize().multiplyScalar(2.4);off.y=Math.max(off.y,0.55);
    tw={p0:camera.position.clone(),q0:controls.target.clone(),off:off,t:0,dur:1.6,track:true};
  }else flyTo(HOME_P,new THREE.Vector3(0,0,0),1.3);
}
function setTime(v){timeScale=clamp(v,0.2,6);
  document.getElementById('sTime').value=timeScale;
  document.getElementById('sTimeVal').textContent='×'+timeScale.toFixed(1);updateStats();}
function setJet(v){jet=clamp(v,40,180);
  document.getElementById('sJet').value=jet;
  document.getElementById('sJetVal').textContent=jet.toFixed(0)+' m/s';updateStats();}
function setW0(v){w0=clamp(v,1,1.6);
  document.getElementById('sW').value=w0;
  document.getElementById('sWVal').textContent=w0.toFixed(2)+' ⊕';updateStats();}
function setGrid(v){grid.visible=v;document.getElementById('tglGrid').checked=v;}

const STEPS=[
 {zh:'没有地面的行星:只有风在转',en:'A planet with no ground: only wind',
  act(){setView(false);setTime(1);setJet(120);setW0(1.3);setGrid(false);}},
 {zh:'急流把云梳成平行条纹',en:'Jet streams comb the clouds into parallel bands',
  act(){setGrid(true);setJet(150);setTime(1.5);}},
 {zh:'快速自转+科氏力:带缘撕出湍流剪切',en:'Fast spin + Coriolis: shear tears eddies at band edges',
  act(){setTime(3);setJet(175);setGrid(true);}},
 {zh:'大红斑:吹了 350 年的反气旋',en:'The Great Red Spot: a 350-year anticyclone',
  act(){setView(true);setTime(2);}},
 {zh:'无陆地摩擦、无昼夜温差:风暴不散场',en:'No land, no day-night swing: the storm never ends',
  act(){setView(true);setTime(0.6);}},
 {zh:'它正在缩小:1.3 → 1.0 个地球宽',en:'It is shrinking: 1.3 down to 1.0 Earth-widths',
  act(){setView(true);setW0(1.3);simY=10;setTime(6);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stRot').innerHTML='9.9<small> h</small>';
  document.getElementById('stJet').innerHTML=jet.toFixed(0)+'<small> m/s</small>';
  const sv=document.getElementById('stSpot');
  sv.innerHTML=(430+Math.sin(simT*0.8)*9).toFixed(0)+'<small> km/h</small>';sv.className='v ok';
  const wv=document.getElementById('stW');const cw=curW();
  wv.innerHTML=cw.toFixed(2)+'<small> ⊕</small>';
  wv.className='v '+(cw<1.15?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bGlobal').addEventListener('click',()=>setView(false));
document.getElementById('bClose').addEventListener('click',()=>setView(true));
document.getElementById('bResetView').addEventListener('click',()=>setView(false));
document.getElementById('sTime').addEventListener('input',e=>setTime(+e.target.value));
document.getElementById('sJet').addEventListener('input',e=>setJet(+e.target.value));
document.getElementById('sW').addEventListener('input',e=>setW0(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglGrid').addEventListener('change',e=>{setGrid(e.target.checked);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x070a12:0xdde6ee);
  scene.fog.color.setHex(dark?0x070a12:0xdde6ee);
  starMat.opacity=dark?0.9:0.3;
  jupM.emissiveIntensity=dark?0.16:0.05;
  gridM.opacity=dark?0.10:0.16;
  key.intensity=dark?1.4:1.6;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;simY+=dts*timeScale*1.5;
  /* 自转 9.9h + 差速条纹(外层滞后)+ 纹理微漂移 */
  ang+=dts*0.5*timeScale;jup.rotation.y=ang;
  strS.rotation.y=-ang*0.18;
  baseTex.offset.x=(simT*0.006)%1;
  /* 大红斑自旋 + 宽度账单驱动缩放 */
  grsDisc.rotation.z-=dts*(0.9+timeScale*0.15);
  const ws=curW()/1.3;
  grsCore.scale.set(1.35*ws,0.78*ws,0.16);
  grsDisc.scale.set(1.4*ws,0.85*ws,1);
  /* 相机:tween → 特写时跟随红斑 */
  grsAnchor.getWorldPosition(V1);
  if(tw){
    tw.t+=dt/tw.dur;const k=easeK(Math.min(1,tw.t));
    let p1,q1;
    if(tw.track){p1=V2.copy(V1).add(tw.off);q1=V1;}else{p1=tw.p1;q1=tw.q1;}
    camera.position.lerpVectors(tw.p0,p1,k);
    controls.target.lerpVectors(tw.q0,q1,k);
    if(tw.t>=1)tw=null;
  }else if(followGRS){
    if(prevReady)camera.position.add(V2.copy(V1).sub(prevG));
    controls.target.copy(V1);
  }
  prevG.copy(V1);prevReady=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
