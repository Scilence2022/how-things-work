<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>荧光棒 · 断键直接放光子</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="荧光棒 · 断键直接放光子" data-en="Glow Sticks · breaking bonds makes photons directly">荧光棒 · 断键直接放光子</h1>
  <div class="sub" data-zh="过氧化氢氧化草酸二苯酯,生成高能中间体 1,2-二氧杂环丁二酮;它分解时把能量交给荧光染料,激发态回落基态发出 hν——能隙定颜色:罗丹明 B 红 590 nm、荧光素黄绿 512 nm、二苯蒽蓝 432 nm;速率服从 Arrhenius(Ea≈55 kJ/mol):加热变亮但更快烧完,冷藏变暗但更持久,反应物总量守恒 · 拖动旋转 / 空格运行/暂停" data-en="Hydrogen peroxide oxidizes diphenyl oxalate into the high-energy intermediate 1,2-dioxetanedione; as it breaks apart it hands energy to a fluorescent dye, whose excited state relaxes and emits hν — the energy gap sets the color: rhodamine B red 590 nm, fluorescein yellow-green 512 nm, DPA blue 432 nm; the rate follows Arrhenius (Ea≈55 kJ/mol): heat it and it glows brighter but dies sooner, chill it and it dims but lasts — total light is conserved · drag to orbit / Space = run/pause">过氧化氢氧化草酸二苯酯，生成高能中间体 1,2-二氧杂环丁二酮；它分解时把能量交给荧光染料，激发态回落基态发出 hν——能隙定颜色：罗丹明 B 红 590 nm、荧光素黄绿 512 nm、二苯蒽蓝 432 nm；速率服从 Arrhenius（Ea≈55 kJ/mol）：加热变亮但更快烧完，冷藏变暗但更持久，反应物总量守恒 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 / URL 参数 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let SPEED=1;{const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))SPEED=clamp(v,0.3,2.5);}
const $=id=>document.getElementById(id);
const tglLabelsEl=$('tglLabels'),tglCompareEl=$('tglCompare'),tglLevelEl=$('tglLevel');

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(0.8,2.7,7.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.5,1.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.45));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 染料与化学动力学 ---- */
const DYES=[
 {zh:'罗丹明 B(红)',en:'Rhodamine B (red)',short:['红','red'],nm:590,c:0xff6a55},
 {zh:'荧光素(黄绿)',en:'Fluorescein (green)',short:['黄绿','green'],nm:512,c:0xa8e05a},
 {zh:'二苯蒽(蓝)',en:'DPA (blue)',short:['蓝','blue'],nm:432,c:0x6f8cff},
];
const A=4.4e7,Ea=55000,Rg=8.314;
const kN=A*Math.exp(-Ea/(Rg*295.15));              // 22 °C 基准速率
const kOf=T=>A*Math.exp(-Ea/(Rg*(T+273.15)));      // Arrhenius
let tempC=22,timeMul=1,compare=false,sel=0;
const R=[1,1,1],snapped=[false,false,false],mixT=[0,0,0],snapT=[-1,-1,-1],bright=[0,0,0];
let snapDelay=-1,simT=0;
const tempOf=i=>compare?[60,22,0][i]:tempC;

/* ---- 材质 ---- */
const baseM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const darkM=new THREE.MeshStandardMaterial({color:0x2c3138,roughness:0.6,metalness:0.3});
const glassM=new THREE.MeshPhysicalMaterial({color:0xcfe4ee,transparent:true,opacity:0.14,
  roughness:0.1,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const ampM=new THREE.MeshPhysicalMaterial({color:0xdde6b5,transparent:true,opacity:0.75,roughness:0.3,depthWrite:false});

/* ---- 桌面与试管架 ---- */
const bench=new THREE.Mesh(new THREE.BoxGeometry(9,0.24,3.4),baseM);
bench.position.set(0.6,0.12,0);scene.add(bench);
const plate=new THREE.Mesh(new THREE.BoxGeometry(4.7,0.06,1.0),darkM);
plate.position.set(0,0.32,0);scene.add(plate);
for(const px of[-2.3,2.3]){
  const post=new THREE.Mesh(new THREE.BoxGeometry(0.07,2.7,0.07),darkM);
  post.position.set(px,1.65,-0.42);scene.add(post);
}
const rail=new THREE.Mesh(new THREE.BoxGeometry(4.7,0.07,0.07),darkM);
rail.position.set(0,2.98,-0.42);scene.add(rail);

/* ---- 三根荧光棒 ---- */
const stickG=[],liqMats=[],ampoules=[],bars=[],lights=[];
for(let i=0;i<3;i++){
  const x=-1.7+i*1.7,d=DYES[i];
  const g=new THREE.Group();g.position.set(x,0.35,0);scene.add(g);stickG.push(g);
  const glass=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,2.6,20,1,true),glassM);
  glass.position.y=1.3;g.add(glass);
  const liqM=new THREE.MeshStandardMaterial({color:new THREE.Color(d.c).multiplyScalar(0.35),
    emissive:d.c,emissiveIntensity:0.04,transparent:true,opacity:0.88,roughness:0.3});
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(0.125,0.125,2.3,16),liqM);
  liq.position.y=1.15;g.add(liq);liqMats.push(liqM);
  const amp=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.9,10),ampM);
  amp.position.y=1.2;g.add(amp);ampoules.push(amp);
  for(const cy of[0.06,2.54]){
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.12,16),darkM);
    cap.position.y=cy;g.add(cap);
  }
  /* 剩余反应物条 */
  const barM=new THREE.MeshStandardMaterial({color:new THREE.Color(d.c).multiplyScalar(0.3),
    emissive:d.c,emissiveIntensity:0.45,transparent:true,opacity:0.85});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(0.07,1.6,0.07).translate(0,0.8,0),barM);
  bar.position.set(x+0.32,0.35,0);scene.add(bar);bars.push(bar);
  const pl=new THREE.PointLight(d.c,0,7);pl.position.set(x,1.7,0.5);scene.add(pl);lights.push(pl);
}
/* 热水/冰水对照杯 */
function mkCup(x,lc){
  const g=new THREE.Group();g.position.set(x,0.35,0);
  const glass=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,1.35,20,1,true),glassM);
  glass.position.y=0.68;g.add(glass);
  const liqM=new THREE.MeshBasicMaterial({color:lc,transparent:true,opacity:0.3,depthWrite:false});
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,1.15,18),liqM);
  liq.position.y=0.6;g.add(liq);
  g.visible=false;scene.add(g);return g;
}
const hotCup=mkCup(-1.7,0xff8787),coldCup=mkCup(1.7,0x74c0fc);

/* ---- 能级图板:S₀/S₁ 与能隙 ---- */
const boardG=new THREE.Group();boardG.position.set(3.75,1.85,-0.3);boardG.rotation.y=-0.5;scene.add(boardG);
const boardPlate=new THREE.Mesh(new THREE.BoxGeometry(2.0,2.5,0.06),
  new THREE.MeshStandardMaterial({color:0x11151a,roughness:0.7}));
boardG.add(boardPlate);
const lvlM=new THREE.MeshStandardMaterial({color:0x8a93a3,emissive:0x8a93a3,emissiveIntensity:0.35});
const s1=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.05,0.04),lvlM);s1.position.set(0,0.8,0.05);boardG.add(s1);
const s0=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.05,0.04),lvlM);s0.position.set(0,-0.8,0.05);boardG.add(s0);
const upM=new THREE.MeshBasicMaterial({color:0xffc078});
const upA=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,1.5,10),upM);
upA.position.set(-0.28,0,0.06);boardG.add(upA);
const upC=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,10),upM);
upC.position.set(-0.28,0.83,0.06);boardG.add(upC);
const dnM=new THREE.MeshBasicMaterial({color:DYES[0].c});
const dnA=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,1.5,10),dnM);
dnA.position.set(0.3,0,0.06);boardG.add(dnA);
const dnC=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,10),dnM);
dnC.rotation.x=Math.PI;dnC.position.set(0.3,-0.83,0.06);boardG.add(dnC);
const wavy=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,1.5,8),dnM);
wavy.rotation.z=0.5;wavy.position.set(0.52,0,0.06);boardG.add(wavy);

/* ---- 能量微团粒子(InstancedMesh) ---- */
const NP=48;
const packs=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,6,6),
  new THREE.MeshBasicMaterial({color:0xffffff}),NP);
scene.add(packs);
const pkPos=[];
for(let i=0;i<NP;i++){
  const s=i/16|0;
  pkPos.push(new THREE.Vector3((Math.random()-0.5)*0.18,0.35+Math.random()*1.75,(Math.random()-0.5)*0.18));
  packs.setColorAt(i,new THREE.Color(DYES[s].c));
}
packs.instanceColor.needsUpdate=true;
const pm4=new THREE.Matrix4();
function updPacks(dt){
  for(let i=0;i<NP;i++){
    const s=i/16|0,b=clamp(bright[s],0,14);
    if(!snapped[s]||b<0.01){pm4.makeScale(0.001,0.001,0.001);packs.setMatrixAt(i,pm4);continue;}
    const p=pkPos[i];
    p.x=clamp(p.x+(Math.random()-0.5)*0.05,-0.09,0.09);
    p.z=clamp(p.z+(Math.random()-0.5)*0.05,-0.09,0.09);
    p.y+=dt*0.5;if(p.y>2.15)p.y=0.35;
    const sc=0.3+0.7*Math.min(1,b/2);
    pm4.makeScale(sc,sc,sc);
    pm4.setPosition(-1.7+s*1.7+p.x,p.y,p.z);
    packs.setMatrixAt(i,pm4);
  }
  packs.instanceMatrix.needsUpdate=true;
}

/* ---- 玻璃碎片(掰断瞬间) ---- */
const NS=36;
const shards=new THREE.InstancedMesh(new THREE.TetrahedronGeometry(0.045),ampM,NS);
scene.add(shards);
const shP=[],shV=[],shL=new Float64Array(NS).fill(-1);
for(let i=0;i<NS;i++){shP.push(new THREE.Vector3());shV.push(new THREE.Vector3());}
function burst(si){
  const x=-1.7+si*1.7;
  for(let j=0;j<12;j++){
    const i=si*12+j;
    shP[i].set(x+(Math.random()-0.5)*0.1,1.35+Math.random()*0.3,(Math.random()-0.5)*0.1);
    shV[i].set((Math.random()-0.5)*1.6,0.8+Math.random()*1.4,(Math.random()-0.5)*1.6);
    shL[i]=0.9;
  }
}
function updShards(dt){
  for(let i=0;i<NS;i++){
    if(shL[i]<0){pm4.makeScale(0.001,0.001,0.001);shards.setMatrixAt(i,pm4);continue;}
    shL[i]-=dt;
    shV[i].y-=2.6*dt;
    shP[i].addScaledVector(shV[i],dt);
    if(shP[i].y<0.38){shP[i].y=0.38;shV[i].y*=-0.3;shV[i].x*=0.7;shV[i].z*=0.7;}
    const s=Math.max(0.05,shL[i]/0.9);
    pm4.makeScale(s,s,s);pm4.setPosition(shP[i].x,shP[i].y,shP[i].z);
    shards.setMatrixAt(i,pm4);
  }
  shards.instanceMatrix.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('罗丹明 B · 590 nm','Rhodamine B · 590 nm'),new THREE.Vector3(-1.7,3.3,0),'r');
addLabel(()=>L('荧光素 · 512 nm','Fluorescein · 512 nm'),new THREE.Vector3(0,3.3,0),'g');
addLabel(()=>L('二苯蒽 · 432 nm','DPA · 432 nm'),new THREE.Vector3(1.7,3.3,0),'b');
addLabel(()=>L('内管:H₂O₂ 溶液 / 外管:草酸酯 + 染料','inner ampoule: H₂O₂ / outer tube: oxalate ester + dye'),
  new THREE.Vector3(0,0.62,0.45),'y',()=>!snapped[1]);
addLabel(()=>L('氧化放能 → 高能中间体 1,2-二氧杂环丁二酮','oxidation → the high-energy intermediate 1,2-dioxetanedione'),
  new THREE.Vector3(-1.7,2.35,0.45),'o',()=>snapped[0]);
addLabel(()=>L('不需要外界光:化学能直接变光子 hν','no external light needed: chemical energy straight to photons'),
  new THREE.Vector3(1.7,2.35,0.45),'g',()=>snapped[2]);
addLabel(()=>L('热 60 °C:亮而短 / 冰 0 °C:暗而长 — 总量守恒',
    '60 °C: bright & short / 0 °C: dim & long — total conserved'),
  new THREE.Vector3(0,0.55,0.8),'r',()=>compare);
addLabel(()=>L('60 °C 热水','60 °C bath'),new THREE.Vector3(-2.25,1.75,0),'o',()=>compare);
addLabel(()=>L('0 °C 冰水','0 °C ice bath'),new THREE.Vector3(2.25,1.75,0),'b',()=>compare);
addLabel(()=>L('S₁ 激发态','S₁ excited'),new THREE.Vector3(0,0.95,0.1),'b',()=>tglLevelEl.checked,boardG);
addLabel(()=>L('S₀ 基态','S₀ ground'),new THREE.Vector3(0,-0.95,0.1),'b',()=>tglLevelEl.checked,boardG);
addLabel(()=>L(`能量转移 ↑ / 回落发光 hν ↓ · E=hc/λ = ${DYES[sel].nm} nm`,
    `energy in ↑ / emission hν ↓ · E=hc/λ = ${DYES[sel].nm} nm`),
  new THREE.Vector3(0,0,0.12),'o',()=>tglLevelEl.checked,boardG);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'玻璃管分层:内管 H₂O₂ 溶液,外管草酸酯 + 染料,互不相溶',
  en:'Two chambers: H₂O₂ inside, oxalate ester + dye outside — not mixed yet'},
 {zh:'掰弯玻璃管:内管破裂,两相当场混合',
  en:'Bend the tube: the ampoule snaps and the phases mix on the spot'},
 {zh:'H₂O₂ 氧化草酸酯 → 高能中间体 1,2-二氧杂环丁二酮',
  en:'H₂O₂ oxidizes the ester → the high-energy intermediate 1,2-dioxetanedione'},
 {zh:'中间体分解,把能量交给染料 → 染料到达激发态',
  en:'The intermediate decomposes, handing energy to the dye — now excited'},
 {zh:'激发态回落基态发光 hν:能隙定颜色(590 / 512 / 432 nm)',
  en:'Relaxation emits hν: the gap sets the color (590 / 512 / 432 nm)'},
 {zh:'Arrhenius(Ea≈55 kJ/mol):热=亮而短,冷=暗而长,总量守恒',
  en:'Arrhenius (Ea≈55 kJ/mol): hot = bright & short, cold = dim & long — total conserved'}
];
let activeStep=1;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function freshAll(){
  for(let i=0;i<3;i++){R[i]=1;snapped[i]=false;snapT[i]=-1;mixT[i]=0;ampoules[i].visible=true;}
  snapDelay=-1;shL.fill(-1);
}
function doSnap(i){
  if(snapped[i])return;
  snapped[i]=true;snapT[i]=0;
}
function applyPhase(i){
  activeStep=i;freshAll();
  compare=false;tglCompareEl.checked=false;
  if(i===0){setT(22);setSpd(1);}
  else if(i===1){setT(22);setSpd(1);snapDelay=0.6;}
  else if(i===2){setT(22);setSpd(1);doSnap(0);doSnap(1);doSnap(2);}
  else if(i===3){setT(22);setSpd(1);doSnap(0);doSnap(1);doSnap(2);tglLevelEl.checked=true;}
  else if(i===4){setT(22);setSpd(1);doSnap(0);doSnap(1);doSnap(2);}
  else{setT(22);setSpd(1.5);doSnap(0);doSnap(1);doSnap(2);
    compare=true;tglCompareEl.checked=true;}
  syncSteps();
}

/* ---- 滑杆 ---- */
function setT(v){tempC=v;$('sT').value=v;$('sTVal').textContent=v.toFixed(0)+' °C';}
function setSpd(v){timeMul=v;$('sSpd').value=v;$('sSpdVal').textContent=v.toFixed(1)+'×';}
function setSel(v){sel=v;$('sSel').value=v;$('sSelVal').textContent=DYES[v].short[LANG==='en'?1:0];
  dnM.color.setHex(DYES[v].c);}

/* ---- 读数 ---- */
function updateStats(){
  $('stI').innerHTML=bright[sel].toFixed(2)+'<small> ×</small>';
  const re=$('stR');re.innerHTML=(R[sel]*100).toFixed(1)+'<small> %</small>';
  re.className='v'+(R[sel]<0.02?' warn':'');
  $('stWl').innerHTML=DYES[sel].nm+'<small> nm</small>';
  $('stE').innerHTML=((1-R[sel])*100).toFixed(1)+'<small> %</small>';
}

/* ---- 控件事件 ---- */
$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
$('tglCompare').addEventListener('change',e=>{compare=e.target.checked;});
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
$('bAmb').addEventListener('click',()=>{setT(22);for(let i=0;i<3;i++)doSnap(i);});
$('bHot').addEventListener('click',()=>{setT(60);for(let i=0;i<3;i++)doSnap(i);});
$('bCold').addEventListener('click',()=>{setT(0);for(let i=0;i<3;i++)doSnap(i);});
$('sT').addEventListener('input',e=>setT(+e.target.value));
$('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
$('sSel').addEventListener('input',e=>setSel(+e.target.value));

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  baseM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('荧光棒 · 断键直接放光子','Chemiluminescence');
  setSel(sel);buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,playing=qs.get('pause')!=='1',labelsOn=qs.get('labels')!=='0';
function frame(){
  raf=requestAnimationFrame(frame);
  const raw=clamp(clock.getDelta(),0,0.05);
  const dt=playing?raw*SPEED*timeMul:0;
  simT+=raw;
  /* 掰断动画 */
  if(snapDelay>0){snapDelay-=dt;if(snapDelay<=0){doSnap(0);doSnap(1);doSnap(2);snapDelay=-1;}}
  for(let i=0;i<3;i++){
    if(snapT[i]>=0){
      snapT[i]+=dt/0.7;
      const t=snapT[i];
      if(t<1)stickG[i].rotation.z=0.22*Math.sin(Math.PI*t);
      else{stickG[i].rotation.z=0;snapT[i]=-1;}
    }
    if(snapped[i]){
      mixT[i]=Math.min(1,mixT[i]+dt/2.5);
      R[i]=Math.max(0,R[i]-kOf(tempOf(i))*R[i]*dt);
    }
    bright[i]=mixT[i]*kOf(tempOf(i))*R[i]/kN;
  }
  /* 视觉:发光强度 / 反应物条 / 灯光 */
  for(let i=0;i<3;i++){
    const b=clamp(bright[i],0,14);
    liqMats[i].emissiveIntensity=clamp(0.05+0.95*Math.sqrt(b),0.05,2.6)*(1+0.06*Math.sin(simT*7+i*2));
    bars[i].scale.y=Math.max(R[i],0.002);
    lights[i].intensity=b*0.3;
  }
  hotCup.visible=coldCup.visible=compare;
  boardG.visible=tglLevelEl.checked;
  updPacks(dt);updShards(dt);
  acc+=raw;
  if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){const vis=labelsOn&&r.vis();r.o.visible=vis;if(vis)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();
buildSteps();
applyLang();
setT(22);setSpd(1);setSel(0);
const t0=Math.round(parseFloat(qs.get('t')));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
if(qs.get('pause')==='1')playing=false;
$('tglLabels').checked=labelsOn;
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
