<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>遗传漂变 · 没有选择,骰子也能定生死</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#f783ac;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c2255c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(247,131,172,.6);background:rgba(247,131,172,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(194,37,92,.55);background:rgba(194,37,92,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(247,131,172,.10);border-color:rgba(247,131,172,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(194,37,92,.08);border-color:rgba(194,37,92,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffd3e2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* fixation 全屏淹没 + 敲钟涟漪 */
  #fx{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0}
  #ring{position:fixed;left:50%;top:44%;width:42vmin;height:42vmin;margin:-21vmin 0 0 -21vmin;
    border:3px solid #fff;border-radius:50%;pointer-events:none;opacity:0;transform:scale(.15);z-index:9}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="遗传漂变 · 没有选择,骰子也能定生死" data-en="Genetic Drift · dice decide, no selector needed">遗传漂变 · 没有选择,骰子也能定生死</h1>
  <div class="sub" data-zh="等位基因频率每代都是一次二项抽样——纯随机的走步:大种群抖幅 1/√(2N) 窄窄的,小种群几十代就撞死在 0 或 1;瓶颈与奠基者把频率随手重掷。与选择对照:选择有方向,漂变只有运气 · 拖动旋转 / 空格运行/暂停" data-en="Allele frequency is redrawn each generation by one binomial draw — a pure random walk: big populations wobble within 1/√(2N), small ones slam into 0 or 1 within dozens of generations; bottlenecks and founders reroll the dice outright. Against selection: selection has a direction, drift has only luck · drag to orbit / Space = run/pause">等位基因频率每代都是一次二项抽样——纯随机的走步:大种群抖幅 1/√(2N) 窄窄的,小种群几十代就撞死在 0 或 1;瓶颈与奠基者把频率随手重掷。与选择对照:选择有方向,漂变只有运气 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

      <label><input id="tglCurve" type="checkbox" checked> <span data-zh="频率曲线" data-en="Freq. curve">频率曲线</span></label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const ease=x=>x*x*(3-2*x);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,32,95);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,5.6,13.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 场景:地面 / 双世界平台 / 分界线 / 奠基者台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(34,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
const platM=new THREE.MeshStandardMaterial({color:0x232a34,roughness:0.9});
const platGeo=new THREE.BoxGeometry(9.9,0.24,4.9);
const divM=new THREE.MeshBasicMaterial({color:0xf783ac,transparent:true,opacity:0.32});
const divider=new THREE.Mesh(new THREE.BoxGeometry(10.3,0.03,0.05),divM);
divider.position.set(0,0.26,0);scene.add(divider);
const podDisc=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.15,0.08,24),
  new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.8}));
podDisc.position.set(0,0.04,6.35);podDisc.visible=false;scene.add(podDisc);

/* ---- 双色小球:两个平行世界各一份 InstancedMesh ---- */
const NMAX=200,PERROW=20,SX=0.46,SZ=0.44;
const ballGeo=new THREE.SphereGeometry(0.14,10,8);
const ballM=new THREE.MeshStandardMaterial({roughness:0.35,metalness:0.08});
const cA=new THREE.Color(0xf783ac),cB=new THREE.Color(0x74c0fc),tmpC=new THREE.Color();
const worlds=[
 {isSel:true ,z:-3.45,arr:null,base:[],al:new Uint8Array(NMAX),p:0.5,k:0,fixed:0,head:0,count:0},
 {isSel:false,z: 3.45,arr:null,base:[],al:new Uint8Array(NMAX),p:0.5,k:0,fixed:0,head:0,count:0},
];
for(const w of worlds){
  w.group=new THREE.Group();scene.add(w.group);
  const pl=new THREE.Mesh(platGeo,platM);pl.position.set(0,0.12,w.z);w.group.add(pl);
  w.mesh=new THREE.InstancedMesh(ballGeo,ballM,NMAX);
  w.mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NMAX*3),3);
  w.mesh.frustumCulled=false;w.group.add(w.mesh);
  w.cluster=new THREE.Vector3(0,0.45,w.z);
  for(let i=0;i<NMAX;i++){
    const r=Math.floor(i/PERROW),c=i%PERROW;
    w.base.push({x:-4.37+c*SX,y:0.42,z:w.z-1.98+r*SZ});
  }
}
const founderPt=new THREE.Vector3(0,0.5,6.35);
const m4=new THREE.Matrix4(),v3=new THREE.Vector3(),s3=new THREE.Vector3(),q0=new THREE.Quaternion();

/* ---- 图板:频率折线(双世界) + 频率直方图 ---- */
function makeBoard(w,h,pos,rotY){
  const g=new THREE.Group();g.position.copy(pos);g.rotation.y=rotY;
  const bd=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.06),
    new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
  g.add(bd);scene.add(g);return g;
}
const curveBoard=makeBoard(5.0,2.5,new THREE.Vector3(6.4,4.3,-0.6),-0.5);
const histBoard=makeBoard(5.0,2.5,new THREE.Vector3(-6.4,4.3,-0.6),0.5);
const cg=new THREE.LineBasicMaterial({color:0x3a4656});
for(const y of [0.85,0,-0.85]){
  curveBoard.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-2.15,y,0.055),new THREE.Vector3(2.15,y,0.055)]),cg));
}
histBoard.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(-2.15,-0.95,0.055),new THREE.Vector3(-2.15,0.95,0.055),new THREE.Vector3(2.15,0.95,0.055)]),cg));
const CURVE_N=90;
const selHist=new Float32Array(CURVE_N).fill(0.5);
const drfHist=new Float32Array(CURVE_N).fill(0.5);
worlds[0].arr=selHist;worlds[1].arr=drfHist;
const selLine=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffd43b}));
selLine.position.z=0.06;curveBoard.add(selLine);
const drfLine=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x74c0fc}));
drfLine.position.z=0.06;curveBoard.add(drfLine);
const HB=14;
const histBars=new THREE.InstancedMesh(new THREE.BoxGeometry(0.30,1,0.12),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0.95}),HB);
histBars.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(HB*3),3);
histBars.frustumCulled=false;histBoard.add(histBars);
const histCounts=new Array(HB).fill(0);
const histHeights=new Float32Array(HB),histTargets=new Float32Array(HB);
function layoutHist(){
  for(let i=0;i<HB;i++){
    const h=Math.max(0.02,histHeights[i]*1.8);
    m4.makeScale(1,h,1);m4.setPosition(-2.05+i*0.315,-0.95+h/2,0.06);
    histBars.setMatrixAt(i,m4);
    tmpC.copy(cB).lerp(cA,(i+0.5)/HB);
    histBars.setColorAt(i,tmpC);
  }
  histBars.instanceMatrix.needsUpdate=true;
  histBars.instanceColor.needsUpdate=true;
}

/* ---- 状态与 URL 参数 ---- */
let playing=true,labelsOn=true,simT=0;
let N=120,selC=0,gen=0,genTimer=0;const GEN_PERIOD=1.0;
let selWorldOn=true,noFx=false,lastFx=0,alleleDirty=true;
const anim={mode:'none',t:0,done:false};
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 遗传模型:每代一次二项抽样 ---- */
function binomialSample(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k;}
function rebuildAlleles(w,k){
  k=clamp(Math.round(k),0,N);
  const a=w.al;
  for(let i=0;i<N;i++)a[i]=i<k?1:0;
  for(let i=N-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}
  w.k=k;w.p=k/N;
}
function pushCurve(w){w.arr[w.head]=w.p;w.head=(w.head+1)%CURVE_N;w.count=Math.min(CURVE_N,w.count+1);}
function curvePts(w){
  const pts=[];
  for(let j=0;j<w.count;j++){
    const idx=((w.head-w.count+j)%CURVE_N+CURVE_N)%CURVE_N;
    pts.push(new THREE.Vector3(-2.05+j/(CURVE_N-1)*4.1,(w.arr[idx]-0.5)*1.7,0));
  }
  return pts;
}
function drawCurve(){
  selLine.geometry.setFromPoints(curvePts(worlds[0]));
  drfLine.geometry.setFromPoints(curvePts(worlds[1]));
}
/* fixation 签名瞬间:单色淹没全屏 + 敲钟涟漪 */
function fireFx(hex){
  const now=performance.now();
  if(now-lastFx<1000)return;lastFx=now;
  const fx=document.getElementById('fx'),ring=document.getElementById('ring');
  fx.style.background=hex;fx.style.transition='none';fx.style.opacity=0.78;
  ring.style.borderColor=hex;ring.style.transition='none';
  ring.style.transform='scale(0.15)';ring.style.opacity=0.95;
  void fx.offsetWidth;
  fx.style.transition='opacity 1.4s ease';fx.style.opacity=0;
  ring.style.transition='transform 1.15s cubic-bezier(.2,.7,.3,1),opacity 1.15s ease';
  ring.style.transform='scale(2.8)';ring.style.opacity=0;
}
function onFixation(w){if(!noFx)fireFx(w.fixed>0?'#f783ac':'#74c0fc');}
function syncHistTargets(){
  const mx=Math.max(1,...histCounts);
  for(let i=0;i<HB;i++)histTargets[i]=histCounts[i]/mx;
}
function runGeneration(){
  gen++;
  for(const w of worlds){
    if(w.fixed!==0){w.p=w.fixed>0?1:0;pushCurve(w);continue;}
    let pp=w.p;
    if(w.isSel&&selC>0)pp=pp*(1+selC)/(1+selC*pp);
    rebuildAlleles(w,binomialSample(N,pp));
    if(w.k===0){w.fixed=-1;onFixation(w);}
    else if(w.k===N){w.fixed=1;onFixation(w);}
    pushCurve(w);
  }
  alleleDirty=true;
  histCounts[Math.min(HB-1,Math.max(0,Math.floor(worlds[1].p*HB)))]++;
  syncHistTargets();drawCurve();
}
function resetAll(p=0.5){
  gen=0;genTimer=0;
  for(const w of worlds){w.fixed=0;w.head=0;w.count=0;rebuildAlleles(w,Math.round(p*N));}
  selHist.fill(0.5);drfHist.fill(0.5);
  histCounts.fill(0);histHeights.fill(0);histTargets.fill(0);
  alleleDirty=true;syncHistTargets();layoutHist();drawCurve();updateStats();
}
function runToFixation(){
  noFx=true;let guard=0;
  while(worlds[1].fixed===0&&guard++<800)runGeneration();
  noFx=false;
  if(worlds[1].fixed!==0){lastFx=0;fireFx(worlds[1].fixed>0?'#f783ac':'#74c0fc');}
}
/* 瓶颈/奠基:种群瞬间收缩的动画 */
function startAnim(mode){
  if(anim.mode!=='none')return;
  anim.mode=mode;anim.t=0;anim.done=false;
  podDisc.visible=(mode==='founder');
}
function animConv(){
  if(anim.mode==='none')return 0;
  const T1=0.7,T2=0.6;
  if(anim.t<T1)return ease(anim.t/T1);
  const r=(anim.t-T1)/T2;
  return r>=1?0:1-ease(r);
}
function placeBalls(t){
  const conv=animConv();
  for(const w of worlds){
    const cl=anim.mode==='founder'?founderPt:w.cluster;
    for(let i=0;i<NMAX;i++){
      if(i>=N){m4.makeScale(0,0,0);m4.setPosition(0,-9,0);w.mesh.setMatrixAt(i,m4);continue;}
      const b=w.base[i];
      v3.set(b.x+(cl.x-b.x)*conv,
        b.y+(cl.y-b.y)*conv+0.02*Math.sin(t*2.0+i*1.7)*(1-conv),
        b.z+(cl.z-b.z)*conv);
      s3.setScalar(1-0.68*conv);
      m4.compose(v3,q0,s3);
      w.mesh.setMatrixAt(i,m4);
    }
    w.mesh.instanceMatrix.needsUpdate=true;
  }
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`选择世界 · s=${selC.toFixed(2)},适应度推着频率走`,
    `Selection world · s=${selC.toFixed(2)}: fitness pushes p`),
  new THREE.Vector3(0,3.55,-3.45),'y',()=>selWorldOn);
addLabel(()=>L('漂变世界 · 每代纯掷硬币','Drift world · pure coin flips every generation'),
  new THREE.Vector3(0,3.55,3.45),'b');
addLabel(()=>L('二项抽样:N 个配子,各掷一次硬币','Binomial sampling: N gametes, one coin each'),
  new THREE.Vector3(0,4.8,0),'r');
addLabel(()=>L(`抖幅 1/√(2N) ≈ ${(1/Math.sqrt(2*N)).toFixed(3)}`,
    `Swing 1/√(2N) ≈ ${(1/Math.sqrt(2*N)).toFixed(3)}`),
  new THREE.Vector3(6.4,6.0,-0.6),'y');
addLabel(()=>L('瓶颈 / 奠基:幸存者重掷一次频率','Bottleneck / founders: survivors reroll p'),
  new THREE.Vector3(0,1.45,6.35),'o',()=>anim.mode!=='none');
addLabel(()=>L('单色 fixation:多样性归零','Single-color fixation: zero diversity'),
  new THREE.Vector3(-6.4,6.0,-0.6),'g',()=>worlds[1].fixed!==0);
addLabel(()=>L('选择世界','Selection'),new THREE.Vector3(-1.5,1.02,0.1),'y',()=>selWorldOn,curveBoard);
addLabel(()=>L('漂变世界','Drift'),new THREE.Vector3(1.5,1.02,0.1),'b',()=>true,curveBoard);
addLabel(()=>L('频率 p:0 ←→ 1','frequency p: 0 ←→ 1'),new THREE.Vector3(0,-1.18,0.1),'',()=>true,histBoard);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'大种群:抖幅 1/√(2N),曲线窄幅抖动',en:'Large population: jitter ~1/√(2N), a narrow wiggle',
  act(){setN(200);setSel(0);resetAll(0.5);}},
 {zh:'缩小种群:同样的骰子,抖幅当场放大',en:'Shrink the population: same dice, swings blow up',
  act(){setN(14);setSel(0);resetAll(0.5);}},
 {zh:'fixation:撞上 0 或 1,单色淹没',en:'Fixation: hit 0 or 1 — one color floods all',
  act(){setN(14);setSel(0);resetAll(0.5);runToFixation();}},
 {zh:'瓶颈事件:随机幸存者把频率重置',en:'Bottleneck: random survivors reset the frequency',
  act(){setN(160);setSel(0);resetAll(0.5);for(let i=0;i<6;i++)runGeneration();startAnim('bneck');}},
 {zh:'奠基者效应:一小撮开拓者,偏斜的起点',en:'Founder effect: a small band starts with a skewed p',
  act(){setN(160);setSel(0);resetAll(0.5);startAnim('founder');}},
 {zh:'与自然选择对照:选择有方向,漂变只有运气',en:'vs. natural selection: selection aims, drift just rolls',
  act(){setN(200);setSel(0.3);resetAll(0.5);
    if(!selWorldOn){selWorldOn=true;document.getElementById('tglSel').checked=true;applySelWorldVis();}}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const w=worlds[1];
  document.getElementById('stGen').textContent=gen;
  document.getElementById('stP').innerHTML=(w.p*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stH').innerHTML=(2*w.p*(1-w.p)).toFixed(2);
  const fe=document.getElementById('stFix');
  if(w.fixed===0){fe.textContent=L('未固定','not fixed');fe.className='v';}
  else if(w.fixed>0){fe.textContent=L('A 固定','A fixed');fe.className='v ok';}
  else{fe.textContent=L('B 固定','B fixed');fe.className='v warn';}
}

/* ---- 控件 ---- */
function setN(v){
  N=clamp(Math.round(v),8,200);
  document.getElementById('sN').value=N;
  document.getElementById('sNVal').textContent=String(N);
  for(const w of worlds){
    rebuildAlleles(w,Math.round(w.p*N));
    w.fixed=w.k===0?-1:(w.k===N?1:0);
  }
  alleleDirty=true;updateStats();
}
function setSel(v){
  selC=clamp(v,0,0.5);
  document.getElementById('sSel').value=selC;
  document.getElementById('sSelVal').textContent=selC.toFixed(2);
}
function applySelWorldVis(){
  worlds[0].group.visible=selWorldOn;
  selLine.visible=selWorldOn;
}
let slowMo=false;
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bBneck').addEventListener('click',()=>startAnim('bneck'));
document.getElementById('bFounder').addEventListener('click',()=>startAnim('founder'));
document.getElementById('bReset').addEventListener('click',()=>resetAll(0.5));
document.getElementById('sN').addEventListener('input',e=>setN(+e.target.value));
document.getElementById('sSel').addEventListener('input',e=>setSel(+e.target.value));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCurve').addEventListener('change',e=>{curveBoard.visible=e.target.checked;});
document.getElementById('tglHist').addEventListener('change',e=>{histBoard.visible=e.target.checked;});
document.getElementById('tglSel').addEventListener('change',e=>{selWorldOn=e.target.checked;applySelWorldVis();});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  platM.color.setHex(dark?0x232a34:0xc9c2ba);
  divM.color.setHex(dark?0xf783ac:0xc2255c);
  divM.opacity=dark?0.32:0.5;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(anim.mode!=='none'){
    anim.t+=dt;
    if(!anim.done&&anim.t>=0.7){
      anim.done=true;
      const nf=anim.mode==='founder'?5:Math.max(4,Math.round(N*0.1));
      for(const w of worlds){
        const kf=binomialSample(nf,w.p);
        rebuildAlleles(w,Math.round(kf/nf*N));
        w.fixed=w.k===0?-1:(w.k===N?1:0);
        pushCurve(w);
      }
      alleleDirty=true;syncHistTargets();drawCurve();updateStats();
    }
    if(anim.t>=1.45){anim.mode='none';podDisc.visible=false;}
  }else{
    genTimer+=dts;
    if(genTimer>=GEN_PERIOD){genTimer=0;runGeneration();}
  }
  placeBalls(simT);
  if(alleleDirty){
    for(const w of worlds){
      for(let i=0;i<N;i++)w.mesh.setColorAt(i,w.al[i]?cA:cB);
      w.mesh.instanceColor.needsUpdate=true;
    }
    alleleDirty=false;
  }
  let hDirty=false;
  for(let i=0;i<HB;i++){
    const d=histTargets[i]-histHeights[i];
    if(Math.abs(d)>0.001){histHeights[i]+=d*Math.min(1,dt*3);hDirty=true;}
  }
  if(hDirty)layoutHist();
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applySelWorldVis();buildSteps();
resetAll(0.5);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
