const flyD=[];for(let i=0;i<NFLY;i++)flyD.push({t:9,x:0,y:0,z:0,vx:0,vy:0,vz:0});
const watD=[];for(let i=0;i<NWAT;i++)watD.push({st:0,io:null,k:0,hx:4.6+Math.random()*2.6,hy:0.6+Math.random()*3.6,hz:(Math.random()-0.5)*2.6});
const m4=new THREE.Matrix4();
/* 状态 */
let mode='pair',Tg=300,slip=0,watN=26,showCoord=true,playing=true,labelsOn=true,slowMo=false;
let pairT=0,transferred=false,transferT=0,pairDist=3.9,pairV=0,growthT=99,cracked=false,latFac=1,dissolved=0,watRest=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function ionWorld(io){
  let px=(io.x-1)*CELL,py=LATY+(io.y-1)*CELL,pz=(io.z-1)*CELL;
  if(io.y===2&&io.drag===0)px+=slip*CELL;
  if(io.drag>0&&io.dDir){px+=io.dDir.x*io.drag;py+=io.dDir.y*io.drag;pz+=io.dDir.z*io.drag;}return {x:px,y:py,z:pz};}
function centerCoord(){let c=0;
  for(const d of DIRS){const io=ionAt(1+d[0],1+d[1],1+d[2]);if(io&&!io.diss&&io.fl===null)c++;}
  return c;}
function surfaceIon(){/* 优先外层离子,中心最后溶 */
  let best=null;
  for(const io of ions){
    if(io===centerIon||io.diss||io.fl!==null||io.tgt)continue;
    if(io.x===0||io.x===2||io.y===0||io.y===2||io.z===0||io.z===2){best=io;if(Math.random()<0.25)break;}}
  if(!best&&!centerIon.tgt&&!centerIon.diss&&centerIon.fl===null)best=centerIon;if(best){best.tgt=true;best.drag=0;
    const v=new THREE.Vector3((best.x-1)*CELL,LATY+(best.y-1)*CELL,(best.z-1)*CELL);
    best.dDir=v.lengthSq()>0.01?v.normalize():new THREE.Vector3(0.55,0.65,0.35).normalize();}
  return best;}
function triggerCrack(){cracked=true;latFac=0.62;let fi=0;
  for(const io of ions){
    if(fi>=NFLY)break;
    if(io.y===2&&io.fl===null&&(io.x!==1||io.z!==1)){
      io.fl=fi;const c=flyD[fi],w=ionWorld(io);c.t=0;c.x=w.x;c.y=w.y;c.z=w.z;
      c.vx=(io.x-1)*2.4+(Math.random()-0.5);c.vy=2.6+Math.random()*1.6;c.vz=(io.z-1)*2.4+(Math.random()-0.5);
      fi++;}}
  flyMesh.visible=true;updateStats();}
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const naLbl=addLabel(()=>transferred?L('Na⁺ 阳离子:少了 1 个电子','Na+ cation: one electron short'):L('钠 Na:2·8·1,交出 1 个电子','Sodium Na: 2·8·1, gives up one electron'),new THREE.Vector3(-2.35,3.1,0),'b',()=>mode==='pair');
const clLbl=addLabel(()=>transferred?L('Cl⁻ 阴离子:多收 1 个电子','Cl- anion: one electron richer'):L('氯 Cl:3p⁵,只差 1 个','Chlorine Cl: 3p\u2075, one short of full'),new THREE.Vector3(3.45,3.2,0),'g',()=>mode==='pair');
const eLbl=addLabel(()=>L('电子转移 e⁻','Electron transfer e\u207B'),new THREE.Vector3(0,3.1,0),'r',()=>mode==='pair'&&transferred&&transferT<0.92);
const fLbl=addLabel(()=>L('静电引力:F = k·q₁q₂/r²','Electrostatic pull: F = k·q\u2081q\u2082/r\u00B2'),new THREE.Vector3(0,2.55,0),'y',()=>mode==='pair'&&bond.visible);
const cLbl=addLabel(()=>L('六配位:6 个 Cl⁻ 等距围住 1 个 Na⁺','Six-coordination: 6 Cl- box one Na+ evenly'),new THREE.Vector3(0,LATY+1.55,0),'b',()=>mode==='lattice'&&showCoord&&!cracked&&growthT>2.75);
const sLbl=addLabel(()=>L(`错位面:滑移 ${slip.toFixed(2)} 格`,`Slip plane: offset ${slip.toFixed(2)} cell`),new THREE.Vector3(1.7,LATY+0.95,0),'o',()=>mode!=='pair'&&slip>0.04);
const lLbl=addLabel(()=>L('晶格能 = 远近所有 ± 引力斥力求和 ≈ 787 kJ/mol','Lattice energy = sum of every \u00B1 pull & push \u2248 787 kJ/mol'),new THREE.Vector3(0,LATY+2.25,0),'y',()=>mode==='lattice'&&growthT>2.75);
const wLbl=addLabel(()=>L('极性水分子:水合把离子一个个拖走','Polar water: hydration drags the ions away'),new THREE.Vector3(4.8,4.0,0),'b',()=>mode==='water');
function setT(v){Tg=clamp(v,50,1200);document.getElementById('sT').value=Tg;document.getElementById('sTVal').textContent=Tg.toFixed(0)+' K';updateStats();}
function setSlip(v){slip=clamp(v,0,0.5);document.getElementById('sSlip').value=slip;document.getElementById('sSlipVal').textContent=slip.toFixed(2)+' 格';updateStats();}
function setWat(v){watN=clamp(Math.round(v),0,NWAT);document.getElementById('sWat').value=watN;document.getElementById('sWatVal').textContent=watN+' 个';updateStats();}
function resetPair(){pairT=0;transferred=false;transferT=0;pairDist=3.9;pairV=0;
  naSign.visible=clSign.visible=electron.visible=false;bond.visible=arrL.visible=arrR.visible=false;updateStats();}
function skipBond(){transferred=true;transferT=1.0;pairDist=3.6;pairV=0;naSign.visible=clSign.visible=true;updateStats();}
function resetLattice(grow){cracked=false;latFac=1;dissolved=0;watRest=0;flyD.forEach(c=>c.t=9);flyMesh.visible=false;
  ions.forEach(io=>{io.fl=null;io.diss=false;io.drag=0;io.tgt=false;io.dDir=null;});growthT=grow?0:99;updateStats();}
function resetWater(){dissolved=0;watRest=0;watD.forEach(w=>{w.st=0;w.io=null;w.k=0;});
  ions.forEach(io=>{io.diss=false;io.drag=0;io.tgt=false;io.dDir=null;});updateStats();}
function setMode(m){mode=m;
  document.getElementById('bPair').classList.toggle('on',m==='pair');
  document.getElementById('bLat').classList.toggle('on',m==='lattice');
  document.getElementById('bWater').classList.toggle('on',m==='water');
  naMesh.visible=clMesh.visible=(m!=='pair');watMesh.visible=(m==='water');
  if(m==='pair')resetPair();
  if(m==='lattice'&&(cracked||dissolved>0))resetLattice(false);
  if(m==='water'){resetLattice(false);resetWater();}
  updateStats();}
function resetAll(){if(mode==='pair')resetPair();
  else if(mode==='lattice'){resetLattice(false);setSlip(0);}
  else{resetLattice(false);resetWater();}}
const STEPS=[
 {zh:'电子转移:钠交出、氯收下',en:'Electron transfer: Na gives, Cl takes',act(){setMode('pair');resetPair();}},
 {zh:'吸引 vs 排斥:平衡出键长',en:'Attraction vs repulsion: balance sets the bond length',act(){setMode('pair');skipBond();}},
 {zh:'三维堆积:6 配位,不搞配对',en:'3D stacking: six neighbours, no pairing',act(){setMode('lattice');resetLattice(true);setSlip(0);}},
 {zh:'晶格能:把整块拆散的总价',en:'Lattice energy: the bill for dismantling it all',act(){setMode('lattice');resetLattice(false);setSlip(0);}},
 {zh:'剪切错位:同号相见,当场劈开',en:'Shear slip: like meets like, it splits',act(){setMode('lattice');resetLattice(false);setSlip(0.5);}},
 {zh:'遇水就化:水分子拆账单',en:'Water pays the bill off, ion by ion',act(){setMode('water');resetWater();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}
function updateStats(){
  const bEl=document.getElementById('stBond');
  if(mode==='pair'){bEl.innerHTML=clamp(pairDist/2.35*236,100,900).toFixed(0)+'<small> pm</small>';bEl.className='v';}
  else{bEl.innerHTML='282<small> pm</small>';bEl.className='v ok';}
  const lEl=document.getElementById('stLat');
  if(mode==='pair'){lEl.textContent='—';lEl.className='v';}
  else{const lat=787*(mode==='water'?clamp(1-dissolved/27,0.02,1):latFac);
    lEl.innerHTML=lat.toFixed(0)+'<small> kJ/mol</small>';lEl.className='v '+(lat<760?'warn':'ok');}
  const cEl=document.getElementById('stCn');
  if(mode==='pair'){cEl.textContent='1';cEl.className='v';}
  else{const c=centerCoord();cEl.textContent=c;cEl.className='v '+(c===6?'ok':'warn');}
  const tEl=document.getElementById('stT');
  tEl.innerHTML=Tg.toFixed(0)+'<small> K</small>';tEl.className='v '+(Tg>900?'warn':'');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bPair').addEventListener('click',()=>setMode('pair'));document.getElementById('bLat').addEventListener('click',()=>setMode('lattice'));
document.getElementById('bWater').addEventListener('click',()=>setMode('water'));document.getElementById('bReset').addEventListener('click',resetAll);
document.getElementById('sT').addEventListener('input',e=>setT(+e.target.value));document.getElementById('sSlip').addEventListener('input',e=>setSlip(+e.target.value));
document.getElementById('sWat').addEventListener('input',e=>setWat(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCoord').addEventListener('change',e=>{showCoord=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const vib=0.05*Math.sqrt(Tg/300);
  naAtom.visible=clAtom.visible=(mode==='pair');
  coordGrp.visible=false;slipPlane.visible=false;
  /* 幕A:单对成键 */
  if(mode==='pair'){
    naAtom.scale.setScalar(1+0.02*Math.sin(simT*3.1));clAtom.scale.setScalar(1+0.02*Math.sin(simT*3.7+1));
    if(!transferred){
      pairT+=dts;
      const p=clamp(pairT/2.2,0,1),e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      naAtom.position.set(-2.45+1.05*e,1.75,0);clAtom.position.set(3.45-0.95*e,1.75,0);
      if(pairT>=2.2){transferred=true;transferT=0;}
    }else{
      transferT+=dts;const ft=clamp(transferT/0.9,0,1);
      electron.visible=ft<1;
      if(ft<1)electron.position.set(naAtom.position.x+(clAtom.position.x-naAtom.position.x)*ft,1.75+Math.sin(Math.PI*ft)*0.85,0);
      naSign.visible=clSign.visible=ft>=0.99;
      if(ft>=1){pairV+=(2.35-pairDist)*10*dts;pairV*=Math.exp(-2.6*dts);pairDist+=pairV*dts;
        naAtom.position.set(-pairDist/2+0.55,1.75,0);clAtom.position.set(pairDist/2+0.55,1.75,0);}
    }
    bond.visible=transferred&&transferT>0.95&&pairDist<3.4;
    if(bond.visible){bond.position.set((naAtom.position.x+clAtom.position.x)/2,1.75,0);bond.scale.y=pairDist-0.7;}
    const settled=bond.visible&&Math.abs(pairDist-2.35)<0.35;arrL.visible=arrR.visible=settled;
    if(settled){const pu=1+0.15*Math.sin(simT*6);arrL.scale.setScalar(pu);arrR.scale.setScalar(pu);
      arrL.position.set(naAtom.position.x-0.85,1.75,0);arrR.position.set(clAtom.position.x+0.95,1.75,0);}
  }else{electron.visible=false;bond.visible=false;arrL.visible=arrR.visible=false;}
  /* 幕B:晶格生长 / 热振动 / 剪切错位 */
  if(mode!=='pair'){
    growthT+=dts;
    ions.forEach(io=>{
      const pop=clamp((growthT-io.y*0.8)/0.35,0,1);
      if(io.fl!==null||io.diss||pop<=0.001){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
      else{const w=ionWorld(io);
        let px=w.x,py=w.y,pz=w.z;
        if(io.drag===0){px+=vib*Math.sin(simT*8.3+io.ph);py+=vib*Math.sin(simT*6.7+io.ph*1.7);pz+=vib*Math.cos(simT*7.5+io.ph*0.9);}
        m4.makeScale(pop,pop,pop);m4.setPosition(px,py,pz);}
      (io.na?naMesh:clMesh).setMatrixAt(io.mi,m4);
    });
    naMesh.instanceMatrix.needsUpdate=true;clMesh.instanceMatrix.needsUpdate=true;
    const clash=slip>0.28?clamp((slip-0.28)/0.22,0,1):0,fl=0.5+0.5*Math.sin(simT*14);
    naMatL.emissiveIntensity=0.15+clash*(0.45+0.35*fl)+(cracked?0.08*fl:0);clMatL.emissiveIntensity=0.12+clash*(0.45+0.35*fl)+(cracked?0.08*fl:0);
    slipPlane.visible=slip>0.04;slipPlane.position.y=LATY+CELL*0.5;slipPlane.material.opacity=0.08+clash*0.28;
    coordGrp.visible=mode==='lattice'&&showCoord&&!cracked&&growthT>2.75;
    if(mode==='lattice'&&!cracked&&slip>0.42)triggerCrack();
    flyMesh.visible=cracked;
    if(cracked){
      for(let i=0;i<NFLY;i++){const c=flyD[i];
        if(c.t<3){c.t+=dts;c.vy-=6*dts;c.x+=c.vx*dts;c.y+=c.vy*dts;c.z+=c.vz*dts;
          if(c.y<0.4){c.y=0.4;c.vy*=-0.35;c.vx*=0.72;c.vz*=0.72;}
          m4.makeScale(1,1,1);}
        else m4.makeScale(0.001,0.001,0.001);
        m4.setPosition(c.x,c.y,c.z);flyMesh.setMatrixAt(i,m4);}
      flyMesh.instanceMatrix.needsUpdate=true;
    }
  }
  /* 第⑥步:遇水溶解 */
  if(mode==='water'){
    watD.forEach((wd,i)=>{
      if(wd.io&&i>=watN&&wd.st<3){wd.io.tgt=false;wd.io.drag=0;wd.io.dDir=null;wd.io=null;wd.st=0;}
      let s=0.001,px=wd.hx,py=wd.hy,pz=wd.hz;
      if(i<watN&&wd.st===0){const io=surfaceIon();if(io){wd.io=io;wd.dx=io.dDir.x;wd.dy=io.dDir.y;wd.dz=io.dDir.z;wd.st=1;wd.k=0;}}
      if(wd.st===1){const io=wd.io;wd.k+=dts/1.15;const iw=ionWorld(io);
        const e=wd.k<1?(wd.k<0.5?2*wd.k*wd.k:1-Math.pow(-2*wd.k+2,2)/2):1;
        px=wd.hx+(iw.x+wd.dx*0.5-wd.hx)*e;py=wd.hy+(iw.y+wd.dy*0.5-wd.hy)*e;pz=wd.hz+(iw.z+wd.dz*0.5-wd.hz)*e;
        s=1;if(wd.k>=1)wd.st=2;}
      else if(wd.st===2){const io=wd.io;io.drag+=dts*1.35;const iw=ionWorld(io);
        px=iw.x+wd.dx*0.5+0.06*Math.sin(simT*9+i);py=iw.y+wd.dy*0.5+0.06*Math.cos(simT*7.3+i);pz=iw.z+wd.dz*0.5;s=1;
        if(io.drag>3.4){io.diss=true;dissolved++;wd.st=3;wd.k=0;}}
      else if(wd.st===3){const io=wd.io;wd.k+=dts/1.1;const iw=ionWorld(io);
        px=iw.x+wd.dx*(0.5+wd.k*2.5);py=iw.y+wd.dy*(0.5+wd.k*2.5)+wd.k*0.8;pz=iw.z+wd.dz*(0.5+wd.k*2.5);s=1;
        if(wd.k>=1){wd.st=0;wd.io=null;}}
      m4.makeScale(s,s,s);m4.setPosition(px,py,pz);watMesh.setMatrixAt(i,m4);
    });
    watMesh.instanceMatrix.needsUpdate=true;
    if(dissolved>=26){watRest+=dts;if(watRest>2.2)resetWater();}
  }
  /* 标签跟随 */
  naLbl.position.set(naAtom.position.x,3.1,0);clLbl.position.set(clAtom.position.x,3.2,0);
  eLbl.position.set(electron.position.x,electron.position.y+0.4,0);fLbl.position.set((naAtom.position.x+clAtom.position.x)/2,2.55,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
labelsOn=!(qs.get('labels')==='0');document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}else{applyPhase(0);}
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
