<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝叶斯筛查 · 阳性≠患病</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.85);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.9);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(127,208,247,.9); color: #bde9ff; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; }
  .lbl.cap { border-color: var(--acc); color: var(--acc); font-size: 14px; font-weight: 700; padding: 7px 14px; }
  .lbl.pill { border-color: var(--acc); border-radius: 16px; padding: 11px 20px;
    text-align: center; white-space: normal; line-height: 1.5; }
  .lbl.pill .big { font-size: 19px; font-weight: 700; color: #35d07f; }
  :root[data-theme="light"] .lbl.pill .big { color: #0f7a44; }
  .lbl.pill .small { font-size: 12px; color: var(--text2); }
  .lbl.fx { white-space: normal; text-align: center; line-height: 1.7; padding: 8px 14px; border-radius: 12px; }
  .lbl.fx .num { color: var(--acc); font-weight: 700; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 430px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 5px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.f { color: #ff9f43; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #ff8a80; border-color: rgba(255,138,128,.7); }
  .chip.t { color: #7ee2ae; border-color: rgba(53,208,127,.7); }
  .chip.f { color: #ffb86b; border-color: rgba(255,159,67,.7); }
  .chip.n { color: var(--text2); border-color: var(--tool-border); }
  :root[data-theme="light"] .chip.s { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.t { color: #0f7a44; border-color: rgba(15,122,68,.7); }
  :root[data-theme="light"] .chip.f { color: #9c6200; border-color: rgba(156,98,0,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 64px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: flex; flex-direction: column; gap: 6px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { padding: 9px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .crow .val { font-size: 11.5px; color: var(--text3); flex: 0 0 34px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="贝叶斯筛查:阳性 ≠ 患病——99% 灵敏度被基率淹没" data-en="Bayes screening: positive ≠ sick — 99% sensitivity drowned by the base rate">贝叶斯筛查:阳性 ≠ 患病——99% 灵敏度被基率淹没</h1>
  <div class="sub" data-zh="患病率 0.1% × 灵敏度 99% × 假阳性率 5%:1000 人筛查约 51 人阳性,真患者只有 ~1 人,P(病|阳) ≈ 1.9% · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Prevalence 0.1%, sensitivity 99%, false positives 5%: screening 1,000 people → ~51 positives, only ~1 truly sick, P(sick|+) ≈ 1.9% · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">患病率 0.1% × 灵敏度 99% × 假阳性率 5%:1000 人筛查约 51 人阳性,真患者只有 ~1 人,P(病|阳) ≈ 1.9% · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="真患者 / 健康" data-en="sick / healthy">真患者 / 健康</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="检测阳性" data-en="positive tests">检测阳性</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="P(病|阳)" data-en="P(sick|+)">P(病|阳)</span><span class="v f" id="stV">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip s" data-zh="真患者" data-en="truly sick">真患者</span>
    <span class="chip t" data-zh="真阳性(病且阳)" data-en="true positive">真阳性(病且阳)</span>
    <span class="chip f" data-zh="假阳性(健且阳)" data-en="false positive">假阳性(健且阳)</span>
    <span class="chip n" data-zh="阴性 / 未测" data-en="negative / untested">阴性 / 未测</span>
  </div>
  <ol id="steps"></ol>
  <div class="row"><label data-zh="患病率" data-en="Prevalence">患病率</label><input id="prev" type="range" min="0.1" max="10" step="0.1" value="0.1"><span class="val" id="prevVal">0.1%</span></div>
  <div class="row"><label data-zh="灵敏度" data-en="Sensitivity">灵敏度</label><input id="sens" type="range" min="50" max="100" step="1" value="99"><span class="val" id="sensVal">99%</span></div>
  <div class="row"><label data-zh="假阳性率" data-en="False pos. rate">假阳性率</label><input id="fpr" type="range" min="0.5" max="20" step="0.5" value="5"><span class="val" id="fprVal">5%</span></div>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="crow"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="crow"><label data-zh="进度" data-en="Phase">进度</label><input id="prog" type="range" min="0" max="4.99" step="0.01" value="0"><span class="val" id="progVal">1/5</span></div>
    <button id="reset" data-zh="重置参数" data-en="Reset params">重置参数</button>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFormula" type="checkbox" checked> <span data-zh="公式条" data-en="Formula">公式条</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../monty-hall-bayes/" data-zh="同族:蒙提霍尔·换门直觉" data-en="same family: Monty Hall">同族:蒙提霍尔·换门直觉</a>
    <a href="../galton-board/" data-zh="同族:大数定律长出正态" data-en="same family: the bell emerges">同族:大数定律长出正态</a>
    <a href="../random-walk/" data-zh="同族:随机游走,单步无序" data-en="same family: random walk">同族:随机游走,单步无序</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
let grid = null, platform = null, asmPlatform = null;
/* 人群配色(深浅两套;方块是标注色,靠 instanceColor 上色) */
const CL = {
  neutral: new THREE.Color(), neg: new THREE.Color(), missed: new THREE.Color(),
  sick: new THREE.Color(0xff6f61), tp: new THREE.Color(0x35d07f), fp: new THREE.Color(0xff9f43),
};
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const light = THEME === 'light';
  scene.background = new THREE.Color(light ? 0xeef1f6 : 0x10141b);
  scene.fog = new THREE.Fog(light ? 0xeef1f6 : 0x10141b, 26, 58);
  if (grid) {
    grid.material.color.set(light ? 0x9aa7b8 : 0x3a4656);
    grid.material.opacity = light ? 0.5 : 0.35;
  }
  if (platform) platform.material.color.set(light ? 0xdde4ec : 0x171e28);
  if (asmPlatform) asmPlatform.material.color.set(light ? 0xe8ddd0 : 0x211d16);
  /* 浅色主题下方块换成深色系标注色 */
  CL.neutral.set(light ? 0x9fb0c2 : 0x39424e);
  CL.neg.set(light ? 0xc0cbd8 : 0x222932);
  CL.missed.set(light ? 0xe0a29c : 0x74322d);
  CL.sick.set(light ? 0xd64541 : 0xff6f61);
  CL.tp.set(light ? 0x1e9e5e : 0x35d07f);
  CL.fp.set(light ? 0xd97c06 : 0xff9f43);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('贝叶斯筛查 · 阳性≠患病', 'Bayes Screening · Positive ≠ Sick');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateStats();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(10.5, 9.2, 16);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 4.0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ================= 布局常量 ================= */
const N = 1000, COLS = 25, ROWS = 20, LAYERS = 2;   // 25×20×2 = 1000 人方阵
const PITCH = 0.42, CS = 0.34;                      // 立方体间距 / 边长
const HALF_W = (COLS - 1) / 2 * PITCH, HALF_D = (ROWS - 1) / 2 * PITCH;
const AZ0 = HALF_D + 1.8;                           // 阳性集结区第一排 z
const ASM_COLS = 16;                                // 集结区每排 16 人
const ASM_MAXROWS = 18;                             // 极端参数下最多 ~280 阳性 → 18 排
const PILL_POS = new THREE.Vector3(0, 2.5, AZ0 + 1.6);

/* 地面网格 + 两座平台 */
grid = new THREE.GridHelper(48, 48, 0xffffff, 0xffffff);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.y = -0.31;
scene.add(grid);
platform = new THREE.Mesh(
  new THREE.BoxGeometry(HALF_W * 2 + 1.4, 0.3, HALF_D * 2 + 1.4),
  new THREE.MeshStandardMaterial({ color: 0x171e28, roughness: 0.9, metalness: 0.05 }));
platform.position.y = -0.15;
scene.add(platform);
asmPlatform = new THREE.Mesh(
  new THREE.BoxGeometry(ASM_COLS * PITCH + 1.0, 0.3, (ASM_MAXROWS - 1) * PITCH + 1.4),
  new THREE.MeshStandardMaterial({ color: 0x211d16, roughness: 0.9, metalness: 0.05 }));
asmPlatform.position.set(0, -0.15, AZ0 + (ASM_MAXROWS - 1) * PITCH / 2);
scene.add(asmPlatform);

/* ================= 参数与格子状态 ================= */
let tR = 0, wall = 0, playing = true, speed = 1, showLabels = true, showFormula = true;
let prevPct = 0.1, sensPct = 99, fprPct = 5;
let state = [], nSick = 1, nTP = 1, nFP = 50, nPos = 51, ppv = 0, tpIdx = 0;
const f2 = v => String(+v.toFixed(6));
const pct2 = v => { const x = v * 100; return (x >= 10 ? x.toFixed(1) : x.toFixed(2)) + '%'; };
const fmtPct = v => (v % 1 ? v.toFixed(1) : String(v)) + '%';

/* 每格静态坐标 */
const colOf = new Int32Array(N), rowOf = new Int32Array(N), layOf = new Int32Array(N);
const gX = new Float32Array(N), gY = new Float32Array(N), gZ = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const c = i % COLS, r = ((i / COLS) | 0) % ROWS, l = (i / (COLS * ROWS)) | 0;
  colOf[i] = c; rowOf[i] = r; layOf[i] = l;
  gX[i] = (c - (COLS - 1) / 2) * PITCH;
  gZ[i] = (r - (ROWS - 1) / 2) * PITCH;
  gY[i] = l * PITCH + CS / 2;
}
/* 阳性在集结区的位次与坐标(随参数重算) */
const posRank = new Int32Array(N);
const aX = new Float32Array(N), aZ = new Float32Array(N);

/* 1000 格按期望计数确定性着色:乱序表前 nSick 个为患者(其中前 nTP 个检出),
   随后 nFP 个健康人误报。0 阴性 1 漏检 2 真阳性 3 假阳性 */
function computeGrid() {
  nSick = Math.max(1, Math.round(N * prevPct / 100));
  nTP = Math.max(1, Math.round(nSick * sensPct / 100));
  nFP = Math.round((N - nSick) * fprPct / 100);
  nPos = nTP + nFP;
  const se = sensPct / 100, p = prevPct / 100, fp = fprPct / 100;
  ppv = (se * p) / (se * p + fp * (1 - p));
  const order = Array.from({ length: N }, (_, i) => i);
  const r = rng(7);
  for (let i = N - 1; i > 0; i--) {
    const j = (r() * (i + 1)) | 0;
    const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  state = new Array(N).fill(0);
  for (let i = 0; i < nTP; i++) state[order[i]] = 2;
  for (let i = nTP; i < nSick; i++) state[order[i]] = 1;
  for (let i = 0; i < nFP; i++) state[order[nSick + i]] = 3;
  tpIdx = order[0];
  let j = 0;
  for (let i = 0; i < N; i++) {
    if (state[i] === 2 || state[i] === 3) {
      posRank[i] = j;
      aX[i] = (j % ASM_COLS - (ASM_COLS - 1) / 2) * PITCH;
      aZ[i] = AZ0 + ((j / ASM_COLS) | 0) * PITCH;
      j++;
    } else posRank[i] = -1;
  }
}

/* ================= 人群(1000 实例化立方体) ================= */
const cubes = new THREE.InstancedMesh(
  new THREE.BoxGeometry(CS, CS, CS),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.08 }), N);
cubes.frustumCulled = false;
scene.add(cubes);
const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _s = new THREE.Vector3(),
  _qI = new THREE.Quaternion(), _c = new THREE.Color();

let curPh = 0, curSweep = 0, sweepX = 0, pillK = 0;
function updateCrowd(t) {
  const ph = Math.min(4, Math.floor(tR)), loc = tR - ph;
  curPh = ph;
  const sweep = ph < 2 ? 0 : ph > 2 ? 2 : clamp(loc / 0.72, 0, 1);
  curSweep = sweep;
  const dimT = ph === 3 ? lerp(1, 0.18, ss(0, 0.35, loc))
    : ph === 4 ? lerp(1, 0.12, ss(0, 0.3, loc)) : 1;
  const fpK = ph === 4 ? lerp(1, 0.5, ss(0, 0.4, loc)) : 1;
  const outK = ph === 4 ? 1 - ss(0.93, 1, loc) : 1;
  const fly = ph < 3 ? 0 : ph === 3 ? ss(0.05, 0.62, loc) : 1;
  pillK = ph === 4 ? ss(0.18, 0.45, loc) * outK : 0;
  for (let i = 0; i < N; i++) {
    const st = state[i], c = colOf[i], r = rowOf[i], l = layOf[i];
    const sick = st === 1 || st === 2, pos = st === 2 || st === 3;
    /* ---- 颜色 ---- */
    if (ph === 0) _c.copy(CL.neutral);
    else if (ph === 1) {
      if (sick) _c.lerpColors(CL.neutral, CL.sick, ss(0.06 + c * 0.008, 0.26 + c * 0.008, loc));
      else _c.copy(CL.neutral);
    } else {
      const rev = (c + 0.5) / COLS + r * 0.0012 <= Math.min(sweep, 1);
      if (rev) _c.copy(st === 2 ? CL.tp : st === 3 ? CL.fp : st === 1 ? CL.missed : CL.neg);
      else _c.copy(sick ? CL.sick : CL.neutral);
    }
    const k = (st === 2 ? 1 : st === 3 ? fpK : dimT) * outK;
    _c.multiplyScalar(k);
    /* ---- 位置与缩放 ---- */
    let s = 1, x = gX[i], y = gY[i], z = gZ[i];
    if (ph === 0) {
      s = ss(0, 1, clamp(loc * 2.2 - (c * 0.5 + r) * 0.02 - l * 0.12, 0, 1));
      if (s <= 0.001) s = 0.0001;
      y = l * PITCH + CS / 2 * s;
    } else if (ph === 1 && sick) {
      const k2 = ss(0.06 + c * 0.008, 0.26 + c * 0.008, loc);
      s = 1 + 0.3 * Math.sin(k2 * Math.PI);
      y = l * PITCH + CS / 2 * s;
    }
    if (pos && fly > 0) {                    /* 阳性飞出方阵,到集结区列队 */
      x = lerp(gX[i], aX[i], fly);
      z = lerp(gZ[i], aZ[i], fly);
      y = lerp(gY[i], CS / 2, fly) + Math.sin(fly * Math.PI) * 1.6;
    }
    if (ph === 4 && st === 2) {              /* 招牌瞬间:真患者独自发光脉动 */
      const pulse = Math.sin(t * 4.5 + i);
      s *= 1 + 0.16 * pulse;
      _c.multiplyScalar(1 + 0.22 * pulse);
    }
    _m.compose(_v.set(x, y, z), _qI, _s.set(s, s, s));
    cubes.setMatrixAt(i, _m);
    cubes.setColorAt(i, _c);
  }
  cubes.instanceMatrix.needsUpdate = true;
  if (cubes.instanceColor) cubes.instanceColor.needsUpdate = true;
}

/* ================= 检测扫描面 ================= */
const sweepG = new THREE.Group();
const sweepPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(HALF_D * 2 + 0.9, 2.0),
  new THREE.MeshBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.10,
    side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
sweepPlane.rotation.y = Math.PI / 2;
sweepG.add(sweepPlane);
{
  const h = HALF_D + 0.45;
  const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -1, -h), new THREE.Vector3(0, -1, h),
    new THREE.Vector3(0, 1, h), new THREE.Vector3(0, 1, -h)]),
    new THREE.LineBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.85, toneMapped: false }));
  sweepG.add(edge);
}
sweepG.position.y = 1.0;
scene.add(sweepG);
function updateSweep() {
  sweepG.visible = curPh === 2 && curSweep < 1;
  sweepX = -HALF_W - 0.5 + Math.min(curSweep, 1) * (HALF_W * 2 + 1.0);
  sweepG.position.x = sweepX;
}

/* 招牌瞬间:真患者 → 大牌的虚线牵引 */
const tpLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0x35d07f, transparent: true, opacity: 0,
    dashSize: 0.18, gapSize: 0.12, toneMapped: false }));
tpLine.frustumCulled = false;
scene.add(tpLine);
function updateTpLine() {
  tpLine.visible = pillK > 0.01 && posRank[tpIdx] >= 0;
  if (!tpLine.visible) return;
  const p = tpLine.geometry.attributes.position.array;
  p[0] = aX[tpIdx]; p[1] = 0.55; p[2] = aZ[tpIdx];
  p[3] = PILL_POS.x; p[4] = PILL_POS.y - 0.35; p[5] = PILL_POS.z;
  tpLine.geometry.attributes.position.needsUpdate = true;
  tpLine.computeLineDistances();
  tpLine.material.opacity = pillK * 0.9;
}

/* ================= 场景标签 ================= */
const labelReg = [];
let labelsOn = showLabels;
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) {
    const on = r.vis() && r.text() !== '';
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
}
const gridNote = addLabel(() => L('每格 = 1 人 · 共 1000 人', 'each cube = 1 person · N = 1000'),
  new THREE.Vector3(HALF_W + 0.7, 0.45, HALF_D + 0.4), '', () => labelsOn);
const caption = addLabel(() => [
  L('① 1000 个立方体 = 1000 个人,每格一人', '1: 1,000 cubes = 1,000 people'),
  L(`② 真相先行:真患者 ${nSick} 格 vs 健康 ${N - nSick} 格`, `2: the truth first — ${nSick} sick vs ${N - nSick} healthy`),
  L(`③ 全民检测:灵敏度 ${fmtPct(sensPct)},假阳性率 ${fmtPct(fprPct)}`, `3: test all — sensitivity ${fmtPct(sensPct)}, false-positive ${fmtPct(fprPct)}`),
  L(`④ 阳性 ${nPos} 格 = 真阳性 ${nTP} + 假阳性 ${nFP}`, `4: positives ${nPos} = true ${nTP} + false ${nFP}`),
  L(`⑤ P(病|阳) ≈ ${pct2(ppv)}:阳性 ≠ 患病`, `5: P(sick|+) ≈ ${pct2(ppv)} — positive ≠ sick`),
][curPh], new THREE.Vector3(0, 2.6, -2.0), 'cap', () => labelsOn);
const testingLbl = addLabel(() => L('检测中…', 'testing…'),
  new THREE.Vector3(0, 2.1, 0), 'b', () => labelsOn && curPh === 2 && curSweep < 1);
addLabel(() => L(`阳性集结:${nPos} 人 = 真阳性 ${nTP} + 假阳性 ${nFP}`,
  `positives assemble: ${nPos} = true ${nTP} + false ${nFP}`),
  new THREE.Vector3(0, 1.7, AZ0 + (ASM_MAXROWS - 1) * PITCH + 0.9), 'o',
  () => labelsOn && curPh >= 3);

/* 招牌大牌(ph4)与公式条:innerHTML 手动管理 */
const pillDiv = document.createElement('div');
pillDiv.className = 'lbl pill';
const pillObj = new CSS2DObject(pillDiv);
pillObj.position.copy(PILL_POS);
scene.add(pillObj);
const fxDiv = document.createElement('div');
fxDiv.className = 'lbl fx';
const fxObj = new CSS2DObject(fxDiv);
fxObj.position.set(0, 0.9, AZ0 + (ASM_MAXROWS - 1) * PITCH + 2.2);
scene.add(fxObj);
function updatePill() {
  pillDiv.innerHTML = `<div class="big">${L(`真患者 ${nTP} ÷ 阳性 ${nPos} ≈ ${pct2(ppv)}`,
    `sick ${nTP} of ${nPos} positives ≈ ${pct2(ppv)}`)}</div>` +
    `<div class="small">${L('阳性 ≠ 患病:基率占坑,复检才作数',
      'positive ≠ sick: the base rate rules — confirm, then conclude')}</div>`;
}
function updateFormula() {
  const se = sensPct / 100, p = prevPct / 100, fp = fprPct / 100;
  const num = se * p, den = se * p + fp * (1 - p);
  fxDiv.innerHTML = L('P(病|阳) = 灵敏度×患病率 ÷ (灵敏度×患病率 + 假阳性率×(1−患病率))',
    'P(sick|+) = sens×prev ÷ (sens×prev + FPR×(1−prev))') +
    `<br><span class="num">= ${f2(se)}×${f2(p)} ÷ (${f2(se)}×${f2(p)} + ${f2(fp)}×${f2(1 - p)}) = ${f2(num)} ÷ ${f2(den)} ≈ ${pct2(ppv)}</span>`;
}

/* ================= 步骤(文案随滑块实时重算) ================= */
const STEPS = [
  { b: '1000 人,一人一格', be: '1,000 people, one cell each',
    d: () => L(`患病率 ${fmtPct(prevPct)} 意味着:1000 人里平均只有 ${nSick} 个真患者——这个先验数字叫「基率」,它决定后面的一切。`,
      `Prevalence ${fmtPct(prevPct)} means about ${nSick} true patient(s) per 1,000 people — the base rate that decides everything downstream.`) },
  { b: '先按真相染色', be: 'Color by the truth first',
    d: () => L(`红格是真患者(${nSick} 格),其余 ${N - nSick} 格健康。检测还没开始,谁患病已是事实——检测只能发现它,不能改变它。`,
      `Red cells are truly sick (${nSick}); the other ${N - nSick} are healthy. The test has not run yet — being sick is already a fact; a test can only reveal it.`) },
  { b: '全民检测', be: 'Test everyone',
    d: () => L(`灵敏度 ${fmtPct(sensPct)}:患者几乎必被揪出;假阳性率 ${fmtPct(fprPct)}:健康人里也有同样比例被误判。两股人流同时涌进「阳性」。`,
      `Sensitivity ${fmtPct(sensPct)} catches the sick; false-positive rate ${fmtPct(fprPct)} wrongly flags healthy people too. Two streams flow into "positive".`) },
  { b: '阳性大军集合', be: 'The positives assemble',
    d: () => L(`真阳性 ${nTP} 格 + 假阳性 ${nFP} 格 = 阳性 ${nPos} 格。${fmtPct(fprPct)} 看似很小,但乘上 ${N - nSick} 个健康人,轻易淹没 ${nSick} 个患者。`,
      `True positives ${nTP} + false positives ${nFP} = ${nPos} positives. ${fmtPct(fprPct)} looks tiny, but times ${N - nSick} healthy people it drowns the ${nSick} real patient(s).`) },
  { b: '阳性 ≠ 患病', be: 'Positive ≠ sick',
    d: () => L(`${nPos} 个阳性里只有 ${nTP} 格是真患者:P(病|阳) ≈ ${pct2(ppv)}。低基率把 99% 的灵敏度稀释成不到 2% 的阳性价值——初筛阳性,复检才作数。`,
      `Only ${nTP} of ${nPos} positives is truly sick: P(sick|+) ≈ ${pct2(ppv)}. A low base rate dilutes 99% sensitivity into <2% positive value — screen positive, then confirm.`) },
];
function stepIndex() { return clamp(Math.floor(tR), 0, 4); }

/* ================= 读数面板 ================= */
const stS = document.getElementById('stS'), stP = document.getElementById('stP'),
  stV = document.getElementById('stV');
function updateStats() {
  stS.textContent = `${nSick} / ${N - nSick}`;
  stP.innerHTML = `${nPos}<small> 格 · ${L('真', 'T')}${nTP}+${L('假', 'F')}${nFP}</small>`;
  stV.innerHTML = `${pct2(ppv)}<small> ≈ ${nTP}/${nPos}</small>`;
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elProg = document.getElementById('prog');
const elProgVal = document.getElementById('progVal');
const elPrev = document.getElementById('prev'), elPrevVal = document.getElementById('prevVal');
const elSens = document.getElementById('sens'), elSensVal = document.getElementById('sensVal');
const elFpr = document.getElementById('fpr'), elFprVal = document.getElementById('fprVal');
const elReset = document.getElementById('reset');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglFormula = document.getElementById('tglFormula');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${s.d()}</span>`;
    li.addEventListener('click', () => { tR = i + 0.001; elProg.value = tR; elProgVal.textContent = `${i + 1}/5`; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncParamUI() {
  elPrev.value = prevPct; elPrevVal.textContent = fmtPct(prevPct);
  elSens.value = sensPct; elSensVal.textContent = fmtPct(sensPct);
  elFpr.value = fprPct; elFprVal.textContent = fmtPct(fprPct);
}
function onParam() { computeGrid(); updateStats(); buildSteps(); updateFormula(); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elProg.addEventListener('input', () => {
  tR = parseFloat(elProg.value);
  elProgVal.textContent = (Math.floor(tR) + 1) + '/5';
});
elPrev.addEventListener('input', () => { prevPct = parseFloat(elPrev.value); syncParamUI(); onParam(); });
elSens.addEventListener('input', () => { sensPct = parseFloat(elSens.value); syncParamUI(); onParam(); });
elFpr.addEventListener('input', () => { fprPct = parseFloat(elFpr.value); syncParamUI(); onParam(); });
elReset.addEventListener('click', () => { prevPct = 0.1; sensPct = 99; fprPct = 5; syncParamUI(); onParam(); });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; });
tglFormula.addEventListener('change', () => { showFormula = tglFormula.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
  if (e.code === 'ArrowLeft') { tR = Math.max(0, Math.floor(tR) - 1 + 0.001); elProg.value = tR; }
  if (e.code === 'ArrowRight') { tR = Math.min(4.999, Math.floor(tR) + 1 + 0.001); elProg.value = tR; }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* URL 参数:?t= 0–1 初始进度 ?pause=1 ?speed= ?labels=0 ?formula=0 ?spin=0
   页面专属 ?prev= ?sens= ?fpr=(百分数) */
prevPct = clamp(qsFloat('prev', 0.1), 0.1, 10);
sensPct = clamp(qsFloat('sens', 99), 50, 100);
fprPct = clamp(qsFloat('fpr', 5), 0.5, 20);
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
showLabels = qsBool('labels', true); tglLabels.checked = showLabels; labelsOn = showLabels;
showFormula = qsBool('formula', true); tglFormula.checked = showFormula;
controls.autoRotate = qsBool('spin', true); tglRotate.checked = controls.autoRotate;
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
tR = clamp(qsFloat('t', 0), 0, 0.999) * 5;
elProg.value = tR; elProgVal.textContent = (Math.floor(tR) + 1) + '/5';

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    wall += dt * speed;
    tR += dt * speed / 3.5;
    if (tR >= 5) tR -= 5;
    elProg.value = tR;
    elProgVal.textContent = (Math.floor(tR) + 1) + '/5';
  }
  updateCrowd(wall);
  updateSweep();
  updateTpLine();
  refreshLabels();
  testingLbl.position.set(sweepX + 0.3, 2.2, 0);
  caption.element.style.opacity = curPh === 4 ? String(1 - ss(0.93, 1, tR - 4)) : '1';
  pillObj.visible = pillK > 0.01;
  if (pillObj.visible) { pillDiv.style.opacity = String(pillK); updatePill(); }
  fxObj.visible = showFormula;
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
computeGrid();
applyTheme();
applyLang();
syncParamUI();
updateStats();
updateFormula();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
