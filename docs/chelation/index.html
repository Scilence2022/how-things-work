<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>螯合物与配位键 · 六爪一收,熵赚大胜</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

  <h1 data-zh="螯合物与配位键" data-en="Chelation &amp; Coordination Bonds">螯合物与配位键</h1>
  <div class="sub" data-zh="配位键就是配体把孤对电子塞进金属离子的空轨道;H₂O、NH₃ 这样的单齿配体一次只递一对,水合层松散、随时被换;EDTA 一条柔性链带 2N+4O⁻ 六个爪,逐爪收拢把 Cu²⁺ 整个包进八面体笼——1 个分子换下 6 个水、2 粒子变 7、熵大赚,log K 从个位数冲到 18.8;加酸 H⁺ 抢走孤对,螯合物当场散架 · 拖动旋转 / 空格运行/暂停" data-en="A coordination bond is a ligand donating a lone pair into the metal ion's empty orbitals; monodentate H₂O or NH₃ offers one pair at a time, held loosely and swapped all day; EDTA is one flexible chain with six claws — 2 N + 4 O⁻ — that folds claw by claw until Cu²⁺ sits inside an octahedral cage; one molecule ousts six waters, 2 particles become 7, entropy wins big, and log K leaps from single digits to 18.8; add acid and H⁺ grabs the lone pairs apart it goes · drag to orbit / Space = run/pause">配位键就是配体把孤对电子塞进金属离子的空轨道;H₂O、NH₃ 这样的单齿配体一次只递一对,水合层松散、随时被换;EDTA 一条柔性链带 2N+4O⁻ 六个爪,逐爪收拢把 Cu²⁺ 整个包进八面体笼——1 个分子换下 6 个水、2 粒子变 7、熵大赚,log K 从个位数冲到 18.8;加酸 H⁺ 抢走孤对,螯合物当场散架 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,12,34);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(2.7,4.0,9.7);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,2.05,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=22;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:中心 Cu²⁺,八面体六向配位 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(10,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const CUV=new THREE.Vector3(0,2.05,0);
const VDIR=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),new THREE.Vector3(0,1,0),
  new THREE.Vector3(0,-1,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)];
/* Cu²⁺ 本体:蓝色大球+6 个空轨道刻痕 */
const cuM=new THREE.MeshStandardMaterial({color:0x3b82d9,roughness:0.3,metalness:0.55,
  emissive:0x1c4fa0,emissiveIntensity:0.35});
const cu=new THREE.Mesh(new THREE.SphereGeometry(0.55,36,28),cuM);
cu.position.copy(CUV);scene.add(cu);
const orbM=new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:0.5,emissive:0x8fb8e8,emissiveIntensity:0.4});
const orbs=[];
for(const d of VDIR){
  const o=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),orbM);
  o.position.copy(CUV).addScaledVector(d,0.58);scene.add(o);orbs.push(o);
}
/* 八面体笼:半透明面+线框,随螯合进度淡入 */
const cageM=new THREE.MeshBasicMaterial({color:0x6fb3ff,transparent:true,opacity:0,
  side:THREE.DoubleSide,depthWrite:false});
const cage=new THREE.Mesh(new THREE.OctahedronGeometry(1.45),cageM);
cage.position.copy(CUV);cage.visible=false;scene.add(cage);
const cageW=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(1.45)),
  new THREE.LineBasicMaterial({color:0x6fb3ff,transparent:true,opacity:0}));
cageW.position.copy(CUV);cageW.visible=false;scene.add(cageW);
/* 配位键(EDTA 爪→Cu)短棒 */
const bondM=new THREE.MeshStandardMaterial({color:0xffc890,roughness:0.4,emissive:0xff9a4d,emissiveIntensity:0.5});
const bonds=[];
for(let i=0;i<6;i++){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.6,8),bondM);
  b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),VDIR[i]);
  b.position.copy(CUV).addScaledVector(VDIR[i],0.85);
  b.visible=false;scene.add(b);bonds.push(b);
}
/* 单齿配体:H₂O(红O白H+孤对点)与 NH₃(蓝N白H),同一空位二选一 */
const oM=new THREE.MeshStandardMaterial({color:0xd95555,roughness:0.45});
const nM=new THREE.MeshStandardMaterial({color:0x6f7fe8,roughness:0.45});
const hM=new THREE.MeshStandardMaterial({color:0xeef2f6,roughness:0.4});
const lpM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0xfff2dd,emissiveIntensity:0.7});
const clawO_M=new THREE.MeshStandardMaterial({color:0xe0662e,roughness:0.4,emissive:0x7a2c08,emissiveIntensity:0.35});
function lonePair(g,r){const lp=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),lpM);
  lp.position.set(0,0.02,r);g.add(lp);return lp;}
function makeWater(){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.17,20,16),oM));
  const h1=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),hM);h1.position.set(0.15,0.12,-0.05);g.add(h1);
  const h2=h1.clone();h2.position.set(-0.15,0.12,-0.05);g.add(h2);
  lonePair(g,0.21);return g;
}
function makeNH3(){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.18,20,16),nM));
  for(let k=0;k<3;k++){
    const a=k/3*Math.PI*2,h=new THREE.Mesh(new THREE.SphereGeometry(0.085,12,10),hM);
    h.position.set(0.16*Math.cos(a),-0.1,0.16*Math.sin(a)-0.05);g.add(h);
  }
  lonePair(g,0.22);return g;
}
const waters=[],nh3s=[];
for(let i=0;i<6;i++){
  const w=makeWater();scene.add(w);waters.push(w);
  const n=makeNH3();n.visible=false;scene.add(n);nh3s.push(n);
}
/* EDTA:柔性链带六爪(N 蓝 2 个、O⁻ 红 4 个),extended→attached 逐爪收拢 */
const edtaG=new THREE.Group();edtaG.position.copy(CUV);edtaG.visible=false;scene.add(edtaG);
const clawM_N=nM,clawM_O=clawO_M;
const claws=[],CLAW_N=[0,4],EXT_R=2.4,ATT_R=1.18;
const extPos=[];
for(let i=0;i<6;i++){
  const off=new THREE.Vector3(Math.sin(i*2.1),Math.cos(i*1.7),Math.sin(i*3.3)).multiplyScalar(0.55);
  const e=VDIR[i].clone().multiplyScalar(EXT_R).add(off);
  e.y=clamp(e.y,-1.45,1.45);   /* local 坐标:world y ∈ [0.6,3.5] */
  extPos.push(e);
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(CLAW_N.includes(i)?0.17:0.155,18,14),CLAW_N.includes(i)?clawM_N:clawM_O));
  const lp=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),lpM);lp.position.set(0,0.02,0.2);g.add(lp);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),VDIR[i]);
  edtaG.add(g);claws.push(g);
}
let tube=null;
const tubeM=new THREE.MeshStandardMaterial({color:0x9aa8b8,roughness:0.5,metalness:0.3});
const CHAIN=[1,0,2,3,4,5];
function rebuildTube(){
  if(tube){tube.geometry.dispose();edtaG.remove(tube);}
  /* 链沿八面体棱走(棱中点方向 ≈ 归一化(爪A+爪B)*1.5),不穿模 */
  const pts=[];
  for(let k=0;k<CHAIN.length;k++){
    const a=claws[CHAIN[k]].position;
    const b=claws[CHAIN[(k+1)%CHAIN.length]].position;
    pts.push(a);
    const mid=a.clone().add(b).normalize()
      .multiplyScalar(Math.max(1.45,(a.length()+b.length())/2*0.9));
    pts.push(mid);
  }
  tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),56,0.045,8),tubeM);
  edtaG.add(tube);
}
/* H⁺ 小球:低 pH 时来抢孤对 */
const hpM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0xcfe0ff,emissiveIntensity:0.8});
const hps=[];
for(let i=0;i<8;i++){
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),hpM);
  h.userData={ph:i*0.83,r:1.7+0.5*(i%3)};h.visible=false;scene.add(h);hps.push(h);
}
/* 单齿配位键虚线(水合/氨模式):配体孤对→Cu */
const monoM=new THREE.LineBasicMaterial({color:0xffb066,transparent:true,opacity:0.6});
const monoGeo=new THREE.BufferGeometry();
monoGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(36),3));
const monoLines=new THREE.LineSegments(monoGeo,monoM);monoLines.visible=false;scene.add(monoLines);

/* 状态 */
let mode='aqua',pH=7,eq=1,playing=true,labelsOn=true,slowMo=false,cageOn=true;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function effP(){ /* EDTA 有效螯合进度:当量 × pH 因子(酸化拆螯合) */
  if(mode!=='edta')return 0;
  return clamp(eq*smooth(1.5,5,pH),0,1);
}
function clawT(i){return clamp(effP()*6-i,0,1);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblCu=addLabel(()=>{
    if(mode==='edta')return effP()>0.5?L('Cu²⁺ · 六爪环抱中','Cu²⁺ · wrapped by six claws')
      :(effP()>0.05?L('Cu²⁺ · 空轨道收拢中','Cu²⁺ · orbitals filling up'):L('Cu²⁺ · 空轨道待孤对','Cu²⁺ · empty orbitals await lone pairs'));
    return L('Cu²⁺ · 空轨道待孤对','Cu²⁺ · empty orbitals await lone pairs');},
  new THREE.Vector3(0,3.0,0),'b');
const lblWat=addLabel(()=>L('H₂O 单齿:一次一对孤对,随时被换','H₂O monodentate: one lone pair, swapped all the time'),
  new THREE.Vector3(-2.2,3.35,0),'y',()=>mode==='aqua');
const lblNH3=addLabel(()=>L('NH₃ 单齿:结合稍紧,分步 log K≈4','NH₃ monodentate: a bit tighter, stepwise log K≈4'),
  new THREE.Vector3(-2.2,3.35,0),'y',()=>mode==='ammonia');
const lblAx=addLabel(()=>L('轴向残留 2 H₂O(Jahn-Teller 拉长)','2 axial H₂O remain (Jahn-Teller stretch)'),
  new THREE.Vector3(1.85,4.1,0),'g',()=>mode==='ammonia');
const lblEDTA=addLabel(()=>L('EDTA:2 N + 4 O⁻ 六爪柔性链','EDTA: one flexible chain, 2 N + 4 O⁻ claws'),
  new THREE.Vector3(2.7,3.6,0),'o',()=>mode==='edta');
const lblCage=addLabel(()=>L('八面体笼 · CN=6','Octahedral cage · CN=6'),new THREE.Vector3(0,4.0,0),'g',
  ()=>mode==='edta'&&effP()>0.85);
const lblEnt=addLabel(()=>L('1 个 EDTA 换下 6 H₂O:粒子 2→7,ΔS>0','One EDTA ousts 6 H₂O: 2 particles → 7, ΔS>0'),
  new THREE.Vector3(0,0.55,0),'g',()=>mode==='edta'&&effP()>0.6);
const lblH=addLabel(()=>L('H⁺ 抢孤对 → 螯合物解离','H⁺ grabs the lone pairs → chelate falls apart'),
  new THREE.Vector3(0,1.0,0),'r',()=>pH<3&&mode==='edta');

function setPH(v){pH=clamp(v,0,14);
  document.getElementById('sPH').value=pH;
  document.getElementById('sPHVal').textContent=pH.toFixed(1);updateStats();}
function setEq(v){eq=clamp(v,0,1);
  document.getElementById('sEq').value=eq;
  document.getElementById('sEqVal').textContent=eq.toFixed(2)+' eq';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bAqua').classList.toggle('on',m==='aqua');
  document.getElementById('bNH3').classList.toggle('on',m==='ammonia');
  document.getElementById('bEDTA').classList.toggle('on',m==='edta');
  document.getElementById('sEq').disabled=(m!=='edta');
  edtaG.visible=(m==='edta');
  monoLines.visible=(m!=='edta');
  if(m==='edta'&&eq<1)setEq(1);
  updateStats();}

const STEPS=[
 {zh:'<b>配位键</b>:配体孤对电子进 Cu²⁺ 空轨道,共用成键——水合 Cu²⁺ 呈浅蓝',
  en:'<b>Coordination bond</b>: a ligand lone pair walks into Cu²⁺ empty orbitals — aquo copper is pale blue',
  act(){setMode('aqua');setPH(7);}},
 {zh:'<b>单齿松散可逆</b>:换上 NH₃ 仍是一齿一对孤对,分步结合、水分子随时反抢',
  en:'<b>Monodentate is loose</b>: swap in NH₃ — still one tooth, one pair; stepwise binding, water snatches back',
  act(){setMode('ammonia');setPH(7);}},
 {zh:'<b>EDTA 第一爪</b>:柔性链的一个羧酸根 O⁻ 先咬住 Cu²⁺,其余五爪就位',
  en:'<b>EDTA\u2019s first claw</b>: one carboxylate O⁻ of the flexible chain bites Cu²⁺; five claws await',
  act(){setMode('edta');setEq(0.2);setPH(7);}},
 {zh:'<b>六爪环抱</b>:2N+4O⁻ 逐爪扣成八面体笼,Cu²⁺ 被整个包住,配位数 6',
  en:'<b>Six claws close</b>: 2 N + 4 O⁻ snap into an octahedral cage — Cu²⁺ fully wrapped, CN=6',
  act(){setMode('edta');setEq(1);setPH(7);}},
 {zh:'<b>螯合效应看熵</b>:1 个分子换下 6 个水,粒子 2→7,ΔS>0,log K 冲到 18.8',
  en:'<b>The chelate effect is entropy</b>: one molecule ousts six waters, 2 particles → 7, ΔS>0, log K soars to 18.8',
  act(){setMode('edta');setEq(1);setPH(10);}},
 {zh:'<b>加酸解离</b>:H⁺ 抢走孤对、EDTA 被质子化,六爪松开,深蓝褪回浅蓝',
  en:'<b>Acid unlocks it</b>: H⁺ out-competes for the lone pairs, EDTA is protonated, six claws release, deep blue fades',
  act(){setMode('edta');setEq(1);setPH(1);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function solFrac(){
  return mode==='aqua'?0.15:(mode==='ammonia'?0.75:0.15+0.75*effP());
}

function updateStats(){
  const p=effP();
  const cn=document.getElementById('stCN');
  if(mode==='aqua'){cn.textContent='6';cn.className='v';}
  else if(mode==='ammonia'){cn.textContent='4+2';cn.className='v';}
  else{const n=[0,1,2,3,4,5].filter(i=>clawT(i)>0.85).length;
    cn.textContent=n+'/6';cn.className='v '+(n>=6?'ok':(pH<3?'warn':''));}
  const kv=document.getElementById('stK');
  if(mode==='aqua'){kv.textContent='—';kv.className='v';}
  else if(mode==='ammonia'){const bad=pH<2;
    kv.innerHTML=bad?L('≈0<small> 质子化</small>','≈0<small> protonated</small>'):'4.3<small> /步</small>';
    kv.className='v '+(bad?'warn':'');}
  else{const bad=pH<3;
    kv.innerHTML=bad?L('→0<small> 质子化</small>','→0<small> protonated</small>'):'18.8';
    kv.className='v '+(bad?'warn':'ok');}
  const pv=document.getElementById('stPct');
  const pct=mode==='aqua'?0:(mode==='ammonia'?(pH<2?10:80):p*100);
  pv.innerHTML=pct.toFixed(0)+'<small> %</small>';
  pv.className='v '+(mode==='edta'?(pct>80?'ok':(pct<30?'warn':'')):'');
  const cv=document.getElementById('stCol');
  const deep=solFrac()>0.45;
  cv.textContent=deep?L('深蓝','deep blue'):L('浅蓝','pale blue');
  cv.style.color=deep?(THEME==='dark'?'#5f9fe8':'#1c4f9e'):(THEME==='dark'?'#a8cdf0':'#5b8fc4');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bAqua').addEventListener('click',()=>setMode('aqua'));
document.getElementById('bNH3').addEventListener('click',()=>setMode('ammonia'));
document.getElementById('bEDTA').addEventListener('click',()=>setMode('edta'));
document.getElementById('sPH').addEventListener('input',e=>setPH(+e.target.value));
document.getElementById('sEq').addEventListener('input',e=>setEq(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCage').addEventListener('change',e=>{cageOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  updateStats();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const bgDark=new THREE.Color(0x101418),bgDarkB=new THREE.Color(0x0d1e42);
const bgLight=new THREE.Color(0xe9e4dc),bgLightB=new THREE.Color(0xd2e0f0);
const tmpC=new THREE.Color();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const p=effP();
  /* 溶液颜色:配位越深背景越蓝 */
  tmpC.copy(THEME==='dark'?bgDark:bgLight).lerp(THEME==='dark'?bgDarkB:bgLightB,solFrac()*0.85);
  scene.background=scene.background||new THREE.Color();
  scene.background.copy(tmpC);
  scene.fog.color.copy(tmpC);
  /* 单齿配体:轨道上晃动 + 定期交换;氨更紧更慢;低 pH 松弛 */
  const loosen=(mode==='edta')?0:(pH<2?1:0);
  const monoPos=monoGeo.attributes.position;
  for(let i=0;i<6;i++){
    const d=VDIR[i],w=waters[i],n=nh3s[i];
    const isAx=(i===2||i===3)&&mode==='ammonia';
    const nh3Here=mode==='ammonia'&&!isAx;
    const tE=(mode==='edta')?clawT(i):0;
    w.visible=(mode==='aqua')||isAx||(mode==='edta'&&tE<0.6);
    n.visible=nh3Here;
    let baseR=mode==='aqua'?1.55:(isAx?1.95:1.42);
    baseR+=loosen*0.5;
    let r=baseR,sc=1;
    const spd=(mode==='aqua')?0.6:(isAx?0.5:0.3);
    const cyc=5/spd,lf=(simT+i*1.1+2.0)%cyc;
    const isEDTAdisp=mode==='edta';
    if(isEDTAdisp){
      const t=clawT(i);
      r=baseR+2.3*smooth(0,1,t);sc=1-smooth(0,0.9,t);
    }else if(lf<0.8){const k=lf/0.8;r=baseR+1.3*(1-k);sc=k;}
    else if(lf>cyc-0.8){const k=(lf-(cyc-0.8))/0.8;r=baseR+1.3*k;sc=1-k;}
    const wob=0.22+loosen*0.15;
    const off=new THREE.Vector3(
      Math.sin(simT*0.7+i*1.3)*wob*(d.y!==0?1:0.4),
      Math.cos(simT*0.6+i*2.1)*wob*(d.y!==0?0.3:1),
      Math.cos(simT*0.5+i*1.7)*wob*(d.y!==0?1:0.4));
    const pos=new THREE.Vector3().copy(CUV).addScaledVector(d,r).add(off);
    if(isEDTAdisp)pos.addScaledVector(d,0.2*Math.sin(simT*1.5+i));
    const g=nh3Here?n:w;
    g.position.copy(pos);g.scale.setScalar(Math.max(0.001,sc));
    g.lookAt(CUV);
    /* 单齿配位键线:配体孤对→Cu(LineSegments 成对顶点) */
    if(!isEDTAdisp&&sc>0.35){
      monoPos.setXYZ(2*i,pos.x-(pos.x-CUV.x)*0.15,pos.y-(pos.y-CUV.y)*0.15,pos.z-(pos.z-CUV.z)*0.15);
      monoPos.setXYZ(2*i+1,CUV.x+d.x*0.56+off.x*0.3,CUV.y+d.y*0.56+off.y*0.3,CUV.z+d.z*0.56+off.z*0.3);
    }
  }
  monoLines.visible=(mode!=='edta');
  if(monoLines.visible)monoPos.needsUpdate=true;
  /* EDTA 六爪:逐爪收拢;键棒、笼随之 */
  if(mode==='edta'){
    let anyChange=false;
    for(let i=0;i<6;i++){
      const t=clawT(i),te=t*t*(3-2*t);
      const pos=extPos[i].clone().lerp(VDIR[i].clone().multiplyScalar(ATT_R),te);
      pos.x+=0.03*Math.sin(simT*1.8+i);pos.y+=0.03*Math.cos(simT*1.5+i);
      if(claws[i].position.distanceToSquared(pos)>1e-10)anyChange=true;
      claws[i].position.copy(pos);
      bonds[i].visible=t>0.12;
      bonds[i].material.opacity=1;
      bonds[i].scale.set(1,clamp(te*1.4,0.1,1),1);
    }
    if(anyChange||!tube)rebuildTube();
    const pc=smooth(0.15,0.95,p);
    cage.visible=cageW.visible=cageOn&&pc>0.02;
    cageM.opacity=0.09*pc;
    cageW.material.opacity=0.75*pc;
    cage.rotation.y=simT*0.15;cageW.rotation.y=cage.rotation.y;
  }
  /* H⁺ 游泳:低 pH 时出现并围绕 */
  const showH=pH<3;
  for(const h of hps){
    h.visible=showH;
    if(showH){
      const u=h.userData,a=simT*1.2+u.ph;
      h.position.set(u.r*Math.cos(a),CUV.y+0.9*Math.sin(simT*1.6+u.ph*2),u.r*Math.sin(a));
    }
  }
  /* 空轨道刻痕呼吸 */
  for(const o of orbs)o.scale.setScalar(1+0.15*Math.sin(simT*2.5+o.position.x*3));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
