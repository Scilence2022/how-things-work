<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>声悬浮 · 用声波的节点托住水滴</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#38d9a9;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0ca678;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="声悬浮 · 用声波的节点托住水滴" data-en="Acoustic Levitation · sound nodes hold up droplets">声悬浮 · 用声波的节点托住水滴</h1>
  <div class="sub" data-zh="换能器发出 40 kHz 超声,与反射器叠成驻波;声辐射压(二阶效应)在波节挖出势阱,托住远小于 λ/2 的液滴;间距每变 λ/2 = 4.29 mm 节点增减一个——失谐或超载,当场掉落 · 拖动旋转 / 空格运行/暂停" data-en="A 40 kHz transducer and a reflector overlap into a standing wave; acoustic radiation pressure (a second-order effect) digs potential wells at the nodes that hold droplets far smaller than λ/2; every λ/2 = 4.29 mm of gap change adds or removes a node — detune or overload it and they drop on the spot · drag to orbit / Space = run/pause">换能器发出 40 kHz 超声,与反射器叠成驻波;声辐射压(二阶效应)在波节挖出势阱,托住远小于 λ/2 的液滴;间距每变 λ/2 = 4.29 mm 节点增减一个——失谐或超载,当场掉落 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="声压级" data-en="Sound level">声压级</span><span class="v" id="stSpl">—</span>
  <span class="k" data-zh="波长 λ" data-en="Wavelength λ">波长 λ</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="液滴重量" data-en="Droplet mass">液滴重量</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="悬浮状态" data-en="Levitation">悬浮状态</span><span class="v" id="stSt">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bOne" data-zh="单滴" data-en="Single drop">单滴</button>
    <button class="abtn" id="bStrand" data-zh="串珠" data-en="Bead string">串珠</button>
    <button class="abtn" id="bFall" data-zh="失谐掉落" data-en="Detune drop">失谐掉落</button>
  </div>
  <div class="row">
    <label data-zh="间距(λ/2 计)" data-en="Gap (×λ/2)">间距(λ/2 计)</label>
    <input id="sHW" type="range" min="2" max="9" step="0.05" value="5">
    <span class="val" id="sHWVal">5.00</span>
  </div>
  <div class="row">
    <label data-zh="驱动功率" data-en="Drive power">驱动功率</label>
    <input id="sPW" type="range" min="0" max="100" step="1" value="60">
    <span class="val" id="sPWVal">60</span>
  </div>
  <div class="row">
    <label data-zh="液滴数" data-en="Droplets">液滴数</label>
    <input id="sND" type="range" min="0" max="8" step="1" value="2">
    <span class="val" id="sNDVal">2</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="波场" data-en="Wave field">波场</span></label>
      <label><input id="tglRings" type="checkbox" checked> <span data-zh="节点环" data-en="Node rings">节点环</span></label>
    </div>
    <div class="row" style="margin-top:0">
      <label data-zh="速度" data-en="Speed">速度</label>
      <input id="sSpeed" type="range" min="0.3" max="2.5" step="0.1" value="1">
      <span class="val" id="sSpeedVal">1.0×</span>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../standing-waves/" data-zh="驻波" data-en="Standing waves">驻波</a>
    <a href="../sonar-ultrasound/" data-zh="声呐与超声" data-en="Sonar & ultrasound">声呐与超声</a>
    <a href="../resonance-beats/" data-zh="共振与拍" data-en="Resonance & beats">共振与拍</a>
    <a href="../active-noise-cancelling/" data-zh="主动降噪" data-en="Noise cancelling">主动降噪</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const qf=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,55);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(5.6,3.4,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.1);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);

/* ---- 场景:基座 + 换能器 + 反射器 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const base=new THREE.Mesh(new THREE.BoxGeometry(7,0.3,4.4),groundM);
base.position.set(0,0.05,0);scene.add(base);
const postM=new THREE.MeshStandardMaterial({color:0x495057,roughness:0.5,metalness:0.55});
for(const px of[-2.2,2.2]){
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,7.4,10),postM);
  post.position.set(px,3.7,0);scene.add(post);
}
const bodyM=new THREE.MeshStandardMaterial({color:0x343a40,roughness:0.45,metalness:0.5});
const faceM=new THREE.MeshStandardMaterial({color:0x9aa7b4,roughness:0.35,metalness:0.7});
const Y0=0.95;                                   // 换能器辐射面高度
const tx=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.55,0.42,28),bodyM);
tx.position.set(0,Y0-0.26,0);scene.add(tx);
const txFace=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.06,28),faceM);
txFace.position.set(0,Y0-0.03,0);scene.add(txFace);
const rf=new THREE.Group();scene.add(rf);        // 反射器(随间距上下移动)
const rfBody=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,0.34,28),bodyM);rf.add(rfBody);
const rfFace=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.06,28),faceM);rfFace.position.y=-0.2;rf.add(rfFace);
const rfStem=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.55,10),postM);rfStem.position.y=0.42;rf.add(rfStem);
/* 波场曲线:瞬时声压 + 包络 */
const SEG=96;
function fieldLine(color,op){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array((SEG+1)*3),3));
  const ln=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
  scene.add(ln);return ln;
}
const waveLine=fieldLine(0x74c0fc,0.95),envUp=fieldLine(0x38d9a9,0.5),envDn=fieldLine(0x38d9a9,0.5);
/* 节点环(势阱标记) */
const rings=[];
const ringGeo=new THREE.TorusGeometry(0.52,0.016,6,42);
for(let i=0;i<8;i++){
  const r=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x63e6be,transparent:true,opacity:0.5}));
  r.rotation.x=Math.PI/2;r.visible=false;scene.add(r);rings.push(r);
}
/* 液滴(InstancedMesh) */
const MAXD=8;
const dropMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,14,12),
  new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.12,metalness:0.05,transparent:true,opacity:0.9,emissive:0x1864ab,emissiveIntensity:0.3}),MAXD);
scene.add(dropMesh);
const drops=[];for(let i=0;i<MAXD;i++)drops.push({y:Y0,vy:0,mode:'idle',s:0});
const m4=new THREE.Matrix4();

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,target=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);target.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('换能器:压电陶瓷振动,发射 40 kHz 超声','Transducer: a piezo disc radiating 40 kHz ultrasound'),new THREE.Vector3(-2.0,0.55,1.6),'o');
addLabel(()=>L('反射器:把入射波弹回去,叠成驻波','Reflector: bounces the wave back into a standing field'),new THREE.Vector3(0,0.8,1.7),'b',()=>true,rf);
addLabel(()=>L('波节 = 声辐射压势阱:液滴被锁在这里','Node = radiation-pressure well: droplets lock here'),new THREE.Vector3(2.9,3.3,0),'g');
addLabel(()=>L('液滴 0.8 mm ≪ λ/2 = 4.29 mm:辐射力顶住重力','Droplet 0.8 mm ≪ λ/2 = 4.29 mm: radiation force vs gravity'),new THREE.Vector3(-3.1,2.3,0.6),'y');
addLabel(()=>L('λ=c/f=8.58 mm;间距每变 λ/2,节点增减一个','λ=c/f=8.58 mm; every λ/2 of gap adds one node'),new THREE.Vector3(2.6,1.0,1.9),'o');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let speed=clamp(qf('speed',1),0.3,2.5);
if(qs.get('pause')==='1')playing=false;
let halfW=5,power=60,nDrop=2;
const CL=343,FQ=40000,LAM=CL/FQ*1000,U=0.62;   // λ=8.575 mm;1 个 λ/2 = 0.62 场景单位
function detune(){return Math.abs(halfW-Math.round(halfW));}
function standingF(){const d=detune();return d<=0.15?1:d>=0.45?0:1-(d-0.15)/0.3;}
function nodeN(){return Math.max(2,Math.round(halfW))-1;}     // 内部节点数
function gapH(){return halfW*U;}
function nodeY(j){return Y0+gapH()*(j+1)/Math.max(2,Math.round(halfW));}
function spl(){return 118+20*Math.log10(Math.max(power,1));}
function capN(){const sf=standingF(),c=Math.floor(power*1.55/21);return sf>=1?c:sf>0?Math.floor(c/2):0;}
function trappedN(){return Math.min(nDrop,nodeN(),capN());}

/* ---- UI 元素 ---- */
const elHW=document.getElementById('sHW'),elHWVal=document.getElementById('sHWVal');
const elPW=document.getElementById('sPW'),elPWVal=document.getElementById('sPWVal');
const elND=document.getElementById('sND'),elNDVal=document.getElementById('sNDVal');
const elSpeed=document.getElementById('sSpeed'),elSpeedVal=document.getElementById('sSpeedVal');
const tglLabelsEl=document.getElementById('tglLabels');
const tglFieldEl=document.getElementById('tglField');
const tglRingsEl=document.getElementById('tglRings');
const stSpl=document.getElementById('stSpl'),stLam=document.getElementById('stLam'),
  stW=document.getElementById('stW'),stSt=document.getElementById('stSt');
function setHW(v){halfW=v;elHW.value=v;elHWVal.textContent=v.toFixed(2)+' ×λ/2';}
function setPW(v){power=v;elPW.value=v;elPWVal.textContent=v.toFixed(0)+' %';}
function setND(v){nDrop=Math.round(v);elND.value=nDrop;elNDVal.textContent=nDrop;}
function setSpeed(v){speed=v;elSpeed.value=v;elSpeedVal.textContent=v.toFixed(1)+'×';}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'换能器发射 40 kHz 超声(λ = 8.58 mm)',en:'The transducer fires 40 kHz ultrasound (λ = 8.58 mm)',
  act:()=>{setHW(4);setPW(45);setND(0);}},
 {zh:'反射器把入射波弹回,与出射波叠成驻波',en:'The reflector returns the wave — incident + reflected = standing wave',
  act:()=>{setHW(5);setPW(60);setND(0);}},
 {zh:'声辐射压(二阶效应)在波节处挖出势阱',en:'Acoustic radiation pressure (2nd order) digs wells at the nodes',
  act:()=>{setHW(5);setPW(60);setND(1);}},
 {zh:'小液滴被压进节点:辐射力与重力 mg 平衡',en:'Small droplets pressed into nodes: radiation force balances mg',
  act:()=>{setHW(5);setPW(70);setND(2);}},
 {zh:'间距每变 λ/2 = 4.29 mm,节点增减一个——液滴在节点间搬家',en:'Every λ/2 = 4.29 mm of gap adds/removes a node — droplets hop between nodes',
  act:()=>{setHW(7);setPW(85);setND(4);}},
 {zh:'失谐(偏离整数 λ/2)或超载:势阱消失,当场掉落',en:'Detune (off integer λ/2) or overload: wells vanish — droplets drop',
  act:()=>{setHW(5.5);setPW(60);setND(4);}}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  stSpl.innerHTML=spl().toFixed(1)+'<small> dB</small>';
  stLam.innerHTML=LAM.toFixed(2)+'<small> mm</small>';
  stW.innerHTML='2.14<small> '+L('mg/滴','mg each')+'</small>';
  const tn=trappedN();
  if(nDrop===0){stSt.textContent=L('— 无滴','— none');stSt.className='v';}
  else if(tn>0){stSt.textContent=L(`悬浮 ${tn}/${nDrop} 滴`,`floating ${tn}/${nDrop}`);stSt.className='v ok';}
  else{stSt.textContent=L('掉落!','falling!');stSt.className='v warn';}
}

/* ---- 事件 ---- */
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
const bOne=document.getElementById('bOne'),bStrand=document.getElementById('bStrand'),bFall=document.getElementById('bFall');
function mark(btn){[bOne,bStrand,bFall].forEach(b=>b.classList.toggle('on',b===btn));}
bOne.addEventListener('click',()=>{setHW(5);setPW(55);setND(1);mark(bOne);});
bStrand.addEventListener('click',()=>{setHW(6);setPW(100);setND(5);mark(bStrand);});
bFall.addEventListener('click',()=>{setHW(5.35);setPW(75);setND(4);mark(bFall);});
elHW.addEventListener('input',e=>setHW(+e.target.value));
elPW.addEventListener('input',e=>setPW(+e.target.value));
elND.addEventListener('input',e=>setND(+e.target.value));
elSpeed.addEventListener('input',e=>setSpeed(+e.target.value));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
tglLabelsEl.addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=LANG==='en'?'Acoustic Levitation · nodes hold droplets':'声悬浮 · 用声波的节点托住水滴';
  buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speed;
  const sdt=playing?dts:0;
  simT+=sdt;
  const gap=gapH(),N=Math.max(2,Math.round(halfW)),k=Math.PI*N/gap,sf=standingF();
  rf.position.y=Y0+gap+0.23;
  /* 波场 */
  const showF=tglFieldEl.checked;
  waveLine.visible=envUp.visible=envDn.visible=showF;
  if(showF){
    const A=0.05+0.3*power/100,om=simT*2.6;
    const pw=waveLine.geometry.attributes.position,
      pu=envUp.geometry.attributes.position,pd=envDn.geometry.attributes.position;
    for(let i=0;i<=SEG;i++){
      const y=Y0+gap*i/SEG,ph=k*(y-Y0);
      const inst=Math.sin(ph)*(sf*Math.cos(om)+(1-sf)*Math.cos(om-1.25*ph));
      pw.setXYZ(i,inst*A,y,0);
      const env=A*(Math.abs(Math.sin(ph))*sf+0.06);
      pu.setXYZ(i,env,y,0);pd.setXYZ(i,-env,y,0);
    }
    pw.needsUpdate=pu.needsUpdate=pd.needsUpdate=true;
  }
  /* 节点环 */
  const nn=nodeN();
  rings.forEach((r,j)=>{
    const on=tglRingsEl.checked&&j<nn&&sf>0.03;
    r.visible=on;
    if(on){r.position.y=nodeY(j);r.material.opacity=(0.2+0.35*sf)*(0.65+0.35*Math.sin(simT*3+j));}
  });
  /* 液滴状态机 */
  const tn=trappedN();
  for(let i=0;i<MAXD;i++){
    const d=drops[i];
    if(i>=nDrop){d.s=Math.max(0,d.s-dts*4);if(d.s<=0)d.mode='idle';}
    else if(i<tn){
      d.mode='trap';
      d.y+=(nodeY(Math.min(i,nn-1))-d.y)*Math.min(1,sdt*2.8);
      d.vy=0;d.s=Math.min(1,d.s+sdt*3);
    }else{
      if(d.mode!=='fall'){d.mode='fall';if(d.vy<0)d.vy=0;}
      d.vy+=sdt*4.5;d.y-=d.vy*sdt;
      if(d.y<=0.32){d.y=0.32;d.vy=Math.abs(d.vy)>0.5?-d.vy*0.3:0;}
      d.s=Math.min(1,d.s+sdt*3);
    }
  }
  for(let i=0;i<MAXD;i++){
    const d=drops[i];
    let sx=d.s,sy=d.s;
    if(d.mode==='fall'&&d.y<=0.33&&d.vy===0){sx*=1.45;sy*=0.5;}
    m4.makeScale(sx,sy,sx);m4.setPosition(0,d.y,0);
    dropMesh.setMatrixAt(i,m4);
  }
  dropMesh.instanceMatrix.needsUpdate=true;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
let phaseIdx=3;
{const t0=parseInt(qs.get('t'),10);if(Number.isFinite(t0)&&t0>=0&&t0<STEPS.length)phaseIdx=t0;}
labelsOn=!(qs.get('labels')==='0');
tglLabelsEl.checked=labelsOn;
setSpeed(speed);
applyTheme();applyLang();
setHW(5);setPW(60);setND(2);
applyPhase(phaseIdx);
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
