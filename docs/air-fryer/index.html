<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空气炸锅 · 热风怎么「炸」</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#c9552f;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a04323;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,67,35,.9); color: #8a3a12; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.g { color: #7bd88f; }
  #stats .v.b { color: #d9a441; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(201,85,47,.6); background: rgba(201,85,47,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,67,35,.55); background: rgba(160,67,35,.10); }
  #legend { display: flex; gap: 7px; margin: 4px 0 6px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc4b5; border-color: rgba(255,122,92,.7); }
  .chip.p { color: #ffe0ae; border-color: rgba(255,180,84,.9); }
  .chip.f { color: #ffd9a3; border-color: rgba(255,159,28,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.r { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.p { color: #8a5c0d; border-color: rgba(160,106,18,.9); }
  :root[data-theme="light"] .chip.f { color: #9c5f00; border-color: rgba(156,95,0,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row.off { display: none; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .ticks { position: relative; height: 12px; margin: 0 60px 0 100px; }
  .ticks span { position: absolute; top: 0; font-size: 9.5px; color: var(--text2); transform: translateX(-50%); }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(201,85,47,.10); border-color: rgba(201,85,47,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,67,35,.08); border-color: rgba(160,67,35,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffb89d; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="空气炸锅:热风怎么「炸」" data-en="Air fryer: how hot wind &quot;fries&quot;">空气炸锅:热风怎么「炸」</h1>
  <div class="sub" data-zh="电阻丝把空气烧到 180–200 °C → 大风轮强制循环、把热边界层吹薄 → 对流换热 ≈ 静置烤箱的 3–5 倍 → 表面迅速脱水到 140–165 °C 触发美拉德上色,外脆里嫩 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A coil roasts the air to 180–200 °C → a fan forces it round, thinning the thermal boundary layer → convection ≈ 3–5× a static oven → the surface dries fast to 140–165 °C, triggering Maillard browning: crisp outside, juicy inside · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">电阻丝把空气烧到 180–200 °C → 大风轮强制循环、把热边界层吹薄 → 对流换热 ≈ 静置烤箱的 3–5 倍 → 表面迅速脱水到 140–165 °C 触发美拉德上色,外脆里嫩 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="腔温" data-en="cavity temp">腔温</span><span class="v hot" id="stC">—</span>
  <span class="k" data-zh="表面温度" data-en="surface temp">表面温度</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="对流系数 h" data-en="convection h">对流系数 h</span><span class="v g" id="stH">—</span>
  <span class="k" data-zh="上色度" data-en="browning">上色度</span><span class="v b" id="stB">0 %</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="btnFan" data-zh="风扇:开" data-en="Fan: ON">风扇:开</button>
    <button class="abtn" id="btnFF" data-zh="快进 10 min" data-en="Skip 10 min">快进 10 min</button>
    <button class="abtn" id="btnFlip" data-zh="翻面" data-en="Flip food">翻面</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="Reset">复位</button>
  </div>
  <div class="row"><label data-zh="设定温度" data-en="Setpoint">设定温度</label><input id="setT" type="range" min="150" max="230" step="5" value="200"><span class="val" id="setTVal">200 °C</span></div>
  <div class="ticks"><span style="left:37.5%">180</span><span style="left:62.5%;color:var(--hot);font-weight:700">200</span><span style="left:87.5%">220</span></div>
  <div class="row"><label data-zh="风量(0=静置烤箱)" data-en="Fan (0=static)">风量(0=静置烤箱)</label><input id="fan" type="range" min="0" max="100" step="5" value="100"><span class="val" id="fanVal">100 %</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="legend">
    <span class="chip b" data-zh="腔内热风" data-en="hot airflow">腔内热风</span>
    <span class="chip p" data-zh="热边界层 δ" data-en="boundary layer δ">热边界层 δ</span>
    <span class="chip r" data-zh="加热丝" data-en="heater coil">加热丝</span>
    <span class="chip f" data-zh="油雾" data-en="oil spray">油雾</span>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglPre" type="checkbox" checked> <span data-zh="预热" data-en="preheat">预热</span></label>
      <label><input id="tglOil" type="checkbox"> <span data-zh="油喷雾" data-en="oil spray">油喷雾</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../maillard-reaction/" data-zh="上色的化学:美拉德反应" data-en="the chemistry of browning: Maillard">上色的化学:美拉德反应</a>
    <a href="../microwave-oven/" data-zh="微波炉:另一种加热" data-en="microwave oven: the other heater">微波炉:另一种加热</a>
    <a href="../induction-cooktop/" data-zh="电磁炉:感应加热" data-en="induction cooktop: heating by induction">电磁炉:感应加热</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.shell.color.set(THEME === 'light' ? 0x8b95a5 : 0x232a35);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('空气炸锅 · 热风怎么「炸」', 'The Air Fryer · how hot wind fries');
  for (const r of labelReg) {
    if (r.span) r.span.textContent = r.text();
    else r.o.element.textContent = r.text();
  }
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  syncFanBtn();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.3, 2.6, 4.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xfff1e0, 2.0);
key.position.set(4, 8, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  shell: mat(0x232a35, { roughness: 0.55, metalness: 0.25, emissive: 0x000000 }),
  inner: mat(0x3d4653, { roughness: 0.6, metalness: 0.3 }),
  tray: mat(0x2c333d, { metalness: 0.6, roughness: 0.4 }),
  slat: mat(0x4a5462, { metalness: 0.55 }),

const TENV = 25, EAoR = 12027, T140K = 413.15;
let setT = 200, fanFrac = 1, oil = false, preheat = true;
let Tcav = 200, Tsurf = TENV, water = 65, heaterOn = true;
let brownAvg = 0, tSim = 0, crossed = false, flipT = 0, coilGlow = 0;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
const pending = [];
const hEff = () => (12 + 40 * fanFrac) * (oil ? 1.12 : 1);
const kRel = T => T < 140 ? 0 : Math.exp(EAoR * (1 / T140K - 1 / (T + 273.15)));
function physStep(dm) {
  const h = hEff();
  if (heaterOn && Tcav > setT + 4) heaterOn = false;
  else if (!heaterOn && Tcav < setT - 4) heaterOn = true;
  const dC = (heaterOn ? (setT + 30 - Tcav) * 0.55 : (setT - Tcav) * 0.5)
    - (Tcav - Tsurf) * 0.085 * (h / 52) - (Tcav - TENV) * 0.02;
  Tcav = Math.max(TENV, Tcav + dC * dm);
  if (water > 0.5) {
    Tsurf += (98 - Tsurf) * Math.min(3.2, 0.8 + h * 0.045) * dm;
    water = Math.max(0, water - (Tcav - 100) * (0.05 + h * 0.0045) * (oil ? 1.15 : 1) * dm);
  } else {
    water = 0;
    const Teq = TENV + (Tcav - TENV) * (h / (h + 5));
    Tsurf += (Teq - Tsurf) * (0.3 + h * 0.045) * dm;
  }
  const kr = kRel(Tsurf);
  let sum = 0;
  const uni = ss(0.25, 0.75, fanFrac);
  for (let i = 0; i < FRIES_N; i++) {
    const f = fryD[i];
    if (kr > 0) {
      const m = f.nz + (1 - f.nz) * uni;
      f.brown = Math.min(1, f.brown + kr * 0.0048 * m * dm);
    }
    sum += f.brown;
  }
  brownAvg = sum / FRIES_N;
  if (!crossed && water <= 0.5 && Tsurf >= 140) { crossed = true; pending.push(-1); }
  tSim += dm;
}
function resetState() {
  tSim = 0; Tcav = preheat ? setT : TENV;
  heaterOn = Tcav < setT - 4;
  Tsurf = TENV; water = 65; brownAvg = 0; crossed = false; flipT = 0;
  for (const f of fryD) { f.brown = 0; f.base = 0; }
  for (const s of steamP) s.life = 0;
  for (const o of oilP) o.life = 0;
  pending.length = 0;
}
function fastForward(min) {
  const limit = tSim + min;
  let guard = 0;
  while (tSim < limit && guard++ < 4000) physStep(0.05);
}
function instantSim(min) { resetState(); fastForward(clamp(min, 0, 30)); }

const C_RAW = new THREE.Color(0xe9d29b), C_GOLD = new THREE.Color(0xcf8f3f), C_BROWN = new THREE.Color(0x5a3313);
function updateFries() {
  for (let i = 0; i < FRIES_N; i++) {
    const f = fryD[i];
    let hop = 0, rot = f.base;
    if (flipT > 0) {
      const p = 1 - flipT / 0.7;
      rot = f.base + p * Math.PI;
      hop = Math.sin(p * Math.PI) * 0.32;
    }
    dummy.position.set(f.x, FRY_Y + hop, f.z);
    dummy.rotation.set(rot, f.yaw, 0);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    fries.setMatrixAt(i, dummy.matrix);
    const b = clamp(f.brown, 0, 1);
    if (b < 0.5) tmpC.copy(C_RAW).lerp(C_GOLD, b * 2);
    else tmpC.copy(C_GOLD).lerp(C_BROWN, (b - 0.5) * 2);
    fries.setColorAt(i, tmpC);
  }
  fries.instanceMatrix.needsUpdate = true;
  if (fries.instanceColor) fries.instanceColor.needsUpdate = true;
}
function updateFilm() {
  const vis = clamp(deltaMm() * 0.022, 0.04, 0.3);
  film.scale.y = vis;
  film.position.y = 0.56 + vis / 2;
  M.film.opacity = 0.12 + (deltaMm() / 9) * 0.14;
}
function updateAir(dt) {
  const du = (0.012 + fanFrac * 0.105) * dt * speed;
  for (let i = 0; i < AIR_N; i++) {
    const p = airP[i];
    p.u = (p.u + du) % 1;
    p.curve.getPoint(p.u, dummy.position);
    dummy.position.x += p.ox + Math.sin(p.ph + p.u * 9) * 0.03;
    dummy.position.y += p.oy;
    dummy.position.z += p.oz + Math.cos(p.ph + p.u * 7) * 0.03;
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(fanFrac > 0.03 ? 1 : 0.75);
    dummy.updateMatrix();
    air.setMatrixAt(i, dummy.matrix);
    const hf = clamp((dummy.position.y - 1.12) / 0.42, 0, 1) * clamp(1.15 - Math.abs(dummy.position.x) / 0.62, 0, 1);
    tmpC.copy(C_AIR_C).lerp(C_AIR_H, fanFrac > 0.03 ? hf : hf * 0.35);
    air.setColorAt(i, tmpC);
  }
  air.instanceMatrix.needsUpdate = true;
  if (air.instanceColor) air.instanceColor.needsUpdate = true;
}
let steamAcc = 0, oilAcc = 0;
function updateSteam(dt) {
  for (let i = 0; i < 36; i++) {
    const s = steamP[i];
    if (s.life > 0) {
      s.life -= dt * 0.55;
      s.p.addScaledVector(s.v, dt);
      dummy.position.copy(s.p);
      dummy.scale.setScalar(Math.max(0.2 + 0.7 * Math.sin(Math.PI * clamp(s.life, 0, 1)), 0.001));
      dummy.rotation.set(0, 0, 0);
    } else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();
    steam.setMatrixAt(i, dummy.matrix);
  }
  steam.instanceMatrix.needsUpdate = true;
}
function updateOil(dt) {
  if (oil && playing) {
    oilAcc += dt * 6;
    while (oilAcc >= 1) {
      oilAcc -= 1;
      const o = oilP.find(x => x.life <= 0);
      if (!o) break;
      o.life = 1;
      o.x = (Math.random() - 0.5) * 1.4; o.z = (Math.random() - 0.5) * 0.9; o.y = 1.5;
    }
  }
  for (let i = 0; i < oilN; i++) {
    const o = oilP[i];
    if (o.life > 0) {
      o.y -= 1.4 * dt;
      o.life = o.y > FRY_Y ? 1 : 0;
      dummy.position.set(o.x, o.y, o.z);
      dummy.scale.setScalar(1);
    } else dummy.position.set(0, -10, 0), dummy.scale.setScalar(0.0001);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    oilDrops.setMatrixAt(i, dummy.matrix);
  }
  oilDrops.instanceMatrix.needsUpdate = true;
}

    act: () => { preheat = true; oil = false; fanFrac = 0; setT = 200; jump(() => {}); fastForward(10); firePop(L(`10 min · 上色仅 ${Math.round(brownAvg * 100)} %`, `10 min · only ${Math.round(brownAvg * 100)} % browned`)); } },
  { b: '油的角色:介质 → 涂层', be: 'Oil: medium → coating',
    d: '油炸靠热油直接接触表面,换热极强且油温稳;空气炸锅用「热风 + 几克油喷雾」逼近同样的脆壳——油从介质变成涂层。切「油喷雾」看 h 与上色的小幅提升。',
    de: 'Deep-frying trades heat through direct oil contact — fierce and steady; the air fryer mimics the crust with hot wind plus grams of spray — oil goes from medium to coating. Toggle Oil spray.',
    act: () => { preheat = true; fanFrac = 1; oil = true; setT = 200; jump(() => {}); fastForward(6); } },
];
function stepIndex() {
  if (!preheat && Tcav < setT - 10) return 3;
  if (fanFrac < 0.03 && tSim > 0.5) return 4;
  if (oil && Tsurf >= 140) return 5;
  if (Tsurf >= 140) return 2;
  if (water > 1.5 && Tsurf > 60) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSetT = document.getElementById('setT'), elSetTVal = document.getElementById('setTVal');
const elFan = document.getElementById('fan'), elFanVal = document.getElementById('fanVal');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels'), tglRotate = document.getElementById('tglRotate'),
  tglPre = document.getElementById('tglPre'), tglOil = document.getElementById('tglOil');
const stC = document.getElementById('stC'), stS = document.getElementById('stS'),
  stH = document.getElementById('stH'), stB = document.getElementById('stB');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateFormula() {
  const h = hEff();
  const kr = kRel(Tsurf);
  formulaEl.innerHTML = L(
    `<b>h ≈ ${(12 + 40 * fanFrac).toFixed(0)} W/(m²·K)</b>(静置 ~12 → 强制 ~52,3–5 倍)${oil ? ' · 油喷雾 ×1.12' : ''}<br>` +
    `表面:${water > 0.5 ? `水分 ${Math.round(water)}% · 蒸发吸热钉在 ~100 °C` : `已干 · 温度冲向 140–165 °C,k_rel ≈ <b>×${kr.toFixed(1)}</b>(140 °C=×1)`}<br>` +
    `温控:${heaterOn ? '通电' : '断电'} · 腔温 ${Tcav.toFixed(0)} °C(设定 ${setT} °C ±4)`,
    `<b>h ≈ ${(12 + 40 * fanFrac).toFixed(0)} W/(m²·K)</b> (static ~12 → forced ~52, 3–5×)${oil ? ' · oil spray ×1.12' : ''}<br>` +
    `Surface: ${water > 0.5 ? `water ${Math.round(water)}% · evaporation pins it at ~100 °C` : `dry · racing to 140–165 °C, k_rel ≈ <b>×${kr.toFixed(1)}</b> (140 °C=×1)`}<br>` +
    `Thermostat: ${heaterOn ? 'ON' : 'OFF'} · cavity ${Tcav.toFixed(0)} °C (setpoint ${setT} °C ±4)`);
}
elSetT.addEventListener('input', () => { setT = +elSetT.value; elSetTVal.textContent = setT + ' °C'; });
elFan.addEventListener('input', () => { fanFrac = +elFan.value / 100; elFanVal.textContent = elFan.value + ' %'; syncFanBtn(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
tglPre.addEventListener('change', () => { preheat = tglPre.checked; if (tSim < 0.01) resetState(); });
tglOil.addEventListener('change', () => { oil = tglOil.checked; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
document.getElementById('btnFan').addEventListener('click', () => {
  fanFrac = fanFrac > 0.03 ? 0 : 1;
  elFan.value = Math.round(fanFrac * 100); elFanVal.textContent = Math.round(fanFrac * 100) + ' %';
  syncFanBtn();
});
document.getElementById('btnFF').addEventListener('click', () => {
  fastForward(10);
  firePop(L(`快进 10 min · 上色 ${Math.round(brownAvg * 100)} %`, `skipped 10 min · browning ${Math.round(brownAvg * 100)} %`));
});
document.getElementById('btnFlip').addEventListener('click', () => {
  if (flipT <= 0) {
    flipT = 0.7;
    Tsurf = Math.max(85, Tsurf - 15);
    water = Math.min(70, water + 8);
    firePop(L('翻面 · 新面边界层重建', 'flipped · boundary layer rebuilding'));
  }
});
document.getElementById('btnReset').addEventListener('click', () => resetState());
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    physStep(dt * speed);
    if (water > 1 && Tsurf > 92) {
      steamAcc += dt * speed * (1.2 + Math.max(0, Tcav - 100) * 0.012);
      while (steamAcc >= 1) { steamAcc -= 1; doBurst(0); }
    }
  }
  while (pending.length) doBurst(pending.shift());
  if (flipT > 0) { flipT -= dt; if (flipT <= 0) { flipT = 0; for (const f of fryD) f.base += Math.PI; } }
  coilGlow += ((heaterOn ? 1 : 0.07) - coilGlow) * Math.min(1, dt * 9);
  M.coil.emissiveIntensity = coilGlow * 1.7;
  glow.intensity = coilGlow * 1.5;
  blades.rotation.y -= dt * (0.3 + fanFrac * 15);
  updateFries();
  updateFilm();
  updateAir(dt);
  updateSteam(dt);
  updateOil(dt);
  stC.innerHTML = Tcav.toFixed(0) + ' °C';
  stC.className = 'v' + (heaterOn ? ' hot' : '');
  stS.innerHTML = Tsurf.toFixed(0) + ' °C';
  stS.className = 'v' + (Tsurf >= 140 ? ' hot' : '');
  statAcc += dt;
  if (statAcc > 0.25) {
    statAcc = 0;
    updateFormula();
    stH.innerHTML = hEff().toFixed(0) + ' <small>W/(m²·K)</small>';
    stB.textContent = Math.round(brownAvg * 100) + ' %';
  }
  for (const r of labelReg) if (labelsOn && r.vis() && !r.span) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 3);
instantSim(clamp(qsFloat('t', 0), 0, 30));
syncUI();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
