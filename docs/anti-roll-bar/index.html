<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>稳定杆与防侧倾 · 只治侧倾,不治颠簸</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#29b586;
    --bg:#0f1213;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0d8a63;
    --bg:#eef2f0;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(41,181,134,.6);background:rgba(41,181,134,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(13,138,99,.55);background:rgba(13,138,99,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(41,181,134,.10);border-color:rgba(41,181,134,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(13,138,99,.08);border-color:rgba(13,138,99,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#bdf0dd}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="稳定杆与防侧倾" data-en="Anti-Roll Bars &amp; Body Lean">稳定杆与防侧倾</h1>
  <div class="sub" data-zh="弯道离心力压向外侧悬架→弹簧压缩、车身侧倾 φ=m·a·h/(K_f+K_r)→横向扭杆两端经连杆接左右轮,行程差把它拧转,反力矩顶住侧倾→而两轮同向上抬时两端同转、杆不干预——只治侧倾,不治颠簸→垂直载荷转移 m·a·h/t 一点没少,前后杆刚度配比才决定推头还是甩尾 · 拖动旋转 / 空格运行/暂停" data-en="Cornering inertia presses the outer suspension → springs compress, the body leans φ=m·a·h/(K_f+K_r) → a transverse torsion rod linked to both wheels twists with the travel difference and pushes back → but when both wheels rise together the ends turn alike and the rod idles — it cures lean, not bumps → total load transfer m·a·h/t never goes away, and the front:rear stiffness split decides push or oversteer · drag to orbit / Space = run/pause">弯道离心力压向外侧悬架→弹簧压缩、车身侧倾 φ=m·a·h/(K_f+K_r)→横向扭杆两端经连杆接左右轮,行程差把它拧转,反力矩顶住侧倾→而两轮同向上抬时两端同转、杆不干预——只治侧倾,不治颠簸→垂直载荷转移 m·a·h/t 一点没少,前后杆刚度配比才决定推头还是甩尾 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10161a,10,34);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,200);
camera.position.set(3.5,1.85,4.9);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.72,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.2;controls.maxDistance=18;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(5,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ── 场景:简化车辆,车长沿 Z,前轴 +Z,左右沿 X ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
const roadM=new THREE.MeshStandardMaterial({color:0x2a2d33,roughness:0.9});
const road=new THREE.Mesh(new THREE.BoxGeometry(4.2,0.05,7.5),roadM);
road.position.y=0.005;scene.add(road);
/* 车身 */
const bodyG=new THREE.Group();scene.add(bodyG);
const bodyM=new THREE.MeshStandardMaterial({color:0x3f74b8,roughness:0.42,metalness:0.25});
const baseBox=new THREE.Mesh(new THREE.BoxGeometry(1.34,0.36,2.5),bodyM);
baseBox.position.y=0.90;bodyG.add(baseBox);
const cabinM=new THREE.MeshStandardMaterial({color:0x33649e,roughness:0.5,metalness:0.2,transparent:true,opacity:0.92});
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.14,0.34,1.15),cabinM);
cabin.position.set(0,1.24,-0.15);bodyG.add(cabin);
/* 车轮 */
const rubM=new THREE.MeshStandardMaterial({color:0x2b2b30,roughness:0.85});
const rimM2=new THREE.MeshStandardMaterial({color:0xb8c2cc,roughness:0.35,metalness:0.7});
const wheels=[];
for(const zx of [1.3,-1.3])for(const xy of [-0.75,0.75]){
  const g=new THREE.Group();
  const tire=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.075,12,28),rubM);
  tire.rotation.y=Math.PI/2;g.add(tire);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.15,14),rimM2);
  hub.rotation.z=Math.PI/2;g.add(hub);
  for(let i=0;i<4;i++){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.4,0.03),rimM2);
    sp.rotation.x=i*Math.PI/4;g.add(sp);
  }
  g.position.set(xy,0.31,zx);scene.add(g);
  wheels.push({g,xy,zx});
}
/* 螺旋弹簧 ×4 */
function helixGeo(){
  const pts=[];const turns=5.5;
  for(let i=0;i<=110;i++){
    const t=i/110;
    pts.push(new THREE.Vector3(Math.cos(t*turns*2*Math.PI)*0.085,t,Math.sin(t*turns*2*Math.PI)*0.085));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),130,0.015,8);
}
const springM=new THREE.MeshStandardMaterial({color:0xe8b23a,roughness:0.4,metalness:0.6});
const springs=wheels.map(w=>{
  const s=new THREE.Mesh(helixGeo(),springM);
  s.position.set(w.xy,0,w.zx);scene.add(s);return s;
});
/* 稳定杆:横置扭杆 + 端部扭转段 + 连杆 */
const barM=new THREE.MeshStandardMaterial({color:0x29b586,roughness:0.4,metalness:0.55,emissive:0x29b586,emissiveIntensity:0.12});
const linkM=new THREE.MeshStandardMaterial({color:0xdfe6ee,roughness:0.3,metalness:0.8});
function makeBar(zx){
  const grp=new THREE.Group();grp.position.set(0,0.30,zx*0.92);scene.add(grp);
  const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,1.06,14),barM);
  mid.rotation.z=Math.PI/2;grp.add(mid);
  const ends=[];
  for(const sx of [-1,1]){
    const eg=new THREE.Group();eg.position.set(sx*0.55,0,0);grp.add(eg);
    const stub=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,0.24,12),barM);
    stub.rotation.z=Math.PI/2;stub.position.x=sx*0.12;eg.add(stub);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.16),barM);
    arm.position.set(sx*0.235,0,0.07);eg.add(arm);
    const stripe=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.012,8,20),
      new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.4,emissive:0xffd43b,emissiveIntensity:0.4}));
    stripe.rotation.y=Math.PI/2;stripe.position.x=sx*0.20;eg.add(stripe);
    ends.push({eg,sx});
  }
  const links=[];
  for(const sx of [-1,1]){
    const lk=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,1,8),linkM);
    scene.add(lk);links.push({m:lk,sx});
  }
  return {grp,ends,links,zx};
}
const barF=makeBar(1), barR=makeBar(-1);
/* 离心力 / 抓地力 / 载荷转移箭头 */
function mkArrow(color){
  const m=new THREE.MeshStandardMaterial({color,roughness:0.4,emissive:color,emissiveIntensity:0.45});
  const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,10),m);
  cyl.rotation.z=-Math.PI/2;cyl.position.x=0.5;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.22,12),m);
  cone.rotation.z=-Math.PI/2;cone.position.x=1.0;g.add(cone);
  g.rotation.y=0;scene.add(g);g.userData.mat=m;return g;
}
const aCf=mkArrow(0xffa94d);
const aGrip=wheels.map(()=>mkArrow(0x74c0fc));

/* 状态 */
let barMode='both',scenario='corner',barK=18000,aG=0.6,vKmh=60;
let playing=true,labelsOn=true,slowMo=false,loadOn=true;
let z=0,vz=0,p=0,vp=0,r=0,vr=0,aLat=0,simT=0;

const M=1300,K=22000,C=2600,T=1.5,ZX=1.3,H=0.55,IP=1900,IR=600,G=9.81;
const KS_AXLE=2*K*0.75*0.75;                       /* 每轴弹簧侧倾刚度 24750 */
let dWF=0,dWR=0,twF=0,twR=0,uFl=0,uFr=0,udFl=0,udFr=0;
function bumpU(c,t0b){
  const u=(c-t0b)/1.2;
  if(u<=0||u>=1)return [0,0];
  const h=0.13*Math.pow(Math.sin(Math.PI*u),2);
  const hd=0.13*Math.PI/1.2*Math.sin(2*Math.PI*u);
  return [h,hd];
}
function roadInputs(){
  if(scenario!=='bump')return [[0,0],[0,0],[0,0],[0,0]];
  const c=simT%7;
  let l=0,ld=0,rr=0,rrd=0;
  if(c>0.7&&c<1.9){[l,ld]=bumpU(c,0.7);}
  if(c>3.5&&c<4.7){[l,ld]=bumpU(c,3.5);[rr,rrd]=bumpU(c,3.5);}
  return [[l,ld],[rr,rrd],[0,0],[0,0]];       /* 只有前轴过坎:fl,fr,rl,rr */
}
function barKF(){return barMode==='front'||barMode==='both'?barK:0;}
function barKR(){return barMode==='rear'||barMode==='both'?barK:0;}

}

const lblBarF=addLabel(()=>L(`前扭杆扭转 ${(twF*57.3).toFixed(1)}°`,`front bar twist ${(twF*57.3).toFixed(1)}°`),

const lblRad=addLabel(()=>aLat>0.05?L(`弯道半径 R=v²/a=${(Math.pow(vKmh/3.6,2)/aLat).toFixed(0)} m`,

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const roll=document.getElementById('stRoll');
  roll.innerHTML=rollDeg().toFixed(1)+'<small> °</small>';
  roll.className='v '+(rollDeg()>5.5?'warn':rollDeg()<3.5?'ok':'');
  document.getElementById('stTr').innerHTML=
    Math.abs(dWF).toFixed(0)+'<small> / </small>'+Math.abs(dWR).toFixed(0)+'<small> kg</small>';
  const ratio=(KS_AXLE+barKF())/Math.max(1,KS_AXLE+barKR());
  const rv=document.getElementById('stRatio');

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});

const clock=new THREE.Clock();
let raf=null;
const UP=new THREE.Vector3(0,1,0);
function setLink(m,p1,p2){
  const d=p2.clone().sub(p1),len=Math.max(0.01,d.length());
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.scale.set(1,len,1);
  m.quaternion.setFromUnitVectors(UP,d.normalize());
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 物理:3 自由度车身(heave/pitch/roll)+ 每轴扭杆 ── */
  const inputs=roadInputs();
  const aT=scenario==='corner'?aG*G:0;
  aLat+=(aT-aLat)*Math.min(1,dts*1.4);
  const kF=barKF(),kR=barKR();
  const r_wF=(inputs[1][0]-inputs[0][0])/T, r_wR=(inputs[3][0]-inputs[2][0])/T;
  const uArr=[inputs[0][0],inputs[1][0],inputs[2][0],inputs[3][0]];
  const udArr=[inputs[0][1],inputs[1][1],inputs[2][1],inputs[3][1]];
  let n=Math.min(40,Math.max(1,Math.ceil(dts/0.004)));
  const h=dts/n;
  const xyA=[-0.75,0.75,-0.75,0.75], zxA=[1.3,1.3,-1.3,-1.3];
  const Fs=[0,0,0,0];
  for(let s=0;s<n;s++){
    let mRoll=0,mPitch=0,mHeave=0;
    for(let i=0;i<4;i++){
      const delta=z+p*zxA[i]+r*xyA[i];
      const dd=vz+vp*zxA[i]+vr*xyA[i];
      const f=-K*(delta-uArr[i])-C*(dd-udArr[i]);
      Fs[i]=f;mHeave+=f;mPitch+=f*zxA[i];mRoll+=f*xyA[i];
    }
    const mBarF=-kF*(r-r_wF), mBarR=-kR*(r-r_wR);
    mRoll+=mBarF+mBarR-M*aLat*H;
    vz+=mHeave/M*h; z+=vz*h;
    vp+=mPitch/IP*h; p+=vp*h;
    vr+=mRoll/IR*h;  r+=vr*h;
  }
  const mBarF=-kF*(r-r_wF), mBarR=-kR*(r-r_wR);
  /* 轮载转移:弹簧力 + 杆端力(压缩侧轮载增加;低通滤波) */
  const fBarF=mBarF/T, fBarR=mBarR/T;
  const trF=(Fs[0]-fBarF)/G, trF2=(Fs[1]+fBarF)/G;
  const trR=(Fs[2]-fBarR)/G, trR2=(Fs[3]+fBarR)/G;
  const dF=(trF-trF2)/2, dR=(trR-trR2)/2;
  const lp=Math.min(1,dts*4);
  dWF+=(dF-dWF)*(dts>0?lp:0); dWR+=(dR-dWR)*(dts>0?lp:0);
  twF=clamp((r-r_wF)*2.6,-0.7,0.7); twR=clamp((r-r_wR)*2.6,-0.7,0.7);
  /* ── 可视化 ── */
  bodyG.position.y=z;
  bodyG.rotation.z=r; bodyG.rotation.x=-p;
  const yb=[z+p*1.3+r*-0.75, z+p*1.3+r*0.75, z+p*-1.3+r*-0.75, z+p*-1.3+r*0.75];
  for(let i=0;i<4;i++){
    const w=wheels[i];
    w.g.position.y=0.31+uArr[i];
    w.g.rotation.x+=vKmh/3.6/0.31*dts*0.15;
    const top=0.72+yb[i], bot=0.42+uArr[i];
    springs[i].scale.y=Math.max(0.06,top-bot);
    springs[i].position.y=bot;
  }
  /* 扭杆端部旋转 + 连杆跟随 */
  const setBarTw=(bar,tw,base)=>{
    for(const e of bar.ends){e.eg.rotation.x=tw*e.sx;}
    for(const lk of bar.links){
      const sx=lk.sx;
      const p1=new THREE.Vector3(sx*0.78,0.30+Math.sin(tw)*0.12*sx,bar.zx*0.92+0.14);
      const p2=new THREE.Vector3(sx*0.72,0.46+uArr[base+(sx<0?0:1)],bar.zx*1.28);
      setLink(lk.m,p1,p2);
    }
  };
  setBarTw(barF,twF,0); setBarTw(barR,twR,2);
  /* 力箭头 */
  const cfLen=clamp(aLat*0.85,0,1.1);
  aCf.visible=cfLen>0.03;
  if(aCf.visible){aCf.position.set(-0.4,1.32,0);aCf.scale.set(cfLen,1,1);}
  aGrip.forEach((ar,i)=>{
    const gl=clamp(aLat*0.3,0,0.35);
    ar.visible=gl>0.02;
    if(ar.visible){
      ar.position.set(wheels[i].xy+0.28,0.34,wheels[i].zx);
      ar.rotation.y=Math.PI;ar.scale.set(gl,1,1);
    }
  });
  const dArr=[trF,trF2,trR,trR2];
  aLoad.forEach((ar,i)=>{
    const val=dArr[i];
    const show=loadOn&&Math.abs(val)>25;
    ar.visible=show;
    if(show){
      const len=clamp(Math.abs(val)*7e-4,0.08,0.42);
      ar.position.set(wheels[i].xy*1.34,0.92,wheels[i].zx);
      ar.rotation.set(0,0,val>0?-Math.PI/2:Math.PI/2);
      ar.scale.set(len,1,1);
      const hex=val>0?0xff6b6b:0x74dc84;
      ar.userData.mat.color.setHex(hex);ar.userData.mat.emissive.setHex(hex);
    }
  });
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const rr2 of labelReg){
    const on=labelsOn&&rr2.vis();
    rr2.o.visible=on&&rr2.text()!=='';
    if(on)rr2.o.element.textContent=rr2.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
