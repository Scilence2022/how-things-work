<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>爆轰与爆燃 · 火焰追上自己的激波</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  :root[data-theme="light"]{

    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}

    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="title">
  <h1 data-zh="爆轰与爆燃" data-en="Deflagration & Detonation">爆轰与爆燃</h1>
  <div class="sub" data-zh="燃烧有两种速度:爆燃的火焰面亚音速爬行,靠传热点火;爆轰的火焰追上了自己推出的激波,超音速自持——激波压缩替火焰打头阵;同一条管子里,火焰被障碍物揉皱加速,追上激波的那一刻就是 DDT:内燃机防的是它,爆破工程用的是它 · 拖动旋转 / 空格运行/暂停" data-en="Combustion runs at two speeds: deflagration, a flame front crawling subsonically on heat transfer; detonation, the flame catching up with its own shock and locking in supersonically — the shock compresses and ignites ahead of the fire; in one tube, obstacles crumple and accelerate the flame until it catches the shock: that's DDT — engines spend fortunes preventing it, demolition spends fortunes causing it · drag to orbit / Space = run/pause">燃烧有两种速度:爆燃的火焰面亚音速爬行,靠传热点火;爆轰的火焰追上了自己推出的激波,超音速自持——激波压缩替火焰打头阵;同一条管子里,火焰被障碍物揉皱加速,追上激波的那一刻就是 DDT:内燃机防的是它,爆破工程用的是它 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-8.3,4.4,10.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.4,1.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ===== 横向爆轰管(剖视,轴线沿 X,中心 y=1.4) ===== */
const tubeR=0.75,TY=1.4;
let tubeLen=11;
const wallM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.3,metalness:0.7,transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false});
const tube=new THREE.Mesh(new THREE.CylinderGeometry(tubeR,tubeR,1,40,1,true),wallM);
tube.rotation.z=Math.PI/2;tube.position.y=TY;scene.add(tube);
const ringM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.35,metalness:0.7,emissive:0xffa94d,emissiveIntensity:0.15});
const ringL=new THREE.Mesh(new THREE.TorusGeometry(tubeR,0.06,10,40),ringM);
ringL.rotation.y=Math.PI/2;scene.add(ringL);
const ringR=ringL.clone();scene.add(ringR);
const legM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const legA=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.65,0.5),legM);legA.position.set(-2.75,0.325,0);scene.add(legA);
const legB=legA.clone();legB.position.x=2.75;scene.add(legB);
/* 点火电极 + 火花 */
const eleM=new THREE.MeshStandardMaterial({color:0xd8a03c,metalness:0.7,roughness:0.3});
const ele=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.1,0.1),eleM);scene.add(ele);
const spark=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2.5}));
spark.visible=false;scene.add(spark);
/* 障碍物(上下交错的挡块) */
const obGrp=new THREE.Group();scene.add(obGrp);
const obM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.45,metalness:0.55});
let obs=[];
function buildObstacles(){obGrp.clear();obs=[];
  const nB=Math.min(10,Math.round(density/100*(tubeLen-2.2)/1.4));
  for(let i=0;i<nB;i++){
    const top=i%2===0,bh=tubeR*0.85;
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.12,bh,0.8),obM);
    m.position.set(-tubeLen/2+1.1+i*1.4,TY+(top?tubeR-bh/2:-(tubeR-bh/2)),(i%4<2?0.18:-0.18));
    obGrp.add(m);obs.push({x:m.position.x,passed:false});}
  obLbl.position.set(obs.length?obs[0].x:0,TY+1.15,0);}
/* 混气粒子 */
const NP=150;
const part=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5}),NP);
part.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(part);
const partD=[];for(let i=0;i<NP;i++)partD.push({bx:0,oy:0,oz:0,ph:Math.random()*7,st:0,k:0});
const col=new THREE.Color();
function seedParts(){for(const p of partD){
  p.bx=-tubeLen/2+0.25+Math.random()*(tubeLen-0.5);
  const a=Math.random()*Math.PI*2,rr=Math.random()*0.55;
  p.oy=Math.sin(a)*rr;p.oz=Math.cos(a)*rr;p.st=0;p.k=0;}
  for(let i=0;i<NP;i++)part.setColorAt(i,col.setRGB(0.75,0.83,0.91));
  if(part.instanceColor)part.instanceColor.needsUpdate=true;}
/* 火焰面(橙)+ 皱褶 + 爆轰面(白)+ 前驱激波(淡蓝) */
const flameGrp=new THREE.Group();scene.add(flameGrp);
const flM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xd9822b,emissiveIntensity:1.8,transparent:true,opacity:0.9});
const mainDisk=new THREE.Mesh(new THREE.CylinderGeometry(tubeR*0.96,tubeR*0.96,0.05,36),flM);
mainDisk.rotation.z=Math.PI/2;flameGrp.add(mainDisk);
const wkM=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xe8590c,emissiveIntensity:1.3,transparent:true,opacity:0.55});
const wks=[];
for(let i=0;i<3;i++){const w=new THREE.Mesh(new THREE.CylinderGeometry(tubeR*(0.8-0.12*i),tubeR*(0.8-0.12*i),0.04,28),wkM);
  w.rotation.z=Math.PI/2;flameGrp.add(w);wks.push(w);}
const detM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2.2,transparent:true,opacity:0.95});
const detCore=new THREE.Mesh(new THREE.CylinderGeometry(tubeR*0.98,tubeR*0.98,0.08,36),detM);
detCore.rotation.z=Math.PI/2;detCore.visible=false;flameGrp.add(detCore);
const wave=new THREE.Mesh(new THREE.CylinderGeometry(tubeR*0.98,tubeR*0.98,0.04,36),
  new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x74c0fc,emissiveIntensity:0.7,transparent:true,opacity:0.25}));
wave.rotation.z=Math.PI/2;wave.visible=false;scene.add(wave);
const halo=new THREE.PointLight(0xffa94d,1.2,9);halo.position.set(0,TY,0);scene.add(halo);
const m4=new THREE.Matrix4();

/* 状态 */
let mode='defl',density=55,mixP=100,playing=true,labelsOn=true,slowMo=false,partsOn=true;
let xf=0,xs=0,vf=0.5,wrinkle=0,locked=false,holdT=0,runT=0,flashT=0,simT=0;
const WV=1.75,VDET=6.5;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const vf0=()=>0.5+0.003*(mixP-100)+(mode==='ddt'?0.05:0);
function resetRun(){xf=-tubeLen/2+0.3;xs=xf+0.35;vf=mode==='det'?VDET:vf0();
  locked=(mode==='det');wrinkle=0;holdT=0;runT=0;flashT=0;
  obs.forEach(o=>o.passed=false);seedParts();updateStats();}
function buildTube(){tube.scale.y=tubeLen;
  ringL.position.x=-tubeLen/2;ringR.position.x=tubeLen/2;
  ele.position.set(-tubeLen/2+0.08,TY+0.28,0);
  spark.position.set(-tubeLen/2+0.28,TY,0);}
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const flameLbl=addLabel(()=>locked?L('火焰面(已并入激波)','Flame front (merged into the shock)')
    :L(`火焰面:${(vf*4.6).toFixed(1)} m/s,传热点火`,`Flame front: ${(vf*4.6).toFixed(1)} m/s, heat-transfer ignition`),
  new THREE.Vector3(0,TY+0.95,0),'o',()=>true);
const waveLbl=addLabel(()=>L(`前驱激波:${(locked?2350:320).toFixed(0)} m/s`,`Precursor shock: ${(locked?2350:320).toFixed(0)} m/s`),
  new THREE.Vector3(0,TY+0.95,0),'b',()=>!locked);
const detLbl=addLabel(()=>L('爆轰面:白亮激波 = 锤 + 火,超音速自持','Detonation front: white shock = hammer + fire, supersonic'),
  new THREE.Vector3(0,TY+1.4,0),'r',()=>locked);
const obLbl=addLabel(()=>L('障碍物:把火焰揉皱、加速','Obstacles: crumple and accelerate the flame'),
  new THREE.Vector3(0,TY+1.15,0),'y',()=>density>0&&mode==='ddt');
function syncObs(){document.getElementById('sObs').value=density;document.getElementById('sObsVal').textContent=density.toFixed(0)+' %';}
function syncLen(){document.getElementById('sLen').value=tubeLen;document.getElementById('sLenVal').textContent=tubeLen.toFixed(0)+' m';}
function syncMix(){document.getElementById('sMix').value=mixP;document.getElementById('sMixVal').textContent=mixP.toFixed(0)+' %';}
function setObs(v){density=clamp(Math.round(v),0,100);syncObs();buildObstacles();resetRun();}
function setLen(v){tubeLen=clamp(Math.round(v),8,16);syncLen();buildTube();buildObstacles();seedParts();resetRun();}
function setMix(v){mixP=clamp(Math.round(v),60,140);syncMix();updateStats();}
function setMode(m){mode=m;
  document.getElementById('bDefl').classList.toggle('on',m==='defl');
  document.getElementById('bDet').classList.toggle('on',m==='det');
  document.getElementById('bDDT').classList.toggle('on',m==='ddt');
  resetRun();}
const STEPS=[
 {zh:'点燃:一层面火焰',en:'Ignition: a sheet of flame',act(){setMode('defl');setObs(0);setMix(100);}},
 {zh:'亚音速爬行:膨胀波先行',en:'Subsonic crawl: the expansion wave leads',act(){setMode('defl');setObs(0);setMix(80);}},
 {zh:'障碍物把火焰揉皱、加速',en:'Obstacles crumple and speed the flame up',act(){setMode('ddt');setObs(25);setMix(100);}},
 {zh:'前驱激波成军',en:'The precursor shock forms up',act(){setMode('ddt');setObs(55);setMix(100);}},
 {zh:'追上激波:DDT,爆轰!',en:'Catching the shock: DDT — detonation!',act(){setMode('ddt');setObs(85);setMix(120);}},
 {zh:'超音速自持:锤与火一体',en:'Supersonic and self-sustaining: hammer plus fire',act(){setMode('det');setObs(0);setMix(110);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}
function updateStats(){
  const mps=locked?2300:vf*4.6,wv=locked?2350:320;
  const vEl=document.getElementById('stVf');
  vEl.innerHTML=mps.toFixed(0)+'<small> m/s</small>';vEl.className='v '+(mps>1000?'warn':'');
  document.getElementById('stWv').innerHTML=wv.toFixed(0)+'<small> m/s</small>';
  const mEl=document.getElementById('stM');
  mEl.textContent=(wv/340).toFixed(2);mEl.className='v '+(wv/340>5?'warn':'');
  const sEl=document.getElementById('stSt');
  if(locked){sEl.textContent=L('爆轰','DETONATION');sEl.className='v warn';}
  else if(mode==='ddt'&&vf>WV){sEl.textContent=L('转捩中…','TRANSITION…');sEl.className='v ok';}
  else{sEl.textContent=L('爆燃','deflagration');sEl.className='v';}
}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bDefl').addEventListener('click',()=>setMode('defl'));
document.getElementById('bDet').addEventListener('click',()=>setMode('det'));
document.getElementById('bDDT').addEventListener('click',()=>setMode('ddt'));
document.getElementById('bReset').addEventListener('click',resetRun);
document.getElementById('sObs').addEventListener('input',e=>setObs(+e.target.value));
document.getElementById('sLen').addEventListener('input',e=>setLen(+e.target.value));
document.getElementById('sMix').addEventListener('input',e=>setMix(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglPart').addEventListener('change',e=>{partsOn=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 状态推进:爆燃爬行 / DDT 加速 / 爆轰锁定 */
  if(holdT>0){holdT-=dts;if(holdT<=0)resetRun();}
  else if(dts>0){
    runT+=dts;
    if(mode==='defl')xs=Math.min(xs+WV*dts,tubeLen/2-0.1);
    else if(mode==='ddt'){vf*=1+0.05*dts;xs=Math.min(xs+WV*dts,tubeLen/2-0.1);}
    else{vf=VDET;xs=xf;}
    xf+=vf*dts;
    for(const ob of obs){if(!ob.passed&&xf>ob.x){ob.passed=true;
      if(mode==='ddt'){vf*=1.45;wrinkle=Math.min(1,wrinkle+0.22);}}}
    if(mode==='ddt'&&!locked&&vf>WV&&xf>xs-0.18){locked=true;vf=VDET;flashT=1;}
    if(xf>tubeLen/2-0.15){if(locked)flashT=1;holdT=1.8;}
  }
  flashT*=Math.exp(-2.5*dts);
  /* 火焰面 / 激波 / 光 */
  flameGrp.position.x=xf;
  mainDisk.visible=!locked;detCore.visible=locked;
  mainDisk.scale.set(1,1+0.05*Math.sin(simT*26)*(0.3+wrinkle),1+0.05*Math.cos(simT*23)*(0.3+wrinkle));
  detCore.scale.set(1,1+0.06*Math.sin(simT*44),1+0.06*Math.sin(simT*41));
  wks.forEach((w,i)=>{w.visible=!locked;
    w.position.x=-0.15*(i+1)*(0.4+wrinkle);
    w.scale.set(1,1-0.08*i+0.04*Math.sin(simT*17+i*2),1-0.08*i+0.04*Math.cos(simT*15+i*2));});
  wave.position.x=xs;wave.visible=!locked&&xs>xf+0.05;
  halo.position.x=xf;halo.position.y=TY;
  halo.color.setHex(locked?0xffffff:0xffa94d);
  halo.intensity=locked?3.5+1.5*Math.sin(simT*40):1.2+wrinkle*1.4+flashT*5;
  ringM.emissiveIntensity=0.15+flashT*1.6;
  spark.visible=runT<0.35&&holdT<=0;
  if(spark.visible)spark.scale.setScalar(1+0.8*Math.abs(Math.sin(simT*40)));
  /* 混气粒子:烧过即暗 */
  part.visible=partsOn;
  if(partsOn){
    for(let i=0;i<NP;i++){const p=partD[i];
      if(p.st===0&&p.bx<xf){p.st=1;p.k=0;}
      let s=1,px=p.bx+0.035*Math.sin(simT*1.7+p.ph),py=TY+p.oy+0.035*Math.cos(simT*1.3+p.ph),pz=p.oz+0.035*Math.sin(simT*2.1+p.ph);
      if(p.st===1){p.k+=dts/(locked?0.12:0.4);
        if(p.k>=1){p.k=1;p.st=2;}
        const q=p.k;px=p.bx;py=TY+p.oy;pz=p.oz;s=1-0.8*q;
        if(q<0.5){const u=q/0.5;col.setRGB(0.75+0.25*u,0.83-0.33*u,0.91-0.76*u);}
        else{const u=(q-0.5)/0.5;col.setRGB(1-0.75*u,0.5-0.4*u,0.15-0.07*u);}
      }else if(p.st===2){s=0.001;col.setRGB(0.2,0.08,0.06);}
      else col.setRGB(0.75,0.83,0.91);
      m4.makeScale(s,s,s);m4.setPosition(px,py,pz);
      part.setMatrixAt(i,m4);part.setColorAt(i,col);
    }
    part.instanceMatrix.needsUpdate=true;
    if(part.instanceColor)part.instanceColor.needsUpdate=true;
  }
  /* 标签跟随 */
  flameLbl.position.x=xf;waveLbl.position.x=xs;detLbl.position.x=xf;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const rl of labelReg){rl.o.visible=labelsOn&&rl.vis();if(rl.o.visible)rl.o.element.textContent=rl.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
labelsOn=!(qs.get('labels')==='0');document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildTube();buildObstacles();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}else{applyPhase(0);}
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
