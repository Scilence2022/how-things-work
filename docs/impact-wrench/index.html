<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>气动冲击扳手 · 动量锤击而不是硬拧</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b3873e;
    --bg:#0f1216; --panel:rgba(13,17,23,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,23,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,23,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#8f6a25;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(255,205,112,.9); color: #ffe2ae; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(143,106,37,.9); color: #8a5f12; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(212,167,16,.9); color: #8a6d00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(11,122,90,.9); color: #0b7a5a; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(30,120,200,.9); color: #1864ab; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.b { color:#1864ab; } :root[data-theme="light"] .chip.r { color:#c92a2a; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 4px 7px; font-size: 11.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(179,135,62,.65); background: rgba(179,135,62,.14); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.6); color: #ffa8a8; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(143,106,37,.55); background: rgba(143,106,37,.10); }
  :root[data-theme="light"] .abtn.hot { color:#c92a2a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 15px; }
  #scope { width: 100%; height: 60px; display: block; margin-top: 4px; border-radius: 8px;
    background: rgba(127,140,160,.10); border: 1px solid var(--panel-border); }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 3px; }
  #steps li { display: flex; gap: 6px; padding: 3px 5px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(179,135,62,.10); border-color: rgba(179,135,62,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(143,106,37,.08); border-color: rgba(143,106,37,.4); }
  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #e8c98f; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
    margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 96px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="气动冲击扳手:动量锤击而不是硬拧" data-en="Impact Wrench: Momentum Blows, Not Brute Torque">气动冲击扳手:动量锤击而不是硬拧</h1>
  <div class="sub" data-zh="气动马达经行星减速把锤击机构带到 ~1,600-2,000 r/min。螺栓松时,锤与输出砧经斜面咬合像普通扳手连转;螺栓咬死时,斜面把锤顶起脱离、弹簧推着它空转加速约半圈,再以 10-30 J 动能砸回砧面——几毫秒的力脉冲打出 300-2,000 N·m 峰值扭矩,而反冲被锤的空转吸收,手上几乎无感。演示为慢放 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="An air motor drives the hammer mechanism through a planetary stage at ~1,600-2,000 rpm. Free bolt: hammer and anvil ramp-lock and turn like a plain wrench. Seized bolt: the ramps lift the hammer out of engagement, a spring lets it spin free for about half a turn, then it slams back with 10-30 J - a millisecond pulse worth 300-2,000 N·m of peak torque, while the recoil is swallowed by the hammer's free spin. Shown in slow motion · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">气动冲击扳手:动量锤击而不是硬拧</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="锤击机构转速" data-en="hammer speed">锤击机构转速</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="单击动能" data-en="energy per blow">单击动能</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="峰值扭矩" data-en="peak torque">峰值扭矩</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="冲击频率(估算)" data-en="blow rate (est.)">冲击频率(估算)</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="螺栓已进角度" data-en="bolt advanced">螺栓已进角度</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="反作用手感" data-en="hand reaction">反作用手感</span><span class="v" id="stF">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip b" data-zh="气动马达 · 行星减速" data-en="air motor · planetary stage">气动马达 · 行星减速</span>
    <span class="chip o" data-zh="锤 + 斜面(金)" data-en="hammer + ramps (gold)">锤 + 斜面(金)</span>
    <span class="chip g" data-zh="回位弹簧" data-en="return spring">回位弹簧</span>
    <span class="chip r" data-zh="输出砧 → 螺栓" data-en="anvil → bolt">输出砧 → 螺栓</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnFree" data-zh="自由旋转(松螺栓)" data-en="free spin (loose bolt)">自由旋转(松螺栓)</button>
    <button class="abtn on" id="btnBolt" data-zh="咬死的螺栓(招牌)" data-en="seized bolt (signature)">咬死的螺栓(招牌)</button>
    <button class="abtn" id="btnSingle" data-zh="单次冲击·四拍慢放" data-en="single blow · 4 beats">单次冲击·四拍慢放</button>
    <button class="abtn" id="btnDirect" data-zh="直驱对照(无锤击)" data-en="direct drive (no hammer)">直驱对照(无锤击)</button>
    <button class="abtn hot" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="负载阻力" data-en="load">负载阻力</label><input id="load" type="range" min="0" max="100" step="1" value="85"><span class="val" id="loadVal">85%</span></div>
  <div class="row"><label data-zh="供气压力" data-en="air pressure">供气压力</label><input id="press" type="range" min="70" max="130" step="5" value="100"><span class="val" id="pressVal">100%</span></div>
  <canvas id="scope"></canvas>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="ctrlRows">
      <div class="crow"><span class="ck" data-zh="步骤" data-en="Step">步骤</span><input id="phase" type="range" min="0" max="1000" value="0"><span class="cv" id="phaseVal">—</span></div>
      <div class="crow"><span class="ck" data-zh="速度" data-en="Speed">速度</span><input id="speed" type="range" min="2" max="30" value="10"><span class="cv" id="speedVal">1.0×</span></div>
      <div id="toggles">
        <label><input id="tglCurve" type="checkbox" checked> <span data-zh="扭矩曲线" data-en="torque trace">扭矩曲线</span></label>
        <label><input id="tglVec" type="checkbox" checked> <span data-zh="反作用箭头" data-en="reaction arrow">反作用箭头</span></label>
        <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
        <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      </div>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../bolt-preload/" data-zh="螺栓预紧" data-en="bolt preload">螺栓预紧</a>
    <a href="../planetary-gears/" data-zh="行星齿轮" data-en="planetary gears">行星齿轮</a>
    <a href="../ratchet-pawl/" data-zh="棘轮棘爪" data-en="ratchet and pawl">棘轮棘爪</a>
    <a href="../torque-converter/" data-zh="液力变矩器" data-en="torque converter">液力变矩器</a>
  </div>
</div>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);
const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f1216 : 0xeff1f4);
  M.ground.color.set(dark ? 0x171b21 : 0xd8dee5);
  M.grid.color.set(dark ? 0x2c3540 : 0xa9b6c2);
  M.housing.color.set(dark ? 0x3d4d63 : 0x5f7186);      // 马达壳(蓝灰)
  M.gear.color.set(dark ? 0x8fa3bd : 0x7d8fa6);         // 行星轮
  M.cage.color.set(dark ? 0x9fb0c3 : 0x8494a6);         // 锤笼(半透明)
  M.hammer.color.set(dark ? 0xd8b25c : 0xc09a45);       // 锤(金=主角)
  M.spring.color.set(dark ? 0x74dc84 : 0x2f9e63);       // 弹簧(绿)
  M.anvil.color.set(dark ? 0xc2ccd8 : 0x9aa6b4);        // 输出砧(钢)
  M.bolt.color.set(dark ? 0x4a5568 : 0x6b7787);         // 螺栓
  M.plate.color.set(dark ? 0x333c49 : 0x5a6675);        // 法兰板
  M.grip.color.set(dark ? 0x252a31 : 0x3d434c);         // 手柄橡胶
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('body *').forEach(el => {
    if (el.dataset && el.dataset.zh !== undefined) el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('气动冲击扳手 · 动量锤击而不是硬拧', 'Impact Wrench · Momentum Blows, Not Brute Torque');
  buildSteps();
  setPlayLabel();
  markStep();
  syncPhase();
  updateLoad();
  updatePress();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();

function markStep() {
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === scenario));
}
function syncPhase() {
  elPhase.value = Math.round(scenario / (STEPS.length - 1) * 1000);
  elPhaseVal.textContent = L(`第 ${scenario + 1}/${STEPS.length} 步`, `step ${scenario + 1}/${STEPS.length}`);
}
const tgtVec = new THREE.Vector3(0, 0.13, 0);
const tmpV = new THREE.Vector3();
function activateStep(i) {
  scenario = clamp(i, 0, STEPS.length - 1);
  tgtVec.fromArray(STEPS[scenario].tgt);
  markStep();
  syncPhase();
  updateFormula();
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => activateStep(i));
    el.appendChild(li);
  });
}

/* ---------------- 公式框 ---------------- */
const formulaEl = document.getElementById('formula');
const tauOf = E => clamp(300 + (E - 10) * 85, 300, 2000);   // 峰值扭矩随单击动能标定(300-2,000 N·m)
function updateFormula() {
  const E = 0.5 * IH * wh * wh;
  formulaEl.innerHTML =
    L(`单击动能 E = ½·I_h·ω² = <b>${E.toFixed(1)} J</b>(I_h = 1.6×10⁻³ kg·m²,ω = 锤速)`,
      `Energy per blow E = ½·I_h·ω² = <b>${E.toFixed(1)} J</b> (I_h = 1.6×10⁻³ kg·m², ω = hammer speed)`) +
    '<br>' +
    L(`峰值扭矩 ≈ <b>${tauOf(E).toFixed(0)} N·m</b>(毫秒级脉冲);f ≈ 一转一击 = n/60 = <b>${(rpmMotor() / 60).toFixed(0)} 次/s</b>`,
      `Peak torque ≈ <b>${tauOf(E).toFixed(0)} N·m</b> (millisecond pulse); rate ≈ one blow/rev = n/60 = <b>${(rpmMotor() / 60).toFixed(0)} /s</b>`) +
    '<br>' +
    L(`负载 ${load}%:${load < 35 ? '<b>咬合连转</b>(像普通扳手)' : '<b>连续锤击</b>'};预紧分散度 ±20-30%,关键螺栓用扭矩扳手`,
      `Load ${load}%: ${load < 35 ? '<b>ramp-locked</b> (plain wrench)' : '<b>continuous hammering</b>'}; preload scatters ±20-30% - use a torque wrench on critical bolts`);
}

const btnFree = document.getElementById('btnFree'), btnBolt = document.getElementById('btnBolt'),

const presetBtns = { free: btnFree, bolt: btnBolt, single: btnSingle, direct: btnDirect };
function setMode(id) {
  mode = id;
  for (const k in presetBtns) presetBtns[k].classList.toggle('on', k === id);
  if (id === 'free') { setLoad(5); slowK = 12; }
  if (id === 'bolt') { setLoad(85); slowK = 60; }
  if (id === 'single') { setLoad(85); slowK = 170; }
  if (id === 'direct') { setLoad(85); slowK = 12; }
  updateFormula();
}
function setLoad(v) {
  load = v;
  elLoad.value = v;
  elLoadVal.textContent = v + '%';
}
function setPress(v) {
  press = v / 100;
  elPress.value = v;
  elPressVal.textContent = v + '%';
}
function resetMachine() {
  setMode('bolt');
  impacts = 0; thAnvil = 0; thHam = 0; thCage = 0;
  mechState = 'engaged'; mechT = 0; xh = 0; wh = 0; eLast = 0; tauLast = 0;
  setPress(100);
  hist.length = 0;
  updateFormula();
}
btnFree.addEventListener('click', () => setMode('free'));
btnBolt.addEventListener('click', () => setMode('bolt'));
btnSingle.addEventListener('click', () => setMode('single'));
btnDirect.addEventListener('click', () => setMode('direct'));
btnReset.addEventListener('click', resetMachine);

/* ---------------- 扭矩曲线(示波器) ---------------- */
const scope = document.getElementById('scope');
const scopeCtx = scope.getContext('2d');
function sizeScope() {
  const dpr = Math.min(devicePixelRatio, 2);
  scope.width = Math.max(10, scope.clientWidth * dpr);
  scope.height = 60 * dpr;
}
function drawScope() {
  const cw = scope.width, ch = scope.height, dpr = Math.min(devicePixelRatio, 2);
  scopeCtx.clearRect(0, 0, cw, ch);
  const py = v => ch - (0.08 + 0.8 * clamp01(v)) * ch;
  scopeCtx.strokeStyle = 'rgba(128,140,160,.35)';
  scopeCtx.lineWidth = 1;
  scopeCtx.beginPath();
  scopeCtx.moveTo(0, py(0)); scopeCtx.lineTo(cw, py(0));
  scopeCtx.stroke();
  scopeCtx.font = `${Math.round(9 * dpr)}px system-ui`;
  scopeCtx.fillStyle = 'rgba(150,160,175,.9)';
  scopeCtx.fillText(L('输出扭矩', 'output torque'), 4 * dpr, 11 * dpr);
  scopeCtx.fillStyle = 'rgba(150,160,175,.55)';
  scopeCtx.fillText(L('最近 ~2 s', 'last ~2 s'), cw - 56 * dpr, ch - 4 * dpr);
  if (hist.length < 2) return;
  let mx = 100;
  for (const h of hist) mx = Math.max(mx, h);
  scopeCtx.strokeStyle = 'rgba(255,169,77,.95)';
  scopeCtx.lineWidth = Math.max(1.3, 1.3 * dpr);
  scopeCtx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const x = i / (hist.length - 1) * cw;
    const v = hist[i] / mx;
    i === 0 ? scopeCtx.moveTo(x, py(v)) : scopeCtx.lineTo(x, py(v));
  }
  scopeCtx.stroke();
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elLoad = document.getElementById('load'), elLoadVal = document.getElementById('loadVal');
const elPress = document.getElementById('press'), elPressVal = document.getElementById('pressVal');
const tglCurve = document.getElementById('tglCurve');
const tglVec = document.getElementById('tglVec');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn;
}
function updateLoad() {
  load = +elLoad.value;
  elLoadVal.textContent = elLoad.value + '%';
  updateFormula();
}
function updatePress() {
  press = (+elPress.value) / 100;
  elPressVal.textContent = elPress.value + '%';
  updateFormula();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  activateStep(Math.round(parseInt(elPhase.value, 10) / 1000 * (STEPS.length - 1)));
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elLoad.addEventListener('input', updateLoad);
elPress.addEventListener('input', updatePress);
tglCurve.addEventListener('change', () => { scope.style.display = tglCurve.checked ? 'block' : 'none'; if (tglCurve.checked) sizeScope(); });
tglVec.addEventListener('change', () => { reactArrow.visible = tglVec.checked; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeScope();
});

/* ---------------- stats 刷新 ---------------- */
const stA = document.getElementById('stA'), stB = document.getElementById('stB'),
  stC = document.getElementById('stC'), stD = document.getElementById('stD'),
  stE = document.getElementById('stE'), stF = document.getElementById('stF');
function updateStats() {
  stA.innerHTML = (wh * 60 / TAU).toFixed(0) + '<small> r/min</small>';
  stA.className = 'v ok';
  const E = eLast;
  stB.innerHTML = E.toFixed(1) + '<small> J</small>';
  stB.className = 'v ' + (E >= 10 ? 'ok' : 'warn');
  stC.innerHTML = tauLast.toFixed(0) + '<small> N·m</small>';
  stC.className = 'v ok';
  stD.innerHTML = (1 / CYCLE_T).toFixed(0) + '<small> 次/s</small>';
  stD.className = 'v ok';
  stE.innerHTML = (thAnvil * 180 / Math.PI).toFixed(0) + '<small> °</small>';
  stE.className = 'v ' + (thAnvil > 0.02 ? 'ok' : 'warn');
  stF.innerHTML = reactNow.toFixed(0) + '<small> %</small>';
  stF.className = 'v ' + (reactNow > 60 ? 'bad' : reactNow > 20 ? 'warn' : 'ok');
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const mdt = playing ? dt * speed / slowK : 0;      // 机制时间(已慢放)
  const wTarget = wM();
  if (mode === 'direct') {
    /* 直驱对照:马达扭矩直接上砧,无锤击 */
    stalled = load >= 35;
    if (stalled) {
      wh = 0; anvilW = 0; reactNow = 100;
      xh += (0 - xh) * Math.min(1, dt * 6);
    } else {
      wh = wTarget * 0.12; anvilW = wh; thAnvil += anvilW * mdt;
      reactNow = 10;
    }
    thHam += wh * mdt; thCage += wh * mdt;
    mechState = 'engaged'; mechT = 0;
  } else if (load < 35) {
    /* 自由旋转:锤砧咬合连转,像普通扳手 */
    stalled = false;
    mechState = 'engaged'; mechT = 0;
    xh += (0 - xh) * Math.min(1, dt * 8);
    wh += (wTarget - wh) * Math.min(1, dt * 4);
    anvilW = wh;
    thHam += wh * mdt; thCage += wTarget * mdt; thAnvil += anvilW * mdt;
    reactNow = 3;
  } else {
    /* 连续锤击:四拍状态机(机制时间) */
    stalled = false;
    mechT += mdt;
    if (mechT >= BEATS[mechState]) {
      mechT -= BEATS[mechState];
      if (mechState === 'slam') {
        eLast = 0.5 * IH * wh * wh;
        tauLast = tauOf(eLast);
        impacts++;
        anvilW = wh * 0.2;                 // 冲量传给砧:砧抖进一格
        wh *= 0.22;
        mechState = 'engaged';
      } else if (mechState === 'engaged') mechState = 'lift';
      else if (mechState === 'lift') mechState = 'free';
      else if (mechState === 'free') mechState = 'slam';
    }
    const p = clamp01(mechT / BEATS[mechState]);
    if (mechState === 'engaged') {
      xh += (0 - xh) * Math.min(1, mdt / BEATS.engaged * 0.5);
      wh = wTarget * (0.3 - 0.12 * p);     // 顶死:锤被拖慢
      anvilW = load < 70 ? wh * 0.1 : 0;   // 负载很高时砧完全不动
      reactNow = 1 + p * 2;
    } else if (mechState === 'lift') {
      xh = XH_MAX * p;
      wh = wTarget * (0.18 + 0.3 * p);
      anvilW *= Math.max(0, 1 - p * 4);
      reactNow = 2;
    } else if (mechState === 'free') {
      xh = XH_MAX * (1 - p) + 0.0015;
      wh = wTarget * (0.48 + 0.52 * p);    // 空转加速约半圈
      anvilW *= Math.max(0, 1 - p * 2);
      reactNow = 1;
    } else {
      xh = Math.max(0, 0.0015 * (1 - p * 4));
      wh *= Math.max(0.6, 1 - p * 2);
      anvilW *= Math.max(0.2, 1 - p);      // 砧抖进一格后减速
      reactNow = 6 + 5 * (1 - p);          // 砸合瞬间的反作用脉冲
    }
    thHam += wh * mdt;
    thCage += wTarget * mdt;
    thAnvil += anvilW * mdt;
  }
  /* 视觉应用 */
  hammerG.position.x = -0.062 - xh;
  hammerG.rotation.x = thHam;
  cageG.rotation.x = thCage;
  anvilG.rotation.x = thAnvil;
  anvilM.rotation.x = thAnvil;
  threads.rotation.x = thAnvil;
  springM.scale.x = (SPRING_L - xh) / SPRING_L;
  const crank = et * 6;
  sunG.rotation.x = crank;
  for (const pl of planets) {
    pl.pg.rotation.x = crank * -2.6;
    pl.pm.rotation.x = crank * 3.4;
  }
  /* 反作用箭头:手柄处 */
  const rAmp = reactNow / 100;
  reactArrow.setLength(0.03 + 0.07 * rAmp, 0.016, 0.01);
  reactArrow.position.set(-0.27, Y0 - 0.12, 0.035 + 0.01 * Math.sin(et * 30) * rAmp);
  /* 扭矩历史 */
  if (playing) {
    const tq = mode !== 'direct' && load >= 35 ? (mechState === 'slam' ? tauLast || 900 : 20 + xh * 8000)
      : stalled ? 120 : 10;
    hist.push(tq);
    if (hist.length > 140) hist.shift();
  }
  /* 步骤高亮 */
  const hlK = 0.45 + 0.25 * Math.sin(et * 5);
  const hl = STEPS[scenario].hl;
  for (const m of [M.housing, M.gear, M.hammer, M.spring, M.anvil, M.bolt]) m.emissiveIntensity = Math.min(m.emissiveIntensity, 0.25);
  const boost = m => { m.emissiveIntensity = 0.5 + 0.3 * hlK; };
  if (hl === 'bolt') { boost(M.bolt); boost(M.plate); }
  else if (hl === 'motor') { boost(M.housing); boost(M.gear); }
  else if (hl === 'clutch') { boost(M.hammer); boost(M.cage); }
  else if (hl === 'hammer') { boost(M.hammer); boost(M.anvil); }
  else if (hl === 'react') { boost(M.grip); boost(M.housing); }
  else if (hl === 'caution') { boost(M.bolt); boost(M.anvil); }
  /* 相机目标 */
  tmpV.fromArray(STEPS[scenario].tgt);
  controls.target.lerp(tmpV, 0.04);
  /* 标签 */
  for (const r of labelReg) {
    if (r.follow) r.follow(r.o.position);
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked) drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setMode('bolt');
setPlayLabel();
tglVec.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
