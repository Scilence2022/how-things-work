<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皂化反应 · 剪开三个酯键，肥皂自组装成胶束</title>
<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;
    --acc:#74c0fc;--bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
    --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);}
  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
  #app{position:fixed;inset:0;}#app canvas{display:block;}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);
    font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s;}
  :root[data-theme="light"] .lbl{text-shadow:none;}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2;}
  .lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2;}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0;}
  .lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff;}
  :root[data-theme="light"] .lbl.o{color:#a34e00;}:root[data-theme="light"] .lbl.r{color:#c92a2a;}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e;}:root[data-theme="light"] .lbl.b{color:#1864ab;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
    font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
    border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11.5px;color:var(--text2);font-weight:400;}
  #stats .v.g{color:var(--acc);}#stats .v.ok{color:#7bd88f;}
  #stats .v.ph{font-size:12px;font-weight:600;line-height:1.3;max-width:170px;text-align:right;align-self:center;}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #legend{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;}
  .chip.o{color:#ffe0ae;border-color:rgba(255,180,84,.7);}
  .chip.g{color:#c8f5d0;border-color:rgba(116,220,132,.7);}
  .chip.r{color:#ffc2c2;border-color:rgba(255,107,107,.7);}
  .chip.b{color:#bde9ff;border-color:rgba(116,192,252,.7);}
  :root[data-theme="light"] .chip.o{color:#a34e00;}:root[data-theme="light"] .chip.g{color:#2b8a3e;}
  :root[data-theme="light"] .chip.r{color:#c92a2a;}:root[data-theme="light"] .chip.b{color:#1971c2;}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
    color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
    font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--text);}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px;}
  #formula b{color:var(--text3);font-weight:600;}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(116,192,252,.10);border-color:rgba(116,192,252,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
  #steps .t b{color:var(--text);font-size:12px;}
  #steps li.on .t b{color:#bde9ff;}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  #toggles{display:flex;gap:12px;flex-wrap:wrap;}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer;}
  #toggles input{accent-color:var(--acc);}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  #rel span{font-size:11.5px;color:var(--text2);}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s;}
  #rel a:hover{color:var(--acc);border-color:var(--acc);}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>

<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="皂化反应" data-en="Saponification">皂化反应</h1>
  <div class="sub" data-zh="OH⁻ 进攻酯羰基 → 四面体中间体 → C–O 断键；羧酸根共振稳定、不可逆；三个酯键依次断裂得甘油与肥皂 → 胶束包裹油污 · 3D 交互 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="OH⁻ attacks the ester carbonyl → tetrahedral intermediate → C–O breaks; the carboxylate is resonance-stabilized and irreversible; three ester bonds cleave to glycerol + soap → micelles wrap the oil · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">OH⁻ 进攻酯羰基 → 四面体中间体 → C–O 断键；羧酸根共振稳定、不可逆；三个酯键依次断裂得甘油与肥皂 → 胶束包裹油污 · 3D 交互 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>

    <a href="../esterification/" data-zh="逆反应:酯化" data-en="the reverse: esterification">逆反应:酯化</a>
    <a href="../aldol-condensation/" data-zh="同为羰基化学" data-en="more carbonyl chemistry">同为羰基化学</a>

</div>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 18, 42);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  scene.fog.color.set(bg);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('皂化反应 · 剪开三个酯键，肥皂自组装成胶束', 'Saponification · Cleave three ester bonds, soap self-assembles into micelles');
  buildSteps(); updateFormula(); setPlayLabel(); updateStats();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.2, 2.4, 9.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.35, 1.35, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 22; controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45); fill.position.set(-6, 3, -5); scene.add(fill);

/* ---------------- 材料（CPK 配色） ---------------- */
const matC   = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.4, metalness: 0.1 });
const matO   = new THREE.MeshStandardMaterial({ color: 0xdd3333, roughness: 0.4 });
const matOM  = new THREE.MeshStandardMaterial({ color: 0xff5555, roughness: 0.3, emissive: 0xff2222, emissiveIntensity: 0.55 });
const matRes = new THREE.MeshStandardMaterial({ color: 0xff8844, roughness: 0.3, emissive: 0xff7f2a, emissiveIntensity: 0.5 });
const matH   = new THREE.MeshStandardMaterial({ color: 0xf1f3f5, roughness: 0.5 });
const matNa  = new THREE.MeshStandardMaterial({ color: 0x9775fa, roughness: 0.35, emissive: 0x9775fa, emissiveIntensity: 0.15 });
const matBond= new THREE.MeshStandardMaterial({ color: 0x9099a5, roughness: 0.5 });
const matNew = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3, emissive: 0xffaa00, emissiveIntensity: 0.35 });
const matResB= new THREE.MeshStandardMaterial({ color: 0xffaa66, roughness: 0.3, emissive: 0xff9f43, emissiveIntensity: 0.5, transparent: true, opacity: 0.85 });
const matHead= new THREE.MeshStandardMaterial({ color: 0x74c0fc, roughness: 0.35, emissive: 0x74c0fc, emissiveIntensity: 0.12 });
const matTail= new THREE.MeshStandardMaterial({ color: 0x868e96, roughness: 0.55 });
const matMicB= new THREE.MeshStandardMaterial({ color: 0x6b7684, roughness: 0.55 });

function atom(r, mt) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mt); scene.add(m); return m; }
function bondMesh(r, mt) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 8), mt || matBond); scene.add(m); return m; }
const UP = new THREE.Vector3(0, 1, 0), ZUP = new THREE.Vector3(0, 0, 1);
const _bd = new THREE.Vector3();
function setBond(m, a, b) {
  _bd.subVectors(b, a); const len = _bd.length();
  if (len < 1e-6) { m.visible = false; return; }
  m.position.copy(a).addScaledVector(_bd, 0.5);
  m.quaternion.setFromUnitVectors(UP, _bd.normalize());
  m.scale.set(1, len, 1);
}
const _p = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3();
function setBondOff(m, a, b, s) {
  _p.subVectors(b, a);
  if (_p.lengthSq() < 1e-8) { m.visible = false; return; }
  _p.normalize(); _p.cross(ZUP);
  if (_p.lengthSq() < 1e-8) _p.set(1, 0, 0); else _p.normalize();
  _a.copy(a).addScaledVector(_p, s); _b.copy(b).addScaledVector(_p, s);
  setBond(m, _a, _b);
}
function setBondPair(m1, m2, a, b) { setBondOff(m1, a, b, 0.055); setBondOff(m2, a, b, -0.055); }

/* ================= 反应层：甘油三酯 + OH⁻ ================= */
const ys = [2.7, 1.85, 1.0];                       // 三个酯键位点的 y
const WIN = [[0.06, 0.42], [0.46, 0.66], [0.58, 0.80]]; // 每位点的反应窗口(全局 t)
const CM = new THREE.Vector3(4.3, 1.45, 0);        // 胶束中心
const dirs = [new THREE.Vector3(-0.95, 0.55, 0.75), new THREE.Vector3(-1.0, -0.25, -0.55),
  new THREE.Vector3(-0.55, -0.85, 0.65)].map(v => v.normalize());

const B = [], Hb = [], E = [], He = [], K = [], O = [], Oa = [], Ha = [], Ow = [], Hw = [], Na_ = [], Ch = [];
const bBH = [], bBE = [], bEHe = [], bEK = [], bKO1 = [], bKO2 = [], bKOa = [], bKCh = [], bCh = [],

  bBH[i] = bondMesh(0.04); bBE[i] = bondMesh(0.05); bEHe[i] = bondMesh(0.04);
  bEK[i] = bondMesh(0.05); bKO1[i] = bondMesh(0.038); bKO2[i] = bondMesh(0.038);
  bKOa[i] = bondMesh(0.05, matNew); bKCh[i] = bondMesh(0.05);
  bCh[i] = [bondMesh(0.05), bondMesh(0.05), bondMesh(0.05)];
  bAOH[i] = bondMesh(0.04); bWOH[i] = bondMesh(0.04); bWH2[i] = bondMesh(0.04);

/* 产物肥皂在胶束球面上的落位（提前算好） */
const endK = [], endO = [], endOa = [], endNa = [], endCh = [];
for (let i = 0; i < 3; i++) {
  const d = dirs[i];
  const tang = new THREE.Vector3().crossVectors(d, UP).normalize();
  endK[i] = CM.clone().addScaledVector(d, 1.32);

const NS = 12;
const soapH = [], soapT = [], soapBd = [], micSt = [], micUv = [], micEH = [], micET = [];
for (let k = 0; k < NS; k++) {
  soapH[k] = atom(0.17, matHead);
  soapT[k] = []; for (let j = 0; j < 3; j++) soapT[k][j] = atom(0.14, matTail);
  soapBd[k] = [bondMesh(0.045, matMicB), bondMesh(0.045, matMicB), bondMesh(0.045, matMicB)];
  const phi = Math.acos(1 - 2 * (k + 0.5) / NS), th = k * 2.399963;
  const fk = new THREE.Vector3(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th));
  const sd = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  micSt[k] = CM.clone().addScaledVector(sd, 2.5 + Math.random() * 1.2);
  micUv[k] = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  micEH[k] = CM.clone().addScaledVector(fk, 1.32);
  micET[k] = []; for (let j = 0; j < 3; j++) micET[k][j] = CM.clone().addScaledVector(fk, 1.02 - 0.30 * j);

/* ---------------- 温度抖动 + 位置写入 ---------------- */
let animT = 0, tempC = 80, jAmp = 0.04;
function setP(m, x, y, z) {
  const p = m.userData.ph || (m.userData.ph = Math.random() * 6.283);
  m.position.set(x + Math.sin(animT * 3.1 + p) * jAmp, y + Math.cos(animT * 2.6 + p * 1.7) * jAmp,
    z + Math.sin(animT * 2.2 + p * 0.6) * jAmp);
}
function setP2(m, x, y, z, end, mm) {
  setP(m, lerp(x, end.x, mm), lerp(y, end.y, mm), lerp(z, end.z, mm));
}

/* 反应层：全部为全局进度 t 的纯函数 */
function applyRxn(t) {
  const g = ease(clamp((t - 0.82) / 0.16, 0, 1));           // 甘油脱落(溶入水下前方)
  const gx = 2.0 * g, gy = -2.4 * g, gz = 1.9 * g;
  const m = ease(clamp((t - 0.80) / 0.17, 0, 1));           // 产物肥皂迁往胶束
  for (let i = 0; i < 3; i++) {
    const y = ys[i], [a, b] = WIN[i];
    const u = clamp((t - a) / (b - a), 0, 1);
    const att = ease(clamp(u / 0.3, 0, 1));                 // OH⁻ 进攻
    const tet = smooth((u - 0.3) / 0.25);                   // 四面体中间体
    const cle = ease(clamp((u - 0.55) / 0.25, 0, 1));       // C–O 断裂
    const dep = ease(clamp((u - 0.8) / 0.2, 0, 1));         // 去质子 → 羧酸根
    /* 甘油骨架侧 */
    setP(B[i], -2.7 + gx, y + gy, gz);
    setP(Hb[i], -3.32 + gx, y + 0.30 + gy, 0.16 + gz);
    setP(E[i], -1.95 + gx, y + gy, gz);
    const heVis = cle > 0.25;
    He[i].visible = heVis; bEHe[i].visible = heVis;
    if (heVis) { setP(He[i], -2.25 + gx, y + 0.30 + gy, 0.10 + gz); setBond(bEHe[i], E[i].position, He[i].position); }
    /* 脂肪酸侧:断裂后整体外移 */
    const ox = 1.15 * cle, oy = 0.15 * cle, oz = 0.10 * cle;
    const Kx = -1.2 + ox, Ky = y + oy, Kz = oz;
    setP2(K[i], Kx, Ky, Kz, endK[i], m);
    setP2(O[i], -0.7 + ox, y + 0.62 + tet * 0.16 + oy, oz, endO[i], m);
    /* 进攻的 OH⁻:从下方游离位 → 键合到羰基碳 */
    const ax = lerp(-3.6 + i * 0.7, Kx + 0.12, att);
    const ay = lerp(-0.3 - (i % 2) * 0.5, Ky - 0.62, att);
    const az = lerp(0.5 - 0.5 * i, Kz + 0.12, att);
    setP2(Oa[i], ax, ay, az, endOa[i], m);
    /* 第二个 OH⁻:去质子后变成水漂走 */
    const wtx = ax + 0.72, wty = ay - 0.30 - 0.45 * dep, wtz = az + 0.35;
    const wx = lerp(-4.3 + i * 0.6, wtx, dep), wy = lerp(-1.35, wty, dep), wz = lerp(-0.6 + 0.3 * i, wtz, dep);
    const wVis = t < 0.875;
    Ow[i].visible = Hw[i].visible = wVis; bWOH[i].visible = wVis;
    setP(Ow[i], wx, wy, wz); setP(Hw[i], wx + 0.30, wy + 0.22, wz - 0.10);
    setBond(bWOH[i], Ow[i].position, Hw[i].position);
    /* 酸上的 H:去质子过程从 Oa 转移到 Ow */
    const dd = smooth((dep - 0.5) / 0.5);
    Ha[i].visible = wVis;
    setP(Ha[i], lerp(ax + 0.34, wx - 0.32, dd), lerp(ay - 0.18, wy + 0.18, dd), lerp(az + 0.14, wz + 0.06, dd));
    bAOH[i].visible = dd < 0.5; if (dd < 0.5) setBond(bAOH[i], Oa[i].position, Ha[i].position);
    bWH2[i].visible = dd >= 0.5 && wVis; if (bWH2[i].visible) setBond(bWH2[i], Ow[i].position, Ha[i].position);
    /* Na⁺ 随羧酸根出现 */
    Na_[i].visible = dep > 0.55;
    if (Na_[i].visible) setP2(Na_[i], Kx - 0.15, Ky + 0.52, Kz + 0.55, endNa[i], m);
    /* 碳链 */
    const chB = [[-0.45, -0.28, 0], [0.3, 0.05, 0], [1.05, -0.28, 0], [1.8, 0.05, 0]];
    for (let j = 0; j < 4; j++) setP2(Ch[i][j], chB[j][0] + ox, y + chB[j][1] + oy, chB[j][2] + oz, endCh[i][j], m);
    /* 键 */
    setBond(bBH[i], B[i].position, Hb[i].position);
    setBond(bBE[i], B[i].position, E[i].position);
    bEK[i].visible = u < 0.58; if (bEK[i].visible) setBond(bEK[i], E[i].position, K[i].position);
    setBondPair(bKO1[i], bKO2[i], K[i].position, O[i].position);
    bKO2[i].visible = tet < 0.55;                          // π 键在四面体阶段断开
    bKOa[i].visible = att > 0.9; if (bKOa[i].visible) setBond(bKOa[i], K[i].position, Oa[i].position);
    setBond(bKCh[i], K[i].position, Ch[i][0].position);
    for (let j = 0; j < 3; j++) setBond(bCh[i][j], Ch[i][j].position, Ch[i][j + 1].position);
    /* 羧酸根共振:两条 C–O 之间的橙色脉冲「半键」 */
    const res = dep > 0.75;
    bResO[i].visible = res; bResOa[i].visible = res;
    if (res) { setBondOff(bResO[i], K[i].position, O[i].position, 0.06); setBondOff(bResOa[i], K[i].position, Oa[i].position, -0.06); }
    /* 电荷 / 共振材质 */
    O[i].material = dep > 0.7 ? matRes : tet > 0.5 ? matOM : matO;
    Oa[i].material = dep > 0.7 ? matRes : matO;
  }
  setBond(bBB[0], B[0].position, B[1].position);
  setBond(bBB[1], B[1].position, B[2].position);
}

/* 胶束层:肥皂分子从水中游离 → 围到油滴上(头朝外、尾朝内) */
function applyMic(t) {
  for (let k = 0; k < NS; k++) {
    const mk = ease(clamp((t - 0.70 - k * 0.012) / 0.25, 0, 1));
    const hx = lerp(micSt[k].x, micEH[k].x, mk), hy = lerp(micSt[k].y, micEH[k].y, mk), hz = lerp(micSt[k].z, micEH[k].z, mk);
    setP(soapH[k], hx, hy, hz);
    let prev = soapH[k];
    for (let j = 0; j < 3; j++) {
      setP(soapT[k][j],
        lerp(micSt[k].x + micUv[k].x * (j + 1) * 0.3, micET[k][j].x, mk),
        lerp(micSt[k].y + micUv[k].y * (j + 1) * 0.3, micET[k][j].y, mk),
        lerp(micSt[k].z + micUv[k].z * (j + 1) * 0.3, micET[k][j].z, mk));
      setBond(soapBd[k][j], prev.position, soapT[k][j].position);
      prev = soapT[k][j];
    }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  animT += dt;
  if (playing) {
    tRxn += dt * rate();
    if (tRxn >= 1) { tRxn = 1; playing = false; setPlayLabel(); }
    syncTm();
  }
  applyRxn(tRxn);
  applyMic(tRxn);
  const m2g = clamp((tRxn - 0.70) / 0.28, 0, 1);
  const os = 1 - 0.10 * m2g + 0.02 * Math.sin(animT * 2.2);
  oil.scale.setScalar(os); oilIn.scale.setScalar(os);
  matRes.emissiveIntensity = 0.35 + 0.30 * Math.sin(animT * 5);
  matResB.opacity = 0.5 + 0.35 * Math.sin(animT * 5);
  statsAcc += dt;
  if (statsAcc > 0.12) { statsAcc = 0; updateStats(); }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
    updateFormula();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) { r.o.element.textContent = r.text(); r.o.position.copy(r.pos()); }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
tRxn = clamp(qsFloat('t', 0), 0, 1);
tempC = clamp(qsFloat('temp', 80), 20, 100);
speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
jAmp = 0.008 + (tempC - 20) / 80 * 0.045;
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
if (tRxn >= 1) playing = false;
labelsOn = qsBool('labels', true);
tglLabels.checked = labelsOn;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
elTp.value = tempC; elTpVal.textContent = tempC + ' °C';
applyTheme();
applyLang();
syncTm();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
