<style>

  }

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  <h1 data-zh="蜡烛火焰与扩散燃烧" data-en="Candle Flame &amp; Diffusion Combustion">蜡烛火焰与扩散燃烧</h1>
  <div class="sub" data-zh="蜡受热熔化、沿烛芯毛细上爬、汽化→蜡汽向外扩散、氧气向内扩散,两者只在薄薄一层反应面相遇(<1 mm)→焰心缺氧发暗(蜡汽+烟粒)、中层烟粒白热发黄(~1200 °C 黑体辐射)、外缘蓝区 CO 完全氧化→重力浮力对流把火焰拉成泪滴,微重力下呈球形暗蓝→吹一口气强制混合就变预混燃烧,轰地燃旺 · 拖动旋转 / 空格运行/暂停" data-en="Heat melts the wax, capillary action feeds the wick, vapor rises → wax vapor diffuses outward while oxygen diffuses inward; they meet only in a thin reaction sheet (<1 mm) → the core is oxygen-starved and dark (vapor + soot precursors), the mid zone glows yellow from incandescent soot (~1200 °C blackbody), the blue rim finishes CO → buoyant convection stretches the flame teardrop-shaped; in microgravity it becomes a dim blue sphere → one breath forces mixing and it turns premixed, flaring bright · drag to orbit / Space = run/pause">蜡受热熔化、沿烛芯毛细上爬、汽化→蜡汽向外扩散、氧气向内扩散,两者只在薄薄一层反应面相遇(&lt;1 mm)→焰心缺氧发暗(蜡汽+烟粒)、中层烟粒白热发黄(~1200 °C 黑体辐射)、外缘蓝区 CO 完全氧化→重力浮力对流把火焰拉成泪滴,微重力下呈球形暗蓝→吹一口气强制混合就变预混燃烧,轰地燃旺 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 扩散燃烧:燃料与氧化剂预先不混合,靠相向扩散在反应面(化学恰当比,
   <1 mm)相遇燃烧。分区:焰心(缺氧,蜡汽+烟粒前驱体,~600–800 °C)/
   中层(烟粒白热,~1200 °C,黄光=黑体辐射)/ 外缘蓝区(CO+O₂→CO₂)。
   浮力对流(Grashof)决定泪滴形状;微重力无浮力→球形扩散焰(慢、暗、蓝)。
   强制通风→转为预混燃烧。石蜡耗氧 ~3.5 g O₂/g 蜡,80 W 烛焰约 6 mg/s。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c0d10,8,26);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(2.6,2.6,5.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=14;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.35));
const key=new THREE.DirectionalLight(0xfff2dd,0.8);key.position.set(4,7,6);scene.add(key);

/* ── 桌面与蜡烛 ── */
const tableM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const table=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.6,0.18,48),tableM);
table.position.y=-0.09;scene.add(table);
const waxM=new THREE.MeshStandardMaterial({color:0xf2ead6,roughness:0.5,
  emissive:0xffc070,emissiveIntensity:0.06});
const candle=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.38,1.7,32),waxM);
candle.position.y=0.85;scene.add(candle);
const wick=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.025,0.3,8),
  new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.9}));
wick.position.y=1.83;scene.add(wick);
const ember=new THREE.Mesh(new THREE.SphereGeometry(0.035,10,8),
  new THREE.MeshStandardMaterial({color:0xff6a2a,emissive:0xff5a1a,emissiveIntensity:1.2}));
ember.position.y=1.97;scene.add(ember);
/* 烛光点光源 */
const cLight=new THREE.PointLight(0xffa050,1.6,9,1.6);
cLight.position.set(0,2.6,0);scene.add(cLight);

/* ── 火焰粒子:三层(核心暗区/黄色烟粒/蓝色外缘)── */
function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d');
  const g=c.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g;c.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const gT=glowTex();
function flamePts(n,size){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size,map:gT,vertexColors:true,
    transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
  p.frustumCulled=false;scene.add(p);
  return p;
}
const NCORE=240,NYEL=430,NRIM=230,NSMOK=130;
const coreP=flamePts(NCORE,0.13),yelP=flamePts(NYEL,0.11),rimP=flamePts(NRIM,0.07);
/* 烟:普通混合,灰色 */
{
  const pos=new Float32Array(NSMOK*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:0.16,map:gT,color:0x8a8f96,
    transparent:true,opacity:0.35,depthWrite:false}));
  p.frustumCulled=false;scene.add(p);
  var smokeP=p;   /* var:提升到模块作用域供 frame 使用 */
}
/* 粒子参数:速度/角度/槽位 */
function seedArr(n){return Array.from({length:n},()=>Math.random());}
const coreS=seedArr(NCORE),yelS=seedArr(NYEL),rimS=seedArr(NRIM),smkS=seedArr(NSMOK);
const coreA=seedArr(NCORE),yelA=seedArr(NYEL),rimA=seedArr(NRIM);
const coreR=seedArr(NCORE),yelR=seedArr(NYEL),rimR=seedArr(NRIM);
const smkA=seedArr(NSMOK),smkR=seedArr(NSMOK);
const CORE_Y=new THREE.Color(0x5a4640),YEL1=new THREE.Color(0xff8a3c),YEL2=new THREE.Color(0xffd76a),
  RIM=new THREE.Color(0x4d7dff),SMK=new THREE.Color(0x777c84),tmpC=new THREE.Color();

/* ── 扩散箭头:O₂ 内向 / 燃料外向 ── */
function makeArr(color){
  const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color,roughness:0.4,emissive:color,emissiveIntensity:0.55});
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.5,8),m);
  cyl.position.y=0.25;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.16,10),m);
  cone.position.y=0.58;g.add(cone);
  scene.add(g);return g;
}
const o2Arrs=[],fuelArrs=[];
for(let i=0;i<5;i++){
  const a=makeArr(0x6fb0ff);o2Arrs.push(a);
}
for(let i=0;i<4;i++){
  const a=makeArr(0xd8d2c4);fuelArrs.push(a);
}

/* ── 状态 ── */
let mode='norm';   /* norm | micro | blow */
let o2p=21,wind=0;
let playing=true,labelsOn=true,slowMo=false,arrOn=true;
let simT=0,alive=true,relightT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const WICK_Y=1.95;
let stat={tc:780,sh:0.5,o2:6.0,h:40};

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblCore=addLabel(()=>alive?L('焰心 · 缺氧:蜡汽+烟粒前驱体','core · O₂-starved: vapor + soot precursors')
  :L('熄灭','out'),new THREE.Vector3(0,2.3,0),'',()=>true);
const lblYel=addLabel(()=>L('中层 · 烟粒白热 ~1200 °C','mid · incandescent soot ~1200 °C'),
  new THREE.Vector3(1.15,3.1,0),'y',()=>alive);
const lblRim=addLabel(()=>L('外缘蓝区 · CO 完全氧化','blue rim · CO burns to CO₂'),
  new THREE.Vector3(-1.35,2.55,0),'b',()=>alive);
const lblSheet=addLabel(()=>L('反应面 <1 mm · 扩散受限','reaction sheet <1 mm · diffusion-limited'),
  new THREE.Vector3(1.5,2.0,0.3),'r',()=>alive);
const lblO2In=addLabel(()=>L('O₂ 向内扩散','O₂ diffuses in'),new THREE.Vector3(-1.7,2.95,0.6),'b',
  ()=>arrOn&&alive);
const lblFuel=addLabel(()=>L('蜡汽向外扩散','wax vapor diffuses out'),new THREE.Vector3(1.05,1.75,0.7),'',
  ()=>arrOn&&alive);
const lblDead=addLabel(()=>L('O₂ <16.5%:扩散焰无法维持','O₂ <16.5%: diffusion flame dies'),
  new THREE.Vector3(0,3.6,0),'r',()=>!alive);

function setO2(vv){o2p=clamp(vv,16,30);
  document.getElementById('sO2').value=o2p;
  document.getElementById('sO2Val').textContent=o2p.toFixed(1)+' %';}
function setWind(vv){wind=clamp(vv,0,2);
  document.getElementById('sWind').value=wind;
  document.getElementById('sWindVal').textContent=wind.toFixed(2)+' m/s';}
function setMode(m){mode=m;
  document.getElementById('bNorm').classList.toggle('on',m==='norm');
  document.getElementById('bMicro').classList.toggle('on',m==='micro');
  document.getElementById('bBlow').classList.toggle('on',m==='blow');
  if(m==='blow')setWind(1.5);
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const tc=document.getElementById('stTc');
  if(alive){
    const base=mode==='blow'?1180:mode==='micro'?840:760;
    tc.innerHTML=(base+o2p*3+wind*40).toFixed(0)+'<small> °C</small>';
    tc.className='v ok';
  }else{tc.innerHTML='—';tc.className='v warn';}
  const sh=document.getElementById('stSh');
  if(alive){
    const s=mode==='blow'?0.2:mode==='micro'?0.9:0.5;
    sh.innerHTML=s.toFixed(1)+'<small> mm</small>';
    sh.className='v '+(s>0.8?'warn':'ok');
  }else{sh.innerHTML='—';sh.className='v warn';}
  const o2=document.getElementById('stO2');
  if(alive){
    const rate=6.0*(o2p/21)*(mode==='blow'?1.6:mode==='micro'?0.45:1);
    o2.innerHTML=rate.toFixed(1)+'<small> mg/s</small>';
    o2.className='v '+(o2p<18?'warn':'');
  }else{o2.innerHTML='0.0<small> mg/s</small>';o2.className='v warn';}
  const h=document.getElementById('stH');
  if(alive){
    const fl=flameH();
    h.innerHTML=mode==='micro'?('Ø '+(fl*10).toFixed(0)+'<small> mm</small>'):((fl*10).toFixed(0)+'<small> mm</small>');
    h.className='v';
  }else{h.innerHTML='0<small> mm</small>';h.className='v warn';}
}
function flameH(){
  if(!alive)return 0.1;
  if(mode==='micro')return 2.4;
  let h=2.9-0.045*(o2p-16);
  if(mode==='blow')h*=0.55;
  h*=windFactor();
  return clamp(h,0.8,3.2);
}
function windFactor(){return 1-0.12*clamp(wind,0,2);}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bNorm').addEventListener('click',()=>setMode('norm'));
document.getElementById('bMicro').addEventListener('click',()=>setMode('micro'));
document.getElementById('bBlow').addEventListener('click',()=>setMode('blow'));
document.getElementById('sO2').addEventListener('input',e=>setO2(+e.target.value));
document.getElementById('sWind').addEventListener('input',e=>setWind(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglArr').addEventListener('change',e=>{arrOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0c0d10:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0c0d10:0xe9e4dc);
  tableM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 点火/熄灭逻辑 ── */
  if(alive&&o2p<16.5){alive=false;relightT=0;}
  if(!alive&&o2p>=17){relightT+=dts;if(relightT>1.5)alive=true;}
  const flk=alive?(0.86+0.14*Math.sin(simT*11)+0.06*Math.sin(simT*23.7)):0;
  const H=flameH()*flk;
  const windX=(mode==='blow'?1.6:0)+wind;
  const micro=mode==='micro';
  const premix=mode==='blow'||windX>0.6;
  /* ── 焰形半径函数 ── */
  function envR(t01){
    if(micro)return 1.05*(0.25+0.75*t01);
    return 0.5*Math.sqrt(Math.min(t01/0.1,1))*(1-0.52*smooth((t01-0.55)/0.45));
  }
  /* ── 更新三层粒子 ── */
  function upd(p,n,S,A,R,zone){
    const pos=p.geometry.attributes.position.array,col=p.geometry.attributes.color.array;
    for(let i=0;i<n;i++){
      const sp=0.35+0.65*S[i];
      let age=(S[i]+simT*sp*(micro?0.35:1))%1;
      const t01=age;
      const u=R[i];
      const rad=envR(t01)*(0.35+0.75*u);
      const ang=A[i]*Math.PI*2+t01*(micro?0.4:2.6)+0.3*Math.sin(simT*3+i);
      let x=Math.cos(ang)*rad,z=Math.sin(ang)*rad,y;
      if(micro){
        y=WICK_Y+0.95+Math.cos(u*3.1)*0.1+t01*0.25-0.15;
        const rr=1.05*(0.25+0.75*t01)*(0.35+0.85*u);
        x=Math.cos(ang)*rr;z=Math.sin(ang)*rr;
      }else{
        y=WICK_Y+t01*H;
        x+=windX*t01*t01*1.5;
      }
      pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
      let c;
      if(zone==='core')c=tmpC.copy(CORE_Y).multiplyScalar(0.55+0.3*flk);
      else if(zone==='myel')c=tmpC.copy(RIM).lerp(YEL2,0.25).multiplyScalar(0.38*flk);   /* 微重力:无烟粒,暗蓝 */
      else if(zone==='yel'){
        c=tmpC.copy(YEL1).lerp(YEL2,u);
        c.multiplyScalar((premix?0.55:1)*flk);
      }else{
        c=tmpC.copy(RIM).multiplyScalar((premix?1.25:0.85)*flk);
      }
      col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    }
    p.geometry.attributes.position.needsUpdate=true;
    p.geometry.attributes.color.needsUpdate=true;
  }
  const showFlame=alive;
  coreP.visible=yelP.visible=rimP.visible=showFlame;
  if(showFlame){
    upd(coreP,NCORE,coreS,coreA,coreR,'core');
    upd(yelP,NYEL,yelS,yelA,yelR,micro?'myel':(premix?'rim':'yel'));
    upd(rimP,NRIM,rimS,rimA,rimR,'rim');
  }
  /* ── 烟粒子(熄灭时从烛芯冒烟;平时顶部少量) ── */
  {
    const pos=smokeP.geometry.attributes.position.array,col=smokeP.geometry.attributes.color.array;
    for(let i=0;i<NSMOK;i++){
      const sp=0.25+0.5*smkS[i];
      const t01=((smkS[i]+simT*sp)%1);
      const y=WICK_Y+t01*(alive?1.6:2.6);
      const rr=0.06+t01*(alive?0.22:0.5)+smkR[i]*0.15;
      const ang=smkA[i]*Math.PI*2+t01*1.2+0.4*Math.sin(simT*2+i);
      pos[i*3]=Math.cos(ang)*rr+windX*t01*t01*2.2;
      pos[i*3+1]=y;
      pos[i*3+2]=Math.sin(ang)*rr;
      const a=alive?0.25*(1-t01):0.5*(1-t01);
      tmpC.copy(SMK).multiplyScalar(a);
      col[i*3]=tmpC.r;col[i*3+1]=tmpC.g;col[i*3+2]=tmpC.b;
    }
    smokeP.geometry.attributes.position.needsUpdate=true;
    smokeP.geometry.attributes.color.needsUpdate=true;
  }
  /* ── 烛光 ── */
  cLight.intensity=alive?(1.35+0.5*flk):(0.15);
  ember.material.emissiveIntensity=alive?1.2+0.6*flk:0.25;
  waxM.emissiveIntensity=alive?0.10+0.08*flk:0.02;
  /* ── 扩散箭头 ── */
  for(const a of o2Arrs)a.visible=arrOn&&alive;
  for(const a of fuelArrs)a.visible=arrOn&&alive;
  if(arrOn&&alive){
    const YUP=new THREE.Vector3(0,1,0),d=new THREE.Vector3();
    const cy=micro?2.85:2.45;
    o2Arrs.forEach((a,i)=>{
      const ang=i/5*Math.PI*2+simT*0.2;
      const rr=(micro?1.55:1.3)+0.12*Math.sin(simT*3+i);
      a.position.set(Math.cos(ang)*rr,cy+0.2*Math.sin(i*2.1+simT),Math.sin(ang)*rr);
      d.set(-a.position.x*0.7,cy-0.3-a.position.y,-a.position.z*0.7).normalize();
      a.quaternion.setFromUnitVectors(YUP,d);
      a.scale.setScalar(1+0.15*Math.sin(simT*5+i));
    });
    fuelArrs.forEach((a,i)=>{
      const ang=i/4*Math.PI*2+simT*0.15;
      const side=0.5+0.15*Math.sin(simT*4+i);
      a.position.set(Math.cos(ang)*side,1.68+0.32*((i%2)?0.4:0),Math.sin(ang)*side);
      d.set(Math.cos(ang)*0.9,0.9,Math.sin(ang)*0.9).normalize();
      a.quaternion.setFromUnitVectors(YUP,d);
      a.scale.setScalar(0.8+0.12*Math.sin(simT*4+i));
    });
  }
  stat={tc:alive?(mode==='blow'?1180:mode==='micro'?840:760)+o2p*3:0,
    sh:mode==='blow'?0.2:mode==='micro'?0.9:0.5,
    o2:alive?6.0*(o2p/21)*(mode==='blow'?1.6:mode==='micro'?0.45:1):0,
    h:flameH()*10};
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
