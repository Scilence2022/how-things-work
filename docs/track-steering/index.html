<html lang="zh-CN" data-theme="dark">
<head>

<title>履带车辆与差速转向 · 速差即转向</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d99a2b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#a86f12;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,154,43,.6);background:rgba(217,154,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(168,111,18,.55);background:rgba(168,111,18,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}

  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }

  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}

</style>

<div id="title">
  <h1 data-zh="履带车辆与差速转向" data-en="Tracked Vehicles &amp; Skid-Steer">履带车辆与差速转向</h1>
  <div class="sub" data-zh="左右履带各卷各的→速差即角速度 ω=(v_R−v_L)/B→车体绕瞬时中心 ICC 转弯,R=B(v_L+v_R)/(2(v_R−v_L))→一侧停转 R=B/2、两侧反转原地自转 R=0→代价是履带横向刮地,阻力矩≈μ_t·W·L/4,急转时功率 P=M·ω 暴涨→轮式阿克曼纯滚动省力,却转不了这么急 · 拖动旋转 / 空格运行/暂停" data-en="Each track reels independently → the speed difference IS the yaw rate ω=(v_R−v_L)/B → the hull pivots about the instantaneous center of rotation, R=B(v_L+v_R)/(2(v_R−v_L)) → stop one track and R=B/2, counter-rotate and R=0 → the price is sideways scrubbing with resistive moment ≈μ_t·W·L/4, and power P=M·ω explodes in hard turns → wheeled Ackermann steering rolls scrub-free but can never turn this tight · drag to orbit / Space = run/pause">左右履带各卷各的→速差即角速度 ω=(v_R−v_L)/B→车体绕瞬时中心 ICC 转弯,R=B(v_L+v_R)/(2(v_R−v_L))→一侧停转 R=B/2、两侧反转原地自转 R=0→代价是履带横向刮地,阻力矩≈μ_t·W·L/4,急转时功率 P=M·ω 暴涨→轮式阿克曼纯滚动省力,却转不了这么急 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 履带差速转向:v=(v_L+v_R)/2, ω=(v_R−v_L)/B, ICC 距离 R=vm/ω;
   转向时履带横向刮地,滑移阻力矩 M≈μ_t·W·L/4(均匀接地比压),
   侧滑功率 P=M·ω 随转速暴涨;对照轮式阿克曼纯滚动 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x11141a,18,58);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(7.0,4.4,8.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.55,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 地面 + 参考环 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x171c22,roughness:0.96});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,64),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.005;scene.add(ground);
const refLines=[];
for(const r of [4,8,12,16]){
  const pts=[];for(let k=0;k<=96;k++){const a=k/96*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(a),0.004,r*Math.sin(a)));}
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x2c3542,transparent:true,opacity:0.5}));
  scene.add(ln);refLines.push(ln);
}
for(const rot of [0,Math.PI/2]){
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-17,0.004,0),new THREE.Vector3(17,0.004,0)]),
    new THREE.LineBasicMaterial({color:0x2c3542,transparent:true,opacity:0.5}));
  ln.rotation.y=rot;scene.add(ln);refLines.push(ln);
}

/* ── 车辆 ── */
const veh=new THREE.Group();scene.add(veh);
const hullM=new THREE.MeshStandardMaterial({color:0x6f7d52,roughness:0.65,metalness:0.3});
const hull2M=new THREE.MeshStandardMaterial({color:0x57643f,roughness:0.7,metalness:0.25});
const darkM=new THREE.MeshStandardMaterial({color:0x22262c,roughness:0.8,metalness:0.4});
const wheelM=new THREE.MeshStandardMaterial({color:0x3a4149,roughness:0.55,metalness:0.6});
const padM=new THREE.MeshStandardMaterial({color:0x2b3036,roughness:0.85,metalness:0.35,
  emissive:0xff8800,emissiveIntensity:0});
const hull=new THREE.Mesh(new THREE.BoxGeometry(0.92,0.5,3.05),hullM);hull.position.y=0.78;veh.add(hull);
const cab=new THREE.Mesh(new THREE.BoxGeometry(0.72,0.5,1.15),hull2M);cab.position.set(0,1.26,0.55);veh.add(cab);
const glass=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.06),
  new THREE.MeshStandardMaterial({color:0x8fd0ff,roughness:0.1,metalness:0.6,emissive:0x2a4a66,emissiveIntensity:0.4}));
glass.position.set(0,1.3,1.14);veh.add(glass);
const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.5,10),wheelM);
pipe.rotation.x=Math.PI/2;pipe.position.set(0.26,1.6,-0.12);veh.add(pipe);
const blade=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.62,0.1),wheelM);
blade.position.set(0,0.42,2.15);blade.rotation.x=0.12;veh.add(blade);
for(const sx of [-1,1]){
  const arm=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,1.05),darkM);
  arm.position.set(sx*0.85,0.6,1.62);veh.add(arm);
}
/* 履带:环形跑道(两条直段+两端半圆),22 块履带板沿路径循环 */
const LC=3.3,RW=0.30,PER=2*LC+2*Math.PI*RW,NP=22;
function stadium(s){
  s=((s%PER)+PER)%PER;
  if(s<LC)return {z:-LC/2+s,y:0.045,tz:1,ty:0};
  s-=LC;
  if(s<Math.PI*RW){const a=s/RW;return {z:LC/2+RW*Math.sin(a),y:0.34-RW*Math.cos(a),tz:Math.cos(a),ty:Math.sin(a)};}
  s-=Math.PI*RW;
  if(s<LC)return {z:LC/2-s,y:0.635,tz:-1,ty:0};
  s-=LC;
  const a=s/RW;return {z:-LC/2-RW*Math.sin(a),y:0.34+RW*Math.cos(a),tz:-Math.cos(a),ty:-Math.sin(a)};
}
function makeTrack(){
  const g=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.BoxGeometry(0.56,0.66,LC+0.55),darkM);
  frame.position.y=0.34;g.add(frame);
  const wheelGeo=new THREE.CylinderGeometry(RW,RW,0.5,18);wheelGeo.rotateZ(Math.PI/2);
  const smallGeo=new THREE.CylinderGeometry(0.15,0.15,0.44,14);smallGeo.rotateZ(Math.PI/2);
  const wheels=[];
  for(const zz of [LC/2,-LC/2]){
    const w=new THREE.Mesh(wheelGeo,wheelM);w.position.set(0,0.34,zz);g.add(w);wheels.push(w);
  }
  for(let i=0;i<3;i++){
    const w=new THREE.Mesh(smallGeo,wheelM);w.position.set(0,0.16,-1.0+i*1.0);g.add(w);wheels.push(w);
  }
  const pads=[];
  for(let i=0;i<NP;i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.07,0.24),padM);
    g.add(p);pads.push(p);
  }
  veh.add(g);return {g,pads,wheels};
}
const trackL=makeTrack(),trackR=makeTrack();   /* trackL = 左侧(局部 +x) */
const sL={s:0},sR={s:0};
function placeTrack(tr,st,v,dts){
  st.s-=v*dts;
  for(let i=0;i<NP;i++){
    const q=stadium(st.s+i*PER/NP),p=tr.pads[i];
    p.position.set(0,q.y,q.z);
    p.rotation.x=-Math.atan2(q.ty,q.tz);
  }
  for(const w of tr.wheels)w.rotation.x+=v/RW*dts;
}

/* ── 转弯圆弧 / 半径线 / 前向引导线 / ICC 标记 ── */
const CIRC_N=96;
const circGeo=new THREE.BufferGeometry();
circGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array((CIRC_N+1)*3),3));
const circLine=new THREE.Line(circGeo,new THREE.LineBasicMaterial({color:0xd99a2b,transparent:true,opacity:0.55}));
circLine.frustumCulled=false;scene.add(circLine);circLine.visible=false;
const radGeo=new THREE.BufferGeometry();
radGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));

radLine.frustumCulled=false;scene.add(radLine);radLine.visible=false;
const guideGeo=new THREE.BufferGeometry();
guideGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
const guideLine=new THREE.Line(guideGeo,new THREE.LineDashedMaterial({color:0x8a96a8,transparent:true,opacity:0.5,dashSize:0.3,gapSize:0.25}));
guideLine.frustumCulled=false;scene.add(guideLine);guideLine.visible=false;

scene.add(iccM);iccM.visible=false;

/* ── 行驶尾迹(渐隐顶点色) ── */
const TRMAX=520;
const bgC=new THREE.Color(0x11141a),trailBase=new THREE.Color(0xffc24d),tmpC=new THREE.Color();
const trailG=new THREE.BufferGeometry();
trailG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRMAX*3),3));
trailG.setAttribute('color',new THREE.BufferAttribute(new Float32Array(TRMAX*3),3));
trailG.setDrawRange(0,0);
const trail=new THREE.Line(trailG,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9}));
trail.frustumCulled=false;scene.add(trail);
let trailN=0;
function trailClear(){trailN=0;trailG.setDrawRange(0,0);}
function trailPush(x,z){
  const pos=trailG.attributes.position.array;
  if(trailN>=TRMAX){pos.copyWithin(0,3);trailN=TRMAX-1;}
  pos[trailN*3]=x;pos[trailN*3+1]=0.03;pos[trailN*3+2]=z;trailN++;
  const col=trailG.attributes.color.array;
  for(let i=0;i<trailN;i++){
    const f=trailN>1?i/(trailN-1):1;
    tmpC.copy(trailBase).lerp(bgC,1-f);
    col[i*3]=tmpC.r;col[i*3+1]=tmpC.g;col[i*3+2]=tmpC.b;
  }
  trailG.setDrawRange(0,trailN);
  trailG.attributes.position.needsUpdate=true;trailG.attributes.color.needsUpdate=true;
}

/* ── 状态 ── */
let mode='go',vL=1.2,vR=1.2,B=2.4;
let playing=true,labelsOn=true,slowMo=false,arcsOn=true;
let simT=0,px=0,pz=0,heading=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const M_VEH=12000,MU_T=0.55,TRK_L=3.3;

const labelReg=[];

  const div=document.createElement('div');div.className='lbl '+cls;

}
let st={R:Infinity,om:0,dv:0,P:0,Rc:0,slip:0};
const lblVL=addLabel(()=>L(`左履带 ${vL.toFixed(2)} m/s`,`left track ${vL.toFixed(2)} m/s`),

const lblVR=addLabel(()=>L(`右履带 ${vR.toFixed(2)} m/s`,`right track ${vR.toFixed(2)} m/s`),

const lblB=addLabel(()=>L(`履带间距 B=${B.toFixed(2)} m`,`gauge B=${B.toFixed(2)} m`),

const lblICC=addLabel(()=>L('瞬时中心 ICC','instant center ICC'),new THREE.Vector3(0,0.5,0),'y',
  ()=>arcsOn&&iccM.visible&&Math.abs(st.Rc)>=0.12);
const lblR=addLabel(()=>Math.abs(st.om)<1e-3?'':L(`R=${Math.abs(st.Rc).toFixed(2)} m`,`R=${Math.abs(st.Rc).toFixed(2)} m`),
  new THREE.Vector3(0,0.3,0),'y',()=>arcsOn&&Math.abs(st.Rc)>=0.12&&Math.abs(st.Rc)<=45&&Math.abs(st.om)>1e-3);
const lblSpin=addLabel(()=>L('原地自转 · R≈0','spin in place · R≈0'),new THREE.Vector3(0,2.05,0),'o',
  ()=>Math.abs(st.om)>1e-3&&Math.abs(st.Rc)<0.12);
const lblSkid=addLabel(()=>L('履带横向刮地 · 滑移阻力矩','tracks scrub sideways · skid moment'),
  new THREE.Vector3(0,0.28,1.75),'r',()=>st.slip>0.15,veh);
const lblRoll=addLabel(()=>L('两侧同速 · 纯滚动直行','equal speeds · pure rolling'),new THREE.Vector3(0,1.95,-0.9),'g',
  ()=>Math.abs(st.dv)<0.05);

function setVL(vv){vL=clamp(vv,-1.5,3);
  document.getElementById('sVL').value=vL;
  document.getElementById('sVLVal').textContent=vL.toFixed(2)+' m/s';}
function setVR(vv){vR=clamp(vv,-1.5,3);
  document.getElementById('sVR').value=vR;
  document.getElementById('sVRVal').textContent=vR.toFixed(2)+' m/s';}
function setB(vv){B=clamp(vv,1.6,3.4);
  document.getElementById('sB').value=B;
  document.getElementById('sBVal').textContent=B.toFixed(2)+' m';
  trackL.g.position.x=B/2;trackR.g.position.x=-B/2;}
function setMode(m){mode=m;
  document.getElementById('bGo').classList.toggle('on',m==='go');
  document.getElementById('bPivot').classList.toggle('on',m==='pivot');
  document.getElementById('bSpin').classList.toggle('on',m==='spin');
  if(m==='go'){setVL(1.2);setVR(1.2);}
  if(m==='pivot'){setVL(0);setVR(1.2);}
  if(m==='spin'){setVL(-0.8);setVR(0.8);}}

const STEPS=[
 {b:'同速直行:纯滚动',be:'Equal speeds: pure rolling',
  d:'两条履带速度相同,车体像轮子一样纯滚动直行——这是履带唯一不吃力的状态,接地段相对地面速度为零。',
  de:'Both tracks run at the same speed and the hull rolls straight like a wheel — the only effortless state, with the ground-contact patches at zero slip.',
  act(){setMode('go');}},
 {b:'速差即转向',be:'Speed difference steers',
  d:'左右履带一快一慢,车体绕瞬时中心 ICC 转弯:ω=(v_R−v_L)/B,R=B(v_L+v_R)/(2(v_R−v_L))——速差越大半径越小。',
  de:'One track faster than the other and the hull pivots about the instant center: ω=(v_R−v_L)/B, R=B(v_L+v_R)/(2(v_R−v_L)) — bigger difference, tighter radius.',
  act(){setVL(0.7);setVR(1.4);}},
 {b:'一侧停转:R=B/2',be:'One track stopped: R=B/2',
  d:'内侧履带完全刹停,车体以履带间距一半为半径绕停转侧转向;那条履带在原地被拖着刮转,磨损集中在这里。',
  de:'Brake the inner track dead and the vehicle pivots at radius B/2 about that side; the stalled track is dragged around in place — that is where wear concentrates.',
  act(){setMode('pivot');}},
 {b:'两侧反转:原地自转',be:'Counter-rotate: spin in place',
  d:'两条履带等速反向,车体绕自身中心原地旋转,R=0——这是轮式车辆做不到的,也是坦克能在窄路掉头的原因。',
  de:'Equal and opposite track speeds spin the hull about its own center, R=0 — impossible for wheeled cars, and why tanks U-turn on narrow roads.',
  act(){setMode('spin');}},
 {b:'侧滑刮地:阻力矩',be:'Sideways scrub: resistive moment',
  d:'转弯时履带接地段必须横着刮地面,滑移阻力矩 M≈μ_t·W·L/4(均匀接地比压假设)——转向是履带车最吃力的工况。',
  de:'In a turn the track contact patches scrape sideways; the skid moment M≈μ_t·W·L/4 (uniform ground pressure) makes steering the most power-hungry duty of a tracked vehicle.',

 {b:'急转功率暴涨',be:'Hard turns spike power',

 {b:'轮式对照:阿克曼',be:'Wheeled counterpart: Ackermann',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const rv=document.getElementById('stR');
  if(Math.abs(st.om)<1e-3)rv.innerHTML='∞';
  else if(Math.abs(st.Rc)<0.12)rv.innerHTML=L('0<small> 自转</small>','0<small> spin</small>');
  else rv.innerHTML=Math.abs(st.Rc).toFixed(2)+'<small> m</small>';
  rv.className='v '+(Math.abs(st.om)>1e-3&&Math.abs(st.Rc)<2.5?'warn':'');
  document.getElementById('stDv').innerHTML=st.dv.toFixed(2)+'<small> m/s</small>';
  document.getElementById('stOm').innerHTML=st.om.toFixed(2)+'<small> rad/s</small>';
  const pv=document.getElementById('stP');
  pv.innerHTML=st.P.toFixed(1)+'<small> kW</small>';
  pv.className='v '+(st.P>30?'warn':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bGo').addEventListener('click',()=>setMode('go'));

document.getElementById('sVR').addEventListener('input',e=>setVR(+e.target.value));

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x11141a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x11141a:0xe9e4dc);
  groundM.color.setHex(dark?0x171c22:0xd8d0c2);
  for(const ln of refLines)ln.material.color.setHex(dark?0x2c3542:0xbdb2a0);
  bgC.setHex(dark?0x11141a:0xe9e4dc);
  repaintTrail();
}
function repaintTrail(){
  const col=trailG.attributes.color.array;
  for(let i=0;i<trailN;i++){
    const f=trailN>1?i/(trailN-1):1;
    tmpC.copy(trailBase).lerp(bgC,1-f);
    col[i*3]=tmpC.r;col[i*3+1]=tmpC.g;col[i*3+2]=tmpC.b;
  }
  trailG.attributes.color.needsUpdate=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 运动学 ── */
  const vm=(vL+vR)/2,dv=vR-vL,om=dv/B;
  const Rc=Math.abs(om)<1e-3?Infinity:vm/om;
  heading+=om*dts;
  px+=Math.sin(heading)*vm*dts;
  pz+=Math.cos(heading)*vm*dts;
  if(Math.hypot(px,pz)>13){px=0;pz=0;trailClear();}
  veh.position.set(px,0,pz);veh.rotation.y=heading;
  const P=MU_T*M_VEH*9.81*TRK_L/4*Math.abs(om)*(Math.abs(dv)>0.05?1:0)/1000;
  const slip=clamp((Math.abs(om)-0.08)/0.6,0,1)*(Math.abs(dv)>0.05?1:0);
  st={R:Rc,om,dv,P,Rc:(isFinite(Rc)?Rc:0),slip};
  /* ── 可视化 ── */
  placeTrack(trackL,sL,vL,dts);
  placeTrack(trackR,sR,vR,dts);
  padM.emissiveIntensity=0.55*slip;
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.05&&dts>0){frame.acc=0;trailPush(px,pz);}
  const left={x:Math.cos(heading),z:-Math.sin(heading)};
  if(Math.abs(om)>1e-3&&isFinite(Rc)&&Math.abs(Rc)>0.12&&Math.abs(Rc)<=45){
    const cx=px+left.x*Rc,cz=pz+left.z*Rc;
    iccM.visible=true;iccM.position.set(cx,0.05,cz);
    lblICC.position.set(cx,0.5,cz);
    const arr=circGeo.attributes.position.array;
    for(let k=0;k<=CIRC_N;k++){
      const a=k/CIRC_N*Math.PI*2;
      arr[k*3]=cx+Math.abs(Rc)*Math.cos(a);arr[k*3+1]=0.04;arr[k*3+2]=cz+Math.abs(Rc)*Math.sin(a);
    }
    circGeo.attributes.position.needsUpdate=true;
    circLine.visible=arcsOn;
    const ra=radGeo.attributes.position.array;
    ra[0]=px;ra[1]=0.06;ra[2]=pz;ra[3]=cx;ra[4]=0.06;ra[5]=cz;
    radGeo.attributes.position.needsUpdate=true;
    radLine.computeLineDistances();radLine.visible=arcsOn;
    lblR.position.set((px+cx)/2,0.3,(pz+cz)/2);
  }else{
    circLine.visible=false;radLine.visible=false;
    iccM.visible=Math.abs(om)>1e-3;
    if(iccM.visible)iccM.position.set(px,0.05,pz);
  }
  if(Math.abs(om)<=1e-3||!isFinite(Rc)||Math.abs(Rc)>45){
    const ga=guideGeo.attributes.position.array;
    ga[0]=px+Math.sin(heading)*0.9;ga[1]=0.06;ga[2]=pz+Math.cos(heading)*0.9;
    ga[3]=px+Math.sin(heading)*9;ga[4]=0.06;ga[5]=pz+Math.cos(heading)*9;
    guideGeo.attributes.position.needsUpdate=true;
    guideLine.computeLineDistances();guideLine.visible=arcsOn;
  }else guideLine.visible=false;
  /* 读数节流 */
  frame.accS=(frame.accS||0)+dt;
  if(frame.accS>0.12){frame.accS=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setB(B);   /* 初始化履带间距位置 */
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
