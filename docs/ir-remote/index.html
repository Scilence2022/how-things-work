<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>红外遥控与载波编码 · 38 kHz 载波说暗号</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="红外遥控与载波编码" data-en="IR Remotes & Carrier Codes">红外遥控与载波编码</h1>
  <div class="sub" data-zh="遥控器把指令写成 38 kHz 载波上的时间密码:9 毫秒引导码开路,32 位地址加命令再加反码,每位用 560 微秒的脉冲加不同长度的间隔分出 0 和 1;载波不是花腔——阳光与灯泡的红外噪声是低频的,38 kHz 带通接收器只认这段高频闪烁;一键一码,音量长按是 110 毫秒一次的重复码 · 拖动旋转 / 空格运行/暂停" data-en="The remote writes its command as a time-code on a 38 kHz carrier: a 9 ms lead pulse, 32 bits of address, command and inverted command, each bit a 560 µs burst told apart by the gap length; the carrier isn't ornament — sunlight and lamps spray low-frequency infrared noise, and the 38 kHz band-pass receiver only answers this flicker; one key one code, and held volume keys repeat every 110 ms · drag to orbit / Space = run/pause">遥控器把指令写成 38 kHz 载波上的时间密码:9 毫秒引导码开路,32 位地址加命令再加反码,每位用 560 微秒的脉冲加不同长度的间隔分出 0 和 1;载波不是花腔——阳光与灯泡的红外噪声是低频的,38 kHz 带通接收器只认这段高频闪烁;一键一码,音量长按是 110 毫秒一次的重复码 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="载波" data-en="Carrier">载波</span><span class="v" id="stCar">—</span>
  <span class="k" data-zh="码长" data-en="Frame">码长</span><span class="v" id="stBits">—</span>
  <span class="k" data-zh="距离" data-en="Distance">距离</span><span class="v" id="stDist">—</span>
  <span class="k" data-zh="误码率" data-en="Error rate">误码率</span><span class="v" id="stErr">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bPow" data-zh="⏻ 电源键" data-en="⏻ Power">⏻ 电源键</button>
    <button class="abtn" id="bVol" data-zh="🔊 音量+" data-en="🔊 Vol+">🔊 音量+</button>
    <button class="abtn" id="bHold" data-zh="长按:重复码" data-en="Hold: repeat">长按:重复码</button>
  </div>
  <div class="row">
    <label data-zh="距离" data-en="Distance">距离</label>
    <input id="sDist" type="range" min="0.5" max="10" step="0.5" value="3">
    <span class="val" id="sDistVal">3.0 m</span>
  </div>
  <div class="row">
    <label data-zh="阳光干扰" data-en="Sunlight noise">阳光干扰</label>
    <input id="sSun" type="range" min="0" max="100" step="5" value="20">
    <span class="val" id="sSunVal">20 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglWave" type="checkbox" checked> <span data-zh="波形板" data-en="Waveform">波形板</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../wifi/" data-zh="Wi-Fi" data-en="Wi-Fi">Wi-Fi</a>
    <a href="../am-fm-modulation/" data-zh="调幅与调频" data-en="AM & FM Modulation">调幅与调频</a>
    <a href="../optical-mouse/" data-zh="光学鼠标" data-en="The Optical Mouse">光学鼠标</a>
    <a href="../fiber-optics/" data-zh="光纤通信" data-en="Fiber Optics">光纤通信</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.5,4.6,11.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const deskM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.75});
const desk=new THREE.Mesh(new THREE.BoxGeometry(12,0.35,4),deskM);
desk.position.set(0,0.17,0);scene.add(desk);

/* 电视:机身+屏幕+接收头小窗 */
const tvG=new THREE.Group();tvG.position.set(4.6,0.35,0);scene.add(tvG);
const tvBody=new THREE.Mesh(new THREE.BoxGeometry(0.35,2.6,4.2),
  new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.55}));
tvBody.position.y=2.2;tvG.add(tvBody);
const screenM=new THREE.MeshStandardMaterial({color:0x0a0d12,roughness:0.2,emissive:0x000000,emissiveIntensity:0});
const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.8,2.2),screenM);
screen.rotation.y=-Math.PI/2;screen.position.set(-0.19,2.25,0);tvG.add(screen);
/* 屏上音量条 */
const volM=new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0.95});
const volBar=new THREE.Mesh(new THREE.PlaneGeometry(1.6,0.14),volM);
volBar.rotation.y=-Math.PI/2;volBar.position.set(-0.20,1.5,0);volBar.scale.x=0.001;tvG.add(volBar);
/* 接收头 */
const recM=new THREE.MeshStandardMaterial({color:0x14171c,roughness:0.3});
const rec=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,10),recM);
rec.position.set(-0.21,3.2,0.4);tvG.add(rec);

/* 遥控器:机身+三键+LED */
const remG=new THREE.Group();remG.rotation.y=Math.PI/2;scene.add(remG);
const remBody=new THREE.Mesh(new THREE.BoxGeometry(0.62,1.9,0.16),
  new THREE.MeshStandardMaterial({color:0x3a4150,roughness:0.5}));
remBody.position.y=1.0;remG.add(remBody);
const btnM=new THREE.MeshStandardMaterial({color:0x5a6474,roughness:0.5});
const btns=[];
for(let i=0;i<3;i++){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.07,18),btnM);
  b.rotation.x=Math.PI/2;b.position.set(0,1.5-i*0.42,-0.1);
  remG.add(b);btns.push(b);
}
const ledM=new THREE.MeshStandardMaterial({color:0x2a2f3a,emissive:0x000000,emissiveIntensity:0});
const led=new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),ledM);
led.position.set(0,0.18,0);remG.add(led);
/* 光锥:940 nm 不可见,半透明锥示意 */
const coneM=new THREE.MeshBasicMaterial({color:0xff5a5a,transparent:true,opacity:0.10,side:THREE.DoubleSide,depthWrite:false});
const cone=new THREE.Mesh(new THREE.ConeGeometry(0.9,1,24,1,true),coneM);
cone.visible=false;scene.add(cone);

/* 波形板:NEC 帧的时间密码(引导+32 位) */
const waveG=new THREE.Group();waveG.position.set(-1.2,4.9,-1.2);waveG.rotation.x=-0.22;scene.add(waveG);
const waveBase=new THREE.Mesh(new THREE.PlaneGeometry(6.4,1.3),
  new THREE.MeshStandardMaterial({color:0x171b22,roughness:0.6}));
waveG.add(waveBase);
const NWSEG=74;
const segM=new THREE.MeshBasicMaterial({color:0xffd43b});
const segs=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),segM,NWSEG);
segs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);waveG.add(segs);
const segD=[];for(let i=0;i<NWSEG;i++)segD.push({x0:0,w:0,on:0});
/* 光标 */
const curM=new THREE.MeshBasicMaterial({color:0xff6b6b});
const cursor=new THREE.Mesh(new THREE.PlaneGeometry(0.03,1.2),curM);
waveG.add(cursor);cursor.visible=false;
function layoutWave(cmd){/* cmd: 8bit 命令,画 NEC 帧:9ms 引导+4.5ms 停+32 位 */
  const unit=6.0/108;/* 108 个 560µs 槽 */
  const seq=[];
  seq.push([0,16]);seq.push([1,8]);/* 引导脉冲/间隔 */
  const bits=[0xAA,cmd,0x55,(~cmd)&0xFF];/* 地址/命令/反码(示意) */
  for(const b of bits)for(let i=7;i>=0;i--)seq.push([1,1]),seq.push([0,((b>>i)&1)?3:1]);
  let x=-3.0;let i=0;
  for(const [on,w] of seq){
    if(i>=NWSEG)break;
    segD[i].x0=x;segD[i].w=w*unit;segD[i].on=on;i++;
    x+=w*unit;
  }
  for(;i<NWSEG;i++){segD[i].x0=x;segD[i].w=0;segD[i].on=0;}
}
layoutWave(0x1E);
/* 干扰粒子 */
const NSUN=40;
const sunM=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.75});
const suns=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,6,6),sunM,NSUN);
suns.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(suns);
const sunD=[];for(let i=0;i<NSUN;i++)sunD.push({x:Math.random(),y:Math.random(),z:(Math.random()-0.5),sp:0.3+Math.random()*0.5});

/* 状态 */
let dist=3,sun=20,playing=true,labelsOn=true,slowMo=false,waveOn=true,simT=0;
let tvOn=false,vol=0.35,txT=9,txActive=false,txCmd=0x1E,errFlash=0,repeatN=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const m4=new THREE.Matrix4();
function errRate(){
  let e=0;
  if(dist>5)e+=(dist-5)*9;
  if(sun>30)e+=(sun-30)*0.55;
  return clamp(e,0,92);
}
function remPos(){return new THREE.Vector3(4.6-dist*0.85,0.35,0);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('红外 LED:940 nm,眼睛看不见','IR LED: 940 nm, invisible to you'),
  new THREE.Vector3(0,0.8,0),'r',()=>txActive);
addLabel(()=>L('接收头:38 kHz 带通,只认这段闪烁','Receiver: 38 kHz band-pass, answers only this flicker'),
  new THREE.Vector3(4.6,3.8,0.4),'b');
addLabel(()=>L('NEC 帧:9 ms 引导 + 32 位','NEC frame: 9 ms lead + 32 bits'),
  new THREE.Vector3(-1.2,5.8,-1.2),'y',()=>waveOn);
addLabel(()=>L('阳光:满屏低频红外噪声','Sunlight: low-frequency IR noise everywhere'),
  new THREE.Vector3(1.5,4.2,1.6),'o',()=>sun>30);
addLabel(()=>L('重复码:每 110 ms 补一发','Repeat code: one more every 110 ms'),
  new THREE.Vector3(-2.0,2.6,0),'g',()=>repeatN>0);

function setDist(v){dist=clamp(v,0.5,10);
  document.getElementById('sDist').value=dist;
  document.getElementById('sDistVal').textContent=dist.toFixed(1)+' m';
  remG.position.copy(remPos());updateStats();}
function setSun(v){sun=clamp(v,0,100);
  document.getElementById('sSun').value=sun;
  document.getElementById('sSunVal').textContent=sun+' %';updateStats();}
function transmit(cmd,repeat){
  txCmd=cmd;layoutWave(cmd);
  txActive=true;txT=0;cursor.visible=true;
  repeatN=repeat?4:0;
  btns.forEach((b,i)=>b.material.emissiveIntensity=0.5);
  if(Math.random()*100<errRate()){/* 误码:接收头拒绝 */
    txActive=false;cursor.visible=false;
    errFlash=1;rec.material.color.setHex(0xff6b6b);
  }
}
function applyCmd(){
  if(txCmd===0x1E){tvOn=!tvOn;screenM.emissive.setHex(tvOn?0x3d6fa8:0x000000);screenM.emissiveIntensity=tvOn?0.85:0;}
  else{vol=clamp(vol+0.2,0,1);volBar.scale.x=vol;}
}

const STEPS=[
 {zh:'940 nm:眼睛看不见的信使',en:'940 nm: the messenger you cannot see',
  act(){setDist(3);setSun(20);transmit(0x1E,false);}},
 {zh:'38 kHz 载波:从噪声里挑信号',en:'38 kHz carrier: signal picked from noise',
  act(){setSun(60);transmit(0x1E,false);}},
 {zh:'引导码:9 毫秒的敲门声',en:'The lead: a 9 ms knock on the door',
  act(){setDist(2);transmit(0x1E,false);}},
 {zh:'0 与 1:间隔的长短',en:'Zero and one: told by gap length',
  act(){setDist(2);transmit(0x3C,false);}},
 {zh:'长按:110 毫秒一次的重复码',en:'Hold: a repeat every 110 ms',
  act(){setDist(2);transmit(0x3C,true);}},
 {zh:'干扰:阳光下的红外风暴',en:'Interference: an IR storm under the sun',
  act(){setDist(8);setSun(90);transmit(0x1E,false);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stCar').innerHTML='38<small> kHz</small>';
  document.getElementById('stBits').innerHTML='32<small> bit</small>';
  document.getElementById('stDist').innerHTML=dist.toFixed(1)+'<small> m</small>';
  const e=document.getElementById('stErr');
  e.innerHTML=errRate().toFixed(0)+'<small> %</small>';
  e.className='v '+(errRate()>20?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bPow').addEventListener('click',()=>transmit(0x1E,false));
document.getElementById('bVol').addEventListener('click',()=>transmit(0x3C,false));
document.getElementById('bHold').addEventListener('click',()=>transmit(0x3C,true));
document.getElementById('sDist').addEventListener('input',e=>setDist(+e.target.value));
document.getElementById('sSun').addEventListener('input',e=>setSun(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglWave').addEventListener('change',e=>{waveOn=e.target.checked;waveG.visible=waveOn;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  deskM.color.setHex(dark?0x3a3f4b:0xb8ac9c);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 传输推进:光标扫过波形;完成后应用命令 */
  if(txActive){
    txT+=dts*0.55;
    cursor.position.x=-3.0+txT*6.0;
    cursor.visible=waveOn;
    if(txT>=1){
      txActive=false;cursor.visible=false;
      applyCmd();
      ledM.emissiveIntensity=0;
      btns.forEach(b=>b.material.emissiveIntensity=0);
      rec.material.color.setHex(0x14171c);
      if(repeatN>0){repeatN--;setTimeout(()=>{if(playing)transmit(txCmd,repeatN>0);},140);}
    }
  }
  /* 光锥:从 LED 指向接收头 */
  const from=remG.position.clone().add(new THREE.Vector3(0.35,1.2,0));
  const to=tvG.position.clone().add(new THREE.Vector3(-0.2,2.85,0.4));
  if(txActive){
    cone.visible=true;
    const dir=to.clone().sub(from),len=dir.length();
    cone.position.copy(from).add(dir.clone().multiplyScalar(0.5));
    cone.scale.set(0.35+len*0.06,len,0.35+len*0.06);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
    coneM.opacity=0.07+0.06*Math.sin(simT*40);/* 38 kHz 的视觉闪 */
    ledM.emissive.setHex(0xff4d4d);ledM.emissiveIntensity=0.6+0.5*Math.sin(simT*40);
  }else cone.visible=false;
  /* 波形段渲染 */
  if(waveOn){
    for(let i=0;i<NWSEG;i++){
      const s=segD[i];
      const lit=txActive?(s.x0+s.w/2+3.0)/6.0<txT:true;
      m4.makeScale(Math.max(s.w,0.001),s.on?0.16:0.05,0.05);
      m4.setPosition(s.x0+s.w/2,s.on?0.28:0.02,0.03);
      segs.setMatrixAt(i,m4);
      segs.setColorAt(i,new THREE.Color(s.on?(lit?0xffd43b:0x6b5a20):0x2a3040));
    }
    segs.instanceMatrix.needsUpdate=true;
    if(segs.instanceColor)segs.instanceColor.needsUpdate=true;
  }
  /* 干扰粒子在光路上飘 */
  const sunVis=sun>25;
  for(let i=0;i<NSUN;i++){
    const d=sunD[i];
    d.x+=dts*d.sp*0.3;if(d.x>1)d.x-=1;
    const p=from.clone().lerp(to,d.x);
    p.y+=Math.sin(simT*2+i)*0.5*(sun/100);
    p.z+=d.z*1.2;
    const s=sunVis?(sun/100)*1.2:0.001;
    m4.makeScale(s,s,s);m4.setPosition(p.x,p.y,p.z);
    suns.setMatrixAt(i,m4);
  }
  suns.instanceMatrix.needsUpdate=true;
  sunM.opacity=0.2+(sun/100)*0.6;
  /* 接收头误码闪红 */
  if(errFlash>0){errFlash-=dts*1.4;rec.material.color.setHex(Math.sin(errFlash*20)>0?0xff6b6b:0x14171c);}
  /* 屏幕呼吸 */
  if(tvOn)screenM.emissiveIntensity=0.75+0.1*Math.sin(simT*1.3);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setDist(3);updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
