<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>沙尘暴与尘卷风 · 跃移是引擎,细尘上千米</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9962e;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b0781e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,150,46,.6);background:rgba(217,150,46,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,120,30,.55);background:rgba(176,120,30,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,150,46,.10);border-color:rgba(217,150,46,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,120,30,.08);border-color:rgba(176,120,30,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3b8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="沙尘暴与尘卷风" data-en="Dust Storms &amp; Dust Devils">沙尘暴与尘卷风</h1>
  <div class="sub" data-zh="跃移是引擎:风把 0.1~0.2 mm 沙粒掀起 → 落地以 10° 低角反弹、溅起更多沙粒 → 撞碎的细尘(<60 µm)被湍流卷上千米高空 → 冷锋雷暴出流推出「黑风墙」haboob:墙高 1~2 km、绵延百公里 → 尘柱吸收太阳辐射加热自身、维持热低压环流——沙尘暴自我维持 → 尘卷风是热斑上的旋转烟囱 → PM10 暴涨伤肺 · 拖动旋转 / 空格运行/暂停" data-en="Saltation is the engine: wind lifts 0.1–0.2 mm sand grains → they land at ~10° and splash even more grains into the air → fines crushed below 60 µm ride turbulence kilometers up → a thunderstorm's cold pool shoves out a haboob: a wall 1–2 km high, 100 km long → the dust column absorbs sunlight, heats itself and keeps its own thermal low alive — a self-sustaining storm → dust devils are spinning chimneys over hot spots → PM10 explodes and lungs pay · drag to orbit / Space = run/pause">跃移是引擎:风把 0.1~0.2 mm 沙粒掀起 → 落地以 10° 低角反弹、溅起更多沙粒 → 撞碎的细尘(<60 µm)被湍流卷上千米高空 → 冷锋雷暴出流推出「黑风墙」haboob:墙高 1~2 km、绵延百公里 → 尘柱吸收太阳辐射加热自身、维持热低压环流——沙尘暴自我维持 → 尘卷风是热斑上的旋转烟囱 → PM10 暴涨伤肺 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="风速(10 m)" data-en="Wind @10 m">风速(10 m)</span><span class="v" id="stU">—</span>
  <span class="k" data-zh="输沙率" data-en="Sand flux">输沙率</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="沙尘顶高" data-en="Dust top">沙尘顶高</span><span class="v" id="stTop">—</span>
  <span class="k" data-zh="PM10" data-en="PM10">PM10</span><span class="v" id="stPM">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSalt" data-zh="跃移放大镜" data-en="Saltation scope">跃移放大镜</button>
    <button class="abtn" id="bWall" data-zh="冷锋尘墙" data-en="Haboob front">冷锋尘墙</button>
    <button class="abtn" id="bDevil" data-zh="尘卷风" data-en="Dust devil">尘卷风</button>
  </div>
  <div class="row">
    <label data-zh="风速" data-en="Wind speed">风速</label>
    <input id="sU" type="range" min="2" max="30" step="0.5" value="12">
    <span class="val" id="sUVal">12 m/s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="弹道轨迹" data-en="Trajectories">弹道轨迹</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../sand-dunes/" data-zh="沙丘" data-en="Sand Dunes">沙丘</a>
    <a href="../boundary-layer/" data-zh="大气边界层" data-en="Boundary Layer">大气边界层</a>
    <a href="../tornado/" data-zh="龙卷风" data-en="Tornado">龙卷风</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x141018,40,220);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.05,600);
camera.position.set(3.2,1.6,5.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=1.5;controls.maxDistance=90;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xf6dcae,0x2a2118,0.6));
const sun=new THREE.DirectionalLight(0xffe0b0,1.1);sun.position.set(18,26,10);scene.add(sun);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.22);fillL.position.set(-14,10,-10);scene.add(fillL);
const flashL=new THREE.PointLight(0xcfe0ff,0,120,1.6);flashL.position.set(0,26,-24);scene.add(flashL);

/* ── 荒漠地形:起伏沙丘 + 碎石 ── */
const sandM=new THREE.MeshStandardMaterial({color:0x7a5c30,roughness:1});
const terr=new THREE.Mesh(new THREE.PlaneGeometry(320,220,72,48),sandM);
{
  const pos=terr.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    pos.setZ(i,0.55*Math.sin(x*0.055)*Math.cos(y*0.06)+0.3*Math.sin(x*0.14+1.7)*Math.sin(y*0.11));
  }
  terr.geometry.computeVertexNormals();
}
terr.rotation.x=-Math.PI/2;scene.add(terr);
const rockM=new THREE.MeshStandardMaterial({color:0x4d4238,roughness:0.9});
for(let i=0;i<26;i++){
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(0.14+Math.random()*0.3,0),rockM);
  r.position.set((Math.random()-0.5)*60,0.12,(Math.random()-0.5)*40);
  r.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(r);
}
/* 太阳盘 */
const sunDisk=new THREE.Mesh(new THREE.CircleGeometry(5,24),
  new THREE.MeshBasicMaterial({color:0xffe9b8,fog:false,transparent:true,opacity:0.9}));
sunDisk.position.set(90,80,-140);sunDisk.lookAt(0,4,0);scene.add(sunDisk);

/* ── 尘墙 haboob:弧形半透明尘幕 + 顶部砧状云 ── */
const wallG=new THREE.Group();scene.add(wallG);
const wallMats=[];
for(let k=0;k<3;k++){
  const m=new THREE.MeshStandardMaterial({color:0xb98a4a,transparent:true,opacity:0.13,
    side:THREE.DoubleSide,depthWrite:false});
  const w=new THREE.Mesh(new THREE.CylinderGeometry(30-k*1.2,34-k*1.2,9+k*2.5,48,1,true,-0.65,1.3),m);
  w.position.y=(9+k*2.5)/2-1;wallG.add(w);wallMats.push(m);
}
const anvilM=new THREE.MeshStandardMaterial({color:0x3a3f4a,roughness:1,transparent:true,opacity:0.85});
for(let i=0;i<5;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(4+i,12,8),anvilM);
  c.position.set(-14+i*7,17+Math.sin(i*2.2)*1.5,-6-Math.abs(i-2)*3);
  c.scale.set(1.6,0.45,1.2);wallG.add(c);
}
wallG.visible=false;
/* 尘卷风柱体 */
const devG=new THREE.Group();scene.add(devG);
const devColM=new THREE.MeshStandardMaterial({color:0xc09858,transparent:true,opacity:0.16,
  side:THREE.DoubleSide,depthWrite:false});
const devCol=new THREE.Mesh(new THREE.CylinderGeometry(0.5,1.7,16,20,1,true),devColM);
devCol.position.y=8;devG.add(devCol);
devG.visible=false;

/* ── 粒子池:沙粒(近地弹跳)+ 尘埃(悬浮) ── */
const NS=300,ND=460;
const sandI=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.045,0),
  new THREE.MeshStandardMaterial({color:0xd8a95e,roughness:0.8}),NS);
const dustI=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.16,0),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9}),ND);
sandI.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
dustI.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(sandI);scene.add(dustI);
const dummy=new THREE.Object3D();
const colDust=new THREE.Color(0xd9b06a),colBg=new THREE.Color(0x141018),colTmp=new THREE.Color();
const sands=[];for(let i=0;i<NS;i++)sands.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,hero:false});
const dusts=[];for(let i=0;i<ND;i++)dusts.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,max:1,s:1});
/* 英雄沙粒:3 颗带弹道轨迹线 */
const TG_MAX=48;
const heroes=[];
for(let i=0;i<3;i++){
  const g=new THREE.Mesh(new THREE.IcosahedronGeometry(0.075,0),
    new THREE.MeshStandardMaterial({color:0xffcf7d,emissive:0xd9962e,emissiveIntensity:0.6}));
  scene.add(g);
  const tpos=new Float32Array(TG_MAX*3);
  const tgeo=new THREE.BufferGeometry();
  tgeo.setAttribute('position',new THREE.BufferAttribute(tpos,3));
  const trail=new THREE.Line(tgeo,new THREE.LineBasicMaterial({color:0xd9962e,transparent:true,opacity:0.65}));
  scene.add(trail);
  heroes.push({g,trail,tpos,n:0});
}

/* ── 状态与风沙物理 ── */
let mode='salt',u=12,playing=true,labelsOn=true,slowMo=false,trailsOn=true;
let simT=0,devTh=0,wallX=-42,flashT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const UT=6;                       /* 起动风速(10 m 高)≈ 6 m/s */
const G=9.81,SC=3.0;              /* 世界 1 单位 ≈ 0.35 m,视觉加速 SC */
const saltOn=()=>mode==='salt'&&u>UT;
function fluxQ(){                /* 输沙率 g/(m·s):Bagnold 型 (u-ut)^2.2 */
  if(mode==='devil')return 2;
  const q=2.2*Math.pow(Math.max(0,u-UT),2.2);
  return mode==='wall'?q*1.5:q;
}
function topH(){                  /* 沙尘顶高 m */
  if(mode==='wall')return clamp(800+45*(u-UT),600,2300);
  if(mode==='devil')return 350+22*u;
  return u>UT?clamp(20+9*(u-UT)*u*0.35,20,400):0;
}
function pm10(){
  if(mode==='wall')return 200+90*Math.pow(Math.max(0,u-UT),1.5);
  if(mode==='devil')return 150+35*Math.pow(Math.max(0,u-3),1.5);
  return u>UT?35+2*Math.pow(u-UT,1.5):35;
}

function spawnDust(x,y,z,spread,vy0,maxAge,s0){

const clock=new THREE.Clock();
let raf=null;
function launchGrain(p,x,z,hero){
  p.on=true;p.hero=!!hero;p.x=x;p.y=0.05;p.z=z;
  p.vx=(0.35+0.3*Math.random())*u*0.55;
  p.vy=(1.2+Math.random()*1.4)*SC*0.55;
  p.vz=(Math.random()-0.5)*u*0.2;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const slowF=slowMo?0.3:1;
  const dts=dt*(playing?1:0)*(mode==='salt'?slowF*0.55:slowF);
  simT+=dts;
  /* ── 跃移模式 ── */
  if(mode==='salt'){
    if(saltOn()){
      frame.emit=(frame.emit||0)+dts*u*1.6;
      while(frame.emit>1){frame.emit-=1;
        const p=sands.find(q=>!q.on&&!q.hero);
        if(!p)break;
        launchGrain(p,(Math.random()-0.5)*10,(Math.random()-0.5)*6,false);
      }
    }
    for(let si=0;si<NS;si++){
      const p=sands[si];
      if(!p.on){dummy.position.set(0,-99,0);dummy.scale.setScalar(0.001);dummy.updateMatrix();
        sandI.setMatrixAt(si,dummy.matrix);continue;}
      p.vy-=G*SC*dts;
      p.x+=p.vx*dts;p.y+=p.vy*dts;p.z+=p.vz*dts;
      if(p.y<=0.045){                       /* 撞击:溅射 */
        p.on=false;
        const n=p.hero?7:3;
        for(let k=0;k<n;k++){
          const q=sands.find(q=>!q.on&&!q.hero);
          if(!q)break;
          launchGrain(q,p.x+(Math.random()-0.5)*0.2,p.z+(Math.random()-0.5)*0.2,false);
          q.vy=(0.5+Math.random()*1.1)*SC*0.5;q.vx*=0.4;
        }
        if(Math.random()<0.8)spawnDust(p.x,0.1,p.z,0.5,0.8,2.2,0.5);
      }
      dummy.position.set(p.x,p.y,p.z);dummy.scale.setScalar(1);dummy.updateMatrix();
      sandI.setMatrixAt(si,dummy.matrix);
    }
    /* 英雄沙粒:受控弹跳 + 轨迹 */
    heroes.forEach((h,hi)=>{
      if(!h.g.visible)h.g.visible=true;
      if(h.n===0){
        h.x=(hi-1)*2.2;h.y=0.075;h.z=hi*0.4-0.4;h.vy=(1.6+hi*0.2)*SC*0.55;h.vx=u*0.5;
        h.tpos.fill(0);h.trail.visible=trailsOn;
      }
      h.vy-=G*SC*dts;
      h.x+=h.vx*dts;h.y+=h.vy*dts;
      if(h.y<=0.075){h.y=0.075;h.vy=(1.5+Math.random()*0.5)*SC*0.55;
        if(Math.random()<0.5)spawnDust(h.x,0.12,h.z,0.4,0.7,1.8,0.45);}
      h.g.position.set(h.x,h.y,h.z);
      if(h.n<TG_MAX){h.tpos.set([h.x,h.y,h.z],h.n*3);h.n++;}
      else{h.tpos.copyWithin(0,3);h.tpos.set([h.x,h.y,h.z],(TG_MAX-1)*3);}
      if(trailsOn){
        h.trail.visible=true;
        h.trail.geometry.attributes.position.needsUpdate=true;
        h.trail.geometry.setDrawRange(0,h.n);
      }else h.trail.visible=false;
      if(h.x>7){h.n=0;}
    });
    /* 贴地扬尘羽 */
    if(u>UT){
      frame.dz=(frame.dz||0)+dts*(2+u*0.5);
      if(frame.dz>1){frame.dz=0;
        spawnDust((Math.random()-0.5)*12,0.15,(Math.random()-0.5)*7,0.6,0.5+u*0.06,3.5,0.9);}
    }
  }
  /* ── 冷锋尘墙模式 ── */
  if(mode==='wall'){
    wallX+=dts*2.2;
    if(wallX>26)wallX=-48;
    wallG.position.x=wallX;
    wallMats.forEach((m,k)=>{m.opacity=0.10+0.05*Math.sin(simT*1.3+k);});
    flashT-=dts;
    if(flashT<=0&&Math.random()<0.01){flashT=0.28;}
    flashL.intensity=flashT>0?260*flashT/0.28:0;
    frame.wz=(frame.wz||0)+dts*u*4;
    while(frame.wz>1){frame.wz-=1;
      spawnDust(wallX+7+Math.random()*3,Math.random()*7,(Math.random()-0.5)*22,
        1.2,0.4+Math.random(),5+Math.random()*4,1.6+Math.random()*1.6);
    }
    for(let di=0;di<ND;di++){
      const p=dusts[di];
      if(!p.on){dummy.position.set(0,-99,0);dummy.scale.setScalar(0.001);dummy.updateMatrix();
        dustI.setMatrixAt(di,dummy.matrix);continue;}
      p.life+=dts;
      p.x+=(p.vx+Math.sin(simT*0.8+p.z)*0.3)*dts;
      p.y+=(p.vy+Math.sin(simT*1.1+p.x*0.4)*0.15)*dts;
      p.z+=p.vz*dts;
      if(p.life>p.max)p.on=false;
      const lf=clamp(1-p.life/p.max,0,1);
      dummy.position.set(p.x,p.y,p.z);
      dummy.scale.setScalar(p.s*(0.5+0.5*(1-lf))+0.001);
      dummy.updateMatrix();
      dustI.setMatrixAt(di,dummy.matrix);
      colTmp.copy(colDust).lerp(colBg,(1-lf)*0.75);
      dustI.setColorAt(di,colTmp);
    }
  }
  /* ── 尘卷风模式 ── */
  if(mode==='devil'){
    devTh+=dts;
    devG.rotation.y+=dts*(2.2+u*0.12);
    devCol.rotation.y-=dts*3.2;
    devColM.opacity=0.10+0.06*Math.sin(simT*2.1);
    frame.dvz=(frame.dvz||0)+dts*26;
    while(frame.dvz>1){frame.dvz-=1;
      const p=dusts.find(q=>!q.on);if(!p)break;
      const a=Math.random()*Math.PI*2,r=0.6+Math.random()*1.6;
      p.on=true;p.x=Math.cos(a)*r;p.z=Math.sin(a)*r;p.y=0.1;
      p.vx=0;p.vy=0;p.vz=0;p.life=0;p.max=4+Math.random()*3;p.s=0.5+Math.random()*0.7;
      p._a=a;p._r=r;
    }
    for(let di=0;di<ND;di++){
      const p=dusts[di];
      if(!p.on){dummy.position.set(0,-99,0);dummy.scale.setScalar(0.001);dummy.updateMatrix();
        dustI.setMatrixAt(di,dummy.matrix);continue;}
      p.life+=dts;
      const spin=(3.5+2.5/Math.max(0.4,p._r))*(0.6+u*0.04);
      p._a+=spin*dts;
      p._r+=(Math.random()-0.48)*dts*1.4;
      p._r=clamp(p._r,0.35,2.6);
      p.y+=dts*(1.6+2.2*Math.max(0,1-p._r/2.6));
      const wob=Math.sin(simT*0.7)*1.5;
      p.x=Math.cos(p._a)*p._r+wob;
      p.z=Math.sin(p._a)*p._r;
      if(p.life>p.max||p.y>16)p.on=false;
      const lf=clamp(1-p.life/p.max,0,1);
      dummy.position.set(p.x,p.y,p.z);
      dummy.scale.setScalar(p.s+0.001);dummy.updateMatrix();
      dustI.setMatrixAt(di,dummy.matrix);
      colTmp.copy(colDust).lerp(colBg,(1-lf)*0.7);
      dustI.setColorAt(di,colTmp);
    }
  }
  if(mode==='salt'){
    for(let i=0;i<ND;i++){
      const p=dusts[i];
      if(!p.on){dummy.position.set(0,-99,0);dummy.scale.setScalar(0.001);dummy.updateMatrix();}
      else{
        p.life+=dts;
        p.y+=Math.max(0.2,p.vy*(1+p.life))*dts;p.x+=p.vx*dts;
        if(p.life>p.max)p.on=false;
        const lf=clamp(1-p.life/p.max,0,1);
        dummy.position.set(p.x,p.y,p.z);
        dummy.scale.setScalar(p.s*(1+p.life*0.8)+0.001);dummy.updateMatrix();
        colTmp.copy(colDust).lerp(colBg,(1-lf)*0.8);
        dustI.setColorAt(i,colTmp);
      }
      dustI.setMatrixAt(i,dummy.matrix);
    }
  }
  sandI.instanceMatrix.needsUpdate=true;
  dustI.instanceMatrix.needsUpdate=true;
  if(dustI.instanceColor)dustI.instanceColor.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on;
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
