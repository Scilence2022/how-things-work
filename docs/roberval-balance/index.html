<style>

  #panelToggle { display: flex; align-items: center; justify-content: center;

    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>

  <div class="sub" data-zh="等臂天平怕偏载：砝码放偏 d，附加力矩 m·g·d 让横梁翘倾、读数漂移；罗伯瓦尔（1669）用两副平行四边形连杆把秤盘挂在主梁两端——平台被四铰点约束只能平移，偏载的水平分量化作前后连杆的拉压力偶直送主梁，对转轴的力臂恒等于臂长，与放哪儿无关——厨房秤两百年的秘密 · 拖动旋转 / 空格运行/暂停" data-en="An equal-arm balance hates off-center loads: offset d adds torque m·g·d and the beam tips; Roberval (1669) hung the pans on two parallelogram linkages — the platform can only translate, the offset's horizontal component becomes a pull-push couple fed straight into the beam pins, and the arm about the pivot always equals the beam length, wherever the weight sits — the secret of kitchen scales for 200 years · drag to orbit / Space = run/pause">等臂天平怕偏载：砝码放偏 d，附加力矩 m·g·d 让横梁翘倾、读数漂移；罗伯瓦尔（1669）用两副平行四边形连杆把秤盘挂在主梁两端——平台被四铰点约束只能平移，偏载的水平分量化作前后连杆的拉压力偶直送主梁，对转轴的力臂恒等于臂长，与放哪儿无关——厨房秤两百年的秘密 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,55);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-1.2,4.0,10.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.7,2.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 材质：铜棕主色，金属方条连杆 ---- */
const steelM=new THREE.MeshStandardMaterial({color:0x565b63,metalness:0.85,roughness:0.38});
const darkM=new THREE.MeshStandardMaterial({color:0x2c3037,metalness:0.7,roughness:0.5});
const copperM=new THREE.MeshStandardMaterial({color:0xc08040,metalness:0.9,roughness:0.32});
const brassM=new THREE.MeshStandardMaterial({color:0xd9a94f,metalness:0.95,roughness:0.28});
const baseM=new THREE.MeshStandardMaterial({color:0x3a3f47,metalness:0.6,roughness:0.55});
const ivoryM=new THREE.MeshStandardMaterial({color:0xe8e2d0,roughness:0.6});
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const arrM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.55,roughness:0.4});
const normM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.55,roughness:0.4});
const rodBlue=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.85});
const rodRed=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.85});

/* ---- 罗伯瓦尔天平（左，主角）
   尺度 1 单位 = 10 cm。梁半长 ARM=24.5cm，连杆高 15cm，前后铰点距 6.6cm */
const ROBX=-2.4,YPIV=3.42,ARM=2.45,HLINK=1.5,ZPIN=0.33,PLATY=1.92,PLATTOP=2.005;
const robG=new THREE.Group();robG.position.x=ROBX;scene.add(robG);
{
  const base=new THREE.Mesh(new THREE.BoxGeometry(2.7,0.22,1.7),baseM);base.position.y=0.11;robG.add(base);
  const trim=new THREE.Mesh(new THREE.BoxGeometry(2.74,0.03,1.74),copperM);trim.position.y=0.235;robG.add(trim);
  const col=new THREE.Mesh(new THREE.BoxGeometry(0.26,3.06,0.26),darkM);col.position.y=1.77;robG.add(col);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.06,0.44),steelM);cap.position.y=3.33;robG.add(cap);
  const pinG=new THREE.CylinderGeometry(0.055,0.055,0.72,14);pinG.rotateX(Math.PI/2);
  const pin=new THREE.Mesh(pinG,steelM);pin.position.y=YPIV;robG.add(pin);       // 中心刀口轴
  const plate=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.8,0.02),ivoryM);plate.position.set(0,2.95,0.155);robG.add(plate);
  for(let i=-3;i<=3;i++){                                                       // 分度刻线
    const t=new THREE.Mesh(new THREE.BoxGeometry(i===0?0.018:0.012,i===0?0.13:0.07,0.012),
      i===0?arrM:darkM);t.position.set(i*0.06,2.95,0.168);robG.add(t);
  }
}
/* 主梁组（绕中心 z 轴微倾）+ 指针 */
const beamR=new THREE.Group();beamR.position.y=YPIV;robG.add(beamR);
{
  const bar=new THREE.Mesh(new THREE.BoxGeometry(4.9,0.15,0.24),steelM);beamR.add(bar);
  const hubG=new THREE.CylinderGeometry(0.14,0.14,0.36,20);hubG.rotateX(Math.PI/2);
  beamR.add(new THREE.Mesh(hubG,brassM));
  const knob=new THREE.Mesh(new THREE.SphereGeometry(0.06,14,10),brassM);knob.position.y=0.14;beamR.add(knob);
  const endBL=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.13,0.78),steelM);endBL.position.x=-ARM;beamR.add(endBL);
  const endBR=endBL.clone();endBR.position.x=ARM;beamR.add(endBR);
  const ptr=new THREE.Mesh(new THREE.BoxGeometry(0.022,0.78,0.03),darkM);ptr.position.set(0,-0.39,0.19);beamR.add(ptr);
  const tip=new THREE.Mesh(new THREE.BoxGeometry(0.034,0.1,0.034),arrM);tip.position.set(0,-0.7,0.19);beamR.add(tip);
}
/* 平行四边形连杆副（每端一副：2 竖杆 + 下横杆 + 秤盘平台 + 下铰点） */
const linkGeo=new THREE.BoxGeometry(0.075,HLINK,0.15);
const barGeo=new THREE.BoxGeometry(0.15,0.11,0.8);
const platGeo=new THREE.CylinderGeometry(1.0,1.0,0.045,44);
const rimGeo=new THREE.TorusGeometry(0.97,0.03,10,56);rimGeo.rotateX(Math.PI/2);
const tickGeo=new THREE.BoxGeometry(0.06,0.012,0.07);
const pinGeo=new THREE.CylinderGeometry(0.05,0.05,0.1,14);pinGeo.rotateX(Math.PI/2);
function buildAsm(s){
  const g=new THREE.Group();
  for(const z of [ZPIN,-ZPIN]){
    const link=new THREE.Mesh(linkGeo,copperM);link.position.set(s*ARM,PLATY+HLINK/2,z);g.add(link);
    const pin=new THREE.Mesh(pinGeo,brassM);pin.position.set(s*ARM,PLATY,z);g.add(pin);

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    T+=dt;
    if(autoSweep)setOff(SWA*Math.sin(SWW*T+PHI0),true);
  }
  const dTarget=tiltOn?22*Math.sin(T*1.6):0;
  deltaM+=(dTarget-deltaM)*Math.min(1,dt*3.5);
  /* 罗伯瓦尔运动学：平行四边形 → 秤盘纯平移 */
  const thR=Math.atan(deltaM*24.5/3600);          // Δm 引起的梁倾角（偏载贡献=0）
  const thO=Math.atan(m*d/3600);                  // 普通天平：偏载力矩 m·g·d
  thRdeg=thR*180/Math.PI;thOdeg=thO*180/Math.PI;
  beamR.rotation.z=thR;beamO.rotation.z=thO;
  const dU=d/10,k=Math.cbrt(m/200);
  let txL=0,tyL=0,txR=0,tyR=0;
  for(const [s,tx,ty] of [[-1,(txL=-ARM*(1-Math.cos(thR))),(tyL=-ARM*Math.sin(thR))],[1,(txR=ARM*(1-Math.cos(thR))),(tyR=ARM*Math.sin(thR))]]){
    const g=s<0?asmL:asmR;g.position.set(tx,ty,0);
    for(const p of topPins)if(p.s===s)p.m.position.set(s*ARM*Math.cos(thR),YPIV+s*ARM*Math.sin(thR),p.z);
  }
  weightL.scale.set(k,k,k);weightL.position.set(-ARM-dU,PLATTOP,0);
  weightR.scale.set(k,k,k);weightR.position.set(ARM,PLATTOP,0);
  /* 普通天平：吊点随梁转，吊线保持竖直，秤盘平移 */
  const axL=CMPX-ARM2*Math.cos(thO),ayL=YPV2-ARM2*Math.sin(thO);
  const axR=CMPX+ARM2*Math.cos(thO),ayR=YPV2+ARM2*Math.sin(thO);
  panL.position.set(axL,ayL-HANG,0);panR.position.set(axR,ayR-HANG,0);
  setRodV(stringL,axL,ayL-0.06,panL.position.y+0.03);
  setRodV(stringR,axR,ayR-0.06,panR.position.y+0.03);
  weightOL.scale.set(k,k,k);weightOL.position.set(panL.position.x-dU,panL.position.y+0.02,0);
  /* 竖直作用线与力臂尺寸线 */
  rodGrav.visible=rodLink.visible=false;dimR.visible=dimO.visible=false;
  if(armOn){
    setRodV(rodGrav,ROBX-ARM-dU,PLATTOP+0.03,YPIV+0.5);
    setRodV(rodLink,ROBX-ARM+txL,PLATTOP+0.03,YPIV+0.5);
    setDim(dimR,ROBX-ARM+txL,ROBX,1.42);
    if(cmpOn)setDim(dimO,CMPX,CMPX-ARM2-dU,0.85);
  }
  /* 箭头：重力 / 铰链线传力 / 前后连杆拉压力偶 */
  arrW.visible=arrWO.visible=arrLink.visible=false;
  arrCF.visible=arrCB.visible=arrBF.visible=arrBB.visible=false;
  const len=0.35+0.5*(m/500);
  const wxL=ROBX-ARM-dU,topW=PLATTOP+0.32*k+0.14;
  setArrow(arrW,V(wxL,topW+len,0),V(wxL,topW,0));
  setArrow(arrWO,V(panL.position.x-dU,panL.position.y+0.02+0.32*k+0.14+len,0),V(panL.position.x-dU,panL.position.y+0.02+0.32*k+0.14,0));
  setArrow(arrLink,V(ROBX-ARM+txL,YPIV+tyL+0.2,0.5),V(ROBX-ARM+txL,YPIV+tyL+0.2+len,0.5));
  if(Math.abs(dU)>0.06){
    const sgn=Math.sign(dU),L2=0.25+0.45*Math.min(m*Math.abs(dU)/2000,1);
    const pxL=ROBX-ARM*Math.cos(thR),pyL=YPIV-ARM*Math.sin(thR);
    const bxL=ROBX-ARM+txL,byL=PLATY+tyL;
    setArrow(arrCF,V(pxL,pyL-0.26,ZPIN),V(pxL+sgn*L2,pyL-0.26,ZPIN));
    setArrow(arrCB,V(pxL,pyL-0.26,-ZPIN),V(pxL-sgn*L2,pyL-0.26,-ZPIN));
    setArrow(arrBF,V(bxL,byL-0.22,ZPIN),V(bxL-sgn*L2,byL-0.22,ZPIN));
    setArrow(arrBB,V(bxL,byL-0.22,-ZPIN),V(bxL+sgn*L2,byL-0.22,-ZPIN));
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：偏载扫描自动运行，普通天平指针摆动而罗伯瓦尔纹丝不动（招牌画面） ---- */
applyTheme();
setMass(200);setOff(4);
autoSweep=true;syncStepBtns();
setTgl('joints',true);setTgl('arm',true);setTgl('cmp',true);
document.getElementById('tglLabels').checked=labelsOn;
buildSteps();
updateStats();syncPlayBtn();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
