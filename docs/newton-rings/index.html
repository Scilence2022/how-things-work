<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛顿环 · 平凸透镜下的空气楔干涉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d4a017; /* 牛顿环主题色:钠光金黄 */
    --bg:#0f1216; --panel:rgba(13,17,23,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,23,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,23,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a3720f;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(255,205,112,.9); color: #ffe2ae; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(143,106,37,.9); color: #8a5f12; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(212,167,16,.9); color: #8a6d00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(11,122,90,.9); color: #0b7a5a; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(30,120,200,.9); color: #1864ab; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;

  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }

  :root[data-theme="light"] .chip.b { color:#1864ab; } :root[data-theme="light"] .chip.r { color:#c92a2a; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);

  .abtn.on { border-color: rgba(212,160,23,.65); background: rgba(212,160,23,.14); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.6); color: #ffa8a8; }

  :root[data-theme="light"] .abtn.hot { color:#c92a2a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }

  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #e8c470; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;

  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 96px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
    #title .sub { font-size: 11.5px; }
    .lbl { max-width: 42vw; white-space: normal; font-size: 10.5px; }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="牛顿环" data-en="Newton Rings">牛顿环</h1>
  <div class="sub" data-zh="把一块曲率半径 R≈1 m 的平凸透镜轻放在光学平板上,接触点周围的空气被挤成一枚薄楔:隙厚 d(r)≈r²/2R,r=1 mm 处约 0.5 µm、3 mm 处约 4.5 µm——只几个波长厚。单色光垂直入射,透镜下表面(玻璃→空气)反射不带相位跳变,平板上表面(空气→玻璃)反射多出 π 跳变(半波损失,光程多付 λ/2),两束反射光的光程差 Δ=2d+λ/2:d 每长 λ/2,反射就相消一次;等厚线是同心圆,干涉纹便是一圈圈同心环。接触点 d=0,Δ=λ/2 恰好相消——中心永远是暗斑,这是「光密界面反射带半波损失」最直接的实验证据;若没有这份 π,中心本该是亮点。暗环半径 r_k=√(kλR) 与 √k 成正比:钠光 589.3 nm、R=1 m 时 r₁≈0.77 mm、r₅≈1.72 mm、r₁₀≈2.43 mm,相邻环距由 0.32 mm 收窄到 0.12 mm——内疏外密,整个图样不足 5 mm,要靠显微镜放大。工程上把因果倒过来用:测两环直径平方差 D_m²−D_n²=4(m−n)λR,与中心接触好坏无关,可反解透镜曲率(千分之一量级,示意)或光波长;环纹走样还能查出 0.1 µm 级的表面不平。失效对照也漂亮:中心垫入尘埃隙 h,暗纹条件变 2(h+r²/2R)=kλ,环序整体内移,h=λ/4≈0.15 µm 时中心翻成亮斑;白光入射各色环套环,只有头几环显彩虹、往外糊成一片;按压不均则环变椭圆——平整度检测正是反着用这一点。拖「曲率半径 R / 波长 λ / 观察半径 r* / 尘埃隙 h」,按「空气楔剖面/中心暗斑/暗环族/测量应用/尘埃失准」走五个场景,按「关掉半波损失」看中心翻亮、按「白光」看彩虹环洗成一片。3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停
- 场景要点: 光学平台中央是平凸透镜压在玻璃平板上的装置,上方一束单色光垂直下照,接触点是那枚著名的暗斑;右侧立着空气楔放大剖面——上弯玻璃与下平玻璃之间隙厚随距离按 r² 增厚,楔内亮暗条纹沿程交替,观察针沿楔滑动,针处两束反射光上行、下表面反射点挂着红色 π 徽章;左侧是显微视场屏:大圆屏显示反射光暗环族(内疏外密、附 k 刻度),小圆屏显示透射互补图样;尘埃隙抬高时楔内出现棕色夹层、环序内移,白光模式下环纹由彩渐白。" data-en="Rest a plano-convex lens of curvature radius R ≈ 1 m on an optical plate and the air around the contact point is squeezed into a thin wedge: gap thickness d(r) ≈ r²/2R, about 0.5 µm at r = 1 mm and 4.5 µm at 3 mm - only a few wavelengths. Normally incident monochromatic light reflects off the lower lens surface (glass to air, no phase jump) and off the plate surface (air to glass, an extra π - the half-wave loss worth λ/2 of path), so the two reflected beams differ by Δ = 2d + λ/2: every time d grows by λ/2 the reflection cancels once; equal-thickness contours are circles, so the fringes are concentric rings. At the contact point d = 0 and Δ = λ/2 - exactly destructive - so the center is always a dark spot, the most direct experimental evidence of the half-wave loss at a denser interface; without that π the center would be bright. Dark radii follow r_k = √(kλR), proportional to √k: sodium 589.3 nm and R = 1 m give r1 ≈ 0.77 mm, r5 ≈ 1.72 mm, r10 ≈ 2.43 mm, and the spacing tightens from 0.32 mm to 0.12 mm - sparse inside, crowded outside, the whole pattern under 5 mm and visible only under a microscope. Engineering runs the chain backwards: the squared-diameter difference D_m² − D_n² = 4(m−n)λR is independent of contact quality, and yields the curvature radius (per-mille level, illustrative) or the wavelength; distorted rings betray 0.1 µm surface errors. Failure contrasts are pretty too: a dust gap h turns the condition into 2(h + r²/2R) = kλ, orders shift inward and at h = λ/4 ≈ 0.15 µm the center flips bright; white light nests ring families of every wavelength, leaving rainbow colors only in the first few orders before washing out; uneven pressure squashes rings into ellipses - flatness testing reads exactly that in reverse. Drag curvature R / wavelength λ / probe radius r* / dust gap h; walk the five scenes wedge profile / dark center / ring family / measurement / dust failure; press half-wave off to watch the center turn bright, white light to see the rainbow wash out. 3D interactive demo - drag to orbit / scroll to zoom - Space = play/pause
- 场景要点: On the optical table a plano-convex lens rests on a glass plate under a vertical monochrome beam, the famous dark spot at the contact point; to the right stands a magnified air-wedge section - gap thickening as r² between a curved and a flat glass, bright and dark bands alternating along it, a probe sliding with two reflected rays rising and a red π badge hanging at the plate reflection; on the left an eyepiece screen: the large disc shows the reflected dark-ring family (crowded outward, k ticks attached), the small disc the complementary transmitted pattern; a dust gap lifts in a brown film and shifts the orders, and in white-light mode the rings fade from rainbow to white."></div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip" style="color:#c9dcf2;border-color:rgba(140,180,230,.55)" data-zh="平凸透镜(球面朝下)" data-en="plano-convex lens">平凸透镜(球面朝下)</span>

    <span class="chip" style="color:#d8e4f0;border-color:rgba(170,190,215,.5)" data-zh="透射视场:亮暗互补" data-en="transmitted field">透射视场:亮暗互补</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btn-wedge" data-zh="空气楔剖面" data-en="wedge profile">空气楔剖面</button>
    <button class="abtn" id="btn-spot" data-zh="中心暗斑" data-en="dark center">中心暗斑</button>
    <button class="abtn" id="btn-rings" data-zh="暗环族" data-en="ring family">暗环族</button>
    <button class="abtn" id="btn-measure" data-zh="测量应用" data-en="measurement">测量应用</button>
    <button class="abtn hot" id="btn-dust" data-zh="尘埃失准" data-en="dust failure">尘埃失准</button>

  <div class="row"><label data-zh="曲率半径 R" data-en="radius R">曲率半径 R</label><input id="vA" type="range" min="0.5" max="2" step="0.05" value="1"><span class="val" id="vAVal"></span></div>
  <div class="row"><label data-zh="波长 λ" data-en="wavelength λ">波长 λ</label><input id="vB" type="range" min="400" max="700" step="1" value="589"><span class="val" id="vBVal"></span></div>

function patRGB(d) {
  if (white) {
    let R = 0, G = 0, B = 0;
    for (let i = 0; i < WHITE_WL.length; i++) {
      const p = TAU * d / (WHITE_WL[i] * 1e-9);
      const I = hw ? Math.sin(p) ** 2 : Math.cos(p) ** 2;
      R += WHITE_W[i] * I * WHITE_RGB[i][0];
      G += WHITE_W[i] * I * WHITE_RGB[i][1];
      B += WHITE_W[i] * I * WHITE_RGB[i][2];
    }
    return [R * 1.6, G * 1.6, B * 1.6];
  }
  const I = Iref(d);
  return [lamRGB[0] * I * 1.35, lamRGB[1] * I * 1.35, lamRGB[2] * I * 1.35];
}
function transRGB(d) {
  if (white) {
    let R = 0, G = 0, B = 0;
    for (let i = 0; i < WHITE_WL.length; i++) {
      const p = TAU * d / (WHITE_WL[i] * 1e-9);
      const It = hw ? Math.cos(p) ** 2 : Math.sin(p) ** 2;
      R += WHITE_W[i] * It * WHITE_RGB[i][0];
      G += WHITE_W[i] * It * WHITE_RGB[i][1];
      B += WHITE_W[i] * It * WHITE_RGB[i][2];
    }
    return [0.10 + R * 1.4, 0.10 + G * 1.4, 0.10 + B * 1.4];
  }
  const p = TAU * d / (lam * 1e-9);
  const It = hw ? Math.cos(p) ** 2 : Math.sin(p) ** 2;
  return [0.08 + lamRGB[0] * It * 1.3, 0.08 + lamRGB[1] * It * 1.3, 0.08 + lamRGB[2] * It * 1.3];
}
function drawPattern(img, ctx, cv, tex, itFn, radiusScale) {
  const px = img.data, N = cv.width, c0 = N / 2, sc = (N / 2 - 6) * radiusScale;
  px.fill(0);
  for (let j = 0; j < N; j++) {
    const y = (j - c0) / sc;
    for (let i = 0; i < N; i++) {
      const x = (i - c0) / sc;
      const r2 = x * x + y * y;
      const d = hUm * 1e-6 + r2 * 1e-6 / (2 * Rm);
      const [R, G, B] = itFn(d);
      const I = clamp(Math.max(R, G, B), 0, 1);
      const o = (j * N + i) * 4;
      px[o] = Math.min(255, R * 255);
      px[o + 1] = Math.min(255, G * 255);
      px[o + 2] = Math.min(255, B * 255);
      px[o + 3] = Math.round(255 * Math.pow(I, 0.75));
    }
  }
  ctx.putImageData(img, 0, 0);
  tex.needsUpdate = true;
}
function drawRingMarkers() {
  const c0 = TEX / 2, sc = (TEX / 2 - 6) / FOV_MM;
  ringCtx.lineWidth = 1.5;
  if (lastMeasureOn) {
    ringCtx.setLineDash([6, 5]);
    for (const [k, col, tag] of [[5, '#ffffff', 'm=5'], [2, '#8fd4ff', 'n=2']]) {
      const rr = rDarkMm(k) * sc;
      if (rr <= 0) continue;
      ringCtx.strokeStyle = col;
      ringCtx.beginPath(); ringCtx.arc(c0, c0, rr, 0, TAU); ringCtx.stroke();
      ringCtx.fillStyle = col;
      ringCtx.font = '15px sans-serif';
      ringCtx.fillText(tag, c0 + rr * 0.72 - 12, c0 - rr * 0.72 - 6);
    }
    ringCtx.setLineDash([]);
    return;
  }
  ringCtx.font = '13px sans-serif';
  ringCtx.textAlign = 'center';
  for (let k = 1; k <= 30; k++) {
    const rr = rDarkMm(k);
    if (rr >= FOV_MM || rr <= 0) continue;
    const px = c0 + rr * sc * 0.7071, py = c0 - rr * sc * 0.7071;
    ringCtx.fillStyle = 'rgba(255,255,255,.9)';
    ringCtx.strokeStyle = 'rgba(0,0,0,.8)';
    ringCtx.lineWidth = 3;
    ringCtx.strokeText(String(k), px, py);
    ringCtx.fillText(String(k), px, py);
  }
  ringCtx.textAlign = 'left';
}
function drawStripTex() {
  const px = stripImg.data, dMax = Math.max(dAt(FOV_MM), 1e-9);
  for (let i = 0; i < 256; i++) {
    const r = i / 255 * FOV_MM;
    const d = dAt(r);
    const [R, G, B] = patRGB(d);
    const I = clamp(Math.max(R, G, B), 0, 1);
    const top = clamp(d / dMax, 0.02, 1);
    for (let j = 0; j < 24; j++) {
      const yf = 1 - j / 24;
      const o = (j * 256 + i) * 4;
      if (yf <= top) {
        px[o] = Math.min(255, R * 255); px[o + 1] = Math.min(255, G * 255); px[o + 2] = Math.min(255, B * 255);
        px[o + 3] = Math.round(230 * Math.pow(I, 0.8));
      } else px[o + 3] = 0;
    }
  }
  stripCtx.putImageData(stripImg, 0, 0);
  stripTex.needsUpdate = true;
}
function regenTextures() {
  drawPattern(ringImg, ringCtx, ringCv, ringTex, patRGB, 1 / FOV_MM);

}

}

function scriptRStar(mode, t) {
  if (mode === 'center') return 0.12;
  if (mode === 'measure') { const c = t % 3.2; return c < 1.6 ? Math.max(rDarkMm(5), 0.3) : Math.max(rDarkMm(2), 0.2); }
  if (mode === 'dust') return 0.45;
  const c = t % 7;
  return 0.2 + 4.0 * (0.5 - 0.5 * Math.cos(TAU * c / 7));
}

    texDirty = true;
  }
}

    d: '暗纹条件 2d=kλ,代入 d≈r²/2R 得 r_k=√(kλR)——半径与 √k 成正比,不是与 k:钠光 589.3 nm、R=1 m 时 r₁≈0.77 mm、r₂≈1.09 mm、r₅≈1.72 mm、r₁₀≈2.43 mm。相邻环距 Δr≈r_k/(2√k) 随 k 收窄:第 1—2 环相距 0.32 mm,第 9—10 环只相距 0.12 mm——内疏外密;左侧显微视场里 k 刻度就贴在暗环上,示波器里沿半径的强度曲线越往外振荡越密。',
    de: 'Dark fringes satisfy 2d = kλ; with d ≈ r²/2R this gives r_k = √(kλR) - radii grow with √k, not k. For sodium 589.3 nm and R = 1 m: r1 ≈ 0.77 mm, r2 ≈ 1.09 mm, r5 ≈ 1.72 mm, r10 ≈ 2.43 mm. Spacing Δr ≈ r_k/2√k tightens outward: 0.32 mm between rings 1-2 but only 0.12 mm between 9-10 - sparse inside, crowded outside; the k ticks sit on the rings in the eyepiece view, and the scope trace oscillates ever faster outward.' },
  { b: '由环径反推 R、λ 与平整度', be: 'measuring R, λ and flatness', tgt: [-2.8, 1.7, 0.85], hl: 'strip',
    d: '中心接触质量难以控制,直接用 r_k 有系统误差;妙处在两环直径平方差 D_m²−D_n²=4(m−n)λR——尘埃与接触变形整项消掉。已知 λ(钠灯 589.3 nm)可反解曲率半径 R 到千分之一量级(示意);已知 R 可测光波长——这正是当年测钠双线间距的办法之一。环纹不圆、走样则说明表面不平或受力不均:0.1 µm 级起伏就能让环扭曲,平整度检测反着用这一点。「测量应用」场景在视场里画出 m=5 与 n=2 两个测量圆。',
    de: 'Contact quality is hard to control, so raw r_k carries systematic error; the trick is the squared-diameter difference D_m² − D_n² = 4(m−n)λR - dust and contact deformation cancel exactly. With known λ (sodium 589.3 nm) you recover R to the per-mille level (illustrative); with known R you measure the wavelength - historically how the sodium doublet spacing was found. Non-circular, warped rings betray surface errors or uneven pressure: bumps of 0.1 µm distort the rings, exactly what flatness testing reads in reverse. The measurement scene draws the m=5 and n=2 gauging circles.' },
  { b: '失效对照:尘埃、白光与受力', be: 'failure modes: dust, white light, pressure', tgt: [3.05, 0.62, 0.6], hl: 'dust',
    d: '中心垫进尘埃隙 h,暗纹条件变成 2(h+r²/2R)=kλ:环序整体内移、第 k 环半径缩成 √((kλ−2h)R),h=λ/4≈0.15 µm 时中心翻亮;测 D² 差正是为了免疫这种失准。白光入射:各波长的环套环,只在头几环显出彩虹条纹,往外重叠洗成一片白——所以牛顿环测量都用单色光。按压不均则环变椭圆、局部走样:平整度检测正是反着用这一点。「尘埃失准」场景把 h 设成 λ/4,看中心翻亮、头两环消失。',
    de: 'A dust gap h at the center changes the condition to 2(h + r²/2R) = kλ: orders shift inward, ring k shrinks to √((kλ−2h)R), and at h = λ/4 ≈ 0.15 µm the center turns bright; the D² difference exists precisely to be immune to this. With white light every wavelength brings its own ring family: rainbow colors only in the first few orders, washing to white farther out - hence monochrome light for Newton-ring work. Uneven pressure squashes rings into ellipses: flatness testers read exactly that. The dust scene sets h = λ/4 - watch the center flip bright and the first rings vanish.' },
];

/* ---------------- 公式 ---------------- */
function updateFormula() {
  const d = dAt(rstarCur);
  const rk = k => { const v = rDarkMm(k); return v > 0 && v < FOV_MM ? v.toFixed(2) : '—'; };
  el.formula.innerHTML =
    L(`<b>Δ = 2d + λ/2</b>(半波损失) · 隙厚 <b>d ≈ r²/2R + h</b> · 现观察点 <b>d=${(d * 1e6).toFixed(2)} µm</b>`,
      `<b>Δ = 2d + λ/2</b> (half-wave loss) - gap <b>d ≈ r²/2R + h</b> - probe <b>d=${(d * 1e6).toFixed(2)} µm</b>`) + '<br>' +
    (hw ? L(`<b>暗环 2d=kλ → r=√(kλR) ∝ √k</b> · 亮环 2d=(2k−1)λ/2 · 中心 d=0 → <b>恒暗</b>`,
            `<b>dark 2d=kλ → r=√(kλR) ∝ √k</b> - bright 2d=(2k−1)λ/2 - center d=0 → <b>always dark</b>`)
        : L(`<b>无半波损失:Δ=2d → 中心亮、暗亮环纹整体对调(对照)</b>`,
            `<b>no half-wave loss: Δ=2d → bright center, all rings swap (contrast)</b>`)) + '<br>' +
    L(`<b>λ=${lam.toFixed(1)} nm · R=${Rm.toFixed(2)} m · h=${hUm.toFixed(3)} µm</b> → r₁=<b>${rk(1)}</b> r₂=<b>${rk(2)}</b> r₅=<b>${rk(5)}</b> r₁₀=<b>${rk(10)}</b> mm · <b>Dₘ²−Dₙ²=4(m−n)λR</b>`,
      `<b>λ=${lam.toFixed(1)} nm · R=${Rm.toFixed(2)} m · h=${hUm.toFixed(3)} µm</b> → r1=<b>${rk(1)}</b> r2=<b>${rk(2)}</b> r5=<b>${rk(5)}</b> r10=<b>${rk(10)}</b> mm · <b>Dm²−Dn²=4(m−n)λR</b>`);
}

/* ---------------- 状态面板 ---------------- */
function updateSliderLabels() {
  el.elAVal.textContent = Rm.toFixed(2) + ' m';
  el.elBVal.textContent = lam.toFixed(0) + ' nm';
  el.elCVal.textContent = rstar.toFixed(2) + ' mm';
  el.elDVal.textContent = hUm.toFixed(3) + ' µm';
}
function updateStats() {
  const d = dAt(rstarCur), I = Iref(d);
  el.stA.innerHTML = (d * 1e6).toFixed(2) + '<small> µm</small>';
  el.stA.className = 'v';
  el.stB.innerHTML = Math.round(I * 100) + '<small> %</small>';
  el.stB.className = 'v' + (I > 0.88 ? ' ok' : I > 0.12 ? ' warn' : '');
  const r10 = rDarkMm(10);
  el.stC.innerHTML = r10 > 0 ? r10.toFixed(2) + '<small> mm</small>' : '—';
  el.stC.className = 'v ok';
  el.stD.innerHTML = ringCount() + '<small> 环</small>';
  el.stD.className = 'v';
}
function resetPage() {
  dustOn = false; savedH = null;
  Rm = 1; el.elA.value = 1;
  lam = 589.3; el.elB.value = 589;
  rstar = 1.5; el.elC.value = 1.5;
  hUm = 0; el.elD.value = 0;
  hw = true; document.getElementById('btnHw').classList.remove('on');
  white = false; document.getElementById('btnWhite').classList.remove('on');
  preset = null;
  for (const pid of PRESET_IDS) document.getElementById('btn-' + pid).classList.remove('on');
  autoScript = false; autoDemo = true;
  applyLambda();
  texDirty = true;
  applyViewMode();
  activateStep(0);
  tgtVec.set(0.3, 0.7, 0);
  updateSliderLabels(); updateStats(); updateFormula();
}

/* ---------------- UI 接线 ---------------- */
const el = {
  elA: document.getElementById('vA'), elAVal: document.getElementById('vAVal'),
  elB: document.getElementById('vB'), elBVal: document.getElementById('vBVal'),
  elC: document.getElementById('vC'), elCVal: document.getElementById('vCVal'),
  elD: document.getElementById('vD'), elDVal: document.getElementById('vDVal'),
  stA: document.getElementById('stA'), stB: document.getElementById('stB'),
  stC: document.getElementById('stC'), stD: document.getElementById('stD'),
  formula: document.getElementById('formula'),
};
el.elA.addEventListener('input', () => {
  Rm = +el.elA.value;
  if (dustOn) { hUm = lam * 1e-3 / 4; el.elD.value = hUm; }
  texDirty = true;
  updateSliderLabels(); updateStats();
});
el.elB.addEventListener('input', () => {
  lam = +el.elB.value;
  if (dustOn) { hUm = lam * 1e-3 / 4; el.elD.value = hUm; }

});
el.elC.addEventListener('input', () => {

});
el.elD.addEventListener('input', () => {
  hUm = +el.elD.value;
  if (dustOn) savedH = hUm;
  texDirty = true;
  updateSliderLabels(); updateStats();
});
for (const pid of PRESET_IDS) document.getElementById('btn-' + pid).addEventListener('click', () => setPreset(pid));
document.getElementById('btnHw').addEventListener('click', function () {
  hw = !hw;
  this.classList.toggle('on', !hw);
  texDirty = true;
  updateStats(); updateFormula();
});
document.getElementById('btnWhite').addEventListener('click', function () {
  white = !white;
  this.classList.toggle('on', white);
  applyLambda();
  texDirty = true;
  updateFormula();
});

/* ---------------- 主逻辑 ---------------- */
function pageFrame(et, simDt, dt) {
  etG = et;
  /* ---- 步骤切换:重启自动演示 + 尘埃联动 ---- */
  if (scenario !== lastScenario) {
    lastScenario = scenario;
    autoDemo = true;
    syncDust();
    updateSliderLabels(); updateStats();
  }
  if (autoDemo && !wasAutoDemo) demoT0 = et;
  wasAutoDemo = autoDemo;

  /* ---- 观察半径:预设脚本 / 步骤自动演示 / 滑杆 ---- */
  const mode = autoScript ? (PRESET_SCRIPT[preset] || 'sweep') : (autoDemo ? STEP_SCRIPT[scenario] : 'manual');
  const sT = autoScript ? (et - presetEt) : (et - demoT0);
  const rTgt = mode === 'manual' ? +el.elC.value : scriptRStar(mode, sT);
  if (mode === 'manual') rstarCur = rTgt;
  else rstarCur += (rTgt - rstarCur) * Math.min(1, simDt * 5 + (simDt > 0 ? 0.02 : 0));

  /* ---- 测量圆标记切换 ---- */
  const mOn = preset === 'measure' || scenario === 4;
  if (mOn !== lastMeasureOn) { lastMeasureOn = mOn; texDirty = true; }

  /* ---- 贴图重绘(节流) ---- */
  if (texDirty && et - lastTexT > 0.12) regenTextures();

  /* ---- 装置:光子雨 + 中心斑 ---- */
  for (let i = 0; i < NBeam; i++) {
    const ph = (et * 0.45 * beamSp[i] + beamPh[i]) % 1;
    beamPos[i * 3 + 1] = PLY + SAG + 0.16 + ph * 1.9;
  }
  beamGeo.attributes.position.needsUpdate = true;

  /* ---- 剖面:观察针 / 反射线 / 徽章 / 刻度 / 尘埃 ---- */
  const xw = clamp(rstarCur / FOV_MM, 0, 1) * WEDL;
  needle.position.x = xw;
  const yTop = wy(Math.min(xw, WEDL));
  const pa = rayA.geometry.attributes.position;
  pa.setXYZ(0, xw, yTop + 0.005, 0.3); pa.setXYZ(1, xw, 2.05, 0.3);
  pa.needsUpdate = true;
  const pb = rayB.geometry.attributes.position;
  pb.setXYZ(0, xw + 0.075, 0.21, 0.3); pb.setXYZ(1, xw + 0.075, 2.05, 0.3);
  pb.needsUpdate = true;
  const pc = rayIn.geometry.attributes.position;
  pc.setXYZ(0, xw, 1.75, 0.3); pc.setXYZ(1, xw, yTop + 0.14, 0.3);
  pc.needsUpdate = true;
  badge.position.set(xw + 0.075, 0.155, 0.3);
  const dProbe = dAt(rstarCur), iProbe = Iref(dProbe);
  M.badge.opacity = 0.55 + 0.45 * iProbe;
  for (let k = 0; k < 12; k++) {
    const kk = k + 1, rr = rDarkMm(kk);
    const vis = rr > 0.02 && rr < FOV_MM && kk * lam * 1e-9 > 2 * hUm * 1e-6;
    ticks[k].visible = vis;
    if (vis) ticks[k].position.x = rr / FOV_MM * WEDL;
  }
  dustL.visible = hUm > 0.005;
  dustL.scale.y = Math.max(0.5, hUm * 10);
  dustL.position.y = 0.20 + 0.006 * Math.max(0.5, hUm * 10);
  for (let i = 0; i < NWPhoton; i++) {
    const ph = (et * 0.7 * wpSp[i] + wpPh[i]) % 1;
    wpPos[i * 3] = xw + Math.sin(i * 2.7) * 0.05;
    wpPos[i * 3 + 1] = 1.9 - ph * 1.55;
    wpPos[i * 3 + 2] = 0.3 + Math.cos(i * 1.9) * 0.06;
  }
  wpGeo.attributes.position.needsUpdate = true;

  /* ---- 中心斑:暗斑常驻,半波损失关闭或尘埃 λ/4 时翻亮 ---- */
  M.centerDark.opacity = hw ? 0.85 * (1 - Iref(hUm * 1e-6)) : 0.1;
  M.centerGlow.opacity = white ? 0.8 * Itrans(hUm * 1e-6) : (hw ? 0 : 0.85 * Iref(hUm * 1e-6));

  /* ---- 标签显隐 ---- */
  lensLbl.o.visible = labelsOn;
  gapLbl.o.visible = labelsOn;
  plateLbl.o.visible = labelsOn;
  beamLbl.o.visible = labelsOn;
  screenLbl.o.visible = labelsOn;
  transLbl.o.visible = labelsOn;
  wedgeLbl.o.visible = labelsOn;
  piLbl.o.visible = labelsOn && hw;
  needleLbl.o.visible = labelsOn;
  contactLbl.o.visible = labelsOn;
  spotLbl.o.visible = labelsOn && (preset === 'spot' || scenario === 2);
  dustLbl.o.visible = labelsOn && hUm > 0.02;
}

/* ---------------- 装配 ---------------- */
applyViewMode();
applyLambda();
updateSliderLabels();
updateStats();
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0, et = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const simDt = playing ? dt * speed : 0;
  pageFrame(et, simDt, dt);
  const hlm = HL[STEPS[scenario].hl];
  if (hlm) hlm.opacity = hlm.userData.ob * (0.6 + 0.4 * (0.5 + 0.5 * Math.sin(et * 5)));
  camV.copy(tgtVec);
  controls.target.lerp(camV, 0.04);
  for (const r of labelReg) {
    if (r.follow) r.follow(r.o.position);
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked && typeof drawScope === 'function') drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 示波器:沿半径的反射/透射强度剖面 ---------------- */
function drawScope() {
  const w = scope.width, h = scope.height, dpr = Math.min(devicePixelRatio, 2);
  scopeCtx.clearRect(0, 0, w, h);
  scopeCtx.strokeStyle = 'rgba(127,140,160,.4)';
  scopeCtx.lineWidth = 1;
  scopeCtx.strokeRect(4, 4, w - 8, h - 8);
  const base = h * 0.88, amp = h * 0.72;
  const X = rmm => 4 + rmm / FOV_MM * (w - 8);
  /* 反射强度 I(r)(主色) */
  const col = lamRGB.map(c => Math.round(c * 255));
  scopeCtx.strokeStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
  scopeCtx.lineWidth = Math.max(1.3, 1.3 * dpr);
  scopeCtx.beginPath();
  for (let i = 0; i <= 220; i++) {
    const r = i / 220 * FOV_MM;
    const y = base - Iref(dAt(r)) * amp;
    const x = X(r);
    i === 0 ? scopeCtx.moveTo(x, y) : scopeCtx.lineTo(x, y);
  }
  scopeCtx.stroke();
  /* 透射互补(虚线灰) */
  scopeCtx.setLineDash([4 * dpr, 3 * dpr]);
  scopeCtx.strokeStyle = 'rgba(160,170,190,.6)';
  scopeCtx.lineWidth = 1;
  scopeCtx.beginPath();
  for (let i = 0; i <= 110; i++) {
    const r = i / 110 * FOV_MM;
    const y = base - Itrans(dAt(r)) * amp;
    i === 0 ? scopeCtx.moveTo(X(r), y) : scopeCtx.lineTo(X(r), y);
  }
  scopeCtx.stroke();
  scopeCtx.setLineDash([]);
  /* 暗环位置点 + k 标注 */
  scopeCtx.fillStyle = 'rgba(255,255,255,.85)';
  scopeCtx.font = `${9 * dpr}px sans-serif`;
  for (let k = 1; k <= 30; k++) {
    const rr = rDarkMm(k);
    if (rr <= 0 || rr >= FOV_MM) continue;
    scopeCtx.beginPath(); scopeCtx.arc(X(rr), base - 1, 2.2 * dpr, 0, TAU); scopeCtx.fill();
    if (k <= 12) scopeCtx.fillText(String(k), X(rr) - 3 * dpr, h - 4 * dpr);
  }
  /* 观察半径游标 */
  const xc = X(clamp(rstarCur, 0, FOV_MM));
  scopeCtx.strokeStyle = scopeDark ? 'rgba(255,255,255,.5)' : 'rgba(22,32,44,.5)';
  scopeCtx.beginPath(); scopeCtx.moveTo(xc, 4); scopeCtx.lineTo(xc, h - 4); scopeCtx.stroke();
  scopeCtx.fillStyle = scopeDark ? 'rgba(242,245,249,.85)' : 'rgba(22,32,44,.85)';
  scopeCtx.font = `${10 * dpr}px sans-serif`;
  scopeCtx.fillText(L('反射强度 I(r) 实线 · 透射虚线 · 白点=暗环 k', 'reflected I(r) solid · transmitted dashed · dots = dark rings k'), 8, 14 * dpr);
}

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
el.elA.value = Rm; el.elB.value = lam; el.elC.value = rstar; el.elD.value = hUm;
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setPlayLabel();
tglCurve.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
