<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>玻色–爱因斯坦凝聚 · 把一锅原子冻成一个波</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#74c0fc;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="玻色–爱因斯坦凝聚 · 把一锅原子冻成一个波" data-en="Bose–Einstein Condensate · cooling atoms into one wave">玻色–爱因斯坦凝聚 · 把一锅原子冻成一个波</h1>
  <div class="sub" data-zh="温度越低,热德布罗意波长 λ_dB=h/√(2πmkT) 越长;降到临界温度 T_c∝n^(2/3)(87Rb 磁阱约 170 nK)以下,大批玻色子挤进同一个基态——速度分布从宽馒头峰里长出中央尖峰;关阱释放,云按物质波自由膨胀(TOF 成像) · 拖动旋转 / 空格运行/暂停" data-en="Cooling stretches the thermal de Broglie wavelength λ_dB=h/√(2πmkT); below the critical temperature T_c∝n^(2/3) (~170 nK for 87Rb in a magnetic trap) bosons pile into one ground state — a sharp central spike grows out of the broad Maxwell mound; release the trap and the cloud expands as a matter wave (TOF imaging) · drag to orbit / Space = run/pause">温度越低,热德布罗意波长 λ_dB=h/√(2πmkT) 越长;降到临界温度 T_c∝n^(2/3)(87Rb 磁阱约 170 nK)以下,大批玻色子挤进同一个基态——速度分布从宽馒头峰里长出中央尖峰;关阱释放,云按物质波自由膨胀(TOF 成像) · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="凝聚分数" data-en="Condensate">凝聚分数</span><span class="v" id="stFc">—</span>
  <span class="k" data-zh="λ_dB" data-en="λ_dB">λ_dB</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="阱内原子数" data-en="Atoms">阱内原子数</span><span class="v" id="stNat">—</span>
</div>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bLaser" data-zh="激光预冷" data-en="Laser pre-cool">激光预冷</button>
    <button class="abtn" id="bEvap" data-zh="蒸发冷却" data-en="Evaporative cool">蒸发冷却</button>
    <button class="abtn" id="bTof" data-zh="TOF 成像" data-en="TOF imaging">TOF 成像</button>
  </div>
  <div class="row">
    <label data-zh="温度(对数)" data-en="T (log)">温度(对数)</label>
    <input id="sT" type="range" min="0" max="100" step="0.5" value="0">
    <span class="val" id="sTVal">300 K</span>
  </div>
  <div class="row">
    <label data-zh="原子数 ×10⁵" data-en="Atoms ×10⁵">原子数 ×10⁵</label>
    <input id="sN" type="range" min="0.5" max="4" step="0.1" value="2">
    <span class="val" id="sNVal">2.0</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglColor" type="checkbox" checked> <span data-zh="按速度着色" data-en="Color by speed">按速度着色</span></label>
      <label><input id="tglRelease" type="checkbox"> <span data-zh="关阱释放" data-en="Release trap">关阱释放</span></label>
    </div>
    <div class="row" style="margin-top:0">
      <label data-zh="速度" data-en="Speed">速度</label>
      <input id="sSpeed" type="range" min="0.3" max="2.5" step="0.1" value="1">
      <span class="val" id="sSpeedVal">1.0×</span>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../matter-waves/" data-zh="物质波" data-en="Matter waves">物质波</a>
    <a href="../quantum-superposition/" data-zh="量子叠加" data-en="Superposition">量子叠加</a>
    <a href="../kinetic-theory/" data-zh="分子动理论" data-en="Kinetic theory">分子动理论</a>
    <a href="../laser/" data-zh="激光" data-en="Laser">激光</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const qf=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,55);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(0.4,3.4,8.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.3,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.1);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);

/* ---- 场景:真空腔 + 磁阱线圈 + 原子云 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const table=new THREE.Mesh(new THREE.BoxGeometry(11,0.3,5.4),groundM);
table.position.set(0.3,-0.15,0);scene.add(table);
const TC=new THREE.Vector3(-2.3,1.7,0);           // 阱中心
const coilM=new THREE.MeshStandardMaterial({color:0xffc078,metalness:0.7,roughness:0.35,emissive:0xe8590c,emissiveIntensity:0.6});
for(const dy of[-0.95,0.95]){
  const c=new THREE.Mesh(new THREE.TorusGeometry(1.0,0.09,10,36),coilM);
  c.rotation.x=Math.PI/2;c.position.set(TC.x,TC.y+dy,TC.z);scene.add(c);
}
/* 原子(InstancedMesh) */
const NA=260;
const cloudM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,10,8),
  new THREE.MeshBasicMaterial({color:0xffffff}),NA);
cloudM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NA*3),3);
scene.add(cloudM);
const atoms=[];
for(let i=0;i<NA;i++){
  const d=new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1);
  if(d.lengthSq()<1e-4)d.set(1,0,0);
  d.normalize();
  atoms.push({dir:d,rf:Math.pow(Math.random(),0.7),sp:Math.random(),ph:Math.random()*6.28});
}
/* 逃逸原子(蒸发冷却:最快的原子飞出) */
const NE=24;
const escM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),
  new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.9}),NE);
scene.add(escM);
const escs=[];for(let i=0;i<NE;i++)escs.push({p:new THREE.Vector3(),v:new THREE.Vector3(),life:0});
/* 激光冷却光束 */
const beamM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.3});
const beam1=new THREE.Mesh(new THREE.BoxGeometry(4.8,0.05,0.05),beamM);
beam1.position.copy(TC);beam1.visible=false;scene.add(beam1);
const beam2=beam1.clone();beam2.rotation.y=Math.PI/2;scene.add(beam2);
/* 三维速度分布曲面 */
const plotG=new THREE.Group();plotG.position.set(2.75,0.5,0);scene.add(plotG);
const board=new THREE.Mesh(new THREE.BoxGeometry(3.05,0.07,3.05),
  new THREE.MeshStandardMaterial({color:0x14181d,roughness:0.8,transparent:true,opacity:0.92}));
plotG.add(board);
const PG=40;
const plotGeo=new THREE.PlaneGeometry(2.7,2.7,PG,PG);
plotGeo.rotateX(-Math.PI/2);
plotGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array((PG+1)*(PG+1)*3),3));
const plotMesh=new THREE.Mesh(plotGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.95,side:THREE.DoubleSide}));
plotMesh.position.y=0.04;plotG.add(plotMesh);
const plotWire=new THREE.Mesh(plotGeo,new THREE.MeshBasicMaterial({wireframe:true,color:0x74c0fc,transparent:true,opacity:0.16}));
plotWire.position.y=0.045;plotG.add(plotWire);

/* ---- 物理状态 ---- */
let playing=true,labelsOn=true,simT=0;
let speed=clamp(qf('speed',1),0.3,2.5);
if(qs.get('pause')==='1')playing=false;
let T=300,nU=2;                    // 温度 K;原子数(×1e5)
let laser=false,released=false,evaporating=false,expT=0,escAcc=0;
const TC0=170e-9;                  // 87Rb 磁阱基准临界温度
function Tc(){return TC0*Math.pow(nU/2,2/3);}
function fc(){return T<Tc()?1-Math.pow(T/Tc(),1.5):0;}
function lamDb(){return 6.626e-34/Math.sqrt(2*Math.PI*1.443e-25*1.381e-23*T);}
function fmtT(x){
  if(x>=1)return x.toFixed(x>=100?0:1)+' K';
  if(x>=1e-3)return (x*1e3).toFixed(1)+' mK';
  if(x>=1e-6)return (x*1e6).toFixed(1)+' µK';
  return (x*1e9).toFixed(0)+' nK';
}
const LG=Math.log10(1e-7/300);
function sOfT(t){return clamp(100*Math.log10(t/300)/LG,0,100);}
function TOfS(s){return 300*Math.pow(10,LG*s/100);}


/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('磁阱线圈:形成囚禁原子的势阱','Magnetic coils: the atom trap'),new THREE.Vector3(-2.3,3.4,0),'b');
addLabel(()=>L('激光冷却:光子迎头撞,原子减速','Laser cooling: head-on photons slow the atoms'),new THREE.Vector3(-4.9,2.5,0),'r',()=>laser);
addLabel(()=>L('凝聚体:千万个原子共用一个波函数','The condensate: millions of atoms, one wavefunction'),new THREE.Vector3(-0.9,2.75,0.4),'g',()=>fc()>0.05);
addLabel(()=>L('热云:红=快,蓝=慢','Thermal cloud: red = fast, blue = slow'),new THREE.Vector3(-2.3,0.55,0),'o');
addLabel(()=>L('三维速度分布:宽峰=热云,中央尖峰=凝聚体','3D velocity distribution: mound = thermal, spike = condensate'),new THREE.Vector3(2.75,2.35,0),'y');
addLabel(()=>L('T_c ∝ n^(2/3) ≈ '+(Tc()*1e9).toFixed(0)+' nK','T_c ∝ n^(2/3) ≈ '+(Tc()*1e9).toFixed(0)+' nK'),new THREE.Vector3(2.75,0.8,1.75),'o');

/* ---- UI 元素 ---- */
const elT=document.getElementById('sT'),elTVal=document.getElementById('sTVal');
const elN=document.getElementById('sN'),elNVal=document.getElementById('sNVal');
const elSpeed=document.getElementById('sSpeed'),elSpeedVal=document.getElementById('sSpeedVal');
const tglLabelsEl=document.getElementById('tglLabels');
const tglColorEl=document.getElementById('tglColor');
const tglReleaseEl=document.getElementById('tglRelease');
const btnLaser=document.getElementById('bLaser'),btnEvap=document.getElementById('bEvap'),btnTof=document.getElementById('bTof');
const stT=document.getElementById('stT'),stFc=document.getElementById('stFc'),
  stLam=document.getElementById('stLam'),stNat=document.getElementById('stNat');
function setS(s){T=TOfS(s);elT.value=s;elTVal.textContent=fmtT(T);}
function setN(v){nU=v;elN.value=v;elNVal.textContent=v.toFixed(1);}
function setSpeed(v){speed=v;elSpeed.value=v;elSpeedVal.textContent=v.toFixed(1)+'×';}
function setLaser(b){laser=b;beam1.visible=beam2.visible=b;}
function setRelease(b){released=b;tglReleaseEl.checked=b;}
function startEvap(){evaporating=true;setRelease(false);btnEvap.classList.add('on');}
function stopEvap(){evaporating=false;btnEvap.classList.remove('on');}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'室温:原子以几百 m/s 乱飞,λ_dB≈0.01 nm',en:'Room temperature: atoms at hundreds of m/s, λ_dB ≈ 0.01 nm',
  act:()=>{setS(0);setN(2);stopEvap();setLaser(false);setRelease(false);}},
 {zh:'激光冷却:迎头光子把原子降到 µK 级',en:'Laser cooling: head-on photons chill atoms to the µK range',
  act:()=>{setS(66);setLaser(true);stopEvap();setRelease(false);}},
 {zh:'磁阱+蒸发冷却:最快的原子逃走带走能量',en:'Magnetic trap + evaporation: the fastest atoms escape, carrying energy away',
  act:()=>{setS(86);setLaser(false);startEvap();}},
 {zh:'跨过临界温度 T_c(87Rb 磁阱约 170 nK):基态人数暴涨',en:'Cross T_c (~170 nK for 87Rb): the ground state fills abruptly',
  act:()=>{stopEvap();setLaser(false);setS(sOfT(Tc()*0.55));}},
 {zh:'速度分布长出中央尖峰:凝聚分数读数跳升',en:'A sharp central spike grows in the velocity distribution',
  act:()=>{stopEvap();setS(sOfT(Tc()*0.3));}},
 {zh:'关阱释放:云按物质波自由膨胀(TOF 成像)',en:'Release the trap: the cloud expands as a matter wave (TOF imaging)',
  act:()=>{stopEvap();setS(sOfT(Tc()*0.45));setRelease(true);}}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  stT.textContent=fmtT(T);
  const f=fc();
  stFc.innerHTML=(f*100).toFixed(0)+'<small> %</small>';
  stFc.className='v'+(f>0.01?' ok':'');
  const ln=lamDb()*1e9;
  stLam.innerHTML=(ln>=100?ln.toFixed(0):ln>=1?ln.toFixed(2):ln.toFixed(3))+'<small> nm</small>';
  stNat.innerHTML=nU.toFixed(1)+'<small> ×10⁵</small>';
}

/* ---- 事件 ---- */
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function mark(btn){[btnLaser,btnEvap,btnTof].forEach(b=>b.classList.toggle('on',b===btn));}
btnLaser.addEventListener('click',()=>{setS(66);setLaser(true);stopEvap();setRelease(false);mark(btnLaser);});
btnEvap.addEventListener('click',()=>{setS(86);setLaser(false);startEvap();mark(btnEvap);});
btnTof.addEventListener('click',()=>{stopEvap();setLaser(false);setS(sOfT(Tc()*0.45));setRelease(true);mark(btnTof);});
elT.addEventListener('input',e=>{stopEvap();setS(+e.target.value);});
elN.addEventListener('input',e=>setN(+e.target.value));
elSpeed.addEventListener('input',e=>setSpeed(+e.target.value));
tglReleaseEl.addEventListener('change',e=>setRelease(e.target.checked));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
tglLabelsEl.addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  board.material.color.setHex(dark?0x14181d:0x242a31);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=LANG==='en'?'Bose–Einstein Condensate · atoms into one wave':'玻色–爱因斯坦凝聚 · 把一锅原子冻成一个波';
  buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
const m4=new THREE.Matrix4(),cTmp=new THREE.Color();
const cCold=new THREE.Color(0x4dabf7),cMid=new THREE.Color(0xffd43b),cHot=new THREE.Color(0xff6b6b),
  cCon=new THREE.Color(0x99e9f2),cLo=new THREE.Color(0x1e3a5f),cHi=new THREE.Color(0xffe066);
function cloudRv(){return 0.14+0.8*Math.pow(sOfT(T)/100,1.3);}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speed;
  const sdt=playing?dts:0;
  simT+=sdt;
  const sCur=sOfT(T);
  /* 蒸发冷却:温度指数下降,原子数减少,快原子飞出 */
  if(evaporating&&sdt>0){
    T=Math.max(T*Math.exp(-sdt*0.55),Tc()*0.45);
    nU=Math.max(0.6,nU*Math.exp(-sdt*0.22));
    elT.value=sOfT(T);elTVal.textContent=fmtT(T);
    elN.value=nU;elNVal.textContent=nU.toFixed(1);
    if(T<=Tc()*0.45*1.001){evaporating=false;btnEvap.classList.remove('on');}
    escAcc+=sdt;
    while(escAcc>0.09){
      escAcc-=0.09;
      const e=escs.find(x=>x.life<=0);
      if(e){
        const a=atoms[(Math.random()*NA)|0];
        e.p.copy(TC).addScaledVector(a.dir,cloudRv());
        e.v.copy(a.dir).multiplyScalar(1.1+Math.random()*0.9);e.v.y+=0.25;
        e.life=1.2;
      }
    }
  }
  expT=released?Math.min(2.2,expT+sdt*0.55):Math.max(0,expT-sdt*1.6);
  coilM.emissiveIntensity+=(((released||evaporating===false&&T<Tc())?0.35:0.85)-coilM.emissiveIntensity)*Math.min(1,dt*4);
  /* 原子云:凝聚核 + 热云 */
  const nCon=Math.round(fc()*NA);
  const cr=0.1+0.6*expT;
  const thR=cloudRv()*(1+0.55*expT);
  for(let i=0;i<NA;i++){
    const a=atoms[i],con=i<nCon;
    const R=con?cr:thR*(0.25+0.75*a.rf);
    const j=con?0.012:(0.015+0.06*a.sp)*(0.15+sCur/100);
    m4.makeScale(1,1,1);
    m4.setPosition(TC.x+a.dir.x*R+Math.sin(simT*(1.5+a.sp*2.5)+a.ph)*j,
                   TC.y+a.dir.y*R+Math.cos(simT*(1.7+a.sp*2.2)+a.ph)*j,
                   TC.z+a.dir.z*R+Math.sin(simT*(1.3+a.sp*2.8)+a.ph*1.3)*j);
    cloudM.setMatrixAt(i,m4);
    if(con)cTmp.copy(cCon);
    else if(a.sp<0.5)cTmp.lerpColors(cCold,cMid,a.sp*2);
    else cTmp.lerpColors(cMid,cHot,(a.sp-0.5)*2);
    cloudM.setColorAt(i,(tglColorEl.checked||con)?cTmp:cMid);
  }
  cloudM.instanceMatrix.needsUpdate=true;
  if(cloudM.instanceColor)cloudM.instanceColor.needsUpdate=true;
  /* 逃逸原子 */
  for(let i=0;i<NE;i++){
    const e=escs[i];
    if(e.life>0){
      e.life-=sdt;e.p.addScaledVector(e.v,sdt);
      const s=clamp(e.life/1.2,0,1);
      m4.makeScale(s,s,s);m4.setPosition(e.p);
    }else{m4.makeScale(0,0,0);m4.setPosition(0,-10,0);}
    escM.setMatrixAt(i,m4);
  }
  escM.instanceMatrix.needsUpdate=true;
  /* 速度分布曲面:宽麦克斯韦峰 + 中央凝聚尖峰 */
  const f=fc();
  const sTh=0.35+0.8*Math.pow(sCur/100,1.2);
  const ATh=0.62*(1-f),AC=1.2*f,sC=0.13+0.5*expT;
  const pA=plotGeo.attributes.position,cA=plotGeo.attributes.color;
  for(let i=0;i<pA.count;i++){
    const x=pA.getX(i),z=pA.getZ(i),r2=x*x+z*z;
    const h=0.05+ATh*Math.exp(-r2/(2*sTh*sTh))+AC*Math.exp(-r2/(2*sC*sC));
    pA.setY(i,h);
    const hn=clamp((h-0.05)/1.15,0,1);
    if(hn<0.5)cTmp.lerpColors(cLo,cMid,hn*2);else cTmp.lerpColors(cMid,cHi,(hn-0.5)*2);
    cA.setXYZ(i,cTmp.r,cTmp.g,cTmp.b);
  }
  pA.needsUpdate=true;cA.needsUpdate=true;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
let phaseIdx=1;
{const t0=parseInt(qs.get('t'),10);if(Number.isFinite(t0)&&t0>=0&&t0<STEPS.length)phaseIdx=t0;}
labelsOn=!(qs.get('labels')==='0');
tglLabelsEl.checked=labelsOn;
setSpeed(speed);
applyTheme();applyLang();
setS(0);setN(2);
applyPhase(phaseIdx);
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
