<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>避雷针与上行先导 · 梯级下探与接闪之争</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#7d9bff;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#3451c8;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(125,155,255,.6);background:rgba(125,155,255,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(52,81,200,.55);background:rgba(52,81,200,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(125,155,255,.10);border-color:rgba(125,155,255,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(52,81,200,.08);border-color:rgba(52,81,200,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#dbe3ff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="避雷针与上行先导" data-en="Lightning Rods &amp; Upward Leaders">避雷针与上行先导</h1>
  <div class="sub" data-zh="雷暴云底的负电荷在地面感应出正电荷;下行先导每级约 50 m、间歇约 50 µs 地梯级下探,接近地面时,尖端(曲率半径小)场强率先突破阈值→电晕→上行先导迎击——避雷针不「吸雷」,而是把接闪点抢到自己头上;接闪后电流沿引下线-接地网低阻抗泄放,滚球法:球面滚不到的地方才受保护,整栋楼对内部而言是一枚法拉第笼 · 拖动旋转 / 空格运行/暂停" data-en="Negative charge at the cloud base induces positive charge below; the stepped leader gropes down in ~50 m steps some 50 µs apart, and as it nears, the field at sharp tips (small radius of curvature) crosses threshold first — corona, then an upward leader rises to meet it; a rod does not attract lightning, it wins the attachment point; the current drains through down-conductor and ground grid, the rolling sphere sweeps the protected zone, and the building is a Faraday cage to everything inside · drag to orbit / Space = run/pause">雷暴云底的负电荷在地面感应出正电荷;下行先导每级约 50 m、间歇约 50 µs 地梯级下探,接近地面时,尖端(曲率半径小)场强率先突破阈值→电晕→上行先导迎击——避雷针不「吸雷」,而是把接闪点抢到自己头上;接闪后电流沿引下线-接地网低阻抗泄放,滚球法:球面滚不到的地方才受保护,整栋楼对内部而言是一枚法拉第笼 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="尖端场强" data-en="Tip field">尖端场强</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="击距" data-en="Strike distance">击距</span><span class="v" id="stRs">—</span>
  <span class="k" data-zh="引下线电流" data-en="Conductor I">引下线电流</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="保护半径" data-en="Protected radius">保护半径</span><span class="v" id="stRr">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRod" data-zh="有针" data-en="With rod">有针</button>
    <button class="abtn" id="bNo" data-zh="无针" data-en="No rod">无针</button>
  </div>
  <div class="row">
    <label data-zh="云电荷量" data-en="Cloud charge">云电荷量</label>
    <input id="sQ" type="range" min="20" max="100" step="5" value="65">
    <span class="val" id="sQVal">65 %</span>
  </div>
  <div class="row">
    <label data-zh="针高" data-en="Rod height">针高</label>
    <input id="sRod" type="range" min="0.5" max="2.4" step="0.05" value="1.2">
    <span class="val" id="sRodVal">6.0 m</span>
  </div>
  <div class="row">
    <label data-zh="接地电阻" data-en="Ground R">接地电阻</label>
    <input id="sGR" type="range" min="0.5" max="30" step="0.5" value="2">
    <span class="val" id="sGRVal">2.0 Ω</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="场强着色" data-en="Field coloring">场强着色</span></label>
      <label><input id="tglRoll" type="checkbox"> <span data-zh="滚球法" data-en="Rolling sphere">滚球法</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lightning/" data-zh="闪电" data-en="Lightning">闪电</a>
    <a href="../faraday-cage/" data-zh="法拉第笼" data-en="Faraday Cage">法拉第笼</a>
    <a href="../triboelectricity/" data-zh="摩擦起电" data-en="Triboelectricity">摩擦起电</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,75);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

/* ── 场景:雷暴云 + 两栋楼(带针/无针)+ 先导/闪络/引下线/接地网 ── */
const CLOUD_Y=6.9,AX=-1.7,AH=2.3,BX=2.1,BH=1.7;
const cloudG=new THREE.Group();scene.add(cloudG);
const cloudM=new THREE.MeshStandardMaterial({color:0x39404e,roughness:1,flatShading:true});
const blobGeo=new THREE.IcosahedronGeometry(1,1);
[[0,7.9,0,2.6,0.95,1.7],[1.9,7.6,0.5,1.7,0.75,1.2],[-2.0,7.7,-0.4,1.8,0.8,1.3],
 [0.8,8.5,-0.7,1.6,0.7,1.1],[-0.9,8.6,0.6,1.5,0.65,1.0]].forEach(b=>{
  const m=new THREE.Mesh(blobGeo,cloudM);
  m.position.set(b[0],b[1],b[2]);m.scale.set(b[3],b[4],b[5]);cloudG.add(m);
});
const negM=new THREE.MeshStandardMaterial({color:0xb04a68,transparent:true,opacity:0.3,roughness:0.7});
const negDisc=new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,0.1,40),negM);
negDisc.position.set(0,6.88,0);scene.add(negDisc);
const posM=new THREE.MeshStandardMaterial({color:0xd9a23c,transparent:true,opacity:0.3,roughness:0.7});
const posDisc=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,0.06,40),posM);
posDisc.position.set(0,0.04,0);scene.add(posDisc);
/* 楼 A(带针)+ 引下线 + 接地网 */
const bldM=new THREE.MeshStandardMaterial({color:0x46506b,roughness:0.8});
const bldA=new THREE.Mesh(new THREE.BoxGeometry(1.4,AH,1.4),bldM);
bldA.position.set(AX,AH/2,0);scene.add(bldA);
const lipA=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.08,1.5),bldM);
lipA.position.set(AX,AH+0.04,0);scene.add(lipA);
const bldB=new THREE.Mesh(new THREE.BoxGeometry(1.4,BH,1.4),bldM);
bldB.position.set(BX,BH/2,0);scene.add(bldB);
const lipB=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.08,1.5),bldM);
lipB.position.set(BX,BH+0.04,0);scene.add(lipB);
const rodM=new THREE.MeshStandardMaterial({color:0xc9d2e2,roughness:0.35,metalness:0.8});
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1,10),rodM);
rod.scale.y=1.2;rod.position.set(AX,AH+0.6,0);scene.add(rod);
const tipM=new THREE.MeshStandardMaterial({color:0x8fa8ff,emissive:0x3b62ff,emissiveIntensity:0.3});
const tipMark=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,12),tipM);
tipMark.position.set(AX,AH+1.25,0);scene.add(tipMark);
const markAM=new THREE.MeshStandardMaterial({color:0x8fa8ff,emissive:0x3b62ff,emissiveIntensity:0.15});
const markA=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.02,16),markAM);
markA.position.set(AX+0.35,AH+0.1,0.3);scene.add(markA);
const markBM=markAM.clone();
const markB=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.02,16),markBM);
markB.position.set(BX-0.35,BH+0.1,0.3);scene.add(markB);
const condM=new THREE.MeshStandardMaterial({color:0xd8b25c,roughness:0.4,metalness:0.7});
const conductor=new THREE.Mesh(new THREE.BoxGeometry(0.05,AH,0.05),condM);
conductor.position.set(AX,AH/2,0.73);scene.add(conductor);
const gridM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.6,metalness:0.5});
const gridGrp=new THREE.Group();scene.add(gridGrp);
const gridDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.03,28),gridM);
gridDisc.position.set(AX,0.02,0);gridGrp.add(gridDisc);
const bar1=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.02,0.06),gridM);
bar1.position.set(AX,0.045,0);gridGrp.add(bar1);
const bar2=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,1.9),gridM);
bar2.position.set(AX,0.045,0);gridGrp.add(bar2);
/* 先导与闪络特效 */
const leaderMat=new THREE.LineBasicMaterial({color:0xcfe0ff,transparent:true,opacity:0});
const leaderGeo=new THREE.BufferGeometry();
const leaderLine=new THREE.Line(leaderGeo,leaderMat);scene.add(leaderLine);
const brMat=new THREE.LineBasicMaterial({color:0x9fb4e8,transparent:true,opacity:0});
const br1Geo=new THREE.BufferGeometry(),br2Geo=new THREE.BufferGeometry();
const branch1=new THREE.Line(br1Geo,brMat),branch2=new THREE.Line(br2Geo,brMat);
scene.add(branch1);scene.add(branch2);

/* 状态 */
let mode='rod',charge=65,rodH=1.2,gR=2;
let state='charge',stateT=0,cycleN=0;
let Ipk=45,Rs=100,attach=null,attachRod=true,leadProg=0;
let leaderPts=[],condCurve=null;
let playing=true,labelsOn=true,slowMo=false,fieldOn=true,rollOn=false;
let userHold=0,rollT=0;

const CH_T=2.0,LE_T=1.35,CO_T=0.5,ST_T=1.15,FA_T=1.7;

function condPts(){
  if(attachRod)return[new THREE.Vector3(AX,AH+rodH,0),
    new THREE.Vector3(AX,1.9,0.78),new THREE.Vector3(AX,0.12,0.78)];
  const onA=Math.abs(attach.x-AX)<Math.abs(attach.x-BX);
  return[attach.clone(),new THREE.Vector3(onA?AX:BX,1.6,0.78),
    new THREE.Vector3(onA?AX:BX,0.12,0.78)];
}
function genCycle(){
  Ipk=20+Math.random()*80;
  Rs=10*Math.pow(Ipk,0.65);              /* 击距 d≈10·I^0.65 (m, I:kA) */
  attachRod=(mode==='rod');
  if(attachRod)attach=new THREE.Vector3(AX,AH+rodH+0.04,0);
  else{
    const onA=Math.random()<0.6;
    attach=new THREE.Vector3((onA?AX:BX)+(Math.random()-0.5)*1.1,
      (onA?AH:BH)+0.04,(Math.random()-0.5)*0.9);
  }
  const y0=CLOUD_Y+0.5,y1=attach.y+0.3,dy=(y0-y1)/9;
  let p=new THREE.Vector3(attach.x*0.3+(Math.random()-0.5)*1.2,y0,(Math.random()-0.5)*0.6);
  leaderPts=[p.clone()];
  for(let i=1;i<=9;i++){
    p=p.clone();
    p.x+=(attach.x-p.x)*0.22+(Math.random()-0.5)*0.5;
    p.z+=(attach.z-p.z)*0.22+(Math.random()-0.5)*0.3;
    p.y-=dy;
    leaderPts.push(p.clone());
  }
  const b1=leaderPts[3],b2=leaderPts[5];
  br1Geo.setFromPoints([b1,b1.clone().add(new THREE.Vector3(0.5,-0.35,0.2)),
    b1.clone().add(new THREE.Vector3(0.95,-0.7,0.35))]);
  br2Geo.setFromPoints([b2,b2.clone().add(new THREE.Vector3(-0.45,-0.4,-0.25)),
    b2.clone().add(new THREE.Vector3(-0.85,-0.8,-0.45))]);
  condCurve=new THREE.CatmullRomCurve3(condPts());
}
/* 尖端场强:小曲率半径→电荷密度集中;E=基底×状态增益 */
function fieldBase(gap){return (charge/100)*3400*Math.pow(3.4/Math.max(gap,1.2),2);}
function fieldNow(){
  let k;
  if(state==='charge')k=0.35*(stateT/CH_T);
  else if(state==='leader')k=0.35+1.5*leadProg;
  else k=1.85;
  const gap=mode==='rod'?CLOUD_Y-(AH+rodH):CLOUD_Y-AH;
  return fieldBase(gap)*k;
}
function protRadius(){
  if(mode!=='rod')return -1;
  const h=rodH*5;                        /* 场景 1 单位≈5 m */
  return Math.sqrt(Math.max(2*Rs*h-h*h,0));
}

const lblTip=addLabel(()=>L('针尖:曲率小 → 场强集中','Rod tip: small curvature → field concentration'),

const lblNo=addLabel(()=>L('无针:屋顶随机接闪','No rod: random rooftop attachment'),

const lblRoll=addLabel(()=>L('滚球法:球面滚不到的才受保护','Rolling sphere: what it cannot reach is protected'),

addLabel(()=>L('整楼=法拉第笼:内部场≈0','Whole building = Faraday cage: interior field ≈ 0'),

function setCharge(v){charge=clamp(v,20,100);
  document.getElementById('sQ').value=charge;
  document.getElementById('sQVal').textContent=charge.toFixed(0)+' %';updateStats();}
function setRod(v){rodH=clamp(v,0.5,2.4);
  rod.scale.y=rodH;rod.position.y=AH+rodH/2;
  tipMark.position.y=AH+rodH+0.05;
  document.getElementById('sRod').value=rodH;
  document.getElementById('sRodVal').textContent=(rodH*5).toFixed(1)+' m';
  genCycle();updateStats();}
function setGR(v){gR=clamp(v,0.5,30);
  document.getElementById('sGR').value=gR;
  document.getElementById('sGRVal').textContent=gR.toFixed(1)+' Ω';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bRod').classList.toggle('on',m==='rod');
  document.getElementById('bNo').classList.toggle('on',m==='no');
  rod.visible=conductor.visible=gridGrp.visible=(m==='rod');
  genCycle();updateStats();}
function forceState(s){state=s;stateT=0;}
function setRoll(on){rollOn=on;
  document.getElementById('tglRoll').checked=on;
  rollSphere.visible=on;rollTrail.visible=on;
  if(!on)trailPts=[];}

const STEPS=[
 {zh:'<b>云底负电</b>:雷暴云底负电荷感应出地面正电荷,场强随电荷爬升',en:'<b>Negative base</b>: the cloud base induces ground charge; the field climbs with it',
  act(){setCharge(65);}},
 {zh:'<b>梯级下探</b>:下行先导每级 ~50 m、歇 ~50 µs,逐段伸向地面',en:'<b>Stepped descent</b>: the leader gropes down ~50 m per step, pausing ~50 µs',
  act(){setCharge(75);forceState('leader');}},
 {zh:'<b>尖端效应</b>:曲率半径越小,电荷密度与场强越集中',en:'<b>Tip effect</b>: the smaller the curvature radius, the tighter the field concentrates',
  act(){setMode('rod');setRod(2.2);}},
 {zh:'<b>上行先导迎击</b>:尖端场强破阈值→电晕→发出上行先导',en:'<b>Upward leader</b>: tip field crosses threshold — corona, then a leader rises',
  act(){setMode('rod');setRod(1.6);forceState('connect');}},
 {zh:'<b>接闪点之争</b>:击距内,尖端以最高场强抢到接闪权',en:'<b>Winning the attachment</b>: within striking distance the sharpest tip takes the hit',
  act(){setMode('rod');setRod(1.2);forceState('strike');}},
 {zh:'<b>泄放入地</b>:引下线-接地网低阻抗通路,峰值电流可达 ~100 kA',en:'<b>Draining to earth</b>: down-conductor plus grid gives a low-impedance path, ~100 kA peak',
  act(){setGR(8);setMode('rod');forceState('strike');}},
 {zh:'<b>滚球法·法拉第笼</b>:球面滚不到处即保护区,整楼屏蔽内部',en:'<b>Rolling sphere · Faraday cage</b>: unreachable spots are protected; the shell shields inside',
  act(){setMode('rod');setRoll(true);forceState('charge');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);userHold=6;});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

function updateStats(){
  const E=fieldNow();
  const ev=document.getElementById('stE');
  ev.innerHTML=E.toFixed(0)+'<small> kV/m</small>';
  ev.className='v '+(E>3000?'warn':'');
  const rv=document.getElementById('stRs');
  rv.innerHTML=Rs.toFixed(0)+'<small> m</small>';
  const iv=document.getElementById('stI');
  const iNow=state==='strike'?Ipk*Math.exp(-stateT/0.22):0;
  iv.innerHTML=iNow.toFixed(0)+'<small> kA</small>';
  iv.className='v '+(iNow>30?'warn':'');
  const pr=protRadius();
  const pv=document.getElementById('stRr');
  pv.innerHTML=pr<0?'—':pr.toFixed(0)+'<small> m</small>';
}

camera.position.set(6.2,4.6,9.2);

const cLow=new THREE.Color(0x3b62ff),cHigh=new THREE.Color(0xff3b30);
const tmpC=new THREE.Color();
function tipEmissive(mat,E,base){
  if(fieldOn){
    mat.emissive.copy(cLow).lerp(cHigh,clamp(E/4500,0,1));
    mat.emissiveIntensity=clamp(0.2+E/1600,base,2.4);
  }else{
    mat.emissive.setHex(0x3b62ff);mat.emissiveIntensity=base;
  }
}
function rollProfile(x){
  const R=1.6;let y=R;
  const corner=(cx,topY)=>{const d=Math.abs(x-cx);return d<R?topY+Math.sqrt(R*R-d*d):-1;};
  y=Math.max(y,corner(AX-0.75,AH),corner(AX+0.75,AH),corner(BX-0.75,BH),corner(BX+0.75,BH));
  if(x>AX-0.75&&x<AX+0.75)y=Math.max(y,AH+R);
  if(x>BX-0.75&&x<BX+0.75)y=Math.max(y,BH+R);
  if(mode==='rod'){const d=Math.abs(x-AX);
    if(d<R)y=Math.max(y,AH+rodH+Math.sqrt(R*R-d*d));}
  return y;
}
function tick(dts,dt){
  stateT+=dts;userHold=Math.max(0,userHold-dt);
  /* 相位推进 */
  if(state==='charge'&&stateT>CH_T){state='leader';stateT=0;}
  else if(state==='leader'&&stateT>LE_T){state=attachRod?'connect':'strike';stateT=0;}
  else if(state==='connect'&&stateT>CO_T){state='strike';stateT=0;}
  else if(state==='strike'&&stateT>ST_T){state='fade';stateT=0;}
  else if(state==='fade'&&stateT>FA_T){cycleN++;genCycle();state='charge';stateT=0;}
  /* 云的呼吸与电荷层 */
  cloudG.position.y=Math.sin(simT*0.6)*0.12;
  const ck=state==='charge'?0.4+0.6*stateT/CH_T:1;
  negM.opacity=0.12+0.4*(charge/100)*ck;
  posM.opacity=0.12+0.34*(charge/100)*ck;
  /* 针尖标签跟随针高 */
  lblTip.position.set(AX+0.6,AH+rodH+0.5,0);
  /* 场强着色 */
  const E=fieldNow();
  tipEmissive(tipM,E,0.3);
  tipEmissive(markAM,fieldBase(CLOUD_Y-AH)*(state==='charge'?0.35:1.85),0.15);
  tipEmissive(markBM,fieldBase(CLOUD_Y-BH)*(state==='charge'?0.35:1.85),0.15);
  /* 先导与闪络:每帧重置后按相位重建 */
  leaderMat.opacity=0;brMat.opacity=0;upMat.opacity=0;headM.opacity=0;
  flashM.opacity=0;flashLight.intensity=0;heatM.opacity=0;
  pulse.visible=false;
  rings.forEach(r=>{r.visible=false;});
  if(state==='leader'){
    const vis=Math.min(10,1+Math.floor(stateT/0.15));
    leadProg=(vis-1)/9;
    leaderGeo.setFromPoints(leaderPts.slice(0,vis));
    leaderMat.opacity=0.9;
    brMat.opacity=vis>=4?0.55:0;
    branch1.visible=vis>=4;branch2.visible=vis>=6;
    const hp=leaderPts[vis-1];
    headGlow.position.copy(hp);headM.opacity=0.9;
  }else{branch1.visible=false;branch2.visible=false;
    if(state==='connect'||state==='strike'||state==='fade'){
      leaderGeo.setFromPoints(leaderPts);
      leaderMat.opacity=state==='connect'?0.9:state==='strike'?0.55:0.55*(1-stateT/FA_T);
    }
  }
  if(state==='connect'){
    const head=leaderPts[9],up=clamp(stateT/CO_T,0,1);
    upGeo.setFromPoints([attach,attach.clone().lerp(head,up)]);
    upMat.opacity=0.95;
    headGlow.position.copy(attach);headM.opacity=0.9;
  }
  if(state==='strike'){
    const fk=Math.exp(-stateT*3.2);
    flash.position.copy(attach);
    flash.scale.setScalar(0.6+(1-fk)*1.9);
    flashM.opacity=fk;
    flashLight.position.copy(attach);
    flashLight.intensity=80*fk;
    const pk=clamp(stateT/0.5,0,1);
    if(pk<1){pulse.visible=true;pulse.position.copy(condCurve.getPointAt(pk));}
    rings.forEach((r,k)=>{
      const rk=stateT-k*0.16;
      if(rk>0&&rk<1.1){r.visible=true;
        r.position.set(attach.x,0.03,attach.z);
        r.scale.setScalar(0.3+rk*2.2);
        r.material.opacity=0.6*(1-rk/1.1);}
    });
    heatM.opacity=fk*clamp(gR/30,0,1)*0.85;
    heatDisc.position.set(attach.x,0.02,attach.z);
  }
  /* 滚球法:球沿轮廓滚,轨迹即保护边界(示意) */
  if(rollOn){
    rollT+=dts*1.3;
    const rx=-5.6+((rollT)%11.2),cy=rollProfile(rx);
    rollSphere.position.set(rx,cy,0);
    trailPts.push(new THREE.Vector3(rx,cy-1.6+0.02,0));
    if(trailPts.length>110)trailPts.shift();
    rollTrail.geometry.setFromPoints(trailPts);
    rollTrailMat.opacity=0.75;
  }
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});

  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);

function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null,simT=0;
function autoStepIdx(){
  if(state==='charge')return 0;
  if(state==='leader')return stateT<0.7?1:2;
  if(state==='connect')return 3;
  if(state==='strike')return stateT<0.55?4:5;
  return 6;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  tick(dts,dt);
  /* 播放时步骤高亮随雷击循环同步推进(点击步骤后短暂让位给用户) */
  if(userHold<=0){const idx=autoStepIdx();
    if(idx!==activeStep){activeStep=idx;syncSteps();}}
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
genCycle();
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
