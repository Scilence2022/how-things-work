</style>

  const mesh=new THREE.InstancedMesh(new THREE.SphereGeometry(r,8,6),m,n);

  const arr=[];for(let i=0;i<n;i++)arr.push({on:false,s:Math.random(),lane:Math.random()});
  return {mesh,arr};
}
const blood=pool(40,0xc92a2a,0.07);
const gluc=pool(50,0x51cf66,0.05,0x2f9e44);

calG.add(cLine);

calG.add(cMk);
/* ---- 电流模型 ---- */
function currentOf(){
  const base=glu*0.62*vol;
  const bias=interf==='vitc'?3.4:interf==='uric'?1.8:0;
  return {base,bias,raw:base+bias};
}
/* ---- 步骤 ---- */
const STEPS=[

 {zh:'虹吸:毛细自驱进反应腔',en:'Capillary wicking into the chamber',

];
function tglOn(id,v){const el=document.getElementById(id);el.checked=v;el.dispatchEvent(new Event('change'));}
function actBtn(id){['bDrop','bVitC','bUric','bClean'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
function startRun(){running=true;timer=0;iHist.fill(0);iIdx=0;}
/* ---- 读数 ---- */
function updateStats(){
  const {raw,base}=currentOf();
  const meas=running&&timer>=T_MEAS?raw:0;
  document.getElementById('stI').innerHTML=(running?raw:0).toFixed(2)+' <small>μA</small>';
  const rEl=document.getElementById('stR');
  const shown=running&&timer>=T_MEAS?glu+ (interf==='vitc'?5.4:interf==='uric'?2.9:0):0;
  rEl.innerHTML=shown?shown.toFixed(1)+' <small>mmol/L</small>':'—';
  rEl.className='v '+(shown&&Math.abs(shown-glu)>1?'warn':'ok');
  document.getElementById('stErr2').innerHTML=shown?((shown-glu)/glu*100).toFixed(0)+'<small>%</small>':'—';
  document.getElementById('stT').innerHTML=running?timer.toFixed(1)+' <small>s</small>':'—';
}
function applyPageTheme(dark){
  chart.material.color.setHex(dark?0x151b25:0xded7cb);
  calBg.material.color.setHex(dark?0x151b25:0xded7cb);
}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  $('sGlu').addEventListener('input',e=>{glu=+e.target.value;document.getElementById('sGluVal').textContent=glu.toFixed(1);updateStats();});
  $('sVol').addEventListener('input',e=>{vol=+e.target.value;document.getElementById('sVolVal').textContent=vol.toFixed(1);});
  $('bDrop').addEventListener('click',()=>{interf='none';actBtn('bDrop');startRun();});
  $('bVitC').addEventListener('click',()=>{interf='vitc';actBtn('bVitC');startRun();});
  $('bUric').addEventListener('click',()=>{interf='uric';actBtn('bUric');startRun();});
  $('bClean').addEventListener('click',()=>{interf='none';actBtn('bClean');startRun();});
  $('tglCal').addEventListener('change',e=>{calG.visible=e.target.checked;});
  addLabel(()=>L('虹吸口:毛细自驱','The sip-in: capillary self-fill'),new THREE.Vector3(-6.0,3.4,0),'b');
  addLabel(()=>L('GOx 酶垫:专一咬糖','GOx pads: glucose only'),new THREE.Vector3(-3.4,0.2,0.9),'g');
  addLabel(()=>L('介体:酶→电极的摆渡车','Mediators: enzyme→electron ferry'),new THREE.Vector3(0.2,2.4,0.9),'y');
  addLabel(()=>L('恒电位:电流∝浓度','Fixed potential: current ∝ glucose'),new THREE.Vector3(2.9,3.0,0.9),'r');
}
/* ---- 主循环 ---- */
function tick(dt,dts){
  if(running&&dts>0){
    timer+=dts;
    if(timer>T_MEAS+0.5)timer=T_MEAS+0.5;
    /* 电流爬升到平台 */
    const {raw}=currentOf();
    const frac=clamp(timer/T_MEAS,0,1);
    const cur=raw*(1-Math.exp(-timer*1.6))*(timer>T_MEAS?1:1);
    iHist[iIdx]=cur;iIdx=(iIdx+1)%120;
    drawCurrent();
    cMk.position.set(-2.9+glu/30*5.6,-0.8+clamp(raw/22,0,1)*1.4,0.1);
  }
  /* 粒子动画:血滴入、糖分子被酶咬、介体摆渡、电子上电极 */
  function adv(pl,rate,x0,x1,yo){
    pl.arr.forEach((p,i)=>{
      if(running){
        p.s+=dts*rate*(0.6+p.lane*0.8);
        if(p.s>1){p.s=0;p.lane=Math.random();}
      }
      const on=running&&p.s<1;
      const x=x0+(x1-x0)*p.s;
      const y=yo+Math.sin(p.s*9+i)*0.12;
      m4.makeTranslation(on?x:-99,on?y:-99,0.3);
      pl.mesh.setMatrixAt(i,m4);
    });
    pl.mesh.instanceMatrix.needsUpdate=true;
  }
  adv(blood,0.55,-6.4,-2.6,(Math.random()*0));
  adv(blood,0.55,-6.4,-2.6,0.3);
  adv(gluc,0.5,-1.8,2.6,0.55);
  adv(gluc,0.5,-1.8,2.6,-0.55);
  adv(medi,0.8,0.6,2.75,0.2);
  adv(medi,0.8,0.6,2.75,-0.2);
  adv(elec,1.3,2.8,3.6,0.45);
  adv(elec,1.3,2.8,3.6,-0.45);
}

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
