<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="鱼鳔:中性浮力的气体账本" data-en="Swim Bladder: The Gas Ledger of Neutral Buoyancy">鱼鳔:中性浮力的气体账本</h1>
  <div class="sub" data-zh="鱼比水重:去掉鳔,组织平均密度约 1060 kg/m³,淡水约 1000、海水 1025,不装浮力器官的鱼会以约 5% 体重净力下沉;鱼鳔是随身的配重补偿器——一枚占体腔约 6%(5~8%)的气囊,把整体平均密度精确配平到水密度,这就是中性浮力:不游也不沉,鳍只管方向。麻烦在于水会压缩它:每下潜 10 m 静压多 1 个大气压,玻意耳定律 V∝1/P 让鳔体积每 10 m 缩掉一半,浮力同步腰斩——鱼瞬间变沉,必须补气。闭鳔类(鲈、鳕、鲀)鳔与消化道断开,全靠气腺硬灌:腺细胞倾泻乳酸与 CO₂,血 pH 从约 7.8 跌到 6.6 以下,血红蛋白进入 Root 效应——酸性环境里即便泡在高氧分压中也松手放氧;真正把氧「泵」进鳔的是气腺背侧的 rete mirabile(奇网):动脉与静脉毛细管平行排成发夹状逆流回路,血流方向相反、壁间隔仅几微米,乳酸从上行静脉侧不断渗进下行动脉侧,被血流越带越深、浓度指数叠加,把氧分压从动脉血的约 0.15 atm 逐级放大到 ~200 倍(鳗鲡实测量级;深水种数百倍,示意)——鳔内因此能顶住数十 atm 水压;代价是慢:补气以分钟计,深水以小时计。放气走快路:鳔后室的椭圆窗薄膜贴着静脉血,鳔内压一超过血侧分压就被动扩散回血,秒到分钟级收场,窗周血管收缩还能调节开度。开鳔类(鲤、鲱、鳟)保留鳔管直通食道,水面吞一口气秒级配平,代价是离不开水面——深处鳔管无气可吞,吞进来的也只是 1 atm 的气。失效两幕:快速下潜,鳔被压缩、净浮力转负、越沉越快,分钟级的补气追不上秒级的压缩,鱼只能靠鳍硬游;快速上浮,静压骤降鳔膨胀,浮力暴涨、肚朝天失控上窜,必须开大椭圆窗泄压。拖「深度」看玻意耳压缩与沉浮失衡,拖「气腺泵速/椭圆窗开度」手动配平;按「气腺补气」「快速下潜」「快速上浮」「rete 失效」「开鳔对照」看五种局面。3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停
- 场景要点: 暗色水体中悬着一具剖视鱼体(头朝右,皮肤半透明):背侧一排脊椎,腹腔中央是两室鳔——前室顶部红色气腺压着 rete mirabile 迷网,后室壁上嵌着紫色椭圆窗与回血静脉;右侧悬浮一块放大的逆流毛细特写:红(动脉)/蓝(静脉)发夹回路并行,橙色乳酸粒子沿静脉上行、渗入动脉下行,蓝白 O₂ 粒子在动脉侧越聚越密冲向发夹尖;鱼背上方箭头随深度加压,腹侧绿(浮力)橙(重力)双箭头长度对比沉浮;左侧深度标尺每 10 m 一格随下潜上移,水面随深度远去、光随深度变暗;气腺补气时 O₂ 粒子流入鳔、鳔体鼓起,椭圆窗放气时粒子回血、气泡上冒;开鳔模式下绿色鳔管亮起,水面吞气气泡入口。" data-en="Fish are heavier than water: without the bladder, tissue averages about 1060 kg/m3 against roughly 1000 for fresh water and 1025 for seawater, so a fish without a buoyancy organ sinks with a net force near 5% of its weight. The swim bladder is a wearable trim compensator - a gas bag filling about 6% (5-8%) of the body cavity that trims average density exactly to the water's: neutral buoyancy, no sinking, no rising, fins only for steering. The trouble is that water compresses it: every 10 m down adds one atmosphere, and Boyle's law V ∝ 1/P halves the bladder volume every 10 m, cutting buoyancy in half - the fish suddenly turns heavy and must refill. Physoclists (perch, cod, pufferfish) have a bladder sealed from the gut and rely on the gas gland: gland cells pour out lactic acid and CO2, blood pH slides from about 7.8 to below 6.6, and hemoglobin enters the Root effect - releasing oxygen even under high O2 partial pressure. The real pump is the rete mirabile behind the gland: arterial and venous capillaries run side by side in hairpin countercurrent loops, flows opposite, walls microns apart; lactate keeps leaking from the ascending venous limb into the descending arterial limb and is carried ever deeper, multiplying exponentially, amplifying O2 partial pressure from about 0.15 atm in arterial blood to roughly 200x (eel-scale; hundreds in deep-sea species, schematic) - enough to fill a bladder against tens of atmospheres. The price is slowness: refills take minutes, hours in the deep. Venting takes the fast road: the thin oval window on the rear chamber touches venous blood, and the moment bladder pressure exceeds the blood-side pressure, gas diffuses back passively in seconds to minutes, with vasoconstriction throttling the window. Physostomes (carp, herring, trout) keep a pneumatic duct to the esophagus: one gulp at the surface trims them in seconds, but ties them to the surface - at depth the duct has nothing to swallow. Two failure acts: rapid descent, where the minutes-scale gland cannot chase the seconds-scale compression and the fish must fight with its fins; rapid ascent, where the bladder swells, buoyancy explodes and the fish rockets up belly-first until the oval window dumps gas. Drag depth to watch Boyle compression and the buoyancy imbalance, drag gland rate and window opening to trim by hand; press gas gland, rapid descent, rapid ascent, rete failure, physostome for the five scenarios. 3D interactive demo - drag to orbit / scroll to zoom - Space = play/pause
- Scene: a dark water column holds a dissected fish (head right, semi-transparent skin): a row of vertebrae along the back, a two-chamber bladder in the belly - the red gas gland crowning the anterior chamber with its rete mirabile, the violet oval window set into the rear chamber wall with its draining vein; at right floats a magnified countercurrent inset with parallel red (arterial) and blue (venous) hairpin loops, orange lactate particles climbing the venous limb and leaking into the descending arterial side while pale-blue O2 particles crowd toward the hairpin tip; pressure arrows above the back grow with depth, green (buoyancy) and orange (weight) arrows below the belly compare lengths; a depth ruler ticks every 10 m, the surface recedes and light dims with depth; filling sends O2 particles into the swelling bladder, venting pulls them back into blood and releases bubbles; in physostome mode a green duct lights up and bubbles enter at the mouth."></div>
</div>

  scopeCtx.setLineDash([4 * dpr, 3 * dpr]);
  scopeCtx.strokeStyle = 'rgba(160,170,190,.5)';
  scopeCtx.beginPath(); scopeCtx.moveTo(4, base); scopeCtx.lineTo(midX - 4, base); scopeCtx.stroke();
  scopeCtx.setLineDash([]);
  scopeCtx.strokeStyle = '#7fc4ff';
  scopeCtx.lineWidth = Math.max(1.3, 1.3 * dpr);
  scopeCtx.beginPath();
  for (let i = 0; i < NHIST; i++) {

    const x = 4 + (i / (NHIST - 1)) * (midX - 10), y = base - v * ampH;

  }

  const yOf = po => base - (Math.log10(Math.max(po, 0.1)) - logMin) / (logMax - logMin) * ampH;

  scopeCtx.strokeStyle = '#7fb2ff';
  scopeCtx.beginPath();

  el.stA.className = 'v';
  el.stB.innerHTML = `${Math.round(Vg)}<small> mL (${(Vg / 10).toFixed(1)}%)</small>`;
  const dv = Math.abs(Vg - NEUTRAL_ML);
  el.stB.className = 'v' + (dv < 4 ? ' ok' : dv < 12 ? ' warn' : ' bad');
  el.stC.innerHTML = `${net >= 0 ? '+' : ''}${net.toFixed(1)}<small> %${net >= 0 ? '↑' : '↓'}</small>`;
  el.stC.className = 'v' + (Math.abs(net) < 0.6 ? ' ok' : Math.abs(net) < 2 ? ' warn' : ' bad');
  el.stD.innerHTML = `×${Math.round(amp)}<small> → ${amp * PO2_ART < 10 ? (amp * PO2_ART).toFixed(1) : Math.round(amp * PO2_ART)} atm</small>`;
  el.stD.className = 'v' + (gate > 0.5 || !glandOn ? ' ok' : ' bad');
}
function resetMachine() {
  depth = 10; el.elA.value = 10;
  clisto = true;
  G = NEUTRAL_ML * (1 + depth / 10);
  lact = 0.6; reteHealth = 1; boyleT = 0;
  glandOn = false; ventOn = false; gulpOn = false;
  savedGland = savedVent = savedClisto = null;
  for (const pid of PRESET_IDS) document.getElementById('btn-' + pid).classList.remove('on');
  document.getElementById('btn-gland').classList.remove('on');
  document.getElementById('btn-vent').classList.remove('on');
  document.getElementById('btn-gulp').classList.remove('on');
  preset = null; autoDemo = true; fishY = 0; vy = 0;
  netHist.fill(0);
  applyViewMode();
  tgtVec.set(0.4, 1.35, 0);
  updateSliderLabels(); updateStats(); updateFormula();
}
/* ---------------- UI 接线 ---------------- */
const el = {
  elA: document.getElementById('vA'), elAVal: document.getElementById('vAVal'),
  elB: document.getElementById('vB'), elBVal: document.getElementById('vBVal'),
  elC: document.getElementById('vC'), elCVal: document.getElementById('vCVal'),
  stA: document.getElementById('stA'), stB: document.getElementById('stB'),
  stC: document.getElementById('stC'), stD: document.getElementById('stD'),
  formula: document.getElementById('formula'),
};
el.elA.addEventListener('input', () => { autoDemo = false; if (preset) setPreset(preset); depth = +el.elA.value; updateSliderLabels(); updateStats(); });
el.elB.addEventListener('input', () => { autoDemo = false; updateSliderLabels(); });
el.elC.addEventListener('input', () => { autoDemo = false; updateSliderLabels(); });
document.getElementById('btn-gland').addEventListener('click', function () { autoDemo = false; glandOn = !glandOn; this.classList.toggle('on', glandOn); });
document.getElementById('btn-vent').addEventListener('click', function () { autoDemo = false; ventOn = !ventOn; this.classList.toggle('on', ventOn); });
document.getElementById('btn-gulp').addEventListener('click', function () { gulpOn = !gulpOn; this.classList.toggle('on', gulpOn); });
document.getElementById('btn-mode').addEventListener('click', () => { clisto = !clisto; autoDemo = false; updateStats(); updateFormula(); });
for (const pid of PRESET_IDS) document.getElementById('btn-' + pid).addEventListener('click', () => setPreset(pid));
/* ---------------- 主逻辑 ---------------- */
function pageFrame(et, simDt, dt) {
  etG = et;
  /* ---- 步骤/预设切换 ---- */
  if (scenario !== lastScenario || preset !== lastPreset) {
    lastScenario = scenario; lastPreset = preset;
    if (preset === null) autoDemo = true;
    if (preset) presetEt = et;
    demoT0 = et;
    syncStepAnchor();
    updateSliderLabels(); updateStats();
  }
  if (autoDemo && !wasAutoDemo) demoT0 = et;
  wasAutoDemo = autoDemo;
  /* ---- 深度:脚本 / 滑杆 ---- */
  const mode = preset || (autoDemo ? stepScript(scenario) : null);
  if (mode && simDt > 0) {
    if (mode === 'dive') depth = Math.min(60, depth + 3.2 * simDt);
    else if (mode === 'rise') depth = Math.max(0, depth - 4.5 * simDt);
    else if (mode === 'fail') depth = Math.min(55, depth + 2.8 * simDt);
    else if (mode === 'duct') depth = Math.max(1.2, depth - 3.5 * simDt);
    else if (mode === 'boyle') { boyleT += simDt; depth = clamp(17.5 - 17.5 * Math.cos(TAU * boyleT / 26), 0, 36); }
    el.elA.value = Math.round(depth);
  } else if (!mode) {
    depth = +el.elA.value;
  }
  P = 1 + depth / 10;
  /* ---- 气腺:乳酸 → Root 效应 → 放大倍数 ---- */
  const glandK = glandOn ? (+el.elB.value) / 100 : 0;
  lact += ((glandK > 0.05 ? 0.8 + 2.2 * glandK : 0) - 0.55) * simDt;
  lact = clamp(lact, 0.4, 14);
  pH = 7.8 - 0.3 * lact;
  root = clamp((lact - 0.6) / 3, 0, 1);
  amp = 1 + ((clisto ? AMP_MAX : AMP_DUCT) - 1) * root * reteHealth;
  gate = clamp(amp * PO2_ART / P - 1, 0, 1);
  fillV = glandK * 1.7 * root * gate;      // mL/s 体腔体积当量
  /* ---- 椭圆窗放气 / 开鳔吞气 ---- */
  const ventK = ventOn ? Math.max((+el.elC.value) / 100, 0.5) : (+el.elC.value) / 100;
  ventV = ventK * 2.4;
  let gulping = false, gulpBlocked = false;
  if (gulpOn && !clisto) {
    if (depth < 2.5) { gulping = G < NEUTRAL_ML * P * 1.04; }
    else gulpBlocked = true;
  }
  if (mode === 'duct' && depth < 2.5 && G < NEUTRAL_ML * P * 1.04) gulping = true;
  G += (P * fillV + (gulping ? 26 : 0) - P * ventV) * simDt;
  G = clamp(G, 0, 260);
  Vg = G / P;
  net = (1000 * Vg - 56400) / 9964;        // % 体重
  netHist[histHead] = net;
  histHead = (histHead + 1) % NHIST;
  /* ---- 鱼体沉浮:净浮力驱动漂移与俯仰 ---- */
  vy += (clamp(net * 0.16, -0.6, 0.6) - vy) * Math.min(1, simDt * 2.5);
  fishY += vy * simDt;
  if (fishY > 1.5) { fishY = 1.5; vy = Math.min(vy, 0); }
  if (fishY < -1.5) { fishY = -1.5; vy = Math.max(vy, 0); }
  fish.position.y = fishBaseY + fishY;
  fish.rotation.z = clamp(vy * 0.8, -0.4, 0.4);
  /* ---- 环境:水面 / 标尺 / 光随深度变暗 / 海雪 ---- */
  const surfY = fishBaseY + depth * U_PER_M;
  surface.position.y = surfY;
  for (const t of ticks) {
    const y = fishBaseY + (depth - t.m) * U_PER_M;
    t.mesh.position.y = y;
    t.mesh.visible = Math.abs(y - fishBaseY) < 9.5;
  }
  const deep = clamp(depth / 110, 0, 1);
  if (scopeDark) bgC.lerpColors(BG_SD, BG_DD, deep);
  else bgC.lerpColors(BG_SL, BG_DL, deep);
  if (scene.background !== bgC) scene.background = bgC;
  scene.fog.color.copy(bgC);
  keyLight.intensity = 1.9 - 1.35 * deep;
  for (let i = 0; i < NSnow; i++) {
    const yy = ((snowPh[i] * 12 + et * 0.1 + depth * U_PER_M) % 12) - 4.5;
    snowPos[i * 3] = snowX[i];
    snowPos[i * 3 + 1] = fishBaseY + yy;
    snowPos[i * 3 + 2] = snowZ[i];
  }
  SNOW.geo.attributes.position.needsUpdate = true;
  /* ---- 静压箭头 / 浮力-重力箭头 ---- */
  const pK = clamp((P - 1) / 12, 0, 1);
  M.arrowP.opacity = 0.3 + 0.55 * pK;
  for (const a of pArrows) {
    a.position.y = fishBaseY + fishY + 1.35 + 0.3 * pK;
    a.scale.setScalar(0.5 + 0.6 * pK);
  }
  const anchorY = fishBaseY + fishY - 0.92;
  arrowB.scale.y = clamp(0.9 + 1.6 * (Vg / NEUTRAL_ML), 0.35, 4.4);
  arrowB.position.y = anchorY;
  arrowW.scale.y = 2.5;
  arrowW.position.y = anchorY;
  /* ---- 鳔体缩放 + 鳔内 O2 粒子 ---- */
  const s = Math.cbrt(clamp(Vg, 3, 150) / NEUTRAL_ML);
  chamA.scale.set(s * 0.62, s * 0.26, s * 0.22);
  chamP.scale.set(s * 0.42, s * 0.2, s * 0.18);
  const nShow = Math.round(clamp(Vg, 0, 140) / 140 * NO2);
  for (let i = 0; i < NO2; i++) {
    if (i < nShow) {
      o2Pos[i * 3] = -0.35 + o2Seed[i * 3] * 0.62 * s + Math.sin(et * 2 + i) * 0.01;
      o2Pos[i * 3 + 1] = -0.13 + o2Seed[i * 3 + 1] * 0.26 * s + Math.cos(et * 1.7 + i * 1.3) * 0.01;
      o2Pos[i * 3 + 2] = o2Seed[i * 3 + 2] * 0.22 * s;
    } else o2Pos[i * 3 + 1] = -50;
  }
  O2B.geo.attributes.position.needsUpdate = true;
  M.pO2.opacity = 0.35 + 0.45 * clamp(Vg / NEUTRAL_ML, 0, 1.4);
  /* ---- 补气流(气腺→鳔)/ 放气流(鳔→椭圆窗→静脉) ---- */
  const filling = fillV > 0.04;
  if (filling) {
    for (let i = 0; i < NFill; i++) {
      fillCurve.getPoint((et * 0.55 + fillPh[i]) % 1, tmpV);
      fillPos[i * 3] = tmpV.x; fillPos[i * 3 + 1] = tmpV.y; fillPos[i * 3 + 2] = tmpV.z;
    }
    FILL.geo.attributes.position.needsUpdate = true;
  }
  M.fill.opacity = filling ? 0.85 : 0;
  FILL.p.visible = filling;
  const venting = ventV > 0.06 && Vg > 2;
  if (venting) {
    for (let i = 0; i < NVent; i++) {
      ventCurve.getPoint((et * 0.6 + ventPh[i]) % 1, tmpV);
      ventPos[i * 3] = tmpV.x; ventPos[i * 3 + 1] = tmpV.y; ventPos[i * 3 + 2] = tmpV.z;
    }
    VENT.geo.attributes.position.needsUpdate = true;
  }
  M.vent.opacity = venting ? 0.8 : 0;
  VENT.p.visible = venting;
  M.oval.emissiveIntensity = venting ? 1.6 : 0;
  /* ---- 气泡(放气 / 吞气上冒) ---- */
  const spawnBub = (venting ? 0.35 : 0) + (gulping ? 0.5 : 0);
  for (let i = 0; i < NBub; i++) {
    if (bubLife[i] < 0 && Math.random() < spawnBub * simDt * 6) {
      const fromMouth = gulping && Math.random() < 0.6;
      bubX[i] = fromMouth ? 1.95 : 1.0;
      bubZ[i] = (Math.random() - 0.5) * 0.3;
      bubLife[i] = 0;
    }
    if (bubLife[i] >= 0) {
      bubLife[i] += simDt;
      bubPos[i * 3] = bubX[i] + Math.sin(bubLife[i] * 6 + i) * 0.05;
      bubPos[i * 3 + 1] = fishBaseY + fishY + 0.3 + bubLife[i] * bubSpd[i];
      bubPos[i * 3 + 2] = bubZ[i];
      if (bubPos[i * 3 + 1] > surfY) bubLife[i] = -1;
    } else bubPos[i * 3 + 1] = -50;
  }
  BUB.geo.attributes.position.needsUpdate = true;
  M.bub.opacity = spawnBub > 0.05 ? 0.8 : 0;
  BUB.p.visible = spawnBub > 0.05;
  /* ---- rete 特写粒子 ---- */
  M.lact.opacity = 0.25 + 0.65 * root * reteHealth;
  for (let i = 0; i < NLact; i++) {
    loopCurves[lactLoop[i]].getPoint(lactSide[i] === 0 ? 0.5 + (et * lactSpd[i] + lactPh[i]) % 1 * 0.5 : (et * lactSpd[i] + lactPh[i]) % 1 * 0.5, tmpV);
    lactPos[i * 3] = tmpV.x + Math.sin(et * 3 + i) * 0.02;
    lactPos[i * 3 + 1] = tmpV.y;
    lactPos[i * 3 + 2] = tmpV.z + Math.cos(et * 2.4 + i) * 0.02;
  }
  LACT.geo.attributes.position.needsUpdate = true;
  M.reteO2.opacity = 0.2 + 0.6 * root * reteHealth;
  for (let i = 0; i < NReteO2; i++) {
    loopCurves[roLoop[i]].getPoint((et * roSpd[i] + roPh[i]) % 1 * 0.5, tmpV);   // 动脉下行 top→tip
    reteO2Pos[i * 3] = tmpV.x;
    reteO2Pos[i * 3 + 1] = tmpV.y;
    reteO2Pos[i * 3 + 2] = tmpV.z;
  }
  RO.geo.attributes.position.needsUpdate = true;
  reteTipGlow.intensity = 2.2 * root * reteHealth;
  M.gland.emissiveIntensity = glandK * 1.6 + root * 0.6;
  /* ---- 鳔管可见性 / 警示标签 ---- */
  duct.visible = !clisto;
  ductLbl.o.visible = !clisto && labelsOn;
  let warn = '';
  if (gulpBlocked) warn = L('鳔管够不着气:得先浮上水面', 'duct finds no air: surface first');
  else if (glandOn && gate < 0.5) warn = L(`放大 ×${Math.round(amp)} 顶不住 ${P.toFixed(1)} atm:灌不进`, `x${Math.round(amp)} cannot beat ${P.toFixed(1)} atm: no fill`);
  else if (net < -1.5) warn = L(`净浮力 ${net.toFixed(1)}%:下沉!补气分钟级,来不及`, `net ${net.toFixed(1)}%: sinking! refill takes minutes`);
  else if (net > 1.5) warn = L(`净浮力 +${net.toFixed(1)}%:上飘!快开椭圆窗放气`, `net +${net.toFixed(1)}%: rising! open the oval window`);
  warnText = warn;
  warnLbl.o.visible = labelsOn && !!warn;
  if (warn) warnLbl.o.position.set(0, fishBaseY + fishY + 2.5, 0);
  bladderLbl.o.visible = glandLbl.o.visible = reteLbl.o.visible = ovalLbl.o.visible = depthLbl.o.visible = labelsOn;
}
/* ---------------- 装配 ---------------- */
applyViewMode(); updateSliderLabels(); updateStats();
/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0, et = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const simDt = playing ? dt * speed : 0;
  pageFrame(et, simDt, dt);
  const hlm = HL[STEPS[scenario].hl];
  if (hlm) hlm.opacity = 0.35 + 0.3 * (0.45 + 0.25 * Math.sin(et * 5));
  camV.copy(tgtVec);
  controls.target.lerp(camV, 0.04);
  for (const r of labelReg) {
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked && typeof drawScope === 'function') drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);
/* ---------------- 初始化 ---------------- */
applyTheme(); applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setPlayLabel();
tglCurve.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
