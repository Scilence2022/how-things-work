<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>胎盘与母婴交换 · 一墙之隔,两套血流做生意</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="胎盘与母婴交换" data-en="The Placenta">胎盘与母婴交换</h1>
  <div class="sub" data-zh="胎盘是胎儿暂时的肺、肾、肠道与内分泌腺:母体血与胎儿血各自奔流、永不混合,只隔一层绒毛薄壁做生意——氧气营养顺着梯度交过去,二氧化碳废物顺着梯度交回来;绒毛树把交换面撑到十几平米;hCG 等激素从这里接管母体全身的调度 · 拖动旋转 / 空格运行/暂停" data-en="The placenta is the fetus's temporary lung, kidney, gut and gland: maternal and fetal blood flow side by side, never mixing, trading across one thin trophoblast wall — oxygen and nutrients cross down their gradient, carbon dioxide and waste come back; the villus tree spreads the trading floor to tens of square meters; hCG and kin take over the mother's whole-body schedule from here · drag to orbit / Space = run/pause">胎盘是胎儿暂时的肺、肾、肠道与内分泌腺:母体血与胎儿血各自奔流、永不混合,只隔一层绒毛薄壁做生意——氧气营养顺着梯度交过去,二氧化碳废物顺着梯度交回来;绒毛树把交换面撑到十几平米;hCG 等激素从这里接管母体全身的调度 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

  <span class="k" data-zh="母体血流" data-en="Maternal flow">母体血流</span><span class="v" id="stFlow">—</span>
  <span class="k" data-zh="交换面积" data-en="Exchange area">交换面积</span><span class="v" id="stArea">—</span>
  <span class="k" data-zh="氧交换量" data-en="O₂ transfer">氧交换量</span><span class="v" id="stO2">—</span>

    <button class="abtn on" id="bBoth" data-zh="双侧循环" data-en="Both sides">双侧循环</button>
    <button class="abtn" id="bMat" data-zh="母体侧" data-en="Maternal side">母体侧</button>

    <label data-zh="孕周" data-en="Gestation">孕周</label>

    <label data-zh="交换墙厚" data-en="Wall thickness">交换墙厚</label>

  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>

    <span data-zh="相关:" data-en="Related:">相关:</span>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,46);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(6.2,3.4,7.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x2a1a18,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0xff9a8a,0.25);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* 子宫壁:碗状剖面(半透明),宫腔内是母体血池 */
const wombM=new THREE.MeshStandardMaterial({color:0xc98070,roughness:0.6,transparent:true,opacity:0.32,side:THREE.DoubleSide,depthWrite:false});
const wombPts=[];
for(let i=0;i<=20;i++){const t=i/20;
  wombPts.push(new THREE.Vector2(0.4+4.6*Math.sin(t*Math.PI*0.62),0.3+4.4*Math.sin(t*Math.PI*0.55)));}
const womb=new THREE.Mesh(new THREE.LatheGeometry(wombPts,42),wombM);
womb.position.y=0.4;scene.add(womb);
/* 血池:半透明红色腔体 */
const poolM=new THREE.MeshStandardMaterial({color:0xb03030,roughness:0.35,transparent:true,opacity:0.30,depthWrite:false});
const pool=new THREE.Mesh(new THREE.SphereGeometry(3.6,32,20),poolM);
pool.scale.set(1,0.38,0.85);pool.position.set(0,2.6,0);scene.add(pool);

/* 胎盘盘:贴在子宫后壁的圆盘 */
const placM=new THREE.MeshStandardMaterial({color:0x8a3a3a,roughness:0.5});
const placenta=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.9,0.45,36),placM);
placenta.position.set(0,3.6,-2.1);placenta.rotation.x=Math.PI/2-0.32;scene.add(placenta);

/* 绒毛树:干+三级分叉的管束 */
const villM=new THREE.MeshStandardMaterial({color:0xe8cdb8,roughness:0.55});
const villM2=new THREE.MeshStandardMaterial({color:0xdab49a,roughness:0.6});
const treeGroup=new THREE.Group();scene.add(treeGroup);
let villTips=[];
function branch(p0,dir,len,rad,depth){
  const p1=p0.clone().add(dir.clone().multiplyScalar(len));
  const mid=p0.clone().add(dir.clone().multiplyScalar(len*0.5))
    .add(new THREE.Vector3((Math.random()-0.5)*len*0.5,(Math.random()-0.2)*len*0.3,(Math.random()-0.5)*len*0.5));
  const curve=new THREE.CatmullRomCurve3([p0,mid,p1]);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,10,rad,7),depth?villM2:villM);
  treeGroup.add(tube);
  const tips=[];
  if(depth>=3||len<0.28){tips.push(p1);return tips;}
  const n=depth===0?4:3;
  for(let i=0;i<n;i++){
    const nd=dir.clone().applyAxisAngle(new THREE.Vector3(1,0,0),(Math.random()-0.5)*1.5)
      .applyAxisAngle(new THREE.Vector3(0,0,1),(Math.random()-0.5)*1.5).normalize();
    tips.push(...branch(p1,nd,len*0.66,rad*0.62,depth+1));
  }
  return tips;
}
function buildTrees(scale){
  treeGroup.clear();villTips=[];
  for(let i=0;i<5;i++){
    const ang=i/5*Math.PI*2;
    const root=new THREE.Vector3(Math.cos(ang)*1.7,3.35,Math.sin(ang)*1.0-1.7);
    const dir=new THREE.Vector3(Math.cos(ang)*0.35,1,Math.sin(ang)*0.22).normalize();
    villTips.push(...branch(root,dir,1.35*scale,0.14*scale,0));
  }
}
buildTrees(1);

/* 脐带:两根互绞的管(动脉蓝离胎,静脉红回胎) */
const artM=new THREE.MeshStandardMaterial({color:0x4a7fd6,roughness:0.4});
const veiM=new THREE.MeshStandardMaterial({color:0xd6554a,roughness:0.4});
const cordCurve=t=>new THREE.Vector3(3.4-t*2.9,0.9+2.0*Math.pow(t,0.8),1.6-t*3.1+0.13*Math.sin(t*24));
const cordA=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(
  Array.from({length:30},(_,i)=>{const t=i/29;
    return new THREE.Vector3(3.4-t*2.9,0.9+2.0*Math.pow(t,0.8),1.6-t*3.1+0.13*Math.sin(t*24));}),false),64,0.13,8),artM);
const cordV=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(
  Array.from({length:30},(_,i)=>{const t=i/29;
    return new THREE.Vector3(3.4-t*2.9,0.9+2.0*Math.pow(t,0.8),1.6-t*3.1+0.13*Math.sin(t*24+Math.PI));}),false),64,0.13,8),veiM);
scene.add(cordA,cordV);
/* 胎儿示意:两枚球 */
const fetM=new THREE.MeshStandardMaterial({color:0xe8b39a,roughness:0.55});
const fetus=new THREE.Group();fetus.position.set(4.0,0.95,2.1);scene.add(fetus);
const fh=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,16),fetM);fh.position.y=0.35;fetus.add(fh);
const fb=new THREE.Mesh(new THREE.SphereGeometry(0.34,20,16),fetM);fb.position.y=-0.25;fetus.add(fb);

/* 母体血粒子:绕绒毛树打旋 */
const NMAT=240;
const matM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.85});
const matP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,6,6),matM,NMAT);
matP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(matP);
const matD=[];
for(let i=0;i<NMAT;i++){
  matD.push({a:Math.random()*Math.PI*2,r:0.8+Math.random()*2.4,y:1.3+Math.random()*2.4,
    w:0.25+Math.random()*0.4,ph:Math.random()*7});
}
/* 胎儿血粒子:脐带与树冠往返 */
const NFET=150;
const fetPM=new THREE.MeshBasicMaterial({color:0x74a8ff,transparent:true,opacity:0.9});
const fetP=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,6,6),fetPM,NFET);
fetP.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(fetP);
const fetD=[];
for(let i=0;i<NFET;i++)fetD.push({t:Math.random(),lane:Math.random(),sp:0.25+Math.random()*0.3});
/* 交换闪光 */
const NEX=1;
const exM=new THREE.MeshBasicMaterial({color:0xfff3c4,transparent:true,opacity:0.95});
const exP=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),exM);scene.add(exP);
const exD=[];for(let i=0;i<NEX;i++)exD.push({t:9,dur:1.6,from:new THREE.Vector3(),to:new THREE.Vector3(),o2:true});

/* 状态 */
let weeks=32,flow=600,wallT=3.5,playing=true,labelsOn=true,slowMo=false,cut=true,focus='both',simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

function area(){return Math.pow(weeks/40,1.6)*13;}
function o2flux(){return flow*0.028*(weeks/40)*clamp(3.5/wallT,0.35,2.2);}
const m4=new THREE.Matrix4();

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('母体血池:喷灌式扫过绒毛','Maternal pool: sprayed across the villi'),
  new THREE.Vector3(-3.2,5.1,0),'r',()=>focus!=='fet');
addLabel(()=>L('绒毛树:把交换面撑到 '+area().toFixed(1)+' m²','Villus tree: trading floor '+area().toFixed(1)+' m²'),
  new THREE.Vector3(0,6.4,-1.4),'y');
addLabel(()=>L('交换壁:一层滋养细胞,厚 '+wallT.toFixed(1)+' µm','Exchange wall: one trophoblast layer, '+wallT.toFixed(1)+' µm'),
  new THREE.Vector3(1.6,4.6,-1.9),'g',()=>focus!=='fet');
addLabel(()=>L('脐带:动脉去(蓝)/ 静脉回(红)','Cord: artery out (blue) / vein back (red)'),
  new THREE.Vector3(2.6,3.5,2.2),'b',()=>focus!=='mat');
addLabel(()=>L('胎儿:呼吸由胎盘代劳','Fetus: the placenta breathes for it'),
  new THREE.Vector3(4.3,2.1,2.4),'o');
addLabel(()=>L('hCG 出厂:激素接管母体调度','hCG shipping: hormones take over'),
  new THREE.Vector3(-1.9,4.4,-2.3),'o',()=>weeks<13);

function setWeek(v){weeks=clamp(Math.round(v),8,40);
  document.getElementById('sWeek').value=weeks;
  document.getElementById('sWeekVal').textContent=weeks+' '+L('周','wk');
  buildTrees(0.55+weeks/40*0.65);updateStats();}
function setFlow(v){flow=clamp(v,300,900);
  document.getElementById('sFlow').value=flow;
  document.getElementById('sFlowVal').textContent=flow+' mL/min';updateStats();}
function setWall(v){wallT=clamp(v,1,10);
  document.getElementById('sWall').value=wallT;
  document.getElementById('sWallVal').textContent=wallT.toFixed(1)+' µm';updateStats();}
function setFocus(f){focus=f;
  document.getElementById('bBoth').classList.toggle('on',f==='both');
  document.getElementById('bMat').classList.toggle('on',f==='mat');
  document.getElementById('bFet').classList.toggle('on',f==='fet');}

const STEPS=[
 {zh:'两条血路,一墙之隔',en:'Two bloodstreams, one wall apart',
  act(){setFocus('both');setWeek(32);setFlow(600);setWall(3.5);}},
 {zh:'绒毛树:把面积撑到十几平米',en:'The villus tree: floorspace to tens of m²',
  act(){setFocus('both');setWeek(40);}},
 {zh:'氧与 CO₂:顺梯度换班',en:'O₂ and CO₂: trading down the gradient',
  act(){setFocus('both');setWall(3.5);setFlow(600);}},
 {zh:'母体侧:喷灌扫过绒毛',en:'Maternal side: a spray bath over the villi',
  act(){setFocus('mat');setFlow(880);}},
 {zh:'胎儿侧:脐带高速专线',en:'Fetal side: the umbilical express lane',
  act(){setFocus('fet');}},
 {zh:'墙越薄,生意越好做',en:'Thinner wall, better business',
  act(){setFocus('both');setWall(1.5);setFlow(600);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stFlow').innerHTML=flow+'<small> mL/min</small>';
  document.getElementById('stArea').innerHTML=area().toFixed(1)+'<small> m²</small>';
  const o=document.getElementById('stO2');
  o.innerHTML=o2flux().toFixed(0)+'<small> mL/min</small>';
  o.className='v '+(wallT>6?'warn':'ok');
  document.getElementById('stWk').textContent=weeks+' '+L('周','wk');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bBoth').addEventListener('click',()=>setFocus('both'));
document.getElementById('bMat').addEventListener('click',()=>setFocus('mat'));
document.getElementById('bFet').addEventListener('click',()=>setFocus('fet'));
document.getElementById('sWeek').addEventListener('input',e=>setWeek(+e.target.value));
document.getElementById('sFlow').addEventListener('input',e=>setFlow(+e.target.value));
document.getElementById('sWall').addEventListener('input',e=>setWall(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;
  wombM.opacity=cut?0.32:0.85;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
let spawnAcc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const speed=flow/600;
  /* 母体粒子:喷灌环流 */
  const showMat=focus!=='fet';
  for(let i=0;i<NMAT;i++){
    const c=matD[i];
    c.a+=dts*c.w*speed*(1.6-c.r/3.2);
    c.r=clamp(c.r+Math.sin(simT*0.7+c.ph)*dts*0.12,0.55,3.2);
    c.y+=dts*(1.9-c.y)*0.4*speed;
    const x=Math.cos(c.a)*c.r,z=Math.sin(c.a)*c.r*0.78-0.5;
    const s=showMat?1:0.12;
    m4.makeScale(s,s,s);m4.setPosition(x,c.y,z);
    matP.setMatrixAt(i,m4);
  }
  matP.instanceMatrix.needsUpdate=true;
  matM.opacity=showMat?0.85:0.12;
  /* 胎儿粒子:脐带往返 + 树冠游走 */
  const showFet=focus!=='mat';
  for(let i=0;i<NFET;i++){
    const f=fetD[i];
    f.t+=dts*f.sp*speed;
    if(f.t>1)f.t-=1;
    let p;
    if(f.lane<0.45){
      const t=f.t<0.5?f.t*2:1-(f.t-0.5)*2;
      p=cordCurve(t).add(new THREE.Vector3(0,0,f.lane<0.2?0:0.26*Math.sin(t*24+Math.PI)-0.13*Math.sin(t*24)));
    }else{
      const tp=villTips[(i*13)%villTips.length];
      const a=simT*(0.8+f.sp)+i;
      p=new THREE.Vector3(tp.x+0.1*Math.cos(a),tp.y+0.1*Math.sin(a*1.3),tp.z+0.1*Math.sin(a));
    }
    const s=showFet?1:0.12;
    m4.makeScale(s,s,s);m4.setPosition(p.x,p.y,p.z);
    fetP.setMatrixAt(i,m4);
  }
  fetP.instanceMatrix.needsUpdate=true;
  fetPM.opacity=showFet?0.9:0.12;
  /* 交换闪光:氧出(亮)/二氧化碳入(暗) */
  spawnAcc+=dts;
  if(spawnAcc>0.05){
    spawnAcc=0;
    const d=exD.find(c=>c.t>=c.dur);
    if(d&&villTips.length){
      const tp=villTips[(Math.random()*villTips.length)|0];
      d.o2=Math.random()<0.62;
      const off=0.3;
      d.from.set(tp.x+(d.o2?off:-0.05),tp.y+(d.o2?off*0.7:-0.02),tp.z+(d.o2?off*0.6:-0.02));
      d.to.set(tp.x+(d.o2?-0.05:off),tp.y+(d.o2?-0.02:off*0.7),tp.z+(d.o2?-0.02:off*0.6));
      d.t=0;
    }
  }
  for(const d of exD){
    if(d.t<d.dur&&villTips.length){
      d.t+=dts*(speed*0.9+0.4);
      const k=clamp(d.t/d.dur,0,1);
      exP.position.lerpVectors(d.from,d.to,k);
      exP.scale.setScalar(0.4+0.8*Math.sin(k*Math.PI));
      exM.color.setHex(d.o2?0xfff3c4:0x6a5450);
      exM.opacity=Math.max(0,0.95*Math.sin(k*Math.PI));
    }
  }
  /* 胎盘盘随孕周长大 */
  const ps=0.55+weeks/40*0.5;
  placenta.scale.set(ps,1,ps);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
