<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>降落伞与开伞 · 把 200 km/h 变成 20 km/h</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#f76707;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#d9480f;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(247,103,7,.6);background:rgba(247,103,7,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(217,72,15,.55);background:rgba(217,72,15,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(247,103,7,.10);border-color:rgba(247,103,7,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(217,72,15,.08);border-color:rgba(217,72,15,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffd9b8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="降落伞与开伞" data-en="The Parachute &amp; Opening Shock">降落伞与开伞</h1>
  <div class="sub" data-zh="阻力 F=½ρv²C_dA → 跳伞员收身 freefall 逼近 200 km/h 的终端速度 → 开伞瞬间迎风面积从 0.7 m² 冲到 30 m²,阻力先冲上峰值再回落稳态(人体耐受 3~6 g,过载过峰会重伤)→ 序列:引导伞拉出伞包 → 伞衣套下移 → 滑套逐级抑制冲载 → 伞衣逐室充气成型 → 圆伞只会摆、冲压方伞有翼型,滑翔比 3:1 可操纵 · 拖动旋转 / 空格运行/暂停" data-en="Drag F=½ρv²C_dA → a streamlined jumper nears 200 km/h terminal velocity in freefall → at opening the frontal area surges from 0.7 m² to ~30 m², so force spikes to a peak then settles (humans tolerate 3–6 g; an over-hard opening injures) → sequence: pilot chute extracts the bag → the deployment bag slides down → a slider staggers the load → cells inflate one by one → round canopies swing, ram-air wings glide 3:1 and steer · drag to orbit / Space = run/pause">阻力 F=½ρv²C_dA → 跳伞员收身 freefall 逼近 200 km/h 的终端速度 → 开伞瞬间迎风面积从 0.7 m² 冲到 30 m²,阻力先冲上峰值再回落稳态(人体耐受 3~6 g,过载过峰会重伤)→ 序列:引导伞拉出伞包 → 伞衣套下移 → 滑套逐级抑制冲载 → 伞衣逐室充气成型 → 圆伞只会摆、冲压方伞有翼型,滑翔比 3:1 可操纵 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="下落速度" data-en="Fall speed">下落速度</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="终端速度" data-en="Terminal v">终端速度</span><span class="v" id="stVt">—</span>
  <span class="k" data-zh="开伞动载" data-en="Opening load">开伞动载</span><span class="v" id="stG">—</span>
  <span class="k" data-zh="高度" data-en="Altitude">高度</span><span class="v" id="stH">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRound" data-zh="圆伞" data-en="Round">圆伞</button>
    <button class="abtn" id="bRam" data-zh="冲压方伞" data-en="Ram-air">冲压方伞</button>
    <button class="abtn" id="bSlowOp" data-zh="慢放开伞" data-en="Slow opening">慢放开伞</button>
  </div>
  <div class="row">
    <label data-zh="伞衣面积" data-en="Canopy area">伞衣面积</label>
    <input id="sA" type="range" min="10" max="48" step="1" value="32">
    <span class="val" id="sAVal">32 m²</span>
  </div>
  <div class="row">
    <label data-zh="负重" data-en="Payload">负重</label>
    <input id="sM" type="range" min="60" max="120" step="2" value="90">
    <span class="val" id="sMVal">90 kg</span>
  </div>
  <div class="row">
    <label data-zh="充气时长" data-en="Inflate time">充气时长</label>
    <input id="sT" type="range" min="0.6" max="4" step="0.1" value="1.4">
    <span class="val" id="sTVal">1.4 s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="v-t 曲线" data-en="v-t curve">v-t 曲线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../terminal-velocity/" data-zh="终端速度" data-en="Terminal Velocity">终端速度</a>
    <a href="../drag-crisis/" data-zh="阻力危机" data-en="Drag Crisis">阻力危机</a>
    <a href="../gliding-soaring/" data-zh="滑翔与翱翔" data-en="Gliding &amp; Soaring">滑翔与翱翔</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d1420,30,120);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,400);
camera.position.set(13,4.5,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x2a2c30,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(8,14,10);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-9,6,-8);scene.add(fill);

/* ── 场景:跳伞员悬在屏幕中央,大地与高度梯随下降爬升 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x24331f,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(90,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 高度梯:0~3000 m 映射到 y=-7.2 … +1.6 */
const ALT0=2500, KY=8.8/ALT0;
const altToY=h=>-7.2+h*KY;
const ladderM=new THREE.LineBasicMaterial({color:0x5b6b7d,transparent:true,opacity:0.5});
{
  const pts=[];
  for(let h=0;h<=3000;h+=250){pts.push(new THREE.Vector3(-11,altToY(h),-6));pts.push(new THREE.Vector3(-10.2,altToY(h),-6));}
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),ladderM));
}
/* 云层 */
const cloudM=new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:1,transparent:true,opacity:0.16,depthWrite:false});
for(let i=0;i<7;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(2.2+Math.random()*2.2,14,10),cloudM);
  const ang=i*0.9+0.4;
  c.position.set(Math.cos(ang)*9-1,altToY(700+i*420),Math.sin(ang)*7-2);
  c.scale.y=0.4;scene.add(c);
}
/* 跳伞员 */
const suitM=new THREE.MeshStandardMaterial({color:0x33415a,roughness:0.7});
const skinM=new THREE.MeshStandardMaterial({color:0xd9a066,roughness:0.6});
const body=new THREE.Group();
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.34,6,12),suitM);torso.rotation.x=Math.PI/2;body.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),
  new THREE.MeshStandardMaterial({color:0x222831,roughness:0.5}));head.position.y=0.33;body.add(head);
const pack=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.34,0.14),
  new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.8}));pack.position.set(0,0,-0.2);body.add(pack);
const limbs=[];
for(const [x,z,rx] of [[-0.2,0.28,-0.7],[0.2,0.28,-0.7],[-0.22,-0.26,0.5],[0.22,-0.26,0.5]]){
  const lm=new THREE.Mesh(new THREE.CapsuleGeometry(0.055,0.32,4,8),suitM);
  lm.position.set(x,0.02,z);lm.rotation.x=rx;body.add(lm);limbs.push(lm);
}
body.position.y=0;scene.add(body);
/* 引导伞 + 伞包 + 滑套 */
const pilot=new THREE.Group();
const pch=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,8),
  new THREE.MeshStandardMaterial({color:0xf76707,roughness:0.6,emissive:0xf76707,emissiveIntensity:0.35}));
pilot.add(pch);
const pLineG=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,0),new THREE.Vector3(0,-0.6,0)]),
  new THREE.LineBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.7}));
pilot.add(pLineG);pilot.visible=false;scene.add(pilot);
const slider=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.035,8,24),
  new THREE.MeshStandardMaterial({color:0x30363f,roughness:0.5,metalness:0.3}));
slider.rotation.x=Math.PI/2;slider.visible=false;scene.add(slider);
/* 伞衣:圆伞(半球)+ 冲压方伞(翼盒) */
const canopyG=new THREE.Group();scene.add(canopyG);
const roundG=new THREE.Group();
const roundCanopyM=new THREE.MeshStandardMaterial({color:0xe8590c,roughness:0.65,side:THREE.DoubleSide});
const hemi=new THREE.Mesh(new THREE.SphereGeometry(1,28,14,0,Math.PI*2,0,Math.PI*0.44),roundCanopyM);
hemi.scale.set(3.2,2.5,3.2);roundG.add(hemi);
for(let i=0;i<8;i++){
  const rib=new THREE.Mesh(new THREE.TorusGeometry(3.15,0.02,6,24,Math.PI/2),
    new THREE.MeshStandardMaterial({color:0xb35410,roughness:0.7,side:THREE.DoubleSide}));
  rib.rotation.y=i*Math.PI/4;rib.rotation.x=Math.PI/2;
  rib.scale.set(1,1,2.5/3.2);roundG.add(rib);
}
canopyG.add(roundG);
const ramG=new THREE.Group();
const cellM1=new THREE.MeshStandardMaterial({color:0xe8590c,roughness:0.6});
const cellM2=new THREE.MeshStandardMaterial({color:0xe9ecef,roughness:0.6});
const cellGeo=new THREE.BoxGeometry(0.62,0.13,1.75);
for(let i=0;i<9;i++){
  const a=(i-4)*0.128;
  const cell=new THREE.Mesh(cellGeo,i%2?cellM2:cellM1);
  cell.position.set(Math.sin(a)*8.2,Math.cos(a)*8.2-8.2,0);
  cell.rotation.z=a;ramG.add(cell);
}
ramG.rotation.x=Math.PI/2;ramG.position.z=0.15;canopyG.add(ramG);
/* 伞绳 */
const NLINE=16,linePos=new Float32Array(NLINE*2*3);
const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));

let canopy='round',area=32,mass=90,Tinf=1.4,playing=true,labelsOn=true,slowMo=false,chartOn=true;
let state='freefall',inf=0,deployT=0,v=0,h=ALT0,vx=0,tilt=0,swingA=0,swingV=0;
let peakG=0,gLoad=1,deployedOnce=false,landedHold=0,simT=0;
const G=9.81,CD_BODY=0.7,A_BODY=0.7,CD_CAN=1.35;
const rho=h=>1.225*Math.exp(-h/8500);
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;

const hist=[];   /* {t,v,g} */
function termV(ai){return Math.sqrt(2*mass*G/(rho(h)*(CD_BODY+A_BODY*0+CD_CAN*ai)));}

const labelReg=[];

  const div=document.createElement('div');div.className='lbl '+(typeof cls==='function'?'':cls);

  labelReg.push({o,text:textFn,vis:visFn,clsFn:typeof cls==='function'?cls:null});

}

function setM(vv){mass=clamp(vv,60,120);

  document.getElementById('sMVal').textContent=mass+' kg';}
function setT(vv){Tinf=clamp(vv,0.6,4);

function setCanopy(c){canopy=c;
  document.getElementById('bRound').classList.toggle('on',c==='round');

function startDeploy(){if(state!=='freefall')return;state='deploy';deployT=0;deployedOnce=true;}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;resetJump();STEPS[i].act();if(i>=2)startDeploy();syncSteps();}

function updateStats(){
  st={v:v*3.6,vt:termV(inf>0.9?1:0)*3.6,g:gLoad,h,h};
  document.getElementById('stV').innerHTML=v.toFixed(1)+'<small> m/s</small>';
  const vt=document.getElementById('stVt');
  vt.innerHTML=termV(clamp(inf,0,1)).toFixed(0)+'<small> km/h</small>';
  vt.className='v '+(inf>0.9&&termV(1)*3.6<30?'ok':'');
  const gv=document.getElementById('stG');
  gv.innerHTML=gLoad.toFixed(1)+'<small> g</small>';
  gv.className='v '+(gLoad>6?'warn':gLoad<2?'ok':'');
  document.getElementById('stH').innerHTML=Math.max(0,h).toFixed(0)+'<small> m</small>';
}
function drawChart(){
  if(!chartOn){cx2.clearRect(0,0,CW,CH);tex.needsUpdate=true;return;}
  cx2.fillStyle=THEME==='dark'?'#141922':'#f4f2ee';
  cx2.fillRect(0,0,CW,CH);
  cx2.fillStyle=THEME==='dark'?'#9fb0c3':'#5b6b7d';
  cx2.font='13px system-ui';cx2.fillText(L('速度 / 动载 历史(40 s)','speed / load history (40 s)'),14,22);
  const x0=44,y0=CH-30,W=CW-60,H=CH-64;
  cx2.strokeStyle=THEME==='dark'?'#2c3542':'#d8d4cc';
  cx2.strokeRect(x0,y0-H,W,H);
  for(let i=0;i<=4;i++){
    const y=y0-H*i/4;
    cx2.beginPath();cx2.moveTo(x0,y);cx2.lineTo(x0+W,y);cx2.stroke();
    cx2.fillStyle=THEME==='dark'?'#62748a':'#8a96a4';
    cx2.fillText((250-i*62.5).toFixed(0),6,y+4);
  }
  cx2.fillText('km/h ↑    g ↑',x0+W-86,16);
  const tNow=simT,tWin=40;
  const X=t=>x0+W*clamp((tNow-t)/tWin,0,1);
  const Yv=vv=>y0-H*clamp(vv*3.6/250,0,1);
  const Yg=gg=>y0-H*clamp(gg/8,0,1);
  if(hist.length>1){
    cx2.strokeStyle='#74c0fc';cx2.lineWidth=2;cx2.beginPath();
    for(let i=0;i<hist.length;i++){const p=hist[i];i?cx2.lineTo(X(p.t),Yv(p.v)):cx2.moveTo(X(p.t),Yv(p.v));}
    cx2.stroke();
    cx2.strokeStyle='#ff6b6b';cx2.beginPath();
    for(let i=0;i<hist.length;i++){const p=hist[i];i?cx2.lineTo(X(p.t),Yg(p.g)):cx2.moveTo(X(p.t),Yg(p.g));}
    cx2.stroke();
    let pk=hist[0];for(const p of hist)if(p.g>pk.g)pk=p;
    if(pk.g>1.6){
      cx2.fillStyle='#ff6b6b';cx2.beginPath();
      cx2.arc(X(pk.t),Yg(pk.g),4,0,7);cx2.fill();
      cx2.font='12px system-ui';
      cx2.fillText(`peak ${pk.g.toFixed(1)} g`,clamp(X(pk.t)+8,x0+4,x0+W-70),clamp(Yg(pk.g)-8,26,y0));
    }
  }
  cx2.fillStyle=THEME==='dark'?'#74c0fc':'#1864ab';cx2.font='12px system-ui';
  cx2.fillText(L('— 速度','— speed'),x0+6,y0+18);
  cx2.fillStyle=THEME==='dark'?'#ff6b6b':'#c92a2a';
  cx2.fillText(L('— 动载(g)','— load (g)'),x0+70,y0+18);
  tex.needsUpdate=true;
}

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d1420:0xcfe0ef);
  scene.fog.color.setHex(dark?0x0d1420:0xcfe0ef);
  scene.fog.near=dark?30:40;
  groundM.color.setHex(dark?0x24331f:0x8fa860);
  cloudM.color.setHex(dark?0xdfe8f2:0xffffff);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('bSlowOp').classList.toggle('on',Tinf>=2.4);
  buildSteps();drawChart();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 物理与状态机 ── */
  if(h>0){
    if(state==='freefall'&&h<=1000)startDeploy();
    if(state==='deploy'){
      deployT+=dts;
      inf=smooth(deployT/Tinf);
      if(deployT>=Tinf+0.4){state='canopy';
        if(canopy==='round'){swingV=0.5;}}
    }
    const Aeff=A_BODY+CD_CAN*area*inf*0.9;
    const drag=0.5*rho(h)*Aeff*v*v;
    const a=G-drag/mass;
    v=Math.max(0,v+a*dts);
    gLoad=drag/(mass*G);
    if(state==='deploy'&&gLoad>peakG)peakG=gLoad;
    if(state==='canopy'){
      if(canopy==='ram'){vx+=(v*3-vx)*dts;tilt+=((v>2?0.32:0)-tilt)*2*dts;}
      else{swingV+=(-G/4.5*swingA-0.25*swingV)*dts;swingA+=swingV*dts;}
    }
    h-=v*dts;
    if(h<=0){h=0;gLoad=1;}
    frame.accH=(frame.accH||0)+dts;
    if(frame.accH>0.12){frame.accH=0;hist.push({t:simT,v,g:gLoad});
      while(hist.length&&simT-hist[0].t>40)hist.shift();}
  } else if(playing){
    landedHold+=dt;if(landedHold>3){landedHold=0;resetJump();applyPhase(activeStep);return;}
  }
  /* ── 可视化 ── */
  const hy=altToY(h);
  ground.position.y=hy;
  ladderM.opacity=h<300?0.15:0.5;
  /* 跳伞员姿态 */
  const upright=smooth((inf-0.6)/0.4);
  body.rotation.x=(1-upright)*(-Math.PI/2)+upright*(canopy==='ram'?-tilt:0);
  body.rotation.z=canopy==='round'?swingA:0;
  body.position.x=canopy==='round'?swingA*-2.5*upright:0;
  /* 伞衣 */
  const cs=0.12+0.88*smooth(inf);
  canopyG.visible=inf>0.01;
  canopyG.position.y=4.2+Math.sin(simT*1.3)*0.06*(inf>0.9?1:0.2);
  canopyG.scale.setScalar(Math.max(0.02,cs));
  roundG.visible=canopy==='round';ramG.visible=canopy==='ram';
  canopyG.rotation.z=canopy==='round'?swingA*0.8:-0.22*upright;
  /* 引导伞与滑套 */
  pilot.visible=state==='deploy'&&deployT<Tinf*0.5;
  if(pilot.visible){pilot.position.set(0.8,5.2+Math.sin(simT*9)*0.1,0.4);
    pLineG.scale.y=(canopyG.position.y-5.6)/1;}
  slider.visible=state==='deploy'&&deployT>Tinf*0.25;
  if(slider.visible)slider.position.set(0,4.2*(1-(deployT-Tinf*0.25)/(Tinf*0.9))+0.4,0);
  /* 伞绳:肩部 → 伞缘 */
  if(inf>0.01){
    const R=canopy==='round'?3.05:2.6;
    for(let i=0;i<NLINE;i++){
      const a=i/NLINE*Math.PI*2,ca=canopy==='ram';
      const rx=ca?Math.cos(a)*R*1.4:Math.cos(a)*R, rz=ca?0.3:Math.sin(a)*R;
      const ry=ca?0.4:Math.sin(a)*0-0.1;
      linePos[i*6+0]=body.position.x+0.15;     linePos[i*6+1]=0.25;      linePos[i*6+2]=0;
      linePos[i*6+3]=body.position.x+rx*cs;    linePos[i*6+4]=canopyG.position.y+ry*cs;  linePos[i*6+5]=rz*cs;
    }
    lineGeo.attributes.position.needsUpdate=true;
  }
  lines.visible=inf>0.01;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();drawChart();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on;
    if(on){
      r.o.element.textContent=r.text();
      if(r.clsFn)r.o.element.className='lbl '+r.clsFn();
    }
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);resetJump();}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
