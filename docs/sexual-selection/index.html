<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>性选择与装饰 · 孔雀尾屏的失控与拉停</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#12b886;
    --bg:#0e1310;--panel:rgba(14,19,16,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(14,19,16,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(14,19,16,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#087f5b;
    --bg:#eef1ea;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(18,184,134,.6);background:rgba(18,184,134,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(8,127,91,.55);background:rgba(8,127,91,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(18,184,134,.10);border-color:rgba(18,184,134,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(8,127,91,.08);border-color:rgba(8,127,91,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#c8f5e4}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="性选择与装饰" data-en="Sexual Selection &amp; Ornament">性选择与装饰</h1>
  <div class="sub" data-zh="孔雀尾屏既是累赘也是诚信号→累赘原理:尾羽拖累逃生,只有真正健康的个体养得起,劣者伪造不起→费雪失控:雌性偏好与雄性装饰互为因果,女儿爱长尾、儿子有长尾,代代互相加速→装饰成本(年存活率↓)对冲求偶收益(交配率↑),净适应度 W=m·s 的峰把失控拉停→捕食者在场,峰被拉回更短的尾→眼斑的数量与对称是分毫不差的诚信号 · 拖动旋转 / 空格运行/暂停" data-en="A peacock's train is a liability and an honest signal at once → handicap principle: the train drags on escape, so only genuinely fit males can afford it — shams can't pay the cost → Fisherian runaway: female preference and male ornament feed each other, generation after generation, until survival cost brakes them → ornament cost (annual survival down) offsets mating gain (mate rate up); the net-fitness peak W=m·s halts the runaway → with predators around, the peak is dragged back to shorter trains → eyespot number and symmetry are exact honest cues · drag to orbit / Space = run/pause">孔雀尾屏既是累赘也是诚信号→累赘原理:尾羽拖累逃生,只有真正健康的个体养得起,劣者伪造不起→费雪失控:雌性偏好与雄性装饰互为因果,女儿爱长尾、儿子有长尾,代代互相加速→装饰成本(年存活率↓)对冲求偶收益(交配率↑),净适应度 W=m·s 的峰把失控拉停→捕食者在场,峰被拉回更短的尾→眼斑的数量与对称是分毫不差的诚信号 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1310,16,44);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(1.6,2.6,10.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,1.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xd2e8d8,0x10140f,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x8fc8ff,0.35);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:孔雀(羽屏实时改长)+ 种群直方图 + 捕食者 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x18201a,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
for(let i=0;i<16;i++){
  const g=new THREE.Mesh(new THREE.ConeGeometry(0.16+((i*7)%5)*0.05,0.5+((i*11)%6)*0.12,7),
    new THREE.MeshStandardMaterial({color:0x24352a,roughness:0.9}));
  const a=i/16*Math.PI*2+0.3;
  g.position.set(Math.cos(a)*12.5,0.2,Math.sin(a)*9);scene.add(g);
}
/* 孔雀:体轴沿 +X,头朝右,尾屏在身后展开 */
const peacock=new THREE.Group();scene.add(peacock);
const bodyM=new THREE.MeshStandardMaterial({color:0x2458a8,roughness:0.45,metalness:0.1});
const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,16),bodyM);
body.scale.set(1.5,1,0.9);body.position.set(0,1.0,0);peacock.add(body);
const neckCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.42,1.15,0),new THREE.Vector3(0.72,1.7,0),new THREE.Vector3(0.82,2.0,0)]);
const neck=new THREE.Mesh(new THREE.TubeGeometry(neckCurve,12,0.095,10),bodyM);peacock.add(neck);
const headM=new THREE.MeshStandardMaterial({color:0x2a6fc8,roughness:0.35});
const phead=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),headM);
phead.position.set(0.84,2.08,0);peacock.add(phead);
const beak=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.16,8),
  new THREE.MeshStandardMaterial({color:0xd8a83a,roughness:0.5}));
beak.rotation.z=-Math.PI/2;beak.position.set(0.99,2.06,0);peacock.add(beak);
for(let i=0;i<3;i++){
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.12,5),headM);
  st.position.set(0.8+0.03*i-0.03,2.24,0);st.rotation.z=(i-1)*0.25;peacock.add(st);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.02,6,6),headM);
  tip.position.set(0.8+0.06*(i-1),2.31,0);peacock.add(tip);
}
const legM=new THREE.MeshStandardMaterial({color:0xb08848,roughness:0.6});
for(const s of [-1,1]){
  const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.75,6),legM);
  lg.position.set(0.05,0.38,0.12*s);peacock.add(lg);
}
/* 尾屏:13 枚单位长度羽轴+羽枝+眼斑,长度实时缩放 */
const trainG=new THREE.Group();
trainG.position.set(-0.28,1.05,0);peacock.add(trainG);
const feathers=[];
const FE=13;
const shaftM=new THREE.MeshStandardMaterial({color:0x9aa860,roughness:0.6});
const barbM=new THREE.MeshStandardMaterial({color:0x3f9b63,roughness:0.6,side:THREE.DoubleSide,
  transparent:true,opacity:0.6});
const eyeCols=[0x9a7d3f,0x1f8a70,0x14406e,0x0c2340];
for(let i=0;i<FE;i++){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.011,0.02,1,6),shaftM);
  shaft.position.y=0.5;g.add(shaft);
  for(let b=0;b<7;b++){
    const bb=new THREE.Mesh(new THREE.PlaneGeometry(0.17,0.05),barbM);
    bb.position.y=0.22+b*0.115;
    bb.rotation.y=(b%2?1:-1)*0.55+(i%3-1)*0.08;
    g.add(bb);
  }
  for(let e=0;e<4;e++){
    const d=new THREE.Mesh(new THREE.CircleGeometry(0.125-e*0.032,20),
      new THREE.MeshStandardMaterial({color:eyeCols[e],roughness:0.5,side:THREE.DoubleSide}));
    d.position.y=1.02+e*0.014;d.rotation.x=-Math.PI/2+0.12;g.add(d);
  }
  trainG.add(g);feathers.push(g);
}
/* 种群尾长直方图(左):10 桶,55~185 cm */
const histBars=[];
const histBase=new THREE.Mesh(new THREE.BoxGeometry(5.6,0.06,0.5),
  new THREE.MeshStandardMaterial({color:0x2a3a30,roughness:0.8}));
histBase.position.set(-5.6,0.03,-0.6);scene.add(histBase);
const histM=new THREE.MeshStandardMaterial({color:0x12b886,roughness:0.5,emissive:0x0a5c44,emissiveIntensity:0.35});
for(let i=0;i<10;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.44,1,0.44),histM);
  b.position.set(-8.0+i*0.53,0,-0.6);scene.add(b);histBars.push(b);
}
const meanMarkM=new THREE.MeshStandardMaterial({color:0xffc078,emissive:0xffc078,emissiveIntensity:0.5});
const meanMark=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.3,4),meanMarkM);
meanMark.rotation.x=Math.PI;scene.add(meanMark);
/* 捕食者:狐形剪影 */
const predG=new THREE.Group();
const predM=new THREE.MeshStandardMaterial({color:0x8a4a26,roughness:0.7});
const pbody=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.42,0.36),predM);
pbody.position.y=0.52;predG.add(pbody);
const pheadB=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.3),predM);
pheadB.position.set(0.72,0.78,0);predG.add(pheadB);
for(const s of [-1,1]){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,4),predM);
  ear.position.set(0.66,1.0,0.1*s);predG.add(ear);
}
const ptail=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.03,0.8,6),predM);
ptail.rotation.z=1.9;ptail.position.set(-0.75,0.7,0);predG.add(ptail);
for(const sx of [-0.4,0.4])for(const sz of [-0.12,0.12]){
  const l=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.55,6),predM);
  l.position.set(sx,0.28,sz);predG.add(l);
}
const pEyeM=new THREE.MeshStandardMaterial({color:0x200,emissive:0xffd23a,emissiveIntensity:1.1});
for(const s of [-1,1]){
  const e=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),pEyeM);
  e.position.set(0.9,0.82,0.09*s);predG.add(e);
}
predG.position.set(7.2,0,1.6);predG.rotation.y=-Math.PI/2;predG.visible=false;scene.add(predG);

/* 状态 */
let mode='open',len=95,pref=1,predOn=false;
let playing=true,labelsOn=true,slowMo=false;
let spread=0.15,tilt=0.85,gen=0,genAcc=0;
let P=95;                                   /* 雌性群体偏好(cm) */
let pop=Array.from({length:64},()=>clamp(95+gauss()*12,55,185));
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 适应度模型:交配收益饱和上升,存活随尾长指数衰减;捕食者把衰减拉陡 */
const mateFn=Lm=>(Lm*Lm)/(Lm*Lm+110*110);
const survFn=Lm=>Math.exp(-(Lm*Lm)/(2*(predOn?130:195)**2));
const mean=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblTrain=addLabel(()=>L(`尾屏 ${len.toFixed(0)} cm · ${mode==='open'?'开屏展示中':'收拢拖行中'}`,
    `train ${len.toFixed(0)} cm · ${mode==='open'?'displaying':'folded, dragging'}`),
  new THREE.Vector3(-0.6,4.3,0),'g');
const lblEye=addLabel(()=>L('眼斑:数量与对称 = 健康/免疫力的诚信号','Eyespots: count & symmetry = honest health cues'),
  new THREE.Vector3(0.4,3.6,0.9),'y');
const lblHist=addLabel(()=>L('种群尾长分布 · 逐代漂移','Train-length distribution · drifting per generation'),
  new THREE.Vector3(-5.6,3.1,-0.6),'b');
const lblPref=addLabel(()=>L(`雌性群体偏好 ≈ ${P.toFixed(0)} cm`,`female preference ≈ ${P.toFixed(0)} cm`),
  new THREE.Vector3(-5.6,-0.6,-0.6),'o');
const lblPred=addLabel(()=>L('捕食者:把存活率曲线拉陡,峰被拖回短尾','Predator: steepens survival cost, drags the peak back'),
  new THREE.Vector3(6.4,2.0,1.6),'r',()=>predOn);
const lblRun=addLabel(()=>L('费雪正反馈:偏好催长尾,长尾反过来强化偏好',
    'Fisherian feedback: preference lengthens trains, longer trains entrench preference'),
  new THREE.Vector3(3.6,4.6,0),'g',()=>gen>1&&!predOn);

function setLen(v){len=clamp(Math.round(v),60,165);
  const shift=len-mean(pop);
  pop=pop.map(x=>clamp(x+shift,55,185));
  document.getElementById('sLen').value=len;
  document.getElementById('sLenVal').textContent=len+' cm';
  updateStats();}
function setPref(v){pref=clamp(v,0.2,2);
  document.getElementById('sPref').value=pref;
  document.getElementById('sPrefVal').textContent='×'+pref.toFixed(1);}
function setMode(m){mode=m;
  document.getElementById('bOpen').classList.toggle('on',m==='open');
  document.getElementById('bFold').classList.toggle('on',m==='fold');}
function setPred(v){predOn=v;
  document.getElementById('tglPred').checked=v;
  predG.visible=v;updateStats();}
/* 费雪失控 + 存活拉停:定量遗传一步更新 */
function evolve(){
  const Ld2=2*(predOn?130:195)**2, sig2=2*15*15, K=110*110;
  const grad=x=>6*(2/x-2*x/(x*x+K)-2*x/Ld2-(x-P)/sig2);
  pop=pop.map(x=>clamp(x+grad(x)*pref+gauss()*3,55,185));
  const Lm=mean(pop);
  P=clamp(P+0.35*Math.sign(Lm-P)*Math.min(Math.abs(Lm-P)*pref,1.4),40,200);
  gen++;
  setLen(Lm);
  updateHist();
}
function updateHist(){
  const bins=new Array(10).fill(0);
  for(const x of pop)bins[clamp(Math.floor((x-55)/13),0,9)]++;
  const mx=Math.max(...bins,1);
  histBars.forEach((b,i)=>{
    b.scale.y=Math.max(0.03,bins[i]/mx*2.2);
    b.position.y=b.scale.y/2;
  });
  const mi=clamp(mean(pop)-55,0,130);
  meanMark.position.set(-8.0+mi/13*0.53,2.45,-0.6);
}

const STEPS=[
 {b:'装饰的悖论',be:'The ornament paradox',

  de:'A 1.5 m train impairs takeoff and invites predators; natural selection alone should trim it — yet it grew longer and longer: another selective force must be paying it.',

 {b:'累赘原理:诚信号',be:'Handicap principle: honesty',
  d:'尾羽是持续付费的累赘:寄生虫多、体弱的个体养不起这条尾巴也撑不起开屏——装饰贵到劣者伪造不起,它才成为可信的求偶广告。',

  de:'Peahens count eyespots and check symmetry: both track parasite resistance and immune quality — the ornament is judged not just by length but by details that cannot be watered down.',
  act(){setMode('open');setLen(150);}},
 {b:'读净适应度仪表',be:'Read the net-fitness gauge',
  d:'四个读数连成一条逻辑链:求偶成功率随尾长涨、年存活率随尾长跌、两者相乘的净适应度在平衡尾长处最大——性选择与自然选择的拉锯停在峰值上。',
  de:'The four gauges chain together: mating success rises with train length, survival falls, and their product — net fitness — peaks at the equilibrium length where sexual and natural selection balance.',
  act(){setMode('open');setLen(155);setPred(false);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const Lm=mean(pop);
  const m=mateFn(Lm),s=survFn(Lm);
  document.getElementById('stLen').innerHTML=Lm.toFixed(0)+'<small> cm</small>';
  document.getElementById('stMate').innerHTML=(m*100).toFixed(0)+'<small> %</small>';
  const sEl=document.getElementById('stSur');
  sEl.innerHTML=(s*100).toFixed(0)+'<small> %</small>';
  sEl.className='v '+(s<0.55?'warn':'');
  const fEl=document.getElementById('stFit');
  fEl.innerHTML=(m*s).toFixed(2)+'<small> ×</small>';
  fEl.className='v '+(m*s>0.42?'ok':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bOpen').addEventListener('click',()=>setMode('open'));
document.getElementById('bFold').addEventListener('click',()=>setMode('fold'));
document.getElementById('sLen').addEventListener('input',e=>setLen(+e.target.value));
document.getElementById('sPref').addEventListener('input',e=>setPref(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglPred').addEventListener('change',e=>setPred(e.target.checked));

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0e1310:0xe6ebe0);
  scene.fog.color.setHex(dark?0x0e1310:0xe6ebe0);
  groundM.color.setHex(dark?0x18201a:0xc9d2bd);
  histM.color.setHex(dark?0x12b886:0x087f5b);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  /* ── 代际演化:约 1.2 s 一代 ── */
  genAcc+=dts/1.2;
  while(genAcc>=1){genAcc-=1;evolve();}
  /* ── 羽屏:长度缩放 + 开合动画 ── */
  const sc=len/160*1.5;
  const tSpread=mode==='open'?1:0.12;
  const tTilt=mode==='open'?-0.22:-1.15;
  spread+=(tSpread-spread)*Math.min(1,dts*3);
  tilt+=(tTilt-tilt)*Math.min(1,dts*3);
  trainG.rotation.x=tilt;
  feathers.forEach((g,i)=>{
    g.rotation.z=spread*(i/(FE-1)-0.5)*1.85+0.015*Math.sin(performance.now()/700+i);
    g.scale.setScalar(sc);
    g.rotation.y=Math.sin(i*2.1)*0.06*spread;
  });
  body.rotation.z=0.03*Math.sin(performance.now()/900);
  if(predG.visible)predG.position.y=0.04*Math.abs(Math.sin(performance.now()/300));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.25){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setLen(95);setPref(1);setPred(false);
updateHist();
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
