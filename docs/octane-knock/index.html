<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>辛烷值与爆震 · 一缸不容两把火</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ff6b6b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(201,42,42,.55);background:rgba(201,42,42,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(201,42,42,.08);border-color:rgba(201,42,42,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc9c9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="辛烷值与爆震" data-en="Octane Rating &amp; Knock">辛烷值与爆震</h1>
  <div class="sub" data-zh="火花塞点燃一张火焰面正常扫缸;压缩比一高,末端混合气被压热,火焰未到就自燃——两道火对撞,压力锯齿振荡,这就是敲缸。高辛烷值的支链结构更难过自由基链式自燃,标号就是抗爆成绩单:异辛烷=100、正庚烷=0 · 拖动旋转 / 空格运行/暂停" data-en="One flame front sweeps the cylinder; push compression too far and the end gas self-ignites before the flame arrives — twin fronts collide, pressure sawtooths: knock. Branched isooctane resists chain-ignition, so octane rating is the anti-knock report card: isooctane = 100, n-heptane = 0 · drag to orbit / Space = run/pause">火花塞点燃一张火焰面正常扫缸;压缩比一高,末端混合气被压热,火焰未到就自燃——两道火对撞,压力锯齿振荡,这就是敲缸。高辛烷值的支链结构更难过自由基链式自燃,标号就是抗爆成绩单:异辛烷=100、正庚烷=0 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="末端温度" data-en="End-gas T">末端温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="爆震强度" data-en="Knock">爆震强度</span><span class="v" id="stK">—</span>
  <span class="k" data-zh="动力输出" data-en="Power">动力输出</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="火焰传播进度" data-en="Flame">火焰传播进度</span><span class="v" id="stF">—</span>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bReset" data-zh="🔄 复位" data-en="🔄 Reset">🔄 复位</button>
    <button class="abtn on" id="bSafe" data-zh="🛡 稳态 92#" data-en="🛡 Safe 92 RON">🛡 稳态 92#</button>

  <div class="row">
    <label data-zh="压缩比" data-en="Compression">压缩比</label>
    <input id="sCR" type="range" min="6" max="13" step="0.1" value="9">

  <div class="row">

    <input id="sRPM" type="range" min="600" max="3000" step="50" value="1200">
    <span class="val" id="sRPMVal">1200</span>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglWave" type="checkbox" checked> <span data-zh="压力波形" data-en="Pressure wave">压力波形</span></label>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../four-stroke-engine/" data-zh="四冲程引擎" data-en="Four-Stroke Engine">四冲程引擎</a>
    <a href="../diesel-engine/" data-zh="柴油机" data-en="Diesel Engine">柴油机</a>
    <a href="../premixed-flame/" data-zh="预混火焰" data-en="Premixed Flame">预混火焰</a>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,72);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(6.6,4.3,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.15,2.35,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.3;scene.add(ground);

/* ---- 发动机几何常量 ---- */
const RB=0.85,RC=1.1,LROD=2.2,STROKE=2*RC,CROWN=0.34;
const PIN_TDC=LROD+RC,PIN_BDC=LROD-RC,GAM=1.35,D2R=Math.PI/180;
const m4=new THREE.Matrix4();
const pinY=th=>{const s=Math.sin(th);return RC*Math.cos(th)+Math.sqrt(LROD*LROD-RC*RC*s*s);};
const pistFrac=deg=>(pinY(deg*D2R)-PIN_BDC)/(PIN_TDC-PIN_BDC);

/* ---- 状态(先声明,几何随滑杆摆位) ---- */
let CR=9,ON=92,RPM=1200;
let playing=true,labelsOn=true,slowMo=false,waveOn=true;
let cyc=0.30,simT=0;
let knockCyc=false,tauK=9,tauC=9,intensity=0,xbK=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const headYof=()=>PIN_TDC+CROWN+STROKE/(CR-1);

/* ---- 材质 ---- */
const M={
  steel:new THREE.MeshStandardMaterial({color:0xb9c2cc,metalness:0.85,roughness:0.35}),
  dark:new THREE.MeshStandardMaterial({color:0x4a525e,metalness:0.7,roughness:0.5}),
  alu:new THREE.MeshStandardMaterial({color:0xd7dde4,metalness:0.8,roughness:0.32}),
  ceramic:new THREE.MeshStandardMaterial({color:0xe8e2d4,metalness:0.1,roughness:0.55}),
  liner:new THREE.MeshStandardMaterial({color:0x9fc0d8,transparent:true,opacity:0.14,
    depthWrite:false,metalness:0.4,roughness:0.3,side:THREE.DoubleSide}),
  headM:new THREE.MeshStandardMaterial({color:0x9fb4c8,transparent:true,opacity:0.24,
    depthWrite:false,metalness:0.5,roughness:0.35,side:THREE.DoubleSide}),
};

/* ---- 发动机主体(爆震时整体抖动) ---- */
const engineGrp=new THREE.Group();scene.add(engineGrp);
/* 底座与轴承 */
{
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.28,2.0),M.dark);
  base.position.y=-1.16;engineGrp.add(base);
  for(const z of [-0.62,0.62]){
    const ped=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.9,0.16),M.dark);
    ped.position.set(0,-0.57,z);engineGrp.add(ped);
  }
}
/* 曲轴 */
const crankGrp=new THREE.Group();engineGrp.add(crankGrp);
{
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.6,16),M.steel);
  shaft.rotation.x=Math.PI/2;crankGrp.add(shaft);
  const web=new THREE.Mesh(new THREE.BoxGeometry(0.32,RC+0.25,0.16),M.steel);
  web.position.y=RC/2;crankGrp.add(web);
  const cw=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.18,24),M.dark);
  cw.rotation.x=Math.PI/2;cw.position.y=-0.4;crankGrp.add(cw);
  const cpin=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.4,12),M.steel);
  cpin.rotation.x=Math.PI/2;cpin.position.y=RC;crankGrp.add(cpin);
}
/* 连杆与活塞 */
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,12),M.steel);engineGrp.add(rod);
const piston=new THREE.Group();engineGrp.add(piston);
{
  const body=new THREE.Mesh(new THREE.CylinderGeometry(RB-0.03,RB-0.03,0.56,36),M.alu);
  body.position.y=-0.02;piston.add(body);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(RB-0.02,0.014,8,40),M.dark);
  ring.rotation.x=Math.PI/2;ring.position.y=0.24;piston.add(ring);
}
/* 缸套(剖视半透明) */
const liner=new THREE.Mesh(new THREE.CylinderGeometry(RB,RB,3.1,40,1,true),M.liner);
liner.position.y=2.25;liner.renderOrder=4;engineGrp.add(liner);
/* 缸盖(随压缩比上下:间隙=行程/(CR-1),压缩比可视化) */
const headGrp=new THREE.Group();engineGrp.add(headGrp);
{
  const block=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.52,1.9),M.headM);
  block.position.y=0.26;block.renderOrder=4;headGrp.add(block);
  /* 火花塞(偏置 -x:火焰从这里出发) */
  const hex=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.09,12),M.steel);
  hex.position.set(-0.38,0.56,0);headGrp.add(hex);
  const ins=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.055,0.42,12),M.ceramic);
  ins.position.set(-0.38,0.82,0);headGrp.add(ins);
  const elec=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.14,8),M.steel);

/* ---- 燃烧物理:压缩比 × 辛烷值 × 转速 → 火焰到达 vs 自燃延迟 ---- */
const reachOf=()=>0.115*(2000/(2000+RPM*0.6));
function dAutoOf(){
  const T=300*Math.pow(CR,0.35);
  return 7.8e-4*Math.exp(2900/T)*(0.5+ON*0.019);
}
function calcCycle(){
  const reach=reachOf(),d=dAutoOf();
  knockCyc=d<reach;
  tauK=0.5+d;tauC=tauK+0.006;
  xbK=Math.pow(clamp(d/reach,0,1),1.5);
  intensity=knockCyc?clamp((1-xbK)*(0.55+0.45*reach/d),0,1):0;
}
function xbOf(tau){
  if(tau<0.5)return 0;
  const p1=(tau-0.5)/reachOf();
  if(!knockCyc)return clamp(Math.pow(p1,1.6),0,1);
  if(tau<tauK)return clamp(Math.pow(p1,1.6),0,xbK);
  return xbK+(1-xbK)*clamp((tau-tauK)/0.012,0,1);
}
function pressAt(tau){
  const th=tau*720;
  let p;
  if(th<180)p=0.95;
  else if(th<540){
    const s=pistFrac(th);
    p=0.95*Math.pow(CR/(1+(CR-1)*(1-s)),GAM);
    if(th>=360)p*=1+3.4*xbOf(tau);
  }else{
    p=1.15+2.05*Math.exp(-(th-540)/22);
  }
  if(knockCyc&&tau>tauK){
    const dt=tau-tauK,env=Math.exp(-dt/0.028),saw=dt*46-Math.floor(dt*46);
    p*=1+1.3*intensity*env*saw;
  }
  if(knockCyc&&tau>tauC)p*=1+0.9*intensity*Math.exp(-(tau-tauC)/0.005);
  return Math.min(p,170);
}
const yOf=p=>(Math.log(clamp(p,0.8,170))-Math.log(0.8))/(Math.log(170)-Math.log(0.8));
function refillTrace(){for(let i=0;i<NB;i++)pBuf[i]=pressAt((i+0.5)/NB);}
function drawTrace(){
  const pos=traceGeo.attributes.position;
  for(let i=0;i<NB;i++)pos.setXYZ(i,-1.55+i*3.1/(NB-1),-0.88+yOf(pBuf[i])*1.76,0.045);
  pos.needsUpdate=true;
}
const pEndAt=tau=>Math.max(300,300*Math.pow(pressAt(tau)/0.95,0.35));

/* ---- 每帧更新 ---- */
const c1=new THREE.Vector3(),c2=new THREE.Vector3(),pc=new THREE.Vector3();
const cU=new THREE.Color(0x7fb0ff),cR=new THREE.Color(0xff5252),cB=new THREE.Color(0xffab66),
  cW=new THREE.Color(0xfff2d0),cT=new THREE.Color();
let prevHit=false,collT=-9;
function updateWorld(dts){
  const tau=((cyc%1)+1)%1;
  calcCycle();
  const th=tau*720,rad=th*D2R;
  const HY=headYof(),py=pinY(rad),crownY=py+CROWN,gasH=Math.max(0.02,HY-crownY);
  curTau=tau;
  /* 曲轴 / 连杆 / 活塞 */
  crankGrp.rotation.z=-rad;
  piston.position.y=py;
  const px=RC*Math.sin(rad),pyc=RC*Math.cos(rad);
  const dx=-px,dy=py-pyc,len=Math.sqrt(dx*dx+dy*dy);
  rod.position.set(px+dx/2,pyc+dy/2,0);
  rod.scale.y=len/LROD;
  rod.rotation.z=Math.atan2(dx,dy);
  /* 缸内工质与末端罩 */
  gasMesh.scale.y=gasH;gasMesh.position.y=(crownY+HY)/2;
  const Tend=pEndAt(tau),heatK=clamp((Tend-450)/650,0,1);
  const xb=xbOf(tau),reach=reachOf();
  const p1=tau>0.5?(tau-0.5)/reach:0;
  endHot=heatK>0.35&&xb<0.9;
  const endH=gasH*clamp(1-xb*0.92,0,1);
  endMesh.scale.y=Math.max(endH,0.001);endMesh.position.y=HY-endH/2;
  endMat.color.lerpColors(new THREE.Color(0x5a6cff),new THREE.Color(0xff4444),heatK);
  endMat.opacity=clamp(0.10+0.42*heatK,0,0.5)*smooth(0.97,0.8,xb);
  /* 火焰球与两张火焰面 */
  c1.set(-0.38,HY-0.10,0);c2.set(0.52,(crownY+HY)/2,0);
  const R1=1.30*clamp(p1,0,1),flameAlive=p1>0.005&&p1<1.04;
  flameOn=flameAlive;
  ball1.position.copy(c1);ball1.scale.setScalar(Math.max(R1,0.001));
  ballMat.opacity=flameAlive?0.3*clamp(p1*8,0,1)*(1-smooth(0.85,1.02,p1)):0;
  const R2=knockCyc&&tau>tauK?Math.min((tau-tauK)/0.010,1)*1.1:0;
  const dist12=c1.distanceTo(c2);
  const hit=R2>0&&R1+R2>=dist12;
  if(hit&&!prevHit)collT=simT;
  prevHit=hit;curHit=hit;curHitAge=simT-collT;
  pc.copy(c1).lerp(c2,R1/(R1+R2));
  ball2.position.copy(c2);ball2.scale.setScalar(Math.max(R2,0.001));
  ball2.material.opacity=R2>0?0.42:0;
  for(let i=0;i<NFL;i++){
    const half=i<NHALF?i:i-NHALF;
    const useR=i<NHALF?R1:R2,cxx=i<NHALF?c1.x:c2.x,cyy=i<NHALF?c1.y:c2.y;
    const on=(i<NHALF?flameAlive:R2>0)?1:0.0001;
    const rr=Math.max(useR*(0.96+0.05*Math.sin(half*3.1+simT*22)),0.001)*on;
    m4.makeScale(on,on,on);
    m4.setPosition(cxx+dirs[half*3]*rr,cyy+dirs[half*3+1]*rr,dirs[half*3+2]*rr);
    flameP.setMatrixAt(i,m4);
  }
  flameP.instanceMatrix.needsUpdate=true;
  /* 火花 / 燃烧光 / 对撞闪光 */
  const spark=tau>0.5?clamp(1-(tau-0.5)/0.012,0,1):0;
  sparkM.position.set(-0.38,HY-0.06,0);
  sparkM.material.opacity=spark;
  sparkM.scale.setScalar(0.7+spark);
  burnLight.position.copy(c1);burnLight.intensity=spark*6+xb*4;
  knockF.position.copy(pc);knockL.position.copy(pc);
  const kf=hit?clamp(1-curHitAge/0.12,0,1):0;
  knockF.material.opacity=kf*0.9;knockF.scale.setScalar(0.5+(1-kf)*1.4);
  knockL.intensity=kf*9;
  /* 分子热运动:速度∝√T,撞壁反弹,火焰扫过变橙 */
  const vBase=0.35+1.7*heatK;
  const botY=crownY+0.06,topY=HY-0.05,rmax=RB-0.12;
  for(let i=0;i<NMOL;i++){
    const j=i*3;
    const sp=(mburn[i]?vBase*1.3:vBase)*dts;
    let x=mpx[j]+mvx[j]*sp,y=mpx[j+1]+mvx[j+1]*sp,z=mpx[j+2]+mvx[j+2]*sp;
    if(y>topY){y=topY-(y-topY);mvx[j+1]=-Math.abs(mvx[j+1]);}
    if(y<botY){y=botY+(botY-y);mvx[j+1]=Math.abs(mvx[j+1]);}
    const rr2=x*x+z*z;
    if(rr2>rmax*rmax){
      const rl=Math.sqrt(rr2),nx=x/rl,nz=z/rl;
      x=nx*rmax;z=nz*rmax;
      const dot=mvx[j]*nx+mvx[j+2]*nz;
      if(dot>0){mvx[j]-=2*dot*nx;mvx[j+2]-=2*dot*nz;}
    }
    mpx[j]=x;mpx[j+1]=y;mpx[j+2]=z;
    const d1x=x-c1.x,d1y=y-c1.y,d1z=z-c1.z;
    if(!mburn[i]&&(d1x*d1x+d1y*d1y+d1z*d1z<R1*R1||(R2>0&&
      (x-c2.x)**2+(y-c2.y)**2+(z-c2.z)**2<R2*R2)))mburn[i]=1;
    if(mburn[i])cT.copy(cB);
    else{
      cT.lerpColors(cU,cR,heatK);
      if(heatK>0.75)cT.lerp(cW,(heatK-0.75)*3*Math.abs(Math.sin(simT*26+i)));
    }
    mols.setColorAt(i,cT);
    m4.makeTranslation(x,y,z);
    mols.setMatrixAt(i,m4);
  }
  mols.instanceMatrix.needsUpdate=true;
  if(mols.instanceColor)mols.instanceColor.needsUpdate=true;
  /* 压力波形 */
  pBuf[Math.min(NB-1,Math.floor(tau*NB))]=pressAt(tau);
  drawTrace();
  /* 爆震抖缸 */
  const env=knockCyc&&tau>tauK?Math.exp(-(tau-tauK)/0.05):0;
  curEnv=env;
  engineGrp.position.x=0.05*intensity*env*Math.sin(simT*90);
  engineGrp.position.z=0.03*intensity*env*Math.cos(simT*77);
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,statT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dt;
  cyc+=dts*RPM/960;
  updateWorld(dts);
  statT+=dt;
  if(statT>0.2){statT=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
trace.visible=waveOn;
headGrp.position.y=headYof();
applyTheme();buildSteps();
calcCycle();refillTrace();syncPresets();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
