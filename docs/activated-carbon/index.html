<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>活性炭 · 把分子抓进一克上千平米的孔洞</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);

    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}

    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="活性炭 · 把分子抓进一克上千平米的孔洞" data-en="Activated Carbon · a gram of sponge with 1000 m² of walls">活性炭 · 把分子抓进一克上千平米的孔洞</h1>
  <div class="sub" data-zh="活化造孔让一克炭摊开约 1000 m²;孔壁范德华力按 Langmuir 等温线 q=q_max·bC/(1+bC) 抓住染料分子,微孔里两面夹击抓得更牢;吸附放热,升温即脱附可再生;过滤时「吸附带」像前线向下游推进,到达出口=穿透,出水变浑就该换芯 · 拖动旋转 / 空格运行/暂停" data-en="Activation carves ~1000 m² of pore wall per gram; van der Waals grabs dye molecules following the Langmuir isotherm q=q_max·bC/(1+bC), and micropores squeeze from both walls; adsorption releases heat, so heating regenerates the bed; in service the adsorption band marches downstream until it breaks through — then change the cartridge · drag to orbit / Space = run/pause">活化造孔让一克炭摊开约 1000 m²;孔壁范德华力按 Langmuir 等温线 q=q_max·bC/(1+bC) 抓住染料分子,微孔里两面夹击抓得更牢;吸附放热,升温即脱附可再生;过滤时「吸附带」像前线向下游推进,到达出口=穿透,出水变浑就该换芯 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 / 参数 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let SPEED=1;{const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))SPEED=clamp(v,0.3,2.5);}
const $=id=>document.getElementById(id);
const tglLabelsEl=$('tglLabels'),tglFlowEl=$('tglFlow'),tglMicroEl=$('tglMicro');

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-4.8,4.6,9.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.4,2.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 状态 ---- */
const QMAX=320;                 // Langmuir 饱和吸附量 mg/g
const N=20;                     // 柱内分 20 个单元(LDF 模型)
const sat=new Float64Array(N);  // 每单元饱和度 0..1
const cRel=new Float64Array(N+1);cRel[0]=1; // 相对浓度级联
let tempC=25,flow=0.8,cin=80;
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let breakthrough=false,occCount=0,simT=0;

/* ---- 材质 ---- */
const baseM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const pipeM=new THREE.MeshStandardMaterial({color:0x8a93a3,metalness:0.7,roughness:0.35});
const glassM=new THREE.MeshPhysicalMaterial({color:0xbfd8e8,transparent:true,opacity:0.1,
  roughness:0.15,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const cDry=new THREE.Color(0x2a2f36),cWet=new THREE.Color(0x3f7fd0),cClean=new THREE.Color(0xd7e6f2),cTmp=new THREE.Color();

/* ---- 底座 ---- */
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,0.14,48),baseM);
base.position.set(0.9,0.07,0.4);scene.add(base);

/* ---- 炭柱 ---- */
const colX=0.9,Y0=0.55,Y1=4.35,COL_R=0.42,cellH=(Y1-Y0)/N;
const shell=new THREE.Mesh(new THREE.CylinderGeometry(COL_R,COL_R,Y1-Y0+0.25,28,1,true),glassM);
shell.position.set(colX,(Y0+Y1)/2,0);scene.add(shell);
/* 炭粒(InstancedMesh,随所在单元饱和度染色) */
const carbM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.85,metalness:0.05});
const NG=420;
const carb=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),carbM,NG);
const carbCell=new Int16Array(NG);
{
  const m4=new THREE.Matrix4();let ng=0;
  for(let y=Y0+0.07;y<Y1-0.05&&ng<NG;y+=0.098){
    for(let a=0;a<6&&ng<NG;a++){for(let r=0;r<2&&ng<NG;r++){
      const ang=a*1.047+r*0.523+(y*13)%1;const rr=0.1+r*0.14;
      m4.setPosition(colX+Math.cos(ang)*rr,y,Math.sin(ang)*rr);
      carb.setMatrixAt(ng,m4);carbCell[ng]=clamp(Math.floor((Y1-y-0.001)/cellH),0,N-1);ng++;
    }}
  }
  carb.count=ng;scene.add(carb);
}
function tintGranules(){
  for(let i=0;i<carb.count;i++){
    cTmp.copy(cDry).lerp(cWet,sat[carbCell[i]]*0.9);
    carb.setColorAt(i,cTmp);
  }
  carb.instanceColor.needsUpdate=true;
}
/* 液体颜色按单元浓度分层 */
const liqMats=[];
for(let i=0;i<N;i++){
  const m=new THREE.MeshBasicMaterial({color:0x3f7fd0,transparent:true,opacity:0.06,depthWrite:false});
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(COL_R-0.05,COL_R-0.05,cellH*0.96,22),m);
  mesh.position.set(colX,Y1-(i+0.5)*cellH,0);scene.add(mesh);liqMats.push(m);
}
/* 吸附带前沿标记环 */
const bandRing=new THREE.Mesh(new THREE.TorusGeometry(0.47,0.018,8,40),
  new THREE.MeshBasicMaterial({color:0xffc078,transparent:true,opacity:0.85}));
bandRing.rotation.x=Math.PI/2;bandRing.visible=false;scene.add(bandRing);
/* 进水管与出水管、接水杯 */
const inlet=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,0.6,12),pipeM);
inlet.position.set(colX,Y1+0.42,0);scene.add(inlet);
const spout=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.9,10),pipeM);
spout.rotation.x=Math.PI/2;spout.position.set(colX,0.6,0.62);scene.add(spout);
const dropPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.28,10),pipeM);
dropPipe.position.set(colX,0.47,1.05);scene.add(dropPipe);
const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.26,0.55,24,1,true),glassM);
cup.position.set(colX,0.42,1.3);scene.add(cup);
const cupLiqM=new THREE.MeshBasicMaterial({color:0xd7e6f2,transparent:true,opacity:0.55,depthWrite:false});
const cupLiq=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.23,0.32,20),cupLiqM);
cupLiq.position.set(colX,0.3,1.3);scene.add(cupLiq);

/* ---- 微孔放大镜:一颗放大的炭粒 ---- */
const microG=new THREE.Group();microG.position.set(-3.2,2.6,0);scene.add(microG);
const microBase=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.7,0.12,36),baseM);
microBase.position.y=-1.55;microG.add(microBase);
const grain=new THREE.Mesh(new THREE.SphereGeometry(1.18,40,28),
  new THREE.MeshStandardMaterial({color:0x262b31,roughness:0.9,metalness:0.05}));
microG.add(grain);
const SITES=22,NPORE=96;
const dirs=[];{const ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<NPORE;i++){const y=1-(i/(NPORE-1))*2;const r=Math.sqrt(Math.max(0,1-y*y));
    const th=ga*i;dirs.push(new THREE.Vector3(Math.cos(th)*r,y,Math.sin(th)*r));}}
{
  const poreM=new THREE.MeshStandardMaterial({color:0x0b0d10,roughness:0.95});
  const pores=new THREE.InstancedMesh(new THREE.SphereGeometry(0.11,8,6),poreM,NPORE);
  const m4=new THREE.Matrix4();
  for(let i=0;i<NPORE;i++){m4.setPosition(dirs[i].x*1.16,dirs[i].y*1.16,dirs[i].z*1.16);pores.setMatrixAt(i,m4);}
  microG.add(pores);
}
const mols=new THREE.InstancedMesh(new THREE.SphereGeometry(0.085,8,6),
  new THREE.MeshBasicMaterial({color:0x5fa8ff}),SITES);
microG.add(mols);
const molState=new Array(SITES).fill(0);   // 0空 1飞入 2吸附 3脱出
const molT=new Array(SITES).fill(0);
const molStart=dirs.map(d=>d.clone().multiplyScalar(3.1));
let molTimer=0;
const mm4=new THREE.Matrix4(),v3a=new THREE.Vector3(),v3b=new THREE.Vector3();
function updMols(dt){
  const hot=clamp((tempC-55)/35,0,1);   // 高温:脱附占上风
  molTimer-=dt;
  if(molTimer<=0){
    const empty=[];for(let i=0;i<SITES;i++)if(molState[i]===0)empty.push(i);
    if(empty.length&&hot<1){const i=empty[(Math.random()*empty.length)|0];molState[i]=1;molT[i]=0;}
    molTimer=0.3;
  }
  occCount=0;
  for(let i=0;i<SITES;i++){
    if(molState[i]===2){occCount++;
      if(Math.random()<dt*(hot*0.9+0.015))molState[i]=3,molT[i]=0;
    }else if(molState[i]===1){molT[i]+=dt/1.4;if(molT[i]>=1)molState[i]=2;}
    else if(molState[i]===3){molT[i]+=dt/1.1;if(molT[i]>=1)molState[i]=0;}
  }
  for(let i=0;i<SITES;i++){
    const d=dirs[i];let s=0;
    if(molState[i]===1){const t=molT[i];v3a.copy(molStart[i]).lerp(v3b.copy(d).multiplyScalar(1.24),t);s=0.3+0.7*t;}
    else if(molState[i]===2){v3a.copy(d).multiplyScalar(1.24);s=1+0.1*Math.sin(simT*5+i);}
    else if(molState[i]===3){const t=molT[i];v3a.copy(d).multiplyScalar(1.24+t*1.9);s=Math.max(0,1-t);}
    if(s===0){mm4.makeScale(0,0,0);}else{mm4.makeScale(s,s,s);mm4.setPosition(v3a.x,v3a.y,v3a.z);}
    mols.setMatrixAt(i,mm4);
  }
  mols.instanceMatrix.needsUpdate=true;
}

/* ---- 进/出水粒子 ---- */
const inG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),
  new THREE.MeshBasicMaterial({color:0x3f7fd0}),10);scene.add(inG);
const outG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),
  new THREE.MeshBasicMaterial({color:0xd7e6f2}),10);scene.add(outG);
const pm4=new THREE.Matrix4();
function updFlow(){
  if(!tglFlowEl.checked){inG.count=0;outG.count=0;return;}
  for(let i=0;i<10;i++){
    const t=(simT*(0.25+flow*0.22)+i/10)%1;
    pm4.setPosition(colX+Math.sin(i*7)*0.05,Y1+0.95-t*0.95,Math.cos(i*5)*0.05);
    inG.setMatrixAt(i,pm4);
    const u=(simT*(0.5+flow*0.3)+i/10)%1;let x,y,z;
    if(u<0.7){const k=u/0.7;x=colX;y=0.6-0.02*k;z=0.15+k*0.8;}
    else{const k=(u-0.7)/0.3;x=colX;y=0.58-k*0.2;z=0.95+k*0.25;}
    pm4.setPosition(x,y,z);outG.setMatrixAt(i,pm4);
  }
  inG.count=10;outG.count=10;
  inG.instanceMatrix.needsUpdate=true;outG.instanceMatrix.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('进水:染料浓度 C₀','inlet: dye at C₀'),new THREE.Vector3(colX+0.05,Y1+0.95,0),'o');
const lblMicro=addLabel(()=>L('活性炭微孔:~1000 m²/g,孔壁=吸附面','activated carbon pores: ~1000 m²/g of wall'),
  new THREE.Vector3(-3.2,4.55,0),'b',()=>tglMicroEl.checked);
addLabel(()=>L(`已占位点 ${occCount}/22 — 占满即 Langmuir 饱和`,
    `sites filled ${occCount}/22 — full = Langmuir saturation`),
  new THREE.Vector3(-3.2,0.75,0),'y',()=>tglMicroEl.checked);
const lblBand=addLabel(()=>L('吸附带:上游已饱和,下游还干净','adsorption band: spent upstream, clean downstream'),
  new THREE.Vector3(colX+1.15,Y0+1.6,0),'r',()=>bandFrac()>0.05);
addLabel(()=>L('出水达标:穿透阈值 C/C₀ = 5%','effluent OK: breakthrough limit C/C₀ = 5%'),
  new THREE.Vector3(colX+0.6,0.95,1.3),'g',()=>!breakthrough);
addLabel(()=>L('穿透!出水变浑,该换芯了','breakthrough! effluent turns dirty — swap the cartridge'),
  new THREE.Vector3(colX+0.6,0.95,1.3),'r',()=>breakthrough);

/* ---- 物理模型 ---- */
function phys(dt){
  const TK=tempC+273.15;
  const b=0.045*Math.exp(4800*(1/TK-1/298.15));  // 范德华亲和系数,van't Hoff 温度修正
  for(let i=0;i<N;i++){
    const c=cRel[i];
    const qeq=b*c/(1+b*c);                        // Langmuir 平衡占据率
    const KL=0.22*(0.45+0.55*c)*(0.55+0.30*flow); // 线性推动力传质系数
    sat[i]=clamp(sat[i]+KL*(qeq-sat[i])*dt,0,1);
  }
  for(let i=0;i<N;i++)cRel[i+1]=cRel[i]*(1-0.38*sat[i]);
}
function resetBed(){sat.fill(0);cRel.fill(0);cRel[0]=1;breakthrough=false;}
function preloadBed(f0){
  for(let i=0;i<N;i++)sat[i]=Math.max(0.03,1/(1+Math.exp(-(i-f0*N)*0.7)));
  breakthrough=false;
}
function bandFrac(){let f=0;for(let i=0;i<N;i++)if(sat[i]>0.5)f=(i+1)/N;return f;}
function avgSat(){let a=0;for(let i=0;i<N;i++)a+=sat[i];return a/N;}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'活化造孔:一克炭摊开约 1000 m²,孔洞是分子的仓库',en:'Activation carves pores: 1 g spreads to ~1000 m² of wall'},
 {zh:'孔壁范德华力抓分子;微孔里两面夹击,抓得更牢',en:'van der Waals grabs molecules; micropores squeeze from both walls'},
 {zh:'Langmuir 等温线 q=q_max·bC/(1+bC):位点占满即饱和',en:'Langmuir isotherm q=q_max·bC/(1+bC): sites fill, then saturate'},
 {zh:'吸附放热:升温让分子脱附,85 °C 热再生',en:'Adsorption releases heat: warm up and molecules leave — regeneration'},
 {zh:'动态吸附:吸附带像前线一样向下游推进',en:'In service the adsorption band marches downstream'},
 {zh:'带前沿到出口 = 穿透(出水超 5%),该换芯了',en:'Front reaches the outlet = breakthrough: change the cartridge'}
];
let activeStep=1;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;
  if(i===0){setC(80);setQ(0.8);setT(25);resetBed();}
  else if(i===1){setC(80);setQ(0.4);setT(25);resetBed();}
  else if(i===2){setC(150);setQ(0.6);setT(25);resetBed();}
  else if(i===3){setC(80);setQ(0.5);setT(86);preloadBed(0.45);}
  else if(i===4){setC(120);setQ(1.3);setT(25);resetBed();}
  else{setC(170);setQ(2.2);setT(25);preloadBed(0.5);}
  syncSteps();
}

/* ---- 滑杆 ---- */
function setC(v){cin=v;$('sC').value=v;$('sCVal').textContent=v.toFixed(0)+' mg/L';}
function setQ(v){flow=v;$('sQ').value=v;$('sQVal').textContent=v.toFixed(1)+' L/min';}
function setT(v){tempC=v;$('sT').value=v;$('sTVal').textContent=v.toFixed(0)+' °C';}

/* ---- 读数 ---- */
function updateStats(){
  const avg=avgSat();
  $('stQ').innerHTML=(QMAX*avg).toFixed(0)+'<small> mg/g</small>';
  const outPct=cRel[N]*100;
  breakthrough=outPct>5;
  const oe=$('stOut');oe.innerHTML=outPct.toFixed(1)+'<small> %</small>';
  oe.className='v'+(breakthrough?' warn':(outPct<2?' ok':''));
  $('stBand').innerHTML=(bandFrac()*100).toFixed(0)+'<small> %</small>';
  $('stCap').innerHTML=(avg*100).toFixed(0)+'<small> %</small>';
}

/* ---- 控件事件 ---- */
$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
$('bPurifier').addEventListener('click',()=>{setC(20);setQ(0.5);setT(25);resetBed();});
$('bMask').addEventListener('click',()=>{setC(280);setQ(1.8);setT(25);resetBed();});
$('bRegen').addEventListener('click',()=>{setC(80);setQ(0.5);setT(88);if(avgSat()<0.3)preloadBed(0.45);});
$('sC').addEventListener('input',e=>setC(+e.target.value));
$('sQ').addEventListener('input',e=>setQ(+e.target.value));
$('sT').addEventListener('input',e=>setT(+e.target.value));

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  baseM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('活性炭 · 把分子抓进一克上千平米的孔洞','Activated Carbon Adsorption');
  buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const raw=clamp(clock.getDelta(),0,0.05);
  const dt=playing?raw*SPEED:0;
  simT+=raw;
  phys(dt);updMols(dt);updFlow();
  /* 液体颜色分层 = 浓度级联 */
  for(let i=0;i<N;i++){
    const c=cRel[i];liqMats[i].opacity=0.06+0.5*Math.min(1,c*1.5);
  }
  /* 吸附带前沿环 */
  const bf=bandFrac();
  bandRing.visible=bf>0.03&&bf<0.99;
  bandRing.position.set(colX,Y1-bf*(Y1-Y0),0);
  lblBand.position.y=Y1-bf*(Y1-Y0)+0.1;
  /* 出水颜色 */
  cTmp.copy(cClean).lerp(cWet,cRel[N]*1.2);
  cupLiqM.color.copy(cTmp);outG.material.color.copy(cTmp);
  microG.visible=tglMicroEl.checked;
  acc+=raw;
  if(acc>0.12){acc=0;updateStats();tintGranules();}
  for(const r of labelReg){const vis=labelsOn&&r.vis();r.o.visible=vis;if(vis)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();
buildSteps();
applyLang();
setC(80);setQ(0.8);setT(25);resetBed();
const t0=Math.round(parseFloat(qs.get('t')));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
if(qs.get('pause')==='1')playing=false;
$('tglLabels').checked=labelsOn;
tintGranules();updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
