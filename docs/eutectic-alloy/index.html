<!DOCTYPE html>

<title>共晶与合金相图 · 纯金属走平台,共晶点熔点最低</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }

  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,0.1,200);
camera.position.set(1.5,4.3,13.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,2.55,-0.3);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── Pb-Sn 相图数据(真实值:纯Pb 327.5°C,纯Sn 231.9°C,共晶 183°C/61.9%Sn,
      183°C 时 α 最多溶 18.3%Sn、β 最多溶 2.2%Pb;液相线取直线化教学画法) ── */
const T_PB=327.5,T_SN=231.9,T_EU=183,X_EU=61.9,X_A=18.3,X_B=97.8;
const TLl=x=>T_PB-(T_PB-T_EU)*x/X_EU;                 /* 左液相线 */
const TLr=x=>T_SN-(T_SN-T_EU)*(100-x)/(100-X_EU);     /* 右液相线 */
const TSl=x=>T_PB-(T_PB-T_EU)*x/X_A;                  /* 左固相线 */
const xSvL=T=>X_A-(X_A-2)*(T_EU-T)/(T_EU-100);        /* α 溶解度线(183→100°C) */
const xSvR=T=>99.4+(X_B-99.4)*(T-100)/(T_EU-100);     /* β 溶解度线 */
const xSdR=T=>X_B+(100-X_B)*(T-T_EU)/(T_SN-T_EU);     /* 右固相线(β) */
function phaseOf(x,T){
  if(x<=0.5)return T>=T_PB?'L':'a';
  if(x>=99.5)return T>=T_SN?'L':'b';
  const TL=x<X_EU?TLl(x):TLr(x);
  if(T>=TL)return 'L';
  if(T>=T_EU)return x<X_EU?'aL':'Lb';
  if(x<2.5)return 'a';
  if(x>97.5)return 'b';
  return 'ab';
}
function liquidFrac(x,T){
  const ph=phaseOf(x,T);
  if(ph==='L')return 1;
  if(T<T_EU)return 0;
  if(x<X_EU){const xs=(T_PB-T)*X_A/(T_PB-T_EU),xl=(T_PB-T)*X_EU/(T_PB-T_EU);
    return clamp((x-xs)/(xl-xs),0,1);}
  const xl=100-(T-T_EU)*(100-X_EU)/(T_SN-T_EU),xb=xSdR(T);
  return clamp((xl-x)/(xl-xb),0,1);
}

/* ── 场景:竖立的相图板(z=-2.35),板前坩埚 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const boardG=new THREE.Group();boardG.position.set(1.25,0,-2.35);scene.add(boardG);
const boardM=new THREE.MeshStandardMaterial({color:0x232a36,roughness:0.85});
const board=new THREE.Mesh(new THREE.BoxGeometry(7.4,4.5,0.14),boardM);
board.position.set(0,2.8,0);boardG.add(board);
const boardEdge=new THREE.LineSegments(new THREE.EdgesGeometry(board.geometry),
  new THREE.LineBasicMaterial({color:0x54607a,transparent:true,opacity:0.7}));
boardEdge.position.copy(board.position);boardG.add(boardEdge);
const legM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
for(const sx of [-3.2,3.2]){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.62,10),legM);
  leg.position.set(sx,0.31,-0.1);boardG.add(leg);
}
/* 相图坐标映射:成分 0-100% → x∈[-3.35,3.35],温度 100-400°C → y∈[1.0,4.7] */
const DX=x=>-3.35+x/100*6.7,DY=T=>1.0+(T-100)/300*3.7;
function dShape(pts){const s=new THREE.Shape();
  s.moveTo(DX(pts[0][0]),DY(pts[0][1]));
  for(let i=1;i<pts.length;i++)s.lineTo(DX(pts[i][0]),DY(pts[i][1]));
  s.closePath();return s;}
function dLinePts(pts){const arr=[];
  for(const p of pts)arr.push(new THREE.Vector3(DX(p[0]),DY(p[1]),0.115));return arr;}
const curL=[],curR=[],curSL=[],curSR=[],svL=[],svR=[];
for(let i=0;i<=16;i++){const x=X_EU*i/16;curL.push([x,TLl(x)]);}
for(let i=0;i<=16;i++){const x=X_EU+(100-X_EU)*i/16;curR.push([x,TLr(x)]);}
for(let i=0;i<=10;i++){const x=X_A*i/10;curSL.push([x,TSl(x)]);}
for(let i=0;i<=10;i++){const T=T_EU+(T_SN-T_EU)*i/10;curSR.push([xSdR(T),T]);}
for(let i=0;i<=8;i++){const T=T_EU-(T_EU-100)*i/8;svL.push([xSvL(T),T]);}
for(let i=0;i<=8;i++){const T=T_EU-(T_EU-100)*i/8;svR.push([xSvR(T),T]);}
const rev=a=>a.slice().reverse();
/* 六个相区:半透明色块 */
const regions={};
function addRegion(key,color,pts,z,base){
  const m=new THREE.Mesh(new THREE.ShapeGeometry(dShape(pts),2),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:base,depthWrite:false,side:THREE.DoubleSide}));
  m.position.z=z;boardG.add(m);regions[key]={mesh:m,base};return m;
}
addRegion('L',0xff8c3a,[...curL,...curR,[100,400],[0,400]],0.075,0.48);
addRegion('aL',0xf2b34c,[...curL,[X_A,T_EU],...rev(curSL)],0.08,0.34);
addRegion('Lb',0xf2a04c,[...curR,[X_B,T_EU]],0.085,0.34);
addRegion('ab',0x5f86e0,[[X_A,T_EU],[X_B,T_EU],...svR,...rev(svL)],0.09,0.44);
addRegion('a',0x74c98e,[[0,T_PB],...curSL,...svL,[0,100]],0.095,0.40);

/* 状态 */
let mode='custom',temp=200,comp=40,playing=true,labelsOn=true,slowMo=false,hiOn=true;

const qs=new URLSearchParams(location.search);

const REGION_NAME={L:['液相 L','Liquid L'],aL:['糊状区 α+L','Mushy α+L'],Lb:['糊状区 L+β','Mushy L+β'],
  ab:['两相区 α+β','Two-phase α+β'],a:['α 相(Pb基)','α phase (Pb-rich)'],b:['β 相(Sn基)','β phase (Sn-rich)']};
function microText(x,T){
  const fL=liquidFrac(x,T);
  if(fL>=1)return L('液相 L','Liquid L');
  if(fL>0)return x<X_EU?L('初晶 α + 液','primary α + L'):L('初晶 β + 液','primary β + L');
  const ph=phaseOf(x,T);
  if(ph==='a')return L('α(纯铅)','α (pure Pb)');
  if(ph==='b')return L('β(纯锡)','β (pure Sn)');
  if(Math.abs(x-X_EU)<3)return L('共晶 α+β 片层','eutectic α+β lamellae');
  return x<X_EU?L('α + 共晶片层','α + eutectic lamellae'):L('β + 共晶片层','β + eutectic lamellae');
}

const lblProbe=addLabel(()=>{const k=phaseOf(comp,temp);
  return L('探针:'+REGION_NAME[k][0],'Probe: '+REGION_NAME[k][1]);},

const lblCru=addLabel(()=>L('坩埚 · 冷却结晶','Crucible · cooling & freezing'),new THREE.Vector3(0,1.66,0),'o',()=>true,cruG);

  return L(`杠杆定律:Wα=${fa.toFixed(0)}%`,`Lever rule: Wα=${fa.toFixed(0)}%`);},
  new THREE.Vector3(0,0.5,0),'g',()=>temp<T_EU&&comp>2.5&&comp<97.5,cruG);

function setTemp(v){temp=clamp(v,100,350);
  document.getElementById('sTemp').value=temp;
  document.getElementById('sTempVal').textContent=temp.toFixed(0)+' °C';updateStats();}
function setComp(v){comp=clamp(v,0,100);
  document.getElementById('sComp').value=comp;
  document.getElementById('sCompVal').textContent=comp.toFixed(1)+' %';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bPure').classList.toggle('on',m==='pure');
  document.getElementById('bSolder').classList.toggle('on',m==='solder');
  document.getElementById('bHypo').classList.toggle('on',m==='hypo');
  if(m==='pure'){setComp(0);setTemp(340);}
  if(m==='solder'){setComp(61.9);setTemp(200);}
  if(m==='hypo'){setComp(40);setTemp(240);}
  updateStats();}

const STEPS=[
 {zh:'<b>纯铅平台凝固</b>:纯金属在单一温度 327.5°C 整体凝固,温度走平台、没有糊状区间',
  en:'<b>Pure Pb freezes on a plateau</b>: a pure metal solidifies in one piece at 327.5 °C — no pasty range',
  act(){setMode('pure');setTemp(327);}},
 {zh:'<b>掺锡,熔点骤降</b>:加 20% Sn 后 280°C 就开始出液,液相线一路下坡、拖出糊状区',
  en:'<b>Add Sn, the melt point dives</b>: 20% Sn starts melting at 280 °C — the liquidus slopes down, a mushy zone appears',
  act(){setMode('custom');setComp(20);setTemp(260);}},
 {zh:'<b>共晶点最低</b>:61.9% Sn 的谷底 183°C 全熔——两条液相线交汇的最低点',
  en:'<b>The eutectic is lowest</b>: at the 61.9% Sn valley everything melts by 183 °C — where the two liquidus branches meet',
  act(){setMode('solder');setTemp(183);}},
 {zh:'<b>亚共晶先析初晶 α</b>:40% Sn 冷到液相线下先析铅基初晶,剩液越来越富锡',
  en:'<b>Hypoeutectic: primary α first</b>: cooling 40% Sn below its liquidus grows Pb-rich primary crystals; the rest of the liquid enriches in Sn',
  act(){setMode('hypo');setTemp(220);}},
 {zh:'<b>共晶反应 L→α+β 片层</b>:剩液到 183°C 集体转为交替片层;杠杆定律 Wα=(97.8−40)/(97.8−18.3)≈73%',
  en:'<b>Eutectic reaction L→α+β</b>: at 183 °C the leftover liquid flips into alternating lamellae; lever rule Wα=(97.8−40)/(97.8−18.3)≈73%',

 {zh:'<b>焊锡为何选共晶</b>:61.9% Sn 在 200°C 已全熔——别的成分此时还拖着糊状半固态',

  act(){setMode('solder');setTemp(200);}},

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(xT){
  const T=(xT===undefined)?temp:xT;
  document.getElementById('stComp').innerHTML=comp.toFixed(1)+'<small> % Sn</small>';
  const tv=document.getElementById('stTemp');
  tv.innerHTML=T.toFixed(0)+'<small> °C</small>';
  const ph=phaseOf(comp,T),fL=liquidFrac(comp,T);
  const mushy=fL>0&&fL<1;
  tv.className='v '+(mushy?'warn':'');
  const lv=document.getElementById('stLiq');
  lv.innerHTML=(fL*100).toFixed(0)+'<small> %</small>';
  lv.className='v '+(mushy?'warn':'');
  const mv=document.getElementById('stMicro');
  mv.textContent=microText(comp,T);
  mv.className='v '+(!mushy&&Math.abs(comp-X_EU)<3&&temp<T_EU?'ok':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;

function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;

  });

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 运行时温度围绕设定值缓慢摆动 ±10°C,跨过相界就能看到组织变化 */
  const Tnow=clamp(temp+(playing?10*Math.sin(simT*0.5):0),100,350);
  /* 探针跟随 */
  probeLine.position.x=DX(comp);
  probeDot.position.set(DX(comp),DY(Tnow),0.13);
  probeDot.scale.setScalar(1+0.12*Math.sin(simT*3));
  lblProbe.position.set(clamp(DX(comp)+0.8,-2.35,2.35),
    DY(Tnow)+(Math.abs(Tnow-T_EU)<25?-0.36:0.2),0.12);
  /* 当前相区高亮(基态透明度 → 高亮态) */
  const cur=phaseOf(comp,Tnow);
  for(const k in regions){
    const r=regions[k];
    const tgt=hiOn?(k===cur?0.62:r.base*0.8):r.base;
    r.mesh.material.opacity+=(tgt-r.mesh.material.opacity)*0.15;
  }
  /* 坩埚:液面下降、固相 cake 长高;液相发红光随温度 */
  const fL=liquidFrac(comp,Tnow);
  const cakeH=Math.max(0.001,(1-fL)*MAXH);
  cake.scale.y=cakeH;cake.position.y=BASE_Y+cakeH/2;
  const liqH=Math.max(0.001,fL*(MAXH-0.12));
  liquid.scale.y=liqH;liquid.position.y=BASE_Y+cakeH+liqH/2;
  liquid.position.y+=0.008*Math.sin(simT*2.2);
  liqM.emissiveIntensity=clamp((Tnow-140)/220,0,1)*0.4;
  liqM.color.setHex(Tnow>T_EU?0x9aa2ae:0x8f97a4);
  /* 初晶晶块:糊状区可见,数量随固相分数,α 亮灰 / β 深灰 */
  const mushy=fL>0&&fL<1;
  const nP=mushy?Math.max(1,Math.round((1-fL)*7)):0;
  prims.forEach((p,i)=>{
    p.visible=i<nP;
    if(p.visible){
      const u=p.userData,rr=u.r;
      p.position.set(rr*Math.cos(u.a+simT*0.25),BASE_Y+cakeH+0.12+0.05*Math.sin(simT*2+u.ph),
        rr*Math.sin(u.a+simT*0.25));
      p.rotation.x=simT*0.5+u.ph;p.rotation.y=simT*0.35;
      p.material=(comp<X_EU?primM_a:primM_b);
    }
  });
  /* 共晶片层:凝固后(T<183 且成分在 α+β 区)在 cake 顶上铺出交替片层 */
  const hasEu=Tnow<T_EU&&comp>2.5&&comp<97.5;
  lamG.visible=hasEu;
  if(hasEu){
    lamG.position.y=BASE_Y+cakeH;
    const nEu=Math.abs(comp-X_EU)<3?8:5;
    lams.forEach((m,i)=>{m.visible=i<nEu;});
  }
  lblLever.position.set(0,BASE_Y+cakeH+0.3,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats(Tnow);}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setMode('hypo');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
