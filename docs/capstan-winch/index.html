<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>绞盘与缆绳摩擦 · e^{μθ} 的指数账单</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9915b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b06a2c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,106,44,.55);background:rgba(176,106,44,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,106,44,.08);border-color:rgba(176,106,44,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="绞盘与缆绳摩擦" data-en="The Capstan & Rope Friction">绞盘与缆绳摩擦</h1>
  <div class="sub" data-zh="缆绳每绕桩一圈,两端张力之比就乘一次 e^{μθ}:三圈下来人手几公斤的握力能扛住几吨的大船——摩擦力按指数收费,圈数与摩擦系数是仅有的两个旋钮 · 拖动旋转 / 空格运行/暂停" data-en="Every wrap around the post multiplies the tension ratio by e^{μθ}: three turns and a few kilograms of hand force hold a multi-ton ship — friction charges by the exponent, and wraps plus μ are the only dials · drag to orbit / Space = run/pause">缆绳每绕桩一圈,两端张力之比就乘一次 e^{μθ}:三圈下来人手几公斤的握力能扛住几吨的大船——摩擦力按指数收费,圈数与摩擦系数是仅有的两个旋钮 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="缠绕角 θ" data-en="Wrap angle θ">缠绕角 θ</span><span class="v" id="stTheta">—</span>

  <span class="k" data-zh="所需握力" data-en="Holding force">所需握力</span><span class="v" id="stHold">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bDry" data-zh="干缆 μ=0.25" data-en="Dry μ=0.25">干缆 μ=0.25</button>
    <button class="abtn" id="bWet" data-zh="湿缆 μ=0.12" data-en="Wet μ=0.12">湿缆 μ=0.12</button>
    <button class="abtn" id="bSlip" data-zh="松手看打滑" data-en="Release (slip)">松手看打滑</button>

    <label data-zh="船的拉力" data-en="Ship pull">船的拉力</label>

    <label data-zh="摩擦系数 μ" data-en="Friction μ">摩擦系数 μ</label>
    <input id="sMu" type="range" min="0.05" max="0.5" step="0.01" value="0.25">

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglGrad" type="checkbox" checked> <span data-zh="张力彩色剖面" data-en="Tension colors">张力彩色剖面</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../belt-drive/" data-zh="带传动与张紧" data-en="Belt Drive & Tension">带传动与张紧</a>
    <a href="../chain-hoist/" data-zh="手拉葫芦" data-en="Chain Hoist">手拉葫芦</a>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,80);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-6.5,4.2,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.8,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 码头地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const dockM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.85});
const dock=new THREE.Mesh(new THREE.BoxGeometry(7,0.5,4.4),dockM);
dock.position.set(-2.5,0.25,0);scene.add(dock);
const plankM=new THREE.MeshStandardMaterial({color:0x4a5160,roughness:0.9});
for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(7,0.06,0.16),plankM);
  p.position.set(-2.5,0.52,-1.6+i*0.8);scene.add(p);}
const seaM=new THREE.MeshStandardMaterial({color:0x16303f,roughness:0.35,metalness:0.1});
const sea=new THREE.Mesh(new THREE.CircleGeometry(26,48),seaM);
sea.rotation.x=-Math.PI/2;sea.position.y=0.08;scene.add(sea);

/* ---- 系缆桩 ---- */
const DRUM=0.42,DH=2.0;
const drumM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.35,metalness:0.7});
const drum=new THREE.Mesh(new THREE.CylinderGeometry(DRUM,DRUM,DH,28),drumM);
drum.position.set(0,0.5+DH/2,0);scene.add(drum);
const capM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
for(const y of [0.5,DH+0.5]){const c=new THREE.Mesh(new THREE.SphereGeometry(DRUM+0.06,20,14),capM);
  c.position.set(0,y,0);c.scale.y=0.35;scene.add(c);}
const base=new THREE.Mesh(new THREE.CylinderGeometry(0.85,1.0,0.35,24),dockM);
base.position.set(0,0.68,0);scene.add(base);

/* ---- 船(简化壳体) ---- */
const ship=new THREE.Group();scene.add(ship);
const hullM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.55,metalness:0.3});
const hull=new THREE.Mesh(new THREE.BoxGeometry(5.4,1.0,2.2),hullM);hull.position.y=0.9;ship.add(hull);
const bow=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.6,4),hullM);
bow.rotation.z=-Math.PI/2;bow.rotation.y=Math.PI/4;bow.position.set(3.4,0.9,0);ship.add(bow);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.8,1.6),new THREE.MeshStandardMaterial({color:0xb0813f,roughness:0.6}));
cabin.position.set(-1.4,1.8,0);ship.add(cabin);
ship.position.set(11.5,0.35,0);ship.rotation.y=-Math.PI/2;

/* ---- 缆绳:螺旋段(InstancedMesh,按张力着色) ---- */
const SEG=140;
const ropeM=new THREE.MeshStandardMaterial({roughness:0.7});
const rope=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.045,0.045,1,8),ropeM,SEG+40);
rope.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
rope.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array((SEG+40)*3),3);
scene.add(rope);
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v3=new THREE.Vector3(),vY=new THREE.Vector3(0,1,0);
function orientInst(im,i,x1,y1,z1,x2,y2,z2){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length());v3.normalize();
  q.setFromUnitVectors(vY,v3);
  m4.compose(new THREE.Vector3((x1+x2)/2,(y1+y2)/2,(z1+z2)/2),q,new THREE.Vector3(1,len,1));
  im.setMatrixAt(i,m4);
}
const C_HOT=new THREE.Color(0xff6b6b),C_MID=new THREE.Color(0xffd43b),C_COLD=new THREE.Color(0x8ce99a);

/* ---- 状态与力学 ---- */
let wraps=3,loadKN=20,mu=0.25,playing=true,labelsOn=true,slowMo=false,slipping=false;
let simT=0,shipOff=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function theta(){return 2*Math.PI*wraps;}
function gain(){return Math.exp(mu*theta());}
function holdKN(){return loadKN/gain();}
function slipFactor(){/* θ 太短→摩擦冗余不足,滑移速度占比 */
  return clamp(1-gain()/6,0.2,1);}

/* ---- 布缆 ---- */
const DRUMX=0,DRUMY=0.5+DH/2;
const R0=DRUM+0.05;
function ropePoints(){
  const pts=[];
  const wrapAng=theta();
  /* 船侧:从船头到桩的切入段 */
  const enterAng=Math.PI/2+wrapAng;
  const enter=new THREE.Vector3(DRUMX+R0*Math.cos(enterAng),DRUMY,R0*Math.sin(enterAng));
  pts.push(new THREE.Vector3(ship.position.x-2.2,1.35,ship.position.z));
  pts.push(new THREE.Vector3(enter.x,enter.y,enter.z));
  /* 桩上螺旋 */
  for(let i=0;i<=SEG;i++){
    const a=enterAng-(wrapAng*i/SEG);
    const y=DRUMY+DH*0.72-((DH*0.72)*(i/SEG));
    pts.push(new THREE.Vector3(DRUMX+R0*Math.cos(a),y,R0*Math.sin(a)));
  }
  /* 手侧:从桩到左前方的系缆点 */
  const last=pts[pts.length-1];
  pts.push(new THREE.Vector3(last.x-1.6,last.y-0.15,last.z));
  pts.push(new THREE.Vector3(-5.2,0.9,1.2));
  return pts;
}
let pts=ropePoints();
/* 端点标记 */
const loadAnchor=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.5,10),drumM);
loadAnchor.position.set(-5.2,0.7,1.2);scene.add(loadAnchor);

function buildRope(){
  pts=ropePoints();
  const flat=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const n=Math.max(1,Math.round(a.distanceTo(b)/0.22));
    for(let k=0;k<n;k++){
      const t0=k/n,t1=(k+1)/n;
      flat.push([a.x+(b.x-a.x)*t0,a.y+(b.y-a.y)*t0,a.z+(b.z-a.z)*t0,
                 a.x+(b.x-a.x)*t1,a.y+(b.y-a.y)*t1,a.z+(b.z-a.z)*t1]);
    }
  }
  const N=flat.length;
  rope.count=Math.min(N,rope.instanceMatrix.count);
  const g=gain();
  /* 张力比 t/Tmax:入桩处=1(船侧),出桩处=1/g(手侧) */
  let wrapIdx=0;
  for(let i=0;i<rope.count;i++){
    const s=flat[i];
    orientInst(rope,i,s[0],s[1],s[2],s[3],s[4],s[5]);
    /* 判断该段是否在桩上:距桩轴 < R0+0.1 */
    const dx=(s[0]+s[3])/2-DRUMX,dz=(s[2]+s[5])/2;
    const onDrum=Math.hypot(dx,dz)<R0+0.12;
    let f=0;/* 0=船侧满张力 1=手侧松弛 */
    if(onDrum){f=wrapIdx/(SEG);wrapIdx++;}
    else f=i<flat.length/2?0:1;
    const c=new THREE.Color();
    if(document.getElementById('tglGrad').checked){
      if(f<0.5)c.copy(C_HOT).lerp(C_MID,f*2);
      else c.copy(C_MID).lerp(C_COLD,(f-0.5)*2);
    }else c.setHex(0xb08968);
    if(slipping&&onDrum)c.lerp(new THREE.Color(0xff6b6b),0.5+0.5*Math.sin(simT*20));
    rope.setColorAt(i,c);
  }
  rope.instanceMatrix.needsUpdate=true;
  if(rope.instanceColor)rope.instanceColor.needsUpdate=true;
}

/* ---- 握力箭头 / 船拉力箭头 ---- */
const arrowM=new THREE.MeshBasicMaterial({color:0xff6b6b});
const holdArrowM=new THREE.MeshBasicMaterial({color:0x8ce99a});
const arrShip=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.5,10),arrowM);
arrShip.rotation.z=-Math.PI/2;arrShip.position.set(6.8,1.5,0);scene.add(arrShip);
const arrHand=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.5,10),holdArrowM);
arrHand.rotation.z=Math.PI/2;arrHand.position.set(-6.0,1.05,1.2);scene.add(arrHand);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`船的拉力 ${loadKN.toFixed(0)} kN`,`Ship pulls ${loadKN.toFixed(0)} kN`),
  new THREE.Vector3(11.5,3.3,0),'r');
addLabel(()=>L(`握力只需 ${holdKN().toFixed(1)} kN`,`Hand holds just ${holdKN().toFixed(1)} kN`),
  new THREE.Vector3(-5.2,2.0,1.2),'g',()=>!slipping);
addLabel(()=>L(`桩上每圈张力 ÷e^{2πμ}≈÷${Math.exp(2*Math.PI*mu).toFixed(2)}`,
    `Each turn divides tension by e^{2πμ}≈${Math.exp(2*Math.PI*mu).toFixed(2)}`),
  new THREE.Vector3(0,3.6,0),'y');
addLabel(()=>L('打滑:θ 太短,摩擦撑不住整条船','Slipping: θ too short — friction gives up'),
  new THREE.Vector3(0,4.4,0),'r',()=>slipping);

/* ---- 控件 ---- */
function setWraps(v){wraps=clamp(v,0,5);slipping=false;
  document.getElementById('sWrap').value=wraps;
  document.getElementById('sWrapVal').textContent=wraps.toFixed(2);
  document.getElementById('bSlip').classList.remove('on');buildRope();updateStats();}
function setLoad(v){loadKN=clamp(v,1,100);
  document.getElementById('sLoad').value=loadKN;
  document.getElementById('sLoadVal').textContent=loadKN.toFixed(0)+' kN';updateStats();}
function setMu(v,preset){mu=clamp(v,0.05,0.5);
  document.getElementById('sMu').value=mu;
  document.getElementById('sMuVal').textContent=mu.toFixed(2);
  document.getElementById('bDry').classList.toggle('on',preset==='dry');
  document.getElementById('bWet').classList.toggle('on',preset==='wet');
  buildRope();updateStats();}
function triggerSlip(){slipping=true;
  document.getElementById('bSlip').classList.add('on');updateStats();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'直拉:不绕桩,握力=船的拉力',en:'Straight pull: no wraps, hand force = ship pull',
  act(){setWraps(0);setMu(0.25,'dry');}},
 {zh:'绕半圈:e^{μπ} 已把张力放大约 2.2 倍',en:'Half a wrap: e^{μπ} already multiplies ~2.2×',
  act(){setWraps(0.5);}},
 {zh:'绕三圈:握力只剩载荷的约 1%',en:'Three wraps: hand force drops to ~1% of the load',
  act(){setWraps(3);}},
 {zh:'彩色剖面:张力沿绳指数衰减',en:'Color profile: tension decays exponentially along the rope',
  act(){setWraps(3);document.getElementById('tglGrad').checked=true;}},
 {zh:'湿缆绳:μ 减半,放大率暴跌,握力翻好几倍',en:'Wet rope: μ halves, the gain collapses, grip demand multiplies',
  act(){setWraps(3);setMu(0.12,'wet');}},
 {zh:'打滑:圈数不足时绳子整圈滑向载荷侧',en:'Slip: too few wraps and the rope slides toward the load',
  act(){setWraps(1);setMu(0.12,'wet');triggerSlip();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const th=theta(),g=gain(),h=holdKN();
  document.getElementById('stTheta').innerHTML=th.toFixed(1)+'<small> rad</small>';
  const gv=document.getElementById('stGain');
  gv.textContent='×'+(g<1000?g.toFixed(1):Math.round(g).toLocaleString());
  const hv=document.getElementById('stHold');
  hv.innerHTML=h<1?(h*1000).toFixed(0)+'<small> N</small>':h.toFixed(2)+'<small> kN</small>';
  hv.className='v '+(h>0.5?'warn':'ok');
  const sv=document.getElementById('stState');
  if(slipping){sv.textContent=L('打滑!','SLIPPING');sv.className='v warn';}
  else if(h>2){sv.textContent=L('握不住','over grip');sv.className='v warn';}
  else{sv.textContent=L('稳稳保持','held');sv.className='v ok';}
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bDry').addEventListener('click',()=>{slipping=false;document.getElementById('bSlip').classList.remove('on');setMu(0.25,'dry');});
document.getElementById('bWet').addEventListener('click',()=>{slipping=false;document.getElementById('bSlip').classList.remove('on');setMu(0.12,'wet');});
document.getElementById('bSlip').addEventListener('click',triggerSlip);
document.getElementById('sWrap').addEventListener('input',e=>setWraps(+e.target.value));
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sMu').addEventListener('input',e=>setMu(+e.target.value,null));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglGrad').addEventListener('change',()=>buildRope());

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  seaM.color.setHex(dark?0x16303f:0x9fc4d8);
  dockM.color.setHex(dark?0x3a3f4b:0xb8b0a2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 运行态:船的系泊微荡 + 缆绳蠕动 */
  const breathe=playing?Math.sin(simT*1.1)*0.12:0;
  if(slipping){
    const s=slipFactor();
    shipOff+=s*dts*2.2;
    ship.position.x=11.5-shipOff;
    arrHand.scale.setScalar(clamp(1-s,0.05,1));
    if(shipOff>3.5){shipOff=0;slipping=false;document.getElementById('bSlip').classList.remove('on');setWraps(0.6);}
  }else{
    shipOff=Math.max(0,shipOff-dts*3);
    ship.position.x=11.5-shipOff;
    arrHand.scale.setScalar(1);
  }
  ship.position.z=breathe;
  ship.rotation.z=Math.sin(simT*1.4)*0.012*(playing?1:0);
  if(!slipping)buildRope();
  /* 箭头脉动 */
  const pulse=playing?1+0.08*Math.sin(simT*3):1;
  arrShip.scale.setScalar(pulse);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
document.getElementById('sWrapVal').textContent=wraps.toFixed(2);
document.getElementById('sLoadVal').textContent=loadKN.toFixed(0)+' kN';
document.getElementById('sMuVal').textContent=mu.toFixed(2);
buildRope();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
if(qs.get('speed')!==null){/* 简单页不实现变速,保留参数兼容 */;}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
