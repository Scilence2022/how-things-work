<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>重结晶 · 热时全溶,冷时归晶</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#63e6be;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0ca678;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(99,230,190,.6);background:rgba(99,230,190,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(12,166,120,.55);background:rgba(12,166,120,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(99,230,190,.10);border-color:rgba(99,230,190,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(12,166,120,.08);border-color:rgba(12,166,120,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#c9f7e6}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="重结晶与纯化" data-en="Recrystallization & Purification">重结晶与纯化</h1>
  <div class="sub" data-zh="目标物溶解度随温度陡升、杂质平缓:沸溶剂里趁热全溶,降温越过饱和线,过饱和度驱动晶体逐层生长,晶面把杂质挡回母液;抽滤冷洗、干燥,熔距收窄一档=纯度上台阶 · 拖动旋转 / 空格运行/暂停" data-en="The target's solubility climbs steeply with T, the impurity's stays flat: dissolve everything hot, cool past saturation, let the crystal grow layer by layer while its faces turn impurities back into the mother liquor; filter, wash, dry — a narrower melting range is purity made visible · drag to orbit / Space = run/pause">目标物溶解度随温度陡升、杂质平缓:沸溶剂里趁热全溶,降温越过饱和线,过饱和度驱动晶体逐层生长,晶面把杂质挡回母液;抽滤冷洗、干燥,熔距收窄一档=纯度上台阶 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="溶液温度" data-en="Temperature">溶液温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="过饱和度" data-en="Supersaturation">过饱和度</span><span class="v" id="stSig">—</span>
  <span class="k" data-zh="回收率" data-en="Recovery">回收率</span><span class="v" id="stRec">—</span>
  <span class="k" data-zh="熔距" data-en="Melting range">熔距</span><span class="v" id="stMp">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bReset" data-zh="🔄 重置" data-en="🔄 Reset">🔄 重置</button>
    <button class="abtn slv on" id="sv0" data-zh="良溶剂·陡" data-en="Good · steep">良溶剂·陡</button>
    <button class="abtn slv" id="sv1" data-zh="中等·较缓" data-en="Medium">中等·较缓</button>
    <button class="abtn slv" id="sv2" data-zh="劣溶剂·平" data-en="Poor · flat">劣溶剂·平</button>
  </div>
  <div class="row">
    <label data-zh="温度设定" data-en="Set temp">温度设定</label>
    <input id="sT" type="range" min="5" max="100" step="1" value="60">
    <span class="val" id="sTVal">60 ℃</span>
  </div>
  <div class="row">
    <label data-zh="冷却速率" data-en="Cooling rate">冷却速率</label>
    <input id="sC" type="range" min="0.5" max="15" step="0.5" value="5">
    <span class="val" id="sCVal">5.0 ℃/s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglImp" type="checkbox" checked> <span data-zh="杂质" data-en="Impurity">杂质</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线图" data-en="Chart">曲线图</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../solvent-extraction/" data-zh="溶剂萃取" data-en="Solvent Extraction">溶剂萃取</a>
    <a href="../distillation/" data-zh="蒸馏" data-en="Distillation">蒸馏</a>
    <a href="../chromatography/" data-zh="色谱" data-en="Chromatography">色谱</a>
    <a href="../ksp-precipitation/" data-zh="溶度积沉淀" data-en="Solubility Product">溶度积沉淀</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ----------
   模型:目标物 60 g、杂质 12 g;S_t(T)=s0+sk*(T/100)^p 陡升,S_i(T)≈20~24 平走。
   σ=C/S_t 驱动成核生长;σ 越高晶面包藏杂质越多 → 熔距越宽。慢冷=窄熔距。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const gauss=()=>Math.random()+Math.random()+Math.random()-1.5;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0.3,2.0,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.2,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=24;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---------- 地面 / 烧杯 / 加热板 ---------- */
const BX=-2.4;
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(17,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.55;scene.add(ground);
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,3.0,48,1,true),
  new THREE.MeshStandardMaterial({color:0xdfe8f2,transparent:true,opacity:0.13,roughness:0.05,metalness:0.1,side:THREE.DoubleSide}));
glass.position.set(BX,0.3,0);scene.add(glass);
const liquidM=new THREE.MeshStandardMaterial({color:0x2f5d52,transparent:true,opacity:0.16,roughness:0.15});
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(1.47,1.47,2.6,48),liquidM);
liquid.position.set(BX,0.1,0);scene.add(liquid);
const btm=new THREE.Mesh(new THREE.CylinderGeometry(1.57,1.57,0.12,48),
  new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.3,metalness:0.4}));
btm.position.set(BX,-1.22,0);scene.add(btm);
const plateM=new THREE.MeshStandardMaterial({color:0x2a2f36,roughness:0.6,emissive:0xff5000,emissiveIntensity:0});
const plate=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.9,0.22,48),plateM);
plate.position.set(BX,-1.5,0);scene.add(plate);

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let labelsOn=true,impOn=true,chartOn=true;
let Tset=60,Tcur=60,coolRate=5,solIdx=0;
let Ct=25,trapped=0,filtT=9,wpPulse=0,latPulse=0;
let activeStep=0,mpCompare=false,demoDone=false,demoT=2.5;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;if(t0>=0)demoDone=true;}

/* ---------- 三种溶剂预设 ---------- */
const SOLVENTS=[
 {s0:6, sk:64,p:2.4},
 {s0:14,sk:38,p:2.4},
 {s0:30,sk:14,p:2.4},
];
function S_tgt(T){const s=SOLVENTS[solIdx];return s.s0+s.sk*Math.pow(clamp(T,5,105)/100,s.p);}
function S_imp(T){return 20+4*clamp(T,0,105)/100;}

/* ---------- 分子群(InstancedMesh) ---------- */
const NT=210,NI=120;
const tgtM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.062,10,8),new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:0.55,roughness:0.35}),NT);
const impM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,10,8),new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.5,roughness:0.35}),NI);
tgtM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);impM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(tgtM,impM);
const dummy=new THREE.Object3D();
const tg=[],im=[];
for(let i=0;i<NT;i++)tg.push({x:0,y:0,z:0,cap:2,spawned:0,sx:0,sy:0,sz:0,tx:0,ty:0,tz:0});for(let i=0;i<NI;i++)im.push({x:0,y:0,z:0,init:0});

/* ---------- 晶格:6×6×6 立方格点,逐层点亮 ---------- */
const SP=0.165,latPos=[];
for(let ly=0;ly<6;ly++)for(let i=0;i<6;i++)for(let j=0;j<6;j++)
  latPos.push([BX+(i-2.5)*SP,-1.06+ly*SP,(j-2.5)*SP]);
const latM=new THREE.InstancedMesh(new THREE.BoxGeometry(0.15,0.15,0.15),
  new THREE.MeshStandardMaterial({color:0x63e6be,emissive:0x0ca678,emissiveIntensity:0.35,roughness:0.3,transparent:true,opacity:0.92}),216);
latM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(latM);
let lastLit=-1,crystalTop=0,crystalHW=0.53;
function updateLattice(){
  const m=60-Ct;
  const nLit=clamp(Math.round(216*clamp((m+trapped)/54,0,1)),0,216);
  if(nLit!==lastLit){
    for(let i=0;i<216;i++){
      if(i<nLit){dummy.position.set(latPos[i][0],latPos[i][1],latPos[i][2]);dummy.scale.setScalar(1);}
      else{dummy.position.set(0,-60,0);dummy.scale.setScalar(0.0001);}
      dummy.updateMatrix();latM.setMatrixAt(i,dummy.matrix);
    }
    latM.instanceMatrix.needsUpdate=true;
    if(lastLit>=0&&nLit>lastLit&&Math.ceil(nLit/36)>Math.ceil(lastLit/36))latPulse=1;
    lastLit=nLit;
  }
  latM.material.emissiveIntensity=0.35+0.9*latPulse;
  crystalTop=-1.02+Math.ceil(Math.max(nLit,1)/36)*SP;
  return nLit;
}

/* ---------- 冷洗水珠(InstancedMesh) ---------- */
const NRD=14;
const rinseM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,6),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,depthWrite:false}),NRD);
rinseM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(rinseM);
function updateRinse(){
  const on=filtT>0&&filtT<1;
  for(let i=0;i<NRD;i++){
    let vis=false;
    if(on){
      const ph=(filtT*2.4+i*0.137)%1,y=2.3-ph*3.5;
      if(y>-1.05){vis=true;
        dummy.position.set(BX+Math.sin(i*2.4)*0.85,y,Math.cos(i*1.9)*0.85);
        dummy.scale.setScalar(0.7+0.5*Math.sin(ph*Math.PI));}
    }
    if(!vis){dummy.position.set(0,-60,0);dummy.scale.setScalar(0.0001);}
    dummy.updateMatrix();rinseM.setMatrixAt(i,dummy.matrix);
  }
  rinseM.instanceMatrix.needsUpdate=true;
}

/* ---------- 物理演化 ---------- */
function stepSim(dt){
  const dT=Tset-Tcur,rate=dT<0?coolRate:12;
  Tcur+=clamp(dT,-rate*dt,rate*dt);
  const S=S_tgt(Tcur),Si=S_imp(Tcur);
  let m=60-Ct;
  if(Ct<S&&m>0.001){
    const dc=Math.min(m,(S-Ct)*(0.8+2.4*Tcur/100)*dt);
    Ct+=dc;const mb=m;trapped*=mb>1e-6?(mb-dc)/mb:0;
  }
  m=60-Ct;
  if(Ct>S+1e-4){
    const sig=Ct/S;
    if(m<0.05){
      if(sig>1.18){Ct-=0.3;wpPulse=1;}
    }else{
      const D=Ct-S;
      const g=Math.min(D,0.28*D*(Math.pow(m,2/3)+0.35))*dt;
      Ct-=g;m+=g;
      const tf=0.05*clamp((12-trapped)/Math.max(Si,1),0,1)*(1+6*Math.max(0,Ct/S-1));
      trapped+=Math.min(g*tf,12-trapped,m*0.3);
    }
  }
  if(filtT<1)filtT=Math.min(1,filtT+dt/2.6);
  wpPulse=Math.max(0,wpPulse-dt*1.1);
  latPulse=Math.max(0,latPulse-dt*1.4);
}

/* ---------- 分子运动 ---------- */
let capCursor=0;
function updateMolecules(dt,nLit){
  const nF=Math.round(NT*clamp(Ct/60,0,1));
  const sp=0.55+1.75*Math.pow(Tcur/100,1.6);
  const lf=filtT>=1?0.15:(filtT>0?1-0.85*filtT*(2-filtT):1);
  liquid.scale.y=lf;liquid.position.y=-1.2+1.3*lf;
  const topY=-1.2+2.6*lf,rad=1.36;
  for(let i=0;i<NT;i++){
    const o=tg[i];
    if(i<nF){
      if(o.cap>=0)o.cap=-1;
      if(!o.spawned){o.spawned=1;
        o.x=BX+(Math.random()*2-1)*1.1;o.z=(Math.random()*2-1)*1.1;o.y=-0.9+Math.random()*1.9;}
      o.x+=gauss()*0.022*sp;o.z+=gauss()*0.022*sp;o.y+=gauss()*0.015*sp;
      const dx=o.x-BX,r=Math.hypot(dx,o.z);
      if(r>rad){o.x=BX+dx/r*rad;o.z=o.z/r*rad;}
      o.y=clamp(o.y,-1.02,topY);
      dummy.position.set(o.x,o.y,o.z);dummy.scale.setScalar(1);
    }else{
      if(o.cap<0){o.cap=0.0001;o.sx=o.x;o.sy=o.y;o.sz=o.z;
        const s=latPos[(capCursor++)%Math.max(nLit,1)];o.tx=s[0];o.ty=s[1];o.tz=s[2];}
      if(o.cap<1){
        o.cap=Math.min(1,o.cap+dt*1.8);
        const k=o.cap*o.cap*(3-2*o.cap);
        dummy.position.set(lerp(o.sx,o.tx,k),lerp(o.sy,o.ty,k),lerp(o.sz,o.tz,k));
        dummy.scale.setScalar(1-0.72*o.cap);
      }else if(o.spawned){dummy.position.set(o.tx,o.ty,o.tz);dummy.scale.setScalar(0.28);}
      else{dummy.position.set(0,-60,0);dummy.scale.setScalar(0.0001);}
    }
    dummy.updateMatrix();tgtM.setMatrixAt(i,dummy.matrix);
  }
  tgtM.instanceMatrix.needsUpdate=true;
  for(let i=0;i<NI;i++){
    const o=im[i];
    if(!o.init){o.init=1;o.x=BX+(Math.random()*2-1)*1.1;o.z=(Math.random()*2-1)*1.1;o.y=-0.9+Math.random()*1.9;}
    o.x+=gauss()*0.02*sp;o.z+=gauss()*0.02*sp;o.y+=gauss()*0.014*sp;
    if(nLit>0){
      const dx=o.x-BX,dz=o.z;
      if(Math.abs(dx)<crystalHW&&Math.abs(dz)<crystalHW&&o.y<crystalTop){
        const r=Math.hypot(dx,dz),nx=r>1e-4?dx/r:1,nz=r>1e-4?dz/r:0;
        o.x=BX+nx*(crystalHW+0.16);o.z=nz*(crystalHW+0.16);
      }
    }
    const dx2=o.x-BX,r2=Math.hypot(dx2,o.z);
    if(r2>rad){o.x=BX+dx2/r2*rad;o.z=o.z/r2*rad;}
    o.y=clamp(o.y,-1.02,topY);
    dummy.position.set(o.x,o.y,o.z);dummy.scale.setScalar(1);
    dummy.updateMatrix();impM.setMatrixAt(i,dummy.matrix);
  }
  impM.instanceMatrix.needsUpdate=true;
  impM.visible=impOn;
}

/* ---------- 曲线图逐帧 ---------- */
function updateChart(){
  const S=S_tgt(Tcur);
  const p=gapGeo.attributes.position;
  p.setXYZ(0,xT(Tcur),yS(S),0);p.setXYZ(1,xT(Tcur),yS(Ct),0);p.needsUpdate=true;
  gapLine.material.color.setHex(Ct>S+1e-3?0xff922b:0x74c0fc);
  wp.position.set(xT(Tcur),yS(Ct),0);
  wp.scale.setScalar(1+0.9*wpPulse);
  lblWp.position.set(xT(Tcur)+0.15,yS(Ct)+0.3,0);
  plateM.emissiveIntensity=clamp((Tcur-45)/60,0,1)*0.85;
}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=playing?(slowMo?dt*0.3:dt):0;
  if(playing){
    if(!demoDone){demoT-=dt;if(demoT<=0){demoDone=true;applyPhase(2);}}
    stepSim(dts);
  }
  const nLit=updateLattice();
  updateMolecules(dts,nLit);
  updateRinse();
  updateChart();
  acc+=dt;if(acc>0.15){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---------- 初始化 ---------- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();rebuildCurves();buildSteps();
if(t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(0);
updateStats();syncPlayBtn();
start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
