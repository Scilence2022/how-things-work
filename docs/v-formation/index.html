<style>

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}

  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,75);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(5.5,8.5,11);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-2.5,0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=32;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ===== 斜上视角:鸟群沿 +x 飞行,编队停在画面内,空气向后掠 ===== */
const W=1.9,LONG=2.3,NB=7;                 /* 翼展 m / 纵向间距 / 鸟数 */
const bgCol=new THREE.Color(0x101418);
const groundM=new THREE.MeshStandardMaterial({color:0x1b222b,roughness:0.95});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,60),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.5;scene.add(ground);
const grid=new THREE.GridHelper(90,45,0x3a4a5c,0x27313d);grid.position.y=-2.45;scene.add(grid);
/* 掠过画面的气流条(速度感) */
const NSTR=56,m4=new THREE.Matrix4();
const strk=new THREE.InstancedMesh(new THREE.BoxGeometry(0.55,0.016,0.016),new THREE.MeshBasicMaterial({color:0x8fa3b8,transparent:true,opacity:0.28}),NSTR);
strk.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(strk);
const strD=[];for(let i=0;i<NSTR;i++)strD.push({x:(Math.random()-0.5)*28,y:-2.2+Math.random()*4.6,z:(Math.random()-0.5)*16});
/* 鸟:流线体 + 双翼(绕飞行轴扑动) */
const birdM=new THREE.MeshStandardMaterial({color:0x9aa7b6,roughness:0.5,metalness:0.25});
const leadM=new THREE.MeshStandardMaterial({color:0xd9822b,roughness:0.45,metalness:0.25});
const wingM=new THREE.MeshStandardMaterial({color:0xc3cdd9,roughness:0.55,metalness:0.15});
const beakM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5});
const birds=[];
function makeBird(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.11,0.52,6,10),birdM);
  body.rotation.z=Math.PI/2;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),birdM);head.position.set(0.38,0.03,0);g.add(head);
  const beak=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.16,6),beakM);
  beak.rotation.z=-Math.PI/2;beak.position.set(0.5,0.03,0);g.add(beak);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.03,0.16),wingM);tail.position.set(-0.36,0.02,0);g.add(tail);
  const wl=new THREE.Group(),wr=new THREE.Group();
  wl.position.set(0.02,0.06,0.09);wr.position.set(0.02,0.06,-0.09);
  const wmL=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.025,0.95),wingM);wmL.position.set(-0.06,0,0.48);wmL.rotation.y=-0.14;wl.add(wmL);
  const wmR=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.025,0.95),wingM);wmR.position.set(-0.06,0,-0.48);wmR.rotation.y=0.14;wr.add(wmR);
  g.add(wl,wr);scene.add(g);
  return {g,body,head,wl,wr,ph:Math.random()*7,jit:Math.random()*2-1,trL:null,trR:null};
}
for(let i=0;i<NB;i++)birds.push(makeBird());
/* 编队位形与散开位形 */
const formOff=[],scatOff=[];
for(let i=0;i<NB;i++){formOff.push(new THREE.Vector3());
  scatOff.push(new THREE.Vector3((Math.random()-0.5)*6,(Math.random()-0.5)*2,(Math.random()-0.5)*12));}
function layout(o){
  formOff[0].set(0,0,0);let k=1;
  for(const s of[-1,1])for(let j=1;j<=3;j++){formOff[k].set(-j*LONG,0,s*j*W*o);k++;}
}
/* 每只鸟的流动分区:正后方下洗(红,不利)、涡外圈上洗(绿,有利) */
function flatZone(color,op){
  const m=new THREE.Mesh(new THREE.CircleGeometry(1,22),new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2;m.renderOrder=2;return m;
}
for(const b of birds){
  const zd=flatZone(0xff6b6b,0.16);zd.scale.set(1.5,0.8,1);zd.position.set(-0.8,-0.14,0);b.g.add(zd);
  const zu1=flatZone(0x8ce99a,0.22);zu1.scale.set(0.85,0.55,1);zu1.position.set(-0.55,-0.14,1.55);b.g.add(zu1);
  const zu2=flatZone(0x8ce99a,0.22);zu2.scale.set(0.85,0.55,1);zu2.position.set(-0.55,-0.14,-1.55);b.g.add(zu2);
}
/* 翼尖涡线:TubeGeometry 沿螺旋点列,随飞行拉长、尾部渐隐 */
const trailM=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.62,depthWrite:false});
const trailHead=new THREE.Color(0xffd43b);
const trails=[];
for(const b of birds){const tl={pts:[],mesh:null,acc:0,reb:0},tr={pts:[],mesh:null,acc:0,reb:0};
  b.trL=tl;b.trR=tr;trails.push(tl,tr);}
function setTrailColors(tr){
  const g=tr.mesh.geometry,segs=g.parameters.tubularSegments,rad=g.parameters.radialSegments;
  const col=new Float32Array(g.attributes.position.count*3),c=new THREE.Color();
  for(let i=0;i<=segs;i++){c.copy(trailHead).lerp(bgCol,Math.pow(i/segs,1.3));
    for(let j=0;j<=rad;j++){const k=(i*(rad+1)+j)*3;col[k]=c.r;col[k+1]=c.g;col[k+2]=c.b;}}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
}
function updTrail(tr,tip,dts,vf){
  for(const p of tr.pts)p.x-=vf*dts;
  tr.acc+=dts;
  if(tr.acc>0.045||!tr.pts.length){tr.acc=0;tr.pts.unshift(tip.clone());if(tr.pts.length>44)tr.pts.length=44;}
  tr.reb+=dts;
  if(tr.reb>0.14||!tr.mesh){tr.reb=0;
    if(tr.pts.length<2)return;
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tr.pts),Math.min(40,tr.pts.length*2),0.045,5,false);
    if(tr.mesh){tr.mesh.geometry.dispose();tr.mesh.geometry=geo;setTrailColors(tr);}
    else{tr.mesh=new THREE.Mesh(geo,trailM);tr.mesh.frustumCulled=false;scene.add(tr.mesh);}
  }
}

/* 状态 */
let off=0.42,spd=12,sync=0.75,gFac=1,gTarget=1,rotate=false,leadIdx=0,rotT=0,trailsOn=true;
let playing=true,labelsOn=true,slowMo=false,simT=0,dist=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function saveBase(){  /* 错开半个翼展吃满上洗,同步扑翼再添一点 */
  const t=clamp((off-0.02)/0.48,0,1);
  return 22*(t*t*(3-2*t))+(sync>0.5?(sync-0.5)*6:0);
}
function effSave(){return saveBase()*gFac;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=null){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);
  (parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const birdLbl=[];
for(let i=0;i<NB;i++){
  birdLbl.push(addLabel(()=>i===leadIdx?L('头鸟:全额做功','Leader: full effort'):L(`省力 ${effSave().toFixed(0)}%`,`Saves ${effSave().toFixed(0)}%`),
    new THREE.Vector3(0,0.85,0),'g',()=>gFac>0.35,birds[i].g));
}
addLabel(()=>L('翼尖涡:升力的代价单','Wingtip vortex: lift\u0027s price tag'),new THREE.Vector3(-0.5,0.4,-1.35),'y',()=>gFac>0.35,birds[0].g);
addLabel(()=>L('下洗区:正后方吃亏','Downwash: directly behind, you pay'),new THREE.Vector3(-0.95,-0.5,0),'r',()=>gFac>0.35,birds[0].g);
addLabel(()=>L('上洗区:外圈免费电梯','Upwash: free elevator on the rim'),new THREE.Vector3(-0.6,-0.5,1.65),'g',()=>gFac>0.35,birds[0].g);

function setOff(v){off=clamp(v,0,0.6);document.getElementById('sOff').value=off;
  document.getElementById('sOffVal').textContent=off.toFixed(2)+' W';layout(off);updateStats();}
function setSpd(v){spd=clamp(v,8,20);document.getElementById('sSpd').value=spd;
  document.getElementById('sSpdVal').textContent=spd.toFixed(1)+' m/s';updateStats();}
function setSync(v){sync=clamp(v,0,1);document.getElementById('sSync').value=sync;
  document.getElementById('sSyncVal').textContent=(sync*100).toFixed(0)+' %';updateStats();}
function setScatter(v){gTarget=v?0:1;
  document.getElementById('bScatter').classList.toggle('on',v);
  document.getElementById('bRegroup').classList.toggle('on',!v);updateStats();}
function setRotate(v){rotate=v;if(!v)rotT=0;}

const STEPS=[
 {zh:'翼尖涡:升力的代价单',en:'Wingtip vortex: the price tag of lift',act(){setRotate(false);setScatter(false);setOff(0.15);setSpd(11);setSync(0.7);}},
 {zh:'正后方:下洗吃升力',en:'Directly behind: downwash eats your lift',act(){setRotate(false);setScatter(false);setOff(0.02);setSpd(11);}},
 {zh:'斜后方:上洗送升力',en:'Half a span aside: upwash gives lift back',act(){setRotate(false);setScatter(false);setOff(0.5);}},
 {zh:'V 队:每只都搭上电梯',en:'The V: every bird catches the elevator',act(){setRotate(false);setScatter(false);setOff(0.42);setSpd(13);}},
 {zh:'轮流头鸟:最累的位置有人换',en:'Taking turns up front: the hard seat is shared',act(){setScatter(false);setOff(0.42);setRotate(true);}},
 {zh:'振翅也对相位:同步的加成',en:'Flap in phase: the sync bonus',act(){setRotate(false);setScatter(false);setOff(0.45);setSync(1);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const sv=effSave(),vv=document.getElementById('stSave');
  vv.innerHTML=sv.toFixed(0)+'<small> %</small>';vv.className='v '+(sv>10?'ok':sv>1?'':'warn');
  document.getElementById('stVor').innerHTML=(62/spd).toFixed(1)+'<small> m²/s</small>';
  const gap=Math.sqrt(LONG*LONG+Math.pow(W*off,2))*gFac+6*(1-gFac);
  document.getElementById('stGap').innerHTML=gap.toFixed(1)+'<small> m</small>';
  const lv=document.getElementById('stLead');
  lv.innerHTML=(10000/(100-Math.max(sv,0.01))).toFixed(0)+'<small> %</small>';
  lv.className='v '+(sv>10?'ok':'warn');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bScatter').addEventListener('click',()=>setScatter(true));
document.getElementById('bRegroup').addEventListener('click',()=>setScatter(false));
document.getElementById('sOff').addEventListener('input',e=>setOff(+e.target.value));
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('sSync').addEventListener('input',e=>setSync(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{trailsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1b222b:0xcfc8ba);
  bgCol.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;dist+=dts;
  /* 散开/归队过渡与头鸟轮换 */
  gFac+=(gTarget-gFac)*Math.min(1,dts*2.2);
  if(rotate){rotT+=dts;if(rotT>4.5){rotT=0;leadIdx=(leadIdx+1)%NB;}}
  layout(off);
  const vf=spd*0.13;
  for(let i=0;i<NB;i++){
    const b=birds[i],fo=formOff[i],so=scatOff[i];
    b.ph+=dts*3.6;
    const flap=Math.sin(b.ph+b.jit*(1-sync)*2.2)*0.55;
    b.wl.rotation.x=flap;b.wr.rotation.x=-flap;
    const px=fo.x+(so.x-fo.x)*(1-gFac),pz=fo.z+(so.z-fo.z)*(1-gFac),
          py=fo.y+(so.y-fo.y)*(1-gFac)+Math.sin(b.ph)*0.06;
    b.g.position.set(px,py,pz);
    b.g.rotation.z=Math.cos(b.ph)*0.05;
    const ld=i===leadIdx;
    b.body.material=ld?leadM:birdM;b.head.material=ld?leadM:birdM;
    /* 翼尖坐标喂给涡线:涡线随飞行被吹向后方 */
    const tipY=py-Math.sin(flap)*1.0;
    updTrail(b.trL,new THREE.Vector3(px-0.06,tipY,pz+1.05),dts,vf);
    updTrail(b.trR,new THREE.Vector3(px-0.06,tipY,pz-1.05),dts,vf);
  }
  for(const t of trails)if(t.mesh)t.mesh.visible=trailsOn;
  /* 气流条向后掠,地面网格滚动 */
  for(let i=0;i<NSTR;i++){const s=strD[i];s.x-=vf*1.2*dts;if(s.x<-14)s.x+=28;
    m4.makeScale(1,1,1);m4.setPosition(s.x,s.y,s.z);strk.setMatrixAt(i,m4);}
  strk.instanceMatrix.needsUpdate=true;
  grid.position.x=-(dist*vf)%2;
  /* 头鸟标签换色 */
  for(let i=0;i<NB;i++)birdLbl[i].element.className='lbl '+(i===leadIdx?'o':'g');
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
