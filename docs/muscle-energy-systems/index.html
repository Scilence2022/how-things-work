<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肌肉供能 · ATP 只存 2 秒,三台引擎接力续命</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#c14a5a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a83a49;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(193,74,90,.9); color: #ffc4cd; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.t { border-color: rgba(77,208,177,.9); color: #c9f3e6; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(168,58,73,.9); color: #a83a49; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #4dd0b1; }
  #stats .v.r { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.r { color: #ffb3b3; border-color: rgba(255,107,107,.7); }
  .chip.a { color: #ffd8a8; border-color: rgba(255,177,77,.7); }
  .chip.t { color: #c9f3e6; border-color: rgba(77,208,177,.7); }
  .chip.b { color: #c3ddf5; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(193,74,90,.65); background: rgba(193,74,90,.14); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(168,58,73,.55); background: rgba(168,58,73,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(193,74,90,.10); border-color: rgba(193,74,90,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(168,58,73,.08); border-color: rgba(168,58,73,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffc4cd; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="肌肉供能:ATP 只存 2 秒,三台引擎接力续命" data-en="Muscle Energy: ATP stores 2 s — three engines in relay">肌肉供能:ATP 只存 2 秒,三台引擎接力续命</h1>
  <div class="sub" data-zh="磷酸原功率 3.6 mmol·kg⁻¹·s⁻¹ 只撑 ~10 s → 糖酵解功率减半、用乳酸+H⁺ 记账 → 有氧只有 1/4 功率却能跑 2 h · 冲刺停下,氧债开始还账 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Phosphagen peaks at 3.6 mmol·kg⁻¹·s⁻¹ for ~10 s → glycolysis runs at half power and bills you lactate + H⁺ → aerobic delivers 1/4 power for 2 h+ · stop the sprint and the oxygen debt comes due · 3D demo · drag to orbit / scroll to zoom · Space = play/pause">磷酸原功率 3.6 mmol·kg⁻¹·s⁻¹ 只撑 ~10 s → 糖酵解功率减半、用乳酸+H⁺ 记账 → 有氧只有 1/4 功率却能跑 2 h · 冲刺停下,氧债开始还账 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="赛程时钟" data-en="race clock">赛程时钟</span><span class="v" id="stClock" style="font-size:14px">—</span>
  <span class="k" data-zh="ATP 需求" data-en="ATP demand">ATP 需求</span><span class="v g" id="stPow">—</span>
  <span class="k" data-zh="ATP 液位" data-en="ATP level">ATP 液位</span><span class="v" id="stATP">—</span>
  <span class="k" data-zh="血乳酸" data-en="lactate">血乳酸</span><span class="v" id="stLac">—</span>
  <span class="k" data-zh="氧债 EPOC" data-en="oxygen debt">氧债 EPOC</span><span class="v" id="stEPOC">0</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip r" data-zh="磷酸原引擎(PCr→ATP)" data-en="phosphagen (PCr→ATP)">磷酸原引擎(PCr→ATP)</span>
    <span class="chip a" data-zh="糖酵解(乳酸+H⁺)" data-en="glycolysis (lactate+H⁺)">糖酵解(乳酸+H⁺)</span>
    <span class="chip t" data-zh="有氧(线粒体)" data-en="aerobic (mitochondria)">有氧(线粒体)</span>
    <span class="chip b" data-zh="ATP 池 / 氧债" data-en="ATP pool / O₂ debt">ATP 池 / 氧债</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btn100" data-zh="100 m(10 s)" data-en="100 m (10 s)">100 m(10 s)</button>
    <button class="abtn" id="btn400" data-zh="400 m(45 s)" data-en="400 m (45 s)">400 m(45 s)</button>
    <button class="abtn" id="btnMar" data-zh="马拉松(2 h+)" data-en="marathon (2 h+)">马拉松(2 h+)</button>
    <button class="abtn" id="btnBlock" data-zh="出问题:封锁磷酸原" data-en="fault: block phosphagen">出问题:封锁磷酸原</button>
  </div>
  <div class="row"><label data-zh="阶段进度" data-en="phase">阶段进度</label><input id="scrub" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="scrubVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglBars" type="checkbox" checked> <span data-zh="功率条" data-en="power bars">功率条</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../glycolysis/" data-zh="第二棒:糖酵解" data-en="leg 2: glycolysis">第二棒:糖酵解</a>
    <a href="../krebs-cycle/" data-zh="深水引擎:三羧酸循环" data-en="deep engine: Krebs cycle">深水引擎:三羧酸循环</a>
    <a href="../cross-bridge-cycle/" data-zh="ATP 花在哪:横桥循环" data-en="where ATP goes: cross-bridge cycle">ATP 花在哪:横桥循环</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('肌肉供能 · 三台引擎接力', 'Muscle Energy · three-engine relay');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 2.7, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  frame: mat(0x2a3140, { roughness: 0.8, emissiveIntensity: 0 }),
  fiber: mat(0xc14a5a, { roughness: 0.5, emissiveIntensity: 0.25 }),
  glass: mat(0x9fb6c9, { opacity: 0.18, roughness: 0.1, metalness: 0.1 }),
  pcr: mat(0xff6b6b, { emissiveIntensity: 0.4 }),       // 磷酸原
  gly: mat(0xffb14d, { emissiveIntensity: 0.35 }),      // 糖酵解
  aer: mat(0x4dd0b1, { emissiveIntensity: 0.35 }),      // 有氧
  atp: mat(0x63e6be, { emissiveIntensity: 0.55 }),
  hp: mat(0xff9db5, { emissiveIntensity: 0.6 }),        // H⁺
  o2: mat(0x74c0fc, { emissiveIntensity: 0.5 }),        // O₂
  debt: mat(0x74c0fc, { emissiveIntensity: 0.4 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.5, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.35;
scene.add(base);

/* ================= 肌纤维 + ATP 水箱 ================= */
const fiber = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.6, 20), M.fiber);
fiber.rotation.z = Math.PI / 2;
fiber.position.set(0, 1.0, 0);
scene.add(fiber);
const tank = new THREE.Group();
tank.position.set(0, 1.78, 0);
scene.add(tank);
tank.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.62, 24), M.glass));
const atpLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.56, 24), M.atp);
atpLiquid.position.y = -0.28;
tank.add(atpLiquid);
/* 氧债管(恢复期计债) */
const debtTube = new THREE.Group();
debtTube.position.set(0, 1.3, -0.95);
scene.add(debtTube);
debtTube.add(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.0, 18), M.glass));
const debtLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9, 18), M.debt);
debtLiquid.position.y = -0.45;
debtTube.add(debtLiquid);

/* ================= 三台引擎 ================= */
const P_PCR = new THREE.Vector3(-2.45, 0, 0.35);

function fmtClock(s) {
  if (s < 100) return s.toFixed(1) + ' s';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}

/* ================= 相位 → 一切状态(纯函数,可倒放) ================= */
const formulaEl = document.getElementById('formula');
function snap() {
  const sc = SCENES[sceneKey];
  const p = stage;
  const inRace = p >= 0.06 && p < 0.62;
  const inRec = p >= 0.62;
  const u = inRace ? (p - 0.06) / 0.56 : (p >= 0.62 ? 1 : 0);
  const r = inRec ? (p - 0.62) / 0.38 : 0;
  S.inRace = inRace; S.inRec = inRec; S.u = u; S.r = r;

  /* 三引擎占比:比赛段按时程混合,恢复段有氧兜底+EPOC */
  let f = [0.33, 0.34, 0.33];
  if (inRace) {
    const w0 = Math.exp(-u / sc.tp) + 0.02;
    const w1 = sc.B * ss(0, 0.3, u) * Math.exp(-Math.max(0, u - 0.5) / sc.tg);
    const w2 = sc.C * ss(0, 0.25, u) + 0.02;
    const s = w0 + w1 + w2;
    f = [w0 / s, w1 / s, w2 / s];
  } else if (inRec) {
    f = [0.03, 0.03, 0.94];
  } else {
    f = [0.15, 0.15, 0.7];
  }
  S.f = f;
  S.demand = inRace ? sc.demand : (inRec ? 0.38 : 0.35);

  /* ATP 液位:正常被引擎稳住;封锁磷酸原则塌方 */
  S.atp = blocked ? 18 + 3 * Math.sin(tSim * 2.6) : 96 + 2.2 * Math.sin(tSim * 2.6);

  /* 乳酸:比赛段按糖酵解占比积累,恢复期有氧清走 */
  const lacEnd = 1.2 + (sc.lacMax - 1.2) * ss(0, 0.55, u);
  S.lac = inRec ? lacEnd * Math.exp(-r * 2.0) + 0.9 * (1 - Math.exp(-r * 2.0)) : lacEnd;

  /* PCr:比赛段耗竭,恢复段回充(t½≈30 s → 尺度 1.6);封锁时不回充 */
  const spent = sc.pcSpent * (1 - Math.exp(-u / 0.35));
  const pcrEnd = 1 - spent;
  S.pcr = inRec ? (blocked ? pcrEnd : pcrEnd + (1 - pcrEnd) * (1 - Math.exp(-r * 1.6))) : (inRace ? pcrEnd : 1);

  /* 氧债:比赛中积累(有氧没接上的部分),恢复期偿还 */
  const eMax = sc.epoMax + (blocked && inRace ? 18 : 0);
  S.epoc = inRec ? eMax * Math.exp(-r * 1.8) : (inRace ? eMax * ss(0.15, 1, u) : 0);

  /* ---- 3D:功率条 ---- */
  bars.forEach((b, i) => {
    const h = Math.max(0.02, f[i] * BAR_H);
    b.scale.y = h;
    b.position.y = BAR_BASE + h / 2;
    b.visible = barsOn;
  });
  /* ---- 3D:液位 ---- */
  atpLiquid.scale.y = Math.max(0.06, S.atp / 100);
  atpLiquid.position.y = -0.28 + (0.56 * (1 - S.atp / 100)) / 2;   /* 锚底:液面随液位下降 */
  pcrLiquid.scale.y = Math.max(0.05, S.pcr);
  pcrLiquid.position.y = 0.25 - (0.74 * (1 - S.pcr)) / 2;
  debtLiquid.scale.y = Math.max(0.02, S.epoc / 100);
  debtLiquid.position.y = -0.45 + (0.9 * (1 - S.epoc / 100)) / 2;
  /* ---- 3D:发光与颜色 ---- */
  M.fiber.emissiveIntensity = 0.08 + 0.3 * (S.atp / 100);
  M.aer.emissiveIntensity = 0.12 + f[2] * 0.7;
  M.pcr.emissiveIntensity = 0.15 + f[0] * 0.55;
  cristae.forEach(c => c.material.emissiveIntensity = 0.1 + f[2] * 0.6);
  const glyK = ss(0.05, 0.5, f[1]);
  cTmp.copy(C_GLUCOSE).lerp(C_LACTATE, glyK);
  beads.forEach(b => b.material.color.copy(cTmp));

  /* ---- stats ---- */
  const elC = document.getElementById('stClock');
  elC.textContent = inRace ? `${fmtClock(u * sc.raceT)} / ${fmtClock(sc.raceT)}`
    : inRec ? L(`恢复 ${fmtClock(r * sc.recT)}`, `recovery ${fmtClock(r * sc.recT)}`) : L('待命', 'standby');
  const elP = document.getElementById('stPow');
  elP.innerHTML = S.demand.toFixed(2) + '<small> mmol·kg⁻¹·s⁻¹</small>';
  const elA = document.getElementById('stATP');
  elA.innerHTML = Math.round(S.atp) + '<small> %</small>';
  elA.className = 'v ' + (blocked ? 'r' : 'g');
  const elL = document.getElementById('stLac');
  elL.innerHTML = S.lac.toFixed(1) + '<small> mmol/L</small>';
  elL.className = 'v ' + (S.lac > 4 ? 'r' : '');
  const elE = document.getElementById('stEPOC');
  elE.innerHTML = Math.round(S.epoc) + '<small> %</small>';
  elE.className = 'v ' + (S.epoc < 20 ? 'g' : '');

  /* ---- formula ---- */
  let s;
  if (blocked) {
    s = L(`磷酸原被封:PCr+ADP→ATP 停摆 · ATP 液位 <b>${Math.round(S.atp)}%</b> · 全力收缩只够 1–2 s`,
      `phosphagen blocked: PCr+ADP→ATP halted · ATP level <b>${Math.round(S.atp)}%</b> · stores last 1–2 s`);
  } else if (inRec) {
    s = L(`EPOC 还账:<b>PCr 回充 t½ ≈ 30 s</b> · 乳酸经有氧氧化 30–60 min 清完 · ${Math.round(S.epoc)}% 未还`,
      `EPOC repayment: <b>PCr refill t½ ≈ 30 s</b> · lactate cleared by oxidation in 30–60 min · ${Math.round(S.epoc)}% left`);
  } else if (inRace) {
    s = L(`功率阶梯 <b>3.6 : 1.7 : 0.9</b> mmol·kg⁻¹·s⁻¹ · 此刻磷酸原 ${Math.round(f[0] * 100)}% / 糖酵解 ${Math.round(f[1] * 100)}% / 有氧 ${Math.round(f[2] * 100)}%`,
      `power ladder <b>3.6 : 1.7 : 0.9</b> mmol·kg⁻¹·s⁻¹ · now phosphagen ${Math.round(f[0] * 100)}% / glycolysis ${Math.round(f[1] * 100)}% / aerobic ${Math.round(f[2] * 100)}%`);
  } else {
    s = L(`静息周转 ~0.3 mmol·kg⁻¹·s⁻¹ · ATP 存量 <b>5 mmol/kg ≈ 1–2 s</b> · 引擎必须实时续`,
      `resting turnover ~0.3 mmol·kg⁻¹·s⁻¹ · ATP store <b>5 mmol/kg ≈ 1–2 s</b> · engines must renew it live`);
  }
  formulaEl.innerHTML = s;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing && !document.hidden ? 1 : 0);
  tSim += dts;

  if (playing && stage < 1) {
    stage = clamp(stage + dts * 0.05, 0, 1);
    elScrub.value = Math.round(stage * 1000);
    elScrubVal.textContent = Math.round(stage * 100) + '%';
  }
  snap();

  /* 装饰运动:速率由对应引擎功率驱动 */
  fly.rotation.z += dts * (1.5 + S.f[0] * 12);
  beadGrp.rotation.y += dts * (0.25 + S.f[1] * 2.4);
  mito.scale.setScalar(1 + 0.05 * Math.sin(tSim * 2.4) * S.f[2]);
  fiber.scale.x = fiber.scale.z = 1 + 0.028 * (S.demand / 3.6) * (S.atp / 100) * Math.sin(tSim * (5 + S.demand * 2.5));

  /* H⁺ 粒子云:数量 = 乳酸水平 */
  const hpN = clamp(Math.round(S.lac * 9), 0, HP_N);
  hpIM.count = hpN;
  for (let i = 0; i < hpN; i++) {
    const d = hpDirs[i];
    dummy.position.set(P_GLY.x + d.x + 0.04 * Math.sin(tSim * 2.2 + i * 1.7),
      0.85 + d.y + 0.04 * Math.sin(tSim * 2.8 + i),
      P_GLY.z + d.z + 0.04 * Math.cos(tSim * 2.0 + i * 2.3));
    dummy.scale.setScalar(0.6 + 0.5 * Math.abs(Math.sin(i * 3.1 + tSim)));
    dummy.updateMatrix();
    hpIM.setMatrixAt(i, dummy.matrix);
  }
  if (hpN > 0) hpIM.instanceMatrix.needsUpdate = true;
  /* O₂ 粒子:流入线粒体,恢复期因 EPOC 增强 */
  const o2N = clamp(Math.round(S.f[2] * 34 + S.epoc * 0.25), 0, O2_N);
  o2IM.count = o2N;
  for (let i = 0; i < o2N; i++) {
    const ph = (tSim * (0.22 + S.epoc * 0.004) + i / O2_N) % 1;
    const a = i * 2.399;
    vA.set(P_AER.x + Math.cos(a) * 1.35, 2.35 + 0.45 * Math.sin(i * 1.3), P_AER.z + Math.sin(a) * 1.35);
    vB.set(P_AER.x, 0.95, P_AER.z);
    dummy.position.lerpVectors(vA, vB, ph * ph);
    dummy.scale.setScalar(1 - 0.5 * ph);
    dummy.updateMatrix();
    o2IM.setMatrixAt(i, dummy.matrix);
  }
  if (o2N > 0) o2IM.instanceMatrix.needsUpdate = true;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setSceneBtns();
applyTheme();
applyLang();
snap();
setPlayLabel();
requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
