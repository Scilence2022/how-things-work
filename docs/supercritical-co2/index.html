<style>

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);

  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

    display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  #panel::-webkit-scrollbar-track { background: transparent; }

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const m4=new THREE.Matrix4();
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);
camera.position.set(-7,6,12);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=120;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyLight=new THREE.DirectionalLight(0xfff2dd,1.05);keyLight.position.set(6,10,8);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9ab8ff,0.3);fillLight.position.set(-8,5,-6);scene.add(fillLight);

/* ---- 页面独特代码(定义 BG_DARK/BG_LIGHT/applyPageTheme/STEPS/updateStats/tick/pageInit) ---- */
const BG_DARK=0x101418,BG_LIGHT=0xe9e4dc;
const T_CRIT=31,P_CRIT=7.4;
/* ---- P-T 相图板(左) ---- */
const chartG=new THREE.Group();chartG.position.set(-7.5,1.8,-1.2);scene.add(chartG);
const chartBg=new THREE.Mesh(new THREE.PlaneGeometry(5.6,4.4),
  new THREE.MeshStandardMaterial({color:0x151b25,roughness:0.9,transparent:true,opacity:0.8}));
chartG.add(chartBg);
function cline(color,pts,parent){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts.flat(),3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color}));parent.add(l);return l;
}
const X0=-2.5,X1=2.5,Y0=-1.9,Y1=2.1;
const tx=T=>X0+ (T/80)*(X1-X0);
const ty=P=>Y0+(P/12)*(Y1-Y0);
/* 液气边界:止于临界点 */
cline(0x74c0fc,[[tx(10),ty(0.6),0.05],[tx(20),ty(1.6),0.05],[tx(28),ty(4.5),0.05],[tx(31),ty(7.4),0.05]],chartG);
/* 三相点 */
const tp=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffd43b,emissiveIntensity:0.5}));
tp.position.set(tx(0),ty(0.5),0.06);chartG.add(tp);
/* 临界点 */
const cp=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),new THREE.MeshStandardMaterial({color:0xa9e34b,emissive:0xa9e34b,emissiveIntensity:0.9}));
cp.position.set(tx(31),ty(7.4),0.06);chartG.add(cp);
/* 工作点 */
const wp=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),new THREE.MeshStandardMaterial({color:0xff922b,emissive:0xff922b,emissiveIntensity:0.8}));
wp.position.set(tx(35),ty(9),0.08);chartG.add(wp);
/* 临界等值线(虚线用短线段) */
for(let i=0;i<14;i++){
  const seg=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.03,0.01),
    new THREE.MeshBasicMaterial({color:0x5b6b7d}));
  seg.position.set(tx(31),ty(0.5)+i*0.34,0.04);chartG.add(seg);
}
/* ---- 萃取釜(中) + 分离釜(右) ---- */
const vesselM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.35,metalness:0.55,transparent:true,opacity:0.35});
function vessel(x,r,h){
  const g=new THREE.Group();
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24,1,true),vesselM);
  wall.position.y=h/2;g.add(wall);
  [0,h].forEach(y=>{
    const cap=new THREE.Mesh(new THREE.CircleGeometry(r,24),
      new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.4,metalness:0.5,transparent:true,opacity:0.25,side:THREE.DoubleSide}));
    cap.rotation.x=-Math.PI/2;cap.position.y=y;g.add(cap);
  });
  g.position.x=x;scene.add(g);return g;
}
const ext=vessel(-0.6,1.5,5.2);
const sep=vessel(4.6,1.0,3.4);
/* 豆床 */
const beanM=new THREE.MeshStandardMaterial({color:0x8a6a45,roughness:0.85});
const beans=new THREE.InstancedMesh(new THREE.SphereGeometry(0.16,8,6),beanM,180);
{let i=0;
 for(let y=0.45;y<3.6;y+=0.34)for(let a=0;a<10;a++){
   const r=0.35+((i*7919)%100)/100*1.0;
   const ang=a/10*2*Math.PI+((i*13)%7);
   m4.makeTranslation(Math.cos(ang)*r,y,Math.sin(ang)*r*0.6);
   beans.setMatrixAt(i++,m4);
 }}
ext.add(beans);
/* 流体粒子 */
const NF=260;
const fluidM=new THREE.MeshStandardMaterial({color:0xa9e34b,roughness:0.4,transparent:true,opacity:0.85});
const fluid=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),fluidM,NF);
fluid.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(fluid);
const fT=new Array(NF).fill(0).map(()=>Math.random());
const fR=new Array(NF).fill(0).map(()=>0.25+Math.random()*1.05);
const fA=new Array(NF).fill(0).map(()=>Math.random()*2*Math.PI);
/* 界面网格(亚临界时可见) */
const menG=new THREE.Group();ext.add(menG);
for(let i=0;i<9;i++){
  const bar=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.015,0.015),
    new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.8}));
  bar.position.y=4.35;bar.rotation.y=i/9*Math.PI;menG.add(bar);
}
/* ---- 状态 ---- */
let T=35,Pm=9.0,flow=1.0,extract=0,phaseOn=true;
const isSC=()=>T>=T_CRIT&&Pm>=P_CRIT;
const density=()=>{ /* 粗略示意:SC 区 0.2-0.9 g/mL */
  if(isSC())return 0.15+0.75*clamp((Pm-P_CRIT)/5,0,1)*clamp(T/80+0.3,0.4,1);
  return Pm<5?0.002:0.9;
};
const dissolve=()=>isSC()?0.3+0.7*clamp((density()-0.15)/0.75,0,1):0.02;
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'相图:三相点与临界点',en:'The diagram: triple & critical points',
  act(){T=20;Pm=2;flow=1;syncUI();}},
 {zh:'升温加压,逼近临界点',en:'Heat & squeeze toward critical',
  act(){T=28;Pm=6.5;syncUI();}},
 {zh:'越过临界线:液面当场消失',en:'Cross the line: meniscus vanishes',
  act(){T=35;Pm=9;syncUI();}},
 {zh:'穿过豆床:溶解咖啡因',en:'Through the bed: dissolving caffeine',
  act(){T=40;Pm=9.5;syncUI();}},

  act(){T=35;Pm=9;syncUI();}},
];
/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stT').innerHTML=T.toFixed(0)+' <small>℃</small>';
  document.getElementById('stP').innerHTML=Pm.toFixed(1)+' <small>MPa</small>';
  document.getElementById('stRho').innerHTML=density().toFixed(2)+' <small>g/mL</small>';
  const e=document.getElementById('stExt');
  e.innerHTML=(extract*100).toFixed(0)+'<small>%</small>';
  e.className='v '+(extract>0.6?'ok':'');
}
function applyPageTheme(dark){
  chartBg.material.color.setHex(dark?0x151b25:0xded7cb);
}
function syncUI(){
  document.getElementById('sT').value=T;document.getElementById('sTVal').textContent=T.toFixed(0);
  document.getElementById('sP').value=Pm;document.getElementById('sPVal').textContent=Pm.toFixed(1);
  wp.position.set(tx(T),ty(Pm),0.08);
  menG.visible=!isSC();
  const sc=isSC();
  fluidM.color.setHex(sc?0xa9e34b:0x74c0fc);
  updateStats();
}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  const bind=(id,dec,fn)=>{const el=$(id);const f=()=>{fn(+el.value);$(id+'Val').textContent=(+el.value).toFixed(dec);};el.addEventListener('input',f);f();};
  bind('sT',0,v=>{T=v;syncUI();});
  bind('sP',1,v=>{Pm=v;syncUI();});
  bind('sFlow',1,v=>{flow=v;});
  $('bAmb').addEventListener('click',()=>{T=20;Pm=1;syncUI();});
  $('bCrit').addEventListener('click',()=>{T=35;Pm=9;syncUI();});
  $('bPurge').addEventListener('click',()=>{Pm=1.5;syncUI();setTimeout(()=>{Pm=9;syncUI();},1400);});
  $('tglPhase').addEventListener('change',e=>{phaseOn=e.target.checked;chartG.visible=phaseOn;});
  syncUI();
  addLabel(()=>L('临界点 31 ℃ / 7.4 MPa','Critical point: 31 °C / 7.4 MPa'),new THREE.Vector3(-5.6,4.35,-1.1),'g',()=>phaseOn);
  addLabel(()=>L('液面在此消失','Meniscus vanishes here'),new THREE.Vector3(-0.6,5.6,0),'b');
  addLabel(()=>L('似液体:溶解;似气体:钻缝','Liquid-like: dissolves. Gas-like: percolates'),new THREE.Vector3(-0.6,4.0,1.2),'y');
  addLabel(()=>L('泄压:溶解度跳水,溶质落下','Drop the pressure: solute falls out'),new THREE.Vector3(4.6,4.1,0),'r');
}
/* ---- 主循环 ---- */
function tick(dt,dts){
  const sp=dts*flow*(isSC()?1.4:0.5);
  for(let i=0;i<NF;i++){
    fT[i]+=sp*0.14;
    if(fT[i]>1){fT[i]=0;fA[i]=Math.random()*2*Math.PI;fR[i]=0.25+Math.random()*1.05;}
    const t=fT[i];
    let x,y,z;
    if(t<0.42){ /* 上升管进入釜顶 */
      x=-4.4+0.0;y=5.6-t/0.42*5.4-0.3;x=-3.4+t/0.42*2.8;z=0;
    }else if(t<0.82){ /* 穿过豆床螺旋下行 */
      const u=(t-0.42)/0.4;
      y=3.8-u*3.3;
      const ang=fA[i]+u*5.0;
      x=Math.cos(ang)*fR[i];z=Math.sin(ang)*fR[i]*0.6;
    }else{ /* 去分离釜 */
      const u=(t-0.82)/0.18;
      x=-0.6+u*5.2;y=0.6+Math.sin(u*Math.PI)*1.6;z=0;
    }
    m4.makeTranslation(x,clamp(y,0.2,5.4),z);
    fluid.setMatrixAt(i,m4);
  }
  fluid.instanceMatrix.needsUpdate=true;
  if(isSC()&&dts>0)extract=Math.min(1,extract+dts*0.06*dissolve());
  if(!isSC()&&dts>0)extract=Math.max(0,extract-dts*0.02);
  menG.rotation.y+=dts*0.4;
}

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
