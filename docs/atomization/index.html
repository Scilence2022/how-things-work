<style>

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);

  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.2,4.6,12.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.4,2.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与试验台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const frameM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8,metalness:0.2});
const post=new THREE.Mesh(new THREE.BoxGeometry(0.5,2.0,0.5),frameM);
post.position.set(-6.9,1.0,0);scene.add(post);
const foot=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.08,1.2),frameM);
foot.position.set(-6.9,0.04,0);scene.add(foot);

/* ---- 喷嘴:供油管+锥形喷体+小孔 ---- */
const jetM=new THREE.MeshStandardMaterial({color:0x9aa6b2,roughness:0.3,metalness:0.85});
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.2,24),jetM);
barrel.rotation.z=Math.PI/2;barrel.position.set(-6.9,2.2,0);scene.add(barrel);
const feed=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,1.4,16),jetM);
feed.rotation.z=Math.PI/2;feed.position.set(-8.2,2.2,0);scene.add(feed);
const cone1=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.4,0.85,24),jetM);
cone1.rotation.z=-Math.PI/2;cone1.position.set(-5.875,2.2,0);scene.add(cone1);
const cone2=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.17,0.3,20),jetM);
cone2.rotation.z=-Math.PI/2;cone2.position.set(-5.3,2.2,0);scene.add(cone2);
const XJ=-5.1,YJ=2.2;

/* ---- 阶段一:连续液柱(InstanceMesh 球链+正弦表面波) ---- */
const NC=52;
const colIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,10,10),
  new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),NC);
colIM.frustumCulled=false;scene.add(colIM);
const tc0=new THREE.Color();
for(let i=0;i<NC;i++){const s=i/(NC-1);
  colIM.setColorAt(i,tc0.setRGB(0.36+0.2*s,0.66+0.14*s,1));}
/* ---- 阶段三:液丝(拉伸椭球) ---- */
const NLg=60;
const ligGeo=new THREE.SphereGeometry(0.05,8,8);ligGeo.scale(0.35,0.35,3.2);
const ligIM=new THREE.InstancedMesh(ligGeo,
  new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),NLg);
ligIM.frustumCulled=false;scene.add(ligIM);
for(let i=0;i<NLg;i++){const s=i/NLg;
  ligIM.setColorAt(i,tc0.setRGB(0.45+0.15*s,0.88-0.08*s,0.72-0.1*s));}
/* ---- 阶段四:液滴群(对数正态分布) ---- */
const ND=380;
const dropIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,10,10),
  new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),ND);
dropIM.frustumCulled=false;scene.add(dropIM);
const dX=new Float32Array(ND),dR=new Float32Array(ND),dPhi=new Float32Array(ND),
  dSp=new Float32Array(ND),dSz=new Float32Array(ND),dZo=new Float32Array(ND);
const cSm=new THREE.Color(0.85,0.97,1),cBg=new THREE.Color(0.1,0.55,0.75);
/* 尺寸标尺:100/50/20/10 μm 浮标 */
const pinM=new THREE.MeshStandardMaterial({color:0xbfe9f2,roughness:0.3,metalness:0.1});
const rulerBase=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.04,0.3),frameM);
rulerBase.position.set(4.9,0.5,0);scene.add(rulerBase);
const rulerDefs=[[3.4,0.15,'100 μm'],[4.4,0.11,'50 μm'],[5.4,0.075,'20 μm'],[6.4,0.055,'10 μm']];
for(const rd of rulerDefs){
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.45,8),frameM);
  pin.position.set(rd[0],0.72,0);scene.add(pin);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(rd[1],14,12),pinM);
  ball.position.set(rd[0],0.95+rd[1],0);scene.add(ball);
}
/* 横流风条纹 */
const NW=16;
const windM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.28,toneMapped:false});
const windIM=new THREE.InstancedMesh(new THREE.BoxGeometry(0.04,0.04,1.2),windM,NW);
windIM.frustumCulled=false;windIM.visible=false;scene.add(windIM);
const wX=new Float32Array(NW),wY=new Float32Array(NW),wZ=new Float32Array(NW);
for(let i=0;i<NW;i++){
  wX[i]=-1.5+Math.random()*8;wY[i]=1.2+Math.random()*2.4;wZ[i]=-6.5+Math.random()*13;
}
/* 锥面指引线 */
const coneGeo=new THREE.BufferGeometry();
coneGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(12),3));
const coneLines=new THREE.LineSegments(coneGeo,
  new THREE.LineBasicMaterial({color:0x66d9e8,transparent:true,opacity:0.3,toneMapped:false}));
scene.add(coneLines);
/* 追踪液滴:被压扁成透镜状再碎成子滴 */
const hero=new THREE.Mesh(new THREE.SphereGeometry(0.14,20,16),
  new THREE.MeshStandardMaterial({color:0x9fe8f2,roughness:0.15,metalness:0.1}));
hero.visible=false;scene.add(hero);
const heroRing=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.018,8,28),
  new THREE.MeshBasicMaterial({color:0x66d9e8,transparent:true,opacity:0.7,toneMapped:false}));
heroRing.visible=false;scene.add(heroRing);
const CH=6;
const chIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,10,10),
  new THREE.MeshBasicMaterial({color:0x8fe0ec,toneMapped:false}),CH);
chIM.frustumCulled=false;scene.add(chIM);
const chV=[];
for(let i=0;i<CH;i++)chV.push(new THREE.Vector3(Math.random()-0.5,Math.random()-0.3,Math.random()-0.2).normalize().multiplyScalar(1.6+Math.random()));

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let P=2,mu=4,crossOn=false,trackOn=false;
let We=48,SMD=90,theta=26,tanH=0.23,Lc=1.37,Llg=2.2,uAx=2.0;
const W=2.6,DEG=Math.PI/180;
let hX=-3.4,hR=0.5,hZ=0,hFl=0,hStage=0,hResp=0,chT=1;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

function derive(){
  We=24*P;
  SMD=560/Math.sqrt(We)*(1+0.028*mu);
  theta=clamp(12+34*We/(We+70),12,46);
  tanH=Math.tan(theta/2*DEG);
  Lc=clamp(9.5/Math.sqrt(We),0.35,2.6);
  Llg=clamp(3.2-We/60,0.7,2.2);
  uAx=1.6+P*0.22;
}
function spawnDrop(i,init){
  dPhi[i]=Math.random()*Math.PI*2;
  dX[i]=init?XJ+0.3+Math.random()*12.4:XJ+Lc+Llg*(0.1+0.9*Math.random());
  dR[i]=Math.max(0.02,tanH*(dX[i]-XJ))*(0.25+0.75*Math.random());
  dSp[i]=0.75+0.5*Math.random();
  const g=Math.random()+Math.random()+Math.random()-1.5;
  dSz[i]=clamp(Math.exp(-0.55+0.62*g),0.15,2.6);
  dZo[i]=0;
}
for(let i=0;i<ND;i++)spawnDrop(i,true);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('连续液柱:尚未失稳的核心流','Continuous jet: the undisturbed core'),new THREE.Vector3(-4.5,3.2,0),'b');
addLabel(()=>L('表面波:KH 波越长越大','Surface waves: KH waves growing'),new THREE.Vector3(-3.1,2.85,0),'g');
addLabel(()=>L('液丝:波峰被撕出的细线','Ligaments: threads torn off the crests'),new THREE.Vector3(-2.4,3.55,0),'g');
addLabel(()=>L('雾滴群:对数正态粒径','Drop cloud: log-normal sizes'),new THREE.Vector3(1.6,4.45,0),'y');
addLabel(()=>L('横流:把雾吹偏、撕碎大滴','Crossflow: bends the spray, shreds big drops'),new THREE.Vector3(3.0,1.15,1.2),'r',()=>crossOn);
addLabel(()=>L('追踪液滴:压扁→碎裂','Tracked drop: flattened → shattered'),new THREE.Vector3(2.9,3.35,1.0),'b',()=>trackOn);
for(const rd of rulerDefs)
  addLabel(()=>rd[2],new THREE.Vector3(rd[0],1.15+rd[1]*2,0),'');

function setP(v){P=clamp(v,0.5,20);document.getElementById('sP').value=P;
  document.getElementById('sPVal').textContent=P.toFixed(1)+' MPa';derive();}
function setMu(v){mu=clamp(v,1,20);document.getElementById('sMu').value=mu;
  document.getElementById('sMuVal').textContent=mu.toFixed(0)+' cSt';derive();}
function crossSet(v){crossOn=v;document.getElementById('bCross').classList.toggle('on',v);
  windIM.visible=v;}
function trackSet(v){trackOn=v;document.getElementById('tglTrack').checked=v;
  const alive=trackOn&&hStage!==2;
  hero.visible=alive;heroRing.visible=alive;}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'出喷嘴:压力把液体挤成一根连续液柱',en:'Out of the nozzle: pressure squeezes the liquid into a continuous jet',
  act(){setP(1);setMu(4);crossSet(false);}},
 {zh:'表面失稳:Kelvin–Helmholtz 波选择性生长',en:'Surface instability: Kelvin–Helmholtz waves grow selectively',
  act(){setP(2);setMu(4);}},
 {zh:'液丝剥离:波峰被气流撕成细线',en:'Ligament peeling: wave crests are shredded into threads',
  act(){setP(6);}},
 {zh:'断裂成滴:表面张力把液丝收圆成球',en:'Breakup into drops: surface tension rounds the threads into spheres',
  act(){setP(9);setMu(4);}},
 {zh:'压力加码:We 变大,液柱变短、SMD 变小',en:'More pressure: We rises — shorter jet, smaller SMD',
  act(){setP(18);}},
 {zh:'二次破碎:大滴在横流里被压扁、再碎成子滴',en:'Secondary breakup: big drops flatten in the crossflow and shatter into children',
  act(){setP(10);crossSet(true);trackSet(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stP').innerHTML=P.toFixed(1)+'<small> MPa</small>';
  document.getElementById('stWe').textContent=We.toFixed(0);
  document.getElementById('stSmd').innerHTML=SMD.toFixed(0)+'<small> μm</small>';
  document.getElementById('stAng').innerHTML=theta.toFixed(0)+'<small>°</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bLow').addEventListener('click',()=>{setP(1);
  document.getElementById('bLow').classList.add('on');
  document.getElementById('bHigh').classList.remove('on');});
document.getElementById('bHigh').addEventListener('click',()=>{setP(18);
  document.getElementById('bHigh').classList.add('on');
  document.getElementById('bLow').classList.remove('on');});
document.getElementById('bCross').addEventListener('click',()=>crossSet(!crossOn));
document.getElementById('sP').addEventListener('input',e=>setP(+e.target.value));
document.getElementById('sMu').addEventListener('input',e=>setMu(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglTrack').addEventListener('change',e=>trackSet(e.target.checked));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),tv=new THREE.Vector3(),sv=new THREE.Vector3();
const tq=new THREE.Quaternion(),tc=new THREE.Color(),ZAX=new THREE.Vector3(0,0,1);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 液柱:半径沿程收缩+正弦表面波 */
  for(let i=0;i<NC;i++){
    const s=i/(NC-1);
    const xx=XJ+s*Lc;
    const amp=0.02+0.1*s*s;
    const yy=YJ+amp*Math.sin(xx*7.0-simT*uAx*2.2)+amp*0.35*Math.sin(xx*11.0-simT*uAx*2.9+1.7);
    const zz=amp*0.5*Math.sin(xx*8.5-simT*uAx*2.5+0.6);
    const rr=0.085*(1-0.72*s)*(1+0.5*s*Math.sin(xx*9.0-simT*uAx*2.4));
    const sc=Math.max(0.02,rr/0.05);
    m4.makeScale(sc,sc,sc);m4.setPosition(xx,yy,zz);
    colIM.setMatrixAt(i,m4);
  }
  colIM.instanceMatrix.needsUpdate=true;
  /* 液丝:锥面展开+拍动 */
  for(let i=0;i<NLg;i++){
    const si=(i+0.5)/NLg,ph=i*2.399963;
    const xx=XJ+Lc+si*Llg;
    const base=Math.max(0.03,tanH*(xx-XJ))*(0.45+0.55*((i*0.618)%1));
    const dd=base*(1+0.25*Math.sin(simT*8-xx*3.0+ph*3.0));
    const yy=YJ+dd*Math.sin(ph),zz=dd*Math.cos(ph);
    tv.set(1,tanH*Math.sin(ph),tanH*Math.cos(ph)).normalize();
    tq.setFromUnitVectors(ZAX,tv);
    const size=0.45+0.65*(1-si);
    m4.compose(tv.set(xx,yy,zz),tq,sv.setScalar(size));
    ligIM.setMatrixAt(i,m4);
  }
  ligIM.instanceMatrix.needsUpdate=true;
  /* 液滴群 */
  for(let i=0;i<ND;i++){
    dX[i]+=uAx*dSp[i]*dts;
    dR[i]+=tanH*uAx*dSp[i]*dts*0.9;
    if(crossOn){
      dZo[i]+=W*1.4*dts/(0.35+dSz[i]);
      if(dSz[i]>1.25)dSz[i]=Math.max(0.5,dSz[i]-dts*1.7);
    }
    if(dX[i]>7.6||dR[i]>4.8)spawnDrop(i,false);
    const yy=YJ+dR[i]*Math.sin(dPhi[i]);
    const zz=dR[i]*Math.cos(dPhi[i])+dZo[i];
    const sc=dSz[i]*0.8;
    m4.makeScale(sc,sc,sc);m4.setPosition(dX[i],yy,zz);
    dropIM.setMatrixAt(i,m4);
    tc.copy(cSm).lerp(cBg,clamp((dSz[i]-0.15)/2.45,0,1));
    dropIM.setColorAt(i,tc);
  }
  dropIM.instanceMatrix.needsUpdate=true;
  if(dropIM.instanceColor)dropIM.instanceColor.needsUpdate=true;
  /* 锥面指引线 */
  {
    const pa=coneGeo.attributes.position,xe=XJ+7;
    pa.setXYZ(0,XJ,YJ,0);pa.setXYZ(1,xe,YJ+7*tanH,0);
    pa.setXYZ(2,XJ,YJ,0);pa.setXYZ(3,xe,YJ-7*tanH,0);
    pa.needsUpdate=true;
  }
  /* 横流条纹 */
  if(windIM.visible){
    for(let i=0;i<NW;i++){
      wZ[i]+=W*dts;
      if(wZ[i]>6.5){wZ[i]=-6.5;wX[i]=-1.5+Math.random()*8;wY[i]=1.2+Math.random()*2.4;}
      m4.makeScale(1,1,1);m4.setPosition(wX[i],wY[i],wZ[i]);
      windIM.setMatrixAt(i,m4);
    }
    windIM.instanceMatrix.needsUpdate=true;
  }
  /* 追踪液滴:飞行→压扁→爆裂→重生 */
  if(trackOn){
    if(hStage===0){
      hX+=uAx*0.8*dts;hR+=tanH*uAx*0.8*dts;hZ+=crossOn?W*0.5*dts/(1.2):0;
      if(crossOn&&hX>-2.6)hStage=1;
      if(hX>7.2){hX=XJ+Lc+Llg*0.3;hR=Math.max(0.05,tanH*(hX-XJ));hZ=0;}
      hero.position.set(hX,YJ+hR,hZ);
      hero.scale.set(1+0.1*Math.sin(simT*7),1-0.07*Math.sin(simT*7),1);
    }else if(hStage===1){
      hX+=uAx*0.55*dts;
      hFl=Math.min(1,hFl+dts*1.6);
      hero.position.set(hX,YJ+hR,hZ);
      hero.scale.set(1.35+0.25*hFl,0.6-0.15*hFl,1.05);
      if(hFl>=1){hStage=2;hResp=0.9;chT=0;}
    }else{
      hResp-=dts;chT+=dts;
      if(hResp<=0){hStage=0;hFl=0;hX=XJ+Lc+Llg*0.3;hR=Math.max(0.05,tanH*(hX-XJ));hZ=0;}
    }
    const alive=hStage!==2;
    hero.visible=alive;heroRing.visible=alive;
    heroRing.position.copy(hero.position);
    heroRing.rotation.z=simT*2.0;
    for(let i=0;i<CH;i++){
      if(hStage===2&&chT<0.9){
        const t=chT*1.3;
        m4.makeScale(Math.max(0.02,1-chT),Math.max(0.02,1-chT),Math.max(0.02,1-chT));
        m4.setPosition(hero.position.x+chV[i].x*t,hero.position.y+chV[i].y*t,hero.position.z+chV[i].z*t);
      }else{
        m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);
      }
      chIM.setMatrixAt(i,m4);
    }
    chIM.instanceMatrix.needsUpdate=true;
  }else{
    hero.visible=false;heroRing.visible=false;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setP(2);setMu(4);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
