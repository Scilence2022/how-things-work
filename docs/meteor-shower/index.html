<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>流星雨 · 地球撞进彗星留下的沙尘带</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="title">
  <h1 data-zh="流星雨 · 地球撞进彗星留下的沙尘带" data-en="Meteor Showers · Earth punches through a comet's dust band">流星雨 · 地球撞进彗星留下的沙尘带</h1>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,40,160);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,600);
camera.position.set(-14,12,20);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=160;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(8,10,6);scene.add(key);

/* ---- 太空视角:太阳+彗星轨道+尘带+地球 ---- */
const spaceG=new THREE.Group();scene.add(spaceG);
spaceG.visible=true;
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.1,24,18),
  new THREE.MeshBasicMaterial({color:0xffd43b}));
spaceG.add(sun);
const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(1.5,24,18),
  new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.18}));
spaceG.add(sunGlow);
/* 彗星椭圆轨道(拉长) */
const ORB_A=13,ORB_B=7.5;
const orbPts=[];
for(let i=0;i<=120;i++){
  const a=i/120*Math.PI*2;
  orbPts.push(new THREE.Vector3(Math.cos(a)*ORB_A,0,Math.sin(a)*ORB_B));
}
spaceG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbPts),
  new THREE.LineBasicMaterial({color:0x8a94a6,transparent:true,opacity:0.4})));
/* 地球轨道(圆) */
const E_ORB=9.5;
const ePts=[];
for(let i=0;i<=120;i++){
  const a=i/120*Math.PI*2;
  ePts.push(new THREE.Vector3(Math.cos(a)*E_ORB,0,Math.sin(a)*E_ORB));
}
spaceG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ePts),
  new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.3})));
const earth=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,16),
  new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.6}));
spaceG.add(earth);
const earthAtm=new THREE.Mesh(new THREE.SphereGeometry(0.52,20,16),
  new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.14}));
spaceG.add(earthAtm);
/* 彗核 */
const nucleus=new THREE.Group();spaceG.add(nucleus);
const nucM=new THREE.MeshStandardMaterial({color:0x9a8f80,roughness:0.9});
nucleus.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.34,1),nucM));
const tailDir=new THREE.Mesh(new THREE.ConeGeometry(0.25,1.6,10),
  new THREE.MeshBasicMaterial({color:0xa5d8ff,transparent:true,opacity:0.22}));
nucleus.add(tailDir);
/* 尘带:沿彗星轨道的粒子(粗=新撒的,细=老的) */
const NDUST=420;
const dustM=new THREE.MeshBasicMaterial({transparent:true,opacity:0.8});
const dust=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,5,5),dustM,NDUST);
dust.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NDUST*3),3);
spaceG.add(dust);
const dustP=[];
for(let i=0;i<NDUST;i++){
  const a=Math.random()*Math.PI*2;
  const dens=Math.exp(-Math.pow((a-2.2)/0.5,2));   // 尘带集中在轨道一段
  dustP.push({a,r0:1+(Math.random()-0.5)*0.16,y:(Math.random()-0.5)*0.5,vis:Math.random()<Math.max(0.25,dens)});
}
/* 流星(太空视角:撞向地球的亮线) */
const NMT=24;
const metM=new THREE.MeshBasicMaterial({transparent:true,opacity:0.9});
const mets=new THREE.InstancedMesh(new THREE.BoxGeometry(0.5,0.02,0.02),metM,NMT);
spaceG.add(mets);
const metP=[];for(let i=0;i<NMT;i++)metP.push({t:-1,ox:0,oy:0,oz:0});
const m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),e4=new THREE.Euler(),
      v4=new THREE.Vector3(),s4=new THREE.Vector3();

/* ---- 地面视角:天空+地平线+辐射点+放射流星 ---- */
const groundViewG=new THREE.Group();scene.add(groundViewG);
groundViewG.visible=false;
const skyM=new THREE.MeshBasicMaterial({color:0x0b1020,side:THREE.BackSide});
const sky=new THREE.Mesh(new THREE.SphereGeometry(120,24,16),skyM);
groundViewG.add(sky);
/* 星空点 */
{
  const NS=300,pos=new Float32Array(NS*3);
  for(let i=0;i<NS;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI/2;
    const r=100;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r;pos[i*3+1]=Math.sin(e)*r;pos[i*3+2]=Math.sin(a)*Math.cos(e)*r;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  groundViewG.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xdfe8f2,size:0.5,sizeAttenuation:false})));
}
const grassM=new THREE.MeshStandardMaterial({color:0x1a2a1e,roughness:0.95});
const grass=new THREE.Mesh(new THREE.CircleGeometry(60,32),grassM);
grass.rotation.x=-Math.PI/2;grass.position.y=-0.02;groundViewG.add(grass);
/* 辐射点方向(天顶偏北) */
const RAD_DIR=new THREE.Vector3(-0.35,0.75,-0.55).normalize();
const radiantMark=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.05,8,32),
  new THREE.MeshBasicMaterial({color:0xffd43b}));
radiantMark.position.copy(RAD_DIR).multiplyScalar(70);
radiantMark.lookAt(0,0,0);groundViewG.add(radiantMark);
/* 地面流星:从辐射点方向散开的细长条 */
const NGMET=30;
const gmetM=new THREE.MeshBasicMaterial({transparent:true,opacity:0.95});
const gmets=new THREE.InstancedMesh(new THREE.BoxGeometry(2.2,0.06,0.06),gmetM,NGMET);
groundViewG.add(gmets);
const gmetP=[];for(let i=0;i<NGMET;i++)gmetP.push({t:-1,ax:0,ay:0});

/* ---- 烧蚀剖面小板 ---- */
const ablG=new THREE.Group();ablG.position.set(4.9,3.2,-2.2);ablG.rotation.y=-0.5;scene.add(ablG);
const aBoard=new THREE.Mesh(new THREE.BoxGeometry(3.4,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
ablG.add(aBoard);
/* 尘埃粒+压缩发光+尾迹 */
const grainM=new THREE.MeshBasicMaterial({color:0xc9b48a});
const grain=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),grainM);
ablG.add(grain);
const glowM=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.4});
const glow=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),glowM);
ablG.add(glow);
const trailM=new THREE.LineBasicMaterial({color:0xffd43b});
const trail=new THREE.Line(new THREE.BufferGeometry(),trailM);
ablG.add(trail);
/* 大气层界线 */
const atmoLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(-1.5,0.5,0.05),new THREE.Vector3(1.5,0.5,0.05)]),
  new THREE.LineBasicMaterial({color:0x3a4656}));
ablG.add(atmoLine);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('彗星:每次回归撒一层尘','The comet: one dust layer per return'),new THREE.Vector3(0,2.2,0),'b');
addLabel(()=>L('尘带:铺满整条轨道,密度不均','Dust band: spread along the orbit, denser in clumps'),new THREE.Vector3(9.5,1.4,3),'y');
addLabel(()=>L('地球:每年同一天撞进同一条带','Earth: crosses the same band the same week each year'),new THREE.Vector3(0,-1.6,0),'g');
addLabel(()=>L('辐射点:平行飞来的透视汇聚','The radiant: parallel trails converge by perspective'),new THREE.Vector3(-24,52,-38),'y',()=>groundView);
addLabel(()=>L('冲击压缩烧蚀,不是摩擦','Shock compression ablation, not friction'),new THREE.Vector3(4.9,4.5,-2.2),'r',()=>ablOn);

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let dustDens=1,entryV=59;
let groundView=false;
let earthA=2.2;     // 地球轨道相位
let zhr=100;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
let ablOn=true;
function setDust(v){dustDens=v;document.getElementById('sDust').value=v;
  document.getElementById('sDustVal').textContent=v.toFixed(1);}
function setV(v){entryV=v;document.getElementById('sV').value=v;
  document.getElementById('sVVal').textContent=v.toFixed(0);}
function zhrCalc(){return Math.round(20+dustDens*dustDens*90);}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'彗星回归:太阳加热,冰升华把尘埃抛进轨道',en:'Comet returns: sunlight sublimates ice and flings dust into orbit',
  act(){setDust(1.0);setV(59);groundView=false;document.getElementById('tglView').checked=false;
    document.getElementById('bPer').classList.add('on');document.getElementById('bLeo').classList.remove('on');document.getElementById('bSpo').classList.remove('on');}},
 {zh:'尘埃铺满整条轨道,浓淡不均成「带」',en:'Dust spreads along the whole orbit — denser clumps become the band',
  act(){setDust(1.4);}},
 {zh:'地球每年同一天撞进同一条带:英仙在 8 月',en:'Earth crosses the same band the same week: Perseids in August',
  act(){earthA=2.2;setDust(1.2);}},
 {zh:'切到地面视角:平行的流星透视上汇成辐射点',en:'Switch to the ground: parallel meteors converge at the radiant',
  act(){groundView=true;document.getElementById('tglView').checked=true;setCamera();setDust(1.2);}},
 {zh:'~60 km/s 冲击压缩烧蚀发光:尘埃自己烧没了',en:'~60 km/s shock-heats the grain: it ablates itself away',
  act(){setV(59);}},
 {zh:'狮子座风暴:地球撞进新撒的浓带,ZHR 翻百倍',en:'Leonid storms: a fresh dense band — ZHR ×100',
  act(){setDust(2.0);setV(71);document.getElementById('bLeo').classList.add('on');document.getElementById('bPer').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stZ').innerHTML=zhrCalc()*(dustDens>1.8?100:1)+'<small> 颗/h</small>';
  document.getElementById('stV').innerHTML=entryV.toFixed(0)+'<small> km/s</small>';
  document.getElementById('stA').innerHTML=(118-entryV*0.45).toFixed(0)+'<small> km</small>';
  document.getElementById('stR').textContent=groundView?L('英仙座 γ','Perseus γ'):L('—','—');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bPer').addEventListener('click',()=>{
  setDust(1.0);setV(59);
  document.getElementById('bPer').classList.add('on');
  document.getElementById('bLeo').classList.remove('on');
  document.getElementById('bSpo').classList.remove('on');
});
document.getElementById('bLeo').addEventListener('click',()=>{
  setDust(2.0);setV(71);
  document.getElementById('bLeo').classList.add('on');
  document.getElementById('bPer').classList.remove('on');
  document.getElementById('bSpo').classList.remove('on');
});
document.getElementById('bSpo').addEventListener('click',()=>{
  setDust(0.2);setV(35);
  document.getElementById('bSpo').classList.add('on');
  document.getElementById('bPer').classList.remove('on');
  document.getElementById('bLeo').classList.remove('on');
});
document.getElementById('sDust').addEventListener('input',e=>setDust(+e.target.value));
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('tglView').addEventListener('change',e=>{groundView=e.target.checked;setCamera();});
document.getElementById('tglAbl').addEventListener('change',e=>{ablOn=e.target.checked;ablG.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
function setCamera(){
  spaceG.visible=!groundView;
  groundViewG.visible=groundView;
  if(groundView){
    camera.position.set(0,1.6,8);
    controls.target.set(0,6,-20);
    controls.minDistance=1;controls.maxDistance=200;
  }else{
    camera.position.set(-14,12,20);
    controls.target.set(0,0,0);
    controls.minDistance=3;controls.maxDistance=160;
  }
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0);
  simT+=dts;
  /* 彗星沿轨道 */
  const ca=simT*0.06+2.2;
  nucleus.position.set(Math.cos(ca)*ORB_A,0,Math.sin(ca)*ORB_B);
  tailDir.lookAt(scene.position);
  tailDir.rotateX(Math.PI/2);
  /* 地球 */
  earthA+=dts*0.05;
  earth.position.set(Math.cos(earthA)*E_ORB,0,Math.sin(earthA)*E_ORB);
  earthAtm.position.copy(earth.position);
  /* 尘带粒子 */
  const near=clamp(1.15-Math.abs(((ca-earthA+Math.PI)%(Math.PI*2))-Math.PI)/1.2,0,1);
  for(let i=0;i<NDUST;i++){
    const d=dustP[i];
    d.a+=dts*0.0006;
    const x=Math.cos(d.a)*ORB_A*d.r0,z=Math.sin(d.a)*ORB_B*d.r0;
    const on=d.vis&&Math.random()<clamp(dustDens*0.9,0.15,1);
    const s=on?1:0.001;
    m4.makeScale(s,s,s);m4.setPosition(x,d.y,z);
    dust.setMatrixAt(i,m4);
    const heat=near>0.7?1:0.4;
    tmpC.setHex(d.vis?0xc9b48a:0x55637a);
    dust.setColorAt(i,tmpC);
  }
  dust.instanceMatrix.needsUpdate=true;
  if(dust.instanceColor)dust.instanceColor.needsUpdate=true;
  /* 太空流星:撞向地球的亮线(地球在带内时高频) */
  {
    let n=0;
    const rate=dt*speedMul*(playing?1:0)*(2+near*14*dustDens);
    for(let i=0;i<NMT;i++){
      const m=metP[i];
      if(m.t<0&&Math.random()<rate*0.35&&i<6+near*14){
        m.t=0;
        m.ox=earth.position.x+(Math.random()-0.5)*3;
        m.oy=2+Math.random()*2;
        m.oz=earth.position.z+(Math.random()-0.5)*3;
      }
      if(m.t>=0){
        m.t+=dt*2.4*speedMul*(playing?1:0);
        if(m.t>1)m.t=-1;
        else{
          const p=m.t;
          const dx=Math.cos(earthA)*E_ORB-m.ox, dz=Math.sin(earthA)*E_ORB-m.oz;
          const len=0.6+p*0.4;
          v4.set(m.ox+dx*p,m.oy*(1-p),m.oz+dz*p);
          e4.set(0,Math.atan2(dx,dz),0);
          q4.setFromEuler(e4);
          s4.set(len*(0.5+entryV/71),1,1);
          m4.compose(v4,q4,s4);
          mets.setMatrixAt(n++,m4);
        }
      }
    }
    for(let i=n;i<NMT;i++){v4.set(0,-999,0);s4.setScalar(0.001);m4.compose(v4,new THREE.Quaternion(),s4);mets.setMatrixAt(i,m4);}
    mets.instanceMatrix.needsUpdate=true;
  }
  /* 地面流星:自辐射点放射 */
  {
    let n=0;
    const rate=dt*speedMul*(playing?1:0)*(1.2+dustDens*7);
    for(let i=0;i<NGMET;i++){
      const m=gmetP[i];
      if(m.t<0&&Math.random()<rate*0.4){
        m.t=0;
        m.ax=(Math.random()-0.5)*1.9;
        m.ay=(Math.random()-0.5)*1.9;
      }
      if(m.t>=0){
        m.t+=dt*(0.5+entryV/71)*speedMul*(playing?1:0);
        if(m.t>1)m.t=-1;
        else{
          const p=m.t;
          /* 起点:辐射点方向远处;终点:观察者附近下坠 */
          const sx=RAD_DIR.x*60+m.ax*20,sy=RAD_DIR.y*60+18,sz=RAD_DIR.z*60+m.ay*20;
          const ex=m.ax*6,ey=-2,ez=m.ay*6;
          v4.set(sx+(ex-sx)*p,sy+(ey-sy)*p,sz+(ez-sz)*p);
          const dir=new THREE.Vector3(ex-sx,ey-sy,ez-sz).normalize();
          e4.set(0,Math.atan2(dir.x,dir.z),Math.acos(clamp(dir.y,-1,1))-Math.PI/2);
          q4.setFromEuler(e4);
          s4.set(1+p*1.6,1,1);
          m4.compose(v4,q4,s4);
          gmets.setMatrixAt(n++,m4);
        }
      }
    }
    for(let i=n;i<NGMET;i++){v4.set(0,-999,0);s4.setScalar(0.001);m4.compose(v4,new THREE.Quaternion(),s4);gmets.setMatrixAt(i,m4);}
    gmets.instanceMatrix.needsUpdate=true;
  }
  /* 烧蚀剖面:粒子下落,压缩发光随速度 */
  {
    const p=(simT*0.25)%1;
    grain.position.set(-1.1+p*2.2,0.5-p*0.9,0.06);
    glow.position.copy(grain.position);
    glow.position.y+=0.06;
    const heat=clamp((entryV-20)/51,0.15,1);
    glowM.opacity=p>0.12&&p<0.85?0.25+heat*0.5:0.05;
    grain.visible=p>0.12&&p<0.8;
    const tp=[];
    for(let j=0;j<12;j++){
      const q=p-j*0.02;
      if(q>0.12)tp.push(new THREE.Vector3(-1.1+q*2.2+Math.sin(q*20)*0.03,0.5-q*0.9+0.06,0.07));
    }
    trail.geometry.setFromPoints(tp);
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.25){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tmpC=new THREE.Color();
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setDust(1.0);setV(59);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
