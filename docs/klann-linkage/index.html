<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>克兰连杆 · 一根曲轴,八根杆,走出一步</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;--acc-rgb:25,113,194;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}

  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const m4=new THREE.Matrix4();
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);
camera.position.set(-7,6,12);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=120;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyLight=new THREE.DirectionalLight(0xfff2dd,1.05);keyLight.position.set(6,10,8);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9ab8ff,0.3);fillLight.position.set(-8,5,-6);scene.add(fillLight);

/* ---- 页面独特代码(定义 BG_DARK/BG_LIGHT/applyPageTheme/STEPS/updateStats/tick/pageInit) ---- */
const BG_DARK=0x101418,BG_LIGHT=0xe9e4dc;
/* 已数值调优的 Klann 参数:A 曲柄中心 C 上固定铰 E 下固定铰 */
const A={x:0,y:0},Cp={x:0.9,y:0.7},Ep={x:0.2,y:-0.2};
const R0=0.30,L1=1.9,L2=1.2,L3=2.4,L4=1.9,GY=-0.335;
function circInt(p0,r0,p1,r1){
  const dx=p1.x-p0.x,dy=p1.y-p0.y,d=Math.hypot(dx,dy);
  if(d>r0+r1||d<Math.abs(r0-r1)||d===0)return null;
  const a=(r0*r0-r1*r1+d*d)/(2*d),h2=r0*r0-a*a;
  if(h2<0)return null;const h=Math.sqrt(h2);
  const xm=p0.x+a*dx/d,ym=p0.y+a*dy/d;
  return [{x:xm+h*dy/d,y:ym-h*dx/d},{x:xm-h*dy/d,y:ym+h*dx/d}];
}
function solve(th,l3s){
  const l3=L3*l3s;
  const B={x:A.x+R0*Math.cos(th),y:A.y+R0*Math.sin(th)};
  const ds=circInt(B,L1,Cp,L2);if(!ds)return null;
  const D=ds[0].y>ds[1].y?ds[0]:ds[1];
  const fs=circInt(D,l3,Ep,L4);if(!fs)return null;
  const F=fs[0].y<fs[1].y?fs[0]:fs[1];
  return {B,D,F};
}
/* ---- 场景 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,10),groundM);
ground.rotation.x=-Math.PI/2;ground.position.set(4,GY-0.02,0);scene.add(ground);
const stripeM=new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.9});
const stripes=[];
for(let i=0;i<30;i++){
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,4),stripeM);
  s.position.set(-10+i,GY+0.002,0);scene.add(s);stripes.push(s);
}
const chassisM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.35});
const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.55,1.7),chassisM);
chassis.position.set(0.45,0.62,0);scene.add(chassis);
const cabM=new THREE.MeshStandardMaterial({color:0x3d4658,roughness:0.55,metalness:0.3});
const cab=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,1.2),cabM);
cab.position.set(1.15,1.12,0);scene.add(cab);
const pivM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.35,metalness:0.5});
[A,Cp,Ep].forEach(p=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),pivM);
  m.position.set(p.x,p.y,0);scene.add(m);
});
/* 杆件:每腿 4 杆 + 3 铰 + 脚 */
const linkM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4,metalness:0.45});
const shinM=new THREE.MeshStandardMaterial({color:0xff922b,roughness:0.45,metalness:0.4});
const footM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.5});
const jointM=new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:0.3,metalness:0.6});
function makeLeg(z,mirror){
  const g=new THREE.Group();
  const mk=(mat,r)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),mat);
    m.geometry.translate(0,0.5,0);g.add(m);return m;};
  const crank=mk(linkM,0.045),thigh=mk(linkM,0.045),shin=mk(shinM,0.05),fLink=mk(footM,0.04);
  const jB=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),jointM);
  const jD=new THREE.Mesh(new THREE.SphereGeometry(0.085,10,8),jointM);
  const jF=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.4}));
  [jB,jD,jF].forEach(j=>g.add(j));
  g.position.z=z;if(mirror)g.scale.x=-1;
  scene.add(g);
  return {g,crank,thigh,shin,fLink,jB,jD,jF};
}
function setLink(m,a,b){
  m.position.set(a.x,a.y,0);
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
  m.scale.y=len;m.rotation.z=Math.atan2(dy,dx)-Math.PI/2;
}
/* 轨迹线(D 形) */
const NTR=720;
const traceGeo=new THREE.BufferGeometry();
traceGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NTR*3),3));
const trace=new THREE.Line(traceGeo,new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.75}));
scene.add(trace);
function rebuildTrace(l3s){
  const arr=traceGeo.attributes.position.array;let n=0;
  for(let i=0;i<NTR;i++){
    const s=solve(i/NTR*2*Math.PI,l3s);if(!s)continue;
    arr[n*3]=s.F.x;arr[n*3+1]=s.F.y;arr[n*3+2]=0.35;n++;
  }
  traceGeo.setDrawRange(0,n);traceGeo.attributes.position.needsUpdate=true;
}
/* 多腿 */
let legs=[],legCount=2,l3Scale=1;
function legPhase(i){
  if(legCount===2)return i*Math.PI;
  if(legCount===4)return (i%2)*Math.PI;
  return Math.floor(i/2)*2*Math.PI/3+(i%2)*Math.PI;
}
function buildLegs(n){
  legs.forEach(l=>scene.remove(l.g));legs=[];
  const zs=n===2?[-0.42,0.42]:n===4?[-0.78,-0.26,0.26,0.78]:[-1.05,-0.63,-0.21,0.21,0.63,1.05];
  zs.forEach((z,i)=>{legs.push(makeLeg(z,false));});
}
/* 轮子对照 */
const wheelM=new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.5});
const wheel=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.09,10,24),wheelM);
wheel.position.set(0.45,0.55,1.4);wheel.visible=false;scene.add(wheel);
/* ---- 状态 ---- */
let omega=1.2,crankTh=0,groundX=0,stepsMode=false,wheelMode=false,traceOn=true;
let stride=0,lift=0,duty=0,speedMs=0;
function measure(l3s){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;const ys=[];
  for(let i=0;i<360;i++){const s=solve(i/360*2*Math.PI,l3s);if(!s)continue;
    minX=Math.min(minX,s.F.x);maxX=Math.max(maxX,s.F.x);
    minY=Math.min(minY,s.F.y);maxY=Math.max(maxY,s.F.y);ys.push(s.F.y);}
  stride=maxX-minX;lift=maxY-minY;
  duty=ys.filter(y=>y<minY+0.25*lift).length/ys.length;
}
function updateLegs(dt){
  const mir=legCount>2;
  legs.forEach((leg,i)=>{
    const ph=crankTh+legPhase(i);
    const s=solve(ph,l3Scale);if(!s)return;
    setLink(leg.crank,A,s.B);
    setLink(leg.thigh,s.B,s.D);
    setLink(leg.shin,s.D,s.F);
    setLink(leg.fLink,Ep,s.F);
    leg.jB.position.set(s.B.x,s.B.y,0);
    leg.jD.position.set(s.D.x,s.D.y,0);
    leg.jF.position.set(s.F.x,s.F.y,0);
  });
}
function scrollGround(dx){
  groundX+=dx;
  stripes.forEach(s=>{s.position.x+=dx;if(s.position.x>20)s.position.x-=30;if(s.position.x<-10.2)s.position.x+=30;});
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'单腿装配:曲柄一转,脚印一笔',en:'One leg: one crank turn, one D print',
  act(){legCount=2;buildLegs(legCount);rebuildTrace(l3Scale);}},
 {zh:'D 形两段:下段平直撑地、上段弯弧回摆',en:'Two halves: flat stance below, arc swing above',
  act(){legCount=2;buildLegs(2);}},
 {zh:'双腿相位差 180°:永有支撑',en:'Two legs at 180°: always supported',
  act(){legCount=2;buildLegs(2);}},
 {zh:'六腿平台:三对相位接力',en:'Six legs: three phased pairs',
  act(){legCount=6;buildLegs(6);}},
 {zh:'杆长扰动:步态当场变形',en:'Perturb a link: the gait deforms',
  act(){l3Scale=1.09;document.getElementById('sPert').value=1.09;
        document.getElementById('sPertVal').textContent='1.09';rebuildTrace(l3Scale);measure(l3Scale);}},
 {zh:'台阶对照:轮式过不去,腿行跨过',en:'Steps: wheels stall, legs climb',
  act(){legCount=6;buildLegs(6);stepsMode=true;
        document.getElementById('bStep').classList.add('on');
        document.getElementById('bFlat').classList.remove('on');}},
];
/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stStride').innerHTML=stride.toFixed(2)+' <small>m</small>';
  document.getElementById('stLift').innerHTML=lift.toFixed(2)+' <small>m</small>';
  document.getElementById('stDuty').innerHTML=(duty*100).toFixed(0)+'<small>%</small>';
  document.getElementById('stSpeed').innerHTML=speedMs.toFixed(2)+' <small>m/s</small>';
}
function applyPageTheme(dark){groundM.color.setHex(dark?0x1c2027:0xc9c2b6);}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  const bind=(id,dec,fn)=>{const el=$(id);const f=()=>{fn(+el.value);$(id+'Val').textContent=(+el.value).toFixed(dec);};el.addEventListener('input',f);f();};
  bind('sSpd',1,v=>{omega=v;});
  bind('sPert',2,v=>{l3Scale=v;rebuildTrace(v);measure(v);});
  $('bWalk').addEventListener('click',()=>{stepsMode=false;wheelMode=false;$('bStep').classList.remove('on');$('bFlat').classList.remove('on');$('tglWheel').checked=false;wheel.visible=false;});
  $('bStep').addEventListener('click',()=>{stepsMode=true;wheelMode=false;$('bStep').classList.add('on');$('bFlat').classList.remove('on');});
  $('bFlat').addEventListener('click',()=>{stepsMode=false;wheelMode=false;$('bStep').classList.remove('on');$('bFlat').classList.add('on');});
  $('tglTrace').addEventListener('change',e=>{traceOn=e.target.checked;trace.visible=traceOn;});
  $('tglWheel').addEventListener('change',e=>{wheelMode=e.target.checked;wheel.visible=wheelMode;legs.forEach(l=>l.g.visible=!wheelMode);});
  buildLegs(2);rebuildTrace(1);measure(1);
  addLabel(()=>L('曲柄:唯一的动力输入','The crank: the only input'),new THREE.Vector3(0,0.55,0.6),'y');
  addLabel(()=>L('触地平直段:推进行走','Flat stance: drives forward'),new THREE.Vector3(-0.9,-0.15,0.4),'g');
  addLabel(()=>L('抬腿回摆段:跨过障碍','Swing arc: clears obstacles'),new THREE.Vector3(1.6,0.5,0.4),'b');
  addLabel(()=>L('D 形脚印','The D-shaped print'),new THREE.Vector3(-2.1,0.35,0.4),'o');
}
/* ---- 主循环 ---- */
let wheelTh=0;
function tick(dt,dts){
  if(!wheelMode){
    crankTh+=omega*dts;
    updateLegs(dt);
  }else{
    wheelTh-=omega*2.4*dts;wheel.rotation.z=wheelTh;
  }
  /* 地速:撑地脚相对机身后退 → 地面同速滚动 */
  const v=omega*R0*3.1;
  speedMs=wheelMode?v*0.8:v;
  scrollGround(speedMs*dts*(wheelMode?0.8:1));
  trace.visible=traceOn&&!wheelMode;
  if(stepsMode){
    stripes.forEach((s,i)=>{s.scale.y=0.22;s.position.y=GY+0.05*Math.abs(Math.sin(i*1.7));});
  }else{
    stripes.forEach(s=>{s.scale.y=1;s.position.y=GY+0.002;});
  }
}

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
