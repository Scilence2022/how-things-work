<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.8,3.2,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,2.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与砧台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const anvilM=new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.55,metalness:0.35});
const anvil=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.9,3.4),anvilM);
anvil.position.y=0.45;scene.add(anvil);
const anvilTop=new THREE.Mesh(new THREE.BoxGeometry(3.5,0.06,3.5),
  new THREE.MeshStandardMaterial({color:0x22272e,roughness:0.4,metalness:0.5}));
anvilTop.position.y=0.93;scene.add(anvilTop);
const CONTACT=0.96;

/* ---- 头模(倒置落锤式):外壳+EPS 内衬+头球+颈 ---- */
const M2U=2.2,G0=9.81,EXAG=2.2,HEADR=0.42,A_PL=80,NL=5;
const headG=new THREE.Group();headG.position.y=CONTACT;scene.add(headG);
const skinM=new THREE.MeshStandardMaterial({color:0xd9a184,roughness:0.6});
const brainG=new THREE.Group();headG.add(brainG);
const head=new THREE.Mesh(new THREE.SphereGeometry(HEADR,32,24),skinM);brainG.add(head);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.19,0.55,16),skinM);
neck.position.y=0.52;brainG.add(neck);
const shellG=new THREE.Group();headG.add(shellG);
const shellM=new THREE.MeshStandardMaterial({color:0xe8590c,roughness:0.35});
const rimM=new THREE.MeshStandardMaterial({color:0xb0491c,roughness:0.45});
const cellMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.75});
let shellR=0.6,cells=null,cellPar=[];
/* EPS 泡沫单元:小六棱柱阵列,逐层压溃、永久变形 */
function buildHelmet(){
  while(shellG.children.length){
    const c=shellG.children.pop();
    if(c.geometry)c.geometry.dispose();
    shellG.remove(c);
  }
  if(cells){cells.dispose();cells=null;}
  const linerVis=thk/1000*M2U*EXAG;
  shellR=HEADR+linerVis+0.045;
  const shell=new THREE.Mesh(new THREE.SphereGeometry(shellR,40,20,0,Math.PI*2,Math.PI/2,Math.PI/2),shellM);
  shell.position.y=shellR;shellG.add(shell);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(shellR,0.03,10,44),rimM);
  rim.rotation.x=Math.PI/2;rim.position.y=shellR;shellG.add(rim);
  const R_in=shellR-0.04,rLo=HEADR+0.03,step=(R_in-rLo)/NL;
  const geo=new THREE.CylinderGeometry(0.042,0.042,step*0.92,6);
  cellPar=[];
  const up=new THREE.Vector3(0,1,0);
  for(let jL=0;jL<NL;jL++){
    const rj=R_in-(jL+0.5)*step;
    const nj=Math.max(8,Math.round(26*rj));
    for(let k=0;k<nj;k++){
      const th=0.28+(k/nj)*0.9,ph=k*2.39996+jL*0.35;
      const dir=new THREE.Vector3(Math.sin(th)*Math.cos(ph),-Math.cos(th),Math.sin(th)*Math.sin(ph));
      const q=new THREE.Quaternion().setFromUnitVectors(up,dir);
      cellPar.push({p:dir.clone().multiplyScalar(rj).add(new THREE.Vector3(0,shellR,0)),
        d:dir,q,layer:jL});
    }
  }
  cells=new THREE.InstancedMesh(geo,cellMat,cellPar.length);
  shellG.add(cells);
  paintCells();
}
const m4c=new THREE.Matrix4(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3();
const colC=new THREE.Color(),redC=new THREE.Color(0xe03131);
function paintCells(){
  if(!cells)return;
  const showC=document.getElementById('tglCrush').checked;
  const f=(foamUsed+(phase==='crush'?dI:0))/dmax;
  for(let i=0;i<cellPar.length;i++){
    const cp=cellPar[i],c=clamp(f*NL-cp.layer,0,1);
    tmpP.copy(cp.p).addScaledVector(cp.d,c*0.008);
    tmpS.set(1,1-0.82*c,1);
    m4c.compose(tmpP,cp.q,tmpS);
    cells.setMatrixAt(i,m4c);
    colC.setHex(0xf1f3f5);
    if(showC)colC.lerp(redC,c);
    cells.setColorAt(i,colC);
  }
  cells.instanceMatrix.needsUpdate=true;
  if(cells.instanceColor)cells.instanceColor.needsUpdate=true;
}

/* ---- 加速度历史条带(3D:绿=戴盔,红=无盔) ---- */
const NB=36,BARMAX=420,BASEY=1.02,SX0=2.75,DBG=0.105;
const barsH=new THREE.InstancedMesh(new THREE.BoxGeometry(0.085,1,0.085),
  new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.5}),NB);
const barsB=new THREE.InstancedMesh(new THREE.BoxGeometry(0.085,1,0.085),
  new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.5}),NB);
scene.add(barsH);scene.add(barsB);
barsH.frustumCulled=false;barsB.frustumCulled=false;
const base=new THREE.Mesh(new THREE.BoxGeometry(4.3,0.1,2.3),
  new THREE.MeshStandardMaterial({color:0x272d36,roughness:0.7}));
base.position.set(4.75,0.97,0);scene.add(base);
const danger=new THREE.Mesh(new THREE.BoxGeometry(4.0,0.012,2.2),
  new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.3}));
danger.position.set(4.65,1.02+200/BARMAX*1.9,0);scene.add(danger);
const hBuf=new Float32Array(NB),bBuf=new Float32Array(NB);
let hIdx=0,bIdx=0,sampleAcc=0;
function drawStrips(){
  for(let k=0;k<NB;k++){
    const g1=Math.max(0.006,hBuf[(hIdx+k)%NB])/BARMAX*1.9;
    const g2=Math.max(0.006,bBuf[(bIdx+k)%NB])/BARMAX*1.9;
    m4c.makeScale(1,g1,1);m4c.setPosition(SX0+k*DBG,BASEY+g1/2,0.62);barsH.setMatrixAt(k,m4c);
    m4c.makeScale(1,g2,1);m4c.setPosition(SX0+k*DBG,BASEY+g2/2,-0.62);barsB.setMatrixAt(k,m4c);
  }
  barsH.instanceMatrix.needsUpdate=true;barsB.instanceMatrix.needsUpdate=true;
}

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let slowMo=false;
let h=1.0,thk=25,dmax=0.025;
let phase='idle',bare=false;
let autoT=0,autoBare=false;
let vy=0,v0m=0,vC=0,dI=0,impT=0,curPeak=0;
let lastPeak=0,lastStroke=0,lastHIC=0,lastBarePeak=0;
let foamUsed=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblEPS=addLabel(()=>L('EPS 内衬:吸能泡沫','EPS liner: the energy-absorbing foam'),new THREE.Vector3(0.7,1.7,0.6),'');
const lblCrush=addLabel(()=>L('压溃区:行程换时间','Crush zone: stroke buys time'),new THREE.Vector3(0.4,1.15,0.5),'r',
  ()=>!bare&&(phase==='crush'||foamUsed>0.002));
const lblStrip=addLabel(()=>L('加速度条带:绿=戴盔 红=无盔','Accel strips: green = helmet, red = bare'),new THREE.Vector3(4.75,3.15,0),'y');
const lblSpike=addLabel(()=>L('冲击尖峰:硬碰硬','Impact spike: hard on hard'),new THREE.Vector3(4.75,2.5,-0.75),'r',
  ()=>lastBarePeak>250);

function setDrop(v){h=v;document.getElementById('sDrop').value=v;
  document.getElementById('sDropVal').textContent=v.toFixed(1)+' m';}
function setThk(v){thk=v;dmax=v/1000;foamUsed=0;
  document.getElementById('sThk').value=v;
  document.getElementById('sThkVal').textContent=v.toFixed(0)+' mm';
  buildHelmet();}
function setBtnOn(id){['bHelmet','bBare','bSecond'].forEach(x=>
  document.getElementById(x).classList.toggle('on',x===id));}
function startDrop(isB,resetFoam){
  bare=isB;shellG.visible=!isB;
  if(resetFoam)foamUsed=0;
  paintCells();
  headG.position.y=CONTACT+h*M2U;vy=0;phase='fall';
}
function finishImpact(){
  lastPeak=Math.round(curPeak);lastStroke=dI;
  lastHIC=Math.pow(Math.max(1,curPeak),2.5)*impT;
  if(bare)lastBarePeak=lastPeak;
  else foamUsed=Math.min(dmax,foamUsed+dI);
  phase='done';paintCells();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'撞击只有几毫秒:动量定理的账',en:'An impact lasts only milliseconds: the impulse–momentum ledger',
  act(){setDrop(1.0);setThk(25);slowMo=false;
    document.getElementById('tglSlow').checked=false;
    startDrop(false,true);setBtnOn('bHelmet');}},
 {zh:'EPS 泡沫逐层压溃:行程换时间',en:'EPS foam crushes layer by layer: stroke buys time',
  act(){slowMo=true;document.getElementById('tglSlow').checked=true;
    startDrop(false,true);setBtnOn('bHelmet');}},
 {zh:'峰值加速度被拉平:200 g → 80 g',en:'The peak is flattened: hundreds of g down to ~80 g',
  act(){slowMo=false;document.getElementById('tglSlow').checked=false;
    startDrop(false,true);setBtnOn('bHelmet');}},
 {zh:'无盔对照:硬碰硬、尖峰爆表',en:'Bare-head control: hard on hard, the spike pegs out',
  act(){startDrop(true,false);setBtnOn('bBare');}},
 {zh:'泡沫不回弹:一次冲击一次代价',en:'Foam never springs back: one impact, one permanent cost',
  act(){if(foamUsed<dmax*0.4)foamUsed=dmax*0.7;
    paintCells();startDrop(false,false);setBtnOn('bSecond');}},
 {zh:'外壳与内衬分工:防刺穿与吸能',en:'Shell and liner split the job: puncture defense vs energy absorption',
  act(){setThk(32);startDrop(false,true);setBtnOn('bHelmet');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stDrop').innerHTML=(h*100).toFixed(0)+'<small> cm</small>';
  const live=phase==='crush'?Math.round(curPeak):lastPeak;
  const pEl=document.getElementById('stPeak');
  pEl.innerHTML=live?live+'<small> g</small>':'—';
  pEl.className='v'+(live?(live>200?' warn':(live<=130?' ok':'')):'');
  const liveS=phase==='crush'?dI:lastStroke;
  document.getElementById('stStroke').innerHTML=liveS?(liveS*1000).toFixed(0)+'<small> mm</small>':'—';
  const liveH=phase==='crush'?Math.pow(Math.max(1,curPeak),2.5)*Math.max(impT,0.001):lastHIC;
  const hEl=document.getElementById('stHIC');
  hEl.innerHTML=liveH?Math.round(liveH):'—';
  hEl.className='v'+(liveH?(liveH>1000?' warn':(liveH<700?' ok':'')):'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bHelmet').addEventListener('click',()=>{
  startDrop(false,true);setBtnOn('bHelmet');});
document.getElementById('bBare').addEventListener('click',()=>{
  startDrop(true,false);setBtnOn('bBare');});
document.getElementById('bSecond').addEventListener('click',()=>{
  startDrop(false,false);setBtnOn('bSecond');});
document.getElementById('sDrop').addEventListener('input',e=>setDrop(+e.target.value));
document.getElementById('sThk').addEventListener('input',e=>setThk(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglCrush').addEventListener('change',paintCells);
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpV=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 自动演示:就绪/读数停留数秒后交替重放戴盔与无盔冲击 */
  if(phase==='idle'||phase==='done'){
    autoT+=dts;
    if(autoT>(phase==='idle'?0.6:2.6)){autoT=0;autoBare=!autoBare;
      startDrop(autoBare,autoBare?false:true);if(autoBare)setBtnOn('bBare');else setBtnOn('bHelmet');}
  }else autoT=0;
  /* 下落(真实 g)→ 接触 → 压溃相(时间膨胀 ×0.05,让几毫秒看得见) */
  if(phase==='fall'){
    vy+=G0*M2U*dts;
    headG.position.y-=vy*dts;
    if(headG.position.y<=CONTACT){
      headG.position.y=CONTACT;phase='crush';
      v0m=Math.sqrt(2*G0*h);vC=v0m;dI=0;impT=0;curPeak=0;sampleAcc=1;
    }
  }else if(phase==='crush'){
    const dtI=dts*0.05;sampleAcc+=dtI;
    const hdt=dtI/6;let done=false;
    for(let s=0;s<6&&!done;s++){
      let aG;
      if(bare){aG=v0m*v0m/0.004/G0;}
      else{
        const room=Math.max(0.0015,dmax-foamUsed);
        const x=clamp(dI/room,0,1);
        aG=x>=1?420:A_PL*(1+2.2*Math.pow(x,6));
      }
      curPeak=Math.max(curPeak,aG);
      vC-=aG*G0*hdt;
      dI+=Math.max(0,vC)*hdt;impT+=hdt;
      if(vC<=0){vC=0;done=true;}
    }
    if(sampleAcc>0.0006){sampleAcc=0;
      if(bare){bBuf[bIdx]=Math.min(BARMAX,curPeak);bIdx=(bIdx+1)%NB;}
      else{hBuf[hIdx]=Math.min(BARMAX,curPeak);hIdx=(hIdx+1)%NB;}}
    paintCells();
    if(done)finishImpact();
  }
  /* 头部下沉量 = 已压溃行程(累计,泡沫不回弹) */
  const cum=bare?dI:(foamUsed+(phase==='crush'?dI:0));
  const dVis=Math.min(cum*M2U*EXAG,(bare?0.012:dmax*M2U*EXAG));
  brainG.position.y=(bare?HEADR:shellR)-dVis;
  /* 加速度条带 */
  drawStrips();
  /* 跟随头模的标签 */
  headG.updateMatrixWorld();
  lblEPS.position.copy(tmpV.set(0.55,0.55,0.6).applyMatrix4(headG.matrixWorld));
  lblCrush.position.copy(tmpV.set(0.3,0.18,0.5).applyMatrix4(headG.matrixWorld));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setDrop(1.0);setThk(25);
headG.position.y=CONTACT;brainG.position.y=shellR;
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
