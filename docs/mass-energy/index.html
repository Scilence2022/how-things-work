<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>质能等价 E=mc² · 质量亏损、结合能与湮灭</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#7048e8;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  @media(max-width:900px){#stats{display:none}}

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="质能等价 E=mc²" data-en="Mass–Energy Equivalence">质能等价 E=mc²</h1>
  <div class="sub" data-zh="E=mc² 不是“质量变能量”的咒语,而是一杆秤:核子结合成核,放出的结合能就是消失的质量——一个碳-12 核比 12 个自由核子轻 0.8%;比结合能在铁处登顶,轻核聚、重核裂都在往铁爬;湮灭则是唯一 100% 兑付的账 · 拖动旋转 / 空格运行/暂停" data-en="E=mc² is not a spell for turning mass into energy — it is a balance: when nucleons bind into a nucleus, the binding energy released is exactly the missing mass — a carbon-12 nucleus is 0.8% lighter than 12 free nucleons; binding energy per nucleon peaks at iron, and light nuclei fusing or heavy ones fissioning are both climbing toward iron; annihilation is the only account settled at 100% · drag to orbit / Space = run/pause">E=mc² 不是“质量变能量”的咒语,而是一杆秤:核子结合成核,放出的结合能就是消失的质量——一个碳-12 核比 12 个自由核子轻 0.8%;比结合能在铁处登顶,轻核聚、重核裂都在往铁爬;湮灭则是唯一 100% 兑付的账 · 拖动旋转 / 空格运行/暂停</div>

      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCurve" type="checkbox"> <span data-zh="比结合能曲线" data-en="B/A curve">比结合能曲线</span></label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,90);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(7.5,5.4,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const daisM=new THREE.MeshStandardMaterial({color:0x242a34,roughness:0.85});
const dais=new THREE.Mesh(new THREE.CylinderGeometry(10.5,10.5,0.16,64),daisM);
dais.position.y=-0.08;scene.add(dais);

/* ---- 物理数据:半经验质量公式求最稳定 Z 与每核子结合能(MeV),关键核素用实测值校准 ---- */
const REALZ={56:26,235:92};
function zStable(a){if(REALZ[a])return REALZ[a];return Math.max(1,Math.round(a/(2+0.015*Math.pow(a,2/3))));}
const REAL={2:1.112,4:7.074,12:7.680,16:7.976,56:8.790,238:7.570};
function beA(a){
  if(REAL[a])return REAL[a];
  const Z=zStable(a);
  let B=15.8*a-18.3*Math.pow(a,2/3)-0.714*Z*(Z-1)/Math.pow(a,1/3)-23.2*Math.pow(a-2*Z,2)/a;
  if(a%2===0&&Z%2===0)B+=12/Math.sqrt(a);else if(a%2===1)B+=0;else B-=12/Math.sqrt(a);
  return Math.max(0,B)/a;
}

/* ---- 场景 a:核子结合(质量亏损) ---- */
const bindG=new THREE.Group();bindG.position.set(0,1.9,0);scene.add(bindG);
const NA=238;
const nuclMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,metalness:0.1});
const nucleons=new THREE.InstancedMesh(new THREE.SphereGeometry(0.085,10,8),nuclMat,NA);
bindG.add(nucleons);
const flash=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16),
  new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
bindG.add(flash);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1,0.035,8,48),
  new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
ring.rotation.x=Math.PI/2;bindG.add(ring);
const bindLight=new THREE.PointLight(0xffd43b,0,14);bindG.add(bindLight);
const freeP=new Float32Array(NA*3),boundP=new Float32Array(NA*3);
function layoutNucleons(a){
  const R=0.072*Math.cbrt(a)+0.08;
  for(let i=0;i<a;i++){
    const r1=Math.abs(Math.sin(i*12.9898)*43758.5453)%1,r2=Math.abs(Math.sin(i*78.233)*12543.117)%1,
      r3=Math.abs(Math.sin(i*39.721)*9876.331)%1;
    const rf=1.7+1.5*r3,ct=2*r2-1,st=Math.sqrt(1-ct*ct),ph=r1*6.2832;
    freeP[i*3]=rf*st*Math.cos(ph);freeP[i*3+1]=rf*ct*0.8;freeP[i*3+2]=rf*st*Math.sin(ph);
    const tb=(i+0.5)/a,rb=R*Math.cbrt(tb),ctb=1-2*tb,stb=Math.sqrt(Math.max(0,1-ctb*ctb)),phb=i*2.399963;
    boundP[i*3]=rb*stb*Math.cos(phb);boundP[i*3+1]=rb*ctb;boundP[i*3+2]=rb*stb*Math.sin(phb);
  }
}
const cTmp=new THREE.Color();
function recolorNucleons(a){
  const Z=zStable(a);
  for(let i=0;i<a;i++){
    const shuffle=(i*13)%a;
    cTmp.setHex(shuffle<Z?0x74c0fc:0x9aa3ad);
    nucleons.setColorAt(i,cTmp);
  }
  nucleons.instanceColor.needsUpdate=true;
}

/* ---- 场景 b:比结合能曲线(A=2~238 立体柱) ---- */
const curveG=new THREE.Group();curveG.position.set(0,0.35,-9.5);curveG.scale.setScalar(0.62);scene.add(curveG);
const xA2x=a=>-8+(a-2)/236*16;
const m4b=new THREE.Matrix4();
const bars=new THREE.InstancedMesh(new THREE.BoxGeometry(0.05,1,0.05),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,metalness:0.15,emissive:0x150a2e,emissiveIntensity:0.5}),237);
curveG.add(bars);
for(let a=2;a<=238;a++){
  const h=Math.max(0.05,beA(a)*0.45);
  m4b.makeScale(1,h,1);m4b.setPosition(xA2x(a),h/2,0);
  bars.setMatrixAt(a-2,m4b);
  cTmp.setHex(a===56?0xffd43b:0x6741d9);
  bars.setColorAt(a-2,cTmp);
}
bars.instanceMatrix.needsUpdate=true;bars.instanceColor.needsUpdate=true;
const railX=new THREE.Mesh(new THREE.BoxGeometry(16.6,0.07,0.5),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
railX.position.y=-0.035;curveG.add(railX);
const railY=new THREE.Mesh(new THREE.BoxGeometry(0.07,4.6,0.5),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
railY.position.set(-8.25,2.3,0);curveG.add(railY);
const feGlow=new THREE.Mesh(new THREE.SphereGeometry(0.17,14,12),
  new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
feGlow.position.set(xA2x(56),beA(56)*0.45+0.3,0);curveG.add(feGlow);
const selMark=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),
  new THREE.MeshBasicMaterial({color:0xffffff}));
curveG.add(selMark);
const fusionArrow=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.42,10),
  new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
fusionArrow.rotation.z=-Math.PI/2;curveG.add(fusionArrow);
const fissionArrow=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.42,10),
  new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
fissionArrow.rotation.z=Math.PI/2;curveG.add(fissionArrow);

/* ---- 场景 c:正负电子湮灭 ---- */
const annihG=new THREE.Group();annihG.position.set(0,1.9,0);scene.add(annihG);
const elM=new THREE.MeshStandardMaterial({color:0x91a7ff,emissive:0x3b5bdb,emissiveIntensity:1.4,roughness:0.3});
const poM=new THREE.MeshStandardMaterial({color:0xffc9c9,emissive:0xc92a2a,emissiveIntensity:1.4,roughness:0.3});
const electron=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),elM);annihG.add(electron);
const positron=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),poM);annihG.add(positron);
const beamG=new THREE.Group();beamG.visible=false;annihG.add(beamG);
const beamMat=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const cylGeo=new THREE.CylinderGeometry(0.055,0.055,2.6,10,1,true);
const cyl1=new THREE.Mesh(cylGeo,beamMat);beamG.add(cyl1);
const cyl2=new THREE.Mesh(cylGeo,beamMat);beamG.add(cyl2);
const flash2=new THREE.Mesh(new THREE.SphereGeometry(0.45,20,16),
  new THREE.MeshBasicMaterial({color:0xfff3bf,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
annihG.add(flash2);
const annihLight=new THREE.PointLight(0xffe066,0,14);annihG.add(annihLight);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let mode='bind',A=12,gMass=1,slowMo=false,curveOn=false,chemFlag=false,arrowRate=0.055;
let flashT=-1,lastCyc=0,exploded=false,flash2T=-1;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const Btot=()=>beA(A)*A;
const YV=new THREE.Vector3(0,1,0),dirV=new THREE.Vector3();

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`质量亏损 Δm = ${(Btot()/931.494).toFixed(3)} u → 结合能 ${Btot().toFixed(0)} MeV`,
  `Mass defect Δm = ${(Btot()/931.494).toFixed(3)} u → binding energy ${Btot().toFixed(0)} MeV`),
  new THREE.Vector3(3.0,3.6,0),'r',()=>mode==='bind');
addLabel(()=>L(`释放结合能 E = ${Btot().toFixed(0)} MeV`,`Binding energy released E = ${Btot().toFixed(0)} MeV`),
  new THREE.Vector3(-3.0,3.2,0),'y',()=>mode==='bind'&&flashT>=0&&simT-flashT<1.5);
addLabel(()=>L('Fe-56 峰:比结合能 ≈ 8.79 MeV','Fe-56 peak: ≈ 8.79 MeV per nucleon'),
  new THREE.Vector3(-4.3,6.2,0),'o',()=>mode==='curve');
addLabel(()=>L('γ 光子对:背靠背、各 511 keV,100% 兑付','γ-ray pair: back-to-back, 511 keV each — 100% payout'),
  new THREE.Vector3(0,3.7,0),'r',()=>mode==='annih'&&exploded);

function setA(a){
  A=Math.round(clamp(a,2,238));
  document.getElementById('sA').value=A;
  document.getElementById('sAVal').textContent='A = '+A;
  nucleons.count=A;layoutNucleons(A);recolorNucleons(A);
  selMark.position.set(xA2x(A),beA(A)*0.45+0.13,0);
}
function setG(g){
  gMass=g;
  document.getElementById('sG').value=g;
  const kt=g*21.48;
  document.getElementById('sGVal').textContent=kt>=1000?(kt/1000).toFixed(1)+' Mt':kt.toFixed(kt<10?2:0)+' kt';
}
function setMode(m){
  mode=m;chemFlag=false;arrowRate=0.055;
  ['bFuse','bFission','bAnnih'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(m==='bind'?'bFuse':m==='curve'?'bFission':'bAnnih').classList.add('on');
  bindG.visible=m==='bind';annihG.visible=m==='annih';
  lastCyc=0;flashT=-1;exploded=false;flash2T=-1;
  flash.material.opacity=0;ring.material.opacity=0;bindLight.intensity=0;
  beamG.visible=false;flash2.material.opacity=0;annihLight.intensity=0;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'自由核子更重:合在一起少了一截',en:'Free nucleons are heavier: bound together, a chunk of mass goes missing',
  act(){setMode('bind');setA(12);}},
 {zh:'结合能 = 质量亏损 × c²:1 u ≈ 931.5 MeV',en:'Binding energy = mass defect × c²: 1 u ≈ 931.5 MeV',
  act(){setMode('bind');setA(4);}},
 {zh:'比结合能曲线在 Fe-56 登顶',en:'Binding energy per nucleon peaks at iron-56',
  act(){setMode('curve');curveOn=true;document.getElementById('tglCurve').checked=true;}},
 {zh:'往铁爬都放能:轻核聚变、重核裂变',en:'Everything climbs toward iron and pays out: light nuclei fuse, heavy ones fission',
  act(){setMode('curve');arrowRate=0.13;}},
 {zh:'化学燃烧只兑付十亿分之一',en:'Chemical burning pays out barely a billionth of the mass',
  act(){setMode('bind');setA(12);chemFlag=true;}},
 {zh:'湮灭:静止质量 100% 变光子的唯一账',en:'Annihilation: the only account that turns rest mass into photons at 100%',
  act(){setMode('annih');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const eD=document.getElementById('stDm'),eB=document.getElementById('stB'),
    eA=document.getElementById('stBA'),eP=document.getElementById('stPay');
  if(mode==='annih'){
    eD.innerHTML='0.0011<small> u</small>';
    eB.innerHTML='1.022<small> MeV</small>';
    eA.textContent='—';
    eP.innerHTML='100<small> %</small>';eP.className='v ok';
  }else{
    const b=Btot(),ba=beA(A);
    eD.innerHTML=(b/931.494).toFixed(3)+'<small> u</small>';
    eB.innerHTML=b.toFixed(0)+'<small> MeV</small>';
    eA.innerHTML=ba.toFixed(2)+'<small> MeV</small>';
    if(chemFlag){eP.innerHTML='≈10⁻⁸<small> %</small>';eP.className='v warn';}
    else{eP.innerHTML=(ba/931.494*100).toFixed(2)+'<small> %</small>';eP.className='v';}
  }
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bFuse').addEventListener('click',()=>{setMode('bind');setA(4);});
document.getElementById('bFission').addEventListener('click',()=>{setMode('curve');});
document.getElementById('bAnnih').addEventListener('click',()=>{setMode('annih');});
document.getElementById('sA').addEventListener('input',e=>setA(+e.target.value));
document.getElementById('sG').addEventListener('input',e=>setG(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglCurve').addEventListener('change',e=>{curveOn=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  daisM.color.setHex(dark?0x242a34:0xbfb8ac);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const cTgt=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 曲线组:中心模块 ↔ 侧后方参考图,平滑滑动 */
  const centered=mode==='curve';
  cTgt.set(centered?0:0,centered?0.6:0.35,centered?0:-9.5);
  curveG.position.lerp(cTgt,Math.min(1,dt*3));
  const sTgt=centered?1:0.62;
  curveG.scale.setScalar(curveG.scale.x+(sTgt-curveG.scale.x)*Math.min(1,dt*3));
  curveG.visible=centered||curveOn;
  /* 结合:游离核子 → 抖动 → 收拢成核 → 闪光(质量账本减少) */
  if(bindG.visible){
    const cyc=(simT*0.22)%1;
    for(let i=0;i<nucleons.count;i++){
      const j=i*3;let x,y,z;
      if(cyc<0.34){
        x=freeP[j]+0.03*Math.sin(simT*2.1+i);y=freeP[j+1]+0.03*Math.cos(simT*1.7+i*1.3);z=freeP[j+2]+0.03*Math.sin(simT*1.9+i*0.7);
      }else if(cyc<0.52){
        let s=(cyc-0.34)/0.18;s=s*s*(3-2*s);
        x=freeP[j]+(boundP[j]-freeP[j])*s;y=freeP[j+1]+(boundP[j+1]-freeP[j+1])*s;z=freeP[j+2]+(boundP[j+2]-freeP[j+2])*s;
      }else{
        x=boundP[j]+0.02*Math.sin(simT*9+i*2.1);y=boundP[j+1]+0.02*Math.sin(simT*11+i*1.7);z=boundP[j+2]+0.02*Math.sin(simT*8+i*2.7);
      }
      m4.makeScale(0.9,0.9,0.9);m4.setPosition(x,y,z);
      nucleons.setMatrixAt(i,m4);
    }
    nucleons.instanceMatrix.needsUpdate=true;
    if(lastCyc<0.52&&cyc>=0.52)flashT=simT;
    lastCyc=cyc;
    if(flashT>=0){
      const p=(simT-flashT)/0.9;
      if(p<1){
        flash.scale.setScalar(0.6+5.5*p);flash.material.opacity=0.85*(1-p);
        ring.scale.setScalar(0.4+6*p);ring.material.opacity=0.6*(1-p);
        bindLight.intensity=14*(1-p);
      }else{flash.material.opacity=0;ring.material.opacity=0;bindLight.intensity=0;}
    }
  }
  /* 曲线:聚变箭头左端向右爬,裂变箭头右端向左爬,Fe-56 峰顶发光 */
  if(curveG.visible){
    const af=(simT*arrowRate)%1,Af=2+af*54;
    fusionArrow.position.set(xA2x(Af),beA(Af)*0.45+0.3,0);
    const ar=(simT*arrowRate*0.8)%1,Au=238-ar*182;
    fissionArrow.position.set(xA2x(Au),beA(Au)*0.45+0.3,0);
    feGlow.scale.setScalar(1+0.18*Math.sin(simT*4));
  }
  /* 湮灭:相向飞行 → 对撞 → 背靠背 γ 光子对飞出 */
  if(annihG.visible){
    const T=3.4,p=(simT%T)/T;
    if(p<0.42){
      const q=p/0.42,e=q*q,off=4.3*(1-e);
      electron.visible=positron.visible=true;
      electron.position.set(-off,0,0.05*Math.sin(simT*9));
      positron.position.set(off,0,0.05*Math.cos(simT*8));
      if(exploded){exploded=false;beamG.visible=false;flash2.material.opacity=0;annihLight.intensity=0;}
    }else{
      electron.visible=positron.visible=false;
      if(!exploded){
        exploded=true;flash2T=simT;
        const a=Math.random()*6.2832,el2=0.15+Math.random()*0.5;
        dirV.set(Math.cos(a)*Math.cos(el2),Math.sin(el2),Math.sin(a)*Math.cos(el2)).normalize();
        beamG.quaternion.setFromUnitVectors(YV,dirV);beamG.visible=true;
      }
      const q=(p-0.42)/0.58,dist=1.2+q*6.0;
      cyl1.position.y=dist+1.3;cyl2.position.y=-(dist+1.3);
      beamG.visible=q<0.98;beamMat.opacity=0.85*(1-q);
      const pf=(simT-flash2T)/0.7;
      flash2.material.opacity=pf<1?0.9*(1-pf):0;
      flash2.scale.setScalar(0.5+4.5*Math.min(1,Math.max(0,pf)));
      annihLight.intensity=12*(1-q);
    }
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setA(12);setG(1);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
