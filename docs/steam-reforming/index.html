<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲烷蒸汽重整 · 世界 90% 氢气的源头</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b3873e;
    --bg:#0f1216; --panel:rgba(13,17,23,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,23,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,23,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#8f6a25;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(255,205,112,.9); color: #ffe2ae; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.c { border-color: rgba(95,215,232,.9); color: #ccf3fb; }
  .lbl.o { border-color: rgba(255,146,60,.9); color: #ffd8b0; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(143,106,37,.9); color: #8a5f12; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(212,167,16,.9); color: #8a6d00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(11,122,90,.9); color: #0b7a5a; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(24,100,171,.9); color: #1864ab; }
  :root[data-theme="light"] .lbl.c { border-color: rgba(9,133,153,.9); color: #0b7285; }
  :root[data-theme="light"] .lbl.o { border-color: rgba(163,78,0,.9); color: #a34e00; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.y { color: #ffe9a8; border-color: rgba(255,224,102,.7); }
  .chip.c { color: #ccf3fb; border-color: rgba(95,215,232,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.b { color:#1864ab; } :root[data-theme="light"] .chip.r { color:#c92a2a; }
  :root[data-theme="light"] .chip.y { color:#8a6d00; } :root[data-theme="light"] .chip.c { color:#0b7285; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 4px 7px; font-size: 11.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(179,135,62,.65); background: rgba(179,135,62,.14); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.6); color: #ffa8a8; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(143,106,37,.55); background: rgba(143,106,37,.10); }
  :root[data-theme="light"] .abtn.hot { color:#c92a2a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 15px; }
  #scope { width: 100%; height: 60px; display: block; margin-top: 4px; border-radius: 8px;
    background: rgba(127,140,160,.10); border: 1px solid var(--panel-border); }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 3px; }
  #steps li { display: flex; gap: 6px; padding: 3px 5px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(179,135,62,.10); border-color: rgba(179,135,62,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(143,106,37,.08); border-color: rgba(143,106,37,.4); }
  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #e8c98f; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
    margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 96px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="甲烷蒸汽重整:世界九成氢气从这里来" data-en="Steam Methane Reforming: where 90% of the world's hydrogen comes from">甲烷蒸汽重整:世界九成氢气从这里来</h1>
  <div class="sub" data-zh="列管炉里管外烧天然气、管内装 Ni/Al₂O₃:CH₄+H₂O→CO+3H₂,ΔH=+206 kJ/mol 的强吸热反应,700-900 °C、20-40 bar,管壁热流 ~100 kW/m² 把热量硬灌进去;出口合成气 H₂:CO=3:1,再经两段水气变换 CO+H₂O→CO₂+H₂(Fe-Cr ~400 °C → Cu-Zn ~200 °C,ΔH=−41 kJ/mol)把残 CO 压到 0.3% 以下——氢喂哈伯法合成氨,每公斤氢伴随 9-10 kg CO₂,这就是「灰氢」 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="In a fired-tube furnace, natural gas burns outside while Ni/Al₂O₃ catalyst sits inside: CH₄+H₂O→CO+3H₂, strongly endothermic at ΔH=+206 kJ/mol, 700-900 °C, 20-40 bar, with ~100 kW/m² of wall heat flux driving it; the syngas leaves at H₂:CO=3:1, then two water-gas shift beds (Fe-Cr ~400 °C → Cu-Zn ~200 °C, ΔH=-41 kJ/mol) squeeze residual CO below 0.3% - the hydrogen feeds Haber-Bosch at 9-10 kg CO₂ per kg H₂: that is &quot;grey hydrogen&quot; · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">甲烷蒸汽重整:世界九成氢气从这里来</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="炉膛温度" data-en="Firebox temp">炉膛温度</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="管壁热流" data-en="Wall heat flux">管壁热流</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="CH₄ 转化率" data-en="CH₄ conversion">CH₄ 转化率</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="重整气 H₂:CO" data-en="Syngas H₂:CO">重整气 H₂:CO</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="变换后残 CO" data-en="Residual CO">变换后残 CO</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="当前工段" data-en="Section">当前工段</span><span class="v" id="stF">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip c" data-zh="CH₄ · 青" data-en="CH₄ · cyan">CH₄ · 青</span>
    <span class="chip b" data-zh="H₂O · 蓝 / H₂ · 白" data-en="H₂O · blue / H₂ · white">H₂O · 蓝 / H₂ · 白</span>
    <span class="chip y" data-zh="CO · 灰" data-en="CO · slate">CO · 灰</span>
    <span class="chip o" data-zh="CO₂ · 土" data-en="CO₂ · tan">CO₂ · 土</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnCut" data-zh="剖视炉墙" data-en="cutaway wall">剖视炉墙</button>
    <button class="abtn on" id="btnFlame" data-zh="烧火 / 熄火" data-en="burners on / off">烧火 / 熄火</button>
    <button class="abtn on" id="btnArrows" data-zh="热流箭头" data-en="heat arrows">热流箭头</button>
    <button class="abtn hot" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="炉温设定" data-en="Burner setpoint">炉温设定</label><input id="sT" type="range" min="700" max="950" step="5" value="900"><span class="val" id="sTVal">900 °C</span></div>
  <div class="row"><label data-zh="水碳比 S/C" data-en="Steam/carbon">水碳比 S/C</label><input id="sS" type="range" min="2" max="5" step="0.1" value="3"><span class="val" id="sSVal">3.0</span></div>
  <div class="row"><label data-zh="进料气速" data-en="Feed rate">进料气速</label><input id="sV" type="range" min="0.5" max="2" step="0.1" value="1"><span class="val" id="sVVal">1.0×</span></div>
  <canvas id="scope"></canvas>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="ctrlRows">
      <div class="crow"><span class="ck" data-zh="步骤" data-en="Step">步骤</span><input id="phase" type="range" min="0" max="1000" value="0"><span class="cv" id="phaseVal">—</span></div>
      <div class="crow"><span class="ck" data-zh="速度" data-en="Speed">速度</span><input id="speed" type="range" min="2" max="30" value="10"><span class="cv" id="speedVal">1.0×</span></div>
      <div id="toggles">
        <label><input id="tglFlow" type="checkbox" checked> <span data-zh="分子流" data-en="Molecule flow">分子流</span></label>
        <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
        <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      </div>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../haber-bosch/" data-zh="哈伯法合成氨(氢的去向)" data-en="Haber-Bosch (where the H₂ goes)">哈伯法合成氨(氢的去向)</a>
    <a href="../fuel-cell/" data-zh="燃料电池(氢的用法)" data-en="fuel cell (hydrogen at work)">燃料电池(氢的用法)</a>
    <a href="../fischer-tropsch/" data-zh="费托合成(另一条合成气路)" data-en="Fischer-Tropsch (the other syngas route)">费托合成(另一条合成气路)</a>
    <a href="../water-electrolysis/" data-zh="电解水(绿氢对照)" data-en="water electrolysis (green H₂)">电解水(绿氢对照)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);
const TAU = Math.PI * 2;
const E2 = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 状态 ---------------- */
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let labelsOn = qsBool('labels', true);
let scenario = 0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0f1216, 18, 40);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f1216 : 0xeff1f4);
  scene.fog.color = new THREE.Color(dark ? 0x0f1216 : 0xeff1f4);
  M.ground.color.set(dark ? 0x161b22 : 0xd7dce3);
  M.wall.color.set(dark ? 0x453b30 : 0xcbbfae);
  M.pipe.color.set(dark ? 0x51606f : 0x8fa2b8);
  M.steel.color.set(dark ? 0x3d4854 : 0x7d8ea0);
  M.vessel.color.set(dark ? 0x5c6b7d : 0x98a9bc);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';

/* ---------------- 工艺模型 ---------------- */
let Tset = 900, SC = 3.0, flow = 1.0;
let flameOn = true, Tf = 900;          // 炉膛实际温度(滞后漂移)
function convCH4() { return clamp(0.30 + 0.66 / (1 + Math.exp(-(Tf - 780) / 26)), 0.02, 0.96); }
function heatFlux() { return clamp(120 * (Tf - 120) / 780, 0, 120); }
function coOutPct() {
  const conv = convCH4();
  const coMade = conv * 0.25;
  const coLeft = coMade * 0.30 * 0.07;          // 高变剩 30%,低变再剩 7%
  const totalMol = 1 + SC + conv * 3;           // 近似湿基总摩尔
  return clamp(coLeft / totalMol * 100, 0, 30);
}
function sectionName() {
  return L('重整管 · Ni/Al₂O₃', 'reformer tubes · Ni/Al₂O₃');
}

/* ---------------- 分子流粒子 ---------------- */
const TYPE_COL = {
  ch4: new THREE.Color(0x3bc9db), h2o: new THREE.Color(0x4a90d9),
  co: new THREE.Color(0x8b95a3), h2: new THREE.Color(0xf1f3f5),
  co2: new THREE.Color(0xb08968),
};
const MAXP = 360;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({ size: 0.075, vertexColors: true, transparent: true,
  opacity: 0.95, depthWrite: false });
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);
const mols = [];
let spawnAcc = 0;
function spawnMol() {
  if (mols.length >= MAXP) return;
  const r = Math.random();
  const type = r < 1 / (1 + SC) ? 'ch4' : 'h2o';
  mols.push({ u: 0, type, die: -1 });
}
function simMols(dt) {
  spawnAcc += dt * 15 * flow;
  while (spawnAcc >= 1) { spawnAcc--; spawnMol(); }
  for (let i = mols.length - 1; i >= 0; i--) {
    const m = mols[i];
    if (m.die > 0) {
      m.die -= dt * 3;
      if (m.die <= 0) { mols.splice(i, 1); continue; }
    }
    m.u += dt * 0.048 * flow;
    if (m.u >= 1) {
      m.die = m.die > 0 ? m.die : 0.35;
      m.u = 1;
    }
    /* 管内重整:CH₄ → CO + 3H₂(按炉温决定命运) */
    if (m.type === 'ch4' && m.convU === undefined) {
      m.convU = U_TUBE_TOP + (0.15 + 0.7 * Math.random()) * (U_TUBE_BOT - U_TUBE_TOP);
      m.will = Math.random() < convCH4();
    }
    if (m.type === 'ch4' && m.convU !== undefined && !m.done && m.u >= m.convU) {
      m.done = true;
      if (m.will) {
        m.type = 'co';
        for (let k = 0; k < 3; k++) {
          if (mols.length < MAXP) mols.push({ u: m.u - 0.004 * k, type: 'h2', die: -1 });
        }
      }
    }
    /* 高温变换:CO+H₂O→CO₂+H₂,转化 ~70% */
    if (m.u >= U_HTS_IN && m.u < U_HTS_OUT + 0.01) {
      if (m.type === 'co' && !m.hts && Math.random() < 0.7 * dt * 14) {
        m.hts = true; m.type = 'co2';
        if (Math.random() < 0.8 && mols.length < MAXP) mols.push({ u: m.u, type: 'h2', die: -1 });
      }
      if (m.type === 'h2o' && Math.random() < 0.6 * dt * 14) { m.die = 0.3; }   // 蒸汽被消耗
    }
    /* 低温变换:剩 CO 再转 93% */
    if (m.u >= U_LTS_IN && m.u < U_LTS_OUT + 0.01) {
      if (m.type === 'co' && !m.lts && Math.random() < 0.93 * dt * 14) { m.lts = true; m.type = 'co2'; }
      if (m.type === 'h2o' && Math.random() < 0.6 * dt * 14) { m.die = 0.3; }
    }
  }
}
function drawMols() {
  let k = 0;
  const tmp = new THREE.Color();
  for (const m of mols) {
    if (k >= MAXP) break;
    const p = curve.getPoint(clamp01(m.u));
    pPos[k * 3] = p.x; pPos[k * 3 + 1] = p.y; pPos[k * 3 + 2] = p.z;
    tmp.copy(TYPE_COL[m.type]);
    if (m.die > 0) tmp.multiplyScalar(clamp01(m.die / 0.35));
    pCol[k * 3] = tmp.r; pCol[k * 3 + 1] = tmp.g; pCol[k * 3 + 2] = tmp.b;
    k++;
  }
  pGeo.setDrawRange(0, k);
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

function markStep() {
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === scenario));
}
function syncPhase() {
  elPhase.value = Math.round(scenario / (STEPS.length - 1) * 1000);
  elPhaseVal.textContent = L(`第 ${scenario + 1}/${STEPS.length} 步`, `step ${scenario + 1}/${STEPS.length}`);
}
function activateStep(i) {
  scenario = clamp(i, 0, STEPS.length - 1);
  tgtVec.fromArray(STEPS[scenario].tgt);
  markStep();
  syncPhase();
  updateFormula();
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => activateStep(i));
    el.appendChild(li);
  });
}

/* ---------------- 公式框 ---------------- */
const formulaEl = document.getElementById('formula');

      `Reform: CH₄+H₂O→CO+3H₂, ΔH=<b>+206 kJ/mol</b> · Ni/Al₂O₃ · 700-900 °C · 20-40 bar · conversion <b>${(conv * 100).toFixed(0)}%</b>`) +

      `Shift: CO+H₂O→CO₂+H₂, ΔH=<b>-41 kJ/mol</b> · Fe-Cr ~400 °C → Cu-Zn ~200 °C · residual CO <b>${coOutPct().toFixed(2)}%</b>`) +

      `live: firebox <b>${Tf.toFixed(0)} °C</b> · flux <b>${heatFlux().toFixed(0)} kW/m²</b> · H₂:CO = <b>3.0:1</b> (stoichiometric) · ${flameOn ? L('burners on', 'burners on') : L('cooling, burners off', 'cooling, burners off')}`);
}

/* ---------------- 组成剖面小图(沿流程堆积带) ---------------- */
const scope = document.getElementById('scope');
const scopeCtx = scope.getContext('2d');
function sizeScope() {
  const dpr = Math.min(devicePixelRatio, 2);
  scope.width = Math.max(10, scope.clientWidth * dpr);
  scope.height = 60 * dpr;
}
/* 模型组成(u = 流程位置):返回各组分摩尔分数 */
const COMP_COL = { ch4: '#3bc9db', h2o: '#4a90d9', co: '#8b95a3', h2: '#f1f3f5', co2: '#b08968' };
function compAt(u) {
  const conv = convCH4();
  const f = {};                              // 以 1 CH₄ + SC H₂O 进料计
  const cu = E2((u - U_TUBE_TOP) / (U_TUBE_BOT - U_TUBE_TOP)) * conv;
  f.ch4 = 1 - cu;
  f.co = cu * 0.25;
  f.h2 = cu * 0.75;
  f.h2o = SC;
  if (u >= U_HTS_IN) {
    const s = Math.min(1, (u - U_HTS_IN) / (U_HTS_OUT - U_HTS_IN + 0.02)) * 0.70;
    const sh = f.co * s;
    f.co -= sh; f.h2o -= sh; f.co2 = sh; f.h2 += sh;
  }
  if (u >= U_LTS_IN) {
    const s = Math.min(1, (u - U_LTS_IN) / (U_LTS_OUT - U_LTS_IN + 0.02)) * 0.93;
    const sh = f.co * s;
    f.co -= sh; f.h2o -= sh; f.co2 += sh; f.h2 += sh;
  }
  const tot = f.ch4 + f.h2o + f.co + f.h2 + (f.co2 || 0);
  for (const k of Object.keys(f)) f[k] /= tot;
  return f;
}
function drawScope() {
  const cw = scope.width, ch = scope.height, dpr = Math.min(devicePixelRatio, 2);
  scopeCtx.clearRect(0, 0, cw, ch);
  const keys = ['ch4', 'h2o', 'co', 'h2', 'co2'];
  const x0 = 0.03, x1 = 0.97, y0 = 0.88, y1 = 0.1;
  const nSeg = 110;
  /* 预计算每个分段的累积边界 cum[b][i] */
  const cum = keys.map(() => new Float32Array(nSeg + 1));
  for (let i = 0; i <= nSeg; i++) {
    const f = compAt(i / nSeg);
    let acc = 0;
    for (let b = 0; b < keys.length; b++) { acc += f[keys[b]]; cum[b][i] = acc; }
  }
  const px = u => (x0 + u * (x1 - x0)) * cw;
  const py = v => (y0 - v * (y0 - y1)) * ch;
  let lo = keys.map(() => 0);
  for (let b = 0; b < keys.length; b++) {
    scopeCtx.beginPath();
    for (let i = 0; i <= nSeg; i++) scopeCtx.lineTo(px(i / nSeg), py(cum[b][i]));
    for (let i = nSeg; i >= 0; i--) scopeCtx.lineTo(px(i / nSeg), py(lo[i]));
    scopeCtx.closePath();
    scopeCtx.fillStyle = COMP_COL[keys[b]];
    scopeCtx.globalAlpha = 0.75;
    scopeCtx.fill();
    scopeCtx.globalAlpha = 1;
    lo = cum[b];
  }
  /* 标记:重整管/高变/低变位置 */
  scopeCtx.font = `${Math.round(9 * dpr)}px system-ui`;
  scopeCtx.fillStyle = 'rgba(255,205,112,.95)';
  scopeCtx.fillText(L('重整', 'reform'), px(U_TUBE_TOP), ch - 3 * dpr);
  scopeCtx.fillStyle = 'rgba(116,192,252,.95)';
  scopeCtx.fillText(L('高变', 'HTS'), px(U_HTS_IN), ch - 3 * dpr);
  scopeCtx.fillStyle = 'rgba(116,220,132,.95)';
  scopeCtx.fillText(L('低变', 'LTS'), px(U_LTS_IN), ch - 3 * dpr);
  /* 终点 H₂ 读数 */
  const fEnd = compAt(1);
  scopeCtx.fillStyle = '#f1f3f5';
  scopeCtx.fillText('H₂ ' + (fEnd.h2 * 100).toFixed(0) + '%', (x1 - 0.14) * cw, (y1 + 0.12) * ch);
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elT = document.getElementById('sT'), elTVal = document.getElementById('sTVal');
const elS = document.getElementById('sS'), elSVal = document.getElementById('sSVal');
const elV = document.getElementById('sV'), elVVal = document.getElementById('sVVal');
const tglFlow = document.getElementById('tglFlow');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn;
}
function updateSliderLabels() {
  elTVal.textContent = Tset + ' °C';
  elSVal.textContent = SC.toFixed(1);
  elVVal.textContent = flow.toFixed(1) + '×';
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  activateStep(Math.round(parseInt(elPhase.value, 10) / 1000 * (STEPS.length - 1)));
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elT.addEventListener('input', () => { Tset = +elT.value; flameOn = true; btnFlame.classList.add('on'); updateSliderLabels(); updateFormula(); });
elS.addEventListener('input', () => { SC = +elS.value; updateSliderLabels(); updateFormula(); });
elV.addEventListener('input', () => { flow = +elV.value; updateSliderLabels(); updateFormula(); });
const btnCut = document.getElementById('btnCut');
const btnFlame = document.getElementById('btnFlame');
const btnArrows = document.getElementById('btnArrows');
btnCut.addEventListener('click', () => {
  const open = btnCut.classList.toggle('on');
  wallFront.visible = !open;
  roof.visible = !open;
});
btnFlame.addEventListener('click', () => {
  flameOn = !flameOn;
  btnFlame.classList.toggle('on', flameOn);
  updateFormula();
});
btnArrows.addEventListener('click', () => {
  const on = btnArrows.classList.toggle('on');
  for (const a of heatArrows) a.visible = on;
});
document.getElementById('btnReset').addEventListener('click', () => {
  Tset = 900; SC = 3.0; flow = 1.0; flameOn = true; Tf = 900;
  elT.value = 900; elS.value = 3; elV.value = 1;
  btnFlame.classList.add('on');
  mols.length = 0;
  updateSliderLabels(); updateFormula();
});
tglFlow.addEventListener('change', () => { points.visible = tglFlow.checked; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
controls.addEventListener('start', () => { camTween = null; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeScope();
});

/* ---------------- stats 刷新 ---------------- */
const stA = document.getElementById('stA'), stB = document.getElementById('stB'),
  stC = document.getElementById('stC'), stD = document.getElementById('stD'),
  stE = document.getElementById('stE'), stF = document.getElementById('stF');
function updateStats() {
  stA.innerHTML = Tf.toFixed(0) + '<small> °C</small>';
  stA.className = 'v ' + (Tf >= 750 ? 'ok' : Tf >= 500 ? 'warn' : 'bad');
  const q = heatFlux();
  stB.innerHTML = q.toFixed(0) + '<small> kW/m²</small>';
  stB.className = 'v ' + (q > 60 ? 'ok' : q > 25 ? 'warn' : 'bad');
  const conv = convCH4();
  stC.innerHTML = (conv * 100).toFixed(0) + '<small> %</small>';
  stC.className = 'v ' + (conv > 0.9 ? 'ok' : conv > 0.7 ? 'warn' : 'bad');
  stD.innerHTML = '3.0<small> : 1</small>';
  stD.className = 'v ok';
  const co = coOutPct();
  stE.innerHTML = co.toFixed(2) + '<small> %</small>';
  stE.className = 'v ' + (co < 0.5 ? 'ok' : co < 2 ? 'warn' : 'bad');
  stF.textContent = sectionName();
  stF.className = 'v ok';
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0, et = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  /* 炉温滞后漂移:烧嘴开→设定值,熄火→120 °C */
  const Ttar = flameOn ? Tset : 120;
  Tf += (Ttar - Tf) * clamp(dt * 0.35, 0, 1);
  if (playing) simMols(dt * speed);
  /* 炉管红热 + 火焰闪烁 + 火光 */
  const hot = clamp01((Tf - 300) / 600);
  M.tubeHot.emissiveIntensity = 0.06 + 0.85 * hot;
  const fl = flameOn ? clamp01((Tf - 400) / 500) : 0;
  for (const f of [...flames, ...flamesBack]) {
    const s = fl * (0.8 + 0.25 * Math.sin(et * 23 + f.userData.ph)) * (0.8 + Tf / 900 * 0.4);
    f.scale.set(0.5 + s * 0.7, 0.4 + s * 1.4, 0.5 + s * 0.7);
    f.visible = fl > 0.03;
  }
  fireLight.intensity = 3.2 * fl * (0.85 + 0.15 * Math.sin(et * 31));
  /* 热流箭头脉动 */
  const arrowsOn = btnArrows.classList.contains('on') && fl > 0.05;
  for (let i = 0; i < heatArrows.length; i++) {
    const a = heatArrows[i];
    a.visible = arrowsOn;
    const pulse = 0.7 + 0.3 * Math.sin(et * 5 - i * 1.2);
    a.scale.setScalar(pulse * (0.5 + fl * 0.5));
  }
  drawMols();
  /* 步骤目标缓动 */
  controls.target.lerp(tgtVec, 0.05);
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt * 1.4);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  for (const r of labelReg) {
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
Tset = clamp(qsFloat('temp', 900), 700, 950);
elT.value = Tset;
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setPlayLabel();
updateStats();
updateFormula();
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
