<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速射电暴 · 磁星耀斑与星际色散</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b3873e;
    --bg:#0f1216; --panel:rgba(13,17,23,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,23,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,23,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#8f6a25;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(255,205,112,.9); color: #ffe2ae; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(143,106,37,.9); color: #8a5f12; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(212,167,16,.9); color: #8a6d00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(11,122,90,.9); color: #0b7a5a; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(30,120,200,.9); color: #1864ab; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.b { color:#1864ab; } :root[data-theme="light"] .chip.r { color:#c92a2a; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 4px 7px; font-size: 11.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(179,135,62,.65); background: rgba(179,135,62,.14); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.6); color: #ffa8a8; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(143,106,37,.55); background: rgba(143,106,37,.10); }
  :root[data-theme="light"] .abtn.hot { color:#c92a2a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 15px; }
  #scope { width: 100%; height: 60px; display: block; margin-top: 4px; border-radius: 8px;
    background: rgba(127,140,160,.10); border: 1px solid var(--panel-border); }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 3px; }
  #steps li { display: flex; gap: 6px; padding: 3px 5px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(179,135,62,.10); border-color: rgba(179,135,62,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(143,106,37,.08); border-color: rgba(143,106,37,.4); }
  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #e8c98f; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
    margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 96px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="快速射电暴:磁星耀斑与星际色散" data-en="Fast Radio Bursts: Magnetar Flares &amp; Dispersion">快速射电暴:磁星耀斑与星际色散</h1>
  <div class="sub" data-zh="毫秒级射电脉冲,能量从 ~1 Jy·ms 到 >1 MJy·ms。2007 年 Lorimer 在帕克斯旧数据里翻出首个(DM 375 pc/cm³);冷等离子体中低频走得慢,Δt ∝ DM/ν²,高频先到扫出「彩虹」;DM 数百–2000 pc/cm³ 大半来自星系际自由电子,是天然距离计。2020-04-28 银河系磁星 SGR 1935+2154 爆发 FRB 200428(≈1.5 MJy·ms),证实磁星至少是 FRB 的一种来源;FRB 121102 有 ~16 天活跃窗口,CHIME(400–800 MHz)每天扫 ~2/3 天顶、发现数个/天,全天率 ~10³–10⁴/天;亮度温度 >10³⁵ K 要求相干辐射 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 / 空格播放" data-en="Millisecond radio flashes from ~1 Jy·ms to >1 MJy·ms. In 2007 Lorimer dug the first one out of Parkes archival data (DM 375 pc/cm³). In cold plasma low frequencies lag: Δt ∝ DM/ν², so high frequencies arrive first in a rainbow sweep. DM of hundreds to 2000 pc/cm³ mostly comes from intergalactic free electrons — a natural distance gauge. On 2020-04-28 the Galactic magnetar SGR 1935+2154 produced FRB 200428 (≈1.5 MJy·ms), proving magnetars are one source; FRB 121102 shows a ~16-day activity window; CHIME (400–800 MHz) sweeps ~2/3 of the sky daily and finds several per day, all-sky rate ~10³–10⁴/day; brightness temperature >10³⁵ K demands coherent emission · 3D demo · drag / scroll / Space">快速射电暴:磁星耀斑与星际色散</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="脉宽" data-en="pulse width">脉宽</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="色散量 DM(试)" data-en="DM (trial)">色散量 DM(试)</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="通量密度" data-en="fluence">通量密度</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="全天率" data-en="all-sky rate">全天率</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="频段" data-en="band">频段</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="到达时间差 Δt" data-en="arrival spread Δt">到达时间差 Δt</span><span class="v" id="stF">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip o" data-zh="磁星 · 毫秒耀发" data-en="magnetar · ms flare">磁星 · 毫秒耀发</span>
    <span class="chip r" data-zh="波前:红=高频先到" data-en="wavefront: red = high freq first">波前:红=高频先到</span>
    <span class="chip b" data-zh="波前:蓝=低频迟到" data-en="wavefront: blue = low freq late">波前:蓝=低频迟到</span>
    <span class="chip g" data-zh="星系际自由电子雾" data-en="intergalactic electron fog">星系际自由电子雾</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnLorimer" data-zh="Lorimer 首暴 2007" data-en="Lorimer burst 2007">Lorimer 首暴 2007</button>
    <button class="abtn" id="btnMag" data-zh="银河系磁星 FRB 200428" data-en="Galactic magnetar FRB 200428">银河系磁星 FRB 200428</button>
    <button class="abtn" id="btnRepeat" data-zh="重复暴 16 天窗口" data-en="repeater 16-day window">重复暴 16 天窗口</button>
    <button class="abtn" id="btnChime" data-zh="CHIME 全天扫描" data-en="CHIME all-sky survey">CHIME 全天扫描</button>
    <button class="abtn hot" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="DM 值(去色散)" data-en="DM (dedisperse)">DM 值(去色散)</label><input id="dm" type="range" min="0" max="2000" step="5" value="375"><span class="val" id="dmVal">375</span></div>
  <div class="row"><label data-zh="信号频段" data-en="signal band">信号频段</label><input id="band" type="range" min="450" max="1500" step="50" value="1400"><span class="val" id="bandVal">1200–1600</span></div>
  <canvas id="scope"></canvas>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="ctrlRows">
      <div class="crow"><span class="ck" data-zh="步骤" data-en="Step">步骤</span><input id="phase" type="range" min="0" max="1000" value="0"><span class="cv" id="phaseVal">—</span></div>
      <div class="crow"><span class="ck" data-zh="速度" data-en="Speed">速度</span><input id="speed" type="range" min="2" max="30" value="10"><span class="cv" id="speedVal">1.0×</span></div>
      <div id="toggles">
        <label><input id="tglScope" type="checkbox" checked> <span data-zh="频谱瀑布图" data-en="waterfall">频谱瀑布图</span></label>
        <label><input id="tglShells" type="checkbox" checked> <span data-zh="频带波前" data-en="wavefronts">频带波前</span></label>
        <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
        <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      </div>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../magnetar/" data-zh="磁星" data-en="magnetar">磁星</a>
    <a href="../pulsar-timing/" data-zh="脉冲星计时" data-en="pulsar timing">脉冲星计时</a>
    <a href="../radio-interferometry/" data-zh="射电干涉" data-en="radio interferometry">射电干涉</a>
    <a href="../neutron-star/" data-zh="中子星" data-en="neutron star">中子星</a>
    <a href="../group-velocity/" data-zh="群速度" data-en="group velocity">群速度</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);
const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0b0e14 : 0xe6ebf2);
  M.frame.color.set(dark ? 0x46556a : 0x74879c);        // 望远镜支架
  M.dish.color.set(dark ? 0x9fb0c3 : 0x6b7b8e);         // 碟面
  M.cyl.color.set(dark ? 0x8a97a8 : 0x66727f);          // CHIME 圆柱
  M.field.color.set(dark ? 0x9fb6d9 : 0x5d7396);        // 磁力线
  M.core.color.set(dark ? 0xfff1cf : 0xe8d9b0);         // 磁星球体
  starMat.color.set(dark ? 0xcfd8ea : 0x647488);        // 远景恒星
  fogMat.color.set(dark ? 0x6ea8ff : 0x2f66b5);         // 电子雾
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  const ATTR_ZH = 'data-' + 'zh', ATTR_EN = 'data-' + 'en';
  document.querySelectorAll('[' + ATTR_ZH + ']').forEach(el => {
    el.textContent = LANG === 'en' ? el.getAttribute(ATTR_EN) : el.getAttribute(ATTR_ZH);
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('快速射电暴 · 磁星耀斑与星际色散', 'Fast Radio Bursts · Magnetar Flares and Dispersion');
  buildSteps();
  setPlayLabel();
  markStep();
  syncPhase();
  updateDm();
  updateBand();
  updateFormula();

  dmTrue = p.dm; fluence = p.flu; burstInt = p.int; clusterN = 0;
  elBand.value = p.band; updateBand();
  bursts = []; births = [-1e9, -1e9, -1e9]; detected = false;
  flareTimer = 0.8;
  updateFormula();
}
function resetAll() {
  setPreset('lorimer');
  dmTrial = 375; elDm.value = 375; updateDm();
  flareTimer = 0.8;
}
btnLorimer.addEventListener('click', () => setPreset('lorimer'));
btnMag.addEventListener('click', () => setPreset('mag'));
btnRepeat.addEventListener('click', () => setPreset('repeat'));
btnChime.addEventListener('click', () => setPreset('chime'));
btnReset.addEventListener('click', resetAll);
function fireFlare() {
  flareAt = at;
  clusterN++;
  const fm = (fLo + fHi) / 2;
  births = [at, at + Math.min(0.45 * lagS(fm, dmTrue), 5), at + Math.min(0.45 * lagS(fLo, dmTrue), 5)];
  bursts.push({ t: at, amp: ampOf(fluence) });
  if (bursts.length > 12) bursts.shift();
  detected = false;
  if (preset === 'repeat') flareTimer = clusterN % 5 === 0 ? 6.5 : burstInt * (0.8 + 0.4 * Math.random());
  else flareTimer = burstInt * (0.85 + 0.3 * Math.random());
}

/* ---------------- 频谱瀑布图(频率 × 时间 + 去色散扫频线) ---------------- */
const scope = document.getElementById('scope');
const sctx = scope.getContext('2d');
const ROWS = 36, COLS = 96, WIN = 8;
const lagsTrue = [], lagsTrial = [];
function palAt(v) {
  v = clamp01(v);
  let r, g, b;
  if (v < 0.6) { const t = v / 0.6; r = 20 + 235 * t; g = 30 + 160 * t; b = 52 + 40 * t; }
  else { const t = (v - 0.6) / 0.4; r = 255; g = 190 + 65 * t; b = 92 + 148 * t; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function sizeScope() {
  const dpr = Math.min(devicePixelRatio, 2);
  scope.width = Math.max(10, scope.clientWidth * dpr);
  scope.height = 60 * dpr;
}
function drawScope() {
  const dpr = Math.min(devicePixelRatio, 2), cw = scope.width, ch = scope.height;
  const stripH = 16 * dpr, wh = ch - stripH - 2 * dpr;
  const cW = cw / COLS, rH = wh / ROWS;
  sctx.clearRect(0, 0, cw, ch);
  for (let r = 0; r < ROWS; r++) {
    const f = fHi - (r + 0.5) / ROWS * (fHi - fLo);
    lagsTrue[r] = lagS(f, dmTrue); lagsTrial[r] = lagS(f, dmTrial);
  }
  const t1 = at, t0w = t1 - WIN;
  for (let c = 0; c < COLS; c++) {
    const t = t0w + (c + 0.5) / COLS * WIN;
    for (let r = 0; r < ROWS; r++) {
      let v = 0; const ta = lagsTrue[r];
      for (let k = 0; k < bursts.length; k++) {
        const B = bursts[k], dd = t - B.t - ta;
        if (dd > -0.5 && dd < 0.5) v += B.amp * Math.exp(-dd * dd * 55);
      }
      if (v > 0.04) { sctx.fillStyle = palAt(v); sctx.fillRect(c * cW, wh - (r + 1) * rH, cW + 1, rH + 1); }
    }
  }
  /* 去色散扫频线(试值 DM 预言的到达曲线) */
  if (bursts.length) {
    const b = bursts[bursts.length - 1];
    sctx.strokeStyle = 'rgba(255,255,255,.85)';
    sctx.lineWidth = 1.2 * dpr;
    sctx.setLineDash([4 * dpr, 3 * dpr]);
    sctx.beginPath();
    for (let r = 0; r <= ROWS; r++) {
      const f = fHi - r / ROWS * (fHi - fLo);
      const x = (b.t + lagS(f, dmTrial) - t0w) / WIN * cw;
      const y = wh - r / ROWS * wh;
      r === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.stroke();
    sctx.setLineDash([]);
  }
  /* 底部去色散脉冲剖面 */
  const err = Math.abs(dmTrial - dmTrue);
  sctx.fillStyle = err < 30 ? 'rgba(123,216,143,.95)' : err < 100 ? 'rgba(255,169,77,.95)' : 'rgba(255,107,107,.95)';
  for (let c = 0; c < COLS; c++) {
    const t = t0w + (c + 0.5) / COLS * WIN;
    let p = 0;
    for (let r = 0; r < ROWS; r++) {
      const off = lagsTrue[r] - lagsTrial[r];
      for (let k = 0; k < bursts.length; k++) {
        const B = bursts[k], dd = t - B.t - off;
        if (dd > -0.5 && dd < 0.5) p += B.amp * Math.exp(-dd * dd * 55);
      }
    }
    const h = clamp01(p / 1.3) * 14 * dpr;
    if (h > 0.5 * dpr) sctx.fillRect(c * cW, ch - 2 * dpr - h, cW + 1, h);
  }
  sctx.font = `${Math.round(8.5 * dpr)}px system-ui`;
  sctx.fillStyle = 'rgba(150,160,175,.85)';
  sctx.fillText(`${Math.round(fHi * 1000)} MHz`, 4 * dpr, 9 * dpr);
  sctx.fillText(`${Math.round(fLo * 1000)}`, 4 * dpr, wh - 2 * dpr);
  sctx.fillText(L('虚线=试 DM 扫频线 · 对齐即去色散', 'dashed = trial-DM sweep · align to dedisperse'), cw - 170 * dpr, 9 * dpr);
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elDm = document.getElementById('dm'), elDmVal = document.getElementById('dmVal');
const elBand = document.getElementById('band'), elBandVal = document.getElementById('bandVal');
const tglScope = document.getElementById('tglScope');
const tglShells = document.getElementById('tglShells');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let labelsOn = qsBool('labels', true);
let shellsOn = true;
let scenario = 0, at = 0, flareTimer = 1.0;
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function refreshLabels() { for (const r of labelReg) r.o.visible = labelsOn; }
function updateDm() {
  dmTrial = +elDm.value;
  elDmVal.textContent = dmTrial;
  updateFormula();
}
function updateBand() {
  bandC = +elBand.value;
  fLo = (bandC - 200) / 1000; fHi = (bandC + 200) / 1000;
  elBandVal.textContent = `${bandC - 200}–${bandC + 200}`;
  updateFormula();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  activateStep(Math.round(parseInt(elPhase.value, 10) / 1000 * (STEPS.length - 1)));
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elDm.addEventListener('input', updateDm);
elBand.addEventListener('input', updateBand);
tglScope.addEventListener('change', () => { scope.style.display = tglScope.checked ? 'block' : 'none'; if (tglScope.checked) sizeScope(); });
tglShells.addEventListener('change', () => { shellsOn = tglShells.checked; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeScope();
});

/* ---------------- stats 刷新 ---------------- */
const stA = document.getElementById('stA'), stB = document.getElementById('stB'),
  stC = document.getElementById('stC'), stD = document.getElementById('stD'),
  stE = document.getElementById('stE'), stF = document.getElementById('stF');
function updateStats() {
  stA.innerHTML = '1–3<small> ms</small>';
  stA.className = 'v ok';
  const err = Math.abs(dmTrial - dmTrue);
  stB.innerHTML = dmTrial + '<small> pc/cm³</small>';
  stB.className = 'v ' + (err < 30 ? 'ok' : err < 100 ? 'warn' : 'bad');
  stC.innerHTML = '<small>' + fluTxt() + '</small>';
  stC.className = 'v ok';
  stD.innerHTML = '10³–10⁴<small> /天</small>';
  stD.className = 'v ok';
  stE.innerHTML = (bandC - 200) + '–' + (bandC + 200) + '<small> MHz</small>';
  stE.className = 'v ok';
  stF.innerHTML = '<small>' + fmtT(dtArr()) + '</small>';
  stF.className = 'v ok';
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0;
const tmpV = new THREE.Vector3();
const shellBase = [0.3, 0.26, 0.26];
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const sdt = dt * speed;
  if (playing) {
    at += sdt;
    flareTimer -= sdt;
    if (flareTimer <= 0) fireFlare();
  }
  /* 磁星耀发闪光 + 耀发光环 */
  const fk = Math.exp(-(at - flareAt) * 2.5);
  M.core.emissiveIntensity = 0.7 + 3.5 * fk;
  magLight.intensity = 0.5 + 6 * fk;
  const fa = at - flareAt;
  flareRing.visible = fa >= 0 && fa < 1.2;
  if (flareRing.visible) {
    flareRing.scale.setScalar(1 + fa * 2.2);
    flareRing.material.opacity = 0.75 * (1 - fa / 1.2);
    flareRing.rotation.z += dt * 3;
  }
  /* 三层色散波前:红(高频)领先,蓝(低频)迟到 */
  for (let i = 0; i < 3; i++) {
    const s = shells[i], r = (at - births[i]) * SHELL_V;
    const vis = shellsOn && r > 0.3 && r < RMAX;
    s.visible = vis;
    if (vis) {
      s.scale.setScalar(r);
      s.material.opacity = shellBase[i] * (1 - r / RMAX) * (1 + (STEPS[scenario].hl === 'disp' ? 0.5 : 0));
    }
    if (i === 0 && !detected && r >= DISH_DIST) { detected = true; dishFlashAt = at; }
  }
  /* 望远镜收到信号的闪烁 */
  const dk = Math.exp(-(at - dishFlashAt) * 3);
  M.dish.emissiveIntensity = 0.06 + 1.4 * dk;
  M.cyl.emissiveIntensity = 0.06 + 0.9 * dk;
  /* 星系盘缓转 */
  galaxy.rotation.y += sdt * 0.008;
  /* 步骤高亮 */
  const hlK = 0.45 + 0.25 * Math.sin(at * 5);
  for (const m of [M.core, M.field, M.dish, M.cyl]) m.emissiveIntensity = Math.min(m.emissiveIntensity, 0.28);
  const boost = m => { m.emissiveIntensity = 0.5 + 0.3 * hlK; };
  const hl = STEPS[scenario].hl;
  if (hl === 'mystery') { boost(M.dish); boost(M.core); }
  else if (hl === 'disp') { boost(M.dish); }
  else if (hl === 'dm') fogMat.opacity = 0.4 + 0.35 * hlK;
  else if (hl === 'mag') { boost(M.core); boost(M.field); }
  else if (hl === 'repeat') { boost(M.core); boost(M.field); }
  else if (hl === 'chime') { boost(M.cyl); boost(M.dish); }
  if (hl !== 'dm') fogMat.opacity = 0.4;
  /* 相机目标 */
  tmpV.fromArray(STEPS[scenario].tgt);
  controls.target.lerp(tmpV, 0.04);
  /* 标签 */
  for (const r of labelReg) {
    if (r.follow) r.follow(r.o.position);
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglScope.checked) drawScope();
  /* stats + formula 节流刷新 */
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setPreset('lorimer');
setPlayLabel();
tglShells.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
