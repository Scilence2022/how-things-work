<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电弧焊与熔池 · 6000 K 电弧下的液态金属</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#2f9fe0;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1f7db3;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(47,159,224,.6);background:rgba(47,159,224,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(31,125,179,.55);background:rgba(31,125,179,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(47,159,224,.10);border-color:rgba(47,159,224,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(31,125,179,.08);border-color:rgba(31,125,179,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#cfe9fb}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电弧焊与熔池" data-en="Arc Welding & the Molten Pool">电弧焊与熔池</h1>
  <div class="sub" data-zh="焊丝与母材间烧着一根 6000–8000 K 的电弧:金属瞬间熔成液态熔池,保护气罩把空气挡在外面;表面张力与电磁力搅动熔池,后缘周期性凝固拉出鱼鳞纹;一旦失保护,氮氢氧乘虚而入——气孔当场冒出;电流与焊速定熔深熔宽 · 拖动旋转 / 空格运行/暂停" data-en="A 6000–8000 K arc burns between wire and base metal: metal flashes into a liquid pool, the gas shield keeps air out; surface tension and EM force stir the pool while its trailing edge freezes into fish-scale ripples; lose the shield and N/H/O break in — pores bubble up on the spot; current and speed set depth & width · drag to orbit / Space = run/pause">焊丝与母材间烧着一根 6000–8000 K 的电弧:金属瞬间熔成液态熔池,保护气罩把空气挡在外面;表面张力与电磁力搅动熔池,后缘周期性凝固拉出鱼鳞纹;一旦失保护,氮氢氧乘虚而入——气孔当场冒出;电流与焊速定熔深熔宽 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="电弧温度" data-en="Arc temp">电弧温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="熔池宽度" data-en="Pool width">熔池宽度</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="焊接速度" data-en="Travel speed">焊接速度</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="气孔计数" data-en="Pore count">气孔计数</span><span class="v" id="stP">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bArc" data-zh="⚡ 引弧" data-en="⚡ Strike">⚡ 引弧</button>
    <button class="abtn" id="bGas">💨 保护气:开</button>
    <button class="abtn" id="bReset" data-zh="↺ 重铺" data-en="↺ Reset bead">↺ 重铺</button>
  </div>
  <div class="row">
    <label data-zh="焊接电流" data-en="Current">焊接电流</label>
    <input id="sI" type="range" min="100" max="300" step="5" value="180">
    <span class="val" id="sIVal">180 A</span>
  </div>
  <div class="row">
    <label data-zh="焊接速度" data-en="Travel speed">焊接速度</label>
    <input id="sV" type="range" min="2" max="10" step="0.5" value="5">
    <span class="val" id="sVVal">5.0 mm/s</span>
  </div>
  <div class="row">
    <label data-zh="枪位进度" data-en="Torch position">枪位进度</label>
    <input id="sPos" type="range" min="0" max="100" step="0.5" value="0">
    <span class="val" id="sPosVal">起弧端</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglGas" type="checkbox" checked> <span data-zh="保护气" data-en="Shield gas">保护气</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../quench-hardening/" data-zh="淬火硬化" data-en="Quench Hardening">淬火硬化</a>
    <a href="../bolt-preload/" data-zh="螺栓预紧" data-en="Bolt Preload">螺栓预紧</a>
    <a href="../thermite/" data-zh="铝热反应" data-en="Thermite Reaction">铝热反应</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,44);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.6,3.4,7.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.2;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(13,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* 母材钢板(可剖切:整块 / 半块+分层剖面) */
const plateM=new THREE.MeshStandardMaterial({color:0x7f8a99,roughness:0.42,metalness:0.6});
const plateFull=new THREE.Mesh(new THREE.BoxGeometry(10,0.7,2.6),plateM);
plateFull.position.y=0.35;scene.add(plateFull);
const plateHalf=new THREE.Mesh(new THREE.BoxGeometry(10,0.7,1.3),plateM);
plateHalf.position.set(0,0.35,-0.65);plateHalf.visible=false;scene.add(plateHalf);
/* HAZ 分层条(剖切面上:近缝粗晶带 / 远缝细晶·回火带) */
const hazAM=new THREE.MeshBasicMaterial({color:0x2f9fe0,transparent:true,opacity:0.5});
const hazA=new THREE.Mesh(new THREE.BoxGeometry(1,0.13,0.02),hazAM);
hazA.position.set(0,0.635,0.015);hazA.visible=false;scene.add(hazA);
const hazBM=new THREE.MeshBasicMaterial({color:0x86c5e8,transparent:true,opacity:0.28});
const hazB=new THREE.Mesh(new THREE.BoxGeometry(1,0.14,0.02),hazBM);
hazB.position.set(0,0.5,0.015);hazB.visible=false;scene.add(hazB);
/* 熔合区(焊缝熔透轮廓,剖切面上) */
const penM=new THREE.MeshBasicMaterial({color:0xff8a3d,transparent:true,opacity:0.42});
const pen=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),penM);
pen.scale.set(0.5,0.26,0.06);pen.position.set(0,0.55,0.02);pen.visible=false;scene.add(pen);
/* 熔宽 W / 熔深 D 尺寸线 */
const dimM=new THREE.MeshBasicMaterial({color:0x2f9fe0});
const dimW=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.025,1),dimM);
dimW.visible=false;scene.add(dimW);
const dimD=new THREE.Mesh(new THREE.BoxGeometry(0.03,1,0.03),dimM);
dimD.visible=false;scene.add(dimD);

/* 焊枪 */
const darkM=new THREE.MeshStandardMaterial({color:0x2c313a,roughness:0.55,metalness:0.35});
const metalM=new THREE.MeshStandardMaterial({color:0xb9c2cc,roughness:0.3,metalness:0.85});
const torch=new THREE.Group();
const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.13,0.95,14),darkM);handle.position.y=0.62;
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.08,0.5,12),darkM);neck.position.y=-0.08;
const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.055,0.28,12),metalM);tip.position.y=-0.44;
torch.add(handle,neck,tip);torch.position.set(-4,1.78,0);scene.add(torch);

/* 电弧(外锥+亮芯) */
const arcM=new THREE.MeshBasicMaterial({color:0x9fd4ff,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false});
const arc=new THREE.Mesh(new THREE.ConeGeometry(0.17,0.5,14,1,true),arcM);
arc.position.y=0.95;arc.visible=false;scene.add(arc);
const arcCoreM=new THREE.MeshBasicMaterial({color:0xeaf6ff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false});
const arcCore=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.46,10,1,true),arcCoreM);
arcCore.position.y=0.94;arcCore.visible=false;scene.add(arcCore);
const arcLight=new THREE.PointLight(0xbfe4ff,0,6,2);scene.add(arcLight);

/* 熔池 */
const poolM=new THREE.MeshBasicMaterial({color:0xffb347});
const pool=new THREE.Mesh(new THREE.SphereGeometry(1,22,14),poolM);
pool.visible=false;scene.add(pool);
const poolLight=new THREE.PointLight(0xff9540,0,7,2);scene.add(poolLight);

/* 保护气罩 */
const gasM=new THREE.MeshBasicMaterial({color:0x2f9fe0,transparent:true,opacity:0.13,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
const gasCone=new THREE.Mesh(new THREE.ConeGeometry(0.46,1.15,18,1,true),gasM);
gasCone.position.y=1.28;gasCone.visible=false;scene.add(gasCone);

/* 焊道(连续圆柱,随走枪生长) */
const beadGeo=new THREE.CylinderGeometry(1,1,1,16);beadGeo.rotateZ(Math.PI/2);
const beadM=new THREE.MeshStandardMaterial({color:0x98a2ad,roughness:0.38,metalness:0.7});
const bead=new THREE.Mesh(beadGeo,beadM);bead.visible=false;scene.add(bead);

const m4=new THREE.Matrix4();const cTmp=new THREE.Color();
/* 火花(InstancedMesh) */
const NSP=70;
const sparks=new THREE.InstancedMesh(new THREE.SphereGeometry(0.032,6,4),
  new THREE.MeshBasicMaterial({color:0xffffff}),NSP);
sparks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(sparks);
const spD=[];for(let i=0;i<NSP;i++){spD.push({t:9,life:1,x:0,y:0,z:0,vx:0,vy:0,vz:0});
  sparks.setColorAt(i,cTmp.setRGB(1,0.8,0.4));}
sparks.instanceColor.needsUpdate=true;
/* 气泡(失保护时冒出) */
const NBU=36;
const bubbles=new THREE.InstancedMesh(new THREE.SphereGeometry(0.038,8,6),
  new THREE.MeshBasicMaterial({color:0xe8f4ff,transparent:true,opacity:0.9}),NBU);
bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(bubbles);
const buD=[];for(let i=0;i<NBU;i++)buD.push({t:9,x:0,y:0,z:0,vy:0});
/* 气孔(凝固后嵌进焊道的暗点) */
const NPR=40;
const pores=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),
  new THREE.MeshStandardMaterial({color:0x1e2226,roughness:0.9}),NPR);
scene.add(pores);
/* 鱼鳞纹(周期凝固波纹,环式缓冲) */
const NRA=80;
const ripples=new THREE.InstancedMesh(new THREE.BoxGeometry(0.05,0.026,1),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.45,metalness:0.6}),NRA);
scene.add(ripples);
const riD=[];for(let i=0;i<NRA;i++){riD.push({born:-99,x:0});
  ripples.setColorAt(i,cTmp.setRGB(0.55,0.58,0.62));}
ripples.instanceColor.needsUpdate=true;
/* 熔滴过渡(焊丝端头向熔池滴落) */
const NDR=8;
const droplets=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),
  new THREE.MeshBasicMaterial({color:0xffd27a}),NDR);
droplets.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(droplets);
const drD=[];for(let i=0;i<NDR;i++)drD.push({t:9,x:0,z:0});
/* 熔池表面对流流线(表面张力+电磁力驱动) */
const NST=18;
const streaks=new THREE.InstancedMesh(new THREE.SphereGeometry(0.024,6,4),
  new THREE.MeshBasicMaterial({color:0xffe3a0,transparent:true,opacity:0.8}),NST);
streaks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(streaks);
const stD=[];for(let i=0;i<NST;i++)stD.push({a:Math.random()*6.28,rf:0.25+(i%6)*0.13});

/* 状态 */
let playing=true,labelsOn=true,slowMo=false,gasOn=true;
let arcOn=false,traveling=false,cutaway=false;
let torchX=-4,weldEnd=0,strikeK=0;
let I=180,V=5,tempK=0,porosity=0,simT=0;
let ripN=0,poN=0,nextRipX=0,drAcc=0;
const beadStart=-3.75;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
const SPD=clamp(parseFloat(qs.get('speed'))||1,0.1,3);
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
weldEnd=beadStart;nextRipX=beadStart+0.35;

/* 物理量:电弧温度 6000–8000 K;熔宽/熔深随电流升、随焊速降(数量级核对) */
const arcTemp=()=>6000+(I-100)*5;                      /* 100 A→6000 K,300 A→7000 K */
const poolWmm=()=>Math.min(14,I*0.045*Math.sqrt(5/V)); /* 180 A,5 mm/s → ~8 mm */
const poolDmm=()=>Math.min(8,I*0.02*Math.pow(5/V,0.6));/* 180 A,5 mm/s → ~3.6 mm */
const beadR=()=>0.15+I/300*0.07;
const poolOn=()=>arcOn&&tempK>1900;
const hazLen=()=>Math.max(0,weldEnd-beadStart);
const px=()=>arcOn?torchX:clamp(weldEnd+0.4,beadStart+0.4,4.4);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,follow=null){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn,follow,ox:pos.x,oy:pos.y,oz:pos.z});
  div.textContent=textFn();return o;
}
addLabel(()=>L(`电弧 ${Math.round(tempK)} K · 熔滴过渡`,`Arc ${Math.round(tempK)} K · droplet transfer`),
  new THREE.Vector3(0,2.1,0),'y',()=>arcOn,'torch');
addLabel(()=>L('熔池:表面张力+电磁力驱动对流','Pool: surface tension + EM force drive the flow'),
  new THREE.Vector3(0.95,1.0,0.55),'o',()=>poolOn()&&activeStep<=2,'torch');
addLabel(()=>L('保护气罩:药皮分解 CO₂ / Ar+CO₂ 挡住空气','Gas shield: CO₂ from coating / Ar+CO₂ blocks air'),
  new THREE.Vector3(-0.8,1.72,0),'b',()=>gasOn&&arcOn,'torch');
addLabel(()=>L('失保护:N/H/O 侵入 → 气孔 · 氢致裂纹','Shield lost: N/H/O break in → pores · H cracks'),
  new THREE.Vector3(0.9,1.62,-0.55),'r',()=>arcOn&&!gasOn,'torch');
addLabel(()=>L('鱼鳞纹:熔池后缘周期性凝固','Fish-scale ripples: the pool tail freezes in pulses'),
  new THREE.Vector3(-1.5,1.1,0.4),'g',()=>hazLen()>1.8&&!cutaway,'torch');
addLabel(()=>L('热影响区 HAZ:母材被回火·正火,随温度梯度分层','HAZ: base metal tempered · normalized in thermal layers'),
  new THREE.Vector3(0,1.35,0.1),'b',()=>cutaway,'pen');
addLabel(()=>L(`熔宽 W≈${poolWmm().toFixed(1)} mm · 熔深 D≈${poolDmm().toFixed(1)} mm`,
    `Width W≈${poolWmm().toFixed(1)} mm · depth D≈${poolDmm().toFixed(1)} mm`),
  new THREE.Vector3(0,0.28,0.75),'o',()=>cutaway&&!arcOn,'pen');
addLabel(()=>L('焊后缓冷=一次焊后热处理,组织在此定型','Slow cool-down = post-weld heat treatment'),
  new THREE.Vector3(3.2,1.7,0),'y',()=>activeStep===5&&!arcOn,null);

function resetWeld(){
  torchX=beadStart-0.25;weldEnd=beadStart;
  ripN=0;poN=0;porosity=0;nextRipX=beadStart+0.35;drAcc=0;
  for(let i=0;i<NRA;i++){riD[i].born=-99;
    m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);ripples.setMatrixAt(i,m4);}
  for(let i=0;i<NPR;i++){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);pores.setMatrixAt(i,m4);}
  for(let i=0;i<NBU;i++)buD[i].t=9;
  for(let i=0;i<NDR;i++)drD[i].t=9;
  for(let i=0;i<NSP;i++)spD[i].t=9;
  ripples.instanceMatrix.needsUpdate=true;pores.instanceMatrix.needsUpdate=true;
  bead.visible=false;
  document.getElementById('sPos').value=0;
  document.getElementById('sPosVal').textContent=L('起弧端','start');
}
/* 预铺一段焊道:跳步/暂停时画面自洽(焊缝已在枪后、熔池跟枪) */
function prefill(endX){
  const rb=beadR();
  let x=beadStart+0.55;ripN=0;
  while(x<endX-0.05){
    const idx=ripN%NRA;ripN++;
    riD[idx].born=simT-9;
    m4.makeScale(1,1,Math.max(rb*0.9,0.08));
    m4.setPosition(x,0.7+1.28*rb+0.004,0);
    ripples.setMatrixAt(idx,m4);
    ripples.setColorAt(idx,cTmp.setRGB(0.55,0.58,0.62));
    x+=0.12+V*0.05;
  }
  ripples.instanceMatrix.needsUpdate=true;
  ripples.instanceColor.needsUpdate=true;
  weldEnd=endX;torchX=endX+0.4;bead.visible=true;nextRipX=endX+0.2;
  document.getElementById('sPos').value=clamp((torchX+4)/8.4*100,0,100);
  document.getElementById('sPosVal').textContent=L(torchX.toFixed(1)+' u','pos '+torchX.toFixed(1));
}
function seedPores(n){
  for(let k=0;k<n;k++){
    const idx=poN%NPR;poN++;porosity++;
    const s0=0.7+Math.random()*0.7,rb=beadR();
    m4.makeScale(s0,s0,s0);
    m4.setPosition(beadStart+0.8+Math.random()*Math.max(hazLen()-0.9,0.2),0.7+1.28*rb+0.01,(Math.random()-0.5)*0.2);
    pores.setMatrixAt(idx,m4);
  }
  pores.instanceMatrix.needsUpdate=true;
}

const STEPS=[
 {zh:'引弧:短路→拉起 6000–8000 K 电弧',en:'Strike: short, then pull a 6000–8000 K arc',
  act(){resetWeld();arcOn=true;strikeK=0.6;cutaway=false;traveling=false;setGas(true);}},
 {zh:'熔池成形:母材+填充金属熔化,气罩护住',en:'Pool forms: base + filler melt under the shield',
  act(){arcOn=true;cutaway=false;traveling=false;setGas(true);}},
 {zh:'移动焊接:熔池尾周期凝固,拉出鱼鳞纹',en:'Travel: the pool tail freezes into fish-scale ripples',
  act(){if(torchX>3.4)resetWeld();arcOn=true;cutaway=false;traveling=true;setGas(true);
    if(hazLen()<0.5&&!playing)prefill(0.9);}},
 {zh:'热影响区 HAZ:母材被回火·正火,分层剖视',en:'HAZ cutaway: base metal tempered · normalized in layers',
  act(){if(torchX>3.4)resetWeld();arcOn=true;cutaway=true;traveling=true;setGas(true);
    if(hazLen()<0.5&&!playing)prefill(0.9);}},
 {zh:'无保护气对照:N/H/O 侵入,气孔当场冒出',en:'No-shield test: N/H/O invade, pores bubble up live',
  act(){resetWeld();arcOn=true;cutaway=false;traveling=true;setGas(false);prefill(0.9);seedPores(6);}},
 {zh:'焊缝剖面检验:量熔宽熔深 · 焊后缓冷=热处理',en:'Bead inspection: measure W & D · slow cool = heat treatment',
  act(){arcOn=false;traveling=false;cutaway=true;if(hazLen()<2)prefill(3.95);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();if(arcOn)tempK=arcTemp();syncSteps();}

function updateStats(){
  const tv=document.getElementById('stT');
  tv.innerHTML=arcOn?Math.round(tempK)+'<small> K</small>':'—';
  tv.className='v '+(tempK>7000?'warn':'');
  const wvEl=document.getElementById('stW');
  const showW=poolOn()||(!arcOn&&hazLen()>0.5);
  wvEl.innerHTML=showW?poolWmm().toFixed(1)+'<small> mm</small>':'—';
  document.getElementById('stV').innerHTML=V.toFixed(1)+'<small> mm/s</small>';
  const pv=document.getElementById('stP');
  pv.innerHTML=String(porosity);
  pv.className='v '+(porosity>0?'warn':(hazLen()>2?'ok':''));
  const sp=document.getElementById('sPos');
  if(document.activeElement!==sp)sp.value=clamp((torchX+4)/8.4*100,0,100);
}
function syncGas(){const b=document.getElementById('bGas');
  b.classList.toggle('on',gasOn);
  b.textContent=gasOn?L('💨 保护气:开','💨 Shield gas: ON'):L('💨 保护气:关','💨 Shield gas: OFF');}
function setGas(v){gasOn=v;document.getElementById('tglGas').checked=v;syncGas();updateStats();}
function setI(v){I=clamp(v,100,300);document.getElementById('sI').value=I;
  document.getElementById('sIVal').textContent=I.toFixed(0)+' A';updateStats();}
function setV(v){V=clamp(v,2,10);document.getElementById('sV').value=V;
  document.getElementById('sVVal').textContent=V.toFixed(1)+' mm/s';updateStats();}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}

  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bArc').addEventListener('click',()=>applyPhase(0));
document.getElementById('bGas').addEventListener('click',()=>setGas(!gasOn));
document.getElementById('bReset').addEventListener('click',()=>{resetWeld();if(arcOn)strikeK=0.3;updateStats();});
document.getElementById('sI').addEventListener('input',e=>setI(+e.target.value));
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sPos').addEventListener('input',e=>{
  traveling=false;strikeK=0;
  torchX=-4+(+e.target.value)/100*8.4;
  if(arcOn)weldEnd=Math.max(beadStart,Math.max(weldEnd,torchX-0.4));
  const near=Math.abs(torchX+4)<0.3;
  document.getElementById('sPosVal').textContent=near?L('起弧端','start'):L(torchX.toFixed(1)+' u','pos '+torchX.toFixed(1));
});
document.getElementById('tglGas').addEventListener('change',e=>setGas(e.target.checked));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncGas();setI(I);setV(V);
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*SPD*(slowMo?0.3:1);
  simT+=dts;

  /* 电弧温度演化 */
  if(arcOn){tempK+=(arcTemp()-tempK)*Math.min(1,dts*3);strikeK=Math.max(0,strikeK-dts);}
  else tempK+=(300-tempK)*Math.min(1,dts*1.2);

  /* 走枪 */
  if(traveling&&arcOn){
    torchX+=V*0.12*dts;
    weldEnd=Math.max(weldEnd,torchX-0.4);
    if(torchX>4.35){
      traveling=false;arcOn=false;weldEnd=4.35-0.4;
      if(activeStep===2)applyPhase(3);
      else if(activeStep===4)applyPhase(5);
    }
  }

  /* 焊道生长 */
  const pw=poolWmm()/10*1.05;
  const bl=hazLen();
  bead.visible=bl>0.05;
  if(bead.visible){
    const rb=beadR();
    bead.scale.set(Math.max(bl,0.01),rb,rb);
    bead.position.set(beadStart+bl/2,0.7+rb*0.28,0);
  }
  /* 鱼鳞纹:走枪时周期铺排,环式缓冲 */
  if(traveling&&arcOn&&torchX>nextRipX){
    const idx=ripN%NRA;ripN++;
    riD[idx].born=simT;
    const rb=beadR();
    m4.makeScale(1,1,Math.max(rb*0.9,0.08));
    m4.setPosition(torchX-0.5,0.7+1.28*rb+0.004,0);
    ripples.setMatrixAt(idx,m4);
    ripples.instanceMatrix.needsUpdate=true;
    ripples.setColorAt(idx,cTmp.setRGB(1,0.62,0.25));
    ripples.instanceColor.needsUpdate=true;
    nextRipX=torchX+0.12+V*0.05;
  }
  /* 鱼鳞纹由热橙降温到金属灰 */
  const rn=Math.min(ripN,NRA);
  for(let i=0;i<rn;i++){
    const age=simT-riD[i].born;
    if(age>=0&&age<8){
      const k=clamp(age/8,0,1);
      ripples.setColorAt(i,cTmp.setRGB(1-0.45*k,0.62-0.04*k,0.25+0.37*k));
      ripples.instanceColor.needsUpdate=true;
    }
  }

  /* 熔池 */
  const pOn=poolOn();
  pool.visible=pOn;
  if(pOn){
    pool.scale.set(pw*0.75,0.09,pw);
    pool.position.set(torchX,0.705,0);
    poolM.color.setHSL(0.085+0.012*Math.sin(simT*9),1,0.55+0.06*Math.sin(simT*13));
    poolLight.intensity=2.2+0.5*Math.sin(simT*21)+0.3*Math.random();
    poolLight.position.set(torchX,1.05,0);
  }else poolLight.intensity*=Math.max(0,1-dts*5);

  /* 电弧 + 保护气罩 */
  arc.visible=arcOn;arcCore.visible=arcOn;
  gasCone.visible=gasOn&&arcOn;
  if(arcOn){
    torch.position.set(torchX,1.78+(strikeK>0?strikeK*0.35:0),0);
    arc.position.x=arcCore.position.x=gasCone.position.x=torchX;
    arcM.opacity=0.55+0.35*Math.random();
    arcCoreM.opacity=0.75+0.25*Math.random();
    const fs=1+0.15*Math.sin(simT*31)+0.1*Math.random();
    arc.scale.set(fs,1,fs);
    arcLight.intensity=1.4+0.6*Math.random();
    arcLight.position.set(torchX,1.0,0);
  }else arcLight.intensity*=Math.max(0,1-dts*6);

  /* 熔滴过渡:焊丝端头周期滴落 */
  drAcc+=dts;
  if(arcOn&&drAcc>0.22){drAcc=0;
    const d=drD.find(d=>d.t>=1);
    if(d){d.t=0;d.x=torchX+(Math.random()-0.5)*0.04;d.z=0;}
  }
  for(let i=0;i<NDR;i++){
    const d=drD[i];
    if(d.t<1&&arcOn){
      d.t+=dts/0.3;
      const sc=Math.max(0.05,1-d.t*0.4);
      m4.makeScale(sc,sc,sc);m4.setPosition(d.x,1.12-0.4*d.t,d.z);
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    droplets.setMatrixAt(i,m4);
  }
  droplets.instanceMatrix.needsUpdate=true;

  /* 火花飞溅 */
  if(arcOn&&Math.random()<dts*34){
    const s=spD.find(s=>s.t>=s.life);
    if(s){s.t=0;s.life=0.45+Math.random()*0.4;
      s.x=torchX+(Math.random()-0.5)*0.2;s.y=0.8+Math.random()*0.3;s.z=(Math.random()-0.5)*0.2;
      const a=Math.random()*6.28,r=0.4+Math.random()*1.4;
      s.vx=Math.cos(a)*r;s.vz=Math.sin(a)*r;s.vy=1.0+Math.random()*1.6;
      sparks.setColorAt(spD.indexOf(s),cTmp.setRGB(1,0.72+Math.random()*0.28,0.3+Math.random()*0.4));
      sparks.instanceColor.needsUpdate=true;
    }
  }
  for(let i=0;i<NSP;i++){
    const s=spD[i];
    if(s.t<s.life){
      s.t+=dts;s.vy-=4.5*dts;
      s.x+=s.vx*dts;s.y+=s.vy*dts;s.z+=s.vz*dts;
      if(s.y<0.02){s.y=0.02;s.vy*=-0.35;}
      const sc=Math.max(0.001,1-s.t/s.life);
      m4.makeScale(sc,sc,sc);m4.setPosition(s.x,s.y,s.z);
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    sparks.setMatrixAt(i,m4);
  }
  sparks.instanceMatrix.needsUpdate=true;

  /* 失保护:熔池里冒气泡 → 尾部凝固冻成气孔(招牌对照) */
  if(pOn&&!gasOn&&Math.random()<dts*8){
    const b=buD.find(b=>b.t>=2);
    if(b){b.t=0;b.x=torchX+(Math.random()-0.5)*0.35;b.y=0.705+Math.random()*0.02;
      b.z=(Math.random()-0.5)*0.22;b.vy=0.04+Math.random()*0.08;}
  }
  for(let i=0;i<NBU;i++){
    const b=buD[i];let sc=0.001,x=0,y=-9,z=0;
    if(b.t<2){
      b.t+=dts;b.y+=b.vy*dts;
      if(torchX-b.x>0.32){ /* 熔池尾部凝固:气泡被冻成气孔 */
        b.t=9;
        const idx=poN%NPR;poN++;porosity++;
        const s0=0.7+Math.random()*0.7,rb=beadR();
        m4.makeScale(s0,s0,s0);
        m4.setPosition(b.x,0.7+1.28*rb+0.01,b.z);
        pores.setMatrixAt(idx,m4);pores.instanceMatrix.needsUpdate=true;
      }else if(b.y>0.78||b.t>2.5){b.t=9;} /* 少量浮出熔池逃逸 */
      else{sc=0.9+0.3*Math.sin(simT*10+i);x=b.x;y=b.y;z=b.z;}
    }
    m4.makeScale(sc,sc,sc);m4.setPosition(x,y,z);
    bubbles.setMatrixAt(i,m4);
  }
  bubbles.instanceMatrix.needsUpdate=true;

  /* 熔池表面对流流线 */
  for(let i=0;i<NST;i++){
    const s=stD[i];
    if(pOn){
      s.a+=dts*(2.4-0.06*(i%6));
      const r=s.rf*pw*0.62;
      m4.makeScale(1,1,1);
      m4.setPosition(torchX+Math.cos(s.a)*r*1.15,0.78,Math.sin(s.a)*r);
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    streaks.setMatrixAt(i,m4);
  }
  streaks.instanceMatrix.needsUpdate=true;

  /* 剖视模式:整块↔半块+分层 */
  plateFull.visible=!cutaway;plateHalf.visible=cutaway;
  hazA.visible=hazB.visible=pen.visible=cutaway;
  const ppx=px();
  if(cutaway){
    const hl=Math.max(hazLen(),0.001);
    hazA.scale.x=hl;hazA.position.x=beadStart+hl/2;
    hazB.scale.x=hl;hazB.position.x=beadStart+hl/2;
    pen.position.x=ppx;
  }
  const dims=cutaway&&!arcOn;
  dimW.visible=dimD.visible=dims;
  if(dims){
    dimW.scale.z=Math.max(pw,0.3);dimW.position.set(ppx,0.718,0);
    const ddu=Math.max(poolDmm()/24,0.1);
    dimD.scale.y=ddu;dimD.position.set(ppx,0.7-ddu/2,0.16);
  }

  /* 标签跟随 */
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible){
      if(r.follow==='torch')r.o.position.set(clamp(torchX+r.ox,-3.45,4.7),r.oy,r.oz);
      else if(r.follow==='pen')r.o.position.set(clamp(ppx+r.ox,-4.6,4.7),r.oy,r.oz);
      r.o.element.textContent=r.text();
    }
  }

  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setI(180);setV(5);setGas(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
