<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>垃圾回收 · 可达性三色波</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="垃圾回收与三色标记" data-en="Garbage Collection & Tri-color Marking">垃圾回收与三色标记</h1>
  <div class="sub" data-zh="谁生谁死不看引用数,看能不能从根走到:三色标记从根出发——灰是排队待查、黑是查完幸存、白是无人认领;标记完一轮清扫,白对象当场回收;程序边跑边改引用,写屏障保证新引用不漏标;对照的引用计数见不得循环引用,一环扣一环就永远清不掉 · 拖动旋转 / 空格运行/暂停" data-en="Who lives isn’t a count, it’s reachability from the roots: tri-color marking sweeps out — grey queued for scanning, black scanned and alive, white unclaimed; the sweep phase reclaims the whites; the program mutates references under the marker’s feet and write barriers keep new refs honest; reference counting can’t stomach cycles — a ring of one keeps them all immortal · drag to orbit / Space = run/pause">谁生谁死不看引用数,看能不能从根走到:三色标记从根出发——灰是排队待查、黑是查完幸存、白是无人认领;标记完一轮清扫,白对象当场回收;程序边跑边改引用,写屏障保证新引用不漏标;对照的引用计数见不得循环引用,一环扣一环就永远清不掉 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="堆对象" data-en="Heap objects">堆对象</span><span class="v" id="stHeap">—</span>
  <span class="k" data-zh="存活" data-en="Live">存活</span><span class="v" id="stLive">—</span>
  <span class="k" data-zh="标记进度" data-en="Mark progress">标记进度</span><span class="v" id="stMark">—</span>
  <span class="k" data-zh="GC 暂停" data-en="GC pause">GC 暂停</span><span class="v" id="stPause">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bMarkSweep" data-zh="标记-清除" data-en="Mark &amp; sweep">标记-清除</button>
    <button class="abtn" id="bRefCount" data-zh="引用计数" data-en="Reference counting">引用计数</button>
  </div>
  <div class="row">
    <label data-zh="分配速率" data-en="Alloc rate">分配速率</label>
    <input id="sAlloc" type="range" min="0" max="10" step="1" value="4">
    <span class="val" id="sAllocVal">4 obj/s</span>
  </div>
  <div class="row">
    <label data-zh="循环引用组" data-en="Ref cycles">循环引用组</label>
    <input id="sCycle" type="range" min="0" max="5" step="1" value="2">
    <span class="val" id="sCycleVal">2</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglGraph" type="checkbox" checked> <span data-zh="对象图" data-en="Object graph">对象图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../hash-table/" data-zh="哈希表" data-en="Hash Tables">哈希表</a>
    <a href="../virtual-memory/" data-zh="虚拟内存与页表" data-en="Virtual Memory">虚拟内存与页表</a>
    <a href="../binary-heap/" data-zh="二叉堆与优先队列" data-en="Binary Heap">二叉堆与优先队列</a>
    <a href="../sorting-race/" data-zh="排序竞速" data-en="Sorting Race">排序竞速</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
/* ── 场景:对象堆 + 根集合,三色标记波与清扫,对照引用计数 ── */
const MAXN=40;
const slabM=new THREE.MeshStandardMaterial({color:0x2c313b,roughness:0.85});
const slab=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.16,4.6),slabM);
slab.position.set(0,0.68,0);scene.add(slab);
const rootBarM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const rootBar=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.42,0.42),rootBarM);
rootBar.position.set(0,4.0,0);scene.add(rootBar);
const nodeM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.4,metalness:0.2,
  emissive:0x000000,emissiveIntensity:0});
const nodes=new THREE.InstancedMesh(new THREE.SphereGeometry(0.2,18,18),nodeM.clone(),MAXN);
nodes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(nodes);
/* 引用计数徽章:小数字用颜色深浅代替 */
const rootSpheres=[];
const rootM=new THREE.MeshStandardMaterial({color:0x9aa4b4,roughness:0.35,metalness:0.6,
  emissive:0x3d5a80,emissiveIntensity:0.5});
for(let i=0;i<4;i++){
  const r=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42),rootM);
  r.position.set(-2.7+i*1.8,4.0,0.28);scene.add(r);rootSpheres.push(r);
}
const edgeM=new THREE.LineBasicMaterial({color:0x8a94a4,transparent:true,opacity:0.6});
const MAXE=64;
const edgeGeo=new THREE.BufferGeometry();
edgeGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(MAXE*6),3));
const edgeLines=new THREE.LineSegments(edgeGeo,edgeM);scene.add(edgeLines);
/* STW 横幅 */
const bannerM=new THREE.MeshStandardMaterial({color:0xff7b4f,transparent:true,opacity:0,
  emissive:0xff5b2b,emissiveIntensity:0.4});
const banner=new THREE.Mesh(new THREE.PlaneGeometry(5.2,0.8),bannerM);
banner.position.set(0,5.3,0);scene.add(banner);

const lblRoots=addLabel(()=>L('GC Roots:栈变量与全局引用','GC Roots: stack vars & globals'),
  new THREE.Vector3(-3.1,4.65,0),'b');
const lblHeap=addLabel(()=>L('托管堆:谁被根引用,谁就能活','Managed heap: reachable from a root, alive'),
  new THREE.Vector3(-3.4,1.35,0.4),'y');
const lblCycle=addLabel(()=>L('循环引用组:A→B→C→A,没有外人指','Ref cycle: A→B→C→A, nobody outside points in'),
  new THREE.Vector3(3.3,3.4,0.6),'r',()=>cycleN>0);
const lblStw=addLabel(()=>L('Stop-The-World:标记时全程序暂停','Stop-The-World: everything pauses while marking'),
  new THREE.Vector3(0,6.0,0),'r',()=>stwT>0);

/* 状态 */
let mode='ms',allocRate=4,cycleN=2,playing=true,labelsOn=true,slowMo=false,graphOn=true;
let objs=[],edges=[],phase='mutate',phaseT=0,stwT=0,gcCount=0;
let pauseMs=0,totalAlloc=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 对象槽位 */
const slots=[];
for(let gy=0;gy<4;gy++)for(let gx=0;gx<9;gx++)
  slots.push([-3.2+gx*0.8,2.95-gy*0.62,(gy%2?0.18:-0.18)]);
const used=new Array(slots.length).fill(-1);
function freeSlot(){for(let i=0;i<slots.length;i++)if(used[i]<0)return i;return -1;}
/* 根 */
const ROOTN=4;
function newObj(parent){/* parent: -1=root, else obj index */
  const s=freeSlot();if(s<0)return -1;
  const id=objs.length;
  objs.push({slot:s,color:0xffffff,state:'white',ref:null,rc:1,cyc:false});
  used[s]=id;
  if(parent===-1){edges.push({a:'root'+(rootsUsed++),b:id});}
  else{edges.push({a:parent,b:id});objs[parent].ref=id;objs[id].rc++;}
  totalAlloc++;
  return id;
}
let rootsUsed=0;
function makeCycle(){
  const ids=[];
  for(let i=0;i<3;i++){const s=freeSlot();if(s<0)return;
    const id=objs.length;
    objs.push({slot:s,color:0xffffff,state:'white',ref:null,rc:0,cyc:true});
    used[s]=id;ids.push(id);totalAlloc++;}
  for(let i=0;i<3;i++){objs[ids[i]].ref=ids[(i+1)%3];edges.push({a:ids[i],b:ids[(i+1)%3]});}
}
function reachable(){/* 从根沿 ref 边可达集 */
  const seen=new Set();
  const stack=[];
  edges.forEach(e=>{if(typeof e.a==='string')stack.push(e.b);});
  while(stack.length){
    const id=stack.pop();
    if(seen.has(id))continue;seen.add(id);
    if(objs[id].ref!==null&&objs[id].ref>=0)stack.push(objs[id].ref);
  }
  return seen;
}
function sweepAndAlloc(){
  /* 修剪悬空边 */
  edges=edges.filter(e=>{
    const aIsRoot=typeof e.a==='string';
    return (aIsRoot||objs[e.a].state!=='dead')&&objs[e.b].state!=='dead';});
  objs.forEach((o,i)=>{if(o.state==='dead'){used[o.slot]=-1;
    edges=edges.filter(e=>e.b!==i&&e.a!==i);}});
  objs=objs.filter(o=>o.state!=='dead');
  /* 重建 slot→index */
  objs.forEach((o,i)=>used[o.slot]=i);
  edges.forEach(e=>{if(typeof e.a!=='string'&&e.a>=objs.length)e.a=null;});
  edges=edges.filter(e=>e.a!==null);
  /* 新分配:挂在随机存活对象上 */
  for(let k=0;k<2;k++)if(objs.length>0&&Math.random()<0.8){
    const p=Math.floor(Math.random()*objs.length);
    newObj(objs[p].cyc?-1:p);}
}

const lblStatsDummy=addLabel(()=>L('',''),new THREE.Vector3(0,-10,0));
function setMode(m){mode=m;
  document.getElementById('bMarkSweep').classList.toggle('on',m==='ms');
  document.getElementById('bRefCount').classList.toggle('on',m==='rc');
  updateStats();}
function setAlloc(v){allocRate=clamp(v,0,10);
  document.getElementById('sAlloc').value=allocRate;
  document.getElementById('sAllocVal').textContent=allocRate.toFixed(0)+' obj/s';updateStats();}
function setCycle(v){cycleN=clamp(v,0,5);
  document.getElementById('sCycle').value=cycleN;
  document.getElementById('sCycleVal').textContent=cycleN.toFixed(0);
  /* 重建循环组数量 */
  objs.forEach(o=>{if(o.cyc){o.state='dead';used[o.slot]=-1;}});
  objs=objs.filter(o=>!o.cyc);
  edges=edges.filter(e=>typeof e.a==='string'||(!objs[e.a]?.cyc&&!objs[e.b]?.cyc));
  objs.forEach((o,i)=>used[o.slot]=i);
  for(let i=0;i<cycleN;i++)makeCycle();
  updateStats();}

const STEPS=[
 {zh:'<b>根可达性</b>:程序边跑边分,谁被根引用谁活',en:'<b>Reachability</b>: the program runs and allocates — reachable means alive',
  act(){setMode('ms');setAlloc(4);setCycle(2);}},
 {zh:'<b>标记波</b>:STW 一声令下,灰色波从根涌出、逐层染黑',en:'<b>Mark wave</b>: STW — the grey wave floods out and blacks each layer',
  act(){phase='mutate';phaseT=5.4;}},
 {zh:'<b>清扫白色</b>:没人认领的白对象当场回收',en:'<b>Sweep the whites</b>: unclaimed objects are reclaimed on the spot',
  act(){phase='mutate';phaseT=8.0;}},
 {zh:'<b>循环引用</b>:A→B→C→A 互指,标记-清除照样收走',en:'<b>Ref cycle</b>: A→B→C→A — mark & sweep still collects it',
  act(){setCycle(3);phase='mutate';phaseT=6.2;}},
 {zh:'<b>引用计数</b>:没人指就立刻回收——但循环引用永远数不到 0',en:'<b>Reference counting</b>: instant reclaim — but a cycle never counts to zero',
  act(){setMode('rc');setCycle(3);}},
 {zh:'<b>分配风暴</b>:10 obj/s,GC 被迫频繁出手、暂停变长',en:'<b>Alloc storm</b>: 10 obj/s forces GC after GC, longer pauses',
  act(){setAlloc(10);setMode('ms');}},
];

function updateStats(){
  const alive=objs.filter(o=>o.state==='black'||o.state==='grey').length;
  document.getElementById('stHeap').textContent=objs.length+'';
  document.getElementById('stLive').textContent=alive+'';
  const prog=phase==='mark'?clamp(markDone/Math.max(objs.length,1),0,1):phase==='sweep'?1:0;
  const pv=document.getElementById('stMark');
  pv.innerHTML=(prog*100).toFixed(0)+'<small> %</small>';
  const sw=document.getElementById('stPause');
  sw.textContent=stwT>0?L('STW 暂停','STW'):L('运行','running');
  sw.className='v '+(stwT>0?'warn':'ok');
}
document.getElementById('bMarkSweep').addEventListener('click',()=>setMode('ms'));
document.getElementById('bRefCount').addEventListener('click',()=>setMode('rc'));
document.getElementById('sAlloc').addEventListener('input',e=>setAlloc(+e.target.value));
document.getElementById('sCycle').addEventListener('input',e=>setCycle(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

camera.position.set(1.15,4.6,9.4);
controls.target.set(0.35,2.6,0);

let markDone=0,markQueue=[],mutAcc=0,mutAcc2=0;
function startGC(){
  phase='mark';markDone=0;stwT=1;
  const reach=reachable();
  markQueue=[];
  objs.forEach((o,i)=>{if(o.state!=='dead')o.state='white';});
  edges.forEach(e=>{if(typeof e.a==='string'){const b=e.b;
    if(objs[b]&&objs[b].state!=='dead'){objs[b].state='grey';markQueue.push(b);}}});
}
function tick(dts,dt){
  const ds=slowMo?dts*0.3:dts;
  /* 阶段机 */
  if(mode==='ms'){
    if(phase==='mutate'){
      phaseT+=ds;
      mutAcc+=ds*allocRate;
      while(mutAcc>1){mutAcc-=1;
        if(objs.length<MAXN-4)newObj(objs.length?Math.floor(Math.random()*objs.length):-1);}
      mutAcc2+=ds*0.5;
      if(mutAcc2>1){mutAcc2=0;/* 随机丢引用制造垃圾 */
        const cand=objs.filter(o=>!o.cyc&&o.ref!==null);
        if(cand.length>4){const v=cand[Math.floor(Math.random()*cand.length)];
          v.ref=null;v.rc--;edges=edges.filter(e=>!(e.a===objs.indexOf(v)));}}
      if(phaseT>7)startGC();
    }else if(phase==='mark'){
      stwT=Math.max(0,stwT-ds);bannerM.opacity=stwT>0?0.85:0;
      markTimer+=ds;
      if(markTimer>0.22){
        markTimer=0;
        const nxt=markQueue.shift();
        if(nxt!==undefined&&objs[nxt]&&objs[nxt].state==='grey'){
          objs[nxt].state='black';markDone++;
          const c=objs[nxt].ref;
          if(c!==null&&objs[c]&&objs[c].state==='white'){objs[c].state='grey';markQueue.push(c);}
        }else if(markQueue.length===0){phase='sweep';sweepT=0;}
      }
    }else if(phase==='sweep'){
      sweepT+=ds;
      objs.forEach(o=>{if(o.state==='white'&&Math.random()<ds*6)o.state='dead';});
      if(sweepT>1.1){
        sweepAndAlloc();phase='mutate';phaseT=0;gcCount++;pauseMs=10+gcCount*2+allocRate;
        bannerM.opacity=0;}
    }
  }else{
    /* 引用计数:即时回收,循环永生 */
    mutAcc+=ds*allocRate;
    while(mutAcc>1){mutAcc-=1;
      if(objs.length<MAXN-4)newObj(objs.length?Math.floor(Math.random()*objs.length):-1);}
    mutAcc2+=ds*0.8;
    if(mutAcc2>1){mutAcc2=0;
      const cand=objs.filter(o=>!o.cyc&&o.ref!==null&&o.rc<=1);
      if(cand.length>3){const v=cand[Math.floor(Math.random()*cand.length)];
        v.ref=null;
        const child=objs.find(o=>o.rc>=1&&o!==v&&!o.cyc);
        /* 简化:rc 归零即回收(仅演示非循环对象) */
        if(Math.random()<0.5){v.state='dead';used[v.slot]=-1;
          edges=edges.filter(e=>e.a!==objs.indexOf(v)&&e.b!==objs.indexOf(v));
          objs[objs.indexOf(v)].state='dead';
          objs=objs.filter(o=>o.state!=='dead');
          objs.forEach((o,i)=>used[o.slot]=i);}
      }
    }
    bannerM.opacity=0;
  }
  /* 边与节点渲染 */
  let ei=0;const pa=edgeGeo.attributes.position;
  edges.forEach(e=>{
    if(ei>=MAXE)return;
    let ax,ay;
    if(typeof e.a==='string'){const k=+e.a.slice(4)%4;ax=rootSpheres[k].position.x;ay=4.0;}
    else{if(!objs[e.a])return;const s=slots[objs[e.a].slot];ax=s[0];ay=s[1];}
    if(!objs[e.b])return;
    const bs=slots[objs[e.b].slot];
    pa.setXYZ(ei*2,ax,ay,0);pa.setXYZ(ei*2+1,bs[0],bs[1],bs[2]);ei++;
  });
  for(let i=ei;i<MAXE;i++){pa.setXYZ(i*2,0,-99,0);pa.setXYZ(i*2+1,0,-99,0);}
  pa.needsUpdate=true;
  edgeLines.visible=graphOn;
  const colors=[];
  objs.forEach((o,i)=>{
    const s=slots[o.slot];
    const wob=Math.sin(simT*2+i)*0.02;
    m4.makeScale(1,1,1);m4.setPosition(s[0],s[1]+wob,s[2]);
    nodes.setMatrixAt(i,m4);
    let col=0xd8dee8,em=0x000000,emi=0;
    if(o.state==='grey'){col=0xffb35c;em=0xd9822b;emi=1.2;}
    else if(o.state==='black'){col=0x4a5468;}
    else if(o.cyc){col=mode==='rc'?0xff6b6b:0xff9e80;em=0xff4444;emi=mode==='rc'?0.9:0.35;}
    else if(o.state==='dead'){col=0x15181d;emi=0;}
    nodes.setColorAt(i,tmpC.setHex(col));
  });
  nodes.count=objs.length;
  nodes.instanceMatrix.needsUpdate=true;
  if(nodes.instanceColor)nodes.instanceColor.needsUpdate=true;
  nodeM.emissiveIntensity=0;
  nodes.material.emissive.setHex(0x000000);
  frame.acc2=(frame.acc2||0)+dt;
  if(frame.acc2>0.3){frame.acc2=0;updateStats();}
}
let markTimer=0,sweepT=0;
const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
/* 初始对象 */
for(let i=0;i<4;i++)newObj(-1);
for(let i=0;i<6;i++)newObj(Math.floor(Math.random()*objs.length));
makeCycle();makeCycle();
function themeExtra(dark){}

let activeStep=0;

const clock=new THREE.Clock();
let raf=null,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  tick(dts,dt);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
});
</script>
