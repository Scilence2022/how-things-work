<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(26,innerWidth/innerHeight,0.1,200);
camera.position.set(12.5,4.6,10.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.55,1.5);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:齿轮副,轴线沿 X,啮合点在 +Y ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const CY=2.35,Z1=12,Z2=24,M=2*1.0/Z1,PA=0.15;   /* 模数:rp1=1.0, rp2=2.0 */
const colM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const base=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.12,6.6),colM);
base.position.set(0,0.06,2.1);scene.add(base);
const legM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
for(const sx of [-2.1,2.1])for(const sz of [-1.0,5.2]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(0.16,CY-0.12,0.16),legM);
  leg.position.set(sx,(CY-0.12)/2+0.12,sz);scene.add(leg);
}
/* 齿轮廓面:梯形齿近似 */
function gearOutline(z,m){
  const rp=z*m/2,ra=rp+0.85*m,rd=rp-1.05*m,p=2*Math.PI/z,pts=[];
  for(let i=0;i<z;i++){const a=i*p;
    const add=(ang,r)=>pts.push(new THREE.Vector2(r*Math.cos(ang),r*Math.sin(ang)));
    add(a-0.12*p,ra);add(a,ra);add(a+0.12*p,ra);
    add(a+0.28*p,rd);add(a+0.5*p,rd);add(a+0.72*p,rd);
  }
  return pts;
}
/* 斜齿几何:沿轴向逐层扭转;β 越大总扭转角 tanβ·B/rp 越大 */
function makeGearGeo(z,m,width,beta,bore){
  const prof=gearOutline(z,m);
  const hole=[];for(let i=0;i<28;i++){const a=i/28*Math.PI*2;
    hole.push(new THREE.Vector2(bore*Math.cos(a),bore*Math.sin(a)));}
  const tris=THREE.ShapeUtils.triangulateShape(prof,[hole]);
  const n=prof.length,nh=hole.length,rp=z*m/2;
  const layers=Math.max(8,Math.ceil(width/0.045));
  const twist=Math.tan(beta)*width/rp;
  const pos=[],idx=[];
  const put=(pt,x,phi)=>{const c=Math.cos(phi),s=Math.sin(phi);
    pos.push(x,pt.x*c-pt.y*s,pt.x*s+pt.y*c);};
  for(let l=0;l<=layers;l++){
    const x=-width/2+width*l/layers,phi=twist*(l/layers);
    for(let i=0;i<n;i++)put(prof[i],x,phi);
    for(let i=0;i<nh;i++)put(hole[i],x,phi);
  }
  const V=(l,i)=>l*(n+nh)+i;
  for(const t of tris)idx.push(V(0,t[0]),V(0,t[1]),V(0,t[2]));
  for(const t of tris)idx.push(V(layers,t[0]),V(layers,t[2]),V(layers,t[1]));
  const quad=(l0,i0,l1,i1)=>{idx.push(V(l0,i0),V(l1,i0),V(l1,i1),V(l0,i0),V(l1,i1),V(l0,i1));};
  for(let l=0;l<layers;l++){
    for(let i=0;i<n;i++)quad(l,i,l,(i+1)%n);
    for(let i=0;i<nh;i++)quad(l,nh+i,l,nh+(i+1)%nh);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}
const steelM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.32,metalness:0.75});
const steel2M=new THREE.MeshStandardMaterial({color:0x76829a,roughness:0.36,metalness:0.7});
const shaftM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const g1G=new THREE.Group();g1G.position.set(0,CY,0);scene.add(g1G);
const g2G=new THREE.Group();g2G.position.set(0,CY,3.0);scene.add(g2G);
const shaft1=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,3.6,20),shaftM);
shaft1.rotation.z=Math.PI/2;g1G.add(shaft1);
const shaft2=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,3.6,20),shaftM);
shaft2.rotation.z=Math.PI/2;g2G.add(shaft2);
const motorM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const motor=new THREE.Mesh(new THREE.BoxGeometry(0.95,1.0,1.0),motorM);
motor.position.set(-2.5,CY,0);scene.add(motor);
let gearMeshes=[];
/* 作用面展开图:公告板浮板,局部 X=齿宽方向,Y=展开的滚动弧长,接触线在其上扫掠 */
const poaG=new THREE.Group();poaG.position.set(0.35,3.0,-2.6);scene.add(poaG);
const poaM=new THREE.MeshStandardMaterial({color:0xd9822b,transparent:true,opacity:0.10,
  roughness:0.9,side:THREE.DoubleSide,depthWrite:false});
const poa=new THREE.Mesh(new THREE.PlaneGeometry(1,1),poaM);poaG.add(poa);
const frameM=new THREE.LineBasicMaterial({color:0xd9822b,transparent:true,opacity:0.5});
const poaFrame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1,1)),frameM);
poaG.add(poaFrame);
const lineM=new THREE.LineBasicMaterial({color:0xffb35c,transparent:true,opacity:0.95,depthTest:false});
const NL=4;
const poaLines=new THREE.LineSegments(new THREE.BufferGeometry(),lineM);
poaLines.renderOrder=10;poaG.add(poaLines);
/* 轴向力箭头 */
const arrM=new THREE.MeshStandardMaterial({color:0xff7b4f,roughness:0.4,emissive:0xff7b4f,emissiveIntensity:0.45});
const arrows=[];
function makeArrow(){
  const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,10),arrM);
  cyl.rotation.z=Math.PI/2;cyl.position.x=0.5;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.24,12),arrM);
  cone.rotation.z=-Math.PI/2;cone.position.x=1.0;g.add(cone);
  scene.add(g);arrows.push(g);return g;
}
const arrowA=makeArrow(),arrowB=makeArrow(),arrowC=makeArrow();

/* 状态 */
let mode='helical',rpm=150,beta=25,B=0.9,playing=true,labelsOn=true,slowMo=false,poaOn=true;
let theta=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const RP1=1.0,RP2=2.0,PT=2*Math.PI*RP1/Z1;
let Lmin=1e9,Lmax=0,LavgT=0,LavgN=0;
function epsAlpha(){return 1.55;}
function epsBeta(){return mode==='spur'?0:B*Math.tan(beta*Math.PI/180)/PT;}
function fTan(){return Math.tan(beta*Math.PI/180);}
function faNow(){return mode==='herring'?0:200*fTan();}

function rebuildGears(){
  for(const gm of gearMeshes){gm.parent.remove(gm);gm.geometry.dispose();}
  gearMeshes=[];
  const bore=0.15;
  const add=(geo,mat,parent)=>{const m=new THREE.Mesh(geo,mat);parent.add(m);gearMeshes.push(m);return m;};
  if(mode==='herring'){
    const hw=B/2;
    const g1a=add(makeGearGeo(Z1,M,hw,beta*Math.PI/180,bore),steelM,g1G);g1a.position.x=-hw/2;
    const g1b=add(makeGearGeo(Z1,M,hw,beta*Math.PI/180,bore),steelM,g1G);g1b.position.x=hw/2;g1b.rotation.y=Math.PI;
    const g2a=add(makeGearGeo(Z2,M,hw,beta*Math.PI/180,bore),steel2M,g2G);g2a.position.x=-hw/2;
    const g2b=add(makeGearGeo(Z2,M,hw,beta*Math.PI/180,bore),steel2M,g2G);g2b.position.x=hw/2;g2b.rotation.y=Math.PI;
  }else{
    add(makeGearGeo(Z1,M,B,beta*Math.PI/180,bore),steelM,g1G);
    add(makeGearGeo(Z2,M,B,beta*Math.PI/180,bore),steel2M,g2G);
  }
}
function contactModel(cShift){
  /* 作用面局部坐标:X∈[-B/2,B/2],Z∈[-S/2,S/2];接触线斜率 m=tanβ,间隔一个周节,以 v 扫动 */
  const S=1.8*PT,m=Math.tan(beta*Math.PI/180),out=[];
  const k0=Math.floor((cShift+S/2)/PT);
  for(let k=0;k<NL;k++){
    const c=(k0+k-1)*PT-cShift;      /* z at x=0 */
    let x1=-B/2,x2=B/2;
    if(m>1e-6){
      const zAt=x=>c+m*x;
      let lo=-B/2,hi=B/2;
      if(zAt(lo)>S/2||zAt(hi)<-S/2)continue;
      if(zAt(lo)<-S/2)lo=(-S/2-c)/m;
      if(zAt(hi)>S/2)hi=(S/2-c)/m;
      x1=Math.max(-B/2,lo);x2=Math.min(B/2,hi);
    }
    if(x2>x1)out.push([x1,c+m*x1,x2,c+m*x2]);
  }
  return out;
}
function totalLen(segs){let s=0;for(const q of segs)s+=(q[2]-q[0])/Math.sqrt(1+fTan()**2);return s;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lbl1=addLabel(()=>L('主动轮 z₁=12','Driver z₁=12'),new THREE.Vector3(0,0.9,0),'b');
const lbl2=addLabel(()=>L('从动轮 z₂=24','Driven z₂=24'),new THREE.Vector3(0,5.0,3),'g');
const lblC=addLabel(()=>L('作用面展开 · 接触线扫掠','Development · sweeping contact lines'),new THREE.Vector3(0,0.72,0),'o');
poaG.add(lblC);
const lblA=addLabel(()=>L(`轴向力 F_a = ${faNow().toFixed(0)} N`,`Axial F_a = ${faNow().toFixed(0)} N`),
  new THREE.Vector3(2.6,CY+0.55,3),'r',()=>mode!=='herring');
const lblH=addLabel(()=>L('人字齿:左右手螺旋对消 F_a','Herringbone: opposite hands cancel F_a'),
  new THREE.Vector3(2.6,CY+0.55,3),'g',()=>mode==='herring');

function setRpm(v){rpm=clamp(v,60,480);
  document.getElementById('sRpm').value=rpm;
  document.getElementById('sRpmVal').textContent=rpm.toFixed(0)+' rpm';updateStats();}
function setBeta(v){beta=clamp(v,0,40);
  if(mode==='spur')beta=0;
  document.getElementById('sBeta').value=beta;
  document.getElementById('sBetaVal').textContent=beta.toFixed(0)+'°';
  rebuildGears();updateStats();}
function setWidth(v){B=clamp(v,0.4,1.6);
  document.getElementById('sWidth').value=B;
  document.getElementById('sWidthVal').textContent=B.toFixed(2);
  rebuildGears();updateStats();}
function setMode(m){mode=m;
  document.getElementById('bSpur').classList.toggle('on',m==='spur');
  document.getElementById('bHelical').classList.toggle('on',m==='helical');
  document.getElementById('bHerring').classList.toggle('on',m==='herring');
  document.getElementById('sBeta').disabled=(m==='spur');
  if(m==='spur'&&beta>0){beta=0;document.getElementById('sBeta').value=0;
    document.getElementById('sBetaVal').textContent='0°';}
  rebuildGears();updateStats();}

const STEPS=[
 {zh:'<b>直齿基准</b>:接触线横跨整个齿宽同时进出,每换一齿“哐”一声',en:'<b>Spur baseline</b>: the contact line spans the whole face and pops in and out — one thud per tooth',
  act(){setMode('spur');setRpm(120);setWidth(0.9);}},
 {zh:'<b>斜齿渐进啮合</b>:接触线斜跨齿面,从一端扫到另一端,冲击被摊薄',en:'<b>Helical engagement</b>: the diagonal line sweeps end to end, spreading the impact',
  act(){setMode('helical');setBeta(25);setRpm(120);}},
 {zh:'<b>重合度 ε</b>:齿宽拉满,同时工作的接触线更多,ε 冲破 2',en:'<b>Overlap ratio ε</b>: widen the face, more lines share the load, ε passes 2',
  act(){setWidth(1.6);}},
 {zh:'<b>轴向力的代价</b>:β 拉到 40°,F_a=F_t·tanβ 把轴承往外顶',en:'<b>The thrust bill</b>: β to 40° and F_t·tanβ shoves the bearings outboard',
  act(){setBeta(40);setWidth(0.9);}},
 {zh:'<b>人字齿</b>:左右手螺旋背靠背,轴向力当场对消、平稳照旧',en:'<b>Herringbone</b>: opposite hands back to back — thrust cancels, smoothness stays',
  act(){setMode('herring');setBeta(30);}},
 {zh:'<b>高速对照</b>:转速拉满,直齿的波动 vs 斜齿的平稳',en:'<b>Full speed</b>: spur ripple versus helical calm at max rpm',
  act(){setMode('helical');setBeta(25);setRpm(480);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  const ev=document.getElementById('stEps');
  ev.innerHTML=(epsAlpha()+epsBeta()).toFixed(2)+'<small> </small>';
  ev.className='v '+((epsAlpha()+epsBeta())>=2?'ok':'');
  const fa=document.getElementById('stFa');
  fa.innerHTML=faNow().toFixed(0)+'<small> N</small>';
  fa.className='v '+(faNow()>120?'warn':'ok');
  const rp=document.getElementById('stRip');
  const pct=LavgN>0?Math.min(99,(Lmax-Lmin)/LavgN*100):0;
  rp.innerHTML=pct.toFixed(0)+'<small> %</small>';
  rp.className='v '+(pct>20?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSpur').addEventListener('click',()=>setMode('spur'));
document.getElementById('bHelical').addEventListener('click',()=>setMode('helical'));
document.getElementById('bHerring').addEventListener('click',()=>setMode('herring'));
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sBeta').addEventListener('input',e=>setBeta(+e.target.value));
document.getElementById('sWidth').addEventListener('input',e=>setWidth(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglPoA').addEventListener('change',e=>{poaOn=e.target.checked;poa.visible=poaOn;poaLines.visible=poaOn;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const w=rpm*2*Math.PI/60;
  theta+=dts*w;
  g1G.rotation.x=theta;
  g2G.rotation.x=Math.PI/Z2-theta*Z1/Z2;
  /* 展开板:面向相机,尺寸随齿宽;接触线在局部 XY 内扫掠 */
  poaG.lookAt(camera.position);
  poa.scale.set(Math.max(B,0.05),1.8*PT,1);
  poaFrame.scale.set(Math.max(B,0.05),1.8*PT,1);
  /* 接触线扫掠:切向速度 ω·rp */
  const cShift=(theta*RP1)%(PT);
  const segs=contactModel(cShift);
  const parr=[];
  for(const q of segs)parr.push(q[0],q[1],0.02,q[2],q[3],0.02);
  poaLines.geometry.setAttribute('position',new THREE.Float32BufferAttribute(parr,3));
  /* 波动统计:一个周节内累计 */
  const Lnow=totalLen(segs);
  if(Lnow<Lmin)Lmin=Lnow;if(Lnow>Lmax)Lmax=Lnow;
  LavgT+=Lnow;LavgN+=1;
  if(LavgN>=260){Lmin=1e9;Lmax=0;LavgT=0;LavgN=0;}
  /* 轴向力箭头 */
  const fa=faNow(),alen=0.15+fa/200*0.9,show=fa>2;
  arrowA.visible=show;arrowA.scale.set(alen,1,1);
  arrowA.position.set(1.9,CY,3);
  arrowB.visible=false;arrowC.visible=false;
  if(mode==='herring'&&show){
    arrowB.visible=true;arrowB.scale.set(alen*0.55,1,1);
    arrowB.position.set(1.9,CY,3);
    arrowC.visible=true;arrowC.scale.set(alen*0.55,1,1);
    arrowC.rotation.y=Math.PI;
    arrowC.position.set(-1.9,CY,3);
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(1);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
