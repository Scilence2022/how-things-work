<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c1411,26,74);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.6,4.4,12.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdff2ec,0x14211c,0.55));
const key=new THREE.DirectionalLight(0xeafff6,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x131b17,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(28,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 细胞质:半透明边界 + 细胞器 ---- */
const membM=new THREE.MeshPhysicalMaterial({color:0x63e6be,transparent:true,opacity:0.055,roughness:0.35,side:THREE.BackSide,depthWrite:false});
const memb=new THREE.Mesh(new THREE.SphereGeometry(13,48,32),membM);
memb.scale.set(1.4,0.85,1);memb.position.y=2.8;scene.add(memb);
const membIn=new THREE.Mesh(new THREE.SphereGeometry(12.8,48,32),
  new THREE.MeshPhysicalMaterial({color:0xa8f5df,transparent:true,opacity:0.03,roughness:0.5,depthWrite:false}));
membIn.scale.copy(memb.scale);membIn.position.copy(memb.position);scene.add(membIn);
function makeMito(x,y,z){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.5,6,14),
    new THREE.MeshStandardMaterial({color:0xb26438,roughness:0.55,emissive:0x2a1204,emissiveIntensity:0.6})));
  g.position.set(x,y,z);g.rotation.set(0.5,0.7,0.3);scene.add(g);return g;}
const mitoA=makeMito(4.6,5.6,-4.2),mitoB=makeMito(-8.4,2.6,4.8);
const NV=10;
const vesicles=new THREE.InstancedMesh(new THREE.SphereGeometry(0.2,12,10),
  new THREE.MeshStandardMaterial({color:0x48705f,roughness:0.4,transparent:true,opacity:0.85}),NV);
scene.add(vesicles);
const vesPh=[];for(let i=0;i<NV;i++)vesPh.push(Math.random()*20);

/* ---- 靶 mRNA:长单链珠串 ---- */
const mrnaCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-10.5,1.1,-1.6),new THREE.Vector3(-6.5,2.3,0.8),
  new THREE.Vector3(-2.2,1.2,-1.0),new THREE.Vector3(2.2,2.4,0.9),
  new THREE.Vector3(6.4,1.3,-0.8),new THREE.Vector3(10.5,2.2,1.4)]);
const NB=130;
const beads=new THREE.InstancedMesh(new THREE.SphereGeometry(0.105,10,8),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35}),NB);
scene.add(beads);
const TU0=0.555,TU1=0.665,TUC=(TU0+TU1)/2;
const beadU=new Float32Array(NB),beadOff=new Float32Array(NB*2),beadDir=new Float32Array(NB);
{
  const cBase=new THREE.Color(0x9db8c9),cTgt=new THREE.Color(0xffa94d),cEnd=new THREE.Color(0x76909f);
  for(let i=0;i<NB;i++){
    beadU[i]=i/(NB-1);
    beads.setColorAt(i,(beadU[i]>TU0&&beadU[i]<TU1)?cTgt:((beadU[i]<0.03||beadU[i]>0.97)?cEnd:cBase));
  }
  beads.instanceColor.needsUpdate=true;
}

/* ---- 核糖体(串珠)---- */
const NR=5;
const riboMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.3,14,12),
  new THREE.MeshStandardMaterial({color:0x5f8fd9,roughness:0.3,metalness:0.1,emissive:0x14243d,emissiveIntensity:0.7}),NR);
scene.add(riboMesh);
const ribo=[];for(let i=0;i<NR;i++)ribo.push({u:0.06+i*0.19,spd:0.011+Math.random()*0.007,fall:-1});

/* ---- Dicer 酶(大蛋白团块)---- */
const dicerG=new THREE.Group();dicerG.position.set(-6.8,3.4,-1.8);scene.add(dicerG);
const dicerGeo=(()=>{const g=new THREE.IcosahedronGeometry(1.05,1),p=g.attributes.position;
  for(let i=0;i<p.count;i++){const s=0.86+0.28*Math.abs(Math.sin(i*7.31));
    p.setXYZ(i,p.getX(i)*s,p.getY(i)*(0.8+0.4*Math.abs(Math.cos(i*5.13))),p.getZ(i)*s);}
  g.computeVertexNormals();return g;})();
const dicerM=new THREE.MeshStandardMaterial({color:0x37b24d,roughness:0.45,emissive:0x0c2e14,emissiveIntensity:0.8});
const dicer=new THREE.Mesh(dicerGeo,dicerM);dicerG.add(dicer);
const pawM=new THREE.MeshStandardMaterial({color:0x2f9e44,roughness:0.4});
const paw1=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.13,10,20,Math.PI),pawM);
paw1.position.set(0.72,0.42,0);paw1.rotation.y=Math.PI/2;dicerG.add(paw1);
const paw2=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.13,10,20,Math.PI),pawM);
paw2.position.set(0.72,-0.42,0.12);paw2.rotation.y=Math.PI/2;paw2.rotation.x=0.5;dicerG.add(paw2);

/* ---- 双链 RNA(双色双螺旋)与片段 ---- */
function helixGroup(len,r,cA,cB,turns){
  const g=new THREE.Group(),ptsA=[],ptsB=[];
  for(let i=0;i<=40;i++){const t=i/40,a=turns*Math.PI*2*t;
    ptsA.push(new THREE.Vector3(0,len*(t-0.5),Math.cos(a)*r));
    ptsB.push(new THREE.Vector3(0,len*(t-0.5),-Math.cos(a)*r));}
  const mk=(pts,c)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,0.07,8),
    new THREE.MeshStandardMaterial({color:c,roughness:0.3,emissive:c,emissiveIntensity:0.3,transparent:true,opacity:0.95}));
  const tA=mk(ptsA,cA),tB=mk(ptsB,cB);g.add(tA,tB);
  g.userData={tA,tB};return g;
}
const dsHome=new THREE.Vector3(-6.8,7.8,-1.8);
const dsDock=dicerG.position.clone().add(new THREE.Vector3(0.4,1.15,0));
const bigDS=helixGroup(3.4,0.3,0x63e6be,0xb197fc,2.2);
bigDS.position.copy(dsHome);bigDS.visible=false;scene.add(bigDS);
const asmP=new THREE.Vector3(-3.4,1.5,1.2);
const frags=[];
for(let i=0;i<3;i++){
  const g=helixGroup(1.15,0.17,0x63e6be,0xb197fc,1.3);g.visible=false;scene.add(g);
  frags.push({g,state:0,t:0,vel:new THREE.Vector3(),tgt:new THREE.Vector3(),
    pass:g.userData.tB,guide:g.userData.tA});
}

/* ---- RISC:Argonaute 月牙 + 向导链 ---- */
const guideGeo=new THREE.SphereGeometry(0.045,6,6);
function makeRISC(){
  const g=new THREE.Group();
  const moonM=new THREE.MeshStandardMaterial({color:0x3bc9db,roughness:0.35,metalness:0.15,emissive:0x0a3038,emissiveIntensity:0.9});
  const moon=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.17,10,26,Math.PI*1.4),moonM);
  moon.rotation.z=Math.PI*0.33;g.add(moon);
  const a1=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),moonM);a1.position.set(0.42,0.3,0.16);g.add(a1);
  const a2=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),moonM);a2.position.set(-0.42,0.38,-0.14);g.add(a2);
  const guide=new THREE.InstancedMesh(guideGeo,
    new THREE.MeshStandardMaterial({color:0x63e6be,emissive:0x63e6be,emissiveIntensity:0.9}),8);
  const gm4=new THREE.Matrix4();
  for(let i=0;i<8;i++){gm4.makeTranslation(0,-0.34+i*0.095,0.05);guide.setMatrixAt(i,gm4);}
  g.add(guide);g.visible=false;scene.add(g);
  return {g,u:0.1,dir:1,state:'pool',cool:0,boundT:0};
}
const RISCS=[];for(let i=0;i<6;i++)RISCS.push(makeRISC());

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let dose=3,mis=0,burst=false;
let armed=0,cutEvents=0,integrity=1,cutT=99,repress=0,dicerPulse=0;
let dsPhase='idle',dsT=2.0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('Dicer:把长 dsRNA 剪成 21 nt','Dicer: dices long dsRNA into 21-nt bits'),new THREE.Vector3(-4.9,5.0,-1.1),'g');/* 锚点右移,避免默认机位下被屏幕左缘截断 */
const riscLbl=addLabel(()=>L('RISC · 向导链','RISC · guide strand'),new THREE.Vector3(0,4,0),'b',()=>armed>0);
{
  const p=mrnaCurve.getPoint(TUC);
  addLabel(()=>L('靶 mRNA:种子完美配对处','Target mRNA: perfect seed pairing here'),new THREE.Vector3(p.x,p.y+1.15,p.z),'o');
}
addLabel(()=>L('核糖体:正沿信使读密码','Ribosomes: reading the message'),new THREE.Vector3(-5.2,3.3,-1.1),'b',
  ()=>document.getElementById('tglRibo').checked);

function setDose(v){dose=Math.round(v);document.getElementById('sDose').value=dose;
  document.getElementById('sDoseVal').textContent=dose;}
function setMis(v){mis=Math.round(v);document.getElementById('sMis').value=mis;
  document.getElementById('sMisVal').textContent=mis+' nt';}
function onBtn(id){['bSi','bMi','bVirus'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
function triggerDS(fast){
  dsPhase='descend';dsT=fast?2.6:0;bigDS.visible=true;
  bigDS.position.copy(dsHome);bigDS.rotation.set(0,0,0);
  bigDS.scale.setScalar(burst?1.3:1);
  bigDS.userData.tA.material.opacity=0.95;bigDS.userData.tB.material.opacity=0.95;
}
function armRISC(nearTarget){
  const r=RISCS.find(r=>r.state==='pool');if(!r)return;
  r.state='scan';r.cool=0;r.dir=Math.random()<0.5?-1:1;
  r.u=nearTarget?TUC-0.02-0.06*Math.random():(Math.random()<0.5?0.05+Math.random()*0.2:0.75+Math.random()*0.2);
  r.g.visible=true;
}
function cleaveAt(u0){
  cutEvents++;cutT=0;integrity=0.12;
  for(let i=0;i<NB;i++)beadDir[i]=beadU[i]<u0?-1:1;
  for(const rb of ribo)rb.fall=Math.max(rb.fall,0);
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'双链 RNA 出现:病毒或转座子的破绽',en:'Double-stranded RNA appears: a virus or transposon slipped up',
  act(){onBtn('bVirus');burst=true;setDose(2);setMis(0);triggerDS(false);}},
 {zh:'Dicer 把长双链剪成 21 nt 片段',en:'Dicer dices the long duplex into 21-nt fragments',
  act(){setDose(3);triggerDS(true);}},
 {zh:'装载 RISC:向导链留下、乘客链丢弃',en:'RISC loading: the guide strand stays, the passenger is discarded',
  act(){setDose(3);for(let k=0;k<3;k++)armRISC(false);}},
 {zh:'沿 mRNA 扫描找互补序列',en:'Scanning along the mRNA for a complementary site',
  act(){setDose(4);setMis(0);burst=false;onBtn('bSi');}},
 {zh:'完全互补:Argonaute 的 PIWI 剪切,信使报废',en:'Perfect complement: Argonaute\'s PIWI domain cuts — the message is wrecked',
  act(){setMis(0);setDose(4);burst=false;onBtn('bSi');armRISC(true);}},
 {zh:'部分互补:扣住翻译,基因被静音',en:'Partial complement: translation is pinned, the gene goes quiet',
  act(){setMis(2);setDose(2);burst=false;onBtn('bMi');armRISC(true);
    const r=RISCS.find(r=>r.state!=='pool');
    if(r){r.state='bound';r.boundT=8;r.u=TUC-0.015;r.g.visible=true;}}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const bound=RISCS.reduce((n,r)=>n+(r.state==='bound'?1:0),0);
  const tRepress=mis>0?Math.min(0.85,bound*0.3):0;
  repress+=(tRepress-repress)*0.5;
  const prod=100*integrity*(1-repress);
  document.getElementById('stMatch').innerHTML=(21-mis)+'<small> nt</small>';
  document.getElementById('stCut').textContent=cutEvents;
  document.getElementById('stRisc').textContent=armed;
  const p=document.getElementById('stProt');
  p.innerHTML=prod.toFixed(0)+'<small> %</small>';
  p.className='v '+(prod<35?'warn':prod>75?'ok':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSi').addEventListener('click',()=>{burst=false;setMis(0);setDose(4);onBtn('bSi');});
document.getElementById('bMi').addEventListener('click',()=>{burst=false;setMis(2);setDose(2);onBtn('bMi');});
document.getElementById('bVirus').addEventListener('click',()=>{burst=true;setMis(0);setDose(6);onBtn('bVirus');triggerDS(false);});
document.getElementById('sDose').addEventListener('input',e=>setDose(+e.target.value));
document.getElementById('sMis').addEventListener('input',e=>setMis(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglRibo').addEventListener('change',e=>{riboMesh.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0c1411:0xe7ede8);
  scene.fog.color.setHex(dark?0x0c1411:0xe7ede8);
  groundM.color.setHex(dark?0x131b17:0xc6cfc7);
  membM.color.setHex(dark?0x63e6be:0x0ca678);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpV=new THREE.Vector3(),tmpT=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 细胞器漂动 */
  memb.rotation.y+=dts*0.02;
  mitoA.rotation.y+=dts*0.12;mitoB.rotation.z+=dts*0.1;
  for(let i=0;i<NV;i++){const a=simT*0.25+vesPh[i];
    m4.makeScale(1,1,1);
    m4.setPosition(Math.cos(a)*(4+vesPh[i]%3),3.6+Math.sin(a*1.7)*1.4,Math.sin(a)*(3+vesPh[i]%2));
    vesicles.setMatrixAt(i,m4);}
  vesicles.instanceMatrix.needsUpdate=true;
  /* RISC 数量随剂量 */
  armed=RISCS.reduce((n,r)=>n+(r.state!=='pool'?1:0),0);
  for(const r of RISCS){if(r.state!=='pool'&&armed>dose){r.state='pool';r.g.visible=false;armed--;}}
  /* dsRNA → Dicer → 片段 → 装载 */
  if(dsPhase==='idle'){dsT-=dts;if(dsT<=0)triggerDS(false);}
  else if(dsPhase==='descend'){
    dsT+=dts;const dur=burst?1.6:3.0,p=clamp(dsT/dur,0,1),e=p*p*(3-2*p);
    bigDS.position.lerpVectors(dsHome,dsDock,e);
    bigDS.rotation.y+=dts*1.4;
    if(p>=1){dsPhase='cutting';dsT=0;}
  }else if(dsPhase==='cutting'){
    dsT+=dts;dicerPulse=1;
    bigDS.scale.setScalar(Math.max(0.001,(burst?1.3:1)*(1-dsT*1.5)));
    if(dsT>0.66){bigDS.visible=false;dsPhase='frag';
      for(const f of frags){f.state=1;f.t=0;f.g.visible=true;
        f.g.position.copy(dsDock).add(tmpV.set((Math.random()-0.5)*0.9,0.4,(Math.random()-0.5)*0.9));
        f.vel.set((Math.random()-0.5)*1.5,-0.4,(Math.random()-0.5)*1.5);
        f.tgt.copy(asmP).add(tmpV.set((Math.random()-0.5)*1.3,0,(Math.random()-0.5)*1.3));
        f.pass.position.set(0,0,0);f.pass.material.opacity=0.95;}}
  }
  for(const f of frags){
    if(f.state===1){f.t+=dts;f.vel.y-=2.4*dts;f.g.position.addScaledVector(f.vel,dts);f.g.rotation.x+=dts*0.8;
      if(f.t>0.55)f.state=2;}
    else if(f.state===2){f.g.position.lerp(f.tgt,Math.min(1,dts*3));f.g.rotation.x*=0.92;
      if(f.g.position.distanceTo(f.tgt)<0.12){f.state=3;f.t=0;}}
    else if(f.state===3){f.t+=dts;const k=clamp(f.t/1.7,0,1);
      f.pass.position.x+=dts*0.75;f.pass.position.y+=dts*0.45;f.pass.rotation.z+=dts*0.6;
      f.pass.material.opacity=0.95*(1-k);
      f.guide.material.emissiveIntensity=0.3+1.2*(1-k);
      if(k>=1){f.g.visible=false;f.state=0;if(armed<dose)armRISC(false);}}
  }
  /* RISC 扫描与作用 */
  for(const r of RISCS){
    if(r.state==='pool')continue;
    if(r.state==='scan'){
      r.cool=Math.max(0,r.cool-dts);
      const spd=(mis>0&&Math.abs(r.u-TUC)<0.07)?0.012:0.05;
      r.u+=r.dir*spd*dts;
      if(r.u>0.95){r.u=0.95;r.dir=-1;}if(r.u<0.05){r.u=0.05;r.dir=1;}
      if(r.cool<=0&&Math.abs(r.u-TUC)<0.012){
        if(mis===0){cleaveAt(r.u);r.cool=3;r.dir=Math.random()<0.5?-1:1;r.u+=r.dir*0.05;}
        else{r.state='bound';r.boundT=6.5;}
      }
    }else if(r.state==='bound'){r.boundT-=dts;
      if(r.boundT<=0){r.state='scan';r.cool=2;r.dir=Math.random()<0.5?-1:1;}}
    mrnaCurve.getPoint(r.u,tmpV);mrnaCurve.getTangent(r.u,tmpT);
    r.g.position.set(tmpV.x,tmpV.y+0.4,tmpV.z);
    r.g.position.y+=Math.sin(simT*2+r.u*40)*0.03;
    r.g.rotation.set(0,Math.atan2(tmpT.x,tmpT.z)+Math.PI/2,0);
  }
  /* mRNA 珠串:剪切漂移与再生 */
  if(cutT<99){
    cutT+=dts;
    if(cutT<2.1){for(let i=0;i<NB;i++){beadOff[i*2]+=beadDir[i]*dts*0.85;beadOff[i*2+1]-=dts*0.3;}integrity=0.12;}
    else{const dk=Math.min(1,dts*1.8);
      for(let i=0;i<NB;i++){beadOff[i*2]*=1-dk;beadOff[i*2+1]*=1-dk;}
      integrity=Math.min(1,integrity+dts*0.55);
      if(cutT>4.6){cutT=99;for(let i=0;i<NB;i++){beadOff[i*2]=0;beadOff[i*2+1]=0;}}}
  }
  for(let i=0;i<NB;i++){
    mrnaCurve.getPoint(beadU[i],tmpV);
    const sc=(beadU[i]>TU0&&beadU[i]<TU1)?1+0.22*Math.sin(simT*4+i*0.4):1;
    m4.makeScale(sc,sc,sc);
    m4.setPosition(tmpV.x+beadOff[i*2],tmpV.y+beadOff[i*2+1],tmpV.z);
    beads.setMatrixAt(i,m4);
  }
  beads.instanceMatrix.needsUpdate=true;
  /* 核糖体:滑动、被扣、脱落 */
  if(riboMesh.visible){
    let n=0;
    for(const rb of ribo){
      if(rb.fall>=0){rb.fall+=dts;if(rb.fall>1.3){rb.fall=-1;rb.u=Math.random()*0.45;}}
      else{
        let blocked=false;
        if(mis>0)for(const r of RISCS)if(r.state==='bound'&&rb.u<r.u&&r.u-rb.u<0.075){blocked=true;break;}
        if(!blocked)rb.u+=rb.spd*dts;
        if(rb.u>0.985)rb.u=0.02;
      }
      mrnaCurve.getPoint(rb.u,tmpV);
      m4.makeScale(1,1,1);
      m4.setPosition(tmpV.x,tmpV.y+(rb.fall>=0?0.16-rb.fall*rb.fall*1.3:0.16),tmpV.z);
      riboMesh.setMatrixAt(n++,m4);
    }
    riboMesh.instanceMatrix.needsUpdate=true;
  }
  /* Dicer 待机浮动 + 剪切脉冲 */
  dicerPulse=Math.max(0,dicerPulse-dts*1.6);
  dicerG.position.y=3.4+Math.sin(simT*1.3)*0.09;
  dicer.scale.setScalar(1+dicerPulse*0.25);
  dicerG.rotation.y+=dts*0.15;
  /* RISC 标签跟随 */
  const first=RISCS.find(r=>r.state!=='pool');
  if(first)riscLbl.position.set(first.g.position.x,first.g.position.y+0.85,first.g.position.z);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
applyTheme();buildSteps();
setDose(3);setMis(0);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
