<style>

<div id="app"></div>

<div id="title">
  <h1 data-zh="八音盒 · 一个滚筒怎么播放一支曲子" data-en="The Music Box · How a Cylinder Plays a Tune">八音盒 · 一个滚筒怎么播放一支曲子</h1>
  <div class="sub" data-zh="滚筒上的音钉就是写死的乐谱:滚筒匀速转,音钉按谱面位置拨动音梳;每根梳齿是一根悬臂梁,固有频率 f ∝ (t/L²)·√(E/ρ)——齿越短音越高;拨动后自由振动按 e^(−t/τ) 衰减,τ=Q/(πf) 定音色;转速只改节拍,永远改不了音高;风翼调速器靠空气阻力把发条的大劲捋成恒速 · 拖动旋转 / 空格运行/暂停 / 点梳齿试音" data-en="The pins on the cylinder are the score, hardcoded in brass: as the cylinder turns at constant speed each pin plucks its comb tooth; every tooth is a cantilever beam with natural frequency f ∝ (t/L²)·√(E/ρ) — shorter tooth, higher note; after the pluck the free vibration decays like e^(−t/τ) with τ=Q/(πf) set by damping; speed changes the tempo, never the pitch; the air-governor turns the mainspring's surge into a steady crawl · drag to orbit / Space = run/pause / click a tooth to sound it">滚筒上的音钉就是写死的乐谱:滚筒匀速转,音钉按谱面位置拨动音梳;每根梳齿是一根悬臂梁,固有频率 f ∝ (t/L²)·√(E/ρ)——齿越短音越高;拨动后自由振动按 e^(−t/τ) 衰减,τ=Q/(πf) 定音色;转速只改节拍,永远改不了音高;风翼调速器靠空气阻力把发条的大劲捋成恒速 · 拖动旋转 / 空格运行/暂停 / 点梳齿试音</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const speedMul=clamp(qsFloat('speed',1),0.3,2.5);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,55);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,120);
camera.position.set(3.6,2.9,6.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=1.2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const woodM=new THREE.MeshStandardMaterial({color:0x7a4a22,roughness:0.65});
const woodDkM=new THREE.MeshStandardMaterial({color:0x4c2c12,roughness:0.7});
const brassM=new THREE.MeshStandardMaterial({color:0xd4a94e,roughness:0.32,metalness:0.85});
const steelM=new THREE.MeshStandardMaterial({color:0xb8c4d0,roughness:0.3,metalness:0.9});
const darkM=new THREE.MeshStandardMaterial({color:0x2b3036,roughness:0.6,metalness:0.4});

/* ---- 底座与机芯 ---- */
const ground=new THREE.Mesh(new THREE.CylinderGeometry(12,12,0.3,48),groundM);
ground.position.y=-0.15;scene.add(ground);
const boxBase=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.9,2.0),woodM);
boxBase.position.y=0.45;scene.add(boxBase);
const boxLip=new THREE.Mesh(new THREE.BoxGeometry(3.72,0.12,2.12),woodDkM);
boxLip.position.y=0.94;scene.add(boxLip);
const plate=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.1,1.6),brassM);
plate.position.y=1.05;scene.add(plate);
/* 发条盒(装饰) */
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.24,26),brassM);
barrel.rotation.z=Math.PI/2;barrel.position.set(-1.35,1.35,0);scene.add(barrel);
const arbor=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.4,10),steelM);
arbor.rotation.z=Math.PI/2;arbor.position.set(-1.35,1.35,0);scene.add(arbor);

/* ---- 音梳:15 根悬臂梁,C4..C6 ---- */
/* f = 0.1615·(t/L²)·√(E/ρ),钢 √(E/ρ)=5048 m/s,t=0.4 mm ⇒ L=√(0.326/f) */
const NOTES=[['C4',261.63],['D4',293.66],['E4',329.63],['F4',349.23],['G4',392.00],
  ['A4',440.00],['B4',493.88],['C5',523.25],['D5',587.33],['E5',659.25],
  ['F5',698.46],['G5',783.99],['A5',880.00],['B5',987.77],['C6',1046.50]];
const tThk=0.0004, KASE=0.1615*Math.sqrt(200e9/7850)*tThk; /* =0.326 m³/s²·… */
const toothLenMm=f=>Math.sqrt(KASE/f)*1000;
const combG=new THREE.Group();combG.position.set(0,1.52,0.1);scene.add(combG);
const combBase=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.09,0.14),steelM);
combBase.position.set(0,0.045,0);combG.add(combBase);
const teeth=[];
for(let i=0;i<15;i++){
  const f=NOTES[i][1], Lmm=toothLenMm(f);
  const Lw=0.10+(Lmm-17.6)*0.011;
  const mat=new THREE.MeshStandardMaterial({color:0xb8c4d0,roughness:0.28,metalness:0.9,
    emissive:0xe8b96a,emissiveIntensity:0});
  const root=new THREE.Group();root.position.set(-0.72+i*0.103,0.09,0);combG.add(root);
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.075,Lw,0.035),mat);
  m.geometry.translate(0,Lw/2,0);
  m.userData.idx=i;
  root.add(m);
  teeth.push({mesh:m,root,f,Lmm,A:0,t0:-99,bend:0});
}
/* 点齿试音:射线拾取 */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',ev=>{
  ptr.x=ev.clientX/innerWidth*2-1;ptr.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(teeth.map(t=>t.mesh));

/* ---- 音乐推进 ---- */
function updateMusic(dt){
  const w=omegaAct();
  /* 慢放:任一音钉处于接触窗内 → 时间 ×0.07 */
  let contact=false;
  for(const p of pins){
    const rel=((Theta+p.phi)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    if(rel>2*Math.PI-WIN){contact=true;break;}
  }
  const k=(slowOn&&contact)?0.07:1;
  const dts=dt*k;
  mt+=dts;
  Theta+=w*dts;
  cylG.rotation.x=Theta;
  beatPos=Theta/(2*Math.PI)*BEATS_PER_REV;
  /* 音钉拨齿检测 + 接触压弯 */
  const inC=new Set();
  for(const p of pins){
    const rel=((Theta+p.phi)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    if(p.prev>2*Math.PI-WIN*2&&rel<p.prev&&rel<0.5){
      excite(p.tooth);
      const b2=Math.round(beatPos);
      if(b2>=0&&b2<song.beats)lit[b2]=mt;
    }
    if(rel>2*Math.PI-WIN){
      inC.add(p.tooth);
      const t=teeth[p.tooth];
      t.bend=Math.max(t.bend,(rel-(2*Math.PI-WIN))/WIN);
    }
    p.prev=rel;
  }
  /* 齿振动渲染:接触期压弯,释放后自由振动 e^(-t/τ) */
  for(let i=0;i<15;i++){
    const t=teeth[i];
    let rot=0,glow=0;
    if(inC.has(i)&&t.bend>0){
      rot=-0.42*t.bend;glow=0.7*t.bend;
    }else{
      if(t.bend>0)t.bend=Math.max(0,t.bend-dts*8);
      const dtp=mt-t.t0,tau=Qf/(Math.PI*t.f);
      if(t.A>0&&dtp<6*tau){
        const env=t.A*Math.exp(-dtp/tau);
        rot=-env*Math.sin(2*Math.PI*t.f*dtp)*0.30;
        glow=env;
      }else t.A=0;
    }
    t.root.rotation.z=rot;
    t.mesh.material.emissiveIntensity=glow*(tglVibEl.checked?2.4:0.35);
  }
  /* 振动微尘粒子:振幅最大的齿上方 */
  let hi=0,ha=-1;
  for(let i=0;i<15;i++){
    const t=teeth[i];const e=t.A*Math.exp(-(mt-t.t0)/(Qf/(Math.PI*t.f)));
    if(e>ha){ha=e;hi=i;}
  }
  const tk=teeth[hi],tipX=tk.root.position.x,tipY=1.52+0.09+0.10+(tk.Lmm-17.6)*0.011;
  for(let i=0;i<NP;i++){
    if(ha>0.02){
      const ph=(mt*3+i/NP*2*Math.PI)%(2*Math.PI);
      dummy.position.set(tipX+Math.sin(ph)*0.05,tipY+0.03+((mt*0.6+i/NP)%1)*0.1,0.1);
      dummy.scale.setScalar(0.5+ha*0.8);
    }else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();puff.setMatrixAt(i,dummy.matrix);
  }
  puff.instanceMatrix.needsUpdate=true;
  /* 调速器 */
  govW+=w*2.2*dts;
  wingG.rotation.y=govW;
  const spread=clamp(w/4,0.15,0.85);
  for(const fb of fballs){
    fb.arm.position.x=fb.s*(0.13+0.10*spread);
    fb.b.position.set(fb.s*(0.26+0.20*spread),0.02,0);
  }
  return k;
}

const clock=new THREE.Clock();
let raf=null,acc=0,accP=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  const dt=dt0*speedMul*(playing?1:0);
  if(notifyT>0)notifyT-=dt0;
  updateMusic(dt);
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.6);
    const ee=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,ee);
    controls.target.lerpVectors(camTween.t0,camTween.t1,ee);
    if(camTween.k>=1)camTween=null;
  }
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  accP+=dt0;if(accP>0.12){accP=0;drawPlot();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();applyLang();
setRpm(15);setQ(800);setSong(SONGS.twinkle);
const t0=Math.round(qsFloat('t',0));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
syncPlayBtn();updateStats();drawPlot();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
