<style>

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}

  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);

  :root[data-theme="light"] .abtn.on{border-color:rgba(217,72,15,.55);background:rgba(217,72,15,.10)}

    border:1px solid transparent;align-items:flex-start}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}

    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }

  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }

  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}

</style>

  <div class="sub" data-zh="火星地表气压 6.4 hPa≈地球的 0.6%:液态水几 °C 就沸、体液近沸点但不爆→大气太薄,降落伞不够用:毅力号靠天空起重机在 20 m 悬停吊放→没有全球磁场,太阳风几十亿年剥蚀大气→全球尘暴自我放大:扬尘吸光→大气升温→气压梯度→强风→扬更多尘,数周裹住整颗星球(2018 Curiosity 亲历)→尘卷风是局地小型版 · 拖动旋转 / 空格运行/暂停" data-en="Surface pressure on Mars is 6.4 hPa — 0.6% of Earth's: water boils at a few °C and body fluids sit near boiling (no explosion, though) → air too thin for parachutes alone: Perseverance was lowered by a sky crane hovering at 20 m → no global magnetic field, so the solar wind has been stripping the air for eons → global dust storms self-amplify: dust absorbs sunlight → atmosphere heats → pressure gradients → wind lifts more dust, wrapping the planet in weeks (Curiosity lived through 2018) → dust devils are the small local version · drag to orbit / Space = run/pause">火星地表气压 6.4 hPa≈地球的 0.6%:液态水几 °C 就沸、体液近沸点但不爆→大气太薄,降落伞不够用:毅力号靠天空起重机在 20 m 悬停吊放→没有全球磁场,太阳风几十亿年剥蚀大气→全球尘暴自我放大:扬尘吸光→大气升温→气压梯度→强风→扬更多尘,数周裹住整颗星球(2018 Curiosity 亲历)→尘卷风是局地小型版 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const D2R=Math.PI/180;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,600);
camera.position.set(16.5,10,21);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=8;controls.maxDistance=90;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x241812,0.55));
const key=new THREE.DirectionalLight(0xfff0d8,1.15);key.position.set(-40,18,12);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.22);fill.position.set(20,8,14);scene.add(fill);

/* ── 状态 ── */
let mode='chute',tau=0.3,tauSlider=0.3,I=589,playing=true,labelsOn=true,slowMo=false,spinOn=true;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const R=6;                                    /* 火星半径,场景单位 */
function boilT(p){const x=Math.log(p/6.112);return 237.3*x/(17.62-x);} /* Magnus 反演,°C */

/* ── 星空 ── */
const NS=800;
const starM=new THREE.MeshBasicMaterial({color:0xffffff});
const stars=new THREE.InstancedMesh(new THREE.SphereGeometry(1,4,3),starM,NS);
{
  const m=new THREE.Matrix4(),q=new THREE.Quaternion();
  for(let i=0;i<NS;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=150+Math.random()*150;
    m.compose(new THREE.Vector3(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)),
      q,new THREE.Vector3().setScalar(0.14+Math.random()*0.3));
    stars.setMatrixAt(i,m);
  }
  stars.instanceMatrix.needsUpdate=true;
}
scene.add(stars);

/* ── 太阳 ── */
const sunCv=document.createElement('canvas');sunCv.width=sunCv.height=128;
{
  const g=sunCv.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,252,235,1)');gr.addColorStop(.25,'rgba(255,225,150,.8)');gr.addColorStop(1,'rgba(255,180,80,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
}
const sunSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sunCv),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
sunSpr.position.set(-52,14,10);scene.add(sunSpr);

/* ── 火星本体:顶点着色(斑纹+暗区+极冠) ── */
const marsGeo=new THREE.SphereGeometry(R,72,48);
{
  const p=marsGeo.attributes.position;
  const col=new Float32Array(p.count*3);
  const cA=new THREE.Color(0xa84f28),cB=new THREE.Color(0xc77a45),cD=new THREE.Color(0x6e3520),cCap=new THREE.Color(0xe8e4da);
  const tmp=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    let n=Math.sin(4.1*x/R+1.3)*Math.sin(3.7*y/R+2.1)*Math.sin(4.3*z/R+0.7)+0.25*Math.sin(9*x/R+z/R);
    n=clamp(n*0.6+0.5,0,1);
    tmp.copy(cA).lerp(cB,n);
    if(n<0.28)tmp.lerp(cD,smooth((0.28-n)/0.28)*0.8);
    const ny=Math.abs(y)/R;
    if(ny>0.86)tmp.lerp(cCap,smooth((ny-0.86)/0.07));
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  marsGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
}
const marsM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0});
const mars=new THREE.Mesh(marsGeo,marsM);scene.add(mars);

/* ── 大气/尘霾壳:颜色随 τ 从淡蓝到土黄 ── */
const atmM=new THREE.MeshStandardMaterial({color:0x8fb6d9,transparent:true,opacity:0.16,
  roughness:1,depthWrite:false});
const atm=new THREE.Mesh(new THREE.SphereGeometry(R*1.065,48,32),atmM);scene.add(atm);
const hazeM=new THREE.MeshBasicMaterial({color:0x8fb6d9,transparent:true,opacity:0.08,
  side:THREE.BackSide,depthWrite:false});
const haze=new THREE.Mesh(new THREE.SphereGeometry(R*1.16,48,32),hazeM);scene.add(haze);

/* ── 悬浮尘粒:壳层分布,密度/范围随 τ ── */
const DN=460;
const dustM=new THREE.MeshBasicMaterial({color:0xc9985a,transparent:true,opacity:0.18,depthWrite:false});
const dust=new THREE.InstancedMesh(new THREE.SphereGeometry(1,5,4),dustM,DN);
dust.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(dust);
const dPts=[];
for(let i=0;i<DN;i++){
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  dPts.push({th,ph,f:Math.pow(Math.random(),1.4),w:Math.random()*Math.PI*2});
}
const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_v=new THREE.Vector3(),_s=new THREE.Vector3();
function updateDust(dts){
  const dn=clamp((tau-0.1)/7.9,0,1);
  dustM.opacity=0.10+0.42*dn;
  dust.visible=dn>0.01;
  const rIn=R+0.06,rOut=R+0.10+0.42*dn;
  for(let i=0;i<DN;i++){
    const d=dPts[i];

  const ring=new THREE.Mesh(new THREE.RingGeometry(0.14,0.24,20),

      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));

let flashIdx=0;
function boomAt(pWorld,normal){
  const f=flashPool[flashIdx++%FN];
  f.m.position.copy(pWorld.clone().addScaledVector(normal,0.05));
  f.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),normal);

function updateWind(dts){
  wind.visible=(mode==='wind');esc.visible=(mode==='wind');
  if(mode!=='wind')return;
  for(let i=0;i<WN;i++){
    const w=wPts[i];
    w.x+=w.v*dts;
    const rr=Math.hypot(w.x,w.y,w.z);
    if(rr<R+0.18){
      const n=new THREE.Vector3(w.x,w.y,w.z).normalize();
      boomAt(n.multiplyScalar(R+0.05),n);
      w.x=-42;w.y=(Math.random()-0.5)*13;w.z=(Math.random()-0.5)*13;
    }else if(w.x>46){w.x=-42;w.y=(Math.random()-0.5)*13;w.z=(Math.random()-0.5)*13;}
    _m4.compose(_v.set(w.x,w.y,w.z),_q,_s.setScalar(1));
    wind.setMatrixAt(i,_m4);
  }
  wind.instanceMatrix.needsUpdate=true;
  for(let i=0;i<EN;i++){
    const e=ePts[i];
    e.t+=dts;e.life-=dts;
    if(e.life<=0){spawnEsc(e);e.t=0;}
    _v.copy(e.dir).multiplyScalar(R+0.15).addScaledVector(e.dir,e.t*e.v);
    _v.x+=e.t*e.v*1.4;
    _m4.compose(_v,_q,_s.setScalar(0.6+0.4*Math.min(1,e.t)));
    esc.setMatrixAt(i,_m4);
  }
  esc.instanceMatrix.needsUpdate=true;
  for(const f of flashPool){
    f.t=Math.max(0,f.t-dts*2.4);
    f.m.material.opacity=f.t*0.85;
    f.m.scale.setScalar(1+2.2*(1-f.t));
  }
}

function poseChute(c){
  const alt=Math.max(0.04,(10-c)*0.78);
  const sway=Math.sin(c*1.05)*0.22*clamp(alt/6,0,1);
  chuteG.visible=true;
  backshell.position.set(sway,alt+0.42,0);
  shield.position.set(sway,alt-0.04,0);
  canopy.position.set(sway*1.45,alt+1.8,0);
  canopy.rotation.z=sway*0.35;
  const lp=lineGeo.attributes.position;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const rim=new THREE.Vector3(
      canopy.position.x+1.0*Math.cos(a)*canopy.scale.x*0.98,
      canopy.position.y+0.12,
      1.0*Math.sin(a)*canopy.scale.x*0.98);
    lp.setXYZ(i*2,rim.x,rim.y,rim.z);
    lp.setXYZ(i*2+1,backshell.position.x,backshell.position.y+0.28,backshell.position.z);
  }
  lp.needsUpdate=true;
}
function poseCrane(c){
  let thrust=0,y=1.35,rx=0,roverY=0.05,cables=true;
  if(c<3){y=3.5-(c/3)*2.15;thrust=1;roverY=Math.max(0.05,y-0.62);}
  else if(c<8){y=1.35;thrust=0.85;roverY=0.75-((c-3)/5)*0.70;}
  else if(c<9){y=1.35;thrust=0.8;roverY=0.05;}
  else if(c<12){const f=c-9;y=1.35+f*1.35;rx=-f*1.9;thrust=1;cables=false;}
  else{cables=false;thrust=0;y=99;rx=-6;}
  craneG.visible=c<12;
  craneG.position.set(rx,y,0);
  craneG.rotation.z=clamp(-rx*0.06,-0.3,0.1);
  roverG.visible=c<12||true;
  roverG.position.set(0,roverY,0);
  plumes.forEach(p=>{p.material.opacity=thrust*(0.55+0.3*Math.sin(simT*23+p.position.x*9));});
  bridle.visible=cables;
  if(cables){
    const bp=brGeo.attributes.position;
    bp.setXYZ(0,rx-0.45,y-0.22,0);bp.setXYZ(1,0,roverY+0.40,0);
    bp.setXYZ(2,rx+0.45,y-0.22,0);bp.setXYZ(3,0,roverY+0.40,0);
    bp.setXYZ(4,rx,y-0.24,0);bp.setXYZ(5,0,roverY+0.40,0);
    bp.needsUpdate=true;
  }
}

/* ── 主循环 ── */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 尘量:尘暴模式自催化增长,其余跟随滑杆 */
  if(mode==='storm'&&dts>0){
    tau=clamp(tau+(0.12*I/589)*tau*(1-tau/8)*dts,0.1,8);
    document.getElementById('sTau').value=tau;
    document.getElementById('sTauVal').textContent='τ='+tau.toFixed(1);
  }else tau=tauSlider;
  /* 星球自转(尘暴/剥离模式) */
  if(spinOn&&dts>0)mars.rotation.y+=dts*0.02;
  updateDust(dts);
  updateWind(dts);
  updateArrows();
  /* EDL 位姿 */
  if(mode==='chute'){craneG.visible=false;roverG.visible=false;bridle.visible=false;poseChute(simT%10);}
  if(mode==='crane'){chuteG.visible=false;poseCrane(simT%13);}
  /* 相机目标平滑切换 */
  const wantT=(mode==='chute'||mode==='crane')
    ?new THREE.Vector3(0,4.6,7.2):new THREE.Vector3(0,0,0);
  controls.target.lerp(wantT,0.045);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setTau(0.3);setSun(589);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
