<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>烟囱效应与浮力通风 · Δp≈ρ₀gH·ΔT/T</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e03131;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b02525;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(224,49,49,.6);background:rgba(224,49,49,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,37,37,.55);background:rgba(176,37,37,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(224,49,49,.10);border-color:rgba(224,49,49,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,37,37,.08);border-color:rgba(176,37,37,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc9c9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="烟囱效应与浮力通风" data-en="Stack Effect &amp; Buoyancy Ventilation">烟囱效应与浮力通风</h1>
  <div class="sub" data-zh="内外温差造成空气密度差,竖井两端产生压差 Δp≈ρ₀gH·ΔT/T;中性面以下进风、以上排风,楼越高、温差越大拔力越强;冬天高层建筑的电梯井就是整栋楼的大烟囱——底层门被压差顶住、顶层排热,火灾时烟气沿竖井数秒窜上楼层,夏季或空调冷楼里方向反转、反而从顶层吸热风 · 拖动旋转 / 空格运行/暂停" data-en="A temperature difference makes a density difference, and the shaft ends up with a pressure head Δp≈ρ₀gH·ΔT/T; below the neutral plane air flows in, above it flows out — the taller the building and the bigger ΔT, the stronger the draw; in winter a high-rise lift shaft is the tower's chimney — ground doors jam, heat vents at the top; in a fire smoke climbs the shaft in seconds, and in summer or an air-conditioned chill the flow reverses, sucking hot air in at the top · drag to orbit / Space = run/pause">内外温差造成空气密度差,竖井两端产生压差 Δp≈ρ₀gH·ΔT/T;中性面以下进风、以上排风,楼越高、温差越大拔力越强;冬天高层建筑的电梯井就是整栋楼的大烟囱——底层门被压差顶住、顶层排热,火灾时烟气沿竖井数秒窜上楼层,夏季或空调冷楼里方向反转、反而从顶层吸热风 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,70);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(7,11,9);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-9,6,-7);scene.add(fill);

/* 比例:1 单位 = 3 m */
const RHO=1.2,G=9.81,TK=288.0;
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ── 建筑剖面:10 层 + 中央竖井(可随 H 重建) ── */
const bld=new THREE.Group();scene.add(bld);
const slabM=new THREE.MeshStandardMaterial({color:0x525a68,roughness:0.85});
const wallM=new THREE.MeshStandardMaterial({color:0x7a8494,roughness:0.7,transparent:true,opacity:0.55});
const shaftM=new THREE.MeshStandardMaterial({color:0x8d7a5a,roughness:0.75,transparent:true,opacity:0.5});
const winM=new THREE.MeshStandardMaterial({color:0xffd8a8,emissive:0xffb35c,emissiveIntensity:0.7});
let Hm=30,su=1.0,HU=10;
const roomMatL=[],roomMatR=[];
for(let i=0;i<10;i++){
  roomMatL.push(new THREE.MeshStandardMaterial({color:0x8a5a4a,transparent:true,opacity:0.3,depthWrite:false}));
  roomMatR.push(new THREE.MeshStandardMaterial({color:0x8a5a4a,transparent:true,opacity:0.3,depthWrite:false}));
}
function box(w,h,d,mat,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);parent.add(m);return m;
}
function rebuildBld(){
  while(bld.children.length){
    const c=bld.children.pop();
    c.geometry.dispose();
    bld.remove(c);
  }
  Hm=clamp(Hm,15,40);HU=Hm/3;su=HU/10;
  box(8.6,0.12,4.8,slabM,0,-0.06,0,bld);
  for(let i=0;i<10;i++){
    box(7.6,0.08,4.4,slabM,0,i*su,0,bld);
    /* 房间温度色场 */
    box(3.0,su-0.14,4.3,roomMatL[i],-2.25,i*su+(su-0.14)/2+0.07,0,bld);
    box(3.0,su-0.14,4.3,roomMatR[i],2.25,i*su+(su-0.14)/2+0.07,0,bld);
    /* 竖井壁(每层留通道口) */
    for(const sx of [-0.7,0.7])for(const sz of [-1.4,1.4])
      box(0.05,su-0.1,1.5,shaftM,sx,i*su+(su-0.1)/2+0.05,sz,bld);
    /* 左外墙:0~4 层有门洞 */
    if(i<5){
      for(const sz of [-1.4,1.4])
        box(0.06,su-0.1,1.5,wallM,-3.8,i*su+(su-0.1)/2+0.05,sz,bld);
    }else{
      box(0.06,su-0.1,4.4,wallM,-3.8,i*su+(su-0.1)/2+0.05,0,bld);
    }
    /* 右外墙 + 窗 */
    box(0.06,su-0.1,4.4,wallM,3.8,i*su+(su-0.1)/2+0.05,0,bld);
    box(0.04,0.55,1.3,winM,3.84,i*su+su*0.55,0.9,bld);
  }
  box(3.1,0.08,4.4,slabM,-2.25,HU,0,bld);
  box(3.1,0.08,4.4,slabM,2.25,HU,0,bld);
}
rebuildBld();
/* 状态与物理 */
let mode='winter',dT=25,Ab=1.0,profOn=false;
let playing=true,labelsOn=true,slowMo=false;
let simT=0,fireT0=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function npHeight(){const f=1/(Ab*Ab+1);return Hm*f;}
function dP(hM){return RHO*G*(npHeight()-hM)*dT/TK;}
function dPtop(){return RHO*G*(Hm-npHeight())*dT/TK;}
function dPbot(){return RHO*G*npHeight()*dT/TK;}
function vTop(){return Math.sqrt(2*Math.max(0,dPtop())/RHO);}
function flowQ(){return 3600*0.62*Ab*Math.sqrt(2*Math.max(0,dPbot())/RHO);}
function tSmoke(){return Hm/Math.max(0.5,vTop());}
/* 中性面标线 */
const npLine=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.3,0,0),new THREE.Vector3(4.3,0,0)]),
  new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.28,gapSize:0.18,transparent:true,opacity:0.9}));
npLine.computeLineDistances();scene.add(npLine);
/* 压差剖面组 */
const profG=new THREE.Group();profG.visible=false;scene.add(profG);
const profAxisM=new THREE.LineBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.5});
const profCurveM=new THREE.LineBasicMaterial({color:0xff8787});
let profCurve=null;
function updProfile(){
  while(profG.children.length){const c=profG.children.pop();c.geometry.dispose();profG.remove(c);}
  const axX=-6.4,npM=npHeight(),npU=npM/3;
  profG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(axX,0,0),new THREE.Vector3(axX,HU,0)]),profAxisM));
  profG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(axX-0.12,npU,0),new THREE.Vector3(axX+0.12,npU,0)]),profAxisM));
  const pts=[];
  for(let k=0;k<=24;k++){
    const hM=k/24*Hm;
    const dp=dP(hM);
    pts.push(new THREE.Vector3(axX+dp*0.085,hM/3,0));
  }
  if(profCurve)profCurve.geometry.dispose();
  profCurve=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),profCurveM);
  profG.add(profCurve);
}

/* 气流粒子:冬季下进上出 / 夏季反转 */
const NP=240;
const pM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,
  emissive:0xffffff,emissiveIntensity:0.25});
const parts=new THREE.InstancedMesh(new THREE.SphereGeometry(0.085,8,8),pM,NP);
parts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(parts);
const pp=[];
for(let i=0;i<NP;i++)pp.push({ph:Math.random(),lane:i%6,sp:0.8+Math.random()*0.5,
  x:0,y:0,z:0,stage:0,lf:0,t:0,zd:0});
let lanes=[];
function segLen(pts){
  const cum=[0];let L0=0;
  for(let i=1;i<pts.length;i++){L0+=pts[i].distanceTo(pts[i-1]);cum.push(L0);}
  return cum;
}
function buildPaths(){
  lanes=[];
  const npM=npHeight();
  const doorFl=[];
  for(let i=0;i<5;i++){if((i+0.5)*su*3<npM-0.3)doorFl.push(i);}
  if(!doorFl.length)doorFl.push(0);
  for(let j=0;j<6;j++){
    const fi=doorFl[Math.min(doorFl.length-1,Math.floor(j*doorFl.length/6))];
    const yd=(fi+0.5)*su,zj=(j/5-0.5)*3.4;
    let pts;
    if(mode==='summer'){
      pts=[new THREE.Vector3(6.2,HU+1.7,zj),
        new THREE.Vector3(1.4,HU+0.9,zj*0.4),
        new THREE.Vector3(0,HU+0.4,zj*0.2),
        new THREE.Vector3(0,yd+0.1,zj*0.3),
        new THREE.Vector3(-2.25,yd+0.05,zj*0.5),
        new THREE.Vector3(-4.0,yd,zj*0.6),
        new THREE.Vector3(-6.6,yd,zj)];
    }else{
      pts=[new THREE.Vector3(-6.6,yd,zj),
        new THREE.Vector3(-4.0,yd,zj*0.6),
        new THREE.Vector3(-2.25,yd+0.05,zj*0.5),
        new THREE.Vector3(0,yd+0.1,zj*0.3),
        new THREE.Vector3(0,HU+0.4,zj*0.2),
        new THREE.Vector3(1.4,HU+0.9,zj*0.4),
        new THREE.Vector3(6.2,HU+1.7,zj)];
    }
    lanes.push({pts,cum:segLen(pts)});
  }
}
function pathPoint(lane,ph,out){
  const ln=lanes[lane],cum=ln.cum,s=ph*cum[cum.length-1];
  let k=1;while(k<cum.length-1&&cum[k]<s)k++;
  const t=(s-cum[k-1])/Math.max(1e-6,cum[k]-cum[k-1]);
  out.lerpVectors(ln.pts[k-1],ln.pts[k],clamp(t,0,1));
}
function respawn(p){
  p.y=0.25+Math.random()*0.7;
  p.lf=Math.random()<0.62?1+Math.floor(Math.random()*9):0;
  p.stage=0;p.t=0;p.sp=0.8+Math.random()*0.5;
}
const v3=new THREE.Vector3(),tmpC2=new THREE.Color();
const cCold=new THREE.Color(0x74c0fc),cWarm=new THREE.Color(0xff8780),cHot=new THREE.Color(0xff922b);
const cSmoke=new THREE.Color(0x565b63),cSmokeHi=new THREE.Color(0x9aa0a8);
function updParticles(dts){
  const vU=vTop()/3*1.5;
  for(let i=0;i<NP;i++){
    const p=pp[i];
    if(mode==='fire'){
      if(p.stage===0){
        p.y+=vU*dts*p.sp;
        p.x=Math.sin(simT*2.1+p.ph*7)*0.34;
        p.z=Math.cos(simT*1.6+p.ph*9)*0.5;
        if(p.lf>0&&p.y>p.lf*su){p.stage=1;p.t=0;p.zd=(Math.random()-0.5)*2.6;}
        else if(p.y>HU+0.25)respawn(p);
      }else{
        p.t+=dts;
        p.x+=(2.25-p.x)*Math.min(1,dts*2.6);
        p.z+=(p.zd-p.z)*Math.min(1,dts*2.6);
        p.y+=0.12*dts;
        if(p.t>3.5+p.ph*2)respawn(p);
      }
      tmpC2.copy(cSmoke).lerp(cSmokeHi,clamp(p.y/HU,0,1)*0.7);
      const sc=p.stage===1?0.8+p.t*0.25:1;
      m4.makeScale(sc,sc,sc);m4.setPosition(p.x,p.y,p.z);
    }else{
      const spd=(0.35+vU*0.55)*p.sp*(mode==='summer'?1.05:1);
      p.ph+=dts*spd/Math.max(0.5,lanes[p.lane].cum[lanes[p.lane].cum.length-1]);
      if(p.ph>1)p.ph-=1;
      pathPoint(p.lane,p.ph,v3);
      const warmT=mode==='summer'?1-clamp(p.ph*2.4,0,1):clamp(p.ph*2.4,0,1);
      tmpC2.copy(mode==='summer'?cHot:cCold).lerp(mode==='summer'?cCold:cWarm,warmT);
      m4.makeScale(1,1,1);m4.setPosition(v3.x,v3.y,v3.z);
    }
    parts.setMatrixAt(i,m4);
    parts.setColorAt(i,tmpC2);
  }
  parts.instanceMatrix.needsUpdate=true;
  if(parts.instanceColor)parts.instanceColor.needsUpdate=true;
}

const STEPS=[
 {zh:'<b>热空气轻</b>:内外温差造成密度差,浮力压差是原动力',en:'<b>Warm air is light</b>: ΔT makes a density gap; buoyancy drives the flow',

 {zh:'<b>Δp=ρ₀gH·ΔT/T</b>:压差沿高度线性分布,中性面处为零',en:'<b>Δp=ρ₀gH·ΔT/T</b>: pressure varies linearly with height, zero at the neutral plane',

 {zh:'<b>中性面</b>:以下进风、以上排风,开口面积移动中性面',en:'<b>The neutral plane</b>: inflow below, outflow above; inlet area moves it',

 {zh:'<b>越高越猛</b>:拔力 ∝ H·ΔT,摩天楼顶层压差可达数十 Pa',en:'<b>Taller is fiercer</b>: draw ∝ H·ΔT — tens of Pa at skyscraper tops',
  act(){setH(40);setDT(35);}},
 {zh:'<b>电梯井=大烟囱</b>:底层门被压差顶住难开,顶层热量被抽走',en:'<b>Lift shaft = chimney</b>: lobby doors jam, heat gets sucked from the top',

 {zh:'<b>火灾窜层</b>:烟气沿竖井数秒上楼,逐层侵入未分隔楼层',en:'<b>Fire spread</b>: smoke races up the shaft in seconds, invading each floor',
  act(){setMode('fire');}},
 {zh:'<b>夏季反转</b>:空调冷楼密度反转,反而从顶层吸进热风',en:'<b>Summer reversal</b>: the chilled tower flips, inhaling hot air up top',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';

    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;

  });

}

const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const cWarmIn=new THREE.Color(0x6b5a52),cWarmHot=new THREE.Color(0xd05a3a);
const cCoolIn=new THREE.Color(0xa8764f),cCoolCold=new THREE.Color(0x3f6fa8);
const cSmokeFill=new THREE.Color(0x2e3238);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 房间温度/烟色 */
  const tF=(dT-5)/30;
  for(let i=0;i<10;i++){
    if(mode==='fire'){
      const arrK=fireT0+(i*su*3)/Math.max(0.5,vTop());
      const fill=clamp((simT-arrK)*0.45,0,0.6);
      tmpC2.copy(cWarmHot).lerp(cSmokeFill,clamp(fill*2,0,1));
      roomMatR[i].color.copy(tmpC2);
      roomMatR[i].opacity=0.3+fill*0.55;
      roomMatL[i].color.copy(tmpC2);
      roomMatL[i].opacity=0.3+fill*0.35;
    }else if(mode==='summer'){
      tmpC2.copy(cCoolIn).lerp(cCoolCold,tF);
      roomMatL[i].color.copy(tmpC2);roomMatR[i].color.copy(tmpC2);
      roomMatL[i].opacity=0.3;roomMatR[i].opacity=0.3;
    }else{
      tmpC2.copy(cWarmIn).lerp(cWarmHot,tF);
      roomMatL[i].color.copy(tmpC2);roomMatR[i].color.copy(tmpC2);
      roomMatL[i].opacity=0.3;roomMatR[i].opacity=0.3;
    }
  }
  winM.emissiveIntensity=mode==='fire'?0.15:(mode==='summer'?0.25:0.7);
  updParticles(dts);
  npLine.position.y=npHeight()/3;
  relabelPos();
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
