<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>锋面与天气系统 · Weather Fronts</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="锋面与天气系统" data-en="Weather Fronts">锋面与天气系统</h1>
  <div class="sub" data-zh="冷暖气团相遇,密度差决定队形:暖空气爬上冷空气的缓坡,层云铺开、细雨连绵——这是暖锋;冷空气一头劈进暖空气底下,积雨云拔地而起、雷暴骤至——这是冷锋;锋线过境时,风向、温度、气压连着翻三张牌;中纬度的天气,几乎都绕着锋面打转 · 拖动旋转 / 空格运行/暂停" data-en="When warm and cold air masses meet, density decides the choreography: warm air climbs the cold mass's gentle ramp, stratiform clouds spread and drizzle settles in — a warm front; cold air wedges under and cumulonimbus towers erupt with a sudden squall — a cold front; as the front passes, wind, temperature and pressure flip three cards in a row; mid-latitude weather is almost all this dance · drag to orbit / Space = run/pause">冷暖气团相遇,密度差决定队形:暖空气爬上冷空气的缓坡,层云铺开、细雨连绵——这是暖锋;冷空气一头劈进暖空气底下,积雨云拔地而起、雷暴骤至——这是冷锋;锋线过境时,风向、温度、气压连着翻三张牌;中纬度的天气,几乎都绕着锋面打转 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="锋面移速" data-en="Front speed">锋面移速</span><span class="v" id="stSpd">—</span>
  <span class="k" data-zh="地面温度" data-en="Surface temp">地面温度</span><span class="v" id="stTmp">—</span>
  <span class="k" data-zh="气压" data-en="Pressure">气压</span><span class="v" id="stPrs">—</span>
  <span class="k" data-zh="天气" data-en="Weather">天气</span><span class="v" id="stWx">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bWarm" data-zh="暖锋" data-en="Warm front">暖锋</button>
    <button class="abtn" id="bCold" data-zh="冷锋" data-en="Cold front">冷锋</button>
    <button class="abtn" id="bOcc" data-zh="锢囚锋" data-en="Occluded">锢囚锋</button>
  </div>
  <div class="row">
    <label data-zh="时间推进" data-en="Time speed">时间推进</label>
    <input id="sTime" type="range" min="0" max="3" step="0.1" value="1">
    <span class="val" id="sTimeVal">1.0 ×</span>
  </div>
  <div class="row">
    <label data-zh="湿度(雨量)" data-en="Humidity">湿度(雨量)</label>
    <input id="sHumid" type="range" min="0" max="1" step="0.05" value="0.6">
    <span class="val" id="sHumidVal">60 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglClouds" type="checkbox" checked> <span data-zh="云雨" data-en="Clouds & rain">云雨</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../tropical-cyclone/" data-zh="热带气旋" data-en="Tropical Cyclone">热带气旋</a>
    <a href="../jet-stream/" data-zh="急流" data-en="Jet Stream">急流</a>
    <a href="../monsoon/" data-zh="季风" data-en="Monsoon">季风</a>
    <a href="../cloud-formation/" data-zh="云的形成" data-en="Cloud Formation">云的形成</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,78);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(2.5,6.5,24);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;controls.autoRotateSpeed=1.2;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ===== 锋面大场景:侧剖视角,X 为锋面推进方向 ===== */
const XM=-17,XP=17,TOPY=7.4,ZD=9.4,HMW=2.7,SW=0.24,HMC=4.8,SC=0.9,HMO=4.8;
const groundM=new THREE.MeshStandardMaterial({color:0x2c4f33,roughness:0.95});
const ground=new THREE.Mesh(new THREE.BoxGeometry(46,0.5,19),groundM);
ground.position.y=-0.25;scene.add(ground);
/* 观测站(小旗):stats 读的就是它所在的位置 */
const statGrp=new THREE.Group();statGrp.position.set(5,0,3.2);scene.add(statGrp);
const flagM=new THREE.MeshStandardMaterial({color:0xd9822b,roughness:0.6,side:THREE.DoubleSide});
const flag=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.26,0.02),flagM);
flag.position.set(0.28,1.3,0);statGrp.add(flag);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1.5,8),new THREE.MeshStandardMaterial({color:0xd8dee8,metalness:0.6,roughness:0.4}));
pole.position.y=0.75;statGrp.add(pole);
/* 两块空气体积:任意多边形柱体,每帧按锋面位置重铺顶点 */
const coldM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.17,side:THREE.DoubleSide,depthWrite:false});
const warmM=new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.13,side:THREE.DoubleSide,depthWrite:false});
function prismMesh(mat,nMax){
  const g=new THREE.BufferGeometry(),idx=[];
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nMax*2*3),3).setUsage(THREE.DynamicDrawUsage));
  for(let i=1;i<nMax-1;i++)idx.push(0,i,i+1,nMax,nMax+i+1,nMax+i);
  for(let i=0;i<nMax;i++){const j=(i+1)%nMax;idx.push(i,j,nMax+j,i,nMax+j,nMax+i);}
  g.setIndex(idx);
  const m=new THREE.Mesh(g,mat);m.frustumCulled=false;m.renderOrder=1;scene.add(m);return m;
}
function setPrism(m,pts){
  const a=m.geometry.attributes.position,nMax=a.count/2;
  for(let i=0;i<nMax;i++){const p=pts[Math.min(i,pts.length-1)];
    a.setXYZ(i,p[0],p[1],ZD/2);a.setXYZ(nMax+i,p[0],p[1],-ZD/2);}
  a.needsUpdate=true;
}
const coldP=prismMesh(coldM,8),warmP=prismMesh(warmM,8);
const pocket=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0.26,depthWrite:false}));
pocket.scale.set(2.7,1.05,1.7);pocket.renderOrder=2;pocket.visible=false;scene.add(pocket);
/* 锋线:地面黄色虚线 + 锋面(斜面)轮廓线 */
const dashM=new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.42,gapSize:0.26});
const surfGround=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0.04,ZD/2+0.1),new THREE.Vector3(0,0.04,-ZD/2-0.1)]),dashM);
scene.add(surfGround);
const surfLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,ZD/2+0.05),new THREE.Vector3(1,1,ZD/2+0.05)]),dashM);
surfLine.frustumCulled=false;scene.add(surfLine);/* 云:层云带 + 积雨云塔 + 闪电 */
const sphGeo=new THREE.SphereGeometry(1,14,10);
const cloudM=new THREE.MeshStandardMaterial({color:0xcfd8e4,roughness:1,transparent:true,opacity:0.88,depthWrite:false});
const stratusGrp=new THREE.Group();scene.add(stratusGrp);
const stratus=[];for(let i=0;i<12;i++){const s=new THREE.Mesh(sphGeo,cloudM);
  s.scale.set(2.5-(i%3)*0.5,0.4,1.5);s.rotation.y=i*0.9;stratus.push(s);stratusGrp.add(s);}
const cbGrp=new THREE.Group();cbGrp.visible=false;scene.add(cbGrp);
const cbS=[];[[0,1.0,1.8],[0.35,2.1,2.0],[-0.35,3.2,1.8],[0.1,4.2,1.5],[0,5.1,1.15]].forEach(t=>{
  const s=new THREE.Mesh(sphGeo,cloudM);s.position.set(t[0],t[1],0);
  s.userData.sy=t[2]*0.82;s.scale.set(t[2],t[2]*0.82,t[2]*0.92);cbS.push(s);cbGrp.add(s);});
const anv=new THREE.Mesh(sphGeo,cloudM);anv.scale.set(3.5,0.5,2.5);anv.position.set(-0.5,5.8,0);cbGrp.add(anv);
const boltGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,3.4,0.4),new THREE.Vector3(0.2,2.5,0.3),
  new THREE.Vector3(-0.15,1.7,0.35),new THREE.Vector3(0.15,0.9,0.3),new THREE.Vector3(-0.05,0.05,0.4)]);
const boltM=new THREE.LineBasicMaterial({color:0xfff3bf,transparent:true,opacity:0});
const bolt=new THREE.Line(boltGeo,boltM);bolt.visible=false;cbGrp.add(bolt);
const boltLight=new THREE.PointLight(0xfff3bf,0,16);boltLight.position.set(0,2.2,0.5);cbGrp.add(boltLight);
/* 雨(InstancedMesh)+ 暖气流爬坡箭头 */
const NRAIN=420,m4=new THREE.Matrix4();
const rain=new THREE.InstancedMesh(new THREE.BoxGeometry(0.035,0.36,0.035),new THREE.MeshBasicMaterial({color:0x9ecfff,transparent:true,opacity:0.6,depthWrite:false}),NRAIN);
rain.instanceMatrix.setUsage(THREE.DynamicDrawUsage);rain.renderOrder=4;scene.add(rain);
const rainD=[];for(let i=0;i<NRAIN;i++)rainD.push({x:0,y:-10,z:0,vx:0,vy:7});
const arrowM=new THREE.MeshStandardMaterial({color:0xd9822b,emissive:0xd9822b,emissiveIntensity:0.35,roughness:0.5});
const arrowsGrp=new THREE.Group(),arrows=[],arrowD=[];
for(let i=0;i<9;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.46,6),arrowM);
  a.rotation.z=-Math.atan(SW);arrows.push(a);arrowsGrp.add(a);arrowD.push({p:i/9,z:((i%3)-1)*2.4});}

/* 状态 */
let mode='warm',timeS=1,humid=0.6,fx=-6,flashT=0,simT=0;
let playing=true,labelsOn=true,slowMo=false,cloudsOn=true;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const SPD={warm:0.22,cold:0.78,occ:0.42};   /* 视觉推进速度 u/s */
const KMH={warm:18,cold:38,occ:26};          /* 真实量级,显示用 */
const XS=5;                                   /* 观测站位置 */
function rampY(d,s,hMax){return Math.min(Math.max(d,0)*s,hMax);}
function stationTemp(){
  if(mode==='occ')return 8.5;
  const t=clamp(((mode==='warm'?fx-XS:XS-fx)/2+1)/2,0,1);return 6+13*(t*t*(3-2*t));
}
function stationPres(){
  const d=fx-XS;let p=1014-9*Math.exp(-d*d/16);
  if(mode==='cold'&&fx>XS)p+=6*clamp((fx-XS)/6,0,1);
  if(mode==='warm'&&fx<XS)p+=clamp(XS-fx,0,8)*0.35;
  return clamp(p,978,1042);
}
function weatherText(){
  const d=fx-XS,W=(zh,en,c)=>[L(zh,en),c];
  if(mode==='warm')return d<-7?W('晴','Clear','ok'):d<-1.5?W('层云增厚','Stratus thickening',''):d<2?W('连绵细雨','Steady drizzle','warn'):W('雨止转暖','Clearing, milder','ok');
  if(mode==='cold')return d<-8?W('晴,积云在长','Fine, cumulus brewing','ok'):d<-1.2?W('闷热不稳','Muggy, unstable',''):d<1.8?W('雷阵雨','Thunder squall','warn'):W('锋后冷晴','Cold, clear, pressure rising','ok');
  return Math.abs(d)<5?W('云厚雨久','Thick cloud, long rain','warn'):W('多云','Cloudy','');
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=null){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);
  (parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblFront=addLabel(()=>L('锋线:过境时风向·温度·气压连翻三张牌','Front line: wind, temp, pressure flip in a row'),new THREE.Vector3(fx,0.5,ZD/2+0.4),'y');
addLabel(()=>L('冷气团:密度大,贴地铺开','Cold mass: dense, hugging the ground'),new THREE.Vector3(-9,2.2,3.9),'b');
addLabel(()=>L('暖气团:暖湿,密度小','Warm mass: humid and lighter'),new THREE.Vector3(2,6.6,3.9),'r');
const lblStrat=addLabel(()=>L('层云:沿缓坡铺开的灰幕','Stratus: a gray sheet along the ramp'),new THREE.Vector3(0,3.9,0),'g',()=>mode!=='cold');
addLabel(()=>L('积雨云:雷暴的座位','Cumulonimbus: the thunderstorm seat'),new THREE.Vector3(0,6.8,0),'o',()=>mode!=='warm',cbGrp);

function setTime(v){timeS=clamp(v,0,3);document.getElementById('sTime').value=timeS;document.getElementById('sTimeVal').textContent=timeS.toFixed(1)+' ×';}
function setHumid(v){humid=clamp(v,0,1);document.getElementById('sHumid').value=humid;document.getElementById('sHumidVal').textContent=(humid*100).toFixed(0)+' %';}
function setFront(x){fx=clamp(x,XM+3,XP-5);rainD.forEach(r=>r.y=-10);}
function applyClouds(){stratusGrp.visible=cloudsOn&&mode!=='cold';cbGrp.visible=cloudsOn&&mode!=='warm';
  arrowsGrp.visible=mode!=='cold';pocket.visible=cloudsOn&&mode==='occ';}
function setMode(m){mode=m;
  document.getElementById('bWarm').classList.toggle('on',m==='warm');
  document.getElementById('bCold').classList.toggle('on',m==='cold');
  document.getElementById('bOcc').classList.toggle('on',m==='occ');
  applyClouds();rainD.forEach(r=>r.y=-10);updateStats();}

const STEPS=[
 {zh:'气团:天气戏班的两位主演',en:'Air masses: the two leads of the show',act(){controls.autoRotate=false;setMode('warm');setTime(0.6);setHumid(0.15);setFront(-4);}},
 {zh:'暖锋:爬坡、层云、连绵雨',en:'Warm front: climb, stratus, endless drizzle',act(){controls.autoRotate=false;setMode('warm');setTime(1);setHumid(0.75);setFront(-7);}},
 {zh:'冷锋:劈入、积雨云、骤雨',en:'Cold front: wedge in, cumulonimbus, sharp squall',act(){controls.autoRotate=false;setMode('cold');setTime(1);setHumid(0.9);setFront(-4);}},
 {zh:'过境三连:风向温度气压翻牌',en:'Passage: wind, temp, pressure flip in a row',act(){controls.autoRotate=false;setMode('cold');setTime(1.5);setHumid(0.7);setFront(1.5);}},
 {zh:'锢囚锋:冷锋追上暖锋',en:'Occlusion: the cold front catches the warm one',act(){controls.autoRotate=false;setMode('occ');setTime(1);setHumid(0.85);setFront(-3);}},
 {zh:'中纬度低压:锋面的螺旋舞',en:'Mid-latitude low: the fronts\u0027 spiral dance',act(){setMode('occ');setTime(1.8);setHumid(1);setFront(-2);controls.autoRotate=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stSpd').innerHTML=(KMH[mode]*timeS).toFixed(0)+'<small> km/h</small>';
  const t=stationTemp(),tv=document.getElementById('stTmp');
  tv.innerHTML=t.toFixed(1)+'<small> °C</small>';tv.className='v '+(t<10?'warn':t>14?'ok':'');
  document.getElementById('stPrs').innerHTML=stationPres().toFixed(0)+'<small> hPa</small>';
  const w=weatherText(),wv=document.getElementById('stWx');wv.textContent=w[0];wv.className='v '+w[1];
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bWarm').addEventListener('click',()=>setMode('warm'));
document.getElementById('bCold').addEventListener('click',()=>setMode('cold'));
document.getElementById('bOcc').addEventListener('click',()=>setMode('occ'));
document.getElementById('sTime').addEventListener('input',e=>setTime(+e.target.value));
document.getElementById('sHumid').addEventListener('input',e=>setHumid(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglClouds').addEventListener('change',e=>{cloudsOn=e.target.checked;applyClouds();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x2c4f33:0x8fbf92);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* 两团体积与锋面线:按模式铺多边形(暖锋=右侧缓楔,冷锋=左侧陡楔,锢囚=两楔夹抬暖空气) */
function updateVolumes(){
  let cp,wp,sp;
  if(mode==='warm'){const lw=HMW/SW;
    cp=[[fx,0],[fx+lw,HMW],[XP,HMW],[XP,0]];
    wp=[[fx,0],[fx+lw,HMW],[XP,HMW],[XP,TOPY],[XM,TOPY],[XM,0]];
    sp=[[fx,0.04],[fx+lw,HMW],[XP,HMW]];
  }else if(mode==='cold'){const lc=HMC/SC;
    cp=[[fx,0],[fx-lc,HMC],[XM,HMC],[XM,0]];
    wp=[[fx,0],[XP,0],[XP,TOPY],[XM,TOPY],[XM,HMC],[fx-lc,HMC]];
    sp=[[fx,0.04],[fx-lc,HMC],[XM,HMC]];
  }else{const lw=HMW/SW,lo=2.1;
    cp=[[XM,0],[XM,HMO],[fx-lo,HMO],[fx,0.25],[fx+lw,HMW],[XP,HMW],[XP,0]];
    wp=[[XM,HMO],[fx-lo,HMO],[fx,0.25],[fx+lw,HMW],[XP,HMW],[XP,TOPY],[XM,TOPY]];
    sp=[[XM,HMO],[fx-lo,HMO],[fx,0.28],[fx+lw,HMW],[XP,HMW]];
  }
  setPrism(coldP,cp);setPrism(warmP,wp);surfLine.geometry.dispose();
  surfLine.geometry=new THREE.BufferGeometry().setFromPoints(sp.map(p=>new THREE.Vector3(p[0],p[1],ZD/2+0.05)));
  surfLine.computeLineDistances();
  const gp=surfGround.geometry.attributes.position;
  gp.setXYZ(0,fx,0.04,ZD/2+0.1);gp.setXYZ(1,fx,0.04,-ZD/2-0.1);gp.needsUpdate=true;
  surfGround.computeLineDistances();
}
function spawnDrop(r){
  if(mode==='cold'){r.x=fx+(Math.random()-0.5)*3.2;r.y=4.4+Math.random()*0.8;}
  else if(mode==='occ'){r.x=fx+(Math.random()-0.5)*8.5;r.y=4.3+Math.random();}
  else{const d=0.8+Math.random()*(HMW/SW+2.5);r.x=fx+d;r.y=rampY(d,SW,HMW)+0.9+Math.random()*0.5;}
  r.x=clamp(r.x,XM+0.8,XP-0.8);r.z=(Math.random()-0.5)*(ZD-1.6);
  r.vx=mode==='cold'?-1.5:0.6;r.vy=6.5+Math.random()*2.5;
}
function updateRain(dts){
  const act=Math.round(NRAIN*humid);
  for(let i=0;i<NRAIN;i++){
    const r=rainD[i];
    if(i<act&&cloudsOn){
      if(r.y<-5)spawnDrop(r);
      r.x+=r.vx*dts;r.y-=r.vy*dts;
      if(r.y<0.05)spawnDrop(r);
      m4.makeScale(1,1,1);m4.setPosition(r.x,r.y,r.z);
    }else{m4.makeScale(0.0001,0.0001,0.0001);m4.setPosition(0,-10,0);}
    rain.setMatrixAt(i,m4);
  }
  rain.instanceMatrix.needsUpdate=true;
}
function updateClouds(dts){
  const showStr=cloudsOn&&mode!=='cold',showCB=cloudsOn&&mode!=='warm';
  stratusGrp.visible=showStr;cbGrp.visible=showCB;
  const lw=HMW/SW;
  for(let i=0;i<stratus.length;i++){
    const s=stratus[i];if(!showStr){s.visible=false;continue;}
    const d=1.0+i*(lw+2.4)/12,x=fx+d;
    s.visible=x<XP-1;
    s.position.set(x,rampY(d,SW,HMW)+0.85+(i%3)*0.22,((i%5)-2)*1.8);
  }
  pocket.position.set(fx,1.95,0);
  if(showCB){cbGrp.position.set(fx+(mode==='cold'?0.55:0.2),0,0);
    const br=1+0.035*Math.sin(simT*2.3);
    for(const s of cbS)s.scale.y=s.userData.sy*br;}
  /* 闪电:冷锋/锢囚锋随机触发,亮起再熄灭 */
  if(showCB&&flashT<=0&&Math.random()<dts*(mode==='cold'?0.6:0.3)){flashT=1;
    const p=bolt.geometry.attributes.position;
    for(let i=1;i<4;i++)p.setX(i,(Math.random()-0.5)*0.55);p.needsUpdate=true;}
  flashT=Math.max(0,flashT-dts*3);
  bolt.visible=flashT>0.45;
  boltM.opacity=flashT*0.95;
  boltLight.intensity=flashT*24;
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 锋面推进,到边界回卷重演 */
  fx+=SPD[mode]*timeS*dts;
  if(fx>XP-5){fx=XM+3;rainD.forEach(r=>r.y=-10);}
  updateVolumes();
  updateClouds(dts);
  updateRain(dts);
  /* 暖空气沿坡爬升的小箭头 */
  if(arrowsGrp.visible)for(let i=0;i<arrows.length;i++){
    const ad=arrowD[i];ad.p+=dts*(0.09+0.05*timeS);if(ad.p>1)ad.p-=1;
    const d=0.7+ad.p*(HMW/SW*0.85);
    arrows[i].position.set(fx+d,rampY(d,SW,HMW)+0.34,ad.z);
  }
  /* 旗子随风摆:锋面过境前后风向不同 */
  flag.rotation.y=(mode==='cold'&&fx>XS?-1.1:mode==='warm'&&fx<XS?0.5:0)+0.22*Math.sin(simT*2.6);
  lblFront.position.set(fx,0.5,ZD/2+0.4);
  lblStrat.position.set(Math.min(fx+4.6,XP-2.5),3.9,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
