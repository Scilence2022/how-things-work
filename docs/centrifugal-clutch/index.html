<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>离心离合器 · 转速越过交点,蹄块咬死鼓壁</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e8a33d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b07d2e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(232,163,61,.6);background:rgba(232,163,61,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,125,46,.55);background:rgba(176,125,46,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(232,163,61,.10);border-color:rgba(232,163,61,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,125,46,.08);border-color:rgba(176,125,46,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe8cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="离心离合器" data-en="The Centrifugal Clutch">离心离合器</h1>
  <div class="sub" data-zh="转速一高,离心力就把蹄块甩向鼓壁:低速打滑、高速咬死,接合点由弹簧刚度锯定——怠速不熄火、起步自动咬的默契,全在一对力的交点上 · 拖动旋转 / 空格运行/暂停" data-en="Spin fast enough and centrifugal force flings the shoes against the drum: slipping at idle, locked at speed, the engagement point filed in by spring stiffness — the tacit deal between idling and pulling away is where two force curves cross · drag to orbit / Space = run/pause">转速一高,离心力就把蹄块甩向鼓壁:低速打滑、高速咬死,接合点由弹簧刚度锯定——怠速不熄火、起步自动咬的默契,全在一对力的交点上 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="输入转速" data-en="Input rpm">输入转速</span><span class="v" id="stIn">—</span>
  <span class="k" data-zh="输出转速" data-en="Output rpm">输出转速</span><span class="v" id="stOut">—</span>
  <span class="k" data-zh="传递扭矩" data-en="Torque">传递扭矩</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="打滑率" data-en="Slip">打滑率</span><span class="v" id="stSlip">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bIdle" data-zh="怠速" data-en="Idle">怠速</button>
    <button class="abtn" id="bLaunch" data-zh="起步咬合" data-en="Launch">起步咬合</button>
    <button class="abtn" id="bStall" data-zh="超载打滑" data-en="Overload">超载打滑</button>
  </div>
  <div class="row">
    <label data-zh="节气门(目标转速)" data-en="Throttle (rpm)">节气门(目标转速)</label>
    <input id="sThr" type="range" min="300" max="3600" step="50" value="900">
    <span class="val" id="sThrVal">900</span>
  </div>
  <div class="row">
    <label data-zh="负载扭矩" data-en="Load torque">负载扭矩</label>
    <input id="sLoad" type="range" min="0" max="40" step="1" value="8">
    <span class="val" id="sLoadVal">8 N·m</span>
  </div>
  <div class="row">
    <label data-zh="弹簧刚度" data-en="Spring k">弹簧刚度</label>
    <input id="sK" type="range" min="5" max="40" step="1" value="14">
    <span class="val" id="sKVal">14 kN/m</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖开鼓壁" data-en="Cutaway">剖开鼓壁</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../clutch-gearbox/" data-zh="离合器与手动变速箱" data-en="Clutch & Gearbox">离合器与手动变速箱</a>
    <a href="../centrifugal-governor/" data-zh="瓦特离心调速器" data-en="Watt's Governor">瓦特离心调速器</a>
    <a href="../flywheel/" data-zh="飞轮与能量回收" data-en="Flywheel & KERS">飞轮与能量回收</a>
    <a href="../four-stroke-engine/" data-zh="四冲程内燃机配气相位" data-en="Four-Stroke Engine Valve Timing">四冲程内燃机配气相位</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,55);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.5,3.2,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=35;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const bench=new THREE.Mesh(new THREE.BoxGeometry(8.5,0.6,3.0),benchM);
bench.position.set(0,0.3,0);scene.add(bench);

/* 轴线沿 Z:发动机(左) → 离合器(中) → 负载轮(右) */
const RDRUM=1.05,RSHOE=0.55;
const engineM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const engine=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.3,1.3),engineM);
engine.position.set(-3.0,1.05,0);scene.add(engine);
const shaftM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const inShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.7,14),shaftM);
inShaft.rotation.x=Math.PI/2;inShaft.position.set(-1.6,1.05,0);scene.add(inShaft);
const outShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.8,14),shaftM);
outShaft.rotation.x=Math.PI/2;outShaft.position.set(1.75,1.05,0);scene.add(outShaft);
/* 离合鼓(半透明,可剖) */
const drumM=new THREE.MeshPhysicalMaterial({color:0x9fb0c3,roughness:0.3,metalness:0.5,
  transparent:true,opacity:0.25,side:THREE.DoubleSide,depthWrite:false});
const drum=new THREE.Mesh(new THREE.CylinderGeometry(RDRUM,RDRUM,0.9,40,1,true),drumM);
drum.rotation.x=Math.PI/2;drum.position.set(0,1.05,0);scene.add(drum);
const drumWall=new THREE.Mesh(new THREE.TorusGeometry(RDRUM,0.05,10,40),
  new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.6}));
drumWall.position.set(0,1.05,0);scene.add(drumWall);
/* 轮毂+两片蹄块(弧段) */
const hub=new THREE.Group();hub.position.set(0,1.05,0);scene.add(hub);
const hubM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.6});
const hubC=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.8,20),hubM);
hubC.rotation.x=Math.PI/2;hub.add(hubC);
function shoeGeo(){
  const s=new THREE.Shape();
  const r0=RSHOE-0.09,r1=RSHOE+0.03,a0=-0.62,a1=0.62;
  s.absarc(0,0,r1,a0,a1,false);
  s.absarc(0,0,r0,a1,a0,true);
  s.closePath();
  return new THREE.ExtrudeGeometry(s,{depth:0.72,bevelEnabled:false});
}
const shoeM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.45,metalness:0.55});
const shoeA=new THREE.Mesh(shoeGeo(),shoeM);hub.add(shoeA);
const shoeB=new THREE.Mesh(shoeGeo(),shoeM);shoeB.rotation.z=Math.PI;hub.add(shoeB);
/* 蹄块弹簧(连接两弧端的小螺旋) */
const sprM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.35,metalness:0.5});
function springGeo(len){
  const pts=[];
  for(let i=0;i<=40;i++){
    const t=i/40;
    pts.push(new THREE.Vector3(len*t,0.035*Math.cos(t*26),0.035*Math.sin(t*26)));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,0.02,6);
}
let springMesh=new THREE.Mesh(springGeo(2*RSHOE*Math.cos(0.62)),sprM);
hub.add(springMesh);
/* 摩擦热光(接触面) */
const heatM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0});
const heatRing=new THREE.Mesh(new THREE.CylinderGeometry(RDRUM-0.02,RDRUM-0.02,0.85,40,1,true),heatM);
heatRing.rotation.x=Math.PI/2;heatRing.position.set(0,1.05,0);scene.add(heatRing);
/* 负载轮(输出) */
const loadWheel=new THREE.Group();loadWheel.position.set(3.0,1.05,0);scene.add(loadWheel);
const wheelM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.55});
const wDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.24,28),wheelM);
wDisc.rotation.x=Math.PI/2;loadWheel.add(wDisc);
for(let i=0;i<4;i++){
  const blade=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.78,0.16),wheelM);
  blade.rotation.z=i*Math.PI/4;blade.position.z=0.2;
  loadWheel.add(blade);
}
/* 离心力箭头(蹄块径向) */
const arrM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0});
const arrA=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.3,8),arrM);
hub.add(arrA);
const arrB=arrA.clone();hub.add(arrB);

/* 状态 */
let thr=900,loadT=8,kSpring=14e3,playing=true,labelsOn=true,slowMo=false,cut=true;
let wIn=thr*Math.PI/30,wOut=0,angIn=0,angOut=0,shoeOut=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const MSHOE=0.55,RARM=0.42,MU=0.42,IL=0.9;
function shoeForce(){/* 单蹄离心力 N */
  return MSHOE*RARM*wIn*wIn;}
function preload(){return kSpring*0.018;}/* 预紧+行程折算 N */
function nContact(){/* 蹄块法向力(压鼓) */
  return Math.max(0,shoeForce()-preload());}
function tqCap(){return 2*MU*nContact()*RDRUM;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('发动机:只管烧到目标转速','Engine: burns to its target rpm, nothing else'),
  new THREE.Vector3(-3.0,2.6,0),'b');
addLabel(()=>L(`蹄块离心力 F=m·r·ω² = ${shoeForce().toFixed(0)} N`,
    `Shoe force F=m·r·ω² = ${shoeForce().toFixed(0)} N`),
  new THREE.Vector3(0,3.0,0),'y');
addLabel(()=>L(`弹簧预紧 ${preload().toFixed(0)} N:接合的门槛`,`Spring preload ${preload().toFixed(0)} N: the gate`),
  new THREE.Vector3(-1.0,2.55,0),'g');
addLabel(()=>L('离合鼓=输出:咬上才转,打滑就热','Drum = output: turns only when grabbed, heats when slipping'),
  new THREE.Vector3(1.4,2.7,0),'r',()=>cut);
addLabel(()=>L('超载:扭矩不够,当场打滑保发动机','Overload: torque falls short — it slips to save the engine'),
  new THREE.Vector3(2.6,-0.5,0),'o',()=>wIn>30&&(tqCap()<loadT));

function setThr(v){thr=clamp(v,300,3600);
  document.getElementById('sThr').value=thr;
  document.getElementById('sThrVal').textContent=thr;updateStats();}
function setLoad(v){loadT=clamp(v,0,40);
  document.getElementById('sLoad').value=loadT;
  document.getElementById('sLoadVal').textContent=loadT.toFixed(0)+' N·m';updateStats();}
function setK(v){kSpring=clamp(v,5,40)*1e3;
  document.getElementById('sK').value=clamp(v,5,40);
  document.getElementById('sKVal').textContent=clamp(v,5,40).toFixed(0)+' kN/m';updateStats();}

const STEPS=[
 {zh:'怠速:转速低,蹄块收拢,鼓纹丝不动',en:'Idle: low rpm, shoes retracted, the drum sleeps',
  act(){setThr(900);setLoad(8);}},
 {zh:'升速:离心力 ∝ω²,蹄块开始外甩',en:'Rev up: force ∝ ω², the shoes start to fling out',
  act(){setThr(1800);}},
 {zh:'越过门槛:蹄块压上鼓壁,带打滑地起步',en:'Past the gate: shoes grab the drum — launch with slip',
  act(){setThr(2600);setLoad(10);}},
 {zh:'完全咬合:输出转速追平输入,打滑归零',en:'Locked: output catches input, slip goes to zero',
  act(){setThr(3200);setLoad(8);}},
 {zh:'超载:负载扭矩超过摩擦上限,当场打滑自保',en:'Overload: load beyond friction cap — it slips to survive',
  act(){setThr(2400);setLoad(38);}},
 {zh:'调弹簧:刚度越小接合越早,刚度越大越晚',en:'Tune the spring: softer engages earlier, stiffer later',
  act(){setThr(1800);setK(6);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stIn').innerHTML=(wIn*30/Math.PI).toFixed(0)+'<small> rpm</small>';
  document.getElementById('stOut').innerHTML=(wOut*30/Math.PI).toFixed(0)+'<small> rpm</small>';
  const tq=Math.min(tqCap(),loadT);
  document.getElementById('stT').innerHTML=(wOut>1?tq:Math.min(tqCap(),loadT)).toFixed(1)+'<small> N·m</small>';
  const sv=document.getElementById('stSlip');
  const slip=wIn>5?clamp((wIn-wOut)/wIn,0,1):0;
  sv.innerHTML=(100*slip).toFixed(0)+'<small> %</small>';
  sv.className='v '+(slip>0.15?'warn':(slip<0.02&&wOut>10?'ok':''));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bIdle').addEventListener('click',()=>setThr(900));
document.getElementById('bLaunch').addEventListener('click',()=>{setThr(2600);setLoad(10);});
document.getElementById('bStall').addEventListener('click',()=>{setThr(2400);setLoad(38);});
document.getElementById('sThr').addEventListener('input',e=>setThr(+e.target.value));
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sK').addEventListener('input',e=>setK(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;
  drum.visible=cut;
  drumWall.visible=!cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  drumM.opacity=cut?(dark?0.25:0.3):1;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 发动机向目标转速爬 */
  const wTarget=thr*Math.PI/30;
  wIn+=clamp(wTarget-wIn,-8*dts*60,8*dts*60);
  /* 蹄块张出(几何跟随力) */
  const nC=nContact();
  const targetOut=clamp(nC/(2*40e3),0,0.05);/* 径向位移 0..5cm */
  shoeOut+=(targetOut-shoeOut)*Math.min(1,dts*8);
  /* 扭矩与负载动力学 */
  const tq=Math.min(tqCap(),loadT+8);/* 上限=摩擦容量 */
  const slipW=wIn-wOut;
  const tqSlip=tqCap()*clamp(slipW/8,0,1);/* 打滑越狠传得越少 */
  const tqNet=Math.min(tqCap(),tqSlip)-loadT;
  wOut=clamp(wOut+tqNet/IL*dts,0,wIn);
  /* 角度 */
  angIn+=wIn*dts;angOut+=wOut*dts;
  hub.rotation.z=angIn;
  loadWheel.rotation.z=angOut;
  drum.rotation.z=angOut*0.5;
  /* 蹄块几何外移 */
  shoeA.position.x=shoeOut;shoeA.position.y=0;
  shoeB.position.x=-shoeOut;shoeB.position.y=0;
  springMesh.scale.x=clamp(1-shoeOut*8,0.6,1);
  /* 离心力箭头 */
  const fShow=clamp(shoeForce()/1500,0,1);
  arrM.opacity=fShow*0.8;
  arrA.position.set(RSHOE+0.25+shoeOut,0,0.4);arrA.rotation.z=-Math.PI/2;
  arrB.position.set(-RSHOE-0.25-shoeOut,0,0.4);arrB.rotation.z=Math.PI/2;
  /* 摩擦热 */
  const heat=clamp((slipW/40)*(tqCap()/40),0,1);
  heatM.opacity=heat*0.5*(playing?1:0.2);
  heatRing.rotation.y+=dts*3;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
