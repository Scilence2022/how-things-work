<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>湍流级串 · 大涡掰小涡,小涡变热消失</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="湍流级串 · 大涡掰小涡,小涡变热消失" data-en="The Turbulence Cascade · big eddies shred small, small fade to heat">湍流级串 · 大涡掰小涡,小涡变热消失</h1>
  <div class="sub" data-zh="搅拌先把大涡转起来,大涡不稳撕成小涡,小涡再撕成更小的:能量沿级串逐级下传,能谱画出 −5/3 的斜率,直到 Kolmogorov 尺度被黏性磨成热——Re 越大,这条瀑布越长越乱 · 拖动旋转 / 空格运行/暂停" data-en="Stirring spins up the big eddies; unstable, they shred into smaller ones, and those into smaller still: energy cascades down, the spectrum draws a −5/3 slope, until the Kolmogorov scale grinds it into heat — the higher Re, the longer the waterfall · drag to orbit / Space = run/pause">搅拌先把大涡转起来,大涡不稳撕成小涡,小涡再撕成更小的:能量沿级串逐级下传,能谱画出 −5/3 的斜率,直到 Kolmogorov 尺度被黏性磨成热——Re 越大,这条瀑布越长越乱 · 拖动旋转 / 空格运行/暂停</div>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpec" type="checkbox" checked> <span data-zh="能谱板" data-en="Spectrum">能谱板</span></label>

    <span data-zh="相关:" data-en="Related:">相关:</span>

    <a href="../kelvin-helmholtz/" data-zh="开尔文–亥姆霍兹" data-en="Kelvin–Helmholtz">开尔文–亥姆霍兹</a>
    <a href="../vortex-street/" data-zh="卡门涡街" data-en="Vortex street">卡门涡街</a>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,34,90);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-1.5,7.5,14.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,0.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 水槽(俯视的方形域) ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.6;scene.add(ground);
const tankG=new THREE.Group();tankG.rotation.x=-Math.PI/2;tankG.rotation.z=0.0;scene.add(tankG);
const wallM=new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.5,metalness:0.5});
const WALL=5.4;
const rim=new THREE.Mesh(new THREE.TorusGeometry(WALL/2,0.075,8,4),wallM);
rim.rotation.z=Math.PI/4;tankG.add(rim);
/* 方形边框(4 根条) */
for(let i=0;i<4;i++){
  const a=i*Math.PI/2;
  const b=new THREE.Mesh(new THREE.BoxGeometry(WALL+0.3,0.16,0.16),wallM);
  b.rotation.z=a;
  b.position.set(-Math.sin(a)*(WALL/2+0.02),Math.cos(a)*(WALL/2+0.02),0);
  tankG.add(b);
}
/* 域底(水色) */
const water=new THREE.Mesh(new THREE.PlaneGeometry(WALL,WALL),
  new THREE.MeshStandardMaterial({color:0x14283a,roughness:0.3,metalness:0.2}));
tankG.add(water);

/* ---- 涡旋:每涡 3 颗绕核卫星 + 中心核 ---- */
const GENMAX=5;
const GEN_COL=[0x4dabf7,0x3bc9db,0x69db7c,0xffd43b,0xff8787];
const NCORE=72;
const coreM=new THREE.MeshBasicMaterial({});
const cores=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,8),coreM,NCORE);
cores.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NCORE*3),3);
scene.add(cores);
const NSAT=NCORE*3;
const satM=new THREE.MeshBasicMaterial({});
const sats=new THREE.InstancedMesh(new THREE.SphereGeometry(0.028,6,6),satM,NSAT);
sats.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NSAT*3),3);
scene.add(sats);
/* 涡团数据(2D 域,坐标 x∈[-W/2,W/2]) */
const eddies=[];   // {x,y,r,gen,age,life,dir,driftA}
const tmpC=new THREE.Color();
function spawnEddy(x,y,gen){
  const r=0.62*Math.pow(0.58,gen);
  eddies.push({x,y,r,gen,age:0,dir:Math.random()<0.5?1:-1,
    life:(1.6+Math.random()*1.4)*(0.7+nu*0.55),driftA:Math.random()*Math.PI*2,
    diss:-1});
}
function stir(){
  const a=Math.random()*Math.PI*2;
  const x=(Math.random()-0.5)*2.2,y=(Math.random()-0.5)*2.2;
  spawnEddy(x,y,0);
}
function maxGen(){return clamp(Math.round(GENMAX-(nu-0.3)*1.6),3,5);}
function updateEddies(dt){
  /* 破碎与耗散 */
  for(let i=eddies.length-1;i>=0;i--){
    const e=eddies[i];
    e.age+=dt;
    e.driftA+=dt*0.3;
    e.x+=Math.cos(e.driftA)*dt*0.12*(1+U*0.3);
    e.y+=Math.sin(e.driftA)*dt*0.12*(1+U*0.3);
    e.x=clamp(e.x,-WALL/2+e.r,WALL/2-e.r);
    e.y=clamp(e.y,-WALL/2+e.r,WALL/2-e.r);
    if(e.diss>=0){           // 耗散收缩中
      e.diss+=dt*1.6;
      if(e.diss>=1)eddies.splice(i,1);
      continue;
    }
    const broken=e.age>e.life;
    if(broken&&e.gen<maxGen()){
      /* 撕成两个小涡 */
      eddies.splice(i,1);
      for(const s of [-1,1]){
        spawnEddy(e.x+s*e.r*0.35,e.y+(Math.random()-0.5)*e.r*0.5,e.gen+1);
      }
    }else if(broken||e.gen>=maxGen()&&e.age>e.life*1.8){
      e.diss=0;              // Kolmogorov 尺度:黏性变热
    }
  }
  /* 搅拌补大涡 */
  if(stirring&&eddies.length<NCORE-4){
    stirTimer+=dt*U;
    if(stirTimer>0.55){stirTimer=0;stir();}
  }
}
/* 绘制 */
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),eul=new THREE.Euler(),
      v3=new THREE.Vector3(0,0,0),s3=new THREE.Vector3(1,1,1);
function drawEddies(t){
  let kc=0,ks=0;
  for(const e of eddies){
    const scale=e.diss>=0?Math.max(0.001,1-e.diss):1;
    const w=e.dir*Math.pow(e.r,-0.66)*1.4;
    tmpC.setHex(GEN_COL[Math.min(4,e.gen)]);
    v3.set(e.x,t*0.02,e.y);
    s3.setScalar(scale*(0.6+e.r));
    m4.compose(v3,new THREE.Quaternion(),s3);
    if(kc<NCORE){cores.setMatrixAt(kc,m4);cores.setColorAt(kc,tmpC);kc++;}
    if(tglSatEl.checked){
      for(let s=0;s<3;s++){
        const a=w*t+s*Math.PI*2/3;
        const rr=e.r*0.75*scale;
        v3.set(e.x+Math.cos(a)*rr,0.02,e.y+Math.sin(a)*rr);
        s3.setScalar(scale*0.9);
        m4.compose(v3,new THREE.Quaternion(),s3);
        if(ks<NSAT){sats.setMatrixAt(ks,m4);sats.setColorAt(ks,tmpC);ks++;}
      }
    }
  }
  for(let i=kc;i<NCORE;i++){v3.set(0,-99,0);s3.setScalar(0.001);m4.compose(v3,new THREE.Quaternion(),s3);cores.setMatrixAt(i,m4);}
  for(let i=ks;i<NSAT;i++){v3.set(0,-99,0);s3.setScalar(0.001);m4.compose(v3,new THREE.Quaternion(),s3);sats.setMatrixAt(i,m4);}
  cores.instanceMatrix.needsUpdate=true;sats.instanceMatrix.needsUpdate=true;
  if(cores.instanceColor)cores.instanceColor.needsUpdate=true;
  if(sats.instanceColor)sats.instanceColor.needsUpdate=true;
}

/* ---- 搅拌勺 ---- */
const spoonG=new THREE.Group();scene.add(spoonG);
const spoonM=new THREE.MeshStandardMaterial({color:0xb0895a,metalness:0.6,roughness:0.4});
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,2.4,10),spoonM);
shaft.position.y=1.2;spoonG.add(shaft);
const blade=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.24),
  new THREE.MeshStandardMaterial({color:0x8a6a3a,metalness:0.6,roughness:0.4}));
blade.position.y=0.05;spoonG.add(blade);
spoonG.visible=true;

/* ---- 能谱板:E(k) 五档 + −5/3 参考线 ---- */
const specG=new THREE.Group();specG.position.set(-6.6,3.4,-3.2);specG.rotation.y=0.65;scene.add(specG);
const sBoard=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.4,0.06),
  new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
specG.add(sBoard);
const kBars=[];
for(let i=0;i<GENMAX;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.4,1,0.1),
    new THREE.MeshBasicMaterial({color:GEN_COL[i],transparent:true,opacity:0.9}));
  b.position.set(-1.7+i*0.85,-0.95,0.06);
  specG.add(b);kBars.push(b);
}
/* −5/3 参考线(从左上滑到右下) */
(function(){
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    Array.from({length:24},(_,i)=>{
      const s=0.06+i/23*0.94;
      const x=-1.7+s*3.4;
      const y=-0.85+Math.pow(1/s,5/3)/Math.pow(1/0.06,5/3)*1.7;
      return new THREE.Vector3(x,y,0.06);
    })),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));
  specG.add(line);
})();
function drawSpec(){
  const cnt=[0,0,0,0,0];
  for(const e of eddies)if(e.diss<0)cnt[e.gen]++;
  const tot=Math.max(1,Math.max(...cnt));
  for(let i=0;i<GENMAX;i++){
    const h=Math.max(0.03,cnt[i]/tot*1.7);
    kBars[i].scale.y=h;kBars[i].position.y=-0.95+h/2;
  }
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('搅拌勺:注入能量,最大涡 ℓ₀','The spoon: energy in, largest eddies ℓ₀'),new THREE.Vector3(0.3,3.2,0),'o');
addLabel(()=>L('蓝→红:涡越撕越小、转得越快','Blue → red: smaller eddies spin faster'),new THREE.Vector3(-3.6,1.9,0.8),'b');
addLabel(()=>L('红色小涡到 Kolmogorov 尺度:黏性变热','Red micro-eddies hit the Kolmogorov scale: viscosity turns them to heat'),new THREE.Vector3(3.2,1.2,0),'r');
addLabel(()=>L('能谱:E(k) ∝ k^(−5/3),惯性区的白线','Spectrum: E(k) ∝ k^(−5/3), the inertial-range line'),new THREE.Vector3(-6.6,4.8,-3.2),'y',()=>tglSpecEl.checked);

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let U=2.0,nu=0.6,stirring=true,slowMo=false;
let stirTimer=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function setU(v){U=v;document.getElementById('sU').value=v;
  document.getElementById('sUVal').textContent=v.toFixed(1);}
function setNu(v){nu=v;document.getElementById('sNu').value=v;
  document.getElementById('sNuVal').textContent=v.toFixed(1);}
/* 统计量 */
function reynolds(){return Math.round(U*2.5/nu*900);}
function etaRatio(){return Math.round(Math.pow(reynolds(),0.75));}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'搅拌注入能量:最大尺寸的涡先转起来(ℓ₀)',en:'Stirring injects energy: the largest eddies spin first (ℓ₀)',
  act(){setU(1.0);setNu(0.6);stirring=true;document.getElementById('bCas').classList.add('on');document.getElementById('bLam').classList.remove('on');document.getElementById('bDecay').classList.remove('on');}},
 {zh:'大涡不稳定:撕成小涡,能量逐级下传',en:'Big eddies go unstable: they shred, energy steps down',
  act(){setU(2.0);}},
 {zh:'越小的涡转得越快:ω ∝ r^(−2/3)',en:'Smaller eddies spin faster: ω ∝ r^(−2/3)',
  act(){setU(2.4);document.getElementById('tglSat').checked=true;}},
 {zh:'惯性区:每级分到同样份额,E(k) ∝ k^(−5/3)',en:'Inertial range: equal share per band, E(k) ∝ k^(−5/3)',
  act(){setU(2.6);setNu(0.4);}},
 {zh:'Kolmogorov 尺度:最小的涡被黏性磨成热',en:'Kolmogorov scale: the smallest eddies grind into heat',
  act(){setU(2.0);setNu(1.6);}},
 {zh:'关掉搅拌:没有补给,级串从大涡开始逐级熄灭',en:'Stir off: no supply, the cascade dies out from the top',
  act(){stirring=false;document.getElementById('bDecay').classList.add('on');document.getElementById('bCas').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stRe').innerHTML=(reynolds()/1000).toFixed(1)+'<small> ×10³</small>';
  document.getElementById('stN').textContent=eddies.filter(e=>e.diss<0).length;
  document.getElementById('stIn').innerHTML=(U*U*U/2.5).toFixed(2)+'<small> W/kg</small>';
  document.getElementById('stEta').textContent=etaRatio();
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bLam').addEventListener('click',()=>{
  setU(0.6);setNu(1.8);stirring=true;
  document.getElementById('bLam').classList.add('on');
  document.getElementById('bCas').classList.remove('on');
  document.getElementById('bDecay').classList.remove('on');
});
document.getElementById('bCas').addEventListener('click',()=>{
  setU(2.4);setNu(0.4);stirring=true;
  document.getElementById('bCas').classList.add('on');
  document.getElementById('bLam').classList.remove('on');
  document.getElementById('bDecay').classList.remove('on');
});
document.getElementById('bDecay').addEventListener('click',()=>{
  stirring=false;
  document.getElementById('bDecay').classList.add('on');
  document.getElementById('bCas').classList.remove('on');
  document.getElementById('bLam').classList.remove('on');
});
document.getElementById('sU').addEventListener('input',e=>setU(+e.target.value));
document.getElementById('sNu').addEventListener('input',e=>setNu(+e.target.value));
document.getElementById('tglSpec').addEventListener('change',e=>{specG.visible=e.target.checked;});
document.getElementById('tglSat').addEventListener('change',()=>{});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  updateEddies(dts);
  drawEddies(simT);
  /* 搅拌勺画圈 */
  if(stirring){
    const a=simT*U*2.2;
    spoonG.position.set(Math.cos(a)*1.2,0.35,Math.sin(a)*1.2);
    spoonG.rotation.y=-a;
    spoonG.visible=true;
  }else spoonG.visible=false;
  drawSpec();
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglSpecEl=document.getElementById('tglSpec');
const tglSatEl=document.getElementById('tglSat');
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setU(2.0);setNu(0.6);
for(let i=0;i<6;i++)stir();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
