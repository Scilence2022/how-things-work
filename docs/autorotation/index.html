<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>直升机自旋降落 · 把高度当油箱</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#b2f2bb;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#2b8a3e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="直升机自旋降落" data-en="Autorotation">直升机自旋降落</h1>
  <div class="sub" data-zh="发动机熄火,旋翼反而转得更起劲:下降气流从下方吹过桨叶,内圈被上升流驱动、外圈靠惯性维持,总距一杆把动能兑换成拉力——自旋降落不是滑翔,是把高度当油箱 · 拖动旋转 / 空格运行/暂停" data-en="The engine quits, yet the rotor spins harder than ever: descending air now blows up through the blades — the inner span is driven by the upflow while the outer span coasts on inertia; one collective lever converts stored rotation into thrust. Autorotation is not gliding — it is spending altitude as fuel · drag to orbit / Space = run/pause">发动机熄火,旋翼反而转得更起劲:下降气流从下方吹过桨叶,内圈被上升流驱动、外圈靠惯性维持,总距一杆把动能兑换成拉力——自旋降落不是滑翔,是把高度当油箱 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="旋翼转速" data-en="Rotor rpm">旋翼转速</span><span class="v" id="stRR">—</span>
  <span class="k" data-zh="下降率" data-en="Sink rate">下降率</span><span class="v" id="stVz">—</span>
  <span class="k" data-zh="前飞速度" data-en="Forward speed">前飞速度</span><span class="v" id="stVx">—</span>
  <span class="k" data-zh="高度" data-en="Height AGL">高度</span><span class="v" id="stAlt">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bPow" data-zh="动力飞行" data-en="Powered flight">动力飞行</button>
    <button class="abtn" id="bOut" data-zh="发动机熄火" data-en="Engine out">发动机熄火</button>
    <button class="abtn" id="bFlare" data-zh="拉平接地" data-en="Flare & touch down">拉平接地</button>
  </div>
  <div class="row">
    <label data-zh="总距" data-en="Collective">总距</label>
    <input id="sCol" type="range" min="2" max="16" step="0.5" value="8">
    <span class="val" id="sColVal">8.0°</span>
  </div>
  <div class="row">
    <label data-zh="下降轨迹角" data-en="Descent angle">下降轨迹角</label>
    <input id="sPath" type="range" min="5" max="20" step="1" value="10">
    <span class="val" id="sPathVal">10°</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglZones" type="checkbox" checked> <span data-zh="桨叶分区" data-en="Blade zones">桨叶分区</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../helicopter-tail-rotor/" data-zh="直升机尾桨" data-en="Tail rotor">直升机尾桨</a>
    <a href="../swashplate/" data-zh="自动倾斜器" data-en="Swashplate">自动倾斜器</a>
    <a href="../gliding-soaring/" data-zh="滑翔与翱翔" data-en="Gliding & soaring">滑翔与翱翔</a>
    <a href="../wing-lift/" data-zh="机翼升力" data-en="Wing lift">机翼升力</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(7.0,4.9,10.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.2,3.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与着陆坪 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const pad=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,0.14,36),
  new THREE.MeshStandardMaterial({color:0x2a3038,roughness:0.85}));
pad.position.y=0.07;scene.add(pad);
const padRing=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.05,8,44),
  new THREE.MeshStandardMaterial({color:0xd8b23a,roughness:0.5}));
padRing.rotation.x=-Math.PI/2;padRing.position.y=0.145;scene.add(padRing);
const hMarkM=new THREE.MeshStandardMaterial({color:0xe8e2cf,roughness:0.6});
for(const hz of[0.75,-0.75]){
  const hb=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.02,1.5),hMarkM);
  hb.position.set(0,0.15,hz);scene.add(hb);
}
const hCross=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.02,0.28),hMarkM);
hCross.position.set(0,0.15,0);scene.add(hCross);
/* 高度标尺:0–300 m */
const rulerM=new THREE.MeshStandardMaterial({color:0x55606e,roughness:0.5,metalness:0.5});
const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,8.0,10),rulerM);
pole.position.set(-4.8,4.1,0);scene.add(pole);
for(let a=0;a<=300;a+=50){
  const tk=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.03,0.03),rulerM);
  tk.position.set(-4.68,0.16+a/300*7.4,0);scene.add(tk);
}
/* 转速储能柱:旋翼就是电池 */
const battM=new THREE.MeshBasicMaterial({color:0x51cf66,toneMapped:false});
const batt=new THREE.Mesh(new THREE.BoxGeometry(0.16,1,0.16),battM);
batt.position.set(-4.35,1.45,0);scene.add(batt);

/* ---- 直升机:机身+尾梁+主旋翼+尾桨+滑橇 ---- */
const heliG=new THREE.Group();scene.add(heliG);
const bodyM=new THREE.MeshStandardMaterial({color:0xcfd8e2,roughness:0.35,metalness:0.25});
const body=new THREE.Mesh(new THREE.SphereGeometry(0.75,26,20),bodyM);
body.scale.set(1.25,0.8,0.85);body.position.y=0.95;heliG.add(body);
const canopy=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,16),
  new THREE.MeshPhysicalMaterial({color:0x9fd8ff,roughness:0.1,transparent:true,opacity:0.5}));
canopy.position.set(0.72,1.0,0);heliG.add(canopy);
const boom=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,1.9,12),bodyM);
boom.rotation.z=Math.PI/2;boom.position.set(-1.5,1.05,0);heliG.add(boom);
const fin=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.55,0.26),bodyM);
fin.position.set(-2.45,1.35,0);heliG.add(fin);
const skidM=new THREE.MeshStandardMaterial({color:0x2b3540,roughness:0.6});
for(const sz of[0.42,-0.42]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.05,0.07),skidM);
  rail.position.set(0.1,0.05,sz);heliG.add(rail);
  for(const sx of[0.55,-0.45]){
    const strut=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.32,0.05),skidM);
    strut.position.set(sx,0.24,sz);heliG.add(strut);
  }
}
const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.4,10),skidM);
mast.position.set(0,1.6,0);heliG.add(mast);
/* 主旋翼:颜色随状态切换(动力=绿 / 自旋=蓝) */
const bladeM=new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.4,metalness:0.3});
const rotG=new THREE.Group();rotG.position.set(0,1.82,0);heliG.add(rotG);
rotG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.14,12),skidM));
for(let i=0;i<4;i++){
  const holder=new THREE.Group();holder.rotation.y=i*Math.PI/2;rotG.add(holder);
  const bl=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.035,0.17),bladeM);
  bl.position.x=1.15;holder.add(bl);
}
/* 尾桨 */
const trG=new THREE.Group();trG.position.set(-2.42,1.35,0.16);heliG.add(trG);
for(let i=0;i<2;i++){
  const tb=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.34,0.05),bladeM);
  tb.rotation.z=i*Math.PI/2;trG.add(tb);
}
/* 前进气流感:空气条纹 */
const NM=24;
const streakM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.18,toneMapped:false});
const streaks=new THREE.InstancedMesh(new THREE.BoxGeometry(0.85,0.02,0.02),streakM,NM);
streaks.frustumCulled=false;scene.add(streaks);
const stX=new Float32Array(NM),stY=new Float32Array(NM),stZ=new Float32Array(NM);
for(let i=0;i<NM;i++){
  stX[i]=-9+Math.random()*18;stY[i]=0.8+Math.random()*7;stZ[i]=-6+Math.random()*12;
}

/* ---- 桨叶放大视图:展向三分区 + 相对气流 ---- */
const bladeG=new THREE.Group();bladeG.position.set(-4.2,5.3,0);scene.add(bladeG);
const bigBlade=new THREE.Mesh(new THREE.BoxGeometry(3,0.13,0.5),bodyM);
bladeG.add(bigBlade);
const rootFair=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.4,14),bodyM);
rootFair.rotation.z=Math.PI/2;rootFair.position.x=-1.7;bladeG.add(rootFair);
const zoneM=(c)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.3,depthWrite:false,toneMapped:false});
const zDrv=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.32,0.56),zoneM(0x51cf66));
zDrv.position.x=-0.9;bladeG.add(zDrv);
const zStl=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.32,0.56),zoneM(0xff6b6b));
zStl.position.x=0.05;bladeG.add(zStl);
const zTip=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.32,0.56),zoneM(0x4dabf7));
zTip.position.x=0.95;bladeG.add(zTip);
/* 相对气流箭头(自旋:从下向上 / 动力:从上向下) */
const arrowM=new THREE.MeshBasicMaterial({color:0xffd43b,toneMapped:false});
const arrows=[];
for(const az of[0.9,-0.9]){
  const ag=new THREE.Group();ag.position.set(0.15,-0.75,az);bladeG.add(ag);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.55,8),arrowM);
  shaft.position.y=0.275;ag.add(shaft);
  const tipC=new THREE.Mesh(new THREE.ConeGeometry(0.095,0.24,12),arrowM);
  tipC.position.y=0.66;ag.add(tipC);
  arrows.push(ag);
}
/* 掠过桨叶剖面的粒子流 */
const NB=40;
const bFlow=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,8),
  new THREE.MeshBasicMaterial({color:0xa9c8e8,toneMapped:false}),NB);
bFlow.frustumCulled=false;scene.add(bFlow);
const bX=new Float32Array(NB),bY=new Float32Array(NB),bZ=new Float32Array(NB);
for(let i=0;i<NB;i++){
  bX[i]=-1.6+Math.random()*3.2;bY[i]=-1.25+Math.random()*2.5;bZ[i]=-1.1+Math.random()*2.2;
}
/* 放大视图与旋翼的连线 */
const cnGeo=new THREE.BufferGeometry();
cnGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
const cnLine=new THREE.Line(cnGeo,new THREE.LineBasicMaterial({color:0x8fa3b8,transparent:true,opacity:0.35}));
scene.add(cnLine);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let state='powered';            /* powered | auto | flare */
let alt=220,om=100,vyDesc=2.5,vx=40;
let colDeg=8,pathDeg=10,flareT=0,banT=0,msgT=0,msg=0,landed=false;
let zonesOn=true,af=1;          /* af:相对气流方向因子(1=自旋,0=动力) */
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('驱动区:气流做正功,转速的发动机','Driven region: airflow does positive work — the rpm engine'),
  new THREE.Vector3(-5.15,6.65,0),'g',()=>zonesOn);
addLabel(()=>L('失速区:局部攻角过大,暂不产功','Stall region: local AoA too big — idles for now'),
  new THREE.Vector3(-4.15,6.0,0),'r',()=>zonesOn);
addLabel(()=>L('桨尖阻力区:惯性滑行,阻力收税','Tip region: coasts on inertia while drag takes its tax'),
  new THREE.Vector3(-3.25,5.5,0),'b',()=>zonesOn);
addLabel(()=>L('相对气流:自旋时从下方吹来','Relative wind: from below in autorotation'),
  new THREE.Vector3(-5.15,4.5,0.9),'y');
addLabel(()=>L('旋翼转速储能','Rotor energy store'),
  new THREE.Vector3(-4.35,3.15,0),'g');
addLabel(()=>L('0 m 地面','0 m ground'),new THREE.Vector3(-5.0,0.35,0),'');
addLabel(()=>L('300 m','300 m'),new THREE.Vector3(-5.0,8.05,0),'');
addLabel(()=>L('熄火!下压总距、稳住转速','Engine out! Lower collective, hold the rpm'),
  new THREE.Vector3(0,7.55,0),'r',()=>banT>0);
addLabel(()=>L('拉平:总距顶满,动能兑换拉力','Flare: collective up — kinetic energy cashed for thrust'),
  new THREE.Vector3(2.1,1.9,0),'g',()=>state==='flare'&&!landed);
addLabel(()=>L('安全接地:窗口内拉平,下降率已消','Safe touchdown: flared inside the window'),
  new THREE.Vector3(2.1,2.6,0),'g',()=>msgT>0&&msg===1);
addLabel(()=>msg===2?L('重着陆:能量耗尽,下降率过大','Hard landing: energy ran out, sink too high')
  :L('拉平过早:高度太高,白烧转速','Flared too early: too high — rpm burned for nothing'),
  new THREE.Vector3(2.1,2.6,0),'r',()=>msgT>0&&msg!==1);

function setCol(d){colDeg=clamp(d,2,16);document.getElementById('sCol').value=colDeg;
  document.getElementById('sColVal').textContent=colDeg.toFixed(1)+'°';}
function setPath(d){pathDeg=clamp(d,5,20);document.getElementById('sPath').value=pathDeg;
  document.getElementById('sPathVal').textContent=pathDeg.toFixed(0)+'°';}
function zonesSet(v){zonesOn=v;document.getElementById('tglZones').checked=v;
  zDrv.visible=zStl.visible=zTip.visible=v;}
function powerUp(){state='powered';alt=220;om=100;vyDesc=2.5;vx=40;landed=false;flareT=0;banT=0;
  setCol(8);setPath(10);
  document.getElementById('bPow').classList.add('on');
  document.getElementById('bOut').classList.remove('on');}
function engineOut(){state='auto';banT=4;
  document.getElementById('bOut').classList.add('on');
  document.getElementById('bPow').classList.remove('on');}
function enterFlare(){if(landed)return;
  if(state==='powered')engineOut();
  state='flare';flareT=3.4;setCol(15.5);
  if(alt>80){msg=3;msgT=3;}}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'熄火瞬间:反扭矩消失、尾桨停转,旋翼即将被气流接管',en:'The instant of failure: anti-torque gone, tail rotor winding down — the airflow takes over',
  act(){powerUp();engineOut();}},
 {zh:'上升气流从下方吹过桨叶,驱动区内圈产功',en:'Rising air blows up through the blades: the inner span is driven from below',
  act(){engineOut();setCol(5);setPath(12);zonesSet(true);}},
 {zh:'驱动区产功、桨尖区耗功:转速在平衡点自持',en:'Driven region makes power, tip region spends it: rpm settles where they balance',
  act(){engineOut();setCol(4);setPath(12);}},
 {zh:'高度存进旋翼:下降换转速,转速就是电池',en:'Altitude is stored in the rotor: descent buys rpm — the rotor is the battery',
  act(){engineOut();setCol(6);setPath(7);}},
 {zh:'接地前拉总距:动能一次性兑换成拉力,下降率骤减',en:'Before touchdown, pull collective: kinetic energy cashed in one move for thrust',
  act(){engineOut();landed=false;alt=45;vyDesc=7.5;setCol(6);setPath(11);enterFlare();}},
 {zh:'没有第二次机会:窗口纪律——拉早了白耗转速,拉晚了拍在地面',en:'No second chance: window discipline — flare too early and you burn rpm, too late and you hit hard',
  act(){engineOut();setCol(14);setPath(14);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const rr=document.getElementById('stRR');
  rr.innerHTML=om.toFixed(0)+'<small> %</small>';
  rr.className='v '+(om<55?'warn':'ok');
  document.getElementById('stVz').innerHTML=vyDesc.toFixed(1)+'<small> m/s</small>';
  document.getElementById('stVx').innerHTML=vx.toFixed(0)+'<small> m/s</small>';
  const sa=document.getElementById('stAlt');
  sa.innerHTML=alt.toFixed(0)+'<small> m</small>';
  sa.className='v '+(!landed&&vyDesc>8?'warn':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bPow').addEventListener('click',()=>powerUp());
document.getElementById('bOut').addEventListener('click',()=>engineOut());
document.getElementById('bFlare').addEventListener('click',()=>enterFlare());
document.getElementById('sCol').addEventListener('input',e=>setCol(+e.target.value));
document.getElementById('sPath').addEventListener('input',e=>setPath(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglZones').addEventListener('change',e=>zonesSet(e.target.checked));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),tv=new THREE.Vector3(),sv=new THREE.Vector3();
const tq=new THREE.Quaternion(),UP=new THREE.Vector3(0,1,0);
const cGreen=new THREE.Color(0x51cf66),cBlue=new THREE.Color(0x4dabf7);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 物理:三状态 */
  let omT,vyT,vxT;
  const pr=pathDeg*Math.PI/180;
  if(state==='powered'){omT=100;vyT=clamp(13-colDeg*0.85,0,12);vxT=38;}
  else if(state==='flare'){
    om=Math.max(20,om-dts*11);vyT=0.25;vxT=Math.max(3,vx*0.3);
    flareT-=dts;if(flareT<=0&&!landed)state='auto';
  }else{
    omT=clamp(97-(colDeg-4)*3+(10-pathDeg)*1.2,35,108);
    vyT=clamp(4.5+(colDeg-4)*0.5+(pathDeg-10)*0.35,2,14);
    vxT=clamp(vyT/Math.tan(pr),4,90);
  }
  if(state!=='flare')om+=(omT-om)*Math.min(1,dts*(state==='powered'?0.9:0.28));
  vyDesc+=(vyT-vyDesc)*Math.min(1,dts*0.7);
  vx+=(vxT-vx)*Math.min(1,dts*0.5);
  if(!landed){
    alt-=vyDesc*dts;
    if(alt<=0){alt=0;landed=true;msg=vyDesc>6?2:1;msgT=4;}
  }else{
    vyDesc*=Math.max(0,1-dts*3);vx*=Math.max(0,1-dts*1.5);
    if(state!=='powered')om=Math.max(0,om-dts*9);
  }
  banT=Math.max(0,banT-dts);msgT=Math.max(0,msgT-dts);
  /* 可视 */
  const bob=landed?0:Math.sin(simT*2.2)*0.03;
  heliG.position.y=0.16+alt/300*7.4+bob;
  heliG.rotation.z=landed?0:clamp(-Math.atan2(vyDesc,vx+2)*0.85,-0.3,0.3);
  heliG.rotation.y+=state==='auto'&&!landed?dts*0.1:0;
  rotG.rotation.y+=om*0.075*dts;
  trG.rotation.z+=(state==='powered'?15:Math.max(1.5,om*0.1))*dts;
  bladeM.color.lerp(state==='powered'?cGreen:cBlue,Math.min(1,dts*2));
  const bh=0.15+om/100*2.5;
  batt.scale.y=bh;batt.position.y=0.2+bh/2;
  battM.color.setHSL(0.36*om/100,0.7,0.5);
  af+=((state==='powered'?0:1)-af)*Math.min(1,dts*2);
  /* 空气条纹(前飞感) */
  if(streaks.visible){
    for(let i=0;i<NM;i++){
      stX[i]-=vx*0.085*dts;
      if(stX[i]<-9.5){stX[i]=9.5;stY[i]=0.8+Math.random()*7;stZ[i]=-6+Math.random()*12;}
      m4.makeScale(1,1,1);m4.setPosition(stX[i],stY[i],stZ[i]);
      streaks.setMatrixAt(i,m4);
    }
    streaks.instanceMatrix.needsUpdate=true;
  }
  /* 放大桨叶:相对气流与粒子 */
  const kk=clamp(2*af-1,-0.999,0.999);
  tv.set(0,kk,0.45*kk).normalize();
  tq.setFromUnitVectors(UP,Math.abs(kk)<0.05?UP:tv);
  for(const ag of arrows)ag.quaternion.copy(tq);
  if(bFlow.visible){
    const dirY=kk>=0?1:-1;
    for(let i=0;i<NB;i++){
      const sp=0.55+1.05*((bX[i]+1.6)/3.2);
      bY[i]+=dirY*1.6*sp*dts;bZ[i]+=dirY*0.7*sp*dts;
      if((dirY>0&&bY[i]>1.3)||(dirY<0&&bY[i]<-1.3)){
        bY[i]=-dirY*1.25;bX[i]=-1.6+Math.random()*3.2;bZ[i]=-1.1+Math.random()*2.2;
      }
      m4.makeScale(1,1,1);
      m4.setPosition(bladeG.position.x+bX[i],bladeG.position.y+bY[i],bZ[i]);
      bFlow.setMatrixAt(i,m4);
    }
    bFlow.instanceMatrix.needsUpdate=true;
  }
  const pa=cnGeo.attributes.position;
  pa.setXYZ(0,0,heliG.position.y+1.85,0);
  pa.setXYZ(1,bladeG.position.x,bladeG.position.y,0);
  pa.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setCol(8);setPath(10);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
