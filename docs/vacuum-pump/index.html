<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>旋片真空泵 · 用不断变大的格子把气体搬走</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="旋片真空泵 · 用不断变大的格子把气体搬走" data-en="Rotary-Vane Pump · growing cells carry gas away">旋片真空泵 · 用不断变大的格子把气体搬走</h1>
  <div class="sub" data-zh="偏心转子上的滑片把月牙腔分成两格:吸气侧容积变大把罩里的气吸进来,滑片一越过排气口气就被封死,再被压缩到顶开簧阀排出去;死隙里的返流让压强永远降不到零——极限压强就是漏进来的和抽走的刚好打平 · 拖动旋转 / 空格运行/暂停" data-en="Vanés on an eccentric rotor split the crescent in two: the suction side grows and draws the jar's gas in; once a vane passes the exhaust port the gas is sealed, then compressed until it pops the check valve; backflow through the dead volume means pressure never reaches zero — the ultimate pressure is where leakage and pumping balance · drag to orbit / Space = run/pause">偏心转子上的滑片把月牙腔分成两格:吸气侧容积变大把罩里的气吸进来,滑片一越过排气口气就被封死,再被压缩到顶开簧阀排出去;死隙里的返流让压强永远降不到零——极限压强就是漏进来的和抽走的刚好打平 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="罩内压强" data-en="Jar pressure">罩内压强</span><span class="v" id="stP">—</span>

  <span class="k" data-zh="极限压强" data-en="Ultimate">极限压强</span><span class="v" id="stU">—</span>
  <span class="k" data-zh="已排分子" data-en="Molecules out">已排分子</span><span class="v" id="stN">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bNorm" data-zh="正常抽气" data-en="Normal pump-down">正常抽气</button>
    <button class="abtn" id="bUlt" data-zh="极限压强" data-en="Ultimate pressure">极限压强</button>

    <label data-zh="转速 rps" data-en="Speed rps">转速 rps</label>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(2.5,3.2,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.6,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 平台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.62;scene.add(ground);

/* ---- 泵体(剖面朝向镜头) ---- */
const pumpG=new THREE.Group();pumpG.position.set(2.6,0.6,0);pumpG.rotation.y=-0.5;scene.add(pumpG);
const DEPTH=1.0;
const statorM=new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.45,metalness:0.55,
  side:THREE.DoubleSide});
/* 定子:半圆壳(开口朝 +z/镜头) */
const RS=1.72;                       // 定子内半径
const stator=new THREE.Mesh(new THREE.CylinderGeometry(RS+0.28,RS+0.28,DEPTH,64,1,true,-Math.PI/2,Math.PI),statorM);
stator.rotation.x=Math.PI/2;stator.rotation.y=Math.PI/2;pumpG.add(stator);
/* 两块端盖(带月牙形孔的简化:用环面+底盘示意) */
const capM=new THREE.MeshStandardMaterial({color:0x2c333d,roughness:0.5,metalness:0.5});
for(const z of [-DEPTH/2,DEPTH/2]){
  const cap=new THREE.Mesh(new THREE.RingGeometry(RS+0.02,RS+0.30,64),capM);
  cap.position.z=z;pumpG.add(cap);
}
/* 定子内壁参考圆(细线) */
const innerRing=new THREE.Mesh(new THREE.TorusGeometry(RS,0.015,8,72),
  new THREE.MeshBasicMaterial({color:0x55637a}));
pumpG.add(innerRing);
/* 转子(偏心 e) */
const RC=0.98,ECC=0.46;              // 转子半径 / 偏心距
const rotorG=new THREE.Group();rotorG.position.z=0;pumpG.add(rotorG);
const rotor=new THREE.Mesh(new THREE.CylinderGeometry(RC,RC,DEPTH-0.06,48),
  new THREE.MeshStandardMaterial({color:0xb0895a,metalness:0.75,roughness:0.35}));
rotor.rotation.x=Math.PI/2;rotorG.add(rotor);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,DEPTH+0.1,16),
  new THREE.MeshStandardMaterial({color:0x666f80,metalness:0.8,roughness:0.3}));
hub.rotation.x=Math.PI/2;rotorG.add(hub);
/* 转子偏心由位置体现:转子中心绕泵轴公转,自转为叶片角 */
const rotorHolder=new THREE.Group();pumpG.add(rotorHolder);
rotorHolder.add(rotorG);
/* 两片滑片(随转子自转,始终从轴心伸到定子壁) */
const vaneM=new THREE.MeshStandardMaterial({color:0x4c5566,metalness:0.6,roughness:0.4});
function makeVane(){
  const g=new THREE.Group();
  const v=new THREE.Mesh(new THREE.BoxGeometry(0.10,RS-0.10,DEPTH-0.12),vaneM);
  v.position.y=(RS+0.08)/2;g.add(v);
  const tip=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.10,DEPTH-0.14),
    new THREE.MeshStandardMaterial({color:0x8a94a6,metalness:0.7,roughness:0.3}));
  tip.position.y=RS-0.04;g.add(tip);
  return g;
}
const vane1=makeVane(),vane2=makeVane();
vane2.rotation.z=Math.PI;
const vaneGroup=new THREE.Group();vaneGroup.add(vane1);vaneGroup.add(vane2);
pumpG.add(vaneGroup);
/* 弹簧(滑片底下的小螺旋示意) */
const sprM=new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:0.7,roughness:0.4});
function springCurve(){
  const pts=[];
  for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3(0.05*Math.sin(t*6*Math.PI),t*0.34,0));}
  return new THREE.CatmullRomCurve3(pts);
}
const spr1=new THREE.Mesh(new THREE.TubeGeometry(springCurve(),48,0.018,6),sprM);
spr1.position.set(0,0.08,0);vane1.add(spr1);
const spr2=spr1.clone();vane2.add(spr2);

/* ---- 吸气口(左上,连真空罩)与排气口(右上,簧阀) ---- */
const INLET_A=Math.PI*1.28,EXH_A=Math.PI*0.22;   // 泵坐标系角度
function portOnRing(a,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.16,DEPTH+0.04),mat);
  m.position.set((RS-0.06)*Math.cos(a),(RS-0.06)*Math.sin(a),0);
  m.rotation.z=a;pumpG.add(m);return m;
}
const inletPort=portOnRing(INLET_A,new THREE.MeshStandardMaterial({color:0x3f74c4,roughness:0.5}));
const exhPort=portOnRing(EXH_A,new THREE.MeshStandardMaterial({color:0xb4423e,roughness:0.5}));
/* 排气管+簧阀瓣 */
const exhPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.8,16),
  new THREE.MeshStandardMaterial({color:0x50596a,metalness:0.6,roughness:0.4}));
exhPipe.position.set((RS+0.28)*Math.cos(EXH_A),(RS+0.28)*Math.sin(EXH_A)+0.32,0);
pumpG.add(exhPipe);
const flapM=new THREE.MeshStandardMaterial({color:0xd4695f,metalness:0.4,roughness:0.5});
const flap=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.05,0.5),flapM);
flap.position.set(exhPipe.position.x,exhPipe.position.y-0.30,0);
pumpG.add(flap);
/* 吸气管:泵 → 真空罩 */
const jarBase=new THREE.Group();jarBase.position.set(-4.6,-0.6,0);scene.add(jarBase);
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.5,0.22,32),
  new THREE.MeshStandardMaterial({color:0x39414d,metalness:0.5,roughness:0.5}));
base.position.y=0.11;jarBase.add(base);
const jarM=new THREE.MeshPhysicalMaterial({color:0xbcd8e8,transparent:true,opacity:0.14,
  roughness:0.05,metalness:0,side:THREE.DoubleSide});
const jar=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,2.3,32),jarM);
jar.position.y=1.37;jarBase.add(jar);
const dome=new THREE.Mesh(new THREE.SphereGeometry(1.15,32,16,0,Math.PI*2,0,Math.PI/2),jarM);
dome.position.y=2.52;jarBase.add(dome);
/* 吸气管(带一点弯) */
const tubeM=new THREE.MeshStandardMaterial({color:0x50596a,metalness:0.6,roughness:0.4});
const tubeCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3.2,0.9,0),new THREE.Vector3(-1.6,1.6,0),new THREE.Vector3(0.4,1.9,0),
  new THREE.Vector3(1.9,2.35,0)]);
const tube=new THREE.Mesh(new THREE.TubeGeometry(tubeCurve,40,0.15,12),tubeM);
scene.add(tube);

/* ---- 气体粒子:月牙腔内按 (角度θ, 半径ρ) 参数化 ---- */
const NGAS=150;
const gasM=new THREE.MeshBasicMaterial({color:0x9ec9ff,transparent:true,opacity:0.9});
const gas=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,6,6),gasM,NGAS);
scene.add(gas);
const gasP=[];  // {a(角度), rho(半径), inJar, exT 排飞进度}
for(let i=0;i<NGAS;i++)gasP.push({a:Math.random()*Math.PI*2,rho:0,inJar:true,exT:-1});
/* 定子内转子表面距离(泵坐标角 a) */
function rotorSurf(a,rot){
  const d=a-rot;
  const c=Math.cos(d);
  return ECC*c+Math.sqrt(Math.max(0.01,RC*RC-ECC*ECC*Math.sin(d)*Math.sin(d)));
}
/* 罩内粒子(体现余量) */
const jarAmt=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),
  new THREE.MeshBasicMaterial({color:0x7fb4f2,transparent:true,opacity:0.75}),40);
scene.add(jarAmt);
/* 排气烟尘 */
const puffN=26;
const puffs=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,6,6),
  new THREE.MeshBasicMaterial({color:0xb8c4d4,transparent:true,opacity:0.8}),puffN);
scene.add(puffs);
const puffT=new Float32Array(puffN).fill(-1);

/* ---- 压强曲线板 ---- */
const curveG=new THREE.Group();curveG.position.set(-4.8,3.3,-1.6);curveG.rotation.y=0.5;scene.add(curveG);
const board=new THREE.Mesh(new THREE.BoxGeometry(4.6,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
curveG.add(board);
const curveLine=new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0x8ce99a}));
curveLine.position.z=0.05;curveG.add(curveLine);
const CURVE_N=140,curveVals=new Float32Array(CURVE_N);
let curveHead=0,curveCount=0;
function pushCurve(v){curveVals[curveHead]=v;curveHead=(curveHead+1)%CURVE_N;
  curveCount=Math.min(CURVE_N,curveCount+1);}
function drawCurve(){
  const pts=[];
  const lo=Math.log10(0.2),hi=Math.log10(2e5);
  for(let j=0;j<curveCount;j++){
    const idx=((curveHead-curveCount+j)%CURVE_N+CURVE_N)%CURVE_N;
    const y=((Math.log10(curveVals[idx])-lo)/(hi-lo)-0.5)*1.9;
    pts.push(new THREE.Vector3(-2.1+j/(CURVE_N-1)*4.2,y,0.06));
  }
  curveLine.geometry.setFromPoints(pts);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('真空罩:被抽的容器','Bell jar: what we pump down'),new THREE.Vector3(-4.6,3.1,0),'b');
addLabel(()=>L('吸气口:容积正在变大,把气吸进来','Inlet: the cell is growing, drawing gas in'),new THREE.Vector3(-0.9,2.75,0),'g');
addLabel(()=>L('偏心转子+滑片:eccentric rotor + vanes','Eccentric rotor + sliding vanes'),new THREE.Vector3(2.6,-0.35,0.8),'y');
addLabel(()=>L('簧阀:压缩到位「啪嗒」顶开,只出不进','Check valve: pops open at full compression, out only'),new THREE.Vector3(4.55,2.9,0),'r',()=>flapOpen>0.02);
addLabel(()=>L('压强曲线:对数轴,一路降到极限压强平台','P–t on a log axis, falling to the ultimate plateau'),new THREE.Vector3(-4.8,4.7,-1.6),'g',()=>tglCurveEl.checked);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let rpm=6,leak=0.4,ballast=false;
let rot=0;                       // 转子自转角
let logP=5;                      // 罩内压强 Pa(存 log10)
let P=1e5;
let pumped=0;                    // 排出的“分子”计数
let flapOpen=0,flapVel=0;
let ultP=1;                      // 极限压强(显示用)
const V_JAR=30,DISP=0.42;        // 升
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function computeUlt(){
  /* 每秒抽走 DISP*rpm 升,漏气按 leak 档补压 */
  const pumpLps=DISP*rpm;
  ultP=Math.max(0.3,(leak*0.9+(ballast?1.6:0))*pumpLps*0.9);
  return ultP;
}
function setRpm(v){rpm=v;document.getElementById('sRpm').value=v;
  document.getElementById('sRpmVal').textContent=v.toFixed(1);}
function setLeak(v){leak=v;document.getElementById('sLeak').value=v;
  document.getElementById('sLeakVal').textContent=v.toFixed(1);}
function setBallast(b){ballast=b;document.getElementById('bBall').classList.toggle('on',b);}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'偏心转子+两片滑片:把月牙腔切成两格,转子一转格子就变大变小',en:'Eccentric rotor + two vanes cut the crescent into cells that grow and shrink',
  act(){setRpm(6);setLeak(0.4);setBallast(false);P=1e5;logP=5;pumped=0;curveCount=0;}},
 {zh:'吸气侧:容积增大压强下降,罩里的气顺管被吸进来',en:'Suction side: the growing cell drops pressure and pulls gas from the jar',
  act(){setRpm(6);setLeak(0.3);}},
 {zh:'滑片越过排气口:气体被封死在压缩腔里',en:'Past the port: the gas is sealed in the compression cell',
  act(){setRpm(9);}},
 {zh:'压缩侧:格子缩小压强飙升,顶开簧阀「啪嗒」排出',en:'Compression: the shrinking cell pops the check valve — out goes the gas',
  act(){setRpm(10);}},
 {zh:'抽不空:死隙返流让漏进=抽走,压强表卡在极限值',en:'Never empty: backflow balances pumping and the gauge sticks at the ultimate',
  act(){setRpm(8);setLeak(1.2);}},
 {zh:'气镇阀:掺一点空气,水汽不凝结;代价是极限压强变差',en:'Gas ballast: bleed air so vapor never condenses — at the cost of a worse ultimate',
  act(){setRpm(8);setLeak(0.4);setBallast(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const e=document.getElementById('stP');
  const txt=P>=100?P.toFixed(0):P>=1?P.toFixed(1):P.toFixed(2);
  e.innerHTML=txt+'<small> Pa</small>';
  e.className='v'+(P<=ultP*1.3?' warn':'');
  document.getElementById('stS').innerHTML=(DISP*rpm).toFixed(1)+'<small> L/s</small>';
  const u=document.getElementById('stU');
  u.innerHTML=ultP.toFixed(2)+'<small> Pa</small>';
  document.getElementById('stN').textContent=Math.round(pumped);
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bNorm').addEventListener('click',()=>{
  setRpm(6);setLeak(0.4);setBallast(false);P=1e5;logP=5;pumped=0;curveCount=0;
  document.getElementById('bNorm').classList.add('on');
  document.getElementById('bUlt').classList.remove('on');
});
document.getElementById('bUlt').addEventListener('click',()=>{
  setRpm(8);setLeak(1.2);setBallast(false);
  document.getElementById('bUlt').classList.add('on');
  document.getElementById('bNorm').classList.remove('on');
});
document.getElementById('bBall').addEventListener('click',()=>{
  setBallast(!ballast);
  document.getElementById('bBall').classList.toggle('on',ballast);
});
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sLeak').addEventListener('input',e=>setLeak(+e.target.value));

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0);
  simT+=dts;
  /* 转子运动:自转 = 泵轴公转(偏心),滑片随轴转 */
  const dRot=dts*rpm*Math.PI*2;
  rot+=dRot;
  rotorHolder.rotation.z=rot;
  rotorG.position.set(ECC*Math.cos(rot),ECC*Math.sin(rot),0);
  rotorG.rotation.z=-rot;          // 转子保持自转抵消,只体现偏心平移
  vaneGroup.rotation.z=rot;
  computeUlt();
  /* 压强动力学:抽走 + 漏入,逐渐贴住极限压强 */
  const pumpRate=DISP*rpm;         // L/s
  /* 抽气使 P 指数逼近极限压强(漏气已折算进 ultP) */
  P=ultP+(P-ultP)*Math.exp(-dts*pumpRate/V_JAR*6);
  P=Math.max(ultP*0.995,Math.min(1.2e5,P));
  logP=Math.log10(P);
  /* 泵内粒子随格子运动 */
  let k=0;
  const cellSpan=Math.PI;          // 两个格子,各占 π
  for(let i=0;i<NGAS;i++){
    const g=gasP[i];
    if(g.exT>=0){                  // 排飞中
      g.exT+=dts*2.2;
      if(g.exT>1){g.exT=-1;g.a=Math.random()*Math.PI*2;g.inJar=Math.random()<clamp((P-ultP)/300,0,1);}
      else{
        const ep=flap.position;
        const x=ep.x+g.exT*1.3*(0.6+((i*37)%10)/14),y=ep.y+g.exT*1.6-1.1*g.exT*g.exT,z=(i%7-3)*0.12;
        m4.makeScale(Math.max(0.05,1-g.exT),Math.max(0.05,1-g.exT),1);m4.setPosition(x,y,z);
        gas.setMatrixAt(k++,m4);
      }
      continue;
    }
    /* 粒子跟着格子转 + 在格内布朗游走 */
    g.a+=dRot*(0.94+((i%5)-2)*0.01)+(Math.random()-0.5)*dts*3;
    const surf=rotorSurf(g.a,rot);
    const lo2=surf+0.10,hi2=RS-0.09;
    if(g.rho<lo2||g.rho>hi2)g.rho=lo2+Math.random()*(hi2-lo2);
    g.rho+=Math.sin(simT*3+i)*0.004;
    /* 进气口/排气口事件 */
    let da=g.a-EXH_A;da=Math.atan2(Math.sin(da),Math.cos(da));
    if(Math.abs(da)<0.10){        // 正过排气口:压缩最高点,排出
      if(Math.random()<clamp(0.9-logP*0.04,0.2,0.95)&&P>ultP*1.05){
        g.exT=0;pumped++;
        flapVel=6;
      }
    }
    da=g.a-INLET_A;da=Math.atan2(Math.sin(da),Math.cos(da));
    if(Math.abs(da)<0.10&&Math.random()<clamp((P-ultP)/3000,0,0.5)){
      g.rho=lo2+Math.random()*(hi2-lo2);   // 从吸气口补进
    }
    /* 与 pumpG(2.6,0.6,0; rotation.y=-0.5) 的世界位姿一致 */
    const ca=g.rho*Math.cos(g.a);
    m4.makeScale(1,1,1);
    m4.setPosition(2.6+ca*0.878,0.6+g.rho*Math.sin(g.a),ca*0.479);
    gas.setMatrixAt(k++,m4);
  }
  gas.count=k;gas.instanceMatrix.needsUpdate=true;
  /* 罩内粒子浓度随压强 */
  {
    const n=Math.round(clamp(Math.log10(P)/5,0,1)*40);
    for(let i=0;i<40;i++){
      if(i<n){
        const a=i*2.399+simT*0.3,r=0.85*Math.sqrt((i%13)/13);
        m4.makeScale(1,1,1);
        m4.setPosition(-4.6+r*Math.cos(a),0.9+((i*0.37)%1.8),r*Math.sin(a)*0.9);
      }else m4.makeScale(0.001,0.001,0.001);
      jarAmt.setMatrixAt(i,m4);
    }
    jarAmt.instanceMatrix.needsUpdate=true;
  }
  /* 排气烟尘 */
  {
    let n=0;
    for(let i=0;i<puffN;i++){
      if(puffT[i]>=0){
        puffT[i]+=dts*1.8;
        if(puffT[i]>1)puffT[i]=-1;
        else{
          const t=puffT[i],ep=flap.position;
          m4.makeScale(1+t*2,1+t*2,1);
          m4.setPosition(ep.x+0.2+Math.sin(i*9)*0.2*t,ep.y+0.1+t*1.1,Math.sin(i*5)*0.3);
          puffs.setMatrixAt(n++,m4);
        }
      }
    }
    puffs.count=n;puffs.instanceMatrix.needsUpdate=true;
  }
  /* 簧阀瓣:被顶开的弹簧回位 */
  flapOpen+=flapVel*dt*6;flapVel*=Math.exp(-dt*8);
  flapOpen=clamp(flapOpen,0,0.5);
  flap.rotation.z=-flapOpen;
  /* 曲线 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.1){frame.acc=0;pushCurve(P);drawCurve();updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglCurveEl=document.getElementById('tglCurve');
const tglGasEl=document.getElementById('tglGas');
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
/* 未用的 gas 粒子可见性开关 */
tglGasEl.addEventListener('change',e=>{gas.visible=e.target.checked;});
applyTheme();buildSteps();
setRpm(6);setLeak(0.4);computeUlt();
for(let i=0;i<NGAS;i++)gasP[i].rho=rotorSurf(gasP[i].a,0)+0.1+Math.random()*0.5;
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();
for(let i=0;i<30;i++)pushCurve(P);
drawCurve();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
