<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活化能 · 麦克斯韦-玻尔兹曼分布与催化剂</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,138,128,.9); color: #ffc2c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.k { border-color: rgba(255,209,102,.9); color: #ffe9b8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.b { color:#1864ab; } :root[data-theme="light"] .lbl.k { color:#9c6f00; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.f { color: #ff9f43; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h  { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.l  { color: #bde9ff; border-color: rgba(127,208,247,.7); }
  .chip.k  { color: #ffd166; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.h  { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.l  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.k  { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="活化能：反应为什么慢？谁能翻过那座山？" data-en="Activation energy: why are reactions slow? Who clears the mountain?">活化能：反应为什么慢？谁能翻过那座山？</h1>
  <div class="sub" data-zh="分子能量服从麦克斯韦-玻尔兹曼分布;只有越过 Ea 阈值的才能反应。升温让曲线摊平右移,催化剂把山削低 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Molecular energies follow the Maxwell–Boltzmann distribution; only those beyond Ea react. Heat flattens the curve, catalysts lower the mountain · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">分子能量服从麦克斯韦-玻尔兹曼分布;只有越过 Ea 阈值的才能反应。升温让曲线摊平右移,催化剂把山削低 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>

  <span class="k" data-zh="能反应分子比例" data-en="fraction able to react">能反应分子比例</span><span class="v f" id="stF">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip h" data-zh="≥ Ea:能反应(红)" data-en="≥ Ea: reactive (red)">≥ Ea:能反应(红)</span>
    <span class="chip l" data-zh="&lt; Ea:翻不过山" data-en="&lt; Ea: can't climb">&lt; Ea:翻不过山</span>
    <span class="chip k" data-zh="催化剂:Ea 左移" data-en="catalyst: Ea shifts left">催化剂:Ea 左移</span>
  </div>
  <div class="row"><label data-zh="温度 T" data-en="Temperature T">温度 T</label><input id="temp" type="range" min="300" max="900" step="10" value="500"><span class="val" id="tempVal">500 K</span></div>
  <div class="row"><label data-zh="活化能 Ea" data-en="Activation energy Ea">活化能 Ea</label><input id="ea" type="range" min="4" max="12" step="1" value="8"><span class="val" id="eaVal">8 kJ/mol</span></div>
  <div class="row"><label data-zh="时间" data-en="Time">时间</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>

    <button id="play">暂停/播放</button>
    <label><input id="tglCat" type="checkbox"> <span data-zh="加入催化剂(Ea 减半)" data-en="add catalyst (Ea halved)">加入催化剂(Ea 减半)</span></label>
  </div>
  <ol id="steps"></ol>

    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglMol" type="checkbox" checked> <span data-zh="分子样本" data-en="molecule sample">分子样本</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
let grid = null;
function palCols() {
  const light = THEME === 'light';
  return {
    bg: light ? 0xeef1f6 : 0x10141b,
    grid: light ? 0x9aa7b8 : 0x3a4656, gridOp: light ? 0.55 : 0.35,
    axis: light ? 0x5b6b7d : 0x8b97a8, axisOp: light ? 0.8 : 0.6,
    wallCool: light ? 0x35a8d8 : 0x2b9fc9,
    wallHot: light ? 0xd64541 : 0xd66a5f,
    edgeCool: light ? 0x1864ab : 0x7fd0f7,
    edgeHot: light ? 0xc92a2a : 0xff8a80,
    molCool: light ? 0x1971c2 : 0x7fd0f7,
    molHot: light ? 0xe03131 : 0xff8a80,
    eaLine: light ? 0xc92a2a : 0xff8a80,
    ghost: light ? 0x6b7a8a : 0x9aa7b8,
  };
}
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const c = palCols();
  scene.background = new THREE.Color(c.bg);
  scene.fog = new THREE.Fog(c.bg, 20, 44);
  if (grid) { grid.material.color.set(c.grid); grid.material.opacity = c.gridOp; }
  axisMat.color.set(c.axis); axisMat.opacity = c.axisOp;
  eaLineMat.color.set(c.eaLine); eaPlaneMat.color.set(c.eaLine);
  ghostLineMat.color.set(c.ghost); ghostPlaneMat.color.set(c.ghost);
  updateWall();
  updateMoleculeColors();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('活化能 · 麦克斯韦-玻尔兹曼分布', 'Activation Energy · Maxwell–Boltzmann');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(3.4, 3.6, 12.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* 地面网格(分布墙立在 y=0 之上) */
grid = new THREE.GridHelper(30, 30, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

/* ================= 物理量(与源页一致) ================= */
let T = clamp(Math.round(qsFloat('temp', 500)), 300, 900);   // 温度(K)
let EaK = clamp(Math.round(qsFloat('ea', 8)), 4, 12);        // 活化能(示意单位)
let catalyst = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let showLabels = qsBool('labels', true), showMol = true;
let simT = 0;
const EMAX = 26;               // 能量轴上限(示意单位)

/* 麦克斯韦-玻尔兹曼(2D 形状近似):f(E) ∝ E·exp(−E/T'),T' 与滑块 T 成正比 */
const Tp = () => T / 25;
const fMB = (E, Tp2) => E * Math.exp(-E / Tp2);
/* 超过 Ea 的比例(数值积分,归一化) */
function fracAbove(ea, Tp2) {
  let tot = 0, above = 0;
  for (let i = 0; i < 400; i++) {
    const E = (i + 0.5) / 400 * EMAX;
    const f = fMB(E, Tp2);
    tot += f;
    if (E >= ea) above += f;
  }
  return above / tot;
}
const eaNow = () => catalyst ? EaK / 2 : EaK;
const kRel = () => {   // 相对速率 k ∝ exp(−Ea/T)(Arrhenius 示意),基准 = 300K 无催化
  const kk = Math.exp(-eaNow() / (T / 25));
  const k0 = Math.exp(-EaK / (300 / 25));
  return kk / k0;
};

/* ================= 布局常量 ================= */
const X0 = -6, X1 = 6;              // 能量轴 E∈[0,EMAX] → 场景 x
const HMAX = 3.4;                   // 分布峰高(场景单位)
const WALL_TH = 0.3;                // 分布墙半厚度(z 方向)
const EA_H = HMAX + 0.45;           // Ea 阈值平面高度
const exS = E => lerp(X0, X1, E / EMAX);
/* 与源页一致的纵轴映射:f/peak 再按 0.38 截断放大 */
const heightFrac = (E, Tp2, peak) => clamp((fMB(E, Tp2) / peak) / 0.38, 0, 1);

/* ================= 分布墙(MB 曲线挤出成 3D 幕) ================= */
/* 每个采样列 4 顶点:顶前/顶后/底前/底后;索引一次性建好;逐顶点着色区分 < Ea / ≥ Ea */
const NSEG = 120, NCOL = NSEG + 1;
const wallPos = new Float32Array(NCOL * 4 * 3);
const wallCol = new Float32Array(NCOL * 4 * 3);
const wallGeo = new THREE.BufferGeometry();
wallGeo.setAttribute('position', new THREE.BufferAttribute(wallPos, 3));
wallGeo.setAttribute('color', new THREE.BufferAttribute(wallCol, 3));
{
  const idx = [];
  for (let i = 0; i < NSEG; i++) {
    const a = i * 4, b = (i + 1) * 4;
    idx.push(a, b, a + 1, a + 1, b, b + 1);              // 顶面条带
    idx.push(a, a + 2, b, b, a + 2, b + 2);              // 前墙
    idx.push(a + 1, b + 1, a + 3, a + 3, b + 1, b + 3);  // 后墙
  }
  wallGeo.setIndex(idx);
}
const wall = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.5, metalness: 0.15,
  transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false }));
wall.frustumCulled = false;
scene.add(wall);
/* 顶边亮线(逐顶点着色) */
const edgePos = new Float32Array(NCOL * 3);
const edgeCol = new Float32Array(NCOL * 3);
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
edgeGeo.setAttribute('color', new THREE.BufferAttribute(edgeCol, 3));
const edge = new THREE.Line(edgeGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.95, toneMapped: false }));
edge.frustumCulled = false;
scene.add(edge);

function updateWall() {
  const c = palCols();
  const Tp2 = Tp(), peak = fMB(Tp2, Tp2), ea = eaNow();
  const wc = new THREE.Color(c.wallCool), wh = new THREE.Color(c.wallHot);
  const ec = new THREE.Color(c.edgeCool), eh = new THREE.Color(c.edgeHot);
  for (let i = 0; i < NCOL; i++) {
    const E = i / NSEG * EMAX;
    const x = exS(E);
    const y = heightFrac(E, Tp2, peak) * HMAX;
    const o = i * 12;
    wallPos[o]     = x; wallPos[o + 1]  = y;    wallPos[o + 2]  = WALL_TH;
    wallPos[o + 3] = x; wallPos[o + 4]  = y;    wallPos[o + 5]  = -WALL_TH;
    wallPos[o + 6] = x; wallPos[o + 7]  = 0.02; wallPos[o + 8]  = WALL_TH;
    wallPos[o + 9] = x; wallPos[o + 10] = 0.02; wallPos[o + 11] = -WALL_TH;
    const col = E >= ea ? wh : wc;
    for (let k = 0; k < 4; k++) {
      wallCol[o + k * 3] = col.r; wallCol[o + k * 3 + 1] = col.g; wallCol[o + k * 3 + 2] = col.b;
    }
    edgePos[i * 3] = x; edgePos[i * 3 + 1] = y; edgePos[i * 3 + 2] = 0;
    const ecol = E >= ea ? eh : ec;
    edgeCol[i * 3] = ecol.r; edgeCol[i * 3 + 1] = ecol.g; edgeCol[i * 3 + 2] = ecol.b;
  }
  wallGeo.attributes.position.needsUpdate = true;
  wallGeo.attributes.color.needsUpdate = true;
  wallGeo.computeVertexNormals();
  edgeGeo.attributes.position.needsUpdate = true;
  edgeGeo.attributes.color.needsUpdate = true;
}

/* ================= 坐标轴 ================= */
const axisMat = new THREE.LineBasicMaterial({ color: 0x8b97a8, transparent: true, opacity: 0.6, toneMapped: false });
const axisGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(X0 - 0.2, 0, 0), new THREE.Vector3(X1 + 0.5, 0, 0),
  new THREE.Vector3(X0, 0, 0), new THREE.Vector3(X0, HMAX + 0.55, 0)]);
scene.add(new THREE.LineSegments(axisGeo, axisMat));

/* ================= Ea 阈值平面(+催化前的 ghost) ================= */
const eaPlaneMat = new THREE.MeshBasicMaterial({ color: 0xff8a80, transparent: true,
  opacity: 0.10, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
const eaPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.4, EA_H), eaPlaneMat);
eaPlane.rotation.y = Math.PI / 2;
eaPlane.position.y = EA_H / 2;
scene.add(eaPlane);
const eaLineMat = new THREE.LineDashedMaterial({ color: 0xff8a80, dashSize: 0.13, gapSize: 0.1, toneMapped: false });
const eaLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, EA_H + 0.12, 0)]);
const eaLine = new THREE.Line(eaLineGeo, eaLineMat);
eaLine.computeLineDistances();
scene.add(eaLine);
const ghostPlaneMat = new THREE.MeshBasicMaterial({ color: 0x9aa7b8, transparent: true,
  opacity: 0.06, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
const ghostPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.4, EA_H), ghostPlaneMat);
ghostPlane.rotation.y = Math.PI / 2;
ghostPlane.position.y = EA_H / 2;
scene.add(ghostPlane);
const ghostLineMat = new THREE.LineDashedMaterial({ color: 0x9aa7b8, dashSize: 0.09, gapSize: 0.09,
  transparent: true, opacity: 0.7, toneMapped: false });
const ghostLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, EA_H + 0.12, 0)]);
const ghostLine = new THREE.Line(ghostLineGeo, ghostLineMat);
ghostLine.computeLineDistances();
scene.add(ghostLine);

/* ================= 分子样本(InstancedMesh,固定种子贴合分布) ================= */
const NMOL = 90;
const molGeo = new THREE.SphereGeometry(0.06, 10, 8);
const molMat = new THREE.MeshBasicMaterial({ toneMapped: false });
const mols = new THREE.InstancedMesh(molGeo, molMat, NMOL);
mols.frustumCulled = false;
scene.add(mols);
const molBase = [];               // {x,y,z,hot}
function rng(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
}
const _col = new THREE.Color();
function updateMoleculeColors() {
  const c = palCols();
  for (let i = 0; i < molBase.length; i++) {
    _col.set(molBase[i].hot ? c.molHot : c.molCool);
    mols.setColorAt(i, _col);
  }
  if (mols.instanceColor) mols.instanceColor.needsUpdate = true;
}
const _m4 = new THREE.Matrix4(), _v3 = new THREE.Vector3(), _q0 = new THREE.Quaternion(), _s3 = new THREE.Vector3();
function poseMolecules(t) {
  mols.visible = showMol;
  for (let i = 0; i < molBase.length; i++) {
    const m = molBase[i];
    const tw = 0.6 + 0.4 * Math.sin(t * 3 + i);
    const s = (m.hot ? 1.3 : 1) * (0.7 + 0.5 * tw);
    _m4.compose(_v3.set(m.x, m.y, m.z), _q0, _s3.setScalar(s));
    mols.setMatrixAt(i, _m4);
  }
  mols.instanceMatrix.needsUpdate = true;
}
function resampleMolecules() {
  const Tp2 = Tp(), peak = fMB(Tp2, Tp2), ea = eaNow();
  const rnd = rng(42);
  molBase.length = 0;
  for (let i = 0; i < NMOL; i++) {
    // 按分布采样:拒绝法
    let E = 0;
    for (let tries = 0; tries < 40; tries++) {
      const cand = rnd() * EMAX;
      if (rnd() < fMB(cand, Tp2) / peak) { E = cand; break; }
    }
    const x = exS(E) + (rnd() - 0.5) * 0.13;
    const y = 0.14 + rnd() * heightFrac(E, Tp2, peak) * HMAX * 0.35;
    const z = (rnd() - 0.5) * 2.6;
    molBase.push({ x, y, z, hot: E >= ea });
  }
  updateMoleculeColors();
  poseMolecules(simT);
}

/* ================= 场景标签 ================= */
const labelReg = [];
let labelsOn = showLabels;
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis() && r.text() !== '';
}
const lblFrac = addLabel(() => {
  const frac = fracAbove(eaNow(), Tp());
  const one = frac > 0 ? Math.max(1, Math.round(1 / frac)) : Infinity;
  return L(`能反应比例:${(frac * 100).toFixed(3)}%(约 1/${one})`, `reactive fraction: ${(frac * 100).toFixed(3)}% (≈ 1/${one})`);
}, new THREE.Vector3(0, EA_H + 0.72, 0), 'o');
const lblEa = addLabel(() => L('Ea 活化能' + (catalyst ? '(催化后)' : ''), 'Ea' + (catalyst ? ' (catalyzed)' : '')),
  new THREE.Vector3(), 'r');
const lblGhost = addLabel(() => L('原 Ea', 'original Ea'), new THREE.Vector3(), 'st',
  () => catalyst && eaNow() !== EaK);
const lblReac = addLabel(() => L('能反应(≥ Ea)', 'reactive (≥ Ea)'), new THREE.Vector3(), 'r');
const lblCant = addLabel(() => L('翻不过山', 'cannot climb'), new THREE.Vector3(), 'b');
addLabel(() => L('每个点 = 一颗分子(红:能量 ≥ Ea)', 'each dot = one molecule (red: E ≥ Ea)'),
  new THREE.Vector3(-1.1, -0.6, 0), 'b', () => showMol);
addLabel(() => 'k = A·e^(−Ea/RT)', new THREE.Vector3(4.1, -0.6, 0), 'k');
addLabel(() => L('分子动能 E', 'kinetic energy E'), new THREE.Vector3(X1 + 0.5, -0.28, 0), 'st');
addLabel(() => L('分子数', 'number of molecules'), new THREE.Vector3(X0 - 0.4, HMAX + 0.78, 0), 'st');

function updateEa() {
  const ea = eaNow();
  eaPlane.position.x = exS(ea);
  eaLine.position.set(exS(ea), 0, 0);
  const ghostOn = catalyst && ea !== EaK;
  ghostPlane.visible = ghostOn;
  ghostLine.visible = ghostOn;
  ghostPlane.position.x = exS(EaK);
  ghostLine.position.set(exS(EaK), 0, 0);
  lblEa.position.set(exS(ea), EA_H + 0.42, 0);
  lblGhost.position.set(exS(EaK), EA_H + 0.42, 0);
  lblReac.position.set((exS(ea) + X1) / 2, -0.28, 0);
  lblCant.position.set((X0 + exS(ea)) / 2, -0.28, 0);
}

/* ================= 相位讲解(按当前状态点亮) ================= */
const STEPS = [
  { id: 'dist', b: '分子能量:一条分布', d: '室温下的分子能量服从麦克斯韦-玻尔兹曼分布:大多数在中间,只有极少数「特别热」。',
    be: 'A distribution of energies', de: 'Molecular energies follow the Maxwell–Boltzmann distribution: most sit in the middle, only a rare few run hot.' },
  { id: 'temp', b: '升温:曲线摊平右移', d: '温度升高,曲线整体摊平右移——超过 Ea 的分子比例按指数暴涨(这就是为什么升温 10K 速率翻倍)。',
    be: 'Heat flattens the curve', de: 'Higher temperature flattens and spreads the curve — the fraction beyond Ea explodes exponentially (why +10 K can double rates).' },
  { id: 'ea', b: 'Ea:那座山', d: '活化能 Ea 是反应的门槛:能量 ≥ Ea 的碰撞才算数。把 Ea 线左右拖,看红色区域如何变化。',
    be: 'Ea: the mountain pass', de: 'Ea is the threshold: only collisions with E ≥ Ea count. Drag the Ea line and watch the red region change.' },
  { id: 'cat', b: '催化剂:把山削低', d: '催化剂开辟一条低 Ea 的新路径——终点(ΔE)不变,只是山变矮。酶就是生物催化剂。',
    be: 'Catalysts lower the pass', de: 'A catalyst opens a lower-Ea path — the destination (ΔE) is unchanged, only the mountain is shorter. Enzymes are biological catalysts.' },
  { id: 'arrh', b: 'Arrhenius:k = A·e^(−Ea/RT)', d: '速率常数与温度、Ea 的定量关系——面板上的「相对速率」就是这条公式在实时计算。',
    be: 'Arrhenius', de: 'The quantitative law tying rate to T and Ea — the panel\'s relative rate is this formula computing live.' },
];
function stepIndex() {
  if (catalyst) return 3;
  if (EaK <= 6) return 2;
  if (T >= 700) return 1;
  if (simT > 2) return 4;
  return 0;
}

/* ================= 计数 ================= */
const stF = document.getElementById('stF'), stR = document.getElementById('stR');
function updateStats() {
  const frac = fracAbove(eaNow(), Tp());
  stF.innerHTML = (frac * 100).toFixed(3) + '<small>%</small>';
  stR.innerHTML = '×' + kRel().toFixed(2) + '<small> ×300K 无催化</small>';
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elTemp = document.getElementById('temp');
const elTempVal = document.getElementById('tempVal');
const elEa = document.getElementById('ea');
const elEaVal = document.getElementById('eaVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglMol = document.getElementById('tglMol');
const tglCat = document.getElementById('tglCat');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; simT += 2; });
elTemp.value = T; elTempVal.textContent = T + ' K';
elTemp.addEventListener('input', () => {
  T = parseInt(elTemp.value, 10); elTempVal.textContent = T + ' K';
  updateWall(); resampleMolecules();
});
elEa.value = EaK; elEaVal.textContent = EaK + ' kJ/mol';
elEa.addEventListener('input', () => {
  EaK = parseInt(elEa.value, 10); elEaVal.textContent = EaK + ' kJ/mol';
  catalyst = false; tglCat.checked = false;
  updateWall(); updateEa(); resampleMolecules();
});
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; refreshLabels(); });
tglMol.addEventListener('change', () => { showMol = tglMol.checked; mols.visible = showMol; refreshLabels(); });
tglCat.addEventListener('change', () => {
  catalyst = tglCat.checked;
  updateWall(); updateEa(); updateMoleculeColors();
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglLabels.checked = showLabels;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    simT += dt * speed;
    poseMolecules(simT);
  }
  updateStats();
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
updateWall();
resampleMolecules();
updateEa();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
