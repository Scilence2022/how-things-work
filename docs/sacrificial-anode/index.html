<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牺牲阳极与阴极保护</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#2fa38a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#258370;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.c { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.z { border-color: rgba(154,220,240,.9); color: #c9eeff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.ok { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  .lbl.w { border-color: rgba(255,159,67,.95); color: #ffd8a8; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(201,42,42,.9); color: #c92a2a; }
  :root[data-theme="light"] .lbl.ok { border-color: rgba(47,158,92,.9); color: #2f9e5c; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(196,110,10,.95); color: #a8650a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.r { color: #ff8787; }
  #stats .v.z { color: #9adcf0; }
  #stats .v.g { color: #43d17c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px 10px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid; }
  .chip.e { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.fe { color: #b3f0c2; border-color: rgba(104,211,145,.7); }
  .chip.zn { color: #c9eeff; border-color: rgba(154,220,240,.7); }
  .chip.h2 { color: #f0f2f5; border-color: rgba(230,235,240,.65); }
  #actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(47,163,138,.12); color: var(--text); border: 1px solid rgba(47,163,138,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(67,209,124,.14); border-color: rgba(67,209,124,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 6px; }
  #steps li { display: flex; gap: 7px; padding: 4px 7px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(47,163,138,.10); border-color: rgba(47,163,138,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(37,131,112,.08); border-color: rgba(37,131,112,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.4; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #b9ecdf; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 8px 12px; font-size: 13px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="牺牲阳极与阴极保护" data-en="Sacrificial Anodes & Cathodic Protection">牺牲阳极与阴极保护</h1>
  <div class="sub" data-zh="锌(−0.76 V)比铁(−0.44 V)更负:焊上锌块,腐蚀电流整体改道,船体被电子淹没压进 −0.85 V(CSE)以下免疫区;锌按 ~10.7 kg/(A·年) 溶没,换 ICCP 则电位可调但要防析氢 · 拖动旋转 / 空格运行/暂停" data-en="Zinc (−0.76 V) sits below iron (−0.44 V): bolt on a zinc block and the corrosion current reroutes, flooding the hull with electrons below −0.85 V (CSE) — immunity; zinc burns off at ~10.7 kg per ampere-year, ICCP is adjustable but beware hydrogen · drag to orbit / space = play/pause">锌(−0.76 V)比铁(−0.44 V)更负:焊上锌块,腐蚀电流整体改道,船体被电子淹没压进 −0.85 V(CSE)以下免疫区;锌按 ~10.7 kg/(A·年) 溶没,换 ICCP 则电位可调但要防析氢 · 拖动旋转 / 空格运行/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="钢电位" data-en="steel potential">钢电位</span><span class="v r" id="stPot">—</span>
  <span class="k" data-zh="腐蚀电流" data-en="corrosion current">腐蚀电流</span><span class="v r" id="stCur">—</span>
  <span class="k" data-zh="锌剩余" data-en="zinc left">锌剩余</span><span class="v z" id="stZn">—</span>
  <span class="k" data-zh="保护效率" data-en="protection">保护效率</span><span class="v r" id="stEff">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.e" data-zh="● e⁻ 电子(走金属)" data-en="● e⁻ (through metal)">● e⁻ 电子(走金属)</span>
    <span class="chip.fe" data-zh="● Fe²⁺ 裸钢溶出" data-en="● Fe²⁺ (bare steel)">● Fe²⁺ 裸钢溶出</span>
    <span class="chip.zn" data-zh="● Zn²⁺ 锌牺牲" data-en="● Zn²⁺ (zinc burns)">● Zn²⁺ 锌牺牲</span>
    <span class="chip.h2" data-zh="● H₂ 过保护" data-en="● H₂ (over-prot.)">● H₂ 过保护</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnZinc" data-zh="装上锌块(当场止锈)" data-en="bolt on zinc (rust stops now)">装上锌块(当场止锈)</button>
    <button class="abtn" id="btnIccp" data-zh="切换 ICCP 外加电流" data-en="switch to ICCP">切换 ICCP 外加电流</button>
  </div>
  <div class="row"><label data-zh="盐度" data-en="salinity">盐度</label><input id="salt" type="range" min="20" max="100" step="5" value="70"><span class="val" id="saltVal">70%</span></div>
  <div class="row"><label data-zh="ICCP 电流" data-en="ICCP output">ICCP 电流</label><input id="iccpI" type="range" min="0" max="150" step="5" value="60"><span class="val" id="iccpIVal">60%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="phase" type="range" min="0" max="5" step="1" value="0"><span class="val" id="phaseVal">1/6</span></div>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCarriers" type="checkbox" checked> <span data-zh="载流子" data-en="carriers">载流子</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../corrosion/" data-zh="金属腐蚀:没有阳极替罪时" data-en="corrosion: no anode to take the blame">金属腐蚀:没有阳极替罪时</a>
    <a href="../galvanic-cell/" data-zh="原电池:把腐蚀电流变成电能" data-en="galvanic cell: put the current to work">原电池:把腐蚀电流变成电能</a>
    <a href="../electroplating/" data-zh="电镀:反向通电把金属镀回来" data-en="electroplating: reverse the current">电镀:反向通电把金属镀回来</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.water.color.set(THEME === 'light' ? 0x6fb0d8 : 0x186a8c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('牺牲阳极 · 阴极保护', 'Sacrificial anode · cathodic protection');
  buildSteps();
  setPlayLabel();
  syncMode();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.0, 3.2, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  steel: mat(0x6f7d8c, { metalness: 0.65, roughness: 0.42, side: THREE.DoubleSide }),
  zinc: mat(0xb8cfdd, { metalness: 0.55, roughness: 0.38 }),
  rust: mat(0x9c4a1e, { roughness: 0.85, emissiveIntensity: 0.08 }),
  rig: mat(0x37414d, { roughness: 0.7 }),
  sediment: mat(0x4a4238, { roughness: 0.95, emissiveIntensity: 0.02 }),
  water: new THREE.MeshBasicMaterial({ color: 0x186a8c, transparent: true, opacity: 0.15, depthWrite: false }),
  mmo: mat(0x2b3038, { metalness: 0.45, roughness: 0.5 }),
  cable: mat(0xd9b23c, { roughness: 0.5 }),
  screen: mat(0x2fa38a, { emissiveIntensity: 0.8 }),
  eDot: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
  feDot: new THREE.MeshBasicMaterial({ color: 0x69db7c }),
  znDot: new THREE.MeshBasicMaterial({ color: 0x9adcf0 }),
  ohDot: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  h2: new THREE.MeshBasicMaterial({ color: 0xf4f8ff, transparent: true, opacity: 0.8 }),
  o2: new THREE.MeshBasicMaterial({ color: 0xd8f3ff, transparent: true, opacity: 0.75 }),
};
const COL_OK = new THREE.Color(0x2fa38a), COL_BAD = new THREE.Color(0xd0653a);

/* ================= 场景:海水剖面 + 船体中段 ================= */
const R_HULL = 1.25, HULL_LEN = 3.4, HULL_Y = 2.75, WL = 2.3;
const hullSurf = z => HULL_Y - Math.sqrt(Math.max(R_HULL * R_HULL - z * z, 0.0001));
{
  const bed = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.16, 3.4), M.sediment);
  bed.position.y = -0.08;
  scene.add(bed);
  for (const [x, z] of [[-3.45, -1.45], [3.45, -1.45], [-3.45, 1.45], [3.45, 1.45]]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, WL, 0.08), M.rig);
    post.position.set(x, WL / 2, z);
    scene.add(post);

    phaseT += dts;

  }

    m4.setPosition(lerp(q[0], q[3], e.p), lerp(q[1], q[4], e.p) + Math.sin(e.p * 9 + i) * 0.02,
      lerp(q[2], q[5], e.p) + Math.cos(e.p * 7 + i * 2.1) * 0.03);

  });

    const vis = showC && relI > 0.04;

    m4.setPosition(d.x + Math.sin(d.life * 8 + i) * 0.05, d.y - d.life * 0.55, d.z * (1 + d.life * 0.4));

    m4.setPosition(z.x + Math.sin(d.life * 7 + i) * 0.06, z.y - d.life * 0.35, z.z + (d.dr - 0.5) * d.life * 0.4);

    const vis = showC;
    m4.makeScale(...(vis ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(d.x + Math.sin(d.life * 6 + i) * 0.05, d.y + d.life * 0.5, d.z * (1 + d.life * 0.3));
    instOh.setMatrixAt(i, m4);
  });
  instOh.instanceMatrix.needsUpdate = true;
  h2Dots.forEach((d, i) => {
    d.life += dts * (0.35 + ovK * 0.9);
    if (d.life > 1) { d.life = 0; d.x = rand(-1.5, 1.5); d.z = rand(-0.8, 0.8); d.y = hullSurf(d.z); }
    const s = showC && ovK > 0.02 ? ovK * (0.4 + d.life * 0.8) : 0.001;
    m4.makeScale(s, s, s);
    m4.setPosition(d.x, d.y + d.life * 1.0, d.z + Math.sin(d.life * 10 + i) * 0.04);
    instH2.setMatrixAt(i, m4);
  });
  instH2.instanceMatrix.needsUpdate = true;
  o2Dots.forEach((d, i) => {
    d.life += dts * 0.7;
    if (d.life > 1) { d.life = 0; d.ang = rand(0, 6.28); }
    const vis = showC && mode === 'iccp';
    const rr = 0.05 + d.life * 0.12;
    m4.makeScale(...(vis ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(Math.sin(d.ang) * rr, 1.15 + d.life * 1.2, 1.38 + Math.cos(d.ang) * rr);
    instO2.setMatrixAt(i, m4);
  });
  instO2.instanceMatrix.needsUpdate = true;

  /* 统计 */
  stPot.innerHTML = pot.toFixed(2) + '<small> V</small>';
  stPot.className = 'v ' + (pot <= -0.85 && !isOver() ? 'g' : 'r');
  stCur.innerHTML = (iC < 0.1 ? iC.toFixed(3) : iC.toFixed(1)) + '<small> µA/cm²</small>';
  stCur.className = 'v ' + (relI < 0.1 ? 'g' : 'r');
  stZn.innerHTML = mode === 'zinc' ? (zincLeft * 20).toFixed(1) + '<small> kg</small>' : '—';
  stEff.innerHTML = protEff().toFixed(0) + '<small> %</small>';
  stEff.className = 'v ' + (protEff() > 95 ? 'g' : 'r');

  /* 标签 */
  for (const r of labelRegistry) {
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + r.cls();
    r.o.element.style.display = tglLabels.checked && (!r.vis || r.vis()) ? '' : 'none';
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncMode();
elSaltVal.textContent = Math.round(salt * 100) + '%';
setIccp(iccpI);
applyTheme();
applyLang();
setPlayLabel();
setPhase(qs.get('t') !== null ? clamp(parseInt(qs.get('t'), 10) || 0, 0, STEPS.length - 1) : 0);
requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
