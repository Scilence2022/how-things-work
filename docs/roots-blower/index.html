<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>罗茨增压器与容积送风 · 压缩不在腔里,在出口挨那一记</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="罗茨增压器与容积送风" data-en="The Roots Blower">罗茨增压器与容积送风</h1>
  <div class="sub" data-zh="两枚 8 字转子靠同步齿轮反向旋转,空气被壳体与叶瓣间的口袋整格搬运到出口——压缩不在腔里做,而是到出口被背压一口气顶回去:回吹是它的效率税,但大流量零迟滞是它的身价;机械增压的「随叫随到」与涡轮的「等人踢一脚」由此分野 · 拖动旋转 / 空格运行/暂停" data-en="Two 8-lobed rotors, geared in sync, ferry air pocket by pocket from inlet to outlet — compression doesn&#39;t happen inside the case; each pocket arrives at the outlet and gets slammed by back-pressure: backflow is its efficiency tax, while big flow with zero lag is its price; instant response separates the supercharger from a turbo that waits for a kick · drag to orbit / Space = run/pause">两枚 8 字转子靠同步齿轮反向旋转,空气被壳体与叶瓣间的口袋整格搬运到出口——压缩不在腔里做,而是到出口被背压一口气顶回去:回吹是它的效率税,但大流量零迟滞是它的身价;机械增压的「随叫随到」与涡轮的「等人踢一脚」由此分野 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="流量" data-en="Flow">流量</span><span class="v" id="stFlow">—</span>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.9,2.8,6.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.35,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=24;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:罗茨鼓风机,转子轴线沿 X,进出口在 peanut 壳体腰部 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const HY=1.5,DC=0.58,RH=0.68;
const wrapA=a=>{a%=Math.PI*2;return a<0?a+Math.PI*2:a;};
function peanutPath(R,d){
  const h=Math.sqrt(R*R-d*d),del=Math.atan2(h,d),s=new THREE.Shape();
  s.absarc(d,0,R,del-Math.PI,Math.PI-del,false);
  s.absarc(-d,0,R,del,Math.PI*2-del,false);
  s.closePath();return s;
}
function lobeShape(n){
  const s=new THREE.Shape(),N=88;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2,r=0.40+0.22*Math.pow(Math.max(0,Math.cos(n*a)),0.75);
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    i===0?s.moveTo(x,y):s.lineTo(x,y);
  }
  return s;
}
function lobeGeo(n){
  const g=new THREE.ExtrudeGeometry(lobeShape(n),{depth:0.78,bevelEnabled:false,curveSegments:48});
  g.translate(0,0,-0.39);return g;
}
const legM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const legL=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.82,1.9),legM);
legL.position.set(-0.28,0.41,0);scene.add(legL);
const legR=legL.clone();legR.position.x=0.28;scene.add(legR);
/* 壳体:剖视=半透明玻璃壳,关掉剖视=金属封闭 */
const shellM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.55,
  transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
const shell=new THREE.Mesh(new THREE.ExtrudeGeometry(peanutPath(RH,DC),{depth:0.85,bevelEnabled:false,curveSegments:48}),shellM);
shell.rotation.y=Math.PI/2;shell.position.x=-0.425;scene.add(shell);
const plateM=new THREE.MeshStandardMaterial({color:0x465060,roughness:0.45,metalness:0.6});
for(const px of [-0.48,0.48]){
  const pl=new THREE.Mesh(new THREE.ExtrudeGeometry(peanutPath(RH,DC),{depth:0.1,bevelEnabled:false,curveSegments:48}),plateM);
  pl.rotation.y=Math.PI/2;pl.position.x=px;scene.add(pl);
}
const bossM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.6});
for(const px of [-0.56,0.56])for(const pz of [-DC,DC]){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.18,18),bossM);
  b.rotation.z=Math.PI/2;b.position.set(px,HY,pz);scene.add(b);
}
/* 进出口管(腰位)+ 法兰 */
const pipeM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.55});
const pipeIn=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,1.3,24),pipeM);
pipeIn.position.set(0,2.52,0);scene.add(pipeIn);
const flIn=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.46,0.08,24),pipeM);
flIn.position.set(0,3.13,0);scene.add(flIn);
const pipeOut=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.9,24),pipeM);
pipeOut.position.set(0,0.68,0);scene.add(pipeOut);
const flOut=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.46,0.08,24),pipeM);
flOut.position.set(0,0.27,0);scene.add(flOut);
/* 回吹闪光 */
const flashM=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,16),
  new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0}));
flashM.position.set(0,1.05,0);scene.add(flashM);
/* 两枚 8 字转子(几何体随叶数重建) */
const rotorM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.3,metalness:0.65});
const rotorN=new THREE.Mesh(lobeGeo(2),rotorM);rotorN.rotation.y=Math.PI/2;
const rotorNG=new THREE.Group();rotorNG.position.set(0,HY,DC);rotorNG.add(rotorN);scene.add(rotorNG);
const rotorF=new THREE.Mesh(rotorN.geometry,rotorM);rotorF.rotation.y=Math.PI/2;
const rotorFG=new THREE.Group();rotorFG.position.set(0,HY,-DC);rotorFG.add(rotorF);scene.add(rotorFG);
/* 同步齿轮(右侧)与电机 */
const gearM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.35,metalness:0.5});
function makeGear(){
  const g=new THREE.Group();
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.08,28),gearM);
  disc.rotation.z=Math.PI/2;g.add(disc);
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5;
    const th=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.065,0.06),gearM);
    th.position.set(0,Math.cos(a)*0.5425,Math.sin(a)*0.5425);th.rotation.x=a;g.add(th);
  }
  return g;
}
const gearNG=makeGear();gearNG.position.set(0.78,HY,DC);scene.add(gearNG);
const gearFG=makeGear();gearFG.position.set(0.78,HY,-DC);scene.add(gearFG);
const motorM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const motor=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.95,0.95),motorM);
motor.position.set(2.2,HY,DC);scene.add(motor);
const shaftN=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.02,14),
  new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85}));
shaftN.rotation.z=Math.PI/2;shaftN.position.set(1.04,HY,DC);scene.add(shaftN);
/* 空气粒子 */
const NP=150;
const airM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
const bits=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,8),airM,NP);
bits.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(bits);
const pd=[];for(let i=0;i<NP;i++)pd.push({m:0,y:2.0+Math.random()*1.1,px:(Math.random()-0.5)*0.36,
  pz:(Math.random()-0.5)*0.36,rot:0,ph:0,rr:0.55,z0:0,bf:false,t:0});

/* 状态 */
let lobes=2,rpm=1800,backP=40,playing=true,labelsOn=true,slowMo=false,cut=true,partsOn=true;
let blowAngle=0,simT=0,lossPct=0,flashI=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function surf(ph){/* 转子叶瓣表面半径(局部角) */
  return 0.40+0.22*Math.pow(Math.max(0,Math.cos(lobes*(ph+Math.PI/2))),0.75);}
function lossP(){return clamp(55*(backP/120)*Math.sqrt(1400/(rpm+400)),0,70);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('进口 · 大气压','Inlet · atmosphere'),new THREE.Vector3(0,3.42,0),'b');
addLabel(()=>L(`出口 · 背压 ${backP.toFixed(0)} kPa`,`Outlet · ${backP.toFixed(0)} kPa back-pressure`),
  new THREE.Vector3(0,0.02,0),'r');
addLabel(()=>L('同步齿轮 · 反向同速','Timing gears · synced counter-rotation'),
  new THREE.Vector3(0.78,2.52,0),'y');
const pktLbl=addLabel(()=>L('口袋 · 原压搬运','Pocket · carried at inlet pressure'),
  new THREE.Vector3(0,2.4,0.6),'o');

function setRpm(v){rpm=clamp(v,500,6000);
  document.getElementById('sRpm').value=rpm;
  document.getElementById('sRpmVal').textContent=rpm.toFixed(0)+' rpm';updateStats();}
function setBack(v){backP=clamp(v,0,120);
  document.getElementById('sBack').value=backP;
  document.getElementById('sBackVal').textContent=backP.toFixed(0)+' kPa';updateStats();}
function setLobes(n){lobes=n;
  document.getElementById('bTwo').classList.toggle('on',n===2);
  document.getElementById('bThree').classList.toggle('on',n===3);
  rotorN.geometry.dispose();rotorN.geometry=lobeGeo(n);rotorF.geometry=rotorN.geometry;
  updateStats();}

const STEPS=[
 {zh:'<b>同步齿轮</b>带动两枚 8 字转子反向旋转,叶瓣互不相触',en:'<b>Timing gears</b> counter-rotate the two lobed rotors without touching',
  act(){setLobes(2);setRpm(1800);setBack(40);}},
 {zh:'<b>进口侧口袋张开</b>:吸满一整格空气,容积不变',en:'<b>Pockets open at the inlet</b>: a full gulp of air, volume unchanged',
  act(){setRpm(600);}},
 {zh:'<b>口袋封闭搬运</b>:原封不动地从进口平移到出口',en:'<b>Sealed pockets ferry</b>: air slides to the outlet untouched',
  act(){setRpm(900);setBack(40);}},
 {zh:'<b>回吹</b>:口袋到出口才被背压顶回——效率税在此',en:'<b>Backflow</b>: each pocket gets slammed by back-pressure on arrival — the efficiency tax',
  act(){setRpm(1200);setBack(120);}},
 {zh:'<b>内压缩对照</b>:螺杆机在腔内升压,省下这笔税',en:'<b>Internal compression</b>: a screw compressor squeezes inside, skipping the tax',
  act(){setBack(40);setRpm(1200);}},
 {zh:'<b>机械增压</b>:转速一给流量就到,零迟滞',en:'<b>Supercharging</b>: flow the instant rpm rises — zero lag',
  act(){setRpm(6000);setBack(40);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  lossPct=lossP();
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  document.getElementById('stFlow').innerHTML=(0.09*rpm*(1-lossPct/100)).toFixed(0)+'<small> m³/h</small>';
  const lv=document.getElementById('stLeak');
  lv.innerHTML=lossPct.toFixed(0)+'<small> %</small>';
  lv.className='v '+(lossPct>25?'warn':'ok');
  const bv=document.getElementById('stBoost');
  bv.innerHTML=backP.toFixed(0)+'<small> kPa</small>';
  bv.className='v '+(backP>90?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bTwo').addEventListener('click',()=>setLobes(2));
document.getElementById('bThree').addEventListener('click',()=>setLobes(3));
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sBack').addEventListener('input',e=>setBack(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglP').addEventListener('change',e=>{partsOn=e.target.checked;bits.visible=partsOn;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;shellM.opacity=cut?0.16:0.92;shellM.depthWrite=!cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  blowAngle+=dts*rpm*0.0016;
  rotorNG.rotation.x=blowAngle;
  rotorFG.rotation.x=-blowAngle+Math.PI*(lobes-1)/lobes;
  gearNG.rotation.x=blowAngle;
  gearFG.rotation.x=-blowAngle+Math.PI/10;
  motor.position.y=HY+Math.sin(simT*42)*0.004*(rpm/6000);
  /* 空气粒子:进口下行 → 随口袋搬运 → 出口被顶出/回吹 */
  const spd=clamp(0.3+rpm*0.0004,0.3,2.7),off=Math.PI*(lobes-1)/lobes;
  lossPct=lossP();let bfCount=0;
  for(let i=0;i<NP;i++){
    const p=pd[i];let x=p.px,y=p.y,z=p.pz,c=0x74c0fc;
    if(p.m===0){
      p.y-=spd*dts;y=p.y;
      if(p.y<2.0){
        p.rot=Math.random()<0.5?0:1;let ok=false;
        for(let t=0;t<6&&!ok;t++){
          p.ph=Math.random()*Math.PI*2;const sf=surf(p.ph);
          if(sf<0.5){p.rr=Math.min(0.63,sf+0.05+Math.random()*Math.max(0.02,0.62-sf));ok=true;}
        }
        if(!ok){p.ph=Math.PI;p.rr=0.6;}
        p.m=1;
      }
    }else if(p.m===1){
      const base=p.rot===0?blowAngle:-blowAngle+off;
      const phi=wrapA(base+p.ph);
      const cz=p.rot===0?DC:-DC;
      x=p.px;y=HY+Math.cos(phi)*p.rr;z=cz+Math.sin(phi)*p.rr;c=0x9ecfff;
      if(wrapA(phi+Math.PI)<0.5){p.m=2;p.y=y;p.z0=z;
        p.bf=Math.random()*100<lossPct&&lossPct>2;p.t=0;}
    }else if(p.bf){
      p.t+=dts;y=p.y+spd*1.5*dts;z=p.z0;c=0xff6b6b;bfCount++;
      if(p.t>0.5){
        const base=p.rot===0?blowAngle:-blowAngle+off;
        p.ph=wrapA(Math.PI-base+(Math.random()-0.5)*0.8);p.m=1;
      }
    }else{
      p.y-=spd*1.2*dts;y=p.y;z=p.z0*0.85;c=0xffa94d;
      if(p.y<0.3){p.m=0;p.y=3.1;p.px=(Math.random()-0.5)*0.36;p.pz=(Math.random()-0.5)*0.36;}
    }
    m4.makeScale(1,1,1);m4.setPosition(x,y,z);
    bits.setMatrixAt(i,m4);
    bits.setColorAt(i,tmpC.setHex(c));
  }
  bits.instanceMatrix.needsUpdate=true;
  if(bits.instanceColor)bits.instanceColor.needsUpdate=true;
  flashI=Math.max(bfCount>0?1:0,flashI*(1-4*dts));
  flashM.material.opacity=0.75*flashI;
  flashM.scale.setScalar(0.7+0.5*flashI+0.12*Math.sin(simT*30));
  const pa=blowAngle+0.8;
  pktLbl.position.set(0,HY+Math.cos(pa)*0.72,DC+Math.sin(pa)*0.72);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
