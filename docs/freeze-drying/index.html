<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>冻干 · 让冰跳过水直接跑掉</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;

    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}

    border:1px solid transparent;align-items:flex-start}

  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}

    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

  <div class="sub" data-zh="水的三相点:611.65 Pa / 0.01 °C。把腔体抽到三相点以下再温和加热,冰不化水、直接升华(潜热 2838 kJ/kg),蜂窝孔隙原位保留、结构不塌;冷阱比产品更冷,冻住水汽维持压差;一次干燥除自由水,二次干燥除结合水到残留 <3%——压强一旦高过三相点,冰当场化水,前功尽弃 · 拖动旋转 / 空格运行/暂停" data-en="Water's triple point: 611.65 Pa / 0.01 °C. Pump below it and heat gently — ice never melts; it sublimes straight to vapor (2838 kJ/kg), leaving the honeycomb structure intact; a cold trap colder than the product freezes the vapor and holds the pressure gap; primary drying removes free water, secondary drying brings residual moisture under 3% — let pressure climb above the triple point and the ice melts on the spot · drag to orbit / Space = run/pause">水的三相点:611.65 Pa / 0.01 °C。把腔体抽到三相点以下再温和加热,冰不化水、直接升华(潜热 2838 kJ/kg),蜂窝孔隙原位保留、结构不塌;冷阱比产品更冷,冻住水汽维持压差;一次干燥除自由水,二次干燥除结合水到残留 <3%——压强一旦高过三相点,冰当场化水,前功尽弃 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 / URL 参数 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let SPEED=1;{const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))SPEED=clamp(v,0.3,2.5);}
const $=id=>document.getElementById(id);
const tglLabelsEl=$('tglLabels'),tglVaporEl=$('tglVapor'),tglPhaseEl=$('tglPhase');
const phaseCv=$('phaseCv');

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(5.2,3.8,7.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.9,2.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 状态 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let Pt=101325,Pc=101325;      // 目标腔压 / 实际腔压 Pa
let Tsh=45,Tp=-18,timeMul=1;  // 搁板温度 / 产品温度 / 时间倍率
let iceFrac=0.9,boundFrac=0.1,melted=false,frost=0;
let simT=0,sublRate=0;
const PSAT=t=>Math.pow(10,-2663.5/(t+273.15)+12.528); // 冰面饱和蒸气压 Pa
const vOfP=p=>(Math.log10(p)-1)*100/4.3;              // 压强→滑杆刻度

/* ---- 材质 ---- */
const baseM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const steelM=new THREE.MeshStandardMaterial({color:0x9aa3ae,metalness:0.75,roughness:0.35});
const darkM=new THREE.MeshStandardMaterial({color:0x2c3138,roughness:0.6,metalness:0.3});
const glassM=new THREE.MeshPhysicalMaterial({color:0xbfd8e8,transparent:true,opacity:0.09,
  roughness:0.12,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const iceM=new THREE.MeshPhysicalMaterial({color:0xdff0fa,transparent:true,opacity:0.72,
  roughness:0.28,metalness:0,depthWrite:false});
const cakeM=new THREE.MeshStandardMaterial({color:0xb9c2cc,roughness:0.8});
const poolM=new THREE.MeshPhysicalMaterial({color:0x4d94e8,transparent:true,opacity:0.8,roughness:0.15,depthWrite:false});
const shelfM=new THREE.MeshStandardMaterial({color:0x57606a,metalness:0.6,roughness:0.4,
  emissive:0xff8c3a,emissiveIntensity:0});
const coilM=new THREE.MeshStandardMaterial({color:0xbfe3f5,metalness:0.4,roughness:0.4,
  emissive:0x9fd8ff,emissiveIntensity:0});

/* ---- 场景 ---- */
const table=new THREE.Mesh(new THREE.BoxGeometry(8.4,0.25,3.6),baseM);
table.position.set(0.7,0.125,0);scene.add(table);
/* 真空腔 */
const chamber=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,3.4,32,1,true),glassM);
chamber.position.set(0,2.15,0);scene.add(chamber);
const dome=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,16,0,Math.PI*2,0,Math.PI/2),glassM);
dome.position.set(0,3.85,0);dome.scale.y=0.35;scene.add(dome);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.58,1.66,0.28,32),steelM);
ring.position.set(0,0.44,0);scene.add(ring);
/* 搁板与样品 */
const shelf=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.08,1.35),shelfM);
shelf.position.set(0,2.3,0);scene.add(shelf);
const shelf2=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.06,1.35),darkM);
shelf2.position.set(0,1.2,0);scene.add(shelf2);
const ice=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.5,0.85),iceM);
ice.position.set(0,2.59,0);scene.add(ice);
const mini1=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,0.6),iceM);
mini1.position.set(-0.45,1.4,0);scene.add(mini1);
const mini2=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.5),iceM);
mini2.position.set(0.5,1.4,0);scene.add(mini2);
const pool=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.72,0.12,28),poolM);
pool.position.set(0,2.4,0);pool.visible=false;scene.add(pool);
/* 蜂窝孔隙:冰退到哪里,骨架就露到哪里 */
const NC=110;
const cake=new THREE.InstancedMesh(new THREE.BoxGeometry(0.1,0.1,0.1),cakeM,NC);
const cakeY=new Float32Array(NC);
{
  const m4=new THREE.Matrix4();
  for(let i=0;i<NC;i++){
    const x=(Math.random()-0.5)*1.02,z=(Math.random()-0.5)*0.7,y=2.4+Math.random()*0.42;
    cakeY[i]=y;m4.setPosition(x,y,z);cake.setMatrixAt(i,m4);
  }
  scene.add(cake);
}
/* 冷阱 + 螺旋盘管 + 泵 + 管路 */
const trapG=new THREE.Group();trapG.position.set(3.4,2.05,0);scene.add(trapG);
const trapBody=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.7,24),steelM);
trapG.add(trapBody);
{
  const pts=[];for(let i=0;i<=80;i++){const a=i/80*Math.PI*2*5;
    pts.push(new THREE.Vector3(Math.cos(a)*0.38,-0.6+i/80*1.2,Math.sin(a)*0.38));}
  const coil=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),160,0.035,6),coilM);
  trapG.add(coil);
}
const pump=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.5,0.62),darkM);
pump.position.set(3.4,0.5,0);scene.add(pump);
const pipeV=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.15,10),steelM);
pipeV.position.set(3.4,1.15,0);scene.add(pipeV);
{
  const pts=[new THREE.Vector3(0.3,3.72,0),new THREE.Vector3(1.7,4.05,0),
    new THREE.Vector3(3.0,3.4,0),new THREE.Vector3(3.4,2.95,0)];
  const pipe=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,0.09,8),steelM);
  scene.add(pipe);
}
/* 水汽粒子:从升华面沿管路飞向冷阱 */
const NV=70;
const vap=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),
  new THREE.MeshBasicMaterial({color:0xdfeefc,transparent:true,opacity:0.7}),NV);
scene.add(vap);
const vapT=new Float64Array(NV).fill(-1);
const vapX=new Float64Array(NV),vapZ=new Float64Array(NV);
let vapAcc=0;
const P0=new THREE.Vector3(),P1=new THREE.Vector3(0.5,4.1,0),P2=new THREE.Vector3(3.4,3.0,0),vp=new THREE.Vector3();
function updVapor(dt){
  let n=0;const m4=new THREE.Matrix4();
  for(let i=0;i<NV;i++){
    if(vapT[i]<0)continue;
    vapT[i]+=dt/1.7;
    if(vapT[i]>=1){vapT[i]=-1;continue;}
    const t=vapT[i],u=1-t;
    P0.set(vapX[i],iceTopY(),vapZ[i]);
    vp.set(0,0,0).addScaledVector(P0,u*u).addScaledVector(P1,2*u*t).addScaledVector(P2,t*t);
    const s=0.75*(1-t*0.5);
    m4.makeScale(s,s,s);m4.setPosition(vp.x,vp.y,vp.z);
    vap.setMatrixAt(i,m4);n++;
  }
  vap.count=n;vap.instanceMatrix.needsUpdate=true;
  if(tglVaporEl.checked&&playing&&state()==='ice'&&sublRate>0.02&&iceFrac>0.005){
    vapAcc+=sublRate*dt*1.6;
    while(vapAcc>1){
      vapAcc-=1;
      const i=vapT.findIndex(t=>t<0);
      if(i<0)break;
      vapT[i]=0;vapX[i]=(Math.random()-0.5)*0.9;vapZ[i]=(Math.random()-0.5)*0.6;
    }
  }
}
function iceTopY(){return 2.34+0.5*Math.max(iceFrac,0)/0.9;}
function state(){return melted?'melted':'ice';}

/* ---- 标签 ---- */
const labelReg=[];

  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('真空腔:抽到三相点 611.65 Pa 以下','vacuum chamber: pump below the 611.65 Pa triple point'),
  new THREE.Vector3(-1.4,4.5,0),'b');
addLabel(()=>L('搁板加热:只补升华潜热 2838 kJ/kg','shelf heat: only the 2838 kJ/kg latent heat of sublimation'),
  new THREE.Vector3(0.25,2.32,0.95),'o');
const lblFront=addLabel(()=>L('升华面:冰退、蜂窝孔隙留下,结构不塌','sublimation front: ice retreats, honeycomb stays — no collapse'),
  new THREE.Vector3(0.7,2.9,0.35),'y',()=>state()==='ice'&&iceFrac>0.03);
addLabel(()=>L('冷阱 -55 °C:冻住水汽,维持压差','cold trap at -55 °C freezes vapor, holding the pressure gap'),

addLabel(()=>L('P 高于 611.65 Pa:冰化成水,失败!','P above 611.65 Pa: the ice melts into water — failed!'),

addLabel(()=>L('真空泵:维持低压','vacuum pump: holds the low pressure'),

/* ---- 物理模型 ---- */
function phys(dt){
  Pc+=(Pt-Pc)*Math.min(1,dt*1.5);
  const psat=PSAT(Tp);
  const drive=clamp((psat-Pc)/psat,0,1);
  const heatIn=0.075*(Tsh-Tp)+0.004*(20-Tp);   // 搁板导热 + 环境漏热
  sublRate=0;
  if(state()==='ice'){
    if(Pc<611.65&&iceFrac>0)sublRate=Math.max(0,Math.min(drive*2.5,heatIn/2.4)); // %/s:热限或传质限
    Tp+=(heatIn-sublRate*2.4)*dt;
    if(Pc<611.65&&iceFrac>0&&Tp>0.5)Tp=0.5;    // 三相点以下不可能有液态水
    if(Pc>=611.65&&Tp>=0){melted=true;sublRate=0;}
    if(iceFrac>0)iceFrac=Math.max(0,iceFrac-sublRate*dt/100);
    else if(Tp>15)boundFrac=Math.max(0.02,boundFrac-1.25e-4*(Tp-15)*dt); // 二次干燥
  }else{
    Tp+=(Tsh-Tp)*Math.min(1,dt*0.3);
    if(Pc<611.65&&Tp<0){melted=false;}          // 重新冻住(教学演示)
  }
  frost=Math.min(60,frost+sublRate*dt*0.5);
  coilM.emissiveIntensity=Math.min(1.6,frost/10);
}
function fresh(){
  melted=false;iceFrac=0.9;boundFrac=0.1;Tp=-18;frost=0;sublRate=0;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'常压加热:冰先化水再蒸发,蜂窝结构塌缩',en:'At atmospheric pressure ice melts, then evaporates — structure collapses'},
 {zh:'抽真空跨过三相点:611.65 Pa / 0.01 °C',en:'Pump across the triple point: 611.65 Pa / 0.01 °C'},
 {zh:'加热只补升华潜热 2838 kJ/kg:冰直接变汽',en:'Heat only pays the 2838 kJ/kg latent heat: ice straight to vapor'},
 {zh:'孔隙一格格露出:冰退到哪里,骨架就留到哪里',en:'Pores appear cell by cell: the skeleton stays where ice retreated'},
 {zh:'冷阱 -55 °C 冻住水汽:维持压差,泵才省力',en:'The -55 °C trap freezes vapor and holds the pressure gap'},
 {zh:'二次干燥:再升温赶出结合水,残留水分 < 3%',en:'Secondary drying: warmer shelf drives off bound water, residual < 3%'}
];
let activeStep=1;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;fresh();
  if(i===0){setPbar(93.16);setTsh(45);setSpd(1);}
  else if(i===1){setPbar(vOfP(30));setTsh(-20);setSpd(1);}
  else if(i===2){setPbar(vOfP(30));setTsh(30);setSpd(1.5);}
  else if(i===3){setPbar(vOfP(30));setTsh(40);setSpd(2.5);}
  else if(i===4){setPbar(vOfP(30));setTsh(35);setSpd(2);}
  else{setPbar(vOfP(30));setTsh(55);setSpd(3);}
  syncSteps();
}

/* ---- 滑杆 ---- */
function fmtP(p){return p<1000?p.toFixed(0)+' Pa':(p/1000).toFixed(1)+' kPa';}
function setPbar(v){$('sP').value=v;Pt=Math.pow(10,1+4.3*v/100);$('sPVal').textContent=fmtP(Pt);}
function setTsh(v){Tsh=v;$('sT').value=v;$('sTVal').textContent=v.toFixed(0)+' °C';}
function setSpd(v){timeMul=v;$('sSpd').value=v;$('sSpdVal').textContent=v.toFixed(1)+'×';}

/* ---- 读数 ---- */
function updateStats(){
  const te=$('stT');
  te.innerHTML=Tp.toFixed(1)+'<small> °C</small>';
  te.className='v'+(melted?' warn':(sublRate>0.02?' ok':''));
  $('stP').innerHTML=fmtP(Pc).replace(/(Pa|kPa)/,'<small> $1</small>');
  const resid=(iceFrac+boundFrac)*100;
  const me=$('stM');
  me.innerHTML=resid.toFixed(1)+'<small> %</small>';
  me.className='v'+(resid<3?' ok':(melted?' warn':''));
  $('stC').innerHTML=(-55+Math.min(10,frost*0.2)).toFixed(1)+'<small> °C</small>';
}

/* ---- 相图 ---- */
function drawPhase(){
  if(!tglPhaseEl.checked)return;
  const ctx=phaseCv.getContext('2d');
  const W=phaseCv.width=phaseCv.clientWidth*2,H=phaseCv.height=phaseCv.clientHeight*2;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const cTxt=(css.getPropertyValue('--text2')||'#9fb0c3').trim();
  const cGrid=(css.getPropertyValue('--panel-border')||'rgba(255,255,255,.1)').trim();
  const x0=48,x1=W-12,y0=12,y1=H-30;
  const TMIN=-50,TMAX=120,PMIN=0.3,PMAX=5.5;
  const X=t=>x0+(x1-x0)*(t-TMIN)/(TMAX-TMIN);
  const Yp=lp=>y1-(y1-y0)*(lp-PMIN)/(PMAX-PMIN);
  ctx.font='15px sans-serif';ctx.fillStyle=cTxt;ctx.strokeStyle=cGrid;ctx.lineWidth=1;
  for(const p of[10,100,1000,10000,100000]){
    const y=Yp(Math.log10(p));ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
    ctx.fillText(p>=1000?(p/1000)+'k':String(p),6,y+5);
  }
  for(let t=-40;t<=120;t+=40){const x=X(t);
    ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke();
    ctx.fillText(t+'°C',x-16,H-8);}
  ctx.strokeStyle='#74c0fc';ctx.lineWidth=3;ctx.beginPath();
  for(let t=TMIN;t<=0.01;t+=1){
    const y=Yp(clamp(Math.log10(PSAT(t)),PMIN,PMAX));
    t===TMIN?ctx.moveTo(X(t),y):ctx.lineTo(X(t),y);
  }
  ctx.stroke();
  ctx.strokeStyle='#ffa94d';ctx.beginPath();
  for(let t=0.01;t<=TMAX;t+=1){
    const p=610.94*Math.exp(17.625*t/(t+243.04));
    const y=Yp(clamp(Math.log10(p),PMIN,PMAX));
    t<=0.02?ctx.moveTo(X(t),y):ctx.lineTo(X(t),y);
  }
  ctx.stroke();
  ctx.strokeStyle='#8ce99a';ctx.beginPath();
  ctx.moveTo(X(0.01),Yp(2.7865));ctx.lineTo(X(0.01),y0);ctx.stroke();
  ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(X(0.01),Yp(2.7865),5,0,7);ctx.fill();
  ctx.fillStyle=cTxt;
  ctx.fillText(L('三相点 611.65 Pa / 0.01 °C','triple point 611.65 Pa'),X(0.01)-64,Yp(2.7865)+26);
  ctx.fillText(L('冰','ice'),X(-33),Yp(3.6));
  ctx.fillText(L('水','water'),X(42),Yp(4.7));
  ctx.fillText(L('汽','vapor'),X(62),Yp(1.1));
  ctx.fillStyle=melted?'#ff6b6b':(Pc<611.65?'#74c0fc':'#ffa94d');
  ctx.beginPath();
  ctx.arc(X(clamp(Tp,TMIN,TMAX)),Yp(clamp(Math.log10(Math.max(2,Pc)),PMIN,PMAX)),8,0,7);
  ctx.fill();
}

/* ---- 控件事件 ---- */
$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  baseM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('冻干 · 让冰跳过水直接跑掉','Freeze-Drying');
  buildSteps();syncPlayBtn();drawPhase();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,accCake=0;
const mm4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const raw=clamp(clock.getDelta(),0,0.05);
  const dt=playing?raw*SPEED*timeMul:0;
  simT+=raw;
  phys(dt);
  /* 冰块退缩 */
  const h=0.5*Math.max(iceFrac,0)/0.9;
  const isIce=state()==='ice'&&h>0.04;
  ice.visible=isIce;
  if(isIce){ice.scale.y=Math.max(h,0.04)/0.5;ice.position.y=2.34+Math.max(h,0.04)/2;}
  const h2=0.3*Math.max(iceFrac,0)/0.9;
  mini1.visible=mini2.visible=state()==='ice'&&h2>0.05;
  if(mini1.visible){mini1.scale.y=h2/0.3;mini1.position.y=1.23+h2/2;mini2.scale.y=h2/0.3;mini2.position.y=1.23+h2/2;}
  pool.visible=melted;
  lblFront.position.y=iceTopY()+0.22;
  shelfM.emissiveIntensity=melted?0.25:clamp((Tsh-Tp)/60,0,1)*0.85;
  /* 蜂窝孔隙显隐 */
  accCake+=raw;
  if(accCake>0.1){
    accCake=0;
    const top=iceTopY();
    for(let i=0;i<NC;i++){
      const show=state()==='ice'&&cakeY[i]>top-0.02;
      mm4.makeScale(show?1:0.001,show?1:0.001,show?1:0.001);
      cake.setMatrixAt(i,mm4);
    }
    cake.instanceMatrix.needsUpdate=true;
  }
  updVapor(dt);
  acc+=raw;
  if(acc>0.15){acc=0;updateStats();drawPhase();}
  for(const r of labelReg){const vis=labelsOn&&r.vis();r.o.visible=vis;if(vis)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();
buildSteps();
applyLang();
setPbar(93.16);setTsh(45);setSpd(1);fresh();
const t0=Math.round(parseFloat(qs.get('t')));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
if(qs.get('pause')==='1')playing=false;
$('tglLabels').checked=labelsOn;
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
