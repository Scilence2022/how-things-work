<title>过拟合与正则化 · 把噪声穿在身上</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(230,73,128,.6);background:rgba(230,73,128,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(194,37,92,.55);background:rgba(194,37,92,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(230,73,128,.10);border-color:rgba(230,73,128,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(194,37,92,.08);border-color:rgba(194,37,92,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffd9e6}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,55);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(4.4,4.9,7.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,-0.2);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.56;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

/* ── 场景:x-y 数据平台,拟合曲线悬浮其上,残差柱竖起 ──
   数据坐标:x∈[-1,1] → 世界 X=3x;数值 y → 世界 Z=-1.15y;残差 → 柱高 */
const colM=new THREE.MeshStandardMaterial({color:0x272d38,roughness:0.8});
const platform=new THREE.Mesh(new THREE.BoxGeometry(6.8,0.16,3.8),colM);
platform.position.y=-0.08;scene.add(platform);
const grid=new THREE.GridHelper(6.8,14,0x54607a,0x3a414d);
grid.position.y=0.006;grid.material.transparent=true;grid.material.opacity=0.28;scene.add(grid);
const fTrue=x=>0.75*Math.sin(2.2*x);
const matTrue=new THREE.MeshStandardMaterial({color:0x9aa8b8,roughness:0.6});
{
  const pts=[];
  for(let i=0;i<=100;i++){const x=-1+2*i/100;
    pts.push(new THREE.Vector3(3*x,0.075,-1.15*fTrue(x)));}
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),100,0.02,8),matTrue));
}
const matFit=new THREE.MeshStandardMaterial({color:0xe64980,roughness:0.35,emissive:0xe64980,emissiveIntensity:0.3});
const fitMesh=new THREE.Mesh(new THREE.BufferGeometry(),matFit);scene.add(fitMesh);
let fitPts=[];
const markM=new THREE.MeshStandardMaterial({color:0xffa8c5,roughness:0.3,emissive:0xe64980,emissiveIntensity:0.9});
const marker=new THREE.Mesh(new THREE.SphereGeometry(0.075,14,12),markM);scene.add(marker);
const trainM=new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.4});
const testM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4});
const barTrainM=new THREE.MeshStandardMaterial({color:0x51cf66,transparent:true,opacity:0.72});
const barTestM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.72});
const sphGeo=new THREE.SphereGeometry(0.055,12,10);
const barGeo=new THREE.BoxGeometry(0.045,1,0.045);barGeo.translate(0,0.5,0);
const sphs=[],bars=[];
for(let i=0;i<40;i++){
  const s=new THREE.Mesh(sphGeo,trainM);s.visible=false;scene.add(s);sphs.push(s);
  const b=new THREE.Mesh(barGeo,barTrainM);b.visible=false;b.scale.y=0.02;scene.add(b);bars.push(b);
}
/* 系数板:|wᵏ| 条形图 */
const CW2=560,CH2=340;
const cnv=document.createElement('canvas');cnv.width=CW2;cnv.height=CH2;
const cx2=cnv.getContext('2d');
const tex=new THREE.CanvasTexture(cnv);tex.colorSpace=THREE.SRGBColorSpace;
const boardSide=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const boardFace=new THREE.MeshStandardMaterial({map:tex,roughness:0.85});
const board=new THREE.Mesh(new THREE.BoxGeometry(2.9,1.75,0.07),
  [boardSide,boardSide,boardSide,boardSide,boardFace,boardSide]);
board.position.set(0,1.4,-2.6);scene.add(board);
for(const sx of[-1.15,1.15]){
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.055,1.06,10),boardSide);
  post.position.set(sx,-0.07,-2.6);scene.add(post);
}

/* ── 数据与最小二乘(Chebyshev 基 + 岭稳定项) ── */
let nS=20,sig=0.22,deg=2,mode='no',lam=1,barsOn=true,playing=true,labelsOn=true,slowMo=false;
let samples=[],fit=null,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const bas=(x,k)=>Math.cos(k*Math.acos(clamp(x,-1,1)));
function fitAt(w,x){let s=0;for(let k=0;k<w.length;k++)s+=w[k]*bas(x,k);return s;}
/* 最小化 Σ(y-f)² + λΣ_{k≥1}w² :正规方程 (AᵀA+λI)w=Aᵀy,高斯消元 */
function solveLin(A,b,n){
  const M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let p=c;
    for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-13)return null;
    const tmp=M[c];M[c]=M[p];M[p]=tmp;
    for(let r=0;r<n;r++){
      if(r===c)continue;
      const f=M[r][c]/M[c][c];
      if(f===0)continue;
      for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];
    }
  }
  const w=new Float64Array(n);
  for(let i=0;i<n;i++)w[i]=M[i][n]/M[i][i];
  return w;
}
function computeFit(d,lambda){
  const K=d+1,m=samples.length;
  if(m<2)return null;
  const A=[];
  for(let i=0;i<m;i++){
    const r=new Float64Array(K);
    for(let k=0;k<K;k++)r[k]=bas(samples[i].x,k);
    A.push(r);
  }
  const Mt=Array.from({length:K},()=>new Float64Array(K));
  const b=new Float64Array(K);
  for(let i=0;i<m;i++){
    for(let a=0;a<K;a++){
      b[a]+=A[i][a]*samples[i].y;
      for(let c=0;c<=a;c++)Mt[a][c]+=A[i][a]*A[i][c];
    }
  }
  for(let a=0;a<K;a++)for(let c=0;c<a;c++)Mt[c][a]=Mt[a][c];
  for(let k=0;k<K;k++)Mt[k][k]+=(k===0?0:lambda)+1e-7;
  const w=solveLin(Mt,b,K);
  if(!w)return null;
  let st=0,nt=0,se=0,ne=0,wn=0;
  for(let i=0;i<m;i++){
    const e=fitAt(w,samples[i].x)-samples[i].y;
    if(samples[i].train){st+=e*e;nt++;}else{se+=e*e;ne++;}
  }
  for(let k=0;k<K;k++)wn+=w[k]*w[k];
  return{w,trms:nt?Math.sqrt(st/nt):0,erms:ne?Math.sqrt(se/ne):0,wn:Math.sqrt(wn)};
}
function resample(){
  samples=[];
  for(let i=0;i<nS;i++){
    const x=Math.random()*2-1;
    samples.push({x,y:fTrue(x)+sig*gauss(),train:Math.random()<0.7});
  }
  let guard=0;
  while(samples.filter(s=>s.train).length<Math.min(6,nS-3)&&guard++<60){
    const t=samples.find(s=>!s.train);if(t)t.train=true;else break;
  }
  guard=0;
  while(samples.filter(s=>!s.train).length<3&&guard++<60){
    const t=samples.find(s=>s.train);if(t)t.train=false;else break;
  }
  rebuildSamples();refit();
}
function rebuildSamples(){
  for(let i=0;i<40;i++){
    const on=i<samples.length;
    sphs[i].visible=on;bars[i].visible=on&&barsOn;
    if(on){
      const s=samples[i];
      sphs[i].position.set(3*s.x,0.06,-1.15*clamp(s.y,-1.6,1.6));
      sphs[i].material=s.train?trainM:testM;
      bars[i].position.set(3*s.x,0.012,-1.15*clamp(s.y,-1.6,1.6));
      bars[i].material=s.train?barTrainM:barTestM;
      bars[i].scale.y=0.02;
    }
  }
}
function refit(){
  const f=computeFit(deg,mode==='L2'?lam:0);
  if(!f)return;
  fit=f;
  fitPts=[];
  for(let i=0;i<=120;i++){
    const x=-1+2*i/120;
    const y=clamp(fitAt(f.w,x),-1.7,1.7);
    fitPts.push(new THREE.Vector3(3*x,0.145,-1.15*y));
  }
  const old=fitMesh.geometry;
  fitMesh.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(fitPts),120,0.038,8,false);
  old.dispose();
  for(let i=0;i<samples.length;i++){
    const s=samples[i];
    bars[i].userData.h=clamp(Math.abs(s.y-fitAt(f.w,s.x)),0.015,3);
  }
  drawBoard();updateStats();
}

/* ── 系数板绘制 ── */
const lamStr=l=>l>=1?l.toFixed(1):l.toFixed(3);
function drawBoard(){
  cx2.fillStyle='#f7f4ec';cx2.fillRect(0,0,CW2,CH2);
  cx2.strokeStyle='#cfc8b8';cx2.lineWidth=6;cx2.strokeRect(3,3,CW2-6,CH2-6);
  cx2.fillStyle='#5b6b7d';cx2.font='bold 19px sans-serif';cx2.textAlign='left';
  cx2.fillText(L('多项式系数 wᵏ(Chebyshev 基)','Polynomial weights wᵏ (Chebyshev)'),16,34);
  cx2.textAlign='right';
  if(!fit){tex.needsUpdate=true;return;}
  cx2.fillText(`‖w‖₂=${fit.wn.toFixed(1)}`,CW2-18,34);
  cx2.fillStyle=mode==='L2'?'#c2255c':'#8a94a4';
  cx2.font='bold 17px sans-serif';
  cx2.fillText(mode==='L2'?`λ=${lamStr(lam)}`:L('无正则','no reg.'),CW2-18,58);
  const K=fit.w.length,x0=44,x1=CW2-26,midY=210,H=104;
  let wmax=1e-9;for(let k=0;k<K;k++)wmax=Math.max(wmax,Math.abs(fit.w[k]));
  cx2.strokeStyle='#9aa5b5';cx2.lineWidth=1.5;
  cx2.beginPath();cx2.moveTo(x0,midY);cx2.lineTo(x1,midY);cx2.stroke();
  const slot=(x1-x0)/K,bw=Math.max(4,slot*0.55);
  for(let k=0;k<K;k++){
    const wv=fit.w[k],h=Math.abs(wv)/wmax*H;
    const bx=x0+slot*(k+0.5);
    cx2.fillStyle=h/H>0.02?'#c2255c':'#c2bcae';
    cx2.fillRect(bx-bw/2,wv>=0?midY-h:midY,bw,h);
  }
  cx2.fillStyle='#5b6b7d';cx2.font='11px sans-serif';cx2.textAlign='center';
  const step=K<=12?1:Math.ceil(K/8);
  for(let k=0;k<K;k+=step)cx2.fillText('w'+k,x0+slot*(k+0.5),midY+18);
  cx2.fillText(L('绿=训练残差 / 蓝=测试残差','green=train / blue=test residuals'),x0+60,CH2-14);
  tex.needsUpdate=true;
}

const lblTrue=addLabel(()=>L('真实规律 f(x)=0.75·sin2.2x','Truth f(x)=0.75·sin2.2x'),new THREE.Vector3(-3.45,0.4,0.95),'y');
const lblFit=addLabel(()=>L(`拟合曲线 · ${deg} 阶`,`Fit · degree ${deg}`),new THREE.Vector3(3.35,0.62,-0.55),'r');
const lblTrain=addLabel(()=>L('训练样本(拟合用)','Train (fit on these)'),new THREE.Vector3(-1.05,0.34,2.0),'g');
const lblTest=addLabel(()=>L('测试样本(只考不教)','Test (held out)'),new THREE.Vector3(1.05,0.34,2.0),'b');
const lblBoard=addLabel(()=>L('系数板 · Σ(y-f)²+λΣw²','Weight board · Σ(y-f)²+λΣw²'),new THREE.Vector3(0,2.5,-2.5),'o');

function setDeg(v){deg=clamp(v,1,15);
  document.getElementById('sDeg').value=deg;
  document.getElementById('sDegVal').textContent=deg+' '+L('阶','');
  refit();}
function setSig(v){sig=clamp(v,0,0.5);
  document.getElementById('sSig').value=sig;
  document.getElementById('sSigVal').textContent=sig.toFixed(2);
  resample();}
function setN(v){nS=clamp(v,12,40);
  document.getElementById('sN').value=nS;
  document.getElementById('sNVal').textContent=nS+' '+L('个','');
  resample();}
function setLamV(v){lam=Math.pow(10,-3+0.05*clamp(v,0,100));
  document.getElementById('sLam').value=clamp(v,0,100);
  document.getElementById('sLamVal').textContent='λ='+lamStr(lam);
  refit();}
function setMode(m){mode=m;
  document.getElementById('bNo').classList.toggle('on',m==='no');
  document.getElementById('bL2').classList.toggle('on',m==='L2');
  document.getElementById('sLam').disabled=(m==='no');
  refit();}
function autoLambda(){
  let best=1,bestE=1e9;
  for(let k=0;k<=26;k++){
    const l=Math.pow(10,-3+5*k/26);
    const f=computeFit(deg,l);
    if(f&&f.erms<bestE){bestE=f.erms;best=l;}
  }
  mode='L2';
  document.getElementById('bNo').classList.remove('on');
  document.getElementById('bL2').classList.add('on');
  document.getElementById('sLam').disabled=false;
  const v=Math.round((Math.log10(best)+3)/5*100);
  lam=best;
  document.getElementById('sLam').value=clamp(v,0,100);
  document.getElementById('sLamVal').textContent='λ='+lamStr(lam);
  refit();
}

const STEPS=[
 {zh:'<b>样本=信号+噪声</b>:每个点都是真实规律 f(x) 加一份运气——数据里永远掺着噪声',
  en:'<b>Samples = signal + noise</b>: every point is the true f(x) plus a splash of luck — noise is baked in',
  act(){setMode('no');setDeg(2);}},
 {zh:'<b>低阶欠拟合</b>:一条直线掰不弯,追不上正弦——训练、测试误差两头都差',
  en:'<b>Underfitting</b>: a straight line cannot bend to follow the wave — both errors stay high',
  act(){setMode('no');setDeg(1);}},
 {zh:'<b>阶数升高</b>:容量变大,训练误差单调下降——模型开始逐点「记住」数据',
  en:'<b>Crank the degree</b>: more capacity, training error falls monotonically — the model starts memorizing',
  act(){setMode('no');setDeg(5);}},
 {zh:'<b>阶数过高</b>:15 阶曲线把每个噪声点都穿在身上——训练误差≈0,测试误差一飞冲天',
  en:'<b>Too high</b>: the degree-15 curve wears every noise point on its sleeve — train error ≈ 0, test error explodes',
  act(){setMode('no');setDeg(15);}},
 {zh:'<b>U 型谷底</b>:偏差-方差跷跷板;点「重新采样」再看——高阶曲线的形状每次都大变,这就是方差',
  en:'<b>The U valley</b>: bias-variance seesaw; hit Resample — the wild curve changes shape every draw, that is variance',
  act(){setMode('no');setDeg(15);resample();}},
 {zh:'<b>L2 正则</b>:λΣw² 把系数往零拉、曲线变钝;L1 更狠,直接把系数压成 0 得到稀疏模型',
  en:'<b>L2 ridge</b>: λΣw² pulls weights toward zero and blunts the curve; L1 goes further — exact zeros, sparse models',
  act(){setMode('L2');setLamV(70);}},
 {zh:'<b>验证集找谷底</b>:扫描 λ,用没参与训练的数据挑泛化最好的模型——别对着训练误差调',
  en:'<b>Validate to find the valley</b>: sweep λ and let held-out data pick the best generalizer — never tune on training error',
  act(){autoLambda();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

function updateStats(){
  if(!fit)return;
  document.getElementById('stTr').innerHTML=fit.trms.toFixed(3)+'<small> rms</small>';
  const te=document.getElementById('stTe'),rt=document.getElementById('stRat');
  te.innerHTML=fit.erms.toFixed(3)+'<small> rms</small>';
  const r=fit.trms>1e-9?fit.erms/fit.trms:1;
  te.className='v '+(r>2?'warn':r<1.3?'ok':'');
  document.getElementById('stW').innerHTML=fit.wn.toFixed(1)+'<small> </small>';
  rt.innerHTML='×'+r.toFixed(1);
  rt.className='v '+(r>2?'warn':r<1.3?'ok':'');
}

document.getElementById('bNo').addEventListener('click',()=>setMode('no'));
document.getElementById('bL2').addEventListener('click',()=>setMode('L2'));
document.getElementById('bSample').addEventListener('click',()=>resample());
document.getElementById('sDeg').addEventListener('input',e=>setDeg(+e.target.value));
document.getElementById('sSig').addEventListener('input',e=>setSig(+e.target.value));
document.getElementById('sN').addEventListener('input',e=>setN(+e.target.value));
document.getElementById('sLam').addEventListener('input',e=>setLamV(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglBars').addEventListener('change',e=>{
  barsOn=e.target.checked;
  for(let i=0;i<samples.length;i++)bars[i].visible=barsOn;
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  colM.color.setHex(dark?0x272d38:0xded7c9);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('sDegVal').textContent=deg+' '+L('阶','');
  document.getElementById('sNVal').textContent=nS+' '+L('个','');
  drawBoard();
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 残差柱弹性生长 */
  for(let i=0;i<samples.length;i++){
    const b=bars[i],h=b.userData.h||0.02;
    b.scale.y+=(h-b.scale.y)*Math.min(1,dt*7);
  }
  /* 巡检小球沿拟合曲线走,读出模型在每个 x 的输出 */
  if(fitPts.length>2){
    const u=(simT*0.2)%1,idx=u*(fitPts.length-1);
    const i0=Math.floor(idx),i1=Math.min(fitPts.length-1,i0+1),f=idx-i0;
    marker.position.copy(fitPts[i0]).lerp(fitPts[i1],f);
    marker.visible=true;
    const pulse=1+0.15*Math.sin(simT*5);
    marker.scale.setScalar(pulse);
  }else marker.visible=false;
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
resample();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
