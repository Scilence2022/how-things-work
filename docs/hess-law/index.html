{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const mix=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,64);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,200);
camera.position.set(0.8,5.6,16.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.0,1.5,-0.5);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 能量地形:高程=焓(kJ),两条路线走廊;整组斜置增加纵深 ── */
const H_CO=-110.5,H_C2=-393.5,SC=0.0045,Y0=0.42,ZD=-1.5,ZS=1.5,SG=1.35;
const terrG=new THREE.Group();terrG.position.set(-1.2,0,-0.8);terrG.rotation.y=-0.611;scene.add(terrG);
const kY=e=>Y0+(e+400)*SC;
const gm=(u,c,w)=>Math.exp(-(((u-c)/w)**2));
function Ed(u){let e=H_C2*u+330*gm(u,0.5,0.19);          /* 直接:一座大山 */
  e=mix(e,0,gm(u,0,0.06));return mix(e,H_C2,gm(u,1,0.06));}
function Es(u){let e;                                      /* 分步:CO 台地+两个小垭口 */
  if(u<0.35)e=H_CO*u/0.35+90*gm(u,0.16,0.07);
  else if(u<0.42)e=H_CO;
  else e=H_CO-283.0*(u-0.42)/0.58+110*gm(u,0.68,0.10);
  e=mix(e,0,gm(u,0,0.06));e=mix(e,H_CO,gm(u,0.385,0.035));return mix(e,H_C2,gm(u,1,0.06));}
function terE(xl,z){const u=(xl+5)/10,
  wd=Math.exp(-(((z-ZD)/SG)**2)),ws=Math.exp(-(((z-ZS)/SG)**2));
  return (wd*Ed(u)+ws*Es(u))/(wd+ws);}
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const NX=121,NZ=73;
const terrM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92,metalness:0.05,side:THREE.DoubleSide});
const terrFlatM=new THREE.MeshStandardMaterial({color:0x51606e,roughness:0.92,side:THREE.DoubleSide});
let terrainMesh;
(function buildTerrain(){
  const pos=[],col=[],idx=[],c=new THREE.Color(),c2=new THREE.Color();
  const stops=[[0,0x24344d],[0.32,0x2e5f66],[0.55,0x4f7358],[0.75,0x9c8354],[1,0xc98a4b]];
  for(let iz=0;iz<NZ;iz++)for(let ix=0;ix<NX;ix++){
    const xl=mix(-5.4,5.4,ix/(NX-1)),z=mix(-3.7,3.7,iz/(NZ-1)),e=terE(xl,z);
    pos.push(xl,kY(e),z);
    const t=clamp((e+420)/560,0,1);let s=0;
    while(s<stops.length-2&&t>stops[s+1][0])s++;
    const f=clamp((t-stops[s][0])/(stops[s+1][0]-stops[s][0]),0,1);
    c.setHex(stops[s][1]).lerp(c2.setHex(stops[s+1][1]),f);
    const band=(Math.floor((e+420)/50)%2===0)?1:0.78;
    col.push(c.r*band,c.g*band,c.b*band);
  }
  const vi=(ix,iz)=>iz*NX+ix;
  for(let iz=0;iz<NZ-1;iz++)for(let ix=0;ix<NX-1;ix++){
    const a=vi(ix,iz),b=vi(ix+1,iz),d=vi(ix,iz+1),e2=vi(ix+1,iz+1);
    idx.push(a,d,e2,a,e2,b);
  }
  const ring=[];
  for(let ix=0;ix<NX;ix++)ring.push(vi(ix,0));
  for(let iz=1;iz<NZ;iz++)ring.push(vi(NX-1,iz));
  for(let ix=NX-2;ix>=0;ix--)ring.push(vi(ix,NZ-1));
  for(let iz=NZ-2;iz>=1;iz--)ring.push(vi(0,iz));
  const b0=pos.length/3;
  for(const v of ring){pos.push(pos[v*3],Y0-0.04,pos[v*3+2]);col.push(0.10,0.12,0.15);}
  for(let i=0;i<ring.length;i++){const j=(i+1)%ring.length;
    idx.push(ring[i],b0+i,b0+j,ring[i],b0+j,ring[j]);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  terrainMesh=new THREE.Mesh(g,terrM);terrG.add(terrainMesh);
})();
const plinth=new THREE.Mesh(new THREE.BoxGeometry(11.5,0.42,8.0),
  new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.85}));
plinth.position.set(0,0.19,0);terrG.add(plinth);
/* 路线导线与发光小球 */
function routeLine(fn,z,hex){const pts=[];for(let i=0;i<=140;i++){const u=i/140;
    pts.push(new THREE.Vector3(-5+10*u,kY(fn(u))+0.02,z));}
  const m=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:0.3}));
  terrG.add(m);return m;}
const lineD=routeLine(Ed,ZD,0xff8a3d),lineS=routeLine(Es,ZS,0xffd25c);
const ballM=new THREE.MeshStandardMaterial({color:0xffc890,emissive:0xff8a3d,emissiveIntensity:1.5,roughness:0.4});
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.15,20,16),ballM);terrG.add(ball);
ball.add(new THREE.PointLight(0xff9a4d,8,5));
function beacon(x,y,z,hex){const m=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.55,8),
  new THREE.MeshStandardMaterial({color:hex,emissive:hex,emissiveIntensity:0.9,roughness:0.5}));
  m.position.set(x,y+0.28,z);terrG.add(m);}
beacon(-5,kY(0),0,0x74c0fc);beacon(-1.15,kY(H_CO),ZS,0xffd25c);beacon(5,kY(H_C2),0,0x8ce99a);

/* ── 量热计:透明保温杯+水+搅拌子+温度计+数显(前景右下) ── */
const cupG=new THREE.Group();cupG.position.set(4.0,0,4.6);scene.add(cupG);
const cup=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.86,1.95,36,1,true),
  new THREE.MeshStandardMaterial({color:0xd8d4c8,roughness:0.3,metalness:0.05,transparent:true,opacity:0.4,side:THREE.DoubleSide}));
cup.position.set(0,1.07,0);cup.renderOrder=2;cupG.add(cup);
const rim=new THREE.Mesh(new THREE.TorusGeometry(0.99,0.055,10,40),
  new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:0.6}));
rim.rotation.x=Math.PI/2;rim.position.set(0,2.05,0);cupG.add(rim);
const waterM=new THREE.MeshStandardMaterial({color:0x3f8fd2,transparent:true,opacity:0.72,roughness:0.25});
const water=new THREE.Mesh(new THREE.CylinderGeometry(0.83,0.83,1.2,28),waterM);
water.position.set(0,1.05,0);water.renderOrder=1;cupG.add(water);
const podM=new THREE.MeshStandardMaterial({color:0x51443a,emissive:0xff7a2d,emissiveIntensity:0.3,roughness:0.6});
const pod=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,0.1,20),podM);
pod.position.set(0,0.5,0);cupG.add(pod);
const stirG=new THREE.Group();stirG.position.set(0,0.62,0);cupG.add(stirG);
const stir=new THREE.Mesh(new THREE.CapsuleGeometry(0.055,0.3,6,12),
  new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:0.4}));
stir.rotation.z=Math.PI/2;stirG.add(stir);
const therm=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.9,12),
  new THREE.MeshStandardMaterial({color:0xf0ede6,roughness:0.35}));
therm.position.set(0.3,2.32,0);cupG.add(therm);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,12),
  new THREE.MeshStandardMaterial({color:0xff5a5a,emissive:0xff3333,emissiveIntensity:0.5,roughness:0.4}));
bulb.position.set(0.3,1.4,0);cupG.add(bulb);
const disp=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.55,0.09),
  new THREE.MeshStandardMaterial({color:0x14171c,roughness:0.5,emissive:0x1b3a52,emissiveIntensity:0.5}));
disp.position.set(3.2,1.5,5.5);disp.rotation.y=-0.25;scene.add(disp);
const dispLeg=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.4,10),
  new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4}));
dispLeg.position.set(3.2,0.7,5.5);scene.add(dispLeg);
const NB=18,bubbles=new THREE.InstancedMesh(new THREE.SphereGeometry(0.032,8,8),
  new THREE.MeshBasicMaterial({color:0xcfe8ff,transparent:true,opacity:0.75}),NB);
bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);bubbles.renderOrder=1;cupG.add(bubbles);
const bd=[];for(let i=0;i<NB;i++)bd.push({a:Math.random()*6.28,r:Math.random()*0.5+0.1,y:Math.random()+0.5,s:0.5+Math.random()*0.7});

/* ── 状态 ── */
let route='d',react='cco2',mass=200,T0w=20,p=0,playing=true,labelsOn=true,slowMo=false,contour=true;
let ledger=0,Tnow=20,dT=0,holdT=0,stirA=0,simT=0,totals={d:H_C2,s:H_C2};
const DH={cco2:-393.5,coco2:-283.0,cco:-110.5};
const RN={cco2:{zh:'C + O₂ → CO₂ · 实测',en:'C + O₂ → CO₂ · measured'},
  coco2:{zh:'CO + ½O₂ → CO₂ · 实测',en:'CO + ½O₂ → CO₂ · measured'},
  cco:{zh:'C + ½O₂ → CO · 盖斯推算',en:'C + ½O₂ → CO · Hess-derived'}};
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0p=-1;if(qs.get('t')!==null){t0p=parseInt(qs.get('t'))||0;}
const dTt=()=>Math.abs(DH[react])*0.01*1000/(mass*4.18);   /* Q=n|ΔH|, ΔT=Q/(mc) */

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;}
addLabel(()=>L('反应物 C + O₂ · 0 kJ','Reactants C + O₂ · 0 kJ'),new THREE.Vector3(-5.5,kY(0)+0.75,0.8),'b',()=>true,terrG);
addLabel(()=>L('中间物 CO · -110.5 kJ','Intermediate CO · -110.5 kJ'),new THREE.Vector3(-1.15,kY(H_CO)+0.55,ZS),'y',()=>true,terrG);
addLabel(()=>L('生成物 CO₂ · -393.5 kJ','Products CO₂ · -393.5 kJ'),new THREE.Vector3(4.6,kY(H_C2)+0.6,-0.3),'g',()=>true,terrG);
addLabel(()=>L('直接 · 一步翻大山(能垒示意)','Direct · one big pass (schematic)'),new THREE.Vector3(0,kY(Ed(0.5))+0.42,ZD),'o',()=>true,terrG);
addLabel(()=>L('分步 · 经 CO 两个小垭口','Stepwise · two small saddles via CO'),new THREE.Vector3(1.8,kY(Es(0.68))+0.4,ZS),'o',()=>true,terrG);
addLabel(()=>'-110.5 + (-283.0) = -393.5 kJ/mol',new THREE.Vector3(1.0,0.72,3.35),'g',()=>true,terrG);
const ballLbl=addLabel(()=>`${L('ΔH 累计 ','ΔH so far ')}${ledger.toFixed(1)} kJ/mol`,new THREE.Vector3(0,0.45,0),'r',()=>true,terrG);
addLabel(()=>L(`反应:${RN[react].zh}`,`Reaction: ${RN[react].en}`),new THREE.Vector3(0,2.7,0),'o',()=>true,cupG);
addLabel(()=>`${Tnow.toFixed(1)} °C · ΔT ${dT>=0?'+':''}${dT.toFixed(1)} · Q ${(mass*4.18*dT/1000).toFixed(2)} kJ`,
  new THREE.Vector3(3.2,1.52,5.56),'b');

const $=id=>document.getElementById(id);
function setRoute(r){route=r;
  $('bDirect').classList.toggle('on',r==='d');$('bStep').classList.toggle('on',r==='s');
  lineD.material.opacity=r==='d'?0.95:0.3;lineS.material.opacity=r==='s'?0.95:0.3;updateStats();}
function setReaction(r){react=r;
  $('bR1').classList.toggle('on',r==='cco2');$('bR2').classList.toggle('on',r==='coco2');
  $('bR3').classList.toggle('on',r==='cco');updateStats();}
function setMass(v){mass=clamp(v,50,250);$('sMass').value=mass;
  $('sMassVal').textContent=mass.toFixed(0)+' g';updateStats();}
function setT0(v){T0w=clamp(v,5,35);$('sT0').value=T0w;
  $('sT0Val').textContent=T0w.toFixed(0)+' °C';updateStats();}
function setProgress(v){p=clamp(v,0,1);holdT=0;$('sProg').value=p*100;
  $('sProgVal').textContent=(p*100).toFixed(0)+' %';updateStats();}
function setPlay(v){playing=v;syncPlayBtn();}

const STEPS=[
 {zh:'<b>焓是状态函数</b>:ΔH 只认起点终点,像海拔差,与路径无关',en:'<b>Enthalpy is a state function</b>: ΔH reads only the endpoints, like elevation difference — never the route',
  act(){setRoute('d');setReaction('cco2');setMass(200);setT0(20);setProgress(0);}},
 {zh:'<b>直接路径</b>:一步烧成 CO₂,翻过能垒大山,账本落到 −393.5',en:'<b>Direct route</b>: burn straight to CO₂ over the barrier mountain — the ledger lands on −393.5',
  act(){setRoute('d');setProgress(0);setPlay(true);}},
 {zh:'<b>分步路径</b>:先到 CO 中间站(−110.5),再翻两个小垭口',en:'<b>Stepwise route</b>: stop at the CO waystation (−110.5), then two small saddles',
  act(){setRoute('s');setProgress(0);setPlay(true);}},
 {zh:'<b>账本对账</b>:−110.5 + (−283.0) = −393.5,两条路读数对齐',en:'<b>Audit the ledger</b>: −110.5 + (−283.0) = −393.5 — both routes read the same',
  act(){setRoute('s');setProgress(1);setPlay(false);}},
 {zh:'<b>量热计实测</b>:Q=mcΔT,水量调大、同样的热升温更小',en:'<b>Calorimeter</b>: Q=mcΔT — more water, smaller rise for the same heat',
  act(){setRoute('d');setReaction('cco2');setMass(120);setProgress(0);setPlay(true);}},
 {zh:'<b>盖斯定律反推</b>:C→CO 难单独测,−393.5 − (−283.0) = −110.5 算出',en:'<b>Hess back-calculation</b>: C→CO resists direct measurement — −393.5 − (−283.0) = −110.5 for free',
  act(){setRoute('s');setReaction('cco');setProgress(0.35);setPlay(false);}},
];
let activeStep=0;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  $('stProg').innerHTML=(p*100).toFixed(0)+'<small> %</small>';
  const dv=$('stDh');
  dv.innerHTML=ledger.toFixed(1)+'<small> kJ/mol</small>';
  dv.className='v '+(p>=0.999?'ok':'');
  const tv=$('stT');
  tv.innerHTML=Tnow.toFixed(1)+'<small> °C</small>';
  tv.className='v '+(dT>10?'warn':'ok');
  const diff=Math.abs(totals.d-totals.s),fv=$('stDiff');
  fv.innerHTML=diff.toFixed(2)+'<small> kJ</small>';
  fv.className='v '+(diff<0.5?'ok':'warn');
}

$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
$('bDirect').addEventListener('click',()=>setRoute('d'));
$('bStep').addEventListener('click',()=>setRoute('s'));
$('bR1').addEventListener('click',()=>setReaction('cco2'));
$('bR2').addEventListener('click',()=>setReaction('coco2'));
$('bR3').addEventListener('click',()=>setReaction('cco'));
$('sMass').addEventListener('input',e=>setMass(+e.target.value));
$('sProg').addEventListener('input',e=>setProgress(+e.target.value/100));
$('sT0').addEventListener('input',e=>setT0(+e.target.value));
$('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
$('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
$('tglContour').addEventListener('change',e=>{contour=e.target.checked;terrainMesh.material=contour?terrM:terrFlatM;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();let raf=null;
const cCold=new THREE.Color(0x3f8fd2),cWarm=new THREE.Color(0xe0854f),m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(playing){p+=dts*0.12;
    if(p>=1){p=1;holdT+=dts;if(holdT>1.2){p=0;holdT=0;}}}
  const fn=route==='d'?Ed:Es;
  ledger=fn(p);
  if(Math.abs(ledger)<0.05)ledger=0;
  if(p>=0.999)totals[route]=ledger;
  ball.position.set(-5+10*p,kY(fn(p))+0.15,route==='d'?ZD:ZS);
  ball.scale.setScalar(1+0.06*Math.sin(simT*6));
  ballLbl.position.copy(ball.position);
  /* 量热计:T→T0+ΔT·(1-e^-6p),Q=mcΔT */
  Tnow=T0w+dTt()*(1-Math.exp(-6*p));
  dT=Tnow-T0w;
  const hf=clamp(dT/12,0,1);
  waterM.color.lerpColors(cCold,cWarm,hf);
  waterM.emissive.setHex(0xff7a2d);waterM.emissiveIntensity=hf*0.18;
  stirA+=dt*14;stirG.rotation.y=stirA;
  const reactI=clamp(6*Math.exp(-6*p),0,1)*(playing?1:0);
  podM.emissiveIntensity=0.25+1.5*reactI;
  bubbles.visible=reactI>0.05;
  if(bubbles.visible)for(let i=0;i<NB;i++){const b=bd[i];
    b.y+=dts*b.s*(0.4+reactI);
    if(b.y>1.6){b.y=0.55;b.a=Math.random()*6.28;b.r=Math.random()*0.5+0.1;}
    m4.makeScale(1,1,1);m4.setPosition(Math.cos(b.a)*b.r,b.y,Math.sin(b.a)*b.r);
    bubbles.setMatrixAt(i,m4);}
  if(bubbles.visible)bubbles.instanceMatrix.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();
    if(document.activeElement!==$('sProg')){$('sProg').value=p*100;
      $('sProgVal').textContent=(p*100).toFixed(0)+' %';}}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
$('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0p>=0&&t0p<STEPS.length){applyPhase(t0p);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
