<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>味觉与味蕾 · 五种基本味的分子入口</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e64980;
    --bg:#131016;--panel:rgba(19,16,22,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(19,16,22,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(19,16,22,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c2255c;
    --bg:#f2edee;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}.lbl.p{border-color:rgba(242,132,158,.9);color:#ffd8e2}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}:root[data-theme="light"] .lbl.p{color:#c2255c}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(230,73,128,.6);background:rgba(230,73,128,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(194,37,92,.55);background:rgba(194,37,92,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(230,73,128,.10);border-color:rgba(230,73,128,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(194,37,92,.08);border-color:rgba(194,37,92,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffd3e2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="味觉与味蕾" data-en="Taste Receptors &amp; Taste Buds">味觉与味蕾</h1>
  <div class="sub" data-zh="五种基本味各有分子入口→咸:Na⁺ 直灌阿米洛利敏感 ENaC 钠通道;酸:H⁺ 涌入并封锁 K⁺ 通道使细胞去极化;甜(T1R2/T1R3)与鲜(T1R1/T1R3)走 GPCR→味转导素→第二信使;苦(T2R 家族约 25 种)受体最多、阈值最低——毒物警报优先→味蕾 50~100 个受体细胞埋在上皮、微绒毛伸进味孔→面神经/舌咽/迷走三对颅神经分片接管→「风味」大半来自鼻后嗅觉 · 拖动旋转 / 空格运行/暂停" data-en="Five basic tastes enter through their own molecular gate → salt: Na⁺ pours straight through amiloride-sensitive ENaC channels; sour: H⁺ streams in and blocks K⁺ leak channels, depolarizing the cell; sweet (T1R2/T1R3) and umami (T1R1/T1R3) ride GPCRs → gustducin → second messengers; bitter (T2R family, ~25 types) has the most receptors and the lowest threshold — a priority poison alarm → each bud packs 50–100 receptor cells buried in epithelium, microvilli reaching the taste pore → facial/glossopharyngeal/vagus nerves partition the tongue → most 'flavor' is retronasal smell · drag to orbit / Space = run/pause">五种基本味各有分子入口→咸:Na⁺ 直灌阿米洛利敏感 ENaC 钠通道;酸:H⁺ 涌入并封锁 K⁺ 通道使细胞去极化;甜(T1R2/T1R3)与鲜(T1R1/T1R3)走 GPCR→味转导素→第二信使;苦(T2R 家族约 25 种)受体最多、阈值最低——毒物警报优先→味蕾 50~100 个受体细胞埋在上皮、微绒毛伸进味孔→面神经/舌咽/迷走三对颅神经分片接管→「风味」大半来自鼻后嗅觉 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="检出阈值" data-en="Threshold">检出阈值</span><span class="v" id="stThr">—</span>
  <span class="k" data-zh="激活受体" data-en="Receptor">激活受体</span><span class="v" id="stRec" style="font-size:13px">—</span>
  <span class="k" data-zh="动作电位频率" data-en="Spike rate">动作电位频率</span><span class="v" id="stFr">—</span>
  <span class="k" data-zh="传导神经" data-en="Nerve">传导神经</span><span class="v" id="stNrv" style="font-size:13px">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSalt" data-zh="咸 Na⁺" data-en="Salt Na⁺">咸 Na⁺</button>
    <button class="abtn" id="bSour" data-zh="酸 H⁺" data-en="Sour H⁺">酸 H⁺</button>
    <button class="abtn" id="bSweet" data-zh="甜 T1R2/T1R3" data-en="Sweet T1R2/T1R3">甜 T1R2/T1R3</button>
    <button class="abtn" id="bBitter" data-zh="苦 T2R" data-en="Bitter T2R">苦 T2R</button>
    <button class="abtn" id="bUmami" data-zh="鲜 T1R1/T1R3" data-en="Umami T1R1/T1R3">鲜 T1R1/T1R3</button>
  </div>
  <div class="row">
    <label data-zh="刺激物浓度" data-en="Stimulus conc.">刺激物浓度</label>
    <input id="sConc" type="range" min="0" max="100" step="1" value="55">
    <span class="val" id="sConcVal">—</span>
  </div>
  <div class="row">
    <label data-zh="唾液冲刷" data-en="Saliva flow">唾液冲刷</label>
    <input id="sSal" type="range" min="0" max="10" step="1" value="3">
    <span class="val" id="sSalVal">—</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../olfactory-receptor/" data-zh="嗅觉受体" data-en="Olfactory Receptor">嗅觉受体</a>
    <a href="../action-potential/" data-zh="动作电位" data-en="Action Potential">动作电位</a>
    <a href="../synaptic-transmission/" data-zh="突触传递" data-en="Synaptic Transmission">突触传递</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x131016,11,30);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(0.1,2.0,8.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,0.15,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=20;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xf2dbe2,0x1a1418,0.55));
const key=new THREE.DirectionalLight(0xfff0e8,1.0);key.position.set(5,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:左侧舌面乳头,右侧单个味蕾剖面 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1d1920,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.55;scene.add(ground);
const budX=2.0;
/* 舌面:粉色弯面 + 菌状乳头 */
const tongueM=new THREE.MeshStandardMaterial({color:0xb3556a,roughness:0.55});
const tongue=new THREE.Mesh(new THREE.SphereGeometry(2.1,36,22),tongueM);
tongue.scale.set(1.05,0.30,0.85);tongue.position.set(-3.7,0.15,0);scene.add(tongue);
const papM=new THREE.MeshStandardMaterial({color:0xe3a7b3,roughness:0.5});
const papPos=[];
for(let i=0;i<26;i++){
  const a=i*2.39996+0.5,rr=0.26+0.85*Math.sqrt(((i*7)%13)/13);
  const px=-3.7+Math.cos(a)*rr*1.02,pz=Math.sin(a)*rr*0.8;
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.115,10,8),papM);
  p.scale.y=0.62;p.position.set(px,0.76+0.03*(i%3),pz);scene.add(p);papPos.push(p.position.clone());
}
/* 高亮乳头 + 放大指示线(乳头→味蕾剖面) */
const hiPap=papPos[0];
const ring=new THREE.Mesh(new THREE.TorusGeometry(0.21,0.02,8,32),
  new THREE.MeshBasicMaterial({color:0xe64980}));
ring.rotation.x=Math.PI/2;ring.position.set(hiPap.x,0.92,hiPap.z);scene.add(ring);
const zoomGeo=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(hiPap.x+0.18,0.94,hiPap.z),new THREE.Vector3(0.35,1.7,0),
  new THREE.Vector3(0.35,-0.35,0),new THREE.Vector3(0.95,-0.35,0)]);
scene.add(new THREE.Line(zoomGeo,new THREE.LineBasicMaterial({color:0x8a94a4,transparent:true,opacity:0.5})));
/* 上皮:味孔两侧的上皮块 + 底膜 */
const epiM=new THREE.MeshStandardMaterial({color:0xd8a0ac,roughness:0.6});
for(const s of [-1,1]){
  const slab=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.62,1.0),epiM);
  slab.position.set(budX+s*1.28,1.24,0);scene.add(slab);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.2,1.0),epiM);
  lip.position.set(budX+s*0.66,1.62,0);scene.add(lip);
}
const bmM=new THREE.MeshStandardMaterial({color:0x9a6572,roughness:0.7});
const bm=new THREE.Mesh(new THREE.BoxGeometry(3.9,0.1,1.0),bmM);
bm.position.set(budX,-0.94,0);scene.add(bm);
/* 味蕾外形(旋转轮廓,半透明) */
const prof=[[0.30,-0.90],[0.62,-0.55],[0.86,0.05],[0.92,0.55],[0.70,0.95],[0.44,1.18],[0.30,1.32]];
const budPts=prof.map(p=>new THREE.Vector2(p[0],p[1]));
const budShellM=new THREE.MeshStandardMaterial({color:0xf0d4dc,roughness:0.6,transparent:true,
  opacity:0.13,side:THREE.DoubleSide,depthWrite:false});
const budShell=new THREE.Mesh(new THREE.LatheGeometry(budPts,28),budShellM);
budShell.position.x=budX;scene.add(budShell);
/* 味孔 */
const pore=new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,0.18,16),
  new THREE.MeshStandardMaterial({color:0x40242e,roughness:0.8}));
pore.position.set(budX,1.44,0);scene.add(pore);
/* 受体细胞:8 个梭形细胞排成两列微扇形,微绒毛入孔、神经纤维出底 */
function tube(a,b,r,mat){
  const dir=new THREE.Vector3().subVectors(b,a);const len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,6),mat);
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  scene.add(m);return m;
}
const cellGeo=new THREE.CapsuleGeometry(0.105,0.6,4,10);
const villusM=new THREE.MeshStandardMaterial({color:0xf2e0e6,roughness:0.4});
const fibM=new THREE.MeshStandardMaterial({color:0xd9cfae,roughness:0.5});
const cellTilts=[-0.52,-0.26,0,0.26,0.52];
const cells=[];
for(let rg=0;rg<2;rg++){
  const z=rg?0.18:-0.18;
  cellTilts.forEach((tilt,k)=>{
    if(rg===1&&(k===0||k===4))return;
    const cm=new THREE.MeshStandardMaterial({color:0xc9dde8,roughness:0.5,emissive:0xe64980,emissiveIntensity:0});
    const c=new THREE.Mesh(cellGeo,cm);
    c.position.set(budX+Math.sin(tilt)*0.46,0.08,z);c.rotation.z=-tilt;scene.add(c);
    const top=new THREE.Vector3(budX+Math.sin(tilt)*0.46+0.42*Math.sin(tilt),0.08+0.42*Math.cos(tilt),z);
    const bot=new THREE.Vector3(budX+Math.sin(tilt)*0.46-0.38*Math.sin(tilt),0.08-0.40*Math.cos(tilt),z*0.8);
    tube(top,new THREE.Vector3(budX+Math.sin(tilt)*0.14,1.26,z*0.8),0.012,villusM);
    tube(bot,new THREE.Vector3(budX+Math.sin(tilt)*0.30,-0.90,z*0.5),0.014,fibM);
    cells.push({cm,flash:0});
  });
}

const nerveCurve=new THREE.CatmullRomCurve3([

/* 状态 */

const labelReg=[];

const lblTongue=addLabel(()=>L('舌面 · 菌状乳头(每 3~5 个埋 1 枚味蕾)','Tongue · fungiform papilla (1 bud per 3–5)'),

const lblTrunk=addLabel(()=>{

function setC(c){cUmol=clamp(c,10,100000);
  document.getElementById('sConc').value=Math.round((Math.log10(cUmol)-1)/0.04);
  document.getElementById('sConcVal').textContent=fmtConc(cUmol);updateStats();}
function setSal(v){saliva=clamp(v,0,10);
  document.getElementById('sSal').value=saliva;
  document.getElementById('sSalVal').textContent=(saliva*0.7).toFixed(1)+' mL/min';}
function setTaste(k){taste=k;const T=TAST[k];
  const map={salt:'bSalt',sour:'bSour',sweet:'bSweet',bitter:'bBitter',umami:'bUmami'};
  for(const id of Object.values(map))document.getElementById(id).classList.remove('on');
  document.getElementById(map[k]).classList.add('on');
  molMat.color.setHex(T.col);molMat.emissive.setHex(T.col);
  updateStats();}

const STEPS=[
 {b:'乳头里的味蕾',be:'Papillae hide taste buds',
  d:'每个味蕾是 50~100 个梭形受体细胞竖插在上皮里的「洋葱」:顶端微绒毛穿过约 2 µm 的味孔接触唾液,底部触到神经末梢——细胞自己从不变成神经,只做换能器。',
  de:'Each bud is an "onion" of 50–100 spindle receptor cells buried in epithelium: apical microvilli reach saliva through a ~2 µm taste pore, basal ends touch nerve endings — the cells never become neurons, they are pure transducers.',

 {b:'咸:Na⁺ 直灌钠通道',be:'Salt: Na⁺ straight through ENaC',
  d:'Na⁺ 直接流进阿米洛利敏感的 ENaC 钠通道,细胞内正电荷堆积即去极化——不走第二信使,是最"电路"的味觉;阿米洛利堵孔后咸味明显变钝。',

 {b:'酸:H⁺ 涌入 + 封锁 K⁺',be:'Sour: H⁺ in + K⁺ blocked',

  de:'~25 T2R receptors each watch a class of alkaloids/toxins, with thresholds in single-digit µmol/L — sugar needs ~15,000 µmol/L to register, quinine alarms at 8: evolution prefers false positives to a missed poison.',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const T=TAST[taste];
  const dose=cUmol/(cUmol+T.ec50);
  const resp=clamp(adapt*dose,0,1),freq=T.fmax*resp;
  document.getElementById('stThr').innerHTML=T.thr.toLocaleString('en-US')+'<small> µmol/L</small>';
  document.getElementById('stRec').textContent=L(T.rec,T.recEn);
  const fEl=document.getElementById('stFr');
  fEl.innerHTML=freq.toFixed(1)+'<small> Hz</small>';
  fEl.className='v '+(cUmol<T.thr?'ok':'');
  document.getElementById('stNrv').textContent=L(T.nrv,T.nrvEn);
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSalt').addEventListener('click',()=>setTaste('salt'));
document.getElementById('bSour').addEventListener('click',()=>setTaste('sour'));
document.getElementById('bSweet').addEventListener('click',()=>setTaste('sweet'));
document.getElementById('bBitter').addEventListener('click',()=>setTaste('bitter'));
document.getElementById('bUmami').addEventListener('click',()=>setTaste('umami'));
document.getElementById('sConc').addEventListener('input',e=>setC(Math.pow(10,1+0.04*(+e.target.value))));
document.getElementById('sSal').addEventListener('input',e=>setSal(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x131016:0xefe7e6);
  scene.fog.color.setHex(dark?0x131016:0xefe7e6);
  groundM.color.setHex(dark?0x1d1920:0xd4c6c6);
  tongueM.color.setHex(dark?0xb3556a:0xc97e8e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 换能:浓度 → 响应(剂量-响应 + 唾液适应)── */
  const T=TAST[taste];
  const dose=cUmol/(cUmol+T.ec50);
  adapt+=(1-adapt)*dts*0.22*(1-dose);
  adapt-=adapt*dts*0.10*(0.35+0.065*saliva)*dose;
  const resp=clamp(adapt*dose,0,1);
  const freq=T.fmax*resp;
  /* 味分子:从口腔落向味孔,入孔即触发细胞闪光 */
  spawnAcc+=dts*26*resp;
  while(spawnAcc>=1){spawnAcc-=1;
    const mm=mols.find(x=>!x.on);
    if(mm){mm.on=true;mm.m.visible=true;
      mm.m.position.set(budX+(Math.random()-0.5)*0.9,2.7+Math.random()*0.9,(Math.random()-0.5)*0.9);
      mm.v=1.5+Math.random()*0.7;}}
  for(const mm of mols){
    if(!mm.on)continue;
    mm.m.position.y-=mm.v*dts;
    mm.m.rotation.y+=dts*2.2;
    if(mm.m.position.y<=1.36){
      mm.on=false;mm.m.visible=false;
      cells[Math.floor(Math.random()*cells.length)].flash=1;
    }
  }
  for(const c of cells){
    c.flash*=Math.exp(-2.6*dts);
    c.cm.emissiveIntensity=0.75*c.flash;
  }
  budShellM.opacity=0.11+0.28*resp;
  /* 动作电位:沿传入神经传出 */
  apAcc+=dts*Math.min(freq,14);
  while(apAcc>=1){apAcc-=1;
    const p=pulses.find(x=>!x.on);
    if(p){p.on=true;p.t=0;p.m.visible=true;}}
  for(const p of pulses){
    if(!p.on)continue;
    p.t+=dts*1.4;
    if(p.t>=1){p.on=false;p.m.visible=false;continue;}
    p.m.position.copy(nerveCurve.getPoint(p.t));
  }
  ring.scale.setScalar(1+0.1*Math.sin(simT*3));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setC(30000);setSal(3);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
