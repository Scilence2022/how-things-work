<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>交通绿波 · 空间在时间里的投影</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#69db7c;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#2f9e44;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="交通绿波" data-en="The Traffic Green Wave">交通绿波</h1>
  <div class="sub" data-zh="把沿线十几个红绿灯按距离排成一张时刻表:车速乘以绿灯偏移等于路口间距,车队就能一路遇绿——绿波带是空间在时间里的投影;速度一偏,波就散架;有了自适应配时,红灯不再是大海捞针 · 拖动旋转 / 空格运行/暂停" data-en="Coordinate a corridor of signals by distance into one timetable: speed × green offset = block spacing, and a platoon rides green for miles — a green wave is space projected into time; drift off the design speed and the wave falls apart; with adaptive timing, red lights stop being a lottery · drag to orbit / Space = run/pause">把沿线十几个红绿灯按距离排成一张时刻表:车速乘以绿灯偏移等于路口间距,车队就能一路遇绿——绿波带是空间在时间里的投影;速度一偏,波就散架;有了自适应配时,红灯不再是大海捞针 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="设计车速" data-en="Design speed">设计车速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="绿波带宽" data-en="Bandwidth">绿波带宽</span><span class="v" id="stBand">—</span>
  <span class="k" data-zh="通过路口" data-en="Greens hit">通过路口</span><span class="v" id="stPass">0/0</span>
  <span class="k" data-zh="平均延误" data-en="Avg delay">平均延误</span><span class="v" id="stDelay">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bWave" data-zh="绿波对时" data-en="Green wave">绿波对时</button>
    <button class="abtn" id="bScramble" data-zh="相位错乱" data-en="Scramble">相位错乱</button>
    <button class="abtn" id="bST" data-zh="时空图" data-en="Time–space">时空图</button>
  </div>
  <div class="row">
    <label data-zh="车速" data-en="Car speed">车速</label>
    <input id="sV" type="range" min="20" max="80" step="5" value="50">
    <span class="val" id="sVVal">50 km/h</span>
  </div>
  <div class="row">
    <label data-zh="信号周期" data-en="Cycle">信号周期</label>
    <input id="sCyc" type="range" min="40" max="120" step="5" value="60">
    <span class="val" id="sCycVal">60 s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglWall" type="checkbox" checked> <span data-zh="时空图墙" data-en="Time–space wall">时空图墙</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../grid-frequency/" data-zh="电网频率" data-en="Grid frequency">电网频率</a>
    <a href="../boids-flocking/" data-zh="鸟群涌现" data-en="Boids flocking">鸟群涌现</a>
    <a href="../shortest-path/" data-zh="最短路径" data-en="Shortest path">最短路径</a>
    <a href="../robot-vacuum/" data-zh="扫地机器人" data-en="Robot vacuum">扫地机器人</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,34,95);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-8.5,8.5,16.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.6,-1);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与干道 ---- */
const m4tmp=new THREE.Matrix4();
function m4make(x,y,z){m4tmp.makeScale(1,1,1);m4tmp.setPosition(x,y,z);}
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const roadM=new THREE.MeshStandardMaterial({color:0x2c313a,roughness:0.9});
const road=new THREE.Mesh(new THREE.BoxGeometry(46,0.08,4.6),roadM);
road.position.y=0.04;scene.add(road);
const crossM=new THREE.MeshStandardMaterial({color:0x252a32,roughness:0.9});
const NJ=6,SP=7,X0=-17.5;
for(let j=0;j<NJ;j++){
  const c=new THREE.Mesh(new THREE.BoxGeometry(4.8,0.06,26),crossM);
  c.position.set(X0+j*SP,0.03,0);scene.add(c);
}
/* 车道虚线 / 斑马线 / 停止线 */
const stripeM=new THREE.MeshStandardMaterial({color:0xd8dde2,roughness:0.8});
const dashes=new THREE.InstancedMesh(new THREE.BoxGeometry(0.75,0.02,0.07),stripeM,27);
for(let i=0;i<27;i++){
  m4make(-(19.5+i*1.5),0.085,0);dashes.setMatrixAt(i,m4tmp);
}
scene.add(dashes);
const zebra=new THREE.InstancedMesh(new THREE.BoxGeometry(0.5,0.03,0.32),stripeM,48);
{let n=0;for(let j=0;j<NJ;j++)for(const sx of[-2.3,2.3])for(let k=0;k<4;k++){
  m4make(X0+j*SP+sx,0.09,-1.2+k*0.8);zebra.setMatrixAt(n++,m4tmp);}}
scene.add(zebra);
const stopM=new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.7});
for(let j=0;j<NJ;j++){
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,1.9),stopM);
  s.position.set(X0+j*SP-1.7,0.09,0.9);scene.add(s);
}
/* 背景楼群:制造纵深 */
const bldM=new THREE.MeshStandardMaterial({color:0x2a323d,roughness:0.9});
for(let i=0;i<12;i++){
  const w=1.2+Math.random()*1.4,hh=1.2+Math.random()*2.6,d=1.2+Math.random()*1.0;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,hh,d),bldM);
  b.position.set(-19+i*3.4+Math.random(),hh/2,-8.5-Math.random()*4.5);
  scene.add(b);
}

/* ---- 信号灯:每路口一组红黄绿发光灯头 ---- */
const lampMats=[];
const lampDefs=[
  [0x40161a,0xff3b3b],[0x4a3410,0xffd43b],[0x14421f,0x51cf66]];
for(let j=0;j<NJ;j++){
  const x=X0+j*SP;
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,2.3,10),
    new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.5,metalness:0.4}));
  pole.position.set(x,1.15,2.5);scene.add(pole);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.56,0.12),
    new THREE.MeshStandardMaterial({color:0x181d24,roughness:0.6}));
  head.position.set(x,2.26,2.44);scene.add(head);
  const mats=lampDefs.map(([c,e])=>new THREE.MeshStandardMaterial({
    color:c,emissive:e,emissiveIntensity:0.15,roughness:0.4}));
  mats.forEach((m,i)=>{
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),m);
    lamp.position.set(x,2.42-i*0.16,2.38);scene.add(lamp);
  });
  lampMats.push(mats);
}

/* ---- 车队:InstancedMesh 小车(车身+车窗) ---- */
const NC=16,CARL=0.62;
const carBody=new THREE.InstancedMesh(new THREE.BoxGeometry(CARL,0.22,0.3),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,metalness:0.15}),NC);
const carCab=new THREE.InstancedMesh(new THREE.BoxGeometry(0.3,0.14,0.26),
  new THREE.MeshStandardMaterial({color:0x18242e,roughness:0.3}),NC);
scene.add(carBody);scene.add(carCab);
carBody.frustumCulled=false;carCab.frustumCulled=false;
const palette=[0xe9ecef,0xffd43b,0x4dabf7,0xff8787,0xb2f2bb,0xd0bfff,0xffa94d,0x63e6be];
const cars=[];
for(let i=0;i<NC;i++){
  cars.push({x:-21+i*2.7-Math.random(),v:0.4,stop:0,hist:[],hAcc:Math.random()*0.35});
  carBody.setColorAt(i,new THREE.Color(palette[i%palette.length]));
}
if(carBody.instanceColor)carBody.instanceColor.needsUpdate=true;

/* ---- 时空图墙:横轴距离、纵轴时间,绿窗+设计波带+车轨迹 ---- */
const wallCv=document.createElement('canvas');wallCv.width=1024;wallCv.height=460;
const wg=wallCv.getContext('2d');
const wallTex=new THREE.CanvasTexture(wallCv);wallTex.colorSpace=THREE.SRGBColorSpace;
const wall=new THREE.Mesh(new THREE.PlaneGeometry(20.4,9.2),
  new THREE.MeshBasicMaterial({map:wallTex,toneMapped:false}));
wall.position.set(0,5.15,-6.2);scene.add(wall);
const wallFrame=new THREE.Mesh(new THREE.BoxGeometry(20.8,9.5,0.18),
  new THREE.MeshStandardMaterial({color:0x1b2027,roughness:0.8}));
wallFrame.position.set(0,5.15,-6.34);scene.add(wallFrame);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let slowMo=false;
const TS=5,GR=0.55,YEL=1.6,LANE_Z=0.9;
const CHAOS=[13,41,5,52,22,34];
let vAct=50,vDes=50,cyc=60,mode='wave';
const offs=new Array(NJ).fill(0);
let passed=0,appr=0,delaySum=0,carsDone=0;
let wallFocus=false,wallAcc=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblWave=addLabel(()=>L('绿波带:对角绿窗','Green wave: the diagonal band'),new THREE.Vector3(0,9.05,-6.2),'g',()=>wall.visible);
const lblRed=addLabel(()=>L('红灯相位','Red phase'),new THREE.Vector3(-3.5,3.05,2.5),'r');
const lblHead=addLabel(()=>L('车队头部','Platoon head'),new THREE.Vector3(-14,0.85,LANE_Z),'y');
const lblST=addLabel(()=>L('时空图:车轨迹 × 绿窗','Time–space: trajectories × green'),new THREE.Vector3(8.8,9.1,-6.2),'b',()=>wall.visible);

/* ---- 信号与配时 ---- */
/* 1 unit = 30 m;km/h → unit/s */
function vU(kmh){return kmh*0.00926;}
function stateAt(j,t){
  const lc=((t-offs[j])%cyc+cyc)%cyc,g=cyc*GR;
  return lc<g?0:(lc<g+YEL?1:2);
}
function calcOffsets(){
  const v=Math.max(0.15,vDes*0.00926);
  for(let j=0;j<NJ;j++)offs[j]=((j*SP)/v)%cyc;
}
function resetCounters(){passed=0;appr=0;delaySum=0;carsDone=0;}
function setV(v){vAct=v;document.getElementById('sV').value=v;
  document.getElementById('sVVal').textContent=v.toFixed(0)+' km/h';}
function setCyc(v){cyc=v;document.getElementById('sCyc').value=v;
  document.getElementById('sCycVal').textContent=v.toFixed(0)+' s';
  if(mode==='wave')calcOffsets();}
function waveLock(){mode='wave';vDes=vAct;calcOffsets();resetCounters();
  document.getElementById('bWave').classList.add('on');
  document.getElementById('bScramble').classList.remove('on');}
function scramble(){mode='chaos';
  for(let j=0;j<NJ;j++)offs[j]=CHAOS[j]%cyc;
  resetCounters();
  document.getElementById('bScramble').classList.add('on');
  document.getElementById('bWave').classList.remove('on');}

/* ---- 时空图绘制 ---- */
function drawWall(){
  const W=1024,H=460,tw=44;
  wg.fillStyle='#0d1117';wg.fillRect(0,0,W,H);
  const px=x=>40+(x+21)/42*(W-80);
  const py=t=>{const u=((simT-t)%tw+tw)%tw/tw;return H-36-u*(H-72);};
  /* 路口竖线与绿/红窗 */
  for(let j=0;j<NJ;j++){
    const X=px(X0+j*SP);
    wg.strokeStyle='#3a4656';wg.lineWidth=2;
    wg.beginPath();wg.moveTo(X,20);wg.lineTo(X,H-30);wg.stroke();
    for(let tt=simT-tw;tt<=simT;tt+=0.4){
      const st=stateAt(j,tt);
      if(st===0){wg.fillStyle='#2f9e44';wg.fillRect(X-3,py(tt)-2,6,7);}
      else if(st===2){wg.fillStyle='rgba(224,49,49,0.5)';wg.fillRect(X-3,py(tt)-2,6,7);}
    }
  }
  /* 设计绿波带:过路口 0 绿心、斜率 = 设计速度 */
  if(mode==='wave'){
    const gC=cyc*GR/2,vd=vU(vDes);
    wg.fillStyle='rgba(105,219,124,0.28)';
    for(let k=-1;k<=2;k++){
      const tc=offs[0]+gC+k*cyc;
      for(let tt=simT-tw;tt<=simT;tt+=0.35){
        const x=X0+vd*(tt-tc);
        if(x<-21||x>21)continue;
        wg.fillRect(px(x)-4,py(tt)-3,8,8);
      }
    }
  }
  /* 车轨迹:斜线即车,撞红灯处变红 */
  wg.lineWidth=2;
  for(const c of cars){
    for(let i=1;i<c.hist.length;i++){
      const a=c.hist[i-1],b=c.hist[i];
      if(a.t<simT-tw||b.t<simT-tw)continue;
      wg.strokeStyle=(a.s||b.s)?'#e03131':'#ffd43b';
      wg.beginPath();wg.moveTo(px(a.x),py(a.t));wg.lineTo(px(b.x),py(b.t));wg.stroke();
    }
  }
  wg.fillStyle='#8a97a8';wg.font='13px sans-serif';
  wg.fillText(L('时间 ↑','time ↑'),14,26);
  wg.fillText(L('距离 →','distance →'),W-100,H-10);
  wallTex.needsUpdate=true;
}

/* ---- 车流:跟驰 + 红灯 ahead 判断 ---- */
function updCars(dtt){
  const vMax=vU(vAct);
  cars.sort((a,b)=>b.x-a.x);
  for(let i=0;i<NC;i++){
    const c=cars[i],px0=c.x;
    let vLim=vMax;
    if(i>0){
      const gap=cars[i-1].x-CARL-0.28-c.x;
      vLim=Math.min(vLim,Math.sqrt(2*2.6*Math.max(0,gap)));
    }
    for(let j=0;j<NJ;j++){
      const sX=X0+j*SP-1.7,dd=sX-c.x;
      if(dd>0.02&&dd<8){
        const tA=dd/Math.max(c.v,0.08);
        const st=stateAt(j,simT+tA);
        if(st===2||(st===1&&dd>c.v*1.1))
          vLim=Math.min(vLim,Math.sqrt(2*3.2*Math.max(0.001,dd-0.06)));
      }
    }
    c.v+=clamp(vLim-c.v,-6*dtt,1.5*dtt);
    if(c.v<0.005&&vLim<0.005)c.v=0;
    c.x+=c.v*dtt;
    if(c.v<0.06)c.stop+=dtt;
    for(let j=0;j<NJ;j++){
      const sX=X0+j*SP-1.7;
      if(px0<sX&&c.x>=sX){appr++;if(stateAt(j,simT)===0)passed++;}
    }
    c.hAcc+=dtt;
    if(c.hAcc>0.35){c.hAcc=0;c.hist.push({t:simT,x:c.x,s:c.v<0.1});
      if(c.hist.length>110)c.hist.shift();}
    if(c.x>21){
      carsDone++;delaySum+=c.stop;c.stop=0;
      let minX=21;for(const o of cars)minX=Math.min(minX,o.x);
      c.x=Math.min(-21.2-Math.random()*3,minX-2.6);c.v=vMax*0.85;c.hist.length=0;
    }
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'一串红绿灯:各自为政的代价',en:'A string of signals, each on its own: the price of no coordination',
  act(){setV(50);setCyc(60);scramble();}},
 {zh:'偏移=距离/车速:把绿灯排成队',en:'Offset = distance / speed: lining up the greens',
  act(){setV(50);waveLock();}},
 {zh:'车队一路遇绿:绿波成形',en:'The platoon rides the green: a wave takes shape',
  act(){setV(50);waveLock();}},
 {zh:'速度一偏:波就追不上',en:'Drift off the design speed and the wave falls apart',
  act(){setV(50);waveLock();setV(35);}},
 {zh:'相位错乱:排队与积压',en:'Scrambled phases: queues and spillback',
  act(){scramble();}},
 {zh:'时空图:绿波是时空里的一条斜带',en:'The time–space diagram: a green wave is a diagonal band',
  act(){document.getElementById('tglWall').checked=true;wall.visible=true;
    if(!wallFocus)document.getElementById('bST').click();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stV').innerHTML=vDes.toFixed(0)+'<small> km/h</small>';
  const dev=Math.abs(vAct-vDes)/Math.max(1,vDes);
  const band=mode==='wave'?Math.max(0,cyc*GR*(1-1.7*dev)):cyc*GR*0.12;
  document.getElementById('stBand').innerHTML=band.toFixed(1)+'<small> s</small>';
  document.getElementById('stPass').textContent=passed+'/'+appr;
  const dEl=document.getElementById('stDelay');
  dEl.innerHTML=carsDone?(delaySum/carsDone).toFixed(1)+'<small> '+(LANG==='en'?'s/car':'s/车')+'</small>':'—';
  dEl.className='v'+(carsDone?(delaySum/carsDone>6?' warn':' ok'):'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bWave').addEventListener('click',waveLock);
document.getElementById('bScramble').addEventListener('click',scramble);
document.getElementById('bST').addEventListener('click',()=>{
  wallFocus=!wallFocus;
  if(wallFocus){document.getElementById('tglWall').checked=true;wall.visible=true;}
  document.getElementById('bST').classList.toggle('on',wallFocus);
});
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sCyc').addEventListener('input',e=>setCyc(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglWall').addEventListener('change',e=>{
  wall.visible=e.target.checked;
  if(!e.target.checked){wallFocus=false;document.getElementById('bST').classList.remove('on');}
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  if(wall.visible)drawWall();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
  drawWall();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const TGT_ROAD=new THREE.Vector3(0,2.6,-1),TGT_WALL=new THREE.Vector3(0,5.2,-4.5);
const tgtCur=TGT_ROAD.clone();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  const dtt=dts*TS;
  simT+=dtt;
  /* 车流推进 */
  updCars(dtt);
  for(let i=0;i<NC;i++){
    const c=cars[i];
    m4make(c.x,0.19,LANE_Z);carBody.setMatrixAt(i,m4tmp);
    m4make(c.x-0.04,0.38,LANE_Z);carCab.setMatrixAt(i,m4tmp);
  }
  carBody.instanceMatrix.needsUpdate=true;carCab.instanceMatrix.needsUpdate=true;
  /* 信号灯发光相位 */
  for(let j=0;j<NJ;j++){
    const st=stateAt(j,simT);
    lampMats[j][0].emissiveIntensity=st===2?2.0:0.15;
    lampMats[j][1].emissiveIntensity=st===1?2.0:0.12;
    lampMats[j][2].emissiveIntensity=st===0?2.0:0.12;
  }
  /* 车队头部标签跟随最前车(钳制在末个路口内,避免冲出画面) */
  let fx=-99;for(const c of cars)fx=Math.max(fx,c.x);
  lblHead.position.set(Math.min(fx,13.2),0.85,LANE_Z);
  /* 时空图重绘(节流) */
  wallAcc+=dt;
  if(wallAcc>0.18){wallAcc=0;if(wall.visible)drawWall();}
  /* 相机在道路视角与时空图视角间平滑切换 */
  tgtCur.lerp(wallFocus?TGT_WALL:TGT_ROAD,Math.min(1,dt*2.5));
  controls.target.copy(tgtCur);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setV(50);setCyc(60);calcOffsets();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
