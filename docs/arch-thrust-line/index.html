<!DOCTYPE html>

<title>拱与推力线 · 撑住石拱的那条隐形力线</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e8b04a;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b07d1e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;

  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="拱与推力线" data-en="The Arch &amp; The Thrust Line">拱与推力线</h1>
  <div class="sub" data-zh="楔块之间只肯传压力,外荷载被一条看不见的推力线一路引到两岸;它必须始终落在拱轴带内,一旦弯出带外,拱就开铰变成机构当场垮塌——把悬链翻上来,正是同一座拱 · 拖动旋转 / 空格运行/暂停" data-en="Voussoirs can only push, never pull: every load rides an invisible line of thrust down to the banks; while it stays inside the arch band the ring is squeezed safe — the moment it bends out, hinges open, the arch becomes a mechanism and falls. Hang the same loads on a chain and flip it: that is this arch · drag to orbit / Space = run/pause">楔块之间只肯传压力,外荷载被一条看不见的推力线一路引到两岸;它必须始终落在拱轴带内,一旦弯出带外,拱就开铰变成机构当场垮塌——把悬链翻上来,正是同一座拱 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,64);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(10.2,5.6,12.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=55;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与桥台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const stoneDarkM=new THREE.MeshStandardMaterial({color:0x4a4640,roughness:0.9});
const abutM=new THREE.MeshStandardMaterial({color:0x6e675c,roughness:0.88});
for(const sx of [-1,1]){
  const ab=new THREE.Mesh(new THREE.BoxGeometry(1.7,4.5,1.9),abutM);
  ab.position.set(sx*4.45,2.25,0);scene.add(ab);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.22,2.1),stoneDarkM);
  cap.position.set(sx*4.45,4.61,0);scene.add(cap);
}

/* ---- 拱的几何与静力学参数 ---- */
/* 半圆拱:R 轴线半径,T 厚度,N 块楔块,SY 起拱线高。推力线 y=M(x)/H:
   简支梁弯矩(块自重+集中荷载)除以推力 H;H 可行区间 [max M/yEx, min M/yIn],
   区间为空 = 线出带 = 三铰机构垮塌(Heyman 刚体极限分析) */
const R=3.6,T=1.0,N=17,SY=4.5,DEPTH=0.9;
const RI=R-T/2,RE=R+T/2,dA=Math.PI/N;
const jx=[],axY=[];
for(let j=0;j<=N;j++){const a=Math.PI*(1-j/N);jx.push(R*Math.cos(a));axY.push(R*Math.sin(a));}
const yEx=x=>Math.sqrt(Math.max(0,RE*RE-x*x));
const yIn=x=>{const v=Math.sqrt(Math.max(0,RI*RI-x*x));return v>0.03?v:0;};
const WB=dA*(RE*RE-RI*RI)/2*DEPTH*2.2*9.81; // 每块自重 kN(密度2.2t/m³)≈12.9
const cx=[],w=[];
for(let i=0;i<N;i++){cx.push(R*Math.cos(Math.PI*(1-(i+0.5)/N)));w.push(WB);}
let Rl0=0;for(let i=0;i<N;i++)Rl0+=WB*(R-cx[i]);Rl0/=2*R;
const M0=[];
for(let j=0;j<=N;j++){const x=jx[j];let m=Rl0*(x+R);
  for(let i=0;i<N;i++)if(cx[i]<=x)m-=WB*(x-cx[i]);M0.push(Math.max(0,m));}
/* P,xP 为当前荷载;struct 返回 {pts,rho,H,occ,jbL,ja,jbR} */
function struct(P,xP){
  const Rl=Rl0+P*(R-xP)/(2*R);
  let Hlo=1e-9,Hhi=1e12,ja=0,jbL=-1,jbR=-1,vL=1e12,vR=1e12;
  const pts=[];
  for(let j=0;j<=N;j++){
    const x=jx[j];let m=Rl*(x+R);
    for(let i=0;i<N;i++)if(cx[i]<=x)m-=WB*(x-cx[i]);
    if(xP<=x)m-=P*(x-xP);
    m=Math.max(0,m);pts.push(m);
    if(m>1e-9){const r=m/yEx(x);if(r>Hlo){Hlo=r;ja=j;}}
    const yi=yIn(x);
    if(yi>0.03){const r=m/yi;
      if(x<0&&r<vL){vL=r;jbL=j;}if(x>=0&&r<vR){vR=r;jbR=j;}
      if(r<Hhi)Hhi=r;}
  }
  const rho=Hlo/Hhi;
  const H=rho<=1?0.5*(Hlo+Hhi):Math.sqrt(Math.max(1e-9,Hlo*Hhi));
  let occ=0; // 线在带内的高度占比:0=内缘,1=外缘,>1=出带
  for(let j=0;j<=N;j++){
    const yi=yIn(jx[j]),ye=yEx(jx[j]);
    if(ye-yi>0.15){const o=(pts[j]/H-yi)/(ye-yi);if(o>occ)occ=o;}
  }
  return {pts,rho,H,occ,jbL,ja,jbR};
}
function Pcrit(xP){let lo=0,hi=4000;
  for(let k=0;k<40;k++){const m=(lo+hi)/2;if(struct(m,xP).rho<1)lo=m;else hi=m;}
  return lo;}

/* ---- 楔块(InstancedMesh) ---- */
const archGroup=new THREE.Group();archGroup.position.set(0,SY,0);scene.add(archGroup);
const secSh=new THREE.Shape();
secSh.absarc(0,0,RI,-dA/2,dA/2,false);
secSh.absarc(0,0,RE,dA/2,-dA/2,true);
const blockGeo=new THREE.ExtrudeGeometry(secSh,{depth:DEPTH,bevelEnabled:true,bevelThickness:0.025,bevelSize:0.025,bevelSegments:1,curveSegments:5});
blockGeo.translate(0,0,-DEPTH/2);
const blockM=new THREE.MeshStandardMaterial({color:0xb8a488,roughness:0.82,metalness:0.05});
const blocks=new THREE.InstancedMesh(blockGeo,blockM,N);
blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
archGroup.add(blocks);
const am=[],M0m=[];
const colTmp=new THREE.Color();
for(let i=0;i<N;i++){
  const a=Math.PI*(1-(i+0.5)/N);am.push(a);
  M0m.push(new THREE.Matrix4().makeRotationZ(a));
  colTmp.setHSL(0.09,0.24,0.55+0.07*Math.sin(i*7.3));
  if(i===(N-1)/2)colTmp.lerp(new THREE.Color(0xe8b04a),0.38); // 拱顶石
  blocks.setColorAt(i,colTmp);
}
blocks.instanceColor.needsUpdate=true;

/* ---- 拱轴虚线 ---- */
const axPts=[];for(let j=0;j<=N;j++)axPts.push(new THREE.Vector3(jx[j],axY[j],0));
const axLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(axPts),
  new THREE.LineDashedMaterial({color:0x93a2b4,dashSize:0.17,gapSize:0.13,transparent:true,opacity:0.5}));
axLine.computeLineDistances();archGroup.add(axLine);

/* ---- 推力线(Tube 重建)+ 镜像悬链 ---- */
const lineMat=new THREE.MeshStandardMaterial({color:0x8ce99a,roughness:0.35,emissive:0x1a3324,emissiveIntensity:0.6});
const lineMesh=new THREE.Mesh(new THREE.BufferGeometry(),lineMat);archGroup.add(lineMesh);
const mirrorG=new THREE.Group();mirrorG.visible=false;archGroup.add(mirrorG);
const mirrorMat=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.3,metalness:0.7});
const mirrorTube=new THREE.Mesh(new THREE.BufferGeometry(),mirrorMat);mirrorG.add(mirrorTube);
const ballGeo=new THREE.SphereGeometry(0.085,10,8);
const mirrorBalls=new THREE.InstancedMesh(ballGeo,mirrorMat,N+1);mirrorG.add(mirrorBalls);
const ZM=2.35;
function buildCurve(pts,sign,z){
  const path=new THREE.CurvePath();
  for(let j=0;j<N;j++)
    path.add(new THREE.LineCurve3(new THREE.Vector3(jx[j],sign*pts[j]/cur.H,z),
      new THREE.Vector3(jx[j+1],sign*pts[j+1]/cur.H,z)));
  return new THREE.TubeGeometry(path,N*4,sign>0?0.055:0.045,8,false);
}
function refreshLine(){
  const g=buildCurve(cur.pts,1,0);
  lineMesh.geometry.dispose();lineMesh.geometry=g;
  if(mirrorG.visible){
    const g2=buildCurve(cur.pts,-1,ZM);
    mirrorTube.geometry.dispose();mirrorTube.geometry=g2;
    const m4=new THREE.Matrix4();
    for(let j=0;j<=N;j++)mirrorBalls.setMatrixAt(j,m4.makeTranslation(jx[j],-cur.pts[j]/cur.H,ZM));
    mirrorBalls.instanceMatrix.needsUpdate=true;
  }
}

/* ---- 塌落粉尘 ---- */
const dustGeo=new THREE.IcosahedronGeometry(0.13,0);
const dustM=new THREE.MeshBasicMaterial({color:0xb9ad98,transparent:true,opacity:0.42,depthWrite:false});
const dust=new THREE.InstancedMesh(dustGeo,dustM,48);
dust.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(dust);
const dustP=[];const m4=new THREE.Matrix4(),qId=new THREE.Quaternion(),v1=new THREE.Vector3(),v2=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
for(let i=0;i<48;i++){dustP.push({life:0,max:1,s:1,p:new THREE.Vector3(),v:new THREE.Vector3()});dust.setMatrixAt(i,m4.makeScale(0,0,0));}
function spawnDust(x,y,z,n){
  let c=0;
  for(let i=0;i<48&&c<n;i++){const d=dustP[i];if(d.life>0)continue;
    d.life=d.max=0.7+Math.random()*0.7;d.s=0.6+Math.random()*1.2;
    d.p.set(x+(Math.random()-0.5)*0.5,y+Math.random()*0.2,z+(Math.random()-0.5)*0.6);
    d.v.set((Math.random()-0.5)*1.4,0.5+Math.random()*1.1,(Math.random()-0.5)*1.4);c++;}
}
function stepDust(dt){
  let any=false;
  for(let i=0;i<48;i++){const d=dustP[i];
    if(d.life>0){any=true;d.life-=dt;d.v.y-=1.1*dt;d.p.addScaledVector(d.v,dt);
      const s=Math.max(0.001,d.s*(d.life/d.max));
      dust.setMatrixAt(i,m4.compose(d.p,qId,v1.set(s,s,s)));
    }else dust.setMatrixAt(i,m4.makeScale(0,0,0));}
  if(any)dust.instanceMatrix.needsUpdate=true;
}
function dustClear(){for(let i=0;i<48;i++)dustP[i].life=0;dust.instanceMatrix.needsUpdate=true;}

/* 垮塌:三铰 → 四段刚片绕铰张开 → 块体散落 */
const fall=new Array(N).fill(null);
function triggerCollapse(){
  if(collapsing||collapsed)return;
  auto=false;demoRamp=null;
  let hs=[cur.jbL,cur.ja,cur.jbR].filter(j=>j>0&&j<N).sort((a,b)=>a-b);
  hs=hs.filter((j,k)=>k===0||j-hs[k-1]>=2);
  if(hs.length<3)hs=[3,N>>1,N-3];
  const bnd=[0,hs[0],hs[1],hs[2],N];
  pieces=[];
  for(let k=0;k<4;k++){
    const h=bnd[k],f=bnd[k+1];
    const p=new THREE.Vector3(jx[h],axY[h],0);
    const fp=v1.set(jx[f],axY[f],0);
    const test=fp.clone().sub(p).applyAxisAngle(v2.set(0,0,1),0.03);
    const dir=test.y<fp.y?1:-1;
    const hasLoad=xP>=jx[bnd[k]]&&xP<=jx[bnd[k+1]];
    pieces.push({i0:bnd[k],i1:bnd[k+1],p,dir,phi:0,hasLoad,
      pre:new THREE.Matrix4().makeTranslation(p.x,p.y,p.z),
      post:new THREE.Matrix4().makeTranslation(-p.x,-p.y,-p.z),
      rot:new THREE.Matrix4()});
  }
  for(let k=0;k<3;k++){hingeDots[k].position.set(jx[hs[k]],axY[hs[k]],0);hingeDots[k].visible=true;}
  collapsing=true;detached=false;colT=0;
  spawnDust(jx[hs[0]],SY+axY[hs[0]],0,8);
  spawnDust(jx[hs[1]],SY+axY[hs[1]],0,8);
  spawnDust(jx[hs[2]],SY+axY[hs[2]],0,8);
}
function detachBlocks(){
  detached=true;lineMesh.visible=false;mirrorG.visible=false;
  const cm=(RI+RE)/2;
  for(let k=0;k<4;k++){const pc=pieces[k];if(!pc)continue;
    const om=pc.dir*3.4*Math.min(0.34,1.7*colT*colT)/(colT+1e-6);
    for(let i=pc.i0;i<pc.i1;i++){
      const bx=cm*Math.cos(am[i]),by=cm*Math.sin(am[i]);
      const ca=Math.cos(pc.phi),sa=Math.sin(pc.phi);
      const rx=bx-pc.p.x,ry=by-pc.p.y;
      const px=pc.p.x+rx*ca-ry*sa,py=pc.p.y+rx*sa+ry*ca;
      fall[i]={px,py,pz:(Math.random()-0.5)*0.1,
        vx:-om*ry+(Math.random()-0.5)*0.7,
        vy:om*rx-(pc.hasLoad?1.5:0.3)-Math.random()*0.4,
        vz:(Math.random()-0.5)*0.6,
        wx:(Math.random()-0.5)*1.4,wy:(Math.random()-0.5)*0.8,
        wz:(Math.random()<0.5?-1:1)*(1.2+Math.random()*1.6),
        q:new THREE.Quaternion().setFromAxisAngle(v2.set(0,0,1),am[i]+pc.phi),
        rest:false,bounce:0};
      if(pc.hasLoad)fall[i].vy-=1.2;
    }
  }
}
function stepCollapse(dts){
  if(!collapsing)return;
  colT+=dts;
  if(!detached){
    for(const pc of pieces){
      pc.phi=pc.dir*Math.min(0.34,1.7*colT*colT);
      pc.rot.makeRotationZ(pc.phi);
      for(let i=pc.i0;i<pc.i1;i++){
        m4.copy(pc.pre).multiply(pc.rot).multiply(pc.post).multiply(M0m[i]);
        blocks.setMatrixAt(i,m4);
      }
    }
    blocks.instanceMatrix.needsUpdate=true;
    if(colT>=1.05)detachBlocks();
    return;
  }
  let allRest=true;
  for(let i=0;i<N;i++){const b=fall[i];if(!b)continue;
    if(!b.rest){
      allRest=false;
      b.vy-=9.2*dts;
      b.px+=b.vx*dts;b.py+=b.vy*dts;b.pz+=b.vz*dts;
      const wl=Math.hypot(b.wx,b.wy,b.wz);
      if(wl>1e-4){v1.set(b.wx/wl,b.wy/wl,b.wz/wl);
        b.q.premultiply(qTmp.setFromAxisAngle(v1,wl*dts));}
      const fl=Math.abs(b.px)>3.55?0.52:-SY+0.52;
      if(b.py<fl&&b.vy<0){
        b.py=fl;b.vy*=-0.3;b.vx*=0.55;b.vz*=0.55;b.wx*=0.5;b.wz*=0.5;b.bounce++;
        if(Math.abs(b.vy)<0.7||b.bounce>3){b.rest=true;b.vy=0;b.vx=0;b.vz=0;b.wx=b.wy=b.wz=0;}
        else if(Math.random()<0.7)spawnDust(b.px,fl+0.2,b.pz,2);
      }
    }
    m4.compose(v1.set(b.px,b.py,b.pz),b.q,one);
    blocks.setMatrixAt(i,m4);
  }
  blocks.instanceMatrix.needsUpdate=true;
  if(allRest){collapsing=false;collapsed=true;
    for(const d of hingeDots)d.visible=false;}
}
const qTmp=new THREE.Quaternion();

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 自动演示:荷载位置漫游,幅值压在安全裕度内 */
  if(auto&&playing&&!collapsing&&!collapsed){
    const xA=1.9*Math.sin(simT*0.4);
    const pA=Math.min(14+12*Math.sin(simT*0.27+1),0.8*Pcrit(xA));
    P=pA;xP=xA;refreshStruct();
  }
  /* 垮塌演示:荷载自动爬升到临界 */
  if(demoRamp!==null&&!collapsing&&!collapsed){
    P+=(demoRamp-P)*Math.min(1,dts*2.0);
    refreshStruct();
    if(cur.rho>=1)triggerCollapse();
  }
  /* 推力线颜色:绿→琥珀→红,临界闪烁 */
  if(!collapsed){
    const r=Math.max(cur.rho,collapsing?1:0);
    let c;
    if(collapsing||r>=0.995)c=colTmp.setHex(0xff4d4d).lerp(new THREE.Color(0xffd0d0),0.5+0.5*Math.sin(simT*14)).getHex();
    else if(r>0.92)c=0xff8787;else if(r>0.8)c=0xe8b04a;else c=0x8ce99a;
    if(lineMat.color.getHex()!==c)lineMat.color.setHex(c);
  }
  /* 荷载箭头跟随 */
  const topY=yEx(clamp(Math.abs(xP),0,RE));
  const Ht=0.6+P/160*1.5;
  loadArr.position.set(xP,topY-0.03,0);
  arrShaft.scale.y=Math.max(0.05,Ht-0.42);arrShaft.position.y=(Ht+0.42)/2;
  arrCone.position.y=0.21;labP.position.set(xP,topY+Ht+0.42,0);
  /* 拱脚推力箭头:长度随 H,系杆接管后隐藏 */
  const hs=clamp(cur.H/70,0.35,2.4);
  hArrL.visible=hArrR.visible=!tieOn&&!collapsed&&!collapsing;
  hArrL.scale.set(1,hs,1);hArrR.scale.set(1,hs,1);
  stepCollapse(dts);
  stepDust(dts);
  loadArr.visible=!collapsed;
  axLine.visible=!collapsed;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
resetArch();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);auto=true;}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
