<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>凝胶电泳与 DNA 指纹 · 小段快跑,条带即指纹</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="凝胶电泳与 DNA 指纹" data-en="Gel Electrophoresis &amp; DNA Fingerprinting">凝胶电泳与 DNA 指纹</h1>
  <div class="sub" data-zh="DNA 骨架上每个磷酸基都带负电,通电即被电场推向正极;凝胶是多孔的分子筛,泳程≈1/长度——短片段钻孔快跑得远、长片段落在近端,长度被排成一列条带;电压调速度(过热会糊带),浓度调孔径与分辨率;左道梯带是已知长度的标尺,条带模式即 DNA 指纹,现场样本与嫌疑 A/B 逐一对照即可锁定 · 拖动旋转 / 空格运行/暂停" data-en="Every phosphate on the DNA backbone is negative, so the field drives fragments straight to the anode; the gel is a porous molecular sieve and run distance ≈ 1/length — short fragments dart far, long ones lag near the wells, sorting sizes into a ladder of bands; voltage sets speed (overheat smears them), concentration sets pore size and resolution; the left lane is a ruler of known lengths, the band pattern is the fingerprint — line the scene sample up against suspects A/B · drag to orbit / Space = run/pause">DNA 骨架上每个磷酸基都带负电,通电即被电场推向正极;凝胶是多孔的分子筛,泳程≈1/长度——短片段钻孔快跑得远、长片段落在近端,长度被排成一列条带;电压调速度(过热会糊带),浓度调孔径与分辨率;左道梯带是已知长度的标尺,条带模式即 DNA 指纹,现场样本与嫌疑 A/B 逐一对照即可锁定 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="电压" data-en="Voltage">电压</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="凝胶浓度" data-en="Gel %">凝胶浓度</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="泳动进度" data-en="Migration">泳动进度</span><span class="v" id="stProg">—</span>

</div>

    <button class="abtn" id="bCmp" data-zh="比对模式" data-en="Compare">比对模式</button>

    <label data-zh="电压" data-en="Voltage">电压</label>
    <input id="sV" type="range" min="20" max="120" step="5" value="70">

      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglUV" type="checkbox" checked> <span data-zh="UV 显影" data-en="UV stain">UV 显影</span></label>
    </div>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pcr/" data-zh="PCR 扩增" data-en="PCR">PCR 扩增</a>

  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(27,innerWidth/innerHeight,0.1,200);
camera.position.set(5.6,5.2,11.7);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.25,0.85,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:电泳槽,泳道沿 X,负极(黑)在左、正极(红)在右 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const WX=-2.45,LZ=[-1.65,-0.99,-0.33,0.33,0.99,1.65],GY=0.78;
const colM=new THREE.MeshStandardMaterial({color:0x2a303a,roughness:0.7});
const base=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.12,5.6),colM);base.position.y=0.06;scene.add(base);
const glassM=new THREE.MeshStandardMaterial({color:0x9fc8e8,transparent:true,opacity:0.12,
  roughness:0.15,metalness:0.1,depthWrite:false});
for(const w of [[7.0,1.62,0.06,0,0.87,2.6],[7.0,1.62,0.06,0,0.87,-2.6],
  [0.06,1.62,5.26,3.47,0.87,0],[0.06,1.62,5.26,-3.47,0.87,0]]){
  const wl=new THREE.Mesh(new THREE.BoxGeometry(w[0],w[1],w[2]),glassM);
  wl.position.set(w[3],w[4],w[5]);scene.add(wl);
}
const bufM=new THREE.MeshStandardMaterial({color:0x2e6f9e,transparent:true,opacity:0.10,depthWrite:false});
const buffer=new THREE.Mesh(new THREE.BoxGeometry(6.9,1.3,5.1),bufM);buffer.position.y=0.92;scene.add(buffer);
const gelM=new THREE.MeshStandardMaterial({color:0xd7e6f5,transparent:true,opacity:0.28,roughness:0.3,depthWrite:false});
const gel=new THREE.Mesh(new THREE.BoxGeometry(5.4,0.3,4.4),gelM);gel.position.set(0,GY,0);scene.add(gel);
/* 凝胶表面网格:孔距随浓度变化 */
const gridM=new THREE.LineBasicMaterial({color:0x6b8aa8,transparent:true,opacity:0.5});
let grid=null;
function buildGrid(){
  if(grid){scene.remove(grid);grid.geometry.dispose();}
  const pore=clamp(0.52/conc,0.26,0.9),pos=[];
  for(let x=-2.7+pore;x<2.7;x+=pore)pos.push(x,0.936,-2.2,x,0.936,2.2);
  for(let z=-2.2+pore;z<2.2;z+=pore)pos.push(-2.7,0.936,z,2.7,0.936,z);
  grid=new THREE.LineSegments(new THREE.BufferGeometry()
    .setAttribute('position',new THREE.Float32BufferAttribute(pos,3)),gridM);
  scene.add(grid);
}
const wellM=new THREE.MeshStandardMaterial({color:0x161c24,roughness:0.6});
for(const z of LZ){
  const w=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.08,0.5),wellM);
  w.position.set(WX,0.94,z);scene.add(w);
}
/* 电极:黑负(左)/红正(右) + 冒泡 */
const negM=new THREE.MeshStandardMaterial({color:0x232830,roughness:0.4,metalness:0.6});
const posM=new THREE.MeshStandardMaterial({color:0xc0392b,roughness:0.4,metalness:0.5,
  emissive:0x661a12,emissiveIntensity:0.35});
for(const [x,m] of [[-3.1,negM],[3.1,posM]]){
  const e=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.8,14),m);
  e.position.set(x,1.42,0);scene.add(e);
  const clip=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.18,0.12),negM);
  clip.position.set(x,2.36,0);scene.add(clip);
}
const powM=new THREE.MeshStandardMaterial({color:0x39404d,roughness:0.5,metalness:0.4});
const pbox=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.66,0.5),powM);
pbox.position.set(0,0.45,-3.75);scene.add(pbox);
const dispM=new THREE.MeshStandardMaterial({color:0x1a1010,roughness:0.3,
  emissive:0xd9822b,emissiveIntensity:0.9});
const disp=new THREE.Mesh(new THREE.PlaneGeometry(0.72,0.26),dispM);
disp.position.set(0,0.56,-3.49);scene.add(disp);
function wire(x){
  const c=new THREE.QuadraticBezierCurve3(new THREE.Vector3(x,2.36,0),
    new THREE.Vector3(x*0.95,2.55,-2.2),new THREE.Vector3(x*0.32,0.95,-3.77));
  return new THREE.Mesh(new THREE.TubeGeometry(c,26,0.028,8),
    new THREE.MeshStandardMaterial({color:x<0?0x22262c:0xb03a2e,roughness:0.5}));
}
scene.add(wire(-3.1),wire(3.1));
const bubGeo=new THREE.SphereGeometry(1,8,6);
const bubM=new THREE.MeshStandardMaterial({color:0xcfe8ff,transparent:true,opacity:0.55,roughness:0.2});
function makeBubbles(x){const arr=[];for(let i=0;i<11;i++){
  const m=new THREE.Mesh(bubGeo,bubM);m.scale.setScalar(0.02+Math.random()*0.03);
  arr.push({m,ph:Math.random(),x:x+(Math.random()-0.5)*0.18,z:(Math.random()-0.5)*0.18});
  scene.add(m);}return arr;}
const bubL=makeBubbles(-3.1),bubR=makeBubbles(3.1);
/* 电场箭头 */
const arrM=new THREE.MeshStandardMaterial({color:0xffb35c,roughness:0.4,emissive:0xffb35c,emissiveIntensity:0.45});
const arrE=new THREE.Group();
const acyl=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.4,8),arrM);
acyl.rotation.z=-Math.PI/2;acyl.position.x=0.7;arrE.add(acyl);
const acon=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.22,10),arrM);
acon.rotation.z=-Math.PI/2;acon.position.x=1.5;arrE.add(acon);
arrE.position.set(-0.7,2.1,0);scene.add(arrE);

/* ── DNA 条带与泳动片段 ── */
const LANES=[
 {zh:'梯带',en:'Ladder',cls:'y',frags:[100,250,500,1000,2000]},
 {zh:'现场样本',en:'Scene',cls:'r',frags:[200,450,800,1500]},
 {zh:'嫌疑 A',en:'Suspect A',cls:'b',frags:[200,450,1200,1800]},
 {zh:'嫌疑 B',en:'Suspect B',cls:'g',frags:[200,450,800,1500]},
 {zh:'短片段 100 bp',en:'Short · 100 bp',cls:'',frags:[100]},
 {zh:'长片段 10 kb',en:'Long · 10 kb',cls:'',frags:[10000]},
];
const bandGeo=new THREE.BoxGeometry(0.14,0.12,0.5);
const bands=[];
LANES.forEach((ln,li)=>{for(const bp of ln.frags){
  const m=new THREE.MeshStandardMaterial({color:0x08243c,transparent:true,opacity:0.92,
    emissive:0x2fa8ff,emissiveIntensity:1.45});
  const b=new THREE.Mesh(bandGeo,m);b.renderOrder=2;
  b.position.set(WX,0.8,LZ[li]);scene.add(b);
  bands.push({bp,lane:li,lz:LZ[li],mesh:b,matched:false,m});
}});
/* 泳动中的小双螺旋 */
const swimM=new THREE.MeshStandardMaterial({color:0x061a2c,roughness:0.3,transparent:true,opacity:0.8,
  emissive:0x54c8ff,emissiveIntensity:1.5});
function helixGeo(ph){
  const pts=[];for(let j=0;j<=20;j++){const t=j/20;
    pts.push(new THREE.Vector3(Math.cos(t*Math.PI*3+ph)*0.045,(t-0.5)*0.22,Math.sin(t*Math.PI*3+ph)*0.045));}
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,0.011,5);
}
const hGeo=[helixGeo(0),helixGeo(Math.PI)];
const swimmers=[];
for(const bd of bands){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(hGeo[0],swimM),new THREE.Mesh(hGeo[1],swimM));
  g.rotation.z=Math.PI/2;g.scale.setScalar(1.1);scene.add(g);
  swimmers.push({g,bd,off:Math.random()*0.55});
}
/* 比对连线:现场样本与 A/B 中 bp 相同的条带 */
const pairs=[];
for(const [si,sl] of [[1,2],[1,3]]){
  for(const a of bands.filter(b=>b.lane===si))
    for(const b of bands.filter(x=>x.lane===sl))
      if(a.bp===b.bp){pairs.push([a,b]);a.matched=b.matched=true;}
}
const lineM=new THREE.LineBasicMaterial({color:0x74dc84,transparent:true,opacity:0.9,depthTest:false});
const cmpLines=new THREE.LineSegments(new THREE.BufferGeometry(),lineM);
cmpLines.renderOrder=10;cmpLines.visible=false;scene.add(cmpLines);
/* UV 灯 */
const uvLight=new THREE.PointLight(0x4a7bff,0.7,7);uvLight.position.set(0,2.4,0);scene.add(uvLight);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('负极(阴极)· DNA 从这里出发','Cathode (−) · DNA departs here'),new THREE.Vector3(-3.1,2.62,0.3),'');
addLabel(()=>L('正极(阳极)','Anode (+)'),new THREE.Vector3(3.1,2.62,0.3),'r');
addLabel(()=>L('电场 E','Field E'),new THREE.Vector3(0.2,2.42,0),'o');
addLabel(()=>L('琼脂糖凝胶 · 分子筛','Agarose gel · molecular sieve'),new THREE.Vector3(0,1.7,-2.45),'g');
addLabel(()=>L('直流电源','DC supply'),new THREE.Vector3(0,1.05,-3.75),'');
LANES.forEach((ln,i)=>{
  if(i<4)addLabel(()=>L(ln.zh,ln.en),new THREE.Vector3(WX,2.12,LZ[i]),ln.cls);
  else{const bd=bands.find(b=>b.lane===i);
    addLabel(()=>L(ln.zh,ln.en),new THREE.Vector3(0,0.42,0),ln.cls,()=>true,bd.mesh);}
});
addLabel(()=>L('现场 ≠ A:两条带对不上','Scene ≠ A: two bands differ'),new THREE.Vector3(-0.4,2.5,-0.33),'r',()=>cmp);
addLabel(()=>L('现场 = B:条带逐一重合','Scene = B: every band aligns'),new THREE.Vector3(-0.4,2.5,0.99),'g',()=>cmp);
for(const bd of bands)if(bd.lane===0)
  addLabel(()=>bd.bp+' bp',new THREE.Vector3(0,0.42,0),'b',()=>activeStep===4,bd.mesh);

/* 状态 */
let volt=70,conc=1.0,cmp=false,uvOn=true,playing=true,labelsOn=true,slowMo=false;
let tCycle=19,prog=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const mob=bp=>1/(1+Math.pow(bp/(1500/Math.pow(conc,1.1)),1.3));
const bandX=bd=>WX+Math.min(4.75,4.35*(volt/70)*mob(bd.bp))*prog;

function setVolt(v){volt=clamp(v,20,120);
  document.getElementById('sV').value=volt;
  document.getElementById('sVVal').textContent=volt.toFixed(0)+' V';updateStats();}
function setConc(v){conc=clamp(v,0.6,2);
  document.getElementById('sC').value=conc;
  document.getElementById('sCVal').textContent=conc.toFixed(1)+' %';
  buildGrid();updateStats();}
function setCmp(v){cmp=v;
  document.getElementById('bLoad').classList.toggle('on',!v);
  document.getElementById('bCmp').classList.toggle('on',v);
  cmpLines.visible=v;
  if(v)prog=1;
  else if(prog>0)tCycle=clamp(prog*clamp(26*70/volt,9,55),0,clamp(26*70/volt,9,55));
  for(const bd of bands){const dim=v&&bd.lane!==1&&bd.lane!==2&&bd.lane!==3;
    bd.mesh.material.opacity=(dim?0.28:1)*(v?0.95:0.9);}
  updateStats();}
function setUV(v){uvOn=v;
  uvLight.intensity=v?0.7:0;
  document.getElementById('tglUV').checked=v;}

const STEPS=[
 {zh:'<b>负电为何跑</b>:DNA 骨架上每个磷酸基都带负电,通电即被电场推向红极(阳极)',
  en:'<b>Why it runs</b>: every backbone phosphate is negative — the field drives DNA to the red anode',
  act(){setCmp(false);setVolt(70);setConc(1.0);}},
 {zh:'<b>凝胶=分子筛</b>:片段不是被“冲”过去,而是在多孔基质里挤孔前行,泳程≈1/长度',
  en:'<b>Gel = molecular sieve</b>: fragments squeeze pore by pore, they are not flushed — run ≈ 1/length',
  act(){setConc(1.2);}},
 {zh:'<b>小快大慢</b>:短片段钻孔快跑得远,长片段落在近端,长度被排成一列',
  en:'<b>Short fast, long slow</b>: little fragments dart far, big ones lag — size sorted into a line',
  act(){setVolt(95);}},
 {zh:'<b>浓度调分辨率</b>:0.6% 孔大、筛大片段;2% 孔小、大片段挤在原地,小片段分得更开',
  en:'<b>Concentration tunes resolution</b>: 0.6% big pores resolve big fragments; 2% tight pores hold them back',
  act(){setConc(2.0);setVolt(70);}},
 {zh:'<b>梯带读长度</b>:左道是 100–2000 bp 已知长度标尺,未知带对照梯带“读出”长度',
  en:'<b>Ladder reads length</b>: the left lane is a 100–2000 bp ruler — line unknown bands up against it',
  act(){setConc(1.0);setVolt(70);}},
 {zh:'<b>现场 vs 嫌疑</b>:条带模式即指纹;现场与 B 四带全对齐,与 A 只有两带相同',
  en:'<b>Scene vs suspects</b>: the band pattern is the fingerprint — all four bands match B, only two match A',
  act(){setCmp(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stV').innerHTML=volt.toFixed(0)+'<small> V</small>';
  const sv=document.getElementById('stV');
  sv.className='v '+(volt>90?'warn':'');
  document.getElementById('stC').innerHTML=conc.toFixed(1)+'<small> %</small>';
  const pv=document.getElementById('stProg');
  pv.innerHTML=(prog*100).toFixed(0)+'<small> %</small>';
  pv.className='v '+(prog>=0.99?'ok':'');
  const mv=document.getElementById('stMatch');
  mv.textContent=cmp?L('匹配 B','Match B'):'—';
  mv.className='v '+(cmp?'ok':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bLoad').addEventListener('click',()=>setCmp(false));
document.getElementById('bCmp').addEventListener('click',()=>setCmp(true));
document.getElementById('sV').addEventListener('input',e=>setVolt(+e.target.value));
document.getElementById('sC').addEventListener('input',e=>setConc(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglUV').addEventListener('change',e=>{setUV(e.target.checked);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const lp=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 泳动:循环跑胶,比对模式快速推进到终点并保持 */
  const T=clamp(26*70/volt,9,55);
  if(cmp){prog=Math.min(1,prog+dts*0.22);}
  else{tCycle+=dts;if(tCycle>T+4.5)tCycle=0;prog=Math.min(1,tCycle/T);}
  let fade=1;
  if(!cmp){if(tCycle>T+4)fade=clamp((T+4.5-tCycle)/0.5,0,1);else if(tCycle<0.4)fade=tCycle/0.4;}
  const smear=volt>90?1+(volt-90)/30*1.6:1;
  bands.forEach((bd,i)=>{
    bd.mesh.position.x=bandX(bd);
    bd.mesh.position.z=bd.lz+Math.sin(simT*6+i)*0.06*(smear-1);
    bd.mesh.scale.x=smear;
    const pulse=0.5+0.5*Math.sin(simT*4);
    let ei=uvOn?1.45:0.2;
    if(bd.matched&&cmp)ei+=uvOn?pulse*0.9:0.05;
    bd.m.emissiveIntensity=ei;
    const dim=cmp&&bd.lane!==1&&bd.lane!==2&&bd.lane!==3;
    bd.m.opacity=(uvOn?0.9:0.45)*(dim?0.3:1)*fade;
  });
  /* 泳动小螺旋:从加样孔流向各自条带 */
  for(const sw of swimmers){
    const u=clamp((prog-sw.off)/0.42,0,1);
    sw.g.visible=prog>0.02&&u>0&&u<1&&fade>0.5;
    const bx=bandX(sw.bd);
    sw.g.position.set(WX+0.25+(bx-WX-0.3)*u,0.8,LZ[sw.bd.lane]+Math.sin(simT*3+sw.off*9)*0.05);
    sw.g.rotation.y=simT*1.6;sw.g.rotation.x=simT*1.1;
  }
  /* 电极冒泡,速度∝电压 */
  const bspd=0.14+volt/120*0.42;
  for(const pool of [bubL,bubR])for(const b of pool){
    b.m.position.set(b.x,0.66+((simT*bspd+b.ph)%1)*0.78,b.z);
    b.m.visible=playing&&volt>1;
  }
  arrE.scale.set(0.4+volt/120*0.8,1,1);
  dispM.emissiveIntensity=0.25+volt/120*1.3;
  posM.emissiveIntensity=0.2+volt/120*0.5;
  /* 比对连线:同步发光的匹配条带两两相连 */
  if(cmp){
    const p=[];
    for(const [a,b] of pairs){p.push(a.mesh.position.x,0.8,a.mesh.position.z,b.mesh.position.x,0.8,b.mesh.position.z);}
    cmpLines.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  }
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setUV(true);setCmp(false);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
