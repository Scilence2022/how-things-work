<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电梯安全钳与限速器 · 越坠越紧</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d64545;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b02525;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(214,69,69,.6);background:rgba(214,69,69,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,37,37,.55);background:rgba(176,37,37,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(214,69,69,.10);border-color:rgba(214,69,69,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,37,37,.08);border-color:rgba(176,37,37,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc9c9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电梯安全钳与限速器" data-en="Elevator Safety Gear &amp; Governor">电梯安全钳与限速器</h1>
  <div class="sub" data-zh="轿厢经钢索带动限速器轮→超速(≥115% 额定)离心飞锤甩出、棘爪扣住轮→提拉钢丝拽起轿厢上的杠杆→安全钳楔块楔进导轨→楔形自锁:越坠越紧(同鼓刹自增力)→渐进式安全钳以 0.2g–1g 摁停轿厢→对重同样有钳、井底缓冲器兜底 · 1852 年奥的斯当众砍绳表演 · 拖动旋转 / 空格运行/暂停" data-en="The car drives the governor sheave through its rope → past 115% of rated speed the centrifugal flyweights fling out and a pawl latches the wheel → the trip cable yanks the car-mounted lever → wedge grippers jam into the guide rails → wedge self-lock: the harder it falls the tighter it grips (same self-servo as drum brakes) → progressive gear holds 0.2g–1g to a stop → the counterweight carries its own gear and pit buffers take the last hit · Otis cut the rope in public, 1852 · drag to orbit / Space = run/pause">轿厢经钢索带动限速器轮→超速(≥115% 额定)离心飞锤甩出、棘爪扣住轮→提拉钢丝拽起轿厢上的杠杆→安全钳楔块楔进导轨→楔形自锁:越坠越紧(同鼓刹自增力)→渐进式安全钳以 0.2g–1g 摁停轿厢→对重同样有钳、井底缓冲器兜底 · 1852 年奥的斯当众砍绳表演 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="轿厢速度" data-en="Car speed">轿厢速度</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="限速器动作点" data-en="Trip point">限速器动作点</span><span class="v" id="stTrip">—</span>
  <span class="k" data-zh="减速度" data-en="Decel">减速度</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="钳块夹紧力" data-en="Clamp force">钳块夹紧力</span><span class="v" id="stF">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRun" data-zh="正常运行" data-en="Normal run">正常运行</button>
    <button class="abtn" id="bOver" data-zh="超速触发" data-en="Overspeed trip">超速触发</button>
    <button class="abtn" id="bBroken" data-zh="断绳坠落" data-en="Rope break">断绳坠落</button>
  </div>
  <div class="row">
    <label data-zh="额定速度" data-en="Rated speed">额定速度</label>
    <input id="sVr" type="range" min="0.5" max="2.5" step="0.05" value="1.0">
    <span class="val" id="sVrVal">1.00 m/s</span>
  </div>
  <div class="row">
    <label data-zh="载重" data-en="Load">载重</label>
    <input id="sLoad" type="range" min="0" max="1600" step="50" value="800">
    <span class="val" id="sLoadVal">800 kg</span>
  </div>
  <div class="row">
    <label data-zh="夹轨减速度" data-en="Clamp decel">夹轨减速度</label>
    <input id="sA" type="range" min="2" max="9" step="0.1" value="6.5">
    <span class="val" id="sAVal">6.5 m/s²</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCw" type="checkbox" checked> <span data-zh="对重系统" data-en="Counterweight">对重系统</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../elevator/" data-zh="电梯驱动" data-en="Elevator Drive">电梯驱动</a>
    <a href="../seatbelt/" data-zh="安全带" data-en="Seatbelt">安全带</a>
    <a href="../centrifugal-clutch/" data-zh="离心离合器" data-en="Centrifugal Clutch">离心离合器</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 电梯安全钳系统:
   限速器由轿厢独立钢索带动,超速(1.15×额定)时离心飞锤甩出→棘爪锁轮→
   提拉机构拽起轿厢两侧楔块楔进导轨;楔形自锁(小楔角:轴向夹紧力
   N≈F_brake/(2·μ_grip)),制动力随载荷增大=越坠越紧;
   渐进式安全钳平均减速度限定在 0.2g–1g(GB 7588 / EN 81-20) */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101216,16,46);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(6.6,1.0,10.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 井道结构 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1a1e24,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-4.62;scene.add(ground);
const frameM=new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.85});
const railM=new THREE.MeshStandardMaterial({color:0x8a96a8,roughness:0.35,metalness:0.7});
const pit=new THREE.Mesh(new THREE.BoxGeometry(5.2,0.12,3.6),frameM);
pit.position.set(0,-4.5,0);scene.add(pit);
const head=new THREE.Mesh(new THREE.BoxGeometry(5.2,0.28,3.6),frameM);
head.position.set(0,4.78,0);scene.add(head);
for(const sx of [-1,1]){
  for(const sz of [-1.5,1.5]){
    const col=new THREE.Mesh(new THREE.BoxGeometry(0.16,9.4,0.16),frameM);
    col.position.set(sx*2.45,0,sz);scene.add(col);
  }
}
for(const sy of [-2.95,2.95]){
  const land=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.1,1.15),frameM);
  land.position.set(0.6,sy,2.0);scene.add(land);
}
/* 导轨 */
for(const sx of [-1,1]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(0.09,9.3,0.14),railM);
  rail.position.set(sx*1.12,0.05,0);scene.add(rail);
}
/* 井底缓冲器:叠环弹簧 */
const bufM=new THREE.MeshStandardMaterial({color:0x4a5462,roughness:0.5,metalness:0.6});
for(let i=0;i<4;i++){
  const t=new THREE.Mesh(new THREE.TorusGeometry(0.30-0.045*i,0.045,10,24),bufM);
  t.rotation.x=Math.PI/2;t.position.set(0,-4.32+i*0.1,-0.5);scene.add(t);
}
const bufCap=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.06,0.5),
  new THREE.MeshStandardMaterial({color:0xd64545,roughness:0.4,emissive:0xd64545,emissiveIntensity:0.25}));
bufCap.position.set(0,-3.9,-0.5);scene.add(bufCap);

/* ── 轿厢 ── */
const carG=new THREE.Group();scene.add(carG);
const carBody=new THREE.MeshStandardMaterial({color:0x5c6675,roughness:0.55,metalness:0.5});
const carGlass=new THREE.MeshStandardMaterial({color:0x9fd4ff,roughness:0.15,metalness:0.4,
  transparent:true,opacity:0.22,side:THREE.DoubleSide,depthWrite:false});
const floor=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.09,1.35),carBody);
floor.position.y=-0.6;carG.add(floor);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.07,1.35),carBody);
roof.position.y=1.08;carG.add(roof);
const backP=new THREE.Mesh(new THREE.BoxGeometry(1.75,1.62,0.05),carBody);
backP.position.set(0,0.24,-0.66);carG.add(backP);
for(const sx of [-1,1]){
  const side=new THREE.Mesh(new THREE.BoxGeometry(0.04,1.6,1.3),carGlass);
  side.position.set(sx*0.87,0.24,0);carG.add(side);
}
const hang=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.08,0.5),carBody);
hang.position.set(0,1.2,0.25);carG.add(hang);
/* 安全钳楔块(两侧) */
const wedgeM=new THREE.MeshStandardMaterial({color:0xb8c2cc,roughness:0.35,metalness:0.75,
  emissive:0xff3300,emissiveIntensity:0});
const wedges=[];
for(const sx of [-1,1]){
  const w=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.3,0.34),wedgeM);
  w.position.set(sx*0.86,0.1,0);carG.add(w);wedges.push(w);
}
/* 提拉杠杆 */
const lever=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.05,0.08),
  new THREE.MeshStandardMaterial({color:0xd64545,roughness:0.4,emissive:0xd64545,emissiveIntensity:0}));
lever.position.set(0,0.98,0.3);carG.add(lever);

/* ── 对重 ── */
const cwG=new THREE.Group();scene.add(cwG);
const cwBlock=new THREE.Mesh(new THREE.BoxGeometry(0.55,1.35,0.32),
  new THREE.MeshStandardMaterial({color:0x454e5a,roughness:0.6,metalness:0.55}));
cwG.add(cwBlock);
for(let i=0;i<3;i++){
  const gap=new THREE.Mesh(new THREE.BoxGeometry(0.57,0.05,0.34),frameM);
  gap.position.y=-0.35+i*0.35;cwG.add(gap);
}

/* ── 机房滑轮 + 限速器 ── */

const sheaveGeo=new THREE.CylinderGeometry(0.36,0.36,0.14,28);sheaveGeo.rotateX(Math.PI/2);

/* 棘爪 + 提拉杆(动作时摆动) */
const pawl=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.26,0.07),

/* ── 钢索 ── */
function makeRope(n,color){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  g.setDrawRange(0,n);
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9}));
  line.frustumCulled=false;scene.add(line);return line;
}
const ropeA=makeRope(3,0xc9ced8),ropeB=makeRope(3,0xc9ced8);
const govRope=makeRope(3,0xd6b02b);
function setRope(line,pts){
  const a=line.geometry.attributes.position.array;
  pts.forEach((p,i)=>{a[i*3]=p[0];a[i*3+1]=p[1];a[i*3+2]=p[2];});
  line.geometry.attributes.position.needsUpdate=true;
}

/* ── 状态 ── */
let mode='run',phase='cruise';
let vRated=1.0,load=800,aClamp=6.5;
let playing=true,labelsOn=true,slowMo=false,cwOn=true;
let carY=-2.2,vC=0,dir=1,holdT=0,wed=0,simT=0,rotSheave=0,rotGov=0,rotTens=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const M_CAR=1500,G=9.81;
const tripV=()=>1.15*vRated;
const mTot=()=>M_CAR+load;
let stat={v:0,a:0,F:0,trip:1.15,wed:0};

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){

  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblCar=addLabel(()=>L(`轿厢 ${stat.v.toFixed(2)} m/s`,`car ${stat.v.toFixed(2)} m/s`),
  new THREE.Vector3(0,1.5,0.4),'b',()=>true,carG);
const lblGov=addLabel(()=>L(`限速器 · 动作 ${stat.trip.toFixed(2)} m/s`,`governor · trip ${stat.trip.toFixed(2)} m/s`),
  new THREE.Vector3(-0.1,0.85,0),'y');
const lblFly=addLabel(()=>L('离心飞锤甩出!','flyweights fling out!'),new THREE.Vector3(-1.75,5.15,0),'r',
  ()=>stat.v>stat.trip*0.86);
const lblWedge=addLabel(()=>stat.wed>0.5?L('楔块楔进导轨 · 自锁','wedges jammed · self-lock'):L('安全钳楔块','safety wedges'),
  new THREE.Vector3(1.55,0.35,0),'r',()=>true,carG);
const lblRail=addLabel(()=>L('导轨','guide rail'),new THREE.Vector3(1.6,0,0.55),'');
const lblCw=addLabel(()=>L(`对重 ${Math.round(M_CAR+0.45*load)} kg`,`counterweight ${Math.round(M_CAR+0.45*load)} kg`),
  new THREE.Vector3(0,-1.05,0),'',()=>cwOn,cwG);
const lblBuf=addLabel(()=>L('井底缓冲器 · 最后兜底','pit buffer · last resort'),new THREE.Vector3(0,-3.65,-0.5),'g');
const lblTrip=addLabel(()=>L('提拉钢丝 · 超速即拽动杠杆','trip cable · yanks the lever on overspeed'),
  new THREE.Vector3(-1.75,2.4,0),'o');

function setVr(vv){vRated=clamp(vv,0.5,2.5);
  document.getElementById('sVr').value=vRated;
  document.getElementById('sVrVal').textContent=vRated.toFixed(2)+' m/s';}
function setLoad(vv){load=clamp(vv,0,1600);
  document.getElementById('sLoad').value=load;
  document.getElementById('sLoadVal').textContent=load.toFixed(0)+' kg';}
function setA(vv){aClamp=clamp(vv,2,9);
  document.getElementById('sA').value=aClamp;
  document.getElementById('sAVal').textContent=aClamp.toFixed(1)+' m/s²';}
function setMode(m){mode=m;
  document.getElementById('bRun').classList.toggle('on',m==='run');
  document.getElementById('bOver').classList.toggle('on',m==='over');
  document.getElementById('bBroken').classList.toggle('on',m==='broken');
  phase='cruise';holdT=0;
  if(m==='broken'){dir=-1;if(Math.abs(vC)<0.3)vC=0;}
}

const STEPS=[
 {b:'正常运行',be:'Normal operation',
  d:'轿厢由曳引钢索吊着走,限速器轮由另一根独立钢索随轿厢同步转动——它随时在"测速",平时飞锤收拢、棘爪悬空。',
  de:'The car rides its hoist ropes while a separate rope spins the governor sheave in sync — it measures speed continuously, flyweights tucked in, pawl clear.',
  act(){setMode('run');setVr(1.0);setLoad(800);}},
 {b:'超速:飞锤甩出',be:'Overspeed: flyweights out',
  d:'速度达到额定的 115%,离心力把飞锤甩出,棘爪卡住限速器轮——一个纯机械、不靠电的判据,断电照样动作。',
  de:'At 115% of rated speed centrifugal force flings the flyweights out and a pawl latches the governor wheel — a purely mechanical criterion that works with the power cut.',
  act(){setMode('over');setVr(1.0);}},
 {b:'提拉机构拽杠杆',be:'Trip linkage pulls the lever',
  d:'限速器轮一锁死,钢丝绳相对轿厢反向抽动,把轿厢顶上的提拉杠杆拽起来——力学信号从"测速"传递到"执行"。',
  de:'With the governor latched, its rope drags against the car and lifts the trip lever on the roof — a mechanical hand-off from sensing to actuation.',
  act(){setMode('over');setA(6.5);}},
 {b:'楔块楔进导轨',be:'Wedges bite the rails',
  d:'杠杆把两侧楔块顶进导轨与钳座之间的楔形槽:楔角小到摩擦自锁,轿厢越往下坠,楔块被拽得越紧——和鼓刹自增力同族。',
  de:'The lever drives wedges into tapered slots between rails and seats: the wedge angle is inside the friction self-lock limit, so the harder the car drops the tighter they jam — kin of the drum brake servo.',
  act(){setMode('over');setA(8.5);}},
 {b:'渐进式制动 0.2g–1g',be:'Progressive braking 0.2g–1g',
  d:'瞬时夹死会伤人,渐进式安全钳靠楔块刮削导轨消耗动能,把平均减速度限定在 0.2g–1g 之间——安全标准(GB 7588)的红线。',
  de:'An instant bite would hurt people; progressive gear bleeds kinetic energy by scraping the rails, holding mean deceleration between 0.2g and 1g — the red line of EN 81 / GB 7588.',
  act(){setMode('over');setA(6.0);setLoad(1200);}},
 {b:'断绳坠落照样救',be:'Saves even a rope break',
  d:'全部曳引索断裂,轿厢自由下坠;但限速器有自己的独立钢索,轿厢照样超速、照样触发——这正是 1852 年奥的斯当众砍绳演示的底气。',
  de:'If every hoist rope snaps the car free-falls — but the governor runs on its own rope, so it still sees overspeed and still trips. That is what Otis demonstrated by cutting the rope in public, 1852.',
  act(){setMode('broken');}},
 {b:'对重与缓冲器兜底',be:'Counterweight and buffers',
  d:'对重也装安全钳防其超速坠落;万一轿厢冲底,井底油压/弹簧缓冲器吸收最后的动能——三层防线,层层独立。',
  de:'The counterweight carries its own gear against overspeed; if the car ever over-travels the pit, oil or spring buffers absorb the final blow — three independent lines of defense.',
  act(){setMode('run');setVr(1.6);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const vv=document.getElementById('stV');
  vv.innerHTML=stat.v.toFixed(2)+'<small> m/s</small>';
  vv.className='v '+(stat.v>stat.trip?'warn':'');
  const tv=document.getElementById('stTrip');
  tv.innerHTML=stat.trip.toFixed(2)+'<small> m/s</small>';
  tv.className='v ok';
  const av=document.getElementById('stA');
  av.innerHTML=(stat.a>0?stat.a.toFixed(1):'0.0')+'<small> m/s²</small>';
  av.className='v '+(stat.a>9.0?'warn':stat.a>0.1?'ok':'');
  const fv=document.getElementById('stF');
  fv.innerHTML=stat.F.toFixed(0)+'<small> kN</small>';
  fv.className='v '+(stat.wed>0.5?'warn':'');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRun').addEventListener('click',()=>setMode('run'));
document.getElementById('bOver').addEventListener('click',()=>setMode('over'));
document.getElementById('bBroken').addEventListener('click',()=>setMode('broken'));
document.getElementById('sVr').addEventListener('input',e=>setVr(+e.target.value));
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sA').addEventListener('input',e=>setA(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCw').addEventListener('change',e=>{cwOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101216:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101216:0xe9e4dc);
  groundM.color.setHex(dark?0x1a1e24:0xcfc8bb);
  frameM.color.setHex(dark?0x2a2f38:0x9aa2ad);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 状态机 ── */
  let aNow=0;
  if(phase==='cruise'){
    if(mode==='run'){
      vC+=(vRated*dir-vC)*Math.min(1,2.0*dts);
    }else if(mode==='over'){
      vC+=(vRated*1.7*dir-vC)*Math.min(1,1.4*dts);
      if(Math.abs(vC)>=tripV()){phase='clamped';}
    }else{ /* broken: 自由坠落 */
      vC-=G*dts;
      aNow=G;
      if(-vC>=tripV())phase='clamped';
    }
    carY+=vC*dts;
    if(carY>3.1){carY=3.1;dir=-1;}
    if(carY<-3.1){carY=-3.1;dir=1;}
  }else if(phase==='clamped'){
    const s=Math.sign(vC);
    vC-=s*aClamp*dts;
    if(s>0&&vC<0||s<0&&vC>0)vC=0;
    carY+=vC*dts;
    if(carY<-3.35){carY=-3.35;if(vC<0)vC=0;}
    if(carY>3.35){carY=3.35;if(vC>0)vC=0;}
    aNow=Math.abs(vC)>0.01?aClamp:0;
    if(Math.abs(vC)<0.02){vC=0;phase='hold';holdT=0;}
  }else{ /* hold */
    holdT+=dts;
    if(holdT>2.2){
      setMode('run');phase='cruise';
      dir=carY>0?-1:1;
    }
  }
  wed+=(((phase==='clamped'||phase==='hold')?1:0)-wed)*Math.min(1,9*dts);
  /* ── 可视化 ── */
  carG.position.y=carY;
  cwG.position.set(0,-carY,-1.5);
  cwG.visible=cwOn;
  ropeA.visible=ropeB.visible=cwOn&&(mode!=='broken');
  wedges.forEach((w,i)=>{
    const sx=i===0?-1:1;
    w.position.x=sx*(0.86+0.17*wed);
    w.position.y=0.1+0.12*wed;
  });
  wedgeM.emissiveIntensity=0.75*wed;
  lever.position.y=0.98+0.1*wed;
  lever.material.emissiveIntensity=0.1+0.7*wed;
  const sv=clamp((Math.abs(vC)/tripV()-0.55)/0.6,0,1);
  const swing=0.12+0.85*sv;
  flyL.rotation.z=-swing;flyR.rotation.z=swing;
  flyM.emissiveIntensity=0.15+0.9*sv;
  pawl.position.y=-0.2+0.16*(phase!=='cruise'||sv>0.95?1:0);
  rotSheave+=vC/0.36*dts;sheave.rotation.z=-rotSheave;
  rotGov+=Math.abs(vC)/0.42*dts;govWheel.rotation.z=rotGov;
  rotTens+=Math.abs(vC)/0.18*dts;tens.rotation.z=-rotTens;
  tripArm.rotation.z=(phase!=='cruise'?0.35:0.05*Math.sin(simT*2));
  /* 钢索 */
  setRope(ropeA,[[-0.55,carY+1.16,0.25],[0,4.62,-0.75+0.36],[0.55,-carY+0.65,-1.5]]);
  setRope(ropeB,[[0.55,carY+1.16,0.25],[0,4.62,-0.75-0.36],[-0.55,-carY+0.65,-1.5]]);
  setRope(govRope,[[-0.92,carY+0.35,0],[-1.33,4.3,0],[-1.75,-4.02,0]]);
  /* 夹紧力:F_brake=m(g+a);楔形自锁 N=F/(2·μ_grip),μ_grip≈0.35 */
  const engaged=wed>0.5;
  const F=engaged?mTot()*(G+aClamp)/(2*0.35)/1000:0;
  stat={v:Math.abs(vC),a:aNow,F,trip:tripV(),wed};
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
