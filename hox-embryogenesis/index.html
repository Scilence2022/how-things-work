<title>胚胎发育与 Hox 基因 · 身体地图的绘制</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);

    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  #app{position:fixed;inset:0}#app canvas{display:block}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .abtn.ko{flex:0 0 auto;padding:4px 8px;font-size:11px}
  .abtn.ko.off{border-color:rgba(255,107,107,.7);background:rgba(255,107,107,.14);color:#ffc2c2;
    text-decoration:line-through}
  :root[data-theme="light"] .abtn.ko.off{color:#c92a2a}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="胚胎发育与 Hox 基因 · 身体地图的绘制" data-en="Hox Genes & the Body Plan · Drawing the Embryo Map">胚胎发育与 Hox 基因 · 身体地图的绘制</h1>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 发育生物学注脚（真实机制）：
   - Hox 共线性（collinearity）：基因簇在染色体上的 3'→5' 排列顺序 = 沿身体前后轴
     前→后的表达域顺序，果蝇 8 基因（lab,pbx,Dfd,Scr,Antp,Ubx,abd-A,Abd-B），
     脊椎动物 13 个 paralog 组（Hox1–13，A/B/C/D 四簇）。
   - 形态素梯度：分泌中心产生指数衰减浓度 C(x)=C₀·e^(−x/λ)（如 Shh、BMP、FGF/Wnt），
     细胞按“浓度越过哪个阈值”开关对应 Hox 基因 → 每个体节获得前后轴坐标。
   - 后部显性（posterior prevalence）：更靠后的 Hox 基因覆盖更前的指令，体节身份=最高表达者。
   - 边界挪一格→整节器官错位：Antp 在头部异位表达 = 触角足（腿长在头上）；
     Ubx 失活 = 第三胸节变第二胸节（本该长平衡棒的节长出第二对翅）。
   - 与图灵斑图互补：反应扩散出“花纹”（重复单元），梯度+开关基因出“器官”（身份标记）。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1218,30,80);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0,7,18);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=50;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,0.95);key.position.set(5,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 常量 ---- */
const NSEG=10,LAMBDA=2.5,DEF_C0=6;
const SEGW=1.06,segX=i=>-5.5+i*(SEGW+0.06);
const PAL=[0xff8787,0xffa94d,0xffd43b,0xa9e34b,0x69db7c,0x66d9e8,0x74c0fc,0xb197fc,
  0xe599f7,0xf783ac,0xffc9c9,0xd0bfff,0x96f2d7];
const MODES={
  fly:{genes:['lab','pbx','Dfd','Scr','Antp','Ubx','abd-A','Abd-B'],
       th:[4.2,3.4,2.7,2.1,1.6,1.2,0.9,0.65]},
  vert:{genes:['Hox1','Hox2','Hox3','Hox4','Hox5','Hox6','Hox7','Hox8','Hox9','Hox10','Hox11','Hox12','Hox13'],
       th:[4.6,4.0,3.5,3.0,2.6,2.2,1.85,1.55,1.3,1.1,0.92,0.78,0.65]},
};
let mode='fly',C0=6,shift=0;
const ko={}; // 基因名 → true=敲除

/* ---- 胚胎体节 ---- */
const segM=new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.5});
const segMeshes=[];
const embryo=new THREE.Group();scene.add(embryo);
for(let i=0;i<NSEG;i++){
  const g=new THREE.Group();g.position.set(segX(i),0,0);embryo.add(g);
  const box=new THREE.Mesh(new THREE.BoxGeometry(SEGW,1.3,1.3),segM.clone());
  g.add(box);
  /* 附肢组：触角(上/前)、腿(下)、翅(上)、平衡棒、肢芽 */
  const app={};
  const cone=new THREE.ConeGeometry(0.09,1.6,8);
  app.ant=[-1,1].map(s=>{
    const m=new THREE.Mesh(cone,segM.clone());
    m.position.set(-0.15,s*0.28,0);m.rotation.z=s*0.6;g.add(m);return m;});
  const legC=new THREE.ConeGeometry(0.14,0.8,8);
  app.leg=[-1,1].map(s=>{
    const m=new THREE.Mesh(legC,segM.clone());
    m.position.set(0,-0.95,s*0.5);m.rotation.x=Math.PI;g.add(m);return m;});
  const wingG=new THREE.BoxGeometry(0.1,1.1,0.55);
  app.wing=[-1,1].map(s=>{
    const m=new THREE.Mesh(wingG,segM.clone());
    m.position.set(0,1.0,s*0.55);m.rotation.x=s*0.5;g.add(m);return m;});
  const haltC=new THREE.SphereGeometry(0.12,8,6);
  app.halt=[-1,1].map(s=>{
    const m=new THREE.Mesh(haltC,segM.clone());
    m.position.set(0,0.9,s*0.7);g.add(m);return m;});
  const budG=new THREE.SphereGeometry(0.32,10,8);
  app.bud=[-1,1].map(s=>{
    const m=new THREE.Mesh(budG,segM.clone());
    m.scale.set(1.4,0.8,0.8);m.position.set(0,-0.9,s*0.6);g.add(m);return m;});
  /* 底座标线 */
  segMeshes.push({grp:g,box,app,idx:i});
}
function setAppendages(rec,mode,id){
  const fly=mode==='fly';
  const a=rec.app;
  const want={
    ant: fly&&(id>=0&&id<=1),
    leg: fly&&(id>=2&&id<=5),
    wing: fly&&id===4,
    halt: fly&&id===5,
    bud: !fly&&(id>=4&&id<=6),
  };
  a.ant.forEach(m=>m.visible=want.ant);
  a.leg.forEach(m=>m.visible=want.leg);
  a.wing.forEach(m=>m.visible=!!want.wing);
  a.halt.forEach(m=>m.visible=!!want.halt);
  a.bud.forEach(m=>m.visible=!!want.bud);
}

/* ---- 染色体 Hox 簇（上）+ 共线性连线 ---- */
const chromY=5.6;
const chromBar=new THREE.Mesh(new THREE.BoxGeometry(13,0.24,0.3),
  new THREE.MeshStandardMaterial({color:0x55637a,roughness:0.45,metalness:0.4}));
chromBar.position.set(0,chromY,0);scene.add(chromBar);
const beads=[],links=[];
const beadGeo=new THREE.SphereGeometry(0.3,14,10);
for(let i=0;i<13;i++){
  const b=new THREE.Mesh(beadGeo,new THREE.MeshStandardMaterial({color:PAL[i],emissive:PAL[i],emissiveIntensity:0.25,roughness:0.35}));
  b.visible=false;b.position.set(-5.8+i*1.0,chromY,0);scene.add(b);beads.push(b);
  const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const ln=new THREE.Line(lg,new THREE.LineBasicMaterial({color:PAL[i],transparent:true,opacity:0.45}));
  ln.visible=false;scene.add(ln);links.push(ln);
}

/* ---- 梯度可视化：每节上方的透明柱（高度 ∝ C(x)） ---- */
const gradBars=[];
for(let i=0;i<NSEG;i++){
  const bar=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.5),
    new THREE.MeshStandardMaterial({color:0xffc078,transparent:true,opacity:0.4,emissive:0xe8590c,emissiveIntensity:0.25}));
  bar.position.set(segX(i),2.0,0);scene.add(bar);gradBars.push(bar);
}

/* ---- 状态 ---- */
let simT=0,playing=true,probe=0;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';

/* ---- 核心模型：阈值→边界→身份 ---- */
/* C(x)=C₀·e^(−x/λ)，基因 i 在 C(x)≤θ_i 处表达 → 边界 b_i=λ·ln(C₀/θ_i) */
function boundaries(){
  const {genes,th}=MODES[mode];
  return th.map((t,i)=>{
    let b=Math.ceil(LAMBDA*Math.log(C0/t));
    if(i===4)b=Math.max(0,b+shift); // Antp 边界可平移
    return clamp(b,0,NSEG);
  });
}
function identities(){
  const {genes,th}=MODES[mode];
  const bs=boundaries();
  const ids=[];
  for(let s=0;s<NSEG;s++){
    let id=-1;
    for(let i=0;i<genes.length;i++){
      if(ko[genes[i]])continue;           // 敲除 → 该基因沉默
      if(bs[i]<=s)id=i;                   // 后部显性：取最高表达者
    }
    ids.push(id);
  }
  return ids;
}
const DEF_ID=(()=>{ // 基准身份（C₀=6、无敲除、无平移）用于数畸变
  const save={C0,shift};
  C0=DEF_C0;shift=0;
  const saveKo={...ko};Object.keys(ko).forEach(k=>delete ko[k]);
  const ids=identities();
  C0=save.C0;shift=save.shift;Object.assign(ko,saveKo);
  return ids;
})();

/* ---- 场景刷新 ---- */
function refresh(){
  const {genes}=MODES[mode];
  const bs=boundaries(),ids=identities();
  /* 体节着色与附肢（发光强度交给主循环做“点亮浪”） */
  let abn=0;
  for(let s=0;s<NSEG;s++){
    const rec=segMeshes[s],id=ids[s];
    const col=id<0?0xc9d4df:PAL[id];
    rec.box.material.color.setHex(col);
    rec.box.material.emissive.setHex(col);
    setAppendages(rec,mode,id);
    if(id!==DEF_ID[s])abn++;
  }
  /* 染色体珠与共线性连线 */
  for(let i=0;i<beads.length;i++){
    const on=i<genes.length;
    beads[i].visible=on;links[i].visible=on;
    if(!on)continue;
    beads[i].scale.setScalar(ko[genes[i]]?0.7:1);
    const b=bs[i];
    const p1=beads[i].position,p2=new THREE.Vector3(segX(Math.min(b,NSEG-1))+0.55,-1.2,0);
    links[i].geometry.setFromPoints([p1,p2]);
    links[i].material.opacity=ko[genes[i]]?0.1:(probe>=b?0.85:0.35);
  }
  /* 梯度柱 */
  for(let s=0;s<NSEG;s++){
    const c=C0*Math.exp(-s/LAMBDA);
    gradBars[s].scale.y=Math.max(0.05,c*0.5);
    gradBars[s].position.y=1.15+gradBars[s].scale.y/2;
  }
  /* 统计 */
  document.getElementById('stC0').innerHTML=C0.toFixed(1)+'<small> a.u.</small>';
  const pid=ids[probe];
  document.getElementById('stProbe').innerHTML=pid<0
    ?'<small>'+(LANG==='en'?'head default':'头部默认')+'</small>'
    :`<small style="font-size:11px">${genes[pid]}</small>`;
  document.getElementById('stB').textContent='x≥'+bs[4];
  document.getElementById('stAbn').textContent=abn+' / '+NSEG;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('Hox 基因簇：排列顺序 = 表达顺序（共线性）','Hox cluster: order on DNA = order on body (collinearity)'),
  new THREE.Vector3(0,chromY+0.9,0),'b');
addLabel(()=>L('形态素梯度 C(x)=C₀·e^(−x/λ)','Morphogen C(x)=C₀·e^(−x/λ)'),new THREE.Vector3(0,4.2,0),'o');
addLabel(()=>L('前 A → 后 P','Anterior → Posterior'),new THREE.Vector3(-6.6,0.4,0),'b');
addLabel(()=>L('触角足！腿长在头上','Antennapedia! Legs on the head'),new THREE.Vector3(segX(0),2.6,0),'r',
  ()=>segMeshes[0].app.leg[0].visible);
addLabel(()=>L('第二对翅（Ubx 失活）','Second wing pair (Ubx off)'),new THREE.Vector3(segX(5),3.0,0),'o',
  ()=>ko[MODES.fly.genes[5]]&&mode==='fly');

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0e1218:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0e1218:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildKO();buildSteps();refresh();
}

/* ---- 敲除按钮行 ---- */
function buildKO(){
  const row=document.getElementById('koRow');row.innerHTML='';
  MODES[mode].genes.forEach(g=>{
    const b=document.createElement('button');
    b.className='abtn ko'+(ko[g]?' off':'');
    b.textContent=g;b.title=LANG==='en'?'click to knock out':'点击敲除/恢复';
    b.addEventListener('click',()=>{ko[g]=!ko[g];b.classList.toggle('off',ko[g]);refresh();});
    row.appendChild(b);
  });
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'形态素梯度：分泌中心 C(x)=C₀·e^(−x/λ)，给每个细胞前后轴“经度”',en:'Morphogen gradient C(x)=C₀·e^(−x/λ) gives each cell an A-P longitude',
   go(){C0=6;shift=0;Object.keys(ko).forEach(k=>delete ko[k]);syncSliders();}},
  {zh:'Hox 共线性：染色体上 3\'→5\' 的排列顺序 = 沿身体前→后的表达顺序',en:'Collinearity: 3\'→5\' order on the chromosome = anterior→posterior expression',
   go(){C0=6;shift=0;syncSliders();}},
  {zh:'认领身份：浓度越过阈值 θ_i → 基因开；体节按最高表达的 Hox 取色/长附肢',en:'Identity: crossing threshold θ_i switches a gene on; the top active Hox colors the segment',
   go(){C0=6;shift=0;Object.keys(ko).forEach(k=>delete ko[k]);syncSliders();}},
  {zh:'后部显性：更靠后的 Hox 覆盖更前的指令；敲掉 Ubx→多出第二对翅',en:'Posterior prevalence: later Hox override earlier; knock out Ubx → an extra wing pair',
   go(){C0=6;shift=0;ko[MODES.fly.genes[5]]=true;if(mode!=='fly')toggleMode();syncSliders();}},
  {zh:'触角足：Antp 边界平移到头部 → 头部体节按 Antp 编码长出腿',en:'Antennapedia: shift the Antp boundary to the head → the head grows legs',
   go(){C0=6;shift=-4;Object.keys(ko).forEach(k=>delete ko[k]);syncSliders();}},
  {zh:'与图灵斑图互补：反应扩散出“花纹”，梯度+开关基因出“器官”',en:'Complement of Turing patterns: reaction-diffusion makes texture, gradients+switches make organs',
   go(){C0=9;shift=0;Object.keys(ko).forEach(k=>delete ko[k]);syncSliders();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();refresh();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncSliders(){
  document.getElementById('sC0').value=C0;
  document.getElementById('sC0Val').textContent=C0.toFixed(1);
  document.getElementById('sShift').value=shift;
  document.getElementById('sShiftVal').textContent=shift;
}

/* ---- 按钮/滑块 ---- */
function toggleMode(){
  mode=mode==='fly'?'vert':'fly';
  document.getElementById('btnMode').textContent=mode==='fly'
    ?L('切换：果蝇 → 脊椎动物','Switch: fly → vertebrate')
    :L('切换：脊椎动物 → 果蝇','Switch: vertebrate → fly');
  buildKO();refresh();
}
document.getElementById('btnMode').addEventListener('click',toggleMode);
document.getElementById('btnAntp').addEventListener('click',()=>{
  shift=shift===0?-4:0;syncSliders();refresh();
});
document.getElementById('btnReset').addEventListener('click',()=>{
  C0=6;shift=0;Object.keys(ko).forEach(k=>delete ko[k]);
  syncSliders();refresh();
});
document.getElementById('sC0').addEventListener('input',e=>{
  C0=+e.target.value;document.getElementById('sC0Val').textContent=C0.toFixed(1);refresh();
});
document.getElementById('sShift').addEventListener('input',e=>{
  shift=+e.target.value;document.getElementById('sShiftVal').textContent=shift;refresh();
});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 点选体节探针 ---- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(segMeshes.map(r=>r.box));
  if(hits.length){probe=hits[0].object.parent.userData.idx??segMeshes.findIndex(r=>r.box===hits[0].object);refresh();}
});
segMeshes.forEach(r=>r.grp.userData.idx=r.idx);

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    simT+=dt;
    /* 招牌点亮浪：Hox 簇沿染色体依次发光，同色沿胚胎前后轴铺开 */
    const genes=MODES[mode].genes;
    beads.forEach((b,i)=>{
      if(!b.visible)return;
      b.rotation.y+=dt*0.6;
      const base=ko[genes[i]]?0.02:0.45;
      b.material.emissiveIntensity=base+0.55*Math.max(0,Math.sin(simT*2.2-i*0.55));
    });
    segMeshes.forEach((r,s)=>{
      r.box.material.emissiveIntensity=(s===probe?0.5:0.12)
        +0.4*Math.max(0,Math.sin(simT*2.2-s*0.55));
    });
  }
  embryo.position.y=Math.sin(simT*0.7)*0.04;
  acc+=dt;if(acc>0.15){acc=0;refresh();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
syncSliders();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildKO();start();
</script>
</body>
